name: seo
# Rebuilds static item pages + sitemap/llms, then pings search indexes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
concurrency:
  group: seo-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全历史。NC（首页「最新」tab）按章节 .py 文件的首次 commit
          # 时间排序，而 checkout 默认 fetch-depth:1 只有一个 commit——
          # 于是每个文件拿到同一个时间戳，排序退化成文件名字母序，
          # 「最新」实际展示的是「字母序前 40 篇」。2026-08-31 发现并修复。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore geo_kit if truncated
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          p = Path("seo/geo_kit.py")
          t = p.read_text(encoding="utf-8") if p.exists() else ""
          if "def build(" not in t or "def item_page(" not in t:
              url = "https://raw.githubusercontent.com/woowoeth/woowoeth.github.io/7b7cb5101e57755ff2f173acd8688e9218cec9ad/seo/geo_kit.py"
              urllib.request.urlretrieve(url, p)
              print("restored geo_kit from 7b7cb51", p.stat().st_size)
          else:
              print("geo_kit intact", len(t))
          PY
      - name: Build — the one chain (scripts/build_all.py)
        # 构建链只有一份，就是 scripts/build_all.py。
        #
        # 这里原来是手抄的八步。本地 build_all.py 后来长到十四步（首页数据装回 /
        # 挂件繁体文案 / PWA / 多语言互链 / 首页数据外置 / 资源版本盖章），
        # 这份手抄的一步都没跟上 —— CI 从 2026-09-04 起**连续红了十九天、四十次**，
        # 而没有任何人发现：GitHub Pages 直接从提交部署，CI 红不红都不拦上线，
        # 于是「CI 会兜底再跑一遍闸」和「CI 会通知搜索引擎」这两件事十九天都不存在。
        # 干净 checkout 上跑 build_all.py 验过：产物和提交逐字节一致，站点闸全绿。
        # 以后加构建步骤只改 build_all.py，这里不用动；check_integrity 盯着这一条。
        run: |
          pip install -q "opencc==1.4.2"
          python scripts/build_all.py
      # 原来这里只跑三道（问题内容 / 处境覆盖 / 完整性），另外五道从没在 CI 上跑过，
      # 门禁自检更是一次都没跑。改成走统一入口，八道 + 自检一起。
      # --full 那一档是唯一能回答「这些闸还活着吗」的东西：
      # 它给每条失败分支注入一个该被抓到的缺陷，注入后必须返回 1，
      # 而且必须报出这条分支自己的理由。见 FAILURES.md。
      - name: Gates + selftest
        run: |
          pip install -q pillow pyzbar 2>/dev/null || true
          sudo apt-get install -y -qq libzbar0 2>/dev/null || true
          python scripts/gate.py --full
      - name: Refuse to publish a broken page
        run: |
          if grep -rInE '^(<{7}|={7}|>{7}) ' --include='*.html' . ; then
            echo "::error::merge-conflict markers in HTML"; exit 1
          fi
          for f in $(git ls-files '*.html'); do
            n=$(grep -o 'rel="canonical"' "$f" | wc -l)
            if [ "$n" -gt 1 ]; then echo "::error::$f has $n canonical tags"; exit 1; fi
          done
          echo "html looks sane"
      - name: Commit if anything changed
        run: |
          git config user.name "ourword-ai"
          git config user.email "ops@ourword.ai"
          git add -A
          if git diff --cached --quiet; then echo "seo unchanged"; exit 0; fi
          git commit -m "seo: refresh crawlable layer"
          for i in $(seq 1 6); do
            git fetch -q origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push; then echo pushed; exit 0; fi
            else
              git rebase --abort || true
              git reset --hard "origin/${GITHUB_REF_NAME}"
              python - <<'PY'
          from pathlib import Path
          import urllib.request
          p = Path("seo/geo_kit.py")
          t = p.read_text(encoding="utf-8") if p.exists() else ""
          if "def build(" not in t or "def item_page(" not in t:
              url = "https://raw.githubusercontent.com/woowoeth/woowoeth.github.io/7b7cb5101e57755ff2f173acd8688e9218cec9ad/seo/geo_kit.py"
              urllib.request.urlretrieve(url, p)
          PY
              python scripts/build_all.py
              git add -A
              git diff --cached --quiet && { echo "seo unchanged after rebuild"; exit 0; }
              git commit -m "seo: refresh crawlable layer (rebuilt on new upstream)"
            fi
            echo "retry $i"; sleep $(( (RANDOM % 5) + 3 ))
          done
          echo "::error::seo push failed"; exit 1
      - name: Ping search indexes
        if: success()
        run: python scripts/ping_index.py
