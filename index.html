{c:"处世·人性",n:"拉罗什富科",e:"法国·1613—1680年",w:"美德常是伪装的恶德",y:1613,d:"法国公爵，投石党运动的失败者。半生卷在贵族政变里，输光了政治前途和一只眼睛的视力，退隐之后在沙龙里写下 641 条《箴言集》。他被称为「人心的解剖者」：把慷慨、忠诚、谦逊、同情逐条拆开，发现底下坐着同一个东西——自爱（amour-propre）。这不是愤世嫉俗，是一个从内部看过那个圈子的人，拒绝再自欺。",story:"1652 年圣安托万门之战，他被火枪击中面部，一度双目失明。此前他已经在几次政变里站错了队，家族封地被削，政治生命结束。视力恢复后他不再回宫廷，转而进入沙龙。有意思的是，他解剖的第一个对象是自己：《箴言集》最早的手稿里有一篇长文专写「自爱」，说它「像变色龙一样善变，它活在一切之中，也活在虚无之中」。他写的所有贵族的虚伪，都是他自己二十年间亲身演过的。这就是为什么这本书刻薄而不轻佻——它是一份供词，不是一份指控。",f:[{n:"自爱是全部动机的底座",d:"「自爱是世上最大的谄媚者。」它不断向你汇报你是个什么样的人，而汇报内容永远对你有利。你以为的原则、品味、判断，多数只是自爱替你挑好的说法。",eg:"复盘时把「我当时是为了团队」换成「我当时想被看成为了团队的人」，很多决策会立刻显出另一副样子。"},{n:"美德是伪装得体的恶德",d:"「我们的美德常常只是伪装起来的恶德。」慷慨可能是野心的支出，谦逊可能是求赞的迂回路线，宽容可能只是懒得纠缠。他不是说美德不存在，是说别用行为反推动机。",eg:"一个人一贯大方，只说明大方对他划算；环境一变，划算的方向就变了。看结构，不要看人品。"},{n:"同情的不对称",d:"「我们都有足够的力量去忍受别人的不幸。」最冷也最难反驳的一条。它解释了为什么安慰总是显得轻飘，也解释了为什么真正的支持稀缺——因为它要求人付出自己并不需要付出的代价。"},{n:"拒绝赞美是二次索取",d:"「拒绝赞美，其实是想被赞美第二次。」很多看起来是退让的动作，本质是加价。识别它的方法很简单：看这个动作有没有给对方留下必须回应的空位。"},{n:"激情不会消失，只会换对象",d:"人老了不是欲望没了，是欲望换了更安全的形式——从爱情换成体面，从野心换成对晚辈的安排。以为自己看开了的人，多数只是换了赛道。"},{n:"我们从不为自己以为的理由做事",d:"整本书的方法论：先假定给出的理由是事后编的，再去找那个不方便说出口的理由。这条对读别人有效，对读自己更有效。"}],q:["我们的美德常常只是伪装起来的恶德。","我们都有足够的力量去忍受别人的不幸。","拒绝赞美，其实是想被赞美第二次。","自爱是世上最大的谄媚者，它比世上最巧妙的人还要巧妙。"],apply:"用在两个地方。对内：任何一次自我辩解成立得太顺畅的时候停一下，问「这个理由是不是刚好让我很舒服」。对外：判断合作方不要看他说的动机，看这件事对他划不划算，以及环境变化后还划不划算——把善意当结构来验证，而不是当品质来相信。",l:["智慧书","马基雅维利","影响力","尼采","思考，快与慢"],contrast:[{n:"智慧书",why:"同为箴言体，格拉西安教你在这个世界怎么活下去，拉罗什富科只负责告诉你别骗自己——一个给方法，一个拆幻觉"},{n:"富兰克林",why:"富兰克林相信美德可以靠表格练成，拉罗什富科认为练成的只是美德的样子。两人可以对照着读一整年"},{n:"论语",why:"孔子相信修身能通向仁，拉罗什富科怀疑修身只是自爱找到的更高级的形式"}]},
{c:"创业·产品",n:"保罗·格雷厄姆",e:"美国·1964年—",w:"做不可规模化的事",y:1964,d:"Lisp 黑客，1995 年做出 Viaweb——世界上第一个跑在浏览器里的商用软件，1998 年卖给雅虎。2005 年和几个人办了 Y Combinator，用「一次投一批、给小钱、给三个月」的方式重写了早期投资的形态，Airbnb、Stripe、Dropbox 都从这里出来。他真正的影响力在几百篇 essay 里：几乎所有今天被当成创业常识的东西，都能在其中找到最早也最清楚的那一次表述。",story:"Airbnb 在 YC 的时候数据一直不动。格雷厄姆问他们用户在哪，答：纽约。他说：那你们为什么在这儿？去纽约，一家一家上门。创始人真的飞去纽约，挨家敲门，借了一台相机替房东重拍房源照片——纯手工，完全不可复制，一周只能覆盖几十个房源。照片换完之后，纽约的订单翻了一倍多。这件事本身没有任何技术含量，也永远无法规模化，但它是 Airbnb 拿到的第一条真实增长曲线。格雷厄姆后来把它写成了那篇《Do Things That Don't Scale》：创业者总想先搭好一个能自动增长的机器，但在你确认有人真的想要之前，那台机器只是一个昂贵的假设。",f:[{n:"做不可规模化的事",d:"早期手动招募用户，一个一个地找、一个一个地伺候。这个阶段的低效不是浪费，它是唯一能让你近距离看见用户为什么要、以及为什么不要的方式。",eg:"Stripe 的做法叫「Collison 安装法」：用户说有兴趣，创始人当场说「给我你的电脑」，直接帮他把代码接上，而不是发一份文档过去。"},{n:"做人们想要的东西",d:"YC 的墙上只有这一句。他的判断是：杀死创业公司的错误说到底只有一个——做了没有人真正想要的东西。其余所有问题都是可以修的。",eg:"融资顺利、团队豪华、发布会漂亮，都无法补偿这一条；反过来，只要这一条成立，其余大部分错误都还有时间改。"},{n:"好想法的三个特征",d:"自己就想要、自己有能力做、而且很少有人意识到它值得做。三条缺一条都危险：不是自己想要就没法判断细节，做不了就只能空想，别人都觉得值得做就已经太挤了。"},{n:"Schlep blindness：对麻烦的选择性失明",d:"最好的机会常常藏在看起来又脏又烦的事情后面——对接银行、跑合规、处理退款。人的大脑会自动跳过这类想法，跳过得如此之快，以至于你根本没意识到自己跳过了。",eg:"支付、报税、医保结算这些领域长期没人碰，不是因为难想，是因为一想到要处理的琐事，脑子就自动换台了。"},{n:"创造者时间表 vs 管理者时间表",d:"管理者按小时切分，创造者需要整块。一个下午插进一个会，损失的不是那一小时，是整个下午——因为剩下的两段都不够长到进入状态。"},{n:"宁可少数人爱，不要多数人还行",d:"一百个爱你的用户，比一万个觉得还行的用户有价值得多。前者会告诉你为什么爱、会替你传播、会容忍你的粗糙；后者只会安静地消失，什么都不留下。"}],q:["创业只有一个致命错误：做了没有人想要的东西。","先去做那些无法规模化的事，这是通往规模的唯一路径。","与其让很多人有点喜欢你，不如让很少的人非常爱你。","最好的创业想法是：你自己想要、你自己能做，而别人没意识到它值得做。","一个会议，可以毁掉一整个下午。"],apply:"冷启动阶段不要建渠道、不要投放、不要先做自动化，去手工找到前一百个用户并逐个服务到满意；只有当你被手工伺候的工作量压垮时，才说明该做规模化了。判断一个想法的时候先过三道题：我自己要不要用、我做不做得出来、为什么现在还没人做——第三题答不上来，多半是它没那么值得做，或者你还没看见那堆麻烦。",l:["彼得·蒂尔","纳瓦尔","贝索斯","王兴","乔布斯"],contrast:[{n:"彼得·蒂尔",why:"同为硅谷思想源头，蒂尔从「找到一个别人不同意的秘密、直奔垄断」起手，格雷厄姆从「找到一百个爱你的用户、慢慢长」起手"},{n:"创新者的窘境",why:"克里斯坦森说别只听最好的客户的，格雷厄姆说早期要拼命贴着少数用户听——不矛盾，是在讲公司生命周期的两端"},{n:"马斯克",why:"马斯克从物理约束往下推，格雷厄姆从用户反馈往上长。两条路都通，但混着用通常两头不靠"}]},
{c:"创业·产品",n:"松下幸之助",e:"日本·1894—1989年",w:"自来水哲学",y:1894,d:"9 岁辍学做学徒，23 岁带着两个人在自家做双灯用插座，最后做出松下电器，被日本人称为「经营之神」。他的价值不在于把公司做多大，而在于他是第一个把「企业为什么存在」当成经营技术来回答的人：使命定得对，组织和产品会自己长出来；使命定不对，效率越高越危险。今天讲的使命愿景、事业部制、透明管理、现金冗余，源头多数在他这里。",story:"1929 年大萧条，松下销售腰斩，仓库堆满，他本人正病着。两位干部拿着方案进来：裁掉一半员工。他在病榻上给了另一个答案——一个人不裁，工资全额照发，但生产立刻减半，工人上半天班，下半天全体出去卖库存。两个月，库存清空，全线复产，一个人没走。这件事后来被反复引用为「人本经营」的样板，但它真正的前提是他早就准备好的另一样东西：现金。没有余量的公司做不了这个选择，只能裁人。他把这套准备叫「水库式经营」。",f:[{n:"自来水哲学",d:"1932 年他看见路边有人拧开自来水管喝水，没人阻止——水是有价的，但因为多到近乎无限，便宜到不构成偷窃。他由此定下松下的使命：把生活物资做到像自来水一样取之不尽、价格低廉，以此消除贫困。他把这一天定为松下的「创业命知元年」。",eg:"使命一旦这样定死，所有关于要不要降价、要不要走量的争论都自动有了答案——不需要每次重新讨论一遍。"},{n:"水库式经营",d:"河上修水库是为了蓄水调流，企业也要在资金、设备、库存、人才上各修一座水库，留出用不到的余量。景气时它看起来是浪费，不景气时它是唯一让你还能做选择的东西。",eg:"一次演讲后有听众问「怎么才能有水库」，松下答：「首先，你得真心想要有。」全场哄笑，只有台下的稻盛和夫像被电到——他后来说，这一句改变了他的一生。"},{n:"玻璃式经营",d:"财务和经营信息对内公开，像玻璃一样看得见。它带来的不是感动，是判断力：知道数字的人才可能做对决策，不知道数字的人只能执行。"},{n:"造人先于造物",d:"「松下电器是制造人才的公司，兼做电器生意。」这句话被无数公司抄成标语，但他是当真的——他把培养判断力当成主产品，把电器当成副产品。"},{n:"事业部制",d:"1933 年他首创事业部制，让每个产品线独立核算、自负盈亏。目的不是效率，是让尽可能多的人在真实的损益表前面练习做决定。现代 BU 制、阿米巴、内部创业都是这条线下来的。"},{n:"三个恩惠",d:"他说自己有三样运气：家贫，所以从小知道钱怎么来；体弱，所以只能把事交给别人做；没上过学，所以事事都得向人请教。三样都是短板，被他一一转成了组织能力。",eg:"授权文化不是他想出来的管理理念，是他身体撑不住逼出来的——但结果是松下比同代企业更早学会不依赖创始人。"}],q:["松下电器是制造人才的公司，兼做电器生意。","生意人的使命，是让宝贵的生活物资像自来水一样取之不尽、用之不竭。","我有三个恩惠：家贫、体弱、没上过学。","越是不景气的时候，越要靠经营的力量。"],apply:"两件事可以直接照搬。一是给现金、人才、时间各留一座水库：留量在顺境里永远显得多余，而它决定了你在逆境里是能做选择，还是只能裁人。二是把使命写到能自动裁决具体争论的程度——如果一句使命无法帮你判断「这个价该不该降」，那它就还只是一句标语。",l:["稻盛和夫","任正非","段永平","安迪·格鲁夫","塔勒布"],contrast:[{n:"稻盛和夫",why:"稻盛亲耳听过松下讲水库式经营并深受影响，两人一脉相承；差别在松下靠结构留余量，稻盛更靠人心和会计"},{n:"任正非",why:"都把「活下去」放在第一位，路径相反：松下靠平时蓄水，任正非靠持续制造危机感"},{n:"塔勒布",why:"水库式经营就是反脆弱的实业版本——冗余在平时是成本，在冲击到来时是全部的选择权"}]},
{c:"典籍·洞见",n:"有限与无限的游戏",e:"1986年",w:"求胜还是求续",y:1986,d:"纽约大学宗教史教授詹姆斯·卡斯写的一本小册子，101 个短章，没有论证，只有陈述。它给出的区分极简单：有限游戏以取胜为目的，无限游戏以延续游戏本身为目的。但这个区分一旦装进脑子，几乎会重排你对野心、竞争、职业和公司的全部理解——因为你会开始发现，自己正在玩的很多局，其实从来没人规定过它必须有个赢家。",story:"这本书出版时几乎没有反响。它不是商业书，也不是严格的学术著作，一个宗教史学者用格言体写游戏、剧场和死亡，两边都不讨好。它真正被读起来是在互联网时代——创业者发现它精确描述了一件他们说不清的事：为什么有些公司赢下了所有战役却死掉了，而有些公司从不宣布胜利却一直在。在中文世界里它最著名的传播者是王兴，美团价值观里那句「长期有耐心」，背后站着的就是这本书。",f:[{n:"两种游戏",d:"有限游戏有确定的开始、结束和赢家，规则不可变，参与者在边界内游戏；无限游戏没有终点，规则必须随时变化以保证游戏能继续，参与者与边界本身游戏。",eg:"一次融资、一场大促、一个季度是有限游戏；一家公司、一段关系、一个人的手艺是无限游戏。把无限游戏当有限游戏打的人，会在赢的那天不知道该干什么。"},{n:"规则的方向相反",d:"有限游戏的规则不能变，变了游戏就结束；无限游戏的规则必须变，不变游戏就结束。这一条最锋利：所有「我们一直是这么做的」，都是在把一个无限游戏悄悄降级成有限游戏。"},{n:"权力与力量",d:"有限游戏的参与者为 power 参赛——权力是对头衔的敬重，是别人给你的；无限游戏的参与者凭 strength 参赛——力量不需要别人承认，也无法被剥夺。",eg:"一个人的头衔换掉之后还剩下什么，那部分就是 strength。多数职业焦虑的来源，是这两者被长期混为一谈。"},{n:"认真 vs 玩",d:"有限游戏的参与者是「认真的」（seriously），因为结果关系到他的头衔；无限游戏的参与者是在「玩」（playfully），因为他随时可以改变规则。玩不是不当回事，是保留了改变的自由。"},{n:"观众",d:"有限游戏需要观众来认证胜利——没有人看见的冠军不成立；无限游戏没有观众，只有参与者。凡是必须被围观才成立的成就，都是有限游戏。"},{n:"头衔与死亡",d:"有限游戏的赢家得到头衔，而头衔是过去时的、需要不断被承认的；无限游戏的参与者「除了自己的名字以外一无所有」。这句话读起来像失败，实际是最大的自由。"}],q:["有限游戏以取胜为目的，无限游戏以延续游戏为目的。","有限游戏的参与者在边界内游戏，无限游戏的参与者与边界游戏。","有限游戏的参与者为了权力而参赛，无限游戏的参与者凭借力量而参赛。","有限游戏的规则不可改变，无限游戏的规则必须改变。"],apply:"遇到一个让你紧张的局面，先问一句：这是有限游戏还是无限游戏。是有限的，就明确赢的条件、打完收工，不要把它带回家；是无限的，就别去追一个终局，把注意力放在「怎么让自己还能继续玩下去」。职业选择上，这一问尤其管用——升职是有限游戏，能力是无限游戏，前者会结束，后者不会。",l:["王兴","庄子","系统之美","纳瓦尔","尼采"],contrast:[{n:"孙子兵法",why:"孙子把竞争彻底当成有限游戏来解，全部技术都服务于胜；卡斯要问的是，你为什么默认这一局必须有终局"},{n:"彼得·蒂尔",why:"蒂尔的垄断是有限游戏赢到极致，卡斯会指出：赢下来之后，这个游戏就结束了"},{n:"庄子",why:"「无用之用」和无限游戏是同一个方向——不追求在既定规则里胜出，而是保留改变规则的余地"}]},
{c:"典籍·洞见",n:"枪炮、病菌与钢铁",e:"1997年",w:"环境而非人种",y:1997,d:"贾雷德·戴蒙德 1997 年的著作，次年获普利策奖。它回答一个几乎所有人都想过、但很少有人敢直接问的问题：为什么是欧洲人带着枪炮、病菌和钢铁去征服美洲和大洋洲，而不是反过来。戴蒙德的答案是环境，不是人——各大陆在可驯化物种和地理轴线上的差距，经由粮食生产这个中间变量，被放大成一万三千年后的技术、文字、组织和免疫力的差距。",story:"1972 年，戴蒙德在新几内亚的海滩上和当地政治家耶利散步。耶利问了他一个问题：「为什么你们白人制造了那么多货物运到新几内亚来，而我们黑人却几乎没有属于自己的货物？」戴蒙德当场答不上来——他知道任何基于人种智力的解释都是错的，但他拿不出对的那个。这个问题他想了二十五年，最后写成了这本书。全书的分量有一半来自这个开头：它不是一个学者选定的课题，是一个被问住的人欠下的一笔账。",f:[{n:"近因与终极因",d:"枪炮、病菌、钢铁都只是近因——它们是结果，不是原因。往回追，终极因是粮食生产：谁先有了农业和畜牧，谁就有了人口密度、剩余产品、专业分工，然后才有了国家、文字、金属和军队。",eg:"问「为什么西班牙人有钢剑」没有意义，要问「为什么欧亚大陆能养出一批不用种地的铁匠」。"},{n:"可驯化物种的分布极不均匀",d:"全世界体重 45 公斤以上、可被驯化的野生哺乳动物只有 14 种，其中 13 种原产欧亚大陆。他称之为「安娜·卡列尼娜原则」：可驯化的动物都是相似的，不可驯化的各有各的理由——脾气、食性、繁殖习惯、群居结构，缺一样就不行。",eg:"斑马看起来和马一样，却始终无法驯化：它会咬住人不松口。非洲不是没试过，是这条路本来就不通。"},{n:"大陆轴线的方向",d:"欧亚大陆是东西走向，同一纬度气候相近，作物、家畜和技术可以横向平移几千公里；美洲和非洲是南北走向，跨气候带传播极慢甚至不可能。一条地图上的线，决定了知识扩散的速度。",eg:"小麦从新月沃地传到欧洲和印度不需要重新驯化；而玉米从墨西哥传到北美东部花了数千年，还得改良品种。"},{n:"病菌是家畜的副产品",d:"天花、麻疹、流感都源自密集饲养的家畜。欧亚人为此付出了几千年的代价，也因此带上了免疫力。当这些病菌随人抵达美洲，它们杀死的人远比枪炮多。",eg:"皮萨罗以 168 人俘获印加皇帝，通常被讲成勇气或火器的胜利。实际上天花已经先他一步抵达，杀死了老皇帝并引发了内战——他面对的是一个刚打完内战的国家。"},{n:"最优分裂原则",d:"欧洲破碎的地形造成了长期竞争的多国体系：一个国王拒绝哥伦布，他还可以去找下一个；中国的大一统则意味着一次决策失误可以锁死全国——郑和的船队被朝廷一纸令下终止，就再也没有第二个出资方。",eg:"「统一带来效率，分裂带来选项」——这条对国家成立，对行业和公司同样成立。"}],q:["各族群的历史循着不同的轨迹展开，是环境的差异，而不是人的生物学差异。","可驯化的动物都是相似的，每一种不可驯化的动物各有各的不可驯化之处。","征服美洲的主力不是枪炮，而是随征服者一起到达的病菌。","历史上最大的那些模式，是由各大陆环境的差异塑造的。"],apply:"它给的是一种归因纪律：看到显著的结果差距时，先别急着归因到人的素质、意志或文化，往回退两步找结构性的初始条件——起点资源、传播路径、密度和时间。这条纪律用在看行业、看公司、看城市甚至看个人履历上都成立，而且几乎每次都会让你的判断更准一点、更少一点道德色彩。",l:["人类简史","国家为什么会失败","国富论","系统之美","旧制度与大革命"],contrast:[{n:"国家为什么会失败",why:"库里最正面的一场辩论：戴蒙德说地理是终极因，阿西莫格鲁说制度才是根本原因、地理只是背景。两位作者公开互驳过，值得连着读"},{n:"人类简史",why:"同样处理一万年尺度，戴蒙德解释各大陆之间为什么不同，赫拉利解释人这个物种为什么特殊"},{n:"系统之美",why:"轴线、传播、密度、反馈——戴蒙德实际上是在写一个跨越一万三千年的系统动力学案例"}]},{c:"权力·治理",n:"孟子",e:"战国·前372—前289",w:"得民",y:-372,
d:"孔子之后最能把儒家写成统治操作系统的人。他不把「仁」当成德行标语，而是当成权力能不能续上的约束条件：税、兵、杀人权一旦失据，政权先空再垮。周游列国而不遇合，这份清醒没换来官位，却把「民为贵」写成了后世治国者躲不掉的警句。",
story:"齐宣王问孟子：汤武可以取天下吗？孟子说：可以。邻国连着三年干旱，你没去救；第二年又旱，你又没去救——这不是仁而是残。大王说我弱，孟子说不是力量问题，是你把民当作农产。这段对话把儒家从「向君讲道德」扭成「向君算账」：得民不是感情，是你还能不能征税、征兵、死守。齐宣王没用他，但这套账本被后世治世者一遍遍重算。",
f:[{n:"得民者得天下",d:"「得道者多助，失道者寡助」。道在这里不是经文，是你还能不能让人愿意跟你拼。税赋超过生产、役使超过产出、杀人超过公平，民众不会突然造反，但会先停止同意——权力就在这一步空掉。",eg:"周武王初年井田、商市、兵制都给了人一条活路，四方归附；晚年大封建、重赋役，民众一散。公司版：标准加班可以挣一季度，但核心员工开始装死时，你的势就散了。"},{n:"以德服人",d:"「以力服人者，非心服也；以德服人者，中心悦而诚服也」。力只买得顺从，买不到判断。你一离开现场，力就回零。能让人在你看不见的地方仍按你的标准做事，才算服。",eg:"李世民能纳谏，是因为朝臣相信诚谏不会换来报复；项羽能破城，却留不住韩信。现代管理同理：密集监控能拔高周报表，拔不高一离开就掉队的业务。"},{n:"恒产而非暴征",d:"孟子对跟风求利的判词是：不要跟着人抢已经开好的地，要把自己的地种好。人家一动你就跟，你永远是第二名；把税制、农时、学校稳住，别人的人会自己过来。",eg:"齐国跟着秦楚变法抢地皮，国力上去了一阵，但民众没跟上。公司跟风投三个赛道，账面上有一季的热度，但用户不会记住你。"},{n:"知言不如养气",d:"孟子讲养浩然之气，不是鸡汤。他说的是：判断经过反复核对，你才敢在压力下按原判断行事。没有这口气，遇事就改口，不叫坚定，叫没主见。",eg:"孟子见梁惠王，敢说「王之不王」；对照许多朝会上只敢说「再看看」的参谋。团队里最危险的不是有主见的人，是没主见还装得像有主见的人。"},{n:"生于忧患",d:"「生于忧患而死于安乐」。不是让你苦修，是警告你：组织一旦进入舒适区，它就开始丢失警觉。忧患是信号，安乐是麻醉。",eg:"秦国在死亡边缘能变法，统一后第二代就碎。创业公司活过两个冬天还在，第三年开始买工位超过买用户。"}],
q:["民为贵，社稷次之，君为轻。","得道者多助，失道者寡助。","以力服人者，非心服也；以德服人者，中心悦而诚服也。","生于忧患而死于安乐。","天时不如地利，地利不如人和。"],
apply:"做一季度决策前先问三个问题：这一刀会不会让核心人停止同意？你不在现场时，人还会按这个标准做吗？你是在种自己的地，还是在跟别人抢地？三个回答里只要有一个是「会丢」，这一刀就先别下。",
l:["论语","韩非子","商鞅","李光耀","李世民"],contrast:[{"n": "韩非子", "why": "同样写治国：韩非信赏罚，孟子信得民。一个算人会怎么动，一个算人还愿不愿意跟"}, {"n": "论语", "why": "论语给规范，孟子给约束。孔子讲君子怎么做人，孟子讲国君怎么才不会转眼间丢掉政权"}],
fail:"孟子把仁政讲得很透，但游历齐、宋、滕、梁，没有一个国君把权给他。他的学说胜在书里，输在当世。战国君主要的是能立刻拉得出的兵和税，不是三年之后才能看到的人和。",
lesson:["一套正确的理论，如果没有能承受它的主君，就只是正确。","得民是慢变量，打仗是快变量——当世总是先买快的。","把道德写成账本而不是教条，这是孟子比空谈仁义的人强的地方。"]},

{c:"心智·哲学",n:"荀子",e:"战国·前313—前238",w:"化性起伪",y:-313,
d:"孟子讲人天然可好，荀子讲人天然可塑。「伪」不是假，是人工：礼仪、法度、师傅、反复训练，把生出来乱的材料装进可用的形状。韩非出他门下，秦制从他这里接过力。他是中国思想里最早把组织设计当成第一问题的人。",
story:"荀子在兰陵议兵。春申君问他兵怎么打，他不讲奇谋，讲两件事：兵器要新，赏罚要信。他认为战争不是气概比拼，是一套能不能把普通人训成可用之器的制度。后来他到楚，做兰陵令，把这套话落到县政上。门生韩非把他的「人可塑」推到极致，变成了法术势；但荀子自己没有走到那一步——他相信训练，不相信光靠恐惧。",
f:[{n:"化性起伪",d:"「人之性恶，其善者伪也」。人出生带着的是偏好，不是美德。美德是装出来的：用规则、仪式、反复纠偏把人拉回可以合作的形状。期望员工自觉，就是在拒绝做这份工。",eg:"富兰克林用美德表格一天打一次分，是荀子的现代版。格鲁夫在英特尔用周会和输出表把经理训成可用之器，也是同一套。"},{n:"青出于蓝",d:"材料不决定上限，工序才决定。门生能超过老师，不是因为天赋更高，是因为把老师的方法用得更彻底。",eg:"韩非把荀子的「人可塑」推成法术势，系统更冷；李斯把同门的韩非送进了监狱。工序没有道德自带制动。"},{n:"规矩方圆",d:"没有工具就没有直线。荀子说圣人也要借规矩方圆，更何况普通主管。你觉得「这事我心里有数」，通常只是还没把尺度写下来。",eg:"商鞅徙木立信，把赏罚写成可观察的制度；很多公司的「价值观」做不到这一点，所以只能贴在墙上。"},{n:"积微成著",d:"「不积跬步，无以至千里」。大变是小变的堆积。等待顿悟的组织，会在等待中散掉。",eg:"曾国藩讲慎独，一天改一点习惯；稻盛讲精益求道，把工夫拆成每天能重复的动作。都是荀子这句话的实践版。"},{n:"师法而非自觉",d:"荀子尊师。不是迷信权威，是承认：没有外部校正，人会把自己的偏好当成真理。师傅的价值是把你拉回规矩，不是让你舒服。",eg:"王阳明讲知行合一，偏向内部觉悟；荀子偏向外部训练。两条路都能走通，但组织里不能只留一条。"}],
q:["人之性恶，其善者伪也。","青，取之于蓝，而青于蓝。","不积跬步，无以至千里。","蓬生麻中，不扶而直。"],
apply:"招人之后先别讲「自驱动」。先写清：什么算做对、谁来检查、检查不过怎么办。三条都空的团队，不是文化不够，是你还停在性善论里。",
l:["孟子","韩非子","王阳明","安迪·格鲁夫","富兰克林"],contrast:[{"n": "孟子", "why": "一个认为人可教，一个认为人可塑。孟子用养气，荀子用工序"}, {"n": "韩非子", "why": "门生把老师的训练论推成控制论。荀子还留着礼，韩非只留下柄"}],
fail:"荀子把人当成可塑的材料，也把自己的门生塑成了最冷的法家。韩非死在李斯手里，秦制用完这套工具就碎。工序能造就人，也能造就武器。",
lesson:["不要把「人可塑」当成赌气：你塑的方向，就是他们以后对他人的方向。","没有检查的自觉，只是还没被测到的偏好。","师傅不是为了让你舒服，是为了阻止你把偏好当成原则。"]},

{c:"创业·产品",n:"彼得·德鲁克",e:"奥—美·1909—2005",w:"成果",y:1909,
d:"把管理从「管人」改成「对成果负责」的人。他不写职位说明书，写的是：你被雇不是因为忙，是因为要产出一个别人用得上的结果。GM、日本企业、非营利都用过他的问题清单。核心只有一句：活动不算数，成果才算。",
story:"二战时德鲁克在通用汽车做咨询。他发现高管的日程塞满了会议，但没人能回答「你今年到底产出了什么」。他把这份发现写进《卓有成效的管理者》：把时间记录一周，你会看见自己把最好的几小时给了最不重要的事。这不是时间管理技巧，是成果观的入口——你不测量贡献，就只能测量出勤。",
f:[{n:"对成果负责",d:"管理者的工作不是把事做完，是让正确的事发生。会议、报告、协调都是活动。活动能填满日程，填不满成绩。",eg:"格鲁夫在英特尔要求经理写「我的业务是什么」，不是写职能清单。两人接在同一条线上：先定义成果，再安排动作。"},{n:"效率不是效果",d:"把不该做的事做得很快，是最昂贵的浪费。先问这事该不该做，再问怎么做得快。",eg:"许多公司用OKR把错误目标拆得很细，四个季度都达成了，公司仍在错的赛道里。"},{n:"时间是唯一的材料",d:"你不能管理时间，只能管理自己把时间用在哪。把一周真实花掉的小时写下来，你会发现战略只占了一小块。",eg:"德鲁克要求管理者把不重要的事找人接，不是因为懒，是因为你的时间比他人贵。"},{n:"人事决策是唯一不可推迟的决策",d:"错的人放在对的位置上，会把对的制度拆掉。人事不是HR的事，是主管的主业务。",eg:"任正非把干部轮换当成战略动作，不是年底表演。德鲁克会点头。"},{n:"企业的目的是创造顾客",d:"不是创造利润。利润是结果，顾客是原因。把这两个弄反了，你会为了财报伤客。",eg:"贝索斯讲Day 1，松下讲自来水哲学，都是这句话的产品版。"}],
q:["最无用的事，是把不该做的事做得非常高效。","效率是把事做对，效果是做对的事。","企业的目的是创造顾客。","管理者的时间是最稀缺的资源。"],
apply:"每周五写三行：本周我产出了什么、什么本该产出却没产出、下周我准备停掉什么活动。三行都写不出来的周，就是你被日程吃掉的周。",
l:["安迪·格鲁夫","松下幸之助","任正非","保罗·格雷厄姆"],contrast:[{"n": "安迪·格鲁夫", "why": "格鲁夫解决执行，德鲁克解决取舍。一个问怎么把事做通，一个问这事值不值得做"}, {"n": "保罗·格雷厄姆", "why": "PG讲从零开始怎么做，德鲁克讲规模化以后怎么不变成忙碌"}],
fail:"德鲁克把管理变成了一门学科。学科一成熟，就会生出大量论管理而不管理的人。他自己最怕的，正是人把他的书当成活动清单。",
lesson:["一本讲成果的书，最容易被读成活动手册。","你若把德鲁克当作课程，你已经输了。","能写出「我本周的成果」的人，才算读懂了他。"]},

{c:"财富·投资",n:"哈耶克",e:"奥—英·1899—1992",w:"分散知识",y:1899,
d:"把「计划为什么会系统性算错」写成经济学的人。不是因为计划者懒，是因为做计划所需的知识，散落在成千上万个当事人头里。价格是这些知识的传输协议。他和凯恩斯辩了一辈子，胜的不是口才，是这一条知识论。",
story:"1945年哈耶克发表《知识在社会中的运用》。他说：一个计划者要调配钢材和面包，必须知道每一个工厂、每一块田的特殊情况。这些知识没有人能全部掌握。市场用价格把它们缩成一个数字传出去。凯恩斯认为聪明人能算清这笔账；哈耶克认为再聪明的人也没有这份清单。二十年后，计划经济的崩塌让这篇文章变成了预言。",
f:[{n:"知识的分散",d:"真正有用的知识不是论文，是「此时此地」的细节：谁缺工、谁有库存、哪条路堵了。这份清单不存在于任何一个人脑中。",eg:"张一鸣用推荐算法把分散的点击收成信号，是价格机制的产品版。总部干部一张表想代替市场，是反例。"},{n:"价格是协议",d:"价格不是价值判决，是压缩过的消息。你不需要知道为什么涨，只要知道它涨了，就能调整行动。",eg:"石油涨价时，全世界的司机和化工厂同时改行为，不需要一个部长召集他们开会。"},{n:"自生秩序",d:"没人设计的秩序，不等于没有秩序。语言、市场、法律习惯都是这一类东西。你可以干预它，但干预的代价通常在别处出现。",eg:"塔勗布讲反脆弱：不要把系统打磨成一个人能控的样子。哈耶克是这句话的前辈。"},{n:"自以为知",d:"最危险的不是无知，是把局部知识当成全局清单。计划者的通病是：我能看到的，就是全部。",eg:"大公司的年度规划常在四月失效，不是因为人笨，是因为现场在变。"},{n:"规则优于命令",d:"好的秩序是约束行为的规则，不是指定结果的命令。给人边界，让他们用自己的知识填充边界里面。",eg:"商鞅立法而不是每天给市长下命令；达里奥的原则是边界，不是交易手册。"}],
q:["经济学的奇怪任务，是让人看清：对自己以为能设计的东西，他们其实知道得多少。","价格体系是传递信息的机制。","没有人能掌握做计划所需的全部知识。"],
apply:"写年度规划之前先问：这份计划依赖的知识，有多少不在我头里？把这些空白写出来。空白超过一页，就别把规划写得像命令，改成边界和信号。",
l:["国富论","塔勒布","张一鸣","达里奥"],contrast:[{"n": "国富论", "why": "史密斯讲分工能让蛮力变富，哈耶克讲分工之后信息怎么传回来"}, {"n": "塔勒布", "why": "塔勒布讲你无法预知冲击，哈耶克讲你无法集中知识。一个对付随机，一个对付自以为知"}],
fail:"哈耶克的论敏感害怕计划，有时会被读成「什么都不要管」。他自己强调的是规则而不是放任。没有规则的市场，不是他要的自生秩序。",
lesson:["反对计划，不是反对决策，是反对假装全知的决策。","你看不到的知识，不会因为你看不到就消失。","把价格拆掉之后，你必须自己当信使。"]},

{c:"权力·治理",n:"俾斯麦",e:"普鲁士·1815—1898",w:"联盟几何",y:1815,
d:"把欧洲当成一道几何题来做的人。他不追求友谊，追求让三方同时离不开你。打败丹麦、奥地利、法国三场战争之后，他反而停下，用联盟把德意志固住。拿破仑赢在打，他赢在停。",
story:"1871年德意志在凡尔赛宣告成立。俾斯麦没有追击巴黎，而是立刻转向抹平法国以外的欧洲。他结三皇同盟，跟俄、奥、意、意大利分别谈判，让每一方都觉得离开柏林会更危险。法国被隔离了二十年。他一下台，这张网就裂了——说明联盟不是友情，是一个人的计算能不能续上。",
f:[{n:"可能性的艺术",d:"政治不是实现理想，是在可用的条件里取最多。把目标写成「必须如此」的人，会把局势赔掉。",eg:"他统一德意志时不要南德，先要普鲁士能控的那一半。产品版：不要一次打下全部市场，先打下你能守住的那一块。"},{n:"三方离不开你",d:"最稳的位置不是强，是让A需要你来防B，B需要你来防A。两边都不能掉，你就在中间。",eg:"三皇同盟让俄、奥、德互相牵制。公司版：成为两个巨头都不能少的中间件，而不是跟一边绑死。"},{n:"打完就收",d:"胜三场战争之后他停手。再多打一场，联盟就会翻脸。胜利的下一步不是扩张，是把胜利变成别人能接受的现状。",eg:"拿破仑打到墨西哥还想再打；俾斯麦打完法国就开始谈赔偿和孤立。"},{n:"不在主场硬碰",d:"他对英国海权、俄国在巴尔干都避让。主场是对手的生存点，你去碰，他会用全力。",eg:"张居正改明不动皇权核心，先动赋税和考成。同一条几何。"},{n:"联盟是消耗品",d:"联盟靠人维持。人一走，纸面还在，结构就散。不要把一个人的计算能力写进制度里。",eg:"俾斯麦下台后威廉二世拆掉重保险，欧洲重新走向对抗。创始人离开后的伙伴关系，也是这种消耗品。"}],

// 反向关联索引。l 与 contrast 都是逐条手写的单向边，于是被指向的一方看不到来源：
// 全库有 291 条 l、119 条 contrast 只存在于一个方向，另有 9 条（武则天、富兰克林、胡雪岩、
// 安迪·格鲁夫、六祖慧能，以及新收录的几条）没有任何条目指向它们，只能从「最新」或搜索进入。
// 这里在渲染期补齐反向边：人工挑选的正向关联仍排在前面，自动补全的反向关联接在后面，去重。
// 好处是数据不必写两遍，此后新增条目自动双向可达。
const RL={},RC={};
D.forEach(d=>{
  (d.l||[]).forEach(x=>{(RL[x]=RL[x]||[]).push(d.n)});
  (d.contrast||[]).forEach(c=>{(RC[c.n]=RC[c.n]||[]).push({n:d.n,why:c.why})});
});
function relOf(d){
  const fwd=d.l||[],seen=new Set(fwd),add=[];
  (RL[d.n]||[]).forEach(x=>{if(x!==d.n&&!seen.has(x)){seen.add(x);add.push(x);}});
  return fwd.concat(add);
}
function contrastOf(d){
  const fwd=d.contrast||[],seen=new Set(fwd.map(c=>c.n)),add=[];
  (RC[d.n]||[]).forEach(c=>{if(c.n!==d.n&&!seen.has(c.n)){seen.add(c.n);add.push(c);}});
  return fwd.concat(add);
}

const CATS=["最新","全部",...[...new Set(D.map(d=>d.c))]];
let TAB="最新";

function rTabs(){
  document.getElementById('tabs').innerHTML=CATS.map(c=>
    `<div class="tab${c===TAB?' on':''}" onclick="sTab('${c}')">${c}</div>`
  ).join('');
}
function sTab(t){TAB=t;renderTL();}

const ERAS=[
{label:"前800年—前200年",min:-800,max:-200},
{label:"前200年—公元400年",min:-200,max:400},
{label:"400年—1400年",min:400,max:1400},
{label:"1400年—1800年",min:1400,max:1800},
{label:"1800年—1950年",min:1800,max:1950},
{label:"1950年至今",min:1950,max:2100},
];

function renderTL(){
  rTabs();
  const q=document.getElementById('q').value.toLowerCase();
  const list=D.map((d,i)=>Object.assign({_i:i},d)).filter(d=>
    (TAB==="全部"||TAB==="最新"||d.c===TAB) &&
    (!q||[d.n,d.w,d.c,d.e,d.d].some(x=>x.toLowerCase().includes(q)))
  );
  document.getElementById('ct').textContent=`共 ${list.length} 位`;
  const wrap=document.getElementById('tl-wrap');
  if(TAB==="最新"){
    const items=list.slice().sort((a,b)=>b._i-a._i);
    wrap.innerHTML=`<div class="era-block">
<div class="era-head">
  <div class="era-label">按收录顺序 · 最新在前</div>
  <span class="era-count">${items.length}位</span>
  <div class="era-line"></div>
</div>
<div class="era-cards">
  ${items.map(d=>`<a class="tl-card" href="/i/${encodeURIComponent(slugOf(d.n))}/">
    <div class="tl-year">${d.e}</div>
    <div class="tl-name">${d.n}</div>
    <span class="tl-word">${d.w}</span>
  </a>`).join('')}
</div>
</div>`;
    return;
  }
  wrap.innerHTML=ERAS.map(era=>{
    const items=list.filter(d=>d.y>=era.min&&d.y<era.max).sort((a,b)=>a.y-b.y);
    if(!items.length)return'';
    return`<div class="era-block">
<div class="era-head">
  <div class="era-label">${era.label}</div>
  <span class="era-count">${items.length}位</span>
  <div class="era-line"></div>
</div>
<div class="era-cards">
  ${items.map(d=>`<a class="tl-card" href="/i/${encodeURIComponent(slugOf(d.n))}/">
    <div class="tl-year">${d.e}</div>
    <div class="tl-name">${d.n}</div>
    <span class="tl-word">${d.w}</span>
  </a>`).join('')}
</div>
</div>`;

const DQX={"做点新东西，不要随大流。":"他人生五条准则的第一条。随大流的问题不在于错，在于即便对了，收益也早被分完了——优势只存在于还没有人站的地方。","和你能找到的最聪明的人在一起，然后放手让他们做。":"两个动作缺一不可。只招不放，等于花大价钱买来一群执行者；而放手比招人难得多，因为它要求你承认自己不是最强的那个。","我是模型先生，不做基本面分析。模型的好处之一，是它能降低风险。":"放弃理解，换来不被自己的故事欺骗。他的收益不来自看得更准，来自把判断这一环从流程里整个删掉。","如果你花在选股上的时间比挑一台冰箱还少，那你活该亏钱。":"一句刺人的对照：买冰箱会比价、查参数、看评测，买股票却靠一条消息。投入的注意力和金额完全不成比例。","如果你每年花13分钟研究宏观经济，那你就浪费了10分钟。":"不是说宏观不重要，是说它不可预测且不可行动。把时间投进一个无法转化为决策的变量，是最隐蔽的浪费。","在股市里最重要的器官是胃，不是脑子。":"判断的门槛远低于承受的门槛。多数人不是没看对，是在看对的位置上被波动摇了出去。","翻的石头越多，找到的东西越多。":"他全部方法的底座，也是最难抄的一条：超额收益来自调研次数，而次数是体力活，不是洞察力。","让人对你有所期待，胜过让人看清你的底。":"已知的能力会被定价，未知的能力才有溢价。一次把实力放满的人，从此只能按那个标准被要求。","不要把话说尽，也不要把事做绝：留下退路，是智者最后的体面。":"留退路不是怯懦，是承认自己会判断错。把话说死的人，等于赌自己永远不需要改口。","凡事都有一个把手，抓住对的那一个，就能推动任何人。":"比《影响力》早了三百多年的同一个洞察，而且更冷：每个人身上都有一处可施力的位置，找错了就是白费劲。","第一流的能力，是知道什么时候不用它。":"能力和调用能力是两件事。逢事必出手的人，会把自己变成一个随时可以被消耗的资源。","宁可与聪明人为敌，不与愚人为友。":"敌人的水平决定你的上限，同伴的水平决定你的成本。和糊涂人相处，光是解释就会吃掉你全部的时间。","国家之所以失败，是因为攫取性制度无法创造激励，让人们去储蓄、投资和创新。":"全书的结论句。穷不是因为人懒或笨，是因为在那套规则下，努力的人拿不到努力的结果。","创造性破坏重新分配的不只是收入和财富，还有政治权力":"这才是创新被压制的真正原因。既得利益者反对的从来不是新技术，是新技术带来的重新洗牌。","繁荣的根源不是自然资源、地理位置或文化传统，而是制度。":"一次性排除了三种最流行的解释。资源可以是诅咒，地理两边相同，文化同宗同源——只剩规则不一样。","贫穷不是因为不知道该怎么做，而是因为掌权者不愿意那样做。":"把发展问题从技术层拽回权力层。好政策的设计从来不难，难在它会削弱正在受益的那批人。","我从不被理论指导。我只问一个问题：这行得通吗？":"极端实用主义的代价与红利都在这句里：他因此避开了所有意识形态陷阱，也因此难以被任何一套价值观辩护。","如果你付花生米的工资，你请到的就只能是猴子。":"把廉洁做成理性选择，而不是道德要求。任何需要人性高尚才能运转的制度，长期都会失效。","我们是一条必须融入鱼群的小鱼。":"弱者的生存策略不是变强，是让自己不值得被单独挑出来。孤立是小国和小公司真正的死因。","在被爱戴和被畏惧之间，我一直认为马基雅维利是对的":"他极少数一次公开的价值观表态。值得注意的是他说的是「被畏惧」，不是「被讨厌」——两者的成本天差地别。","我不在乎民调，我在乎的是三十年后这个国家还在不在。":"长期主义的真实形态：不是有耐心，是愿意在自己的任期内承担骂名，把成果留给一个自己看不到的时点。","机器不打仗，地形不打仗。人打仗。你必须进入人的头脑里去。":"把竞争的目标从对手的资产改成对手的判断。装备和阵地都只是变量，真正的战场在对方怎么理解局面。","你可以选择成为某个人，也可以选择做成某件事。总有一天，你必须在这两条路之间选一条。":"他给每个年轻军官讲的岔路。两条路在早期看起来完全重合，等你发现它们分开时，通常已经选过了。","混乱、无序和不确定，不是要消除的东西":"对克劳塞维茨「摩擦」的一次反转：既然迷雾无法清除，就别浪费力气清除它，把它定向输送给对手。","如果你的循环快过对手，那么他做的每一个反应，都是在应对一个已经消失的世界。":"速度优势的真正杀伤力不在快，在于让对手的每一次正确决策都自动过期。他不是被打败，是自己乱掉的。","百战百胜，非善之善者也；不战而屈人之兵，善之善者也。":"打赢一百次也是一百次消耗。孙子的标准不是胜率，是代价——最好的胜利不在战场上产生，而在对方算完得失后自己放弃。谈判和竞争同理：逼对方算清楚，比逼对方认输便宜得多。","知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆。":"三种状态对应三种胜率，最该注意的是中间那档：只知己不知彼是五五开，等于把结果交给运气。多数人败在只做了一半功课，就以为自己准备好了。","兵无常势，水无常形，能因敌变化而取胜者，谓之神。":"「神」不是算无遗策，是不带预设方案入场。凡是把上一次赢的打法当模板的，都在等一个必然到来的失败。","胜兵先胜而后求战，败兵先战而后求胜。":"顺序决定生死：赢家先把胜负条件凑齐再开打，输家先开打再想办法赢。所有临场翻盘的故事，都是幸存者偏差。","上兵伐谋，其次伐交，其次伐兵，其下攻城。":"一张四级成本表，越往下越贵：攻心最便宜，攻城最贵。真正的问题是，人的本能恰好是从最贵的那一层开始。","战略上藐视敌人，战术上重视敌人。":"两个层次不能串台：战略上怕，就不敢下场；战术上不怕，就会轻敌送命。而多数人恰好反着来——战略上盲目乐观，战术上畏首畏尾。","集中优势兵力，各个歼灭敌人。":"弱者唯一能赢的方式：全局劣势不重要，只要每一次局部交手你都是多打少。资源不够的时候不要摊开，要叠起来。","存地失人，人地皆失；存人失地，人地皆存。":"地会再长出来，人不会。凡是为了保住阵地、面子或估值而把人打光的，最后两样都留不住。","打得赢就打，打不赢就跑。":"听着像取巧，其实最难：它要求你随时诚实评估自己打不打得赢，并且在承认不行的那一刻立刻放弃已经投入的成本。","为学日益，为道日损。损之又损，以至于无为，无为而无不为。":"两条方向相反的曲线：学知识是加法，练判断是减法。多数人一辈子只走加法那条，收集越来越多的方法，却没有能力删掉错的。","知人者智，自知者明。胜人者有力，自胜者强。":"四句里最狠的是最后三个字。赢别人靠能力，赢自己靠结构——前者有天花板，后者没有。","天下之至柔，驰骋天下之至坚。":"柔不是软弱，是不给对方着力点。硬碰硬会同时磨损两边，水不会。","破山中贼易，破心中贼难。":"外部的敌人有形状、有位置、可以调兵；内心的懒惰、傲慢和恐惧没有战场。他打赢了所有的仗，然后说难的是这个。","人须在事上磨炼做功夫，乃有益。":"反对纯粹的书房修养：道理在书房里永远成立，只有放进具体的事、具体的人、具体的利益冲突里，它才会露出你没想到的那一面。","志不立，天下无可成之事。":"不是鸡汤。没有立志的人不是不努力，而是每一次选择都缺一把尺子，于是长期看下来是随机游走。","天下古今之庸人，皆以一惰字致之；天下古今之才人，皆以一傲字致之。":"一份两栏的死亡清单：平庸的人败于懒，有才的人败于傲。越是聪明人，越该盯右边那一栏。","困心横虑，正是磨炼英雄之时。":"把难受重新定义为过程指标：正在被拧的那个时刻，恰好是能力边界正在移动的时刻。","飞鸟尽，良弓藏；狡兔死，走狗烹。":"组织不是忘恩负义，是需求变了。战时最有价值的那种能力，和平时期可能变成最大的威胁——关键是提前看见这个切换点。","陷之死地而后生，置之亡地而后存。":"极高风险的动员术：去掉退路能榨出全部潜力。但它只对本来就没有选择的人有效；主动给自己断后路的，多数只是在赌。","老骥伏枥，志在千里；烈士暮年，壮心不已。":"五十三岁写的。它的重量不在豪情，而在于承认了「暮年」这个前提之后，仍然选择不停。","非淡泊无以明志，非宁静无以致远。":"两个负向条件：不是让你清心寡欲，而是说欲望太密时人看不清自己要什么，噪音太大时人算不了远。","不伐贼，王业亦亡；惟坐而待亡，孰与伐之？":"明知打不赢还要打的理由：坐着等死和站着输是两种不同的结局。有些仗的目的不是赢，是不让局面停在必死的那一格。","仓廪实则知礼节，衣食足则知荣辱。":"道德是有物质门槛的。任何指望靠说教解决的问题，先去查一下它的生存条件够不够。","一年之计，莫如树谷；十年之计，莫如树木；终身之计，莫如树人。":"一份复利期限表：一年、十年、一生。绝大多数组织的所有动作，都停在第一栏。","生我者父母，知我者鲍子也。":"中国最著名的一句致谢。管仲从来不缺能力，缺的是在他一无所有时有人替他背书——而这恰恰是最稀缺的资源。","在别人贪婪时恐惧，在别人恐惧时贪婪。":"逆向不是唱反调，是给情绪定价：市场情绪最贵的时候资产最便宜，反之亦然。难点在于，你自己也泡在同一种情绪里。","第一，不要亏钱；第二，不要忘记第一条。":"复利的算术：亏掉50%需要涨回100%才能回本。所以第一条不是关于谨慎，是关于数学。","时间是好公司的朋友，是坏公司的敌人。":"时间会放大一切，包括缺陷。拿不住的公司不是因为拿得不够久，是本来就不该拿。","如果你不愿意持有一只股票十年，那你连十分钟都不应该持有它。":"一把过滤器：把持有期拉长到十年，大部分买入理由会自动失效——撑不过十年的理由，通常关于价格波动，而不是生意本身。","反过来想，总是反过来想。":"正面求解太难时先求反解：问「怎样才能失败得最彻底」，答案往往清晰得多，而光是避开它们就已经赢了大半。","告诉我激励是什么，我就告诉你结果会是什么。":"想改变行为，别去改口号，去改激励。所有和激励设置相反的道德要求，长期都会输。","以合理价格买入卓越公司，远胜于以便宜价格买入普通公司。":"从「捡烟蒂」进化到「买质量」的那一步：便宜的东西通常有便宜的理由，而优秀的公司会自己长大，替你修正买入价上的误差。","我没有权利拥有一个我无法反驳的观点。":"一条极高的发言门槛：你必须能把反方立场讲得比反方还好，才算真正拥有这个观点。否则你只是复述了一个偏好。","如果我知道我会在哪里死，我就永远不会去那里。":"反向思考的极简版：先列出所有确定的死法，然后用一辈子绕开它们。不需要预测未来，只需要标出雷区。","扩张中不忘谨慎，谨慎中不忘扩张。":"两个相反的动作必须同时在场。只扩张的死于现金流，只谨慎的死于错过窗口——难的是在同一时刻做两件互相矛盾的事。","好景时不过分乐观；不好景时不过度悲观。":"情绪的减震器。顺境里的乐观和逆境里的悲观，都会让你在最坏的时点做出最大的动作。","第一个桶一定要扎实，才好放第二个桶。":"第一桶金的意义不在金额，在于它验证了你的方法有效。方法还没验证就上杠杆，等于在放大一个未知数。","现金流是企业生存的氧气。":"利润是观点，现金是事实。企业不会因为不赚钱倒闭，只会因为付不出钱倒闭。","简单比复杂更难。你必须努力理清思路，让它变得简单。":"复杂是偷懒的产物——把所有可能性都留着，就不必做判断。简单要求你先彻底想明白，然后承担删掉的风险。","专注意味着对一百个其他好主意说不。":"专注真正的成本不是拒绝坏主意，是拒绝好主意。难的从来是那一百个都成立的选项。","设计不仅仅是外观和感受。设计是产品如何工作。":"把「设计」从表层挪到结构层。看起来的样子只是结果，决定体验的是它究竟怎么运转。","延迟满足感程度在不同量级的人是没法有效讨论问题的。":"一句冷酷的判断：这不是能力差异，是时间尺度差异。尺度不同的两个人讨论同一件事，只会各说各话。","创业公司最大的竞争优势是执行力，不是创意。":"创意的稀缺性被严重高估了。同一个想法此刻正同时出现在很多人脑子里，分胜负的是谁先把它做出来、并且做对。","做对的事情和把事情做对是两回事。":"两个不同的维度：方向错的时候，效率越高死得越快。先确认在做对的事，再谈怎么把它做好。","不管什么错误，越早改正损失越小。":"沉没成本的解药：改正的代价随时间指数上升，而不是线性。发现错了的那一刻，就是最便宜的时刻。","物理学是定律，其他一切都是建议。":"第一性原理的入口：把所有「行业惯例」「大家都这么做」降级为建议，只承认物理约束是硬的。","努力成为有用的人。做有用的事，对别人，对这个世界。":"一个极朴素的效用标准，用来对抗那些「看起来重要」的事。有用是可以验证的，重要往往不能。","80%的时间用在创造上。":"时间分配就是战略。会议、汇报、协调都必要，但它们只搬运已有的东西，不产生新的。","我们永远处于公司即将倒闭的边缘。":"一句维持了三十年的自我暗示。它的作用不是制造焦虑，是防止组织把当下的领先误当成安全。","苦难是一份礼物，我希望每个人都有机会经历。":"有争议的一句。他的意思是韧性只能在真实的困难里长出来，而不是说困难本身有什么价值。","如果你们没有失败过，你们其实还没有真正开始。":"失败率为零，说明你只做了确定能做成的事——而确定的事通常没有超额回报。","我们想要一辆会飞的汽车，得到的却是140个字符。":"对一整个时代的指控：资本涌向了容易的软件创新，而难的、物理世界里的东西进展缓慢。","做得最好的企业是那些不竞争的企业。":"竞争会把利润磨到零。真正赚钱的公司都在做别人没做的事——垄断不是结果，是起点。","你在哪个重要问题上，与大多数人的观点相反？":"他的面试题。一个只能私下回答的问题，因为如果大家都同意，它就不再是秘密了。","活下去，是华为最朴素的目标，也是最高的目标。":"最低目标和最高目标是同一个。听起来消极，实际是把所有战略动作都拉回同一个约束条件下检验。","华为没有成功，只有成长。":"拒绝给自己定性。一旦承认成功，组织就会开始保护已有的东西，而不是继续生长。","十年来我天天思考的都是失败，对成功视而不见，也没有什么荣誉感、自豪感，而是危机感。":"把危机感做成制度，而不是情绪。它要求组织把注意力永久性地放在「哪里可能塌」，而不是「我们赢了什么」。","未来是无序的。这是活着最好的时代，几乎所有你自认了解的东西都是错的。":"1997年的判断。它的价值不在预言准不准，而在提醒你：你确信的大部分东西，来自一套即将过期的旧结构。","暴力的成本和收益决定了人类社会的结构。":"一把解释历史的钥匙：社会形态由「施加暴力的成本」决定。技术一旦改变这个成本，社会结构就跟着变。","如果说人工智能是共产主义的，那么加密技术就是自由主义的。":"一句极简的技术政治学：AI天然中心化、集中权力，加密天然分散、对抗权力。而这两样正在同时到来。","臣愿封留足矣，不敢当三万户。":"功成之后主动要小地方，而不是要三万户。他把「封赏」看成风险敞口：赏越大，越显眼，越接近清算名单的前排。","愿弃人间事，欲从赤松子游耳。":"退出的话术。他没有说不干了，说的是要去修仙——给权力一个体面的台阶，比直接辞职安全得多。","臣方外之人，不以官为念。":"同样是退，李泌用的是「我本来就不是体制内的人」。不进入身份，就不必参与身份的争夺。","明主之所导制其臣者，二柄而已矣。二柄者，刑德也。":"把管理压缩成两个动作：赏和罚。韩非的冷酷之处在于，他认为这两样一旦交出去，君主就什么都不是了。","以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。":"三面镜子对应三种反馈源：自己、历史、他人。最难的是第三面——因为它需要有人敢说，也需要你敢听。","我唯一知道的，是我什么都不知道。":"不是谦虚，是认识论的起点。他去问雅典最聪明的人，发现他们都以为自己懂；他不懂，但他知道自己不懂——这个差别决定了谁还能继续学。","未经审视的人生不值得过。":"法庭上的最后陈述。他的意思是：你的价值观如果没有被自己检验过，你过的就是别人的人生。","我不是雅典人，也不是希腊人，我是世界公民。":"公元前五世纪说出「世界公民」。在城邦即身份的年代，这句话等于主动放弃了最大的一层保护。","你有权控制你的思想，而非外部事件。认识到这一点，你便拥有了力量。":"斯多葛的核心操作：力量不来自改变外部，来自认清哪些根本不归你管，然后把全部资源投到归你管的那部分。","你浪费的每一刻，都是别人拼命想要的时间。":"时间是唯一不可再生的资源，而它的稀缺性只在失去时才显形。这句话是让你提前感受那个稀缺。","对于不在你掌控之内的事，不要浪费精力。":"注意力是有限的。为不可控的事消耗情绪，本质上是在挪用你本该用于可控之事的资源。","最好的复仇，是不要变得和对方一样。":"以牙还牙的隐性代价是：你会变成对方那样的人。他给出的替代方案不是原谅，是不被对方定义。","君主必须同时是狮子和狐狸。狮子不知道陷阱，狐狸不能抵御狼群。":"两种能力缺一不可：狮子有力量但看不见陷阱，狐狸能识破陷阱但打不过狼。只强不智，或只智不强，都会死。","人们对伤害的记忆，比对好处的记忆更久。":"一条不对称的人性定律：伤害在记忆里的半衰期远长于恩惠。所以施恩要持续，伤害要一次到位或者根本不做。","命运是我们行动的一半，另一半由我们自己掌控。":"一半一半的世界观。既反对宿命论，也反对全能感——你能掌控的只有你那一半，但那一半必须做满。","极度开放地接受现实，极度诚实地面对自己。":"两个「极度」是一套配对：只对外开放不对己诚实，会变成好好先生；只对己诚实不对外开放，会变成偏执。","失败不是坏事，从失败中不学习才是。":"把失败从结果重新定义为原料。真正致命的不是亏损本身，是同一个亏损重复出现。","现实+对现实的接受=成功的机器。":"一个把主观愿望排除在外的公式。「接受」是最难的那一项——大多数人卡在不肯承认现实是这样。","脆弱的对立面不是强健，而是反脆弱。":"他造了一个词，因为原来的词汇里没有：强健只是扛住冲击，反脆弱是从冲击里获益。绝大多数系统只做到了前者。","风会熄灭蜡烛，却使篝火越烧越旺。对随机性、不确定性和混沌也一样：你需要拥抱它们，而不是逃避它们。":"同一阵风，对蜡烛和篝火的作用完全相反。差别不在风，在于你的结构是消耗型还是供给型。","没有皮肤在场的建议，是毫无意义的噪音。":"检验建议的唯一标准：给建议的人是否承担后果。不承担后果的判断，无论多有道理，都只是噪音。","预测未来是愚蠢的，为不可预测的未来做准备才是智慧。":"把重心从「预测」挪到「配置」。预测的准确率无法提升，但抗打击的结构可以设计。","财富是你睡觉时也在为你工作的资产。":"财富和收入的分水岭：一个在你睡觉时继续工作，一个在你停下时立刻归零。","如果你的收入按小时计算，你永远不会真正富有。":"按小时计价的本质是把时间零售出去，而时间的库存是固定的。这决定了它的天花板不由你的能力决定。","代码和媒体是这个时代不需要许可的杠杆。":"和资本、人力不同，代码和媒体的复制成本为零，且不需要任何人批准。这是普通人这个时代唯一免费的杠杆。","在你认为是玩、别人认为是工作的地方，找你的特定知识。":"寻找特定知识的方法：在你觉得是玩、别人觉得是苦工的地方，你的投入产出比天然比所有人高。","幸福不靠追求，靠移除障碍。":"把幸福从「获得」改成「减少」。追求的对象会不断后退，而障碍是有限的、可以逐一清理的。","大多数人为了逃避真正的思考，愿意做任何事情。":"一句刺人的观察：思考很痛苦，所以人会用忙碌、开会、刷手机来替代它，并且觉得自己很努力。","选择做正确的事情，而不是容易的事情。":"两条路每天都在分岔，而容易的那条通常伪装成「更现实」。区分它们的方法是问：我是在解决问题，还是在回避不适？","我们赢不是因为烧得比别人猛，是因为活得比别人久。":"补贴战的终局判断。烧钱决定谁跑得快，效率决定谁活得久——而最后一个还站着的人拿走全部。","士为知己者死，女为悦己者容。":"最早的「知遇」定价。它揭示了一种非货币的激励：被真正看见的人，愿意付出金钱买不到的东西。","狡兔有三窟，仅得免其死耳。":"冯谖给孟尝君设计的结构：不是一个后路，是三个。单一备份等于没有备份，这是两千年前的冗余设计。","父母之爱子，则为之计深远。":"触龙说赵太后的核心一句。真正的爱是替对方安排长期的位置，而不是给他眼前的舒服。","见兔而顾犬，未为晚也；亡羊而补牢，未为迟也。":"两个「未晚」是这句话的重点：它反对的不是犯错，是发现错了之后因为羞耻而不动手。","学而不思则罔，思而不学则殆。":"两个失效模式：只学不想会淹没在信息里，只想不学会困在自己的循环里。多数人常年偏在其中一边。","知之者不如好之者，好之者不如乐之者。":"三级动力：知道、喜欢、享受。前两级要靠意志维持，第三级不需要——长期竞争最后拼的是这个。","君子和而不同，小人同而不和。":"一条关于团队的判据：能容纳分歧的一致才是真的，靠消灭分歧换来的一致最脆弱。","吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？":"关键在「日」字。它把反省从偶发的顿悟变成每天的例行动作——曾国藩的日记，本质上是这句话的执行版。","君子固穷，小人穷斯滥矣。":"逆境是照妖镜。人的下限不在顺境里显形，只在被逼到墙角的时候露出来。看人要看这一刻。","智人统治地球，不是因为最强壮或最聪明，而是因为唯一能相信共同虚构的动物。":"整本书的核心论断：让人类形成超大规模协作的，不是力量或智力，而是相信不存在之物的能力——国家、货币、公司都是。","农业革命是历史上最大的骗局。":"最反直觉的一章：从物种角度农业是巨大成功，从个体角度它带来了更长的劳动、更差的营养和更多的疾病。指标选错，结论就反了。","能力的提升并不必然带来幸福的提升。":"技术曲线和幸福曲线没有绑定。这句话是整本书对「进步」这个词最大的保留。","我们创造的神，反过来控制了我们。":"虚构是工具，但工具会反过来定义使用者。货币、KPI、公司都经历过这个反转。","力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！":"垓下绝唱。值得注意的是他到最后关心的仍是「时」和「虞姬」，而不是自己哪一步走错了。","此天之亡我，非战之罪也。":"他至死没有归因到自己。这句话是整个知识库里最典型的一次外部归因——也是他失败的真正原因。","纵江东父兄怜而王我，我何面目见之？":"面子成了最后一道关。可以东山再起的条件全部具备，唯一缺的是接受自己已经输了的能力。","我本淮右布衣，天下于我何加焉。":"称帝之后仍然强调布衣出身。它既是自信，也是一种统治技术：出身越低，越能证明结果全靠自己。","天下之事，不难于立法，而难于法之必行。":"变法者的共同发现：立法是技术问题，执行是权力问题。张居正的考成法，就是专门为后半句造的。","竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。":"贬谪路上遇雨。它的力量在于「轻胜马」三个字——没有马的人说骑马不如走路，而且是真心的。","回首向来萧瑟处，归去，也无风雨也无晴。":"回望的姿态。不是雨过天晴，是连晴和雨的分别都消失了——这比乐观高一个层级。","古之成大事者，不惟有超世之才，亦必有坚忍不拔之志。":"给「有志」加了一个前提：才华是入场券，坚忍才是决定名次的东西。这两样他都不缺，所以说得出口。","凡杀不死我的，必使我更强大。":"被引用最多也被误用最多的一句。原意不是苦难有益，而是能被你消化的冲击会转化成结构——消化不了的会直接摧毁你。","每个不曾起舞的日子，都是对生命的辜负。":"针对的是把生活过成待办清单的人。舞蹈在这里代表一切没有产出、却证明你还活着的行为。","人之所以伟大，在于他是桥梁，而非目的。":"人的价值在于「正在通向什么」，而不是「已经是什么」。这句话取消了所有终点式的自我定义。","你必须有混沌，才能诞生一颗闪耀的星。":"创造的前提是先容忍无序。过早追求整齐的人，得到的通常是平庸的秩序。","人类所有的一切都可以被剥夺，唯有人类最后的自由":"集中营里得出的结论：外部可以剥夺一切，唯独不能替你选择态度。这是控制二分法最极端的一次实证。","如果生命有意义，那么苦难也有意义。":"他把逻辑倒过来用：如果承认生命有意义，就必须承认苦难也在意义之内，否则意义会在最需要它的时候失效。","我比任何人都更清楚地意识到我可能是错的。":"顶级投机者的自我定位。他的优势不是判断更准，而是纠错更快——前提是先承认自己会错。","如果投资是有趣的，如果你玩得开心，你可能没有赚到钱。真正的投资是枯燥的。":"刺激感和收益率是负相关的。让你兴奋的交易通常在满足情绪，而不是在赚钱。","我之所以富有，是因为我知道自己什么时候是错的。":"财富的来源被他归给了纠错能力，而不是预测能力。这是他和大多数人对「投资高手」理解的根本分歧。","人类是行走的触发器，很少有真正理性的决策。":"整本书的前提：人的大部分决策由固定的触发模式驱动，理性只在事后负责编理由。","最好的防御：放慢速度，问自己为什么要做这个决定。":"唯一有效的防御是时间。所有影响力技术都依赖于让你立刻决定——一旦慢下来，多数就失效了。","优秀的管理，正是导致领导企业失败的原因。":"最反直觉的结论：不是管理不善导致失败，恰恰是「听客户的、投高利润项目」这些正确动作，把资源系统性地挡在了新市场之外。","破坏性技术不是从最好的客户那里产生，而是从被忽视的客户那里产生。":"新技术最初总是更差、更便宜、利润更薄，因此最好的客户不会要它。等他们要的时候，你已经来不及了。","倾听客户的声音，可能是你能犯的最大错误。":"这句话不是反对听客户，是提醒你：客户只能告诉你他们已知的需求，而颠覆总是从他们说不清的地方开始。","成功企业的最大威胁，往往来自它们最不关注的市场。":"威胁的来源和你的注意力分布是反比的。你越不关注的市场，越没有防御，也越没有预警。","袁绍多端寡要，好谋无决，难成大事。":"郭嘉对袁绍的四字判词。「好谋无决」是最致命的一条——想得多而定不下来，等于把时间免费送给对手。","哀哉奉孝！痛哉奉孝！惜哉奉孝！":"曹操在赤壁战败后的哭喊。它的意义不在悼念，在于承认了一个人的判断力对整个组织意味着什么。","清空你的思维，无形无态，像水一样。水可以流动，也可以冲击。做水吧，我的朋友。":"最广为流传的一句。水的关键不是柔，是没有固定形状——它随容器成形，却始终是水。方法可以变，内核不能。","吸收有用的，去除无用的，加入自己独特的。":"三步学习法：吸收、去除、独创。多数人只做第一步，于是收藏了一堆别人的方法，没有一样是自己的。","认识自我是所有知识中最重要的。":"所有「吸收有用的」都以这句为前提——不知道自己是谁，就无法判断什么对你有用。","不要在脑子里想太多，用感觉去打。":"针对的是过度分析。在需要临场反应的场合，思考是延迟；只有已经内化进身体的东西才用得上。","如果你花太多时间思考一件事，你就永远无法完成它。":"完美主义的解药。想得越久，行动的门槛被自己抬得越高，最后卡在启动这一步。","我不怕一个练了一万种踢法的人，我怕一个把同一种踢法练了一万次的人。":"一万种和一万次的差别。前者是广度的幻觉，后者是深度的复利——真正的威胁永远来自后者。","人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。":"司马迁受宫刑后活下去的理由。他把死的意义交给了「用之所趋」——不是死本身，是你为什么而死。","究天人之际，通古今之变，成一家之言。":"他给自己定的三个目标：理解规律、看清变化、写出判断。最后一句最勇敢——他承认自己有立场，然后诚实地写出来。","天下熙熙，皆为利来；天下攘攘，皆为利往。":"在重农抑商的年代承认逐利是常态。这不是讽刺，是他为商业行为做的正名。","才德全尽谓之圣人，才德兼亡谓之愚人，德胜才谓之君子，才胜德谓之小人。":"司马光的用人四象限。最重要的判断是：德胜才可用，才胜德最危险——因为能力会放大品行的方向。","臣闻天子之职莫大于礼，礼莫大于分，分莫大于名。":"整部《资治通鉴》的开篇立论。名分不是虚礼，是秩序的最小单位——名一乱，后面全乱。","成为你希望在世界上看到的改变。":"最常被印在海报上、也最常被误解的一句。它的重点不是号召别人，是把改变的起点强行拉回自己身上。","非暴力是人类可以支配的最强大的力量，它比人类发明的最强大的武器更强大。":"非暴力在他这里不是道德姿态，是策略：它让施暴者失去正当性，把对抗的战场从力量转移到舆论。","先他们忽视你，然后他们嘲笑你，然后他们攻击你，然后你赢了。":"一条运动的四阶段路线图。它真正的用处是在第二、三阶段——被嘲笑和被攻击时，知道这是进度而不是失败。","弱者永远无法宽恕，宽恕是强者的特质。":"宽恕被他重新定义为强者的特权：只有不再需要靠仇恨支撑自己的人，才付得起宽恕的成本。","眼睛还牙齿，只会让整个世界都变瞎。":"报复的数学结果。对等报复看似公平，但它没有终止条件——每一轮都合理，整体走向毁灭。","想象力比知识更重要，因为知识是有限的，而想象力包围着整个世界。":"知识是存量，想象力是生成能力。前者有边界，后者没有——这是他给创造力排的序。","如果你无法简单地解释它，说明你还没有真正理解它。":"检验理解的唯一标准。讲不简单，通常不是听众的问题，是你自己还停在术语层面。","我没有特别的才华，我只是有强烈的好奇心。":"他把自己的成就归因于好奇心而非天赋。这不是谦虚——好奇心是可以选择的，天赋不是。","逻辑会把你从A带到B，想象力能带你去任何地方。":"逻辑负责验证，想象负责提出。只有逻辑的人永远走不出已知的范围。","上帝不掷骰子。（他对量子力学概率解释的抗议":"他一生最著名的一次判断失误。这句话值得记住的是：即使是他，也会因为审美偏好而拒绝正确的理论。","我不知道第三次世界大战会用什么武器打，但第四次世界大战一定是用石头和棍子打的。":"关于核武器最冷的一句预言。它不预测战争，它预测的是文明可以被打回原点。","治世不一道，便国不法古。":"变法的合法性宣言：治理没有唯一正确的方法，对国家有利就不必效法古人。这句话的代价是他自己的命。","利不百，不变法；功不十，不易器。":"变法者少有的克制：收益不到百倍不改法，不到十倍不换工具。改革本身是有成本的，随便改比不改更坏。","宁为乡村第一，不为罗马第二。":"路过一个小镇时说的。它揭示了一种偏好：宁可在小池塘做主导者，也不在大池塘做从属——因为主导权才能积累。","当我走出监狱大门，我知道如果我不能把悲痛和仇恨留在身后，我就仍然是个囚徒。":"走出监狱那天的自述。这句话把「自由」重新定义为一种内在状态——牢门打开不等于出狱。","教育是可以改变世界的最强大武器。":"他把教育当成武器而非福利。因为教育改变的是下一代的选择集，这是唯一不可逆的改变。","仇恨就像喝下毒药，却期待对方死去。":"仇恨的代谢逻辑：它伤害的是持有它的那个人，而对象往往毫无察觉。","勇敢不是没有恐惧，而是判断还有比恐惧更重要的事情。":"勇敢的定义被他改写：不是消除恐惧，是在恐惧仍然存在时，判断出有更重要的事。","战略是决定在哪里作战，战术是决定怎么作战。":"两个层级不能混：选错战场，战术再好也只是把败仗打得漂亮一点。多数人的努力都花在下面那一层。","一个好的将军，胜在最后五分钟还能思考清楚。":"混乱中保持思考的能力，比任何计划都值钱。因为所有计划都会在接触敌人后的第五分钟失效。","今日胜昨日之我，明日胜不如我者":"两条不同的标尺：和昨天的自己比是纵向，和不如自己的人比是横向。他把纵向放在前面。","不执着于一种武器，不执着于一种思想。":"反对路径依赖的极简表述。武器和思想一样，一旦成为身份的一部分，就会开始限制你。","兵法之道，即万事万物之道。":"他把剑术升格为通用方法论：任何一门技艺练到底，得到的都不是技巧，而是处理不确定性的方式。","以千日之功，磨一日之锋。":"千日与一日的比例，就是准备和发挥的真实配比。真正的较量早在那一天之前就分出了胜负。","空者，无形无相，不可捉摸，却包容万物。":"《五轮书》最后一卷。「空」不是虚无，是不预设——留出空位，才能装下当下真实发生的东西。","吾生也有涯，而知也无涯。以有涯随无涯，殆已。":"常被断章取义成劝学，原意恰好相反：知识无限而生命有限，用有限追无限是危险的。重点是选择，不是勤奋。","人皆知有用之用，而莫知无用之用也。":"无用之用的经济学：所有留白、闲置和看似浪费的部分，恰恰是系统抗压和转向的余量。","井蛙不可以语于海者，拘于虚也；夏虫不可以语于冰者，笃于时也。":"两种认知牢笼：空间的和时间的。而被困住的人无法意识到自己被困——这才是这句话真正的锋利处。","君子之交淡若水，小人之交甘若醴。":"关系的浓度和寿命成反比。太甜的开始通常靠情绪支撑，而情绪是会退潮的。","相濡以沫，不如相忘于江湖。":"最被误读成凉薄的一句。它说的是：与其在困境里互相消耗以维系关系，不如各自回到能自由呼吸的地方。","至人之用心若镜，不将不迎，应而不藏，故能胜物而不伤。":"心如镜的三个动作：不迎、不留、不藏。镜子照物但不占有物，所以永远不会被它照过的东西损伤。","权，借物也，召之即来，挥之即去。":"郭子仪对权力的定性：它是借来的东西，不是你的资产。凡是把借来的当自己的人，都在等归还的那一天。","如果你想说服别人，要诉诸利益，而非诉诸理性。":"说服的第一原理。诉诸理性是在要求对方否定自己，诉诸利益是给对方一个改变立场的台阶。","不要把今天能做的事拖到明天。":"他把这条写进了每日清单。它的价值不在勤奋，在于拖延会让任务的成本随时间上升。","有些人25岁就死了，只是到75岁才埋。":"最锋利的一句。它区分了「活着」和「在过日子」——很多人在某个时点停止了更新，之后只是在重复。","市场短期是投票机，长期是称重机。":"整个价值投资的地基：短期价格由人气决定，长期价格由内在价值决定。所有痛苦都来自把两者的时间尺度搞混。","聪明的投资者是现实主义者，他们向乐观主义者卖出股票，并从悲观主义者手中买进股票。":"交易的对手盘永远是情绪。他把买卖双方描述成两种情绪状态，而你的收益就来自这两种情绪的差值。","你是对的，是因为你的数据和推理是对的":"这句话切断了「市场认可」和「判断正确」之间的联系。对错由证据决定，而不是由是否被人同意决定。","投资者最大的敌人，很可能就是他自己。":"敌人不在市场里，在你自己的反应模式里。这也是为什么方法可以公开，收益却无法复制。","牛市是普通投资者亏损的主要原因。":"反直觉但可验证：牛市让人误以为收益来自能力，于是加杠杆、放宽标准，最终在下一轮全部还回去。","华尔街没有新鲜事，因为投机像山岳一样古老。":"人性不变，所以模式重复。这句话既是安慰也是警告——历史会重演，包括你上次犯的那个错。","赚大钱靠的不是思考，而是坐功。能同时做到判断正确又坚持不动的人极为罕见。":"「坐功」两个字是全书重点。判断正确只是入场券，能在正确的判断上一动不动，才是收益的真正来源。","市场永远不会错，只有人的判断会错。":"市场没有义务符合你的逻辑。当两者冲突时，需要修改的永远是你的判断，而不是等市场认错。","投机者的致命敌人是：无知、贪婪、恐惧和希望。":"四个敌人里最隐蔽的是「希望」——它让人在应该止损的时候继续持有，并称之为坚持。","一个人若不犯错，一个月内就能拥有整个世界；但他若不从错误中吸取教训，就连一样东西也留不住。":"两句连读才完整：犯错不致命，不从错误里提取教训才致命。前者是学费，后者是复购。","我们对显而易见的事视而不见，而且对自己的视而不见也视而不见。":"双重盲区：看不见，且不知道自己看不见。这是所有认知偏差里最难自救的一种。","任何事都不如你正在想它时显得那么重要。":"聚焦错觉。任何被你正在思考的事情，都会自动获得夸大的重要性——所以重大决定不要在情绪现场做。","自信是一种感觉，它反映的是故事的连贯性，而不是证据的质量。":"自信被拆穿了：它衡量的是故事讲得顺不顺，而不是证据够不够。讲得越顺，越该警惕。","人类的大脑是一台急于下结论的机器。":"系统1的默认行为是用现有信息拼出一个完整故事，而不是承认信息不足。缺失的部分它会自己补。","要相信别人比你更容易看清你的错误。":"旁观者没有你的自我保护机制。这句话的实用价值是：主动去找那个会直说的人，并且不要反驳他。","群体中累积的只有愚蠢，而不是天生的智慧。":"群体的智力不做加法。它取的是下限而不是平均，因为能被所有人接受的，只有最简单的那一层。","群体不善推理，却急于采取行动。":"群体最危险的组合：判断力下降的同时行动力上升。这解释了绝大多数集体性灾难。","影响大众想象力的，不是事实本身，而是它呈现的方式。":"传播的关键在形式而非事实。同一个事实换一种呈现方式，效果可以相反——这既是宣传术，也是防御的起点。","群体因为夸大自己的感情，所以只会被极端感情打动。":"群体的情绪没有中间档。温和、复杂、有保留的表达在群体里传不动，只有极端的能传开。","做作和辞藻华丽的东西对群体的影响，远胜逻辑。":"对逻辑最不客气的一句。它提醒你：在面向大众的场合，讲道理往往输给讲得好听。","你的利润率就是我的机会。":"对亚马逊商业模式最精炼的概括。他人的高毛利被他视为一片尚未被效率打穿的空白地。","聪明是一种天赋，而善良是一种选择。":"天赋不需要负责，选择需要。这句话把善良从性格问题挪到了责任问题。","如果你把眼光放到未来三年，和你竞争的人很多；如果你能看到未来七年，和你竞争的人就很少了。":"时间维度就是竞争壁垒。看得越远，愿意陪你走的对手越少，因为大部分组织无法承受那么长的不确定。","要以传教士的心态创业，而不是雇佣兵的心态。":"两种动机在顺境里看不出差别，只在长期低谷时分化：传教士留下来，雇佣兵会离开。","失败和发明是一对不可分割的双胞胎。":"发明的成功率天然很低，所以想要更多发明，只能先接受更多失败。想两者兼得的组织最后什么都没有。","系统的行为，不能只靠了解构成它的元素来理解。":"整本书的第一原理：把每个元素都研究透，仍然预测不了系统的行为——因为行为产生于连接方式，不是元素本身。","人们凭直觉就能找到杠杆点……然后所有人都在拼命朝错误的方向推。":"人的直觉能找到关键杠杆点，但推的方向常常是反的。这是全书最具反讽意味的一句。","我们无法控制系统，也无法彻底搞懂它。但我们可以与它共舞。":"她给出的不是控制方案，是相处方案。承认系统不可完全掌控，反而是有效干预的起点。","对于一个坏政府来说，最危险的时刻通常就是它开始改革的时刻。":"托克维尔最著名的判断：改革释放了希望，希望改变了忍耐的基准线。这既是历史规律，也是任何组织变革的风险提示。","被革命摧毁的政权，几乎总是比它前面的那个政权更好。":"革命的悖论：被推翻的往往是那个已经开始松动、变好的政权，而不是最坏的那个。","人们耐心忍受着苦难，以为这是不可避免的；可是一旦有人提出可以摆脱它，这苦难就立刻变得无法忍受。":"忍耐力不取决于苦难的绝对量，而取决于是否存在可替代的想象。一旦出现替代方案，原来的处境立刻不可接受。","战争无非是政治用另一种手段的延续。":"《战争论》最重要的一句。它把战争降级为工具——一旦脱离政治目的，军事上的胜利可以毫无意义。","战争中的一切都很简单，但最简单的事也是困难的；这些困难累积起来，就产生了一种摩擦。":"「摩擦」是他造的概念：单个动作都不难，难的是在真实世界里累积起来的阻力。这解释了所有计划为什么会走样。","战争是不确定性的王国。行动所依据的东西，有四分之三笼罩在或大或小的迷雾之中。":"四分之三笼罩在迷雾里。这个比例是他给指挥官的心理准备——决策永远在信息不足的条件下做出。","约束对手的能力，往往取决于约束自己的能力。":"承诺的悖论：让自己失去选择，反而增加了对别人的约束力。烧掉退路是一种谈判资产。","威慑的力量不在于拥有毁灭的能力，而在于让对方相信你会使用它。":"威慑的真正门槛不是能力，是可信度。所有威慑失败都失败在对方不相信你真的会执行。","有一种威胁把一部分结果交给了偶然":"他称之为「留有余地的威胁」。把结果部分交给偶然，反而比明确的承诺更有威慑力——因为对方无法赌你的理性。","凡百贸易均着不得欺字，药业关系性命，尤为万不可欺。":"胡庆余堂的「戒欺」匾额，他亲笔所撰。值得注意的是：他在经营上说到做到，但在结构上给自己留了致命的杠杆。","我们的晚餐并非来自屠夫、酿酒师或面包师的恩惠，而是出于他们对自身利益的考虑。":"整本《国富论》最有名的一句。它不是在赞美自私，而是在指出：可靠的协作建立在利益一致上，而不是善意上。","同行的人很少聚在一起，哪怕只是为了娱乐消遣，但他们的谈话最后总是以合谋对付公众、或是密谋抬高价格告终。":"斯密对商人的警惕远超后世对他的印象。反垄断的思想源头就在这句话里。","消费是一切生产的唯一目的，而生产者的利益，只有在能促进消费者利益时才应当被照顾。":"一句被后世不断忽略的立场声明：生产者的利益不是目的，只有当它服务于消费者时才值得保护。","困扰人的不是事情本身，而是人们对事情的看法。":"认知行为疗法的源头。事件是中性的，痛苦产生在事件和「这对我很糟」这个判断之间——而判断是可以修改的。","有些事在我们能力之内，有些不在。在我们能力之内的是判断、意图、欲望和厌恶":"《手册》开篇第一句。几乎所有痛苦都来自把第二类误当成第一类，练习就是持续地重新分类归位。","不要说「我失去了它」，要说「我把它还回去了」。":"把「拥有」换成「保管」。这不是叫人冷漠，是把珍惜和占有分开——占有的人一失去就崩，保管的人失去了还完整。","你可以锁住我的腿，但连宙斯也夺不走我的意志。":"面对暴君威胁时的回答。它划出了那条谁也越不过的界线：身体可以被支配，判断不能。","智不足与权变，勇不足以决断，仁不能以取予，强不能有所守，虽欲学吾术，终不告之矣。":"他收学生的四条门槛，缺一样就不教。前两条决定你能不能赚到，后两条决定你能不能留住——多数人死在后两条。","吾治生产，犹伊尹、吕尚之谋，孙吴用兵，商鞅行法是也。":"在重农抑商的战国说这句话，是一次身份宣言：经商是有原理、有纪律、可以传授的技艺，不是投机取巧。","如果我们被踢出去，董事会找来一个新 CEO，他会怎么做？那我们为什么不自己走出这扇门，再走回来，然后自己干这件事？":"英特尔转型时他问安迪·摩尔的那句话。它的作用是强行剥离沉没成本——用新CEO的视角，看你自己今天该做什么。","坏消息传播得越快，越有可能被处理。":"组织健康度的核心指标。坏消息的传播速度，决定了你在问题变成灾难之前还剩多少时间。","经理人的产出，等于他直接管辖的组织的产出，加上他间接影响的组织的产出。":"他给管理者产出下的定义。它否定了「我自己很忙」这种自我安慰——你的产出不在你手上，在别人手上。","战略转折点到来时，它看起来只是一个糟糕的季度。":"最难的地方在于它的伪装。真正的转折点不会宣布自己到来，它看起来只是运气不好的一个季度。","泡沫时期的浪费，是社会为快速建成新基础设施所支付的代价。":"对泡沫最不带道德判断的一句解释。铁路、光纤、算力都是这样铺出来的——钱亏掉了，基础设施留下来了。","每一次技术革命，都要先经历一场金融狂热，才能到达它的黄金时代。":"她的两阶段模型：狂热期负责融资和铺设，黄金期负责普及和收获。跳过前者，后者不会到来。","技术革命需要二三十年的动荡，才能完成对社会制度的重塑。":"技术本身几年就成熟，难的是制度、组织和习惯跟上来——这个时差就是二三十年动荡的来源。","我们也许永远不知道要去往何方，但最好明白我们身在何处。":"他对「预测」和「定位」的切割。预测未来做不到，但判断当下处在周期哪一格是可以做到的。","买得好，比买好的更重要。":"把注意力从标的质量挪到买入价格。再好的资产，买贵了也会变成差投资——这是他和成长派最大的分歧。","投资中最危险的一句话是：这次不一样。":"周期的每一次顶部都伴随这句话。它的出现本身，就是最可靠的过热信号。","风险不是波动，风险是永久性损失的可能。":"对风险的重新定义。波动会自己恢复，永久性损失不会——把两者混为一谈，是大多数风险模型的根本错误。","没有人会因为你不挥棒而判你出局。":"借棒球说仓位。市场不强迫你出手，空仓不算失误——但大多数人受不了长期不动。","下不欺于地，中不欺于人，上不欺于天。":"《长乐老自叙》里的自我辩护。三个「不欺」回避了最关键的一条：对君主的忠。这正是后世骂他的地方。","此时百姓，佛再出救不得，惟皇帝救得。":"契丹灭晋后他对耶律德光说的话。用奉承换生民，是他最被认可的一次操作，也是他全部争议的浓缩。","但知行好事，莫要问前程。":"他一生的行事准则。它可以理解为务实的善，也可以理解为对是非的回避——这正是冯道难评的原因。","菩提本无树，明镜亦非台，本来无一物，何处惹尘埃。":"针对神秀的「时时勤拂拭」而作。他的主张是：本来就没有需要擦的东西，问题不在灰尘，在于你认为有镜子。","佛法在世间，不离世间觉；离世觅菩提，恰如求兔角。":"禅宗最重要的一次落地。修行不在别处，就在日常之中——离开世间去找觉悟，等于找兔子的角。","不是风动，不是幡动，仁者心动。":"风幡之争。他把争论从外部现象拉回观察者本身——你争的从来不是事实，是你对事实的反应。","于诸境上心不染，曰无念。":"「无念」不是没有念头，是念头经过而不沾附。这和斯多葛的「不将不迎」是同一种心法。","前念迷即凡夫，后念悟即佛。":"顿悟的时间尺度：不是多年苦修，是一个念头的转向。这也意味着，它随时可以发生，也随时可能退回去。","口者，心之门户也；心者，神之主也。":"把嘴定义成门，而不是出口。门的意义在于可开可关，而多数人的门一直敞着——你说出去的每一句，都在替对方描绘你的内部结构。","与智者言依于博，与拙者言依于辨，与辨者言依于要，与贵者言依于势。":"同一件事对四种人有四种讲法。它不是圆滑，是承认：内容能不能被接住，取决于对方的接口，而不是取决于你讲得对不对。","事贵制人，而不贵见制于人。":"全书的落点。主动权不在于谁说得多，在于谁定义议题、谁掌握节奏、谁决定什么时候结束这一局。","故知之始己，自知而后知人也。":"读人的顺序是从自己开始。看不清自己的动机和偏好，读到的所有人都会被自己的投影污染一遍。","我们的美德常常只是伪装起来的恶德。":"他不是说美德不存在，是说别用行为反推动机。一个人一贯大方，只证明大方对他划算；环境一变，划算的方向就变了。","我们都有足够的力量去忍受别人的不幸。":"全书最冷的一句。它解释了为什么安慰总显得轻飘，也解释了真正的支持为什么稀缺——它要求人付出自己本不必付出的代价。","拒绝赞美，其实是想被赞美第二次。":"很多看起来是退让的动作，本质是加价。识别方法很简单：看这个动作有没有给对方留下一个必须回应的空位。","自爱是世上最大的谄媚者，它比世上最巧妙的人还要巧妙。":"自爱不断向你汇报你是个什么样的人，而汇报的内容永远对你有利。它比任何外部的奉承都更难察觉，因为它用的是你自己的声音。","创业只有一个致命错误：做了没有人想要的东西。":"其余所有问题都是可以修的。融资顺利、团队豪华、发布会漂亮，都无法补偿这一条；而这一条成立，别的错误大多还有时间改。","先去做那些无法规模化的事，这是通往规模的唯一路径。":"早期的低效不是浪费。在确认有人真的想要之前，任何自动增长的机器都只是一个昂贵的假设。","与其让很多人有点喜欢你，不如让很少的人非常爱你。":"一百个爱你的用户会告诉你为什么爱、替你传播、容忍你的粗糙；一万个觉得还行的用户只会安静消失，什么都不留下。","最好的创业想法是：你自己想要、你自己能做，而别人没意识到它值得做。":"三条缺一条都危险：不是自己想要就判断不了细节，做不了就只能空想，别人都觉得值得做的地方早就挤满了。","一个会议，可以毁掉一整个下午。":"损失的不是那一小时，是整个下午——因为剩下的两段都不够长到重新进入状态。时间的价值不在总量，在连续性。","松下电器是制造人才的公司，兼做电器生意。":"这句话被无数公司抄成标语，但他是当真的：他把培养判断力当成主产品，把电器当成副产品，然后按这个顺序分配资源。","生意人的使命，是让宝贵的生活物资像自来水一样取之不尽、用之不竭。":"使命一旦定到这个程度，很多具体争论就自动有了答案——该不该降价、该不该走量，不需要每次重新讨论一遍。","我有三个恩惠：家贫、体弱、没上过学。":"三样都是短板：家贫让他知道钱怎么来，体弱逼他授权，没学历逼他请教。短板本身不值钱，把短板转成组织能力才值钱。","越是不景气的时候，越要靠经营的力量。":"顺境掩盖一切经营问题，逆境把它们全部显影。所以萧条不是要熬过去的坏天气，是一次强制体检。","有限游戏以取胜为目的，无限游戏以延续游戏为目的。":"全书的地基。把无限游戏当有限游戏打的人，会在赢的那一天忽然不知道该干什么——因为他一直在为一个不存在的终点做准备。","有限游戏的参与者在边界内游戏，无限游戏的参与者与边界游戏。":"两种关系：一种把规则当前提，一种把规则当对象。所有真正的突破都发生在第二种人身上。","有限游戏的参与者为了权力而参赛，无限游戏的参与者凭借力量而参赛。":"权力是别人给你的头衔，可以被收回；力量不需要承认，也无法被剥夺。头衔换掉之后还剩下的，才是后者。","有限游戏的规则不可改变，无限游戏的规则必须改变。":"最锋利的一条。所有「我们一直是这么做的」，都是在把一个本来无限的游戏，悄悄降级成一个会结束的游戏。","各族群的历史循着不同的轨迹展开，是环境的差异，而不是人的生物学差异。":"整本书的论点，也是一条归因纪律：看到巨大的结果差距，先往回退两步找初始条件，而不是停在人的素质上。","可驯化的动物都是相似的，每一种不可驯化的动物各有各的不可驯化之处。":"成功需要所有条件同时满足，失败只需要缺一样。这条「安娜·卡列尼娜原则」在驯化之外同样成立。","征服美洲的主力不是枪炮，而是随征服者一起到达的病菌。":"最反直觉也最确凿的一条。看得见的武器往往不是胜负手，真正起决定作用的力量通常不在现场被看见。","历史上最大的那些模式，是由各大陆环境的差异塑造的。":"尺度越大，个人和文化的解释力越弱，结构性条件的解释力越强。这也是他和制度学派争论的真正焦点。"};

// 打散出处：把每个出处的 k 条按 N/k 的步长在「环」上均匀布点（序列会循环，
// 所以必须按环处理，否则最大的组会同时占住首尾两端）。确定性，无随机。
function dqInterleave(list){
  const g=new Map();
  list.forEach(q=>{if(!g.has(q.n))g.set(q.n,[]);g.get(q.n).push(q);});
  const groups=[...g.entries()].sort((a,b)=>b[1].length-a[1].length||(a[0]<b[0]?-1:a[0]>b[0]?1:0));
  const N=list.length,out=new Array(N).fill(null);
  let cursor=0;
  for(const e of groups){
    const arr=e[1],k=arr.length,step=N/k;
    for(let j=0;j<k;j++){
      const want=Math.round(cursor+j*step)%N;
      let p=want,d=0;
      while(out[p]!==null){d++;p=(want+(d%2?(d+1)/2:-d/2)+N*2)%N;}   // 就近找空位，左右交替
      out[p]=arr[j];
    }
    cursor=(cursor+1)%N;
  }
  // 环形收尾：若仍有相邻同出处，与一个安全位置对调
  for(let i=0;i<N;i++){
    const a=out[i],b=out[(i+1)%N];
    if(a.n!==b.n)continue;
    for(let d=2;d<N;d++){
      const j=(i+d)%N,pv=out[(j-1+N)%N],nx=out[(j+1)%N];
      if(pv.n===b.n||nx.n===b.n)continue;
      const pb=out[i],nb=out[(i+2)%N];
      if(out[j].n===pb.n||out[j].n===nb.n)continue;
      const t=out[(i+1)%N];out[(i+1)%N]=out[j];out[j]=t;break;
    }
  }
  return out;
}

function dqCharWrap(text,px,maxW,ls){

      if(DQ_NOEND.indexOf(lc)>=0&&cur.length>1){cur=cur.slice(0,-1);out.push(cur);cur=lc+ch;w=_dqW(c,cur,ls);}
      else{out.push(cur);cur=ch;w=cw;}
      hung=false;
    }else{cur+=ch;w+=cw;}
  }
  if(cur)out.push(cur);
  return out;
}
// 按逗号/分号/句号等切成意群，再贪心装行——断行只落在标点处
const DQ_BRK="，。；！？、：…,;.!?";
function dqClauses(t){
  const out=[];let cur="";
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if(DQ_BRK.indexOf(t[i])>=0&&DQ_BRK.indexOf(t[i+1]||"")<0){out.push(cur);cur="";}
  }
  if(cur)out.push(cur);
  return out;
}
function dqLines(text,px,maxW,ls){
  const c=_dqCtx(px),out=[];let cur="";out.split=false;
  const push=seg=>{
    if(_dqW(c,seg,ls)<=maxW){out.push(seg);return;}
    out.split=true;
    for(const l of dqCharWrap(seg,px,maxW,ls))out.push(l);
  };
  for(const seg of dqClauses(text)){
    if(!cur){cur=seg;continue;}
    if(_dqW(c,cur+seg,ls)<=maxW){cur+=seg;}
    else{push(cur);cur=seg;}
  }
  if(cur)push(cur);
  return out;
}
// 版面高度预算：注眉之下 → 落款之上；放不下就降一档字号
const DQ_SIZES=[.086,.080,.075,.070,.066,.062,.058,.054,.050,.046,.042];
const DQ_LHMAX=1.40;                      // 行距上限（行间距 ≤0.40em）
// 版心：注眉之下 → logo 之上
function dqBand(){
  const W=1080,H=1440;
  return {W:W,H:H,top:Math.round(W*.11)+Math.round(W*.03)+W*.05,
          bot:H-H*.11-Math.round(W*.06*732/447)-Math.round(W*.06)};
}
function dqLayout(d){
  const B=dqBand(),W=B.W,maxW=W-Math.round(W*.09)*2;
  const core=d.t.replace(/[。，、；：？！…\.]+$/,"");
  const dup=core===d.w||(d.w.length>=2&&core.indexOf(d.w)>=0&&core.length<=d.w.length+3);
  const hd=dup?"":d.w,headSize=hd?dqHeadSize(hd.length):0;
  const hb=B.top+(headSize?Math.round(W*headSize)*.95+W*.07:0);
  let clean=null,fit=null,last=null;
  for(const size of DQ_SIZES){
    const px=Math.round(W*size);
    if(maxW/(px*1.02)<4)continue;
    const lines=dqLines(d.t,px,maxW,px*.017),lh=dqLh(px);
    const end=hb+px*.9+(lines.length-1)*px*lh+px*.28;
    const cand={size:size,px:px,lh:lh,lines:lines,end:end};
    last=cand;
    if(end<=B.bot){ if(!fit)fit=cand; if(!lines.split){clean=cand;break;} }
  }
  const c=clean||fit||last,n=c.lines.length;
  // 自适应行距：字号与断行都不动，只把行距撑到版心的 92%
  const fixed=(hb-B.top)+c.px*.9+c.px*.28;
  if(n>1)c.lh=Math.min(DQ_LHMAX,Math.max(c.lh,(( B.bot-B.top)*.92-fixed)/((n-1)*c.px)));
  c.end=B.top+fixed+(n-1)*c.px*c.lh;
  c.off=Math.max(0,(B.bot-c.end)/2);
  c.head=hd;c.headSize=headSize;c.src=dqSrcName(d.n);c.d=d;
  c.fill=(c.end-B.top)/(B.bot-B.top);
  return c;
}
// 只保留「撑得起卡片」的金句：渲染后至少 3 行。字体加载完成后重算一次。
function dqBuildPool(){
  const keep=DQ_ALL.filter(q=>dqLayout(q).lines.length>=3);
  DQ=dqInterleave(keep.length>=40?keep:DQ_ALL);
  DQ_I=dqToday();
}
// 本地日历日 → 每天 00:00 换句；步长与池大小互质则整轮不重复
function dqDayNum(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
// 序列本身已按出处铺匀，按日顺序走即可继承其最小间隔；整轮不重复
function dqToday(){return DQ.length?Math.floor(Math.random()*DQ.length):0;}
let DQ_I=0;
function dqCur(){const c=dqLayout(DQ[DQ_I]);c.p=DQ_PAL[DQ_I%DQ_PAL.length];return c;}
function dqRender(){
  if(!DQ.length)return;

  dqDraw(document.getElementById("dqCv").getContext("2d"),s);
  document.getElementById("dqSR").textContent=s.d.c+"｜"+(s.head?s.head+"｜":"")+s.d.t+"——"+s.src+(DQX[s.d.t]?"。"+DQX[s.d.t]:"");
  const dt=new Date();
  document.getElementById("dqDate").textContent=dt.getFullYear()+"."+String(dt.getMonth()+1).padStart(2,"0")+"."+String(dt.getDate()).padStart(2,"0");
  const ob=document.getElementById("dqOpen");ob.textContent=s.src;ob.href='/i/'+encodeURIComponent(slugOf(s.d.n))+'/';
  document.getElementById("dqCat").textContent=s.d.c+" · "+s.d.w;

  nt.textContent=ex;nt.style.display=ex?"":"none";
}
function dqStep(k){
  if(!DQ.length)return;

}
// 版式与 gen.py renderCard 完全一致：顶对齐、PADX=9%W、PADY=11%W、落款基线=H-11%H
function dqDraw(x,s){
  const W=1080,H=1440,PADX=Math.round(W*.09),PADY=Math.round(W*.11),FOOT=Math.round(H-H*.11);
  x.clearRect(0,0,W,H);
  x.fillStyle=s.p[0];x.fillRect(0,0,W,H);
  const id=x.getImageData(0,0,W,H),dd=id.data;
  for(let i=0;i<dd.length;i+=4){if(Math.random()<.06){const k=Math.random()*22|0;dd[i]-=k;dd[i+1]-=k;dd[i+2]-=k;}}
  x.putImageData(id,0,0);
  const draw=(t,px2,py,size,ls,col)=>{x.font=size+'px '+DQ_FONT;x.fillStyle=col;x.textBaseline="alphabetic";
    let cx=px2;for(const ch of t){x.fillText(ch,cx,py);cx+=x.measureText(ch).width+ls;}return cx-px2-ls;};
  const kick=Math.round(W*.03),head=s.head?Math.round(W*s.headSize):0,srcS=Math.round(W*.045);
  let y=PADY+kick;
  draw(s.d.c,PADX,y,kick,kick*.37,s.p[3]);
  y+=W*.05+s.off;
  let hb=y+head*.95;
  if(s.head){draw(s.head,PADX,hb,head,head*.07,s.p[1]);hb+=W*.07;}
  let qy=hb+s.px*.9;
  for(const ln of s.lines){draw(ln,PADX,qy,s.px,s.px*.017,s.p[1]);qy+=s.px*s.lh;}
  x.font=srcS+'px '+DQ_FONT;
  let sw=0;for(const ch of s.src)sw+=x.measureText(ch).width+srcS*.04;sw-=srcS*.04;
  draw(s.src,W-PADX-sw,FOOT,srcS,srcS*.04,s.p[3]);
  const lw=Math.round(W*.048),footFs=Math.round(W*.034),mid=FOOT-Math.round(srcS*.36);
  let bx=PADX;
  if(dqLogoOK){x.globalAlpha=.92;x.drawImage(dqLogoImg,bx,mid-lw/2,lw,lw);x.globalAlpha=1;bx+=lw+Math.round(W*.016);}

<!--GEO:BODY:START--><noscript><section id="geo-index"><h1>人类世界生存法则 — 100 个人物与典籍的生存智慧，跨越 2600 年</h1><p>一个关于「世界到底怎么运转」的知识库：战略、财富、权力、人性、创业，取自 100 位人物与典籍，跨越 2600 年。每一条都写清楚这个人真正留下的那一个想法、背后的故事、拆开的分则与例子，以及今天怎么用。</p><p>按主题浏览： <a href="https://ourword.ai/t/industrial-age/">工业时代</a> · <a href="https://ourword.ai/t/modern/">现代</a> · <a href="https://ourword.ai/t/classical-era/">先秦与古典时代</a> · <a href="https://ourword.ai/t/power/">权力·治理</a> · <a href="https://ourword.ai/t/startups/">创业·产品</a> · <a href="https://ourword.ai/t/classics/">典籍·洞见</a> · <a href="https://ourword.ai/t/human-nature/">处世·人性</a> · <a href="https://ourword.ai/t/mind/">心智·哲学</a> · <a href="https://ourword.ai/t/strategy/">战略·博弈</a> · <a href="https://ourword.ai/t/wealth/">财富·投资</a> · <a href="https://ourword.ai/t/early-modern/">近世</a> · <a href="https://ourword.ai/t/han-wei/">秦汉至魏晋</a> · <a href="https://ourword.ai/t/medieval/">中古</a></p><ul><li><a href="https://ourword.ai/i/sovereign-individual/">主权个人</a> — 主权个人（1997年·戴维森&amp;莫格）——数字主权。1997年出版，比特币诞生早了11年。两位作者用「暴力经济学」解释了人类社会的全部历史：谁控制暴力，谁就控制财富。他们预言了加密货币、远程工作、数字游民、国家权力衰退。</li><li><a href="https://ourword.ai/i/crowd/">乌合之众</a> — 乌合之众（法·1895年）——群体心理的操作系统。古斯塔夫·勒庞著，群体心理学的开山之作。写于法国大革命后百年、大众时代来临前夜，一百多年来被政治家、革命者、广告人、操盘手反复研读——据说墨索里尼倒背如流，罗斯福床头常备。核心论断冷酷而精确：个体一旦进入群体，智力被拉平向下，情绪相互传染，责任感因匿名而消失——「群体中累积的只有</li><li><a href="https://ourword.ai/i/jobs/">乔布斯</a> — 乔布斯（当代·1955-2011）——极简。苹果联合创始人，被迫离开苹果，在NeXT和皮克斯度过12年，然后回来把濒死的苹果变成了全球最有价值的公司。他的思想核心是：简单比复杂更难，专注意味着说不，设计是产品如何工作而不只是外观。</li><li><a href="https://ourword.ai/i/sapiens/">人类简史</a> — 人类简史（2011年·赫拉利）——虚构。以色列历史学家尤瓦尔·赫拉利用一本书重新解释了人类6万年的历史。核心论点惊人简洁：智人能统治地球，不是因为最强壮或最聪明，而是因为唯一能相信「虚构」的动物——金钱、国家、宗教、法律、公司，都是集体想象出来的「虚构」。这些虚构让陌生人能够大规模合作，这才是人类最危险的武器。</li><li><a href="https://ourword.ai/i/ren-zhengfei/">任正非</a> — 任正非（当代·1944-）——韧。1987年，43岁，用2万元创立华为，从交换机代理商起步。30多年后，华为是全球最大电信设备商。他的管理思想：自我批判是组织免疫系统，以客户为中心是组织的北极星。</li><li><a href="https://ourword.ai/i/paul-graham/">保罗·格雷厄姆</a> — 保罗·格雷厄姆（美国·1964年—）——做不可规模化的事。Lisp 黑客，1995 年做出 Viaweb——世界上第一个跑在浏览器里的商用软件，1998 年卖给雅虎。2005 年和几个人办了 Y Combinator，用「一次投一批、给小钱、给三个月」的方式重写了早期投资的形态，Airbnb、Stripe、Dropbox 都从这里出来。</li><li><a href="https://ourword.ai/i/bismarck/">俾斯麦</a> — 俾斯麦（普鲁士·1815—1898）——联盟几何。把欧洲当成一道几何题来做的人。他不追求友谊，追求让三方同时离不开你。打败丹麦、奥地利、法国三场战争之后，他反而停下，用联盟把德意志固住。拿破仑赢在打，他赢在停。</li><li><a href="https://ourword.ai/i/huineng/">六祖慧能</a> — 六祖慧能（唐·638-713）——自性顿悟。一个不识字的岭南樵夫，成为禅宗第六代祖师。由他讲述、门人记录的《六祖坛经》，是唯一一部被中国人尊称为「经」的本土著述（「经」本应专指佛陀所说）。他做的事本质上是一次极端的减法：把佛教从浩繁的经论、渐进的阶梯、寺院的建制里拆出来，还原成一句话——你要找的东西本来就在你身上，问题只是</li><li><a href="https://ourword.ai/i/feng-dao/">冯道</a> — 冯道（五代·882-954）——十朝元老。中国历史上最难评价的一个人。历经后唐、后晋、后汉、后周四朝，服务过十位皇帝（包括入主中原的契丹皇帝耶律德光），几乎每一朝都居宰相之位，每一次改朝换代都安然过渡，享年七十三，善终。欧阳修骂他「不知廉耻」，司马光斥他「奸臣之尤」；但在他活着的时代，「当世之士无贤愚，皆仰道为元老，而喜</li><li><a href="https://ourword.ai/i/caesar/">凯撒</a> — 凯撒（罗马·前100-前44）——渡河。罗马最著名的将军与独裁者，「骰子已经掷出」是他最著名的一句话。从一个负债累累的贵族子弟，到征服高卢、赢得内战、成为罗马终身独裁官——他用二十年走完了这条路。他死于元老院，被他以为信任的人刺杀。他是拿破仑的精神前辈，西方历史上「权力崛起与崩溃」最完整的弧线之一。</li><li><a href="https://ourword.ai/i/liu-bang/">刘邦</a> — 刘邦（汉·前256-前195）——用人。历史上最著名的「草根逆袭」案例。起点：一个基层官吏。终点：汉朝开国皇帝。他的唯一技能是「用人」——不是最聪明的，不是最能打的，但最擅长让比他强的人为他效力。</li><li><a href="https://ourword.ai/i/innovators-dilemma/">创新者的窘境</a> — 创新者的窘境（1997年·克里斯坦森）——颠覆。克莱顿·克里斯坦森提出了商业史上最重要的问题之一：为什么优秀的公司会失败？不是因为懒惰或愚蠢，而是因为它们做了所有「正确」的事——听取最好客户的意见，投资利润最高的产品，专注于最大的市场。恰恰是这些「正确决策」，让它们对破坏性技术视而不见。</li><li><a href="https://ourword.ai/i/livermore/">利弗莫尔</a> — 利弗莫尔（美·1877-1940年）——趋势为友·败于人性。杰西·利弗莫尔，史上最传奇的投机客，《股票作手回忆录》的原型。14岁在对赌行起家，一生四次破产、四次东山再起：1907年做空大赚，摩根亲自请他停止打压市场；1929年大崩盘中做空赚一亿美元（相当于今天数十亿），成为全世界最富有的人之一。他发明的趋势跟踪、关键点交易、金字塔加码，至</li><li><a href="https://ourword.ai/i/records-of-the-grand-historian/">史记</a> — 史记（西汉·前104-前91）——究。司马迁因李陵事件受宫刑，在极度屈辱中完成了这部书。130篇，52万字，记录了从黄帝到汉武帝约3000年的历史——但他写的不是帝王的丰功伟绩，而是人。他是中国历史上第一个为商人立传（货殖列传）、为游侠立传、为刺客立传的史学家。在一个「皇帝写历史」的时代，他坚持让事实和判断都进入记录</li><li><a href="https://ourword.ai/i/sima-yi/">司马懿</a> — 司马懿（三国·179-251）——忍。熬过曹操、曹丕、曹叡、曹芳四代，在70岁时发动高平陵之变，一夜夺取曹魏实际控制权。他用一生证明：在长期博弈里，活得最久的那个人赢。</li><li><a href="https://ourword.ai/i/simons/">吉姆·西蒙斯</a> — 吉姆·西蒙斯（美国·1938-2024）——概率优势。数学家出身——23岁拿到博士，在MIT和哈佛教书，为国防部破译过冷战密码，与陈省身合作提出「陈-西蒙斯理论」，这是他在数学史上的位置，和投资毫无关系。他48岁才全职做投资，创立文艺复兴科技。旗舰的大奖章基金1988年至今费前年化约66%，在收取5%管理费和44%业绩提成之后仍有约</li><li><a href="https://ourword.ai/i/hayek/">哈耶克</a> — 哈耶克（奥—英·1899—1992）——分散知识。把「计划为什么会系统性算错」写成经济学的人。不是因为计划者懒，是因为做计划所需的知识，散落在成千上万个当事人头里。价格是这些知识的传输协议。他和凯恩斯辩了一辈子，胜的不是口才，是这一条知识论。</li><li><a href="https://ourword.ai/i/shang-yang/">商鞅</a> — 商鞅（战国·前390-前338）——立信。秦国变法的设计者与执行者，中国历史上最彻底的制度改革家。他用两次变法把一个积贫积弱的边陲小国，改造成了横扫六合的战争机器。他的代价：车裂而死。但他定下的规矩，在他死后一百年仍然运行，最终帮助秦国统一了天下。「人死制度存」——这是改革者里最好的结局，也是最悲壮的结局。</li><li><a href="https://ourword.ai/i/why-nations-fail/">国家为什么会失败</a> — 国家为什么会失败（美国·2012年）——制度决定论。达龙·阿西莫格鲁与詹姆斯·罗宾逊2012年出版。核心论点极其简洁：国家的贫富不取决于地理、气候、文化，也不取决于领导人聪不聪明，只取决于制度是「包容性」还是「攫取性」。2024年，两位作者与西蒙·约翰逊因这一系列关于制度与繁荣的研究，获得诺贝尔经济学奖。这本书最大的价值不在结论，</li><li><a href="https://ourword.ai/i/wealth-of-nations/">国富论</a> — 国富论（英国·1776）——看不见的手。亚当·斯密（1723-1790）是格拉斯哥大学的道德哲学教授，不是经济学家——那时还没有这门学科。《国富论》1776年3月出版，和美国《独立宣言》同一年，全名是《国民财富的性质和原因的研究》。他一生只写了两本书：1759年的《道德情操论》讲人的同情心，十七年后的《国富论》讲人的自</li><li><a href="https://ourword.ai/i/taleb/">塔勒布</a> — 塔勒布（当代·1960-）——反脆弱。黎巴嫩人，前期权交易员，后成为风险理论家。他亲眼见证了黎巴嫩内战、1987年股灾、2008年金融危机，从真实的极端事件里提炼出一套关于「不确定性」的完整哲学。他最重要的洞察：我们建立的大多数系统是脆弱的——一旦遇到意外就崩溃，而我们应该建立的是「反脆弱」的系统——从意外中变得更强</li><li><a href="https://ourword.ai/i/sun-tzu/">孙子兵法</a> — 孙子兵法（春秋·前500年前后）——先胜后战。十三篇，中国最重要的战略体系，2500年来被兵家、商家、政治家反复研读。孙子的核心逻辑是：赢家在开战前就确保了胜利，失败者是先打再想怎么赢。这不是在说运气，是在说准备的深度决定结果的高度。孙子本人凭此书被吴王重用，以三万兵破楚国二十万，攻入楚国都城郢。</li><li><a href="https://ourword.ai/i/mencius/">孟子</a> — 孟子（战国·前372—前289）——得民。孔子之后最能把儒家写成统治操作系统的人。他不把「仁」当成德行标语，而是当成权力能不能续上的约束条件：税、兵、杀人权一旦失据，政权先空再垮。周游列国而不遇合，这份清醒没换来官位，却把「民为贵」写成了后世治国者躲不掉的警句。</li><li><a href="https://ourword.ai/i/grove/">安迪·格鲁夫</a> — 安迪·格鲁夫（美国·1936-2016）——战略转折点。英特尔第三号员工、第四任 CEO。接手时英特尔是一家被日本人打到墙角的内存公司，卸任时是全球最大的芯片公司，市值增长约 30 倍。他真正的贡献不是造芯片，是把「一家已经赢了的公司如何不死」写成了方法论——《只有偏执狂才能生存》讲战略转折点，《高产出管理》是今天所有 OKR 与一对</li><li><a href="https://ourword.ai/i/musashi/">宫本武藏</a> — 宫本武藏（日本·1584-1645）——无二。日本历史上最著名的剑客，一生参与超过60场决斗，从无败绩。13岁第一次决斗，60岁写下《五轮书》。他不只是武艺高超，而是把剑道升华为一套完整的人生哲学——「兵法之道，即万事万物之道」。他影响了日本此后四百年的武士文化、商业哲学和管理思想，被称为「剑圣」。他和李小龙跨越三百年，说的</li><li><a href="https://ourword.ai/i/franklin/">富兰克林</a> — 富兰克林（美·1706-1790年）——十三美德·复利人生。本杰明·富兰克林，人类历史上罕见的「全栈人生」：印刷工出身，17岁身无分文闯费城，42岁靠印刷生意实现财务自由后退休，转身成为科学家（电学）、发明家（避雷针、双焦眼镜）、作家（《穷理查年鉴》）、外交家（促成法国援美）、开国元勋（唯一在独立宣言、美法同盟、巴黎和约、宪法四大文件上都</li><li><a href="https://ourword.ai/i/nietzsche/">尼采</a> — 尼采（德国·1844-1900）——超越。最被误读的哲学家。纳粹用他的「超人」理论为种族主义背书——但他本人极度厌恶反犹太主义，和姐姐决裂正是因为这个原因。他真正说的是：人能够超越「群众道德」成为「创造自己价值的人」。他10岁丧父，身体极度虚弱，几乎一生在病痛中度过，最终44岁精神崩溃——却在此之前写下了西方哲学史上最有</li><li><a href="https://ourword.ai/i/buffett/">巴菲特</a> — 巴菲特（当代·1930-）——护城河。奥马哈的神奇老人，用60年把10000美元变成了一个千亿美元帝国。他的方法：找到有护城河的好公司，以合理价格买入，然后长期持有。他最大的竞争优势不是选股技能，而是情绪控制。</li><li><a href="https://ourword.ai/i/zhuangzi/">庄子</a> — 庄子（战国·约前369-前286年）——逍遥齐物。名周，宋国蒙人，道家第二座高峰。老子讲柔弱胜刚强，是给用世者的兵法；庄子讲逍遥齐物，是给个体的精神出路。他做过漆园小吏，此后终身不仕，穷到向人借米，却拒绝了楚国相位。《庄子》三十三篇，用寓言把一件事说透：人被功名、是非、得失捆住时，如何赢回内心的自由。两千年来，中国读书人得意时读</li><li><a href="https://ourword.ai/i/frankl/">弗兰克尔</a> — 弗兰克尔（奥地利·1905-1997）——意义。心理学家，纳粹集中营幸存者，意义疗法（Logotherapy）创始人。他在奥斯维辛集中营里观察到一个现象：同样的极端条件下，有人崩溃，有人存活，差别不在于体力，而在于「有没有活下去的理由」。他的核心命题：人类最后的自由，是在任何境遇中选择自己态度的自由。</li><li><a href="https://ourword.ai/i/zhang-yiming/">张一鸣</a> — 张一鸣（当代·1983-）——延迟满足。字节跳动创始人，抖音和今日头条的缔造者。他的特点：极度理性，反对模糊，用算法驱动一切。他相信人的认知偏差是最大的效率损耗，因此把「延迟满足」和「反模糊」当成了个人和团队的核心操作系统。</li><li><a href="https://ourword.ai/i/zhang-juzheng/">张居正</a> — 张居正（明·1525-1582）——改。明朝两百七十余年，唯一一个真正做到「改变国家」的宰相。万历新政期间，他推行一条鞭法（税制改革）、考成法（官员考核）、清丈田亩——国库从亏空变为储银400万两。他活着时权倾天下，死后不到一年被清算，家破人亡。这是知识库里改革者宿命的最完整版本。</li><li><a href="https://ourword.ai/i/zhang-liang/">张良</a> — 张良（汉·前250-前186）——退。汉初三杰里最聪明的那个，也是唯一善终的那个。他的一生是三幕戏：第一幕学忍（圯上老人），第二幕用谋（鸿门宴），第三幕退场（留侯请退）。他的比较对象是韩信（不退被杀）和萧何（半退苟活），张良选择了最彻底也最优雅的路。</li><li><a href="https://ourword.ai/i/influence/">影响力</a> — 影响力（1984年·西奥迪尼）——触发。罗伯特·西奥迪尼花三年时间卧底到销售员、募捐者、广告人中间，研究说服是怎么发生的。他发现人类大脑有六个「触发器」——一旦被激活，人就会像程序一样按预设模式行动，不经过深思熟虑。了解这六个触发器，你既能识别别人对你的操控，也能更有效地影响别人。</li><li><a href="https://ourword.ai/i/drucker/">彼得·德鲁克</a> — 彼得·德鲁克（奥—美·1909—2005）——成果。把管理从「管人」改成「对成果负责」的人。他不写职位说明书，写的是： 圣吉的老师。手稿写于1993年，她2001年病逝，同事整理后于2008年出版。她的核心主张是：系统的行为由结构决定，不由参与者的意图决定——换</li><li><a href="https://ourword.ai/i/soros/">索罗斯</a> — 索罗斯（当代·1930-）——反身性。量子基金创始人，做空英镑让英格兰银行屈服，一天赚10亿美元，被称为「打垮英格兰银行的人」。但他最重要的贡献不是赚了多少钱，而是他提出了「反身性理论」——彻底颠覆了「市场总是理性的」这个主流假设。他认为：市场参与者的预期本身会影响市场走势，而市场走势又反过来影响参与者的预期——这个</li><li><a href="https://ourword.ai/i/boyd/">约翰·博伊德</a> — 约翰·博伊德（美国·1927-1997）——节奏优势。美国空军上校，外号「四十秒博伊德」——他曾公开下战书：任何飞行员，我从劣势位置起飞，四十秒之内咬到你尾后，做不到赔你40美元。据说无人赢过。他一生没当上将军，没出版过一本书（全部思想留在一份叫《制胜与失败》的讲稿里），却重塑了美国战斗机的设计标准（F-15、F-16、A-10都受</li><li><a href="https://ourword.ai/i/naval/">纳瓦尔</a> — 纳瓦尔（当代·1974-）——杠杆。AngelList联合创始人，早期投资了Twitter、Uber、Notion等公司。2018年他在Twitter上发了一个推文串「如何在不出卖灵魂的情况下致富」，在全球传播超过数百万次。他不是财务顾问，是一个在数字时代找到了「个人主权」路径的思考者。</li><li><a href="https://ourword.ai/i/hu-xueyan/">胡雪岩</a> — 胡雪岩（清·1823-1885）——靠山。晚清最著名的商人，白手起家做到大清首富，官至布政使衔、赏穿黄马褂、戴二品红顶子——「红顶商人」这个词就是为他造的。他也是中国近代第一个和外商正面打商战的人，并且输得干干净净：从巅峰到抄家，只用了两年。他的成功和失败，用的是同一套逻辑。（注意：坊间流传的大量「胡雪岩语录」出自高阳的</li><li><a href="https://ourword.ai/i/socrates/">苏格拉底</a> — 苏格拉底（古希腊·前470-前399）——无知之知。他没有留下任何文字，所有思想都通过对话流传下来。他是职业哲学家里最穷的那个，不收学费，整天在广场上问人问题。他被雅典判处死刑，罪名是「腐蚀青年」和「不敬神」——其实是因为他的问题让权贵太难堪。他可以逃跑，弟子们为他安排好了一切，他拒绝了，饮下毒芹。两千年来，他是人类史上死得最明白</li><li><a href="https://ourword.ai/i/su-shi/">苏轼</a> — 苏轼（北宋·1037-1101）——旷达。唐宋八大家之一，词、诗、文、书、画全能，同时是美食家、工程师、政治家。他被贬三次，越贬越旷达——不是被打倒了还在撑着，而是真的在最糟的处境里发现了最好的自己。黄州时写出赤壁赋、念奴娇，惠州时写「日啖荔枝三百颗，不辞长作岭南人」，逆境没有摧毁他，反而成全了他。</li><li><a href="https://ourword.ai/i/fan-li/">范蠡</a> — 范蠡（春秋战国·前536-前448）——进退。中国历史上最成功的退隐者，商圣陶朱公。他帮助越王勾践从囚徒做到春秋霸主，然后在功成之日彻底离开——改名换姓，三次迁移，三次积累巨富。</li><li><a href="https://ourword.ai/i/xunzi/">荀子</a> — 荀子（战国·前313—前238）——化性起伪。孟子讲人天然可好，荀子讲人天然可塑。「伪」不是假，是人工：礼仪、法度、师傅、反复训练，把生出来乱的材料装进可用的形状。韩非出他门下，秦制从他这里接过力。他是中国思想里最早把组织设计当成第一问题的人。</li><li><a href="https://ourword.ai/i/analects/">论语</a> — 论语（春秋·前551-前479）——仁。孔子和弟子的对话录，中国两千年来读书人的基本教材。但论语被后代统治者包装成了「听话」的哲学，实际上孔子说的很多话和这个方向相反：他辞官、周游列国、不停批评当权者。论语的核心不是礼教，是「仁」——对人真实的关怀。孔子本人是个失败的政治家，却是最成功的教育家：三千弟子，七十二贤人，他</li><li><a href="https://ourword.ai/i/zhuge-liang/">诸葛亮</a> — 诸葛亮（三国·181-234）——隆中对。「运筹帷幄」的代名词，「鞠躬尽瘁」的化身。他未出茅庐时就规划了三分天下的格局，辅佐刘备建立蜀汉，治蜀二十年法治清明，六出祁山以攻代守。</li><li><a href="https://ourword.ai/i/bezos/">贝索斯</a> — 贝索斯（美·1964年-）——飞轮效应·Day 1。杰夫·贝索斯，亚马逊创始人。1994年放弃华尔街对冲基金高薪，在车库创办网上书店，把它做成横跨电商、云计算（AWS）、物流、硬件的两万亿美元帝国。他是长期主义最极端的实践者：亚马逊连续二十年微利甚至亏损，把所有现金流砸进飞轮，被华尔街嘲讽二十年，然后赢了二十年。他的方法论——飞轮</li><li><a href="https://ourword.ai/i/zizhi-tongjian/">资治通鉴</a> — 资治通鉴（北宋·1065-1084）——鉴。司马光用19年主持编写，294卷，记录前403年到959年共1362年历史。书名由宋神宗题：「鉴于往事，有资于治道」。它是给统治者看的历史教科书，核心问题只有一个：政权为什么兴，政权为什么亡。186篇「臣光曰」是司马光的判断，精华在这里。与史记的「写人」不同，资治通鉴写的是「权力</li><li><a href="https://ourword.ai/i/dalio/">达里奥</a> — 达里奥（当代·1949-）——原则。桥水基金创始人，《原则》作者，全球规模最大的对冲基金。他在华尔街工作40年，经历了无数市场崩溃，总结出一套可复制的决策框架。他最重要的信念：所有事情都有原则，原则可以被总结，总结后可以被系统化，系统化后可以被复制。</li><li><a href="https://ourword.ai/i/tao-te-ching/">道德经</a> — 道德经（春秋·前500年前后）——损。老子五千言，是中国哲学的减法源头。与儒家「为学日益」相对，老子说「为道日损」——不断减掉，直到无为，然后无不为。道德经在西方被翻译次数仅次于圣经。</li><li><a href="https://ourword.ai/i/guo-jia/">郭嘉</a> — 郭嘉（三国·170-207）——奇。曹操最倚重的谋士，被曹操称为「吾之奇佐」。他27岁投奔曹操，此后11年，几乎每一个关键决策背后都有他的身影。官渡之战前的「十胜十败论」、袁绍死后的「急攻不如缓图」、北征乌桓时的「虚国远征」……他的判断每次都精准到令人惊叹。唯一的遗憾：38岁病逝，没有活到赤壁之战。曹操在赤壁大败后</li><li><a href="https://ourword.ai/i/guo-ziyi/">郭子仪</a> — 郭子仪（唐·697-781年）——功高不震主。唐代名将，平安史之乱、退吐蕃、抚回纥，两次收复长安，史称「再造王室」。但他真正的传奇不在战场：历玄宗、肃宗、代宗、德宗四朝，功盖天下而主不疑，位极人臣而众不嫉，富贵寿考八十五岁善终，子孙满堂。《旧唐书》的这句评语，两千年里几乎找不到第二个人配得上。韩信、岳飞、年羹尧都倒在「功高震</li><li><a href="https://ourword.ai/i/marks/">霍华德·马克斯</a> — 霍华德·马克斯（美国·1946-）——第二层思维。橡树资本创始人，管理规模逾两千亿美元，主战场是不良债权和高收益债——一门只在别人恐慌时才有生意的行当。他从 1990 年开始写投资备忘录，巴菲特说「我第一个打开来读的邮件就是霍华德的备忘录」。他的独特之处在于公开放弃了预测：不猜宏观、不猜利率、不猜明年，只做一件事——判断我们现在</li><li><a href="https://ourword.ai/i/huo-qubing/">霍去病</a> — 霍去病（汉·前140-前117）——纯粹。汉武帝外甥，17岁首战率800骑兵深入敌后歼灭2028人，19岁两次河西之战歼灭4万匈奴，22岁漠北之战深入2000里，封狼居胥山，饮马瀚海。24岁病逝。他是历史上最纯粹的燃烧型天才——把全部能量给了一件事，然后熄灭。</li><li><a href="https://ourword.ai/i/han-xin/">韩信</a> — 韩信（汉·前231-前196）——复盘。中国历史上最天才的军事家。胯下之辱，背水一战，十面埋伏——每一个都是教科书。但他的故事有两面：军事天才的崛起，和政治白痴的毁灭。</li><li><a href="https://ourword.ai/i/han-feizi/">韩非子</a> — 韩非子（战国·前280-前233）——法术势。法家集大成者，把商鞅的「法」、申不害的「术」、慎到的「势」整合为一套完整的权力理论。他是中国历史上最清醒的现实主义者——不谈应该怎样，只谈实际上怎样。他的理论直接为秦始皇统一中国提供了思想基础。最大的讽刺：他知道所有权术，却死于同学李斯的谗言。</li><li><a href="https://ourword.ai/i/xiang-yu/">项羽</a> — 项羽（楚·前232-前202）——刚。中国历史上最完美的失败者。力拔山兮气盖世，以一己之力推翻了秦朝——这件事刘邦做不到。但他最终输给了一个资质普通的沛县亭长。他的失败不是能力的失败，是认知的失败：他以为战争是强者对弱者的碾压，却不知道刘邦打的是另一种游戏——用人的游戏。</li><li><a href="https://ourword.ai/i/marcus-aurelius/">马可·奥勒留</a> — 马可·奥勒留（罗马·121-180）——克制。罗马皇帝，斯多葛哲学的最高实践者。他是人类历史上权力最大的人之一——罗马帝国皇帝，管辖六千万人，坐拥无限财富。但他每天写的笔记，是提醒自己「不要被权力腐化」的私人日记，从未打算出版。这本笔记后来叫《沉思录》，成为历史上最多领导人随身携带的书。一个手握一切的人，把全部精力用来管控自</li><li><a href="https://ourword.ai/i/machiavelli/">马基雅维利</a> — 马基雅维利（意大利·1469-1527）——现实。文艺复兴时期佛罗伦萨的外交官，《君主论》作者。他不是在教人变坏，他是第一个把政治从道德里剥离出来、单独研究的人。「马基雅维利主义」成了「不择手段」的代名词，但他的原意更复杂：他研究的是权力的真实运作规律，不管你喜不喜欢这些规律，它们都在运作。他的洞察和韩非子跨越两千年高度吻合——</li><li><a href="https://ourword.ai/i/musk/">马斯克</a> — 马斯克（当代·1971-）——第一性原理。PayPal联合创始人，特斯拉、SpaceX、Neuralink、X联合创始人或创始人。他的方法论只有一个：回到物理原点，重新推演一切。别人觉得不可能的事，他先问：物理定律允许吗？如果允许，那「不可能」只是工程问题。</li><li><a href="https://ourword.ai/i/guiguzi/">鬼谷子</a> — 鬼谷子（战国·约前400—前320年）——捭阖之道。战国纵横家的祖师，隐于鬼谷，生平不可考，只留下一部《鬼谷子》。这是中国唯一一部系统讲「如何说服一个具体的人」的典籍——不讲道德该不该，只讲话该怎么开、怎么合、怎么试、怎么锁。历代正统学者斥它为「小人之书」而不断禁毁，它却始终没有失传，因为凡是要靠说话推动别人做事的人，都绕不开它。</li><li><a href="https://ourword.ai/i/huang/">黄仁勋</a> — 黄仁勋（当代·1963-）——押注。英伟达创始人兼CEO，30年没有被赶走。他在2006年做了一个当时看来「浪费资源」的决定：开发CUDA，让GPU可以做通用计算。2023年，ChatGPT爆发，AI需要大量GPU算力，英伟达成为全球最重要的公司之一。他押注了一个能力，等了17年。</li></ul><p><a href="https://ourword.ai/all/">全部条目</a> · <a href="https://ourword.ai/llms.txt">llms.txt</a> · <a href="https://ourword.ai/llms-full.txt">llms-full.txt</a> · <a href="https://ourword.ai/sitemap.xml">sitemap.xml</a> · <a href="https://ourword.ai/feed.xml">feed.xml</a></p><p><a href="https://ourword.ai/">人类生存法则</a> · <a href="https://ourword.ai/podcast/">原声播客</a> · <a href="https://ourword.ai/skill/">品位 Skill</a></p></section></noscript><!--GEO:BODY:END-->
