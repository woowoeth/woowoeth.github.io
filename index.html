ngs-first/","hint":"把错事做得漂亮，是最贵的浪费"}]},{"q":"事情堆在一起，我不知道先动哪个。","a":[{"who":"毛泽东","cn":"矛盾论","u":"/i/mao/on-contradiction/","hint":"一团乱麻里，先找那根一抽全松的线"},{"who":"影响力","cn":"社会认同","u":"/i/influence/social-proof/","hint":"越拿不准，越容易跟着人群走"}]}]},{"t":"起了冲突","g":"要做决定","qs":[{"q":"他明摆着有恶意，我还忍吗？","a":[{"who":"凯撒","cn":"宽赦作为武器","u":"/i/caesar/clementia/","hint":"他赦免的人越多，对手越难征兵"},{"who":"苏轼","cn":"眼前见天下无一个不好人","u":"/i/su-shi/no-bad-people/","hint":"不是天真，是拒绝用敌我看世界"}]},{"q":"我怕自己在气头上做错决定。","a":[{"who":"爱比克泰德","cn":"扰乱你的不是事情","u":"/i/epictetus/judgments-not-things/","hint":"死亡不可怕这句话，重点在后半句"},{"who":"张良","cn":"圯上受书","u":"/i/zhang-liang/picking-up-the-shoe/","hint":"老人扔了三次鞋，考的不是脾气"}]},{"q":"我一句话就把人得罪了。","a":[{"who":"论语","cn":"己所不欲，勿施于人","u":"/i/analects/reciprocity/","hint":"先问自己愿不愿意被这样对待"},{"who":"克里斯·沃斯","cn":"要的是「说得对」不是「好」","u":"/i/chris-voss/thats-right/","hint":"「行行行」是想脱身，「对，就是这样」才是开始"}]},{"q":"他给我难堪，我忍了这一次。","a":[{"who":"张良","cn":"圯上受书","u":"/i/zhang-liang/picking-up-the-shoe/","hint":"老人扔了三次鞋，考的不是脾气"},{"who":"凯撒","cn":"宽赦作为武器","u":"/i/caesar/clementia/","hint":"他赦免的人越多，对手越难征兵"}]}]},{"t":"拖着不开始","g":"要做决定","qs":[{"q":"总想再准备准备，就是不开始。","a":[{"who":"保罗·格雷厄姆","cn":"做不能规模化的事","u":"/i/paul-graham/dont-scale/","hint":"Airbnb创始人挨家上门拍照那年"},{"who":"约翰·博伊德","cn":"OODA循环","u":"/i/boyd/ooda/","hint":"进到对手的循环里面去"}]},{"q":"我知道该做，可就是动不了。","a":[{"who":"王阳明","cn":"知行合一","u":"/i/wang-yangming/unity-of-knowing-and-doing/","hint":"把懂了和会了分开，是给自己留退路"},{"who":"富兰克林","cn":"一周只练一条","u":"/i/franklin/one-virtue-a-week/","hint":"十三条同时练等于一条都不练"}]},{"q":"想等条件齐了再动，可它总不齐。","a":[{"who":"凯撒","cn":"骰子已被掷下","u":"/i/caesar/the-rubicon/","hint":"他在河边停了下来，算完了才过"},{"who":"毛泽东","cn":"中国革命战争的战略问题","u":"/i/mao/strategy-of-the-revolution/","hint":"别人的条令不能直接搬"}]}]},{"t":"不可逆的决定","g":"要做决定","qs":[{"q":"这一步迈出去就收不回来了。","a":[{"who":"凯撒","cn":"骰子已被掷下","u":"/i/caesar/the-rubicon/","hint":"他在河边停了下来，算完了才过"},{"who":"项羽","cn":"破釜沉舟","u":"/i/xiang-yu/sinking-the-boats/","hint":"同一招救过他一次，也毁了他一次"}]},{"q":"把退路堵死，是勇还是蠢？","a":[{"who":"托马斯·谢林","cn":"自缚双手的优势","u":"/i/schelling/binding-yourself/","hint":"谈判桌上最强的一方，常是不能让步的那方"},{"who":"韩信","cn":"背水一战","u":"/i/han-xin/back-to-the-river/","hint":"这一招有前提，没前提就是送死"}]},{"q":"万一错了，我还有退路吗？","a":[{"who":"格雷厄姆","cn":"安全边际","u":"/i/graham/margin-of-safety/","hint":"三个词浓缩全部投资智慧"},{"who":"李嘉诚","cn":"九成时间想失败","u":"/i/li-ka-shing/ninety-percent-failure/","hint":"一个齿轮出毛病，整只表就停"}]},{"q":"我想在动手前先确认能赢。","a":[{"who":"孙子兵法","cn":"先胜而后求战","u":"/i/sun-tzu/win-before-fighting/","hint":"打得漂亮，往往是没准备好的补救"},{"who":"毛泽东","cn":"中国革命战争的战略问题","u":"/i/mao/strategy-of-the-revolution/","hint":"别人的条令不能直接搬"}]},{"q":"机会比预想的大，我敢不敢加码。","a":[{"who":"粟裕","cn":"把小淮海打成大淮海","u":"/i/su-yu/enlarging-huaihai/","hint":"「淮海战役」四个字出自他的电报"},{"who":"达里奥","cn":"可信度加权","u":"/i/dalio/believability/","hint":"意见不平等，按战绩称重"}]}]},{"t":"信息不全","g":"要做决定","qs":[{"q":"等数据齐了，还来得及吗？","a":[{"who":"约翰·博伊德","cn":"OODA循环","u":"/i/boyd/ooda/","hint":"进到对手的循环里面去"},{"who":"安迪·格鲁夫","cn":"转折点与报信人","u":"/i/grove/inflection-and-cassandras/","hint":"十倍速变化来临时，最早知道的是一线"}]},{"q":"我凭什么相信自己这次的判断？","a":[{"who":"毛泽东","cn":"实践论","u":"/i/mao/on-practice/","hint":"道理不从书里完成"},{"who":"达里奥","cn":"可信度加权","u":"/i/dalio/believability/","hint":"意见不平等，按战绩称重"}]},{"q":"我是不是根本问错了问题？","a":[{"who":"爱因斯坦","cn":"提出问题比解决问题更重要","u":"/i/einstein/formulating-the-problem/","hint":"他十六岁问的那个问题，十年后变成相对论"},{"who":"苏格拉底","cn":"产婆术","u":"/i/socrates/midwifery/","hint":"答案要从对方身上生出来才算数"}]},{"q":"我对自己和对手都没底。","a":[{"who":"孙子兵法","cn":"知彼知己","u":"/i/sun-tzu/know-both/","hint":"多算胜，少算不胜，何况不算"},{"who":"郭嘉","cn":"十胜十败","u":"/i/guo-jia/ten-victories/","hint":"打气没用，逐条对账才有用"}]},{"q":"情况我根本没摸全，就得拍板。","a":[{"who":"史记","cn":"余甚惑焉","u":"/i/records-of-the-grand-historian/i-am-confused/","hint":"史书里最诚实的三个字"},{"who":"爱因斯坦","cn":"提出问题比解决问题更重要","u":"/i/einstein/formulating-the-problem/","hint":"他十六岁问的那个问题，十年后变成相对论"}]},{"q":"对手哪儿都比我强，怎么跟人打。","a":[{"who":"孙子兵法","cn":"知彼知己","u":"/i/sun-tzu/know-both/","hint":"多算胜，少算不胜，何况不算"},{"who":"郭嘉","cn":"十胜十败","u":"/i/guo-jia/ten-victories/","hint":"打气没用，逐条对账才有用"}]}]},{"t":"方案被否","g":"要做决定","qs":[{"q":"方案被毙了，还提第二次吗？","a":[{"who":"粟裕","cn":"斗胆直陈","u":"/i/su-yu/daring-to-state/","hint":"一边备战渡江，一边三次发电反对渡江"},{"who":"李世民","cn":"兼听则明","u":"/i/li-shimin/hearing-all-sides/","hint":"信息渠道的数量决定判断质量"}]},{"q":"我怕再提就成了顶撞领导。","a":[{"who":"张良","cn":"借箸代筹","u":"/i/zhang-liang/borrowing-chopsticks/","hint":"八条反驳，条条落在执行上"},{"who":"战国策","cn":"邹忌照镜子","u":"/i/strategies-of-the-warring-states/three-mirrors/","hint":"夸得越好听，越要问他图什么"}]},{"q":"该坚持，还是该认这个否定？","a":[{"who":"约翰·博伊德","cn":"做大人物还是做成事","u":"/i/boyd/to-be-or-to-do/","hint":"他对每个下属都讲过同一个选择"},{"who":"彼得·蒂尔","cn":"反主流问题","u":"/i/thiel/the-contrarian-question/","hint":"面试他只认真听这一题的答案"}]},{"q":"我的方案被否了，还要不要争。","a":[{"who":"粟裕","cn":"斗胆直陈","u":"/i/su-yu/daring-to-state/","hint":"一边备战渡江，一边三次发电反对渡江"},{"who":"李世民","cn":"贞观初年的那场争论","u":"/i/li-shimin/the-first-debate/","hint":"所有人说来不及，他等了三年"}]}]},{"t":"全票通过","g":"要做决定","qs":[{"q":"所有人都同意，我反而心虚。","a":[{"who":"李世民","cn":"贞观初年的那场争论","u":"/i/li-shimin/the-first-debate/","hint":"所有人说来不及，他等了三年"},{"who":"霍华德·马克斯","cn":"第二层思维","u":"/i/marks/second-level-thinking/","hint":"好公司人人都说好的时候，就不便宜了"}]},{"q":"没人反对，我反而不放心。","a":[{"who":"查理·芒格","cn":"反过来想","u":"/i/munger/invert/","hint":"知道自己会死在哪里，就永远不去那儿"},{"who":"彼得·蒂尔","cn":"反主流问题","u":"/i/thiel/the-contrarian-question/","hint":"面试他只认真听这一题的答案"}]},{"q":"我是不是被会上的气氛带走了？","a":[{"who":"乌合之众","cn":"进入群体的人","u":"/i/crowd/descent-in-crowds/","hint":"一群聪明人可以做出所有成员单独都不会做的蠢事"},{"who":"影响力","cn":"社会认同","u":"/i/influence/social-proof/","hint":"越拿不准，越容易跟着人群走"}]},{"q":"这个说法太顺了，我有点犯嘀咕。","a":[{"who":"卡尔·波普尔","cn":"能不能被推翻","u":"/i/popper/falsifiability/","hint":"什么情况下你承认自己错了"},{"who":"费曼","cn":"第一个别骗的是自己","u":"/i/feynman/dont-fool-yourself/","hint":"科学的第一原则，防的是研究者本人"}]},{"q":"我是不是把话说得太满了？","a":[{"who":"富兰克林","cn":"戒掉「肯定」这个词","u":"/i/franklin/never-say-certainly/","hint":"他改的不是观点，是句式"},{"who":"论语","cn":"己所不欲，勿施于人","u":"/i/analects/reciprocity/","hint":"先问自己愿不愿意被这样对待"}]}]},{"t":"对手更强","g":"有对手","qs":[{"q":"整体拼不过，我还有哪块能赢？","a":[{" diculous/","hint":"这话是他在莫斯科溃退路上说的"},{"who":"李嘉诚","cn":"知止","u":"/i/li-ka-shing/knowing-when-to-stop/","hint":"扩张年代挂一幅劝刹车的字"}]},{"q":"顺风顺水这么久，我心里发毛。","a":[{"who":"塔勒布","cn":"火鸡问题","u":"/i/taleb/turkey-problem/","hint":"被喂了一千天的火鸡，感恩节前信心最高"},{"who":"巴菲特","cn":"退潮才知道谁在裸泳","u":"/i/buffett/swimming-naked/","hint":"繁荣期的报表上，杠杆和运气长得一样"}]}]},{"t":"投资在亏","g":"钱的事","qs":[{"q":"亏着的这笔，砍还是扛？","a":[{"who":"利弗莫尔","cn":"把希望和恐惧对调","u":"/i/livermore/hope-and-fear-inverted/","hint":"该怕的时候在盼，该盼的时候在怕"},{"who":"索罗斯","cn":"知道自己什么时候错","u":"/i/soros/knowing-when-wrong/","hint":"他说自己富有只因为认错快"}]},{"q":"是我看错了，还是还没到时候？","a":[{"who":"格雷厄姆","cn":"市场先生","u":"/i/graham/mr-market/","hint":"他每天来报价，你可以不理他"},{"who":"霍华德·马克斯","cn":"给市场量体温","u":"/i/marks/taking-the-temperature/","hint":"不知道要去哪，至少知道自己站在哪"}]},{"q":"我快扛不住了，还要不要扛？","a":[{"who":"彼得·林奇","cn":"关键器官是胃","u":"/i/lynch/stomach-not-brain/","hint":"等调整躲过的钱，比调整本身亏得多"},{"who":"利弗莫尔","cn":"坐功","u":"/i/livermore/sitting-tight/","hint":"让他赚大钱的从来不是想法，是坐着不动"}]},{"q":"亏的时候我比赚的时候难受得多。","a":[{"who":"思考，快与慢","cn":"损失厌恶","u":"/i/thinking-fast-and-slow/loss-aversion/","hint":"同一笔钱，失去的痛两倍于得到的乐"},{"who":"塔勒布","cn":"利益攸关","u":"/i/taleb/skin-in-the-game/","hint":"别告诉我你怎么想，告诉我你持有什么"}]},{"q":"看对了方向，我还是没拿住。","a":[{"who":"利弗莫尔","cn":"坐功","u":"/i/livermore/sitting-tight/","hint":"让他赚大钱的从来不是想法，是坐着不动"},{"who":"彼得·林奇","cn":"关键器官是胃","u":"/i/lynch/stomach-not-brain/","hint":"等调整躲过的钱，比调整本身亏得多"}]},{"q":"跌成这样，我不知道该信谁。","a":[{"who":"格雷厄姆","cn":"市场先生","u":"/i/graham/mr-market/","hint":"他每天来报价，你可以不理他"},{"who":"利弗莫尔","cn":"把希望和恐惧对调","u":"/i/livermore/hope-and-fear-inverted/","hint":"该怕的时候在盼，该盼的时候在怕"}]}]},{"t":"该不该买","g":"钱的事","qs":[{"q":"买之前，我真的懂它吗？","a":[{"who":"巴菲特","cn":"能力圈","u":"/i/buffett/circle-of-competence/","hint":"圈多大不要紧，知不知道边在哪要命"},{"who":"查理·芒格","cn":"格栅思维","u":"/i/munger/latticework/","hint":"拿着锤子的人，看什么都像钉子"}]},{"q":"这个价，算贵还是算便宜？","a":[{"who":"格雷厄姆","cn":"安全边际","u":"/i/graham/margin-of-safety/","hint":"三个词浓缩全部投资智慧"},{"who":"霍华德·马克斯","cn":"给市场量体温","u":"/i/marks/taking-the- e-what-others-drop/","hint":"所有人都在卖的时候，你是唯一的买方"},{"who":"稀缺","cn":"带宽税","u":"/i/scarcity/bandwidth-tax/","hint":"不是不理性，是带宽被占满了"}]}]},{"t":"这人可信吗","g":"跟人打交道","qs":[{"q":"第一次打交道，我看什么最准？","a":[{"who":"论语","cn":"视其所以，观其所由","u":"/i/analects/see-how/","hint":"看他做什么，看他为什么，看他心安在哪"},{"who":"曾国藩","cn":"广收慎用","u":"/i/zeng-guofan/recruit-and-test/","hint":"面试看不出的东西，一件小事就看出来了"}]},{"q":"有本事但我信不过，用不用？","a":[{"who":"资治通鉴","cn":"才德之辨","u":"/i/zizhi-tongjian/talent-and-virtue/","hint":"宁可用愚人，不用小人"},{"who":"曹操","cn":"唯才是举","u":"/i/cao-cao/talent-only/","hint":"在缺人的时候，标准要少而硬"}]},{"q":"他说得挺好，我有点不敢全信。","a":[{"who":"鬼谷子","cn":"揣情摩意","u":"/i/guiguzi/sound-out/","hint":"人在大喜大惧时藏不住"},{"who":"韩非子","cn":"形名参同","u":"/i/han-feizi/form-and-name/","hint":"对不上的地方就是问题所在"}]},{"q":"这人有才，但我摸不透他。","a":[{"who":"白圭","cn":"智勇仁强","u":"/i/bai-gui/four-qualifications/","hint":"他说学不会这四样，我不教"},{"who":"拉罗什富科","cn":"虚伪是恶行向美德的致敬","u":"/i/la-rochefoucauld/vice-pays-tribute/","hint":"连坏人都要装好，说明好是硬通货"}]},{"q":"他说得漂亮，我还没见他做过。","a":[{"who":"韩非子","cn":"形名参同","u":"/i/han-feizi/form-and-name/","hint":"对不上的地方就是问题所在"},{"who":"论语","cn":"视其所以，观其所由","u":"/i/analects/see-how/","hint":"看他做什么，看他为什么，看他心安在哪"}]},{"q":"简历很好看，可我还是拿不准。","a":[{"who":"曾国藩","cn":"广收慎用","u":"/i/zeng-guofan/recruit-and-test/","hint":"面试看不出的东西，一件小事就看出来了"},{"who":"资治通鉴","cn":"才德之辨","u":"/i/zizhi-tongjian/talent-and-virtue/","hint":"宁可用愚人，不用小人"}]}]},{"t":"要说服人","g":"跟人打交道","qs":[{"q":"我说了不算，得让他自己想到。","a":[{"who":"鬼谷子","cn":"反听","u":"/i/guiguzi/listen-in-reverse/","hint":"沉默是最强的提问"},{"who":"苏格拉底","cn":"产婆术","u":"/i/socrates/midwifery/","hint":"答案要从对方身上生出来才算数"}]},{"q":"道理都讲完了，还是没用。","a":[{"who":"国富论","cn":"晚餐不来自恩惠","u":"/i/wealth-of-nations/not-benevolence/","hint":"求人办事，先讲他能得什么"},{"who":"影响力","cn":"互惠","u":"/i/influence/reciprocity/","hint":"先给的那个小东西，撬动的是不成比例的回报"}]},{"q":"他从一开始就不认同我。","a":[{"who":"曼德拉","cn":"穿上对手的球衣","u":"/i/mandela/springbok-jersey/","hint":"那件球衣曾是压迫的标志"},{"who":"论语","cn":"和而不同","u":"/i/analects/harmony-not-sameness/","hint":"全票通过的会最可疑"}]},{"q":"我一个人去谈，能谈得下来吗？","a":[{"who":"郭子仪","cn":"单骑见回纥","u":"/i/guo-ziyi/riding-out-alone/","hint":"脱掉盔甲比带上军队管用"},{"who":"武则天","cn":"宰相安得失此人","u":"/i/wu-zetian/the-manifesto/","hint":"先看写得好不好，再看骂的是谁"}]},{"q":"我说的都对，可他就是不听。","a":[{"who":"鬼谷子","cn":"反听","u":"/i/guiguzi/listen-in-reverse/","hint":"沉默是最强的提问"},{"who":"论语","cn":"知之为知之","u":"/i/analects/know-what-you-know/","hint":"承认不懂是判断力的起点"}]},{"q":"对面人多势众，我只有一张嘴。","a":[{"who":"郭子仪","cn":"单骑见回纥","u":"/i/guo-ziyi/riding-out-alone/","hint":"脱掉盔甲比带上军队管用"},{"who":"武则天","cn":"宰相安得失此人","u":"/i/wu-zetian/the-manifesto/","hint":"先看写得好不好，再看骂的是谁"}]}]},{"t":"谈条件","g":"跟人打交道","qs":[{"q":"我说的话，他们好像不太当真。","a":[{"who":"托马斯·谢林","cn":"自缚双手的优势","u":"/i/schelling/binding-yourself/","hint":"谈判桌上最强的一方，常是不能让步的那方"},{"who":"商鞅","cn":"徙木立信","u":"/i/shang-yang/moving-the-pole/","hint":"新规则的第一件事不是执行，是被相信"}]},{"q":"谈僵了，谁都不肯先动。","a":[{"who":"托马斯·谢林","cn":"谢林点","u":"/i/schelling/focal-points/","hint":"纽约走散了去哪碰头？多数人给了同一个答案"},{"who":"鬼谷子","cn":"捭阖","u":"/i/guiguzi/open-and-close/","hint":"开口之前先决定这次是开还是合"}]},{"q":"我该先让一步换个长远？","a":[{"who":"战国策","cn":"焚券市义","u":"/i/strategies-of-the-warring-states/burning-the-debts/","hint":"他把债契烧了，说这是替你买回来的义"},{"who":"塔勒布","cn":"利益攸关","u":"/i/taleb/skin-in-the-game/","hint":"别告诉我你怎么想，告诉我你持有什么"}]},{"q":"没法商量，我只能猜他会怎么走。","a":[{"who":"托马斯·谢林","cn":"谢林点","u":"/i/schelling/focal-points/","hint":"纽约走散了去哪碰头？多数人给了同一个答案"},{"who":"乌合之众","cn":"断言、重复、传染","u":"/i/crowd/assert-repeat-contaminate/","hint":"对群体起作用的从来不是论证"}]},{"q":"眼前这笔我亏了，值不值得。","a":[{"who":"战国策","cn":"焚券市义","u":"/i/strategies-of-the-warring-states/burning-the-debts/","hint":"他把债契烧了，说这是替你买回来的义"},{"who":"鬼谷子","cn":"捭阖","u":"/i/guiguzi/open-and-close/","hint":"开口之前先决定这次是开还是合"}]}]},{"t":"被猜忌","g":"跟人打交道","qs":[{"q":"越解释越像心虚，说还是不说？","a":[{"who":"郭子仪","cn":"门不设禁","u":"/i/guo-ziyi/open-gates/","hint":"藏起来的人才需要被查"},{"who":"王翦","cn":"请美田宅","u":"/i/wang-jian/asking-for-fields/","hint":"手握六十万，就得让人看见你只想要地"}]},{"q":"功劳太大，我反而开始不安。","a":[{"who":"范蠡","cn":"长颈鸟喙","u":"/i/fan-li/leave-at-the-top/","hint":"他看的不是形势，是那个人的构造"},{"who":"韩信","cn":"不反也不退","u":"/i/han-xin/neither-nor/","hint":"两条路都不选，等于选了最坏的一条"}]},{"q":"我越做越好，上面反而防着我。","a":[{"who":"王翦","cn":"请美田宅","u":"/i/wang-jian/asking-for-fields/","hint":"手握六十万，就得让人看见你只想要地"},{"who":"韩信","cn":"不反也不退","u":"/i/han-xin/neither-nor/","hint":"两条路都不选，等于选了最坏的一条"}]}]},{"t":"错反复犯","g":"带人","qs":[{"q":"同一个坑，我们又掉进去了。","a":[{"who":"系统之美","cn":"结构决定行为","u":"/i/thinking-in-systems/structure-drives-behavior/","hint":"换了三批人，问题一模一样，就该看结构了"},{"who":"韩非子","cn":"不恃人之为吾善","u":"/i/han-feizi/not-counting-on-goodness/","hint":"让做对的事成为最省力的选择"}]},{"q":"问题一堆，我先动哪一处？","a":[{"who":"系统之美","cn":"杠杆点","u":"/i/thinking-in-systems/leverage-points/","hint":"人们凭直觉找到杠杆点，然后朝错误的方向推"},{"who":"张居正","cn":"考成法","u":"/i/zhang-juzheng/kaocheng/","hint":"文件发下去不算办完，销号才算"}]},{"q":"复盘写了，下次还是照样犯。","a":[{"who":"史记","cn":"不虚美，不隐恶","u":"/i/records-of-the-grand-historian/no-praise-no-hiding/","hint":"他写自己敬佩的人，也写他怎么坏事"},{"who":"胡雪岩","cn":"囤丝之败","u":"/i/hu-xueyan/the-silk-corner/","hint":"他赌的是价格，输的是资金链"}]},{"q":"同样的教训我怎么才记得住？","a":[{"who":"资治通鉴","cn":"善可为法，恶可为戒","u":"/i/zizhi-tongjian/what-to-keep/","hint":"十九年只留下这一条筛选规则"},{"who":"富兰克林","cn":"戒掉「肯定」这个词","u":"/i/franklin/never-say-certainly/","hint":"他改的不是观点，是句式"}]},{"q":"换了一批人，同样的错还在犯。","a":[{"who":"系统之美","cn":"结构决定行为","u":"/i/thinking-in-systems/structure-drives-behavior/","hint":"换了三批人，问题一模一样，就该看结构了"},{"who":"韩非子","cn":"不恃人之为吾善","u":"/i/han-feizi/not-counting-on-goodness/","hint":"让做对的事成为最省力的选择"}]},{"q":"我布置下去的事，没人当回事。","a":[{"who":"张居正","cn":"考成法","u":"/i/zhang-juzheng/kaocheng/","hint":"文件发下去不算办完，销号才算"},{"who":"毛泽东","cn":"党委会的工作方法","u":"/i/mao/methods-of-work/","hint":"判断对了，一班人不动，等于没判断"}]}]},{"t":"下不了手","g":"带人","qs":[{"q":"该罚的是跟我最久的人。","a":[{"who":"诸葛亮","cn":"挥泪斩马谡","u":"/i/zhuge-liang/executing-ma-su/","hint":"罚了别人不罚自己，制度立不住"},{"who":"商鞅","cn":"法不阿贵","u":"/i/shang-yang/law-above-rank/","hint":"太子犯法，动的是他的老师"}]},{"q":"要砍的是我亲手做起来的。","a":[{"who":"安迪·格鲁夫","cn":"旋转门测试","u":"/i/grove/revolving-door/","hint":"新C nnecting-the-dots/","hint":"退学后旁听的字体课，十年后进了Mac"},{"who":"爱因斯坦","cn":"专利局里的奇迹年","u":"/i/einstein/patent-office/","hint":"最重要的物理学诞生在学术圈外"}]},{"q":"我连自己能撑多久都算不出来。","a":[{"who":"保罗·格雷厄姆","cn":"默认活着还是默认死去","u":"/i/paul-graham/default-alive/","hint":"按现在的轨迹推下去，钱花完前能不能盈利"},{"who":"李嘉诚","cn":"九成时间想失败","u":"/i/li-ka-shing/ninety-percent-failure/","hint":"一个齿轮出毛病，整只表就停"}]},{"q":"别人都在抢先，我要不要慢一步。","a":[{"who":"朱元璋","cn":"缓称王","u":"/i/zhu-yuanzhang/delay-the-title/","hint":"称王当天，你就成了所有人的目标"},{"who":"段永平","cn":"敢为天下后","u":"/i/duan-yongping/dare-to-be-last/","hint":"不开第一枪，开更准的一枪"}]}]},{"t":"推不动","g":"把事做成","qs":[{"q":"推了很久推不动，该换方向吗？","a":[{"who":"战争论","cn":"摩擦","u":"/i/on-war/friction/","hint":"纸上的计划和湿透的行军之间，隔着摩擦"},{"who":"毛泽东","cn":"矛盾论","u":"/i/mao/on-contradiction/","hint":"一团乱麻里，先找那根一抽全松的线"}]},{"q":"只剩笨办法了，还要不要做？","a":[{"who":"曾国藩","cn":"结硬寨，打呆仗","u":"/i/zeng-guofan/solid-camp-dull-fight/","hint":"赢法不好看，但它可以重复"},{"who":"李小龙","cn":"一万次同一脚","u":"/i/bruce-lee/one-kick/","hint":"他怕的不是会一万种踢法的人"}]},{"q":"一改就出乱子，不改又不行。","a":[{"who":"旧制度与大革命","cn":"开始改革的时刻","u":"/i/old-regime/most-dangerous-moment/","hint":"革命不在最苦的地方爆发"},{"who":"旧制度与大革命","cn":"穿过革命的集权","u":"/i/old-regime/centralization-survived/","hint":"大革命砸碎的是外壳，接手的是机器"}]},{"q":"我以为规划得够细了。","a":[{"who":"哈耶克","cn":"致命的自负","u":"/i/hayek/fatal-conceit/","hint":"向人证明：对自以为能设计的东西，他知道得多么少"},{"who":"国家为什么会失败","cn":"精英为什么拦着进步","u":"/i/why-nations-fail/fear-of-creative-destruction/","hint":"拦路的人算得很清楚"}]},{"q":"别人的成功打法，我照搬不动。","a":[{"who":"霍去病","cn":"顾方略何如耳","u":"/i/huo-qubing/no-old-manuals/","hint":"皇帝要教他孙吴，他说用不上"},{"who":"宫本武藏","cn":"武器不可有偏爱","u":"/i/musashi/no-favorite-weapon/","hint":"他用木刀赢了用真剑的人"}]},{"q":"计划挺好，落到地上就走样。","a":[{"who":"战争论","cn":"摩擦","u":"/i/on-war/friction/","hint":"纸上的计划和湿透的行军之间，隔着摩擦"},{"who":"曾国藩","cn":"结硬寨，打呆仗","u":"/i/zeng-guofan/solid-camp-dull-fight/","hint":"赢法不好看，但它可以重复"}]}]},{"t":"扩不扩张","g":"把事做成","qs":[{"q":"什么该做什么不做，我拿不准。","a":[{"who":"王兴","cn":"关注核心，不关注边界","u":"/i/wang-xing/core-not-boundary/","hint":"万物没有简单边界， -moment/","hint":"革命不在最苦的地方爆发"}]},{"q":"行情好的时候我该干什么？","a":[{"who":"松下幸之助","cn":"下雨打伞","u":"/i/matsushita/umbrella-in-rain/","hint":"秘诀就是没有秘诀这么简单"},{"who":"道德经","cn":"上善若水","u":"/i/tao-te-ching/water/","hint":"不争的人最后没人能跟他争"}]},{"q":"现在一切都好，我反而睡不着。","a":[{"who":"任正非","cn":"华为的冬天","u":"/i/ren-zhengfei/huaweis-winter/","hint":"销售额破两百亿那年，他写了这篇"},{"who":"贝索斯","cn":"永远是第一天","u":"/i/bezos/day-one/","hint":"停滞、无关紧要、痛苦的衰退、死亡"}]},{"q":"赚钱太顺，我怕自己看不见风险。","a":[{"who":"道德经","cn":"反者道之动","u":"/i/tao-te-ching/reversal/","hint":"最强的时刻最危险"},{"who":"智慧书","cn":"见好就收","u":"/i/art-of-worldly-wisdom/quit-while-winning/","hint":"好运连续，恰是该疑的时候"}]}]},{"t":"在低谷","g":"自己的状态","qs":[{"q":"这段日子，到底熬来了什么？","a":[{"who":"弗兰克尔","cn":"最后的自由","u":"/i/frankl/the-last-freedom/","hint":"这句话的分量在它写作的地点"},{"who":"尼采","cn":"杀不死我的","u":"/i/nietzsche/what-does-not-kill/","hint":"它是格言，不是自然规律"}]},{"q":"这次栽了，我能捡回点什么？","a":[{"who":"达里奥","cn":"痛苦加反思等于进步","u":"/i/dalio/pain-plus-reflection/","hint":"他判断对了危机，输光了公司"},{"who":"苏轼","cn":"黄州惠州儋州","u":"/i/su-shi/three-exiles/","hint":"他把三次流放当成三个任期"}]},{"q":"最难的时候，还剩什么是我的？","a":[{"who":"马可·奥勒留","cn":"障碍即道路","u":"/i/marcus-aurelius/obstacle-is-the-way/","hint":"火把扔进去的东西都会变成火"},{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中"}]},{"q":"这件事我到现在都没想明白。","a":[{"who":"史记","cn":"余甚惑焉","u":"/i/records-of-the-grand-historian/i-am-confused/","hint":"史书里最诚实的三个字"},{"who":"孟子","cn":"养浩然之气","u":"/i/mencius/flood-like-qi/","hint":"不是天生的，是一件件积出来的"}]},{"q":"我这段没人看见的日子有用吗？","a":[{"who":"爱因斯坦","cn":"专利局里的奇迹年","u":"/i/einstein/patent-office/","hint":"最重要的物理学诞生在学术圈外"},{"who":"乔布斯","cn":"连点成线只能回头看","u":"/i/jobs/connecting-the-dots/","hint":"退学后旁听的字体课，十年后进了Mac"}]},{"q":"撑不下去的时候，我对自己特别狠。","a":[{"who":"克里斯汀·内夫","cn":"自我关怀不是自尊","u":"/i/kristin-neff/not-self-esteem/","hint":"自尊要赢过谁，自我关怀不用"},{"who":"布琳·布朗","cn":"内疚能改，羞耻不能","u":"/i/brene-brown/guilt-not-shame/","hint":"指着行为的话留了路，指着人的话没留"}]}]},{"t":"想太多","g":"自己的状态","qs":[{"q":"这事在我脑子里转了二十遍。","a":[{"who":"马可·奥勒留","cn":"晨起预演","u":"/i/marcus-aurelius/morning-preparation/","hint":"预料到的冒犯，伤害减半"},{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类"}]},{"q":"我一直在想我改变不了的事。","a":[{"who":"王阳明","cn":"事上磨练","u":"/i/wang-yangming/polish-on-things/","hint":"功夫在事情里，不在蒲团上"},{"who":"六祖慧能","cn":"本来无一物","u":"/i/huineng/originally-not-a-thing/","hint":"神秀在擦镜子，慧能问哪来的镜子"}]},{"q":"我怕自己越斗越像对手。","a":[{"who":"尼采","cn":"凝视深渊","u":"/i/nietzsche/gazing-into-abyss/","hint":"打法会长进打的人身上"},{"who":"俾斯麦","cn":"铁与血","u":"/i/bismarck/iron-and-blood/","hint":"那场演说其实是在要预算"}]},{"q":"外面太吵，我静不下来。","a":[{"who":"松下幸之助","cn":"下雨打伞","u":"/i/matsushita/umbrella-in-rain/","hint":"秘诀就是没有秘诀这么简单"},{"who":"马可·奥勒留","cn":"晨起预演","u":"/i/marcus-aurelius/morning-preparation/","hint":"预料到的冒犯，伤害减半"}]},{"q":"跟烂事纠缠久了，我也变得难看。","a":[{"who":"庄子","cn":"庖丁解牛","u":"/i/zhuangzi/ox-carving/","hint":"刀不钝是因为它没碰硬的地方"},{"who":"道德经","cn":"上善若水","u":"/i/tao-te-ching/water/","hint":"不争的人最后没人能跟他争"}]},{"q":"我脑子里一直在骂自己。","a":[{"who":"布琳·布朗","cn":"内疚能改，羞耻不能","u":"/i/brene-brown/guilt-not-shame/","hint":"指着行为的话留了路，指着人的话没留"},{"who":"王阳明","cn":"破心中贼","u":"/i/wang-yangming/bandits-in-the-heart/","hint":"山里的贼好破，心里的贼难破"}]}]},{"t":"知道做不到","g":"自己的状态","qs":[{"q":"道理都懂，可我就是不动。","a":[{"who":"王阳明","cn":"知行合一","u":"/i/wang-yangming/unity-of-knowing-and-doing/","hint":"把懂了和会了分开，是给自己留退路"},{"who":"王阳明","cn":"破心中贼","u":"/i/wang-yangming/bandits-in-the-heart/","hint":"山里的贼好破，心里的贼难破"}]},{"q":"这个毛病我改了很多次了。","a":[{"who":"富兰克林","cn":"一周只练一条","u":"/i/franklin/one-virtue-a-week/","hint":"十三条同时练等于一条都不练"},{"who":"李小龙","cn":"一万次同一脚","u":"/i/bruce-lee/one-kick/","hint":"他怕的不是会一万种踢法的人"}]},{"q":"练了很久，感觉没什么长进。","a":[{"who":"艾利克森","cn":"练已经会的等于休息","u":"/i/ericsson/deliberate-practice/","hint":"顶尖学生把时间花在弹不好的那几小节"},{"who":"艾利克森","cn":"一万小时是误读","u":"/i/ericsson/not-ten-thousand-hours/","hint":"十年经验，也可能是一年重复了十次"}]},{"q":"道理我都懂，就是做不到。","a":[{"who":"BJ·福格","cn":"小到最糟那天也做得到","u":"/i/bj-fogg/tiny-habits/","hint":"两个俯卧撑，从没失败过"},{"who":"德韦克","cn":"夸过程，别夸天赋","u":"/i/dweck/praise-the-process/","hint":"被夸聪明的孩子挑了简单的题"}]},{"q":"书看了不少，用的时候想不起来。","a":[{"who":"费曼","cn":"讲不明白就是没懂","u":"/i/feynman/teach-to-understand/","hint":"卡住的那一处，就是你没通的地方"},{"who":"李小龙","cn":"像水一样","u":"/i/bruce-lee/be-water/","hint":"水进杯是杯形，进壶是壶形，还能穿石"}]},{"q":"道理我都懂，可我做不到。","a":[{"who":"卡尔·波普尔","cn":"能不能被推翻","u":"/i/popper/falsifiability/","hint":"什么情况下你承认自己错了"},{"who":"德韦克","cn":"这个效应比流行说法小得多","u":"/i/dweck/effect-size/","hint":"是温和因素，不是万能开关"}]}]},{"t":"学不进去","g":"自己的状态","qs":[{"q":"看了很多，一到用就想不起来。","a":[{"who":"毛泽东","cn":"实践论","u":"/i/mao/on-practice/","hint":"道理不从书里完成"},{"who":"王阳明","cn":"事上磨练","u":"/i/wang-yangming/polish-on-things/","hint":"功夫在事情里，不在蒲团上"}]},{"q":"我不懂，但不好意思说。","a":[{"who":"论语","cn":"知之为知之","u":"/i/analects/know-what-you-know/","hint":"承认不懂是判断力的起点"},{"who":"苏格拉底","cn":"不自以为知道","u":"/i/socrates/knowing-not-knowing/","hint":"神谕说他最智慧，他去证伪，结果证实了"}]},{"q":"我是不是一直在用笨办法学？","a":[{"who":"荀子","cn":"善假于物","u":"/i/xunzi/borrow-from-things/","hint":"走得远的人不是腿长的人"},{"who":"查理·芒格","cn":"格栅思维","u":"/i/munger/latticework/","hint":"拿着锤子的人，看什么都像钉子"}]},{"q":"我以为懂了，一讲就卡壳。","a":[{"who":"费曼","cn":"讲不明白就是没懂","u":"/i/feynman/teach-to-understand/","hint":"卡住的那一处，就是你没通的地方"},{"who":"艾利克森","cn":"练已经会的等于休息","u":"/i/ericsson/deliberate-practice/","hint":"顶尖学生把时间花在弹不好的那几小节"}]},{"q":"练了很多遍，还是不熟。","a":[{"who":"维果茨基","cn":"最近发展区","u":"/i/vygotsky/zpd/","hint":"给点提示就能做到的那一段"},{"who":"维果茨基","cn":"脚手架：给了要撤","u":"/i/vygotsky/scaffolding/","hint":"搭起来是为了拆掉"}]},{"q":"我学的东西太死板了。","a":[{"who":"李小龙","cn":"像水一样","u":"/i/bruce-lee/be-water/","hint":"水进杯是杯形，进壶是壶形，还能穿石"},{"who":"六祖慧能","cn":"佛法在世间","u":"/i/huineng/in-the-world/","hint":"离开日常去找方法，是在找兔子的角"}]}]},{"t":"忙到没自己","g":"自己的状态","qs":[{"q":"日程排满了，没一件是我自己的。","a":[{"who":"道德经","cn":"有之以为利，无之以为用","u":"/i/tao-te-ching/usefulness-of-emptiness/","hint":"车轮的价值在轴孔那个空"},{"who":"庄子","cn":"无用之用","u":"/i/zhuangzi/use-of-uselessness/","hint":"有用是一种被消耗的资格"}]},{"q":"同样的事，我总比别人费劲。","a":[{"who":"庄子","cn":"庖丁解牛","u":"/i/zhuangzi/ox-carving/","hint":"刀不钝是因为它没碰硬的地方"},{"who":"道德经","cn":"无为而无不为","u":"/i/tao-te-ching/wu-wei/","hint":"多数失控来自动作太多"}]},{"q":"一天没干成什么，我却累得说不出话。","a":[{"who":"阿莉·霍克希尔德","cn":"情感劳动","u":"/i/hochschild/emotional-labor/","hint":"被要求的情绪也是工作量"},{"who":"卡尔·纽波特","cn":"注意力残留","u":"/i/cal-newport/attention-residue/","hint":"回了一条消息，之后半小时都在打折"}]}]},{"t":"被比下去","g":"自己的状态","qs":[{"q":"他什么都比我快一步。","a":[{"who":"庄子","cn":"齐物","u":"/i/zhuangzi/equalizing-things/","hint":"争论之前先问用的是谁的尺子"},{"who":"拉罗什富科","cn":"没人抱怨自己的判断力","u":"/i/la-rochefoucauld/memory-vs-judgment/","hint":"人人都说记性差，没人说眼光差"}]},{"q":"我到底在证明自己，还是在做事？","a":[{"who":"约翰·博伊德","cn":"做大人物还是做成事","u":"/i/boyd/to-be-or-to-do/","hint":"他对每个下属都讲过同一个选择"},{"who":"项羽","cn":"衣绣夜行","u":"/i/xiang-yu/brocade-at-night/","hint":"关中不要，非回彭城不可"}]},{"q":"我是不是天生就不如人？","a":[{"who":"德韦克","cn":"夸过程，别夸天赋","u":"/i/dweck/praise-the-process/","hint":"被夸聪明的孩子挑了简单的题"},{"who":"德韦克","cn":"这个效应比流行说法小得多","u":"/i/dweck/effect-size/","hint":"是温和因素，不是万能开关"}]},{"q":"他们看起来都很稳，只有我在慌。","a":[{"who":"布琳·布朗","cn":"羞耻的三个生存条件","u":"/i/brene-brown/secrecy-silence-judgment/","hint":"它靠「只有我这样」活着"},{"who":"苏格拉底","cn":"不自以为知道","u":"/i/socrates/knowing-not-knowing/","hint":"神谕说他最智慧，他去证伪，结果证实了"}]},{"q":"道理都懂，我就是对自己客气不起来。","a":[{"who":"克里斯汀·内夫","cn":"三样必须同时在","u":"/i/kristin-neff/three-parts/","hint":"少一样就变成自怜、忍受或冷漠"},{"who":"卡尔·罗杰斯","cn":"无条件积极关注","u":"/i/carl-rogers/unconditional-regard/","hint":"说了真话不会失去关系，人才敢说真话"}]}]},{"t":"不想卷但怕掉队","g":"自己的状态","qs":[{"q":"我不想卷，可又怕被落下。","a":[{"who":"庄子","cn":"无用之用","u":"/i/zhuangzi/use-of-uselessness/","hint":"有用是一种被消耗的资格"},{"who":"巴菲特","cn":"能力圈","u":"/i/buffett/circle-of-competence/","hint":"圈多大不要紧，知不知道边在哪要命"}]},{"q":"大家都在加班，我先走心虚。","a":[{"who":"论语","cn":"和而不同","u":"/i/analects/harmony-not-sameness/","hint":"全票通过的会最可疑"},{"who":"庄子","cn":"齐物","u":"/i/zhuangzi/equalizing-things/","hint":"争论之前先问用的是谁的尺子"}]},{"q":"拼了这么久，我不知道图什么。","a":[{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中"},{"who":"王兴","cn":"逃避真正的思考","u":"/i/wang-xing/escape-from-thinking/","hint":"多数人为了逃避思考，愿意做任何事情"}]},{"q":"光靠拼命，我拼不过他们。","a":[{"who":"荀子","cn":"善假于物","u":"/i/xunzi/borrow-from-things/","hint":"走得远的人不是腿长的人"},{"who":"纳瓦尔","cn":"把自己产品化","u":"/i/naval/productize-yourself/","hint":"四个字，一半是做什么，一半是怎么放大"}]}]},{"t":"该不该接","g":"进退取舍","qs":[{"q":"位置给我了，我看不清风险在哪。","a":[{"who":"李泌","cn":"臣绝粒无家","u":"/i/li-bi/no-office/","hint":"四次入朝四次归山，每次都不受官"},{"who":"冯道","cn":"惟皇帝救得","u":"/i/feng-dao/only-you-can-save/","hint":"他不能阻止征服，他阻止了屠城"}]},{"q":"机会挺好，就怕我接不住。","a":[{"who":"王翦","cn":"非六十万不可","u":"/i/wang-jian/sixty-thousand/","hint":"少报要的人赢了那次会，输了那场仗"},{"who":"稻盛和夫","cn":"动机至善，私心了无","u":"/i/inamori/pure-motive/","hint":"他每晚问自己是不是想出风头"}]},{"q":"这个位置我接下来，可能是个坑。","a":[{"who":"诸葛亮","cn":"隆中对","u":"/i/zhuge-liang/longzhong-plan/","hint":"战略的前半段全是排除法"},{"who":"哈耶克","cn":"知识是分散的","u":"/i/hayek/knowledge-is-dispersed/","hint":"价格是一套压缩过的电报系统"}]},{"q":"刚接手，我第一条规矩该立什么。","a":[{"who":"刘邦","cn":"约法三章","u":"/i/liu-bang/three-articles/","hint":"三条说得完，才有人信"},{"who":"荀子","cn":"礼起于何也","u":"/i/xunzi/origin-of-rites/","hint":"不是先有道德才有规矩，是反过来"}]}]},{"t":"该不该退","g":"进退取舍","qs":[{"q":"我该什么时候退，才不难看？","a":[{"who":"范蠡","cn":"长颈鸟喙","u":"/i/fan-li/leave-at-the-top/","hint":"他看的不是形势，是那个人的构造"},{"who":"李嘉诚","cn":"知止","u":"/i/li-ka-shing/knowing-when-to-stop/","hint":"扩张年代挂一幅劝刹车的字"}]},{"q":"我交出去之后，会不会一团糟？","a":[{"who":"李光耀","cn":"从病床上爬起来","u":"/i/lee-kuan-yew/from-my-sickbed/","hint":"退休的人说了一句没法退休的话"},{"who":"张良","cn":"愿封留足矣","u":"/i/zhang-liang/asking-for-less/","hint":"让给你的人放心，比多拿三万户值钱"}]},{"q":"我这一路的取舍，怎么交代？","a":[{"who":"冯道","cn":"长乐老自叙","u":"/i/feng-dao/the-long-happy-old-man/","hint":"忠的对象到底是谁"},{"who":"哈耶克","cn":"致命的自负","u":"/i/hayek/fatal-conceit/","hint":"向人证明：对自以为能设计的东西，他知道得多么少"}]},{"q":"该收手了，可我停不下来。","a":[{"who":"李光耀","cn":"从病床上爬起来","u":"/i/lee-kuan-yew/from-my-sickbed/","hint":"退休的人说了一句没法退休的话"},{"who":"冯道","cn":"惟皇帝救得","u":"/i/feng-dao/only-you-can-save/","hint":"他不能阻止征服，他阻止了屠城"}]}]},{"t":"要立规矩","g":"进退取舍","qs":[{"q":"新规矩定了，没人当回事。","a":[{"who":"商鞅","cn":"徙木立信","u":"/i/shang-yang/moving-the-pole/","hint":"新规则的第一件事不是执行，是被相信"},{"who":"刘邦","cn":"约法三章","u":"/i/liu-bang/three-articles/","hint":"三条说得完，才有人信"}]},{"q":"松了没用，紧了怕逼走人。","a":[{"who":"朱元璋","cn":"治吏用重典","u":"/i/zhu-yuanzhang/heavy-law/","hint":"他自己说这套只适用于这一代"},{"who":"管仲","cn":"政之所兴，在顺民心","u":"/i/guan-zhong/follow-the-people/","hint":"逆着人性设计的政策，执行成本无限高"}]},{"q":"我压得住人，却服不了人。","a":[{"who":"孟子","cn":"以力服人与以德服人","u":"/i/mencius/force-vs-virtue/","hint":"你一离开，靠力气建立的秩序就归零"},{"who":"孟子","cn":"民为贵","u":"/i/mencius/people-first/","hint":"统治者算的是同意，不是感情"}]},{"q":"规矩定了，怎么才落得下去？","a":[{"who":"张居正","cn":"一条鞭法","u":"/i/zhang-juzheng/single-whip/","hint":"环节越多，被吃掉的越多"},{"who":"荀子","cn":"礼起于何也","u":"/i/xunzi/origin-of-rites/","hint":"不是先有道德才有规矩，是反过来"}]},{"q":"我为什么非得立规矩？","a":[{"who":"荀子","cn":"明分使群","u":"/i/xunzi/division-makes-groups/","hint":"职责不清的团队会自己解体"},{"who":"管仲","cn":"仓廪实则知礼节","u":"/i/guan-zhong/granaries-first/","hint":"谈价值观之前先看账"}]},{"q":"规矩太多太乱，我自己都记不住。","a":[{"who":"张居正","cn":"一条鞭法","u":"/i/zhang-juzheng/single-whip/","hint":"环节越多，被吃掉的越多"},{"who":"荀子","cn":"明分使群","u":"/i/xunzi/division-makes-groups/","hint":"职责不清的团队会自己解体"}]}]},{"t":"看不清大势","g":"进退取舍","qs":[{"q":"现在到底是开头还是快结束了？","a":[{"who":"霍华德·马克斯","cn":"给市场量体温","u":"/i/marks/taking-the-temperature/","hint":"不知道要去哪，至少知道自己站在哪"},{"who":"技术革命与金融资本","cn":"泡沫在剧本里","u":"/i/technological-revolutions/bubble-in-the-script/","hint":"五次技术革命，五次泡沫，一次没缺席"}]},{"q":"十年之后，哪些还站得住？","a":[{"who":"贝索斯","cn":"押注不变的东西","u":"/i/bezos/what-wont-change/","hint":"没人问他这个问题，他说这才是重点"},{"who":"主权个人","cn":"暴力的逻辑","u":"/i/sovereign-individual/logic-of-violence/","hint":"保护与勒索的成本比，决定社会的形状"}]},{"q":"同样的条件，我们差在哪？","a":[{"who":"国家为什么会失败","cn":"一墙之隔的诺加莱斯","u":"/i/why-nations-fail/two-nogales/","hint":"同一片沙漠，同一群人的后代，两种命运"},{"who":"哈耶克","cn":"知识是分散的","u":"/i/hayek/knowledge-is-dispersed/","hint":"价格是一套压缩过的电报系统"}]},{"q":"我看不出这局面是怎么形成的。","a":[{"who":"枪炮、病菌与钢铁","cn":"大陆的轴线","u":"/i/guns-germs-steel/axis-of-continents/","hint":"东西向的大陆自带传播红利"},{"who":"人类简史","cn":"靠虚构合作","u":"/i/sapiens/fictions-that-cooperate/","hint":"陌生人大规模协作的黏合剂不是真的"}]},{"q":"大家都这么做，可我说不出为什么。","a":[{"who":"人类简史","cn":"小麦驯化了我们","u":"/i/sapiens/wheat-domesticated-us/","hint":"物种赢了，个体输了"},{"who":"孟子","cn":"以力服人与以德服人","u":"/i/mencius/force-vs-virtue/","hint":"你一离开，靠力气建立的秩序就归零"}]},{"q":"我看不出下一步棋该往哪走。","a":[{"who":"诸葛亮","cn":"隆中对","u":"/i/zhuge-liang/longzhong-plan/","hint":"战略的前半段全是排除法"},{"who":"李泌","cn":"先取范阳","u":"/i/li-bi/strike-the-base/","hint":"收回两京最好看，也最不解决问题"}]}]},{"t":"两个都想要","g":"跟人打交道","qs":[{"q":"两个我都想要，可只能选一个。","a":[{"who":"乔布斯","cn":"专注就是说不","u":"/i/jobs/focus-is-saying-no/","hint":"他回归后把几十条产品线砍成四格"},{"who":"查理·芒格","cn":"反过来想","u":"/i/munger/invert/","hint":"知道自己会死在哪里，就永远不去那儿"}]},{"q":"看着都好，我到底适合哪个？","a":[{"who":"巴菲特","cn":"能力圈","u":"/i/buffett/circle-of-competence/","hint":"圈多大不要紧，知不知道边在哪要命"},{"who":"段永平","cn":"做对的事情，把事情做对","u":"/i/duan-yongping/right-things-done-right/","hint":"发现错了，马上停，任何代价都是最小代价"}]},{"q":"我到底为什么要打这一仗？","a":[{"who":"战争论","cn":"政治的继续","u":"/i/on-war/continuation-of-politics/","hint":"忘了为什么打的仗，赢了也没用"},{"who":"孙子兵法","cn":"先胜而后求战","u":"/i/sun-tzu/win-before-fighting/","hint":"打得漂亮，往往是没准备好的补救"}]}]},{"t":"信不信直觉","g":"跟人打交道","qs":[{"q":"直觉和数据打架，我听哪个？","a":[{"who":"思考，快与慢","cn":"所见即全部","u":"/i/thinking-fast-and-slow/wysiati/","hint":"系统1从不告诉你它没看到什么"},{"who":"吉姆·西蒙斯","cn":"像奴隶一样跟随模型","u":"/i/simons/slave-to-the-model/","hint":"人负责改模型，不负责改单次决定"}]},{"q":"这次的直觉，我信得过吗？","a":[{"who":"吉姆·西蒙斯","cn":"美感与最好的人","u":"/i/simons/simons-principles/","hint":"五条原则，没有一条讲数学"},{"who":"王阳明","cn":"致良知","u":"/i/wang-yangming/innate-knowing/","hint":"难的不是不知道，是不肯认"}]},{"q":"我查的资料全都在支持我。","a":[{"who":"卡尔·波普尔","cn":"去找反例，别再找支持","u":"/i/popper/seek-refutation/","hint":"支持的例子再多也不能证明结论"},{"who":"费曼","cn":"第一个别骗的是自己","u":"/i/feynman/dont-fool-yourself/","hint":"科学的第一原则，防的是研究者本人"}]},{"q":"我死活不肯承认这次买错了。","a":[{"who":"索罗斯","cn":"知道自己什么时候错","u":"/i/soros/knowing-when-wrong/","hint":"他说自己富有只因为认错快"},{"who":"吉姆·西蒙斯","cn":"像奴隶一样跟随模型","u":"/i/simons/slave-to-the-model/","hint":"人负责改模型，不负责改单次决定"}]},{"q":"我这一眼看过去，就是觉得不对。","a":[{"who":"思考，快与慢","cn":"所见即全部","u":"/i/thinking-fast-and-slow/wysiati/","hint":"系统1从不告诉你它没看到什么"},{"who":"卡尔·波普尔","cn":"去找反例，别再找支持","u":"/i/popper/seek-refutation/","hint":"支持的例子再多也不能证明结论"}]}]},{"t":"定不好价","g":"跟人打交道","qs":[{"q":"东西是好东西，可就是卖不动。","a":[{"who":"国富论","cn":"晚餐不来自恩惠","u":"/i/wealth-of-nations/not-benevolence/","hint":"求人办事，先讲他能得什么"},{"who":"彼得·德鲁克","cn":"企业的目的是创造顾客","u":"/i/drucker/create-a-customer/","hint":"利润是结果，不是目的"}]},{"q":"我定多少钱，人才愿意掏？","a":[{"who":"松下幸之助","cn":"自来水哲学","u":"/i/matsushita/tap-water/","hint":"让电器像自来水一样便宜到近乎免费"},{"who":"马斯克","cn":"白痴指数","u":"/i/musk/idiot-index/","hint":"指数越高，说明收费的是流程不是物理"}]},{"q":"我不知道该收多少钱。","a":[{"who":"凯文·凯利","cn":"一千个铁杆粉丝","u":"/i/kevin-kelly/thousand-true-fans/","hint":"一千乘一百，就是活得下去"},{"who":"纳瓦尔","cn":"把自己产品化","u":"/i/naval/productize-yourself/","hint":"四个字，一半是做什么，一半是怎么放大"}]}]},{"t":"遇上不讲理","g":"跟人打交道","qs":[{"q":"我跟他讲道理，完全没用。","a":[{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类"},{"who":"马基雅维利","cn":"从实然出发","u":"/i/machiavelli/as-it-is/","hint":"按应然设计的制度，第一天就漏"}]},{"q":"我要不要照他的路数回敬？","a":[{"who":"甘地","cn":"手段如种子","u":"/i/gandhi/means-are-seeds/","hint":"目的不能给手段消毒"},{"who":"苏轼","cn":"眼前见天下无一个不好人","u":"/i/su-shi/no-bad-people/","hint":"不是天真，是拒绝用敌我看世界"}]},{"q":"对方来势很硬，我硬碰吗？","a":[{"who":"甘地","cn":"食盐进军","u":"/i/gandhi/salt-march/","hint":"帝国的问题千头万绪，他挑了盐"},{"who":"马基雅维利","cn":"被畏惧而不被憎恨","u":"/i/machiavelli/feared-not-hated/","hint":"碰钱和碰家人，是两条不同的线"}]},{"q":"对方根本不跟我讲道理。","a":[{"who":"甘地","cn":"食盐进军","u":"/i/gandhi/salt-march/","hint":"帝国的问题千头万绪，他挑了盐"},{"who":"乌合之众","cn":"进入群体的人","u":"/i/crowd/descent-in-crowds/","hint":"一群聪明人可以做出所有成员单独都不会做的蠢事"}]}]},{"t":"功劳被抢","g":"跟人打交道","qs":[{"q":"事是我做的，功是别人的。","a":[{"who":"智慧书","cn":"做，并且让人看见","u":"/i/art-of-worldly-wisdom/do-and-be-seen/","hint":"没被看见的事，在别人的账上等于没做"},{"who":"项羽","cn":"衣绣夜行","u":"/i/xiang-yu/brocade-at-night/","hint":"关中不要，非回彭城不可"}]},{"q":"这个功，我要不要去争？","a":[{"who":"张良","cn":"愿封留足矣","u":"/i/zhang-liang/asking-for-less/","hint":"让给你的人放心，比多拿三万户值钱"},{"who":"郭子仪","cn":"门不设禁","u":"/i/guo-ziyi/open-gates/","hint":"藏起来的人才需要被查"}]},{"q":"活是我干的，功劳记在别人头上。","a":[{"who":"拉罗什富科","cn":"没人抱怨自己的判断力","u":"/i/la-rochefoucauld/memory-vs-judgment/","hint":"人人都说记性差，没人说眼光差"},{"who":"智慧书","cn":"做，并且让人看见","u":"/i/art-of-worldly-wisdom/do-and-be-seen/","hint":"没被看见的事，在别人的账上等于没做"}]}]},{"t":"该不该妥协","g":"跟人打交道","qs":[{"q":"退这一步，是务实还是没底线？","a":[{"who":"俾斯麦","cn":"可能性的艺术","u":"/i/bismarck/art-of-the-possible/","hint":"统一之后他做的全是防止再打"},{"who":"李光耀","cn":"管用吗","u":"/i/lee-kuan-yew/does-it-work/","hint":"他公开说自己不信任何一套理论"}]},{"q":"手段脏了，目的还干净吗？","a":[{"who":"甘地","cn":"手段如种子","u":"/i/gandhi/means-are-seeds/","hint":"目的不能给手段消毒"},{"who":"马基雅维利","cn":"从实然出发","u":"/i/machiavelli/as-it-is/","hint":"按应然设计的制度，第一天就漏"}]},{"q":"对方有诚意，我怎么判断？","a":[{"who":"塔勒布","cn":"利益攸关","u":"/i/taleb/skin-in-the-game/","hint":"别告诉我你怎么想，告诉我你持有什么"},{"who":"拉罗什富科","cn":"虚伪是恶行向美德的致敬","u":"/i/la-rochefoucauld/vice-pays-tribute/","hint":"连坏人都要装好，说明好是硬通货"}]},{"q":"道理站在我这边，可事办不成。","a":[{"who":"李光耀","cn":"管用吗","u":"/i/lee-kuan-yew/does-it-work/","hint":"他公开说自己不信任何一套理论"},{"who":"论语","cn":"和而不同","u":"/i/analects/harmony-not-sameness/","hint":"全票通过的会最可疑"}]}]},{"t":"推不动别人","g":"跟人打交道","qs":[{"q":"别的部门就是不配合我。","a":[{"who":"系统之美","cn":"杠杆点","u":"/i/thinking-in-systems/leverage-points/","hint":"人们凭直觉找到杠杆点，然后朝错误的方向推"},{"who":"任正非","cn":"让听得见炮声的人呼唤炮火","u":"/i/ren-zhengfei/sound-of-gunfire/","hint":"谁离客户近，谁指挥资源"}]},{"q":"我没有权力，还怎么推动事？","a":[{"who":"李泌","cn":"臣绝粒无家","u":"/i/li-bi/no-office/","hint":"四次入朝四次归山，每次都不受官"},{"who":"张良","cn":"借箸代筹","u":"/i/zhang-liang/borrowing-chopsticks/","hint":"八条反驳，条条落在执行上"}]},{"q":"我上面的人明摆着不想变。","a":[{"who":"国家为什么会失败","cn":"精英为什么拦着进步","u":"/i/why-nations-fail/fear-of-creative-destruction/","hint":"拦路的人算得很清楚"},{"who":"主权个人","cn":"从公民到顾客","u":"/i/sovereign-individual/citizen-to-customer/","hint":"他们在1997年预言了数字货币"}]},{"q":"这摊子太烂，我该下重手吗？","a":[{"who":"朱元璋","cn":"治吏用重典","u":"/i/zhu-yuanzhang/heavy-law/","hint":"他自己说这套只适用于这一代"},{"who":"管仲","cn":"政之所兴，在顺民心","u":"/i/guan-zhong/follow-the-people/","hint":"逆着人性设计的政策，执行成本无限高"}]}]},{"t":"合伙人闹掰","g":"跟人打交道","qs":[{"q":"分钱这事，我怕埋雷。","a":[{"who":"张良","cn":"愿封留足矣","u":"/i/zhang-liang/asking-for-less/","hint":"让给你的人放心，比多拿三万户值钱"},{"who":"韩非子","cn":"二柄","u":"/i/han-feizi/two-handles/","hint":"把奖惩交出去，位置就空了"}]},{"q":"话都说绝了，还修得回来吗？","a":[{"who":"曹操","cn":"官渡烧信","u":"/i/cao-cao/burning-the-letters/","hint":"查清楚了，你会失去一半的人"},{"who":"曼德拉","cn":"穿上对手的球衣","u":"/i/mandela/springbok-jersey/","hint":"那件球衣曾是压迫的标志"}]},{"q":"当初没写清楚，现在我们各说各的。","a":[{"who":"韩非子","cn":"形名参同","u":"/i/han-feizi/form-and-name/","hint":"对不上的地方就是问题所在"},{"who":"刘邦","cn":"约法三章","u":"/i/liu-bang/three-articles/","hint":"三条说得完，才有人信"}]},{"q":"我想散伙，可事还得做下去。","a":[{"who":"李嘉诚","cn":"知止","u":"/i/li-ka-shing/knowing-when-to-stop/","hint":"扩张年代挂一幅劝刹车的字"},{"who":"韩信","cn":"不反也不退","u":"/i/han-xin/neither-nor/","hint":"两条路都不选，等于选了最坏的一条"}]}]},{"t":"觉得没意义","g":"跟人打交道","qs":[{"q":"每天都一样，我不知道图什么。","a":[{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中"},{"who":"庄子","cn":"无用之用","u":"/i/zhuangzi/use-of-uselessness/","hint":"有用是一种被消耗的资格"}]},{"q":"我做这些，到底为了什么？","a":[{"who":"稻盛和夫","cn":"动机至善，私心了无","u":"/i/inamori/pure-motive/","hint":"他每晚问自己是不是想出风头"},{"who":"弗兰克尔","cn":"最后的自由","u":"/i/frankl/the-last-freedom/","hint":"这句话的分量在它写作的地点"}]},{"q":"赢了这一局，然后呢？","a":[{"who":"有限与无限的游戏","cn":"两种游戏","u":"/i/finite-and-infinite-games/two-kinds/","hint":"赢下的每一局都会结束，游戏本身可以不结束"},{"who":"有限与无限的游戏","cn":"与边界游戏","u":"/i/finite-and-infinite-games/playing-with-boundaries/","hint":"有限玩家在边界内玩，无限玩家玩边界"}]},{"q":"样样都做得不错，我却不知道要什么。","a":[{"who":"优秀的绵羊","cn":"擅长跨栏，不擅长选路","u":"/i/excellent-sheep/hurdles/","hint":"做到最好，和决定什么值得做"},{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么"}]},{"q":"我非得离开这日子才能修行？","a":[{"who":"六祖慧能","cn":"佛法在世间","u":"/i/huineng/in-the-world/","hint":"离开日常去找方法，是在找兔子的角"},{"who":"冯道","cn":"长乐老自叙","u":"/i/feng-dao/the-long-happy-old-man/","hint":"忠的对象到底是谁"}]}]},{"t":"要不要跳槽","g":"跟人打交道","qs":[{"q":"还待得下去吗，我不确定。","a":[{"who":"约翰·博伊德","cn":"做大人物还是做成事","u":"/i/boyd/to-be-or-to-do/","hint":"他对每个下属都讲过同一个选择"},{"who":"张一鸣","cn":"延迟满足感","u":"/i/zhang-yiming/delayed-gratification/","hint":"很多人的问题在于太想赢眼前这一局"}]},{"q":"钱和成长，我该先要哪个？","a":[{"who":"纳瓦尔","cn":"把自己产品化","u":"/i/naval/productize-yourself/","hint":"四个字，一半是做什么，一半是怎么放大"},{"who":"巴菲特","cn":"能力圈","u":"/i/buffett/circle-of-competence/","hint":"圈多大不要紧，知不知道边在哪要命"}]},{"q":"平台给我流量，可人不是我的。","a":[{"who":"凯文·凯利","cn":"中间不能有人","u":"/i/kevin-kelly/direct-relationship/","hint":"隔一层平台，这道算术就不成立"},{"who":"纳瓦尔","cn":"睡觉时也在赚钱的资产","u":"/i/naval/assets-while-you-sleep/","hint":"追求财富，别追求金钱或地位"}]}]},{"t":"信错了人","g":"跟人打交道","qs":[{"q":"我信错了人，现在不敢再信谁。","a":[{"who":"玛丽亚·康妮科娃","cn":"骗子不制造信任","u":"/i/konnikova/not-manufacturing-trust/","hint":"他不说服你，他找到你想要的"},{"who":"论语","cn":"视其所以，观其所由","u":"/i/analects/see-how/","hint":"看他做什么，看他为什么，看他心安在哪"}]},{"q":"回头看破绽很明显，当时我就是没看见。","a":[{"who":"玛丽亚·康妮科娃","cn":"骗子不制造信任","u":"/i/konnikova/not-manufacturing-trust/","hint":"他不说服你，他找到你想要的"},{"who":"玛丽亚·康妮科娃","cn":"转变期是高危窗口","u":"/i/konnikova/transition-is-the-window/","hint":"上当的不是笨人，是正在换轨的人"}]},{"q":"被坑过一次，我现在谁都防。","a":[{"who":"论语","cn":"视其所以，观其所由","u":"/i/analects/see-how/","hint":"看他做什么，看他为什么，看他心安在哪"},{"who":"韩非子","cn":"不恃人之为吾善","u":"/i/han-feizi/not-counting-on-goodness/","hint":"让做对的事成为最省力的选择"}]},{"q":"我心软，一次次给他机会。","a":[{"who":"阿德勒","cn":"课题分离","u":"/i/adler/separation-of-tasks/","hint":"后果谁承担，就是谁的课题"},{"who":"韩非子","cn":"二柄","u":"/i/han-feizi/two-handles/","hint":"把奖惩交出去，位置就空了"}]}]},{"t":"跟伴侣吵","g":"家里的事","qs":[{"q":"同一件事我们吵了很多次了。","a":[{"who":"约翰·戈特曼","cn":"末日四骑士","u":"/i/gottman/four-horsemen/","hint":"看十五分钟争吵，判断准确率超过九成"},{"who":"非暴力沟通","cn":"指责底下是需要","u":"/i/nonviolent-communication/needs-behind-blame/","hint":"所有攻击都是需要没被满足的笨拙表达"}]},{"q":"话说重了，还修得回来吗？","a":[{"who":"约翰·戈特曼","cn":"修复尝试","u":"/i/gottman/repair-attempts/","hint":"幸福的伴侣也吵，区别在有人踩得住刹车"},{"who":"关键对话","cn":"先造安全感","u":"/i/crucial-conversations/safety-first/","hint":"对话失败的时刻，是有人觉得不安全的时刻"}]},{"q":"我们说的根本不是同一件事。","a":[{"who":"萨提亚","cn":"冰山：行为之下还有几层","u":"/i/satir/iceberg/","hint":"发火底下是失望，再底下是期待"},{"who":"托马斯·戈登","cn":"我信息","u":"/i/thomas-gordon/i-message/","hint":"行为 + 对我的影响 + 我的感受"}]},{"q":"我们一吵就收不住。","a":[{"who":"约翰·戈特曼","cn":"末日四骑士","u":"/i/gottman/four-horsemen/","hint":"看十五分钟争吵，判断准确率超过九成"},{"who":"约翰·戈特曼","cn":"修复尝试","u":"/i/gottman/repair-attempts/","hint":"幸福的伴侣也吵，区别在有人踩得住刹车"}]}]},{"t":"孩子不听","g":"家里的事","qs":[{"q":"说了很多遍，他还是不做。","a":[{"who":"蒙台梭利","cn":"先改环境，再谈行为","u":"/i/montessori/prepared-environment/","hint":"换一个握得住的小壶，胜过说一百次小心"},{"who":"阿德勒","cn":"课题分离","u":"/i/adler/separation-of-tasks/","hint":"后果谁承担，就是谁的课题"}]},{"q":"我该管到什么程度？","a":[{"who":"阿德勒","cn":"课题分离","u":"/i/adler/separation-of-tasks/","hint":"后果谁承担，就是谁的课题"},{"who":"蒙台梭利","cn":"帮助我，让我自己做","u":"/i/montessori/help-me-do-it-myself/","hint":"你系上鞋带省了两分钟，代价是他明天还不会"}]},{"q":"我说的每句他都顶回来。","a":[{"who":"托马斯·戈登","cn":"我信息","u":"/i/thomas-gordon/i-message/","hint":"行为 + 对我的影响 + 我的感受"},{"who":"托马斯·戈登","cn":"这问题是谁的","u":"/i/thomas-gordon/problem-ownership/","hint":"困扰他就听，困扰我才说"}]},{"q":"说了多少遍，他就是不做。","a":[{"who":"蒙台梭利","cn":"先改环境，再谈行为","u":"/i/montessori/prepared-environment/","hint":"换一个握得住的小壶，胜过说一百次小心"},{"who":"蒙台梭利","cn":"帮助我，让我自己做","u":"/i/montessori/help-me-do-it-myself/","hint":"你系上鞋带省了两分钟，代价是他明天还不会"}]}]},{"t":"孩子不说话","g":"家里的事","qs":[{"q":"他什么都不跟我讲了。","a":[{"who":"依恋理论","cn":"信息在重聚那一刻","u":"/i/attachment-theory/strange-situation/","hint":"回避型孩子的心率和哭闹的一样高"},{"who":"卡尔·罗杰斯","cn":"无条件积极关注","u":"/i/carl-rogers/unconditional-regard/","hint":"说了真话不会失去关系，人才敢说真话"}]},{"q":"我怎么让他愿意开口？","a":[{"who":"卡尔·罗杰斯","cn":"复述到对方点头","u":"/i/carl-rogers/reflective-listening/","hint":"他常常是在听你复述时，才第一次听清自己"},{"who":"非暴力沟通","cn":"先说观察，别说评论","u":"/i/nonviolent-communication/observation-not-evaluation/","hint":"「你总是迟到」和「你这周迟到三次」是两件事"}]},{"q":"他有事也不跟我讲了。","a":[{"who":"托马斯·戈登","cn":"这问题是谁的","u":"/i/thomas-gordon/problem-ownership/","hint":"困扰他就听，困扰我才说"},{"who":"萨提亚","cn":"冰山：行为之下还有几层","u":"/i/satir/iceberg/","hint":"发火底下是失望，再底下是期待"}]},{"q":"我一开口，他就把门关上了。","a":[{"who":"非暴力沟通","cn":"先说观察，别说评论","u":"/i/nonviolent-communication/observation-not-evaluation/","hint":"「你总是迟到」和「你这周迟到三次」是两件事"},{"who":"卡尔·罗杰斯","cn":"复述到对方点头","u":"/i/carl-rogers/reflective-listening/","hint":"他常常是在听你复述时，才第一次听清自己"}]}]},{"t":"被家人的情绪裹着","g":"家里的事","qs":[{"q":"家里一有事，我整个人就乱了。","a":[{"who":"塞涅卡","cn":"愤怒有一道闸门","u":"/i/seneca/on-anger/","hint":"愤怒是三步，只有第二步归你管"},{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类"}]},{"q":"我是该迁就，还是干脆躲远点？","a":[{"who":"阿德勒","cn":"课题分离","u":"/i/adler/separation-of-tasks/","hint":"后果谁承担，就是谁的课题"},{"who":"依恋理论","cn":"安全基地","u":"/i/attachment-theory/secure-base/","hint":"确信身后有人，才敢跑远去玩"}]},{"q":"家里一有事，我就没了自己。","a":[{"who":"鲍恩","cn":"既在关系里，又是自己","u":"/i/bowen/differentiation/","hint":"跟着难受是融合，从此不来往是切割"},{"who":"萨提亚","cn":"压力下的四种姿态","u":"/i/satir/coping-stances/","hint":"四种都在回避真实"}]},{"q":"一到家里，我就变成另一个人。","a":[{"who":"萨提亚","cn":"压力下的四种姿态","u":"/i/satir/coping-stances/","hint":"四种都在回避真实"},{"who":"依恋理论","cn":"安全基地","u":"/i/attachment-theory/secure-base/","hint":"确信身后有人，才敢跑远去玩"}]}]},{"t":"父母催得紧","g":"家里的事","qs":[{"q":"我每次回家都要吵一轮。","a":[{"who":"阿德勒","cn":"课题分离","u":"/i/adler/separation-of-tasks/","hint":"后果谁承担，就是谁的课题"},{"who":"非暴力沟通","cn":"指责底下是需要","u":"/i/nonviolent-communication/needs-behind-blame/","hint":"所有攻击都是需要没被满足的笨拙表达"}]},{"q":"我怎么说才不伤人也不妥协？","a":[{"who":"克里斯·沃斯","cn":"把对方的情绪说出来","u":"/i/chris-voss/labeling/","hint":"人被准确说中，就很难继续把你当敌人"},{"who":"关键对话","cn":"从心出发","u":"/i/crucial-conversations/start-with-heart/","hint":"情绪一上来，目标会偷偷从解决问题换成赢"}]},{"q":"他们的着急全压在我身上。","a":[{"who":"鲍恩","cn":"拉进第三个人","u":"/i/bowen/triangles/","hint":"缓解了当下，也固化了结构"},{"who":"鲍恩","cn":"既在关系里，又是自己","u":"/i/bowen/differentiation/","hint":"跟着难受是融合，从此不来往是切割"}]},{"q":"又吵起来了，我已经忘了为什么。","a":[{"who":"关键对话","cn":"从心出发","u":"/i/crucial-conversations/start-with-heart/","hint":"情绪一上来，目标会偷偷从解决问题换成赢"},{"who":"克里斯·沃斯","cn":"把对方的情绪说出来","u":"/i/chris-voss/labeling/","hint":"人被准确说中，就很难继续把你当敌人"}]},{"q":"两个人的事，总要拉进第三个人。","a":[{"who":"鲍恩","cn":"拉进第三个人","u":"/i/bowen/triangles/","hint":"缓解了当下，也固化了结构"},{"who":"阿德勒","cn":"不是因为，是为了","u":"/i/adler/teleology/","hint":"他不是走不出过去，是需要过去"}]}]},{"t":"身边人不敢跟我说真话","g":"家里的事","qs":[{"q":"他们只报好消息给我。","a":[{"who":"卡尔·罗杰斯","cn":"无条件积极关注","u":"/i/carl-rogers/unconditional-regard/","hint":"说了真话不会失去关系，人才敢说真话"},{"who":"依恋理论","cn":"信息在重聚那一刻","u":"/i/attachment-theory/strange-situation/","hint":"回避型孩子的心率和哭闹的一样高"}]},{"q":"我上次的反应，是不是把人吓住了？","a":[{"who":"关键对话","cn":"先造安全感","u":"/i/crucial-conversations/safety-first/","hint":"对话失败的时刻，是有人觉得不安全的时刻"},{"who":"曹操","cn":"官渡烧信","u":"/i/cao-cao/burning-the-letters/","hint":"查清楚了，你会失去一半的人"}]},{"q":"等我知道的时候，事已经砸了。","a":[{"who":"关键对话","cn":"先造安全感","u":"/i/crucial-conversations/safety-first/","hint":"对话失败的时刻，是有人觉得不安全的时刻"},{"who":"战国策","cn":"邹忌照镜子","u":"/i/strategies-of-the-warring-states/three-mirrors/","hint":"夸得越好听，越要问他图什么"}]},{"q":"我问了，他们还是说没事。","a":[{"who":"卡尔·罗杰斯","cn":"复述到对方点头","u":"/i/carl-rogers/reflective-listening/","hint":"他常常是在听你复述时，才第一次听清自己"},{"who":"苏格拉底","cn":"产婆术","u":"/i/socrates/midwifery/","hint":"答案要从对方身上生出来才算数"}]}]},{"t":"家里的活没人算","g":"家里的事","qs":[{"q":"我做的这些，好像不算数。","a":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时"},{"who":"阿莉·霍克希尔德","cn":"情感劳动","u":"/i/hochschild/emotional-labor/","hint":"被要求的情绪也是工作量"}]},{"q":"我在家全天连轴转，还被说没上班。","a":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时"},{"who":"萨提亚","cn":"压力下的四种姿态","u":"/i/satir/coping-stances/","hint":"四种都在回避真实"}]},{"q":"这些事总落在我头上。","a":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时"},{"who":"托马斯·戈登","cn":"我信息","u":"/i/thomas-gordon/i-message/","hint":"行为 + 对我的影响 + 我的感受"}]},{"q":"我一提，就变成我在抱怨。","a":[{"who":"非暴力沟通","cn":"先说观察，别说评论","u":"/i/nonviolent-communication/observation-not-evaluation/","hint":"「你总是迟到」和「你这周迟到三次」是两件事"},{"who":"萨提亚","cn":"冰山：行为之下还有几层","u":"/i/satir/iceberg/","hint":"发火底下是失望，再底下是期待"}]}]},{"t":"照顾老人","g":"家里的事","qs":[{"q":"爸妈老了，我不知道能做什么。","a":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时"},{"who":"托马斯·戈登","cn":"这问题是谁的","u":"/i/thomas-gordon/problem-ownership/","hint":"困扰他就听，困扰我才说"}]},{"q":"照顾他，把我自己也耗空了。","a":[{"who":"阿莉·霍克希尔德","cn":"情感劳动","u":"/i/hochschild/emotional-labor/","hint":"被要求的情绪也是工作量"},{"who":"萨波尔斯基","cn":"为逃命设计，被开成常态","u":"/i/sapolsky/stress-mismatch/","hint":"斑马跑掉就关，人一直开着"}]},{"q":"兄弟姐妹几个，就我在管。","a":[{"who":"托马斯·戈登","cn":"这问题是谁的","u":"/i/thomas-gordon/problem-ownership/","hint":"困扰他就听，困扰我才说"},{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时"}]},{"q":"我又想尽孝，又想过自己的日子。","a":[{"who":"阿德勒","cn":"课题分离","u":"/i/adler/separation-of-tasks/","hint":"后果谁承担，就是谁的课题"},{"who":"克里斯汀·内夫","cn":"三样必须同时在","u":"/i/kristin-neff/three-parts/","hint":"少一样就变成自怜、忍受或冷漠"}]}]},{"t":"被背叛了","g":"家里的事","qs":[{"q":"他背着我做了那件事。","a":[{"who":"约翰·戈特曼","cn":"末日四骑士","u":"/i/gottman/four-horsemen/","hint":"看十五分钟争吵，判断准确率超过九成"},{"who":"玛丽亚·康妮科娃","cn":"骗子不制造信任","u":"/i/konnikova/not-manufacturing-trust/","hint":"他不说服你，他找到你想要的"}]},{"q":"我原谅了，可心里过不去。","a":[{"who":"约翰·戈特曼","cn":"修复尝试","u":"/i/gottman/repair-attempts/","hint":"幸福的伴侣也吵，区别在有人踩得住刹车"},{"who":"爱比克泰德","cn":"扰乱你的不是事情","u":"/i/epictetus/judgments-not-things/","hint":"死亡不可怕这句话，重点在后半句"}]},{"q":"还要不要继续，我拿不定。","a":[{"who":"韩信","cn":"不反也不退","u":"/i/han-xin/neither-nor/","hint":"两条路都不选，等于选了最坏的一条"},{"who":"李嘉诚","cn":"知止","u":"/i/li-ka-shing/knowing-when-to-stop/","hint":"扩张年代挂一幅劝刹车的字"}]}]},{"t":"睡不好","g":"身体与精力","qs":[{"q":"我一躺下脑子就停不下来。","a":[{"who":"约翰·瑞迪","cn":"焦虑时动比想有用","u":"/i/john-ratey/move-before-you-think/","hint":"想不通的事，走一圈之后常常没那么可怕"},{"who":"塞涅卡","cn":"愤怒有一道闸门","u":"/i/seneca/on-anger/","hint":"愤怒是三步，只有第二步归你管"}]},{"q":"睡够了还是觉得累。","a":[{"who":"约翰·瑞迪","cn":"运动是给大脑用的","u":"/i/john-ratey/exercise-for-the-brain/","hint":"把体育课挪到第一节，成绩变了"},{"who":"卡尔·纽波特","cn":"注意力残留","u":"/i/cal-newport/attention-residue/","hint":"回了一条消息，之后半小时都在打折"}]},{"q":"越怕睡不着，就越睡不着。","a":[{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中"},{"who":"萨波尔斯基","cn":"不确定比强度更伤","u":"/i/sapolsky/predictability/","hint":"知道电击何时来的动物，损伤小得多"}]},{"q":"睡前那会儿，白天的事全回来了。","a":[{"who":"马可·奥勒留","cn":"晨起预演","u":"/i/marcus-aurelius/morning-preparation/","hint":"预料到的冒犯，伤害减半"},{"who":"卡尔·纽波特","cn":"注意力残留","u":"/i/cal-newport/attention-residue/","hint":"回了一条消息，之后半小时都在打折"}]}]},{"t":"精力跟不上","g":"身体与精力","qs":[{"q":"一到下午我就废了。","a":[{"who":"约翰·瑞迪","cn":"运动是给大脑用的","u":"/i/john-ratey/exercise-for-the-brain/","hint":"把体育课挪到第一节，成绩变了"},{"who":"卡尔·纽波特","cn":"整块时间要占住","u":"/i/cal-newport/schedule-the-depth/","hint":"像开会一样把深度时段写进日程"}]},{"q":"我是不是一直在硬撑？","a":[{"who":"塞涅卡","cn":"时间是唯一追不回的成本","u":"/i/seneca/on-shortness-of-life/","hint":"不是我们的时间太短，是浪费得太多"},{"who":"约翰·瑞迪","cn":"焦虑时动比想有用","u":"/i/john-ratey/move-before-you-think/","hint":"想不通的事，走一圈之后常常没那么可怕"}]},{"q":"我最好的状态去哪了？","a":[{"who":"契克森米哈赖","cn":"最好的时刻不在休息里","u":"/i/csikszentmihalyi/leisure-paradox/","hint":"人想休息，但心流多在工作中"},{"who":"萨波尔斯基","cn":"为逃命设计，被开成常态","u":"/i/sapolsky/stress-mismatch/","hint":"斑马跑掉就关，人一直开着"}]}]},{"t":"坐不住","g":"身体与精力","qs":[{"q":"我一会儿就想去看手机。","a":[{"who":"卡尔·纽波特","cn":"注意力残留","u":"/i/cal-newport/attention-residue/","hint":"回了一条消息，之后半小时都在打折"},{"who":"原子习惯","cn":"从身份下手","u":"/i/atomic-habits/identity-first/","hint":"每个小行动都是给某个身份投的一票"}]},{"q":"整块时间总是被切碎。","a":[{"who":"卡尔·纽波特","cn":"整块时间要占住","u":"/i/cal-newport/schedule-the-depth/","hint":"像开会一样把深度时段写进日程"},{"who":"塞涅卡","cn":"时间是唯一追不回的成本","u":"/i/seneca/on-shortness-of-life/","hint":"不是我们的时间太短，是浪费得太多"}]},{"q":"我一坐下就想干点别的。","a":[{"who":"契克森米哈赖","cn":"卡在能力边缘那条通道","u":"/i/csikszentmihalyi/flow-channel/","hint":"心流只在很窄的一段里发生"},{"who":"BJ·福格","cn":"挂在锚点上，做完就庆祝","u":"/i/bj-fogg/anchor-and-celebrate/","hint":"大脑靠情绪记住习惯，不靠次数"}]},{"q":"太难我慌，太简单我又走神。","a":[{"who":"契克森米哈赖","cn":"卡在能力边缘那条通道","u":"/i/csikszentmihalyi/flow-channel/","hint":"心流只在很窄的一段里发生"},{"who":"契克森米哈赖","cn":"最好的时刻不在休息里","u":"/i/csikszentmihalyi/leisure-paradox/","hint":"人想休息，但心流多在工作中"}]}]},{"t":"想改个习惯","g":"身体与精力","qs":[{"q":"我下过很多次决心，每次都断。","a":[{"who":"原子习惯","cn":"从身份下手","u":"/i/atomic-habits/identity-first/","hint":"每个小行动都是给某个身份投的一票"},{"who":"阿德勒","cn":"不是因为，是为了","u":"/i/adler/teleology/","hint":"他不是走不出过去，是需要过去"}]},{"q":"我怎么才能坚持下来？","a":[{"who":"原子习惯","cn":"落到系统的水平","u":"/i/atomic-habits/systems-over-goals/","hint":"每支队都想赢冠军，目标区分不出谁赢"},{"who":"富兰克林","cn":"一周只练一条","u":"/i/franklin/one-virtue-a-week/","hint":"十三条同时练等于一条都不练"}]},{"q":"每次都靠咬牙，撑不了几天。","a":[{"who":"BJ·福格","cn":"小到最糟那天也做得到","u":"/i/bj-fogg/tiny-habits/","hint":"两个俯卧撑，从没失败过"},{"who":"BJ·福格","cn":"挂在锚点上，做完就庆祝","u":"/i/bj-fogg/anchor-and-celebrate/","hint":"大脑靠情绪记住习惯，不靠次数"}]},{"q":"我一直在练，可就是没长进。","a":[{"who":"艾利克森","cn":"一万小时是误读","u":"/i/ericsson/not-ten-thousand-hours/","hint":"十年经验，也可能是一年重复了十次"},{"who":"维果茨基","cn":"最近发展区","u":"/i/vygotsky/zpd/","hint":"给点提示就能做到的那一段"}]}]},{"t":"长期紧绷","g":"身体与精力","qs":[{"q":"我好像很久没真正松下来了。","a":[{"who":"塞涅卡","cn":"时间是唯一追不回的成本","u":"/i/seneca/on-shortness-of-life/","hint":"不是我们的时间太短，是浪费得太多"},{"who":"约翰·瑞迪","cn":"焦虑时动比想有用","u":"/i/john-ratey/move-before-you-think/","hint":"想不通的事，走一圈之后常常没那么可怕"}]},{"q":"这样下去我会不会垮？","a":[{"who":"约翰·瑞迪","cn":"运动是给大脑用的","u":"/i/john-ratey/exercise-for-the-brain/","hint":"把体育课挪到第一节，成绩变了"},{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类"}]},{"q":"我这根弦绷了太久了。","a":[{"who":"萨波尔斯基","cn":"为逃命设计，被开成常态","u":"/i/sapolsky/stress-mismatch/","hint":"斑马跑掉就关，人一直开着"},{"who":"萨波尔斯基","cn":"不确定比强度更伤","u":"/i/sapolsky/predictability/","hint":"知道电击何时来的动物，损伤小得多"}]},{"q":"压力不算大，我却一直绷着。","a":[{"who":"萨波尔斯基","cn":"不确定比强度更伤","u":"/i/sapolsky/predictability/","hint":"知道电击何时来的动物，损伤小得多"},{"who":"尼采","cn":"凝视深渊","u":"/i/nietzsche/gazing-into-abyss/","hint":"打法会长进打的人身上"}]}]},{"t":"时间不够用","g":"身体与精力","qs":[{"q":"一天下来，没一件是我自己的事。","a":[{"who":"塞涅卡","cn":"时间是唯一追不回的成本","u":"/i/seneca/on-shortness-of-life/","hint":"不是我们的时间太短，是浪费得太多"},{"who":"卡尔·纽波特","cn":"整块时间要占住","u":"/i/cal-newport/schedule-the-depth/","hint":"像开会一样把深度时段写进日程"}]},{"q":"我到底该砍掉哪一块？","a":[{"who":"富兰克林","cn":"一周只练一条","u":"/i/franklin/one-virtue-a-week/","hint":"十三条同时练等于一条都不练"},{"who":"原子习惯","cn":"落到系统的水平","u":"/i/atomic-habits/systems-over-goals/","hint":"每支队都想赢冠军，目标区分不出谁赢"}]},{"q":"家里的活，我好像永远做不完。","a":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时"},{"who":"卡尔·纽波特","cn":"整块时间要占住","u":"/i/cal-newport/schedule-the-depth/","hint":"像开会一样把深度时段写进日程"}]}]},{"t":"病了","g":"身体与精力","qs":[{"q":"检查结果出来了，我不敢看。","a":[{"who":"马可·奥勒留","cn":"从高处看","u":"/i/marcus-aurelius/view-from-above/","hint":"换一个时间尺度，多数急事会缩小"},{"who":"苏轼","cn":"也无风雨也无晴","u":"/i/su-shi/no-wind-no-rain/","hint":"淋完那场雨，回头看什么都没发生"}]},{"q":"这个病要跟我过一辈子。","a":[{"who":"萨波尔斯基","cn":"不确定比强度更伤","u":"/i/sapolsky/predictability/","hint":"知道电击何时来的动物，损伤小得多"},{"who":"爱比克泰德","cn":"扰乱你的不是事情","u":"/i/epictetus/judgments-not-things/","hint":"死亡不可怕这句话，重点在后半句"}]},{"q":"家里人病了，我撑着不能倒。","a":[{"who":"约翰·瑞迪","cn":"运动是给大脑用的","u":"/i/john-ratey/exercise-for-the-brain/","hint":"把体育课挪到第一节，成绩变了"},{"who":"阿莉·霍克希尔德","cn":"情感劳动","u":"/i/hochschild/emotional-labor/","hint":"被要求的情绪也是工作量"}]}]},{"t":"一路优秀，突然没了标准","g":"刚起步","qs":[{"q":"从小按分数活，现在没人给我打分了。","a":[{"who":"优秀的绵羊","cn":"擅长跨栏，不擅长选路","u":"/i/excellent-sheep/hurdles/","hint":"做到最好，和决定什么值得做"},{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么"}]},{"q":"我一直很优秀，可我不知道要去哪。","a":[{"who":"乔布斯","cn":"连点成线只能回头看","u":"/i/jobs/connecting-the-dots/","hint":"退学后旁听的字体课，十年后进了Mac"},{"who":"苏格拉底","cn":"不自以为知道","u":"/i/socrates/knowing-not-knowing/","hint":"神谕说他最智慧，他去证伪，结果证实了"}]},{"q":"没人给我题了，我不知道做什么。","a":[{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么"},{"who":"苏格拉底","cn":"产婆术","u":"/i/socrates/midwifery/","hint":"答案要从对方身上生出来才算数"}]},{"q":"我做的每件事都是为了给人看。","a":[{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么"},{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中"}]}]},{"t":"第一份工作","g":"刚起步","qs":[{"q":"刚进来，我什么都不会。","a":[{"who":"维果茨基","cn":"最近发展区","u":"/i/vygotsky/zpd/","hint":"给点提示就能做到的那一段"},{"who":"艾利克森","cn":"练已经会的等于休息","u":"/i/ericsson/deliberate-practice/","hint":"顶尖学生把时间花在弹不好的那几小节"}]},{"q":"我不知道该问人还是自己扛。","a":[{"who":"维果茨基","cn":"脚手架：给了要撤","u":"/i/vygotsky/scaffolding/","hint":"搭起来是为了拆掉"},{"who":"苏格拉底","cn":"产婆术","u":"/i/socrates/midwifery/","hint":"答案要从对方身上生出来才算数"}]},{"q":"我干的活好像谁都能干。","a":[{"who":"纳瓦尔","cn":"把自己产品化","u":"/i/naval/productize-yourself/","hint":"四个字，一半是做什么，一半是怎么放大"},{"who":"纳瓦尔","cn":"睡觉时也在赚钱的资产","u":"/i/naval/assets-while-you-sleep/","hint":"追求财富，别追求金钱或地位"}]}]},{"t":"要不要接着读书","g":"刚起步","qs":[{"q":"读还是工作，我怕选错了。","a":[{"who":"思考，快与慢","cn":"损失厌恶","u":"/i/thinking-fast-and-slow/loss-aversion/","hint":"同一笔钱，失去的痛两倍于得到的乐"},{"who":"黄仁勋","cn":"有尊严地撤退","u":"/i/huang/strategic-retreat/","hint":"撤退对最聪明的人来说最难"}]},{"q":"别人都在卷学历，我慌了。","a":[{"who":"艾利克森","cn":"一万小时是误读","u":"/i/ericsson/not-ten-thousand-hours/","hint":"十年经验，也可能是一年重复了十次"},{"who":"德韦克","cn":"这个效应比流行说法小得多","u":"/i/dweck/effect-size/","hint":"是温和因素，不是万能开关"}]},{"q":"多读几年，我怕跟社会脱节。","a":[{"who":"艾利克森","cn":"练已经会的等于休息","u":"/i/ericsson/deliberate-practice/","hint":"顶尖学生把时间花在弹不好的那几小节"},{"who":"李小龙","cn":"像水一样","u":"/i/bruce-lee/be-water/","hint":"水进杯是杯形，进壶是壶形，还能穿石"}]},{"q":"这书我是为自己读还是为交代。","a":[{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么"},{"who":"王阳明","cn":"致良知","u":"/i/wang-yangming/innate-knowing/","hint":"难的不是不知道，是不肯认"}]}]},{"t":"学的用不上","g":"刚起步","qs":[{"q":"学校教我的那套，在这儿对不上。","a":[{"who":"费曼","cn":"讲不明白就是没懂","u":"/i/feynman/teach-to-understand/","hint":"卡住的那一处，就是你没通的地方"},{"who":"李小龙","cn":"像水一样","u":"/i/bruce-lee/be-water/","hint":"水进杯是杯形，进壶是壶形，还能穿石"}]},{"q":"我看着都会，一动手就不行。","a":[{"who":"王阳明","cn":"知行合一","u":"/i/wang-yangming/unity-of-knowing-and-doing/","hint":"把懂了和会了分开，是给自己留退路"},{"who":"王阳明","cn":"事上磨练","u":"/i/wang-yangming/polish-on-things/","hint":"功夫在事情里，不在蒲团上"}]},{" indow/","hint":"上当的不是笨人，是正在换轨的人"}]},{"q":"到了新地方，机会一个都不找上门。","a":[{"who":"格兰诺维特","cn":"弱连接的力量","u":"/i/granovetter/weak-ties/","hint":"56% 只是偶尔见面的人"},{"who":"格兰诺维特","cn":"没有一条强连接是桥","u":"/i/granovetter/no-strong-tie-is-a-bridge/","hint":"你和好友知道的事高度重叠"}]},{"q":"圈子就这么大，我听不到新消息。","a":[{"who":"格兰诺维特","cn":"没有一条强连接是桥","u":"/i/granovetter/no-strong-tie-is-a-bridge/","hint":"你和好友知道的事高度重叠"},{"who":"主权个人","cn":"暴力的逻辑","u":"/i/sovereign-individual/logic-of-violence/","hint":"保护与勒索的成本比，决定社会的形状"}]}]},{"t":"事情我说了不算","g":"使不上劲","qs":[{"q":"这件事根本不由我决定。","a":[{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类"},{"who":"马基雅维利","cn":"命运与能力","u":"/i/machiavelli/fortune-and-virtu/","hint":"河堤要在洪水来之前修"}]},{"q":"我还能做点什么？","a":[{"who":"马可·奥勒留","cn":"障碍即道路","u":"/i/marcus-aurelius/obstacle-is-the-way/","hint":"火把扔进去的东西都会变成火"},{"who":"曼德拉","cn":"把审判变成讲台","u":"/i/mandela/rivonia/","hint":"他放弃了脱罪，换来四小时不被打断"}]},{"q":"规则别人定的，我怎么办？","a":[{"who":"主权个人","cn":"从公民到顾客","u":"/i/sovereign-individual/citizen-to-customer/","hint":"他们在1997年预言了数字货币"},{"who":"枪炮、病菌与钢铁","cn":"亚力之问","u":"/i/guns-germs-steel/yalis-question/","hint":"一个新几内亚人的问题，他答了二十五年"}]},{"q":"这些规矩谁定的，我就得认吗？","a":[{"who":"人类简史","cn":"靠虚构合作","u":"/i/sapiens/fictions-that-cooperate/","hint":"陌生人大规模协作的黏合剂不是真的"},{"who":"有限与无限的游戏","cn":"与边界游戏","u":"/i/finite-and-infinite-games/playing-with-boundaries/","hint":"有限玩家在边界内玩，无限玩家玩边界"}]}]},{"t":"已经改不了了","g":"使不上劲","qs":[{"q":"这事已经发生了，我改不了。","a":[{"who":"爱比克泰德","cn":"扰乱你的不是事情","u":"/i/epictetus/judgments-not-things/","hint":"死亡不可怕这句话，重点在后半句"},{"who":"苏轼","cn":"也无风雨也无晴","u":"/i/su-shi/no-wind-no-rain/","hint":"淋完那场雨，回头看什么都没发生"}]},{"q":"我怎么才能不再反复想它？","a":[{"who":"六祖慧能","cn":"本来无一物","u":"/i/huineng/originally-not-a-thing/","hint":"神秀在擦镜子，慧能问哪来的镜子"},{"who":"庄子","cn":"齐物","u":"/i/zhuangzi/equalizing-things/","hint":"争论之前先问用的是谁的尺子"}]},{"q":"我们的差距是怎么拉开的？","a":[{"who":"枪炮、病菌与钢铁","cn":"亚力之问","u":"/i/guns-germs-steel/yalis-question/","hint":"一个新几内亚人的问题，他答了二十五年"},{"who":"战争论","cn":"政治的继续" /excellent-sheep/hurdles/","c":"学习与成长"},{"pn":"优秀的绵羊","cn":"给自己一段没有评分的时间","w":"有标准就会去优化标准","q":"只有在没有人打分的时候，你才知道自己真正想要什么","sc":"你要做一个关于方向的选择","s":"excellent-sheep","k":"no-scoreboard","u":"/i/excellent-sheep/no-scoreboard/","c":"学习与成长"},{"pn":"萨波尔斯基","cn":"为逃命设计，被开成常态","w":"关不掉才是问题","q":"让人生病的不是压力本身，而是压力反应长期开着关不掉","sc":"长期紧绷，说不上具体哪里出问题","s":"sapolsky","k":"stress-mismatch","u":"/i/sapolsky/stress-mismatch/","c":"身心与生活"},{"pn":"萨波尔斯基","cn":"不确定比强度更伤","w":"可预测与控制感","q":"地位低的狒狒压力激素长期偏高，但有同盟的个体好得多","sc":"压力大且减不下来","s":"sapolsky","k":"predictability","u":"/i/sapolsky/predictability/","c":"身心与生活"},{"pn":"萨提亚","cn":"冰山：行为之下还有几层","w":"吵的是水面","q":"越往下越相似：被爱、被接纳、有价值，人人都要","sc":"同一种争执反复出现，讲道理没用","s":"satir","k":"iceberg","u":"/i/satir/iceberg/","c":"家庭与关系"},{"pn":"萨提亚","cn":"压力下的四种姿态","w":"讨好、指责、超理智、打岔","q":"家庭的真实结构在语言里说不清楚，摆出来就一眼看见","sc":"冲突一起来，双方都变了个人","s":"satir","k":"coping-stances","u":"/i/satir/coping-stances/","c":"家庭与关系"},{"pn":"托马斯·戈登","cn":"我信息","w":"说影响，不说人品","q":"用我信息，不用你信息：说这件事对我的影响，不说你是什么样的人","sc":"你要指出对方的问题，已经憋了几句话","s":"thomas-gordon","k":"i-message","u":"/i/thomas-gordon/i-message/","c":"家庭与关系"},{"pn":"托马斯·戈登","cn":"这问题是谁的","w":"归属不同，方法相反","q":"困扰对方的时候，建议会把他从解决问题推到应对你","sc":"孩子或同事有情绪，你正准备给建议","s":"thomas-gordon","k":"problem-ownership","u":"/i/thomas-gordon/problem-ownership/","c":"家庭与关系"},{"pn":"维果茨基","cn":"最近发展区","w":"看第二条线","q":"一个人独立能做到的，与在帮助下能做到的，两者之间就是最近发展区","sc":"教人或自学，不知道难度该定在哪","s":"vygotsky","k":"zpd","u":"/i/vygotsky/zpd/","c":"学习与成长"},{"pn":"维果茨基","cn":"脚手架：给了要撤","w":"不撤就成了依赖","q":"一次帮助有没有效，看下一次他需要多少支撑","sc":"你在教一个人，不确定该给多少","s":"vygotsky","k":"scaffolding","u":"/i/vygotsky/scaffolding/","c":"学习与成长"},{"pn":"原子习惯","cn":"落到系统的水平","w":"目标不区分胜负","q":"你不会升到目标的高度，你会落到系统的水平","sc":"你定了目标却一直没做到","s":"atomic-habits","k":"systems-over-goals","u":"/i/atomic-habits/systems-over-goals/","c":"身心与生活"},{"pn":"原子习惯","cn":"从身份下手","w":"不跟欲望硬扛","q":"让好习惯显而易见、有吸引力、简便易行、令人愉悦","sc":"某个习惯你靠意志力维持，反复失败","s":"atomic-habits","k":"identity-first","u":"/i/atomic-habits/identity-     paint();
  },0);
  if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme:dark)');
    if(mq.addEventListener)mq.addEventListener('change',paint);else if(mq.addListener)mq.addListener(paint);}

function drawCard(cb){

  function render(){

    (function(x,y,w){var r=w*0.22;c.beginPath();
      c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
      c.lineTo(x+w,y+w-r);c.quadraticCurveTo(x+w,y+w,x+w-r,y+w);
      c.lineTo(x+r,y+w);c.quadraticCurveTo(x,y+w,x,y+w-r);
      c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();c.fill();})(880,110,104);
    c.fillStyle='#fff';c.font='700 62px "Noto Serif SC"';
    c.textAlign='center';c.fillText('人',932,182);c.textAlign='left';
    c.fillStyle='#1f1c17';c.font='700 58px "Noto Serif SC"';

var _mem=[];
function hload(){try{return JSON.parse(localStorage.getItem('hwx_hist')||'[]')}catch(e){return _mem}}
function hsave(a){_mem=a;try{localStorage.setItem('hwx_hist',JSON.stringify(a))}catch(e){}}
function hrender(){
  var a=hload(),el=document.getElementById('hwx-hist');
  if(!a.length){el.style.display='none';return}
  el.style.display='flex';
  document.getElementById('hwx-hchips').innerHTML=a.slice(0,20).map(function(x){return '<a href="'+x.u+'">'+x.t+'</a>'}).join('');
}
document.addEventListener('click',function(ev){
  var a=ev.target.closest&&ev.target.closest('a[data-h]');if(!a)return;
  var rec=hload().filter(function(x){return x.u!==a.getAttribute('href')});
  rec.unshift({u:a.getAttribute('href'),t:a.getAttribute('data-h')});
  hsave(rec.slice(0,50));hrender();
});
document.getElementById('hwx-hclr').onclick=function(){hsave([]);hrender()};
hrender();
/* ── 类别筛选 ── */
var CAT='全部';
var cw=document.getElementById('hwx-cats');
var cats=['全部'];D.E.forEach(function(e){if(cats.indexOf(e.c)<0)cats.push(e.c)});
cats.forEach(function(c){
  var b=document.createElement('button');b.textContent=c;if(c===CAT)b.classList.add('on');
  b.onclick=function(){CAT=c;cw.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.textContent===c)});applyFeed()};
  cw.appendChild(b);
});
/* ── CTA 差异化 ── */
function cta(e){
  var T=['拆开看他的 '+e.nc+' 套打法 →','先读「'+(e.c0||'')+'」→','他的答案分 '+e.nc+' 篇讲透 →','进去偷师 →',
         '从「'+(e.c0||'')+'」进 →',e.nc+' 篇，句句能落地 →','看他怎么处理最难的那件事 →','带走 '+e.nc+' 条硬原则 →',
         '深读 '+e.nc+' 篇，够用很久 →','「'+(e.c0||'')+'」值得先看 →','他的方法都在里面 →','读透这 '+e.nc+' 篇再走 →',
         '看完你会换个打法 →',e.nc+' 篇深读备好了 →','从最狠的一篇读起 →','他的路数，'+e.nc+' 篇拆完 →'];
  var h=0;for(var i=0;i<e.s.length;i++)h=(h*31+e.s.charCodeAt(i))>>>0;
  var t=T[h%T.length];
  return(t.indexOf('「」')>=0)?'他的方法都在里面 →':t;
}
/* ── 全部 feed（混排） ── */
/* 金句取用器：按日期确定性洗牌后顺序发牌。
   原来用 (i*步长)%池大小 取句，步长 53 撞上池大小 53 时恒取第一条——
   两个 feed 里十张金句卡全是同一句。改成发牌就不再依赖两个数互质。 */
var _qbag=[], _qi2=0;
(function(){
  var a=D.QS.slice(), seed=day;
  for(var i=a.length-1;i>0;i--){
    seed=(seed*9301+49297)%233280;
    var j=Math.floor(seed/233280*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  _qbag=a;
})();
function pickQ(){ var g=_qbag[_qi2 % _qbag.length]; _qi2++; return g; }
/* 金句卡：竖排金句 + 出处 + 一行解析（角度 · 什么时候用），解析取自章节自身字段 */
function qcard(g,cls){
  var gl = g.gl ? ('<span class="gl">'+g.gl+'</span>') : '';
  return '<a class="qc '+cls+'" href="'+g.u+'" data-h="'+esc(g.who+' · '+g.cn)+'" data-t="'+esc((g.q+g.who+g.cn+(g.gl||'')).toLowerCase())+'">'
    +'<span class="seal">句</span><span class="v">'+g.q+'</span>'
    + gl + '<span class="who"><i>'+g.who+'</i> · '+g.cn+'</span></a>';
}
/* 章节标题与角度并入搜索索引：搜「止损」应命中利弗莫尔等 */
var byNC={};D.NC.forEach(function(n){(byNC[n.pn]=byNC[n.pn]||[]).push(n.cn+' '+n.w+' '+n.q)});
D.S.forEach(function(sc){sc.qs.forEach(function(q){q.a.forEach(function(r){(byNC[r.who]=byNC[r.who]||[]).push(q.q+' '+r.cn+' '+(r.hint||''))})})});
D.QP.forEach(function(q){(byNC[q.who]=byNC[q.who]||[]).push(q.cn+' '+q.q)});
var fullCells=[];
var qi=0,ki=0;
D.E.forEach(function(e,i){
  var chTxt=(byNC[e.n]||[]).join(' ');
  var dt=esc((e.n+' '+e.w+' '+e.c+' '+e.it+' '+e.hk+' '+chTxt+' '+(e.ix||'')).toLowerCase());
  fullCells.push('<a class="pc" href="/i/'+e.s+'/" data-h="'+esc(e.n)+'" data-c="'+e.c+'" data-t="'+dt+'" style="--tint:'+(D.CT[e.c]||'transparent')+';--tintd:'+(D.CTD[e.c]||'transparent')+'"><span class="r1"><b>'+e.n+'</b><i class="tag">'+e.w+'</i></span><span class="it">'+e.it+'</span><span class="hk">'+(e.hk||e.w)+'</span>'+(e.cs.length?'<span class="ls">'+e.cs.join(' / ')+'</span>':'')+'<span class="cf">'+cta(e)+'</span></a>');
  if(i%3===2){var g=pickQ();
    fullCells.push(qcard(g,'xtra'));}
  if(i%5===3){var k=D.QQ[ki++%D.QQ.length];
    fullCells.push('<div class="kc xtra" data-t="'+esc(k.t.toLowerCase())+'"><span class="seal">问</span>'+(k.r&&k.r[0]?'<span class="said">'+esc(k.r[0].who)+'问过</span>':'')+'<span class="t">'+k.t+'</span><span class="r">'+k.r.map(function(r){return '<a href="'+r.u+'" data-h="'+esc(r.who+' · '+r.cn)+'"><b>'+r.who+'</b> · '+r.cn+' →</a>'}).join('')+'</span></div>');}
});
/* ── 最新 feed ── */
/* 最新 tab 混排：每 4 张深度阅读插 1 张人物/书卡、1 张金句卡，每 9 槽插 1 张问题卡 */
var ncCells=[], _seen={}, _pi=0, _qi=0, _ki=0;
var byName={}; D.E.forEach(function(e){byName[e.n]=e});
D.NC.forEach(function(e,i){
  ncCells.push('<a class="nc" href="'+e.u+'" data-h="'+esc(e.pn+' · '+e.cn)+'" style="--tint:'+(D.CT[e.c]||'transparent')+';--tintd:'+(D.CTD[e.c]||'transparent')+'"><span class="pn"><i>'+e.pn+'</i><span class="nb">新</span></span><b>'+e.cn+'</b><span class="w">'+e.w+'</span>'+(e.q?'<span class="q">'+e.q+'</span>':'')+'</a>');
  if(i%4===3){
    var pe=null;
    for(var t=0;t<D.NC.length&&!pe;t++){
      var cand=byName[D.NC[(_pi+t)%D.NC.length].pn];
      if(cand&&!_seen[cand.s]){pe=cand;_pi=(_pi+t+1)%D.NC.length}
    }
    if(pe){_seen[pe.s]=1;
      ncCells.push('<a class="pc" href="/i/'+pe.s+'/" data-h="'+esc(pe.n)+'" style="--sp:'+(D.CC[pe.c]||'#999')+'"><span class="r1"><b>'+pe.n+'</b><i class="tag">'+pe.w+'</i></span><span class="it">'+pe.it+'</span><span class="hk">'+(pe.hk||pe.w)+'</span><span class="cf">'+cta(pe)+'</span></a>');}
    var g=pickQ();
    ncCells.push(qcard(g,''));
  }
  if(i%5===4){var k=D.QQ[_ki++%D.QQ.length];
    ncCells.push('<div class="kc"><span class="seal">问</span>'+(k.r&&k.r[0]?'<span class="said">'+esc(k.r[0].who)+'问过</span>':'')+'<span class="t">'+k.t+'</span><span class="r">'+k.r.map(function(r){return '<a href="'+r.u+'" data-h="'+esc(r.who+' · '+r.cn)+'"><b>'+r.who+'</b> · '+r.cn+' →</a>'}).join('')+'</span></div>');}
});
/* ── 处境 tab：每个问题一张卡，标注所属处境 ──
   原来「按处境找」是 1049px 的标签目录，三步才到答案，
   而这些问题 100% 已经在信息流里以卡片出现过。改成卡片流：
   同一批内容、同一套视觉，扫读即认出，不必先学会我们的分类。 */
var scCells=[],scOwner=[];
D.S.forEach(function(sc){
  sc.qs.forEach(function(q){
    scOwner.push(sc.t);
    scCells.push('<div class="kc" data-t="'+esc((q.q+sc.t).toLowerCase())+'">'
      +'<span class="seal">问</span>'
      +'<span class="said">'+esc(sc.t)+'</span>'
      +'<span class="t">'+q.q+'</span>'
      +'<span class="r">'+q.a.map(function(r){
          return '<a href="'+r.u+'" data-h="'+esc(r.who+' · '+r.cn)+'"><b>'+r.who+'</b> · '+r.cn+' →</a>'
        }).join('')+'</span></div>');
  });
});
/* ── 埋点：只发聚合信息，不发用户输入的原文以外的任何东西 ── */
function trk(name, params){
  try{ if(window.gtag) gtag('event', name, params||{}); }catch(e){}
}
/* ── 标签页切换 ── */
var TAB='新';
var feed=document.getElementById('hwx-feed'), ncfeed=document.getElementById('hwx-ncfeed');
var scfeed=document.getElementById('hwx-scfeed');
var scpick=document.getElementById('hwx-scpick');
/* 选中的处境；空串＝全部。选择保留，切走再切回来还在原来那一格 */
var SCSEL='';
/* 把选中的标签滑进视野：选择会跨 tab 保留，切回来时条子若停在开头，
   卡片是筛过的而标签看着像没选，人会以为坏了。 */
function scReveal(){
  var on=scpick.querySelector('button.on');
  if(on&&on.scrollIntoView)try{on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
function scRender(){
  var cells=[],n=0;
  for(var i=0;i<scCells.length;i++){
    if(!SCSEL||scOwner[i]===SCSEL){cells.push(scCells[i]);n++;}
  }
  scfeed.innerHTML=cells.join('');
  ct.textContent=n+' 个问题';   /* 处境名由选中的标签表达，不再重复一遍 */
}
function scBuild(){
  var h=['<button type="button" data-s="" class="on">全部</button>'];
  D.S.forEach(function(sc){h.push('<button type="button" data-s="'+esc(sc.t)+'">'+esc(sc.t)+'</button>')});
  scpick.innerHTML=h.join('');
  scpick.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      var v=b.getAttribute('data-s');
      SCSEL=(v===SCSEL)?'':v;                       /* 再点一次＝取消，回到全部 */
      scpick.querySelectorAll('button').forEach(function(x){
        x.classList.toggle('on',x.getAttribute('data-s')===SCSEL)});
      trk('situation_pick',{situation:SCSEL||'all'});
      scRender();
    };
  });
}
var ct=document.getElementById('hwx-ct');
var catsRow=document.getElementById('hwx-cats');
function switchTab(t){
  TAB=t;
  document.querySelectorAll('#hwx-tabs2 button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
  if(t==='新'){
    feed.style.display='none';scfeed.style.display='none';ncfeed.style.display='';catsRow.style.display='none';
    scpick.style.display='none';
    ncfeed.innerHTML=ncCells.join('');ct.textContent=D.NC.length+' 篇最新';
  }else if(t==='境'){
    ncfeed.style.display='none';feed.style.display='none';catsRow.style.display='none';
    scfeed.style.display='';scpick.style.display='';
    if(!scpick.firstChild)scBuild();
    scRender();scReveal();
  }else{
    ncfeed.style.display='none';scfeed.style.display='none';feed.style.display='';catsRow.style.display='';
    scpick.style.display='none';
    feed.innerHTML=fullCells.join('');applyFeed();
  }
}
document.querySelectorAll('#hwx-tabs2 button').forEach(function(b){
  b.onclick=function(){var t=b.getAttribute('data-t');
    trk('tab_switch',{tab:t==='新'?'latest':(t==='全'?'all':'situations')});
    switchTab(t)};
});
function applyFeed(){
  if(!feed||!ct)return;
  var v=(document.getElementById('q')||{value:''}).value.trim().toLowerCase(),vis=0;
  feed.querySelectorAll('.pc').forEach(function(c){
    var ok=(CAT==='全部'||c.getAttribute('data-c')===CAT)&&(!v||c.getAttribute('data-t').indexOf(v)>=0);
    c.classList.toggle('hid',!ok);if(ok)vis++;
  });
  feed.querySelectorAll('.xtra').forEach(function(c){
    c.classList.toggle('hid',CAT!=='全部'||!!(v&&c.getAttribute('data-t')&&c.getAttribute('data-t').indexOf(v)<0));
  });
  ct.textContent=vis+' 条知识';
}
/* 搜索框接管 */
var qin=document.getElementById('q');
if(qin){qin.oninput=null;
  /* 搜索落空记录：这是三个埋点里最值钱的一个——用户搜了什么、我们没有，
     直接告诉我们该补什么内容，比坐着推理准得多。
     只在停止输入 1.2 秒后发一次，避免把「睡」「睡不」「睡不着」都记下来。 */
  var _mt=null, _lastMiss='';
  qin.addEventListener('input',function(){
    if(qin.value.trim()&&TAB!=='全'){switchTab('全');}   /* 搜索一律在「全部」里进行 */
    else{applyFeed();}
    clearTimeout(_mt);
    _mt=setTimeout(function(){
      var v=qin.value.trim();
      if(v.length<2||v===_lastMiss)return;
      var n=parseInt((document.getElementById('hwx-ct').textContent||'0'),10)||0;
      _lastMiss=v;
      if(n===0) trk('search_miss',{term:v.slice(0,40)});
      else trk('search_hit',{term:v.slice(0,40), results:n});
    },1200);
  });}
/* 初始化 */
/* 一行入口：点它切到「处境」tab，不再就地展开 1049px 的标签目录 */
(function(){
  var line=document.getElementById('hwx-scline');
  if(!line)return;
  var n=0; D.S.forEach(function(x){n+=x.qs.length});
  var c=document.getElementById('hwx-sccount');
  if(c)c.textContent=D.S.length+' 种处境 · '+n+' 个问题';
  line.onclick=function(){
    trk('situation_entry_click',{});
    switchTab('境');
    document.getElementById('hwx-tabs2').scrollIntoView({behavior:'smooth',block:'start'});
  };
})();
/* 卡片点击：用委托，三个 feed 一处覆盖。只记卡片类型和去向，不记内容。 */
['hwx-ncfeed','hwx-feed','hwx-scfeed'].forEach(function(id){
  var el=document.getElementById(id); if(!el)return;
  el.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="/i/"]'); if(!a)return;
    var card=e.target.closest('.pc,.nc,.qc,.kc');
    var kind=card?(card.classList.contains('kc')?'question':
              card.classList.contains('qc')?'quote':
              card.classList.contains('nc')?'chapter':'person'):'other';
    trk('card_click',{card_type:kind, feed:id.replace('hwx-',''), dest:a.getAttribute('href')});
  },true);
});
/* 处境层展开区的答案点击 */
(function(){
  var r=document.getElementById('hwx-res'); if(!r)return;
  r.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="/i/"]'); if(!a)return;
    trk('card_click',{card_type:'situation_answer', feed:'res', dest:a.getAttribute('href')});
  },true);
})();
/* 今日一问的答案点击 */
(function(){
  var g=document.getElementById('hwx-ago'); if(!g)return;
  g.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="/i/"]'); if(!a)return;
    trk('card_click',{card_type:'daily_question', feed:'hero', dest:a.getAttribute('href')});
  },true);
})();
switchTab('新');
})();</script>

<script>
const D=[{c:"谋略与竞争",n:"孙子兵法",e:"春秋·前500年前后",w:"先胜后战",y:-500,
d:"十三篇，中国最重要的战略体系，2500年来被兵家、商家、政治家反复研读。孙子的核心逻辑是：赢家在开战前就确保了胜利，失败者是先打再想怎么赢。这不是在说运气，是在说准备的深度决定结果的高度。孙子本人凭此书被吴王重用，以三万兵破楚国二十万，攻入楚国都城郢。",
story:"吴王要检验孙子的能力，让他训练宫廷美女。孙子把吴王的两位宠姬任命为队长，说明规则，击鼓，美女们嬉笑不动。孙子说：规则不清，是将官之过——再次说明，再次击鼓，美女还在笑。孙子说：规则已清，不从命，是队长之过——斩了两位宠姬。吴王大惊，孙子说：将在外，君命有所不受。此后吴军纪律严整，无往不胜。这个故事说明孙子的核心：制度比热情更重要，执行比计划更关键。",
f:[{n:"先胜后战",d:"「胜兵先胜而后求战，败兵先战而后求胜」。赢家在开战前就把胜利条件备齐——地形、兵力、补给、士气全部到位才动手。创业版本：市场调研、资金储备、团队配置全部到位才启动，而不是边做边想。",eg:"淝水之战前，谢安确认北府兵战力、地形、士气全部就位才应战，以8万对80万，大胜。项羽则反例：巨鹿之战后每仗都是「先打再说」，最终乌江自刎。"},{n:"不战而屈人之兵",d:"「上兵伐谋，其次伐交，其次伐兵，其下攻城」。最高明的竞争不是打赢，而是让对手根本不想打。商业版本：建立足够强的护城河，让竞争对手看到就打退堂鼓——苹果的品牌、微信的社交关系链，都是这个逻辑。",eg:"战国时张仪凭一张嘴让楚国放弃齐国盟友，秦国未动一兵一卒就瓦解了合纵联盟。商业上，英特尔用「Intel Inside」品牌让下游PC厂商主动宣传自己，护城河不是技术而是心智。"},{n:"奇正相生",d:"「以正合，以奇胜」。正兵守住基本盘，奇兵打出意外。不是说主业不重要，而是主业是「正」，创新是「奇」——没有正的稳固，奇无从借力；没有奇的突破，正只能防守。"},{n:"虚实相生",d:"「我专为一，敌分为十，是以十攻其一也」。集中优势打对手薄弱点。不要在对手最强的地方硬碰，找他忽视的细分市场切入——这是所有弱者对抗强者的基本逻辑。"},{n:"慎战原则",d:"「主不可以怒而兴师，将不可以愠而致战」。情绪是战略的大敌。刘备因关羽之死一怒征吴，夷陵大败，蜀汉从此一蹶不振——这是「愠而致战」的教科书级案例。"},{n:"知己知彼",d:"「知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆」。完整含义是三层：同时了解自己和对手（不败），只了解自己不了解对手（五五开），两者都不了解（必败）。",eg:"马云创立阿里前做了详细竞争对手研究，同时对自身「只懂中国中小企业」的准确认知，让他在这个点上集中所有资源。"},{n:"庙算胜负",d:"「庙算多者胜，庙算少者不胜」。开战前先在庙堂推演，把所有变量算清楚。现代版：重大决策前先写下失败的所有可能原因——把风险前置化。"},{n:"造势借势",d:"「善战者，求之于势，不责于人」。高手不依赖个人超常发挥，而是创造势能让普通人做出超常行为。看清势在哪里，比找到最强的人更重要。"}],
q:["百战百胜，非善之善者也；不战而屈人之兵，善之善者也。","知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆。","兵无常势，水无常形，能因敌变化而取胜者，谓之神。","胜兵先胜而后求战，败兵先战而后求胜。","上兵伐谋，其次伐交，其次伐兵，其下攻城。"],
apply:"产品竞争中，先搭好不败之地（核心用户基础、差异化定位）再去扩张，比先跑量再想壁垒稳得多。遇到强对手，不要在他的主场硬拼，找他看不见的角落先站稳。",
l:["毛泽东","粟裕","韩信","范蠡","管仲"],contrast:[{"n": "项羽", "why": "项羽是孙子兵法的反面教材——力拔山兮气盖世，却输给了「先胜后战」都不会的刘邦"}, {"n": "宫本武藏", "why": "同样是兵法，孙子讲「庙算」，宫本武藏讲「无形」——战略思维vs武道哲学"}]},

{c:"谋略与竞争",n:"毛泽东",e:"近代·1893-1976",w:"集中优势",y:1893,
d:"从师范生到建立新中国，毛泽东一生最重要的能力是：在最混乱的局面里找到主要矛盾，然后把全部力量压上去。《矛盾论》《实践论》《论持久战》，是他把军事实践升华为哲学的三件代表作。",
story:"1947年，国民党重点进攻延安，毛泽东决定主动放弃延安，以空间换时间。果然，国民党军进入延安后疲于守点，解放军在运动中各个歼灭，一年内战局完全逆转。",
f:[{n:"集中优势兵力",d:"「伤其十指不如断其一指」。不要同时打多个敌人，把力量集中在一个点上形成压倒性优势，打垮一个再打下一个。"},{n:"矛盾论",d:"每个阶段只有一个主要矛盾，解决了它，其他问题跟着解决。创业初期的主要矛盾是「产品能不能解决用户问题」，先把这个解决了。",eg:"滴滴早期主要矛盾是「司机够不够」，一切资源全压在补贴司机上，解决了这个才谈其他。"},{n:"实事求是",d:"「没有调查，没有发言权」。一切结论产生于调查情况的末尾，而不是开头。"},{n:"持久战",d:"弱者对阵强者，不能求速决。「战略防御→战略相持→战略反攻」三个阶段。"},{n:"统一战线",d:"「联合次要敌人，打击主要敌人」——先集中一切力量打最危险的那个，对其他人暂时妥协甚至联合。"},{n:"群众路线",d:"「从群众中来，到群众中去」——决策不从书本来，从真实用户来；政策制定后，再回到群众中验证、修正。"}],
q:["没有调查，没有发言权。","战略上藐视敌人，战术上重视敌人。","集中优势兵力，各个歼灭敌人。","存地失人，人地皆失；存人失地，人地皆存。"],
apply:"团队每季度开始前先问：这个阶段最主要的矛盾是什么？把资源全部压在那一件事上，其他事情能推就推，能缓就缓。",
l:["粟裕","孙子兵法","刘邦"],contrast:[{"n": "甘地", "why": "面对压迫最极端的两种路径：毛泽东用武装斗争，甘地用非暴力——都成功了，这是历史奇迹"}, {"n": "拿破仑", "why": "战略思维的东西方对话：集中优势vs奥斯特利茨——相隔150年的战略共鸣"}]},

{c:"谋略与竞争",n:"粟裕",e:"近代·1907-1984",w:"以弱胜强",y:1907,
d:"解放军第一战将，淮海战役以60万对阵80万，歼灭国民党精锐55万。他从不用蛮力，只用脑子——找对手必须救的地方打，让对手陷入被动。",
story:"1947年淮海战役前，粟裕三次向中央建议在长江以北打大歼灭战。毛泽东最初不同意，粟裕坚持。最终毛泽东采纳，淮海战役一战定乾坤。战后毛泽东说：「淮海战役，粟裕同志立了第一功」。",
f:[{n:"围点打援",d:"攻打对手「必须救」的要点，在援军来援的路上设伏——让对手陷入「救也死，不救也死」的困境。"},{n:"运动战",d:"「打得赢就打，打不赢就跑」——不是逃跑，是主动脱离不利战场，保存实力，等待更好时机。"},{n:"歼灭战思维",d:"不求占领土地，只求消灭有生力量。不要追求市场份额数字，要削弱竞争对手的核心团队和核心用户。"},{n:"战后复盘",d:"每次战役结束，粟裕必有系统性总结。他从一个没有军校背景的普通士兵，用复盘积累成了解放军第一战将。",eg:"淮海战役后，粟裕对每个战斗阶段做详细记录，包括失误和侥幸。他的战后总结后来成为解放军战术教材。"},{n:"三次斗胆直陈",d:"面对毛泽东的战略指示，粟裕曾三次「斗胆直陈」，坚持自己的判断。他的方式是：用书面报告提出完整的战略逻辑，让事实和推理说话，不用情绪。"}],
q:["打得赢就打，打不赢就跑。","攻其所必救，歼其归者。","情况明了，决心就大。"],
apply:"面对强大竞争对手，不要在他的主力产品上正面竞争。找他必须防守的侧翼，持续施压，让他分散注意力，你再集中突破。",
l:["毛泽东","孙子兵法","韩信"],contrast:[{"n": "韩信", "why": "中国历史上两大「以弱胜强」军事天才：韩信用奇谋，粟裕用围点打援——都是把敌人逼入死地"}, {"n": "郭嘉", "why": "同样的「斗胆直陈」精神：郭嘉敢对曹操说不，粟裕敢对毛泽东三次直陈"}]},

{c:"心智与情绪",n:"道德经",e:"春秋·前500年前后",w:"损",y:-500,
d:"老子五千言，是中国哲学的减法源头。与儒家「为学日益」相对，老子说「为道日损」——不断减掉，直到无为，然后无不为。道德经在西方被翻译次数仅次于圣经。",
story:"老子骑青牛西出函谷关，守关令尹喜拦住他，请他留下智慧。老子写了五千言，留下道德经，然后消失于历史。",
f:[{n:"损之又损，以至于无为",d:"「为学日益，为道日损。损之又损，以至于无为，无为而无不为」。加法让你知道更多，减法让你看清本质。"},{n:"柔弱胜刚强",d:"「天下之至柔，驰骋天下之至坚」。水是天下最柔软的东西，却能穿石。持续的柔比短暂的刚更持久。"},{n:"反者道之动",d:"「反者道之动，弱者道之用」。物极必反，这是道的运动规律。看到顶点要想到衰退，看到低谷要相信转机。"},{n:"知足者富",d:"「知足者富，强行者有志」。真正的富不是拥有更多，而是欲望更小。降低欲望，扩大自由。"},{n:"上善若水",d:"水处最低处（谦卑），绕开障碍（灵活），持续流动（坚持），最终穿石（效果）。以最小阻力达到最大效果。"},{n:"为而不争",d:"「天之道，利而不害；圣人之道，为而不争」——当所有人都在争的时候，你退出竞争，你就没有对手了。"}],
q:["为学日益，为道日损。损之又损，以至于无为，无为而无不为。","知人者智，自知者明。胜人者有力，自胜者强。","功遂身退，天之道也。","天下之至柔，驰骋天下之至坚。","知足者富，强行者有志。"],
apply:"每季度做一次「减法清单」：把当前做的所有事列出来，删掉20%最不重要的。不是说这些事不好，是资源有限，专注才有力量。",
l:["王阳明","范蠡","李泌"],contrast:[{"n": "论语", "why": "中国思想史最重要的两极：老子「损之又损」的减法哲学vs孔子「学而时习之」的加法实践"}, {"n": "主权个人", "why": "两千年的思想穿越：道德经「功遂身退、知足者富」是最古老的主权个人哲学"}]},

{c:"心智与情绪",n:"王阳明",e:"明·1472-1529",w:"知行合一",y:1472,
d:"龙场悟道，创立心学。他是中国历史上极罕见的「立德、立功、立言」三不朽者。他的核心洞察：理不在外物，在人心——不是向外格物，而是向内致良知。",
story:"王阳明37岁被贬贵州龙场，瘴气横行，吃住都成问题。有一天夜里，他在石棺里打坐，突然大呼：「圣人之道，吾性自足！」——龙场悟道。他悟到：圣人的道理不需要向外寻找，人心里本来就有。",
f:[{n:"心即理",d:"「心外无物，心外无理」。事物的意义和价值来自你的心。你的判断标准来自内心，不来自外部权威。"},{n:"知行合一",d:"「知之真切笃实处即是行，行之明觉精察处即是知」。知和行不是两件事，是一件事的两个面。你说「我知道要早起」但从不早起——那叫「念头」，不叫「知」。"},{n:"致良知",d:"良知是内心天然具备的判断能力，只需要「致」——去除遮蔽良知的私欲（恐惧/贪婪/面子/惰性）。"},{n:"事上磨炼",d:"「人须在事上磨炼做功夫，乃有益」。不是坐在屋里想通了就算，而是在真实事件中经受磨炼。"},{n:"破心中贼",d:"「破山中贼易，破心中贼难」——真正的敌人不在外面，在心里：恐惧、懒惰、虚荣、自欺。"},{n:"立志",d:"「志不立，天下无可成之事」——找到一个真正触动你内心良知的方向，然后不管外部条件如何都坚持。"}],
q:["知行合一。","破山中贼易，破心中贼难。","此心不动，随机而动。","人须在事上磨炼做功夫，乃有益。","志不立，天下无可成之事。"],
apply:"当你发现团队「知道但不做」，问题不在执行力，在激励机制或认知——他们可能并不真的认为那件事重要。先解决认知问题，再谈执行。",
l:["曾国藩","稻盛和夫","道德经"],contrast:[{"n": "苏格拉底", "why": "东西方哲学的神奇互文：苏格拉底「助产术」vs王阳明「致良知」——答案都在内心"}, {"n": "曾国藩", "why": "知行合一的理论与现实：王阳明悟道，曾国藩践行"}]},

{c:"识人与相处",n:"曾国藩",e:"清·1811-1872",w:"慎",y:1811,
d:"历史上最著名的「笨人逆袭」案例。他资质平平，考了七次才中举。但他用「结硬寨打呆仗」的方法，把自己从一个普通官员做成了晚清最重要的人物。他的秘诀不是聪明，而是「比任何人都慎」。",
story:"曾国藩32岁开始写日记，每天记录自己的言行并严厉批评自己。有一次他在朋友面前辩论占了上风，日记里却批评自己：「争竞之心太重，实为人品之大损」。他坚持写日记三十年。",
f:[{n:"结硬寨打呆仗",d:"打仗时，每到一处必先扎营，营垒扎得极其坚固，然后挖壕沟把敌人围起来，等待对方粮尽。他从不追求奇袭，从不走捷径。",eg:"围攻安庆，守了整整一年，没有任何奇袭，城内粮尽，不战而下。"},{n:"慎独",d:"「慎独则心安」。独处时也守规矩，没人看着的时候才是真正的考验。"},{n:"每日反省",d:"坚持写日记，不是记录发生了什么，而是批评自己：今天哪件事没做好？哪句话说错了？30年不断的自我批评，形成了极强的自我校正能力。"},{n:"广收慎用",d:"「广收」是接触大量人才；「慎用」是在真实任务里考察，不靠简历面试。他发现李鸿章时，让他参与真实的军务决策，观察他在压力下的判断。"},{n:"耐烦",d:"「天下事无所为而成者极少，有所贪有所利而成者居多，吾辈总以耐烦为第一要义」——所有重要的事都需要忍受漫长的无聊和重复。"}],
q:["天下古今之庸人，皆以一惰字致之；天下古今之才人，皆以一傲字致之。","慎之又慎，不可不慎。","困心横虑，正是磨炼英雄之时。","好汉打脱牙和血吞。"],
apply:"把「每日反省」变成一个仪式：每天睡前写三行，今天做错的一件事是什么，原因是什么，明天怎么改。坚持一年，你会发现自己做决策的质量显著提升。",
l:["王阳明","稻盛和夫","达里奥","诸葛亮"],contrast:[{"n": "马可·奥勒留", "why": "东西方最相似的两个人：都靠每日写作反省，都在权力顶点保持克制"}, {"n": "王阳明", "why": "思想的传承与落地：王阳明建立心学，曾国藩用一生实践——悟道vs践道"}],
fail:"1870年天津教案，他奉命查办，为避免开战接受了法国的条件——处死为首者、赔款、遣使道歉。舆论炸了：京师士大夫骂声大作，「卖国贼」三字加在他头上，湖南同乡把他在北京会馆里的官爵匾额全部击毁，连左宗棠和李鸿章都加入痛骂。曾纪泽记下父亲那阵子给朋友写信常写的八个字：「外惭清议，内疚神明」。一年多后，他病死在两江总督任上。",
lesson:["「耐烦」和「求稳」撑了他三十年，最后一次求稳毁了他的身后名。同一套方法，赌注不同，结果相反。","他一生对自己最严，却栽在一件他自认无愧、别人认定有罪的事上。慎独管得住动机，管不住别人怎么定性。","有些位置上，避免更坏的结果和保住名声只能选一个。选了前者，就得准备好被骂很多年。"]},

{c:"财富与风险",n:"范蠡",e:"春秋战国·前536-前448",w:"进退",y:-536,
d:"中国历史上最成功的退隐者，商圣陶朱公。他帮助越王勾践从囚徒做到春秋霸主，然后在功成之日彻底离开——改名换姓，三次迁移，三次积累巨富。",
story:"越国灭吴后，范蠡派人送信给文种：「飞鸟尽，良弓藏；狡兔死，走狗烹。越王为人长颈鸟喙，可与共患难，不可与共乐。子何不去？」文种不信留下，不久被赐死。范蠡当天就离开了，泛舟太湖。",
f:[{n:"知进退的时机",d:"「进」的时机：势头来了，全力投入；「退」的时机：功成之日，不等被推走——在顶点主动退比被动离场早一步。"},{n:"周期思维",d:"「旱则资舟，水则资车」——在旱的时候买船，因为你知道雨季会来。逆周期布局的祖师爷。"},{n:"散财之道",d:"范蠡三次积累巨富，三次把财富散给邻里。「财散则名聚」——散出去的财富换来的是更持久的东西：人心和安全感。"},{n:"飞鸟良弓",d:"权力关系是功能性的，不是情感性的。勾践需要范蠡时，范蠡是宝；不需要时，范蠡是威胁。认清这一点，才知道什么时候该留、什么时候该走。"},{n:"择人而处",d:"越王可与共患难，不可与共乐。判断一个人能不能长期共事，看他得势之后的行为，而不是落难之时。"}],
q:["飞鸟尽，良弓藏；狡兔死，走狗烹。","功遂身退，天之道也。","人取我予，人弃我取。","得时无怠，时不再来。"],
apply:"职业生涯的每个阶段，定期问自己：这段关系/这份工作，我处于「可以继续受益」还是「已经触及天花板且开始积累风险」的阶段？",
l:["白圭","李泌","张良","巴菲特","李嘉诚"],contrast:[{"n": "诸葛亮", "why": "功成的两种选择：范蠡在顶点主动退，诸葛亮至死不退——退vs不退的终极对照"}, {"n": "韩信", "why": "同样功高盖主：范蠡提前离场善终，韩信徘徊中间被杀——退的艺术"}]},

{c:"谋略与竞争",n:"韩信",e:"汉·前231-前196",w:"复盘",y:-231,
d:"中国历史上最天才的军事家。胯下之辱，背水一战，十面埋伏——每一个都是教科书。但他的故事有两面：军事天才的崛起，和政治白痴的毁灭。",
story:"背水一战前，韩信背靠河水列阵，军官们全都觉得这是兵法大忌。战后问他，韩信说：「兵法上说「陷之死地而后生，置之亡地而后存」——只有把他们逼到无路可退，才会拼死一战。」",
f:[{n:"背水一战",d:"「陷之死地而后生，置之亡地而后存」。去掉退路，才能激发最大潜能。"},{n:"明修栈道暗渡陈仓",d:"假装修缮旧栈道（让对手放松警惕），实际率主力从陈仓出击，一举定三秦。「以正合，以奇胜」的完美示范。"},{n:"功高震主的宿命",d:"韩信的错不是「没有造反」，而是「既不造反，也不交权」——这个中间状态是最危险的，让刘邦永远不放心。"},{n:"复盘思维",d:"韩信每次打完仗必有总结。他从一个籍籍无名的流亡者，在极短时间内成为最伟大的军事家。高手和普通人的差距，不在于错了多少，在于从错误中学到了多少。"}],
q:["多多益善。","陷之死地而后生，置之亡地而后存。","悔不用蒯通之计，乃为儿女子所诈，岂非天哉！"],
apply:"每个重要项目结束后做「韩信复盘」：写下这次为什么成功或失败的三个关键原因，不是表面原因，是根本原因。",
l:["刘邦","张良","孙子兵法"],contrast:[{"n": "张良", "why": "汉初三杰的命运分叉：张良彻底退善终，韩信不退不交权被杀"}, {"n": "霍去病", "why": "同为军事天才：韩信善用奇谋，霍去病纯粹燃烧——复杂vs纯粹"}],
fail:"楚汉战争结束后，韩信被刘邦削去兵权，降为淮阴侯。公元前196年，吕后设局，以谋反之名请韩信入宫议事，当场处死，夷三族。他死前只说了一句话：「悔不用蒯通之计」。",
lesson:["知道危险不等于能躲开——韩信精通兵法，却对自己的处境判断失准。","「既不造反，也不交权」是最危险的中间状态。","功高震主之后只有三条路：退（张良）、污（萧何）、交权（王翦）。不选，等于选了死。"]},

{c:"权力与组织",n:"刘邦",e:"汉·前256-前195",w:"用人",y:-256,
d:"历史上最著名的「草根逆袭」案例。起点：一个基层官吏。终点：汉朝开国皇帝。他的唯一技能是「用人」——不是最聪明的，不是最能打的，但最擅长让比他强的人为他效力。",
story:"垓下之战后，刘邦大宴功臣，问：「我为什么赢，项羽为什么输？」刘邦说：「夫运筹帷幄，决胜千里，吾不如子房；镇国家，抚百姓，吾不如萧何；连百万之军，战必胜，吾不如韩信。此三者皆人杰，吾能用之，此吾所以取天下也。」",
f:[{n:"用人不疑",d:"刘邦给韩信百万大军，明知韩信比他强得多——他选择相信。信任有成本，但不信任的成本更高。"},{n:"财散人聚",d:"刘邦最重要的用人法则：愿意给。给钱、给权、给名声——他自己不多留。项羽「爱将印，刓忍不能予」，一个舍不得给的领导，留不住真正的人才。"},{n:"从谏如流",d:"打下咸阳，张良说你要做天下之主就不要大肆抢劫。刘邦立刻收手，发布「约法三章」。"},{n:"约法三章",d:"「杀人者死，伤人及盗抵罪」——进入咸阳后只立三条法律，废除秦朝苛法。让关中百姓立刻倒向他。他懂得：规则的信任感比财货更值钱。"}],
q:["夫运筹帷幄之中，决胜于千里之外，吾不如子房；镇国家，抚百姓，给馈饷，不绝粮道，吾不如萧何；连百万之军，战必胜，攻必取，吾不如韩信。此三者，皆人杰也，吾能用之，此吾所以取天下也。","财散人聚，财聚人散。"],
apply:"招聘时问：这个人哪方面比我强？在哪些事上我应该听他的而不是告诉他怎么做？答案越清晰，你的团队越强。",
l:["韩信","张良","曹操"],contrast:[{"n": "项羽", "why": "同样起于乱世，刘邦用「软」，项羽用「刚」——一个赢了天下，一个赢得了传奇"}, {"n": "曹操", "why": "两人都是用人高手，但刘邦靠散财，曹操靠制度"}],
