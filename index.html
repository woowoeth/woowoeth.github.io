{c:"身心与生活",n:"契克森米哈赖",e:"1990年·芝加哥大学",w:"心流",y:1990,l:["艾利克森","卡尔·纽波特","原子习惯","弗兰克尔"],d:"心理学家，用「经验取样法」研究人什么时候最投入——给几千人配呼叫器，随机时刻响起就记录当下在做什么、感觉如何。他发现最好的体验不是放松，而是一种全神贯注到忘记时间的状态，他称之为心流。触发条件很具体：任务难度与你的能力刚好匹配，目标清晰，反馈即时。三者缺一，人要么焦虑要么无聊。",story:"他的数据推翻了一个常识：人们以为休闲最快乐，实际记录显示心流在工作中出现的频率远高于闲暇。看电视时人普遍感到轻度低落，而在挑战适中的工作里最常报告「非常投入、非常满足」。矛盾在于，被问「想做什么」时人还是选择休息。他的解释是，心流有进入成本——需要集中注意力、需要面对可能失败，而放松没有门槛。人于是持续选择低回报但零门槛的活动。",f:[{n:"难度与能力必须匹配",d:"太难产生焦虑，太易产生无聊，只有卡在能力边缘略偏上的地方才进入心流。这解释了为什么同一件事对不同人有完全不同的体验，也解释了为什么熟练之后必须加难度，否则曾经的心流活动会变成乏味。",eg:"打球总赢或总输都不好玩，跟水平接近的人打才停不下来。工作同理，长期做已经会的事会先舒服后麻木。"},{n:"目标清晰、反馈即时",d:"心流要求你随时知道自己做得怎么样。攀岩、下棋、演奏天然满足；而写方案、做管理这类工作的反馈周期以周计，所以很难进入。可行的做法是人为切出带反馈的小段落。",eg:"把「写完这份报告」拆成「先把这一节的论证跑通，跑通了自己能判断」，反馈周期从一周缩到一小时。"},{n:"最好的体验发生在工作里，不在休息里",d:"这是他数据里最反直觉的一条。休闲的门槛低，但心流需要投入，所以人常常在有能力获得高质量体验的地方选择了低质量的放松。认识到这点，对如何安排一天有直接影响。",eg:"下班后累到只想刷手机，刷完往往更空。同样的两小时用来做一件有难度的事，结束时反而是恢复的。"},{n:"心流不等于快乐",d:"进入心流的当下人往往感觉不到快乐——注意力全在事情上，没有余裕评价自己。满足感是事后才涌上来的。所以用「此刻开不开心」来选活动，几乎必然选错。",eg:"专注写完一段东西的过程并不愉快，写完那一刻的踏实才是回报。按当下感受决策，你永远不会开始。"}],q:["==最好的时刻，通常发生在一个人为了完成某件困难而有价值的事，自愿把身心能力发挥到极限的时候。==","==挑战与技能相匹配时，心流出现；前者过高是焦虑，过低是无聊。==","==人们以为休闲最快乐，但记录显示，心流更多发生在工作中。=="],apply:"想进入状态，先检查三件事：难度是不是刚好比我现在的能力高一点？目标够不够具体？我能不能随时知道自己做得如何？累到只想瘫着的时候，注意「当下想做什么」几乎必然指错方向。",contrast:[{n:"艾利克森",why:"同样要求待在能力边缘：艾利克森讲怎么练才长本事，契克森米哈赖讲那个位置为什么让人上瘾"},{n:"卡尔·纽波特",why:"一个说明专注状态的内部条件，一个说明外部条件——日程和环境怎么保护它"}]},
{c:"身心与生活",n:"萨波尔斯基",e:"1994年·斯坦福大学",w:"压力是错配",y:1994,l:["约翰·瑞迪","塞涅卡","爱比克泰德","契克森米哈赖"],d:"神经内分泌学家，在东非观察野生狒狒群三十年，同时研究人类的压力生理。他那本书的标题就是全部论点：斑马不得胃溃疡，因为它的压力反应只在狮子扑来的几分钟里全开，跑掉之后立刻关闭。人的这套系统一模一样，却被用来应付房贷、上司和一封没回的邮件——为几十秒逃命设计的机制，被开成了几十年的常态。",story:"他在狒狒群里发现了一个清晰的规律：地位低的个体，压力激素长期偏高，健康指标全面更差。但更关键的不是地位本身——是可预测性和控制感。同样处在下位，能预知何时被欺负、有社交同盟的个体，生理指标明显更好。他由此指出人类压力研究里最实用的一条：让人生病的往往不是压力的强度，是持续时间加上无法预测与无从掌控。",f:[{n:"急性反应有用，慢性开启有害",d:"心跳加快、血糖释放、免疫暂缓——这套反应对逃命极其有效，代价是暂停了修复、消化和长期建设。短时无妨，长期开启就把身体的维护预算持续挪走。所以问题从来不是有没有压力，是它关不关得掉。",eg:"一周的冲刺没事，连续两年的「随时待命」才是问题——后者身体一直没进过修复模式。"},{n:"不可预测比强度更伤",d:"实验反复显示：知道电击何时到来的动物，生理损伤远小于随机受击的。人也一样——明确的坏消息比悬着的不确定更好受。这条对管理和为人父母都成立。",eg:"重组期迟迟不公布方案，团队的损耗常常超过方案本身。给一个确定的时间点，比继续保密更省人。"},{n:"控制感是缓冲器",d:"同样的工作量，能自己决定顺序和节奏的人压力反应明显更低。所以增加自主权是成本极低的干预——不必减少任务，只需把「怎么做、先做哪个」交回去。",eg:"把「今天必须完成这五项」换成「这五项今天内完成，顺序你定」，负荷没变，损耗差别很大。"},{n:"社会支持不是软话题",d:"狒狒里有同盟的个体、人群里有稳定关系的人，同等压力下的生理指标都更好。这不是心理安慰，是可测量的生理差异。孤立本身就是一项健康风险。",eg:"高压项目里保住一两个能说真话的同事，比多睡一小时更能扛。"}],q:["==斑马不得胃溃疡，因为它的压力反应只开几分钟。==","==让人生病的不是压力本身，而是压力反应长期开着关不掉。==","==同样的压力，可预测和有控制感时，损伤小得多。=="],apply:"长期紧绷时，别只想着减少任务量：先看能不能增加可预测性（明确的时间点、明确的坏消息）和控制感（顺序自己定）。这两项的改善成本低，效果比硬扛大。",contrast:[{n:"塞涅卡",why:"两条路处理同一件事：塞涅卡从判断入手拆解愤怒与恐惧，萨波尔斯基说明它们在身体里是怎么运作的"},{n:"约翰·瑞迪",why:"瑞迪讲怎么用运动消耗掉待命的应激激素，萨波尔斯基讲那些激素为什么会一直待命"}]},
{c:"身心与生活",n:"BJ·福格",e:"2019年·斯坦福行为设计实验室",w:"小到不会失败",y:2019,l:["原子习惯","契克森米哈赖","卡尔·纽波特","富兰克林"],d:"斯坦福行为设计实验室创始人，研究行为如何被设计出来。他给出一个公式：行为发生需要动机、能力、提示三者同时到位。多数人失败在只调动机——靠决心和自我激励——而动机天然起伏，靠它维持的习惯必然崩。他的主张相反：把行为缩到小得不需要动机，然后挂在一个已有的动作后面。",story:"福格自己的例子被反复引用：他想养成做俯卧撑的习惯，于是规定每次上完厕所做两个。两个少到任何状态下都做得到，所以从不失败；而做完两个之后经常会多做几个。几个月后他每天做几十个，但从没依赖过意志力。关键不在两个俯卧撑的效果，在于「上厕所」是每天必然发生且位置固定的锚点，以及做完之后立刻给自己一个庆祝——他坚持这个庆祝动作是让大脑记住这件事的关键一步。",f:[{n:"动机不可靠，所以别依赖它",d:"动机像潮水，起落不由你。用高动机时定的计划去要求低动机的日子，注定断。正确的做法是把行为的难度降到最低动机时也做得到，剩下的交给锚点。",eg:"下决心时报名年卡、买齐装备，都是在高动机状态下透支——真正决定成败的是没劲那天做不做得到。"},{n:"锚在已有行为后面",d:"新习惯最难的是想不起来。福格的解法是把它挂在一个每天必然发生的动作之后：「刷完牙之后，我就……」。锚点提供了提示，你不必再靠记忆或提醒。",eg:"「倒完咖啡之后，我就写三句话。」比「每天早上写作」可靠，因为前者有具体的触发时刻。"},{n:"小到不可能失败",d:"两个俯卧撑、读一页、写三句——小到在最糟的一天也能完成。目的不是这点量的收益，是保住「这件事还在进行」的连续性，以及跨过启动那道坎。开始之后往往会自然做多。",eg:"把「跑三公里」改成「换上跑鞋出门」。换完鞋还不去的人很少，而目标是三公里的人经常连鞋都不换。"},{n:"做完立刻庆祝",d:"这是福格与多数习惯理论的差别：他认为大脑靠情绪而非重复次数来固化行为。所以完成后要立刻给自己一个明确的正向信号——握拳、说一句「不错」——听着傻，但它承担了让行为被记住的功能。",eg:"做完那两个俯卧撑，认真对自己说一句「做到了」。省掉这一步，习惯的固化会慢很多。"}],q:["==行为的发生需要动机、能力和提示同时到位。==","==把行为缩小到你在最没状态的一天也能完成。==","==让大脑记住一个习惯的，是完成时的情绪，不是重复的次数。=="],apply:"新习惯建不起来时，别加决心：把它缩到最糟那天也能做到的大小，挂在一个每天必然发生的动作后面，做完立刻给自己一个正向信号。",contrast:[{n:"原子习惯",why:"克利尔从系统与身份下手，福格从触发与最小动作下手——一个改框架，一个改起跑线"},{n:"富兰克林",why:"富兰克林一周只练一条美德，靠的是自律；福格把难度降到不需要自律"}]},
{c:"家庭与关系",n:"萨提亚",e:"1964年·家庭治疗先驱",w:"看冰山下面",y:1964,l:["卡尔·罗杰斯","非暴力沟通","阿德勒","依恋理论"],d:"家庭治疗的开创者之一。她的转折性主张是：一个人出问题，往往是整个家庭系统在维持某种平衡，把症状放在了最脆弱的那个成员身上。所以治疗对象不该只是那个人。她还给出一套辨识方法：人在压力下会退回四种固定的应对姿态——讨好、指责、超理智、打岔——而第五种「一致性」才是健康的表达。",story:"萨提亚会让全家人站起来摆出雕塑：谁离谁近、谁背对谁、谁被挡在后面。她说家庭的真实结构在语言里说不清楚，但摆出来所有人一眼就看见了。这个方法的犀利之处在于它绕过了辩解——没人能否认自己站在哪。她的另一句常被引用的话是：问题本身不是问题，如何应对才是问题。",f:[{n:"冰山：行为之下还有几层",d:"她把一个人分成水面上的行为，和水下的感受、观点、期待、渴望、自我。冲突几乎都发生在水面，而解决要到水下——对方发火（行为）底下是失望（感受），再底下是「我希望被重视」（期待）。停在水面上争对错，永远吵不完。",eg:"伴侣抱怨你回家太晚，字面是时间安排，底下多半是「我在这个家里排第几」。"},{n:"四种应对姿态",d:"讨好（放弃自己）、指责（放弃对方）、超理智（放弃双方只讲道理）、打岔（放弃话题）。四种都是压力下的自动反应，都在回避真实。第五种一致性是同时顾及自己、对方和情境——这是要练的，不是天生的。",eg:"吵架时你开始一条条讲逻辑而对方越来越激动，那多半是超理智对上了指责，两个人都不在场上。"},{n:"问题不是问题，应对才是",d:"家庭里的困难本身常常无解——收入、疾病、性格差异。真正决定日子好不好过的是应对方式。这句话把注意力从「谁造成的」转到「我们怎么处理」，后者才是能动的部分。",eg:"孩子成绩下滑这件事无法立刻改变，但全家是互相指责还是一起想办法，决定了它会变成什么。"},{n:"症状可能是系统的产物",d:"某个成员的问题常常在替系统承担功能——孩子出状况让濒临破裂的父母暂时联合起来。只治那个人而不动系统，症状会转移到别人身上。",eg:"孩子的问题一好转夫妻就开始吵，往往说明之前那个问题在替婚姻挡事。"}],q:["==问题本身不是问题，如何应对才是问题。==","==压力之下，人会退回讨好、指责、超理智或打岔。==","==症状常常不属于那个表现出症状的人，而属于整个系统。=="],apply:"家里反复出现同一种冲突时，先别追究谁不对：看双方各自退回了哪种姿态，再看水面下真正的期待是什么。如果某个人的问题一好转别处就出事，那多半是系统在移动。",contrast:[{n:"依恋理论",why:"依恋理论解释个人的模板从哪来，萨提亚解释家庭系统当下如何维持平衡"},{n:"非暴力沟通",why:"都主张从行为走到需要：卢森堡给四步句式，萨提亚给冰山与姿态两把尺"}]},
{c:"家庭与关系",n:"鲍恩",e:"1978年·家庭系统理论",w:"分化",y:1978,l:["萨提亚","阿德勒","依恋理论","约翰·戈特曼"],d:"精神科医生，提出家庭系统理论。他关注的核心是「自我分化」——一个人在与亲近的人保持连接的同时，能不能保有独立的思考和情绪。分化低的人被家庭的情绪场裹挟：别人焦虑他就焦虑，为了平息冲突不惜放弃立场。他的另一个重要概念是三角关系：两个人之间张力过大时，会自动拉进第三个人来分散，而这会把张力固定下来。",story:"鲍恩观察到家庭焦虑的传导极快且不讲道理：一个人紧张，全家都紧张，且没人说得清为什么。他把这叫情绪融合。他给出的方向不是切断关系——那是另一种被支配，叫情绪切割——而是分化：既留在关系里，又不被卷走。他有一句话概括了这个难处：能同时做到「我是我」和「我们在一起」的人，比想象中少得多。",f:[{n:"分化：连接与独立要同时成立",d:"分化低有两种表现，看着相反其实同源：一种是被牵着走、家人不高兴就妥协；另一种是干脆断绝往来。前者是融合，后者是切割，都是无法在关系里保持自己。真正的分化是留在关系里而立场不塌。",eg:"过年被催婚，跟着难受一整晚是融合，从此不回家是切割。第三条路是照常回去，且不为这个话题争辩也不改变主意。"},{n:"三角关系把张力固化",d:"两人张力过大时，会本能地拉入第三方——向朋友抱怨伴侣、父母把孩子拉进自己的矛盾。短期确实缓解，代价是那对矛盾从此不需要被解决了，因为张力已经有地方泄。",eg:"跟同事有意见不直说，转而跟第三个人说——问题不会消失，只会变成三个人的长期结构。"},{n:"焦虑会沿着系统传导",d:"家庭里的焦虑像水，从压力最大的地方流向最脆弱的地方，常常落在孩子身上。所以父母处理好自己的焦虑，比任何针对孩子的方法都管用——这是鲍恩最具操作性的推论。",eg:"父母对前途的焦虑，孩子几乎必然接收到，哪怕一个字没说。先处理自己那份，孩子的状态常常自动变化。"},{n:"分化是练出来的，且会传代",d:"分化水平大体在原生家庭里形成，也会传给下一代。但它可以有意识地提高——方法是在最容易被卷走的关系里，反复练习「我知道你不高兴，我理解，但我的看法不变」。",eg:"每次面对家人的情绪都能既不冷漠也不投降，这个能力就长一分，下一代接到的起点也高一分。"}],q:["==分化，是在与人保持连接的同时，仍然保有自己。==","==两个人之间的张力过大时，会自动拉进第三个人。==","==焦虑沿着家庭系统传导，落在最脆弱的那个人身上。=="],apply:"被家人的情绪牵着走时，先分清：我是在融合（跟着难受、赶紧妥协）还是切割（干脆不来往）。想解决两个人的矛盾，注意别拉第三个人进来——那会让它变成长期结构。",contrast:[{n:"萨提亚",why:"同为家庭系统取向：萨提亚看当下的应对姿态，鲍恩看跨代的分化水平"},{n:"阿德勒",why:"两把划边界的刀：阿德勒问「这是谁的课题」，鲍恩问「我有没有被卷进他们的情绪」"}]},
{c:"家庭与关系",n:"托马斯·戈登",e:"1962年·父母效能训练",w:"我信息",y:1962,l:["非暴力沟通","卡尔·罗杰斯","蒙台梭利","阿德勒"],d:"罗杰斯的学生，把人本主义心理学做成了普通父母能学的课程——父母效能训练（P.E.T.）。他的两个核心工具比后来流行的沟通方法更早也更具体：一是「我信息」，用描述自己而非评判对方的方式表达不满；二是「问题归属」，先分清这件事困扰的是谁，因为归属不同，该用的方法完全不同。",story:"戈登指出多数父母只会两招——要么赢（我说了算），要么输（算了随他）。他把这叫输赢法，并指出两种都有长期代价：赢法培养出顺从或对抗，输法培养出不顾及他人。他提出第三法：把冲突变成共同解决的问题，让双方一起找出彼此都能接受的方案，且不投票、不折中，而是找一个真正满足两边需要的办法。这在当时的育儿观念里近乎异端。",f:[{n:"我信息：说自己，不评判对方",d:"完整的我信息有三部分：具体行为、对我的实际影响、我的感受。「你把玩具留在楼梯上（行为），我抱东西下楼会踩到（影响），我很担心（感受）」。它之所以有效，是因为没有一句在说对方是什么人，对方不必防御。",eg:"把「你怎么这么不小心」换成「东西放在楼梯上，我抱着箱子看不见会摔倒」。同一件事，后者孩子会去挪。"},{n:"先分清这是谁的问题",d:"孩子考砸了难受，问题在孩子那边，父母该做的是倾听；孩子把客厅弄乱让你没法工作，问题在你这边，该用我信息。用反了最常见：孩子难受时父母急着讲道理，等于把自己的问题叠上去。",eg:"孩子被同学孤立回来哭，此刻不该分析原因和给建议，那是把问题接管过来了。先听。"},{n:"第三法：不靠输赢解决冲突",d:"要么听我的、要么听你的，长期都在积累账。戈登的做法是把冲突摊开成一个待解的问题：双方说出各自真正的需要，再一起找方案。关键在于找的是满足两边需要的第三条路，不是各让一步的折中。",eg:"孩子要玩到十点、你要他九点睡，折中九点半两边都不满意；问清楚他要的是玩完这一局，改成九点前打完，两边都成立。"},{n:"倾听是有动作的",d:"戈登要求的倾听不是沉默，是把对方的意思用自己的话说回去，让对方确认。这来自他老师罗杰斯，但他把它拆成了父母可以照着做的步骤，而不是一种态度。",eg:"孩子说「我再也不去上学了」，回一句「听起来今天在学校发生了很不好的事」，比问「为什么」更容易让他说下去。"}],q:["==用我信息，不用你信息：说这件事对我的影响，不说你是什么样的人。==","==先弄清这个问题困扰的是谁，再决定用哪种方法。==","==冲突不必以谁赢谁输收场。=="],apply:"要提意见时，先把话拆成「具体行为 + 对我的实际影响 + 我的感受」，一句都不评价对方是什么人。开口之前先问：这件事困扰的是我还是他？困扰他的时候，先听不讲。",contrast:[{n:"非暴力沟通",why:"戈登比卢森堡早二十年，两套结构高度相似；戈登多了一层「问题归属」的判断"},{n:"蒙台梭利",why:"都主张成人退后：蒙台梭利改环境让孩子自己做，戈登改说法让孩子自己想"}]},
{c:"学习与成长",n:"维果茨基",e:"1934年·苏联心理学家",w:"再高一点",y:1934,l:["艾利克森","蒙台梭利","费曼","契克森米哈赖"],d:"苏联心理学家，三十七岁去世，留下的概念却影响了整个教育学。他最重要的贡献是「最近发展区」——一个人能力有两条线：自己能做到的，和在他人帮助下能做到的。两条线之间那段空隙，才是学习真正发生的地方。低于它是重复，高于它是挫败。他还强调思维是从社会互动内化来的：先是和别人一起做，然后才变成自己会做。",story:"维果茨基与当时主流的发展观相反。皮亚杰认为要等孩子发展到某个阶段才能教相应的内容，维果茨基认为教学应当走在发展前面——恰当的引导会把发展往前拉。他举的例子是：两个孩子独立解题都停在同一水平，但给一点提示后，一个能往前走很远，另一个走不动。这两个孩子的实际水平相同，最近发展区却完全不同，而后者才决定他们接下来能学到什么。",f:[{n:"看能力的两条线，不只看一条",d:"评估一个人只看他独立能做什么，会低估差别。真正有预测力的是「给一点帮助后能做到什么」——它显示这个人接下来能长到哪。对带人和教孩子都是同一件事：别只看现在的成绩，看提示之后的反应。",eg:"两个下属现在的产出差不多，给同样一句指点后，一个立刻能推进、一个还是原地——培养重点该放在前者。"},{n:"脚手架：给了要撤",d:"帮助的正确形态是脚手架——搭起来是为了让人够到更高处，够到之后要拆。不拆的帮助会变成依赖，让人停在被扶着的水平上。所以每一次介入都该带着「什么时候不再需要」的问题。",eg:"教孩子解题时先示范一步、让他做下一步，下次只提示第一句，再下次不提示。不撤的示范会一直被等着。"},{n:"教学应当走在发展前面",d:"等准备好了再教，会错过窗口；教远超出的东西，只会挫败。正确的位置是略高于当前——难到需要帮助，又没难到帮了也做不成。这与刻意练习的舒适区边缘是同一个位置的两种说法。",eg:"孩子刚会加法就教方程是无效的；但一直只让他做加法，那个能往前一步的窗口就白白关掉了。"},{n:"先在人之间，后在人心里",d:"维果茨基认为高级思维先发生在互动中，再内化成个人能力——孩子先是被大人提问，后来才学会自己问自己。这解释了为什么讨论、复述、教别人比默读有效：它把还没内化的过程先在外面走一遍。",eg:"学不明白的东西，找人讲一遍。你在讲的过程中借用的正是那个还没内化的结构。"}],q:["==一个人独立能做到的，与在帮助下能做到的，两者之间就是最近发展区。==","==教学应当走在发展的前面。==","==高级的思维先发生在人与人之间，然后才发生在人的内部。=="],apply:"教人或自学时，找那个「一个人做不到、给点提示就能做到」的位置——低于它是重复，高于它是挫败。帮助要按脚手架来：给了就要计划什么时候撤。",contrast:[{n:"艾利克森",why:"同一个位置的两种说法：艾利克森叫舒适区之外，维果茨基叫最近发展区，前者讲怎么练，后者讲怎么教"},{n:"蒙台梭利",why:"两种儿童观：蒙台梭利主张准备环境让孩子自己长，维果茨基主张教学要主动往前拉"}]},
{c:"学习与成长",n:"德韦克",e:"2006年·斯坦福大学",w:"能力可长",y:2006,l:["艾利克森","维果茨基","原子习惯","费曼"],d:"斯坦福心理学家，提出固定型思维与成长型思维的区分：前者认为能力是天生定量的，后者认为能力可以通过努力和方法生长。两种信念带来完全不同的行为——认为能力固定的人会回避可能失败的挑战，因为失败等于证明自己不行；认为能力可长的人把失败当作信息。这个概念影响极大，也因此被大量简化和滥用，需要分开看待。",story:"她最有名的实验是给学生做完一组题后给两种不同的表扬：一组被夸「你真聪明」，一组被夸「你很努力」。随后让他们选下一组题，被夸聪明的更多选择了简单的，被夸努力的更多选择了有挑战的。她的解释是，夸天赋让孩子把成绩当成天赋的证明，此后每一次挑战都变成了对自我的威胁。夸过程则把注意力放在可控的部分上。",f:[{n:"夸过程，别夸天赋",d:"这是这套理论里最实用也最容易执行的一条。夸聪明会让人保护「聪明」这个标签，从而回避挑战；夸具体的做法（你把这一步拆开了、你换了三种方法）让人把注意力放在可改进的地方。",eg:"孩子考得好，说「你这次把错题都过了一遍」，不说「你真聪明」。前者可复制，后者只能守。"},{n:"失败是信息还是判决",d:"两种思维的分水岭在失败发生的那一刻：一种把它读成「我不行」，另一种读成「这个方法不行」。差别不在情绪强度，在于接下来会不会去找原因。",eg:"方案被否，问「哪里不成立」的人下次能改；认定「我不适合做这个」的人，下次连提都不提了。"},{n:"「还没有」这个词",d:"德韦克提到一所学校用「尚未通过」代替「不及格」，把结果从一个判决改成一个时间点。这个小改动之所以有效，是因为它把注意力从「我是什么水平」转到「我到哪一步了」。",eg:"把「我不会写」改成「我还不会写」。一个字的差别，决定了后面那句是找方法还是找理由。"},{n:"这个效应比流行说法小得多",d:"必须说清楚：近年多项大规模重复实验发现，思维模式干预的实际效应量远小于原书传达的印象，在部分人群里接近于零。它是一个真实但温和的因素，不是决定成败的开关。把它当万能钥匙，会让人忽略资源、方法和环境这些更重的变量。",eg:"孩子学不好，先看教法、基础和睡眠，别一上来就归因为「心态不对」——那既不准确，也把责任全推给了孩子。"}],q:["==夸奖天赋会让人回避挑战，夸奖过程会让人接受挑战。==","==在成长型思维里，失败是信息；在固定型思维里，失败是判决。==","==用「还没有」代替「不行」。=="],apply:"给反馈时夸具体做法，不夸天赋。自己失败时先问「哪个方法不成立」，而不是「我是不是不行」。但别把思维模式当成万能解释——效应比流行说法小得多，先检查方法、资源和休息。",contrast:[{n:"艾利克森",why:"德韦克讲相信能力可长，艾利克森讲具体怎么长——只有信念没有练法，是空的"},{n:"维果茨基",why:"两者都指向「再高一点」的位置：一个说该相信能到，一个说该怎么搭梯子"}]},
{c:"学习与成长",n:"优秀的绵羊",e:"2014年·德雷谢维奇",w:"会考不会想",y:2014,l:["费曼","苏格拉底","卡尔·纽波特","尼采"],d:"作者在耶鲁任教十年、做过招生评审，写下对精英教育的批评。他的观察是：这套系统筛选出的年轻人极其擅长跨越一道道设定好的栏杆——成绩、竞赛、实习、简历——却普遍说不出自己想要什么。他称他们为优秀的绵羊：能力很强，方向全靠外部给定，一旦没有下一道栏杆就陷入茫然，且对失败有超出常人的恐惧，因为从没被允许失败过。",story:"他描述那种典型的困境：一个各方面都出色的学生来找他，说自己不知道为什么要读这个专业，也不知道毕业后想做什么，只知道必须做到最好。德雷谢维奇指出这不是个人问题，是系统的产物——一个从小被优化到「满足每一项评价标准」的人，从来没有机会练习「自己决定什么重要」这件事。他的处方不是换个专业，是给自己一段没有评价标准的时间。",f:[{n:"擅长跨栏，不擅长选路",d:"长期在明确评价体系里胜出的人，会把「做到最好」内化成默认目标，而从没练过「决定什么值得做」。这两种能力完全不同，且后者只能在没有标准答案的处境里练。",eg:"从优等生到工作后陷入迷茫的落差，多半不是能力问题，是第一次没人给标准了。"},{n:"怕失败到不敢尝试",d:"一路顺利的代价是没有失败的经验，于是失败被想象得极其可怕。结果是回避一切可能不擅长的事，能力越来越窄——恰恰是最需要拓宽的时候。",eg:"不敢转去自己真正想做的方向，理由是「我在现在这行已经积累了」，但真实原因常常是不能接受从头当新手。"},{n:"给自己一段没有评价的时间",d:"他的建议很朴素：去做一件不被记分的事，做够长。因为「我想要什么」这个问题只有在没人打分的时候才浮得上来，有评分标准时人会自动去优化那个标准。",eg:"业余认真做一件没人看的事，做半年。这半年产生的判断，比任何职业规划课有用。"},{n:"批评的对象是系统，不是学生",d:"这本书容易被误读成指责年轻人不够独立。作者的对象是把人训练成这样的筛选机制——每一步都理性的选择，加起来变成一个没有方向的人生。看清这一层，才不会把它当成又一次「现在的年轻人怎么了」。",eg:"用它自省可以，用它教训别人不行——那些栏杆是谁设的、谁在收益，才是这本书真正问的问题。"}],q:["==他们非常擅长跨越栏杆，却说不出自己想去哪里。==","==从未被允许失败的人，会把失败想象得无比可怕。==","==只有在没有人打分的时候，你才知道自己真正想要什么。=="],apply:"发现自己只会问「怎样才算做得好」而答不上「我想要什么」时，去做一件不被记分的事，做够长。判断一个选择时，先分清是我想要，还是它恰好是下一道栏杆。",contrast:[{n:"苏格拉底",why:"两种把人从现成答案里叫醒的方式：苏格拉底靠追问，德雷谢维奇靠指出提问的人一直在替别人答题"},{n:"尼采",why:"都在质疑外部给定的价值：尼采针对道德体系，德雷谢维奇针对精英筛选体系"}]},
{c:"家庭与关系",n:"哈佛成人发展研究",e:"1938年至今·哈佛医学院",w:"关系的质量决定晚年",y:1938,
d:"人类史上最长的一项成年人追踪研究。1938年从268名哈佛大二学生开始，后来并入波士顿贫民区的456个男孩，两组人每两年问一次近况、每五年做一次体检，很多人被跟了一辈子，如今已经跟到他们的子女。第四任主任罗伯特·瓦尔丁格把八十多年的数据压成一句话：让人晚年健康又快活的，既不是财富也不是名声，是关系的质量。这项研究的分量不在结论本身——那句话人人都会说——而在它是极少数用几十年纵向数据把这句话钉住的证据。",
story:"研究开始时的设想完全不是这个。1938年立项要找的是「什么样的年轻人会长成健康成功的成年人」，测的是体格、血压、家庭背景，甚至量过颅骨，研究者预期答案会落在体质和出身上。几十年过去，这些指标一个接一个失去解释力，剩下的那一项恰恰是他们最初没打算测的：这个人有没有稳定、可依靠的关系。样本里有出身极好却晚景孤零的人，也有从贫民区出来、一辈子被朋友和家人围着的人——后者的健康曲线更高。",
f:[{n:"关系是预测项，不是安慰话",d:"五十岁时对亲密关系的满意度，比同期的胆固醇水平更能预测八十岁时的健康。这不是说心情好身体就好，是长期的关系状况会顺着压力、睡眠、炎症这些通道落到身体上。",eg:"研究里事业极成功但关系疏离的那一批，晚年的健康和记忆衰退都更早。"},
{n:"质量算数，数量不算",d:"起保护作用的不是朋友的个数，是有没有几个能真托住你的人。这项研究常用的量法只有一个问题：半夜出事你能打给谁。答不出名字的人里，社交很活跃的不在少数。",eg:"通讯录两千人，半年内说过话的不到十个——后一个数字才是真的。"},
{n:"高冲突的关系比没有关系更伤",d:"数据里不好听的一条：长期互相消耗的婚姻，对健康的损害超过分开。所以「维持」本身不是目的，为了孩子硬撑二十年这个选择，在健康这本账上要单独算一笔。",eg:"硬撑下去的那种婚姻，两个人的体检报告都在替它付钱。"},
{n:"改善的窗口一直开着",d:"这项研究里改善最明显的一批人，是五六十岁才开始主动修复关系的——重新联系断掉的亲人，把泛泛之交变成常来往的人。瓦尔丁格给这件事起名叫社交健身：不练就退。",eg:"六十岁重新联系上老同学，之后十年的心情和体检都被抬了一截。"}],
q:["==排在第一位的既不是钱，也不是名声，是身边那几个人。==",
"半夜两点你出事了，能打给谁——这个问法比问你有几个朋友准。",
"==它和肌肉是一回事：不是练成了就一直在，是停下就会退。=="],
apply:"觉得关系可以等忙完这阵再说时，先数一个数：过去一个月我跟人有过几次不为办事的来往。数不出来，它就不是「以后再说」的事。要动就从最小的一步开始：每周挑一个人，发一条不为办事的消息。用反了：拿它去逼自己维持一段正在消耗你的关系，那恰好是数据里最伤身体的那一类；或者读成必须有很多朋友，它说的一直是质量不是数量。",
l:["依恋理论","格兰诺维特","弗兰克尔","阿莉·霍克希尔德"],
contrast:[{n:"格兰诺维特",why:"都在讲关系的结构：格兰诺维特看弱连接怎么带来机会，哈佛研究看强连接怎么托住晚年——一个管信息，一个管身体"},
{n:"约翰·卡乔波",why:"同一件事的两端：哈佛研究给出关系值多少，卡乔波给出缺了它的时候身体和脑子会发生什么"},
{n:"优秀的绵羊",why:"都在问什么才算过得好：绵羊质疑评分体系，哈佛研究直接给出八十年数据里排第一的那一项"}]},
{c:"心智与情绪",n:"约翰·卡乔波",e:"1951-2018·芝加哥大学",w:"孤独是信号不是缺陷",y:2008,
d:"社会神经科学的创立者之一，一辈子研究一件事：孤独在身体和大脑里到底是什么。他做的第一件事是把定义拧紧——孤独不是身边没人，是你想要的联结和实际有的之间那道差，所以热闹的房间里也可以很孤独。定义一改，孤独就从性格问题变成了信号，和饥饿、口渴、疼痛归进同一类：都在提醒你去补一样对生存要紧的东西。他后半生的工作是证明这个信号有实打实的生理后果，以及找出真正能关掉它的办法——那个办法和几乎所有人的直觉都不一样。",
story:"卡乔波做过一个让人不太舒服的实验：给被试看一批中性的面孔，孤独程度高的人更容易把它们读成不友好，对负面社交词的反应也更快。他的解释是进化——落单的个体必须提高警觉才活得下来，这套机制在原始环境里是救命的。问题是它在今天会反噬：你把别人的冷淡读成敌意，于是先退一步；对方察觉到疏远，也退一步。这个循环不需要谁真的排斥过你，它自己就转得下去。",
f:[{n:"孤独是信号，不是性格缺陷",d:"当成缺陷，第一反应是瞒着不说，而瞒住恰好堵死了唯一的出口。当成信号就没有这个包袱：它不说明你这人有毛病，只说明有件事该做了，跟饿了该吃饭是同一类事。",eg:"「我这人就是不合群」——这句话一出口，能做的事就全关掉了。"},
{n:"独处不等于孤独，所以很多办法用错了地方",d:"判据是主观的：有没有人让你觉得被懂，而不是身边站着几个人。搬去人多的城市、参加更多活动，加的都是独处的反面，补的不是那道差。",eg:"天天有饭局却越吃越空，说明加的那一项根本不在账上。"},
{n:"警觉会把孤独自己养大",d:"孤独让人对社交威胁过度敏感，敏感让人先撤，先撤让关系变淡，变淡又坐实了「我果然不受欢迎」。它是个自己转的圈，所以光靠多接触人打不断。",eg:"消息没秒回就断定人家不想理你——多数时候他只是在开会。"},
{n:"最有效的干预是改解读，不是加机会",d:"2011年他和同事做的元分析把办法分成四类：加社交机会、加社会支持、练社交技巧、改对社交的解读。前三类是所有人的直觉，效果都不大，排第一的是第四类。",eg:"把「他嫌我烦」先改写成「他可能在忙」，隔天再发一条试试。"}],
q:["==身边站着几个人，和有没有人懂你，是两件事。==",
"孤独和饿是同一类东西：都在提醒你，有样要紧的缺了。",
"==谁也没排斥过你，可它就是这么一直转下去了。=="],
apply:"觉得孤独又不好意思说出口时，先分一句：我缺的是有人在场，还是有人懂我。前者去人多的地方管用，后者去了也白去。如果是后者，别急着加社交，先抓住那个自动冒出来的结论——「他肯定嫌我烦」——把它写下来，问一句凭什么，然后找机会验一次。用反了：拿它当成必须马上扩大社交圈，那是在加数量；也别反过来责备自己不够开朗，信号不挑性格，外向的人一样会亮。",
l:["哈佛成人发展研究","布琳·布朗","克里斯汀·内夫","萨波尔斯基"],
contrast:[{n:"格兰诺维特",why:"都在数关系，但数的东西不同：格兰诺维特数你能通到几个不重叠的圈子，卡乔波数你觉不觉得被懂"},
{n:"布琳·布朗",why:"两种「说不出口」：羞耻靠秘密和沉默活着，孤独靠警觉和先撤活着——都是越藏越大"},
{n:"阿德勒",why:"阿德勒说人的烦恼都来自人际关系，卡乔波把这句话拿去做了实验，量出它在血压和睡眠上的读数"}]},
{c:"学习与成长",n:"村上春树",e:"1949-·《当我谈跑步时我谈些什么》2007",w:"把创作变成体力活",y:2007,
d:"三十岁前开着一家爵士酒吧，1978年在球场看棒球时忽然决定写小说，1981年关掉店专职写作，同时开始跑步——理由很实际：坐着写东西会发胖，烟也抽得太凶。此后三十多年，他跑完过三十多次全程马拉松和一次一百公里超马，写作与跑步用的是同一套办法。他这本谈跑步的书之所以被大量不跑步的人读，是因为它其实在回答另一个问题：一件没人要求你做、也不知道有没有人看的事，怎么才能做上几十年。",
story:"写长篇的时候他给自己定死了每天的量：十页稿纸，每页四百字。写得不顺，硬凑也要凑满；写得正顺、还想接着写，也在这里停。他说这不是自律的表演，是为了明天——今天把话说尽，明天坐下来面对的就是一片空白；留一截没写完的，第二天才接得上。跑步同理：状态再好，跑完当天的量就回家。他把这套东西叫作和肌肉打交道的方式——肌肉记得住负荷，但它只认每天都来的那种。",
f:[{n:"停在还想写的地方",d:"写作最难的不是写，是重新开始写。把结尾停在一个自己知道下一句是什么的位置，第二天的启动成本接近于零。反过来，一段彻底写完再收工，明天面对的是从头找入口。",eg:"停在一句话中间，第二天坐下就能直接接着敲。"},
{n:"定上限，不只定下限",d:"多数人只给自己定下限。定上限是为了防止状态好的那天透支——那天多写的部分，通常要用后面三天的枯竭来还。产量真正的敌人不是懒，是忽高忽低。",eg:"周末爆写两万字，接下来两周一个字都碰不了，账是平的甚至亏的。"},
{n:"才能之外还有两样，而且能练",d:"他说写小说要三样：才能、集中力、持续力。才能有多少是天给的，不归你管；后两样跟练肌肉一样，每天给一点负荷就会长。纠结第一样不产生任何动作，能下手的一直是后两样。",eg:"「我没天赋」这个结论就算是对的，也推不出今天该做什么。"},
{n:"没人要求你做，所以理由只能自己给",d:"上班有考核，读书有考试，理由是外面给的。自己选的长期事情没有这一套——一旦拿阅读量、点赞、别人的评价当理由，那个理由随时会被抽走。他的替代方案是跟昨天的自己比：参照物每天都在，而且不会耗尽。",eg:"发了三篇没人看就不写了，说明当初写的理由本来就在别人手里。"}],
q:["==每天写得完的量，才是能写十年的量。==",
"跑不跑没人管，所以停下来也没人拦——难的是这个。",
"==热情靠不住，定额靠得住。=="],
apply:"做一件长期的事而进度全看状态时，先定一个不问心情的每日量，并且把它压低到最差的那天也做得完——用单日的上限换年度的总量。收工别停在写完的地方，停在还想往下写的地方。想放弃的时候先分一句：是因为做得不好，还是因为没人看见。用反了：拿它合理化闭门造车，不看反馈和不靠反馈是两回事；也别把每日量定成成果量，村上定的一直是投入量。",
l:["艾利克森","BJ·福格","卡尔·纽波特","李小龙"],
contrast:[{n:"艾利克森",why:"都在讲长期练什么：刻意练习要你待在做不到的边缘，村上要你把每天的难度降到不会断——一个管长进，一个管别停"},
{n:"BJ·福格",why:"同一个思路的两端：福格把习惯缩到最糟那天也做得到，村上把每日产量压到状态最差也交得出"},
{n:"凯文·凯利",why:"都在回答「没人看怎么办」：凯文·凯利说你只需要一千个铁杆粉丝，村上说这个问题的答案不该在外面找"}]},
{c:"身心与生活",n:"凯博文",e:"1941-·哈佛大学·医学人类学",w:"治不好，还照护得了",y:1988,
d:"哈佛的医学人类学家，也是精神科医生，在中国做过多年田野。他一辈子在做同一件事：把「病」拆成两半。一半是医生看到的——检查单上的指标、器官里的病变；另一半是病人过的那段日子——疼、怕、干不成事、在家里变成另一个角色。现代医学几乎全部力气都花在前一半上，而人真正在受的是后一半。2011年他的妻子琼因早发型阿尔茨海默病去世，此前十年由他照顾。研究了一辈子照护的人说自己完全没准备好，这句话是他后半生工作的起点。",
story:"他的妻子琼在五十多岁确诊，此后十年一点点忘掉自己是谁，也忘掉他是谁。凯博文那时已经是照护研究的权威，教了几十年，轮到自己才发现书上的东西大半用不上：真正难的不是技术，是每天早上重新接受今天的她和昨天不一样。他后来写下这段，得出的结论只有一句——治愈会走到走不下去的地方，照护不会。医学有交出去的那一刻，而陪着这件事，一直到最后一天都还做得了。",
f:[{n:"「指标正常」和「你没事」是两句话",d:"检查单能宣布病变消失，宣布不了那段日子留下的影响。很多人在治疗结束后反而更难受，因为医学的任务完成了，而生活里的那一半还没有人管——它本来就不在那张单子上。",eg:"化验全正常，可还是不敢一个人出门——这不是矫情，是另一半没被处理。"},
{n:"解释模型八问，最后一问最要紧",d:"1978年他提出一组问题：你管它叫什么病、觉得是什么引起的、为什么这时候来、有多严重、该怎么治、惹了哪些麻烦、你最怕它哪一点。前七个问理解，最后一个问恐惧——而恐惧常常才是真正拦住人的那样东西。",eg:"医生反复说这个病能控制，而他怕的其实是同事会怎么看他。"},
{n:"治愈和照护是两个目标，答案在不同人手上",d:"治愈问能不能好，答案有时候是不能；一旦是不能，按这个目标走的人就无事可做了。照护问今天能不能好过一点，这个问题每天都有答案，而且答案一直在你手上。",eg:"「治不好了」之后仍然有一整天要过，那一天怎么过是可以决定的。"},
{n:"照护的人也在被消耗，这一项要单独算",d:"他写得最不留情的一段是自己的崩溃：疲惫、内疚、偶尔冒出来的怨气。他坚持这不是道德问题而是结构问题——长期照护的成本必须被看见、被分担，否则倒下的会是两个人。",eg:"独自扛了两年之后自己先病倒，这在长期照护里是常态不是意外。"}],
q:["==检查单上的病好了，日子里的那一半还在。==",
"他是这一行的权威，轮到自己一样被打得措手不及。",
"==别问能不能治好，先问今天能不能好过一点。=="],
apply:"查出一个要长期带着的病，先把两件事分开各写一列：医生说的那件，和我每天真正难受的那件。它们常常不是同一件，而第二列没人替你处理。陪人看病之前先问一句「你最怕的是哪一点」，比问哪儿不舒服有用——恐惧才是决定他配不配合的东西。已经治不好的时候，把「治好」这个目标放一边，只问今天有哪件小事能让这一天好过一点。用反了：拿照护替代该做的治疗；或者读成必须一个人扛到底——他这本书很大一部分正是在讲扛不住会怎样。",
l:["萨波尔斯基","弗兰克尔","阿莉·霍克希尔德","卡尔·罗杰斯"],
contrast:[{n:"弗兰克尔",why:"都在回答「这件事改不了了怎么办」：弗兰克尔讲极端处境下态度是最后的自由，凯博文讲日常的长期消耗里照护一直做得了"},
{n:"卡尔·罗杰斯",why:"都要求先听懂对方的世界：罗杰斯给的是复述到对方点头，凯博文给的是八个具体问题"},
{n:"阿莉·霍克希尔德",why:"都在给不被计量的劳动记账：霍克希尔德算家务和情感劳动，凯博文算长期照护——两笔都默认由一个人独吞"}]},
{c:"心智与情绪",n:"荣格",e:"1875-1961·苏黎世",w:"人生下午的纲领不一样",y:1931,
d:"分析心理学的创立者，弗洛伊德最看重的学生，也是最著名的那个决裂者。他留下的东西里有不少难以验证的部分——集体无意识、原型、共时性——但另外三个概念被反复用了近一百年，因为它们直接对着一个人怎么过日子：把一生分成上午和下午，两段的任务不同；把自己压下去、又从别人身上跳出来的那部分叫阴影；把在外面扮演的那一套叫面具。这三样的共同点是都能拿来当自查的工具，而不是只能拿来解释。",
story:"他把一生比作一天。上午的任务是往外——立业、成家、在世界上挣一个位置，标准是外面给的，也确实管用。他观察到的是：很多人到了中年忽然失速，不是能力退了，而是还在用上午的纲领过下午。他为此写下那句常被引用的话——早晨为之伟大的东西，到了傍晚会变得微不足道。下午的方向掉了个头：从争取变成整理，从往外证明变成把那些一直没被用上的部分捡回来，判断标准也从别人手里换回了自己。",
f:[{n:"中年的失速多半是到点，不是故障",d:"做得好好的人忽然提不起劲，第一反应总是找毛病：累了、行业选错了。另一种读法是上午那道题基本答完，下午的还没接上，中间那段空白就是这个感觉。",eg:"该有的都有了却更空，这种空比一无所有时更难跟人解释。"},
{n:"上午的解法用在下午会加倍失效",d:"上午卡住就加码——再努力一点、再多要一点。下午再用这一招，只会把空的地方填得更满。中年拼命升职换房、之后发现那种感觉一点没少的，多半是这个。",eg:"升了职反而更空，说明加的那一项本来就不在账上。"},
{n:"过度的反感是阴影在说话",d:"看不惯一个人很正常，但反应大到不成比例——一提就来气、不相干也要说两句——就不只是关于他了。压下去的东西不会消失，它换个出口，常常从别人身上跳出来。",eg:"对爱出风头的人深恶痛绝的，往往自己最想被看见。"},
{n:"面具是必需品，但要脱得下来",d:"职务、身份、别人期待你有的样子，都是面具，也都该有。危险在戴久了当成自己：退休、失业、孩子离家，面具被外部收走，剩下的那个人不知道自己算谁。",eg:"退休头半年最难熬的往往不是没事做，是不知道现在该是谁。"}],
q:["==同一套办法，上午管用，下午就不管用了。==",
"让你一提就来气的那类人，值得你多看两眼。",
"==明天这个身份没了我还剩什么——写得出三样就还好。=="],
apply:"三四十岁做得不差却越来越提不起劲，先别忙着找毛病。问一句：我最近在使的劲，是不是还在解上午那道题——如果那道题基本答完了，继续加码就没用了。遇到一想到就来气的人，把讨厌他的那一点写下来，再问这一点我身上有没有、只是从来不许它出来。另外长期留一件跟身份无关的事：一个爱好，一群不认识你职务的人；角色被收走那天你站在什么上面，就靠它。用反了：拿它当撂挑子的理由，荣格说的是重心转移；也别把每一次疲惫都读成人生转向。",
l:["弗兰克尔","优秀的绵羊","庄子","布琳·布朗"],
contrast:[{n:"优秀的绵羊",why:"都在讲外部标准失效之后怎么办：绵羊说的是一路优秀的年轻人忽然没了评分，荣格说的是中年人上午那套纲领到点了"},
{n:"布琳·布朗",why:"都在处理不肯认的那部分自己：布朗讲羞耻靠沉默活着，荣格讲阴影靠投射活着——都是不认就更凶"},
{n:"阿德勒",why:"两种看不惯别人的解法：阿德勒问这是谁的课题，荣格问这一点我身上有没有"}]},
{c:"身心与生活",n:"老鼠公园",e:"1978年·西蒙菲莎大学",w:"成瘾要看笼子",y:1978,
d:"七十年代末的一组实验，加上一场没人设计的自然实验，合起来动摇了关于成瘾的一个常识。标准做法是把老鼠单独关在空笼子里，给一瓶掺吗啡的水，它会喝到死——结论看着很硬：一沾就完。布鲁斯·亚历山大问了另一个问题：如果笼子不是空的呢。他造了一个有同伴、有轮子、有隧道的大围栏，同样两瓶水，那里的老鼠对吗啡水兴趣小得多。同一时期，越战归国士兵的追踪数据给出了人身上的版本。这个条目要说的不是药不重要，是处境这一项被长期低估了。",
story:"1971年美国政府发现驻越美军里有相当比例的人对海洛因成瘾，所有人都在等一场灾难——这些人回国会把问题带回城市。罗宾斯团队做了追踪，结果和预期完全相反：绝大多数人回国之后自己就停了，一年内复吸的只占很小一部分。同一批人，同一种药，换了地方就不一样。回国换掉的不只是地点，是一整套东西：不再随时可能死、身边是家人不是战友、有工作有日程、拿到那样东西也变难了。",
f:[{n:"笼子也是变量，不只是背景",d:"原来的实验默认笼子是背景，只有药是变量。把笼子也变成变量之后结论就变了：同一只老鼠、同一瓶水，处境不同，行为差得很远。药的作用没被否认，只是它不是唯一那一项。",eg:"同样一款游戏，暑假在家的孩子和有事可做的孩子，玩法完全不同。"},
{n:"空出来的地方本身在制造需求",d:"公园里的老鼠不是被管住了，是本来就不太想喝。亚历山大后来用了一个词——错位：个体被从他该在的关系和位置里拔出来，就会去找任何能填的东西。",eg:"搬到陌生城市、一个朋友都没有的那段时间，什么都容易上瘾。"},
{n:"先记账，找那个固定的空档",d:"用起来是反直觉的：先别跟那件事较劲，先记十次——什么时候、在哪儿、手上有没有别的事、旁边有谁。多数人记完会发现，触发它的不是渴望，是某个固定的空档。",eg:"十次里八次是睡前躺床上，那要改的是睡前那半小时的安排。"},
{n:"这条有边界，说清楚才用得对",d:"老鼠公园的复制并不都成功，学界对解释也一直有争论；越战那组数据里也仍有一部分人回国后继续。稳妥的读法是处境解释了大头，不是全部——用它解释一切，会让该就医的人被耽误。",eg:"「换个环境就好了」对一部分人成立，对另一部分人是危险的建议。"}],
q:["==问题可能不在那瓶水，在那个笼子。==",
"戒不掉常常不是意志不够，是那个空一直在。",
"==撤掉一样东西会留下一个位置，那个位置得有人补。=="],
apply:"想戒掉一件事而每次都靠忍、每次都在同一个地方破功时，先别动那件事，先记账：最近十次是什么时间、什么地点、当时手上有没有别的事、旁边有谁。找那个共同点，先撤它——把这件事撑住的条件一条条拿掉，它会自己变难；正面硬扛撤掉的只有你的意志力，那是最先耗尽的一项。撤完记得补：空出来的位置不填，会被原样填回来。用反了：当成万能解释去替代该有的医疗帮助；也别以为搬个家就自动解决，越战那组数据里换掉的是一整套处境，不是一个地址。",
l:["蒙台梭利","BJ·福格","原子习惯","萨波尔斯基"],
contrast:[{n:"蒙台梭利",why:"同一个思路用在两处：蒙台梭利说先改环境再谈行为，老鼠公园说先改笼子再谈意志——都是把担子从人身上挪回处境"},
{n:"BJ·福格",why:"都不跟意志力赌：福格靠把动作缩到最小，老鼠公园靠把支撑条件撤掉——一个降门槛，一个拆脚手架"},
{n:"约翰·卡乔波",why:"两边指向同一个空：卡乔波量的是孤独在身体上的读数，老鼠公园量的是那个空会被什么东西填上"}]},
{c:"家庭与关系",n:"埃丝特·佩雷尔",e:"1958-·比利时/纽约·伴侣治疗",w:"没感觉了不等于坏了",y:2006,
d:"做了三十多年伴侣治疗，会说九种语言，接的个案横跨很多文化。她处理的不是「怎么吵架」那一类问题——那一层戈特曼已经讲得很细——而是另一种更难开口的：什么都好，就是没感觉了。她给的解释不归咎于任何一方：亲密要的是靠近、熟悉、可预测，欲望要的是距离、未知、还没完全拿到手的东西，两样都是真需要，方向却相反。所以关系越安稳，第二样越容易被挤没。这不是感情坏了，是把一样东西做到极致就压掉了另一样。",
story:"她最常听到的一句话是「我们什么都好，就是没感觉了」。多数人把它当成感情出了问题，于是坐下来反复谈、反复分析，越谈越沉重。佩雷尔的处方常常反过来：各自去做一件对方不参与的事，重新变回两个人，再回来。距离在她这里不是感情的敌人，是欲望的燃料——彼此的行程精确到小时，反而是很多长期关系里最先失去的那点空气。她也提醒过一个常见的误诊：把「平淡」当成「破裂」来治。破裂有伤口，那要修；平淡没有伤口，只是空了，那要的是补。两个动作方向相反，用错了会越弄越糟。",
f:[{n:"亲密与欲望要的东西相反",d:"亲密要靠近、熟悉、可预测；欲望要距离、未知、还没被完全拿到的东西。两样都是真需要，只是方向相反。关系越安稳，第二样越容易被挤没——这不是谁的错，是结构。",eg:"在一起十年、什么都好、就是没劲——这句话里没有一个字在说感情坏了。"},
{n:"先分清是有伤口，还是空了",d:"有蔑视、翻旧账、当人面贬低，那是伤口，要先停下、先道歉、先安全；一样都没有只是没劲，那是空，要往外走、去添新的。本该添的时候一直在道歉，本该道歉的时候忙着安排旅行，都是这一步没分清。",eg:"从不吵架却越来越沉默，和一吵就翻旧账，是两种病。"},
{n:"空的时候，越努力沟通越糟",d:"每周固定坐下来「聊聊我们」，会把最后一点轻松也谈没——分析本身就是把关系变成一个任务。空需要的是一起经历点新的，不是把它摊开研究。",eg:"为了拿到一个答案而反复问要不要分手，通常说明前一步还没做。"},
{n:"要数的不是时长，是在场",d:"在一起是时长，在场是注意力，两笔完全不同的账。同一张沙发上各刷各的手机，物理上一整晚，在场时间是零。她常问的一个很具体的问题是：上一次你专门看着对方说话、中间没被任何屏幕打断，是什么时候。",eg:"一起过了整个周末，回想却说不出对方那两天在想什么。"}],
q:["==过得越安稳，越容易把另一样挤没——这不是谁的错。==",
"距离在她这里不是感情的敌人，是欲望要烧的那种柴。",
"==边听边回消息，对方记住的不是你说的话，是你在看别处。=="],
apply:"没吵架、没大事，就是没什么感觉了的时候，先别急着谈感情。第一步分清：最近三个月有没有出现过蔑视、翻旧账、当人面贬低。有就是伤口，先处理这个；一样都没有，那是空，处理办法完全相反——各自去做一件对方不参与的事，回来还有得聊。第二步查在场：上一次看着他说话、中间没碰手机是哪一天，想不起来就先补这个，一天十五分钟就够。用反了：拿「制造距离」去合理化冷落对方；或者把它读成必须重新恋爱一次——它讲的是腾位置，不是加大力气。",
l:["约翰·戈特曼","哈佛成人发展研究","萨提亚","阿莉·霍克希尔德"],
contrast:[{n:"约翰·戈特曼",why:"两种关系问题的分工：戈特曼修有伤口的（末日四骑士、修复尝试），佩雷尔补空掉的——她自己说这两个动作方向相反"},
{n:"哈佛成人发展研究",why:"都在说「维持着」不等于「好」：哈佛的数据说高冲突比分开更伤身体，佩雷尔说没冲突也可能已经空了"},
{n:"约翰·卡乔波",why:"同一件事的两个位置：卡乔波讲身边没人的孤独，佩雷尔讲身边有人却还是孤独"}]},
{c:"身心与生活",n:"克里斯蒂娜·马斯拉赫",e:"1946-·加州大学伯克利",w:"倦怠是工作的问题",y:1981,
d:"职业倦怠这个概念能被量出来，主要是她的工作。1981年她做出一套量表，把倦怠拆成三样：情绪耗竭、疏离、成就感下降——只有第一样和「累」重合，所以一个人可以看起来还在正常上班、活儿也交得出来，而后两样早就开始了。她几十年来最坚持也最不受欢迎的一个主张是：倦怠是工作环境的问题，不是个人韧性的问题。市面上的解法几乎全在教人放松，她说那等于让承受者自己去修造成问题的东西，还顺带告诉他：你扛不住是你不够强。",
story:"她和莱特把倦怠的来源拆成六项，讲的是人和工作在哪里对不上：工作量、掌控感、回报、归属、公平、价值。多数人只盯着第一项，而在她的数据里后面几项常常更致命——尤其是说了不算，和做的事跟自己在意的东西相反。同样的工时，六项都对得上的人不容易垮，缺两三项的很快就垮。这也解释了一个常见的错觉：一天只有三件事、但每件都要等三个人点头，比十件事自己拍板更累。",
f:[{n:"三样里只有一样是「累」",d:"情绪耗竭是力气被抽空，睡一觉补不回来；疏离是对同事、客户、家人都提不起劲，说话变得程式化；成就感下降是同样的活干完，以前有一点满足，现在什么都没有。多数人先疏离，再耗竭，最后才是成就感塌掉。",eg:"接电话的语气自己听着都陌生，像在照着稿子说话。"},
{n:"该修的是工作，不是人",d:"当一个人被告知问题出在自己的心态上，他会先增加一层自责，再继续待在原来的环境里——这两样叠起来比单纯的疲惫更难走出来。她没说睡眠运动无效，她说的是次序：先看工作条件能不能改，再谈个人调节。次序一反，个人调节就从辅助变成了掩盖。",eg:"公司发正念课程而不改排班，员工学完回来面对的是同一张表。"},
{n:"失控比量大更伤人",d:"掌控感是六项里最常被低估的。事情不多但每件都要请示、随时可能被推翻，消耗远大于活多但自己能安排——这跟压力研究里的结论一致：可预测和控制感比强度更要紧。",eg:"以为自己需要休假，查完发现真正压垮人的是每件事都要请示。"},
{n:"价值冲突最慢，也最深",d:"做的事跟自己在意的东西相反，不会当天发作，而是一点点把意义掏空——干得越久越空，也越说不出为什么。前五项都补上了，这一项不解决还是会垮。",eg:"每天要说自己不信的话，钱给得再多也补不上那一块。"}],
q:["==三样里只有一样是累，另外两样休息补不回来。==",
"六项对不上的位置不同，该谈的、该换的、该退的完全不同。",
"==别人劝你调整心态之前，先问休一个月回来是不是同一张表。=="],
apply:"觉得快撑不住时，先分清是累还是倦怠：力气抽空、对人提不起劲、做完没有任何满足——只中第一条是累，中了后两条之一就是另一件事。确认之后别急着做个人调节，先查环境：工作量、说了算、回报、归属、公平、价值，这六项里我明确对不上的是哪几项，逐项写一句话。笼统说一句「太累了」推不出任何动作，逐项一查答案通常很具体——要争的是决定权，要谈的是公平，还是要换一件不违背自己的事。用反了：拿它论证只能辞职，六项里有几项是可以谈可以调的；也别用它替代必要的医疗帮助，倦怠和抑郁不是一回事，分不清就去看医生。",
l:["萨波尔斯基","阿莉·霍克希尔德","卡尔·纽波特","契克森米哈赖"],
contrast:[{n:"萨波尔斯基",why:"都在讲长期消耗：萨波尔斯基给的是生理通道（不确定比强度更伤），马斯拉赫给的是工作条件的六个位置"},
{n:"阿莉·霍克希尔德",why:"都在给看不见的消耗记账：霍克希尔德算不进工时表的情感劳动，马斯拉赫算的是六项里哪一项对不上"},
{n:"稻盛和夫",why:"稻盛把「全身心投入」当美德，马斯拉赫会先问：这六项里有几项是对得上的，对不上而硬投入，垮的是人"}]},
{c:"学习与成长",n:"蒲松龄",e:"1640-1715年·山东淄川",w:"主线没成，副业成了",y:1679,
d:"十九岁应童子试，县、府、道三试第一，一时名动乡里。然后他考了一辈子举人，从二十多岁考到六十多岁，一次没中，靠在缙绅家坐馆教书养活一家人，七十一岁才援例补了个岁贡生。这个库里绝大多数人是最终成了的人——连败局也是通往成功路上的败局；蒲松龄不是。他这一生的正事从头到尾没成，而顺手做的那件成了：《聊斋志异》写了四十年、近五百篇，在他眼里是闲书，生前只在朋友间传抄，他没能等到它刊印。",
story:"他的失败没有一个转折点。不是打了一场大的然后重来，是每三年一次、每次都差一点，一直差到老——这中间没有哪一年值得复盘，也看不出该不该停。他做的事是两件同时进行：考照考，坐馆的活照干，故事照收。四十年里，他手上始终有一件正在往前走的东西，只是那件东西在他自己的排序里排在末位。今天记得他的人，几乎没有一个是因为他的八股文。",
f:[{n:"没有转折点的失败，最难处理",d:"打了一场败仗还能复盘、能转向；四十年每次差一点，没有哪一次值得复盘。多数「败了怎么办」的答案都假设有一个转折点可指，这种情况下全都用不上。",eg:"考研考编考了六年、每年差几分，这跟一次创业失败不是一回事。"},
{n:"别让那件没成的事变成唯一在做的事",d:"他既没放弃考，也没把日子全押上去。同时进行的意思是：那件一直不成的事失败时，你手上还有别的是成的。一年下来若只剩「又没考上」一个结论，那不是这一年真的空白。",eg:"主业迟迟不成的时候，最要紧的是别让它变成你唯一的读数。"},
{n:"顺位不是由你排的",d:"一件事在你心里的位置，和它最终能长成什么，是两件不相干的事。前者由当下的标准决定，后者要几十年才见分晓。所以「哪个才是我的主业」这个问题，当时问往往答不准。",eg:"花最多力气的那件常常没结果，随手做的那件反而被人记住。"},
{n:"但副业得到的是真投入，不是随手",d:"《聊斋》不是随便写的——四十年、近五百篇、反复改。它只是在他的排序里靠后，不在他的投入里靠后。而且他没有辞职去写：坐馆给了他饭吃，也给了他四十年不间断的时间。",eg:"「反正是副业」这个念头一旦落到投入上，它就真的只能是副业了。"}],
q:["==这个库里绝大多数人是最终成了的人，他不是。==",
"他至死把那本书当闲书，而今天记得他的全是因为它。",
"==不是辞了工去写的，是在工上写了四十年。=="],
apply:"一件事做了很多年一直没成、也说不出什么时候会成时，先别问要不要坚持，先问这一年除了它，我手上还有哪一件是往前走了的——说不出来，先补这一格。业余那件越做越好、想换过来的时候，先算这三年真投进去多少：投入够了再谈换，不够就先补投入，别先动名分。用反了：拿他论证「坚持就会有回报」，他到死也没考上；反过来读成该放弃也不对，他没放弃，只是没让它成为唯一的事。",
l:["村上春树","凯文·凯利","优秀的绵羊","弗兰克尔"],
contrast:[{n:"村上春树",why:"都在答「没人看还做不做」：村上是主动选的、并且成了；蒲松龄是没得选、而且到死不知道成了——后者更接近多数人的处境"},
{n:"范蠡",why:"两种失败的对照：范蠡是打完一场大的然后功成身退，有明确的转折点；蒲松龄没有转折点，四十年每次差一点"},
{n:"优秀的绵羊",why:"都在讲外部标准：绵羊说的是从小按分数活的人没了分数会茫然，蒲松龄是分数考了一辈子也没拿到，却在别处长出了东西"}]},
{c:"学习与成长",n:"卡斯帕罗夫",e:"1963年- ·苏联巴库",w:"输给机器之后",y:1997,
d:"国际象棋世界冠军，1985 到 2000 年在位十五年。1996 年在费城赢了 IBM 的深蓝，1997 年 5 月纽约六局重赛以 2.5:3.5 输掉——那是人类冠军第一次在正式比赛中败给机器。这个库里多数人处理的是人与人之间的事，他处理的是另一件：一门练了一辈子的手艺，被一台机器在它最核心的那一项上超过之后，人还剩什么。他给出的答案不是加练，是改比赛规则。",
story:"输掉之后他在发布会上指责 IBM 有人工干预、要求重赛，IBM 拒绝，并且把深蓝拆了——他连一个可以再打一次的对手都没有。但同一段时间里他做了另一件事：1998 年在西班牙莱昂办了一场新规则的比赛，双方各带一台电脑上场，随时可以查、可以算。他管这叫 Advanced Chess。理由很直接：计算这一项已经比不过了，那就别再比谁算得快。",
f:[{n:"先划掉已经输掉的那一项",d:"机器在计算深度上赢的那天，「谁算得远」这条赛道就关了。继续在关掉的赛道上加练，练多少都没有出口。第一步不是更努力，是把它从自己的价值清单上划掉。",eg:"查资料的速度、把话写通顺的速度，都已经不是可以拿来比的东西。"},
{n:"改规则，而不是改努力",d:"他没转行也没加练，他改的是比赛允许什么。一项能力被工具追平之后，值钱的位置会挪到「怎么用这个工具」上，而这个位置需要有人先把它定义出来。",eg:"不是「我要比它写得快」，是「我来定这篇该怎么写、哪一段该谁写」。"},
{n:"申辩和下一步抢的是同一段时间",d:"证明「那一场不算」要花的力气，和琢磨「接下来练什么」要花的力气出自同一个人。前者哪怕赢了也换不来新本事，而把你替掉的那一方不需要你的承认。",eg:"花半年证明是工具用错了，那半年就没有用来练怎么用对。"}],
q:["机器赢的那一项，从此不必再比。",
"被替掉的人最容易做的事，是证明那一场不算。",
"工具变强的时候，值钱的位置会挪，不会消失。"],
apply:"你这行某一项核心手艺被工具追平时，先别加练，先问：哪一项已经明确比不过了？把它划掉之后我手上还剩什么是它替不了的？发现自己最近老在说「它其实不行」的时候，数一数这个月讲了几次，同一段时间里练了什么新的——申辩和练新的抢的是同一段时间。用反了：读成「练不过就别练」，他没停止下棋，停的是在计算上争高下；也别把「改规则」当成谁都能做，先得在原来那行做到看得懂规则。",
l:["纳瓦尔","凯文·凯利","费曼","塔勒布"],
contrast:[{n:"李小龙",why:"都在答「旧的一套不管用了怎么办」：李小龙讲的是别被固定招式锁死，卡斯帕罗夫讲的是那一项已经输给机器、该整个换赛道"},
{n:"创新者的窘境",why:"一个从行业看、一个从个人看同一件事：窘境说的是好公司为什么会被新东西掀翻，卡斯帕罗夫说的是被掀翻的那个人接下来怎么办"}]},
{c:"世界如何运转",n:"诺伯特·维纳",e:"1894-1964年·美国",w:"技术还没落地就去提醒人",y:1948,
d:"控制论的提出者，1948 年《控制论》出版，1950 年《人有人的用处》。他的位置在这个库里比较特殊：他既是把机器控制这套东西推出来的人，也是最早公开说它会大规模顶替流水线工人的人。1949 年他写信给美国汽车工人联合会的领袖鲁瑟，说自己不愿意这件事在毫无准备的情况下发生，希望工会先介入、一起想办法。那一年自动化还没大规模上线，工人还没失业。",
story:"《控制论》给「控制」下的定义不是发出指令，而是拿实际结果去修正下一步动作——这就是反馈回路。他举的例子是人伸手拿杯子：眼睛不断把手和杯子的差距报回来，手边走边改；切断这条回报，动作立刻失准，不管一开始瞄得多准。他说机器和生物在这一点上服从同一套东西。这个定义后来被用在管理、教育、练习上：交代得再清楚，没有一条把结果送回来的通道，你手上就只有意图没有控制。",
f:[{n:"看得见趋势的人通常还没被压到",d:"他写信那年自动化还没上线，正因为还没压到，他才有时间做安排。等压到的时候人只剩反应，没有布置的余地。还有活干的这段时间，是唯一能主动安排的窗口。",eg:"还没被裁的这几个月，是能主动布置的窗口，不是等消息的时间。"},
{n:"「它能做」推不出「该给它做」",d:"机器能力和人的用处是两个独立问题。把所有它能做的都交出去，剩给自己的往往是它做不了但也没长进的碎活。该交出去的是重复的部分，不是需要拿主意的部分。",eg:"让它写初稿可以，让它替你决定这篇要说什么就交错了。"},
{n:"没有回报的指令不构成控制",d:"走样多半不是执行的人不听话，是回路断了，谁都不知道偏了多少。回路的价值不在有没有，在隔多久报一次——一周一次和一天一次，能纠的偏差差一个量级。",eg:"月底才知道这个月做偏了，那一个月已经花掉了。"}],
q:["他不担心机器像人，担心人被安排成机器。",
"发明它的人，也可以是最早去提醒的人。",
"意图不等于控制，中间差一条把结果送回来的通道。"],
apply:"一项技术正在你这行铺开、还没影响到你饭碗的时候，别等看清了再说——先问它已经能替掉我手上哪一件活，这件事我跟同行里的谁聊过。往工具那边挪活的时候，先分清交出去的是重复的部分还是要拿主意的部分：交完之后手上剩的活如果还是不用判断的，就交错了。交代的事总走样、或者练一门手艺没长进的时候，先看实际结果多久回到你这里一次。用反了：拿他当「技术会毁掉一切」的证词，他自己就是推动者；也别读成要盯得更细，他讲的是缩短回报周期，不是提高干预频率。",
l:["卡斯帕罗夫","系统之美","彼得·德鲁克","艾利克森"],
contrast:[{n:"卡斯帕罗夫",why:"同一件事的两头：维纳是技术还没落地时就去提醒会被冲掉的人，卡斯帕罗夫是已经被超过之后怎么重新安排自己"},
{n:"系统之美",why:"都在讲回路：系统之美从结构看行为为什么反复，维纳给出的是最小单位——拿结果修正下一步这一条通道"}]},
{c:"学习与成长",n:"最后一版",e:"1978年·纽约",w:"一门手艺整体消失",y:1978,
d:"1978 年 7 月 1 日，纽约时报最后一次用铅字热排出版，同一天照相排版接手。这门手艺从学徒到出师要好几年，铸排机的键盘和打字机完全不同，练出来的是一套只在这里管用的本事——第二天，那套本事在报社里没有位置了。有一部纪录片拍下了那一夜，片名叫《Farewell, Etaoin Shrdlu》：etaoin shrdlu 是铸排机键盘头两列的字母顺序，排字工手滑时会打出这一串，成了这门手艺的暗号。收它不是为了怀旧，是因为它是「手艺被技术整体抹掉」这件事发生过的样本，不是比喻。",
story:"排字工里最受尊敬的是手最快的那批：一分钟能排多少行，是这门手艺公开的计分板。照相排版一上，这块计分板整块作废——机器排得比谁都快，而且不累。于是出现了一个反常识的现象：最熟练的人受冲击最大，因为他们的全部身价压在被替掉的那一项上；反倒是本来不算最快、但懂版面怎么读、懂哪行不能断开的人，换个工具照样干。行业不是不再需要人，是需要的人变了：从「排得又快又准」变成「知道这一版为什么这么排」。",
f:[{n:"替代不是慢慢变少，是一天换掉",d:"设备一旦装好、流程一旦切换，旧岗位是整批停用而不是逐年缩减。指望有几年缓冲期慢慢调整的人，通常等不到那个缓冲期。",eg:"不是订单一年比一年少，是某个月起整条线换了做法。"},
{n:"最熟练的人受冲击最大",d:"你在哪一项上争第一，通常是行业早就定好的。那块计分板作废时，排名靠前的人损失最大——他把全部筹码押在了一个会被整块拿走的位置上。而过去每一年，继续加练它都是最划算的选择。",eg:"最快、最准、最熟这类指标，正好是工具最先追平的那几项。"},
{n:"能说清为什么的人换工具不掉价",d:"同一件活里，怎么做属于工具，为什么这么做属于判断。前者随工具作废，后者跟着人走。老手身上最值钱的常常是说不出口的那部分，而工具追平的正是能被说清的那一半。",eg:"「这样不好看」得能拆成三条具体理由，才带得走。"}],
q:["熟练在某个时刻会变成负债。",
"需要的人没有变少，是换了一批。",
"旧活还养得起你的时候试新的，比断了之后再学便宜。"],
apply:"你这行有新做法正在铺开、而你的本事大半围绕旧工具练出来的时候，先问：我最拿手的那几项，哪些离开这套工具还成立，哪些一换就归零。在行业公开的计分板上排得靠前的时候，数一数那块板上有哪一项工具已经比你强了，除了这块板你还有什么。想知道自己属于哪一批，就问这活里哪一部分你讲得清为什么这么做——讲不清的那部分，这个月能不能拆出三条具体理由。用反了：读成「别练到最好」或者「专精没用」，他们靠这门手艺养了几代人；分界不在精不精，在于本事离具体设备有多远。",
l:["卡斯帕罗夫","诺伯特·维纳","费曼","纳瓦尔"],
contrast:[{n:"卡斯帕罗夫",why:"一个是个人被超过之后怎么改赛道，一个是整门手艺被抹掉时那批人身上发生了什么——后者没有改规则的余地"},
{n:"创新者的窘境",why:"都在讲被新技术掀翻：窘境站在公司一侧解释决策为什么合理，最后一版站在工人一侧记录那一夜之后的事"}]},
{c:"心智与情绪",n:"司马迁",e:"前145-约前86年·夏阳",w:"受辱之后把书写完",y:-99,
d:"太史令，《史记》的作者。天汉二年李陵兵败投降，他替李陵说了几句话，触怒武帝下狱，第二年受腐刑。按当时士人的规矩，受这种刑体面的做法是自杀，他没有。多年后给狱中的任安写信，把这件事说透了：不是不知道该死，是书没写完。《史记》这部书早在库里，收他本人是因为他自己那件事——真受过辱、真没说出口、真活下来把一件事做完——正是「说不出口」这一类处境最缺的样本。",
story:"《报任安书》里有一段几乎是名单：文王拘而演周易，仲尼厄而作春秋，屈原放逐乃赋离骚，左丘失明厥有国语，孙子膑脚兵法修列——一口气七八个人，共同点不是有才，是都在最坏的时候写出了传世的东西。他把自己排在名单末尾。同一封信里他写那种耻辱「每念斯耻，汗未尝不发背沾衣」，一直在。他是带着这个写完《史记》的，不是先治好了再写。这两件事同时成立：耻辱没有退场，书写完了。",
f:[{n:"把关于脸面的问题换成关于事的问题",d:"「我还有脸活吗」没有答案，越想越沉；「我手上哪件事没交」有答案，而且指向动作。他在信里做的就是这一步换题，羞耻从决定生死的位置上被挪开了。",eg:"出了大丑之后，别问自己还配不配，先问手上哪件事还没交。"},
{n:"先给自己找一排先例",d:"觉得只有自己这么惨的时候，什么道理都听不进去。他做的是列一张名单：处境相似、后来做成了事的人。名单本身就是解药，比道理管用。",eg:"觉得自己是唯一一个这么倒霉的，先去找三个比你更倒霉却做成了事的人。"},
{n:"活下去需要一件只有你能做完的事",d:"史料在他手里，父亲的笔记在他手里，换任何人都做不出这一部。这种不可替代不是自恋是事实，正是它让「我死了这件事就没了」成立。从别人手里接过来的责任，在自己不想活的时候仍然成立。",eg:"找那件你不做就没人能接的事，它比你替得掉的任何工作更能撑住你。"}],
q:["耻是真的，事也是真的，他选了让事说话。",
"最坏的日子里写出来的东西，反而最能留下来。",
"活下去这件事，有时候需要一笔欠着的账。"],
apply:"做了没脸的事、或者被人当众羞辱之后，先别问自己还配不配，问手上有没有一件没做完、只有你能做完的事。找不到撑下去的理由时，问有没有谁把什么托付给了你——从别人手里接过来的责任，比自己想出来的意义稳。正处在被打压、被边缘的日子里，先去找三个处境比你糟、后来却做成了事的人，一张名单比一堆道理管用。用反了：把它读成「忍辱负重是对的」，他忍的前提是书没写完，不是为了忍而忍；也别以为羞耻能被想通，他到死都「汗未尝不发背」，只是没让它决定生死。",
l:["史记","苏轼","弗兰克尔","布琳·布朗"],
contrast:[{n:"布琳·布朗",why:"都在讲羞耻：布朗是研究者，讲羞耻怎么长、怎么拆；司马迁是当事人，讲带着它怎么把事做完——前者给机制，后者给样本"},
{n:"蒲松龄",why:"两种「一直没成」：蒲松龄是四十年每次差一点、没有转折点；司马迁是一次重创之后从头活，转折点清清楚楚"}]},
{c:"身心与生活",n:"史铁生",e:"1951-2010年·北京",w:"职业是生病，业余在写作",y:1991,
d:"作家。二十一岁双腿瘫痪，之后十五年几乎每天摇着轮椅去家附近的地坛公园坐着，《我与地坛》写的就是那段。四十七岁起患尿毒症，每周三次透析，直到五十九岁去世，《病隙碎笔》是在透析间隙写的。收他是因为「身心与生活」这个领域里原来九条全是研究者——瑞迪、萨波尔斯基、马斯拉赫——没有一个自己病过、自己垮过的人。他是那个人，而且把这件事从里面写了三十年。",
story:"他在地坛里想的是三件事：要不要死，为什么活，干嘛要写作。想了很多年，第一件想明白的是「一个人，出生了，这就不再是一个可以辩论的问题」——人不是自己选的，那就不该由自己判定该不该有。这道题收掉之后，剩下两道才有地方想。后来他说出了那句话：「死是一件不必急于求成的事，死是一个必然会降临的节日」。既然一定来，就不必自己去赶；剩下的就是怎样活的问题了。",
f:[{n:"有些问题不是想通的，是收掉的",d:"「为什么偏偏是我」没有答案也不需要答案，它只是一个事实。他花了几年才承认：这道题不是解出来的，是从待办清单上划掉的。划掉之后，力气才能往有答案的问题上去。",eg:"别再问「为什么是我」，问「既然是我了，今天怎么办」。"},
{n:"把病放在主位，剩下的时间才能用",d:"透析每周三次、每次四个多小时。不承认病是主业的人每天跟病抢时间，抢不过，剩下的时间也在懊恼里过掉。他反过来：先把病要的时间全给它，剩下的才算自己的，一分钟都不浪费在生气上。",eg:"先把治疗、休息的时间钉死，剩下的才算「我的时间」，别倒过来算。"},
{n:"一个每天都回去的地方",d:"地坛他一坐十五年，强调的是「每天」。人垮掉的时候需要一个不会变的坐标，它不解决任何事，但它每天都在，这就够了。振作得太早的人，情绪没过完，后面还得再倒一次。",eg:"刚出事那阵子，找个固定的地方待着，比立刻规划下一步更要紧。"}],
q:["他没有和命运和解，只是不再跟「为什么是我」较劲。",
"地坛不解决任何事，可它每天都在。",
"把死放回它该在的位置，日子才腾得出地方。"],
apply:"出了一件改不了的事——病、残、失去——满脑子都是「为什么偏偏是我」的时候，先问这道题是不是该划掉而不是该解开，再找一个每天都能回去待一会儿的地方。查出要长期带着的病、或者长期垮着，别再为「做不成原来那么多事」难受，先把病要的时间排第一，看剩下几个钟头能做的最小一件事是什么。夜里想到死就睁眼，先找一个白天清醒的时候把它从头到尾想一遍，想到底了它就不会半夜反复冒出来。用反了：读成「接受命运」，他没接受，他跟疾病较劲了三十八年；也别读成「病了就该躺平」，他透析十二年写了几本书。",
l:["凯博文","弗兰克尔","苏轼","蒙田"],
contrast:[{n:"凯博文",why:"一个是医生写病人，一个是病人写自己：凯博文讲医生看到的病和病人过的日子是两件事，史铁生就是那个过日子的人"},
{n:"弗兰克尔",why:"都在回答「处境压到毫无选择时靠什么」：弗兰克尔的答案是意义，史铁生的答案更小——一个每天都去的地方、一段病的缝隙"}]},
{c:"谋略与竞争",n:"易经",e:"西周至战国·中国",w:"什么时候该动，什么时候该等",y:-800,
d:"六十四卦，每卦六爻，讲的其实是同一件事：一个人在不同位置上该怎么做。乾卦最下面一格是「潜龙勿用」，最上面一格是「亢龙有悔」；泰卦和否卦紧挨着排；《系辞》把规律总结成「穷则变，变则通，通则久」。收它是因为「进退取舍」那一组二十一个问题，原来靠荀子、诸葛亮、冯道零散地拼，库里一直缺一部专讲进退的典籍。",
story:"乾卦从下往上是一条龙从潜到飞再到亢的过程。初九潜龙勿用——龙在水底，别动，不是没本事，是位置还在最下面；九三终日乾乾、夕惕若厉——整天干，晚上还得警醒；九五飞龙在天，看着是顶点了。可上面还有一格，上九亢龙有悔。《文言传》解释这个「亢」：知进而不知退，知存而不知亡，知得而不知丧——一路只学了进、存、得，从没练过退、亡、丧那一半。到了最高处，缺的那一半就是掉下来的原因。",
f:[{n:"有本事和该出手，是两个时间点",d:"初九和九五都是龙，差的不是能力是位置。刚到一个新位置就急着证明自己，用的是自己的力，扛的是全部的险。急，多半是把能力和时机混成了一件事。判断自己在第几格，比知道所有格的做法更要紧。",eg:"新到一个团队，头一个月先别改东西——不是不该改，是这时候改代价最大。"},
{n:"顶点的上面还有一格",d:"多数人以为九五就是终点，其实卦还没完。盛极的问题不是盛，是不知道已经到顶了还在加。「亢龙有悔」写给还在飞的人看：你现在的位置，往上一格就是它。",eg:"顺风顺水的时候读这句，比摔了之后读有用。"},
{n:"泰的下一卦就是否",d:"泰卦最上一爻已经写着「城复于隍」——城墙倒回沟里。翻转不是在坏日子开始的，是在好日子的最后一格就开始了。反过来，否卦到顶是「先否后喜」。每一种状态都自带它的尽头，「现在」不是常态，是某一卦的某一格。",eg:"生意最好那年就该想它是怎么坏的，等坏了再想已经在否卦里了。"}],
q:["六爻讲的是同一条龙在不同位置该做的事。",
"最高那格不叫最好，叫有悔。",
"泰的旁边就是否，哪一卦都不长久。"],
apply:"刚接手一个位置想尽快证明自己的时候，先问自己在这件事的第几格——最下面那格该攒的东西攒够了没有。连着顺了很久、站在从没到过的高处想再加一把时，问自己是九五还是已经到了上九，这些年练过退和丧没有，还是只练了进和得。一切顺利时问「城复于隍」那格还有多远；卡死了则问有没有把它当成「穷则变」的入场券。用反了：把它读成宿命论，「反正会翻做什么都没用」——《系辞》说的是穷则变，变是要人去做的动作；也别读成「刚来就该躲着不干」，初九是勿用不是勿动。",
l:["孙子兵法","道德经","范蠡","智慧书"],
contrast:[{n:"道德经",why:"都讲盛极而衰：道德经的「反者道之动」是总规律，易经把它拆成六格，告诉你在哪一格该做什么"},
{n:"智慧书",why:"格拉西安说「在运气正盛时退场」，易经说的是退场之前还有一格叫有悔——一个给结论，一个给刻度"}]},
{c:"心智与情绪",n:"蒙田",e:"1533-1592年·法国波尔多",w:"把自己的短处先写出来",y:1580,
d:"法国作家，《随笔集》的作者。三十八岁辞掉法官职位，退回自家城堡，把一座塔楼改成书房，之后二十年在那里写作，中间还当了两任波尔多市长。他给自己铸过一枚徽章，刻着「我知道什么？」。整本《随笔集》写的都是他自己：怕疼、记性差、优柔寡断、坠马濱死、肾结石。收他是因为「说不出口」那一组——怕死、怕被看穿、想太多——原来全靳布琳·布朗一人在答；蒙田是四百年前把这些事写成书的人，而且写的是自己。",
story:"他有一章直接叫《哲学就是学习死亡》，办法反着来：别躲，天天想它，想到它不再陌生。他不是空谈。三十多岁那年骑马被人从背后撞飞，昏迷很久，周围人以为他死了。醒来后他把整个过程写下来：那一段其实很轻，像睡着，没有他一直想象的恐怖。他由此下了结论：真正折磨人的不是死，是对死的想象。他还说过，我最怕的就是怕本身。",
f:[{n:"先亮的底牌，没人能拿它打你",d:"怕被看穿的人，怕的是短处被别人先说出来。他反过来：自己先说，说得比别人能说的还全。一件事已经摆在桌上了，就不再是别人手里的牌。四百年后这本书还在被读，恰恰因为它把作者的短处摆在最前面。",eg:"「这块我不熟」自己先讲出来，比等人问到时支吾强得多。"},
{n:"怕的多半是想象，不是那件事",d:"他亲身经历了一次几乎死掉，发现真到那一刻反而平静，之前几十年怕的是自己脑子里造出来的版本。先分清怕的是事，还是怕的是自己对事的想象。陌生的东西才可怕，熟了就只是一件事。",eg:"半夜冒出来的那种怕，多半是脑子里自己拍的一部片子，不是那件事本身。"},
{n:"不是退出，是划一块地方",d:"他没有彻底隐居，后来还当了市长。他做的是把一个空间和一段时间钉死为自己的，其余照常，还把决定刻在书房墙上。全退是逃，全不退是被吃掉，中间才站得住。",eg:"每天有一段时间、一个地方是别人碰不到的，其余照常，这比彻底换生活容易得多。"}],
q:["他先把自己的怯懦写进书里，四百年没人能拿它打他。",
"他把死当熟人，天天见。",
"留一块别人碰不到的地方，其余照常。"],
apply:"坐在一个位置上心里发虚、怕被人发现其实没那么行的时候，先问最怕被发现的那三个短处有没有一个是自己先讲出来过的。夜里想到死就睡不着，先问怕的是那件事还是脑子里的版本，有没有在白天清醒的时候把它从头到尾想过一遍。日程被别人的事占满，问能不能划出一块只属于自己的地方和时间，其余不动，并且把它写在看得见的地方。用反了：读成「想开就不怕了」，他到老还是怕，只是不再被怕支配；读成「辞职归隐」，他退进塔楼之后还当了两任市长。",
l:["塞涅卡","马可·奥勒留","布琳·布朗","史铁生"],
contrast:[{n:"布琳·布朗",why:"都在拆羞耻和恐惧：布朗给的是实验室的机制，蒙田给的是一个人四百年前拿自己做的实验"},
{n:"塞涅卡",why:"都讲学习死亡：塞涅卡是从上往下的劳告，蒙田是从自己坠马那次往外写，一个教，一个记"}]},
{c:"身心与生活",n:"陶渊明",e:"365-427年·浔阳",w:"辞官八十天，穷一辈子",y:405,
d:"诗人。四十一岁当彭泽县令，干了八十多天，郡里派督邮下来要他穿戴整齐去迎，他说「吾不能为五斗米折腰向乡里小人」，当天解印走了，之后再没出来做官。辞官后是真穷：四十四岁家里失火房子烧光，有一年断了粮出门去讨，回来写了一首《乞食》。收他是因为「人生转弯」那一组苏轼一人答了十个——库里缺一个转了弯之后穷了一辈子、也没回头的人。",
story:"走之前他写了《归去来兮辞》，里面有一句「悟已往之不谅，知来者之可追。实迷途其未远，觉今是而昨非」——走过的路错了，好在没走远。他强调的不是决心，是距离。后来在《归园田居》里他这样说自己：「少无适俗韵，性本爱丘山。误落尘网中，一去三十年」。注意他的说法，不是「我一直想种地」，是「我一直不适合那个」。他清楚的是不要什么，从「不要」出发，走到了一个能过下去的地方。",
f:[{n:"转向要趁没走远",d:"「迷途其未远」——走错了但回得来。转向的代价随时间涨，八十天回头和八年回头不是一个价。等「更合适的时机」，往往等到的是更贵的价。压垮他的不是大是大非，是一件小事把「我到底在干什么」摆到了眼前。",eg:"刚发现不对的时候转，代价最低；干满一任再转，已经欠了一任的账。"},
{n:"选了的路，路上的代价原样接住",d:"他没把穷写成受害也没写成清高，就是记账：饿了，去讨，说不出话。选了一条路，代价不往别人身上推，也不往自己身上贴金。穷是真的，没回头也是真的——两件事同时成立，说明转向不是冲动，是算过价的。",eg:"转错的判据是「我想回去吗」，不是「我过得苦吗」。"},
{n:"「想要什么」答不出，「不要什么」答得出",d:"多数人被「你到底想要什么」卡死，因为它要求一个正面答案。他的路径是反的：先把明确不要的划掉，剩下的范围小了，答案自己就出来了。他给自己定的新方向也很小——守拙，守住笨。",eg:"列不出想要的，先列三件绝对不要的，剩下的路一下子就少了。"}],
q:["走的那天他四十一岁，之后二十多年没回头。",
"认了那条路的价，就不必怨。",
"先划掉不要的，路自己就窄下来了。"],
apply:"现在做得还行但心里清楚不是你要的、想转又想等个好时机的时候，先问离「走远」还有多远，让你想走的那件小事说明了什么。换了自己要的路之后手头紧、开始怀疑选错了，问难受的是「日子苦」还是「想回去」。说不出想要什么，先列三件绝对不要的，再把下一步定得小到一定做得到。用反了：读成「一不顺就走」，他辞的是当官这条路而不是某件不顺的事；读成「安贫乐道」，他写的是「叩门拙言辞」，苦是真苦。",
l:["苏轼","蒲松龄","杜甫","弗兰克尔"],
contrast:[{n:"苏轼",why:"两种离开官场：苏轼是被贬、一路被动，陶渊明是自己走的、当天走的——前者讲怎么在被安排里过好，后者讲怎么自己做那个决定"},
{n:"蒲松龄",why:"都穷了一辈子：蒲松龄是一直在考、一直没成，陶渊明是主动不考了——一个没得选，一个选了"}]},
{c:"家庭与关系",n:"C.S.刘易斯",e:"1898-1963年·英国牛津",w:"妻子死后几个月的日记",y:1961,
d:"作家，牛津和剑桥的教授，写过《纳尼亚传奇》和大量劝人信仰的书。五十八岁结婚，妻子乔伊四年后因癌症去世。之后几个月他在四本练习簿上记自己的状态，后来用笔名出版，就是《卿卿如晤》。收他是因为「重要的人走了」那六个问题，原来靠弗兰克尔和苏轼在答——一个是集中营的幸存者，一个是被贬的官员，都不是丧亲的当事人。他是，而且没把日记整理成道理，留的就是当时的样子。",
story:"第一句是：「没人告诉过我，悲伤感觉这么像恐惧」——不是像难过，是像怕，胃里翻腾，坐不住。他还记下另一件没人提前说过的事：悲伤让人懒，连刮胡子都嫌麻烦。再往后他发现更可怕的一件：越用力回忆妻子，脑子里的那个人就越走样，变成一个更温顺、更符合他想象的版本。有一天他不再刻意去想，她反而清清楚楚地回来了，带着原来的样子。抓得越紧，走样越快；松开手，真的才回来。",
f:[{n:"先认出它是什么",d:"他一直以为悲伤是「难过」，是情绪；结果发现它更像恐惧，是身体的。认错了名字就用错了办法——对付难过靳想通，对付恐惧靳让身体安静下来。什么都不想干也是它的一部分，不必在悲伤之上再加一条懒的罪名。",eg:"如果是胃在翻、坐不住，那是怕不是伤心，先让身体安静下来，别急着想通。"},
{n:"没被检验过的相信，不知道算不算相信",d:"他讲了几十年的道理在自己身上不管用了。这不说明道理错，说明它从没被压过。塌了先别急着重建，急着重建的人往往拿同样的纸再糊一座；等一等，看哪些是塌了以后还站着的。",eg:"撑你的那套说法失效了，先别急着换一套，看看剩下什么还站着。"},
{n:"刻意记住的，会变成你想要的版本",d:"记忆不是录像，每次回放都在重写。用力回忆一个人，就是在按自己的需要重写他。他特别珍惜妻子那些不讨人喜欢的地方——直率、爱争、不客气——因为那些是他造不出来的。",eg:"记住他让你烦的那几点，那些比他的好更像他。"}],
q:["悲伤先到的是胃，不是心。",
"撑了一辈子的东西，第一次承重才知道是不是真的。",
"他没有失去她，他是第一次知道自己有多少。"],
apply:"刚失去一个很重要的人、日子完全接不上的时候，先问身上的感觉更像难过还是更像怕，有没有把「什么都不想干」也算成自己的错，今天能不能写三行当天的样子。一直撑着你的那套想法这回不管用了，问它以前有没有真正承过重，塌了以后还有什么站着，能不能把「被夺走」改说成「被检验」。怕时间久了把他忘了、每天刻意回忆，问现在记住的那个人有没有比真人更温和、更完美。用反了：读成「悲伤有标准阶段」，他后来说悲伤不是过程是一段路，每次转弯都以为到头了；读成「信的东西都是假的」，他最后没放弃，只是换了一座不是纸糊的。",
l:["弗兰克尔","苏轼","约翰·戈特曼","史铁生"],
contrast:[{n:"弗兰克尔",why:"都写失去之后：弗兰克尔写的是集中营里找意义，刘易斯写的是失去一个人之后连意义都先塌了——前者给出路，后者先给现场"},
{n:"约翰·戈特曼",why:"一个研究关系怎么维持，一个记录关系结束之后的人：戈特曼看的是五比一的互动，刘易斯看的是五比一没了之后胃里的翻腾"}]},
{c:"创业与产品",n:"大野耐一",e:"1912-1990年·日本丰田",w:"问五次为什么",y:1978,
d:"丰田生产方式的主要建立者。他在车间里做出来的几件事后来成了整个制造业的常识：问五次为什么、任何工人都可以拉绳停线、把库存压低让问题露出来。收他是因为「把事做成」和「带人」两组里，错反复犯、交上来走样、成本降不动这几个问题，原来答的多是道理；他是把这几件事一条条做出来的人，每一条都能直接变成动作。也补上日本——库里只有四条。",
story:"书里有个例子。机器停了。为什么停？保险丝烧了。为什么烧？轴承没润滑。为什么没润滑？润滑泵抽不上油。为什么抽不上？泵轴磨损了。为什么磨损？没装滤网，铁屑进去了。问到第五个才到该修的地方：装滤网。只问一次的话修的是保险丝，下周再烧。另一件事来自丰田最早的织布机：线一断机器自己停，不会带着断线织出一匹废布。他把这个搬到汽车线上，每个工位一根拉绳，任何人发现问题都可以拉，整条线停，问题在发生的那一秒就露出来。",
f:[{n:"第一个原因几乎从来不是原因",d:"保险丝烧了是事实不是原因，它只是链条上最先露出来的那一环。多数复盘停在这一层，因为它最容易看见也最容易改。追到根上的修法往往是最小的动作——滤网比泵便宜、比停机便宜。",eg:"「这次是他没仔细」——这是保险丝，往下问：他为什么没仔细，什么让他没法仔细。"},
{n:"停线的权力要给到最下面的人",d:"最先看见问题的是线上的人，不是经理。如果只有经理能停，问题要先往上报、等批准，那时早流过去了。一个错在第一道工序被拦住是一分钟，流到最后是整件报废。",eg:"让直接干活的人有权说「等一下，这不对」，比你事后检查有用十倍。"},
{n:"库存像水，问题像水底的石头",d:"水位高的时候船开得顺，因为石头全在水下——机器不稳、供货不准，全被库存兜住了。把水位降下去石头才露出来，撞一块修一块。每一处宽裕都在替某个问题兜底，问题被兜住了就不会被修。",eg:"哪个环节总留余量，那个环节底下就有一个没人修的问题。"}],
q:["修保险丝的人下周还得修。",
"让最先看见的人有权喊停。",
"水位高的时候，石头都在水下。"],
apply:"同一类问题反复出现、复盘也写了、下次照样的时候，问上次改的是保险丝还是滤网，从「出事」往下问到了第几层，最后那层对应的改动是不是很小。布置的事交上来总走样，问从布置到交付中间有几个能喊停的点，干活的人发现不对时敢不敢、能不能停。该降的成本都降了不知道还能从哪下手，问哪几个环节总留着余量，拿掉一处会露出什么问题，准备好修它了吗。用反了：把「五个为什么」变成问「谁的责任」，他问的是链条不是人；把「压库存」学成一次砍光，那是撞船不是通河道。",
l:["彼得·德鲁克","系统之美","稻盛和夫","松下幸之助"],
contrast:[{n:"系统之美",why:"都讲结构决定行为：系统之美从理论上说杠杆点在哪，大野耐一在车间里给出了找杠杆点的具体动作——多问四次为什么"},
{n:"彼得·德鲁克",why:"德鲁克管的是选哪件事、大野耐一管的是每一道工序怎么不出错——一个在桌上定方向，一个在车间里定标准"}]},
{c:"心智与情绪",n:"奥古斯丁",e:"354-430年·北非希波",w:"赐我贞洁，但不是现在",y:400,
d:"基督教思想家，《忏悔录》的作者。这本书是他四十多岁回头写自己的前半生：十六岁偷梨、年轻时的放纵、想改改不动、三十二岁在一个花园里的下午终于改了过来。收他是因为「知道做不到」「拖着不开始」「想戒又戒不掉」这几组问题，原来答的是原子习惯、福格、老鼠公园——都是方法；他是一千六百年前把这件事从里面写出来的人：他知道该做什么，他真的做不到，他把做不到的那个机制拆开了。",
story:"他回忆年轻时的一句祷告：「赐我贞洁与节制——但不是现在」。他说自己当时真的想要那样的生活，也真的害怕祈祷立刻应验，因为那意味着今天就得放弃眼前这些。拖延不是不想要，是把「要」和「今天」拆开了。后来他在花园里想改改不动，急得撕头发，发现一件怪事：心命令手抬起来，手立刻抬起来；心命令心自己去做一件事，心却不动。他的结论是：不是意志太弱，是意志有两个——一个要，一个不要，两个都是他自己。",
f:[{n:"「想要」是真的，「不是现在」也是真的",d:"拖延的人常被说成不够想要。他说不对，想要那一半本来就够；要动的是「不是现在」那一半——它每天都成立，是一个可以无限续期的许可，不会自己到期。拖着的人怕的常常不是做不成，是做成了之后眼前这份舒服就没了。",eg:"「等这阵忙完」这句话你说了几次了？它不会自己失效，得你去撕。"},
{n:"有些错没有理由，找理由是在原地打转",d:"十六岁那年他和一群同伴偷邻家的梨，家里不缺，偷来的扔给了猪。几十年后他追问为什么，最后的答案是：没有动机，只有场合——要是一个人绝不会去。承认「没有理由」反而是出口；看那天旁边是谁，比拷问自己是什么人更准。",eg:"「我为什么会那样」问了很多遍没答案，那就把这道题划掉，它可能真没答案。"},
{n:"不是意志不够，是意志分裂",d:"「道理都懂就是不动」的人通常被劝要更有决心。可决心本来就在，只是同时还有一个反方向的决心。再加决心是往一边加，另一边也在，还是僵住。解开的方式不是更用力，是找那件能让「想」和「不想」不再对着干的东西。",eg:"「我不想」不是懒，是你的一部分在护着什么，先问它护的是什么。"}],
q:["他把拖延写成了一句祷告。",
"偷来的梨扔给了猪，他要的从来不是梨。",
"心命令手，手就抬；心命令心，心不动。"],
apply:"知道该做、也想做成、就是一直「等一等再开始」的时候，问「不是现在」这三个字这个月说了几次，真开始了会失去哪一样眼下的舒服。做过一件说不出理由的错事、过了很久还觉得自己很糟，问是不是一直在给它找理由，那天旁边是谁，有没有把它完整写过一遍。道理全懂就是动不了、已经下过很多次决心，问那个「不想」的我在护着什么，如果它护的东西能换个方式满足，还会僵吗。用反了：读成「想要就该立刻做」，他也不是当天改过来的；读成「都是别人带坏的」，他说的是「要是一个人我不会去」，责任还在自己。",
l:["原子习惯","BJ·福格","老鼠公园","王阳明"],
contrast:[{n:"王阳明",why:"都在讲知道做不到：王阳明说知而不行只是未知，奥古斯丁说知是真知、行也是真想行，卡住的是两个意志在打架——一个从知识那头解，一个从意志那头拆"},
{n:"原子习惯",why:"原子习惯给的是改系统的方法，奥古斯丁给的是方法用不上时人心里到底在发生什么——先看懂后者，前者才用得上"}]},
{c:"权力与组织",n:"汉娜·阿伦特",e:"1906-1975年·德国→美国",w:"不思考是一种状态",y:1963,
d:"政治思想家。1961 年她去耶路撒冷旁听一场审判，原以为会看到一个恶魔，结果看到的是一个平庸的人：满嘴套话，讲不出一句自己的话，反复说自己只是执行命令。她给这个现象起了个名字，平庸之恶——不是因为坏才做的，是因为根本没想过。她自己的经历是另一条线：1933 年在柏林被捕后流亡，1941 年到纽约，三十五岁，不会英文，从头开始，十年后写出成名作。收她写的是「不思考」这个机制和她自己的重来，不是那段历史的是非。",
story:"她注意到那个人最突出的特征不是愚蠢，是不思考：把判断整个交出去，自己只负责执行。套话是这个状态的症状——有现成的句子可以说，就不必自己想。她后来追问：一个人不做坏事，靳的到底是什么？答案不是好的规则也不是好的教育，那些都可能被换掉；是「停下来想」这个动作本身，在做一件事之前自己跟自己对一遍。这种想不产生知识，产生的是「我做不出这种事」的那道底线。规则可以变，周围人可以全变，这道底线是一个人自己生的，没法外包。",
f:[{n:"「照单子做」本身就是一个选择，而且是最省力的那个",d:"不问为什么不是中立的，它把判断交给了写单子的人。它省力因为不用为结果负责，它危险因为你成了任何单子的执行器。「不想」是可以被训练出来的：每次不问、每次照办，都在加固这个习惯；反过来想也是习惯。",eg:"「上面让我这么做的」这句话说的次数越多，你自己的判断萎缩得越快。"},
{n:"「大家都这么做」不构成理由",d:"这句话之所以危险，是它把判断的责任分散到所有人身上，每个人都只剩一小份。可事是你做的，份额不会因为人多而变小。想不是为了得出结论，是为了跟自己对一遍——我愿意跟做了这件事的自己相处吗。",eg:"「同行都这么干」可以用来解释行情，不能用来替你决定要不要干。"},
{n:"带得走的是方式，不是位置",d:"到纽约时她的学历、圈子、身份全没了，带走的只有怎么想问题。这东西不占行李，不需要证件。她第一件事是去人家里住两个月专门学英语，不是找工作——语言是所有其他事的前提。从零开始的账按十年算，按三年算的人多半在第三年放弃。",eg:"重来之前盘一遍：哪些东西离了原来的位置就没了，哪些跟着我走。"}],
q:["他不是恶魔，他是一个不想的人。",
"别人都这么做，责任不会因此变小。",
"证件会被收走，脑子里那套不会。"],
apply:"你的活基本是照单子做、越来越说不出为什么这么做的时候，问这份活里哪几步你说得出为什么，解释工作时用的是自己的话还是现成的套话。规则是别人定的、觉得自己什么都说了不算，问这些规矩里有没有一条停下来想过就知道自己做不出，上一次动手前跟自己对一遍是什么时候。换了城市或国家一个人都不认识，问身上哪些是位置带来的、哪些是方式带来的，语言这一关过了没有，时间表是三年还是十年。用反了：读成「执行的人都有罪」或拿它审判身边照章办事的人，她讲的是状态不是定性；读成事事质疑，她说的是保住「能停下来想」的能力，不是抗命。",
l:["韩非子","马基雅维利","卡斯帕罗夫","论语"],
contrast:[{n:"韩非子",why:"韩非子讲的是不指望人性善、用制度让人照做；阿伦特讲的是照做本身能走到哪里——一个从设计者看，一个从执行者看"},
{n:"卡斯帕罗夫",why:"都在答「工具替我想了」：卡斯帕罗夫说人的位置在机器分歧的那几步，阿伦特说交出判断这件事本身就是一种状态，不管接手的是人还是机器"}]},
{c:"学习与成长",n:"福泽谕吉",e:"1835-1901年·日本大阪",w:"看见招牌那天重学",y:1872,
d:"日本明治时期的教育家，庆应义塾的创办人。二十岁出头在大阪学荷兰语学得极好，1859 年去刚开港的横滨，看到街上的招牌一个字都不认识——全是英文。他没有回去继续钻荷兰语，第二天开始找英文教材从头学。后来他写《劝学篇》，第一句是「天不在人上造人，不在人下造人」，卖了三百多万册，读者多是刚起步、不知道该学什么的年轻人。收他是因为「刚起步」那一组原来没有一个人自己的起步故事，也补上日本。",
story:"他在自传里写横滨那一刻像被人一棒子打在头上：几年苦学，在这个新开的口岸上派不上用。但他没把那几年当成白费，也没护着它继续学下去，而是把招牌当成一条信息：风向变了。后来他说荷兰语没有白学，学语言的方法是通的，第二门快得多。《劝学篇》里他讲该学什么：不是背诵难懂的古文，是「实学」——写信、记账、打算盘、看地图，天天用得上的那些。他把这些排在四书五经前面，理由很直接：一个人先要能自己养活自己，再谈别的。",
f:[{n:"「用不上」是一条信息，不是一个判决",d:"用不上说明的是方向，不是你的能力。看清方向之后力气该往哪去就很清楚。换赛道要当天不要等，等的每一天都在给旧赛道加码。真正的浪费不是学了过期的东西，是死守着它不换。",eg:"发现学的对不上，先别惋惜那几年，先问它告诉了你什么方向。"},
{n:"先学明天就用得上的",d:"他的排序标准只有一条：用得上的频率。天天用的排最前，一年用一次的排后面。不是说后面的不重要，是刚起步的人力气有限。要不要继续读书，标准不是学历高低，是读的东西能不能落到手上。",eg:"不知道该练什么的时候，列出明天上班就要用到的三样，先练那三样。"},
{n:"把差距的原因放到能改的地方",d:"「天生不如人」这个念头最要命的地方不是它对不对，是它把原因放在了改不了的地方。他把原因搬到「学没学」——这不一定完全对，但它能动。别人显得稳，往往是早几年练过你还没练的东西，把「强弱」翻译成「早晚」，焦虑就少一大半。",eg:"觉得比不过别人时，把原因从「我天生如此」搬到「我哪一块没练」，后者才有下一步。"}],
q:["学错了方向不可怕，守着不换才可怕。",
"先学明天就要用的。",
"差别在学没学，这是唯一能改的地方。"],
apply:"花了几年学的一套东西在现在的地方对不上、一动手就露怯，先问它告诉了你什么方向，学它时练出来的方法有哪些能直接用到新的上。不知道该练什么或纠结要不要接着读书，问明天就要用到的三样是什么，现在学的哪一样能直接落到手上。觉得身边人都比你稳、自己是不是天生不如人，问那几项是他们生下来就会的，还是比你早几年练的。用反了：读成「学过的都该扔」，他的荷兰语功底让英文学得比别人快得多；读成「只学有用的」，他自己读了一辈子书，这是刚起步时的排序不是一辈子的。",
l:["艾利克森","优秀的绵羊","稻盛和夫","卡斯帕罗夫"],
contrast:[{n:"优秀的绵羊",why:"绵羊说的是一路按分数活的人没了分数就茫然，福泽说的是先学明天用得上的、能自己站住——一个诊断病，一个给起步的顺序"},
{n:"李小龙",why:"都讲旧的一套不管用了：李小龙讲别被固定招式锁死，福泽讲的更具体——看见招牌那天就换，方法带走，内容换掉"}]},
{c:"身心与生活",n:"杜甫",e:"712-770年·河南巩县",w:"四十八岁弃官入蜀",y:759,
d:"诗人。三十五岁到长安求官，一待十年，考过、献过赋、四处投诗，没有一个像样的位置，四十四岁才得了个看管兵器库的小官，安史之乱随即爆发。755 年冬他回奉先县家里，小儿子饿死了。759 年辞掉华州的小官带着家人一路往西南走，几乎断粮，760 年到成都靳朋友接济搭了一间草堂。他一生最好的诗多数写在这之后的十年。收他是因为「人生转弯」那一组苏轼一人答了十个，库里缺一个中年之前一直没成、中年之后从头搭起来的人。",
story:"长安十年他在给韦济的诗里这样记自己的日子：「朝扣富儿门，暮随肥马尘。残杯与冷炙，到处潜悲辛」——早上去敲有钱人家的门，晚上跟在人家马后头吃灰。这不是自嘲，是记账，十年没成他一年一年记着。755 年那次回家，他写下「入门闻号咷，幼子饿已卒」，接着是「所愧为人父，无食致夭折」——作为父亲我惭愧，没有饭，孩子死了。没有绕开，也没有解释，就这四句。这首五百字的长诗后面写的是天下人的苦，但先写的是自己家这一件最不想写的。",
f:[{n:"没成的日子也要有记录，不然它就是空白",d:"十年没结果，最容易的处理方式是不提。他把每一段都写下来了——敲谁的门、吃了什么、什么感觉。写的不是「我在坚持理想」，是残杯冷炙，把窘迫原样写出来，不往上贴任何体面的说法，这样的记录才留得住。",eg:"记这段日子的时候别写「我在坚持」，写「今天又去敲了谁的门，什么感觉」。"},
{n:"最不想写的那件，先写",d:"这首诗要讲天下的苦，可先讲的是自己家的。绕开自己那件去讲别人的，谁都看得出是躲。「所愧」两个字不解释也不推——战乱、没钱、在外求官都是真的，他一句没提。认账认得干净，事情才能过。",eg:"做错了或没做到的事，说「我没做到」就够了，后面的「因为」全都不用加。"},
{n:"从头开始先要一间房，不要一个位置",d:"他到成都做的第一件事是搭一间能住的屋子，不是去找官做。中年重来的人容易先找位置——名分、头衔、原来那个层级。房子有了，写诗的桌子才有地方放。「太晚」这个判断，常常是因为还留着别的选项在比。",eg:"重来的第一步是能过日子的最小配置，不是恢复原来的体面。"}],
q:["他把最不想写的写在了最前面。",
"没成的十年，一年一年都有账。",
"最好的东西写在最难的十年里。"],
apply:"在一件事上耗了很多年一直差一点，问这几年有没有原样记下来，除了那件没成的有没有一件一直在往前走的。做了自己觉得最没脸的事、或者没做到最该做到的，问要把这段日子讲清楚最不想提的是哪件，能不能只说「我没做到」不加任何「因为」。人到中年原来那条路断了，问现在要的是一间能过日子的房还是原来那个位置，是不是还留着一条「万一能回去」的路在跟新路比。用反了：读成「坚持十年总会成」，他求官这件事到死也没真成；读成「中年归零反而好」，他是被逼到那一步的，路上真的差点饿死。",
l:["苏轼","蒲松龄","陶渊明","司马迁"],
contrast:[{n:"苏轼",why:"都是四十多岁之后从头搭：苏轼到黄州先开地，杜甫到成都先搭房——两个人都先要能过日子的东西，不要位置；差别是苏轼后来又回去了，杜甫没有"},
{n:"陶渊明",why:"一个是自己走的，一个是没得选：陶渊明辞官那天就知道往哪去，杜甫弃官之后一路走一路找，到成都才停下"}]},
{c:"创业与产品",n:"褚时健",e:"1928-2019年·云南",w:"七十四岁上山种橙",y:2002,
d:"云南人。五十一岁起管玉溪卷烟厂，把红塔山做成全国第一的品牌，出名的是把每个环节的标准定死、把每个人的收入和质量绑在一起。七十四岁那年原来的一切都没了——位置、名声、积蓄大半也没了，身体也不好。他和妻子跑到哀牢山，承包两千四百亩荒山种冰糖橙，橙树四五年才结果，真正大卖是十年后，他八十四岁。收他写的是这个人：七十四岁上山、等五年、把一件事管到位的本事。",
story:"当时几乎所有人都觉得这是老人打发日子。他不这么算：橙树四五年结果，他七十四，等到七十九能看到第一批果——这个年纪的人多数活得到。算出来够，就干。上山第一年住的是工棚。果树没结果的那几年他不是干等：修水利、测每块地的土壤、请农科所的人定肥料配方，还把果树密度从每亩一百多棵砍到八十棵，因为太密的果不甜。烟和橙子是两个行业，他七十多岁才碰橙子，可管法一样：每块地包给一户人家，按果子的质量算钱不按斤数，剪枝、施肥、采摘的标准全写成规矩。",
f:[{n:"「太晚」要拿数字算，不能拿感觉判",d:"他没有说「我还年轻」，他算的是树几年结果、我大概还能活几年、够不够。「太晚」这个判断多数时候是感觉，感觉是算不出年数的。什么都没了的人反而没什么可比的了——那间办公室已经不存在，全部退路断掉的人干得专心。",eg:"觉得太晚的时候，写下这件事要几年、你大概还有几年，两个数摆在一起看。"},
{n:"看不到结果的年份，是修基础设施的年份",d:"果树没结果的那几年他修水利、测土壤、定配方，这些事在有果的年份反而没时间做。五年很长，可他每天上山做的是具体的一件事。第一批果不好吃他没当成失败，当成信息：知道了哪里不对，接着调。",eg:"还没出结果的这段时间，去修那些一旦忙起来就永远修不了的底层东西。"},
{n:"行业换了，管法没换",d:"他没有从头学怎么管，只是把原来那套用到新东西上：定标准、绑质量、每天到现场。行业知识是新的可以请人，管法是旧的是他自己的。他请农科所的人定配方，自己不假装懂——管到位是让懂的人在对的位置，不是自己样样都懂。",eg:"换行的时候盘一下：哪些是这个行业的知识（可以请人），哪些是你做事的方法（跟着你走）。"}],
q:["七十四岁算的是一道减法题，不是一个感觉。",
"等五年的人，每天都在做一件事。",
"位置能收走，本事收不走。"],
apply:"这个年纪要从头开始一件事、身边人都觉得太晚了，先算这件事要几年见结果、你大概还有几年，两个数摆在一起够不够，再问是不是还留着一条「万一能回去」的路。投进去一件事要好几年才见结果、正在看不到任何回报的那一段，问这段时间在修哪些以后就没空修的东西，「等」拆成每天的一件事了吗，第一批出来的东西不行当成了信息还是判决。没了原来的位置觉得自己什么都不是了，问原来那套做事的方法哪几条跟着你走，到了新地方是卡在「不懂」上还是卡在「不想请懂的人」上。用反了：读成「什么年纪开始都不晚」，他算过、算出来够才干的；读成「只要等够久就会成」，他等的五年每天都在干活。",
l:["稻盛和夫","李嘉诚","蒲松龄","苏轼"],
contrast:[{n:"苏轼",why:"都是失了位置之后先做一件小事：苏轼到黄州先开地，褚时健上山先修水利——两个人都不等人重新承认自己，先让手上有一件做成的"},
{n:"稻盛和夫",why:"都讲把一件事管到位：稻盛讲的是动机和思维方式，褚时健讲的是标准和质量绑定——一个从人心下手，一个从规矩下手"}]},
{c:"心智与情绪",n:"丘吉尔",e:"1874-1965年·英国",w:"被晾了十年，六十五岁回来",y:1929,
d:"政治家、写作者。1929 年随内阁下台丢了财政大臣的位置，此后十年没有官职，史称荒野岁月。这十年他靠写书养家，四卷本的《马尔博罗传》出在这期间；在自己家里动手砌砖砌墙，还画油画。三十年代他在议会反复讲德国重新武装、英国空军跟不上，被同僚当成好战和过时的人，他没有改口，把飞机产量的数字一次次念进会议记录。1939 年重回海军部，1940 年五月出任首相，六十五岁。收他是因为「被晾在一边」和「一直没成」这两个处境现在主要靠苏轼和弗兰克尔答，缺一个不是贬谪、不是受难，只是没人再找你、而每天照样得交出东西的样本。",
story:"这十年他没有一个头衔。写作是职业不是消遣——稿费是一家人的收入；砌墙是真砌，早几年他还加入过建筑工会。同一天里脑子和胳膊都用上，人才不至于整天在心里跟不在场的人打官司。议会里他讲的那件事没人爱听，他的办法不是提高音量，而是把话换成能核对的东西：对面今年造了多少架飞机，我们造了多少。这些发言当时改变不了任何一次投票，可它们带着日期留在了记录里。十年后有人急着找一个对这件事有现成判断的人，只剩他一个。",
f:[{n:"没人找你的时候，让每天都有东西出手",d:"被排除在外最难受的是不知道自己还算不算数。他的解法是交付：一章书稿、一段墙、一幅画。而且那件事得真养着他——有人付钱、有截稿日，它才不是等着回去的中场休息。",eg:"定一件每天能交出成品的事，最好是有人付钱的那种。"},
{n:"说了没人听，就把话换成能对账的",d:"感慨没法验证，说十遍还是一遍。换成数字、日期、具体的比较，对方当时可以不理，可它留在那儿，后来能对账。他真正没做的一件事是改口——一改口，将来需要判断的时候就没人想起你了。",eg:"把没人听的那个判断写成一句能验证的话，标上日期存好。"},
{n:"机会来时，看的是你手上现成的东西",d:"那一刻没人有时间培养谁。找他是因为这件事上只有他有现成的判断、现成的记录、现成的说法。攒的时候不知道会用在哪儿，只能保证攒的是真东西，不是消磨。",eg:"问自己：明天有人急用，我手上现成能拿出去的是什么？"}],
q:["十年没有头衔，每天照样有东西出手。","他一句没改，所以后来只剩他一个。","那几年他既写书，也真的在砌墙。"],
apply:"被排除在核心之外、没人再找你商量的时候，问今天交出了什么、这件事有没有人付钱和截稿日，再安排一件出力气的活跟脑子里那场官司抢时间。看见了别人还没当回事的事、说了几次没人听，问这个判断能不能改写成可核对的一句话、有没有带日期记下来、最近有没有为了好过一点悄悄把话说软。攒了很久看不到出口时，问如果明天有人急用、我现成能拿出去的是什么。用反了：读成「熬着总会回来」，他这十年没有一天在熬，而且很可能一辈子回不去；读成「坚持己见总会被证明」，他也有判断错的时候，这里说的是把话说成能对账的形式，不是自信本身。",
l:["苏轼","蒲松龄","弗兰克尔","司马迁"],
contrast:[{n:"苏轼",why:"都是被挪开之后过了很多年：苏轼是被贬，位置由别人定；丘吉尔是落选，位置由制度换手——一个学会在原地过日子，一个每天在攒能带回去的东西"},{n:"蒲松龄",why:"都在没人看见的年头里出活：蒲松龄考了四十年没成，靠路边收来的故事撑住；丘吉尔的十年有稿费养着，两个人手里的凭据不一样"}]},
{c:"身心与生活",n:"玛丽·居里",e:"1867-1934年·华沙/巴黎",w:"丈夫死后第七个月接过他的课",y:1906,
d:"物理学家、化学家。1867 年生于华沙，1891 年到巴黎求学，1903 年与丈夫皮埃尔、贝克勒尔同获诺贝尔物理学奖。1906 年 4 月 19 日皮埃尔在巴黎街头被马车撞倒身亡；同年索邦把他的教席给了她，11 月 5 日她上第一堂课，一句悼词没有，从丈夫上次讲停的地方接着往下讲，成了索邦第一位女教授。丧夫后一年多，她在一个本子上写给皮埃尔的话，生前没给任何人看过。一战期间她放下实验室，筹钱改装汽车、装上 X 光设备开往前线，自己学开车学修车，带着十几岁的女儿同去，士兵管这些车叫小居里。收她是因为「重要的人走了」这个处境答的人偏少，库里也缺一个把哀悼过成日子的亲历者。",
story:"第一堂课教室外挤满了人，记者也来了，都等着听她说点什么。她没有给。开口就接上丈夫上次停下的地方，往下讲。同一段日子里，她晚上在本子上对他说话：今天去了哪儿、孩子说了什么、她怎么受不了，句子里全是「你」，没有一句是「我要走出来」。八年后战争爆发，前线的伤员要送到后方才照得上片子，很多人等不到，她去筹钱、改车、学开车，把设备开到前线附近。那几年她学术上几乎是空白。",
f:[{n:"先接住一件有钟点有地点的事",d:"巨大的空白没法直接面对，能面对的是星期一下午两点那间教室。而她接的正是他没讲完的那一段——纪念一个人最实在的方式，往往是把他手上的事接着做下去。",eg:"先固定一件非做不可的具体事，有钟点、有地点的那种。"},
{n:"说不出口的话，写给那个人",d:"对活人说会变成求安慰，对自己说会变成分析，只有对着他说才说得出实话。她也没给自己定期限——把哀悼当成有终点的任务，人会一边难过一边怪自己怎么还没好。",eg:"抬头写他的名字，用「你」，写在确定不会被看见的地方。"},
{n:"本事要往眼下最缺它的地方放",d:"她的本行是研究，战时最缺的却是让伤员马上照上片子。为此她学的是驾驶和修车这种没有身份的活。那几年按论文算是空白，按用处算不是。",eg:"问一句：眼下最缺我这身本事的，是哪件具体的事？"}],
q:["她没有说再见，她把那堂课讲完了。","本子上全是「你」，一句没给别人看。","战时她学的是开车和修车。"],
apply:"最重要的那个人刚走、日子还得往下过的时候，先问这几天有没有一件非做不可、有钟点有地点的事，他手上有没有一件你接得住的事，你是不是在勉强自己给别人一个交代。有些话对谁都说不出口时，问这些话真正的收信人是谁、能不能就写给他，以及是不是在给自己定「什么时候该好了」。手上的本事和眼前的事对不上时，问眼下最缺它的是哪件具体的事、其中最没身份的那段活接不接。用反了：读成「忙起来就不痛了」，她白天讲课、晚上写那个本子，两件事是一起的；读成「本行不重要」，她做的事和专业直接相关，只是换了用法。",
l:["C.S.刘易斯","史铁生","弗兰克尔","蒙田"],
contrast:[{n:"C.S.刘易斯",why:"都在配偶死后写了东西：刘易斯写的是自己信仰塌了、怕把人换成记忆；居里写的是日常，今天去了哪儿、孩子说了什么——一个在追问，一个在陪着"},{n:"史铁生",why:"都是把不可挽回的事过成日子：史铁生面对的是自己的身体，居里面对的是别人的死；两个人都没有等一个好起来的日子，而是先给每天找了件具体的事"}]},
{c:"识人与相处",n:"菜根谭",e:"明代·约1590年代",w:"三百多条讲人前人后怎么过",y:1590,
d:"明代洪应明著，约成书于万历年间，三百余条语录。「径路窄处，留一步与人行」把让一步说成让自己好过的办法，不是美德；「藏巧于拙，用晦而明」讲的是一个人在人群里的藏身之处，理由是藏身不是谦虚；「毋以己之长而形人之短，毋因己之拙而忌人之能」把急着显强和见不得别人好说成同一件事的两头。书名出自宋人汪信民「人常咬得菜根，则百事可做」。收它是因为「说不出口」那一组——看不得别人好、怕被看穿、总在讨好——现在布琳·布朗一人答了十二个，而且答的全是外国人，中文里最贴这一组的书就是这本。",
story:"「径路窄处，留一步与人行；滋味浓的，减三分让人嗜。此是涉世一极安乐法。」要紧的是最后五个字：他没说这样高尚，说的是这样自己好过。为了别人而忍，忍到后面会记账；为了自己不必绷着而让，让完就过去了。他给的量也清楚——留一步、减三分，不是全让，全让出去的人得靠对方的良心过日子。另一条讲藏：藏巧于拙、以屈为伸，图的是能在人群里待住。",
f:[{n:"让一步，是为自己让的",d:"窄路上两个人对着挤，谁也过不去。事事占先的人赢的是每一次，输的是下一次——对面那个人下回见了你就绷着，本来顺手的事从此都得费一遍劲。他把这叫安乐法，动机说得很明白。",eg:"遇上窄路先让半步，然后看这条路后来是不是好走了。"},
{n:"怕被看穿，是因为摆出去的比手上有的多",d:"本事亮完了，别人的预期就定在那个高度，从此每一次都得踩着那条线。要治的不是怕，是那个差额：要么把手上的补足，要么把摆出去的收回来一点。",eg:"先算摆出去的和手上有的差多少，然后去补差额。"},
{n:"见不得别人好，根在自己空着那块",d:"他把因果说反过来：不是因为他太好我才难受，是因为我这块空着。要紧的是那个「形」字——不必说一句难听话，只要不断把话题拐到自己擅长的地方，对方就自动矮下去了。",eg:"开口前想一秒：这句说完，是事情前进了还是他矮了。"}],
q:["他把让一步叫安乐法，不叫美德。","留一步、减三分，都是有数的。","把话题拐回自己拿手那块，对方就矮了。"],
apply:"跟人处得紧、什么都想占先或什么都在退的时候，问这条路是不是窄到两个人过不去、这一步是为对方让的还是为自己让的、让的是三分还是全部。在人前总绷着、怕被看出没那么行的时候，问摆出去的和手上有的差多少、这一场值不值得用力、有没有给自己留可以失手的余地。身边人做成了事而你心里发闷的时候，问他好的是哪一块、你这一块是不是空的，以及最近说的话里有几句是让对方显得矮的。用反了：读成「凡事忍让」，他说的是减三分不是全让；读成「本事都别露」，他说的是选场合，该出手时不出手是另一种错。",
l:["布琳·布朗","智慧书","冯道","拉罗什富科"],
contrast:[{n:"智慧书",why:"都是一条一条的处世格言，都在讲藏与露：智慧书教的是怎么让人看见你的好，菜根谭教的是怎么不必被看见——一个向外经营，一个向内待住"},{n:"布琳·布朗",why:"都在处理怕被看穿：布琳·布朗的解法是把它说出来、让羞耻活不下去，菜根谭的解法是别把自己摆得那么满——一个靠暴露，一个靠留白"}]},
{c:"心智与情绪",n:"薄伽梵歌",e:"约前2世纪-公元2世纪·印度",w:"你有权做事，无权要结果",y:-200,
d:"印度史诗《摩诃婆罗多》中的一部分，七百颂十八章，成书年代学界一般定在公元前二世纪至公元二世纪之间。全篇是开战前阿周那与御者克里希那的对话：阿周那看见对面阵中是自己的亲族与师长，扔下弓不肯打。第二章第四十七颂的通行汉译大意是「你只有做事的权利，没有对结果的权利」，甘地称这本书是自己的精神词典。收它是因为「使不上劲」那一组现在主要靠爱比克泰德答，他一人挂了十五个处境；库里此前也没有一部印度典籍。写它只写它讲事的那一面：怎么把注意力从收成搬回动作。",
story:"全书从一个人动不了开始。阿周那不是不会打，他是把所有后果一次性摊在了眼前，手就软了。克里希那没有说别想那么多，也没有催他，而是陪他把这件事从头论了十八章。中间那句被引了两千年：你只有做事的权利，没有对结果的权利；不要为了结果去做事，也不要因此就不做事。这话不是在书房里说的，是在一个人马上要付出代价的时候说的。论完之后他还是去打了——代价一分没少。",
f:[{n:"把权利划开：动作在你手上，收成不在",d:"做不做、怎么做、今天做多少全在这边；市场认不认、上面批不批、对方回不回全在那边。不问收成不等于不看结果——结果是信息，用来调整动作，不是用来决定今天还做不做。",eg:"把事情拆成两栏：我说了算的和我说了不算的，只动左边。"},
{n:"动不了的多半不是不会",d:"阿周那的能力没问题，问题是他一次看见了整条路的后果，任何一步都变得不可承受。这时候说「你可以的」没有用，他卡的不是信心，是那些想不通的地方。",eg:"卡住时只看今天这一步的代价，别把整条路一起算。"},
{n:"判据：撑着你的是这件事，还是那个回报",d:"设想回报明确没有了，你还做不做。答案是不做，说明你一直在做的是回报，这件事只是通向它的路。松开手不是不在乎，是让今天做多少由自己定，不由外面的消息定。",eg:"今天要做的量提前定好，不因为有没有好消息而改。"}],
q:["权利划在动作这边，收成不在。","十八章论完，他还是得自己走过去。","回报没了你还做不做，答案是实情。"],
apply:"在一件事上使了很久劲、看不到回报的时候，问这件事里你说了算的是哪几样，最近看结果是为了调整动作还是为了决定还做不做。道理都懂却挪不动的时候，问是不是把整条路的后果一次想完了、今天这一步的代价到底多少、有没有人能陪你把这件事论到底。被结果拽着走、有消息就有劲没消息就垮的时候，问如果确定没有回报你还做不做、今天的量是自己定的还是外面的消息定的。用反了：读成「结果不重要」，它没说不看结果，说的是不拿结果决定今天做不做；读成「想通了就会轻松」，他论完还是要上阵。",
l:["爱比克泰德","弗兰克尔","王阳明","庄子"],
contrast:[{n:"爱比克泰德",why:"两边划的是同一条界：爱比克泰德划在「在我控制之内与不在」，薄伽梵歌划在「动作与结果」——一个是平日的自我训练，一个是站在阵前对一个动不了的人说的"},{n:"王阳明",why:"都在处理知道却动不了：王阳明把压力给在「知」那一头，说知而不行只是未知；薄伽梵歌把压力给在「论」这一头，陪着把后果论到底才动"}]},

{c:"世界如何运转",n:"伊万·伊里奇",e:"奥地利—墨西哥·1926-2002",w:"上限",y:1926,
d:"神父出身的思想家，1970年代连出四本书拆掉了四套人人默认为进步的系统：学校、交通、医疗、以及「工具」这个概念本身。他的核心论断只有一句：每样工具都会跨过两道分水岭，越过第二道，它开始生产它本来要消灭的东西。医疗制造病人，学校制造无知感，交通制造距离。他不反技术，他要给技术设上限——他称之为「共生工具」：普通人能掌握、能修、也能不用的那一种。",
story:"写下「医疗过程本身在制造疾病」的人，晚年脸上长了一个瘤。医生给出的方案是手术加放疗，成功率可观，代价是可能失去说话和听力——而说话与听人说话，正是他全部工作的形式。他拒绝了，此后近二十年带着那个瘤生活、讲学、忍痛，靠自己配的鸦片撑过最坏的日子，2002年在不来梅去世。他没有把这件事写成宣言，学生问起时他只说这是他自己的算法。这个场景比他任何一句话都更能说明他在讲什么：他从不否认那套治疗有效，他质疑的是「有效」有没有把要付出的东西一起算进去。",
f:[{n:"两道分水岭",d:"第一道之前，工具解决真问题；两道之间，它稳定地有用；越过第二道，它开始产出与初衷相反的东西。所以「它有用吗」问不出答案——它当然有用。该问的是：从什么时候起，我为维持它付出的超过了它给我的。",eg:"群聊刚建时省下十封邮件；两百人之后你每天花一小时读它，而真正找你的事仍然走单聊。它没变坏，是过了岭。"},
{n:"过岭的标志是「开始生产反面」",d:"不是变得低效，是产出与初衷相反的东西：医疗制造病人，交通制造距离，学校制造无知感。这个信号比效率数字灵敏——效率在过岭之后往往还在涨，这正是它难被发现的原因。",eg:"上了项目管理工具，工时统计漂亮了，而大家开始为了让看板好看而拆任务。工具要的东西正在替换掉工作本身。"},
{n:"共生工具：你能不能退出",d:"他要的不是砸掉工具，是给工具设上限。判断一样工具是不是「你的」，看它允不允许你走：退出成本越高，它越不是你的工具，你越是它的。",eg:"能导出全部数据、换掉也不痛的系统，和绑死之后再谈价的系统，功能可以完全一样。差别在你还能不能走。"},
{n:"把两本账并成一本",d:"任何工具只报「省下的时间」，从不报「为它付出的时间」——学它、修它、为买它而工作、被它打断后重新进入状态。分散在不同日子里，所以从来没人加起来。加起来之后，结论常常翻转。",eg:"把月费换算成你的工时，加上每周维护它的时间。很多工具在这一步之后账就不成立了。"},

// 反向关联索引。l 与 contrast 都是逐条手写的单向边，于是被指向的一方看不到来源：
// 全库有 291 条 l、119 条 contrast 只存在于一个方向，另有 9 条（武则天、富兰克林、胡雪岩、
// 安迪·格鲁夫、六祖慧能，以及新收录的几条）没有任何条目指向它们，只能从「最新」或搜索进入。
// 这里在渲染期补齐反向边：人工挑选的正向关联仍排在前面，自动补全的反向关联接在后面，去重。
// 好处是数据不必写两遍，此后新增条目自动双向可达。
const RL={},RC={};
D.forEach(d=>{
  (d.l||[]).forEach(x=>{(RL[x]=RL[x]||[]).push(d.n)});
  (d.contrast||[]).forEach(c=>{(RC[c.n]=RC[c.n]||[]).push({n:d.n,why:c.why})});
});
function relOf(d){
  const fwd=d.l||[],seen=new Set(fwd),add=[];
  (RL[d.n]||[]).forEach(x=>{if(x!==d.n&&!seen.has(x)){seen.add(x);add.push(x);}});
  return fwd.concat(add);
}
function contrastOf(d){
  const fwd=d.contrast||[],seen=new Set(fwd.map(c=>c.n)),add=[];
  (RC[d.n]||[]).forEach(c=>{if(c.n!==d.n&&!seen.has(c.n)){seen.add(c.n);add.push(c);}});
  return fwd.concat(add);
}

const DQX={"做点新东西，不要随大流。":"他人生五条准则的第一条。随大流的问题不在于错，在于即便对了，收益也早被分完了——优势只存在于还没有人站的地方。","和你能找到的最聪明的人在一起，然后放手让他们做。":"两个动作缺一不可。只招不放，等于花大价钱买来一群执行者；而放手比招人难得多，因为它要求你承认自己不是最强的那个。","我是模型先生，不做基本面分析。模型的好处之一，是它能降低风险。":"放弃理解，换来不被自己的故事欺骗。他的收益不来自看得更准，来自把判断这一环从流程里整个删掉。","如果你花在选股上的时间比挑一台冰箱还少，那你活该亏钱。":"一句刺人的对照：买冰箱会比价、查参数、看评测，买股票却靠一条消息。投入的注意力和金额完全不成比例。","如果你每年花13分钟研究宏观经济，那你就浪费了10分钟。":"不是说宏观不重要，是说它不可预测且不可行动。把时间投进一个无法转化为决策的变量，是最隐蔽的浪费。","在股市里最重要的器官是胃，不是脑子。":"判断的门槛远低于承受的门槛。多数人不是没看对，是在看对的位置上被波动摇了出去。","翻的石头越多，找到的东西越多。":"他全部方法的底座，也是最难抄的一条：超额收益来自调研次数，而次数是体力活，不是洞察力。","让人对你有所期待，胜过让人看清你的底。":"已知的能力会被定价，未知的能力才有溢价。一次把实力放满的人，从此只能按那个标准被要求。","不要把话说尽，也不要把事做绝：留下退路，是智者最后的体面。":"留退路不是怯懦，是承认自己会判断错。把话说死的人，等于赌自己永远不需要改口。","凡事都有一个把手，抓住对的那一个，就能推动任何人。":"比《影响力》早了三百多年的同一个洞察，而且更冷：每个人身上都有一处可施力的位置，找错了就是白费劲。","第一流的能力，是知道什么时候不用它。":"能力和调用能力是两件事。逢事必出手的人，会把自己变成一个随时可以被消耗的资源。","宁可与聪明人为敌，不与愚人为友。":"敌人的水平决定你的上限，同伴的水平决定你的成本。和糊涂人相处，光是解释就会吃掉你全部的时间。","国家之所以失败，是因为攫取性制度无法创造激励，让人们去储蓄、投资和创新。":"全书的结论句。穷不是因为人懒或笨，是因为在那套规则下，努力的人拿不到努力的结果。","创造性破坏重新分配的不只是收入和财富，还有政治权力":"这才是创新被压制的真正原因。既得利益者反对的从来不是新技术，是新技术带来的重新洗牌。","繁荣的根源不是自然资源、地理位置或文化传统，而是制度。":"一次性排除了三种最流行的解释。资源可以是诅咒，地理两边相同，文化同宗同源——只剩规则不一样。","贫穷不是因为不知道该怎么做，而是因为掌权者不愿意那样做。":"把发展问题从技术层拽回权力层。好政策的设计从来不难，难在它会削弱正在受益的那批人。","我从不被理论指导。我只问一个问题：这行得通吗？":"极端实用主义的代价与红利都在这句里：他因此避开了所有意识形态陷阱，也因此难以被任何一套价值观辩护。","如果你付花生米的工资，你请到的就只能是猴子。":"把廉洁做成理性选择，而不是道德要求。任何需要人性高尚才能运转的制度，长期都会失效。","我们是一条必须融入鱼群的小鱼。":"弱者的生存策略不是变强，是让自己不值得被单独挑出来。孤立是小国和小公司真正的死因。","在被爱戴和被畏惧之间，我一直认为马基雅维利是对的":"他极少数一次公开的价值观表态。值得注意的是他说的是「被畏惧」，不是「被讨厌」——两者的成本天差地别。","我不在乎民调，我在乎的是三十年后这个国家还在不在。":"长期主义的真实形态：不是有耐心，是愿意在自己的任期内承担骂名，把成果留给一个自己看不到的时点。","机器不打仗，地形不打仗。人打仗。你必须进入人的头脑里去。":"把竞争的目标从对手的资产改成对手的判断。装备和阵地都只是变量，真正的战场在对方怎么理解局面。","你可以选择成为某个人，也可以选择做成某件事。总有一天，你必须在这两条路之间选一条。":"他给每个年轻军官讲的岔路。两条路在早期看起来完全重合，等你发现它们分开时，通常已经选过了。","混乱、无序和不确定，不是要消除的东西":"对克劳塞维茨「摩擦」的一次反转：既然迷雾无法清除，就别浪费力气清除它，把它定向输送给对手。","如果你的循环快过对手，那么他做的每一个反应，都是在应对一个已经消失的世界。":"速度优势的真正杀伤力不在快，在于让对手的每一次正确决策都自动过期。他不是被打败，是自己乱掉的。","百战百胜，非善之善者也；不战而屈人之兵，善之善者也。":"打赢一百次也是一百次消耗。孙子的标准不是胜率，是代价——最好的胜利不在战场上产生，而在对方算完得失后自己放弃。谈判和竞争同理：逼对方算清楚，比逼对方认输便宜得多。","知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆。":"三种状态对应三种胜率，最该注意的是中间那档：只知己不知彼是五五开，等于把结果交给运气。多数人败在只做了一半功课，就以为自己准备好了。","兵无常势，水无常形，能因敌变化而取胜者，谓之神。":"「神」不是算无遗策，是不带预设方案入场。凡是把上一次赢的打法当模板的，都在等一个必然到来的失败。","胜兵先胜而后求战，败兵先战而后求胜。":"顺序决定生死：赢家先把胜负条件凑齐再开打，输家先开打再想办法赢。所有临场翻盘的故事，都是幸存者偏差。","上兵伐谋，其次伐交，其次伐兵，其下攻城。":"一张四级成本表，越往下越贵：攻心最便宜，攻城最贵。真正的问题是，人的本能恰好是从最贵的那一层开始。","战略上藐视敌人，战术上重视敌人。":"两个层次不能串台：战略上怕，就不敢下场；战术上不怕，就会轻敌送命。而多数人恰好反着来——战略上盲目乐观，战术上畏首畏尾。","集中优势兵力，各个歼灭敌人。":"弱者唯一能赢的方式：全局劣势不重要，只要每一次局部交手你都是多打少。资源不够的时候不要摊开，要叠起来。","存地失人，人地皆失；存人失地，人地皆存。":"地会再长出来，人不会。凡是为了保住阵地、面子或估值而把人打光的，最后两样都留不住。","打得赢就打，打不赢就跑。":"听着像取巧，其实最难：它要求你随时诚实评估自己打不打得赢，并且在承认不行的那一刻立刻放弃已经投入的成本。","为学日益，为道日损。损之又损，以至于无为，无为而无不为。":"两条方向相反的曲线：学知识是加法，练判断是减法。多数人一辈子只走加法那条，收集越来越多的方法，却没有能力删掉错的。","知人者智，自知者明。胜人者有力，自胜者强。":"四句里最狠的是最后三个字。赢别人靠能力，赢自己靠结构——前者有天花板，后者没有。","天下之至柔，驰骋天下之至坚。":"柔不是软弱，是不给对方着力点。硬碰硬会同时磨损两边，水不会。","破山中贼易，破心中贼难。":"外部的敌人有形状、有位置、可以调兵；内心的懒惰、傲慢和恐惧没有战场。他打赢了所有的仗，然后说难的是这个。","人须在事上磨炼做功夫，乃有益。":"反对纯粹的书房修养：道理在书房里永远成立，只有放进具体的事、具体的人、具体的利益冲突里，它才会露出你没想到的那一面。","志不立，天下无可成之事。":"不是鸡汤。没有立志的人不是不努力，而是每一次选择都缺一把尺子，于是长期看下来是随机游走。","天下古今之庸人，皆以一惰字致之；天下古今之才人，皆以一傲字致之。":"一份两栏的死亡清单：平庸的人败于懒，有才的人败于傲。越是聪明人，越该盯右边那一栏。","困心横虑，正是磨炼英雄之时。":"把难受重新定义为过程指标：正在被拧的那个时刻，恰好是能力边界正在移动的时刻。","飞鸟尽，良弓藏；狡兔死，走狗烹。":"组织不是忘恩负义，是需求变了。战时最有价值的那种能力，和平时期可能变成最大的威胁——关键是提前看见这个切换点。","陷之死地而后生，置之亡地而后存。":"极高风险的动员术：去掉退路能榨出全部潜力。但它只对本来就没有选择的人有效；主动给自己断后路的，多数只是在赌。","老骥伏枥，志在千里；烈士暮年，壮心不已。":"五十三岁写的。它的重量不在豪情，而在于承认了「暮年」这个前提之后，仍然选择不停。","非淡泊无以明志，非宁静无以致远。":"两个负向条件：不是让你清心寡欲，而是说欲望太密时人看不清自己要什么，噪音太大时人算不了远。","不伐贼，王业亦亡；惟坐而待亡，孰与伐之？":"明知打不赢还要打的理由：坐着等死和站着输是两种不同的结局。有些仗的目的不是赢，是不让局面停在必死的那一格。","仓廪实则知礼节，衣食足则知荣辱。":"道德是有物质门槛的。任何指望靠说教解决的问题，先去查一下它的生存条件够不够。","一年之计，莫如树谷；十年之计，莫如树木；终身之计，莫如树人。":"一份复利期限表：一年、十年、一生。绝大多数组织的所有动作，都停在第一栏。","生我者父母，知我者鲍子也。":"中国最著名的一句致谢。管仲从来不缺能力，缺的是在他一无所有时有人替他背书——而这恰恰是最稀缺的资源。","在别人贪婪时恐惧，在别人恐惧时贪婪。":"逆向不是唱反调，是给情绪定价：市场情绪最贵的时候资产最便宜，反之亦然。难点在于，你自己也泡在同一种情绪里。","第一，不要亏钱；第二，不要忘记第一条。":"复利的算术：亏掉50%需要涨回100%才能回本。所以第一条不是关于谨慎，是关于数学。","时间是好公司的朋友，是坏公司的敌人。":"时间会放大一切，包括缺陷。拿不住的公司不是因为拿得不够久，是本来就不该拿。","如果你不愿意持有一只股票十年，那你连十分钟都不应该持有它。":"一把过滤器：把持有期拉长到十年，大部分买入理由会自动失效——撑不过十年的理由，通常关于价格波动，而不是生意本身。","反过来想，总是反过来想。":"正面求解太难时先求反解：问「怎样才能失败得最彻底」，答案往往清晰得多，而光是避开它们就已经赢了大半。","告诉我激励是什么，我就告诉你结果会是什么。":"想改变行为，别去改口号，去改激励。所有和激励设置相反的道德要求，长期都会输。","以合理价格买入卓越公司，远胜于以便宜价格买入普通公司。":"从「捡烟蒂」进化到「买质量」的那一步：便宜的东西通常有便宜的理由，而优秀的公司会自己长大，替你修正买入价上的误差。","我没有权利拥有一个我无法反驳的观点。":"一条极高的发言门槛：你必须能把反方立场讲得比反方还好，才算真正拥有这个观点。否则你只是复述了一个偏好。","如果我知道我会在哪里死，我就永远不会去那里。":"反向思考的极简版：先列出所有确定的死法，然后用一辈子绕开它们。不需要预测未来，只需要标出雷区。","扩张中不忘谨慎，谨慎中不忘扩张。":"两个相反的动作必须同时在场。只扩张的死于现金流，只谨慎的死于错过窗口——难的是在同一时刻做两件互相矛盾的事。","好景时不过分乐观；不好景时不过度悲观。":"情绪的减震器。顺境里的乐观和逆境里的悲观，都会让你在最坏的时点做出最大的动作。","第一个桶一定要扎实，才好放第二个桶。":"第一桶金的意义不在金额，在于它验证了你的方法有效。方法还没验证就上杠杆，等于在放大一个未知数。","现金流是企业生存的氧气。":"利润是观点，现金是事实。企业不会因为不赚钱倒闭，只会因为付不出钱倒闭。","简单比复杂更难。你必须努力理清思路，让它变得简单。":"复杂是偷懒的产物——把所有可能性都留着，就不必做判断。简单要求你先彻底想明白，然后承担删掉的风险。","专注意味着对一百个其他好主意说不。":"专注真正的成本不是拒绝坏主意，是拒绝好主意。难的从来是那一百个都成立的选项。","设计不仅仅是外观和感受。设计是产品如何工作。":"把「设计」从表层挪到结构层。看起来的样子只是结果，决定体验的是它究竟怎么运转。","延迟满足感程度在不同量级的人是没法有效讨论问题的。":"一句冷酷的判断：这不是能力差异，是时间尺度差异。尺度不同的两个人讨论同一件事，只会各说各话。","创业公司最大的竞争优势是执行力，不是创意。":"创意的稀缺性被严重高估了。同一个想法此刻正同时出现在很多人脑子里，分胜负的是谁先把它做出来、并且做对。","做对的事情和把事情做对是两回事。":"两个不同的维度：方向错的时候，效率越高死得越快。先确认在做对的事，再谈怎么把它做好。","不管什么错误，越早改正损失越小。":"沉没成本的解药：改正的代价随时间指数上升，而不是线性。发现错了的那一刻，就是最便宜的时刻。","物理学是定律，其他一切都是建议。":"第一性原理的入口：把所有「行业惯例」「大家都这么做」降级为建议，只承认物理约束是硬的。","努力成为有用的人。做有用的事，对别人，对这个世界。":"一个极朴素的效用标准，用来对抗那些「看起来重要」的事。有用是可以验证的，重要往往不能。","80%的时间用在创造上。":"时间分配就是战略。会议、汇报、协调都必要，但它们只搬运已有的东西，不产生新的。","我们永远处于公司即将倒闭的边缘。":"一句维持了三十年的自我暗示。它的作用不是制造焦虑，是防止组织把当下的领先误当成安全。","苦难是一份礼物，我希望每个人都有机会经历。":"有争议的一句。他的意思是韧性只能在真实的困难里长出来，而不是说困难本身有什么价值。","如果你们没有失败过，你们其实还没有真正开始。":"失败率为零，说明你只做了确定能做成的事——而确定的事通常没有超额回报。","我们想要一辆会飞的汽车，得到的却是140个字符。":"对一整个时代的指控：资本涌向了容易的软件创新，而难的、物理世界里的东西进展缓慢。","做得最好的企业是那些不竞争的企业。":"竞争会把利润磨到零。真正赚钱的公司都在做别人没做的事——垄断不是结果，是起点。","你在哪个重要问题上，与大多数人的观点相反？":"他的面试题。一个只能私下回答的问题，因为如果大家都同意，它就不再是秘密了。","活下去，是华为最朴素的目标，也是最高的目标。":"最低目标和最高目标是同一个。听起来消极，实际是把所有战略动作都拉回同一个约束条件下检验。","华为没有成功，只有成长。":"拒绝给自己定性。一旦承认成功，组织就会开始保护已有的东西，而不是继续生长。","十年来我天天思考的都是失败，对成功视而不见，也没有什么荣誉感、自豪感，而是危机感。":"把危机感做成制度，而不是情绪。它要求组织把注意力永久性地放在「哪里可能塌」，而不是「我们赢了什么」。","未来是无序的。这是活着最好的时代，几乎所有你自认了解的东西都是错的。":"1997年的判断。它的价值不在预言准不准，而在提醒你：你确信的大部分东西，来自一套即将过期的旧结构。","暴力的成本和收益决定了人类社会的结构。":"一把解释历史的钥匙：社会形态由「施加暴力的成本」决定。技术一旦改变这个成本，社会结构就跟着变。","如果说人工智能是共产主义的，那么加密技术就是自由主义的。":"一句极简的技术政治学：AI天然中心化、集中权力，加密天然分散、对抗权力。而这两样正在同时到来。","臣愿封留足矣，不敢当三万户。":"功成之后主动要小地方，而不是要三万户。他把「封赏」看成风险敞口：赏越大，越显眼，越接近清算名单的前排。","愿弃人间事，欲从赤松子游耳。":"退出的话术。他没有说不干了，说的是要去修仙——给权力一个体面的台阶，比直接辞职安全得多。","臣方外之人，不以官为念。":"同样是退，李泌用的是「我本来就不是体制内的人」。不进入身份，就不必参与身份的争夺。","明主之所导制其臣者，二柄而已矣。二柄者，刑德也。":"把管理压缩成两个动作：赏和罚。韩非的冷酷之处在于，他认为这两样一旦交出去，君主就什么都不是了。","以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。":"三面镜子对应三种反馈源：自己、历史、他人。最难的是第三面——因为它需要有人敢说，也需要你敢听。","我唯一知道的，是我什么都不知道。":"不是谦虚，是认识论的起点。他去问雅典最聪明的人，发现他们都以为自己懂；他不懂，但他知道自己不懂——这个差别决定了谁还能继续学。","未经审视的人生不值得过。":"法庭上的最后陈述。他的意思是：你的价值观如果没有被自己检验过，你过的就是别人的人生。","我不是雅典人，也不是希腊人，我是世界公民。":"公元前五世纪说出「世界公民」。在城邦即身份的年代，这句话等于主动放弃了最大的一层保护。","你有权控制你的思想，而非外部事件。认识到这一点，你便拥有了力量。":"斯多葛的核心操作：力量不来自改变外部，来自认清哪些根本不归你管，然后把全部资源投到归你管的那部分。","你浪费的每一刻，都是别人拼命想要的时间。":"时间是唯一不可再生的资源，而它的稀缺性只在失去时才显形。这句话是让你提前感受那个稀缺。","对于不在你掌控之内的事，不要浪费精力。":"注意力是有限的。为不可控的事消耗情绪，本质上是在挪用你本该用于可控之事的资源。","最好的复仇，是不要变得和对方一样。":"以牙还牙的隐性代价是：你会变成对方那样的人。他给出的替代方案不是原谅，是不被对方定义。","君主必须同时是狮子和狐狸。狮子不知道陷阱，狐狸不能抵御狼群。":"两种能力缺一不可：狮子有力量但看不见陷阱，狐狸能识破陷阱但打不过狼。只强不智，或只智不强，都会死。","人们对伤害的记忆，比对好处的记忆更久。":"一条不对称的人性定律：伤害在记忆里的半衰期远长于恩惠。所以施恩要持续，伤害要一次到位或者根本不做。","命运是我们行动的一半，另一半由我们自己掌控。":"一半一半的世界观。既反对宿命论，也反对全能感——你能掌控的只有你那一半，但那一半必须做满。","极度开放地接受现实，极度诚实地面对自己。":"两个「极度」是一套配对：只对外开放不对己诚实，会变成好好先生；只对己诚实不对外开放，会变成偏执。","失败不是坏事，从失败中不学习才是。":"把失败从结果重新定义为原料。真正致命的不是亏损本身，是同一个亏损重复出现。","现实+对现实的接受=成功的机器。":"一个把主观愿望排除在外的公式。「接受」是最难的那一项——大多数人卡在不肯承认现实是这样。","脆弱的对立面不是强健，而是反脆弱。":"他造了一个词，因为原来的词汇里没有：强健只是扛住冲击，反脆弱是从冲击里获益。绝大多数系统只做到了前者。","风会熄灭蜡烛，却使篝火越烧越旺。对随机性、不确定性和混沌也一样：你需要拥抱它们，而不是逃避它们。":"同一阵风，对蜡烛和篝火的作用完全相反。差别不在风，在于你的结构是消耗型还是供给型。","没有皮肤在场的建议，是毫无意义的噪音。":"检验建议的唯一标准：给建议的人是否承担后果。不承担后果的判断，无论多有道理，都只是噪音。","预测未来是愚蠢的，为不可预测的未来做准备才是智慧。":"把重心从「预测」挪到「配置」。预测的准确率无法提升，但抗打击的结构可以设计。","财富是你睡觉时也在为你工作的资产。":"财富和收入的分水岭：一个在你睡觉时继续工作，一个在你停下时立刻归零。","如果你的收入按小时计算，你永远不会真正富有。":"按小时计价的本质是把时间零售出去，而时间的库存是固定的。这决定了它的天花板不由你的能力决定。","代码和媒体是这个时代不需要许可的杠杆。":"和资本、人力不同，代码和媒体的复制成本为零，且不需要任何人批准。这是普通人这个时代唯一免费的杠杆。","在你认为是玩、别人认为是工作的地方，找你的特定知识。":"寻找特定知识的方法：在你觉得是玩、别人觉得是苦工的地方，你的投入产出比天然比所有人高。","幸福不靠追求，靠移除障碍。":"把幸福从「获得」改成「减少」。追求的对象会不断后退，而障碍是有限的、可以逐一清理的。","大多数人为了逃避真正的思考，愿意做任何事情。":"一句刺人的观察：思考很痛苦，所以人会用忙碌、开会、刷手机来替代它，并且觉得自己很努力。","选择做正确的事情，而不是容易的事情。":"两条路每天都在分岔，而容易的那条通常伪装成「更现实」。区分它们的方法是问：我是在解决问题，还是在回避不适？","我们赢不是因为烧得比别人猛，是因为活得比别人久。":"补贴战的终局判断。烧钱决定谁跑得快，效率决定谁活得久——而最后一个还站着的人拿走全部。","士为知己者死，女为悦己者容。":"最早的「知遇」定价。它揭示了一种非货币的激励：被真正看见的人，愿意付出金钱买不到的东西。","狡兔有三窟，仅得免其死耳。":"冯谖给孟尝君设计的结构：不是一个后路，是三个。单一备份等于没有备份，这是两千年前的冗余设计。","父母之爱子，则为之计深远。":"触龙说赵太后的核心一句。真正的爱是替对方安排长期的位置，而不是给他眼前的舒服。","见兔而顾犬，未为晚也；亡羊而补牢，未为迟也。":"两个「未晚」是这句话的重点：它反对的不是犯错，是发现错了之后因为羞耻而不动手。","学而不思则罔，思而不学则殆。":"两个失效模式：只学不想会淹没在信息里，只想不学会困在自己的循环里。多数人常年偏在其中一边。","知之者不如好之者，好之者不如乐之者。":"三级动力：知道、喜欢、享受。前两级要靠意志维持，第三级不需要——长期竞争最后拼的是这个。","君子和而不同，小人同而不和。":"一条关于团队的判据：能容纳分歧的一致才是真的，靠消灭分歧换来的一致最脆弱。","吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？":"关键在「日」字。它把反省从偶发的顿悟变成每天的例行动作——曾国藩的日记，本质上是这句话的执行版。","君子固穷，小人穷斯滥矣。":"逆境是照妖镜。人的下限不在顺境里显形，只在被逼到墙角的时候露出来。看人要看这一刻。","智人统治地球，不是因为最强壮或最聪明，而是因为唯一能相信共同虚构的动物。":"整本书的核心论断：让人类形成超大规模协作的，不是力量或智力，而是相信不存在之物的能力——国家、货币、公司都是。","农业革命是历史上最大的骗局。":"最反直觉的一章：从物种角度农业是巨大成功，从个体角度它带来了更长的劳动、更差的营养和更多的疾病。指标选错，结论就反了。","能力的提升并不必然带来幸福的提升。":"技术曲线和幸福曲线没有绑定。这句话是整本书对「进步」这个词最大的保留。","我们创造的神，反过来控制了我们。":"虚构是工具，但工具会反过来定义使用者。货币、KPI、公司都经历过这个反转。","力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！":"垓下绝唱。值得注意的是他到最后关心的仍是「时」和「虞姬」，而不是自己哪一步走错了。","此天之亡我，非战之罪也。":"他至死没有归因到自己。这句话是整个知识库里最典型的一次外部归因——也是他失败的真正原因。","纵江东父兄怜而王我，我何面目见之？":"面子成了最后一道关。可以东山再起的条件全部具备，唯一缺的是接受自己已经输了的能力。","我本淮右布衣，天下于我何加焉。":"称帝之后仍然强调布衣出身。它既是自信，也是一种统治技术：出身越低，越能证明结果全靠自己。","天下之事，不难于立法，而难于法之必行。":"变法者的共同发现：立法是技术问题，执行是权力问题。张居正的考成法，就是专门为后半句造的。","竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。":"贬谪路上遇雨。它的力量在于「轻胜马」三个字——没有马的人说骑马不如走路，而且是真心的。","回首向来萧瑟处，归去，也无风雨也无晴。":"回望的姿态。不是雨过天晴，是连晴和雨的分别都消失了——这比乐观高一个层级。","古之成大事者，不惟有超世之才，亦必有坚忍不拔之志。":"给「有志」加了一个前提：才华是入场券，坚忍才是决定名次的东西。这两样他都不缺，所以说得出口。","凡杀不死我的，必使我更强大。":"被引用最多也被误用最多的一句。原意不是苦难有益，而是能被你消化的冲击会转化成结构——消化不了的会直接摧毁你。","每个不曾起舞的日子，都是对生命的辜负。":"针对的是把生活过成待办清单的人。舞蹈在这里代表一切没有产出、却证明你还活着的行为。","人之所以伟大，在于他是桥梁，而非目的。":"人的价值在于「正在通向什么」，而不是「已经是什么」。这句话取消了所有终点式的自我定义。","你必须有混沌，才能诞生一颗闪耀的星。":"创造的前提是先容忍无序。过早追求整齐的人，得到的通常是平庸的秩序。","人类所有的一切都可以被剥夺，唯有人类最后的自由":"集中营里得出的结论：外部可以剥夺一切，唯独不能替你选择态度。这是控制二分法最极端的一次实证。","如果生命有意义，那么苦难也有意义。":"他把逻辑倒过来用：如果承认生命有意义，就必须承认苦难也在意义之内，否则意义会在最需要它的时候失效。","我比任何人都更清楚地意识到我可能是错的。":"顶级投机者的自我定位。他的优势不是判断更准，而是纠错更快——前提是先承认自己会错。","如果投资是有趣的，如果你玩得开心，你可能没有赚到钱。真正的投资是枯燥的。":"刺激感和收益率是负相关的。让你兴奋的交易通常在满足情绪，而不是在赚钱。","我之所以富有，是因为我知道自己什么时候是错的。":"财富的来源被他归给了纠错能力，而不是预测能力。这是他和大多数人对「投资高手」理解的根本分歧。","人类是行走的触发器，很少有真正理性的决策。":"整本书的前提：人的大部分决策由固定的触发模式驱动，理性只在事后负责编理由。","最好的防御：放慢速度，问自己为什么要做这个决定。":"唯一有效的防御是时间。所有影响力技术都依赖于让你立刻决定——一旦慢下来，多数就失效了。","优秀的管理，正是导致领导企业失败的原因。":"最反直觉的结论：不是管理不善导致失败，恰恰是「听客户的、投高利润项目」这些正确动作，把资源系统性地挡在了新市场之外。","破坏性技术不是从最好的客户那里产生，而是从被忽视的客户那里产生。":"新技术最初总是更差、更便宜、利润更薄，因此最好的客户不会要它。等他们要的时候，你已经来不及了。","倾听客户的声音，可能是你能犯的最大错误。":"这句话不是反对听客户，是提醒你：客户只能告诉你他们已知的需求，而颠覆总是从他们说不清的地方开始。","成功企业的最大威胁，往往来自它们最不关注的市场。":"威胁的来源和你的注意力分布是反比的。你越不关注的市场，越没有防御，也越没有预警。","袁绍多端寡要，好谋无决，难成大事。":"郭嘉对袁绍的四字判词。「好谋无决」是最致命的一条——想得多而定不下来，等于把时间免费送给对手。","哀哉奉孝！痛哉奉孝！惜哉奉孝！":"曹操在赤壁战败后的哭喊。它的意义不在悼念，在于承认了一个人的判断力对整个组织意味着什么。","清空你的思维，无形无态，像水一样。水可以流动，也可以冲击。做水吧，我的朋友。":"最广为流传的一句。水的关键不是柔，是没有固定形状——它随容器成形，却始终是水。方法可以变，内核不能。","吸收有用的，去除无用的，加入自己独特的。":"三步学习法：吸收、去除、独创。多数人只做第一步，于是收藏了一堆别人的方法，没有一样是自己的。","认识自我是所有知识中最重要的。":"所有「吸收有用的」都以这句为前提——不知道自己是谁，就无法判断什么对你有用。","不要在脑子里想太多，用感觉去打。":"针对的是过度分析。在需要临场反应的场合，思考是延迟；只有已经内化进身体的东西才用得上。","如果你花太多时间思考一件事，你就永远无法完成它。":"完美主义的解药。想得越久，行动的门槛被自己抬得越高，最后卡在启动这一步。","我不怕一个练了一万种踢法的人，我怕一个把同一种踢法练了一万次的人。":"一万种和一万次的差别。前者是广度的幻觉，后者是深度的复利——真正的威胁永远来自后者。","人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。":"司马迁受宫刑后活下去的理由。他把死的意义交给了「用之所趋」——不是死本身，是你为什么而死。","究天人之际，通古今之变，成一家之言。":"他给自己定的三个目标：理解规律、看清变化、写出判断。最后一句最勇敢——他承认自己有立场，然后诚实地写出来。","天下熙熙，皆为利来；天下攘攘，皆为利往。":"在重农抑商的年代承认逐利是常态。这不是讽刺，是他为商业行为做的正名。","才德全尽谓之圣人，才德兼亡谓之愚人，德胜才谓之君子，才胜德谓之小人。":"司马光的用人四象限。最重要的判断是：德胜才可用，才胜德最危险——因为能力会放大品行的方向。","臣闻天子之职莫大于礼，礼莫大于分，分莫大于名。":"整部《资治通鉴》的开篇立论。名分不是虚礼，是秩序的最小单位——名一乱，后面全乱。","成为你希望在世界上看到的改变。":"最常被印在海报上、也最常被误解的一句。它的重点不是号召别人，是把改变的起点强行拉回自己身上。","非暴力是人类可以支配的最强大的力量，它比人类发明的最强大的武器更强大。":"非暴力在他这里不是道德姿态，是策略：它让施暴者失去正当性，把对抗的战场从力量转移到舆论。","先他们忽视你，然后他们嘲笑你，然后他们攻击你，然后你赢了。":"一条运动的四阶段路线图。它真正的用处是在第二、三阶段——被嘲笑和被攻击时，知道这是进度而不是失败。","弱者永远无法宽恕，宽恕是强者的特质。":"宽恕被他重新定义为强者的特权：只有不再需要靠仇恨支撑自己的人，才付得起宽恕的成本。","眼睛还牙齿，只会让整个世界都变瞎。":"报复的数学结果。对等报复看似公平，但它没有终止条件——每一轮都合理，整体走向毁灭。","想象力比知识更重要，因为知识是有限的，而想象力包围着整个世界。":"知识是存量，想象力是生成能力。前者有边界，后者没有——这是他给创造力排的序。","如果你无法简单地解释它，说明你还没有真正理解它。":"检验理解的唯一标准。讲不简单，通常不是听众的问题，是你自己还停在术语层面。","我没有特别的才华，我只是有强烈的好奇心。":"他把自己的成就归因于好奇心而非天赋。这不是谦虚——好奇心是可以选择的，天赋不是。","逻辑会把你从A带到B，想象力能带你去任何地方。":"逻辑负责验证，想象负责提出。只有逻辑的人永远走不出已知的范围。","上帝不掷骰子。（他对量子力学概率解释的抗议":"他一生最著名的一次判断失误。这句话值得记住的是：即使是他，也会因为审美偏好而拒绝正确的理论。","我不知道第三次世界大战会用什么武器打，但第四次世界大战一定是用石头和棍子打的。":"关于核武器最冷的一句预言。它不预测战争，它预测的是文明可以被打回原点。","治世不一道，便国不法古。":"变法的合法性宣言：治理没有唯一正确的方法，对国家有利就不必效法古人。这句话的代价是他自己的命。","利不百，不变法；功不十，不易器。":"变法者少有的克制：收益不到百倍不改法，不到十倍不换工具。改革本身是有成本的，随便改比不改更坏。","宁为乡村第一，不为罗马第二。":"路过一个小镇时说的。它揭示了一种偏好：宁可在小池塘做主导者，也不在大池塘做从属——因为主导权才能积累。","当我走出监狱大门，我知道如果我不能把悲痛和仇恨留在身后，我就仍然是个囚徒。":"走出监狱那天的自述。这句话把「自由」重新定义为一种内在状态——牢门打开不等于出狱。","教育是可以改变世界的最强大武器。":"他把教育当成武器而非福利。因为教育改变的是下一代的选择集，这是唯一不可逆的改变。","仇恨就像喝下毒药，却期待对方死去。":"仇恨的代谢逻辑：它伤害的是持有它的那个人，而对象往往毫无察觉。","勇敢不是没有恐惧，而是判断还有比恐惧更重要的事情。":"勇敢的定义被他改写：不是消除恐惧，是在恐惧仍然存在时，判断出有更重要的事。","战略是决定在哪里作战，战术是决定怎么作战。":"两个层级不能混：选错战场，战术再好也只是把败仗打得漂亮一点。多数人的努力都花在下面那一层。","一个好的将军，胜在最后五分钟还能思考清楚。":"混乱中保持思考的能力，比任何计划都值钱。因为所有计划都会在接触敌人后的第五分钟失效。","今日胜昨日之我，明日胜不如我者":"两条不同的标尺：和昨天的自己比是纵向，和不如自己的人比是横向。他把纵向放在前面。","不执着于一种武器，不执着于一种思想。":"反对路径依赖的极简表述。武器和思想一样，一旦成为身份的一部分，就会开始限制你。","兵法之道，即万事万物之道。":"他把剑术升格为通用方法论：任何一门技艺练到底，得到的都不是技巧，而是处理不确定性的方式。","以千日之功，磨一日之锋。":"千日与一日的比例，就是准备和发挥的真实配比。真正的较量早在那一天之前就分出了胜负。","空者，无形无相，不可捉摸，却包容万物。":"《五轮书》最后一卷。「空」不是虚无，是不预设——留出空位，才能装下当下真实发生的东西。","吾生也有涯，而知也无涯。以有涯随无涯，殆已。":"常被断章取义成劝学，原意恰好相反：知识无限而生命有限，用有限追无限是危险的。重点是选择，不是勤奋。","人皆知有用之用，而莫知无用之用也。":"无用之用的经济学：所有留白、闲置和看似浪费的部分，恰恰是系统抗压和转向的余量。","井蛙不可以语于海者，拘于虚也；夏虫不可以语于冰者，笃于时也。":"两种认知牢笼：空间的和时间的。而被困住的人无法意识到自己被困——这才是这句话真正的锋利处。","君子之交淡若水，小人之交甘若醴。":"关系的浓度和寿命成反比。太甜的开始通常靠情绪支撑，而情绪是会退潮的。","相濡以沫，不如相忘于江湖。":"最被误读成凉薄的一句。它说的是：与其在困境里互相消耗以维系关系，不如各自回到能自由呼吸的地方。","至人之用心若镜，不将不迎，应而不藏，故能胜物而不伤。":"心如镜的三个动作：不迎、不留、不藏。镜子照物但不占有物，所以永远不会被它照过的东西损伤。","权，借物也，召之即来，挥之即去。":"郭子仪对权力的定性：它是借来的东西，不是你的资产。凡是把借来的当自己的人，都在等归还的那一天。","如果你想说服别人，要诉诸利益，而非诉诸理性。":"说服的第一原理。诉诸理性是在要求对方否定自己，诉诸利益是给对方一个改变立场的台阶。","不要把今天能做的事拖到明天。":"他把这条写进了每日清单。它的价值不在勤奋，在于拖延会让任务的成本随时间上升。","有些人25岁就死了，只是到75岁才埋。":"最锋利的一句。它区分了「活着」和「在过日子」——很多人在某个时点停止了更新，之后只是在重复。","市场短期是投票机，长期是称重机。":"整个价值投资的地基：短期价格由人气决定，长期价格由内在价值决定。所有痛苦都来自把两者的时间尺度搞混。","聪明的投资者是现实主义者，他们向乐观主义者卖出股票，并从悲观主义者手中买进股票。":"交易的对手盘永远是情绪。他把买卖双方描述成两种情绪状态，而你的收益就来自这两种情绪的差值。","你是对的，是因为你的数据和推理是对的":"这句话切断了「市场认可」和「判断正确」之间的联系。对错由证据决定，而不是由是否被人同意决定。","投资者最大的敌人，很可能就是他自己。":"敌人不在市场里，在你自己的反应模式里。这也是为什么方法可以公开，收益却无法复制。","牛市是普通投资者亏损的主要原因。":"反直觉但可验证：牛市让人误以为收益来自能力，于是加杠杆、放宽标准，最终在下一轮全部还回去。","华尔街没有新鲜事，因为投机像山岳一样古老。":"人性不变，所以模式重复。这句话既是安慰也是警告——历史会重演，包括你上次犯的那个错。","赚大钱靠的不是思考，而是坐功。能同时做到判断正确又坚持不动的人极为罕见。":"「坐功」两个字是全书重点。判断正确只是入场券，能在正确的判断上一动不动，才是收益的真正来源。","市场永远不会错，只有人的判断会错。":"市场没有义务符合你的逻辑。当两者冲突时，需要修改的永远是你的判断，而不是等市场认错。","投机者的致命敌人是：无知、贪婪、恐惧和希望。":"四个敌人里最隐蔽的是「希望」——它让人在应该止损的时候继续持有，并称之为坚持。","一个人若不犯错，一个月内就能拥有整个世界；但他若不从错误中吸取教训，就连一样东西也留不住。":"两句连读才完整：犯错不致命，不从错误里提取教训才致命。前者是学费，后者是复购。","我们对显而易见的事视而不见，而且对自己的视而不见也视而不见。":"双重盲区：看不见，且不知道自己看不见。这是所有认知偏差里最难自救的一种。","任何事都不如你正在想它时显得那么重要。":"聚焦错觉。任何被你正在思考的事情，都会自动获得夸大的重要性——所以重大决定不要在情绪现场做。","自信是一种感觉，它反映的是故事的连贯性，而不是证据的质量。":"自信被拆穿了：它衡量的是故事讲得顺不顺，而不是证据够不够。讲得越顺，越该警惕。","人类的大脑是一台急于下结论的机器。":"系统1的默认行为是用现有信息拼出一个完整故事，而不是承认信息不足。缺失的部分它会自己补。","要相信别人比你更容易看清你的错误。":"旁观者没有你的自我保护机制。这句话的实用价值是：主动去找那个会直说的人，并且不要反驳他。","群体中累积的只有愚蠢，而不是天生的智慧。":"群体的智力不做加法。它取的是下限而不是平均，因为能被所有人接受的，只有最简单的那一层。","群体不善推理，却急于采取行动。":"群体最危险的组合：判断力下降的同时行动力上升。这解释了绝大多数集体性灾难。","影响大众想象力的，不是事实本身，而是它呈现的方式。":"传播的关键在形式而非事实。同一个事实换一种呈现方式，效果可以相反——这既是宣传术，也是防御的起点。","群体因为夸大自己的感情，所以只会被极端感情打动。":"群体的情绪没有中间档。温和、复杂、有保留的表达在群体里传不动，只有极端的能传开。","做作和辞藻华丽的东西对群体的影响，远胜逻辑。":"对逻辑最不客气的一句。它提醒你：在面向大众的场合，讲道理往往输给讲得好听。","你的利润率就是我的机会。":"对亚马逊商业模式最精炼的概括。他人的高毛利被他视为一片尚未被效率打穿的空白地。","聪明是一种天赋，而善良是一种选择。":"天赋不需要负责，选择需要。这句话把善良从性格问题挪到了责任问题。","如果你把眼光放到未来三年，和你竞争的人很多；如果你能看到未来七年，和你竞争的人就很少了。":"时间维度就是竞争壁垒。看得越远，愿意陪你走的对手越少，因为大部分组织无法承受那么长的不确定。","要以传教士的心态创业，而不是雇佣兵的心态。":"两种动机在顺境里看不出差别，只在长期低谷时分化：传教士留下来，雇佣兵会离开。","失败和发明是一对不可分割的双胞胎。":"发明的成功率天然很低，所以想要更多发明，只能先接受更多失败。想两者兼得的组织最后什么都没有。","系统的行为，不能只靠了解构成它的元素来理解。":"整本书的第一原理：把每个元素都研究透，仍然预测不了系统的行为——因为行为产生于连接方式，不是元素本身。","人们凭直觉就能找到杠杆点……然后所有人都在拼命朝错误的方向推。":"人的直觉能找到关键杠杆点，但推的方向常常是反的。这是全书最具反讽意味的一句。","我们无法控制系统，也无法彻底搞懂它。但我们可以与它共舞。":"她给出的不是控制方案，是相处方案。承认系统不可完全掌控，反而是有效干预的起点。","对于一个坏政府来说，最危险的时刻通常就是它开始改革的时刻。":"托克维尔最著名的判断：改革释放了希望，希望改变了忍耐的基准线。这既是历史规律，也是任何组织变革的风险提示。","被革命摧毁的政权，几乎总是比它前面的那个政权更好。":"革命的悖论：被推翻的往往是那个已经开始松动、变好的政权，而不是最坏的那个。","人们耐心忍受着苦难，以为这是不可避免的；可是一旦有人提出可以摆脱它，这苦难就立刻变得无法忍受。":"忍耐力不取决于苦难的绝对量，而取决于是否存在可替代的想象。一旦出现替代方案，原来的处境立刻不可接受。","战争无非是政治用另一种手段的延续。":"《战争论》最重要的一句。它把战争降级为工具——一旦脱离政治目的，军事上的胜利可以毫无意义。","战争中的一切都很简单，但最简单的事也是困难的；这些困难累积起来，就产生了一种摩擦。":"「摩擦」是他造的概念：单个动作都不难，难的是在真实世界里累积起来的阻力。这解释了所有计划为什么会走样。","战争是不确定性的王国。行动所依据的东西，有四分之三笼罩在或大或小的迷雾之中。":"四分之三笼罩在迷雾里。这个比例是他给指挥官的心理准备——决策永远在信息不足的条件下做出。","约束对手的能力，往往取决于约束自己的能力。":"承诺的悖论：让自己失去选择，反而增加了对别人的约束力。烧掉退路是一种谈判资产。","威慑的力量不在于拥有毁灭的能力，而在于让对方相信你会使用它。":"威慑的真正门槛不是能力，是可信度。所有威慑失败都失败在对方不相信你真的会执行。","有一种威胁把一部分结果交给了偶然":"他称之为「留有余地的威胁」。把结果部分交给偶然，反而比明确的承诺更有威慑力——因为对方无法赌你的理性。","凡百贸易均着不得欺字，药业关系性命，尤为万不可欺。":"胡庆余堂的「戒欺」匾额，他亲笔所撰。值得注意的是：他在经营上说到做到，但在结构上给自己留了致命的杠杆。","我们的晚餐并非来自屠夫、酿酒师或面包师的恩惠，而是出于他们对自身利益的考虑。":"整本《国富论》最有名的一句。它不是在赞美自私，而是在指出：可靠的协作建立在利益一致上，而不是善意上。","同行的人很少聚在一起，哪怕只是为了娱乐消遣，但他们的谈话最后总是以合谋对付公众、或是密谋抬高价格告终。":"斯密对商人的警惕远超后世对他的印象。反垄断的思想源头就在这句话里。","消费是一切生产的唯一目的，而生产者的利益，只有在能促进消费者利益时才应当被照顾。":"一句被后世不断忽略的立场声明：生产者的利益不是目的，只有当它服务于消费者时才值得保护。","困扰人的不是事情本身，而是人们对事情的看法。":"认知行为疗法的源头。事件是中性的，痛苦产生在事件和「这对我很糟」这个判断之间——而判断是可以修改的。","有些事在我们能力之内，有些不在。在我们能力之内的是判断、意图、欲望和厌恶":"《手册》开篇第一句。几乎所有痛苦都来自把第二类误当成第一类，练习就是持续地重新分类归位。","不要说「我失去了它」，要说「我把它还回去了」。":"把「拥有」换成「保管」。这不是叫人冷漠，是把珍惜和占有分开——占有的人一失去就崩，保管的人失去了还完整。","你可以锁住我的腿，但连宙斯也夺不走我的意志。":"面对暴君威胁时的回答。它划出了那条谁也越不过的界线：身体可以被支配，判断不能。","智不足与权变，勇不足以决断，仁不能以取予，强不能有所守，虽欲学吾术，终不告之矣。":"他收学生的四条门槛，缺一样就不教。前两条决定你能不能赚到，后两条决定你能不能留住——多数人死在后两条。","吾治生产，犹伊尹、吕尚之谋，孙吴用兵，商鞅行法是也。":"在重农抑商的战国说这句话，是一次身份宣言：经商是有原理、有纪律、可以传授的技艺，不是投机取巧。","如果我们被踢出去，董事会找来一个新 CEO，他会怎么做？那我们为什么不自己走出这扇门，再走回来，然后自己干这件事？":"英特尔转型时他问安迪·摩尔的那句话。它的作用是强行剥离沉没成本——用新CEO的视角，看你自己今天该做什么。","坏消息传播得越快，越有可能被处理。":"组织健康度的核心指标。坏消息的传播速度，决定了你在问题变成灾难之前还剩多少时间。","经理人的产出，等于他直接管辖的组织的产出，加上他间接影响的组织的产出。":"他给管理者产出下的定义。它否定了「我自己很忙」这种自我安慰——你的产出不在你手上，在别人手上。","战略转折点到来时，它看起来只是一个糟糕的季度。":"最难的地方在于它的伪装。真正的转折点不会宣布自己到来，它看起来只是运气不好的一个季度。","泡沫时期的浪费，是社会为快速建成新基础设施所支付的代价。":"对泡沫最不带道德判断的一句解释。铁路、光纤、算力都是这样铺出来的——钱亏掉了，基础设施留下来了。","每一次技术革命，都要先经历一场金融狂热，才能到达它的黄金时代。":"她的两阶段模型：狂热期负责融资和铺设，黄金期负责普及和收获。跳过前者，后者不会到来。","技术革命需要二三十年的动荡，才能完成对社会制度的重塑。":"技术本身几年就成熟，难的是制度、组织和习惯跟上来——这个时差就是二三十年动荡的来源。","我们也许永远不知道要去往何方，但最好明白我们身在何处。":"他对「预测」和「定位」的切割。预测未来做不到，但判断当下处在周期哪一格是可以做到的。","买得好，比买好的更重要。":"把注意力从标的质量挪到买入价格。再好的资产，买贵了也会变成差投资——这是他和成长派最大的分歧。","投资中最危险的一句话是：这次不一样。":"周期的每一次顶部都伴随这句话。它的出现本身，就是最可靠的过热信号。","风险不是波动，风险是永久性损失的可能。":"对风险的重新定义。波动会自己恢复，永久性损失不会——把两者混为一谈，是大多数风险模型的根本错误。","没有人会因为你不挥棒而判你出局。":"借棒球说仓位。市场不强迫你出手，空仓不算失误——但大多数人受不了长期不动。","下不欺于地，中不欺于人，上不欺于天。":"《长乐老自叙》里的自我辩护。三个「不欺」回避了最关键的一条：对君主的忠。这正是后世骂他的地方。","此时百姓，佛再出救不得，惟皇帝救得。":"契丹灭晋后他对耶律德光说的话。用奉承换生民，是他最被认可的一次操作，也是他全部争议的浓缩。","但知行好事，莫要问前程。":"他一生的行事准则。它可以理解为务实的善，也可以理解为对是非的回避——这正是冯道难评的原因。","菩提本无树，明镜亦非台，本来无一物，何处惹尘埃。":"针对神秀的「时时勤拂拭」而作。他的主张是：本来就没有需要擦的东西，问题不在灰尘，在于你认为有镜子。","佛法在世间，不离世间觉；离世觅菩提，恰如求兔角。":"禅宗最重要的一次落地。修行不在别处，就在日常之中——离开世间去找觉悟，等于找兔子的角。","不是风动，不是幡动，仁者心动。":"风幡之争。他把争论从外部现象拉回观察者本身——你争的从来不是事实，是你对事实的反应。","于诸境上心不染，曰无念。":"「无念」不是没有念头，是念头经过而不沾附。这和斯多葛的「不将不迎」是同一种心法。","前念迷即凡夫，后念悟即佛。":"顿悟的时间尺度：不是多年苦修，是一个念头的转向。这也意味着，它随时可以发生，也随时可能退回去。","口者，心之门户也；心者，神之主也。":"把嘴定义成门，而不是出口。门的意义在于可开可关，而多数人的门一直敞着——你说出去的每一句，都在替对方描绘你的内部结构。","与智者言依于博，与拙者言依于辨，与辨者言依于要，与贵者言依于势。":"同一件事对四种人有四种讲法。它不是圆滑，是承认：内容能不能被接住，取决于对方的接口，而不是取决于你讲得对不对。","事贵制人，而不贵见制于人。":"全书的落点。主动权不在于谁说得多，在于谁定义议题、谁掌握节奏、谁决定什么时候结束这一局。","故知之始己，自知而后知人也。":"读人的顺序是从自己开始。看不清自己的动机和偏好，读到的所有人都会被自己的投影污染一遍。","我们的美德常常只是伪装起来的恶德。":"他不是说美德不存在，是说别用行为反推动机。一个人一贯大方，只证明大方对他划算；环境一变，划算的方向就变了。","我们都有足够的力量去忍受别人的不幸。":"全书最冷的一句。它解释了为什么安慰总显得轻飘，也解释了真正的支持为什么稀缺——它要求人付出自己本不必付出的代价。","拒绝赞美，其实是想被赞美第二次。":"很多看起来是退让的动作，本质是加价。识别方法很简单：看这个动作有没有给对方留下一个必须回应的空位。","自爱是世上最大的谄媚者，它比世上最巧妙的人还要巧妙。":"自爱不断向你汇报你是个什么样的人，而汇报的内容永远对你有利。它比任何外部的奉承都更难察觉，因为它用的是你自己的声音。","创业只有一个致命错误：做了没有人想要的东西。":"其余所有问题都是可以修的。融资顺利、团队豪华、发布会漂亮，都无法补偿这一条；而这一条成立，别的错误大多还有时间改。","先去做那些无法规模化的事，这是通往规模的唯一路径。":"早期的低效不是浪费。在确认有人真的想要之前，任何自动增长的机器都只是一个昂贵的假设。","与其让很多人有点喜欢你，不如让很少的人非常爱你。":"一百个爱你的用户会告诉你为什么爱、替你传播、容忍你的粗糙；一万个觉得还行的用户只会安静消失，什么都不留下。","最好的创业想法是：你自己想要、你自己能做，而别人没意识到它值得做。":"三条缺一条都危险：不是自己想要就判断不了细节，做不了就只能空想，别人都觉得值得做的地方早就挤满了。","一个会议，可以毁掉一整个下午。":"损失的不是那一小时，是整个下午——因为剩下的两段都不够长到重新进入状态。时间的价值不在总量，在连续性。","松下电器是制造人才的公司，兼做电器生意。":"这句话被无数公司抄成标语，但他是当真的：他把培养判断力当成主产品，把电器当成副产品，然后按这个顺序分配资源。","生意人的使命，是让宝贵的生活物资像自来水一样取之不尽、用之不竭。":"使命一旦定到这个程度，很多具体争论就自动有了答案——该不该降价、该不该走量，不需要每次重新讨论一遍。","我有三个恩惠：家贫、体弱、没上过学。":"三样都是短板：家贫让他知道钱怎么来，体弱逼他授权，没学历逼他请教。短板本身不值钱，把短板转成组织能力才值钱。","越是不景气的时候，越要靠经营的力量。":"顺境掩盖一切经营问题，逆境把它们全部显影。所以萧条不是要熬过去的坏天气，是一次强制体检。","有限游戏以取胜为目的，无限游戏以延续游戏为目的。":"全书的地基。把无限游戏当有限游戏打的人，会在赢的那一天忽然不知道该干什么——因为他一直在为一个不存在的终点做准备。","有限游戏的参与者在边界内游戏，无限游戏的参与者与边界游戏。":"两种关系：一种把规则当前提，一种把规则当对象。所有真正的突破都发生在第二种人身上。","有限游戏的参与者为了权力而参赛，无限游戏的参与者凭借力量而参赛。":"权力是别人给你的头衔，可以被收回；力量不需要承认，也无法被剥夺。头衔换掉之后还剩下的，才是后者。","有限游戏的规则不可改变，无限游戏的规则必须改变。":"最锋利的一条。所有「我们一直是这么做的」，都是在把一个本来无限的游戏，悄悄降级成一个会结束的游戏。","各族群的历史循着不同的轨迹展开，是环境的差异，而不是人的生物学差异。":"整本书的论点，也是一条归因纪律：看到巨大的结果差距，先往回退两步找初始条件，而不是停在人的素质上。","可驯化的动物都是相似的，每一种不可驯化的动物各有各的不可驯化之处。":"成功需要所有条件同时满足，失败只需要缺一样。这条「安娜·卡列尼娜原则」在驯化之外同样成立。","征服美洲的主力不是枪炮，而是随征服者一起到达的病菌。":"最反直觉也最确凿的一条。看得见的武器往往不是胜负手，真正起决定作用的力量通常不在现场被看见。","历史上最大的那些模式，是由各大陆环境的差异塑造的。":"尺度越大，个人和文化的解释力越弱，结构性条件的解释力越强。这也是他和制度学派争论的真正焦点。"};

// 打散出处：把每个出处的 k 条按 N/k 的步长在「环」上均匀布点（序列会循环，
// 所以必须按环处理，否则最大的组会同时占住首尾两端）。确定性，无随机。
function dqInterleave(list){
  const g=new Map();
  list.forEach(q=>{if(!g.has(q.n))g.set(q.n,[]);g.get(q.n).push(q);});
  const groups=[...g.entries()].sort((a,b)=>b[1].length-a[1].length||(a[0]<b[0]?-1:a[0]>b[0]?1:0));
  const N=list.length,out=new Array(N).fill(null);
  let cursor=0;
  for(const e of groups){
    const arr=e[1],k=arr.length,step=N/k;
    for(let j=0;j<k;j++){
      const want=Math.round(cursor+j*step)%N;
      let p=want,d=0;
      while(out[p]!==null){d++;p=(want+(d%2?(d+1)/2:-d/2)+N*2)%N;}   // 就近找空位，左右交替
      out[p]=arr[j];
    }
    cursor=(cursor+1)%N;
  }
  // 环形收尾：若仍有相邻同出处，与一个安全位置对调
  for(let i=0;i<N;i++){
    const a=out[i],b=out[(i+1)%N];
    if(a.n!==b.n)continue;
    for(let d=2;d<N;d++){
      const j=(i+d)%N,pv=out[(j-1+N)%N],nx=out[(j+1)%N];
      if(pv.n===b.n||nx.n===b.n)continue;
      const pb=out[i],nb=out[(i+2)%N];
      if(out[j].n===pb.n||out[j].n===nb.n)continue;
      const t=out[(i+1)%N];out[(i+1)%N]=out[j];out[j]=t;break;
    }
  }
  return out;
}
