<style>
:root{
  color-scheme:light only;
  --white:#fffdf8;--paper:#f7f4ec;--paper2:#efe8dc;
  --ink:#1c1917;--ink-70:#3a342f;--ink-50:#6b6358;--ink-30:#9a9184;
  --up:#9d2933;--sulfur:#f0ddd9;--up-bg:rgba(157,41,51,.12);
  --down:#9d2933;--down-bg:rgba(157,41,51,.10);
  --line:rgba(42,46,44,.08);--line-strong:rgba(42,46,44,.12);--line-2:rgba(42,46,44,.045);
  --tint:rgba(42,46,44,.03);--tint-hover:rgba(42,46,44,.055);
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-out-quart:cubic-bezier(0.25,1,0.5,1);
  --ease-spring:cubic-bezier(0.34,1.4,0.64,1);
  --dur-tap:100ms;--dur-fast:150ms;--dur-base:200ms;--dur-slow:260ms;
  --shadow-card:0 0 0 1px var(--line),0 1px 2px rgba(42,46,44,.04),0 4px 12px rgba(42,46,44,.02);
  --shadow-card-hover:0 0 0 1px var(--line-strong),0 2px 4px rgba(42,46,44,.05),0 8px 24px rgba(42,46,44,.05);
  --shadow-focus:0 0 0 3px rgba(42,46,44,.16);
  --glass-chrome:rgba(240,240,236,.72);--glass-light:rgba(250,250,247,.85);
  --r1:8px;--r2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-optical-sizing:auto;line-height:1.55;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 96px}

/* skip-link + focus */
.skip-link{position:absolute;left:12px;top:-52px;z-index:100;padding:8px 16px;background:var(--ink);color:var(--white);border-radius:6px;font-size:13px;font-weight:600;text-decoration:none;transition:top var(--dur-base) var(--ease-out-quart)}
.skip-link:focus{top:12px;outline:none}
:focus-visible{box-shadow:var(--shadow-focus);outline:none;border-radius:5px}

/* masthead — glass sticky */
/* unified brand lockup — match entry pages / yuansheng */
/* responsive lockup */
/* 页头的字号/尺寸/左右内距由 assets/hw-home-lockup.css 以 !important 统一接管，
   这里再写一遍不会生效（曾经写过，DESIGN.md 也照抄成了规范）。下面只保留
   lockup 没管的属性：white-space。改页头请改 hw-home-lockup.css。
   小屏左右留白 24px 是选定的宽松版，不是漏改——原来那条 16px 的对比图看过后
   决定不采用，别再补回来。见 DESIGN.md §7「留白宽松是选定的」。 */
@media(max-width:720px){
  .brand-lockup{align-items:flex-start}
  .hd-title{white-space:nowrap}
  .hd-en{margin:0;font-size:12.5px}
}
@media(max-width:480px){
  .hd-title{white-space:normal}
}

.hd{position:relative;z-index:50;margin:0 0 28px;padding:clamp(36px,6vw,64px) 0 22px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.hd::after{display:none}
.brand-lockup{display:flex;align-items:flex-start;gap:14px;text-decoration:none;color:inherit;margin:0 0 14px}
.brand-lockup:hover{color:inherit}
.brand-logo{width:44px;height:44px;border-radius:11px;flex:none;box-shadow:0 1px 0 rgba(28,25,23,.06)}
.brand-copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.hd-title{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;font-size:clamp(22px,4.2vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hd-title .dot{color:#9d2933}
.hd-en{font-size:13.5px;color:var(--ink-50);letter-spacing:0;font-weight:400;margin:0}
.hd-row{display:none}
.hd .brand{display:none}
@media(max-width:600px){
  .wrap{padding:0 24px 8px}
  .hd{margin:0 0 22px;padding:22px 0 8px}
  .hd-en{margin-left:0}
}

.hd{position:sticky;top:0;z-index:50;margin:0 -24px 26px;padding:26px 24px 15px;background:var(--glass-chrome);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.hd::after{content:'';position:absolute;left:24px;right:24px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(42,46,44,.10),transparent)}
.brand{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-50);margin-bottom:11px}
.hd-row{display:flex;align-items:baseline;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.hd-title{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hd-en{font-size:13px;color:var(--ink-50);letter-spacing:-.005em;font-weight:400}
.hd-stats{display:none}.share-btn{font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--white);color:var(--ink);cursor:pointer}.share-btn:active{transform:scale(.97)}
.stat{font-size:12px;color:var(--ink-50);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:160px;padding:9px 14px;border:none;border-radius:var(--r1);background:var(--white);box-shadow:var(--shadow-card);color:var(--ink);font-size:14px;font-family:inherit;transition:box-shadow var(--dur-base) var(--ease-out-quart)}
#q:focus{outline:none;box-shadow:var(--shadow-card-hover)}
#q::placeholder{color:var(--ink-30)}
.ctxt{font-size:12px;color:var(--ink-50);white-space:nowrap;font-variant-numeric:tabular-nums}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.tab{padding:6px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;background:var(--white);color:var(--ink-70);box-shadow:0 0 0 1px var(--line);transition:color var(--dur-fast) var(--ease-out-quart),background var(--dur-fast) var(--ease-out-quart),box-shadow var(--dur-fast) var(--ease-out-quart);white-space:nowrap;user-select:none}
.tab.on{background:var(--ink);color:var(--white);box-shadow:none}
@media (hover:hover) and (pointer:fine){.tab:not(.on):hover{color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}}

/* timeline */
.era-block{margin-bottom:34px}
.era-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.era-label{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--ink-50);white-space:nowrap;padding:3px 10px;border-radius:20px;background:var(--tint);font-variant-numeric:tabular-nums}
.era-count{font-size:10px;color:var(--ink-30);white-space:nowrap;font-variant-numeric:tabular-nums}
.era-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(42,46,44,.10),transparent)}
.era-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tl-card{padding:13px 14px;border-radius:12px;background:var(--white);box-shadow:var(--shadow-card);cursor:pointer;transition:box-shadow var(--dur-base) var(--ease-out-quart);text-decoration:none;color:inherit;display:block}
.tl-year{font-size:10px;color:var(--ink-30);margin-bottom:5px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tl-name{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:8px;line-height:1.25}
.tl-word{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--up-bg);color:var(--up);display:inline-block;font-weight:600}
@media (hover:hover) and (pointer:fine){.tl-card:hover{box-shadow:var(--shadow-card-hover)}}
.empty{padding:56px;text-align:center;color:var(--ink-30);font-size:14px}

/* overlay + panel */
.ov{display:none !important;position:fixed;inset:0;background:rgba(42,46,44,.32);z-index:300;overflow-y:auto;padding:40px 16px 80px;display:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.ov.open{display:block}
.panel{background:var(--white);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 12px 48px rgba(42,46,44,.14);max-width:660px;margin:0 auto;padding:36px 40px;position:relative;animation:panel-in var(--dur-slow) var(--ease-out-expo);transform-origin:center top}
@keyframes panel-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.p-x{position:absolute;top:18px;right:18px;cursor:pointer;font-size:15px;color:var(--ink-50);background:var(--tint);border:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background var(--dur-fast),color var(--dur-fast)}
@media (hover:hover) and (pointer:fine){.p-x:hover{color:var(--ink);background:var(--tint-hover)}}
.p-cat{font-size:10px;color:var(--up);font-weight:600;text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px}
.p-name{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px;line-height:1.1}
.p-era{font-size:13px;color:var(--ink-50);margin-bottom:18px;font-variant-numeric:tabular-nums}
.word-row{margin-bottom:20px}
.wpill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--up-bg);color:var(--up)}
.p-desc{font-size:15px;color:var(--ink-70);line-height:1.75;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.sec{font-size:10px;font-weight:600;color:var(--ink-50);text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px;margin-top:26px}
.story-box{padding:14px 16px;border-left:2px solid var(--sulfur);background:var(--tint);border-radius:0 var(--r1) var(--r1) 0;font-size:14px;color:var(--ink-70);line-height:1.75}
.fw-list{display:flex;flex-direction:column;gap:8px}
.fw{padding:12px 15px;border-radius:var(--r1);background:var(--tint)}
.fw-n{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:5px}
.fw-d{font-size:13.5px;color:var(--ink-70);line-height:1.7}
.fw-eg{font-size:12.5px;color:var(--ink-50);margin-top:8px;padding:7px 11px;background:var(--white);border-radius:6px;line-height:1.6}
.q-item{font-size:14px;color:var(--ink-70);line-height:1.7;padding:6px 14px;border-left:2px solid var(--line-strong);margin:6px 0;font-style:italic}
.apply-box{padding:14px 16px;border-radius:var(--r1);font-size:13.5px;color:var(--ink-70);line-height:1.7;background:var(--up-bg)}
.fail-box{padding:14px 16px;border-left:2px solid var(--down);background:var(--down-bg);border-radius:0 var(--r1) var(--r1) 0;font-size:13.5px;color:var(--ink-70);line-height:1.75}
.lesson-list{display:flex;flex-direction:column;gap:7px}
.lesson-item{font-size:13.5px;color:var(--ink-70);line-height:1.7;padding:9px 13px;border-left:2px solid var(--down);background:var(--down-bg);border-radius:0 var(--r1) var(--r1) 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12px;padding:4px 11px;border-radius:20px;color:var(--ink-70);background:var(--tint);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast)}
@media (hover:hover) and (pointer:fine){.chip:hover{background:var(--tint-hover);color:var(--ink)}}
.contrast-list{display:flex;flex-direction:column;gap:8px}
.contrast-item{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r1);background:var(--tint);cursor:pointer;transition:background var(--dur-fast);align-items:flex-start}
@media (hover:hover) and (pointer:fine){.contrast-item:hover{background:var(--tint-hover)}}
.contrast-name{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;padding-top:1px}
.contrast-arrow{font-size:12px;color:var(--ink-30);white-space:nowrap;padding-top:2px}
.contrast-why{font-size:12.5px;color:var(--ink-70);line-height:1.6;flex:1}


/* mobile */
@media(max-width:600px){
  .wrap{padding:0 24px 8px}
  .hd{margin:0 0 24px;padding:22px 0 14px}
  .hd::after{left:16px;right:16px}
  .hd-title{font-size:17px}
  .panel{padding:26px 20px;border-radius:14px}
  .p-name{font-size:25px}
  .era-cards{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}

/* accessibility triple */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (prefers-reduced-transparency:reduce){.hd{background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none}.ov{-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){.hd{border-bottom:1px solid var(--ink-70)}.tl-card,.panel{box-shadow:0 0 0 1px var(--ink-70)}}

/* ── 每日金句卡（OurWord 素纸浓墨 · 沉朱印 / 汇文明朝体） ────────────────── */

.dq{display:flex;gap:28px;align-items:center;margin:0 0 30px}
.dq-card{position:relative;flex:0 0 auto;width:320px;aspect-ratio:3/4;overflow:hidden;
  background:#f7f4ec;box-shadow:0 8px 32px rgba(0,0,0,.45)}
.dq-card canvas{display:block;width:100%;height:100%}
.dq-card.fade canvas{animation:dqfade .26s var(--ease-out-quart)}
@keyframes dqfade{from{opacity:0}to{opacity:1}}
.dq-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dq-side{flex:1 1 auto;min-width:0}
.dq-hdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dq-eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--ink-50)}
.dq-date{font-size:13px;color:var(--ink-30);font-variant-numeric:tabular-nums}
.dq-from{margin-top:14px;font-size:14px;color:var(--ink-70);line-height:1.7}
.dq-cat{font-size:13px;color:var(--ink-50);margin-top:3px}
.dq-note{margin:14px 0 0;font-size:14px;line-height:1.85;color:var(--ink-70);max-width:46em;
  padding-left:13px;border-left:2px solid var(--line-strong)}
.dq-link{background:none;border:none;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;
  border-bottom:1px solid var(--line-strong);transition:border-color var(--dur-fast) var(--ease-out-quart)}
.dq-link:hover{border-bottom-color:var(--ink)}
.dq-acts{display:flex;gap:8px;margin-top:20px}
.dq-sep{width:9px}
.dq-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line-strong);
  background:var(--white);color:var(--ink-70);border-radius:var(--r1);cursor:pointer;
  transition:transform var(--dur-tap) var(--ease-out-quart),background var(--dur-fast) var(--ease-out-quart),color var(--dur-fast) var(--ease-out-quart),border-color var(--dur-fast) var(--ease-out-quart)}
.dq-btn:hover{background:var(--tint-hover);color:var(--ink);border-color:var(--ink-30)}
.dq-btn:active{transform:scale(.97)}
.dq-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dq-toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:120;
  background:var(--ink);color:var(--white);font-size:13px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-out-quart),transform var(--dur-base) var(--ease-out-quart)}
.dq-toast.on{opacity:1;transform:translate(-50%,0)}
.dq-ov{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.88);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.dq-ov.on{display:flex}
.dq-ov img{max-width:min(360px,84vw);max-height:70vh;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.dq-ov .hint{color:#f0ddd9;font-size:13.5px;text-align:center;line-height:1.7}
.dq-ov .cls{background:none;border:1px solid #666;color:#999;font-size:13px;
  padding:9px 26px;border-radius:var(--r1);cursor:pointer;transition:transform var(--dur-tap) var(--ease-out-quart)}
.dq-ov .cls:active{transform:scale(.97)}
@media (max-width:720px){
  .dq{flex-direction:column;gap:14px;align-items:stretch;margin-bottom:26px}
  .dq-card{width:min(320px,80vw);align-self:center}
  .dq-side{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .dq-meta{min-width:0}
  .dq-from{margin-top:6px}
  .dq-cat{display:none}
  .dq-side{flex-wrap:wrap}
  .dq-note{flex:1 0 100%;order:3;margin-top:12px;font-size:13.5px;line-height:1.8}
  .dq-acts{margin-top:0;flex:0 0 auto}
}
@media (prefers-reduced-motion:reduce){.dq-card.fade canvas{animation:none}}

#hwx-theme{position:fixed;top:14px;right:14px;z-index:9999;width:36px;height:36px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:50%;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.10);padding:0}
#hwx-theme:hover{border-color:var(--acc);color:var(--acc)}
#hwx .today{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin:18px 0 6px}
@media(max-width:700px){#hwx .today{grid-template-columns:1fr}}
#hwx .tq{border:1px solid var(--line);border-radius:16px;padding:20px 22px;background:transparent;display:flex;flex-direction:column}
#hwx .tq .dt{font-size:12.5px;letter-spacing:.24em;color:var(--acc);font-weight:700;margin-bottom:6px}
#hwx .tq .q{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:clamp(20px,3.6vw,26px);font-weight:700;line-height:1.85;margin-bottom:14px}
#hwx .tq .src{font-size:13.5px;color:var(--muted)}
#hwx .tq .src a{color:var(--acc);text-decoration:none}
#hwx .tq .tgl{font-size:14.5px;line-height:1.75;color:var(--ink);opacity:.72;margin:0 0 10px}
#hwx .tq .acts{display:flex;gap:8px;margin-top:14px}
#hwx .tq .acts button{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;font-family:inherit;font-size:14px;cursor:pointer}
#hwx .tq .acts .bs{background:var(--ink);color:var(--paper)}
#hwx .askhero{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:20px 18px 16px;margin-bottom:12px}
#hwx .askhero .lb{font-size:11.5px;letter-spacing:.28em;color:var(--acc);font-weight:700;margin-bottom:12px}
#hwx .askhero .said{font-family:"Noto Serif SC","Songti SC",serif;font-size:13px;color:var(--acc);line-height:1.7;margin-bottom:10px}
#hwx .askhero .q{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:21px;font-weight:700;line-height:1.75;margin:0 0 14px}
#hwx .askhero .sc{font-size:13.5px;color:var(--muted);line-height:1.8;margin:0 0 14px;padding-left:12px;border-left:2px solid var(--line)}
#hwx .askhero .go a{display:block;text-decoration:none;color:inherit;border-top:1px dashed var(--line);padding-top:10px;margin-top:8px}
#hwx .askhero .go b{font-family:"Noto Serif SC","Songti SC",serif;font-size:15.5px;display:block}
#hwx .askhero .go i{font-style:normal;font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
#hwx .today .tq{padding:15px 16px}
#hwx .today .tq .q{font-size:17px!important;line-height:1.8!important;margin-bottom:8px!important}
#hwx .today .tq .tgl{display:none}
#hwx .today .tq .acts button{padding:5px 12px;font-size:12.5px;border-width:1px}
#hwx .today .tq .acts .bs{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#hwx .tbox-s{padding:12px 14px}
#hwx .tbox-s b{font-size:15px}
#hwx .tbox-s .hint2{display:none}
#hwx .tcol{display:flex;flex-direction:column;gap:14px}
#hwx .tbox{border:1px solid var(--line);border-radius:16px;padding:14px 16px;flex:1}
#hwx .tbox .lb{font-size:11.5px;letter-spacing:.28em;color:var(--acc);font-weight:700;margin-bottom:6px}
#hwx .tbox a{color:inherit;text-decoration:none;display:block}
#hwx .tbox b{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:16.5px}
#hwx .tbox .hint{display:block;font-size:14.5px;color:var(--ink);opacity:.72;margin-top:4px;line-height:1.65}
#hwx .tbox .hint2{display:block;font-size:14px;color:var(--acc);opacity:.92;margin-top:6px;line-height:1.6}
#hwx .hh{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:21px;font-weight:700;margin:24px 0 10px;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline}
#hwx .hh .ct{font-size:12px;color:var(--muted);font-weight:500}
#hwx .sc{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
#hwx .scmore{order:9999;flex:0 0 auto;border:1px dashed var(--line);background:transparent;color:var(--acc);border-radius:999px;padding:7px 14px;font-family:inherit;font-size:14.5px;cursor:pointer;white-space:nowrap;line-height:1.6}
#hwx .scmore:hover{border-color:var(--acc)}
/* 组名独占一行。试过与标签同行以省高度，结果组名混在标签流里像半个标签，
   比原来更乱——高度靠「每组只露 2 个」和紧凑的行距来收，不靠挤掉标题。 */
#hwx .scg{flex:0 0 100%;font-family:"Noto Serif SC","Songti SC",serif;font-size:11.5px;color:var(--muted);letter-spacing:.1em;margin:9px 0 -2px;padding:0;line-height:1.4}
#hwx .scg:first-child{margin-top:0}
#hwx .sc{row-gap:7px}
#hwx .sc{flex-wrap:wrap!important;overflow-x:visible!important}
#hwx .sc button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:7px 14px;font-family:inherit;font-size:14.5px;cursor:pointer;white-space:nowrap}
#hwx .sc button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#hwx .res{display:none;border-left:3px solid var(--acc);padding:4px 0 4px 13px;margin:8px 0 6px}
#hwx .res.on{display:block}
#hwx .res .qz{margin:0 0 14px}
#hwx .res .qz:last-child{margin-bottom:2px}
#hwx .res .qzq{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:16px;font-weight:700;line-height:1.6;margin-bottom:4px}
#hwx .res .qzq::before{content:"？";color:var(--acc);font-weight:900;margin-right:5px}
#hwx .res a{display:block;padding:4px 0 4px 16px;text-decoration:none;color:inherit}
#hwx .res a b{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:15px;font-weight:600}
#hwx .res a span{display:block;font-size:13.5px;color:var(--muted);line-height:1.6}
#hwx .res a:hover b{border-bottom:1px solid}
#hwx .hist{display:none;align-items:center;gap:8px;margin:0 0 14px;font-size:13px}
header.hd{margin-bottom:12px!important}
#hwx .hist .hl{color:var(--acc);font-weight:700;letter-spacing:.1em;flex:0 0 auto}
#hwx .hist .hchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
#hwx .hist .hchips::-webkit-scrollbar{display:none}
#hwx .hist .hchips a{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--muted);text-decoration:none;white-space:nowrap}
#hwx .hist .hchips a:hover{color:var(--ink)}
#hwx .hist button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:11px;cursor:pointer;flex:0 0 auto}
#hwx .qbar{margin:22px 0 0}
#hwx .qbar input{width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:12px 20px;font-family:inherit;font-size:16px;outline:none;transition:border-color .15s}\n#hwx .qbar input:focus{border-color:var(--muted)}
#hwx .qbar input::placeholder{color:var(--muted)}
/* 一行入口：两行结构（标题+计数 / 提示语），替代原先 1049px 的标签目录。
   试过 flex 单行，三段挤在一起且箭头折行——中文没有词间空格，靠 gap 撑不开。 */
#hwx .scline{display:block;width:100%;background:transparent;border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 2px;margin:16px 0 0;cursor:pointer;color:inherit;text-align:left;font-family:inherit}
#hwx .scline b{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700;margin-right:10px}
#hwx .scline span{font-size:12.5px;color:var(--muted)}
#hwx .scline i{display:block;font-style:normal;margin-top:6px;font-size:13px;color:var(--acc)}
#hwx .tabs2{flex-shrink:0}
#hwx .tabs2{display:flex;gap:0;border-bottom:2px solid var(--line);margin:14px 0 0}
#hwx .tabs2 button{border:none;background:transparent;padding:9px 20px;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:17px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
#hwx .tabs2 button.on{color:var(--ink);border-bottom-color:var(--acc)}
#hwx .cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0 0}
#hwx .cats::-webkit-scrollbar{display:none}
#hwx .cats button{flex:0 0 auto;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer;padding:5px 11px;border-radius:999px}
#hwx .cats button.on{background:var(--line);color:var(--ink)}
/* 处境选择条：两行横滑。76 个处境竖着平铺是 1049px，那正是被废掉的旧目录；
   横滑两行占 78px，一屏能扫到十几个，滑动就能看完全部。
   不放组名——组名与标签同行会混成半个标签（见 DESIGN.md §7），
   改用「按组排序」让相邻的处境自然聚在一起。 */
#hwx .scpick{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;grid-auto-columns:max-content;gap:7px 6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:12px 0 0;padding-bottom:2px}
#hwx .scpick::-webkit-scrollbar{display:none}
#hwx .scpick button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:7px 14px;font-family:inherit;font-size:14.5px;line-height:1.3;cursor:pointer;white-space:nowrap}
#hwx .scpick button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#hwx .feed{columns:150px;column-gap:12px;margin-top:14px}
#hwx .feed>*{break-inside:avoid;width:100%;margin:0 0 12px}
#hwx .nc-feed{columns:150px;column-gap:12px;margin-top:14px}
#hwx .nc-feed>*{break-inside:avoid;width:100%;margin:0 0 12px}
#hwx .pc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:17px 17px 15px;text-decoration:none;color:inherit;background:var(--tint,var(--card))}
:root[data-theme="dark"] #hwx .pc,:root[data-theme="dark"] #hwx .nc{background:var(--tintd,var(--card))}
/* flex-wrap:wrap 是为了不让右边的小字（条目的 w）把标题挤折行。
   卡片内容宽只有 124px，人名 + 小字超过约 116px 标题就断词——
   而这跟小字多长关系不大：马可·奥勒留(91px)+「克制」(22px) 照样折，
   毛泽东(57px)+「集中优势」(50px) 反而不折。限制小字字数解决不了。
   允许换行之后，放不下的小字自己掉到第二行，标题永远完整。
   实测 60 张卡：折行 9 → 0，卡片中位高 258px 不变。 */
#hwx .pc .r1{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
#hwx .pc b{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:19px;line-height:1.45}
#hwx .pc .tag{font-size:12.5px;color:var(--muted);white-space:nowrap;max-width:52%;overflow:hidden;text-overflow:ellipsis;font-style:normal}
#hwx .pc .it{font-size:14px;color:var(--muted);margin:6px 0 9px;line-height:1.65}
#hwx .pc .hk{font-size:15.5px;line-height:1.85;flex:1}
#hwx .pc .hk::before{content:"「"}#hwx .pc .hk::after{content:"」"}
#hwx .pc .ls{font-size:12.5px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;line-height:1.65}
#hwx .pc .cf{font-size:12.5px;color:var(--acc);margin-top:10px}
#hwx .nc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:17px 17px 15px;text-decoration:none;color:inherit;background:var(--tint,var(--card))}
#hwx .nc .pn{font-size:13px;color:var(--muted);margin-bottom:5px}
#hwx .nc .pn i{font-style:normal;color:var(--acc)}
#hwx .nc .nb{font-size:11px;background:var(--acc);color:#fff;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
#hwx .nc b{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:19px;line-height:1.45}
#hwx .nc .w{font-size:13px;color:var(--muted);margin:4px 0 10px}
#hwx .nc .q{font-size:15.5px;line-height:1.85}
#hwx .nc .q::before{content:"「"}#hwx .nc .q::after{content:"」"}
#hwx .qc{border-radius:14px;background:var(--paper2);border:1px solid var(--line);padding:17px 15px 14px;display:flex;flex-direction:column;text-decoration:none;color:inherit;position:relative}
#hwx .qc .v{writing-mode:vertical-rl;text-orientation:mixed;height:186px;width:fit-content;max-width:100%;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;font-size:17px;font-weight:700;line-height:1.85;letter-spacing:.04em;margin:5px auto 12px;overflow:hidden;display:block}
#hwx .qc .v::before{content:"「"}#hwx .qc .v::after{content:"」"}
#hwx .qc .who{font-size:12.5px;color:var(--muted);margin-top:2px}
#hwx .qc .gl{font-size:13px;line-height:1.65;color:var(--ink);opacity:.72;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#hwx .qc .who i{font-style:normal;color:var(--acc)}
#hwx .qc .seal{position:absolute;top:13px;right:13px;width:22px;height:22px;border:1.5px solid var(--acc);border-radius:4px;color:var(--acc);font-size:11px;display:flex;align-items:center;justify-content:center}
#hwx .kc{border-radius:14px;background:rgba(163,59,46,.07);border:1px solid rgba(163,59,46,.22);color:var(--ink);padding:16px 16px 14px;display:flex;flex-direction:column}
:root[data-theme="dark"] #hwx .kc{background:rgba(224,112,95,.13);border-color:rgba(224,112,95,.3)}
#hwx .kc{position:relative}
#hwx .kc .seal{position:absolute;top:13px;right:13px;width:22px;height:22px;border:1.5px solid var(--acc);border-radius:4px;color:var(--acc);font-size:11px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC","Songti SC",serif}
#hwx .kc .said{font-size:12px;line-height:1.6;font-family:"Noto Serif SC","Songti SC",serif;margin-bottom:8px;color:var(--acc);padding-right:28px}
#hwx .kc .qm{display:none;font-size:25px;color:var(--acc);font-weight:900;line-height:1}
#hwx .kc .t{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:16.5px;font-weight:700;line-height:1.65;margin:9px 0 12px;flex:1;color:var(--ink)}
#hwx .kc .r a{display:block;font-size:13.5px;color:var(--muted);text-decoration:none;padding:4px 0}
#hwx .kc .r a b{color:var(--ink);font-weight:600}
.dq{display:none!important}
.tabs,#tl-wrap{display:none!important}
.family a{color:inherit;text-decoration:none}
@media(min-width:900px){#hwx .feed,#hwx .nc-feed{columns:230px}}
.hid{display:none!important}</style>

","u":"/i/mao/on-contradiction/","hint":"一团乱麻里，先找那根一抽全松的线","sc":"几件事同时在响，每件都像不能放。"},{"who":"影响力","cn":"社会认同","u":"/i/influence/social-proof/","hint":"越拿不准，越容易跟着人群走","sc":"你拿不准，发现自己在参考大家的做法。"}]},{"t":"他明摆着有恶意，我还忍吗？","r":[{"who":"凯撒","cn":"宽赦作为武器","u":"/i/caesar/clementia/","hint":"他赦免的人越多，对手越难征兵","sc":"你赢了，手上握着处置败方的权力。"},{"who":"苏轼","cn":"眼前见天下无一个不好人","u":"/i/su-shi/no-bad-people/","hint":"不是天真，是拒绝用敌我看世界","sc":"你和某人有过节，现在每次接触都在防备。"}]},{"t":"我怕自己在气头上做错决定。","r":[{"who":"爱比克泰德","cn":"扰乱你的不是事情","u":"/i/epictetus/judgments-not-things/","hint":"死亡不可怕这句话，重点在后半句","sc":"某句话或某件事让你反应很大，久久平不下来。"},{"who":"张良","cn":"圯上受书","u":"/i/zhang-liang/picking-up-the-shoe/","hint":"老人扔了三次鞋，考的不是脾气","sc":"你被要求接受一套没人解释、看起来还不合理的规则。"}]},{"t":"我一句话就把人得罪了。","r":[{"who":"论语","cn":"己所不欲，勿施于人","u":"/i/analects/reciprocity/","hint":"先问自己愿不愿意被这样对待","sc":"你要对别人做一个他没得选的决定。"},{"who":"克里斯·沃斯","cn":"要的是「说得对」不是「好」","u":"/i/chris-voss/thats-right/","hint":"「行行行」是想脱身，「对，就是这样」才是开始","sc":"对方答应了，但你不确定他是真同意还是想结束对话。"}]},{"t":"他给我难堪，我忍了这一次。","r":[{"who":"张良","cn":"圯上受书","u":"/i/zhang-liang/picking-up-the-shoe/","hint":"老人扔了三次鞋，考的不是脾气","sc":"你被要求接受一套没人解释、看起来还不合理的规则。"},{"who":"凯撒","cn":"宽赦作为武器","u":"/i/caesar/clementia/","hint":"他赦免的人越多，对手越难征兵","sc":"你赢了，手上握着处置败方的权力。"}]},{"t":"总想再准备准备，就是不开始。","r":[{"who":"保罗·格雷厄姆","cn":"做不能规模化的事","u":"/i/paul-graham/dont-scale/","hint":"Airbnb创始人挨家上门拍照那年","sc":"产品刚上线，你在纠结先搭增长系统还是先手动伺候用户。"},{"who":"约翰·博伊德","cn":"OODA循环","u":"/i/boyd/ooda/","hint":"进到对手的循环里面去","sc":"你和对手都在提速，你在给每个环节买工具。"}]},{"t":"我知道该做，可就是动不了。","r":[{"who":"王阳明","cn":"知行合一","u":"/i/wang-yangming/unity-of-knowing-and-doing/","hint":"把懂了和会了分开，是给自己留退路","sc":"一件事你反复告诉自己应该怎么做，但从来没做。"},{"who":"富兰克林","cn":"一周只练一条","u":"/i/franklin/one-virtue-a-week/","hint":"十三条同时练等于一条都不练","sc":"你想改掉的毛病列出来有好几条。"}]},{"t":"想等条件齐了再动，可它总不齐。","r":[{"who":"凯撒","cn":"骰子已被掷下","u":"/i/caesar/the-rubicon/","hint":"他在河边停了下来，算完了才过","sc":"面前有一步，迈出去就没有回头路。"},{"who":"毛泽东","cn":"中国革命战争的战略问题","u":"/i/mao/strategy-of-the-revolution/","hint":"别人的条令不能直接搬","sc":"手上有一份别人赢过的打法，你这块地和他不一样。"}]},{"t":"这一步迈出去就收不回来了。","r":[{"who":"凯撒","cn":"骰子已被掷下","u":"/i/caesar/the-rubicon/","hint":"他在河边停了下来，算完了才过","sc":"面前有一步，迈出去就没有回头路。"},{"who":"项羽","cn":"破釜沉舟","u":"/i/xiang-yu/sinking-the-boats/","hint":"同一招救过他一次，也毁了他一次","sc":"你想集中全部资源做一次决定性的投入。"}]},{"t":"把退路堵死，是勇还是蠢？","r":[{"who":"托马斯·谢林","cn":"自缚双手的优势","u":"/i/schelling/binding-yourself/","hint":"谈判桌上最强的一方，常是不能让步的那方","sc":"你要让对方相信你不会让步。"},{"who":"韩信","cn":"背水一战","u":"/i/han-xin/back-to-the-river/","hint":"这一招有前提，没前提就是送死","sc":"你想用一次硬截止或者背水一战逼出团队的战斗力。"}]},{"t":"万一错了，我还有退路吗？","r":[{"who":"格雷厄姆","cn":"安全边际","u":"/i/graham/margin-of-safety/","hint":"三个词浓缩全部投资智慧","sc":"一个机会你非常确定，想把余量省下来换收益。"},{"who":"李嘉诚","cn":"九成时间想失败","u":"/i/li-ka-shing/ninety-percent-failure/","hint":"一个齿轮出毛病，整只表就停","sc":"一个项目前景很好，团队一片乐观。"}]},{"t":"我想在动手前先确认能赢。","r":[{"who":"孙子兵法","cn":"先胜而后求战","u":"/i/sun-tzu/win-before-fighting/","hint":"打得漂亮，往往是没准备好的补救","sc":"一场关键的仗就在眼前，你在想怎么打赢。"},{"who":"毛泽东","cn":"中国革命战争的战略问题","u":"/i/mao/strategy-of-the-revolution/","hint":"别人的条令不能直接搬","sc":"手上有一份别人赢过的打法，你这块地和他不一样。"}]},{"t":"机会比预想的大，我敢不敢加码。","r":[{"who":"粟裕","cn":"把小淮海打成大淮海","u":"/i/su-yu/enlarging-huaihai/","hint":"「淮海战役」四个字出自他的电报","sc":"一件事打得比预想顺，一个更大的机会在眼前晃。"},{"who":"达里奥","cn":"可信度加权","u":"/i/dalio/believability/","hint":"意见不平等，按战绩称重","sc":"一个重要分歧，会上职位最高的和声音最大的占了上风。"}]},{"t":"等数据齐了，还来得及吗？","r":[{"who":"约翰·博伊德","cn":"OODA循环","u":"/i/boyd/ooda/","hint":"进到对手的循环里面去","sc":"你和对手都在提速，你在给每个环节买工具。"},{"who":"安迪·格鲁夫","cn":"转折点与报信人","u":"/i/grove/inflection-and-cassandras/","hint":"十倍速变化来临时，最早知道的是一线","sc":"一个让你不安的边缘信号出现了，但数据还很平静。"}]},{"t":"我凭什么相信自己这次的判断？","r":[{"who":"毛泽东","cn":"实践论","u":"/i/mao/on-practice/","hint":"道理不从书里完成","sc":"方法论堆了一桌子，第一个真局面还没接手。"},{"who":"达里奥","cn":"可信度加权","u":"/i/dalio/believability/","hint":"意见不平等，按战绩称重","sc":"一个重要分歧，会上职位最高的和声音最大的占了上风。"}]},{"t":"我是不是根本问错了问题？","r":[{"who":"爱因斯坦","cn":"提出问题比解决问题更重要","u":"/i/einstein/formulating-the-problem/","hint":"他十六岁问的那个问题，十年后变成相对论","sc":"一个问题全队解了很久，方案越来越复杂，收效越来越小。"},{"who":"苏格拉底","c /second-level-thinking/","hint":"好公司人人都说好的时候，就不便宜了","sc":"你发现了一个明显的好机会。"}]},{"t":"所有人都在冲，我怕自己踏空。","r":[{"who":"索罗斯","cn":"反身性","u":"/i/soros/reflexivity/","hint":"价格不只反映基本面，还会制造基本面","sc":"你判断一个东西被高估了，想反着做。"},{"who":"影响力","cn":"互惠","u":"/i/influence/reciprocity/","hint":"先给的那个小东西，撬动的是不成比例的回报","sc":"你收了对方一点好处，正要评估他的提议。"}]},{"t":"钱放着不动，我心里发慌。","r":[{"who":"纳瓦尔","cn":"睡觉时也在赚钱的资产","u":"/i/naval/assets-while-you-sleep/","hint":"追求财富，别追求金钱或地位","sc":"你很忙，也小有成绩，但停下来就什么都没有。"},{"who":"范蠡","cn":"旱则资舟","u":"/i/fan-li/stock-the-opposite/","hint":"旱天囤船，涝天囤车","sc":"某样东西现在很便宜，但所有人都说它没前途。"}]},{"t":"我的收入完全绑在工时上。","r":[{"who":"纳瓦尔","cn":"把自己产品化","u":"/i/naval/productize-yourself/","hint":"四个字，一半是做什么，一半是怎么放大","sc":"你能力不错，但收入和时间死死绑在一起。"},{"who":"国富论","cn":"扣针工厂","u":"/i/wealth-of-nations/pin-factory/","hint":"十个人一天四万八千枚，一个人可能一枚都做不出","sc":"你想通过拆分工序提升效率。"}]},{"t":"我只会攒钱，不会让钱干活。","r":[{"who":"白圭","cn":"智勇仁强","u":"/i/bai-gui/four-qualifications/","hint":"他说学不会这四样，我不教","sc":"你要判断自己或某个人适不适合做一件高不确定性的事。"},{"who":"稻盛和夫","cn":"思维方式是乘数","u":"/i/inamori/the-multiplier/","hint":"能力和热情只能是正数，方向可以是负的","sc":"你在评估一个人，或者复盘自己的一段停滞。"}]},{"t":"这个月没有单子，我开始慌了。","r":[{"who":"凯文·凯利","cn":"一千个铁杆粉丝","u":"/i/kevin-kelly/thousand-true-fans/","hint":"一千乘一百，就是活得下去","sc":"你在做内容或手艺，但一直在等一个爆款。"},{"who":"保罗·格雷厄姆","cn":"做不能规模化的事","u":"/i/paul-graham/dont-scale/","hint":"Airbnb创始人挨家上门拍照那年","sc":"产品刚上线，你在纠结先搭增长系统还是先手动伺候用户。"}]},{"t":"客户说走就走，我留不住人。","r":[{"who":"凯文·凯利","cn":"中间不能有人","u":"/i/kevin-kelly/direct-relationship/","hint":"隔一层平台，这道算术就不成立","sc":"你在某个平台上有一批读者或客户，但联系方式都在平台手里。"},{"who":"影响力","cn":"互惠","u":"/i/influence/reciprocity/","hint":"先给的那个小东西，撬动的是不成比例的回报","sc":"你收了对方一点好处，正要评估他的提议。"}]},{"t":"手里就一个大客户，我睡不安稳。","r":[{"who":"格雷厄姆","cn":"安全边际","u":"/i/graham/margin-of-safety/","hint":"三个词浓缩全部投资智慧","sc":"一个机会你非常确定，想把余量省下来换收益。"},{"who":"凯文·凯利","cn":"一千个铁杆粉丝","u":"/i/kevin-kelly/thousand-true-fans/","hint":"一千乘一百，就是活得下去","sc":"你在做内容或手艺，但一直在等一个爆款。"}]},{"t":"我一直在等活找上门。","r":[{"who":"保罗·格雷厄姆","cn":"做不能规模化的事","u":"/i/paul-graham gzi/ox-carving/","hint":"刀不钝是因为它没碰硬的地方","sc":"一件事推起来处处费劲，你在考虑加大力度。"},{"who":"道德经","cn":"无为而无不为","u":"/i/tao-te-ching/wu-wei/","hint":"多数失控来自动作太多","sc":"事情不顺，你在想还能再加点什么管理动作。"}]},{"t":"一天没干成什么，我却累得说不出话。","r":[{"who":"阿莉·霍克希尔德","cn":"情感劳动","u":"/i/hochschild/emotional-labor/","hint":"被要求的情绪也是工作量","sc":"一天没干多少活，但下班之后一句话都不想说。"},{"who":"卡尔·纽波特","cn":"注意力残留","u":"/i/cal-newport/attention-residue/","hint":"回了一条消息，之后半小时都在打折","sc":"一天很忙，但没有推进任何需要动脑的事。"}]},{"t":"他什么都比我快一步。","r":[{"who":"庄子","cn":"齐物","u":"/i/zhuangzi/equalizing-things/","hint":"争论之前先问用的是谁的尺子","sc":"一个分歧反复出现，每次都吵不出结果。"},{"who":"拉罗什富科","cn":"没人抱怨自己的判断力","u":"/i/la-rochefoucauld/memory-vs-judgment/","hint":"人人都说记性差，没人说眼光差","sc":"你在复盘，结论又一次指向外部因素。"}]},{"t":"我到底在证明自己，还是在做事？","r":[{"who":"约翰·博伊德","cn":"做大人物还是做成事","u":"/i/boyd/to-be-or-to-do/","hint":"他对每个下属都讲过同一个选择","sc":"一个能升上去的机会和一件该做成的事冲突了。"},{"who":"项羽","cn":"衣绣夜行","u":"/i/xiang-yu/brocade-at-night/","hint":"关中不要，非回彭城不可","sc":"两个选项，一个更有利，一个更能被人看见。"}]},{"t":"我是不是天生就不如人？","r":[{"who":"德韦克","cn":"夸过程，别夸天赋","u":"/i/dweck/praise-the-process/","hint":"被夸聪明的孩子挑了简单的题","sc":"给孩子或下属反馈。"},{"who":"德韦克","cn":"这个效应比流行说法小得多","u":"/i/dweck/effect-size/","hint":"是温和因素，不是万能开关","sc":"有人用「心态问题」解释一个结果。"}]},{"t":"他们看起来都很稳，只有我在慌。","r":[{"who":"布琳·布朗","cn":"羞耻的三个生存条件","u":"/i/brene-brown/secrecy-silence-judgment/","hint":"它靠「只有我这样」活着","sc":"有一件事你一直没跟任何人说过，每次想起来都难受。"},{"who":"苏格拉底","cn":"不自以为知道","u":"/i/socrates/knowing-not-knowing/","hint":"神谕说他最智慧，他去证伪，结果证实了","sc":"你在自己擅长的领域之外，正要给出一个很有把握的判断。"}]},{"t":"道理都懂，我就是对自己客气不起来。","r":[{"who":"克里斯汀·内夫","cn":"三样必须同时在","u":"/i/kristin-neff/three-parts/","hint":"少一样就变成自怜、忍受或冷漠","sc":"你知道该对自己好一点，可一试就觉得假，或者一试就滑进自怜。"},{"who":"卡尔·罗杰斯","cn":"无条件积极关注","u":"/i/carl-rogers/unconditional-regard/","hint":"说了真话不会失去关系，人才敢说真话","sc":"你希望某个人对你说实话。"}]},{"t":"我不想卷，可又怕被落下。","r":[{"who":"庄子","cn":"无用之用","u":"/i/zhuangzi/use-of-uselessness/","hint":"有用是一种被消耗的资格","sc":"你是团队里那个什么事都能扛的人，越来越忙。"},{"who":"巴菲特","cn":"能力圈","u":"/i/buffett/circle-of-competence/","hint":"圈多大不要紧，知不知道边在哪要命","sc":"一个圈外的机会很热，你怕错过。"}]},{"t":"大家都在加班，我先走心虚。","r":[{"who":"论语","cn":"和而不同","u":"/i/analects/harmony-not-sameness/","hint":"全票通过的会最可疑","sc":"一个重要决定，会上没有人提出异议。"},{"who":"庄子","cn":"齐物","u":"/i/zhuangzi/equalizing-things/","hint":"争论之前先问用的是谁的尺子","sc":"一个分歧反复出现，每次都吵不出结果。"}]},{"t":"拼了这么久，我不知道图什么。","r":[{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中","sc":"你在直接努力获得某种状态（快乐、自信、松弛），越努力越远。"},{"who":"王兴","cn":"逃避真正的思考","u":"/i/wang-xing/escape-from-thinking/","hint":"多数人为了逃避思考，愿意做任何事情","sc":"你或团队处在异常忙碌、异常充实的一段时期。"}]},{"t":"光靠拼命，我拼不过他们。","r":[{"who":"荀子","cn":"善假于物","u":"/i/xunzi/borrow-from-things/","hint":"走得远的人不是腿长的人","sc":"一件事你已经很努力，但还是做不动。"},{"who":"纳瓦尔","cn":"把自己产品化","u":"/i/naval/productize-yourself/","hint":"四个字，一半是做什么，一半是怎么放大","sc":"你能力不错，但收入和时间死死绑在一起。"}]},{"t":"位置给我了，我看不清风险在哪。","r":[{"who":"李泌","cn":"臣绝粒无家","u":"/i/li-bi/no-office/","hint":"四次入朝四次归山，每次都不受官","sc":"你有话要说，但担心说了会被理解成为自己争利。"},{"who":"冯道","cn":"惟皇帝救得","u":"/i/feng-dao/only-you-can-save/","hint":"他不能阻止征服，他阻止了屠城","sc":"对方拥有绝对优势，你没有任何筹码。"}]},{"t":"机会挺好，就怕我接不住。","r":[{"who":"王翦","cn":"非六十万不可","u":"/i/wang-jian/sixty-thousand/","hint":"少报要的人赢了那次会，输了那场仗","sc":"要报一个资源数，你在真实需求和好看之间摇摆。"},{"who":"稻盛和夫","cn":"动机至善，私心了无","u":"/i/inamori/pure-motive/","hint":"他每晚问自己是不是想出风头","sc":"一个大机会让你兴奋，你准备立刻动手。"}]},{"t":"这个位置我接下来，可能是个坑。","r":[{"who":"诸葛亮","cn":"隆中对","u":"/i/zhuge-liang/longzhong-plan/","hint":"战略的前半段全是排除法","sc":"你在定下一步的方向，选项很多。"},{"who":"哈耶克","cn":"知识是分散的","u":"/i/hayek/knowledge-is-dispersed/","hint":"价格是一套压缩过的电报系统","sc":"你在筹划一个「信息全部集中后统一决策」的机制。"}]},{"t":"刚接手，我第一条规矩该立什么。","r":[{"who":"刘邦","cn":"约法三章","u":"/i/liu-bang/three-articles/","hint":"三条说得完，才有人信","sc":"你刚接手一摊事，秩序很乱，你想赶紧立规矩。"},{"who":"荀子","cn":"礼起于何也","u":"/i/xunzi/origin-of-rites/","hint":"不是先有道德才有规矩，是反过来","sc":"同一类冲突反复发生，你已经换过人了。"}]},{"t":"我该什么时候退，才不难看？","r":[{"who":"范蠡","cn":"长颈鸟喙","u":"/i/fan-li/leave-at-the-top/","hint":"他看的不是形势，是那个人的构造","sc":"一件大事刚做成，你在考虑接下来的位置。"},{"who":"李嘉诚","cn":"知止","u":"/i/li-ka-shing/knowing-when-to-stop/","hint":"扩张年代挂一幅劝刹车的字","sc":"行情火热，团队士气正盛，你在考虑追加。"}]},{"t":"我交出去之后，会不会一团糟？","r":[{"who":"李光耀","cn":"从病床上爬起来","u":"/i/lee-kuan-yew/from-my-sickbed/","hint":"退休的人说了一句没法退休的话","sc":"你要交出一件自己从零做起来的事。"},{"who":"张良","cn":"愿封留足矣","u":"/i/zhang-liang/asking-for-less/","hint":"让给你的人放心，比多拿三万户值钱","sc":"一件事做成了，你可以要一份很大的回报。"}]},{"t":"我这一路的取舍，怎么交代？","r":[{"who":"冯道","cn":"长乐老自叙","u":"/i/feng-dao/the-long-happy-old-man/","hint":"忠的对象到底是谁","sc":"一个人的选择让你说不清是圆滑还是务实。"},{"who":"哈耶克","cn":"致命的自负","u":"/i/hayek/fatal-conceit/","hint":"向人证明：对自以为能设计的东西，他知道得多么少","sc":"你有能力也有权限重新设计一整套系统。"}]},{"t":"该收手了，可我停不下来。","r":[{"who":"李光耀","cn":"从病床上爬起来","u":"/i/lee-kuan-yew/from-my-sickbed/","hint":"退休的人说了一句没法退休的话","sc":"你要交出一件自己从零做起来的事。"},{"who":"冯道","cn":"惟皇帝救得","u":"/i/feng-dao/only-you-can-save/","hint":"他不能阻止征服，他阻止了屠城","sc":"对方拥有绝对优势，你没有任何筹码。"}]},{"t":"新规矩定了，没人当回事。","r":[{"who":"商鞅","cn":"徙木立信","u":"/i/shang-yang/moving-the-pole/","hint":"新规则的第一件事不是执行，是被相信","sc":"你要推行一项新规则，担心没人当真。"},{"who":"刘邦","cn":"约法三章","u":"/i/liu-bang/three-articles/","hint":"三条说得完，才有人信","sc":"你刚接手一摊事，秩序很乱，你想赶紧立规矩。"}]},{"t":"松了没用，紧了怕逼走人。","r":[{"who":"朱元璋","cn":"治吏用重典","u":"/i/zhu-yuanzhang/heavy-law/","hint":"他自己说这套只适用于这一代","sc":"一类问题屡禁不止，你在考虑加重处罚。"},{"who":"管仲","cn":"政之所兴，在顺民心","u":"/i/guan-zhong/follow-the-people/","hint":"逆着人性设计的政策，执行成本无限高","sc":"一条你认为很合理的规定，落地时处处受阻。"}]},{"t":"我压得住人，却服不了人。","r":[{"who":"孟子","cn":"以力服人与以德服人","u":"/i/mencius/force-vs-virtue/","hint":"你一离开，靠力气建立的秩序就归零","sc":"团队执行力看起来不错，你想知道这是真的还是撑出来的。"},{"who":"孟子","cn":"民为贵","u":"/i/mencius/people-first/","hint":"统治者算的是同意，不是感情","sc":"一个决定对上级好交代，对执行的人不好受。"}]},{"t":"规矩定了，怎么才落得下去？","r":[{"who":"张居正","cn":"一条鞭法","u":"/i/zhang-juzheng/single-whip/","hint":"环节越多，被吃掉的越多","sc":"一个流程里名目繁多，各环节都说自己有必要。"},{"who":"荀子","cn":"礼起于何也","u":"/i/xunzi/origin-of-rites/","hint":"不是先有道德才有规矩，是反过来","sc":"同一类冲突反复发生，你已经换过人了。"}]},{"t":"我为什么非得立规矩？","r":[{"who":"荀子","cn":"明分使群","u":"/i/xunzi/division-makes-groups/","hint":"职责不清的团队会自己解体","sc":"人加了，产出没跟着加。"},{"who":"管仲","cn":"仓廪实则知礼节","u":"/i/guan-zhong/granaries-first/","hint":"谈价值观之前先看账","sc":"反复强调标准，行为却不变。"}]},{"t":"规矩太多太乱，我自己都记不住。","r":[{"who":"张居正","cn":"一条鞭法","u":"/i/zhang-juzheng/single-whip/","hint":"环节越多，被吃掉的越多","sc":"一个流程里名目繁多，各环节都说自己有必要。"},{"who":"荀子","cn":"明分使群","u":"/i/xunzi/division-makes-groups/","hint":"职责不清的团队会自己解体","sc":"人加了，产出没跟着加。"}]},{"t":"现在到底是开头还是快结束了？","r":[{"who":"霍华德·马克斯","cn":"给市场量体温","u":"/i/marks/taking-the-temperature/","hint":"不知道要去哪，至少知道自己站在哪","sc":"你判断不了接下来的走势，因此迟迟不动。"},{"who":"技术革命与金融资本","cn":"泡沫在剧本里","u":"/i/technological-revolutions/bubble-in-the-script/","hint":"五次技术革命，五次泡沫，一次没缺席","sc":"你所在的领域正处在资本狂热或者刚刚崩盘。"}]},{"t":"十年之后，哪些还站得住？","r":[{"who":"贝索斯","cn":"押注不变的东西","u":"/i/bezos/what-wont-change/","hint":"没人问他这个问题，他说这才是重点","sc":"战略会上大家都在讨论新趋势和新打法。"},{"who":"主权个人","cn":"暴力的逻辑","u":"/i/sovereign-individual/logic-of-violence/","hint":"保护与勒索的成本比，决定社会的形状","sc":"你在预判一个行业或制度的走向。"}]},{"t":"同样的条件，我们差在哪？","r":[{"who":"国家为什么会失败","cn":"一墙之隔的诺加莱斯","u":"/i/why-nations-fail/two-nogales/","hint":"同一片沙漠，同一群人的后代，两种命运","sc":"两组条件相似的人，结果差距巨大。"},{"who":"哈耶克","cn":"知识是分散的","u":"/i/hayek/knowledge-is-dispersed/","hint":"价格是一套压缩过的电报系统","sc":"你在筹划一个「信息全部集中后统一决策」的机制。"}]},{"t":"我看不出这局面是怎么形成的。","r":[{"who":"枪炮、病菌与钢铁","cn":"大陆的轴线","u":"/i/guns-germs-steel/axis-of-continents/","hint":"东西向的大陆自带传播红利","sc":"你在规划下一步扩张的方向。"},{"who":"人类简史","cn":"靠虚构合作","u":"/i/sapiens/fictions-that-cooperate/","hint":"陌生人大规模协作的黏合剂不是真的","sc":"你要让一群互不相识、甚至互不喜欢的人协作。"}]},{"t":"大家都这么做，可我说不出为什么。","r":[{"who":"人类简史","cn":"小麦驯化了我们","u":"/i/sapiens/wheat-domesticated-us/","hint":"物种赢了，个体输了","sc":"一个升级摆在面前，每一步都让眼下更轻松。"},{"who":"孟子","cn":"以力服人与以德服人","u":"/i/mencius/force-vs-virtue/","hint":"你一离开，靠力气建立的秩序就归零","sc":"团队执行力看起来不错，你想知道这是真的还是撑出来的。"}]},{"t":"我看不出下一步棋该往哪走。","r":[{"who":"诸葛亮","cn":"隆中对","u":"/i/zhuge-liang/longzhong-plan/","hint":"战略的前半段全是排除法","sc":"你在定下一步的方向，选项很多。"},{"who":"李泌","cn":"先取范阳","u":"/i/li-bi/strike-the-base/","hint":"收回两京最好看，也最不解决问题","sc":"有一个显眼的目标和一个要害的目标，资源只够打一个。"}]},{"t":"两个我都想要，可只能选一个。","r":[{"who":"乔布斯","cn":"专注就是说不","u":"/i/jobs/focus-is-saying-no/","hint":"他回归后把几十条产品线砍成四格","sc":"手头的方向越来越多，每一个单看都有道理。"},{"who":"查理·芒格","cn":"反过来想","u":"/i/munger/invert/","hint":"知道自己会死在哪里，就永远不去那儿","sc":"一个目标正着想已经想不出新东西了。"}]},{"t":"看着都好，我到底适合哪个？","r":[{"who":"巴菲特","cn":"能力圈","u":"/i/buffett/circle-of-competence/","hint":"圈多大不要紧，知不知道边在哪要命","sc":"一个圈外的机会很热，你怕错过。"},{"who":"段永平","cn":"做对的事情，把事情做对","u":"/i/duan-yongping/right-things-done-right/","hint":"发现错了，马上停，任何代价都是最小代价","sc":"一件投入很深的事，你隐约觉得方向不对。"}]},{"t":"我到底为什么要打这一仗？","r":[{"who":"战争论","cn":"政治的继续","u":"/i/on-war/continuation-of-politics/","hint":"忘了为什么打的仗，赢了也没用","sc":"一场对抗已经持续很久，越打越凶。"},{"who":"孙子兵法","cn":"先胜而后求战","u":"/i/sun-tzu/win-before-fighting/","hint":"打得漂亮，往往是没准备好的补救","sc":"一场关键的仗就在眼前，你在想怎么打赢。"}]},{"t":"直觉和数据打架，我听哪个？","r":[{"who":"思考，快与慢","cn":"所见即全部","u":"/i/thinking-fast-and-slow/wysiati/","hint":"系统1从不告诉你它没看到什么","sc":"你对一个判断非常有把握。"},{"who":"吉姆·西蒙斯","cn":"像奴隶一样跟随模型","u":"/i/simons/slave-to-the-model/","hint":"人负责改模型，不负责改单次决定","sc":"系统给出的决定和你此刻的直觉冲突，你想手动改一次。"}]},{"t":"这次的直觉，我信得过吗？","r":[{"who":"吉姆·西蒙斯","cn":"美感与最好的人","u":"/i/simons/simons-principles/","hint":"五条原则，没有一条讲数学","sc":"你在总结自己的方法论，清单上全是技术和技巧。"},{"who":"王阳明","cn":"致良知","u":"/i/wang-yangming/innate-knowing/","hint":"难的不是不知道，是不肯认","sc":"一件事你想了很久还没定，但心里其实一直有个方向。"}]},{"t":"我查的资料全都在支持我。","r":[{"who":"卡尔·波普尔","cn":"去找反例，别再找支持","u":"/i/popper/seek-refutation/","hint":"支持的例子再多也不能证明结论","sc":"你越查越觉得自己的判断没错。"},{"who":"费曼","cn":"第一个别骗的是自己","u":"/i/feynman/dont-fool-yourself/","hint":"科学的第一原则，防的是研究者本人","sc":"你在评估一件与自己利害相关的事。"}]},{"t":"我死活不肯承认这次买错了。","r":[{"who":"索罗斯","cn":"知道自己什么时候错","u":"/i/soros/knowing-when-wrong/","hint":"他说自己富有只因为认错快","sc":"一个判断被市场打脸了，你在纠结要不要坚持。"},{"who":"吉姆·西蒙斯","cn":"像奴隶一样跟随模型","u":"/i/simons/slave-to-the-model/","hint":"人负责改模型，不负责改单次决定","sc":"系统给出的决定和你此刻的直觉冲突，你想手动改一次。"}]},{"t":"我这一眼看过去，就是觉得不对。","r":[{"who":"思考，快与慢","cn":"所见即全部","u":"/i/thinking-fast-and-slow/wysiati/","hint":"系统1从不告诉你它没看到什么","sc":"你对一个判断非常有把握。"},{"who":"卡尔·波普尔","cn": ":"你做了实事，但觉得主动展示掉价。"},{"who":"项羽","cn":"衣绣夜行","u":"/i/xiang-yu/brocade-at-night/","hint":"关中不要，非回彭城不可","sc":"两个选项，一个更有利，一个更能被人看见。"}]},{"t":"这个功，我要不要去争？","r":[{"who":"张良","cn":"愿封留足矣","u":"/i/zhang-liang/asking-for-less/","hint":"让给你的人放心，比多拿三万户值钱","sc":"一件事做成了，你可以要一份很大的回报。"},{"who":"郭子仪","cn":"门不设禁","u":"/i/guo-ziyi/open-gates/","hint":"藏起来的人才需要被查","sc":"你的位置或资源已经引来议论。"}]},{"t":"活是我干的，功劳记在别人头上。","r":[{"who":"拉罗什富科","cn":"没人抱怨自己的判断力","u":"/i/la-rochefoucauld/memory-vs-judgment/","hint":"人人都说记性差，没人说眼光差","sc":"你在复盘，结论又一次指向外部因素。"},{"who":"智慧书","cn":"做，并且让人看见","u":"/i/art-of-worldly-wisdom/do-and-be-seen/","hint":"没被看见的事，在别人的账上等于没做","sc":"你做了实事，但觉得主动展示掉价。"}]},{"t":"退这一步，是务实还是没底线？","r":[{"who":"俾斯麦","cn":"可能性的艺术","u":"/i/bismarck/art-of-the-possible/","hint":"统一之后他做的全是防止再打","sc":"连赢之后，所有人都在推你乘胜追击。"},{"who":"李光耀","cn":"管用吗","u":"/i/lee-kuan-yew/does-it-work/","hint":"他公开说自己不信任何一套理论","sc":"两套理论在会上相持不下。"}]},{"t":"手段脏了，目的还干净吗？","r":[{"who":"甘地","cn":"手段如种子","u":"/i/gandhi/means-are-seeds/","hint":"目的不能给手段消毒","sc":"一个能快速达成目的的手段摆在面前，只是不太干净。"},{"who":"马基雅维利","cn":"从实然出发","u":"/i/machiavelli/as-it-is/","hint":"按应然设计的制度，第一天就漏","sc":"你在设计一条规则，心里默认大家会配合。"}]},{"t":"对方有诚意，我怎么判断？","r":[{"who":"塔勒布","cn":"利益攸关","u":"/i/taleb/skin-in-the-game/","hint":"别告诉我你怎么想，告诉我你持有什么","sc":"你收到一条听起来很专业的建议。"},{"who":"拉罗什富科","cn":"虚伪是恶行向美德的致敬","u":"/i/la-rochefoucauld/vice-pays-tribute/","hint":"连坏人都要装好，说明好是硬通货","sc":"你发现某人的善行背后有利益动机。"}]},{"t":"道理站在我这边，可事办不成。","r":[{"who":"李光耀","cn":"管用吗","u":"/i/lee-kuan-yew/does-it-work/","hint":"他公开说自己不信任何一套理论","sc":"两套理论在会上相持不下。"},{"who":"论语","cn":"和而不同","u":"/i/analects/harmony-not-sameness/","hint":"全票通过的会最可疑","sc":"一个重要决定，会上没有人提出异议。"}]},{"t":"别的部门就是不配合我。","r":[{"who":"系统之美","cn":"杠杆点","u":"/i/thinking-in-systems/leverage-points/","hint":"人们凭直觉找到杠杆点，然后朝错误的方向推","sc":"你想改变一个顽固的系统行为，手已经放在某个开关上。"},{"who":"任正非","cn":"让听得见炮声的人呼唤炮火","u":"/i/ren-zhengfei/sound-of-gunfire/","hint":"谁离客户近，谁指挥资源","sc":"一线抱怨资源批不下来，机关抱怨一线乱要。"}]},{"t":"我没有权力，还怎么推动事？","r":[{"who":"李泌","cn":"臣绝粒无家","u":"/i/li-bi/no-office/","hint":"四次入朝四次归山，每次都不受官","sc":"你有话要说，但担心说了会被理解成为自己争利。"},{"who":"张良","cn":"借箸代筹","u":"/i/zhang-liang/borrowing-chopsticks/","hint":"八条反驳，条条落在执行上","sc":"一个方案听起来很有道理，你说不出哪里不对。"}]},{"t":"我上面的人明摆着不想变。","r":[{"who":"国家为什么会失败","cn":"精英为什么拦着进步","u":"/i/why-nations-fail/fear-of-creative-destruction/","hint":"拦路的人算得很清楚","sc":"一项明显有益的变革被人拦住了。"},{"who":"主权个人","cn":"从公民到顾客","u":"/i/sovereign-individual/citizen-to-customer/","hint":"他们在1997年预言了数字货币","sc":"你在做十年尺度的个人或事业布局。"}]},{"t":"这摊子太烂，我该下重手吗？","r":[{"who":"朱元璋","cn":"治吏用重典","u":"/i/zhu-yuanzhang/heavy-law/","hint":"他自己说这套只适用于这一代","sc":"一类问题屡禁不止，你在考虑加重处罚。"},{"who":"管仲","cn":"政之所兴，在顺民心","u":"/i/guan-zhong/follow-the-people/","hint":"逆着人性设计的政策，执行成本无限高","sc":"一条你认为很合理的规定，落地时处处受阻。"}]},{"t":"分钱这事，我怕埋雷。","r":[{"who":"张良","cn":"愿封留足矣","u":"/i/zhang-liang/asking-for-less/","hint":"让给你的人放心，比多拿三万户值钱","sc":"一件事做成了，你可以要一份很大的回报。"},{"who":"韩非子","cn":"二柄","u":"/i/han-feizi/two-handles/","hint":"把奖惩交出去，位置就空了","sc":"你名义上负责一件事，但推不动。"}]},{"t":"话都说绝了，还修得回来吗？","r":[{"who":"曹操","cn":"官渡烧信","u":"/i/cao-cao/burning-the-letters/","hint":"查清楚了，你会失去一半的人","sc":"一件事过去了，你手上握着能追责的证据。"},{"who":"曼德拉","cn":"穿上对手的球衣","u":"/i/mandela/springbok-jersey/","hint":"那件球衣曾是压迫的标志","sc":"你赢了，对方的符号和习惯还在，你的人要求清算。"}]},{"t":"当初没写清楚，现在我们各说各的。","r":[{"who":"韩非子","cn":"形名参同","u":"/i/han-feizi/form-and-name/","hint":"对不上的地方就是问题所在","sc":"到了盘点的时候，双方对「算不算做到」有分歧。"},{"who":"刘邦","cn":"约法三章","u":"/i/liu-bang/three-articles/","hint":"三条说得完，才有人信","sc":"你刚接手一摊事，秩序很乱，你想赶紧立规矩。"}]},{"t":"我想散伙，可事还得做下去。","r":[{"who":"李嘉诚","cn":"知止","u":"/i/li-ka-shing/knowing-when-to-stop/","hint":"扩张年代挂一幅劝刹车的字","sc":"行情火热，团队士气正盛，你在考虑追加。"},{"who":"韩信","cn":"不反也不退","u":"/i/han-xin/neither-nor/","hint":"两条路都不选，等于选了最坏的一条","sc":"你手上有一份让人忌惮的资源，同时觉得关系没问题。"}]},{"t":"每天都一样，我不知道图什么。","r":[{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中","sc":"你在直接努力获得某种状态（快乐、自信、松弛），越努力越远。"},{"who":"庄子","cn":"无用之用","u":"/i/zhuangzi/use-of-uselessness/","hint":"有用是一种被消耗的资格","sc":"你是团队里那个什么事都能扛的人，越来越忙。"}]},{"t":"我做这些，到底为了什么？","r":[{"who":"稻盛和夫","cn":"动机至善，私心了无","u":"/i/inamori/pure-motive/","hint":"他每晚问自己是不是想出风头","sc":"一个大机会让你兴奋，你准备立刻动手。"},{"who":"弗兰克尔","cn":"最后的自由","u":"/i/frankl/the-last-freedom/","hint":"这句话的分量在它写作的地点","sc":"处境已经压到你觉得毫无选择。"}]},{"t":"赢了这一局，然后呢？","r":[{"who":"有限与无限的游戏","cn":"两种游戏","u":"/i/finite-and-infinite-games/two-kinds/","hint":"赢下的每一局都会结束，游戏本身可以不结束","sc":"一件事你打得很凶，或者拖得很久。"},{"who":"有限与无限的游戏","cn":"与边界游戏","u":"/i/finite-and-infinite-games/playing-with-boundaries/","hint":"有限玩家在边界内玩，无限玩家玩边界","sc":"现有规则对你越来越不利。"}]},{"t":"样样都做得不错，我却不知道要什么。","r":[{"who":"优秀的绵羊","cn":"擅长跨栏，不擅长选路","u":"/i/excellent-sheep/hurdles/","hint":"做到最好，和决定什么值得做","sc":"你很清楚怎样算做得好，却答不上想要什么。"},{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么","sc":"你要做一个关于方向的选择。"}]},{"t":"我非得离开这日子才能修行？","r":[{"who":"六祖慧能","cn":"佛法在世间","u":"/i/huineng/in-the-world/","hint":"离开日常去找方法，是在找兔子的角","sc":"你在等一个更合适的时机开始一件重要的事。"},{"who":"冯道","cn":"长乐老自叙","u":"/i/feng-dao/the-long-happy-old-man/","hint":"忠的对象到底是谁","sc":"一个人的选择让你说不清是圆滑还是务实。"}]},{"t":"还待得下去吗，我不确定。","r":[{"who":"约翰·博伊德","cn":"做大人物还是做成事","u":"/i/boyd/to-be-or-to-do/","hint":"他对每个下属都讲过同一个选择","sc":"一个能升上去的机会和一件该做成的事冲突了。"},{"who":"张一鸣","cn":"延迟满足感","u":"/i/zhang-yiming/delayed-gratification/","hint":"很多人的问题在于太想赢眼前这一局","sc":"一个当期回报和一个更陡的成长斜率摆在面前。"}]},{"t":"钱和成长，我该先要哪个？","r":[{"who":"纳瓦尔","cn":"把自己产品化","u":"/i/naval/productize-yourself/","hint":"四个字，一半是做什么，一半是怎么放大","sc":"你能力不错，但收入和时间死死绑在一起。"},{"who":"巴菲特","cn":"能力圈","u":"/i/buffett/circle-of-competence/","hint":"圈多大不要紧，知不知道边在哪要命","sc":"一个圈外的机会很热，你怕错过。"}]},{"t":"平台给我流量，可人不是我的。","r":[{"who":"凯文·凯利","cn":"中间不能有人","u":"/i/kevin-kelly/direct-relationship/","hint":"隔一层平台，这道算术就不成立","sc":"你在某个平台上有一批读者或客户，但联系方式都在平台手里。"},{"who":"纳瓦尔","cn":"睡觉时也在赚钱的资产","u":"/i/naval/assets-while-you-sleep/","hint":"追求财富，别追求金钱或地位","sc":"你很忙，也小有成绩，但停下来就什么都没有。"}]},{"t":"我信错了人，现在不敢再信谁。","r":[{"who":"玛丽亚·康妮科娃","cn":"骗子不制造信任","u":"/i/konnikova/not-manufacturing-trust/","hint":"他不说服你，他找到你想要的","sc":"有人给了你一个很难拒绝的提议，你隐约觉得哪里不对但说不上来。"},{"who":"论语","cn":"视其所以，观其所由","u":"/i/analects/see-how/","hint":"看他做什么，看他为什么，看他心安在哪","sc":"要判断一个人能不能托付更重的事。"}]},{"t":"回头看破绽很明显，当时我就是没看见。","r":[{"who":"玛丽亚·康妮科娃","cn":"骗子不制造信任","u":"/i/konnikova/not-manufacturing-trust/","hint":"他不说服你，他找到你想要的","sc":"有人给了你一个很难拒绝的提议，你隐约觉得哪里不对但说不上来。"},{"who":"玛丽亚·康妮科娃","cn":"转变期是高危窗口","u":"/i/konnikova/transition-is-the-window/","hint":"上当的不是笨人，是正在换轨的人","sc":"你刚经历一次大变动——换城市、换工作、离婚、亲人去世、或者手上突然多了一笔钱。"}]},{"t":"被坑过一次，我现在谁都防。","r":[{"who":"论语","cn":"视其所以，观其所由","u":"/i/analects/see-how/","hint":"看他做什么，看他为什么，看他心安在哪","sc":"要判断一个人能不能托付更重的事。"},{"who":"韩非子","cn":"不恃人之为吾善","u":"/i/han-feizi/not-counting-on-goodness/","hint":"让做对的事成为最省力的选择","sc":"同一类问题反复出现，你已经强调过很多次。"}]},{"t":"我心软，一次次给他机会。","r":[{"who":"阿德勒","cn":"课题分离","u":"/i/adler/separation-of-tasks/","hint":"后果谁承担，就是谁的课题","sc":"一段关系让你持续难受，你反复想改变对方。"},{"who":"韩非子","cn":"二柄","u":"/i/han-feizi/two-handles/","hint":"把奖惩交出去，位置就空了","sc":"你名义上负责一件事，但推不动。"}]},{"t":"同一件事我们吵了很多次了。","r":[{"who":"约翰·戈特曼","cn":"末日四骑士","u":"/i/gottman/four-horsemen/","hint":"看十五分钟争吵，判断准确率超过九成","sc":"同一件事反复吵，每次都升级。"},{"who":"非暴力沟通","cn":"指责底下是需要","u":"/i/nonviolent-communication/needs-behind-blame/","hint":"所有攻击都是需要没被满足的笨拙表达","sc":"对方在指责你，你的第一反应是反驳。"}]},{"t":"话说重了，还修得回来吗？","r":[{"who":"约翰·戈特曼","cn":"修复尝试","u":"/i/gottman/repair-attempts/","hint":"幸福的伴侣也吵，区别在有人踩得住刹车","sc":"吵到一半，双方都在等对方先低头。"},{"who":"关键对话","cn":"先造安全感","u":"/i/crucial-conversations/safety-first/","hint":"对话失败的时刻，是有人觉得不安全的时刻","sc":"你说得越清楚，对方越沉默或越激动。"}]},{"t":"我们说的根本不是同一件事。","r":[{"who":"萨提亚","cn":"冰山：行为之下还有几层","u":"/i/satir/iceberg/","hint":"发火底下是失望，再底下是期待","sc":"同一种争执反复出现，讲道理没用。"},{"who":"托马斯·戈登","cn":"我信息","u":"/i/thomas-gordon/i-message/","hint":"行为 + 对我的影响 + 我的感受","sc":"你要指出对方的问题，已经憋了几句话。"}]},{"t":"我们一吵就收不住。","r":[{"who":"约翰·戈特曼","cn":"末日四骑士","u":"/i/gottman/four-horsemen/","hint":"看十五分钟争吵，判断准确率超过九成","sc":"同一件事反复吵，每次都升级。"},{"who":"约翰·戈特曼","cn":"修复尝试","u":"/i/gottman/repair-attempts/","hi :"一跟家人接触就被情绪带走。"}]},{"t":"又吵起来了，我已经忘了为什么。","r":[{"who":"关键对话","cn":"从心出发","u":"/i/crucial-conversations/start-with-heart/","hint":"情绪一上来，目标会偷偷从解决问题换成赢","sc":"对话正在升级，你察觉自己有点上头。"},{"who":"克里斯·沃斯","cn":"把对方的情绪说出来","u":"/i/chris-voss/labeling/","hint":"人被准确说中，就很难继续把你当敌人","sc":"对方沉默、回避，或者情绪明显但不说。"}]},{"t":"两个人的事，总要拉进第三个人。","r":[{"who":"鲍恩","cn":"拉进第三个人","u":"/i/bowen/triangles/","hint":"缓解了当下，也固化了结构","sc":"两个人的矛盾一直没解决，但总有第三个人在中间。"},{"who":"阿德勒","cn":"不是因为，是为了","u":"/i/adler/teleology/","hint":"他不是走不出过去，是需要过去","sc":"你反复用某段经历解释自己现在做不到的事。"}]},{"t":"他们只报好消息给我。","r":[{"who":"卡尔·罗杰斯","cn":"无条件积极关注","u":"/i/carl-rogers/unconditional-regard/","hint":"说了真话不会失去关系，人才敢说真话","sc":"你希望某个人对你说实话。"},{"who":"依恋理论","cn":"信息在重聚那一刻","u":"/i/attachment-theory/strange-situation/","hint":"回避型孩子的心率和哭闹的一样高","sc":"你判断不了某个人是真没事还是不肯说。"}]},{"t":"我上次的反应，是不是把人吓住了？","r":[{"who":"关键对话","cn":"先造安全感","u":"/i/crucial-conversations/safety-first/","hint":"对话失败的时刻，是有人觉得不安全的时刻","sc":"你说得越清楚，对方越沉默或越激动。"},{"who":"曹操","cn":"官渡烧信","u":"/i/cao-cao/burning-the-letters/","hint":"查清楚了，你会失去一半的人","sc":"一件事过去了，你手上握着能追责的证据。"}]},{"t":"等我知道的时候，事已经砸了。","r":[{"who":"关键对话","cn":"先造安全感","u":"/i/crucial-conversations/safety-first/","hint":"对话失败的时刻，是有人觉得不安全的时刻","sc":"你说得越清楚，对方越沉默或越激动。"},{"who":"战国策","cn":"邹忌照镜子","u":"/i/strategies-of-the-warring-states/three-mirrors/","hint":"夸得越好听，越要问他图什么","sc":"你的方案得到了一致好评。"}]},{"t":"我问了，他们还是说没事。","r":[{"who":"卡尔·罗杰斯","cn":"复述到对方点头","u":"/i/carl-rogers/reflective-listening/","hint":"他常常是在听你复述时，才第一次听清自己","sc":"有人向你倾诉，你已经想好了建议。"},{"who":"苏格拉底","cn":"产婆术","u":"/i/socrates/midwifery/","hint":"答案要从对方身上生出来才算数","sc":"你看出了答案，正要直接告诉对方。"}]},{"t":"我做的这些，好像不算数。","r":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时","sc":"家里的活总落在你一个人身上，说了几次也没变。"},{"who":"阿莉·霍克希尔德","cn":"情感劳动","u":"/i/hochschild/emotional-labor/","hint":"被要求的情绪也是工作量","sc":"一天没干多少活，但下班之后一句话都不想说。"}]},{"t":"我在家全天连轴转，还被说没上班。","r":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时","sc":"家里的活总落在你一个人身上，说了几次也没变。"},{"who":"萨提亚","cn":"压力下的四种姿态","u":"/i/satir/coping-stances/","hint":"四种都在回避真实","sc":"冲突一起来，双方都变了个人。"}]},{"t":"这些事总落在我头上。","r":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时","sc":"家里的活总落在你一个人身上，说了几次也没变。"},{"who":"托马斯·戈登","cn":"我信息","u":"/i/thomas-gordon/i-message/","hint":"行为 + 对我的影响 + 我的感受","sc":"你要指出对方的问题，已经憋了几句话。"}]},{"t":"我一提，就变成我在抱怨。","r":[{"who":"非暴力沟通","cn":"先说观察，别说评论","u":"/i/nonviolent-communication/observation-not-evaluation/","hint":"「你总是迟到」和「你这周迟到三次」是两件事","sc":"你准备指出对方的问题，已经憋了几句话。"},{"who":"萨提亚","cn":"冰山：行为之下还有几层","u":"/i/satir/iceberg/","hint":"发火底下是失望，再底下是期待","sc":"同一种争执反复出现，讲道理没用。"}]},{"t":"爸妈老了，我不知道能做什么。","r":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时","sc":"家里的活总落在你一个人身上，说了几次也没变。"},{"who":"托马斯·戈登","cn":"这问题是谁的","u":"/i/thomas-gordon/problem-ownership/","hint":"困扰他就听，困扰我才说","sc":"孩子或同事有情绪，你正准备给建议。"}]},{"t":"照顾他，把我自己也耗空了。","r":[{"who":"阿莉·霍克希尔德","cn":"情感劳动","u":"/i/hochschild/emotional-labor/","hint":"被要求的情绪也是工作量","sc":"一天没干多少活，但下班之后一句话都不想说。"},{"who":"萨波尔斯基","cn":"为逃命设计，被开成常态","u":"/i/sapolsky/stress-mismatch/","hint":"斑马跑掉就关，人一直开着","sc":"长期紧绷，说不上具体哪里出问题。"}]},{"t":"兄弟姐妹几个，就我在管。","r":[{"who":"托马斯·戈登","cn":"这问题是谁的","u":"/i/thomas-gordon/problem-ownership/","hint":"困扰他就听，困扰我才说","sc":"孩子或同事有情绪，你正准备给建议。"},{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时","sc":"家里的活总落在你一个人身上，说了几次也没变。"}]},{"t":"我又想尽孝，又想过自己的日子。","r":[{"who":"阿德勒","cn":"课题分离","u":"/i/adler/separation-of-tasks/","hint":"后果谁承担，就是谁的课题","sc":"一段关系让你持续难受，你反复想改变对方。"},{"who":"克里斯汀·内夫","cn":"三样必须同时在","u":"/i/kristin-neff/three-parts/","hint":"少一样就变成自怜、忍受或冷漠","sc":"你知道该对自己好一点，可一试就觉得假，或者一试就滑进自怜。"}]},{"t":"他背着我做了那件事。","r":[{"who":"约翰·戈特曼","cn":"末日四骑士","u":"/i/gottman/four-horsemen/","hint":"看十五分钟争吵，判断准确率超过九成","sc":"同一件事反复吵，每次都升级。"},{"who":"玛丽亚·康妮科娃","cn":"骗子不制造信任","u":"/i/konnikova/not-manufacturing-trust/","hint":"他不说服你，他找到你想要的","sc":"有人给了你一个很难拒绝的提议，你隐约觉得哪里不对但说不上来。"}]},{"t":"我原谅了，可心里过不去。","r":[{"who":"约翰·戈特曼","cn":"修复尝试","u":"/i/gottman/repair-attempts/","hint":"幸福的伴侣也吵，区别在有人踩得住刹车","sc":"吵到一半，双方都在等对方先低头。"},{"who":"爱比克泰德","cn":"扰乱你的不是事情","u":"/i/epictetus/judgments-not-things/","hint":"死亡不可怕这句话，重点在后半句","sc":"某句话或某件事让你反应很大，久久平不下来。"}]},{"t":"还要不要继续，我拿不定。","r":[{"who":"韩信","cn":"不反也不退","u":"/i/han-xin/neither-nor/","hint":"两条路都不选，等于选了最坏的一条","sc":"你手上有一份让人忌惮的资源，同时觉得关系没问题。"},{"who":"李嘉诚","cn":"知止","u":"/i/li-ka-shing/knowing-when-to-stop/","hint":"扩张年代挂一幅劝刹车的字","sc":"行情火热，团队士气正盛，你在考虑追加。"}]},{"t":"我一躺下脑子就停不下来。","r":[{"who":"约翰·瑞迪","cn":"焦虑时动比想有用","u":"/i/john-ratey/move-before-you-think/","hint":"想不通的事，走一圈之后常常没那么可怕","sc":"一件事在脑子里转了很多遍，越想越慌。"},{"who":"塞涅卡","cn":"愤怒有一道闸门","u":"/i/seneca/on-anger/","hint":"愤怒是三步，只有第二步归你管","sc":"有人惹到你，你正准备回击。"}]},{"t":"睡够了还是觉得累。","r":[{"who":"约翰·瑞迪","cn":"运动是给大脑用的","u":"/i/john-ratey/exercise-for-the-brain/","hint":"把体育课挪到第一节，成绩变了","sc":"脑子转不动，正在硬撑。"},{"who":"卡尔·纽波特","cn":"注意力残留","u":"/i/cal-newport/attention-residue/","hint":"回了一条消息，之后半小时都在打折","sc":"一天很忙，但没有推进任何需要动脑的事。"}]},{"t":"越怕睡不着，就越睡不着。","r":[{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中","sc":"你在直接努力获得某种状态（快乐、自信、松弛），越努力越远。"},{"who":"萨波尔斯基","cn":"不确定比强度更伤","u":"/i/sapolsky/predictability/","hint":"知道电击何时来的动物，损伤小得多","sc":"压力大且减不下来。"}]},{"t":"睡前那会儿，白天的事全回来了。","r":[{"who":"马可·奥勒留","cn":"晨起预演","u":"/i/marcus-aurelius/morning-preparation/","hint":"预料到的冒犯，伤害减半","sc":"今天有一场你预感会不愉快的会。"},{"who":"卡尔·纽波特","cn":"注意力残留","u":"/i/cal-newport/attention-residue/","hint":"回了一条消息，之后半小时都在打折","sc":"一天很忙，但没有推进任何需要动脑的事。"}]},{"t":"一到下午我就废了。","r":[{"who":"约翰·瑞迪","cn":"运动是给大脑用的","u":"/i/john-ratey/exercise-for-the-brain/","hint":"把体育课挪到第一节，成绩变了","sc":"脑子转不动，正在硬撑。"},{"who":"卡尔·纽波特","cn":"整块时间要占住","u":"/i/cal-newport/schedule-the-depth/","hint":"像开会一样把深度时段写进日程","sc":"重要但不紧急的事一直排不进去。"}]},{"t":"我是不是一直在硬撑？","r":[{"who":"塞涅卡","cn":"时间是唯一追不回的成本","u":"/i/seneca/on-shortness-of-life/","hint":"不是我们的时间太短，是浪费得太多","sc":"日程被填满，每一项都有理由，但你说不出这周为自己做了什么。"},{"who":"约翰·瑞迪","cn":"焦虑时动比想有用","u":"/i/john-ratey/move-before-you-think/","hint":"想不通的事，走一圈之后常常没那么可怕","sc":"一件事在脑子里转了很多遍，越想越慌。"}]},{"t":"我最好的状态去哪了？","r":[{"who":"契克森米哈赖","cn":"最好的时刻不在休息里","u":"/i/csikszentmihalyi/leisure-paradox/","hint":"人想休息，但心流多在工作中","sc":"累了一天，只想瘫着。"},{"who":"萨波尔斯基","cn":"为逃命设计，被开成常态","u":"/i/sapolsky/stress-mismatch/","hint":"斑马跑掉就关，人一直开着","sc":"长期紧绷，说不上具体哪里出问题。"}]},{"t":"我一会儿就想去看手机。","r":[{"who":"卡尔·纽波特","cn":"注意力残留","u":"/i/cal-newport/attention-residue/","hint":"回了一条消息，之后半小时都在打折","sc":"一天很忙，但没有推进任何需要动脑的事。"},{"who":"原子习惯","cn":"从身份下手","u":"/i/atomic-habits/identity-first/","hint":"每个小行动都是给某个身份投的一票","sc":"某个习惯你靠意志力维持，反复失败。"}]},{"t":"整块时间总是被切碎。","r":[{"who":"卡尔·纽波特","cn":"整块时间要占住","u":"/i/cal-newport/schedule-the-depth/","hint":"像开会一样把深度时段写进日程","sc":"重要但不紧急的事一直排不进去。"},{"who":"塞涅卡","cn":"时间是唯一追不回的成本","u":"/i/seneca/on-shortness-of-life/","hint":"不是我们的时间太短，是浪费得太多","sc":"日程被填满，每一项都有理由，但你说不出这周为自己做了什么。"}]},{"t":"我一坐下就想干点别的。","r":[{"who":"契克森米哈赖","cn":"卡在能力边缘那条通道","u":"/i/csikszentmihalyi/flow-channel/","hint":"心流只在很窄的一段里发生","sc":"做同一件事，有时投入有时煎熬。"},{"who":"BJ·福格","cn":"挂在锚点上，做完就庆祝","u":"/i/bj-fogg/anchor-and-celebrate/","hint":"大脑靠情绪记住习惯，不靠次数","sc":"新习惯总是断。"}]},{"t":"太难我慌，太简单我又走神。","r":[{"who":"契克森米哈赖","cn":"卡在能力边缘那条通道","u":"/i/csikszentmihalyi/flow-channel/","hint":"心流只在很窄的一段里发生","sc":"做同一件事，有时投入有时煎熬。"},{"who":"契克森米哈赖","cn":"最好的时刻不在休息里","u":"/i/csikszentmihalyi/leisure-paradox/","hint":"人想休息，但心流多在工作中","sc":"累了一天，只想瘫着。"}]},{"t":"我下过很多次决心，每次都断。","r":[{"who":"原子习惯","cn":"从身份下手","u":"/i/atomic-habits/identity-first/","hint":"每个小行动都是给某个身份投的一票","sc":"某个习惯你靠意志力维持，反复失败。"},{"who":"阿德勒","cn":"不是因为，是为了","u":"/i/adler/teleology/","hint":"他不是走不出过去，是需要过去","sc":"你反复用某段经历解释自己现在做不到的事。"}]},{"t":"我怎么才能坚持下来？","r":[{"who":"原子习惯","cn":"落到系统的水平","u":"/i/atomic-habits/systems-over-goals/","hint":"每支队都想赢冠军，目标区分不出谁赢","sc":"你定了目标却一直没做到。"},{"who":"富兰克林","cn":"一周只练一条","u":"/i/franklin/one-virtue-a-week/","hint":"十三条同时练等于一条都不练","sc":"你想改掉的毛病列出来有好几条。"}]},{"t":"每次都靠咬牙，撑不了几天。","r":[{"who":"BJ·福格","cn":"小到最糟那天也做得到","u":"/i/bj-fogg/tiny-habits/","hint":"两个俯卧撑，从没失败过","sc":"某个习惯反复建立又反复放弃。"},{"who":"BJ·福格","cn":"挂在锚点上，做完就庆祝","u":"/i/bj-fogg/anchor-and-celebrate/","hint":"大脑靠情绪记住习惯，不靠次数","sc":"新习惯总是断。"}]},{"t":"我一直在练，可就是没长进。","r":[{"who":"艾利克森","cn":"一万小时是误读","u":"/i/ericsson/not-ten-thousand-hours/","hint":"十年经验，也可能是一年重复了十次","sc":"你在一件事上投入了很久，成效不明显。"},{"who":"维果茨基","cn":"最近发展区","u":"/i/vygotsky/zpd/","hint":"给点提示就能做到的那一段","sc":"教人或自学，不知道难度该定在哪。"}]},{"t":"我好像很久没真正松下来了。","r":[{"who":"塞涅卡","cn":"时间是唯一追不回的成本","u":"/i/seneca/on-shortness-of-life/","hint":"不是我们的时间太短，是浪费得太多","sc":"日程被填满，每一项都有理由，但你说不出这周为自己做了什么。"},{"who":"约翰·瑞迪","cn":"焦虑时动比想有用","u":"/i/john-ratey/move-before-you-think/","hint":"想不通的事，走一圈之后常常没那么可怕","sc":"一件事在脑子里转了很多遍，越想越慌。"}]},{"t":"这样下去我会不会垮？","r":[{"who":"约翰·瑞迪","cn":"运动是给大脑用的","u":"/i/john-ratey/exercise-for-the-brain/","hint":"把体育课挪到第一节，成绩变了","sc":"脑子转不动，正在硬撑。"},{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类","sc":"一件坏事发生了，你在反复想它。"}]},{"t":"我这根弦绷了太久了。","r":[{"who":"萨波尔斯基","cn":"为逃命设计，被开成常态","u":"/i/sapolsky/stress-mismatch/","hint":"斑马跑掉就关，人一直开着","sc":"长期紧绷，说不上具体哪里出问题。"},{"who":"萨波尔斯基","cn":"不确定比强度更伤","u":"/i/sapolsky/predictability/","hint":"知道电击何时来的动物，损伤小得多","sc":"压力大且减不下来。"}]},{"t":"压力不算大，我却一直绷着。","r":[{"who":"萨波尔斯基","cn":"不确定比强度更伤","u":"/i/sapolsky/predictability/","hint":"知道电击何时来的动物，损伤小得多","sc":"压力大且减不下来。"},{"who":"尼采","cn":"凝视深渊","u":"/i/nietzsche/gazing-into-abyss/","hint":"打法会长进打的人身上","sc":"你在和一个不讲规则的对手长期缠斗。"}]},{"t":"一天下来，没一件是我自己的事。","r":[{"who":"塞涅卡","cn":"时间是唯一追不回的成本","u":"/i/seneca/on-shortness-of-life/","hint":"不是我们的时间太短，是浪费得太多","sc":"日程被填满，每一项都有理由，但你说不出这周为自己做了什么。"},{"who":"卡尔·纽波特","cn":"整块时间要占住","u":"/i/cal-newport/schedule-the-depth/","hint":"像开会一样把深度时段写进日程","sc":"重要但不紧急的事一直排不进去。"}]},{"t":"我到底该砍掉哪一块？","r":[{"who":"富兰克林","cn":"一周只练一条","u":"/i/franklin/one-virtue-a-week/","hint":"十三条同时练等于一条都不练","sc":"你想改掉的毛病列出来有好几条。"},{"who":"原子习惯","cn":"落到系统的水平","u":"/i/atomic-habits/systems-over-goals/","hint":"每支队都想赢冠军，目标区分不出谁赢","sc":"你定了目标却一直没做到。"}]},{"t":"家里的活，我好像永远做不完。","r":[{"who":"阿莉·霍克希尔德","cn":"第二班","u":"/i/hochschild/second-shift/","hint":"一年多干出一个月的二十四小时","sc":"家里的活总落在你一个人身上，说了几次也没变。"},{"who":"卡尔·纽波特","cn":"整块时间要占住","u":"/i/cal-newport/schedule-the-depth/","hint":"像开会一样把深度时段写进日程","sc":"重要但不紧急的事一直排不进去。"}]},{"t":"检查结果出来了，我不敢看。","r":[{"who":"马可·奥勒留","cn":"从高处看","u":"/i/marcus-aurelius/view-from-above/","hint":"换一个时间尺度，多数急事会缩小","sc":"一件事让你焦虑到无法处理别的事。"},{"who":"苏轼","cn":"也无风雨也无晴","u":"/i/su-shi/no-wind-no-rain/","hint":"淋完那场雨，回头看什么都没发生","sc":"一件已成定局的坏事，你还在反复回想。"}]},{"t":"这个病要跟我过一辈子。","r":[{"who":"萨波尔斯基","cn":"不确定比强度更伤","u":"/i/sapolsky/predictability/","hint":"知道电击何时来的动物，损伤小得多","sc":"压力大且减不下来。"},{"who":"爱比克泰德","cn":"扰乱你的不是事情","u":"/i/epictetus/judgments-not-things/","hint":"死亡不可怕这句话，重点在后半句","sc":"某句话或某件事让你反应很大，久久平不下来。"}]},{"t":"家里人病了，我撑着不能倒。","r":[{"who":"约翰·瑞迪","cn":"运动是给大脑用的","u":"/i/john-ratey/exercise-for-the-brain/","hint":"把体育课挪到第一节，成绩变了","sc":"脑子转不动，正在硬撑。"},{"who":"阿莉·霍克希尔德","cn":"情感劳动","u":"/i/hochschild/emotional-labor/","hint":"被要求的情绪也是工作量","sc":"一天没干多少活，但下班之后一句话都不想说。"}]},{"t":"从小按分数活，现在没人给我打分了。","r":[{"who":"优秀的绵羊","cn":"擅长跨栏，不擅长选路","u":"/i/excellent-sheep/hurdles/","hint":"做到最好，和决定什么值得做","sc":"你很清楚怎样算做得好，却答不上想要什么。"},{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么","sc":"你要做一个关于方向的选择。"}]},{"t":"我一直很优秀，可我不知道要去哪。","r":[{"who":"乔布斯","cn":"连点成线只能回头看","u":"/i/jobs/connecting-the-dots/","hint":"退学后旁听的字体课，十年后进了Mac","sc":"一件让你着迷的事，看不出任何用处，你在犹豫投不投入。"},{"who":"苏格拉底","cn":"不自以为知道","u":"/i/socrates/knowing-not-knowing/","hint":"神谕说他最智慧，他去证伪，结果证实了","sc":"你在自己擅长的领域之外，正要给出一个很有把握的判断。"}]},{"t":"没人给我题了，我不知道做什么。","r":[{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么","sc":"你要做一个关于方向的选择。"},{"who":"苏格拉底","cn":"产婆术","u":"/i/socrates/midwifery/","hint":"答案要从对方身上生出来才算数","sc":"你看出了答案，正要直接告诉对方。"}]},{"t":"我做的每件事都是为了给人看。","r":[{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么","sc":"你要做一个关于方向的选择。"},{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中","sc":"你在直接努力获得某种状态（快乐、自信、松弛），越努力越远。"}]},{"t":"刚进来，我什么都不会。","r":[{"who":"维果茨基","cn":"最近发展区","u":"/i/vygotsky/zpd/","hint":"给点提示就能做到的那一段","sc":"教人或自学，不知道难度该定在哪。"},{"who":"艾利克森","cn":"练已经会的等于休息","u":"/i/ericsson/deliberate-practice/","hint":"顶尖学生把时间花在弹不好的那几小节","sc":"你练了很久但感觉没长进。"}]},{"t":"我不知道该问人还是自己扛。","r":[{"who":"维果茨基","cn":"脚手架：给了要撤","u":"/i/vygotsky/scaffolding/","hint":"搭起来是为了拆掉","sc":"你在教一个人，不确定该给多少。"},{"who":"苏格拉底","cn":"产婆术","u":"/i/socrates/midwifery/","hint":"答案要从对方身上生出来才算数","sc":"你看出了答案，正要直接告诉对方。"}]},{"t":"我干的活好像谁都能干。","r":[{"who":"纳瓦尔","cn":"把自己产品化","u":"/i/naval/productize-yourself/","hint":"四个字，一半是做什么，一半是怎么放大","sc":"你能力不错，但收入和时间死死绑在一起。"},{"who":"纳瓦尔","cn":"睡觉时也在赚钱的资产","u":"/i/naval/assets-while-you-sleep/","hint":"追求财富，别追求金钱或地位","sc":"你很忙，也小有成绩，但停下来就什么都没有。"}]},{"t":"读还是工作，我怕选错了。","r":[{"who":"思考，快与慢","cn":"损失厌恶","u":"/i/thinking-fast-and-slow/loss-aversion/","hint":"同一笔钱，失去的痛两倍于得到的乐","sc":"一个改变现状的提案，你本能地觉得风险太大。"},{"who":"黄仁勋","cn":"有尊严地撤退","u":"/i/huang/strategic-retreat/","hint":"撤退对最聪明的人来说最难","sc":"一块业务还在长，但结构上看不到出路，而它是团队的骄傲。"}]},{"t":"别人都在卷学历，我慌了。","r":[{"who":"艾利克森","cn":"一万小时是误读","u":"/i/ericsson/not-ten-thousand-hours/","hint":"十年经验，也可能是一年重复了十次","sc":"你在一件事上投入了很久，成效不明显。"},{"who":"德韦克","cn":"这个效应比流行说法小得多","u":"/i/dweck/effect-size/","hint":"是温和因素，不是万能开关","sc":"有人用「心态问题」解释一个结果。"}]},{"t":"多读几年，我怕跟社会脱节。","r":[{"who":"艾利克森","cn":"练已经会的等于休息","u":"/i/ericsson/deliberate-practice/","hint":"顶尖学生把时间花在弹不好的那几小节","sc":"你练了很久但感觉没长进。"},{"who":"李小龙","cn":"像水一样","u":"/i/bruce-lee/be-water/","hint":"水进杯是杯形，进壶是壶形，还能穿石","sc":"你引以为傲的方法论正在被环境变化架空。"}]},{"t":"这书我是为自己读还是为交代。","r":[{"who":"优秀的绵羊","cn":"给自己一段没有评分的时间","u":"/i/excellent-sheep/no-scoreboard/","hint":"没人打分时，你才知道要什么","sc":"你要做一个关于方向的选择。"},{"who":"王阳明","cn":"致良知","u":"/i/wang-yangming/innate-knowing/","hint":"难的不是不知道，是不肯认","sc":"一件事你想了很久还没定，但心里其实一直有个方向。"}]},{ -the-opposite/","hint":"旱天囤船，涝天囤车","sc":"某样东西现在很便宜，但所有人都说它没前途。"}]},{"t":"没了这个身份，我是谁。","r":[{"who":"弗兰克尔","cn":"最后的自由","u":"/i/frankl/the-last-freedom/","hint":"这句话的分量在它写作的地点","sc":"处境已经压到你觉得毫无选择。"},{"who":"庄子","cn":"无用之用","u":"/i/zhuangzi/use-of-uselessness/","hint":"有用是一种被消耗的资格","sc":"你是团队里那个什么事都能扛的人，越来越忙。"}]},{"t":"我不知道日子怎么继续。","r":[{"who":"弗兰克尔","cn":"最后的自由","u":"/i/frankl/the-last-freedom/","hint":"这句话的分量在它写作的地点","sc":"处境已经压到你觉得毫无选择。"},{"who":"马可·奥勒留","cn":"从高处看","u":"/i/marcus-aurelius/view-from-above/","hint":"换一个时间尺度，多数急事会缩小","sc":"一件事让你焦虑到无法处理别的事。"}]},{"t":"我总觉得当初还能做点什么。","r":[{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类","sc":"一件坏事发生了，你在反复想它。"},{"who":"庄子","cn":"齐物","u":"/i/zhuangzi/equalizing-things/","hint":"争论之前先问用的是谁的尺子","sc":"一个分歧反复出现，每次都吵不出结果。"}]},{"t":"半年过去了，我还是缓不过来。","r":[{"who":"玛丽亚·康妮科娃","cn":"转变期是高危窗口","u":"/i/konnikova/transition-is-the-window/","hint":"上当的不是笨人，是正在换轨的人","sc":"你刚经历一次大变动——换城市、换工作、离婚、亲人去世、或者手上突然多了一笔钱。"},{"who":"苏轼","cn":"也无风雨也无晴","u":"/i/su-shi/no-wind-no-rain/","hint":"淋完那场雨，回头看什么都没发生","sc":"一件已成定局的坏事，你还在反复回想。"}]},{"t":"别人都往前走了，只有我停着。","r":[{"who":"马可·奥勒留","cn":"从高处看","u":"/i/marcus-aurelius/view-from-above/","hint":"换一个时间尺度，多数急事会缩小","sc":"一件事让你焦虑到无法处理别的事。"},{"who":"克里斯汀·内夫","cn":"三样必须同时在","u":"/i/kristin-neff/three-parts/","hint":"少一样就变成自怜、忍受或冷漠","sc":"你知道该对自己好一点，可一试就觉得假，或者一试就滑进自怜。"}]},{"t":"我怕时间久了就把他忘了。","r":[{"who":"弗兰克尔","cn":"最后的自由","u":"/i/frankl/the-last-freedom/","hint":"这句话的分量在它写作的地点","sc":"处境已经压到你觉得毫无选择。"},{"who":"塞涅卡","cn":"时间是唯一追不回的成本","u":"/i/seneca/on-shortness-of-life/","hint":"不是我们的时间太短，是浪费得太多","sc":"日程被填满，每一项都有理由，但你说不出这周为自己做了什么。"}]},{"t":"我这个年纪从头来，太晚了吗？","r":[{"who":"苏轼","cn":"黄州惠州儋州","u":"/i/su-shi/three-exiles/","hint":"他把三次流放当成三个任期","sc":"你被放到一个没什么资源和前景的位置上。"},{"who":"尼采","cn":"杀不死我的","u":"/i/nietzsche/what-does-not-kill/","hint":"它是格言，不是自然规律","sc":"一次重创过去了，你想让它有点用。"}]},{"t":"过去那些年是不是白费了？","r":[{"who":"达里奥","cn":"痛苦加反思等于进步","u":"/i/dalio/pain-plus-reflection/","hint":"他判断对了危机，输光了公司","sc":"一次代价很大的失败刚刚过去。"},{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中","sc":"你在直接努力获得某种状态（快乐、自信、松弛），越努力越远。"}]},{"t":"退路已经没有了，只能往前。","r":[{"who":"项羽","cn":"破釜沉舟","u":"/i/xiang-yu/sinking-the-boats/","hint":"同一招救过他一次，也毁了他一次","sc":"你想集中全部资源做一次决定性的投入。"},{"who":"韩信","cn":"背水一战","u":"/i/han-xin/back-to-the-river/","hint":"这一招有前提，没前提就是送死","sc":"你想用一次硬截止或者背水一战逼出团队的战斗力。"}]},{"t":"我快撑不住了，但不能倒。","r":[{"who":"马可·奥勒留","cn":"障碍即道路","u":"/i/marcus-aurelius/obstacle-is-the-way/","hint":"火把扔进去的东西都会变成火","sc":"一件计划中的事被外部因素卡死了。"},{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类","sc":"一件坏事发生了，你在反复想它。"}]},{"t":"我撑下去，图的是什么？","r":[{"who":"弗兰克尔","cn":"最后的自由","u":"/i/frankl/the-last-freedom/","hint":"这句话的分量在它写作的地点","sc":"处境已经压到你觉得毫无选择。"},{"who":"尼采","cn":"杀不死我的","u":"/i/nietzsche/what-does-not-kill/","hint":"它是格言，不是自然规律","sc":"一次重创过去了，你想让它有点用。"}]},{"t":"我兵力不如人，只能这么耗着。","r":[{"who":"拿破仑","cn":"决定点上的多数","u":"/i/napoleon/decisive-point/","hint":"他多数战役的总兵力都不占优","sc":"你的总资源明显少于对手。"},{"who":"毛泽东","cn":"论持久战","u":"/i/mao/on-protracted-war/","hint":"弱的一方先改战争的形状","sc":"你比对方弱，对面在逼你这周见分晓。"}]},{"t":"换了城市，我谁也不认识。","r":[{"who":"格兰诺维特","cn":"弱连接的力量","u":"/i/granovetter/weak-ties/","hint":"56% 只是偶尔见面的人","sc":"你在找机会——工作、合作、客户——但只在最熟的几个人里打转。"},{"who":"玛丽亚·康妮科娃","cn":"转变期是高危窗口","u":"/i/konnikova/transition-is-the-window/","hint":"上当的不是笨人，是正在换轨的人","sc":"你刚经历一次大变动——换城市、换工作、离婚、亲人去世、或者手上突然多了一笔钱。"}]},{"t":"到了新地方，机会一个都不找上门。","r":[{"who":"格兰诺维特","cn":"弱连接的力量","u":"/i/granovetter/weak-ties/","hint":"56% 只是偶尔见面的人","sc":"你在找机会——工作、合作、客户——但只在最熟的几个人里打转。"},{"who":"格兰诺维特","cn":"没有一条强连接是桥","u":"/i/granovetter/no-strong-tie-is-a-bridge/","hint":"你和好友知道的事高度重叠","sc":"你想让自己或团队更早知道外面在发生什么。"}]},{"t":"圈子就这么大，我听不到新消息。","r":[{"who":"格兰诺维特","cn":"没有一条强连接是桥","u":"/i/granovetter/no-strong-tie-is-a-bridge/","hint":"你和好友知道的事高度重叠","sc":"你想让自己或团队更早知道外面在发生什么。"},{"who":"主权个人","cn":"暴力的逻辑","u":"/i/sovereign-individual/logic-of-violence/","hint":"保护与勒索的成本比，决定社会的形状","sc":"你在预判一个行业或制度的走向。"}]},{"t":"这件事根本不由我决定。","r":[{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类","sc":"一件坏事发生了，你在反复想它。"},{"who":"马基雅维利","cn":"命运与能力","u":"/i/machiavelli/fortune-and-virtu/","hint":"河堤要在洪水来之前修","sc":"眼下一切顺利，你在考虑要不要为一件还没发生的事花钱。"}]},{"t":"我还能做点什么？","r":[{"who":"马可·奥勒留","cn":"障碍即道路","u":"/i/marcus-aurelius/obstacle-is-the-way/","hint":"火把扔进去的东西都会变成火","sc":"一件计划中的事被外部因素卡死了。"},{"who":"曼德拉","cn":"把审判变成讲台","u":"/i/mandela/rivonia/","hint":"他放弃了脱罪，换来四小时不被打断","sc":"你被拖进一场按规则必输的对局。"}]},{"t":"规则别人定的，我怎么办？","r":[{"who":"主权个人","cn":"从公民到顾客","u":"/i/sovereign-individual/citizen-to-customer/","hint":"他们在1997年预言了数字货币","sc":"你在做十年尺度的个人或事业布局。"},{"who":"枪炮、病菌与钢铁","cn":"亚力之问","u":"/i/guns-germs-steel/yalis-question/","hint":"一个新几内亚人的问题，他答了二十五年","sc":"一个群体或团队长期落后，流行的解释是「他们不行」。"}]},{"t":"这些规矩谁定的，我就得认吗？","r":[{"who":"人类简史","cn":"靠虚构合作","u":"/i/sapiens/fictions-that-cooperate/","hint":"陌生人大规模协作的黏合剂不是真的","sc":"你要让一群互不相识、甚至互不喜欢的人协作。"},{"who":"有限与无限的游戏","cn":"与边界游戏","u":"/i/finite-and-infinite-games/playing-with-boundaries/","hint":"有限玩家在边界内玩，无限玩家玩边界","sc":"现有规则对你越来越不利。"}]},{"t":"这事已经发生了，我改不了。","r":[{"who":"爱比克泰德","cn":"扰乱你的不是事情","u":"/i/epictetus/judgments-not-things/","hint":"死亡不可怕这句话，重点在后半句","sc":"某句话或某件事让你反应很大，久久平不下来。"},{"who":"苏轼","cn":"也无风雨也无晴","u":"/i/su-shi/no-wind-no-rain/","hint":"淋完那场雨，回头看什么都没发生","sc":"一件已成定局的坏事，你还在反复回想。"}]},{"t":"我怎么才能不再反复想它？","r":[{"who":"六祖慧能","cn":"本来无一物","u":"/i/huineng/originally-not-a-thing/","hint":"神秀在擦镜子，慧能问哪来的镜子","sc":"一件事你已经很努力地在管，但从来没有变轻松过。"},{"who":"庄子","cn":"齐物","u":"/i/zhuangzi/equalizing-things/","hint":"争论之前先问用的是谁的尺子","sc":"一个分歧反复出现，每次都吵不出结果。"}]},{"t":"我们的差距是怎么拉开的？","r":[{"who":"枪炮、病菌与钢铁","cn":"亚力之问","u":"/i/guns-germs-steel/yalis-question/","hint":"一个新几内亚人的问题，他答了二十五年","sc":"一个群体或团队长期落后，流行的解释是「他们不行」。"},{"who":"战争论","cn":"政治的继续","u":"/i/on-war/continuation-of-politics/","hint":"忘了为什么打的仗，赢了也没用","sc":"一场对抗已经持续很久，越打越凶。"}]},{"t":"换了新领导，还是老样子。","r":[{"who":"旧制度与大革命","cn":"穿过革命的集权","u":"/i/old-regime/centralization-survived/","hint":"大革命砸碎的是外壳，接手的是机器","sc":"一场彻底的变革刚完成，一切看起来都是新的。"},{"who":"国家为什么会失败","cn":"一墙之隔的诺加莱斯","u":"/i/why-nations-fail/two-nogales/","hint":"同一片沙漠，同一群人的后代，两种命运","sc":"两组条件相似的人，结果差距巨大。"}]},{"t":"该做的我都做了，还是没用。","r":[{"who":"荀子","cn":"天行有常","u":"/i/xunzi/constant-heaven/","hint":"抱怨天时的人，浪费的是自己的那一半","sc":"结果不好，最顺手的解释是外部环境。"},{"who":"马基雅维利","cn":"命运与能力","u":"/i/machiavelli/fortune-and-virtu/","hint":"河堤要在洪水来之前修","sc":"眼下一切顺利，你在考虑要不要为一件还没发生的事花钱。"}]},{"t":"那还要不要接着做？","r":[{"who":"道德经","cn":"无为而无不为","u":"/i/tao-te-ching/wu-wei/","hint":"多数失控来自动作太多","sc":"事情不顺，你在想还能再加点什么管理动作。"},{"who":"弗兰克尔","cn":"幸福不能被追求","u":"/i/frankl/happiness-ensues/","hint":"越瞄准它越打不中","sc":"你在直接努力获得某种状态（快乐、自信、松弛），越努力越远。"}]},{"t":"起点就不一样，我使劲有用吗？","r":[{"who":"荀子","cn":"天行有常","u":"/i/xunzi/constant-heaven/","hint":"抱怨天时的人，浪费的是自己的那一半","sc":"结果不好，最顺手的解释是外部环境。"},{"who":"曼德拉","cn":"把审判变成讲台","u":"/i/mandela/rivonia/","hint":"他放弃了脱罪，换来四小时不被打断","sc":"你被拖进一场按规则必输的对局。"}]},{"t":"我朋友过得好，我心里不是滋味。","r":[{"who":"刘邦","cn":"三个不如","u":"/i/liu-bang/three-i-cannot/","hint":"当众说出自己不如谁，是一种权力","sc":"团队里有人在某件事上明显比你强，你有点不自在。"},{"who":"庄子","cn":"齐物","u":"/i/zhuangzi/equalizing-things/","hint":"争论之前先问用的是谁的尺子","sc":"一个分歧反复出现，每次都吵不出结果。"}]},{"t":"我怎么老在跟人比？","r":[{"who":"爱比克泰德","cn":"控制二分法","u":"/i/epictetus/dichotomy/","hint":"全书第一句就是一次分类","sc":"一件坏事发生了，你在反复想它。"},{"who":"苏轼","cn":"眼前见天下无一个不好人","u":"/i/su-shi/no-bad-people/","hint":"不是天真，是拒绝用敌我看世界","sc":"你和某人有过节，现在每次接触都在防备。"}]},{"t":"看到同事升了，我笑不出来。","r":[{"who":"刘邦","cn":"三个不如","u":"/i/liu-bang/three-i-cannot/","hint":"当众说出自己不如谁，是一种权力","sc":"团队里有人在某件事上明显比你强，你有点不自在。"},{"who":"克里斯汀·内夫","cn":"自我关怀不是自尊","u":"/i/kristin-neff/not-self-esteem/","hint":"自尊要赢过谁，自我关怀不用","sc":"你搞砸了一件事，正在心里反复骂自己，越骂越动不了。"}]},{"t":"我这样想，是不是很小人。","r":[{"who":"布琳·布朗","cn":"内疚能改，羞耻不能","u":"/i/brene-brown/guilt-not-shame/","hint":"指着行为的话留了路，指着人的话没留","sc":"出了错，心里那股难受停不下来，你反复回想。"},{"who":"克里斯汀·内夫","cn":"三样必须同时在","u":"/i/kristin-neff/three-parts/","hint":"少一样就变成自怜、忍受或冷漠","sc":"你知道该对自己好一点，可一试就觉得假，或者一试就滑进自怜。"}]},{"t":"那
