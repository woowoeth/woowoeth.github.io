<style>
:root{
  color-scheme:light only;
  --white:#fffdf8;--paper:#f7f4ec;--paper2:#efe8dc;
  --ink:#1c1917;--ink-70:#3a342f;--ink-50:#6b6358;--ink-30:#9a9184;
  --up:#9d2933;--sulfur:#f0ddd9;--up-bg:rgba(157,41,51,.12);
  --down:#9d2933;--down-bg:rgba(157,41,51,.10);
  --line:rgba(42,46,44,.08);--line-strong:rgba(42,46,44,.12);--line-2:rgba(42,46,44,.045);
  --tint:rgba(42,46,44,.03);--tint-hover:rgba(42,46,44,.055);
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-out-quart:cubic-bezier(0.25,1,0.5,1);
  --ease-spring:cubic-bezier(0.34,1.4,0.64,1);
  --dur-tap:100ms;--dur-fast:150ms;--dur-base:200ms;--dur-slow:260ms;
  --shadow-card:0 0 0 1px var(--line),0 1px 2px rgba(42,46,44,.04),0 4px 12px rgba(42,46,44,.02);
  --shadow-card-hover:0 0 0 1px var(--line-strong),0 2px 4px rgba(42,46,44,.05),0 8px 24px rgba(42,46,44,.05);
  --shadow-focus:0 0 0 3px rgba(42,46,44,.16);
  --glass-chrome:rgba(240,240,236,.72);--glass-light:rgba(250,250,247,.85);
  --r1:8px;--r2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-optical-sizing:auto;line-height:1.55;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 96px}

/* skip-link + focus */
.skip-link{position:absolute;left:12px;top:-52px;z-index:100;padding:8px 16px;background:var(--ink);color:var(--white);border-radius:6px;font-size:13px;font-weight:600;text-decoration:none;transition:top var(--dur-base) var(--ease-out-quart)}
.skip-link:focus{top:12px;outline:none}
:focus-visible{box-shadow:var(--shadow-focus);outline:none;border-radius:5px}

/* masthead — glass sticky */
/* unified brand lockup — match entry pages / yuansheng */
/* responsive lockup */
/* 页头的字号/尺寸/左右内距由 assets/hw-home-lockup.css 以 !important 统一接管，

   lockup 没管的属性：white-space。改页头请改 hw-home-lockup.css。
   小屏左右留白 24px 是选定的宽松版，不是漏改——原来那条 16px 的对比图看过后

}
@media(max-width:480px){
  .hd-title{white-space:normal}
}

.hd::after{display:none}

.hd-title{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;font-size:clamp(22px,4.2vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hd-title .dot{color:#9d2933}

  .wrap{padding:0 24px 8px}

}

.hd{position:sticky;top:0;z-index:50;margin:0 -24px 26px;padding:26px 24px 15px;background:var(--glass-chrome);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.hd::after{content:'';position:absolute;left:24px;right:24px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(42,46,44,.10),transparent)}
.brand{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-50);margin-bottom:11px}
.hd-row{display:flex;align-items:baseline;gap:12px;margin-bottom:13px;flex-wrap:wrap}

.hd-en{font-size:13px;color:var(--ink-50);letter-spacing:-.005em;font-weight:400}
.hd-stats{display:none}.share-btn{font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--white);color:var(--ink);cursor:pointer}.share-btn:active{transform:scale(.97)}
.stat{font-size:12px;color:var(--ink-50);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:160px;padding:9px 14px;border:none;border-radius:var(--r1);background:var(--white);box-shadow:var(--shadow-card);color:var(--ink);font-size:14px;font-family:inherit;transition:box-shadow var(--dur-base) var(--ease-out-quart)}
#q:focus{outline:none;box-shadow:var(--shadow-card-hover)}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.tab{padding:6px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;background:var(--white);color:var(--ink-70);box-shadow:0 0 0 1px var(--line);transition:color var(--dur-fast) var(--ease-out-quart),background var(--dur-fast) var(--ease-out-quart),box-shadow var(--dur-fast) var(--ease-out-quart);white-space:nowrap;user-select:none}
.tab.on{background:var(--ink);color:var(--white);box-shadow:none}
@media (hover:hover) and (pointer:fine){.tab:not(.on):hover{color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}}

/* timeline */
.era-block{margin-bottom:34px}
.era-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.era-label{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--ink-50);white-space:nowrap;padding:3px 10px;border-radius:20px;background:var(--tint);font-variant-numeric:tabular-nums}
.era-count{font-size:10px;color:var(--ink-30);white-space:nowrap;font-variant-numeric:tabular-nums}
.era-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(42,46,44,.10),transparent)}
.era-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tl-card{padding:13px 14px;border-radius:12px;background:var(--white);box-shadow:var(--shadow-card);cursor:pointer;transition:box-shadow var(--dur-base) var(--ease-out-quart);text-decoration:none;color:inherit;display:block}
.tl-year{font-size:10px;color:var(--ink-30);margin-bottom:5px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tl-name{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:8px;line-height:1.25}
.tl-word{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--up-bg);color:var(--up);display:inline-block;font-weight:600}
@media (hover:hover) and (pointer:fine){.tl-card:hover{box-shadow:var(--shadow-card-hover)}}
.empty{padding:56px;text-align:center;color:var(--ink-30);font-size:14px}

/* overlay + panel */
.ov{display:none !important;position:fixed;inset:0;background:rgba(42,46,44,.32);z-index:300;overflow-y:auto;padding:40px 16px 80px;display:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.ov.open{display:block}
.panel{background:var(--white);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 12px 48px rgba(42,46,44,.14);max-width:660px;margin:0 auto;padding:36px 40px;position:relative;animation:panel-in var(--dur-slow) var(--ease-out-expo);transform-origin:center top}
@keyframes panel-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.p-x{position:absolute;top:18px;right:18px;cursor:pointer;font-size:15px;color:var(--ink-50);background:var(--tint);border:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background var(--dur-fast),color var(--dur-fast)}
@media (hover:hover) and (pointer:fine){.p-x:hover{color:var(--ink);background:var(--tint-hover)}}
.p-cat{font-size:10px;color:var(--up);font-weight:600;text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px}
.p-name{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px;line-height:1.1}
.p-era{font-size:13px;color:var(--ink-50);margin-bottom:18px;font-variant-numeric:tabular-nums}
.word-row{margin-bottom:20px}
.wpill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--up-bg);color:var(--up)}
.p-desc{font-size:15px;color:var(--ink-70);line-height:1.75;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.sec{font-size:10px;font-weight:600;color:var(--ink-50);text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px;margin-top:26px}
.story-box{padding:14px 16px;border-left:2px solid var(--sulfur);background:var(--tint);border-radius:0 var(--r1) var(--r1) 0;font-size:14px;color:var(--ink-70);line-height:1.75}
.fw-list{display:flex;flex-direction:column;gap:8px}
.fw{padding:12px 15px;border-radius:var(--r1);background:var(--tint)}
.fw-n{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:5px}
.fw-d{font-size:13.5px;color:var(--ink-70);line-height:1.7}
.fw-eg{font-size:12.5px;color:var(--ink-50);margin-top:8px;padding:7px 11px;background:var(--white);border-radius:6px;line-height:1.6}
.q-item{font-size:14px;color:var(--ink-70);line-height:1.7;padding:6px 14px;border-left:2px solid var(--line-strong);margin:6px 0;font-style:italic}

.chips{display:flex;flex-wrap:wrap;gap:7px}

@media (hover:hover) and (pointer:fine){.contrast-item:hover{background:var(--tint-hover)}}
.contrast-name{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;padding-top:1px}
.contrast-arrow{font-size:12px;color:var(--ink-30);white-space:nowrap;padding-top:2px}
.contrast-why{font-size:12.5px;color:var(--ink-70);line-height:1.6;flex:1}


/* mobile */
@media(max-width:600px){
  .wrap{padding:0 24px 8px}
  .hd{margin:0 0 24px;padding:22px 0 14px}

/* ── 每日金句卡（OurWord 素纸浓墨 · 沉朱印 / 汇文明朝体） ────────────────── */

.dq{display:flex;gap:28px;align-items:center;margin:0 0 30px}
.dq-card{position:relative;flex:0 0 auto;width:320px;aspect-ratio:3/4;overflow:hidden;
  background:#f7f4ec;box-shadow:0 8px 32px rgba(0,0,0,.45)}
.dq-card canvas{display:block;width:100%;height:100%}

@keyframes dqfade{from{opacity:0}to{opacity:1}}
.dq-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dq-side{flex:1 1 auto;min-width:0}
.dq-hdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dq-eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--ink-50)}
.dq-date{font-size:13px;color:var(--ink-30);font-variant-numeric:tabular-nums}
.dq-from{margin-top:14px;font-size:14px;color:var(--ink-70);line-height:1.7}
.dq-cat{font-size:13px;color:var(--ink-50);margin-top:3px}
.dq-note{margin:14px 0 0;font-size:14px;line-height:1.85;color:var(--ink-70);max-width:46em;
  padding-left:13px;border-left:2px solid var(--line-strong)}
.dq-link{background:none;border:none;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;
  border-bottom:1px solid var(--line-strong);transition:border-color var(--dur-fast) var(--ease-out-quart)}
.dq-link:hover{border-bottom-color:var(--ink)}
.dq-acts{display:flex;gap:8px;margin-top:20px}
.dq-sep{width:9px}
.dq-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line-strong);
  background:var(--white);color:var(--ink-70);border-radius:var(--r1);cursor:pointer;
  transition:transform var(--dur-tap) var(--ease-out-quart),background var(--dur-fast) var(--ease-out-quart),color var(--dur-fast) var(--ease-out-quart),border-color var(--dur-fast) var(--ease-out-quart)}
.dq-btn:hover{background:var(--tint-hover);color:var(--ink);border-color:var(--ink-30)}
.dq-btn:active{transform:scale(.97)}
.dq-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dq-toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:120;
  background:var(--ink);color:var(--white);font-size:13px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-out-quart),transform var(--dur-base) var(--ease-out-quart)}
.dq-toast.on{opacity:1;transform:translate(-50%,0)}
.dq-ov{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.88);display:none;

    <a class="brand-lockup" href="/">
      <img class="brand-logo" src="/favicon.svg" width="36" height="36" alt="人类世界生存法则">
      <span class="brand-copy">
        <h1 class="hd-title">人类世界<span class="dot">生存法则</span></h1>
        <p class="hd-en">遇到事了，看看以前的人怎么处理</p>
      </span>
    </a>
    <div class="hd-stats">
      <div class="stat"><b id="st">160</b> 位人物与典籍</div>
      <div class="stat">跨越 <b>2600+</b> 年</div>
      <div class="stat"><b id="cat-count">10</b> 大主题</div>
      <div class="stat"></div>
      
    </div>
  </header>
  <main id="main">

    <section class="dq" aria-label="每日金句">
      <div class="dq-card" id="dqCard">
        <canvas id="dqCv" width="1080" height="1440" role="img" aria-label="每日金句卡片"></canvas>
        <p class="dq-sr" id="dqSR"></p>
      </div>
      <div class="dq-side">
        <div class="dq-meta">
          <div class="dq-hdr"><span class="dq-eyebrow">每日金句</span><span class="dq-date" id="dqDate"></span></div>
          <div class="dq-from">出自 <a class="dq-link" id="dqOpen" href="#"></a></div>
          <div class="dq-cat" id="dqCat"></div>
          <p class="dq-note" id="dqNote"></p>
        </div>
        <div class="dq-acts">
          <button class="dq-btn" type="button" onclick="dqStep(-1)" title="上一句" aria-label="上一句"><svg viewBox="0 0 24 24"><path d="M14.5 5 8 12l6.5 7"/></svg></button>
          <button class="dq-btn" type="button" onclick="dqStep(1)" title="下一句" aria-label="下一句"><svg viewBox="0 0 24 24"><path d="M9.5 5 16 12l-6.5 7"/></svg></button>
          <span class="dq-sep"></span>
          <button class="dq-btn" type="button" onclick="dqShare()" title="复制金句" aria-label="复制金句"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m8.5 6.5 3.5-3.5 3.5 3.5"/><path d="M20 13v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/></svg></button>
          <button class="dq-btn" type="button" onclick="dqSave()" title="保存图片" aria-label="保存图片"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="m3 13.5 4.5-4a2 2 0 0 1 2.7 0L15 14"/><circle cx="15.5" cy="7.5" r="1.4"/><path d="M12 18v4m-2.2-2.2L12 22l2.2-2.2"/></svg></button>
        </div>
      </div>
    </section>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&display=swap">
<style>:root{color-scheme:light dark;--paper:#f5f1e8;--ink:#1f1c17;--acc:#a33b2e;--muted:#8a8377;--line:#d8d2c6;--paper2:#eee8da;--card:#faf7f0;--kbg:#1f1c17;--kfg:#f5f1e8;--kmut:#cfc7b8}
@media(prefers-color-scheme:dark){:root{--paper:#171410;--ink:#eae3d4;--acc:#c65f4f;--muted:#9a917f;--line:#3a342a;--paper2:#201c15;--card:#1d1913;--kbg:#eae3d4;--kfg:#171410;--kmut:#5a5344}}
:root[data-theme="light"]{--paper:#f5f1e8;--ink:#1f1c17;--acc:#a33b2e;--muted:#8a8377;--line:#d8d2c6;--paper2:#eee8da;--card:#faf7f0;--kbg:#1f1c17;--kfg:#f5f1e8;--kmut:#cfc7b8}
:root[data-theme="dark"]{--paper:#171410;--ink:#eae3d4;--acc:#c65f4f;--muted:#9a917f;--line:#3a342a;--paper2:#201c15;--card:#1d1913;--kbg:#eae3d4;--kfg:#171410;--kmut:#5a5344}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--white:#1d1913;--line-strong:rgba(234,227,212,.22);--ink-30:rgba(234,227,212,.42);--ink-50:rgba(234,227,212,.6)}}
:root[data-theme="dark"]{--white:#1d1913;--line-strong:rgba(234,227,212,.22);--ink-30:rgba(234,227,212,.42);--ink-50:rgba(234,227,212,.6)}
body{background:var(--paper);color:var(--ink)}
.share-btn{background:var(--white)!important;color:var(--ink)!important;border-color:var(--line-strong)!important}
:root[data-theme="dark"] .dot,:root[data-theme="dark"] .hd-en,:root[data-theme="dark"] .kicker,:root[data-theme="dark"] .sec-k{color:#e0705f!important}
:root[data-theme="dark"] body{background:#171410!important;color:#eae3d4!important}
:root[data-theme="dark"] .hd-title,:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] h3{color:#eae3d4!important}
:root[data-theme="dark"] #hwx .tq .dt{color:#e0705f!important}
:root[data-theme="dark"] #hwx .tq .src,:root[data-theme="dark"] #hwx .tq .src a,:root[data-theme="dark"] #hwx .tbox .hint{color:#d9d1c0!important;opacity:1}
:root[data-theme="dark"] #hwx .qc .who,:root[data-theme="dark"] #hwx .pc .it,:root[data-theme="dark"] #hwx .pc .tag,:root[data-theme="dark"] #hwx .pc .ls,:root[data-theme="dark"] #hwx .nc .w,:root[data-theme="dark"] #hwx .nc .pn{color:#a79e8b!important}
:root[data-theme="dark"] #hwx .cf,:root[data-theme="dark"] #hwx .qc .who i,:root[data-theme="dark"] #hwx .nc .pn i,:root[data-theme="dark"] #hwx .seal{color:#ef8b78!important}
:root[data-theme="dark"] #hwx .nb{background:#b8452f!important;color:#fff!important}
:root[data-theme="dark"] #hwx .kc .qm{color:#8a3a2e!important}
#hwx .kc .qm{color:#c4644f}
#hwx-theme{position:fixed;top:14px;right:14px;z-index:9999;width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:50%;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:none;padding:0}
#hwx-theme svg{width:17px;height:17px;display:block}
#hwx-theme:hover{color:var(--ink)}
/* 数量那一行自己占一行：中文「80 个处境 · 253 个问题」短，跟在标题
   后面放得下；英文「80 situations · 253 questions」跟在后面就断在
   「80」和「situations」之间，读者看到的是标题行尾挂着一个孤零零的
   数字。让它整块下来一行。 */
#hwx-sccount{display:block}
#hwx .today{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin:18px 0 6px}
@media(max-width:700px){#hwx .today{grid-template-columns:1fr}}
/* 日夜切换是 fixed 在右上角的 36px 圆钮；窄屏上它正压在第一张卡的表头右端
   （处境标签那颗胶囊）上。表头右边让出它的宽度。 */
@media(max-width:480px){#hwx .askhero .ahead{padding-right:38px}}
#hwx .tq{border:1px solid var(--line);border-radius:16px;padding:20px 22px;background:transparent;display:flex;flex-direction:column}
#hwx .tq .dt{font-size:12.5px;letter-spacing:.24em;color:var(--acc);font-weight:700;margin-bottom:6px}
#hwx .tq .tgl{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:clamp(19px,3.4vw,24px);font-weight:700;line-height:1.75;color:var(--ink);opacity:1;margin:0 0 12px}
#hwx .tq .q{font-size:15px;line-height:1.9;color:var(--ink);opacity:.7;margin-bottom:10px}
#hwx .tq .src{font-size:13.5px;color:var(--muted)}
#hwx .tq .src a{color:var(--acc);text-decoration:none}
#hwx .tq .acts{display:flex;gap:8px;margin-top:14px}
#hwx .tq .acts button{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;font-family:inherit;font-size:14px;cursor:pointer}
#hwx .tq .acts .bs{background:var(--ink);color:var(--paper)}
#hwx .askhero{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:20px 18px 16px;margin-bottom:12px}
#hwx .askhero .ahead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
#hwx .askhero .lb{font-size:11.5px;letter-spacing:.28em;color:var(--acc);font-weight:700}
#hwx .askhero #hwx-asc-tag{margin:-6px 0 14px}
/* 搜不到时的那块。语气跟站上一致：先说没找到什么，再给一条出路。 */
#hwx #hwx-none{border:1px dashed var(--line);border-radius:14px;padding:20px 18px;margin:14px 0 8px;text-align:center}
#hwx #hwx-none b{display:block;font-family:"Noto Serif SC","Songti SC",serif;font-size:17px;line-height:1.7;color:var(--ink)}
#hwx #hwx-none i{display:block;font-style:normal;font-size:13.5px;line-height:1.8;color:var(--muted);margin:6px 0 14px}
#hwx #hwx-none button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 18px;font-family:inherit;font-size:13.5px;cursor:pointer}
#hwx .askhero #hwx-asc-tag button{border:0;background:transparent;color:var(--muted);padding:0;font-family:inherit;font-size:12.5px;line-height:1.7;cursor:pointer;text-align:left}
#hwx .askhero #hwx-asc-tag button:hover{color:var(--acc)}
#hwx .amine{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
/* 按钮放进框里的右下角。手机上预填句会折成三行，框一长高，贴在框外面的
   圆球就成了另一样东西；放进去之后它跟着框底走，单行时正好居中（6+30+6=42）。 */
#hwx .amine .arow{display:flex;align-items:flex-end;gap:4px;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:0 6px 0 0}
#hwx .amine .arow:focus-within{border-color:var(--acc)}
#hwx .amine textarea{flex:1;min-width:0;display:block;resize:none;font-family:inherit;font-size:15px;line-height:1.6;color:var(--ink);background:transparent;border:none;border-radius:14px;padding:9px 13px;outline:none;max-height:96px}
#hwx .amine button{flex:0 0 auto;height:30px;margin:6px 0;border:none;border-radius:9px;background:var(--ink);color:var(--paper);font-family:inherit;font-size:14px;line-height:30px;padding:0 14px;cursor:pointer}
#hwx .amine button:disabled{opacity:.4;cursor:default}

#hwx .askhero .said{font-family:"Noto Serif SC","Songti SC",serif;font-size:13.5px;color:var(--acc);line-height:1.7;margin:11px 0 0}
#hwx .askhero .q{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:21px;font-weight:700;line-height:1.75;margin:0 0 14px}
#hwx .askhero .sc{font-size:13.5px;color:var(--muted);line-height:1.8;margin:0;padding-left:12px;border-left:2px solid var(--line)}
#hwx .askhero .go a{display:block;text-decoration:none;color:inherit;border-top:1px dashed var(--line);padding-top:11px;margin-top:12px}
#hwx .askhero .go a.lead b{font-size:17px;color:var(--ink)}
#hwx .askhero .go a.lead i{font-size:14px;line-height:1.75;color:var(--ink);opacity:.85}
#hwx .askhero .go a.sub b{font-size:14px}
#hwx .askhero .go a.sub i{font-size:12.5px}
#hwx .askhero .go b{font-family:"Noto Serif SC","Songti SC",serif;font-size:15.5px;display:block}
#hwx .askhero .go i{font-style:normal;font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
/* 今日一问主篇下的「这人是谁」：一天一张、位置最靠前，多一行凭据划算。
   处境卡不加——28 张连着刷，每张多一行会让扫读变慢，而卡片的主角是那句问题。 */
#hwx .askhero .go a u{display:block;text-decoration:none;font-size:12.5px;line-height:1.6;color:var(--muted);margin-top:2px}
#hwx .askhero .go a em{display:block;font-style:normal;font-size:14px;line-height:1.7;color:var(--acc);margin-top:5px}
#hwx .kc .r a u{display:block;text-decoration:none;font-size:11.5px;line-height:1.55;color:var(--muted);opacity:.85;margin-top:2px}
#hwx .kc .r a em{display:block;font-style:normal;color:var(--acc);margin-top:3px}
#hwx .today .tq{padding:15px 16px}
#hwx .today .tq .tgl{font-size:18px!important;line-height:1.7!important;margin-bottom:10px!important}
#hwx .today .tq .q{font-size:14.5px!important;line-height:1.9!important;margin-bottom:8px!important}
#hwx .today .tq .tgl{display:block;font-size:13.5px;line-height:1.7;margin:6px 0 12px}
/* 第一人称那句是读者自己的话，给它一道竖线，跟上面的引文分开——
   没有标签，靠这道线说明它不是引文的续文。 */
#hwx .today .tq .tgl.mine{padding-left:11px;border-left:2px solid var(--line);color:var(--ink);opacity:.9}
#hwx .today .tq .acts button{padding:5px 12px;font-size:12.5px;border-width:1px}
#hwx .today .tq .acts .bs{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#hwx .tbox-s{padding:12px 14px}
#hwx .tbox-s b{font-size:15px}
#hwx .tbox-s .hint2{display:none}
#hwx .today-foot{margin-top:22px}
#hwx .tcol{display:flex;flex-direction:column;gap:14px}
#hwx .tbox{border:1px solid var(--line);border-radius:16px;padding:14px 16px;flex:1}
#hwx .tbox .lb{font-size:11.5px;letter-spacing:.28em;color:var(--acc);font-weight:700;margin-bottom:6px}
#hwx .tbox a{color:inherit;text-decoration:none;display:block}
#hwx .tbox b{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:16.5px}
#hwx .tbox .hint{display:block;font-size:14.5px;color:var(--ink);opacity:.72;margin-top:4px;line-height:1.65}
#hwx .tbox .hint2{display:block;font-size:14px;color:var(--acc);opacity:.92;margin-top:6px;line-height:1.6}
#hwx .hh{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:21px;font-weight:700;margin:24px 0 10px;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline}
#hwx .hh .ct{font-size:12px;color:var(--muted);font-weight:500}
#hwx .sc{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
#hwx .scmore{order:9999;flex:0 0 auto;border:1px dashed var(--line);background:transparent;color:var(--acc);border-radius:999px;padding:7px 14px;font-family:inherit;font-size:14.5px;cursor:pointer;white-space:nowrap;line-height:1.6}
#hwx .scmore:hover{border-color:var(--acc)}
/* 组名独占一行。试过与标签同行以省高度，结果组名混在标签流里像半个标签，
   比原来更乱——高度靠「每组只露 2 个」和紧凑的行距来收，不靠挤掉标题。 */
#hwx .scg{flex:0 0 100%;font-family:"Noto Serif SC","Songti SC",serif;font-size:11.5px;color:var(--muted);letter-spacing:.1em;margin:9px 0 -2px;padding:0;line-height:1.4}
#hwx .scg:first-child{margin-top:0}
#hwx .sc{row-gap:7px}
#hwx .sc{flex-wrap:wrap!important;overflow-x:visible!important}
#hwx .sc button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:7px 14px;font-family:inherit;font-size:14.5px;cursor:pointer;white-space:nowrap}
#hwx .sc button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#hwx .res{display:none;border-left:3px solid var(--acc);padding:4px 0 4px 13px;margin:8px 0 6px}
#hwx .res.on{display:block}
#hwx .res .qz{margin:0 0 14px}
#hwx .res .qz:last-child{margin-bottom:2px}
#hwx .res .qzq{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:16px;font-weight:700;line-height:1.6;margin-bottom:4px}
#hwx .res .qzq::before{content:"？";color:var(--acc);font-weight:900;margin-right:5px}
#hwx .res a{display:block;padding:4px 0 4px 16px;text-decoration:none;color:inherit}
#hwx .res a b{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:15px;font-weight:600}
#hwx .res a span{display:block;font-size:13.5px;color:var(--muted);line-height:1.6}
#hwx .res a:hover b{border-bottom:1px solid}
#hwx .hist{display:none;align-items:center;gap:8px;margin:0 0 14px;font-size:13px}
header.hd{margin-bottom:12px!important}
#hwx .hist .hl{color:var(--acc);font-weight:700;letter-spacing:.1em;flex:0 0 auto}
#hwx .hist .hchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
#hwx .hist .hchips::-webkit-scrollbar{display:none}
#hwx .hist .hchips a{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--muted);text-decoration:none;white-space:nowrap}
#hwx .hist .hchips a:hover{color:var(--ink)}
#hwx .hist button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:11px;cursor:pointer;flex:0 0 auto}
#hwx .qbar{margin:22px 0 0}
#hwx .qbar input{width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:12px 20px;font-family:inherit;font-size:16px;outline:none;transition:border-color .15s}\n#hwx .qbar input:focus{border-color:var(--muted)}
#hwx .qbar input::placeholder{color:var(--muted)}
/* 一行入口：两行结构（标题+计数 / 提示语），替代原先 1049px 的标签目录。
   试过 flex 单行，三段挤在一起且箭头折行——中文没有词间空格，靠 gap 撑不开。 */
#hwx .scline{display:block;width:100%;background:transparent;border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 2px;margin:16px 0 0;cursor:pointer;color:inherit;text-align:left;font-family:inherit}
#hwx .scline b{font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700;margin-right:10px}
#hwx .scline span{font-size:12.5px;color:var(--muted)}
#hwx .scline i{display:block;font-style:normal;margin-top:6px;font-size:13px;color:var(--acc)}
#hwx .tabs2{flex-shrink:0}
@media(max-width:700px){
/* 标签行和右边那个计数在一行放不下时换行，而不是把整页顶宽。
   英文的标签比中文长得多（「Situations」对「境」），换成杂志标题字体
   之后又宽了一截，两件事叠起来在 375px 上就超了 17px —— 而超出的那一下
   是把**整页**顶成横向可滚，不只是这一行难看。
   （父容器的 display:flex 是写在行内 style 上的，只能从这里补 wrap。） */
#hwx div:has(> .tabs2){flex-wrap:wrap;row-gap:4px}}
#hwx .tabs2{display:flex;gap:0;border-bottom:2px solid var(--line);margin:14px 0 0}
#hwx .tabs2 button{border:none;background:transparent;padding:9px 20px;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;font-size:17px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
#hwx .tabs2 button.on{color:var(--ink);border-bottom-color:var(--acc)}
#hwx .cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0 0}
#hwx .cats::-webkit-scrollbar{display:none}
#hwx .cats button{flex:0 0 auto;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer;padding:5px 11px;border-radius:999px}
#hwx .cats button.on{background:var(--line);color:var(--ink)}
/* 处境选择条：两行横滑。76 个处境竖着平铺是 1049px，那正是被废掉的旧目录；
   横滑两行占 78px，一屏能扫到十几个，滑动就能看完全部。
   不放组名——组名与标签同行会混成半个标签（见 DESIGN.md §7），
   改用「按组排序」让相邻的处境自然聚在一起。 */
#hwx .scmore-note{grid-column:1/-1;padding:14px 4px 4px;font-size:13.5px;color:var(--muted);line-height:1.7}
#hwx .scpick{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;grid-auto-columns:max-content;gap:7px 6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:12px 0 0;padding-bottom:2px}
#hwx .scpick::-webkit-scrollbar{display:none}
#hwx .scpick button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:7px 14px;font-family:inherit;font-size:14.5px;line-height:1.3;cursor:pointer;white-space:nowrap}
#hwx .scpick button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#hwx .scpick button.sub{border-style:dashed;font-size:14px}
#hwx .scpick button.sub.on{border-style:solid}
#hwx .scpick .scsep{display:block;width:1px;align-self:stretch;background:var(--line);margin:0 4px;grid-row:1/3}
#hwx .feed{columns:150px;column-gap:12px;margin-top:14px}

   而这跟小字多长关系不大：马可·奥勒留(91px)+「克制」(22px) 照样折，

   实测 60 张卡：折行 9 → 0，卡片中位高 258px 不变。 */

  var cv=document.createElement('canvas');cv.width=1080;cv.height=1440;var c=cv.getContext('2d');
  var loaded=0,need=3;function chk(){if(++loaded>=need)render();}
  document.fonts.load('900 128px "Noto Serif SC"').then(chk).catch(chk);
  document.fonts.load('700 58px "Noto Serif SC"').then(chk).catch(chk);
  document.fonts.load('500 34px "Noto Serif SC"').then(chk).catch(chk);
  function render(){
    c.fillStyle='#f5f1e8';c.fillRect(0,0,1080,1440);
    c.strokeStyle='#d8d2c6';c.lineWidth=2;c.strokeRect(46,46,988,1348);
    c.fillStyle='#a33b2e';c.font='900 128px "Noto Serif SC"';c.fillText(String(_n.getDate()),96,232);
    c.fillStyle='#8a8377';c.font='500 34px "Noto Serif SC"';c.fillText((_n.getMonth()+1)+'月 · 星期'+WD[_n.getDay()],100,296);
    c.fillStyle='#9d2933';
    (function(x,y,w){var r=w*0.22;c.beginPath();
      c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
      c.lineTo(x+w,y+w-r);c.quadraticCurveTo(x+w,y+w,x+w-r,y+w);
      c.lineTo(x+r,y+w);c.quadraticCurveTo(x,y+w,x,y+w-r);
      c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();c.fill();})(880,110,104);
    c.fillStyle='#fff';c.font='700 62px "Noto Serif SC"';
    c.textAlign='center';c.fillText('人',932,182);c.textAlign='left';
    c.fillStyle='#1f1c17';c.font='700 58px "Noto Serif SC"';
    var q='「'+q1.q+'」',lines=[],cur='',PUNC='，。、；：！？…」）';
    for(var i=0;i<q.length;i++){var tt=cur+q[i];if(c.measureText(tt).width>880&&PUNC.indexOf(q[i])<0){lines.push(cur);cur=q[i]}else cur=tt}
    if(cur)lines.push(cur);
    var y=560+(5-Math.min(lines.length,5))*46;
    lines.slice(0,6).forEach(function(l){c.fillText(l,100,y);y+=98});
    /* 解析：一句话，画在署名之上；行数按实际内容，不预留空档 */
    var ay=y+46;
    if(q1.gl){
      c.fillStyle='#5f5850';c.font='500 31px "Noto Serif SC"';
      var wl=[],cu='';
      for(var j=0;j<q1.gl.length;j++){var tw=cu+q1.gl[j];
        if(c.measureText(tw).width>860&&PUNC.indexOf(q1.gl[j])<0){wl.push(cu);cu=q1.gl[j]}else cu=tw}
      if(cu)wl.push(cu);
      wl=wl.slice(0,3);
      wl.forEach(function(l){c.fillText(l,100,ay);ay+=46});
    }
    ay+=54;   /* 与上一段空出一行 */
    c.fillStyle='#8a8377';c.font='500 34px "Noto Serif SC"';
    c.textAlign='right';c.fillText('—— '+q1.who+' · '+q1.cn,980,ay);c.textAlign='left';
    c.strokeStyle='#d8d2c6';c.lineWidth=2;c.beginPath();c.moveTo(100,1230);c.lineTo(980,1230);c.stroke();
    c.fillStyle='#1f1c17';c.font='700 34px "Noto Serif SC"';c.fillText('人类世界生存法则',100,1318);
    c.fillStyle='#a33b2e';c.font='500 30px "Noto Serif SC"';c.fillText('OurWord.ai',100,1366);
    var qr=new Image();
    qr.onload=function(){c.drawImage(qr,858,1244,122,122);cv.toBlob(cb,'image/png')};
    qr.onerror=function(){cv.toBlob(cb,'image/png')};
    qr.src='/wechat-qr.png?v=54fb0fdf';
  }
}

var scEl=document.getElementById('hwx-sc'),resEl=document.getElementById('hwx-res');
var scMore=document.getElementById('hwx-scmore');
/* 按组渲染：原来 76 个处境平铺，折叠逻辑按「两行」算，默认只露得出 4 个——
   加多少处境用户都看不见。分组之后每组露前 3 个，默认可见约 30 个。 */
var _seen={};
D.S.forEach(function(s){
  if(s.g && !_seen[s.g]){
    _seen[s.g]=1;
    var h=document.createElement('span');
    h.className='scg';h.textContent=s.g;
    scEl.appendChild(h);
  }
  var b=document.createElement('button');b.type='button';b.textContent=s.t;
  b.dataset.g=s.g||'';
  b._open=function(){
    scEl.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');
    resEl.innerHTML=s.qs.map(function(q){
      return '<div class="qz"><div class="qzq">'+q.q+'</div>'
        +q.a.map(function(r){return '<a href="'+r.u+'" data-h="'+esc(r.who+' · '+r.cn)+'"><b>'+r.who+' · '+r.cn+'</b><span>'+(r.hint||'')+'</span></a>'}).join('')
        +'</div>';
    }).join('');
    resEl.classList.add('on');
  };
  b.onclick=function(){
    if(b.classList.contains('on')){          /* 再点已展开的，折叠 */
      b.classList.remove('on');
      resEl.classList.remove('on');resEl.innerHTML='';return;
    }
    b._open();
    resEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  };scEl.appendChild(b);
});

/* 默认只露两行，其余收起 */
(function(){
  var open=false;
  function tags(){return Array.prototype.filter.call(
    scEl.querySelectorAll('button'),function(b){return b!==scMore})}
  function showAll(){tags().forEach(function(b){b.style.display=''})}
  var PER_GROUP=2;   /* 每组默认露几个——14 组 × 3 个占了 1268px，近两屏 */
  function heads(){return Array.prototype.slice.call(scEl.querySelectorAll('.scg'))}
  function fold(){
    if(open){
      showAll();heads().forEach(function(h){h.style.display=''});
      scMore.textContent='收起';return;
    }
    showAll();
    scMore.textContent='展开全部 '+D.S.length+' 个';
    /* 每组只留前 PER_GROUP 个；组标题始终显示，让用户知道底下还有 */
    var count={};
    tags().forEach(function(b){
      var g=b.dataset.g||'';
      count[g]=(count[g]||0)+1;
      if(count[g]>PER_GROUP)b.style.display='none';
    });
    heads().forEach(function(h){h.style.display=''});
  }
  scMore.onclick=function(){open=!open;fold()};
  fold();
  window.addEventListener('resize',function(){if(!open)fold()});
  /* 默认展开第一个处境。用 open() 而不是 click()：
     click 会走「已选中则折叠」这条分支，导致用户点第二个标签时
     第一下只是取消展开，要点两下才切换。 */
  var first=tags()[0]; if(first && first._open) first._open();
})();

/* ── CTA 差异化 ── */
function cta(e){
  var T=['拆开看他的 '+e.nc+' 套打法 →','先读「'+(e.c0||'')+'」→','他的答案分 '+e.nc+' 篇讲透 →','进去偷师 →',
         '从「'+(e.c0||'')+'」进 →',e.nc+' 篇，句句能落地 →','看他怎么处理最难的那件事 →','带走 '+e.nc+' 条硬原则 →',
         '深读 '+e.nc+' 篇，够用很久 →','「'+(e.c0||'')+'」值得先看 →','他的方法都在里面 →','读透这 '+e.nc+' 篇再走 →',
         '看完你会换个打法 →',e.nc+' 篇深读备好了 →','从最狠的一篇读起 →','他的路数，'+e.nc+' 篇拆完 →'];
  var h=0;for(var i=0;i<e.s.length;i++)h=(h*31+e.s.charCodeAt(i))>>>0;
  var t=T[h%T.length];
  return(t.indexOf('「」')>=0)?'他的方法都在里面 →':t;
}
/* ── 全部 feed（混排） ── */
/* 金句取用器：按日期确定性洗牌后顺序发牌。
   原来用 (i*步长)%池大小 取句，步长 53 撞上池大小 53 时恒取第一条——
   两个 feed 里十张金句卡全是同一句。改成发牌就不再依赖两个数互质。 */
var _qbag=[], _qi2=0;
(function(){
  var a=D.QS.slice(), seed=day;
  for(var i=a.length-1;i>0;i--){
    seed=(seed*9301+49297)%233280;
    var j=Math.floor(seed/233280*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  _qbag=a;
})();
function pickQ(){ var g=_qbag[_qi2 % _qbag.length]; _qi2++; return g; }
/* 金句卡：竖排金句 + 出处 + 一行解析（角度 · 什么时候用），解析取自章节自身字段 */

D.S.forEach(function(sc){sc.qs.forEach(function(q){q.a.forEach(function(r){(byNC[r.who]=byNC[r.who]||[]).push(q.q+' '+r.cn+' '+(r.hint||''))})})});

var ncCells=[], _seen={}, _pi=0, _qi=0, _ki=0;

    ncCells.push('<div class="kc"><span class="seal">问</span>'+(k.r&&k.r[0]?'<span class="said">'+esc(k.r[0].who)+'问过</span>':'')+'<span class="t">'+k.t+'</span><span class="r">'+k.r.slice(0,1).map(function(r){var w=(D.WHO||{})[r.who];return '<a href="'+r.u+'" data-h="'+esc(r.who+' · '+r.cn)+'"><b>'+r.who+'</b>'+(w?'<u>'+esc(w)+'</u>':'')+'<em>'+r.cn+' →</em></a>'}).join('')+'</span></div>');}

/* ── 处境 tab：每个问题一张卡，标注所属处境 ──
   原来「按处境找」是 1049px 的标签目录，三步才到答案，
   而这些问题 100% 已经在信息流里以卡片出现过。改成卡片流：
   同一批内容、同一套视觉，扫读即认出，不必先学会我们的分类。 */
var scCells=[],scOwner=[],scText=[];
D.S.forEach(function(sc){
  sc.qs.forEach(function(q){
    scOwner.push(sc.t);
    scText.push((q.q+sc.t).toLowerCase());
    scCells.push('<div class="kc" data-t="'+esc((q.q+sc.t).toLowerCase())+'">'
      +'<span class="seal">问</span>'
      +'<span class="said">'+esc(sc.t)+'</span>'
      +'<span class="t">'+q.q+'</span>'
      +'<span class="r">'+q.a.slice(0,1).map(function(r){
          /* 一张卡只举一个例子，并把「这人是谁」补上：两个并列的人名会让读者先做选择题，
             而这张卡要说的是「有人真干过这件事」。省下的那一条，正好换成凭据。 */
          var w=(D.WHO||{})[r.who];
          return '<a href="'+r.u+'" data-h="'+esc(r.who+' · '+r.cn)+'"><b>'+r.who+'</b>'+(w?'<u>'+esc(w)+'</u>':'')+'<em>'+r.cn+' →</em></a>'

/* ── 标签页切换 ── */
/* 默认落在「处境」。原来是「最新」——那是一份按章节文件首次提交时间排的
   更新日志，对第一次来的人毫无意义：他看到的是连着四张蒲松龄，
   因为蒲松龄是最近加的。68 张卡里 40 张挂着「新」标记，而对第一次来的人
   所有东西都是新的。「最新」只对回访者有用，不该当门面。 */
var TAB='境';
var feed=document.getElementById('hwx-feed'), ncfeed=document.getElementById('hwx-ncfeed');
var scfeed=document.getElementById('hwx-scfeed');
var scpick=document.getElementById('hwx-scpick');
/* 选中的处境；空串＝全部。选择保留，切走再切回来还在原来那一格 */
var SCSEL='';
/* 把选中的标签滑进视野：选择会跨 tab 保留，切回来时条子若停在开头，
   卡片是筛过的而标签看着像没选，人会以为坏了。 */
function scReveal(){
  var on=scpick.querySelector('button.on');
  if(!on)return;
  /* 只把 chip 条横向滚到位，**绝不滚页面**。
     原来用 scrollIntoView({block:'nearest'})——看着已经防住了纵向，
     可 chip 条在首屏之下时，'nearest' 仍会把整页往下拉一截去露出它（实测 48px）。
     读者每次落地都发现页面不在顶上，切换语言时尤其明显。 */
  try{scpick.scrollLeft = on.offsetLeft - (scpick.clientWidth - on.offsetWidth)/2}catch(e){}
}
/* 没选任何组时只渲染前 SC_CAP 张。默认落到「处境」之后，
   「全部」会把 521 张卡一次铺完，首页从 11050px 涨到 64761px——
   77 屏，比原来那个 13 屏的信息流糟得多。
   选了组或选了具体处境就不截断：那时候总数本来就只有几个到几十个。 */
var SC_CAP=28;
function scRender(){
  var inGrp={};
  if(SCGRP){D.S.forEach(function(sc){if(sc.g===SCGRP)inGrp[sc.t]=1;});}
  var cells=[],n=0;
  for(var i=0;i<scCells.length;i++){
    var own=scOwner[i];
    var ok = SCSEL ? (own===SCSEL) : (SCGRP ? !!inGrp[own] : true);
    if(ok){n++; if(!SCSEL&&!SCGRP&&cells.length>=SC_CAP)continue; cells.push(scCells[i]);}
  }
  if(!SCSEL&&!SCGRP&&n>cells.length){
    cells.push('<div class="scmore-note">还有 '+(n-cells.length)
      +' 个问题。上面挑一个跟你有关的分组，或者直接搜。</div>');
  }
  scfeed.innerHTML=cells.join('');
  ct.textContent=n+' 个问题';   /* 处境名由选中的标签表达，不再重复一遍 */
}
/* 分两级：先 16 个组，点开才出这一组的处境。
   原来是把 112 个处境拍平成一条横向滚动的双行条——要找到「一直没成」
   得横向划过五十多列，而分组信息（S 里的 g 字段）一直都在，只是没用。
   16 个组一屏放得下，112 个放不下，这是全部的理由。 */
var SCGRP='';
function scGroups(){
  var seen={},out=[];
  D.S.forEach(function(sc){ if(sc.g&&!seen[sc.g]){seen[sc.g]=1;out.push(sc.g);} });
  return out;
}
function scBuild(){
  var h=['<button type="button" data-g=""'+((!SCGRP&&!SCSEL)?' class="on"':'')+'>全部</button>'];
  scGroups().forEach(function(g){
    h.push('<button type="button" data-g="'+esc(g)+'"'+(g===SCGRP?' class="on"':'')+'>'+esc(g)+'</button>');
  });
  if(SCGRP){
    h.push('<span class="scsep" aria-hidden="true"></span>');
    D.S.forEach(function(sc){
      if(sc.g!==SCGRP)return;
      h.push('<button type="button" class="sub'+(sc.t===SCSEL?' on':'')+'" data-s="'+esc(sc.t)+'">'+esc(sc.t)+'</button>');
    });
  }
  scpick.innerHTML=h.join('');
  scpick.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      if(b.hasAttribute('data-g')){
        var g=b.getAttribute('data-g');
        SCGRP=(g===SCGRP)?'':g;
        SCSEL='';                                   /* 换组＝回到该组全部 */
        trk('situation_group',{group:SCGRP||'all'});
      }else{
        var v=b.getAttribute('data-s');
        SCSEL=(v===SCSEL)?'':v;                     /* 再点一次＝取消 */
        trk('situation_pick',{situation:SCSEL||'all'});
      }
      scBuild(); scRender();
    };
  });
}
var ct=document.getElementById('hwx-ct');
var catsRow=document.getElementById('hwx-cats');
function switchTab(t){
  TAB=t;
  document.querySelectorAll('#hwx-tabs2 button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
  if(t==='新'){
    feed.style.display='none';scfeed.style.display='none';ncfeed.style.display='';catsRow.style.display='none';
    scpick.style.display='none';
    ncfeed.innerHTML=ncCells.join('');ct.textContent=D.NC.length+' 篇最新';
  }else if(t==='境'){
    ncfeed.style.display='none';feed.style.display='none';catsRow.style.display='none';
    scfeed.style.display='';scpick.style.display='';
    if(!scpick.firstChild)scBuild();
    scRender();scReveal();
  }else{
    ncfeed.style.display='none';scfeed.style.display='none';feed.style.display='';catsRow.style.display='';
    scpick.style.display='none';
    feed.innerHTML=fullCells.join('');applyFeed();
  }
}
document.querySelectorAll('#hwx-tabs2 button').forEach(function(b){
  b.onclick=function(){var t=b.getAttribute('data-t');
    trk('tab_switch',{tab:t==='新'?'latest':(t==='全'?'all':'situations')});
    switchTab(t);
    /* 切页签要把信息流带回开头。原来不动：读者已经往下翻了两屏，一换页签
       内容整个换掉、位置却留在原地——落在新一批卡片的中间，前面那些永远
       不会被看到。换页签这个动作的意思就是「给我看别的」。
       回到标签行本身，不是回页首：页首上面还有今日一问那几张卡，
       读者刚刚已经翻过去了。 */
    /* 瞬时，不平滑。内容已经整个换掉了，再平滑滚过两屏是滑过一堆
       已经不存在的东西；而且 smooth 在后台标签页和 reduced-motion 下
       行为不一致，瞬时到位是每次都一样的那个。 */
    var tb=document.getElementById('hwx-tabs2');
    if(tb){var y=tb.getBoundingClientRect().top+scrollY-8;
      if(scrollY>y)scrollTo(0,y);}
  };
});

/* 从内容页返回要停在原来的位置。
   信息流是 JS 渲染的，浏览器恢复滚动位置的时候卡片还没画出来，页面高度
   还是零——恢复到哪都一样，结果就是回到顶部，读者得重新翻一遍。
   所以自己记：点进任何一张卡之前，把当前页签和位置存进 sessionStorage；
   回来渲染完再放回去，然后**立刻清掉**——只有「返回」该恢复，重新打开
   首页不该。 */
var HWX_POS='hwx_feed_pos';
addEventListener('pagehide',function(){
  try{sessionStorage.setItem(HWX_POS,JSON.stringify({t:TAB,y:scrollY}))}catch(e){}
});
(function(){
  var raw=null;
  try{raw=sessionStorage.getItem(HWX_POS);sessionStorage.removeItem(HWX_POS)}catch(e){}
  if(!raw)return;
  var st=null; try{st=JSON.parse(raw)}catch(e){}
  if(!st||!st.y)return;
  /* 只有真的是「返回」才恢复：导航类型是 back_forward，或者上一页就是本站。
     重新在地址栏打开首页时不该跳到半截。 */
  var nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{};
  var back=nav.type==='back_forward'||(document.referrer&&document.referrer.indexOf(location.origin)===0);
  if(!back)return;
  /* 必须等 load 之后再放：页面启动时还会自己调一次 switchTab('境')
     （处境层的初始化），在 rAF 里恢复的话页签会被它盖回去 ——
     实测位置恢复对了、页签却停在「处境」，而存的是「全部」。 */
  /* 恢复页签靠**点那个按钮**，不靠比较 TAB。页面上有不止一个叫 TAB 的
     变量（另一处的值是「最新」，而按钮的 data-t 是「新/全/境」），拿它
     比较永远对不上；点按钮走的是和用户完全一样的那条路径。
     再往后推一档（load 之后再 60ms）：启动时还有一次 switchTab('境')，
     早了会被它盖回去 —— 实测位置恢复对了、页签却停在「处境」。 */
  addEventListener('load',function(){setTimeout(function(){
    if(st.t){
      var b=document.querySelector('#hwx-tabs2 button[data-t="'+st.t+'"]');
      if(b&&!b.classList.contains('on'))b.click();
    }
    scrollTo(0,st.y);
  },60)});
})();
/* 搜索原来两个毛病叠在一起。
   一是逐字子串（data-t.indexOf(v)），差一个字就 0 条：搜「我很难受」出 0，
   可站里的问句是「这件事为什么让我这么难受？」。
   二是范围只覆盖「全部」里的条目和金句卡——112 个处境、521 个问题
   压根没进索引，所以搜「突然没了工作」（处境名逐字）也是 0，
   而那个处境下面挂着 8 个问题。
   读者进这个站的方式恰恰是用自己的话说处境，最该管用的那类输入全废了。

   改成和悬浮球同一套：二元组 + IDF 加权。稀有的词才是查询的意思所在——
   「的人」在几百张卡里都有，「裁员」只在一两张里有，两者不能同权。
   而且真的按分数排序，不再让 DOM 顺序决定谁在前面。
   处境问题在有查询时一并搜、一并排。 */
function _bg(t){var g={},i;for(i=0;i<t.length-1;i++)g[t.slice(i,i+2)]=1;return g}
var _IDF=null;
function _idf(){
  if(_IDF)return _IDF;
  var df={},docs=[],i;
  feed.querySelectorAll('.pc,.xtra').forEach(function(c){docs.push(c.getAttribute('data-t')||'')});
  for(i=0;i<scText.length;i++)docs.push(scText[i]);
  docs.forEach(function(d){var g=_bg(d);for(var k in g)df[k]=(df[k]||0)+1});
  _IDF={df:df,n:docs.length,dflt:Math.log(docs.length+1)};
  return _IDF;
}
function _score(hay,vg){
  var d=_idf(),s=0;
  for(var k in vg){
    if(hay.indexOf(k)<0)continue;
    var c=d.df[k];
    s+= c?Math.log((d.n+1)/(1+c)):d.dflt;
  }
  return s;
}
function applyFeed(){
  if(!feed||!ct)return;
  var v=(document.getElementById('q')||{value:''}).value.trim().toLowerCase();
  var vg=_bg(v),vn=0,_k;for(_k in vg)vn++;
  var full=vn?_score(v,vg):0;          /* 整条查询自己的权重之和，当阈值的基准 */
  /* 两条判据取「或」。按占比会漏掉一类：搜「我很难受」，站里的问句是
     「这件事为什么让我这么难受？」——只对上「难受」一组，占比不够，
     可「难受」本身在全站只出现在很少几张卡里，它就是这句查询的意思所在。
     所以再加一条绝对权重：命中一个足够稀有的词，就够了。 */
  var need=full*0.32;
  /* 只对短查询放宽。长查询本来就有足够多的组，占比是可靠的；
     再叠一条绝对权重，「一个能约的人都没有」会从 30 条涨到 151 条——
     排序还是对的，但后面全是噪音。 */
  var rare=(vn<=4)?2.6:Infinity;
  var qres=document.getElementById('hwx-qres');
  if(!qres){qres=document.createElement('div');qres.id='hwx-qres';qres.className='scfeed';feed.parentNode.insertBefore(qres,feed);}
  if(!v){
    qres.innerHTML='';qres.style.display='none';
    var _n0=document.getElementById('hwx-none'); if(_n0)_n0.style.display='none';
    var vis0=0;
    feed.querySelectorAll('.pc').forEach(function(c){
      var ok=(CAT==='全部'||c.getAttribute('data-c')===CAT);
      c.classList.toggle('hid',!ok);if(ok)vis0++;});
    feed.querySelectorAll('.xtra').forEach(function(c){
      var ok=(CAT==='全部');c.classList.toggle('hid',!ok);if(ok)vis0++;});
    ct.textContent=vis0+' 条知识';
    return;
  }
  /* 条目卡和金句卡：打分、隐藏低分的、按分数重排 */
  var keep=[];
  feed.querySelectorAll('.pc,.xtra').forEach(function(c){
    var isPc=c.classList.contains('pc');
    var inCat=isPc?(CAT==='全部'||c.getAttribute('data-c')===CAT):(CAT==='全部');
    var hay=c.getAttribute('data-t')||'';
    var sc=(hay.indexOf(v)>=0)?full+1:_score(hay,vg);
    var ok=inCat&&sc>0&&(sc>=need||sc>=rare);
    c.classList.toggle('hid',!ok);
    if(ok)keep.push([sc,c]);
  });
  keep.sort(function(a,b){return b[0]-a[0]});
  keep.forEach(function(p){feed.appendChild(p[1])});
  /* 处境里的问题：只在有查询时出现，排在条目前面——
     用自己的话搜处境的人，要的是「有人问过这件事」，不是一张人物名片。 */
  var hits=[];
  for(var i=0;i<scText.length;i++){
    var t=scText[i];
    var sc2=(t.indexOf(v)>=0)?full+1:_score(t,vg);
    if(sc2>0&&(sc2>=need||sc2>=rare))hits.push([sc2,i]);
  }
  hits.sort(function(a,b){return b[0]-a[0]});
  hits=hits.slice(0,12);
  qres.innerHTML=hits.map(function(p){return scCells[p[1]]}).join('');
  qres.style.display=hits.length?'':'none';
  ct.textContent=(keep.length+hits.length)+' 条知识';
  /* 一条都没有的时候得说话。原来是整片空白——读者分不清是搜不到还是页面坏了。
     另外两个站都有这句（「没有匹配的，换个词试试」「没有匹配的深读」），只有这儿没有。
     出路指向处境：用自己的话搜不到，多半是词不对，而处境是按人话写的。 */
  var none=document.getElementById('hwx-none');
  if(!none){none=document.createElement('div');none.id='hwx-none';none.style.display='none';feed.parentNode.insertBefore(none,feed);}
  if(keep.length+hits.length===0){
    none.innerHTML='<b>没找到「'+esc(v)+'」</b>'
      +'<i>换个说法试试——或者到下面的处境里挑你自己那一件。</i>'
      +'<button type="button" id="hwx-none-go">去挑处境 →</button>';
    none.style.display='';
    var g=document.getElementById('hwx-none-go');
    if(g)g.onclick=function(){
      var qi=document.getElementById('q'); if(qi)qi.value='';
      SCSEL=''; SCGRP=''; switchTab('境'); applyFeed(); scBuild(); scRender(); scReveal();
      var el=document.getElementById('hwx-tabs2');
      if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'start',behavior:'smooth'})}catch(e){}
    };
  }else{none.style.display='none';}
}
/* 搜索框接管 */
var qin=document.getElementById('q');
if(qin){qin.oninput=null;
  /* 搜索落空记录：这是三个埋点里最值钱的一个——用户搜了什么、我们没有，
     直接告诉我们该补什么内容，比坐着推理准得多。
     只在停止输入 1.2 秒后发一次，避免把「睡」「睡不」「睡不着」都记下来。 */
  var _mt=null, _lastMiss='';

      _lastMiss=v;
      if(n===0) trk('search_miss',{term:v.slice(0,40)});
      else trk('search_hit',{term:v.slice(0,40), results:n});
    },1200);
  });}
/* 初始化 */
/* 一行入口：点它切到「处境」tab，不再就地展开 1049px 的标签目录 */
(function(){

/* 问题卡整块可点。条目卡（.nc）和人物卡（.pc）本来就是一整个 <a>，只有问题卡
   是 div 套一个链接——读者点在卡片别处没反应，等于每张卡有一小片能点、一大片不能。
   委托到 feed 上：点在真链接上走原生跳转，点在卡片别处就跳这张卡唯一那个去处。 */
['hwx-ncfeed','hwx-feed','hwx-scfeed'].forEach(function(id){

    a.click();
  });
});
/* 卡片点击：用委托，三个 feed 一处覆盖。只记卡片类型和去向，不记内容。 */
['hwx-ncfeed','hwx-feed','hwx-scfeed'].forEach(function(id){

    trk('card_click',{card_type:kind, feed:id.replace('hwx-',''), dest:a.getAttribute('href')});
  },true);
});
/* 处境层展开区的答案点击 */
(function(){
  var r=document.getElementById('hwx-res'); if(!r)return;
  r.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="/i/"]'); if(!a)return;

/* 今日一问的答案点击 */
(function(){
  var g=document.getElementById('hwx-ago'); if(!g)return;

switchTab('境');
})();</script>

<script>

f:[{n:"先胜后战",d:"「胜兵先胜而后求战，败兵先战而后求胜」。赢家在开战前就把胜利条件备齐——地形、兵力、补给、士气全部到位才动手。创业版本：市场调研、资金储备、团队配置全部到位才启动，而不是边做边想。",eg:"淝水之战前，谢安确认北府兵战力、地形、士气全部就位才应战，以8万对80万，大胜。项羽则反例：巨鹿之战后每仗都是「先打再说」，最终乌江自刎。"},{n:"不战而屈人之兵",d:"「上兵伐谋，其次伐交，其次伐兵，其下攻城」。最高明的竞争不是打赢，而是让对手根本不想打。商业版本：建立足够强的护城河，让竞争对手看到就打退堂鼓——苹果的品牌、微信的社交关系链，都是这个逻辑。",eg:"战国时张仪凭一张嘴让楚国放弃齐国盟友，秦国未动一兵一卒就瓦解了合纵联盟。商业上，英特尔用「Intel Inside」品牌让下游PC厂商主动宣传自己，护城河不是技术而是心智。"},{n:"奇正相生",d:"「以正合，以奇胜」。正兵守住基本盘，奇兵打出意外。不是说主业不重要，而是主业是「正」，创新是「奇」——没有正的稳固，奇无从借力；没有奇的突破，正只能防守。"},{n:"虚实相生",d:"「我专为一，敌分为十，是以十攻其一也」。集中优势打对手薄弱点。不要在对手最强的地方硬碰，找他忽视的细分市场切入——这是所有弱者对抗强者的基本逻辑。"},{n:"慎战原则",d:"「主不可以怒而兴师，将不可以愠而致战」。情绪是战略的大敌。刘备因关羽之死一怒征吴，夷陵大败，蜀汉从此一蹶不振——这是「愠而致战」的教科书级案例。"},{n:"知己知彼",d:"「知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆」。完整含义是三层：同时了解自己和对手（不败），只了解自己不了解对手（五五开），两者都不了解（必败）。",eg:"马云创立阿里前做了详细竞争对手研究，同时对自身「只懂中国中小企业」的准确认知，让他在这个点上集中所有资源。"},{n:"庙算胜负",d:"「庙算多者胜，庙算少者不胜」。开战前先在庙堂推演，把所有变量算清楚。现代版：重大决策前先写下失败的所有可能原因——把风险前置化。"},{n:"造势借势",d:"「善战者，求之于势，不责于人」。高手不依赖个人超常发挥，而是创造势能让普通人做出超常行为。看清势在哪里，比找到最强的人更重要。"}],
q:["百战百胜，非善之善者也；不战而屈人之兵，善之善者也。","知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆。","兵无常势，水无常形，能因敌变化而取胜者，谓之神。","胜兵先胜而后求战，败兵先战而后求胜。","上兵伐谋，其次伐交，其次伐兵，其下攻城。"],
apply:"产品竞争中，先搭好不败之地（核心用户基础、差异化定位）再去扩张，比先跑量再想壁垒稳得多。遇到强对手，不要在他的主场硬拼，找他看不见的角落先站稳。",
l:["毛泽东","粟裕","韩信","范蠡","管仲"],contrast:[{"n": "项羽", "why": "项羽是孙子兵法的反面教材——力拔山兮气盖世，却输给了「先胜后战」都不会的刘邦"}, {"n": "宫本武藏", "why": "同样是兵法，孙子讲「庙算」，宫本武藏讲「无形」——战略思维vs武道哲学"}]},

{c:"谋略与竞争",n:"毛泽东",e:"近代·1893-1976",w:"集中优势",y:1893,
d:"从师范生到建立新中国，毛泽东一生最重要的能力是：在最混乱的局面里找到主要矛盾，然后把全部力量压上去。《矛盾论》《实践论》《论持久战》，是他把军事实践升华为哲学的三件代表作。",
story:"1947年，国民党重点进攻延安，毛泽东决定主动放弃延安，以空间换时间。果然，国民党军进入延安后疲于守点，解放军在运动中各个歼灭，一年内战局完全逆转。",
f:[{n:"集中优势兵力",d:"「伤其十指不如断其一指」。不要同时打多个敌人，把力量集中在一个点上形成压倒性优势，打垮一个再打下一个。"},{n:"矛盾论",d:"每个阶段只有一个主要矛盾，解决了它，其他问题跟着解决。创业初期的主要矛盾是「产品能不能解决用户问题」，先把这个解决了。",eg:"滴滴早期主要矛盾是「司机够不够」，一切资源全压在补贴司机上，解决了这个才谈其他。"},{n:"实事求是",d:"「没有调查，没有发言权」。一切结论产生于调查情况的末尾，而不是开头。"},{n:"持久战",d:"弱者对阵强者，不能求速决。「战略防御→战略相持→战略反攻」三个阶段。"},{n:"统一战线",d:"「联合次要敌人，打击主要敌人」——先集中一切力量打最危险的那个，对其他人暂时妥协甚至联合。"},{n:"群众路线",d:"「从群众中来，到群众中去」——决策不从书本来，从真实用户来；政策制定后，再回到群众中验证、修正。"}],
q:["没有调查，没有发言权。","战略上藐视敌人，战术上重视敌人。","集中优势兵力，各个歼灭敌人。","存地失人，人地皆失；存人失地，人地皆存。"],
apply:"团队每季度开始前先问：这个阶段最主要的矛盾是什么？把资源全部压在那一件事上，其他事情能推就推，能缓就缓。",
l:["粟裕","孙子兵法","刘邦"],contrast:[{"n": "甘地", "why": "面对压迫最极端的两种路径：毛泽东用武装斗争，甘地用非暴力——都成功了，这是历史奇迹"}, {"n": "拿破仑", "why": "战略思维的东西方对话：集中优势vs奥斯特利茨——相隔150年的战略共鸣"}]},

{c:"谋略与竞争",n:"粟裕",e:"近代·1907-1984",w:"以弱胜强",y:1907,
d:"解放军第一战将，淮海战役以60万对阵80万，歼灭国民党精锐55万。他从不用蛮力，只用脑子——找对手必须救的地方打，让对手陷入被动。",
story:"1947年淮海战役前，粟裕三次向中央建议在长江以北打大歼灭战。毛泽东最初不同意，粟裕坚持。最终毛泽东采纳，淮海战役一战定乾坤。战后毛泽东说：「淮海战役，粟裕同志立了第一功」。",
f:[{n:"围点打援",d:"攻打对手「必须救」的要点，在援军来援的路上设伏——让对手陷入「救也死，不救也死」的困境。"},{n:"运动战",d:"「打得赢就打，打不赢就跑」——不是逃跑，是主动脱离不利战场，保存实力，等待更好时机。"},{n:"歼灭战思维",d:"不求占领土地，只求消灭有生力量。不要追求市场份额数字，要削弱竞争对手的核心团队和核心用户。"},{n:"战后复盘",d:"每次战役结束，粟裕必有系统性总结。他从一个没有军校背景的普通士兵，用复盘积累成了解放军第一战将。",eg:"淮海战役后，粟裕对每个战斗阶段做详细记录，包括失误和侥幸。他的战后总结后来成为解放军战术教材。"},{n:"三次斗胆直陈",d:"面对毛泽东的战略指示，粟裕曾三次「斗胆直陈」，坚持自己的判断。他的方式是：用书面报告提出完整的战略逻辑，让事实和推理说话，不用情绪。"}],
q:["打得赢就打，打不赢就跑。","攻其所必救，歼其归者。","情况明了，决心就大。"],
apply:"面对强大竞争对手，不要在他的主力产品上正面竞争。找他必须防守的侧翼，持续施压，让他分散注意力，你再集中突破。",
l:["毛泽东","孙子兵法","韩信"],contrast:[{"n": "韩信", "why": "中国历史上两大「以弱胜强」军事天才：韩信用奇谋，粟裕用围点打援——都是把敌人逼入死地"}, {"n": "郭嘉", "why": "同样的「斗胆直陈」精神：郭嘉敢对曹操说不，粟裕敢对毛泽东三次直陈"}]},

{c:"心智与情绪",n:"道德经",e:"春秋·前500年前后",w:"损",y:-500,
d:"老子五千言，是中国哲学的减法源头。与儒家「为学日益」相对，老子说「为道日损」——不断减掉，直到无为，然后无不为。道德经在西方被翻译次数仅次于圣经。",
story:"老子骑青牛西出函谷关，守关令尹喜拦住他，请他留下智慧。老子写了五千言，留下道德经，然后消失于历史。",
f:[{n:"损之又损，以至于无为",d:"「为学日益，为道日损。损之又损，以至于无为，无为而无不为」。加法让你知道更多，减法让你看清本质。"},{n:"柔弱胜刚强",d:"「天下之至柔，驰骋天下之至坚」。水是天下最柔软的东西，却能穿石。持续的柔比短暂的刚更持久。"},{n:"反者道之动",d:"「反者道之动，弱者道之用」。物极必反，这是道的运动规律。看到顶点要想到衰退，看到低谷要相信转机。"},{n:"知足者富",d:"「知足者富，强行者有志」。真正的富不是拥有更多，而是欲望更小。降低欲望，扩大自由。"},{n:"上善若水",d:"水处最低处（谦卑），绕开障碍（灵活），持续流动（坚持），最终穿石（效果）。以最小阻力达到最大效果。"},{n:"为而不争",d:"「天之道，利而不害；圣人之道，为而不争」——当所有人都在争的时候，你退出竞争，你就没有对手了。"}],
q:["为学日益，为道日损。损之又损，以至于无为，无为而无不为。","知人者智，自知者明。胜人者有力，自胜者强。","功遂身退，天之道也。","天下之至柔，驰骋天下之至坚。","知足者富，强行者有志。"],
apply:"每季度做一次「减法清单」：把当前做的所有事列出来，删掉20%最不重要的。不是说这些事不好，是资源有限，专注才有力量。",
l:["王阳明","范蠡","李泌"],contrast:[{"n": "论语", "why": "中国思想史最重要的两极：老子「损之又损」的减法哲学vs孔子「学而时习之」的加法实践"}, {"n": "主权个人", "why": "两千年的思想穿越：道德经「功遂身退、知足者富」是最古老的主权个人哲学"}]},

{c:"心智与情绪",n:"王阳明",e:"明·1472-1529",w:"知行合一",y:1472,
d:"龙场悟道，创立心学。他是中国历史上极罕见的「立德、立功、立言」三不朽者。他的核心洞察：理不在外物，在人心——不是向外格物，而是向内致良知。",
story:"王阳明37岁被贬贵州龙场，瘴气横行，吃住都成问题。有一天夜里，他在石棺里打坐，突然大呼：「圣人之道，吾性自足！」——龙场悟道。他悟到：圣人的道理不需要向外寻找，人心里本来就有。",
f:[{n:"心即理",d:"「心外无物，心外无理」。事物的意义和价值来自你的心。你的判断标准来自内心，不来自外部权威。"},{n:"知行合一",d:"「知之真切笃实处即是行，行之明觉精察处即是知」。知和行不是两件事，是一件事的两个面。你说「我知道要早起」但从不早起——那叫「念头」，不叫「知」。"},{n:"致良知",d:"良知是内心天然具备的判断能力，只需要「致」——去除遮蔽良知的私欲（恐惧/贪婪/面子/惰性）。"},{n:"事上磨炼",d:"「人须在事上磨炼做功夫，乃有益」。不是坐在屋里想通了就算，而是在真实事件中经受磨炼。"},{n:"破心中贼",d:"「破山中贼易，破心中贼难」——真正的敌人不在外面，在心里：恐惧、懒惰、虚荣、自欺。"},{n:"立志",d:"「志不立，天下无可成之事」——找到一个真正触动你内心良知的方向，然后不管外部条件如何都坚持。"}],
q:["知行合一。","破山中贼易，破心中贼难。","此心不动，随机而动。","人须在事上磨炼做功夫，乃有益。","志不立，天下无可成之事。"],
apply:"当你发现团队「知道但不做」，问题不在执行力，在激励机制或认知——他们可能并不真的认为那件事重要。先解决认知问题，再谈执行。",
l:["曾国藩","稻盛和夫","道德经"],contrast:[{"n": "苏格拉底", "why": "东西方哲学的神奇互文：苏格拉底「助产术」vs王阳明「致良知」——答案都在内心"}, {"n": "曾国藩", "why": "知行合一的理论与现实：王阳明悟道，曾国藩践行"}]},

{c:"识人与相处",n:"曾国藩",e:"清·1811-1872",w:"慎",y:1811,
d:"历史上最著名的「笨人逆袭」案例。他资质平平，考了七次才中举。但他用「结硬寨打呆仗」的方法，把自己从一个普通官员做成了晚清最重要的人物。他的秘诀不是聪明，而是「比任何人都慎」。",
story:"曾国藩32岁开始写日记，每天记录自己的言行并严厉批评自己。有一次他在朋友面前辩论占了上风，日记里却批评自己：「争竞之心太重，实为人品之大损」。他坚持写日记三十年。",
f:[{n:"结硬寨打呆仗",d:"打仗时，每到一处必先扎营，营垒扎得极其坚固，然后挖壕沟把敌人围起来，等待对方粮尽。他从不追求奇袭，从不走捷径。",eg:"围攻安庆，守了整整一年，没有任何奇袭，城内粮尽，不战而下。"},{n:"慎独",d:"「慎独则心安」。独处时也守规矩，没人看着的时候才是真正的考验。"},{n:"每日反省",d:"坚持写日记，不是记录发生了什么，而是批评自己：今天哪件事没做好？哪句话说错了？30年不断的自我批评，形成了极强的自我校正能力。"},{n:"广收慎用",d:"「广收」是接触大量人才；「慎用」是在真实任务里考察，不靠简历面试。他发现李鸿章时，让他参与真实的军务决策，观察他在压力下的判断。"},{n:"耐烦",d:"「天下事无所为而成者极少，有所贪有所利而成者居多，吾辈总以耐烦为第一要义」——所有重要的事都需要忍受漫长的无聊和重复。"}],
q:["天下古今之庸人，皆以一惰字致之；天下古今之才人，皆以一傲字致之。","慎之又慎，不可不慎。","困心横虑，正是磨炼英雄之时。","好汉打脱牙和血吞。"],
apply:"把「每日反省」变成一个仪式：每天睡前写三行，今天做错的一件事是什么，原因是什么，明天怎么改。坚持一年，你会发现自己做决策的质量显著提升。",
l:["王阳明","稻盛和夫","达里奥","诸葛亮"],contrast:[{"n": "马可·奥勒留", "why": "东西方最相似的两个人：都靠每日写作反省，都在权力顶点保持克制"}, {"n": "王阳明", "why": "思想的传承与落地：王阳明建立心学，曾国藩用一生实践——悟道vs践道"}],
fail:"1870年天津教案，他奉命查办，为避免开战接受了法国的条件——处死为首者、赔款、遣使道歉。舆论炸了：京师士大夫骂声大作，「卖国贼」三字加在他头上，湖南同乡把他在北京会馆里的官爵匾额全部击毁，连左宗棠和李鸿章都加入痛骂。曾纪泽记下父亲那阵子给朋友写信常写的八个字：「外惭清议，内疚神明」。一年多后，他病死在两江总督任上。",
lesson:["「耐烦」和「求稳」撑了他三十年，最后一次求稳毁了他的身后名。同一套方法，赌注不同，结果相反。","他一生对自己最严，却栽在一件他自认无愧、别人认定有罪的事上。慎独管得住动机，管不住别人怎么定性。","有些位置上，避免更坏的结果和保住名声只能选一个。选了前者，就得准备好被骂很多年。"]},

{c:"财富与风险",n:"范蠡",e:"春秋战国·前536-前448",w:"进退",y:-536,
d:"中国历史上最成功的退隐者，商圣陶朱公。他帮助越王勾践从囚徒做到春秋霸主，然后在功成之日彻底离开——改名换姓，三次迁移，三次积累巨富。",
story:"越国灭吴后，范蠡派人送信给文种：「飞鸟尽，良弓藏；狡兔死，走狗烹。越王为人长颈鸟喙，可与共患难，不可与共乐。子何不去？」文种不信留下，不久被赐死。范蠡当天就离开了，泛舟太湖。",
f:[{n:"知进退的时机",d:"「进」的时机：势头来了，全力投入；「退」的时机：功成之日，不等被推走——在顶点主动退比被动离场早一步。"},{n:"周期思维",d:"「旱则资舟，水则资车」——在旱的时候买船，因为你知道雨季会来。逆周期布局的祖师爷。"},{n:"散财之道",d:"范蠡三次积累巨富，三次把财富散给邻里。「财散则名聚」——散出去的财富换来的是更持久的东西：人心和安全感。"},{n:"飞鸟良弓",d:"权力关系是功能性的，不是情感性的。勾践需要范蠡时，范蠡是宝；不需要时，范蠡是威胁。认清这一点，才知道什么时候该留、什么时候该走。"},{n:"择人而处",d:"越王可与共患难，不可与共乐。判断一个人能不能长期共事，看他得势之后的行为，而不是落难之时。"}],
q:["飞鸟尽，良弓藏；狡兔死，走狗烹。","功遂身退，天之道也。","人取我予，人弃我取。","得时无怠，时不再来。"],
apply:"职业生涯的每个阶段，定期问自己：这段关系/这份工作，我处于「可以继续受益」还是「已经触及天花板且开始积累风险」的阶段？",
l:["白圭","李泌","张良","巴菲特","李嘉诚"],contrast:[{"n": "诸葛亮", "why": "功成的两种选择：范蠡在顶点主动退，诸葛亮至死不退——退vs不退的终极对照"}, {"n": "韩信", "why": "同样功高盖主：范蠡提前离场善终，韩信徘徊中间被杀——退的艺术"}]},

{c:"谋略与竞争",n:"韩信",e:"汉·前231-前196",w:"复盘",y:-231,
d:"中国历史上最天才的军事家。胯下之辱，背水一战，十面埋伏——每一个都是教科书。但他的故事有两面：军事天才的崛起，和政治白痴的毁灭。",
story:"背水一战前，韩信背靠河水列阵，军官们全都觉得这是兵法大忌。战后问他，韩信说：「兵法上说「陷之死地而后生，置之亡地而后存」——只有把他们逼到无路可退，才会拼死一战。」",
f:[{n:"背水一战",d:"「陷之死地而后生，置之亡地而后存」。去掉退路，才能激发最大潜能。"},{n:"明修栈道暗渡陈仓",d:"假装修缮旧栈道（让对手放松警惕），实际率主力从陈仓出击，一举定三秦。「以正合，以奇胜」的完美示范。"},{n:"功高震主的宿命",d:"韩信的错不是「没有造反」，而是「既不造反，也不交权」——这个中间状态是最危险的，让刘邦永远不放心。"},{n:"复盘思维",d:"韩信每次打完仗必有总结。他从一个籍籍无名的流亡者，在极短时间内成为最伟大的军事家。高手和普通人的差距，不在于错了多少，在于从错误中学到了多少。"}],
q:["多多益善。","陷之死地而后生，置之亡地而后存。","悔不用蒯通之计，乃为儿女子所诈，岂非天哉！"],
apply:"每个重要项目结束后做「韩信复盘」：写下这次为什么成功或失败的三个关键原因，不是表面原因，是根本原因。",
l:["刘邦","张良","孙子兵法"],contrast:[{"n": "张良", "why": "汉初三杰的命运分叉：张良彻底退善终，韩信不退不交权被杀"}, {"n": "霍去病", "why": "同为军事天才：韩信善用奇谋，霍去病纯粹燃烧——复杂vs纯粹"}],
fail:"楚汉战争结束后，韩信被刘邦削去兵权，降为淮阴侯。公元前196年，吕后设局，以谋反之名请韩信入宫议事，当场处死，夷三族。他死前只说了一句话：「悔不用蒯通之计」。",
lesson:["知道危险不等于能躲开——韩信精通兵法，却对自己的处境判断失准。","「既不造反，也不交权」是最危险的中间状态。","功高震主之后只有三条路：退（张良）、污（萧何）、交权（王翦）。不选，等于选了死。"]},

{c:"权力与组织",n:"刘邦",e:"汉·前256-前195",w:"用人",y:-256,
d:"历史上最著名的「草根逆袭」案例。起点：一个基层官吏。终点：汉朝开国皇帝。他的唯一技能是「用人」——不是最聪明的，不是最能打的，但最擅长让比他强的人为他效力。",
story:"垓下之战后，刘邦大宴功臣，问：「我为什么赢，项羽为什么输？」刘邦说：「夫运筹帷幄，决胜千里，吾不如子房；镇国家，抚百姓，吾不如萧何；连百万之军，战必胜，吾不如韩信。此三者皆人杰，吾能用之，此吾所以取天下也。」",
f:[{n:"用人不疑",d:"刘邦给韩信百万大军，明知韩信比他强得多——他选择相信。信任有成本，但不信任的成本更高。"},{n:"财散人聚",d:"刘邦最重要的用人法则：愿意给。给钱、给权、给名声——他自己不多留。项羽「爱将印，刓忍不能予」，一个舍不得给的领导，留不住真正的人才。"},{n:"从谏如流",d:"打下咸阳，张良说你要做天下之主就不要大肆抢劫。刘邦立刻收手，发布「约法三章」。"},{n:"约法三章",d:"「杀人者死，伤人及盗抵罪」——进入咸阳后只立三条法律，废除秦朝苛法。让关中百姓立刻倒向他。他懂得：规则的信任感比财货更值钱。"}],
q:["夫运筹帷幄之中，决胜于千里之外，吾不如子房；镇国家，抚百姓，给馈饷，不绝粮道，吾不如萧何；连百万之军，战必胜，攻必取，吾不如韩信。此三者，皆人杰也，吾能用之，此吾所以取天下也。","财散人聚，财聚人散。"],
apply:"招聘时问：这个人哪方面比我强？在哪些事上我应该听他的而不是告诉他怎么做？答案越清晰，你的团队越强。",
l:["韩信","张良","曹操"],contrast:[{"n": "项羽", "why": "同样起于乱世，刘邦用「软」，项羽用「刚」——一个赢了天下，一个赢得了传奇"}, {"n": "曹操", "why": "两人都是用人高手，但刘邦靠散财，曹操靠制度"}],
fail:"公元前200年，刘邦率32万大军亲征匈奴，轻率冒进，被冒顿单于40万骑兵困在白登山七天七夜。最终靠贿赂冒顿之妻才得以脱身。原因：他把打败项羽的经验直接套用在完全不同的对手身上。",
lesson:["「上次赢了」是下次最危险的心理——打败项羽的方法在草原上完全失效。","冒进是成功者的通病——越成功，越容易低估新的对手。"]},

{c:"权力与组织",n:"曹操",e:"汉末·155-220",w:"唯才是举",y:155,
d:"被《三国演义》塑造成奸臣的曹操，历史上是中国最早的系统性能力主义者。他一生发布三道求贤令：不看出身，不看品行，只看能力。同时是军事家、政治家、诗人。",
story:"曹操下令：军队不得践踏农田，否则斩首。结果他自己的马受惊踏了麦田。他召集军官，要自刎谢罪，被劝阻后，拔剑割下自己的头发，说：「发代首」。制度的公信力来自这里：规则对所有人一视同仁，包括制定规则的人。",
f:[{n:"唯才是举",d:"三道求贤令，核心都是：「唯才是举，吾得而用之」。不拘出身，不拘品行，不拘旧仇，不拘名声。结果：他的团队人才密度远超刘备和孙权。"},{n:"割发代首",d:"制度面前，领导者自罚比不罚更重要。如果老板自己违规不受罚，下面的人就永远不会真正遵守规则。"},{n:"挟天子以令诸侯",d:"196年，曹操率先迎接流亡的汉献帝到许昌，「奉天子以令不臣」。先占据政治合法性资源，让自己的所有行动都有「正统」背书。"}],
q:["唯才是举，吾得而用之。","老骥伏枥，志在千里；烈士暮年，壮心不已。","对酒当歌，人生几何？"],
apply:"招聘时，如果你只招「完美简历」的人，你会错过大量真正有能力的人。试试只看一件事：这个人在他真正做过的事情上，结果怎么样？",
l:["刘邦","孙子兵法","韩非子","司马懿"],contrast:[{"n": "刘邦", "why": "两种枭雄的用人哲学：刘邦靠散财和信任，曹操靠制度和能力——财散人聚vs唯才是举"}, {"n": "韩非子", "why": "法家理论的践行者：韩非子写了理论，曹操活出了法家逻辑——「割发代首」就是法术势的完美示范"}],
fail:"公元208年，赤壁。曹操犯了两个致命错误：强令北方旱地士兵水战，又将战船铁索相连——给了周瑜火攻的机会。他输给的不只是周瑜，是自己在顶点时的轻敌和急于求成。",
lesson:["在不熟悉的领域用熟悉的打法，是强者最常见的失误。","越接近成功，越容易轻敌——赤壁之败的根本原因是他认为胜负已定。"]},

{c:"谋略与竞争",n:"司马懿",e:"三国·179-251",w:"忍",y:179,
d:"熬过曹操、曹丕、曹叡、曹芳四代，在70岁时发动高平陵之变，一夜夺取曹魏实际控制权。他用一生证明：在长期博弈里，活得最久的那个人赢。",
story:"五丈原对峙。诸葛亮派使者送来一套女人的衣服，羞辱他躲着不敢打。司马懿没有发怒，欣然接受，还问使者：「诸葛丞相最近睡眠怎么样？」使者说：「丞相夙兴夜寐，每天吃得很少。」司马懿转身说：「亮将死矣。」——他看生命周期，不看军事实力。诸葛亮同年病逝，54岁。司马懿此后又活了17年。",
f:[{n:"忍的四个层次",d:"忍辱（接受屈辱而不失控），忍欲（压制急于行动的冲动），忍时（等待最佳时机），忍死（装病装弱，让对手误判）。四层叠加：对手看到的是奄奄一息的老人，实际上是蓄势待发的猎豹。"},{n:"高平陵之变的精确时机",d:"司马懿等了整整三年，等的就是：曹爽+皇帝同时离开洛阳，留下空城。他等的不只是机会，是「唯一的那个机会」。"},{n:"装弱的艺术",d:"司马懿把「装病」用到了极致，让两个对手同时对他产生了错误判断。信息是双向武器：你对外展示什么，决定了对手会如何行动。"},{n:"以守代攻",d:"五丈原是「守」赢了「攻」的最典型案例。司马懿的逻辑极其简单：我不需要赢，我只需要不输，时间会帮我赢。"}],
q:["亮将死矣。","骑虎之势，不得下也。"],
apply:"在竞争中，如果你的资源比对手少，考虑「时间战术」：不求一战定乾坤，求每次接触后对手消耗得比你多。持续消耗，等待对手犯错或资源耗尽。",
l:["范蠡","李泌","诸葛亮","孙子兵法"],contrast:[{"n": "诸葛亮", "why": "五丈原最极致的对照：诸葛亮以攻代守耗尽生命，司马懿以守代攻耗死对手"}, {"n": "霍去病", "why": "知识库里两种极端生命策略：霍去病24岁燃尽，司马懿70岁出手"}]},

{c:"权力与组织",n:"诸葛亮",e:"三国·181-234",w:"隆中对",y:181,
d:"「运筹帷幄」的代名词，「鞠躬尽瘁」的化身。他未出茅庐时就规划了三分天下的格局，辅佐刘备建立蜀汉，治蜀二十年法治清明，六出祁山以攻代守。",
story:"诸葛亮最后一次北伐，在五丈原与司马懿对峙。司马懿向蜀军使者打听诸葛亮的日常，使者说：「丞相早起晚睡，凡是超过二十杖的刑罚都亲自过目，每天吃得很少」。司马懿对左右说：「食少事烦，岂能久乎？」——用生命力，赢了才华。",
f:[{n:"隆中对的战略框架",d:"未出茅庐，分析了曹操（不可争锋）、孙权（可以联盟）、荆州（必须取）、益州（根据地），设计了「跨有荆益、外结孙权、内修政理、待机北伐」的三步路径。"},{n:"挥泪斩马谡",d:"街亭失守，马谡是诸葛亮最看重的将领，私交甚好。诸葛亮仍依法斩首，同时上表自贬三级。制度的公信力来自对「关系户」的处理。"},{n:"以攻代守",d:"「不伐贼，王业亦亡；惟坐而待亡，孰与伐之？」蜀国弱，时间站在魏国这边——蜀国越等越弱，所以必须主动进攻。"},{n:"事必躬亲的教训",d:"「凡二十杖以上皆亲决」。他设定的标准太高，没有人达到，所以他不敢放权，所以他死后没有人能接续。"}],
q:["鞠躬尽瘁，死而后已。","非淡泊无以明志，非宁静无以致远。","不伐贼，王业亦亡；惟坐而待亡，孰与伐之？"],
apply:"如果你发现自己「事必躬亲」，先问：是因为没有人达到标准，还是因为我没有真正教会他们标准？你的工作是培养能接替你的人。",
l:["曹操","孙子兵法","曾国藩","范蠡","司马懿"],contrast:[{"n": "司马懿", "why": "才华与寿命的对照：诸葛亮54岁耗尽，司马懿活到73岁——以攻代守vs以守代攻"}, {"n": "范蠡", "why": "功成的两种选择：范蠡在顶点主动退，诸葛亮至死不退"}],
fail:"诸葛亮六出祁山，每次都因粮草或意外功败垂成。最根本的失败不在战场，在组织——他让自己成为不可替代的人。54岁，五丈原，他在案牍前走完最后一程。",
lesson:["「不可替代」是个人荣耀，是组织灾难。","事必躬亲的本质是不信任——结果是你累死，团队没有成长。"]},

{c:"权力与组织",n:"管仲",e:"春秋·前723-前645",w:"富民强国",y:-723,
d:"中国历史上第一个系统性思考「经济」和「治理」关系的政治家。他帮助齐桓公从一个普通诸侯国做到「九合诸侯，一匡天下」。孔子评价他：「微管仲，吾其被发左衽矣」。",
story:"管仲和鲍叔牙年轻时合伙做生意，管仲多拿利润，鲍叔牙不说他贪，说他家里穷。后来鲍叔牙向齐桓公力荐管仲：「如果只想治理齐国，我鲍叔牙就够了；如果想称霸天下，非管仲不可。」管仲死前说：「生我者父母，知我者鲍子也。」",
f:[{n:"富民强国",d:"「凡治国之道，必先富民」——先让老百姓富，国家才能真正强。「仓廪实则知礼节，衣食足则知荣辱」——基础需求不满足，谈道德是奢侈。"},{n:"盐铁专卖",d:"把税收「藏在」盐铁价格里，让百姓不感觉到被征税，国家财政却充足。现代版：苹果的应用商店30%抽成——本质是同一件事。"},{n:"尊王攘夷",d:"帮齐桓公打出「尊王攘夷」的旗号，把竞争变成了「文明vs蛮夷」的框架。占据道德制高点，是竞争中最有效的品牌策略。"}],
q:["仓廪实则知礼节，衣食足则知荣辱。","凡治国之道，必先富民。","一年之计，莫如树谷；十年之计，莫如树木；终身之计，莫如树人。","生我者父母，知我者鲍子也。"],
apply:"管理团队时，在谈「文化」「使命」之前，先确认薪酬是否到位。员工在担心房租的时候，讲企业价值观是无效的——物质基础先于精神建设。",
l:["国富论","范蠡","孙子兵法","毛泽东","韩非子"],contrast:[{"n": "商鞅", "why": "两种富国强兵的路径：管仲「先富民」再强国，商鞅「先立法」再富国——经济改革vs制度改革"}, {"n": "诸葛亮", "why": "两位辅佐霸主的顶级宰相：管仲辅佐齐桓公成功，诸葛亮辅佐刘备未竟——成功与悲剧的对照"}]},

{c:"财富与风险",n:"巴菲特",e:"当代·1930-",w:"护城河",y:1930,
d:"奥马哈的神奇老人，用60年把10000美元变成了一个千亿美元帝国。他的方法：找到有护城河的好公司，以合理价格买入，然后长期持有。他最大的竞争优势不是选股技能，而是情绪控制。",
story:"1973-1974年，美国股市大跌50%，华盛顿邮报股价从38美元跌到16美元。所有人在逃跑，巴菲特大笔买入。他给管理层写信：「我以1000万美元的价格，买入了一家你们自己也认为价值4-5亿美元的公司」。后来这笔投资回报超过100倍。",
f:[{n:"护城河四种形式",d:"品牌（可口可乐），网络效应（Visa），成本优势（规模带来的低成本），转换成本（微软Office：用惯了换别的太麻烦）。护城河越宽，未来收益越确定。"},{n:"能力圈",d:"「你不需要了解所有的公司，只需要了解你能理解的那些」。不懂科技股，就不买。能力圈的边界比能力圈本身更重要。"},{n:"情绪护城河",d:"「别人贪婪时恐惧，别人恐惧时贪婪」。1987年股灾、2000年互联网泡沫、2008年金融危机，他都是在崩溃里大量买入的那个人。"},{n:"复利的耐心",d:"巴菲特99%的财富是在他50岁之后积累的。复利不神秘：10%年回报率，30年变17倍，40年变45倍。时间是最好的乘法器。"},{n:"安全边际",d:"「以50美分买价值1美元的东西」。永远留有足够的缓冲空间，即使判断错了也不会致命。"}],
q:["在别人贪婪时恐惧，在别人恐惧时贪婪。","第一，不要亏钱；第二，不要忘记第一条。","时间是好公司的朋友，是坏公司的敌人。","如果你不愿意持有一只股票十年，那你连十分钟都不应该持有它。"],
apply:"下次投资决策之前，问三个问题：这个护城河五年后还在吗？我真的理解这个生意的底层逻辑吗？如果价格跌50%，我会庆幸机会来了还是恐慌卖出？",
l:["查理·芒格","范蠡","李嘉诚","段永平"],contrast:[{"n": "索罗斯", "why": "投资哲学的两极：巴菲特长期持有好公司，索罗斯做空错误定价——价值投资vs反身性"}, {"n": "范蠡", "why": "跨越两千年的商业智慧：范蠡「旱则资舟」的周期思维，是巴菲特「别人恐惧我贪婪」的古代版本"}],
fail:"1993年，巴菲特花4.33亿美元收购Dexter鞋业，用伯克希尔股票支付。结果中国廉价鞋涌入市场，Dexter竞争优势荡然无存。那些股票后来价值超过35亿美元。",
lesson:["护城河需要对抗真实竞争压力才算数——Dexter的护城河只在没有低成本竞争时成立。","他在致股东信里公开承认这个失误——这种透明度本身就是他护城河的一部分。"]},

{c:"财富与风险",n:"查理·芒格",e:"当代·1924-2023",w:"逆向",y:1924,
d:"巴菲特的合伙人，伯克希尔·哈撒韦副主席，99岁去世。他最重要的贡献：把巴菲特从「捡烟蒂」进化到「以合理价格买优秀公司」。他的思维工具箱：多元思维模型+认知偏差清单。",
story:"芒格在哈佛法学院毕业典礼上演讲，说：「我只想告诉你们如何必然走向不幸。」然后列举了导致人生失败的所有方法。他说：「如果你知道你会在哪里死，你就永远不会去那里」——逆向思维的最佳示范。",
f:[{n:"逆向思维",d:"「反过来想，总是反过来想」。创业成功的路有无数条，失败的模式只有几种。把这些「死法」列出来，逐一规避，比追求「怎么赢」更有效。"},{n:"多元思维模型",d:"「一个手里只有锤子的人，看什么都像钉子」。芒格积累了100个跨学科模型：数学的复利、物理的临界点、生物的进化、心理学的认知偏差……"},{n:"激励机制第一",d:"「告诉我激励是什么，我就告诉你结果会是什么」。理解一个系统，先看激励结构：每个人按自己的激励行动，而不是按你期望的方式行动。"},{n:"能力圈的诚实",d:"「我没有权利拥有一个我无法反驳的观点」。如果你不能说出支持自己观点的最强反对理由，你就不真正理解这个问题。"}],
q:["反过来想，总是反过来想。","告诉我激励是什么，我就告诉你结果会是什么。","以合理价格买入卓越公司，远胜于以便宜价格买入普通公司。","我没有权利拥有一个我无法反驳的观点。","如果我知道我会在哪里死，我就永远不会去那里。"],
apply:"每次做重要决策前，花5分钟做「逆向清单」：这个决策有哪些最可能失败的原因？每个原因有没有解决方案？",
l:["巴菲特","孙子兵法","韩非子","达里奥"],contrast:[{"n": "巴菲特", "why": "同一家公司的两个大脑：巴菲特的天赋是耐心与定价，芒格的天赋是否定——他的职能是替巴菲特杀掉那些「看起来不错」的想法。芒格自己说，伯克希尔的成功来自避免愚蠢，而不是追求聪明"}, {"n": "塔勒布", "why": "两份互补的防错清单：芒格列的是认知偏差（人脑内部的bug），塔勒布列的是随机性陷阱（世界外部的bug）。只防一头的人，会在另一头被清算"}]},

{c:"财富与风险",n:"李嘉诚",e:"当代·1928-",w:"周期",y:1928,
d:"从塑料花小工厂到长和集团，李嘉诚用70年建立了横跨地产、港口、电信、零售、能源的商业帝国。多次大危机（1967年暴动、1997年金融危机、2008年金融危机）都安然度过，靠的是「逆周期布局+永远保持现金」两个原则。",
story:"1967年，香港左派暴动，炸弹遍地，英资企业纷纷撤离，香港地产价格暴跌。所有人都在卖，李嘉诚在买。三年后，香港社会恢复稳定，他的资产翻了几倍。",
f:[{n:"逆周期布局",d:"低谷收购，高峰套现。1967年香港暴动买地；2000年后逐步撤资中国楼市（比大多数人早了十年）。每次都是在别人还没意识到周期转折时行动。"},{n:"不赚最后一个铜板",d:"「我不赚最后一个铜板」——在他判断的顶峰之前退出，让出最后10-20%的涨幅，换来确定性。贪最后一个铜板意味着等到所有人都确认顶部才卖。"},{n:"现金流是氧气",d:"在任何时候都保持大量现金储备，宁可放弃一些投资回报，也要确保流动性。2008年金融危机很多大集团资金链断裂，他安然度过。"},{n:"第一个桶扎实",d:"「第一个桶一定要扎实，才好放第二个桶」。不先把基本盘做稳就去扩张，是很多企业的死因。"}],
q:["扩张中不忘谨慎，谨慎中不忘扩张。","好景时不过分乐观；不好景时不过度悲观。","第一个桶一定要扎实，才好放第二个桶。","现金流是企业生存的氧气。"],
apply:"每年年初做一次「现金压力测试」：如果主要收入来源断掉6个月，你的现金能撑多久？如果小于6个月，现在就开始增加现金储备。",
l:["范蠡","巴菲特","段永平"],contrast:[{"n": "范蠡", "why": "跨越两千年的商业智慧：范蠡逆周期布局，李嘉诚逆周期买地——同一套周期思维，古今互证"}, {"n": "巴菲特", "why": "价值投资的东西方实践：都在别人恐惧时贪婪，都保持大量现金储备"}]},

{c:"创业与产品",n:"乔布斯",e:"当代·1955-2011",w:"极简",y:1955,
d:"苹果联合创始人，被迫离开苹果，在NeXT和皮克斯度过12年，然后回来把濒死的苹果变成了全球最有价值的公司。他的思想核心是：简单比复杂更难，专注意味着说不，设计是产品如何工作而不只是外观。",
story:"1997年乔布斯回归苹果时，苹果有超过350个产品型号。他把所有产品线整理在一张纸上，然后划掉了其中70%，说：「我们只做这四个」——消费台式机、消费笔记本、专业台式机、专业笔记本。接下来的几年证明了他是对的：专注让苹果把有限资源全部投入四条产品线，每条都做到极致。",
f:[{n:"极简三层次",d:"功能极简（只留核心功能），设计极简（一目了然），体验极简（用户感受不到背后的技术复杂性）。「简单可以比复杂更难实现：你必须把思维理清楚，让它变得简单，但最终是值得的」"},{n:"专注=说不",d:"「专注意味着对一百个其他好主意说不」。他回归苹果的第一年，砍掉了350个产品中的70%。专注的本质是放弃，而不只是坚持。"},{n:"整体体验",d:"乔布斯对产品的定义不只是产品本身，而是整个体验：包装设计（开箱像一个仪式），零售店，售后服务（天才吧），广告（Think Different）——所有接触点都在传达同一个价值观。"},{n:"现实扭曲力场",d:"他能让人相信「不可能」是可能的，然后团队真的把不可能做成了可能。当一个人真的相信自己在做一件改变世界的事，他能付出的超出他自己的预期。"}],
q:["简单比复杂更难。你必须努力理清思路，让它变得简单。","专注意味着对一百个其他好主意说不。","设计不仅仅是外观和感受。设计是产品如何工作。","保持饥饿，保持愚蠢。（Stay Hungry, Stay Foolish.）"],
apply:"列出你正在做的所有项目/功能/任务，然后问：如果只能保留一半，我会保留哪一半？被删掉的那一半，现在就停止。",
l:["霍去病","彼得·蒂尔","任正非"],contrast:[{"n": "霍去病", "why": "燃烧型天才的两种形态：霍去病24岁病逝，乔布斯56岁离世——都把全部能量给了一件事"}, {"n": "王阳明", "why": "极简与致良知：乔布斯减法哲学和王阳明「损之又损」在精神上高度吻合"}],
fail:"1985年，乔布斯被他自己请来的CEO约翰·斯卡利赶出了苹果。随后12年，他创立NeXT：产品叫好不叫座，最终以被苹果收购告终。",
lesson:["被自己的公司踢出去，是他职业生涯最重要的事——在NeXT学会妥协，在皮克斯学会讲故事，回来时已不是原来那个只懂产品的人。","产品天才不等于管理天才。"]},

{c:"创业与产品",n:"张一鸣",e:"当代·1983-",w:"延迟满足",y:1983,
d:"字节跳动创始人，抖音和今日头条的缔造者。他的特点：极度理性，反对模糊，用算法驱动一切。他相信人的认知偏差是最大的效率损耗，因此把「延迟满足」和「反模糊」当成了个人和团队的核心操作系统。",
story:"张一鸣的一段话常被引用：「我见过很多聪明人，但是愿意延迟满足的人很少。延迟满足感程度在不同量级的人是没法有效讨论问题的。」他本人五年时间磨产品，几乎没有对外发声，没有参加演讲，只是不停地打磨。",
f:[{n:"延迟满足",d:"愿意为了长期价值放弃短期快感，这是一种稀缺能力，也是分辨层次的关键指标。选合伙人、选员工的第一指标，不是能力，是延迟满足感的程度。"},{n:"反模糊",d:"他要求所有人表达时不能用「可能、大概、感觉、似乎」——强制精确。说不清楚，说明还没想透；没想透的事，做了大概率是错的。"},{n:"系统思维",d:"「把公司当产品来开发」——不只是做产品，同时也在设计组织系统、激励系统、信息系统。局部优化往往制造整体问题。"},{n:"用户价值的时间维度",d:"「这个产品三年后还有价值吗？」——他拒绝为了短期数据牺牲长期价值。"}],
q:["延迟满足感程度在不同量级的人是没法有效讨论问题的。","创业公司最大的竞争优势是执行力，不是创意。"],
apply:"下次团队会议上，要求每个人的表达不能包含「可能、大概、感觉」。把所有判断都变成「我认为XX，因为XX，置信度XX%」的形式。",
l:["段永平","黄仁勋"],contrast:[{"n": "王兴", "why": "同时代两种创业哲学：张一鸣「延迟满足」靠算法和理性，王兴「九败一胜」靠直觉和韧性"}, {"n": "稻盛和夫", "why": "两种极度认真：稻盛靠「敬天爱人」的精神驱动，张一鸣靠「反模糊」的理性驱动"}]},

{c:"创业与产品",n:"段永平",e:"当代·1961-",w:"本分",y:1961,
d:"步步高集团创始人，OPPO和vivo的精神源头，巴菲特股东大会上，出价62万美元与巴菲特共进午餐的那个中国人。他的核心：本分（说话算数，做对的事）、长期主义、错事即停。",
story:"2001年，段永平从步步高退出，去美国读书，把公司留给团队打理。结果：OPPO和vivo在他离开后，靠他打下的文化基础，成长为全球前五的手机品牌。他说：「我的成功，是因为我知道很多事情不该做，而不是我会做什么」。",
f:[{n:"本分",d:"「本分的意思就是1.0的厚度就说是1.0的厚度，句号」。本分在需要付出代价时还坚持，才是真本分。"},{n:"做对的事",d:"「做对的事情和把事情做对是两回事。前者是原则，后者是执行」。他会在看清楚「这件事不对」后立刻停止，哪怕已经投入了大量资源。"},{n:"错事即停",d:"「不管什么错误，越早改正损失越小」。在雅达利上亏了大钱后，没有「再搏一把」，直接清仓，不为自己辩护。认错的能力，是比预测准确更重要的能力。"},{n:"长期主义",d:"持有苹果超过十年，持有茅台超过十年。「找到你真正理解的，买入，然后等」。"}],
q:["本分的意思就是1.0的厚度就说是1.0的厚度，句号。","做对的事情和把事情做对是两回事。","不懂的东西不碰。","不管什么错误，越早改正损失越小。"],
apply:"本周找一件你「知道是错的但还在做」的事，停掉。不需要等到找到替代方案，先停掉错的。",
l:["巴菲特","曾国藩","稻盛和夫","黄仁勋"],contrast:[{"n": "张一鸣", "why": "两种中国式长期主义：段永平靠「本分」这套近乎道德律的自我约束做减法，先定不做什么；张一鸣靠数据与算法做加法，用理性压制直觉。一个是儒家的，一个是工程师的"}, {"n": "巴菲特", "why": "段永平是巴菲特最认真的中国学生，但他把护城河从投资挪到了经营：巴菲特买有护城河的公司，段永平亲手造一条——「敢为天下后，后中争先」"}]},

{c:"创业与产品",n:"稻盛和夫",e:"当代·1932-2022",w:"敬天爱人",y:1932,
d:"27岁创立京瓷，52岁创立KDDI（两家都是世界500强），78岁临危受命重建破产的日本航空，1年扭亏为盈，2年重新上市。他的思想核心是「利他」：不是道德选择，是最优的长期商业策略。",
story:"2010年，日航宣告破产，日本政府请78岁的稻盛和夫出任CEO，薪水为零。他接受了。上任第一件事不是裁员，而是召集全体高管，问他们：「你们工作是为了什么？」沉默。他说：「我们工作，是为了家人，是为了乘坐我们飞机的旅客，是为了社会」。一年后，日航创下历史最高利润。",
f:[{n:"人生方程式",d:"「人生·工作的结果=思维方式×热情×能力」。三个变量中，只有思维方式可以为负——负的思维方式乘以再强的能力和热情，结果依然为负甚至伤害社会。方向比速度更重要。"},{n:"六项精进",d:"付出不亚于任何人的努力、谦虚不骄傲、每天反省、活着就感谢、积善行思利他、不烦恼。六项都指向同一件事：消除自我中心。"},{n:"阿米巴经营",d:"把公司分成最小的独立核算单元，每个单元自己有销售额、成本、利润，每天更新数据，所有人都能看到。激活了每个员工的主人翁意识。"},{n:"利他是最优策略",d:"「动机至善，私心了无」——短期来看，利己>利他；长期来看，利他带来的信任和复购远超利己带来的短期收益。「让别人先赢」的人，在重复博弈中总是最后的赢家。"}],
q:["敬天爱人。","极度认真地过好每一天。","工作是最好的修行。","动机至善，私心了无。","在利他中，找到利己。"],
apply:"每天睡前做一次「六项精进」的快速检查：今天有没有偷懒？有没有骄傲？有没有反省？有没有感谢？有没有利他？有没有无谓的烦恼？",
l:["曾国藩","王阳明","范蠡","任正非"],contrast:[{"n": "曾国藩", "why": "东亚精神的两座山：稻盛「极度认真过每一天」和曾国藩「结硬寨打呆仗」——日本vs中国，同一种「笨」的智慧"}, {"n": "王阳明", "why": "知行合一的两种实践：王阳明在龙场悟道，稻盛和夫在工厂践道——哲学与商业的对话"}]},

{c:"创业与产品",n:"马斯克",e:"当代·1971-",w:"第一性原理",y:1971,
d:"PayPal联合创始人，特斯拉、SpaceX、Neuralink、X联合创始人或创始人。他的方法论只有一个：回到物理原点，重新推演一切。别人觉得不可能的事，他先问：物理定律允许吗？如果允许，那「不可能」只是工程问题。",
story:"SpaceX创立初期，马斯克想买火箭，发现美国、俄罗斯的报价都贵得离谱。他把火箭拆解成基础材料清单，算出原材料成本——结论是：现有火箭定价是原材料成本的50-100倍。他决定自己造火箭。",
f:[{n:"第一性原理",d:"「不要类比，不要参考别人，回到最基本的假设，从物理原点推演」。类比是思维的捷径，也是思维的笼子。第一性原理拆掉所有类比，问：这件事的物理极限是什么？",eg:"火箭为什么贵？行业答案：「一直都这么贵」。马斯克拆解原材料成本是整体报价的2%，剩下98%是「行业惯例」。SpaceX把发射成本降到了传统航天的1/10。"},{n:"物理极限思维",d:"「物理学是定律，其他一切都是建议」。任何技术的极限是物理定律设定的，不是现有技术能力设定的。从物理极限反推，倒逼工程创新。"},{n:"80%时间用于创造",d:"「80%的时间用在创造上，具体来说是用在工程和设计上」。他不开没有必要的会，不做没有实际产出的工作。"}],
q:["物理学是定律，其他一切都是建议。","努力成为有用的人。做有用的事，对别人，对这个世界。","80%的时间用在创造上。"],
apply:"下次遇到「不可能」的问题，先问：物理定律允许吗？如果允许，那「不可能」只是现有技术和成本的约束——这些约束是暂时的，物理定律是永久的。",
l:["黄仁勋","彼得·蒂尔","段永平"],contrast:[{"n": "爱因斯坦", "why": "第一性原理的两种实践：爱因斯坦用思想实验改变物理学，马斯克用第一性原理改变工业"}, {"n": "霍去病", "why": "孤注一掷的生命策略：霍去病把全部押在战场，马斯克把全部押在几个「不可能」上"}]},

{c:"创业与产品",n:"黄仁勋",e:"当代·1963-",w:"押注",y:1963,
d:"英伟达创始人兼CEO，30年没有被赶走。他在2006年做了一个当时看来「浪费资源」的决定：开发CUDA，让GPU可以做通用计算。2023年，ChatGPT爆发，AI需要大量GPU算力，英伟达成为全球最重要的公司之一。他押注了一个能力，等了17年。",
story:"1995年，英伟达第一款产品NV1上市，惨败。微软的DirectX取代了NV1的技术路线，英伟达濒临破产。黄仁勋面对剩下的员工说：「我需要你们帮我把英伟达从这个危机里带出来」——不是「我有计划，你们跟着走」，而是「我需要你们」。",
f:[{n:"CUDA的长期主义",d:"2006年，GPU主要用于游戏图形。黄仁勋花费数亿美元开发CUDA，当时没有市场，没有客户，只有他的判断：GPU的并行计算能力是稀缺的，总会在某个地方爆发价值。押注的不是某个应用，而是「底层能力」。"},{n:"永远在边缘",d:"「我们永远处于公司即将倒闭的边缘」——这不是谦虚，是他的内心状态。英伟达经历过至少三次几乎破产的时刻。这种永久性危机感让他在危机真正来临时，没有被打懵。"},{n:"60人直接汇报",d:"大多数管理学认为一个人最多管7-10人，黄仁勋有60位直接汇报。他的逻辑：「层级是信息的过滤器，每多一层，信息失真一点，决策慢一点。」"},{n:"苦难哲学",d:"「我希望你们都经历过逆境，因为逆境赋予了你们决心、精神和身份认同」。顺境给你资源，逆境给你清晰度。"}],
q:["我们永远处于公司即将倒闭的边缘。","苦难是一份礼物，我希望每个人都有机会经历。","如果你们没有失败过，你们其实还没有真正开始。"],
apply:"在产品/业务规划中，除了「这个功能/市场现在有多大」，还要问「这个能力/平台未来五年在哪些新场景会爆发价值」——押注底层能力往往比押注具体应用更有价值。",
l:["任正非","彼得·蒂尔","段永平","张一鸣"],contrast:[{"n": "任正非", "why": "两种「押注一个能力、等十几年」：黄仁勋押CUDA等了17年，任正非押芯片与操作系统做了十几年备胎。区别在动机——一个赌最好的情况会来，一个赌最坏的情况会来"}, {"n": "彼得·蒂尔", "why": "蒂尔问「有什么重要的真相是很少人认同你的」，2006年做CUDA的黄仁勋就是这道题的活体样本——当时整个行业都认定GPU就该用来渲染画面"}]},

{c:"创业与产品",n:"彼得·蒂尔",e:"当代·1967-",w:"从0到1",y:1967,
d:"PayPal联合创始人，Facebook第一个外部投资人，硅谷最重要的反共识思想者。他的核心命题：竞争是意识形态陷阱，真正能创造价值的是垄断而非竞争。",
story:"2004年，扎克伯格刚创立Facebook，彼得·蒂尔是第一个外部投资人，投了50万美元，获得10.2%股份。2012年Facebook上市，那50万变成了10亿美元。他在所有人还把它看作「哈佛的学生社区」时，看到了网络效应形成后的垄断价值。",
f:[{n:"从0到1",d:"「从1到N」是复制；「从0到1」是创造——做一个之前不存在的类别。大多数商业是从1到N的，竞争激烈、利润稀薄；从0到1的机会极少，但一旦成功，价值是垄断性的。"},{n:"竞争是陷阱",d:"「竞争是留给失败者的」——如果你的主要精力在「打败对手」上，你已经进入了零和博弈。找到或创造一个你可以主导的领域，把精力放在做大这个领域。"},{n:"幂次法则",d:"风险投资的回报不是正态分布，而是幂次分布：一个投资的回报可以超过其余所有投资的总和。永远全力押注你认为最可能产生幂次回报的那一个，而不是「平衡」分散。"}],
q:["我们想要一辆会飞的汽车，得到的却是140个字符。","做得最好的企业是那些不竞争的企业。","你在哪个重要问题上，与大多数人的观点相反？（他最著名的面试问题）"],
apply:"「彼得·蒂尔问题」：你相信什么重要的事，是大多数人不同意的？如果你能给出一个真实的、有洞察的答案，那可能就是你的竞争优势所在。",
l:["乔布斯","巴菲特","黄仁勋"],contrast:[{"n": "创新者的窘境", "why": "创新的两面：窘境解释「为什么好公司会失败」，蒂尔告诉你「如何成为那个颠覆者」"}, {"n": "巴菲特", "why": "投资哲学的两极：巴菲特寻找护城河长期持有，蒂尔寻找从0到1的垄断者——价值投资vs颠覆投资"}]},

{c:"创业与产品",n:"任正非",e:"当代·1944-",w:"韧",y:1944,
d:"1987年，43岁，用2万元创立华为，从交换机代理商起步。30多年后，华为是全球最大电信设备商。他的管理思想：自我批判是组织免疫系统，以客户为中心是组织的北极星。",
story:"2018年12月，任正非的女儿孟晚舟在加拿大被捕，美国随后将华为列入实体清单。任正非在接受媒体采访时说：「美国的打压让华为的内部斗志空前高涨，就像你用棍子打蚂蚱窝，蚂蚱会四处飞散，但它们都不会死。」",
f:[{n:"活下去哲学",d:"「活下去是华为最朴素的目标，也是最高的目标」。企业死了，一切愿景都是空谈。他的危机意识让华为在危机真正来临时，没有被打懵。"},{n:"自我批判",d:"在华为历史上最成功的年份，他写了《华为的冬天》，详细描述华为可能如何死亡。在顺境里看见危机——自我批判不是自我怀疑，是对自身盲点的主动暴露。"},{n:"以客户为中心",d:"「以客户为中心，以奋斗者为本」——前半句是方向（所有资源对准客户价值），后半句是动力（让真正在奋斗的人获得回报）。"}],
q:["活下去，是华为最朴素的目标，也是最高的目标。","华为没有成功，只有成长。","十年来我天天思考的都是失败，对成功视而不见，也没有什么荣誉感、自豪感，而是危机感。"],
apply:"每年底，给自己写一份「公司/团队冬天来了」的假设场景：如果最重要的客户/收入来源在明年消失，你的应对方案是什么？",
l:["稻盛和夫","曾国藩","乔布斯","黄仁勋"],contrast:[{"n": "稻盛和夫", "why": "两种把企业当修行的东方样本：稻盛靠「敬天爱人」的利他哲学凝聚人心，任正非靠自我批判与危机感驱动组织。一个用善，一个用怕——都能成，但组织的气质完全不同"}, {"n": "曾国藩", "why": "同一套「结硬寨，打呆仗」：曾国藩用它打太平天国，任正非用它做通信设备。不取巧、不抄近路、每一步先立于不败——相隔一百三十年，用的是同一种笨功夫"}]},

{c:"世界如何运转",n:"主权个人",e:"1997年·戴维森&莫格",w:"数字主权",y:1997,
d:"1997年出版，比特币诞生早了11年。两位作者用「暴力经济学」解释了人类社会的全部历史：谁控制暴力，谁就控制财富。他们预言了加密货币、远程工作、数字游民、国家权力衰退。",
story:"1997年，两位英国作者写道：「一种新的数字货币形式，由密码加密序列组成，独一无二、匿名、可验证，可一键完成跨国交易」。2009年，比特币诞生，和这段描述几乎一字不差。",
f:[{n:"暴力经济学",d:"「社会结构=f(暴力的成本, 暴力的收益)」。历史上每一次技术革命，都改变了暴力的成本与收益——火药让贵族城堡失去意义，加密技术让财富可以藏进一串数学里，暴力无从触达。"},{n:"主权个人的四个特征",d:"1. 拥有私钥=拥有不可没收的财富；2. 收入来自全球网络，不依赖单一管辖区；3. 技能是特定知识，无法被简单替代；4. 自我教育，不依赖国家认证体系。"},{n:"技能资产vs位置资产",d:"工业时代最有价值的资产是「位置资产」（土地、工厂、执照）——容易被征税和管制。信息时代最有价值的是「技能资产」（特定知识、声誉、网络）——在你的大脑里，无法被没收。"}],
q:["未来是无序的。这是活着最好的时代，几乎所有你自认了解的东西都是错的。","暴力的成本和收益决定了人类社会的结构。","如果说人工智能是共产主义的，那么加密技术就是自由主义的。——彼得·蒂尔序"],
apply:"检验自己是否在成为主权个人：收入来源是否跨管辖区？财富是否有一部分存在「数学里」而非「权力里」？技能是否无法被简单证书替代？",
l:["纳瓦尔","彼得·蒂尔","塔勒布","道德经","范蠡"],contrast:[{"n": "道德经", "why": "两千年的思想穿越：道德经「功遂身退、知足者富」是最古老的主权个人哲学"}, {"n": "人类简史", "why": "文明叙事的两个方向：人类简史看「系统如何塑造人」，主权个人看「人如何逃脱系统」"}]}

,{c:"权力与组织",n:"张良",e:"汉·前250-前186",w:"退",y:-250,
d:"汉初三杰里最聪明的那个，也是唯一善终的那个。他的一生是三幕戏：第一幕学忍（圯上老人），第二幕用谋（鸿门宴），第三幕退场（留侯请退）。他的比较对象是韩信（不退被杀）和萧何（半退苟活），张良选择了最彻底也最优雅的路。",
story:"刘邦称帝后，论功行赏，让张良自择齐地三万户。张良说：「我从下邳起兵，与陛下会于留。陛下用我计，幸而时中。我愿封留县，足矣。」只要一个小县，放弃了三万户大封。之后他托病不出，学道辟谷，用身体上的「消失」来消除政治上的威胁感。他活到了汉朝稳定之后，看着韩信被杀、彭越被诛，安然离世。",
f:[{n:"留侯原则",d:"要够用的，不要最多的。三万户是功绩的符号，留地一县是够用的家园。要最多是贪，要够用是智慧。这不是谦虚，是精确的风险计算：要求越少，威胁感越小，皇帝越放心，你越安全。"},{n:"圯上老人的教训",d:"年轻的张良看见老人故意把鞋扔下桥，怒火中烧，但憋住了，下去捡回来，弯腰穿上。老人又扔，他又捡，三次。老人说：「孺子可教」，给了他太公兵法。忍不是软弱，是对更大目标的投资——克制当下的情绪，才能赢得长远的机会。",eg:"张良第一次差点发火，第二次也差点，第三次才彻底平静。情绪控制是可以训练的技能，不是天生的性格。"},{n:"三杰对照",d:"张良彻底退，萧何自污留，韩信不退——是三种面对功高震主的策略。张良用「消失」换安全，萧何用「示弱」换信任，韩信两样都没做。结局：张良善终，萧何善终，韩信被杀。策略对了，结局就对了。"},{n:"功成身退的时机判断",d:"「飞鸟尽，良弓藏」——张良是把这句话活出来的人。最难的判断是：什么时候是「功成」？张良的答案是：在对方还没开始猜忌之前。",eg:"韩信对照：韩信知道危险，却既不退出也不交权——在最危险的中间地带待了最久，最终被杀。张良的提前量：他看到天下基本平定时立刻请退，而不是等到被逼。提前量就是安全边际——太晚就没有选择了。"},{n:"道德经落地",d:"道德经说「功遂身退，天之道也」——张良是把这句话活出来的人。这不是消极，是最优的生存策略：在别人都在争的时候，你退出竞争，你就没有对手了。"}],
q:["臣愿封留足矣，不敢当三万户。","愿弃人间事，欲从赤松子游耳。","（刘邦评）运筹策帷幄之中，决胜于千里之外，吾不如子房。"],
apply:"下次升职或拿到重要职位时，记得「留侯原则」：要到「够用且安全」的那个级别，而不是「最大」的那个。最大往往意味着最多的暴露面。",
l:["范蠡","李泌","韩信","道德经","刘邦"],contrast:[{"n": "韩信", "why": "汉初三杰的命运：张良彻底退善终，韩信不退不交权被杀"}, {"n": "范蠡", "why": "两个最懂「退」的人：范蠡退出去做商人，张良退出去学道——退法不同，结果一样"}]},

{c:"权力与组织",n:"李泌",e:"唐·722-789",w:"隐",y:722,
d:"中国历史上最会生存的谋士，没有之一。辅佐了唐玄宗、唐肃宗、唐代宗、唐德宗四代皇帝，三次主动退出朝堂，三次被重新召回，最终以宰相之位善终——73岁。在宦官横行、政治险恶的环境里，这是奇迹。他比范蠡更难：范蠡退出后彻底消失，李泌是在权力旋涡里穿行，退而不远，随时可用。",
story:"安史之乱，唐肃宗逃亡，李泌随行出谋划策。肃宗要重赏他，封他为高官。李泌说：「我是方外之人，不要官职，只求回山修道」。肃宗不许，李泌就穿着道袍上朝，不穿官服。用道士身份，他给自己创造了一个随时可以离开的理由。宦官想陷害他，也找不到攻击点——一个「方外之人」，没有派系，没有官职，有什么可攻击的？",
f:[{n:"道士护盾",d:"李泌不只是「会修道」，道士身份是他精心设计的护盾。「我是方外之人」让他随时可以离开（有理由）、没有政敌（没有官职就没有竞争者）、不受礼法约束。现代版：顾问身份比员工身份灵活得多——进退自如，不被组织的兴衰捆绑。",eg:"每次权力危机来临，他的离开都有充分理由（方外之人归隐），每次被召回也有充分理由（朝廷需要方外智慧）。身份本身是战略工具。"},{n:"三入三出节奏",d:"每次「退」都是在危险积累之前主动退出，不等被推走。第一次：杨国忠嫉妒他，主动请求隐居；第二次：平乱功成，立刻辞官，不等被猜忌；第三次：宦官当道，借病隐退。每次主动退出，都为下次进入保留了资格和信任。"},{n:"谋而不争",d:"安史之乱中，他提出的战略（断燕军退路而非急攻长安）更优，肃宗没听。他没有坚持，没有争，只是记录在案。结果正如他所料，战争拖了几年。他不说「我早就说了」，只是更加被信任。谋划不等于执行，给建议不等于要求采纳。",eg:"「谋而不争」的反面：诸葛亮六出祁山，每次都坚持北伐到底，精力耗尽在执行上，最终54岁病逝。李泌给建议，采不采纳是皇帝的事，他只负责把最优解摆在桌上——结果是他活到73岁，四朝皆用。"},{n:"不揽功不揽权",d:"「不以官为念」不是谦虚，是战略。功劳是皇帝的，官职能推就推，自己不留把柄——没有让人嫉妒的东西，就没有攻击点。郭子仪也是同样的路子：功劳给皇帝，钱财给儿子，权力不要。"}],
q:["臣方外之人，不以官为念。","功遂身退，天之道也。"],
apply:"在职场上做了重要贡献后，不要急着揽功，让功劳「自然」归到老板头上。你得到的是信任和安全感——比奖金更持久的资产。",
l:["范蠡","张良","司马懿","道德经"],contrast:[{"n": "范蠡", "why": "两种「退而不远」的智慧：范蠡彻底消失，李泌以道士身份穿行权力而不被吞噬"}, {"n": "张良", "why": "辅佐多代vs辅佐一代：李泌四朝全身而退，张良一朝功成彻底隐"}]},

{c:"权力与组织",n:"韩非子",e:"战国·前280-前233",w:"法术势",y:-280,
d:"法家集大成者，把商鞅的「法」、申不害的「术」、慎到的「势」整合为一套完整的权力理论。他是中国历史上最清醒的现实主义者——不谈应该怎样，只谈实际上怎样。他的理论直接为秦始皇统一中国提供了思想基础。最大的讽刺：他知道所有权术，却死于同学李斯的谗言。",
story:"韩非子和李斯是同学，同出荀子门下。韩非子口吃，不善言辞，却把思想写成了惊世文章。这些文章流到秦国，秦始皇读后大喜：「寡人得见此人与之游，死不恨矣！」于是发兵攻韩，逼韩王送来韩非子。李斯嫉妒韩非子的才华，在秦王面前进谗言，韩非子下狱，被逼饮鸩而死。最懂权术的人，死于权术——这是知识库里最大的讽刺。",
f:[{n:"法·术·势三位一体",d:"法=明文制度（所有人都必须遵守的规则），术=驭人手段（如何考核识别臣下），势=权力地位（位置本身带来的权威）。三者缺法，制度被架空；缺术，阳奉阴违；缺势，说话没人听。一个CEO必须同时掌握三者，只有其中一种，管理必然失效。",eg:"秦孝公时期：商鞅立法（法），秦孝公撑腰（势），商鞅亲自执行贵族违令也斩（术）——三者齐备，变法成功。对比明朝张居正：有法有术，但势来自太后，万历亲政后势一消失，改革灰飞烟灭。"},{n:"人性趋利避害",d:"「人情者，有好恶，故赏罚可用」。韩非子不相信人天然忠诚，他相信激励机制。设计好制度，人就会按你想要的方式行动——这和查理芒格「告诉我激励是什么，我就告诉你结果是什么」是同一个底层逻辑。"},{n:"五蠹（组织毒瘤）",d:"学者（用嘴皮子混）、游侠（靠关系解决）、纵横家（靠说话不靠实绩）、患御者（利用公资办私活）、商工之民（不产出只倒腾）。换成现代职场：写PPT不干活的、靠人脉不靠能力的、用公司资源做副业的——韩非子两千年前已经描述清楚了。"},{n:"说难",d:"「凡说之难，在知所说之心」。说话难不在于你的知识够不够，而在于你能否摸清对方真实在意什么。韩非子专门写了一篇分析说话的文章：揭穿对方不想被揭穿的事、说的时机不对、太过直白——都是致命的。他懂这一切，却仍死于李斯的话，可见「知道」和「能做到」之间永远有一道沟。"},{n:"赏罚两柄",d:"「明主之所道制其臣者，二柄而已矣——刑与德也」——统治的核心工具只有两个：奖励和惩罚。关键不是两者的大小，而是「执行的一致性」——赏罚失去一致性，制度立刻失效。",eg:"秦国军功制度：无论出身，斩首一级升爵一级，贵族犯法与庶民同罪。对比很多公司：绩效考核形式完备，执行时却对核心员工网开一面——制度公信力一旦损失，比没有制度更危险。"}],
q:["千里之堤，溃于蚁穴。","凡说之难，在知所说之心，可以吾说当之。","明主之所导制其臣者，二柄而已矣。二柄者，刑德也。"],
apply:"设计团队激励机制时，先问「这个制度会让人做什么」，而不是「这个制度应该让人做什么」。人永远按利益行动，按你期望行动的前提是利益和期望一致。",
l:["曹操","查理·芒格","孙子兵法","马基雅维利"],contrast:[{"n": "马基雅维利", "why": "东西方权力理论的双峰：相隔1700年，同样把政治从道德里剥离，同样死于自己研究的权术"}, {"n": "商鞅", "why": "法家理论与实践：韩非子建立理论，商鞅付诸实践——都死于自己创造的力量"}],
fail:"韩非子的文章传到秦国，秦始皇如获至宝。到秦国后，同学李斯嫉妒他，向秦始皇进谗言：「韩非子终究是韩国人，不会真心为秦效力。」韩非子下狱，李斯送去毒药。他写了《说难》，分析了进言的所有难处和风险，自己却死于同学的一句谗言——知道所有陷阱，还是走了进去。",
lesson:["「知道」和「能做到」之间永远有一道沟——韩非子是这道沟最悲剧的注脚。","最了解规则的人，往往成为最危险的存在——所有人都需要防他，所以所有人都在找机会反制他。","才华让你被需要，也让你被恐惧——李斯杀韩非子，不是因为恨，是因为怕。"]},

{c:"谋略与竞争",n:"霍去病",e:"汉·前140-前117",w:"纯粹",y:-140,
d:"汉武帝外甥，17岁首战率800骑兵深入敌后歼灭2028人，19岁两次河西之战歼灭4万匈奴，22岁漠北之战深入2000里，封狼居胥山，饮马瀚海。24岁病逝。他是历史上最纯粹的燃烧型天才——把全部能量给了一件事，然后熄灭。",
story:"汉武帝为霍去病修建了一座豪华府邸，让他去看看是否满意。霍去病拒绝参观，说：「匈奴未灭，何以家为！」这句话后来成为中国历史上最著名的拒绝享受的宣言。他不是作秀，他真的不在乎：他对战场的专注是无可置疑的——他活着的每一天，都在打仗或者准备打仗。",
f:[{n:"纯粹的力量",d:"不分心。武帝赐宅他不看，赏赐食物他不在乎，政治博弈他不参与——所有精力全在战场上。这不是「努力」，是「纯粹」：当一个人真的只在乎一件事时，他在那件事上能达到的高度，是普通人无法企及的。"},{n:"以战养战",d:"霍去病的战术特点：不携带大量辎重，直接抢匈奴的粮草为自己补给。这让他可以以极小的补给线维持极远距离的突袭——代价是极高风险：一旦抢不到粮草，全军覆没。他把风险和回报都推到了极端。",eg:"创业公司的「以战养战」：不依赖外部融资，用第一个客户的收入支付第二个客户的成本，用增长本身来驱动增长。"},{n:"燃烧vs蓄积",d:"霍去病（24岁病逝，封狼居胥）和司马懿（70岁政变）是知识库里最极端的两种生命策略。没有哪个更好：霍去病选择了光芒最强，司马懿选择了持续最久。你要的是什么？"},{n:"纯粹的代价",d:"「匈奴未灭，何以家为」——他拒绝参观府邸，说的不是场面话，是真实的价值排序。这种纯粹产生了极致的战场效果，但没有给生命留下任何余地。24岁病逝，连续多年深入大漠、极高强度作战，已经说明了一切。",eg:"纯粹是双刃剑：乔布斯的极度专注产生了最伟大的产品，也让他在56岁时用尽了身体。他们选择了光芒最强，也接受了持续时间最短。没有哪种选择更对，只有哪种选择是你真正想要的。"}],
q:["匈奴未灭，何以家为！","==顾方略何如耳，不至学古兵法。==","粮草不必自己带，从对手那里拿。"],
apply:"如果你发现自己在某件事上达到了霍去病式的专注——那件事就是你应该押注的地方。不要用「全面发展」的逻辑去稀释它。",
l:["韩信","乔布斯","司马懿","张良"],contrast:[{"n": "司马懿", "why": "知识库里最极端的两种人生策略：霍去病24岁燃尽，司马懿70岁才出手"}, {"n": "宫本武藏", "why": "同样纯粹专注：霍去病把所有能量给了战场，武藏把所有能量给了剑道"}]},

{c:"权力与组织",n:"李世民",e:"唐·598-649",w:"纳谏",y:598,
d:"中国历史上被公认最善于纳谏的皇帝，贞观之治的缔造者。他的悖论：用最不道德的方式（玄武门之变，杀兄弟逼父退位）登上皇位，然后用最道德的方式（广开言路、轻徭薄赋）治理天下。他证明了一件事：权力的来源和权力的使用可以是完全不同的两件事。",
story:"魏征曾是太子建成的谋士，力主杀掉李世民。玄武门之变后，李世民不但没有杀魏征，反而任命他为重臣，专门负责挑皇帝的毛病。有一次李世民得到一只漂亮的鹞鹰，正在把玩，看见魏征来了，立刻把鸟藏在袖子里。魏征装作没看见，故意慢慢汇报，等魏征走了，鸟已经闷死在袖中。他宁可闷死爱鸟，也不愿让魏征看见自己贪玩。这就是纳谏：不只是听，是真的被改变。",
f:[{n:"以人为镜",d:"「以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失」——魏征死后，李世民说「朕亡一镜矣」。真正的纳谏不是表演民主，是把批评者当成自己最宝贵的认知工具。",eg:"魏征在世时，李世民多次被当众批评，有时气得牙痒痒，回宫说「总有一天要杀了这个乡巴佬」，但从来没有真的动手。因为他清楚：失去魏征，他就失去了那面镜子。"},{n:"用敌人的谋士",d:"魏征、尉迟敬德等人都曾是他的对手。李世民的用人逻辑：才华比忠诚历史更重要，能力比出身更重要。他用了玄武门之变后的所有敌方人才，建立了贞观之治最核心的班底。"},{n:"玄武门的代价",d:"「太宗此举，虽成功业，然骨肉相残，终为德累」——司马光评。他一生都带着玄武门的心理债，正因为如此，他必须在治国上做出更多补偿。有时候，背负道德包袱的人反而比干净的人更拼命证明自己。"},{n:"水能载舟",d:"「民者，国之根也。治国者，必先富民」——他比任何皇帝都清楚民心的力量，因为他亲眼见过隋朝如何在民怨中轰然倒塌。「水能载舟，亦能覆舟」不是说教，是他看过的真实历史。"},{n:"贞观长策",d:"减税、减役、减刑，「宁可府库空虚，不可百姓困苦」。他把文景之治的无为而治升级成了有为而治：主动减少对民间的侵扰，同时主动建立制度。贞观年间人口从200万户增长到380万户——这是最真实的治理成绩单。"}],
q:["以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。","水能载舟，亦能覆舟。","兼听则明，偏信则暗。","天下英雄，入吾彀中矣。"],
apply:"团队里有没有一个「魏征」——专门负责指出你的错误、不怕得罪你的人？如果没有，你正在失去最宝贵的认知工具。主动创造这个角色，哪怕你不喜欢听。",
l:["曾国藩","诸葛亮","刘邦","资治通鉴"],contrast:[{"n": "朱元璋", "why": "两种帝王用人哲学：李世民纳谏开创盛世，朱元璋杀尽功臣保障皇权——截然相反的治国逻辑"}, {"n": "曾国藩", "why": "「以人为镜」的两种实践：李世民靠魏征这面镜子，曾国藩靠日记这面镜子"}]},

{c:"学习与成长",n:"苏格拉底",e:"古希腊·前470-前399",w:"无知之知",y:-470,
d:"他没有留下任何文字，所有思想都通过对话流传下来。他是职业哲学家里最穷的那个，不收学费，整天在广场上问人问题。他被雅典判处死刑，罪名是「腐蚀青年」和「不敬神」——其实是因为他的问题让权贵太难堪。他可以逃跑，弟子们为他安排好了一切，他拒绝了，饮下毒芹。两千年来，他是人类史上死得最明白的人之一。",
story:"审判前，雅典给苏格拉底三个选择：停止哲学、流亡、或死亡。他选死亡。弟子克里托在狱中劝他越狱，已经打通了所有关节，连船都备好了。苏格拉底问：「如果一个城邦的法律本身是错的，公民可以随意违反吗？」克里托说不行。苏格拉底说：「那我的离开，就是在教人随意违反不喜欢的法律——这比任何罪行都更腐蚀雅典。」他选择以死亮剑，用生命提出了人类历史上最沉重的一个问题：什么是真正值得服从的权威？",
f:[{n:"无知之知",d:"「我唯一知道的，是我什么都不知道」——这不是谦虚，是认识论的起点。苏格拉底去问雅典最聪明的人，发现他们都以为自己懂，实际上不懂；苏格拉底不懂，但他知道自己不懂。这个「元认知」优势让他永远保持开放——不懂的人才会真正去问，已经「懂」的人只会自我印证。",eg:"查理芒格说「我没有权利拥有一个无法反驳的观点」——和苏格拉底两千年后说的是同一件事。"},{n:"苏格拉底式追问",d:"「你说的X是什么意思？为什么你认为X是对的？如果在Y情况下呢？」三个问题循环，直到对方自己发现逻辑矛盾。他不给答案，只给问题——因为他相信答案在对方自己心里，追问只是帮助对方把答案「生出来」（他称之为「助产术」）。最好的管理者、教练、父母都在用这套方法。"},{n:"审视过的人生",d:"「未经审视的人生不值得过」——这是他在法庭上说的最后一句话。你做的每一个选择，是你真正思考过的，还是随波逐流的？你的价值观，是你自己检验过的，还是别人告诉你的？不审视自己，你活的是别人的人生。",eg:"稻盛和夫的「六项精进」、达里奥的「极度自我审视」、曾国藩的「日记三省」，都是对这个追问的不同版本的回应。"},{n:"为原则付出代价",d:"苏格拉底有机会逃跑，弟子们安排好了一切。他拒绝，理由是：「如果我因为不喜欢判决就逃跑，我就在教人可以随意违反不喜欢的法律。」他用自己的死，坚持了原则。言行一致的代价，有时候是生命——苏格拉底用自己的结局，把「说到做到」这四个字定义到了极致。"},{n:"助产术",d:"「我是一个思想的助产士，帮助别人把自己内心的智慧生出来」——苏格拉底不告诉你答案，他帮你发现你其实已经知道的答案。这和王阳明「致良知」（答案已在心中，只是被私欲遮蔽）是两千年后的东西方回应。"}],
q:["我唯一知道的，是我什么都不知道。","未经审视的人生不值得过。","我不是雅典人，也不是希腊人，我是世界公民。"],
apply:"下次你「确定」某件事的时候，试试苏格拉底三问：这个判断的依据是什么？在什么情况下这个判断会失效？有没有你没有考虑到的角度？「确定」要么更坚实，要么露出了漏洞——两种结果都有价值。",
l:["王阳明","道德经","查理·芒格","达里奥"],contrast:[{"n": "王阳明", "why": "东西方哲学的神奇互文：苏格拉底「助产术」vs王阳明「致良知」——相隔两千年说同一件事"}, {"n": "马基雅维利", "why": "哲学的两极：苏格拉底为原则赴死，马基雅维利研究如何在权力里活下去"}]},

{c:"心智与情绪",n:"马可·奥勒留",e:"罗马·121-180",w:"克制",y:121,
