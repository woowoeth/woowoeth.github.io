apply:"有人给了你一个很难拒绝的提议、你隐约觉得哪里不对时，先别查证，先问一句：它满足了我此刻最缺的哪一样东西？答案越清楚，越该警惕。然后看日历：我是不是正处在一段转变期——刚搬家、刚换工作、刚失去一个人、手上刚多了一笔钱？如果是，给接下来三个月的大额决定预先加一道手续，找一个不在这段处境里的人过一遍。用反了：把它变成谁都不信，那是另一种失能；或者拿它去指责已经被骗的人——这套论点的核心恰恰是那不是智力问题。",
l:["影响力","乌合之众","曾国藩","稀缺"],
contrast:[{"n": "影响力", "why": "西奥迪尼讲的是六种手法怎么起作用，康妮科娃讲的是同一套手法为什么在某些时刻对某些人特别有效——一个看武器，一个看靶子"},
{"n": "曾国藩", "why": "曾国藩的广收慎用是在真事里看人，康妮科娃说的是当你正缺什么的时候，那套看人的功夫会先失灵"},
{"n": "稀缺", "why": "两者都把「他怎么这么蠢」换成了「他当时缺什么」：稀缺讲带宽被占，骗局讲渴望被用"}]},

{c:"世界如何运转",n:"格兰诺维特",e:"1973年·美国社会学杂志",w:"弱连接",y:1973,
d:"社会学家，1973年发表《弱连接的力量》，一篇被引用了几万次的论文。他调查282个人怎么找到工作，发现靠人际关系拿到工作的那批人里，56%说自己只是「偶尔」见到那位帮上忙的人，28%说「极少」——真正起作用的是关系不深的那些人。原因不在意愿，在信息结构：你和好友的圈子高度重叠，他知道的机会你多半也知道；而不常见面的人站在另一片网络里。他由此给出一句更硬的结论：没有一条强连接是桥。",
story:"那句「没有一条强连接是桥」不是修辞，是几何推导。如果你和A很亲近、和B也很亲近，那么A和B大概率也彼此认识——亲近的人会互相引见，圈子于是闭合。既然闭合了，你们三个知道的事就高度重叠，谁也不是通往外部的通道。而桥只能由那些不常来往的关系充当，因为只有它们两头连着不重叠的圈子。这条推论有个很实际的后果：换城市、离开一个行业时，最先消失的不是好朋友——那几个会留下——而是那一大片偶尔见面的人。失去的正是提供新机会的那一层，所以换地方之后的机会荒不是错觉，是结构性的，而且需要时间重建。",
f:[{n:"起作用的不是意愿，是信息的新旧",d:"至交更愿意帮你，但他能给的信息和你手上的高度重复——你们看同一批人、同一批消息。弱连接的价值不在于更热心，而在于他站的位置不同，手上有你接触不到的那部分。",eg:"同事群里的机会你早知道了；真正的新消息来自那个一年见一次的人。"},
{n:"圈子闭合是强连接的必然结果",d:"这不是社交策略问题，是几何：亲近意味着高频接触，高频接触让你的朋友们彼此认识。闭合本身很好——它带来支持和信任——但它同时意味着信息在里面循环，不再有新的进来。",eg:"抱团很紧的小团队内部消息灵通，对外面正在发生什么反而最迟钝。"},
{n:"判断一条关系是不是桥，看两头重不重叠",d:"判据很简单：如果这个人认识你身边大部分的人，他就不是桥；如果你俩的共同好友很少，他很可能是。桥的价值和你俩有多熟无关，只和两头的网络重叠度有关。",eg:"共同好友只有一两个的那位，比共同好友三十个的那位更可能带来新东西。"},
{n:"换环境时，弱连接是最先断的那一层",d:"搬去新城市、转行、离开一个平台，好友会留下，那一大片偶尔见面的人会断。而那正是机会来源的那一层，所以新环境里的机会荒是结构性的，靠努力弥补不了，只能靠时间重建。",eg:"到新城市半年没有任何机会找上门，不是你变差了，是那一层还没建起来。"}],
q:["我们靠亲近的人活着，靠不亲近的人改变处境。——对这项研究最常见的概括（中译）",
"亲近带来支持，不亲近带来消息——两者不能互相替代。",
"他没有说要少交朋友，他说的是别指望朋友带来新消息。"],
apply:"在找机会（工作、合作、客户）却只在最熟的几个人里打转时，数一个数：过去半年我主动联系过的人里，有多少是一年见不到几次的？几乎没有，说明机会来源被掐掉了一层。要补的不是深度是广度——让更多弱连接保持「还认识、还知道你在做什么」的状态，成本很低，但那条线必须在你不用它的时候就留着。刚换城市或转行的人尤其要算这笔账：断掉的正是这一层，重建需要时间，不是你变差了。用反了：去加一堆没有内容的联系人——弱连接起作用的前提是对方还记得你是谁；或者因此冷落至交，那是另一种损失。",
l:["凯文·凯利","纳瓦尔","主权个人","稀缺"],
contrast:[{"n": "凯文·凯利", "why": "两条相反又互补的路：凯利要一千个铁杆粉丝（强连接、深度），格兰诺维特说机会来自弱连接（广度）——一个用来养活自己，一个用来发现机会"},
{"n": "乌合之众", "why": "都在讲网络里的信息怎么流动：勒庞看的是同质人群里情绪如何传染，格兰诺维特看的是异质圈子之间信息如何跨越"},
{"n": "荀子", "why": "荀子说人靠分工才结得成群，格兰诺维特补了一句：结成群之后，群与群之间还得有桥"}]},

{c:"家庭与关系",n:"阿德勒",e:"1870-1937年·奥地利",w:"课题分离",y:1870,l:["弗兰克尔","爱比克泰德","尼采","非暴力沟通"],d:"个体心理学的创立者，弗洛伊德早期的同事，后来因为根本分歧决裂。弗洛伊德说人被过去决定，阿德勒说人被目的牵引——同一段童年，有人拿它当伤疤，有人拿它当借口，有人拿它当燃料，差别不在经历本身，在这个人想用它达成什么。他还给出了人际关系里最锋利的一把刀：分清这件事的后果最终由谁承担，就知道它是谁的课题。",story:"阿德勒本人是这套理论最好的注脚。他幼年患佝偻病，四岁才会走路，五岁差点死于肺炎，一生身高不足一米六，还有一个各方面都优于他的哥哥。按弗洛伊德的路径，这该是一份创伤清单。阿德勒的解释相反：正是这些让他决定当医生、研究人如何超越自身的限制。他把这个机制叫「自卑与超越」——自卑不是病，是驱动力；病的是把自卑当成不行动的理由。",f:[{n:"课题分离",d:"判据只有一个：这件事的后果最终由谁承担，它就是谁的课题。孩子不写作业，成绩由孩子承担；同事的情绪由同事承担；父母的失望由父母承担。别人怎么看你，是别人的课题，你插不上手，也不必插手。",eg:"催孩子写作业催到两败俱伤，是把孩子的课题揽成了自己的。你能做的是让他知道后果、并在他求助时可用，仅此而已。"},{n:"目的论：不是因为，是为了",d:"阿德勒把「因为过去所以现在」翻成「为了某个目的所以现在」。一个人说因为童年阴影所以不敢社交，阿德勒会问：不社交让你避开了什么？答案往往是「避开被拒绝」。原因改不了，目的可以换。",eg:"「我因为太忙所以没写方案」——换个问法：不写方案帮你避开了什么？多半是避开被评判。这一问，卡点就从时间挪到了恐惧。"},{n:"自卑是燃料不是病",d:"阿德勒认为追求优越是人的常态，自卑感人人都有。区别在于：健康的人用它推动自己改善处境，形成「自卑情结」的人用它论证自己无法改善——「因为我不行，所以不必试」。同一份自卑，一个当油门，一个当刹车。",eg:"「我学历不如他们」如果推着你去补短板，是燃料；如果成了你不投简历的理由，就是情结。"},{n:"共同体感觉",d:"阿德勒给心理健康下的定义不是自我实现，是「我对别人有用」这个实感。所以他治疗抑郁的方向常常是向外的：不是想办法喜欢自己，是找一件能帮到别人的具体事。价值感是从贡献里长出来的，不是从自我肯定里。",eg:"反复自我肯定却越练越空，不如去做一件对具体的人有用的小事——后者产生的价值感更结实。"}],q:["==重要的不是过去发生了什么，而是你如何解释它。==","==一切烦恼都是人际关系的烦恼。==","==决定我们自身的不是过去的经历，而是我们赋予经历的意义。=="],apply:"遇到人际的难受时，先做课题分离：这件事的后果最终谁承担？不是我的课题，就交回去；是我的课题，别人的看法就不构成理由。再换目的论问一遍：我保持现状，避开了什么？",contrast:[{n:"弗兰克尔",why:"两人都从维也纳出来、都反对「过去决定论」：阿德勒说人被目的牵引，弗兰克尔说人在任何处境下保有选择态度的自由"},{n:"爱比克泰德",why:"隔两千年的同一刀：爱比克泰德分「可控与不可控」，阿德勒分「我的课题与你的课题」——都是把注意力从管不着的地方收回来"}]},
{c:"识人与相处",n:"非暴力沟通",e:"1999年·马歇尔·卢森堡",w:"先说观察",y:1999,l:["阿德勒","鬼谷子","苏格拉底","影响力"],d:"卢森堡是临床心理学家，一生在种族冲突、离婚调解、监狱和战区做沟通调停。他发现绝大多数争吵的引爆点不是分歧本身，而是把评论说成了观察——「你从来不管孩子」听着像陈述事实，其实是判决。他给出一个四步结构：观察、感受、需要、请求。这套东西看着简单，难在第一步就几乎没人做得到。",story:"卢森堡讲过一次在难民营的演讲。一个人站起来朝他喊「杀人犯」——因为卢森堡是美国人，而美军的炸弹刚炸死他的孩子。卢森堡没有辩解，他问：你是不是因为失去了孩子，愤怒到极点，希望有人明白这件事有多不公平？对方愣住，接着讲了一个小时。演讲结束时，那个人邀请卢森堡去他家吃饭。卢森堡说他什么都没做，只是把对方话里的需要说了出来。",f:[{n:"观察和评论必须分开",d:"「你这周迟到了三次」是观察，「你总是迟到」是评论。前者对方无法反驳，后者对方必须反驳。绝大多数对话在第一句就输了，因为说话的人以为自己在陈述事实，听的人收到的是指控。",eg:"把「你根本不在乎这个项目」换成「这周三次会你都没来」。同一件事，一句引发防御，一句引发解释。"},{n:"感受不是想法",d:"「我觉得你不尊重我」不是感受，是包着感受的评判——真正的感受是「我很难过」。区别在于：感受说的是我，评判说的是你。一旦句子的主语从我滑到你，对方就只能进入防守。",eg:"「我感觉被忽视了」里的「被忽视」是对别人行为的判断；「我有点失落」才是自己的状态，对方没法否认。"},{n:"需要藏在指责后面",d:"卢森堡的核心断言：所有指责都是需要没被满足的笨拙表达。「你怎么这么自私」底下往往是「我需要被看见」。听指责时如果只接收字面，就永远在吵表层；把需要翻出来，冲突常常当场泄气。",eg:"伴侣说「你眼里只有工作」，字面是控诉，需要是陪伴。回应需要而不是反驳控诉，对话方向立刻变了。"},{n:"请求要具体到可执行",d:"「你能不能尊重我一点」不是请求，因为对方不知道该做什么。「下次开会前你能不能先跟我说一声」才是。模糊的请求注定落空，落空之后双方都更确信「说了也没用」。",eg:"把「多关心一下家里」换成「每周三你能不能负责接孩子」。前者是抱怨，后者是可以答应或拒绝的事。"}],q:["==不带评论的观察是人类智力的最高形式。==","==所有的指责、攻击、批判，都是需要没有被满足的悲剧性表达。==","==当我们把注意力放在彼此的需要上，冲突往往自行化解。=="],apply:"吵起来之前，先把要说的话过一遍四步：我看到的具体事实是什么（不带「总是」「从来」）？我的感受是什么（主语是我）？我真正需要的是什么？我具体请求对方做什么？四步都填得出来再开口。",contrast:[{n:"鬼谷子",why:"两套完全相反的说服术：鬼谷子研究怎么摸清对方底牌再下手，卢森堡研究怎么把双方的需要都摊到桌面上"},{n:"苏格拉底",why:"两种让对方自己说出答案的技术：苏格拉底靠追问，卢森堡靠说出对方的需要"}]},
{c:"心智与情绪",n:"塞涅卡",e:"前4-65年·罗马",w:"先算时间",y:-4,l:["马可·奥勒留","爱比克泰德","苏轼","弗兰克尔"],d:"尼禄的老师、罗马最富有的人之一，也是斯多噶派留下书信最多的人。他的特别之处在于：他不是在书斋里谈节制，他一边在权力核心里周旋一边写这些东西，最后被自己教过的学生赐死。他谈愤怒、谈时间、谈死亡，都带着一种被生活反复验证过的具体，而不是道德劝诫。",story:"塞涅卡在《论生命之短暂》里算了一笔账：人们吝惜财产，一枚钱币都要计较，唯独对时间挥霍无度——而时间是唯一失去后无法赎回的东西。他描述那些「忙碌者」：为别人的事奔波一生，临死才发现从没为自己活过。他的结论刻薄：不是我们拥有的时间太短，是我们浪费的太多；人生足够长，只要你懂得使用它。",f:[{n:"愤怒是一个可以拆解的过程",d:"塞涅卡在《论愤怒》里说愤怒不是瞬间爆发，而是三步：先接收到一个印象（他侮辱了我），再同意这个判断（这确实是侮辱），最后决定报复。第二步是唯一的闸门——印象拦不住，判断可以不给。",eg:"被顶撞时先别急着定性「他在挑衅」。把第二步停三秒，很多所谓侮辱只是对方笨拙。"},{n:"先预演最坏，恐惧就缩水",d:"斯多噶的「预想不幸」不是悲观，是提前把最坏结果具体化：破产会怎样、被解雇会怎样。塞涅卡说恐惧的强度多半来自模糊，一旦你把它想到底，会发现自己扛得住，而且不必等它发生才开始准备。",eg:"怕丢工作，就把「丢了之后三个月怎么过」写清楚。写完之后，那份怕会小很多，而且你已经有了预案。"},{n:"时间是唯一不能追回的成本",d:"钱丢了能再赚，时间不能。但人们对时间的态度恰好相反：会为几十块钱货比三家，却轻易答应一场毫无意义的应酬。塞涅卡要求把时间当成最稀缺的资产来算账——谁在花你的时间，花得值不值。",eg:"评估一件事时，把「要花多少钱」换成「要花我多少小时，这些小时我本来会用来做什么」。多数应酬当场就否了。"},{n:"不必等准备好才开始活",d:"塞涅卡最刺人的观察是：人们总把生活推到将来——等升了职、等孩子大了、等退休。而将来是最不确定的东西。他说这类人不是活得短，是把一生都用在了准备上。",eg:"「等这个项目结束就……」如果这句话你说了三年，它要的不是更好的时机，是现在开始的一小步。"}],q:["==我们并不是拥有的时间太短，而是浪费的太多。==","==人生如果懂得利用，它就是漫长的。==","==你活着，仿佛注定要永远活下去。=="],apply:"愤怒上来时，找到「同意」那一步，先不给判断。做重要决定时，先把最坏的结果具体写出来。评估任何一件事，先算它要花掉你多少小时。",contrast:[{n:"马可·奥勒留",why:"同为斯多噶，位置相反：奥勒留是皇帝写给自己的私人笔记，塞涅卡是权臣写给别人的公开书信，一个更内省，一个更实用"},{n:"苏轼",why:"东西方两种逆境写作：塞涅卡在权力中心写节制，苏轼在贬谪路上写豁达——都是先被生活验证过才写下来的"}]},
{c:"识人与相处",n:"克里斯·沃斯",e:"2016年·FBI首席谈判专家",w:"先标情绪",y:2016,l:["托马斯·谢林","鬼谷子","非暴力沟通","影响力"],d:"FBI前首席国际人质谈判专家，处理过绑架、劫持、恐怖袭击。他的方法和商学院教的谈判术几乎相反：不谈利益交换，先处理情绪。他的核心发现是，人在情绪没被承认之前根本听不进条件——所以第一步不是报价，是把对方的情绪准确说出来，让对方觉得「这人懂我在想什么」。",story:"沃斯讲过一次银行劫案的对峙。劫匪不接电话、不谈条件。沃斯没有喊话谈判，他用一种刻意放慢的低沉声音，隔着门说：看起来你不想出来。看起来你担心一出来我们就会开枪。对方沉默很久，然后开口了。沃斯说，他没有提出任何条件，只是把对方脑子里最响的那句话替他说了出来——人一旦被准确地说中，就很难继续把你当敌人。",f:[{n:"标注情绪，别评判情绪",d:"「看起来你有点为难」这种句式，沃斯叫标注（labeling）。要点是用「看起来 / 听起来」开头，不用「我觉得你」——前者是观察，可以被否认，后者是断言，会引发防御。标注对了，对方会补充；标注错了，对方会纠正——两种都推进对话。",eg:"客户沉默时说「听起来这个方案有让你顾虑的地方」，比问「您觉得怎么样」有效得多，因为它给了对方一个台阶开口。"},{n:"追求「说得对」而不是「说好」",d:"沃斯认为 yes 是最廉价的词——人们为了脱身会随口答应。真正有价值的是「说得对」（That's right），它意味着对方觉得你完整理解了他的立场。得到这三个字之后，谈判才真正开始。",eg:"对方说「行行行」多半是想结束对话；对方说「对，就是这样」才说明你说到了点上。前者要警惕，后者可以往下推。"},{n:"校准提问：把难题交回去",d:"用「怎么做」和「是什么」开头的开放问题，替代要对方点头的封闭问题。「我该怎么做才能做到这一点？」这句话把压力挪回对方那边，且不带对抗——对方要么给出办法，要么自己意识到要求不合理。",eg:"对方压价到成本以下，不必争辩，问「按这个价格，你希望我怎么保证质量」。多数时候对方会自己往回退。"},{n:"没有交易好过坏交易",d:"沃斯说谈判里最强的位置是随时可以走开。人质谈判没有这个选项，所以他更清楚有这个选项有多值钱。愿意接受「谈不成」的人，才不会被时间压力和沉没成本推着签下伤人的条款。",eg:"进任何谈判前先写下自己的替代方案（谈崩了我怎么办）。写得越具体，桌上越不慌。"}],q:["==谈判不是一场辩论，而是一个发现的过程。==","==「说得对」比「是」有价值得多。==","==把对方的情绪说出来，是消解它最快的办法。=="],apply:"对话卡住时，别加码论证，先标注对方的情绪：看起来你在担心什么。目标不是让对方说「好」，是让对方说「对，就是这样」。被逼到墙角时，用「我该怎么做」把问题交回去。",contrast:[{n:"非暴力沟通",why:"两套都从情绪入手，目的不同：卢森堡为了让双方的需要都被看见，沃斯为了在对抗局面里拿到结果"},{n:"托马斯·谢林",why:"谈判的两面：谢林研究结构性的承诺与威胁，沃斯研究桌面上的语言和情绪——一个改变博弈的收益矩阵，一个改变对手的心理状态"}]}
,
{c:"家庭与关系",n:"约翰·戈特曼",e:"1994年·华盛顿大学",w:"四种致命信号",y:1994,l:["非暴力沟通","阿德勒","影响力","克里斯·沃斯"],d:"心理学家，在实验室里录下几千对夫妻的对话，逐帧标记表情、语气、心率，然后追踪他们几年后是否离婚。他的结论不靠理论：只看一段十五分钟的争吵，他判断这对夫妻会不会分开，准确率超过九成。真正预测破裂的不是吵得凶不凶，是吵的时候有没有出现四种特定的信号。（注意：那个「九成」是模型在自己拟合过的那批数据上的回头准确率，不是对新样本的预测——戈特曼与列文森 2002 年的论文自己写明分析是事后的、结论只能当探索性的。四骑士这类行为编码可以逐帧复核，那个预测数字不要照搬。）",story:"戈特曼把预测离婚的四种沟通模式称为「末日四骑士」：批评（攻击对方是什么人，而不是这件事）、鄙视（讽刺、翻白眼、居高临下——他说这是最强的单一预测因子）、防御（把责任推回去）、冷战（把人晾在那儿）。他同时发现健康的关系也吵架，区别在于吵的过程中会出现「修复尝试」——一句玩笑、一个台阶、一次让步。会不会修复，比会不会吵，重要得多。",f:[{n:"鄙视是最毒的一种",d:"四骑士里鄙视杀伤力最大：翻白眼、嘲讽、模仿对方语气，本质是「我比你高一等」。戈特曼的数据里，鄙视出现频率是离婚最强的单一预测因子，而且它还会影响接收方的免疫系统。这是必须完全戒掉的一种，不是少用。",eg:"「你懂什么」「行行行你最厉害」这类话不是情绪发泄，是关系里的慢性毒药，说出口就要当场纠正。"},{n:"批评和抱怨不是一回事",d:"抱怨针对行为——「你今天没洗碗，我很累」；批评针对人格——「你就是个懒人」。前者可以解决，后者只能防御。戈特曼说很多人以为自己在提意见，其实每一句都在给对方定性。",eg:"把「你从来不管孩子」换成「这周三次接孩子都是我去的」。同一件事，后者对方能接。"},{n:"修复尝试比不吵架重要",d:"健康关系不是没有冲突，是冲突升级到一半有人能踩刹车——开个玩笑、说一句「等等，我们跑题了」。戈特曼发现幸福的夫妻修复尝试的成功率高，不是因为技巧好，是因为对方愿意接。愿不愿意接，取决于平时的账户余额。",eg:"吵到一半有人说「我们是不是有点过了」，另一方顺着台阶下，这一次冲突就止损了。硬要赢的那一方，赢的是这一局输的是关系。"},{n:"五比一：平时的存款决定吵架时的额度",d:"戈特曼的量化发现：稳定关系里，正面互动与负面互动的比例约为 5:1。这意味着修复能力不是吵架时的技巧，是平时积累的余额——平时存得够多，一次冲突才透支得起。",eg:"指望在冲突当下讲道理化解，多半失败；真正起作用的是过去几周里那些不起眼的回应和在场。"}],q:["==预测离婚最强的单一信号是鄙视。==","==幸福的伴侣不是不吵架，而是吵架时懂得修复。==","==稳定关系里，正面互动与负面互动的比例大约是五比一。=="],apply:"冲突里先自查四骑士：我这句是在说事还是在给人定性？有没有讽刺和翻白眼？对方递台阶时我接不接？平时的正面互动够不够撑起这次透支？",contrast:[{n:"非暴力沟通",why:"两条路径同一个方向：卢森堡教怎么说，戈特曼用数据告诉你不这么说的后果是什么"},{n:"阿德勒",why:"阿德勒从课题归属处理关系，戈特曼从互动模式处理关系——一个改认知，一个改行为"}]},
{c:"家庭与关系",n:"关键对话",e:"2002年·帕特森等",w:"先造安全感",y:2002,l:["非暴力沟通","克里斯·沃斯","约翰·戈特曼","鬼谷子"],d:"四位作者研究了两万多人、上千个组织，想弄清一件事：为什么有些人在高风险、有分歧、情绪激烈的对话里能谈成，多数人却不能。他们的结论是，人在感到不安全的瞬间会退回沉默或暴力两种本能，而对话一旦进入这两种状态，内容说得再对也没用。所以关键不是准备论点，是先把安全感建起来。",story:"书里反复出现一个判断：对话失败的时刻，往往不是分歧最大的时刻，而是有一方觉得「我在这里不安全」的时刻。他们观察到人一旦感到不安全，只有两条路——沉默（回避、掩饰、退出）或暴力（贴标签、控制、攻击）。而绝大多数人在这时的反应是继续讲道理，越讲对方越退。正确的做法反而是暂停内容，先修复安全感，再回到内容。",f:[{n:"先看状态，再看内容",d:"对话中要同时盯两件事：说的内容，和对方的状态。一旦发现对方转向沉默或攻击，立刻停下内容——因为此刻说什么都无效。修复安全感优先级永远高于把话说完。",eg:"对方开始「嗯嗯」「随便你」，别当成同意，那是沉默型退出。这时该问的不是「所以你同意吗」，是「我是不是哪句话说重了」。"},{n:"从心出发：先问自己真正要什么",d:"情绪上来时人的目标会偷偷改变——从「解决问题」变成「赢」「不丢脸」「惩罚对方」。作者的方法是当场自问：我真正想要的结果是什么？我希望这段关系变成什么样？这一问能把目标拉回来。",eg:"争到一半发现自己在乎的是「不能让他觉得我错了」——目标已经跑偏。承认这一点，对话才回得来。"},{n:"对比说明：先说不是什么",d:"对方误解你意图时，最有效的修复句式是先否定误解，再重申真意：「我不是想说你能力有问题，我是想说这个排期我们都低估了。」先拆掉威胁，再放内容，对方才听得进后半句。",eg:"提意见前加一句「我说这个不是要追责」，能挡掉一大半防御。"},{n:"共享事实池",d:"分歧往往不是结论不同，是各自握着对方不知道的信息。作者主张先把双方的事实和推理都摊到桌面上，再讨论结论——多数争执在摊事实的过程中就自动消解了。",eg:"两个部门吵优先级，各自说出自己看到的数据和被承诺过的事，常常发现吵的是两件不同的事。"}],q:["==对话失败的时刻，是有人感到不安全的时刻。==","==人一旦感到不安全，就会退回沉默或暴力。==","==先解决安全感，再解决问题。=="],apply:"对话变僵时，别加大论证力度，先判断对方是沉默还是攻击，然后停下内容修复安全感。开口前自问一次：我真正想要的结果是什么。被误解时用「我不是……我是……」把威胁拆掉。",contrast:[{n:"克里斯·沃斯",why:"都主张先处理情绪再谈内容：沃斯在对抗局面里标注对方情绪，《关键对话》在日常分歧里重建安全感"},{n:"鬼谷子",why:"两千年前后的两套对话术：鬼谷子研究怎么试探出对方的真实意图，《关键对话》研究怎么让双方都敢说真话"}]}
,
{c:"学习与成长",n:"费曼",e:"1918-1988年·美国",w:"不骗自己",y:1918,l:["爱因斯坦","苏格拉底","查理·芒格","卡尔·波普尔"],d:"诺贝尔物理奖得主，参与过曼哈顿计划，调查过挑战者号事故。他留给非物理学家的东西比留给物理学家的更多——一套关于「怎么知道自己是不是真懂」的判据。他的标准苛刻到近乎冒犯：如果你不能把一个概念讲到大一新生听懂，说明你自己没懂。他也把这条用在整个科学界身上：科学的第一原则是不要骗自己，而你恰恰是最好骗的那个人。",story:"挑战者号失事后，费曼在调查委员会上做了一件事：他要来一杯冰水，把 O 型密封圈的样品夹住浸进去，几秒后取出，当着摄像机捏了捏——橡胶失去了弹性。NASA 的报告用几百页论证发射决策的合理性，费曼用一杯冰水说明了低温下密封圈会失效。他在附录里写下那句著名的结论：对于一项成功的技术，现实必须优先于公关，因为自然不可欺骗。",f:[{n:"讲不明白就是没懂",d:"费曼的自检法：把一个概念讲给完全外行听，卡住的地方就是你自己没通的地方。这条之所以有效，是因为专业术语可以掩盖理解的空洞——一旦不许用术语，空洞立刻现形。",eg:"给同事讲你负责的模块，每次都要绕回专业名词才能继续，那几处就是你真正没想清楚的地方。"},{n:"最容易骗的人是自己",d:"他说科学的第一原则是不要骗自己，而自己是最好骗的那个。因为动机在这一侧：我们希望自己的方案对、希望投入没白费。所以诚实不是道德要求，是方法要求——不主动找反例，就会自动只看见支持的证据。",eg:"复盘时先列「有哪些迹象说明我错了」，再列支持的证据。顺序反过来，后一栏会自动写得更长。"},{n:"现实优先于公关",d:"挑战者号的教训不是技术问题，是组织宁愿相信一份好看的论证。费曼的句子是给所有组织的：当报告和物理事实冲突，改的只能是报告。这条在任何有汇报关系的地方都成立。",eg:"数据不好看时，先问「要改的是结论还是措辞」。改措辞能过这一关，下一关还在。"},{n:"从头搞懂一次，胜过记住十次",d:"费曼学习的方式是把结论丢开、自己重新推一遍，卡住就回去补。慢，但推完的东西不会忘，也能迁移到别的问题上。记住的答案只对原题有效，推出来的过程对整类问题有效。",eg:"与其背下公式的适用条件，不如自己推一次它是怎么来的——推过之后条件是自明的。"}],q:["==第一原则是不要欺骗自己，而你自己是最容易被骗的人。==","==对于一项成功的技术，现实必须优先于公关，因为自然不可欺骗。==","==如果你不能用简单的方式解释它，说明你还没有真正理解它。=="],apply:"想确认自己是不是真懂：讲给外行听，卡住的地方就是没懂的地方。做判断前先找反例，因为你最想骗的人是你自己。报告与事实冲突时，改的只能是报告。",contrast:[{n:"爱因斯坦",why:"两位物理学家的方法差异：爱因斯坦擅长把问题重新表述，费曼擅长把答案重新推导"},{n:"苏格拉底",why:"都靠追问逼出无知：苏格拉底问别人，费曼问自己"}]},
{c:"家庭与关系",n:"卡尔·罗杰斯",e:"1902-1987年·美国",w:"先被接住",y:1902,l:["非暴力沟通","阿德勒","苏格拉底","弗兰克尔"],d:"人本主义心理学的创立者，第一个把心理治疗过程全程录音、拿出来做研究的人——在此之前治疗室里发生什么全凭治疗师转述。他的核心主张与当时主流相反：治疗师不该是解读者和指导者，而应提供三个条件——真诚、无条件积极关注、共情性理解——人在这三样齐备的环境里会自己往好的方向长。",story:"罗杰斯做了一件在当时近乎冒犯的事：他把治疗全程录下来，逐字整理，公开发表。同行认为这破坏了治疗的神秘性，他认为不公开就无从检验。这批录音后来成了心理治疗实证研究的起点。他从中得出一个反直觉的结论：来访者的改变程度，与治疗师用了什么流派几乎无关，与治疗师是否真诚、是否不带条件地接纳、是否真的听懂了，高度相关。方法不如态度重要。",f:[{n:"无条件不是无原则",d:"无条件积极关注指的是「不因为你说了什么而收回接纳」，不是「你做什么都对」。区别在于：接纳的是人，评价的仍是行为。这一条做到了，对方才敢说真话——因为说真话不会被撤回关系。",eg:"孩子承认闯了祸，先接住「你愿意说出来」，再谈这件事怎么处理。顺序反了，下次他就不说了。"},{n:"共情是复述到对方点头",d:"罗杰斯的共情不是「我理解你的感受」这句话，是把对方的意思用自己的话说回去，说到对方确认为止。它的作用不只是让对方感到被懂——很多时候对方是在听你复述的过程中，才第一次听清自己在说什么。",eg:"朋友倾诉时别急着给建议，先说「你的意思是不是……」。他纠正你两次之后，事情往往自己清楚了。"},{n:"真诚优先于技术",d:"三条件里他最看重真诚——治疗师不能演。装出来的接纳会被感知到，而且比直接的不接纳更伤，因为它同时传递了「你不值得我说真话」。这条对所有关系成立：技巧能提高效率，装出来的技巧会摧毁信任。",eg:"用共情句式却心里不耐烦，对方一定听得出来。这时更诚实的做法是说「我现在状态不好，晚点聊」。"},{n:"人不需要被推，需要被松开",d:"罗杰斯的基本信念是人有自我实现的倾向，卡住通常不是因为缺动力，是因为环境里有条件——「你要这样才值得被爱」。把条件撤掉，方向自己会出现。这决定了帮助的姿态是撤除障碍，不是设定目标。",eg:"下属没状态时，先问「有什么在拦着你」，而不是「你的目标是什么」。多数时候拦着的是怕做错被否。"}],q:["==当我接纳自己本来的样子时，我才能改变。==","==一个人如果被真诚地倾听和理解，他就能用新的眼光看待自己。==","==好奇怪的悖论：当我接受自己原本的样子，我就能改变了。=="],apply:"想让一个人说真话：先让他确认说了不会被撤回关系。想让他想清楚：把他的话复述回去，说到他点头。做不到真诚时，宁可说自己状态不好，也别演。",contrast:[{n:"非暴力沟通",why:"卢森堡把罗杰斯的临床态度拆成了普通人能操作的四步"},{n:"苏格拉底",why:"两种让人自己找到答案的方式：苏格拉底靠追问施压，罗杰斯靠接纳松绑"}]},
{c:"家庭与关系",n:"依恋理论",e:"1950-1970年代·鲍尔比与艾恩斯沃斯",w:"早期模板",y:1969,l:["阿德勒","卡尔·罗杰斯","约翰·戈特曼","弗兰克尔"],d:"鲍尔比研究战后孤儿院的孩子，提出人对亲近关系的需求是本能而非依赖；他的合作者艾恩斯沃斯设计了「陌生情境」实验，把一岁婴儿与照料者短暂分离再重聚，从重聚那一刻的反应里，识别出几种稳定的依恋模式。这套模式会成为一个人此后处理亲密关系的默认模板——不是决定论，但确实是出厂设置。",story:"艾恩斯沃斯的实验设计精巧在于：真正的信息不在分离时，而在重聚时。安全型的孩子会哭，但母亲回来后很快被安抚，然后继续去玩；回避型的孩子看起来不在意母亲离开，也不去迎接——但心率监测显示他们的压力水平和哭的孩子一样高，只是学会了不表达；矛盾型的孩子则又要抱又推开，久久平复不了。她由此提出「安全基地」：人只有在确信身后有个能回去的地方时，才敢往外探索。",f:[{n:"看重聚，不看分离",d:"实验最反直觉的一点：不哭的孩子不等于不焦虑。回避型的生理指标和哭闹的孩子一样高，他们只是学会了不表达——因为表达过而没被回应。所以判断一个人在关系里的状态，看他遇到问题时求不求助，比看他表现得慌不慌准。",eg:"团队里从不提困难的人不一定没困难，可能是提过没用。要看的是他上一次求助的下场。"},{n:"安全基地：有退路才敢往前",d:"鲍尔比的核心发现是探索行为依赖于安全感——孩子只有确信母亲还在，才会跑远去玩。成年后同理：知道搞砸了不会失去关系的人，敢冒更大的险。所谓支持，不是替他做事，是让他知道退回来这里还在。",eg:"想让人敢做决定，先明确「做错了我们一起收拾」。这句话的作用比任何激励都大。"},{n:"是模板，不是判决",d:"依恋模式稳定但可变——后来的稳定关系、治疗、甚至一段长期友谊都能改写它。把它当解释很有用（原来我一紧张就想推开人），当借口就有害（我就是回避型没办法）。它解释起点，不决定终点。",eg:"意识到自己冲突时习惯冷战，是进步；用「我依恋类型如此」拒绝改变，是把工具用成了盾牌。"},{n:"两个人的模式会互相咬合",d:"焦虑型追、回避型退，是最常见也最痛苦的组合：一方越靠近另一方越退，退又让前者更焦虑。看懂这个循环的价值在于，它把「你有问题」变成了「我们卡在一个循环里」——后者才有解。",eg:"吵架时一方追问一方沉默，这不是谁对谁错，是两种应对方式互相触发。先命名这个循环，才谈得下去。"}],q:["==只有在确信身后有安全基地时，人才敢向外探索。==","==不表达的孩子并非不焦虑，他们只是学会了不表达。==","==早期关系形成的内部工作模型，会成为此后所有亲密关系的模板。=="],apply:"判断一个人在关系里安不安全，看他遇到困难求不求助，不看他表现得慌不慌。想让人敢冒险，先给他一个退回来还在的地方。看懂追与退的循环，比追究谁的错有用。",contrast:[{n:"阿德勒",why:"两种解释人际困境的路径：阿德勒问「你想用它达成什么」，依恋理论问「你的模板是怎么形成的」"},{n:"约翰·戈特曼",why:"依恋理论解释模式从哪来，戈特曼测量模式在当下如何运作"}]},
{c:"身心与生活",n:"原子习惯",e:"2018年·詹姆斯·克利尔",w:"改系统不改目标",y:2018,l:["富兰克林","李小龙","艾利克森","曾国藩"],d:"克利尔高中时被棒球棒击中面部重伤，康复过程让他对「微小改进的累积」有了切身认识。这本书的主张是：人们高估了目标的作用，低估了系统的作用——因为赢家和输家的目标往往完全相同，区别在系统。他给出的操作层面比多数习惯书更细：从行为的四个环节（提示、渴求、反应、奖赏）分别下手，而不是靠意志力硬扛。",story:"英国自行车队一百年没赢过环法。新教练布雷斯福德的做法是把所有环节拆开，每一处改进百分之一：座椅调整、车手用的枕头带上路、洗手方式改成外科医生的标准以减少感冒。单看每一项都微不足道，五年内这支队伍拿下了环法冠军和多枚奥运金牌。克利尔用这个例子说明复利在行为上同样成立：每天进步百分之一，一年后是三十七倍。",f:[{n:"目标一样，系统不一样",d:"参赛的每支队都想赢冠军，目标不区分胜负。真正决定结果的是日常运转的方式。所以设定目标的边际收益很低，改造系统的边际收益很高——这也解释了为什么「今年一定要」很少奏效。",eg:"「今年读十二本书」和「把手机充电器放到客厅、床头放一本书」，后者才改变了结果。"},{n:"从身份下手，不从结果下手",d:"克利尔的核心转换：不说「我要戒烟」，说「我不是抽烟的人」。前者是和欲望对抗，后者是让行为符合自我认知。每一次小行动都是给某个身份投一票，票数够了，行为就不需要靠意志力维持。",eg:"想开始运动，先做「我是每天动一下的人」这个身份——哪怕只做五分钟，重要的是那一票。"},{n:"让好行为省力，让坏行为费力",d:"四环节里最容易操作的是环境。把想做的事的启动成本降到最低（运动服前一晚放床边），把不想做的事的启动成本抬高（手机放另一个房间）。这比培养毅力可靠得多，因为它不消耗意志力。",eg:"想少刷手机，删掉 app 比「控制自己」有效——重装要花两分钟，这两分钟就够了。"},{n:"别断第二次",d:"他给的一条实用规则：偶尔中断没关系，绝不连续中断两次。一次是意外，两次就开始变成新常态。这条把「破戒之后干脆放弃」的常见崩溃点堵住了。",eg:"今天没跑步，明天必须跑，哪怕只跑十分钟。保住的不是里程，是这件事还在进行中的状态。"}],q:["==你不会升到目标的高度，你会落到系统的水平。==","==每天进步百分之一，一年后你会强大三十七倍。==","==每一个行动都是对你想成为的那类人投的一票。=="],apply:"想改变结果，先改系统不改目标。从身份说起：我是什么样的人，而不是我要达成什么。把想做的事变省力、不想做的变费力。可以断一次，绝不连断两次。",contrast:[{n:"富兰克林",why:"两套自我改造法：富兰克林一周只练一条美德，克利尔把行为拆成四个环节分别下手"},{n:"曾国藩",why:"都靠日常小动作累积：曾国藩用日课自省，克利尔用环境设计——一个靠自律，一个靠省掉自律"}]},
{c:"学习与成长",n:"卡尔·波普尔",e:"1902-1994年·奥地利",w:"能被证伪",y:1902,l:["费曼","爱因斯坦","苏格拉底","思考，快与慢"],d:"科学哲学家。他要解决的问题是：占星术和物理学都能解释现象，凭什么说后者是科学？他的答案改变了整个科学观——区别不在能不能解释，而在能不能被推翻。一个理论如果任何观察都不能与之矛盾，那它不是强大，是空洞。这条判据同样适用于日常判断：一个说什么都对的说法，等于什么都没说。",story:"波普尔年轻时同时接触到爱因斯坦和当时流行的两种理论。后两者的信徒总能用理论解释任何案例——他们把这当作理论强大的证据。而爱因斯坦的广义相对论做了一个危险的预言：星光经过太阳会偏折特定角度，如果观测不符，理论就完了。1919 年日食观测验证了它。波普尔由此明白：区别不在解释力，在于愿不愿意事先说出「什么情况下我就错了」。",f:[{n:"能解释一切等于没有解释",d:"一个理论如果无论出现什么结果都能自圆其说，它就不含信息。判断的办法是问：什么样的观察会让你放弃它？答不上来，说明这个说法不能被检验，也就不能被信任。",eg:"「市场情绪推动了这次上涨」——那下跌时呢？也是市场情绪。这句话解释了一切，因此什么也没解释。"},{n:"事先说出证伪条件",d:"波普尔的标准动作是在验证之前公开「什么会推翻我」。这一步的价值在于它防止事后调整：人有极强的能力把任何结果读成支持自己的证据，唯一的解药是把判据提前钉死。",eg:"上线新功能前先写「如果两周后这个指标没动，就承认假设错了」。写在前面，才不会事后找补。"},{n:"证伪不等于放弃",d:"常见误读是「被证伪就该扔掉」。波普尔的意思是理论要经得起尝试推翻——大多数好理论是在一次次被逼到墙角又挺住之后才变强的。关键是你有没有真的去试着推翻它，而不是有没有被推翻。",eg:"对自己的核心判断，定期主动找最强的反面证据。找不到，这个判断才真的可靠。"},{n:"从确认转向反驳",d:"人的默认模式是找支持自己的例子，而支持的例子再多也不能证明结论。真正提供信息的是反例——一个就够。所以有效的求证方式是主动去找那个可能存在的反例，而不是收集第一百个正面案例。",eg:"验证「我们的客户都喜欢这个功能」，别去问已经在用的人，去问三个流失的。"}],q:["==一个理论如果不能被任何可想象的事件所反驳，那它就是非科学的。==","==不可证伪不是理论的优点，而是它的缺陷。==","==我们不能证明一个理论为真，只能暂时地让它经受住反驳。=="],apply:"听到一个说法，先问：什么情况下它会是错的？答不出来就别信。做判断前把证伪条件写下来，防止事后找补。想验证结论，去找反例而不是再找一个支持的例子。",contrast:[{n:"费曼",why:"同一件事的两个说法：波普尔给出逻辑判据，费曼给出心理警告——你最想骗的人是自己"},{n:"思考，快与慢",why:"波普尔说该怎么做，卡尼曼说人实际上会怎么偏离——一个是规范，一个是诊断"}]},
{c:"学习与成长",n:"艾利克森",e:"1993年·刻意练习研究",w:"练法比时长重要",y:1993,l:["李小龙","费曼","原子习惯","宫本武藏"],d:"心理学家，专门研究各领域顶尖高手是怎么练出来的。他最广为人知的研究被流行文化简化成了「一万小时定律」，而这恰恰是他反复澄清过的误读——决定水平的不是时长，是练法。重复做已经会的事，做十年也不会变强；只有持续在能力边缘、带着明确目标和即时反馈的练习，才产生进步。他把这种练法叫「刻意练习」。",story:"艾利克森研究柏林音乐学院的小提琴学生，把他们按水平分组，发现顶尖组累计练习时间确实更长。但更关键的差别在练习的内容：普通学生练习时反复演奏已经熟练的曲目，享受流畅感；顶尖学生把时间花在自己弹不好的那几个小节上，一遍遍卡在难处。他后来反复强调，时长只是相关，真正的因果在于是否持续处理自己做不到的部分。",f:[{n:"练已经会的等于休息",d:"重复熟练的动作让人愉快，也让人误以为在进步。真正产生进步的是停留在「刚好做不到」的区域——那里不舒服，效率看起来低，但只有那里在改变能力。舒适的练习是娱乐，不是训练。",eg:"练琴一小时全在弹熟悉的曲子，等于听了一小时自己的演奏。真正该练的是那三个总错的小节。"},{n:"必须有即时反馈",d:"没有反馈的重复不产生学习——你不知道哪里错了，就只是在巩固错误。这解释了为什么很多人开车三十年技术并无长进：全程没人告诉他哪一次转向不对。所以练习的设计里，反馈的优先级高于时长。",eg:"写作想进步，光写不够，要有人具体指出哪一段读不下去——或者隔一周自己回看，制造反馈。"},{n:"高手靠的是心理表征，不是记忆",d:"艾利克森发现专家的优势在于对该领域形成了精细的内部模型——棋手看到的不是棋子而是局面，医生看到的不是症状而是模式。这套模型只能通过在真实问题上反复试错建立，不能通过看和背获得。",eg:"看一百场比赛不如自己下十局并复盘。前者积累印象，后者才在建模型。"},{n:"一万小时是被误读的结论",d:"艾利克森本人多次澄清：不存在一个通用的时数门槛，不同领域差异巨大，而且不带反馈的低质量练习再多也无效。把它当成「熬够时间就行」的许可，正好错过了他研究的全部要点。",eg:"入行十年不等于十年经验，可能是一年经验重复了十次——区别在这十年里有没有持续处理做不到的事。"}],q:["==决定水平的不是练习时间的长短，而是练习的方式。==","==有目的的练习必须发生在舒适区之外。==","==没有反馈的练习，只是在巩固已有的错误。=="],apply:"检查自己的练习：我在练已经会的，还是刚好做不到的？有没有人或机制告诉我哪里错了？如果没有反馈，先去造一个反馈，再谈时长。",contrast:[{n:"李小龙",why:"都反对堆数量：李小龙练一万次同一脚是把一招练到极致，艾利克森说清了那一万次必须带反馈才有效"},{n:"宫本武藏",why:"两种精进观：武藏强调不可有偏爱的兵器，艾利克森强调必须待在做不到的边缘"}]},
{c:"家庭与关系",n:"蒙台梭利",e:"1907年·罗马儿童之家",w:"环境替代管教",y:1907,l:["卡尔·罗杰斯","依恋理论","阿德勒","荀子"],d:"意大利第一批女医生之一，从研究智力障碍儿童起步，后来把方法用在正常儿童身上，创办了罗马「儿童之家」。她的核心发现是：儿童不需要被塑造，需要一个被准备好的环境——把工具做成儿童尺寸、把选择权交给儿童、把成人从指挥者退成观察者，此前被认为无法专注的孩子会自发进入长时间的专注状态。",story:"蒙台梭利在贫民区的儿童之家做了一件当时看来荒谬的事：她把桌椅换成儿童尺寸、让孩子自己选择做什么、成人只在被需要时介入。结果被视为不可管教的三到六岁孩子开始自发地重复某项活动几十分钟，且完成后主动收拾。她把这种状态称为「常态化」，并得出那句成为整套方法基石的话：帮助我，让我自己做。",f:[{n:"先改环境，再谈行为",d:"孩子够不到的水杯、只能由大人操作的工具，本身就在制造依赖和挫败。蒙台梭利的做法是把环境改到孩子能独立完成，行为问题往往随之消失。这条对成人同样成立——很多所谓自律问题其实是环境问题。",eg:"孩子总打翻水杯，换一个他握得住的小壶，比说一百次「小心点」有用。"},{n:"帮助我，让我自己做",d:"这句话划出了帮助的边界：目标是让对方能独立完成，不是让事情快点完成。成人替孩子做完，效率高但剥夺了那次学习。所以正确的介入是把难度降到刚好够得着，而不是代劳。",eg:"孩子系鞋带慢得让人抓狂，你系上只省了两分钟，代价是他明天还不会。"},{n:"专注是长出来的，不是要求出来的",d:"她观察到孩子在自选的活动上能专注很久，而在被指定的任务上很快分心。所以培养专注的路径是提供有吸引力的选择并且不打断——最常见的破坏行为，恰恰是成人出于关心的随时打扰。",eg:"孩子正在投入地摆积木，别去表扬也别去纠正。表扬会中断他，也会把动力从事情转到你的反应上。"},{n:"敏感期：时机不对事倍功半",d:"她提出儿童在不同阶段对特定能力有天然的高吸收期——秩序、语言、细节、动作。踩在敏感期上，学习几乎不费力；错过了再补，要花几倍力气还未必自然。这提示教育的关键是识别时机而不是加大力度。",eg:"两岁孩子对秩序极其敏感，此时建立收拾的习惯很容易；等到七岁再立规矩，难度完全不同。"}],q:["==帮助我，让我自己做。==","==儿童的工作不是被教出来的，而是在准备好的环境中自然发生的。==","==教育不是老师讲了什么，而是儿童自己做了什么。=="],apply:"孩子做不到时，先看是不是环境不匹配，再谈要求。帮助的目标是让他能独立完成，不是让事情快点结束。他专注时别打断——包括别表扬。",contrast:[{n:"卡尔·罗杰斯",why:"同一个信念的两个领域：人有自我发展的倾向，需要的是撤除障碍而非推动"},{n:"荀子",why:"两种人性起点：荀子主张用制度矫正，蒙台梭利主张用环境释放"}]},
{c:"身心与生活",n:"约翰·瑞迪",e:"2008年·哈佛医学院",w:"先动再想",y:2008,l:["原子习惯","富兰克林","塞涅卡","弗兰克尔"],d:"哈佛医学院精神科教授。他把运动重新定义了一遍：运动的首要收益不是身材，是大脑。运动会促使大脑分泌一类支持神经元生长与连接的蛋白，他称之为「大脑的肥料」，直接影响学习效率、情绪调节和抗压能力。他的主张是，把运动当成健身房里的事，等于把最便宜的认知与情绪药物放着不用。",story:"芝加哥郊区的内珀维尔中学做了一个实验：把体育课挪到第一节，并且不比谁跑得快，只要求学生保持在自己的高心率区间。结果是这批学生在国际数学与科学测评中的成绩远超同龄群体。瑞迪用这个案例说明运动与认知的关系不是玄学：运动后的一段时间里，大脑处于更容易建立新连接的状态，把最难的学习任务放在那个窗口里最划算。",f:[{n:"运动是给大脑用的，不只给身体",d:"瑞迪的重构很关键：如果目标是身材，动力靠意志；如果知道它直接改善注意力、情绪和抗压，动机就变成了当天可感的收益。而后者是真的——效果在运动后几小时内就能体感到。",eg:"下午注意力散了，与其硬撑或喝咖啡，二十分钟快走的恢复效果通常更好且不欠债。"},{n:"焦虑时动比想有用",d:"焦虑的生理成分很重，而运动直接作用于那套系统——它消耗掉待命的应激激素，并给大脑一个「已经跑掉了」的信号。这解释了为什么想不通的事，走一圈之后常常没那么可怕。",eg:"心里堵得慌又反复琢磨，先出门走二十分钟。回来再想同一件事，分量会不同。"},{n:"强度比时长重要",d:"内珀维尔的做法是让每个人保持在自己的高心率区间，而不是比谁跑得快。这一点对普通人是好消息：不需要长时间训练，需要的是心率真的上去过——十几分钟的有效强度胜过一小时的散步式消耗。",eg:"没时间时做十五分钟能让你喘起来的运动，效果好过一小时慢悠悠的健身房打卡。"},{n:"放在需要脑力的事之前",d:"既然运动后的窗口期大脑更容易建立新连接，安排上就该把最难的学习或思考放在运动之后，而不是运动之前。内珀维尔把体育课挪到第一节正是这个逻辑。",eg:"要啃一份难读的材料，先动二十分钟再坐下来，比直接硬啃省时间。"}],q:["==运动不只是塑造身体，它塑造大脑。==","==身体活动带来的神经生长因子，是大脑的肥料。==","==把最难的学习任务安排在运动之后。=="],apply:"注意力散了或焦虑上来，先动二十分钟再回来处理。强度比时长重要——要让心率真的上去。把最难的脑力活安排在运动之后的窗口里。",contrast:[{n:"原子习惯",why:"一个说明为什么值得动，一个说明怎么让自己真的动起来"},{n:"塞涅卡",why:"两种处理焦虑的路径：塞涅卡从判断入手拆解，瑞迪从生理入手消耗"}]},
{c:"身心与生活",n:"卡尔·纽波特",e:"2016年·乔治城大学",w:"专注是稀缺品",y:2016,l:["原子习惯","艾利克森","约翰·瑞迪","富兰克林"],d:"计算机科学教授，同时研究知识工作者的生产方式。他提出一组对立概念：深度工作是在无干扰状态下的专注思考，能创造新价值、难以复制；浮浅工作是琐碎的事务性动作，容易复制、不产生新能力。他的论断是，随着协作工具让人随时可被打断，深度工作正在变得稀有，而恰恰因为稀有，它成了少数还能拉开差距的能力。",story:"纽波特举了一个反例来说明代价：一位管理者要求团队随时在线响应，团队看起来高效——消息秒回、会议不断——但一年下来没有产出任何需要长时间思考才能做出的东西。纽波特的观察是，注意力被切碎之后不会自动复原：每一次切换都留下「注意力残留」，人以为自己回到了原来的任务上，实际上有一部分还挂在上一件事上。所以真正的成本不是被打断的那五分钟，是之后半小时的低效。",f:[{n:"注意力残留：代价不在被打断的那几分钟",d:"切换任务后，一部分注意力仍留在上一件事上，需要时间才能完全转移。这意味着「就看一眼消息」的真实成本远高于那一眼，而人几乎感知不到这部分损耗——因为回到任务时主观上觉得自己在专注。",eg:"写方案时回了一条消息，之后二十分钟的思考质量都受影响，而你并不会察觉。"},{n:"深度工作要靠日程保护，不能靠意志",d:"指望在随时可被打断的环境里靠自制力保持专注是不现实的。有效的做法是把深度时段写进日程并对外声明——像开会一样占住它，而不是等有空再说。空档永远不会自己出现。",eg:"每天上午留出两小时标为不可约，比「今天找时间想一下」可靠得多。"},{n:"浮浅工作要限量，不是清零",d:"邮件、会议、协调这些事必要但不产生新能力。纽波特的主张不是取消，是给它设上限并集中处理——把它们压进固定时段，剩下的时间才可能连成块。",eg:"把邮件集中在两个固定时点处理，而不是全天随到随回。总量没变，但整块时间保住了。"},{n:"无聊是能力的一部分",d:"如果每一个空隙都用刷手机填满，大脑会习惯于持续的新鲜刺激，此后面对需要长时间专注的任务会格外痛苦。所以训练专注的方式之一，是允许自己无聊——排队时不掏手机。",eg:"等电梯的两分钟不看手机。这类小场合决定了你能不能忍受一小时不被打断的思考。"}],q:["==深度工作正在变得稀有，而恰恰因为稀有，它变得珍贵。==","==注意力残留会让你在切换任务后很久仍无法全速运转。==","==如果每个空隙都用刺激填满，你就失去了专注的能力。=="],apply:"想做需要长时间思考的事，先在日程上占住整块时间并对外声明。把琐事集中到固定时段。不要用「就看一眼」评估打断的代价——代价在之后半小时。",contrast:[{n:"原子习惯",why:"都靠设计而非意志：克利尔改环境降低启动成本，纽波特改日程保护整块时间"},{n:"艾利克森",why:"刻意练习需要高强度专注，纽波特说清了这种专注在今天为什么难以获得"}]}
,
{c:"身心与生活",n:"契克森米哈赖",e:"1990年·芝加哥大学",w:"心流",y:1990,l:["艾利克森","卡尔·纽波特","原子习惯","弗兰克尔"],d:"心理学家，用「经验取样法」研究人什么时候最投入——给几千人配呼叫器，随机时刻响起就记录当下在做什么、感觉如何。他发现最好的体验不是放松，而是一种全神贯注到忘记时间的状态，他称之为心流。触发条件很具体：任务难度与你的能力刚好匹配，目标清晰，反馈即时。三者缺一，人要么焦虑要么无聊。",story:"他的数据推翻了一个常识：人们以为休闲最快乐，实际记录显示心流在工作中出现的频率远高于闲暇。看电视时人普遍感到轻度低落，而在挑战适中的工作里最常报告「非常投入、非常满足」。矛盾在于，被问「想做什么」时人还是选择休息。他的解释是，心流有进入成本——需要集中注意力、需要面对可能失败，而放松没有门槛。人于是持续选择低回报但零门槛的活动。",f:[{n:"难度与能力必须匹配",d:"太难产生焦虑，太易产生无聊，只有卡在能力边缘略偏上的地方才进入心流。这解释了为什么同一件事对不同人有完全不同的体验，也解释了为什么熟练之后必须加难度，否则曾经的心流活动会变成乏味。",eg:"打球总赢或总输都不好玩，跟水平接近的人打才停不下来。工作同理，长期做已经会的事会先舒服后麻木。"},{n:"目标清晰、反馈即时",d:"心流要求你随时知道自己做得怎么样。攀岩、下棋、演奏天然满足；而写方案、做管理这类工作的反馈周期以周计，所以很难进入。可行的做法是人为切出带反馈的小段落。",eg:"把「写完这份报告」拆成「先把这一节的论证跑通，跑通了自己能判断」，反馈周期从一周缩到一小时。"},{n:"最好的体验发生在工作里，不在休息里",d:"这是他数据里最反直觉的一条。休闲的门槛低，但心流需要投入，所以人常常在有能力获得高质量体验的地方选择了低质量的放松。认识到这点，对如何安排一天有直接影响。",eg:"下班后累到只想刷手机，刷完往往更空。同样的两小时用来做一件有难度的事，结束时反而是恢复的。"},{n:"心流不等于快乐",d:"进入心流的当下人往往感觉不到快乐——注意力全在事情上，没有余裕评价自己。满足感是事后才涌上来的。所以用「此刻开不开心」来选活动，几乎必然选错。",eg:"专注写完一段东西的过程并不愉快，写完那一刻的踏实才是回报。按当下感受决策，你永远不会开始。"}],q:["==最好的时刻，通常发生在一个人为了完成某件困难而有价值的事，自愿把身心能力发挥到极限的时候。==","==挑战与技能相匹配时，心流出现；前者过高是焦虑，过低是无聊。==","==人们以为休闲最快乐，但记录显示，心流更多发生在工作中。=="],apply:"想进入状态，先检查三件事：难度是不是刚好比我现在的能力高一点？目标够不够具体？我能不能随时知道自己做得如何？累到只想瘫着的时候，注意「当下想做什么」几乎必然指错方向。",contrast:[{n:"艾利克森",why:"同样要求待在能力边缘：艾利克森讲怎么练才长本事，契克森米哈赖讲那个位置为什么让人上瘾"},{n:"卡尔·纽波特",why:"一个说明专注状态的内部条件，一个说明外部条件——日程和环境怎么保护它"}]},
{c:"身心与生活",n:"萨波尔斯基",e:"1994年·斯坦福大学",w:"压力是错配",y:1994,l:["约翰·瑞迪","塞涅卡","爱比克泰德","契克森米哈赖"],d:"神经内分泌学家，在东非观察野生狒狒群三十年，同时研究人类的压力生理。他那本书的标题就是全部论点：斑马不得胃溃疡，因为它的压力反应只在狮子扑来的几分钟里全开，跑掉之后立刻关闭。人的这套系统一模一样，却被用来应付房贷、上司和一封没回的邮件——为几十秒逃命设计的机制，被开成了几十年的常态。",story:"他在狒狒群里发现了一个清晰的规律：地位低的个体，压力激素长期偏高，健康指标全面更差。但更关键的不是地位本身——是可预测性和控制感。同样处在下位，能预知何时被欺负、有社交同盟的个体，生理指标明显更好。他由此指出人类压力研究里最实用的一条：让人生病的往往不是压力的强度，是持续时间加上无法预测与无从掌控。",f:[{n:"急性反应有用，慢性开启有害",d:"心跳加快、血糖释放、免疫暂缓——这套反应对逃命极其有效，代价是暂停了修复、消化和长期建设。短时无妨，长期开启就把身体的维护预算持续挪走。所以问题从来不是有没有压力，是它关不关得掉。",eg:"一周的冲刺没事，连续两年的「随时待命」才是问题——后者身体一直没进过修复模式。"},{n:"不可预测比强度更伤",d:"实验反复显示：知道电击何时到来的动物，生理损伤远小于随机受击的。人也一样——明确的坏消息比悬着的不确定更好受。这条对管理和为人父母都成立。",eg:"重组期迟迟不公布方案，团队的损耗常常超过方案本身。给一个确定的时间点，比继续保密更省人。"},{n:"控制感是缓冲器",d:"同样的工作量，能自己决定顺序和节奏的人压力反应明显更低。所以增加自主权是成本极低的干预——不必减少任务，只需把「怎么做、先做哪个」交回去。",eg:"把「今天必须完成这五项」换成「这五项今天内完成，顺序你定」，负荷没变，损耗差别很大。"},{n:"社会支持不是软话题",d:"狒狒里有同盟的个体、人群里有稳定关系的人，同等压力下的生理指标都更好。这不是心理安慰，是可测量的生理差异。孤立本身就是一项健康风险。",eg:"高压项目里保住一两个能说真话的同事，比多睡一小时更能扛。"}],q:["==斑马不得胃溃疡，因为它的压力反应只开几分钟。==","==让人生病的不是压力本身，而是压力反应长期开着关不掉。==","==同样的压力，可预测和有控制感时，损伤小得多。=="],apply:"长期紧绷时，别只想着减少任务量：先看能不能增加可预测性（明确的时间点、明确的坏消息）和控制感（顺序自己定）。这两项的改善成本低，效果比硬扛大。",contrast:[{n:"塞涅卡",why:"两条路处理同一件事：塞涅卡从判断入手拆解愤怒与恐惧，萨波尔斯基说明它们在身体里是怎么运作的"},{n:"约翰·瑞迪",why:"瑞迪讲怎么用运动消耗掉待命的应激激素，萨波尔斯基讲那些激素为什么会一直待命"}]},
{c:"身心与生活",n:"BJ·福格",e:"2019年·斯坦福行为设计实验室",w:"小到不会失败",y:2019,l:["原子习惯","契克森米哈赖","卡尔·纽波特","富兰克林"],d:"斯坦福行为设计实验室创始人，研究行为如何被设计出来。他给出一个公式：行为发生需要动机、能力、提示三者同时到位。多数人失败在只调动机——靠决心和自我激励——而动机天然起伏，靠它维持的习惯必然崩。他的主张相反：把行为缩到小得不需要动机，然后挂在一个已有的动作后面。",story:"福格自己的例子被反复引用：他想养成做俯卧撑的习惯，于是规定每次上完厕所做两个。两个少到任何状态下都做得到，所以从不失败；而做完两个之后经常会多做几个。几个月后他每天做几十个，但从没依赖过意志力。关键不在两个俯卧撑的效果，在于「上厕所」是每天必然发生且位置固定的锚点，以及做完之后立刻给自己一个庆祝——他坚持这个庆祝动作是让大脑记住这件事的关键一步。",f:[{n:"动机不可靠，所以别依赖它",d:"动机像潮水，起落不由你。用高动机时定的计划去要求低动机的日子，注定断。正确的做法是把行为的难度降到最低动机时也做得到，剩下的交给锚点。",eg:"下决心时报名年卡、买齐装备，都是在高动机状态下透支——真正决定成败的是没劲那天做不做得到。"},{n:"锚在已有行为后面",d:"新习惯最难的是想不起来。福格的解法是把它挂在一个每天必然发生的动作之后：「刷完牙之后，我就……」。锚点提供了提示，你不必再靠记忆或提醒。",eg:"「倒完咖啡之后，我就写三句话。」比「每天早上写作」可靠，因为前者有具体的触发时刻。"},{n:"小到不可能失败",d:"两个俯卧撑、读一页、写三句——小到在最糟的一天也能完成。目的不是这点量的收益，是保住「这件事还在进行」的连续性，以及跨过启动那道坎。开始之后往往会自然做多。",eg:"把「跑三公里」改成「换上跑鞋出门」。换完鞋还不去的人很少，而目标是三公里的人经常连鞋都不换。"},{n:"做完立刻庆祝",d:"这是福格与多数习惯理论的差别：他认为大脑靠情绪而非重复次数来固化行为。所以完成后要立刻给自己一个明确的正向信号——握拳、说一句「不错」——听着傻，但它承担了让行为被记住的功能。",eg:"做完那两个俯卧撑，认真对自己说一句「做到了」。省掉这一步，习惯的固化会慢很多。"}],q:["==行为的发生需要动机、能力和提示同时到位。==","==把行为缩小到你在最没状态的一天也能完成。==","==让大脑记住一个习惯的，是完成时的情绪，不是重复的次数。=="],apply:"新习惯建不起来时，别加决心：把它缩到最糟那天也能做到的大小，挂在一个每天必然发生的动作后面，做完立刻给自己一个正向信号。",contrast:[{n:"原子习惯",why:"克利尔从系统与身份下手，福格从触发与最小动作下手——一个改框架，一个改起跑线"},{n:"富兰克林",why:"富兰克林一周只练一条美德，靠的是自律；福格把难度降到不需要自律"}]},
{c:"家庭与关系",n:"萨提亚",e:"1964年·家庭治疗先驱",w:"看冰山下面",y:1964,l:["卡尔·罗杰斯","非暴力沟通","阿德勒","依恋理论"],d:"家庭治疗的开创者之一。她的转折性主张是：一个人出问题，往往是整个家庭系统在维持某种平衡，把症状放在了最脆弱的那个成员身上。所以治疗对象不该只是那个人。她还给出一套辨识方法：人在压力下会退回四种固定的应对姿态——讨好、指责、超理智、打岔——而第五种「一致性」才是健康的表达。",story:"萨提亚会让全家人站起来摆出雕塑：谁离谁近、谁背对谁、谁被挡在后面。她说家庭的真实结构在语言里说不清楚，但摆出来所有人一眼就看见了。这个方法的犀利之处在于它绕过了辩解——没人能否认自己站在哪。她的另一句常被引用的话是：问题本身不是问题，如何应对才是问题。",f:[{n:"冰山：行为之下还有几层",d:"她把一个人分成水面上的行为，和水下的感受、观点、期待、渴望、自我。冲突几乎都发生在水面，而解决要到水下——对方发火（行为）底下是失望（感受），再底下是「我希望被重视」（期待）。停在水面上争对错，永远吵不完。",eg:"伴侣抱怨你回家太晚，字面是时间安排，底下多半是「我在这个家里排第几」。"},{n:"四种应对姿态",d:"讨好（放弃自己）、指责（放弃对方）、超理智（放弃双方只讲道理）、打岔（放弃话题）。四种都是压力下的自动反应，都在回避真实。第五种一致性是同时顾及自己、对方和情境——这是要练的，不是天生的。",eg:"吵架时你开始一条条讲逻辑而对方越来越激动，那多半是超理智对上了指责，两个人都不在场上。"},{n:"问题不是问题，应对才是",d:"家庭里的困难本身常常无解——收入、疾病、性格差异。真正决定日子好不好过的是应对方式。这句话把注意力从「谁造成的」转到「我们怎么处理」，后者才是能动的部分。",eg:"孩子成绩下滑这件事无法立刻改变，但全家是互相指责还是一起想办法，决定了它会变成什么。"},{n:"症状可能是系统的产物",d:"某个成员的问题常常在替系统承担功能——孩子出状况让濒临破裂的父母暂时联合起来。只治那个人而不动系统，症状会转移到别人身上。",eg:"孩子的问题一好转夫妻就开始吵，往往说明之前那个问题在替婚姻挡事。"}],q:["==问题本身不是问题，如何应对才是问题。==","==压力之下，人会退回讨好、指责、超理智或打岔。==","==症状常常不属于那个表现出症状的人，而属于整个系统。=="],apply:"家里反复出现同一种冲突时，先别追究谁不对：看双方各自退回了哪种姿态，再看水面下真正的期待是什么。如果某个人的问题一好转别处就出事，那多半是系统在移动。",contrast:[{n:"依恋理论",why:"依恋理论解释个人的模板从哪来，萨提亚解释家庭系统当下如何维持平衡"},{n:"非暴力沟通",why:"都主张从行为走到需要：卢森堡给四步句式，萨提亚给冰山与姿态两把尺"}]},
{c:"家庭与关系",n:"鲍恩",e:"1978年·家庭系统理论",w:"分化",y:1978,l:["萨提亚","阿德勒","依恋理论","约翰·戈特曼"],d:"精神科医生，提出家庭系统理论。他关注的核心是「自我分化」——一个人在与亲近的人保持连接的同时，能不能保有独立的思考和情绪。分化低的人被家庭的情绪场裹挟：别人焦虑他就焦虑，为了平息冲突不惜放弃立场。他的另一个重要概念是三角关系：两个人之间张力过大时，会自动拉进第三个人来分散，而这会把张力固定下来。",story:"鲍恩观察到家庭焦虑的传导极快且不讲道理：一个人紧张，全家都紧张，且没人说得清为什么。他把这叫情绪融合。他给出的方向不是切断关系——那是另一种被支配，叫情绪切割——而是分化：既留在关系里，又不被卷走。他有一句话概括了这个难处：能同时做到「我是我」和「我们在一起」的人，比想象中少得多。",f:[{n:"分化：连接与独立要同时成立",d:"分化低有两种表现，看着相反其实同源：一种是被牵着走、家人不高兴就妥协；另一种是干脆断绝往来。前者是融合，后者是切割，都是无法在关系里保持自己。真正的分化是留在关系里而立场不塌。",eg:"过年被催婚，跟着难受一整晚是融合，从此不回家是切割。第三条路是照常回去，且不为这个话题争辩也不改变主意。"},{n:"三角关系把张力固化",d:"两人张力过大时，会本能地拉入第三方——向朋友抱怨伴侣、父母把孩子拉进自己的矛盾。短期确实缓解，代价是那对矛盾从此不需要被解决了，因为张力已经有地方泄。",eg:"跟同事有意见不直说，转而跟第三个人说——问题不会消失，只会变成三个人的长期结构。"},{n:"焦虑会沿着系统传导",d:"家庭里的焦虑像水，从压力最大的地方流向最脆弱的地方，常常落在孩子身上。所以父母处理好自己的焦虑，比任何针对孩子的方法都管用——这是鲍恩最具操作性的推论。",eg:"父母对前途的焦虑，孩子几乎必然接收到，哪怕一个字没说。先处理自己那份，孩子的状态常常自动变化。"},{n:"分化是练出来的，且会传代",d:"分化水平大体在原生家庭里形成，也会传给下一代。但它可以有意识地提高——方法是在最容易被卷走的关系里，反复练习「我知道你不高兴，我理解，但我的看法不变」。",eg:"每次面对家人的情绪都能既不冷漠也不投降，这个能力就长一分，下一代接到的起点也高一分。"}],q:["==分化，是在与人保持连接的同时，仍然保有自己。==","==两个人之间的张力过大时，会自动拉进第三个人。==","==焦虑沿着家庭系统传导，落在最脆弱的那个人身上。=="],apply:"被家人的情绪牵着走时，先分清：我是在融合（跟着难受、赶紧妥协）还是切割（干脆不来往）。想解决两个人的矛盾，注意别拉第三个人进来——那会让它变成长期结构。",contrast:[{n:"萨提亚",why:"同为家庭系统取向：萨提亚看当下的应对姿态，鲍恩看跨代的分化水平"},{n:"阿德勒",why:"两把划边界的刀：阿德勒问「这是谁的课题」，鲍恩问「我有没有被卷进他们的情绪」"}]},
{c:"家庭与关系",n:"托马斯·戈登",e:"1962年·父母效能训练",w:"我信息",y:1962,l:["非暴力沟通","卡尔·罗杰斯","蒙台梭利","阿德勒"],d:"罗杰斯的学生，把人本主义心理学做成了普通父母能学的课程——父母效能训练（P.E.T.）。他的两个核心工具比后来流行的沟通方法更早也更具体：一是「我信息」，用描述自己而非评判对方的方式表达不满；二是「问题归属」，先分清这件事困扰的是谁，因为归属不同，该用的方法完全不同。",story:"戈登指出多数父母只会两招——要么赢（我说了算），要么输（算了随他）。他把这叫输赢法，并指出两种都有长期代价：赢法培养出顺从或对抗，输法培养出不顾及他人。他提出第三法：把冲突变成共同解决的问题，让双方一起找出彼此都能接受的方案，且不投票、不折中，而是找一个真正满足两边需要的办法。这在当时的育儿观念里近乎异端。",f:[{n:"我信息：说自己，不评判对方",d:"完整的我信息有三部分：具体行为、对我的实际影响、我的感受。「你把玩具留在楼梯上（行为），我抱东西下楼会踩到（影响），我很担心（感受）」。它之所以有效，是因为没有一句在说对方是什么人，对方不必防御。",eg:"把「你怎么这么不小心」换成「东西放在楼梯上，我抱着箱子看不见会摔倒」。同一件事，后者孩子会去挪。"},{n:"先分清这是谁的问题",d:"孩子考砸了难受，问题在孩子那边，父母该做的是倾听；孩子把客厅弄乱让你没法工作，问题在你这边，该用我信息。用反了最常见：孩子难受时父母急着讲道理，等于把自己的问题叠上去。",eg:"孩子被同学孤立回来哭，此刻不该分析原因和给建议，那是把问题接管过来了。先听。"},{n:"第三法：不靠输赢解决冲突",d:"要么听我的、要么听你的，长期都在积累账。戈登的做法是把冲突摊开成一个待解的问题：双方说出各自真正的需要，再一起找方案。关键在于找的是满足两边需要的第三条路，不是各让一步的折中。",eg:"孩子要玩到十点、你要他九点睡，折中九点半两边都不满意；问清楚他要的是玩完这一局，改成九点前打完，两边都成立。"},{n:"倾听是有动作的",d:"戈登要求的倾听不是沉默，是把对方的意思用自己的话说回去，让对方确认。这来自他老师罗杰斯，但他把它拆成了父母可以照着做的步骤，而不是一种态度。",eg:"孩子说「我再也不去上学了」，回一句「听起来今天在学校发生了很不好的事」，比问「为什么」更容易让他说下去。"}],q:["==用我信息，不用你信息：说这件事对我的影响，不说你是什么样的人。==","==先弄清这个问题困扰的是谁，再决定用哪种方法。==","==冲突不必以谁赢谁输收场。=="],apply:"要提意见时，先把话拆成「具体行为 + 对我的实际影响 + 我的感受」，一句都不评价对方是什么人。开口之前先问：这件事困扰的是我还是他？困扰他的时候，先听不讲。",contrast:[{n:"非暴力沟通",why:"戈登比卢森堡早二十年，两套结构高度相似；戈登多了一层「问题归属」的判断"},{n:"蒙台梭利",why:"都主张成人退后：蒙台梭利改环境让孩子自己做，戈登改说法让孩子自己想"}]},
{c:"学习与成长",n:"维果茨基",e:"1934年·苏联心理学家",w:"再高一点",y:1934,l:["艾利克森","蒙台梭利","费曼","契克森米哈赖"],d:"苏联心理学家，三十七岁去世，留下的概念却影响了整个教育学。他最重要的贡献是「最近发展区」——一个人能力有两条线：自己能做到的，和在他人帮助下能做到的。两条线之间那段空隙，才是学习真正发生的地方。低于它是重复，高于它是挫败。他还强调思维是从社会互动内化来的：先是和别人一起做，然后才变成自己会做。",story:"维果茨基与当时主流的发展观相反。皮亚杰认为要等孩子发展到某个阶段才能教相应的内容，维果茨基认为教学应当走在发展前面——恰当的引导会把发展往前拉。他举的例子是：两个孩子独立解题都停在同一水平，但给一点提示后，一个能往前走很远，另一个走不动。这两个孩子的实际水平相同，最近发展区却完全不同，而后者才决定他们接下来能学到什么。",f:[{n:"看能力的两条线，不只看一条",d:"评估一个人只看他独立能做什么，会低估差别。真正有预测力的是「给一点帮助后能做到什么」——它显示这个人接下来能长到哪。对带人和教孩子都是同一件事：别只看现在的成绩，看提示之后的反应。",eg:"两个下属现在的产出差不多，给同样一句指点后，一个立刻能推进、一个还是原地——培养重点该放在前者。"},{n:"脚手架：给了要撤",d:"帮助的正确形态是脚手架——搭起来是为了让人够到更高处，够到之后要拆。不拆的帮助会变成依赖，让人停在被扶着的水平上。所以每一次介入都该带着「什么时候不再需要」的问题。",eg:"教孩子解题时先示范一步、让他做下一步，下次只提示第一句，再下次不提示。不撤的示范会一直被等着。"},{n:"教学应当走在发展前面",d:"等准备好了再教，会错过窗口；教远超出的东西，只会挫败。正确的位置是略高于当前——难到需要帮助，又没难到帮了也做不成。这与刻意练习的舒适区边缘是同一个位置的两种说法。",eg:"孩子刚会加法就教方程是无效的；但一直只让他做加法，那个能往前一步的窗口就白白关掉了。"},{n:"先在人之间，后在人心里",d:"维果茨基认为高级思维先发生在互动中，再内化成个人能力——孩子先是被大人提问，后来才学会自己问自己。这解释了为什么讨论、复述、教别人比默读有效：它把还没内化的过程先在外面走一遍。",eg:"学不明白的东西，找人讲一遍。你在讲的过程中借用的正是那个还没内化的结构。"}],q:["==一个人独立能做到的，与在帮助下能做到的，两者之间就是最近发展区。==","==教学应当走在发展的前面。==","==高级的思维先发生在人与人之间，然后才发生在人的内部。=="],apply:"教人或自学时，找那个「一个人做不到、给点提示就能做到」的位置——低于它是重复，高于它是挫败。帮助要按脚手架来：给了就要计划什么时候撤。",contrast:[{n:"艾利克森",why:"同一个位置的两种说法：艾利克森叫舒适区之外，维果茨基叫最近发展区，前者讲怎么练，后者讲怎么教"},{n:"蒙台梭利",why:"两种儿童观：蒙台梭利主张准备环境让孩子自己长，维果茨基主张教学要主动往前拉"}]},
{c:"学习与成长",n:"德韦克",e:"2006年·斯坦福大学",w:"能力可长",y:2006,l:["艾利克森","维果茨基","原子习惯","费曼"],d:"斯坦福心理学家，提出固定型思维与成长型思维的区分：前者认为能力是天生定量的，后者认为能力可以通过努力和方法生长。两种信念带来完全不同的行为——认为能力固定的人会回避可能失败的挑战，因为失败等于证明自己不行；认为能力可长的人把失败当作信息。这个概念影响极大，也因此被大量简化和滥用，需要分开看待。",story:"她最有名的实验是给学生做完一组题后给两种不同的表扬：一组被夸「你真聪明」，一组被夸「你很努力」。随后让他们选下一组题，被夸聪明的更多选择了简单的，被夸努力的更多选择了有挑战的。她的解释是，夸天赋让孩子把成绩当成天赋的证明，此后每一次挑战都变成了对自我的威胁。夸过程则把注意力放在可控的部分上。",f:[{n:"夸过程，别夸天赋",d:"这是这套理论里最实用也最容易执行的一条。夸聪明会让人保护「聪明」这个标签，从而回避挑战；夸具体的做法（你把这一步拆开了、你换了三种方法）让人把注意力放在可改进的地方。",eg:"孩子考得好，说「你这次把错题都过了一遍」，不说「你真聪明」。前者可复制，后者只能守。"},{n:"失败是信息还是判决",d:"两种思维的分水岭在失败发生的那一刻：一种把它读成「我不行」，另一种读成「这个方法不行」。差别不在情绪强度，在于接下来会不会去找原因。",eg:"方案被否，问「哪里不成立」的人下次能改；认定「我不适合做这个」的人，下次连提都不提了。"},{n:"「还没有」这个词",d:"德韦克提到一所学校用「尚未通过」代替「不及格」，把结果从一个判决改成一个时间点。这个小改动之所以有效，是因为它把注意力从「我是什么水平」转到「我到哪一步了」。",eg:"把「我不会写」改成「我还不会写」。一个字的差别，决定了后面那句是找方法还是找理由。"},{n:"这个效应比流行说法小得多",d:"必须说清楚：近年多项大规模重复实验发现，思维模式干预的实际效应量远小于原书传达的印象，在部分人群里接近于零。它是一个真实但温和的因素，不是决定成败的开关。把它当万能钥匙，会让人忽略资源、方法和环境这些更重的变量。",eg:"孩子学不好，先看教法、基础和睡眠，别一上来就归因为「心态不对」——那既不准确，也把责任全推给了孩子。"}],q:["==夸奖天赋会让人回避挑战，夸奖过程会让人接受挑战。==","==在成长型思维里，失败是信息；在固定型思维里，失败是判决。==","==用「还没有」代替「不行」。=="],apply:"给反馈时夸具体做法，不夸天赋。自己失败时先问「哪个方法不成立」，而不是「我是不是不行」。但别把思维模式当成万能解释——效应比流行说法小得多，先检查方法、资源和休息。",contrast:[{n:"艾利克森",why:"德韦克讲相信能力可长，艾利克森讲具体怎么长——只有信念没有练法，是空的"},{n:"维果茨基",why:"两者都指向「再高一点」的位置：一个说该相信能到，一个说该怎么搭梯子"}]},
{c:"学习与成长",n:"优秀的绵羊",e:"2014年·德雷谢维奇",w:"会考不会想",y:2014,l:["费曼","苏格拉底","卡尔·纽波特","尼采"],d:"作者在耶鲁任教十年、做过招生评审，写下对精英教育的批评。他的观察是：这套系统筛选出的年轻人极其擅长跨越一道道设定好的栏杆——成绩、竞赛、实习、简历——却普遍说不出自己想要什么。他称他们为优秀的绵羊：能力很强，方向全靠外部给定，一旦没有下一道栏杆就陷入茫然，且对失败有超出常人的恐惧，因为从没被允许失败过。",story:"他描述那种典型的困境：一个各方面都出色的学生来找他，说自己不知道为什么要读这个专业，也不知道毕业后想做什么，只知道必须做到最好。德雷谢维奇指出这不是个人问题，是系统的产物——一个从小被优化到「满足每一项评价标准」的人，从来没有机会练习「自己决定什么重要」这件事。他的处方不是换个专业，是给自己一段没有评价标准的时间。",f:[{n:"擅长跨栏，不擅长选路",d:"长期在明确评价体系里胜出的人，会把「做到最好」内化成默认目标，而从没练过「决定什么值得做」。这两种能力完全不同，且后者只能在没有标准答案的处境里练。",eg:"从优等生到工作后陷入迷茫的落差，多半不是能力问题，是第一次没人给标准了。"},{n:"怕失败到不敢尝试",d:"一路顺利的代价是没有失败的经验，于是失败被想象得极其可怕。结果是回避一切可能不擅长的事，能力越来越窄——恰恰是最需要拓宽的时候。",eg:"不敢转去自己真正想做的方向，理由是「我在现在这行已经积累了」，但真实原因常常是不能接受从头当新手。"},{n:"给自己一段没有评价的时间",d:"他的建议很朴素：去做一件不被记分的事，做够长。因为「我想要什么」这个问题只有在没人打分的时候才浮得上来，有评分标准时人会自动去优化那个标准。",eg:"业余认真做一件没人看的事，做半年。这半年产生的判断，比任何职业规划课有用。"},{n:"批评的对象是系统，不是学生",d:"这本书容易被误读成指责年轻人不够独立。作者的对象是把人训练成这样的筛选机制——每一步都理性的选择，加起来变成一个没有方向的人生。看清这一层，才不会把它当成又一次「现在的年轻人怎么了」。",eg:"用它自省可以，用它教训别人不行——那些栏杆是谁设的、谁在收益，才是这本书真正问的问题。"}],q:["==他们非常擅长跨越栏杆，却说不出自己想去哪里。==","==从未被允许失败的人，会把失败想象得无比可怕。==","==只有在没有人打分的时候，你才知道自己真正想要什么。=="],apply:"发现自己只会问「怎样才算做得好」而答不上「我想要什么」时，去做一件不被记分的事，做够长。判断一个选择时，先分清是我想要，还是它恰好是下一道栏杆。",contrast:[{n:"苏格拉底",why:"两种把人从现成答案里叫醒的方式：苏格拉底靠追问，德雷谢维奇靠指出提问的人一直在替别人答题"},{n:"尼采",why:"都在质疑外部给定的价值：尼采针对道德体系，德雷谢维奇针对精英筛选体系"}]}
];

// 反向关联索引。l 与 contrast 都是逐条手写的单向边，于是被指向的一方看不到来源：
// 全库有 291 条 l、119 条 contrast 只存在于一个方向，另有 9 条（武则天、富兰克林、胡雪岩、
// 安迪·格鲁夫、六祖慧能，以及新收录的几条）没有任何条目指向它们，只能从「最新」或搜索进入。
// 这里在渲染期补齐反向边：人工挑选的正向关联仍排在前面，自动补全的反向关联接在后面，去重。
// 好处是数据不必写两遍，此后新增条目自动双向可达。
const RL={},RC={};
D.forEach(d=>{
  (d.l||[]).forEach(x=>{(RL[x]=RL[x]||[]).push(d.n)});
  (d.contrast||[]).forEach(c=>{(RC[c.n]=RC[c.n]||[]).push({n:d.n,why:c.why})});
});
function relOf(d){
  const fwd=d.l||[],seen=new Set(fwd),add=[];
  (RL[d.n]||[]).forEach(x=>{if(x!==d.n&&!seen.has(x)){seen.add(x);add.push(x);}});
  return fwd.concat(add);
}
function contrastOf(d){
  const fwd=d.contrast||[],seen=new Set(fwd.map(c=>c.n)),add=[];
  (RC[d.n]||[]).forEach(c=>{if(c.n!==d.n&&!seen.has(c.n)){seen.add(c.n);add.push(c);}});
  return fwd.concat(add);
}

const CATS=["最新","全部",...[...new Set(D.map(d=>d.c))]];
let TAB="最新";

function rTabs(){
  document.getElementById('tabs').innerHTML=CATS.map(c=>
    `<div class="tab${c===TAB?' on':''}" onclick="sTab('${c}')">${c}</div>`
  ).join('');
}
function sTab(t){TAB=t;renderTL();}

const ERAS=[
{label:"前800年—前200年",min:-800,max:-200},
{label:"前200年—公元400年",min:-200,max:400},
{label:"400年—1400年",min:400,max:1400},
{label:"1400年—1800年",min:1400,max:1800},
{label:"1800年—1950年",min:1800,max:1950},
{label:"1950年至今",min:1950,max:2100},
];

function renderTL(){
  return;
  const q=document.getElementById('q').value.toLowerCase();
  const list=D.map((d,i)=>Object.assign({_i:i},d)).filter(d=>
    (TAB==="全部"||TAB==="最新"||d.c===TAB) &&
    (!q||[d.n,d.w,d.c,d.e,d.d].some(x=>x.toLowerCase().includes(q)))
  );
  document.getElementById('ct').textContent=`共 ${list.length} 位`;
  const wrap=document.getElementById('tl-wrap');
  if(TAB==="最新"){
    const items=list.slice().sort((a,b)=>b._i-a._i);
    wrap.innerHTML=`<div class="era-block">
<div class="era-head">
  <div class="era-label">按收录顺序 · 最新在前</div>
  <span class="era-count">${items.length}位</span>
  <div class="era-line"></div>
</div>
<div class="era-cards">
  ${items.map(d=>`<a class="tl-card" href="/i/${encodeURIComponent(slugOf(d.n))}/">
    <div class="tl-year">${d.e}</div>
    <div class="tl-name">${d.n}</div>
    <span class="tl-word">${d.w}</span>
  </a>`).join('')}
</div>
</div>`;
    return;
  }
  wrap.innerHTML=ERAS.map(era=>{
    const items=list.filter(d=>d.y>=era.min&&d.y<era.max).sort((a,b)=>a.y-b.y);
    if(!items.length)return'';
    return`<div class="era-block">
<div class="era-head">
  <div class="era-label">${era.label}</div>
  <span class="era-count">${items.length}位</span>
  <div class="era-line"></div>
</div>
<div class="era-cards">
  ${items.map(d=>`<a class="tl-card" href="/i/${encodeURIComponent(slugOf(d.n))}/">
    <div class="tl-year">${d.e}</div>
    <div class="tl-name">${d.n}</div>
    <span class="tl-word">${d.w}</span>
  </a>`).join('')}
</div>
</div>`;
  }).join('');
}

function slugOf(n){return (HW_SLUGS&&HW_SLUGS[n])||String(n).replace(/[·，、。\s\.,]/g,'');}
function op(name){
  const d=D.find(x=>x.n===name);if(!d)return;
  location.href='/i/'+encodeURIComponent(slugOf(d.n))+'/';return;
  const fw=d.f.map(x=>`<div class="fw"><div class="fw-n">${x.n}</div><div class="fw-d">${x.d}</div>${x.eg?`<div class="fw-eg">📌 ${x.eg}</div>`:''}</div>`).join('');
  const q=d.q.map(x=>`<div class="q-item">${x}</div>`).join('');

const DQX={"做点新东西，不要随大流。":"他人生五条准则的第一条。随大流的问题不在于错，在于即便对了，收益也早被分完了——优势只存在于还没有人站的地方。","和你能找到的最聪明的人在一起，然后放手让他们做。":"两个动作缺一不可。只招不放，等于花大价钱买来一群执行者；而放手比招人难得多，因为它要求你承认自己不是最强的那个。","我是模型先生，不做基本面分析。模型的好处之一，是它能降低风险。":"放弃理解，换来不被自己的故事欺骗。他的收益不来自看得更准，来自把判断这一环从流程里整个删掉。","如果你花在选股上的时间比挑一台冰箱还少，那你活该亏钱。":"一句刺人的对照：买冰箱会比价、查参数、看评测，买股票却靠一条消息。投入的注意力和金额完全不成比例。","如果你每年花13分钟研究宏观经济，那你就浪费了10分钟。":"不是说宏观不重要，是说它不可预测且不可行动。把时间投进一个无法转化为决策的变量，是最隐蔽的浪费。","在股市里最重要的器官是胃，不是脑子。":"判断的门槛远低于承受的门槛。多数人不是没看对，是在看对的位置上被波动摇了出去。","翻的石头越多，找到的东西越多。":"他全部方法的底座，也是最难抄的一条：超额收益来自调研次数，而次数是体力活，不是洞察力。","让人对你有所期待，胜过让人看清你的底。":"已知的能力会被定价，未知的能力才有溢价。一次把实力放满的人，从此只能按那个标准被要求。","不要把话说尽，也不要把事做绝：留下退路，是智者最后的体面。":"留退路不是怯懦，是承认自己会判断错。把话说死的人，等于赌自己永远不需要改口。","凡事都有一个把手，抓住对的那一个，就能推动任何人。":"比《影响力》早了三百多年的同一个洞察，而且更冷：每个人身上都有一处可施力的位置，找错了就是白费劲。","第一流的能力，是知道什么时候不用它。":"能力和调用能力是两件事。逢事必出手的人，会把自己变成一个随时可以被消耗的资源。","宁可与聪明人为敌，不与愚人为友。":"敌人的水平决定你的上限，同伴的水平决定你的成本。和糊涂人相处，光是解释就会吃掉你全部的时间。","国家之所以失败，是因为攫取性制度无法创造激励，让人们去储蓄、投资和创新。":"全书的结论句。穷不是因为人懒或笨，是因为在那套规则下，努力的人拿不到努力的结果。","创造性破坏重新分配的不只是收入和财富，还有政治权力":"这才是创新被压制的真正原因。既得利益者反对的从来不是新技术，是新技术带来的重新洗牌。","繁荣的根源不是自然资源、地理位置或文化传统，而是制度。":"一次性排除了三种最流行的解释。资源可以是诅咒，地理两边相同，文化同宗同源——只剩规则不一样。","贫穷不是因为不知道该怎么做，而是因为掌权者不愿意那样做。":"把发展问题从技术层拽回权力层。好政策的设计从来不难，难在它会削弱正在受益的那批人。","我从不被理论指导。我只问一个问题：这行得通吗？":"极端实用主义的代价与红利都在这句里：他因此避开了所有意识形态陷阱，也因此难以被任何一套价值观辩护。","如果你付花生米的工资，你请到的就只能是猴子。":"把廉洁做成理性选择，而不是道德要求。任何需要人性高尚才能运转的制度，长期都会失效。","我们是一条必须融入鱼群的小鱼。":"弱者的生存策略不是变强，是让自己不值得被单独挑出来。孤立是小国和小公司真正的死因。","在被爱戴和被畏惧之间，我一直认为马基雅维利是对的":"他极少数一次公开的价值观表态。值得注意的是他说的是「被畏惧」，不是「被讨厌」——两者的成本天差地别。","我不在乎民调，我在乎的是三十年后这个国家还在不在。":"长期主义的真实形态：不是有耐心，是愿意在自己的任期内承担骂名，把成果留给一个自己看不到的时点。","机器不打仗，地形不打仗。人打仗。你必须进入人的头脑里去。":"把竞争的目标从对手的资产改成对手的判断。装备和阵地都只是变量，真正的战场在对方怎么理解局面。","你可以选择成为某个人，也可以选择做成某件事。总有一天，你必须在这两条路之间选一条。":"他给每个年轻军官讲的岔路。两条路在早期看起来完全重合，等你发现它们分开时，通常已经选过了。","混乱、无序和不确定，不是要消除的东西":"对克劳塞维茨「摩擦」的一次反转：既然迷雾无法清除，就别浪费力气清除它，把它定向输送给对手。","如果你的循环快过对手，那么他做的每一个反应，都是在应对一个已经消失的世界。":"速度优势的真正杀伤力不在快，在于让对手的每一次正确决策都自动过期。他不是被打败，是自己乱掉的。","百战百胜，非善之善者也；不战而屈人之兵，善之善者也。":"打赢一百次也是一百次消耗。孙子的标准不是胜率，是代价——最好的胜利不在战场上产生，而在对方算完得失后自己放弃。谈判和竞争同理：逼对方算清楚，比逼对方认输便宜得多。","知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆。":"三种状态对应三种胜率，最该注意的是中间那档：只知己不知彼是五五开，等于把结果交给运气。多数人败在只做了一半功课，就以为自己准备好了。","兵无常势，水无常形，能因敌变化而取胜者，谓之神。":"「神」不是算无遗策，是不带预设方案入场。凡是把上一次赢的打法当模板的，都在等一个必然到来的失败。","胜兵先胜而后求战，败兵先战而后求胜。":"顺序决定生死：赢家先把胜负条件凑齐再开打，输家先开打再想办法赢。所有临场翻盘的故事，都是幸存者偏差。","上兵伐谋，其次伐交，其次伐兵，其下攻城。":"一张四级成本表，越往下越贵：攻心最便宜，攻城最贵。真正的问题是，人的本能恰好是从最贵的那一层开始。","战略上藐视敌人，战术上重视敌人。":"两个层次不能串台：战略上怕，就不敢下场；战术上不怕，就会轻敌送命。而多数人恰好反着来——战略上盲目乐观，战术上畏首畏尾。","集中优势兵力，各个歼灭敌人。":"弱者唯一能赢的方式：全局劣势不重要，只要每一次局部交手你都是多打少。资源不够的时候不要摊开，要叠起来。","存地失人，人地皆失；存人失地，人地皆存。":"地会再长出来，人不会。凡是为了保住阵地、面子或估值而把人打光的，最后两样都留不住。","打得赢就打，打不赢就跑。":"听着像取巧，其实最难：它要求你随时诚实评估自己打不打得赢，并且在承认不行的那一刻立刻放弃已经投入的成本。","为学日益，为道日损。损之又损，以至于无为，无为而无不为。":"两条方向相反的曲线：学知识是加法，练判断是减法。多数人一辈子只走加法那条，收集越来越多的方法，却没有能力删掉错的。","知人者智，自知者明。胜人者有力，自胜者强。":"四句里最狠的是最后三个字。赢别人靠能力，赢自己靠结构——前者有天花板，后者没有。","天下之至柔，驰骋天下之至坚。":"柔不是软弱，是不给对方着力点。硬碰硬会同时磨损两边，水不会。","破山中贼易，破心中贼难。":"外部的敌人有形状、有位置、可以调兵；内心的懒惰、傲慢和恐惧没有战场。他打赢了所有的仗，然后说难的是这个。","人须在事上磨炼做功夫，乃有益。":"反对纯粹的书房修养：道理在书房里永远成立，只有放进具体的事、具体的人、具体的利益冲突里，它才会露出你没想到的那一面。","志不立，天下无可成之事。":"不是鸡汤。没有立志的人不是不努力，而是每一次选择都缺一把尺子，于是长期看下来是随机游走。","天下古今之庸人，皆以一惰字致之；天下古今之才人，皆以一傲字致之。":"一份两栏的死亡清单：平庸的人败于懒，有才的人败于傲。越是聪明人，越该盯右边那一栏。","困心横虑，正是磨炼英雄之时。":"把难受重新定义为过程指标：正在被拧的那个时刻，恰好是能力边界正在移动的时刻。","飞鸟尽，良弓藏；狡兔死，走狗烹。":"组织不是忘恩负义，是需求变了。战时最有价值的那种能力，和平时期可能变成最大的威胁——关键是提前看见这个切换点。","陷之死地而后生，置之亡地而后存。":"极高风险的动员术：去掉退路能榨出全部潜力。但它只对本来就没有选择的人有效；主动给自己断后路的，多数只是在赌。","老骥伏枥，志在千里；烈士暮年，壮心不已。":"五十三岁写的。它的重量不在豪情，而在于承认了「暮年」这个前提之后，仍然选择不停。","非淡泊无以明志，非宁静无以致远。":"两个负向条件：不是让你清心寡欲，而是说欲望太密时人看不清自己要什么，噪音太大时人算不了远。","不伐贼，王业亦亡；惟坐而待亡，孰与伐之？":"明知打不赢还要打的理由：坐着等死和站着输是两种不同的结局。有些仗的目的不是赢，是不让局面停在必死的那一格。","仓廪实则知礼节，衣食足则知荣辱。":"道德是有物质门槛的。任何指望靠说教解决的问题，先去查一下它的生存条件够不够。","一年之计，莫如树谷；十年之计，莫如树木；终身之计，莫如树人。":"一份复利期限表：一年、十年、一生。绝大多数组织的所有动作，都停在第一栏。","生我者父母，知我者鲍子也。":"中国最著名的一句致谢。管仲从来不缺能力，缺的是在他一无所有时有人替他背书——而这恰恰是最稀缺的资源。","在别人贪婪时恐惧，在别人恐惧时贪婪。":"逆向不是唱反调，是给情绪定价：市场情绪最贵的时候资产最便宜，反之亦然。难点在于，你自己也泡在同一种情绪里。","第一，不要亏钱；第二，不要忘记第一条。":"复利的算术：亏掉50%需要涨回100%才能回本。所以第一条不是关于谨慎，是关于数学。","时间是好公司的朋友，是坏公司的敌人。":"时间会放大一切，包括缺陷。拿不住的公司不是因为拿得不够久，是本来就不该拿。","如果你不愿意持有一只股票十年，那你连十分钟都不应该持有它。":"一把过滤器：把持有期拉长到十年，大部分买入理由会自动失效——撑不过十年的理由，通常关于价格波动，而不是生意本身。","反过来想，总是反过来想。":"正面求解太难时先求反解：问「怎样才能失败得最彻底」，答案往往清晰得多，而光是避开它们就已经赢了大半。","告诉我激励是什么，我就告诉你结果会是什么。":"想改变行为，别去改口号，去改激励。所有和激励设置相反的道德要求，长期都会输。","以合理价格买入卓越公司，远胜于以便宜价格买入普通公司。":"从「捡烟蒂」进化到「买质量」的那一步：便宜的东西通常有便宜的理由，而优秀的公司会自己长大，替你修正买入价上的误差。","我没有权利拥有一个我无法反驳的观点。":"一条极高的发言门槛：你必须能把反方立场讲得比反方还好，才算真正拥有这个观点。否则你只是复述了一个偏好。","如果我知道我会在哪里死，我就永远不会去那里。":"反向思考的极简版：先列出所有确定的死法，然后用一辈子绕开它们。不需要预测未来，只需要标出雷区。","扩张中不忘谨慎，谨慎中不忘扩张。":"两个相反的动作必须同时在场。只扩张的死于现金流，只谨慎的死于错过窗口——难的是在同一时刻做两件互相矛盾的事。","好景时不过分乐观；不好景时不过度悲观。":"情绪的减震器。顺境里的乐观和逆境里的悲观，都会让你在最坏的时点做出最大的动作。","第一个桶一定要扎实，才好放第二个桶。":"第一桶金的意义不在金额，在于它验证了你的方法有效。方法还没验证就上杠杆，等于在放大一个未知数。","现金流是企业生存的氧气。":"利润是观点，现金是事实。企业不会因为不赚钱倒闭，只会因为付不出钱倒闭。","简单比复杂更难。你必须努力理清思路，让它变得简单。":"复杂是偷懒的产物——把所有可能性都留着，就不必做判断。简单要求你先彻底想明白，然后承担删掉的风险。","专注意味着对一百个其他好主意说不。":"专注真正的成本不是拒绝坏主意，是拒绝好主意。难的从来是那一百个都成立的选项。","设计不仅仅是外观和感受。设计是产品如何工作。":"把「设计」从表层挪到结构层。看起来的样子只是结果，决定体验的是它究竟怎么运转。","延迟满足感程度在不同量级的人是没法有效讨论问题的。":"一句冷酷的判断：这不是能力差异，是时间尺度差异。尺度不同的两个人讨论同一件事，只会各说各话。","创业公司最大的竞争优势是执行力，不是创意。":"创意的稀缺性被严重高估了。同一个想法此刻正同时出现在很多人脑子里，分胜负的是谁先把它做出来、并且做对。","做对的事情和把事情做对是两回事。":"两个不同的维度：方向错的时候，效率越高死得越快。先确认在做对的事，再谈怎么把它做好。","不管什么错误，越早改正损失越小。":"沉没成本的解药：改正的代价随时间指数上升，而不是线性。发现错了的那一刻，就是最便宜的时刻。","物理学是定律，其他一切都是建议。":"第一性原理的入口：把所有「行业惯例」「大家都这么做」降级为建议，只承认物理约束是硬的。","努力成为有用的人。做有用的事，对别人，对这个世界。":"一个极朴素的效用标准，用来对抗那些「看起来重要」的事。有用是可以验证的，重要往往不能。","80%的时间用在创造上。":"时间分配就是战略。会议、汇报、协调都必要，但它们只搬运已有的东西，不产生新的。","我们永远处于公司即将倒闭的边缘。":"一句维持了三十年的自我暗示。它的作用不是制造焦虑，是防止组织把当下的领先误当成安全。","苦难是一份礼物，我希望每个人都有机会经历。":"有争议的一句。他的意思是韧性只能在真实的困难里长出来，而不是说困难本身有什么价值。","如果你们没有失败过，你们其实还没有真正开始。":"失败率为零，说明你只做了确定能做成的事——而确定的事通常没有超额回报。","我们想要一辆会飞的汽车，得到的却是140个字符。":"对一整个时代的指控：资本涌向了容易的软件创新，而难的、物理世界里的东西进展缓慢。","做得最好的企业是那些不竞争的企业。":"竞争会把利润磨到零。真正赚钱的公司都在做别人没做的事——垄断不是结果，是起点。","你在哪个重要问题上，与大多数人的观点相反？":"他的面试题。一个只能私下回答的问题，因为如果大家都同意，它就不再是秘密了。","活下去，是华为最朴素的目标，也是最高的目标。":"最低目标和最高目标是同一个。听起来消极，实际是把所有战略动作都拉回同一个约束条件下检验。","华为没有成功，只有成长。":"拒绝给自己定性。一旦承认成功，组织就会开始保护已有的东西，而不是继续生长。","十年来我天天思考的都是失败，对成功视而不见，也没有什么荣誉感、自豪感，而是危机感。":"把危机感做成制度，而不是情绪。它要求组织把注意力永久性地放在「哪里可能塌」，而不是「我们赢了什么」。","未来是无序的。这是活着最好的时代，几乎所有你自认了解的东西都是错的。":"1997年的判断。它的价值不在预言准不准，而在提醒你：你确信的大部分东西，来自一套即将过期的旧结构。","暴力的成本和收益决定了人类社会的结构。":"一把解释历史的钥匙：社会形态由「施加暴力的成本」决定。技术一旦改变这个成本，社会结构就跟着变。","如果说人工智能是共产主义的，那么加密技术就是自由主义的。":"一句极简的技术政治学：AI天然中心化、集中权力，加密天然分散、对抗权力。而这两样正在同时到来。","臣愿封留足矣，不敢当三万户。":"功成之后主动要小地方，而不是要三万户。他把「封赏」看成风险敞口：赏越大，越显眼，越接近清算名单的前排。","愿弃人间事，欲从赤松子游耳。":"退出的话术。他没有说不干了，说的是要去修仙——给权力一个体面的台阶，比直接辞职安全得多。","臣方外之人，不以官为念。":"同样是退，李泌用的是「我本来就不是体制内的人」。不进入身份，就不必参与身份的争夺。","明主之所导制其臣者，二柄而已矣。二柄者，刑德也。":"把管理压缩成两个动作：赏和罚。韩非的冷酷之处在于，他认为这两样一旦交出去，君主就什么都不是了。","以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。":"三面镜子对应三种反馈源：自己、历史、他人。最难的是第三面——因为它需要有人敢说，也需要你敢听。","我唯一知道的，是我什么都不知道。":"不是谦虚，是认识论的起点。他去问雅典最聪明的人，发现他们都以为自己懂；他不懂，但他知道自己不懂——这个差别决定了谁还能继续学。","未经审视的人生不值得过。":"法庭上的最后陈述。他的意思是：你的价值观如果没有被自己检验过，你过的就是别人的人生。","我不是雅典人，也不是希腊人，我是世界公民。":"公元前五世纪说出「世界公民」。在城邦即身份的年代，这句话等于主动放弃了最大的一层保护。","你有权控制你的思想，而非外部事件。认识到这一点，你便拥有了力量。":"斯多葛的核心操作：力量不来自改变外部，来自认清哪些根本不归你管，然后把全部资源投到归你管的那部分。","你浪费的每一刻，都是别人拼命想要的时间。":"时间是唯一不可再生的资源，而它的稀缺性只在失去时才显形。这句话是让你提前感受那个稀缺。","对于不在你掌控之内的事，不要浪费精力。":"注意力是有限的。为不可控的事消耗情绪，本质上是在挪用你本该用于可控之事的资源。","最好的复仇，是不要变得和对方一样。":"以牙还牙的隐性代价是：你会变成对方那样的人。他给出的替代方案不是原谅，是不被对方定义。","君主必须同时是狮子和狐狸。狮子不知道陷阱，狐狸不能抵御狼群。":"两种能力缺一不可：狮子有力量但看不见陷阱，狐狸能识破陷阱但打不过狼。只强不智，或只智不强，都会死。","人们对伤害的记忆，比对好处的记忆更久。":"一条不对称的人性定律：伤害在记忆里的半衰期远长于恩惠。所以施恩要持续，伤害要一次到位或者根本不做。","命运是我们行动的一半，另一半由我们自己掌控。":"一半一半的世界观。既反对宿命论，也反对全能感——你能掌控的只有你那一半，但那一半必须做满。","极度开放地接受现实，极度诚实地面对自己。":"两个「极度」是一套配对：只对外开放不对己诚实，会变成好好先生；只对己诚实不对外开放，会变成偏执。","失败不是坏事，从失败中不学习才是。":"把失败从结果重新定义为原料。真正致命的不是亏损本身，是同一个亏损重复出现。","现实+对现实的接受=成功的机器。":"一个把主观愿望排除在外的公式。「接受」是最难的那一项——大多数人卡在不肯承认现实是这样。","脆弱的对立面不是强健，而是反脆弱。":"他造了一个词，因为原来的词汇里没有：强健只是扛住冲击，反脆弱是从冲击里获益。绝大多数系统只做到了前者。","风会熄灭蜡烛，却使篝火越烧越旺。对随机性、不确定性和混沌也一样：你需要拥抱它们，而不是逃避它们。":"同一阵风，对蜡烛和篝火的作用完全相反。差别不在风，在于你的结构是消耗型还是供给型。","没有皮肤在场的建议，是毫无意义的噪音。":"检验建议的唯一标准：给建议的人是否承担后果。不承担后果的判断，无论多有道理，都只是噪音。","预测未来是愚蠢的，为不可预测的未来做准备才是智慧。":"把重心从「预测」挪到「配置」。预测的准确率无法提升，但抗打击的结构可以设计。","财富是你睡觉时也在为你工作的资产。":"财富和收入的分水岭：一个在你睡觉时继续工作，一个在你停下时立刻归零。","如果你的收入按小时计算，你永远不会真正富有。":"按小时计价的本质是把时间零售出去，而时间的库存是固定的。这决定了它的天花板不由你的能力决定。","代码和媒体是这个时代不需要许可的杠杆。":"和资本、人力不同，代码和媒体的复制成本为零，且不需要任何人批准。这是普通人这个时代唯一免费的杠杆。","在你认为是玩、别人认为是工作的地方，找你的特定知识。":"寻找特定知识的方法：在你觉得是玩、别人觉得是苦工的地方，你的投入产出比天然比所有人高。","幸福不靠追求，靠移除障碍。":"把幸福从「获得」改成「减少」。追求的对象会不断后退，而障碍是有限的、可以逐一清理的。","大多数人为了逃避真正的思考，愿意做任何事情。":"一句刺人的观察：思考很痛苦，所以人会用忙碌、开会、刷手机来替代它，并且觉得自己很努力。","选择做正确的事情，而不是容易的事情。":"两条路每天都在分岔，而容易的那条通常伪装成「更现实」。区分它们的方法是问：我是在解决问题，还是在回避不适？","我们赢不是因为烧得比别人猛，是因为活得比别人久。":"补贴战的终局判断。烧钱决定谁跑得快，效率决定谁活得久——而最后一个还站着的人拿走全部。","士为知己者死，女为悦己者容。":"最早的「知遇」定价。它揭示了一种非货币的激励：被真正看见的人，愿意付出金钱买不到的东西。","狡兔有三窟，仅得免其死耳。":"冯谖给孟尝君设计的结构：不是一个后路，是三个。单一备份等于没有备份，这是两千年前的冗余设计。","父母之爱子，则为之计深远。":"触龙说赵太后的核心一句。真正的爱是替对方安排长期的位置，而不是给他眼前的舒服。","见兔而顾犬，未为晚也；亡羊而补牢，未为迟也。":"两个「未晚」是这句话的重点：它反对的不是犯错，是发现错了之后因为羞耻而不动手。","学而不思则罔，思而不学则殆。":"两个失效模式：只学不想会淹没在信息里，只想不学会困在自己的循环里。多数人常年偏在其中一边。","知之者不如好之者，好之者不如乐之者。":"三级动力：知道、喜欢、享受。前两级要靠意志维持，第三级不需要——长期竞争最后拼的是这个。","君子和而不同，小人同而不和。":"一条关于团队的判据：能容纳分歧的一致才是真的，靠消灭分歧换来的一致最脆弱。","吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？":"关键在「日」字。它把反省从偶发的顿悟变成每天的例行动作——曾国藩的日记，本质上是这句话的执行版。","君子固穷，小人穷斯滥矣。":"逆境是照妖镜。人的下限不在顺境里显形，只在被逼到墙角的时候露出来。看人要看这一刻。","智人统治地球，不是因为最强壮或最聪明，而是因为唯一能相信共同虚构的动物。":"整本书的核心论断：让人类形成超大规模协作的，不是力量或智力，而是相信不存在之物的能力——国家、货币、公司都是。","农业革命是历史上最大的骗局。":"最反直觉的一章：从物种角度农业是巨大成功，从个体角度它带来了更长的劳动、更差的营养和更多的疾病。指标选错，结论就反了。","能力的提升并不必然带来幸福的提升。":"技术曲线和幸福曲线没有绑定。这句话是整本书对「进步」这个词最大的保留。","我们创造的神，反过来控制了我们。":"虚构是工具，但工具会反过来定义使用者。货币、KPI、公司都经历过这个反转。","力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！":"垓下绝唱。值得注意的是他到最后关心的仍是「时」和「虞姬」，而不是自己哪一步走错了。","此天之亡我，非战之罪也。":"他至死没有归因到自己。这句话是整个知识库里最典型的一次外部归因——也是他失败的真正原因。","纵江东父兄怜而王我，我何面目见之？":"面子成了最后一道关。可以东山再起的条件全部具备，唯一缺的是接受自己已经输了的能力。","我本淮右布衣，天下于我何加焉。":"称帝之后仍然强调布衣出身。它既是自信，也是一种统治技术：出身越低，越能证明结果全靠自己。","天下之事，不难于立法，而难于法之必行。":"变法者的共同发现：立法是技术问题，执行是权力问题。张居正的考成法，就是专门为后半句造的。","竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。":"贬谪路上遇雨。它的力量在于「轻胜马」三个字——没有马的人说骑马不如走路，而且是真心的。","回首向来萧瑟处，归去，也无风雨也无晴。":"回望的姿态。不是雨过天晴，是连晴和雨的分别都消失了——这比乐观高一个层级。","古之成大事者，不惟有超世之才，亦必有坚忍不拔之志。":"给「有志」加了一个前提：才华是入场券，坚忍才是决定名次的东西。这两样他都不缺，所以说得出口。","凡杀不死我的，必使我更强大。":"被引用最多也被误用最多的一句。原意不是苦难有益，而是能被你消化的冲击会转化成结构——消化不了的会直接摧毁你。","每个不曾起舞的日子，都是对生命的辜负。":"针对的是把生活过成待办清单的人。舞蹈在这里代表一切没有产出、却证明你还活着的行为。","人之所以伟大，在于他是桥梁，而非目的。":"人的价值在于「正在通向什么」，而不是「已经是什么」。这句话取消了所有终点式的自我定义。","你必须有混沌，才能诞生一颗闪耀的星。":"创造的前提是先容忍无序。过早追求整齐的人，得到的通常是平庸的秩序。","人类所有的一切都可以被剥夺，唯有人类最后的自由":"集中营里得出的结论：外部可以剥夺一切，唯独不能替你选择态度。这是控制二分法最极端的一次实证。","如果生命有意义，那么苦难也有意义。":"他把逻辑倒过来用：如果承认生命有意义，就必须承认苦难也在意义之内，否则意义会在最需要它的时候失效。","我比任何人都更清楚地意识到我可能是错的。":"顶级投机者的自我定位。他的优势不是判断更准，而是纠错更快——前提是先承认自己会错。","如果投资是有趣的，如果你玩得开心，你可能没有赚到钱。真正的投资是枯燥的。":"刺激感和收益率是负相关的。让你兴奋的交易通常在满足情绪，而不是在赚钱。","我之所以富有，是因为我知道自己什么时候是错的。":"财富的来源被他归给了纠错能力，而不是预测能力。这是他和大多数人对「投资高手」理解的根本分歧。","人类是行走的触发器，很少有真正理性的决策。":"整本书的前提：人的大部分决策由固定的触发模式驱动，理性只在事后负责编理由。","最好的防御：放慢速度，问自己为什么要做这个决定。":"唯一有效的防御是时间。所有影响力技术都依赖于让你立刻决定——一旦慢下来，多数就失效了。","优秀的管理，正是导致领导企业失败的原因。":"最反直觉的结论：不是管理不善导致失败，恰恰是「听客户的、投高利润项目」这些正确动作，把资源系统性地挡在了新市场之外。","破坏性技术不是从最好的客户那里产生，而是从被忽视的客户那里产生。":"新技术最初总是更差、更便宜、利润更薄，因此最好的客户不会要它。等他们要的时候，你已经来不及了。","倾听客户的声音，可能是你能犯的最大错误。":"这句话不是反对听客户，是提醒你：客户只能告诉你他们已知的需求，而颠覆总是从他们说不清的地方开始。","成功企业的最大威胁，往往来自它们最不关注的市场。":"威胁的来源和你的注意力分布是反比的。你越不关注的市场，越没有防御，也越没有预警。","袁绍多端寡要，好谋无决，难成大事。":"郭嘉对袁绍的四字判词。「好谋无决」是最致命的一条——想得多而定不下来，等于把时间免费送给对手。","哀哉奉孝！痛哉奉孝！惜哉奉孝！":"曹操在赤壁战败后的哭喊。它的意义不在悼念，在于承认了一个人的判断力对整个组织意味着什么。","清空你的思维，无形无态，像水一样。水可以流动，也可以冲击。做水吧，我的朋友。":"最广为流传的一句。水的关键不是柔，是没有固定形状——它随容器成形，却始终是水。方法可以变，内核不能。","吸收有用的，去除无用的，加入自己独特的。":"三步学习法：吸收、去除、独创。多数人只做第一步，于是收藏了一堆别人的方法，没有一样是自己的。","认识自我是所有知识中最重要的。":"所有「吸收有用的」都以这句为前提——不知道自己是谁，就无法判断什么对你有用。","不要在脑子里想太多，用感觉去打。":"针对的是过度分析。在需要临场反应的场合，思考是延迟；只有已经内化进身体的东西才用得上。","如果你花太多时间思考一件事，你就永远无法完成它。":"完美主义的解药。想得越久，行动的门槛被自己抬得越高，最后卡在启动这一步。","我不怕一个练了一万种踢法的人，我怕一个把同一种踢法练了一万次的人。":"一万种和一万次的差别。前者是广度的幻觉，后者是深度的复利——真正的威胁永远来自后者。","人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。":"司马迁受宫刑后活下去的理由。他把死的意义交给了「用之所趋」——不是死本身，是你为什么而死。","究天人之际，通古今之变，成一家之言。":"他给自己定的三个目标：理解规律、看清变化、写出判断。最后一句最勇敢——他承认自己有立场，然后诚实地写出来。","天下熙熙，皆为利来；天下攘攘，皆为利往。":"在重农抑商的年代承认逐利是常态。这不是讽刺，是他为商业行为做的正名。","才德全尽谓之圣人，才德兼亡谓之愚人，德胜才谓之君子，才胜德谓之小人。":"司马光的用人四象限。最重要的判断是：德胜才可用，才胜德最危险——因为能力会放大品行的方向。","臣闻天子之职莫大于礼，礼莫大于分，分莫大于名。":"整部《资治通鉴》的开篇立论。名分不是虚礼，是秩序的最小单位——名一乱，后面全乱。","成为你希望在世界上看到的改变。":"最常被印在海报上、也最常被误解的一句。它的重点不是号召别人，是把改变的起点强行拉回自己身上。","非暴力是人类可以支配的最强大的力量，它比人类发明的最强大的武器更强大。":"非暴力在他这里不是道德姿态，是策略：它让施暴者失去正当性，把对抗的战场从力量转移到舆论。","先他们忽视你，然后他们嘲笑你，然后他们攻击你，然后你赢了。":"一条运动的四阶段路线图。它真正的用处是在第二、三阶段——被嘲笑和被攻击时，知道这是进度而不是失败。","弱者永远无法宽恕，宽恕是强者的特质。":"宽恕被他重新定义为强者的特权：只有不再需要靠仇恨支撑自己的人，才付得起宽恕的成本。","眼睛还牙齿，只会让整个世界都变瞎。":"报复的数学结果。对等报复看似公平，但它没有终止条件——每一轮都合理，整体走向毁灭。","想象力比知识更重要，因为知识是有限的，而想象力包围着整个世界。":"知识是存量，想象力是生成能力。前者有边界，后者没有——这是他给创造力排的序。","如果你无法简单地解释它，说明你还没有真正理解它。":"检验理解的唯一标准。讲不简单，通常不是听众的问题，是你自己还停在术语层面。","我没有特别的才华，我只是有强烈的好奇心。":"他把自己的成就归因于好奇心而非天赋。这不是谦虚——好奇心是可以选择的，天赋不是。","逻辑会把你从A带到B，想象力能带你去任何地方。":"逻辑负责验证，想象负责提出。只有逻辑的人永远走不出已知的范围。","上帝不掷骰子。（他对量子力学概率解释的抗议":"他一生最著名的一次判断失误。这句话值得记住的是：即使是他，也会因为审美偏好而拒绝正确的理论。","我不知道第三次世界大战会用什么武器打，但第四次世界大战一定是用石头和棍子打的。":"关于核武器最冷的一句预言。它不预测战争，它预测的是文明可以被打回原点。","治世不一道，便国不法古。":"变法的合法性宣言：治理没有唯一正确的方法，对国家有利就不必效法古人。这句话的代价是他自己的命。","利不百，不变法；功不十，不易器。":"变法者少有的克制：收益不到百倍不改法，不到十倍不换工具。改革本身是有成本的，随便改比不改更坏。","宁为乡村第一，不为罗马第二。":"路过一个小镇时说的。它揭示了一种偏好：宁可在小池塘做主导者，也不在大池塘做从属——因为主导权才能积累。","当我走出监狱大门，我知道如果我不能把悲痛和仇恨留在身后，我就仍然是个囚徒。":"走出监狱那天的自述。这句话把「自由」重新定义为一种内在状态——牢门打开不等于出狱。","教育是可以改变世界的最强大武器。":"他把教育当成武器而非福利。因为教育改变的是下一代的选择集，这是唯一不可逆的改变。","仇恨就像喝下毒药，却期待对方死去。":"仇恨的代谢逻辑：它伤害的是持有它的那个人，而对象往往毫无察觉。","勇敢不是没有恐惧，而是判断还有比恐惧更重要的事情。":"勇敢的定义被他改写：不是消除恐惧，是在恐惧仍然存在时，判断出有更重要的事。","战略是决定在哪里作战，战术是决定怎么作战。":"两个层级不能混：选错战场，战术再好也只是把败仗打得漂亮一点。多数人的努力都花在下面那一层。","一个好的将军，胜在最后五分钟还能思考清楚。":"混乱中保持思考的能力，比任何计划都值钱。因为所有计划都会在接触敌人后的第五分钟失效。","今日胜昨日之我，明日胜不如我者":"两条不同的标尺：和昨天的自己比是纵向，和不如自己的人比是横向。他把纵向放在前面。","不执着于一种武器，不执着于一种思想。":"反对路径依赖的极简表述。武器和思想一样，一旦成为身份的一部分，就会开始限制你。","兵法之道，即万事万物之道。":"他把剑术升格为通用方法论：任何一门技艺练到底，得到的都不是技巧，而是处理不确定性的方式。","以千日之功，磨一日之锋。":"千日与一日的比例，就是准备和发挥的真实配比。真正的较量早在那一天之前就分出了胜负。","空者，无形无相，不可捉摸，却包容万物。":"《五轮书》最后一卷。「空」不是虚无，是不预设——留出空位，才能装下当下真实发生的东西。","吾生也有涯，而知也无涯。以有涯随无涯，殆已。":"常被断章取义成劝学，原意恰好相反：知识无限而生命有限，用有限追无限是危险的。重点是选择，不是勤奋。","人皆知有用之用，而莫知无用之用也。":"无用之用的经济学：所有留白、闲置和看似浪费的部分，恰恰是系统抗压和转向的余量。","井蛙不可以语于海者，拘于虚也；夏虫不可以语于冰者，笃于时也。":"两种认知牢笼：空间的和时间的。而被困住的人无法意识到自己被困——这才是这句话真正的锋利处。","君子之交淡若水，小人之交甘若醴。":"关系的浓度和寿命成反比。太甜的开始通常靠情绪支撑，而情绪是会退潮的。","相濡以沫，不如相忘于江湖。":"最被误读成凉薄的一句。它说的是：与其在困境里互相消耗以维系关系，不如各自回到能自由呼吸的地方。","至人之用心若镜，不将不迎，应而不藏，故能胜物而不伤。":"心如镜的三个动作：不迎、不留、不藏。镜子照物但不占有物，所以永远不会被它照过的东西损伤。","权，借物也，召之即来，挥之即去。":"郭子仪对权力的定性：它是借来的东西，不是你的资产。凡是把借来的当自己的人，都在等归还的那一天。","如果你想说服别人，要诉诸利益，而非诉诸理性。":"说服的第一原理。诉诸理性是在要求对方否定自己，诉诸利益是给对方一个改变立场的台阶。","不要把今天能做的事拖到明天。":"他把这条写进了每日清单。它的价值不在勤奋，在于拖延会让任务的成本随时间上升。","有些人25岁就死了，只是到75岁才埋。":"最锋利的一句。它区分了「活着」和「在过日子」——很多人在某个时点停止了更新，之后只是在重复。","市场短期是投票机，长期是称重机。":"整个价值投资的地基：短期价格由人气决定，长期价格由内在价值决定。所有痛苦都来自把两者的时间尺度搞混。","聪明的投资者是现实主义者，他们向乐观主义者卖出股票，并从悲观主义者手中买进股票。":"交易的对手盘永远是情绪。他把买卖双方描述成两种情绪状态，而你的收益就来自这两种情绪的差值。","你是对的，是因为你的数据和推理是对的":"这句话切断了「市场认可」和「判断正确」之间的联系。对错由证据决定，而不是由是否被人同意决定。","投资者最大的敌人，很可能就是他自己。":"敌人不在市场里，在你自己的反应模式里。这也是为什么方法可以公开，收益却无法复制。","牛市是普通投资者亏损的主要原因。":"反直觉但可验证：牛市让人误以为收益来自能力，于是加杠杆、放宽标准，最终在下一轮全部还回去。","华尔街没有新鲜事，因为投机像山岳一样古老。":"人性不变，所以模式重复。这句话既是安慰也是警告——历史会重演，包括你上次犯的那个错。","赚大钱靠的不是思考，而是坐功。能同时做到判断正确又坚持不动的人极为罕见。":"「坐功」两个字是全书重点。判断正确只是入场券，能在正确的判断上一动不动，才是收益的真正来源。","市场永远不会错，只有人的判断会错。":"市场没有义务符合你的逻辑。当两者冲突时，需要修改的永远是你的判断，而不是等市场认错。","投机者的致命敌人是：无知、贪婪、恐惧和希望。":"四个敌人里最隐蔽的是「希望」——它让人在应该止损的时候继续持有，并称之为坚持。","一个人若不犯错，一个月内就能拥有整个世界；但他若不从错误中吸取教训，就连一样东西也留不住。":"两句连读才完整：犯错不致命，不从错误里提取教训才致命。前者是学费，后者是复购。","我们对显而易见的事视而不见，而且对自己的视而不见也视而不见。":"双重盲区：看不见，且不知道自己看不见。这是所有认知偏差里最难自救的一种。","任何事都不如你正在想它时显得那么重要。":"聚焦错觉。任何被你正在思考的事情，都会自动获得夸大的重要性——所以重大决定不要在情绪现场做。","自信是一种感觉，它反映的是故事的连贯性，而不是证据的质量。":"自信被拆穿了：它衡量的是故事讲得顺不顺，而不是证据够不够。讲得越顺，越该警惕。","人类的大脑是一台急于下结论的机器。":"系统1的默认行为是用现有信息拼出一个完整故事，而不是承认信息不足。缺失的部分它会自己补。","要相信别人比你更容易看清你的错误。":"旁观者没有你的自我保护机制。这句话的实用价值是：主动去找那个会直说的人，并且不要反驳他。","群体中累积的只有愚蠢，而不是天生的智慧。":"群体的智力不做加法。它取的是下限而不是平均，因为能被所有人接受的，只有最简单的那一层。","群体不善推理，却急于采取行动。":"群体最危险的组合：判断力下降的同时行动力上升。这解释了绝大多数集体性灾难。","影响大众想象力的，不是事实本身，而是它呈现的方式。":"传播的关键在形式而非事实。同一个事实换一种呈现方式，效果可以相反——这既是宣传术，也是防御的起点。","群体因为夸大自己的感情，所以只会被极端感情打动。":"群体的情绪没有中间档。温和、复杂、有保留的表达在群体里传不动，只有极端的能传开。","做作和辞藻华丽的东西对群体的影响，远胜逻辑。":"对逻辑最不客气的一句。它提醒你：在面向大众的场合，讲道理往往输给讲得好听。","你的利润率就是我的机会。":"对亚马逊商业模式最精炼的概括。他人的高毛利被他视为一片尚未被效率打穿的空白地。","聪明是一种天赋，而善良是一种选择。":"天赋不需要负责，选择需要。这句话把善良从性格问题挪到了责任问题。","如果你把眼光放到未来三年，和你竞争的人很多；如果你能看到未来七年，和你竞争的人就很少了。":"时间维度就是竞争壁垒。看得越远，愿意陪你走的对手越少，因为大部分组织无法承受那么长的不确定。","要以传教士的心态创业，而不是雇佣兵的心态。":"两种动机在顺境里看不出差别，只在长期低谷时分化：传教士留下来，雇佣兵会离开。","失败和发明是一对不可分割的双胞胎。":"发明的成功率天然很低，所以想要更多发明，只能先接受更多失败。想两者兼得的组织最后什么都没有。","系统的行为，不能只靠了解构成它的元素来理解。":"整本书的第一原理：把每个元素都研究透，仍然预测不了系统的行为——因为行为产生于连接方式，不是元素本身。","人们凭直觉就能找到杠杆点……然后所有人都在拼命朝错误的方向推。":"人的直觉能找到关键杠杆点，但推的方向常常是反的。这是全书最具反讽意味的一句。","我们无法控制系统，也无法彻底搞懂它。但我们可以与它共舞。":"她给出的不是控制方案，是相处方案。承认系统不可完全掌控，反而是有效干预的起点。","对于一个坏政府来说，最危险的时刻通常就是它开始改革的时刻。":"托克维尔最著名的判断：改革释放了希望，希望改变了忍耐的基准线。这既是历史规律，也是任何组织变革的风险提示。","被革命摧毁的政权，几乎总是比它前面的那个政权更好。":"革命的悖论：被推翻的往往是那个已经开始松动、变好的政权，而不是最坏的那个。","人们耐心忍受着苦难，以为这是不可避免的；可是一旦有人提出可以摆脱它，这苦难就立刻变得无法忍受。":"忍耐力不取决于苦难的绝对量，而取决于是否存在可替代的想象。一旦出现替代方案，原来的处境立刻不可接受。","战争无非是政治用另一种手段的延续。":"《战争论》最重要的一句。它把战争降级为工具——一旦脱离政治目的，军事上的胜利可以毫无意义。","战争中的一切都很简单，但最简单的事也是困难的；这些困难累积起来，就产生了一种摩擦。":"「摩擦」是他造的概念：单个动作都不难，难的是在真实世界里累积起来的阻力。这解释了所有计划为什么会走样。","战争是不确定性的王国。行动所依据的东西，有四分之三笼罩在或大或小的迷雾之中。":"四分之三笼罩在迷雾里。这个比例是他给指挥官的心理准备——决策永远在信息不足的条件下做出。","约束对手的能力，往往取决于约束自己的能力。":"承诺的悖论：让自己失去选择，反而增加了对别人的约束力。烧掉退路是一种谈判资产。","威慑的力量不在于拥有毁灭的能力，而在于让对方相信你会使用它。":"威慑的真正门槛不是能力，是可信度。所有威慑失败都失败在对方不相信你真的会执行。","有一种威胁把一部分结果交给了偶然":"他称之为「留有余地的威胁」。把结果部分交给偶然，反而比明确的承诺更有威慑力——因为对方无法赌你的理性。","凡百贸易均着不得欺字，药业关系性命，尤为万不可欺。":"胡庆余堂的「戒欺」匾额，他亲笔所撰。值得注意的是：他在经营上说到做到，但在结构上给自己留了致命的杠杆。","我们的晚餐并非来自屠夫、酿酒师或面包师的恩惠，而是出于他们对自身利益的考虑。":"整本《国富论》最有名的一句。它不是在赞美自私，而是在指出：可靠的协作建立在利益一致上，而不是善意上。","同行的人很少聚在一起，哪怕只是为了娱乐消遣，但他们的谈话最后总是以合谋对付公众、或是密谋抬高价格告终。":"斯密对商人的警惕远超后世对他的印象。反垄断的思想源头就在这句话里。","消费是一切生产的唯一目的，而生产者的利益，只有在能促进消费者利益时才应当被照顾。":"一句被后世不断忽略的立场声明：生产者的利益不是目的，只有当它服务于消费者时才值得保护。","困扰人的不是事情本身，而是人们对事情的看法。":"认知行为疗法的源头。事件是中性的，痛苦产生在事件和「这对我很糟」这个判断之间——而判断是可以修改的。","有些事在我们能力之内，有些不在。在我们能力之内的是判断、意图、欲望和厌恶":"《手册》开篇第一句。几乎所有痛苦都来自把第二类误当成第一类，练习就是持续地重新分类归位。","不要说「我失去了它」，要说「我把它还回去了」。":"把「拥有」换成「保管」。这不是叫人冷漠，是把珍惜和占有分开——占有的人一失去就崩，保管的人失去了还完整。","你可以锁住我的腿，但连宙斯也夺不走我的意志。":"面对暴君威胁时的回答。它划出了那条谁也越不过的界线：身体可以被支配，判断不能。","智不足与权变，勇不足以决断，仁不能以取予，强不能有所守，虽欲学吾术，终不告之矣。":"他收学生的四条门槛，缺一样就不教。前两条决定你能不能赚到，后两条决定你能不能留住——多数人死在后两条。","吾治生产，犹伊尹、吕尚之谋，孙吴用兵，商鞅行法是也。":"在重农抑商的战国说这句话，是一次身份宣言：经商是有原理、有纪律、可以传授的技艺，不是投机取巧。","如果我们被踢出去，董事会找来一个新 CEO，他会怎么做？那我们为什么不自己走出这扇门，再走回来，然后自己干这件事？":"英特尔转型时他问安迪·摩尔的那句话。它的作用是强行剥离沉没成本——用新CEO的视角，看你自己今天该做什么。","坏消息传播得越快，越有可能被处理。":"组织健康度的核心指标。坏消息的传播速度，决定了你在问题变成灾难之前还剩多少时间。","经理人的产出，等于他直接管辖的组织的产出，加上他间接影响的组织的产出。":"他给管理者产出下的定义。它否定了「我自己很忙」这种自我安慰——你的产出不在你手上，在别人手上。","战略转折点到来时，它看起来只是一个糟糕的季度。":"最难的地方在于它的伪装。真正的转折点不会宣布自己到来，它看起来只是运气不好的一个季度。","泡沫时期的浪费，是社会为快速建成新基础设施所支付的代价。":"对泡沫最不带道德判断的一句解释。铁路、光纤、算力都是这样铺出来的——钱亏掉了，基础设施留下来了。","每一次技术革命，都要先经历一场金融狂热，才能到达它的黄金时代。":"她的两阶段模型：狂热期负责融资和铺设，黄金期负责普及和收获。跳过前者，后者不会到来。","技术革命需要二三十年的动荡，才能完成对社会制度的重塑。":"技术本身几年就成熟，难的是制度、组织和习惯跟上来——这个时差就是二三十年动荡的来源。","我们也许永远不知道要去往何方，但最好明白我们身在何处。":"他对「预测」和「定位」的切割。预测未来做不到，但判断当下处在周期哪一格是可以做到的。","买得好，比买好的更重要。":"把注意力从标的质量挪到买入价格。再好的资产，买贵了也会变成差投资——这是他和成长派最大的分歧。","投资中最危险的一句话是：这次不一样。":"周期的每一次顶部都伴随这句话。它的出现本身，就是最可靠的过热信号。","风险不是波动，风险是永久性损失的可能。":"对风险的重新定义。波动会自己恢复，永久性损失不会——把两者混为一谈，是大多数风险模型的根本错误。","没有人会因为你不挥棒而判你出局。":"借棒球说仓位。市场不强迫你出手，空仓不算失误——但大多数人受不了长期不动。","下不欺于地，中不欺于人，上不欺于天。":"《长乐老自叙》里的自我辩护。三个「不欺」回避了最关键的一条：对君主的忠。这正是后世骂他的地方。","此时百姓，佛再出救不得，惟皇帝救得。":"契丹灭晋后他对耶律德光说的话。用奉承换生民，是他最被认可的一次操作，也是他全部争议的浓缩。","但知行好事，莫要问前程。":"他一生的行事准则。它可以理解为务实的善，也可以理解为对是非的回避——这正是冯道难评的原因。","菩提本无树，明镜亦非台，本来无一物，何处惹尘埃。":"针对神秀的「时时勤拂拭」而作。他的主张是：本来就没有需要擦的东西，问题不在灰尘，在于你认为有镜子。","佛法在世间，不离世间觉；离世觅菩提，恰如求兔角。":"禅宗最重要的一次落地。修行不在别处，就在日常之中——离开世间去找觉悟，等于找兔子的角。","不是风动，不是幡动，仁者心动。":"风幡之争。他把争论从外部现象拉回观察者本身——你争的从来不是事实，是你对事实的反应。","于诸境上心不染，曰无念。":"「无念」不是没有念头，是念头经过而不沾附。这和斯多葛的「不将不迎」是同一种心法。","前念迷即凡夫，后念悟即佛。":"顿悟的时间尺度：不是多年苦修，是一个念头的转向。这也意味着，它随时可以发生，也随时可能退回去。","口者，心之门户也；心者，神之主也。":"把嘴定义成门，而不是出口。门的意义在于可开可关，而多数人的门一直敞着——你说出去的每一句，都在替对方描绘你的内部结构。","与智者言依于博，与拙者言依于辨，与辨者言依于要，与贵者言依于势。":"同一件事对四种人有四种讲法。它不是圆滑，是承认：内容能不能被接住，取决于对方的接口，而不是取决于你讲得对不对。","事贵制人，而不贵见制于人。":"全书的落点。主动权不在于谁说得多，在于谁定义议题、谁掌握节奏、谁决定什么时候结束这一局。","故知之始己，自知而后知人也。":"读人的顺序是从自己开始。看不清自己的动机和偏好，读到的所有人都会被自己的投影污染一遍。","我们的美德常常只是伪装起来的恶德。":"他不是说美德不存在，是说别用行为反推动机。一个人一贯大方，只证明大方对他划算；环境一变，划算的方向就变了。","我们都有足够的力量去忍受别人的不幸。":"全书最冷的一句。它解释了为什么安慰总显得轻飘，也解释了真正的支持为什么稀缺——它要求人付出自己本不必付出的代价。","拒绝赞美，其实是想被赞美第二次。":"很多看起来是退让的动作，本质是加价。识别方法很简单：看这个动作有没有给对方留下一个必须回应的空位。","自爱是世上最大的谄媚者，它比世上最巧妙的人还要巧妙。":"自爱不断向你汇报你是个什么样的人，而汇报的内容永远对你有利。它比任何外部的奉承都更难察觉，因为它用的是你自己的声音。","创业只有一个致命错误：做了没有人想要的东西。":"其余所有问题都是可以修的。融资顺利、团队豪华、发布会漂亮，都无法补偿这一条；而这一条成立，别的错误大多还有时间改。","先去做那些无法规模化的事，这是通往规模的唯一路径。":"早期的低效不是浪费。在确认有人真的想要之前，任何自动增长的机器都只是一个昂贵的假设。","与其让很多人有点喜欢你，不如让很少的人非常爱你。":"一百个爱你的用户会告诉你为什么爱、替你传播、容忍你的粗糙；一万个觉得还行的用户只会安静消失，什么都不留下。","最好的创业想法是：你自己想要、你自己能做，而别人没意识到它值得做。":"三条缺一条都危险：不是自己想要就判断不了细节，做不了就只能空想，别人都觉得值得做的地方早就挤满了。","一个会议，可以毁掉一整个下午。":"损失的不是那一小时，是整个下午——因为剩下的两段都不够长到重新进入状态。时间的价值不在总量，在连续性。","松下电器是制造人才的公司，兼做电器生意。":"这句话被无数公司抄成标语，但他是当真的：他把培养判断力当成主产品，把电器当成副产品，然后按这个顺序分配资源。","生意人的使命，是让宝贵的生活物资像自来水一样取之不尽、用之不竭。":"使命一旦定到这个程度，很多具体争论就自动有了答案——该不该降价、该不该走量，不需要每次重新讨论一遍。","我有三个恩惠：家贫、体弱、没上过学。":"三样都是短板：家贫让他知道钱怎么来，体弱逼他授权，没学历逼他请教。短板本身不值钱，把短板转成组织能力才值钱。","越是不景气的时候，越要靠经营的力量。":"顺境掩盖一切经营问题，逆境把它们全部显影。所以萧条不是要熬过去的坏天气，是一次强制体检。","有限游戏以取胜为目的，无限游戏以延续游戏为目的。":"全书的地基。把无限游戏当有限游戏打的人，会在赢的那一天忽然不知道该干什么——因为他一直在为一个不存在的终点做准备。","有限游戏的参与者在边界内游戏，无限游戏的参与者与边界游戏。":"两种关系：一种把规则当前提，一种把规则当对象。所有真正的突破都发生在第二种人身上。","有限游戏的参与者为了权力而参赛，无限游戏的参与者凭借力量而参赛。":"权力是别人给你的头衔，可以被收回；力量不需要承认，也无法被剥夺。头衔换掉之后还剩下的，才是后者。","有限游戏的规则不可改变，无限游戏的规则必须改变。":"最锋利的一条。所有「我们一直是这么做的」，都是在把一个本来无限的游戏，悄悄降级成一个会结束的游戏。","各族群的历史循着不同的轨迹展开，是环境的差异，而不是人的生物学差异。":"整本书的论点，也是一条归因纪律：看到巨大的结果差距，先往回退两步找初始条件，而不是停在人的素质上。","可驯化的动物都是相似的，每一种不可驯化的动物各有各的不可驯化之处。":"成功需要所有条件同时满足，失败只需要缺一样。这条「安娜·卡列尼娜原则」在驯化之外同样成立。","征服美洲的主力不是枪炮，而是随征服者一起到达的病菌。":"最反直觉也最确凿的一条。看得见的武器往往不是胜负手，真正起决定作用的力量通常不在现场被看见。","历史上最大的那些模式，是由各大陆环境的差异塑造的。":"尺度越大，个人和文化的解释力越弱，结构性条件的解释力越强。这也是他和制度学派争论的真正焦点。"};

// 打散出处：把每个出处的 k 条按 N/k 的步长在「环」上均匀布点（序列会循环，
// 所以必须按环处理，否则最大的组会同时占住首尾两端）。确定性，无随机。
function dqInterleave(list){
  const g=new Map();
  list.forEach(q=>{if(!g.has(q.n))g.set(q.n,[]);g.get(q.n).push(q);});
  const groups=[...g.entries()].sort((a,b)=>b[1].length-a[1].length||(a[0]<b[0]?-1:a[0]>b[0]?1:0));
  const N=list.length,out=new Array(N).fill(null);
  let cursor=0;
  for(const e of groups){
    const arr=e[1],k=arr.length,step=N/k;
    for(let j=0;j<k;j++){
      const want=Math.round(cursor+j*step)%N;
      let p=want,d=0;
      while(out[p]!==null){d++;p=(want+(d%2?(d+1)/2:-d/2)+N*2)%N;}   // 就近找空位，左右交替
      out[p]=arr[j];
    }
    cursor=(cursor+1)%N;
  }
  // 环形收尾：若仍有相邻同出处，与一个安全位置对调
  for(let i=0;i<N;i++){
    const a=out[i],b=out[(i+1)%N];
    if(a.n!==b.n)continue;
    for(let d=2;d<N;d++){
      const j=(i+d)%N,pv=out[(j-1+N)%N],nx=out[(j+1)%N];
      if(pv.n===b.n||nx.n===b.n)continue;
      const pb=out[i],nb=out[(i+2)%N];
      if(out[j].n===pb.n||out[j].n===nb.n)continue;
      const t=out[(i+1)%N];out[(i+1)%N]=out[j];out[j]=t;break;
    }
  }
  return out;
}

      const lc=cur.charAt(cur.length-1);

      else{out.push(cur);cur=ch;w=cw;}
      hung=false;
    }else{cur+=ch;w+=cw;}
  }
  if(cur)out.push(cur);
  return out;
}
// 按逗号/分号/句号等切成意群，再贪心装行——断行只落在标点处
const DQ_BRK="，。；！？、：…,;.!?";
function dqClauses(t){
  const out=[];let cur="";
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if(DQ_BRK.indexOf(t[i])>=0&&DQ_BRK.indexOf(t[i+1]||"")<0){out.push(cur);cur="";}
  }
  if(cur)out.push(cur);
  return out;
}
function dqLines(text,px,maxW,ls){
  const c=_dqCtx(px),out=[];let cur="";out.split=false;
  const push=seg=>{
    if(_dqW(c,seg,ls)<=maxW){out.push(seg);return;}
    out.split=true;
    for(const l of dqCharWrap(seg,px,maxW,ls))out.push(l);
  };
  for(const seg of dqClauses(text)){
    if(!cur){cur=seg;continue;}
    if(_dqW(c,cur+seg,ls)<=maxW){cur+=seg;}
    else{push(cur);cur=seg;}
  }
  if(cur)push(cur);
  return out;
}
// 版面高度预算：注眉之下 → 落款之上；放不下就降一档字号
const DQ_SIZES=[.086,.080,.075,.070,.066,.062,.058,.054,.050,.046,.042];
const DQ_LHMAX=1.40;                      // 行距上限（行间距 ≤0.40em）
// 版心：注眉之下 → logo 之上
function dqBand(){
  const W=1080,H=1440;
  return {W:W,H:H,top:Math.round(W*.11)+Math.round(W*.03)+W*.05,
          bot:H-H*.11-Math.round(W*.06*732/447)-Math.round(W*.06)};
}
function dqLayout(d){
  const B=dqBand(),W=B.W,maxW=W-Math.round(W*.09)*2;
  const core=d.t.replace(/[。，、；：？！…\.]+$/,"");
  const dup=core===d.w||(d.w.length>=2&&core.indexOf(d.w)>=0&&core.length<=d.w.length+3);
  const hd=dup?"":d.w,headSize=hd?dqHeadSize(hd.length):0;
  const hb=B.top+(headSize?Math.round(W*headSize)*.95+W*.07:0);
  let clean=null,fit=null,last=null;
  for(const size of DQ_SIZES){
    const px=Math.round(W*size);
    if(maxW/(px*1.02)<4)continue;
    const lines=dqLines(d.t,px,maxW,px*.017),lh=dqLh(px);
    const end=hb+px*.9+(lines.length-1)*px*lh+px*.28;
    const cand={size:size,px:px,lh:lh,lines:lines,end:end};
    last=cand;
    if(end<=B.bot){ if(!fit)fit=cand; if(!lines.split){clean=cand;break;} }
  }
  const c=clean||fit||last,n=c.lines.length;
  // 自适应行距：字号与断行都不动，只把行距撑到版心的 92%
  const fixed=(hb-B.top)+c.px*.9+c.px*.28;
  if(n>1)c.lh=Math.min(DQ_LHMAX,Math.max(c.lh,(( B.bot-B.top)*.92-fixed)/((n-1)*c.px)));
  c.end=B.top+fixed+(n-1)*c.px*c.lh;
  c.off=Math.max(0,(B.bot-c.end)/2);
  c.head=hd;c.headSize=headSize;c.src=dqSrcName(d.n);c.d=d;
  c.fill=(c.end-B.top)/(B.bot-B.top);
  return c;
}
// 只保留「撑得起卡片」的金句：渲染后至少 3 行。字体加载完成后重算一次。
function dqBuildPool(){
  const keep=DQ_ALL.filter(q=>dqLayout(q).lines.length>=3);

  DQ_I=dqToday();
}
// 本地日历日 → 每天 00:00 换句；步长与池大小互质则整轮不重复
function dqDayNum(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
// 序列本身已按出处铺匀，按日顺序走即可继承其最小间隔；整轮不重复
function dqToday(){return DQ.length?Math.floor(Math.random()*DQ.length):0;}
let DQ_I=0;
function dqCur(){const c=dqLayout(DQ[DQ_I]);c.p=DQ_PAL[DQ_I%DQ_PAL.length];return c;}
function dqRender(){

  document.getElementById("dqDate").textContent=dt.getFullYear()+"."+String(dt.getMonth()+1).padStart(2,"0")+"."+String(dt.getDate()).padStart(2,"0");

function dqStep(k){

// 版式与 gen.py renderCard 完全一致：顶对齐、PADX=9%W、PADY=11%W、落款基线=H-11%H
function dqDraw(x,s){
  const W=1080,H=1440,PADX=Math.round(W*.09),PADY=Math.round(W*.11),FOOT=Math.round(H-H*.11);
  x.clearRect(0,0,W,H);

  const id=x.getImageData(0,0,W,H),dd=id.data;
  for(let i=0;i<dd.length;i+=4){if(Math.random()<.06){const k=Math.random()*22|0;dd[i]-=k;dd[i+1]-=k;dd[i+2]-=k;}}
  x.putImageData(id,0,0);
  const draw=(t,px2,py,size,ls,col)=>{x.font=size+'px '+DQ_FONT;x.fillStyle=col;x.textBaseline="alphabetic";
    let cx=px2;for(const ch of t){x.fillText(ch,cx,py);cx+=x.measureText(ch).width+ls;}return cx-px2-ls;};

  y+=W*.05+s.off;
  let hb=y+head*.95;
  if(s.head){draw(s.head,PADX,hb,head,head*.07,s.p[1]);hb+=W*.07;}
  let qy=hb+s.px*.9;
  for(const ln of s.lines){draw(ln,PADX,qy,s.px,s.px*.017,s.p[1]);qy+=s.px*s.lh;}
  x.font=srcS+'px '+DQ_FONT;
  let sw=0;for(const ch of s.src)sw+=x.measureText(ch).width+srcS*.04;sw-=srcS*.04;
  draw(s.src,W-PADX-sw,FOOT,srcS,srcS*.04,s.p[3]);
  const lw=Math.round(W*.048),footFs=Math.round(W*.034),mid=FOOT-Math.round(srcS*.36);

<!--GEO:BODY:START--><noscript><section id="geo-index"><h2>人类世界生存法则 — 遇到事了，看看以前的人怎么处理</h2><p>一个关于「世界到底怎么运转」的知识库：战略、财富、权力、人性、创业，取自 131 位人物与典籍，跨越 2600 年。每一条都写清楚这个人真正留下的那一个想法、背后的故事、拆开的分则与例子，以及今天怎么用。</p><p>按主题浏览： <a href="https://ourword.ai/t/modern/">现代</a> · <a href="https://ourword.ai/t/industrial-age/">工业时代</a> · <a href="https://ourword.ai/t/classical-era/">先秦与古典时代</a> · <a href="https://ourword.ai/t/power/">权力与组织</a> · <a href="https://ourword.ai/t/startups/">创业与产品</a> · <a href="https://ourword.ai/t/strategy/">谋略与竞争</a> · <a href="https://ourword.ai/t/wealth/">财富与风险</a> · <a href="https://ourword.ai/t/mind/">心智与情绪</a> · <a href="https://ourword.ai/t/people/">识人与相处</a> · <a href="https://ourword.ai/t/world/">世界如何运转</a> · <a href="https://ourword.ai/t/family/">家庭与关系</a> · <a href="https://ourword.ai/t/han-wei/">秦汉至魏晋</a> · <a href="https://ourword.ai/t/learning/">学习与成长</a> · <a href="https://ourword.ai/t/early-modern/">近世</a> · <a href="https://ourword.ai/t/medieval/">中古</a> · <a href="https://ourword.ai/t/living/">身心与生活</a></p><ul><li><a href="https://ourword.ai/i/bj-fogg/">BJ·福格</a> — BJ·福格（2019年·斯坦福行为设计实验室）——小到不会失败。斯坦福行为设计实验室创始人，研究行为如何被设计出来。他给出一个公式：行为发生需要动机、能力、提示三者同时到位。多数人失败在只调动机——靠决心和自我激励——而动机天然起伏，靠它维持的习惯必然崩。他的主张相反：把行为缩到小得不需要动机，然后挂在一个已有的动作后面。</li><li><a href="https://ourword.ai/i/sovereign-individual/">主权个人</a> — 主权个人（1997年·戴维森&amp;莫格）——数字主权。1997年出版，比特币诞生早了11年。两位作者用「暴力经济学」解释了人类社会的全部历史：谁控制暴力，谁就控制财富。他们预言了加密货币、远程工作、数字游民、国家权力衰退。</li><li><a href="https://ourword.ai/i/crowd/">乌合之众</a> — 乌合之众（法·1895年）——群体心理的操作系统。古斯塔夫·勒庞著，群体心理学的开山之作。写于法国大革命后百年、大众时代来临前夜，一百多年来被政治家、革命者、广告人、操盘手反复研读——据说墨索里尼倒背如流，罗斯福床头常备。核心论断冷酷而精确：个体一旦进入群体，智力被拉平向下，情绪相互传染，责任感因匿名而消失——「群体中累积的只有</li><li><a href="https://ourword.ai/i/jobs/">乔布斯</a> — 乔布斯（当代·1955-2011）——极简。苹果联合创始人，被迫离开苹果，在NeXT和皮克斯度过12年，然后回来把濒死的苹果变成了全球最有价值的公司。他的思想核心是：简单比复杂更难，专注意味着说不，设计是产品如何工作而不只是外观。</li><li><a href="https://ourword.ai/i/sapiens/">人类简史</a> — 人类简史（2011年·赫拉利）——虚构。以色列历史学家尤瓦尔·赫拉利用一本书重新解释了人类6万年的历史。核心论点惊人简洁：智人能统治地球，不是因为最强壮或最聪明，而是因为唯一能相信「虚构」的动物——金钱、国家、宗教、法律、公司，都是集体想象出来的「虚构」。这些虚构让陌生人能够大规模合作，这才是人类最危险的武器。</li><li><a href="https://ourword.ai/i/ren-zhengfei/">任正非</a> — 任正非（当代·1944-）——韧。1987年，43岁，用2万元创立华为，从交换机代理商起步。30多年后，华为是全球最大电信设备商。他的管理思想：自我批判是组织免疫系统，以客户为中心是组织的北极星。</li><li><a href="https://ourword.ai/i/excellent-sheep/">优秀的绵羊</a> — 优秀的绵羊（2014年·德雷谢维奇）——会考不会想。作者在耶鲁任教十年、做过招生评审，写下对精英教育的批评。他的观察是：这套系统筛选出的年轻人极其擅长跨越一道道设定好的栏杆——成绩、竞赛、实习、简历——却普遍说不出自己想要什么。他称他们为优秀的绵羊：能力很强，方向全靠外部给定，一旦没有下一道栏杆就陷入茫然，且对失败有超出常人的恐惧</li><li><a href="https://ourword.ai/i/attachment-theory/">依恋理论</a> — 依恋理论（1950-1970年代·鲍尔比与艾恩斯沃斯）——早期模板。鲍尔比研究战后孤儿院的孩子，提出人对亲近关系的需求是本能而非依赖；他的合作者艾恩斯沃斯设计了「陌生情境」实验，把一岁婴儿与照料者短暂分离再重聚，从重聚那一刻的反应里，识别出几种稳定的依恋模式。这套模式会成为一个人此后处理亲密关系的默认模板——不是决定论，但确实是出厂设置。</li><li><a href="https://ourword.ai/i/paul-graham/">保罗·格雷厄姆</a> — 保罗·格雷厄姆（美国·1964年—）——做不可规模化的事。Lisp 黑客，1995 年做出 Viaweb——世界上第一个跑在浏览器里的商用软件，1998 年卖给雅虎。2005 年和几个人办了 Y Combinator，用「一次投一批、给小钱、给三个月」的方式重写了早期投资的形态，Airbnb、Stripe、Dropbox 都从这里出来。</li><li><a href="https://ourword.ai/i/bismarck/">俾斯麦</a> — 俾斯麦（普鲁士·1815—1898）——联盟几何。把欧洲当成一道几何题来做的人。他不追求友谊，追求让三方同时离不开你。打败丹麦、奥地利、法国三场战争之后，他反而停下，用联盟把德意志固住。拿破仑赢在打，他赢在停。</li><li><a href="https://ourword.ai/i/chris-voss/">克里斯·沃斯</a> — 克里斯·沃斯（2016年·FBI首席谈判专家）——先标情绪。FBI前首席国际人质谈判专家，处理过绑架、劫持、恐怖袭击。他的方法和商学院教的谈判术几乎相反：不谈利益交换，先处理情绪。他的核心发现是，人在情绪没被承认之前根本听不进条件——所以第一步不是报价，是把对方的情绪准确说出来，让对方觉得「这人懂我在想什么」。</li><li><a href="https://ourword.ai/i/kristin-neff/">克里斯汀·内夫</a> — 克里斯汀·内夫（2003年·得州大学）——自我关怀。心理学家，2003年把「自我关怀」从修行语汇变成可测量的心理学变量——她做的量表后来被大量研究采用。她的贡献不是劝人对自己好一点，是给出了一个替代自尊的算法：自尊的定义里含着「比别人强」，所以它靠比较供能，顺利时最足、失手时最先撤走；而自我关怀不比较，它只问「我现在难受，需要什么</li><li><a href="https://ourword.ai/i/huineng/">六祖慧能</a> — 六祖慧能（唐·638-713）——自性顿悟。一个不识字的岭南樵夫，成为禅宗第六代祖师。由他讲述、门人记录的《六祖坛经》，是唯一一部被中国人尊称为「经」的本土著述（「经」本应专指佛陀所说）。他做的事本质上是一次极端的减法：把佛教从浩繁的经论、渐进的阶梯、寺院的建制里拆出来，还原成一句话——你要找的东西本来就在你身上，问题只是</li><li><a href="https://ourword.ai/i/crucial-conversations/">关键对话</a> — 关键对话（2002年·帕特森等）——先造安全感。四位作者研究了两万多人、上千个组织，想弄清一件事：为什么有些人在高风险、有分歧、情绪激烈的对话里能谈成，多数人却不能。他们的结论是，人在感到不安全的瞬间会退回沉默或暴力两种本能，而对话一旦进入这两种状态，内容说得再对也没用。所以关键不是准备论点，是先把安全感建起来。</li><li><a href="https://ourword.ai/i/feng-dao/">冯道</a> — 冯道（五代·882-954）——十朝元老。中国历史上最难评价的一个人。历经后唐、后晋、后汉、后周四朝，服务过十位皇帝（包括入主中原的契丹皇帝耶律德光），几乎每一朝都居宰相之位，每一次改朝换代都安然过渡，享年七十三，善终。欧阳修骂他「不知廉耻」，司马光斥他「奸臣之尤」；但在他活着的时代，「当世之士无贤愚，皆仰道为元老，而喜</li><li><a href="https://ourword.ai/i/caesar/">凯撒</a> — 凯撒（罗马·前100-前44）——渡河。罗马最著名的将军与独裁者，「骰子已经掷出」是他最著名的一句话。从一个负债累累的贵族子弟，到征服高卢、赢得内战、成为罗马终身独裁官——他用二十年走完了这条路。他死于元老院，被他以为信任的人刺杀。他是拿破仑的精神前辈，西方历史上「权力崛起与崩溃」最完整的弧线之一。</li><li><a href="https://ourword.ai/i/kevin-kelly/">凯文·凯利</a> — 凯文·凯利（2008年·《连线》创刊主编）——铁杆粉丝。《连线》杂志创刊主编，2008年写了一篇短文，把独立创作者的生存问题变成一道算术：一千个铁杆粉丝，每人每年为你花一百美元，就是十万美元，够一个人活下去。他给铁杆粉丝的定义很硬——会买你做的一切，愿意开两百英里去看你演出。这道题真正的价值是把「成名」从必要条件里拿掉：你不需要一百万</li><li><a href="https://ourword.ai/i/liu-bang/">刘邦</a> — 刘邦（汉·前256-前195）——用人。历史上最著名的「草根逆袭」案例。起点：一个基层官吏。终点：汉朝开国皇帝。他的唯一技能是「用人」——不是最聪明的，不是最能打的，但最擅长让比他强的人为他效力。</li><li><a href="https://ourword.ai/i/innovators-dilemma/">创新者的窘境</a> — 创新者的窘境（1997年·克里斯坦森）——颠覆。克莱顿·克里斯坦森提出了商业史上最重要的问题之一：为什么优秀的公司会失败？不是因为懒惰或愚蠢，而是因为它们做了所有「正确」的事——听取最好客户的意见，投资利润最高的产品，专注于最大的市场。恰恰是这些「正确决策」，让它们对破坏性技术视而不见。</li><li><a href="https://ourword.ai/i/livermore/">利弗莫尔</a> — 利弗莫尔（美·1877-1940年）——趋势为友·败于人性。杰西·利弗莫尔，史上最传奇的投机客，《股票作手回忆录》的原型。14岁在对赌行起家，一生四次破产、四次东山再起：1907年做空大赚，摩根亲自请他停止打压市场；1929年大崩盘中做空赚一亿美元（相当于今天数十亿），成为全世界最富有的人之一。他发明的趋势跟踪、关键点交易、金字塔加码，至</li><li><a href="https://ourword.ai/i/popper/">卡尔·波普尔</a> — 卡尔·波普尔（1902-1994年·奥地利）——能被证伪。科学哲学家。他要解决的问题是：占星术和物理学都能解释现象，凭什么说后者是科学？他的答案改变了整个科学观——区别不在能不能解释，而在能不能被推翻。一个理论如果任何观察都不能与之矛盾，那它不是强大，是空洞。这条判据同样适用于日常判断：一个说什么都对的说法，等于什么都没说。</li><li><a href="https://ourword.ai/i/cal-newport/">卡尔·纽波特</a> — 卡尔·纽波特（2016年·乔治城大学）——专注是稀缺品。计算机科学教授，同时研究知识工作者的生产方式。他提出一组对立概念：深度工作是在无干扰状态下的专注思考，能创造新价值、难以复制；浮浅工作是琐碎的事务性动作，容易复制、不产生新能力。他的论断是，随着协作工具让人随时可被打断，深度工作正在变得稀有，而恰恰因为稀有，它成了少数还能拉开差距</li><li><a href="https://ourword.ai/i/carl-rogers/">卡尔·罗杰斯</a> — 卡尔·罗杰斯（1902-1987年·美国）——先被接住。人本主义心理学的创立者，第一个把心理治疗过程全程录音、拿出来做研究的人——在此之前治疗室里发生什么全凭治疗师转述。他的核心主张与当时主流相反：治疗师不该是解读者和指导者，而应提供三个条件——真诚、无条件积极关注、共情性理解——人在这三样齐备的环境里会自己往好的方向长。</li><li><a href="https://ourword.ai/i/ 的感受也认不出。1989年《第二班》提出：有工作的女性下班后还有一</li><li><a href="https://ourword.ai/i/marks/">霍华德·马克斯</a> — 霍华德·马克斯（美国·1946-）——第二层思维。橡树资本创始人，管理规模逾两千亿美元，主战场是不良债权和高收益债——一门只在别人恐慌时才有生意的行当。他从 1990 年开始写投资备忘录，巴菲特说「我第一个打开来读的邮件就是霍华德的备忘录」。他的独特之处在于公开放弃了预测：不猜宏观、不猜利率、不猜明年，只做一件事——判断我们现在</li><li><a href="https://ourword.ai/i/huo-qubing/">霍去病</a> — 霍去病（汉·前140-前117）——纯粹。汉武帝外甥，17岁首战率800骑兵深入敌后歼灭2028人，19岁两次河西之战歼灭4万匈奴，22岁漠北之战深入2000里，封狼居胥山，饮马瀚海。24岁病逝。他是历史上最纯粹的燃烧型天才——把全部能量给了一件事，然后熄灭。</li><li><a href="https://ourword.ai/i/nonviolent-communication/">非暴力沟通</a> — 非暴力沟通（1999年·马歇尔·卢森堡）——先说观察。卢森堡是临床心理学家，一生在种族冲突、离婚调解、监狱和战区做沟通调停。他发现绝大多数争吵的引爆点不是分歧本身，而是把评论说成了观察——「你从来不管孩子」听着像陈述事实，其实是判决。他给出一个四步结构：观察、感受、需要、请求。这套东西看着简单，难在第一步就几乎没人做得到。</li><li><a href="https://ourword.ai/i/han-xin/">韩信</a> — 韩信（汉·前231-前196）——复盘。中国历史上最天才的军事家。胯下之辱，背水一战，十面埋伏——每一个都是教科书。但他的故事有两面：军事天才的崛起，和政治白痴的毁灭。</li><li><a href="https://ourword.ai/i/han-feizi/">韩非子</a> — 韩非子（战国·前280-前233）——法术势。法家集大成者，把商鞅的「法」、申不害的「术」、慎到的「势」整合为一套完整的权力理论。他是中国历史上最清醒的现实主义者——不谈应该怎样，只谈实际上怎样。他的理论直接为秦始皇统一中国提供了思想基础。最大的讽刺：他知道所有权术，却死于同学李斯的谗言。</li><li><a href="https://ourword.ai/i/xiang-yu/">项羽</a> — 项羽（楚·前232-前202）——刚。中国历史上最完美的失败者。力拔山兮气盖世，以一己之力推翻了秦朝——这件事刘邦做不到。但他最终输给了一个资质普通的沛县亭长。他的失败不是能力的失败，是认知的失败：他以为战争是强者对弱者的碾压，却不知道刘邦打的是另一种游戏——用人的游戏。</li><li><a href="https://ourword.ai/i/marcus-aurelius/">马可·奥勒留</a> — 马可·奥勒留（罗马·121-180）——克制。罗马皇帝，斯多葛哲学的最高实践者。他是人类历史上权力最大的人之一——罗马帝国皇帝，管辖六千万人，坐拥无限财富。但他每天写的笔记，是提醒自己「不要被权力腐化」的私人日记，从未打算出版。这本笔记后来叫《沉思录》，成为历史上最多领导人随身携带的书。一个手握一切的人，把全部精力用来管控自</li><li><a href="https://ourword.ai/i/machiavelli/">马基雅维利</a> — 马基雅维利（意大利·1469-1527）——现实。文艺复兴时期佛罗伦萨的外交官，《君主论》作者。他不是在教人变坏，他是第一个把政治从道德里剥离出来、单独研究的人。「马基雅维利主义」成了「不择手段」的代名词，但他的原意更复杂：他研究的是权力的真实运作规律，不管你喜不喜欢这些规律，它们都在运作。他的洞察和韩非子跨越两千年高度吻合——</li><li><a href="https://ourword.ai/i/musk/">马斯克</a> — 马斯克（当代·1971-）——第一性原理。PayPal联合创始人，特斯拉、SpaceX、Neuralink、X联合创始人或创始人。他的方法论只有一个：回到物理原点，重新推演一切。别人觉得不可能的事，他先问：物理定律允许吗？如果允许，那「不可能」只是工程问题。</li><li><a href="https://ourword.ai/i/guiguzi/">鬼谷子</a> — 鬼谷子（战国·约前400—前320年）——捭阖之道。战国纵横家的祖师，隐于鬼谷，生平不可考，只留下一部《鬼谷子》。这是中国唯一一部系统讲「如何说服一个具体的人」的典籍——不讲道德该不该，只讲话该怎么开、怎么合、怎么试、怎么锁。历代正统学者斥它为「小人之书」而不断禁毁，它却始终没有失传，因为凡是要靠说话推动别人做事的人，都绕不开它。</li><li><a href="https://ourword.ai/i/bowen/">鲍恩</a> — 鲍恩（1978年·家庭系统理论）——分化。精神科医生，提出家庭系统理论。他关注的核心是「自我分化」——一个人在与亲近的人保持连接的同时，能不能保有独立的思考和情绪。分化低的人被家庭的情绪场裹挟：别人焦虑他就焦虑，为了平息冲突不惜放弃立场。他的另一个重要概念是三角关系：两个人之间张力过大时，会自动拉进第三个人来分散，而这会</li><li><a href="https://ourword.ai/i/huang/">黄仁勋</a> — 黄仁勋（当代·1963-）——押注。英伟达创始人兼CEO，30年没有被赶走。他在2006年做了一个当时看来「浪费资源」的决定：开发CUDA，让GPU可以做通用计算。2023年，ChatGPT爆发，AI需要大量GPU算力，英伟达成为全球最重要的公司之一。他押注了一个能力，等了17年。</li></ul><p><a href="https://ourword.ai/all/">全部条目</a> · <a href="https://ourword.ai/llms.txt">llms.txt</a> · <a href="https://ourword.ai/llms-full.txt">llms-full.txt</a> · <a href="https://ourword.ai/sitemap.xml">sitemap.xml</a> · <a href="https://ourword.ai/feed.xml">feed.xml</a></p><p><a href="https://ourword.ai/">人类生存法则</a> · <a href="https://ourword.ai/podcast/">原声播客</a> · <a href="https://ourword.ai/skill/">品位 Skill</a></p></section></noscript><!--GEO:BODY:END-->
