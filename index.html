      const lc=cur.charAt(cur.length-1);
      if(DQ_NOEND.indexOf(lc)>=0&&cur.length>1){cur=cur.slice(0,-1);out.push(cur);cur=lc+ch;w=_dqW(c,cur,ls);}
      else{out.push(cur);cur=ch;w=cw;}
      hung=false;
    }else{cur+=ch;w+=cw;}
  }
  if(cur)out.push(cur);
  return out;
}
// 按逗号/分号/句号等切成意群，再贪心装行——断行只落在标点处
const DQ_BRK="，。；！？、：…,;.!?";
function dqClauses(t){
  const out=[];let cur="";
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if(DQ_BRK.indexOf(t[i])>=0&&DQ_BRK.indexOf(t[i+1]||"")<0){out.push(cur);cur="";}
  }
  if(cur)out.push(cur);
  return out;
}
function dqLines(text,px,maxW,ls){
  const c=_dqCtx(px),out=[];let cur="";out.split=false;
  const push=seg=>{
    if(_dqW(c,seg,ls)<=maxW){out.push(seg);return;}
    out.split=true;
    for(const l of dqCharWrap(seg,px,maxW,ls))out.push(l);
  };
  for(const seg of dqClauses(text)){
    if(!cur){cur=seg;continue;}
    if(_dqW(c,cur+seg,ls)<=maxW){cur+=seg;}
    else{push(cur);cur=seg;}
  }
  if(cur)push(cur);
  return out;
}
// 版面高度预算：注眉之下 → 落款之上；放不下就降一档字号
const DQ_SIZES=[.086,.080,.075,.070,.066,.062,.058,.054,.050,.046,.042];
const DQ_LHMAX=1.40;                      // 行距上限（行间距 ≤0.40em）
// 版心：注眉之下 → logo 之上
function dqBand(){
  const W=1080,H=1440;
  return {W:W,H:H,top:Math.round(W*.11)+Math.round(W*.03)+W*.05,
          bot:H-H*.11-Math.round(W*.06*732/447)-Math.round(W*.06)};
}
function dqLayout(d){
  const B=dqBand(),W=B.W,maxW=W-Math.round(W*.09)*2;
  const core=d.t.replace(/[。，、；：？！…\.]+$/,"");
  const dup=core===d.w||(d.w.length>=2&&core.indexOf(d.w)>=0&&core.length<=d.w.length+3);
  const hd=dup?"":d.w,headSize=hd?dqHeadSize(hd.length):0;
  const hb=B.top+(headSize?Math.round(W*headSize)*.95+W*.07:0);
  let clean=null,fit=null,last=null;
  for(const size of DQ_SIZES){
    const px=Math.round(W*size);
    if(maxW/(px*1.02)<4)continue;
    const lines=dqLines(d.t,px,maxW,px*.017),lh=dqLh(px);
    const end=hb+px*.9+(lines.length-1)*px*lh+px*.28;
    const cand={size:size,px:px,lh:lh,lines:lines,end:end};
    last=cand;
    if(end<=B.bot){ if(!fit)fit=cand; if(!lines.split){clean=cand;break;} }
  }
  const c=clean||fit||last,n=c.lines.length;
  // 自适应行距：字号与断行都不动，只把行距撑到版心的 92%
  const fixed=(hb-B.top)+c.px*.9+c.px*.28;
  if(n>1)c.lh=Math.min(DQ_LHMAX,Math.max(c.lh,(( B.bot-B.top)*.92-fixed)/((n-1)*c.px)));
  c.end=B.top+fixed+(n-1)*c.px*c.lh;
  c.off=Math.max(0,(B.bot-c.end)/2);
  c.head=hd;c.headSize=headSize;c.src=dqSrcName(d.n);c.d=d;
  c.fill=(c.end-B.top)/(B.bot-B.top);
  return c;
}
// 只保留「撑得起卡片」的金句：渲染后至少 3 行。字体加载完成后重算一次。
function dqBuildPool(){
  const keep=DQ_ALL.filter(q=>dqLayout(q).lines.length>=3);
  DQ=dqInterleave(keep.length>=40?keep:DQ_ALL);
  DQ_I=dqToday();
}
// 本地日历日 → 每天 00:00 换句；步长与池大小互质则整轮不重复
function dqDayNum(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
// 序列本身已按出处铺匀，按日顺序走即可继承其最小间隔；整轮不重复
function dqToday(){return DQ.length?Math.floor(Math.random()*DQ.length):0;}
let DQ_I=0;
function dqCur(){const c=dqLayout(DQ[DQ_I]);c.p=DQ_PAL[DQ_I%DQ_PAL.length];return c;}
function dqRender(){
  if(!DQ.length)return;
  const s=dqCur();
  dqDraw(document.getElementById("dqCv").getContext("2d"),s);
  document.getElementById("dqSR").textContent=s.d.c+"｜"+(s.head?s.head+"｜":"")+s.d.t+"——"+s.src+(DQX[s.d.t]?"。"+DQX[s.d.t]:"");
  const dt=new Date();
  document.getElementById("dqDate").textContent=dt.getFullYear()+"."+String(dt.getMonth()+1).padStart(2,"0")+"."+String(dt.getDate()).padStart(2,"0");
  const ob=document.getElementById("dqOpen");ob.textContent=s.src;ob.href='/i/'+encodeURIComponent(slugOf(s.d.n))+'/';
  document.getElementById("dqCat").textContent=s.d.c+" · "+s.d.w;
  const nt=document.getElementById("dqNote"),ex=DQX[s.d.t]||"";
  nt.textContent=ex;nt.style.display=ex?"":"none";
}
function dqStep(k){
  if(!DQ.length)return;
  DQ_I=(DQ_I+k%DQ.length+DQ.length)%DQ.length;dqRender();
  const c=document.getElementById("dqCard");
  c.classList.remove("fade");void c.offsetWidth;c.classList.add("fade");
}
// 版式与 gen.py renderCard 完全一致：顶对齐、PADX=9%W、PADY=11%W、落款基线=H-11%H
function dqDraw(x,s){
  const W=1080,H=1440,PADX=Math.round(W*.09),PADY=Math.round(W*.11),FOOT=Math.round(H-H*.11);
  x.clearRect(0,0,W,H);
  x.fillStyle=s.p[0];x.fillRect(0,0,W,H);
  const id=x.getImageData(0,0,W,H),dd=id.data;
  for(let i=0;i<dd.length;i+=4){if(Math.random()<.06){const k=Math.random()*22|0;dd[i]-=k;dd[i+1]-=k;dd[i+2]-=k;}}
  x.putImageData(id,0,0);
  const draw=(t,px2,py,size,ls,col)=>{x.font=size+'px '+DQ_FONT;x.fillStyle=col;x.textBaseline="alphabetic";
    let cx=px2;for(const ch of t){x.fillText(ch,cx,py);cx+=x.measureText(ch).width+ls;}return cx-px2-ls;};
  const kick=Math.round(W*.03),head=s.head?Math.round(W*s.headSize):0,srcS=Math.round(W*.045);
  let y=PADY+kick;
  draw(s.d.c,PADX,y,kick,kick*.37,s.p[3]);
  y+=W*.05+s.off;
  let hb=y+head*.95;
  if(s.head){draw(s.head,PADX,hb,head,head*.07,s.p[1]);hb+=W*.07;}
  let qy=hb+s.px*.9;
  for(const ln of s.lines){draw(ln,PADX,qy,s.px,s.px*.017,s.p[1]);qy+=s.px*s.lh;}
  x.font=srcS+'px '+DQ_FONT;
  let sw=0;for(const ch of s.src)sw+=x.measureText(ch).width+srcS*.04;sw-=srcS*.04;
  draw(s.src,W-PADX-sw,FOOT,srcS,srcS*.04,s.p[3]);
  const lw=Math.round(W*.048),footFs=Math.round(W*.034),mid=FOOT-Math.round(srcS*.36);
  let bx=PADX;
  if(dqLogoOK){x.globalAlpha=.92;x.drawImage(dqLogoImg,bx,mid-lw/2,lw,lw);x.globalAlpha=1;bx+=lw+Math.round(W*.016);}
  x.font=footFs+'px -apple-system,"PingFang SC",system-ui,sans-serif';
  x.fillStyle=s.p[2];x.textBaseline="middle";x.fillText("OurWord.ai",bx,mid);
}
function dqCanvas(){
  const cv=document.createElement("canvas");cv.width=1080;cv.height=1440;
  dqDraw(cv.getContext("2d"),dqCur());return cv;
}
let _dqT=null;
function dqToast(m){
  let el=document.getElementById("dqToast");

function dqText(){const s=dqCur();const u="https://ourword.ai/i/"+encodeURIComponent(slugOf(s.d.n))+"/";return "「"+s.d.t+"」\n—— "+s.src+"\n\n人类世界生存法则\n"+u;}
async function dqShare(){

    }

  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);

}

  }
}

<!--GEO:BODY:START--><noscript><section id="geo-index"><h2>人类世界生存法则 — 遇到事了，看看以前的人怎么处理</h2><p>一个关于「世界到底怎么运转」的知识库：战略、财富、权力、人性、创业，取自 160 位人物与典籍，跨越 2600 年。每一条都写清楚这个人真正留下的那一个想法、背后的故事、拆开的分则与例子，以及今天怎么用。</p><p>按主题浏览： <a href="https://ourword.ai/t/modern/">现代</a> · <a href="https://ourword.ai/t/industrial-age/">工业时代</a> · <a href="https://ourword.ai/t/classical-era/">先秦与古典时代</a> · <a href="https://ourword.ai/t/mind/">心智与情绪</a> · <a href="https://ourword.ai/t/power/">权力与组织</a> · <a href="https://ourword.ai/t/startups/">创业与产品</a> · <a href="https://ourword.ai/t/strategy/">谋略与竞争</a> · <a href="https://ourword.ai/t/wealth/">财富与风险</a> · <a href="https://ourword.ai/t/learning/">学习与成长</a> · <a href="https://ourword.ai/t/people/">识人与相处</a> · <a href="https://ourword.ai/t/family/">家庭与关系</a> · <a href="https://ourword.ai/t/living/">身心与生活</a> · <a href="https://ourword.ai/t/world/">世界如何运转</a> · <a href="https://ourword.ai/t/early-modern/">近世</a> · <a href="https://ourword.ai/t/han-wei/">秦汉至魏晋</a> · <a href="https://ourword.ai/t/medieval/">中古</a></p><ul><li><a href="https://ourword.ai/i/bj-fogg/">BJ·福格</a> — BJ·福格（2019年·斯坦福行为设计实验室）——小到不会失败。斯坦福行为设计实验室创始人，研究行为如何被设计出来。他给出一个公式：行为发生需要动机、能力、提示三者同时到位。多数人失败在只调动机——靠决心和自我激励——而动机天然起伏，靠它维持的习惯必然崩。他的主张相反：把行为缩到小得不需要动机，然后挂在一个已有的动作后面。</li><li><a href="https://ourword.ai/i/cs-lewis/">C.S.刘易斯</a> — C.S.刘易斯（1898-1963年·英国牛津）——妻子死后几个月的日记。作家，牛津和剑桥的教授，写过《纳尼亚传奇》和大量劝人信仰的书。五十八岁结婚，妻子乔伊四年后因癌症去世。之后几个月他在四本练习簿上记自己的状态，后来用笔名出版，就是《卿卿如晤》。收他是因为「重要的人走了」那六个问题，原来靠弗兰克尔和苏轼在答——一个是集中营的幸存者，一个是被贬的官员</li><li><a href="https://ourword.ai/i/churchill/">丘吉尔</a> — 丘吉尔（1874-1965年·英国）——被晾了十年，六十五岁回来。政治家、写作者。1929 年随内阁下台丢了财政大臣的位置，此后十年没有官职，史称荒野岁月。这十年他靠写书养家，四卷本的《马尔博罗传》出在这期间；在自己家里动手砌砖砌墙，还画油画。三十年代他在议会反复讲德国重新武装、英国空军跟不上，被同僚当成好战和过时的人，他没有改口，把飞机产量的</li><li><a href="https://ourword.ai/i/sovereign-individual/">主权个人</a> — 主权个人（1997年·戴维森&amp;莫格）——数字主权。1997年出版，比特币诞生早了11年。两位作者用「暴力经济学」解释了人类社会的全部历史：谁控制暴力，谁就控制财富。他们预言了加密货币、远程工作、数字游民、国家权力衰退。</li><li><a href="https://ourword.ai/i/crowd/">乌合之众</a> — 乌合之众（法·1895年）——群体心理的操作系统。古斯塔夫·勒庞著，群体心理学的开山之作。写于法国大革命后百年、大众时代来临前夜，一百多年来被政治家、革命者、广告人、操盘手反复研读——据说墨索里尼倒背如流，罗斯福床头常备。核心论断冷酷而精确：个体一旦进入群体，智力被拉平向下，情绪相互传染，责任感因匿名而消失——「群体中累积的只有</li><li><a href="https://ourword.ai/i/jobs/">乔布斯</a> — 乔布斯（当代·1955-2011）——极简。苹果联合创始人，被迫离开苹果，在NeXT和皮克斯度过12年，然后回来把濒死的苹果变成了全球最有价值的公司。他的思想核心是：简单比复杂更难，专注意味着说不，设计是产品如何工作而不只是外观。</li><li><a href="https://ourword.ai/i/sapiens/">人类简史</a> — 人类简史（2011年·赫拉利）——虚构。以色列历史学家尤瓦尔·赫拉利用一本书重新解释了人类6万年的历史。核心论点惊人简洁：智人能统治地球，不是因为最强壮或最聪明，而是因为唯一能相信「虚构」的动物——金钱、国家、宗教、法律、公司，都是集体想象出来的「虚构」。这些虚构让陌生人能够大规模合作，这才是人类最危险的武器。</li><li><a href="https://ourword.ai/i/ren-zhengfei/">任正非</a> — 任正非（当代·1944-）——韧。1987年，43岁，用2万元创立华为，从交换机代理商起步。30多年后，华为是全球最大电信设备商。他的管理思想：自我批判是组织免疫系统，以客户为中心是组织的北极星。</li><li><a href="https://ourword.ai/i/illich/">伊万·伊里奇</a> — 伊万·伊里奇（奥地利—墨西哥·1926-2002）——上限。神父出身的思想家，1970年代连出四本书拆掉了四套人人默认为进步的系统：学校、交通、医疗、以及「工具」这个概念本身。他的核心论断只有一句：每样工具都会跨过两道分水岭，越过第二道，它开始生产它本来要消灭的东西。医疗制造病人，学校制造无知感，交通制造距离。他不反技术，他要给技术设上限</li><li><a href="https://ourword.ai/i/excellent-sheep/">优秀的绵羊</a> — 优秀的绵羊（2014年·德雷谢维奇）——会考不会想。作者在耶鲁任教十年、做过招生评审，写下对精英教育的批评。他的观察是：这套系统筛选出的年轻人极其擅长跨越一道道设定好的栏杆——成绩、竞赛、实习、简历——却普遍说不出自己想要什么。他称他们为优秀的绵羊：能力很强，方向全靠外部给定，一旦没有下一道栏杆就陷入茫然，且对失败有超出常人的恐惧</li><li><a href="https://ourword.ai/i/attachment-theory/">依恋理论</a> — 依恋理论（1950-1970年代·鲍尔比与艾恩斯沃斯）——早期模板。鲍尔比研究战后孤儿院的孩子，提出人对亲近关系的需求是本能而非依赖；他的合作者艾恩斯沃斯设计了「陌生情境」实验，把一岁婴儿与照料者短暂分离再重聚，从重聚那一刻的反应里，识别出几种稳定的依恋模式。这套模式会成为一个人此后处理亲密关系的默认模板——不是决定论，但确实是出厂设置。</li><li><a href="https://ourword.ai/i/paul-graham/">保罗·格雷厄姆</a> — 保罗·格雷厄姆（美国·1964年—）——做不可规模化的事。Lisp 黑客，1995 年做出 Viaweb——世界上第一个跑在浏览器里的商用软件，1998 年卖给雅虎。2005 年和几个人办了 Y Combinator，用「一次投一批、给小钱、给三个月」的方式重写了早期投资的形态，Airbnb、Stripe、Dropbox 都从这里出来。</li><li><a href="https://ourword.ai/i/bismarck/">俾斯麦</a> — 俾斯麦（普鲁士·1815—1898）——联盟几何。把欧洲当成一道几何题来做的人。他不追求友谊，追求让三方同时离不开你。打败丹麦、奥地利、法国三场战争之后，他反而停下，用联盟把德意志固住。拿破仑赢在打，他赢在停。</li><li><a href="https://ourword.ai/i/chris-voss/">克里斯·沃斯</a> — 克里斯·沃斯（2016年·FBI首席谈判专家）——先标情绪。FBI前首席国际人质谈判专家，处理过绑架、劫持、恐怖袭击。他的方法和商学院教的谈判术几乎相反：不谈利益交换，先处理情绪。他的核心发现是，人在情绪没被承认之前根本听不进条件——所以第一步不是报价，是把对方的情绪准确说出来，让对方觉得「这人懂我在想什么」。</li><li><a href="https://ourword.ai/i/kristin-neff/">克里斯汀·内夫</a> — 克里斯汀·内夫（2003年·得州大学）——自我关怀。心理学家，2003年把「自我关怀」从修行语汇变成可测量的心理学变量——她做的量表后来被大量研究采用。她的贡献不是劝人对自己好一点，是给出了一个替代自尊的算法：自尊的定义里含着「比别人强」，所以它靠比较供能，顺利时最足、失手时最先撤走；而自我关怀不比较，它只问「我现在难受，需要什么</li><li><a href="https://ourword.ai/i/maslach/">克里斯蒂娜·马斯拉赫</a> — 克里斯蒂娜·马斯拉赫（1946-·加州大学伯克利）——倦怠是工作的问题。职业倦怠这个概念能被量出来，主要是她的工作。1981年她做出一套量表，把倦怠拆成三样：情绪耗竭、疏离、成就感下降——只有第一样和「累」重合，所以一个人可以看起来还在正常上班、活儿也交得出来，而后两样早就开始了。她几十年来最坚持也最不受欢迎的一个主张是：倦怠是工作环境的问题，不是个</li><li><a href="https://ourword.ai/i/huineng/">六祖慧能</a> — 六祖慧能（唐·638-713）——自性顿悟。一个不识字的岭南樵夫，成为禅宗第六代祖师。由他讲述、门人记录的《六祖坛经》，是唯一一部被中国人尊称为「经」的本土著述（「经」本应专指佛陀所说）。他做的事本质上是一次极端的减法：把佛教从浩繁的经论、渐进的阶梯、寺院的建制里拆出来，还原成一句话——你要找的东西本来就在你身上，问题只是</li><li><a href="https://ourword.ai/i/crucial-conversations/">关键对话</a> — 关键对话（2002年·帕特森等）——先造安全感。四位作者研究了两万多人、上千个组织，想弄清一件事：为什么有些人在高风险、有分歧、情绪激烈的对话里能谈成，多数人却不能。他们的结论是，人在感到不安全的瞬间会退回沉默或暴力两种本能，而对话一旦进入这两种状态，内容说得再对也没用。所以关键不是准备论点，是先把安全感建起来。</li><li><a href="https://ourword.ai/i/feng-dao/">冯道</a> — 冯道（五代·882-954）——十朝元老。中国历史上最难评价的一个人。历经后唐、后晋、后汉、后周四朝，服务过十位皇帝（包括入主中原的契丹皇帝耶律德光），几乎每一朝都居宰相之位，每一次改朝换代都安然过渡，享年七十三，善终。欧阳修骂他「不知廉耻」，司马光斥他「奸臣之尤」；但在他活着的时代，「当世之士无贤愚，皆仰道为元老，而喜</li><li><a href="https://ourword.ai/i/kleinman/">凯博文</a> — 凯博文（1941-·哈佛大学·医学人类学）——治不好，还照护得了。哈佛的医学人类学家，也是精神科医生，在中国做过多年田野。他一辈子在做同一件事：把「病」拆成两半。一半是医生看到的——检查单上的指标、器官里的病变；另一半是病人过的那段日子——疼、怕、干不成事、在家里变成另一个角色。现代医学几乎全部力气都花在前一半上，而人真正在受的是后一半。201</li><li><a href="https://ourword.ai/i/caesar/">凯撒</a> — 凯撒（罗马·前100-前44）——渡河。罗马最著名的将军与独裁者，「骰子已经掷出」是他最著名的一句话。从一个负债累累的贵族子弟，到征服高卢、赢得内战、成为罗马终身独裁官——他用二十年走完了这条路。他死于元老院，被他以为信任的人刺杀。他是拿破仑的精神前辈，西方历史上「权力崛起与崩溃」最完整的弧线之一。</li><li><a href="https://ourword.ai/i/kevin-kelly/">凯文·凯利</a> — 凯文·凯利（2008年·《连线》创刊主编）——铁杆粉丝。《连线》杂志创刊主编，2008年写了一篇短文，把独立创作者的生存问题变成一道算术：一千个铁杆粉丝，每人每年为你花一百美元，就是十万美元，够一个人活下去。他给铁杆粉丝的定义很硬——会买你做的一切，愿意开两百英里去看你演出。这道题真正的价值是把「成名」从必要条件里拿掉：你不需要一百万</li><li><a href="https://ourword.ai/i/liu-bang/">刘邦</a> — 刘邦（汉·前256-前195）——用人。历史上最著名的「草根逆袭」案例。起点：一个基层官吏。终点：汉朝开国皇帝。他的唯一技能是「用人」——不是最聪明的，不是最能打的，但最擅长让比他强 安，史称「再造王室」。但他真正的传奇不在战场：历玄宗、肃宗、代宗、德宗四朝，功盖天下而主不疑，位极人臣而众不嫉，富贵寿考八十五岁善终，子孙满堂。《旧唐书》的这句评语，两千年里几乎找不到第二个人配得上。韩信、岳飞、年羹尧都倒在「功高震</li><li><a href="https://ourword.ai/i/adler/">阿德勒</a> — 阿德勒（1870-1937年·奥地利）——课题分离。个体心理学的创立者，弗洛伊德早期的同事，后来因为根本分歧决裂。弗洛伊德说人被过去决定，阿德勒说人被目的牵引——同一段童年，有人拿它当伤疤，有人拿它当借口，有人拿它当燃料，差别不在经历本身，在这个人想用它达成什么。他还给出了人际关系里最锋利的一把刀：分清这件事的后果最终由谁承担，就</li><li><a href="https://ourword.ai/i/hochschild/">阿莉·霍克希尔德</a> — 阿莉·霍克希尔德（1983年·加州大学伯克利）——看不见的劳动。社会学家，两次给一件看不见的劳动起了名字。1983年《被管理的心》提出「情感劳动」：有些工作不只要求你做对，还要求你显示出规定的情绪——空乘要热情，催收员要冷硬；她的观察是异化，那个笑不是「她的」笑，久了连自己真正的感受也认不出。1989年《第二班》提出：有工作的女性下班后还有一</li><li><a href="https://ourword.ai/i/tao-yuanming/">陶渊明</a> — 陶渊明（365-427年·浔阳）——辞官八十天，穷一辈子。诗人。四十一岁当彭泽县令，干了八十多天，郡里派督邮下来要他穿戴整齐去迎，他说「吾不能为五斗米折腰向乡里小人」，当天解印走了，之后再没出来做官。辞官后是真穷：四十四岁家里失火房子烧光，有一年断了粮出门去讨，回来写了一首《乞食》。收他是因为「人生转弯」那一组苏轼一人答了十个——库里缺</li><li><a href="https://ourword.ai/i/marks/">霍华德·马克斯</a> — 霍华德·马克斯（美国·1946-）——第二层思维。橡树资本创始人，管理规模逾两千亿美元，主战场是不良债权和高收益债——一门只在别人恐慌时才有生意的行当。他从 1990 年开始写投资备忘录，巴菲特说「我第一个打开来读的邮件就是霍华德的备忘录」。他的独特之处在于公开放弃了预测：不猜宏观、不猜利率、不猜明年，只做一件事——判断我们现在</li><li><a href="https://ourword.ai/i/huo-qubing/">霍去病</a> — 霍去病（汉·前140-前117）——纯粹。汉武帝外甥，17岁首战率800骑兵深入敌后歼灭2028人，19岁两次河西之战歼灭4万匈奴，22岁漠北之战深入2000里，封狼居胥山，饮马瀚海。24岁病逝。他是历史上最纯粹的燃烧型天才——把全部能量给了一件事，然后熄灭。</li><li><a href="https://ourword.ai/i/nonviolent-communication/">非暴力沟通</a> — 非暴力沟通（1999年·马歇尔·卢森堡）——先说观察。卢森堡是临床心理学家，一生在种族冲突、离婚调解、监狱和战区做沟通调停。他发现绝大多数争吵的引爆点不是分歧本身，而是把评论说成了观察——「你从来不管孩子」听着像陈述事实，其实是判决。他给出一个四步结构：观察、感受、需要、请求。这套东西看着简单，难在第一步就几乎没人做得到。</li><li><a href="https://ourword.ai/i/han-xin/">韩信</a> — 韩信（汉·前231-前196）——复盘。中国历史上最天才的军事家。胯下之辱，背水一战，十面埋伏——每一个都是教科书。但他的故事有两面：军事天才的崛起，和政治白痴的毁灭。</li><li><a href="https://ourword.ai/i/han-feizi/">韩非子</a> — 韩非子（战国·前280-前233）——法术势。法家集大成者，把商鞅的「法」、申不害的「术」、慎到的「势」整合为一套完整的权力理论。他是中国历史上最清醒的现实主义者——不谈应该怎样，只谈实际上怎样。他的理论直接为秦始皇统一中国提供了思想基础。最大的讽刺：他知道所有权术，却死于同学李斯的谗言。</li><li><a href="https://ourword.ai/i/xiang-yu/">项羽</a> — 项羽（楚·前232-前202）——刚。中国历史上最完美的失败者。力拔山兮气盖世，以一己之力推翻了秦朝——这件事刘邦做不到。但他最终输给了一个资质普通的沛县亭长。他的失败不是能力的失败，是认知的失败：他以为战争是强者对弱者的碾压，却不知道刘邦打的是另一种游戏——用人的游戏。</li><li><a href="https://ourword.ai/i/marcus-aurelius/">马可·奥勒留</a> — 马可·奥勒留（罗马·121-180）——克制。罗马皇帝，斯多葛哲学的最高实践者。他是人类历史上权力最大的人之一——罗马帝国皇帝，管辖六千万人，坐拥无限财富。但他每天写的笔记，是提醒自己「不要被权力腐化」的私人日记，从未打算出版。这本笔记后来叫《沉思录》，成为历史上最多领导人随身携带的书。一个手握一切的人，把全部精力用来管控自</li><li><a href="https://ourword.ai/i/machiavelli/">马基雅维利</a> — 马基雅维利（意大利·1469-1527）——现实。文艺复兴时期佛罗伦萨的外交官，《君主论》作者。他不是在教人变坏，他是第一个把政治从道德里剥离出来、单独研究的人。「马基雅维利主义」成了「不择手段」的代名词，但他的原意更复杂：他研究的是权力的真实运作规律，不管你喜不喜欢这些规律，它们都在运作。他的洞察和韩非子跨越两千年高度吻合——</li><li><a href="https://ourword.ai/i/musk/">马斯克</a> — 马斯克（当代·1971-）——第一性原理。PayPal联合创始人，特斯拉、SpaceX、Neuralink、X联合创始人或创始人。他的方法论只有一个：回到物理原点，重新推演一切。别人觉得不可能的事，他先问：物理定律允许吗？如果允许，那「不可能」只是工程问题。</li><li><a href="https://ourword.ai/i/guiguzi/">鬼谷子</a> — 鬼谷子（战国·约前400—前320年）——捭阖之道。战国纵横家的祖师，隐于鬼谷，生平不可考，只留下一部《鬼谷子》。这是中国唯一一部系统讲「如何说服一个具体的人」的典籍——不讲道德该不该，只讲话该怎么开、怎么合、怎么试、怎么锁。历代正统学者斥它为「小人之书」而不断禁毁，它却始终没有失传，因为凡是要靠说话推动别人做事的人，都绕不开它。</li><li><a href="https://ourword.ai/i/bowen/">鲍恩</a> — 鲍恩（1978年·家庭系统理论）——分化。精神科医生，提出家庭系统理论。他关注的核心是「自我分化」——一个人在与亲近的人保持连接的同时，能不能保有独立的思考和情绪。分化低的人被家庭的情绪场裹挟：别人焦虑他就焦虑，为了平息冲突不惜放弃立场。他的另一个重要概念是三角关系：两个人之间张力过大时，会自动拉进第三个人来分散，而这会</li><li><a href="https://ourword.ai/i/huang/">黄仁勋</a> — 黄仁勋（当代·1963-）——押注。英伟达创始人兼CEO，30年没有被赶走。他在2006年做了一个当时看来「浪费资源」的决定：开发CUDA，让GPU可以做通用计算。2023年，ChatGPT爆发，AI需要大量GPU算力，英伟达成为全球最重要的公司之一。他押注了一个能力，等了17年。</li></ul><p><a href="https://ourword.ai/all/">全部条目</a> · <a href="https://ourword.ai/llms.txt">llms.txt</a> · <a href="https://ourword.ai/llms-full.txt">llms-full.txt</a> · <a href="https://ourword.ai/sitemap.xml">sitemap.xml</a> · <a href="https://ourword.ai/feed.xml">feed.xml</a></p><p><a href="https://ourword.ai/">人类世界生存法则</a> · <a href="https://ourword.ai/podcast/">原声</a> · <a href="https://ourword.ai/skill/">品味</a></p></section></noscript><!--GEO:BODY:END-->
