<style>
:root{
  color-scheme:light dark;
  --ink:#0a0a0a; --ink-70:#404040; --ink-50:#666666; --ink-30:#b3b3b3;
  --hairline:#e5e5e5; --surface:#ffffff; --bg:#fafafa; --tint:#f0f0f0; --plate:#ffffff;
  --cta-fill:#0a0a0a; --cta-text:#ffffff;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --fs-micro:10px; --fs-caption:11px; --fs-body:13px; --fs-strong:14px; --fs-heading:16px; --fs-display:20px;
  --h-sm:28px; --h-md:36px; --h-lg:46px;
  --r-block:8px; --r-card:16px;
  --shadow-card:0 1px 2px rgba(10,10,10,.03),0 6px 20px rgba(10,10,10,.06);
  --font:'Inter','Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:var(--fs-strong);line-height:1.65;-webkit-font-smoothing:antialiased}
.caps{letter-spacing:.07em}
.wrap{max-width:680px;margin:0 auto;padding:0 var(--sp-5)}

header{border-bottom:1px solid var(--hairline)}
.bar{display:flex;align-items:center;height:60px;gap:var(--sp-3)}
.glyph{width:20px;height:20px;display:grid;grid-template:repeat(2,1fr)/repeat(2,1fr);flex:none;
  border:1px solid var(--hairline)}
.glyph i{display:block}
.glyph i:nth-child(1),.glyph i:nth-child(4){background:var(--ink)}
.bar h1{margin:0;font-size:var(--fs-heading);font-weight:700;line-height:1}

.masthead{padding:var(--sp-6) 0 var(--sp-5)}
.masthead p{margin:0;font-size:var(--fs-body);color:var(--ink-50);max-width:32em}

.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-4);
  margin-bottom:var(--sp-4);padding-bottom:var(--sp-3);border-bottom:1px solid var(--hairline)}
.sechead h2{margin:0;font-size:var(--fs-heading);font-weight:700}
.sechead span{font-size:var(--fs-caption);color:var(--ink-50);font-weight:700;font-variant-numeric:tabular-nums}

.index{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:var(--sp-4)}
.item{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4);border-radius:var(--r-block);
  text-decoration:none;color:inherit;transition:background .18s ease-out,transform .18s ease-out}
.item+.item{margin-top:var(--sp-2)}
.item:hover{background:var(--tint)}
.item:active{transform:scale(.985)}
.item:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.item .ico{width:var(--h-md);height:var(--h-md);flex:none;border-radius:var(--r-block);
  background:var(--plate);display:grid;place-items:center}
.item .ico svg{display:block;width:28px;height:28px}
.item .body{flex:1;min-width:0}
.item h3{margin:0 0 2px;font-size:var(--fs-strong);font-weight:700}
.item p{margin:0;font-size:var(--fs-body);color:var(--ink-50)}
.item .go{flex:none;color:var(--ink-50);font-size:var(--fs-heading);line-height:1}
.item:hover .go{color:var(--ink)}

.aside{margin-top:var(--sp-5);font-size:var(--fs-body);color:var(--ink-50)}

footer{border-top:1px solid var(--hairline);margin-top:var(--sp-6);padding:var(--sp-5) 0 var(--sp-6)}
.foot{font-size:var(--fs-caption);color:var(--ink-50)}

@media (prefers-color-scheme:dark){
  :root{
    --ink:#f2f2f2; --ink-70:#c4c4c4; --ink-50:#9a9a9a; --ink-30:#5a5a5a;
    --hairline:#2a2a2a; --surface:#161616; --bg:#0d0d0d; --tint:#232323; --plate:#e6e6e6;
    --cta-fill:#f2f2f2; --cta-text:#0d0d0d;
    --shadow-card:0 0 0 1px var(--hairline);
  }
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
