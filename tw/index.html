story:"格拉西安的一生本身就是這本書的註腳。他是耶穌會神父，而教團明令禁止會士未經許可出版世俗著作。他用哥哥的名字做筆名，把書一本一本偷偷印出來。上級幾次警告，他沒有停。1651年他匿名出版《批評家》第一部，教團震怒，最終在1658年將他撤職、流放到偏遠小鎮、禁止他使用紙筆——他當年就去世了，58歲。一個寫下三百條「藏鋒」「慎言」「不要把底牌打完」的人，最後恰恰死於自己沒藏住。這不削弱這本書，反而說明了它為什麼值得讀：格拉西安太清楚代價了，因為他自己付過。",
f:[{n:"藏鋒",d:"「不要把底牌一次打完。」格拉西安反覆講同一件事：已知的能力會貶值，未知的能力才有威懾。永遠保留一點餘量，讓人猜不透你的深淺。這不是虛偽，是不把自己變成一個可以被算盡的量。",eg:"職場上把一次交付做到120分的人，從那天起就被按120分要求了，而且沒有人再記得那是超額完成。"},{n:"藏起努力的痕跡",d:"技藝的最高境界是掩蓋技藝。刻意的努力痕跡會削弱成果本身的分量——他用了一個詞叫 despejo，指的是那種舉重若輕的從容。今天的版本是：反覆強調自己多辛苦的人，往往被默認能力不足。"},{n:"借他人之手",d:"好消息親自宣布，壞消息讓別人傳達；榮譽自己收，責難由中介吸收。這一條讀起來很像厚黑學，但格拉西安的理由是實用的：一個人的位置一旦被消耗在瑣碎的對抗上，就再沒有餘力去做真正重要的事。"},{n:"慎交",d:"與優秀者為伍，你會被抬高；與愚者為伍，光是解釋就會吃掉你全部的時間。他有一條很狠的識人法：看一個人如何對待與他毫無利害關係的人，就知道他將來會怎麼對待你。"},{n:"見好就收",d:"「在運氣正盛時退場。」賭徒和名聲都毀在最後一把。所有人記住的是你最後一次的樣子，而不是最好那一次。這一條與范蠡、張良、王翦的選擇完全同構——東西方在完全沒有交流的情況下，得出了同一個結論。"},{n:"不與蠢人爭勝",d:"贏了沒有任何增量，輸了成本極高，而且旁觀者往往分不清誰是誰。對無理最有力的回應是沉默。這一條在今天的對應場景是：群裡、評論區、會議上那個你很想反駁的人。"},{n:"每個人都有一個把手",d:"他說每個人身上都有一個 asa（把手），抓住它就能推動他：有人是虛榮，有人是恐懼，有人是渴望被認可，有人是怕麻煩。這一條最接近現代的《影響力》，只是早了三百多年，也冷得多——西奧迪尼用實驗去驗證，格拉西安靠觀察就寫了出來。"}],
q:["讓人對你有所期待，勝過讓人看清你的底。","在運氣正盛的時候退場——所有的賭徒和所有的名聲，都毀在最後一把。","不要把話說盡，也不要把事做絕：留下退路，是智者最後的體面。","凡事都有一個把手，抓住對的那一個，就能推動任何人。","第一流的能力，是知道什麼時候不用它。","寧可與聰明人為敵，不與愚人為友。"],
apply:"挑一條最反你直覺的先用：不要在一次交付裡把全部實力都放出來。這不是讓你偷懶，是讓你區分「完成任務」和「消耗底牌」——把最好的那20%留給真正決定位置的那一次。第二條可以立刻用的：下次你被激怒、想在群裡或會上爭贏某個人時，先問自己贏了能得到什麼。格拉西安的答案是，贏了什麼都得不到，輸了失去全部，而圍觀的人只會記得你爭過。第三條留到年底再看：你現在做得最順的那件事，退場的時機可能比你以為的要早。",
l:["馬基雅維利","曾國藩","影響力","范蠡","馮道"],contrast:[{"n": "馬基雅維利", "why": "同一個時代問題的兩個層級：馬基雅維利教君主如何對付國家，格拉西安教沒有權力的個人如何在權力場裡自保"}, {"n": "曾國藩", "why": "東西方兩套修身術：曾國藩靠日課與拙誠往內修，格拉西安靠分寸與藏鋒往外應——一個求無愧，一個求無損"}, {"n": "影響力", "why": "相隔三百多年的同一門學問：格拉西安憑觀察寫下人性的「把手」，西奧迪尼用實驗把它變成六條可驗證的原理"}]},

{c:"世界如何運轉",n:"國家為什麼會失敗",e:"美國·2012年",w:"制度決定論",y:2012,
d:"達龍·阿西莫格魯與詹姆斯·羅賓遜2012年出版。核心論點極其簡潔：國家的貧富不取決於地理、氣候、文化，也不取決於領導人聰不聰明，只取決於制度是「包容性」還是「攫取性」。2024年，兩位作者與西蒙·約翰遜因這一系列關於制度與繁榮的研究，獲得諾貝爾經濟學獎。這本書最大的價值不在結論，在它提供的那把刀——它可以一層層往下切：國家、行業、公司、團隊。",
story:"全書從一張照片開始。諾加萊斯這座城市被美墨邊境線一分為二。北邊屬於亞利桑那州，家庭年收入約3萬美元，孩子上公立學校，供電和自來水穩定，警察大體守法。南邊屬於索諾拉州，收入不到北邊的三分之一，多數成年人沒讀完高中，嬰兒死亡率高，做生意要先過一道賄賂。兩邊的地理相同、氣候相同、祖先相同、食物相同、疾病環境相同——很多人還是親戚。唯一的差別是他們腳下這條線屬於哪一套制度。這張照片把地理決定論和文化決定論一次性排除掉了。",
f:[{n:"包容性制度 vs 攫取性制度",d:"包容性制度有三個要件：產權安全、法律對所有人一視同仁、公共服務提供一個人人可參與的競技場。攫取性制度則是少數精英用權力把多數人創造的價值抽走。判斷標準其實只有一條——創造價值的人，能不能留下他創造的東西。",eg:"公司版本：期權是不是真能兌現、晉升看不看結果、關鍵信息是不是只在少數人手裡。這三條決定了聰明人會不會留下來。"},{n:"創造性破壞是分水嶺",d:"攫取性制度天然反對創新，因為創新會重新洗牌，威脅現有精英的位置。1589年英國女王拒絕給織襪機發明人授予專利，理由是會讓手工織工失業；奧匈帝國和俄國的統治者曾阻撓修鐵路，因為它會帶來社會流動。不是他們不懂技術的好處，是他們太懂了。"},{n:"攫取性制度也能高速增長，但會撞牆",d:"蘇聯1928到1970年增速驚人，因為把資源從低效農業強行調配到工業——這種「配置型增長」可以持續幾十年。但它到不了下一個階段，因為下一階段依靠的是創新，而創新需要的恰恰是攫取性制度不敢給的東西。所有攫取性增長都有一個可以預測的天花板。",eg:"公司裡靠管理紅利、渠道紅利、人口紅利的增長同理：能吃很久，但吃完那天所需要的能力，和現在這套完全不同。"},{n:"關鍵節點 × 制度漂移",d:"歷史不是決定論。黑死病、大西洋貿易、工業革命這類「關鍵節點」到來時，各國之間原本極其微小的制度差異，會被急劇放大成完全不同的路徑。小差異加一次衝擊，等於巨大分叉——這是他們對「為什麼是英國而不是西班牙」的回答。"},{n:"惡性循環與良性循環",d:"攫取性制度會自我複製：推翻舊精英的人接手了同一套機器，很快就變成新的攫取者，他們稱之為「寡頭統治鐵律」。包容性制度同樣會自我強化：權力足夠分散，下一次侵權就更難得逞。結論很硬——換人不改制度，等於什麼都沒發生。"},{n:"政治先於經濟",d:"好的經濟政策其實不難設計，難的是讓掌權者願意執行一套會削弱自己的政策。所以這本書真正的落點不是經濟學，是政治權力的分配方式。任何繞過這一層去談改革的方案，都是在談技術細節。"}],
q:["國家之所以失敗，是因為攫取性制度無法創造激勵，讓人們去儲蓄、投資和創新。","創造性破壞重新分配的不只是收入和財富，還有政治權力——這才是它真正被抵制的原因。","繁榮的根源不是自然資源、地理位置或文化傳統，而是制度。","貧窮不是因為不知道該怎麼做，而是因為掌權者不願意那樣做。"],
apply:"把這套框架用到你所在的組織上，只問三個問題：一、創造價值的人能不能拿到他創造的那一份？二、規則對所有人是不是一樣，還是有人可以豁免？三、新的做法出現時，是被鼓勵，還是被現有既得利益壓下去？三個問題裡有兩個答「否」，這就是一個攫取性組織——它可能仍在高速增長，但那多半是配置型增長，別把它誤讀成能力。個人層面的推論更實用：你決定加入一個組織時，該看的不是它現在多賺錢，而是它屬於哪一類制度，因為攫取性組織的天花板是可以提前算出來的。",
l:["國富論","舊制度與大革命","商鞅","人類簡史","技術革命與金融資本"],contrast:[{"n": "國富論", "why": "亞當·斯密說市場自己會運轉，本書說市場需要一整套制度先托住它——兩百多年後對同一個問題的補全"}, {"n": "舊制度與大革命", "why": "托克維爾記錄了一個攫取性制度崩潰的全過程，本書給出了它為什麼必然崩潰的模型"}, {"n": "人類簡史", "why": "都在解釋人類為何走到今天：赫拉利歸因於虛構故事帶來的大規模協作，本書歸因於制度提供的激勵結構"}]},

{c:"權力與組織",n:"李光耀",e:"新加坡·1923-2015",w:"生存現實主義",y:1923,
d:"1965年，新加坡被馬來西亞「開除」出聯邦，被迫獨立。這是一座沒有腹地、沒有淡水、沒有資源、人口兩百萬、族群剛發生過暴亂、周邊強鄰環伺的城市。李光耀在電視上宣布獨立時當場落淚。三十多年後他交棒時，新加坡的人均GDP超過了它昔日的宗主國英國。知識庫裡的治理者幾乎全是大國統治者，李光耀是唯一一個從「弱到幾乎不該存在」開始的樣本——這也是絕大多數人和公司真實的起點。",
story:"獨立當天的記者會上，李光耀哽咽到中斷了二十分鐘。事後他解釋那不是軟弱：當時新加坡約四分之三的淡水靠馬來西亞供應，一根管子就能掐死整個國家。他上任後做的第一批事情裡，有一件看起來毫不緊急——用幾十年時間建海水淡化和新生水系統，直到水源基本自給。有人問他，那麼多急事，為什麼先做這個。他的回答是：別人能一句話決定你死活的地方，就是你唯一真正的戰略問題。",
f:[{n:"先解決被掐脖子的地方",d:"弱勢方的戰略排序不按緊急程度排，按「誰能一句話決定我死活」排。水、防務、國際承認，這三件事新加坡在最窮的時候就往裡砸錢，而不是等有錢了再說。",eg:"個人版本：你的收入是不是只來自一個客戶、一個平臺、一個老闆？那不叫效率高，那叫別人手裡握著你的水管。"},{n:"融入魚群的小魚",d:"平衡外交的實質：與美國友好但不結盟，與中國交往但不倒向，主動引入多方力量在本地區存在，讓任何一方都無法單獨擺布你。他的邏輯是——只要一個地區有兩個以上大國在競爭，小國就有了合縱連橫的空間；最危險的局面不是被大國欺負，是這個地區最後只剩一個大國。"},{n:"生存優先於意識形態",d:"「我從不被理論指導，我只問一件事：這行得通嗎？」新加坡的政策組合在任何一種主義裡都不自洽：極度開放的市場，加上極強的政府幹預（組屋覆蓋八成人口），加上強制儲蓄（公積金），加上嚴刑峻法。他拒絕在「資本主義還是社會主義」上站隊，只按結果調參數。"},{n:"不要依賴人性高尚",d:"部長薪水對標頂級私企，同時對貪腐零容忍——他的老友、國家發展部長鄭章遠涉貪，李光耀拒絕見他，鄭最終自殺。這兩件事是同一條邏輯的兩面：不要設計一套需要人性高尚才能運轉的制度，要讓廉潔成為理性選擇。",eg:"他的原話是：如果你付花生米的工資，你請到的就是猴子。"},{n:"共識是設計出來的",d:"一個華人、馬來人、印度人混居、且剛剛發生過種族暴亂的社會，他不指望自然融合：組屋按族群比例強制混住，英語被定為共同工作語言（一個誰都不佔便宜的中立選擇），同時雙語教育保住各自母語。凝聚力在他這裡不是一種氣氛，是一組可執行的政策。"},{n:"長期主義的具體形態",d:"種樹、治水、建組屋、雙語教育，全是二三十年才見效的事。他反覆說自己不在乎民調，在乎的是三十年後新加坡還在不在。這意味著長期主義從來不是一句表態，而是願意在自己的任期內承擔罵名。"}],
q:["我從不被理論指導。我只問一個問題：這行得通嗎？","如果你付花生米的工資，你請到的就只能是猴子。","我們是一條必須融入魚群的小魚。","在被愛戴和被畏懼之間，我一直認為馬基雅維利是對的——如果沒有人怕我，我就毫無意義。","我不在乎民調，我在乎的是三十年後這個國家還在不在。"],
apply:"弱勢方的第一課不是怎麼變強，而是先數清楚有幾根管子握在別人手裡：單一客戶、單一平臺、單一收入來源、單一能簽字的人。把其中最粗的那根，用三年時間換成兩根——哪怕短期看成本更高、效率更低。第二課是別急著表忠心：在兩個強勢方之間，與兩邊都保持有用的關係，比早早倒向一邊安全得多，因為一旦你只剩一個選項，議價權就歸零了。第三課最難：真正重要的事在任期內往往看不到成果，你得提前想清楚，怎麼熬過那段沒有結果、還要被質疑的日子。",
l:["管仲","商鞅","國家為什麼會失敗","馬基雅維利","任正非"],contrast:[{"n": "管仲", "why": "兩個從零開始建設小國的操盤手，相隔2600年：管仲靠通商與輕重之術，李光耀靠制度設計與外交平衡"}, {"n": "馬基雅維利", "why": "李光耀公開承認自己站在馬基雅維利那一邊——難得能看到一套理論與一個完整的執政人生互相印證"}, {"n": "國家為什麼會失敗", "why": "該書主張包容性政治制度是持續繁榮的前提，新加坡是它最著名的反例——理論與反例放在一起讀，比只讀理論有用得多"}],
fail:"李光耀留下的爭議同樣具體：長期用誹謗訴訟讓反對派政治人物破產出局，媒體高度受控，1987年「光譜行動」未經審判拘押多名社運人士。他晚年也承認1983年的「婚配優生」政策——鼓勵高學歷女性多生育、勸低學歷女性絕育——在科學和倫理上都站不住，是他最大的政策錯誤之一。此外，半個世紀的強父長式管治，讓新加坡社會習慣了被安排，公民自組織能力偏弱，這一點連他的繼任者都公開談過。",
lesson:["高效常常是用糾錯機制換來的。當決策者一直正確時沒人看得出問題，代價會在他判斷失誤的那一次一次性支付。","「我做的每件事都是為了大家好」是最難反駁、也最需要警惕的一種正當性。","把一切都安排好的組織，會培養出不會自己安排的人——這是家長式管理遲早要付的賬單。"]},

{c:"謀略與競爭",n:"約翰·博伊德",e:"美國·1927-1997",w:"節奏優勢",y:1927,
d:"美國空軍上校，外號「四十秒博伊德」——他曾公開下戰書：任何飛行員，我從劣勢位置起飛，四十秒之內咬到你尾後，做不到賠你40美元。據說無人贏過。他一生沒當上將軍，沒出版過一本書（全部思想留在一份叫《制勝與失敗》的講稿裡），卻重塑了美國戰鬥機的設計標準（F-15、F-16、A-10都受他的能量機動理論影響）、1991年海灣戰爭的作戰思想，並且把OODA循環送進了商業、創業和一切競爭領域。",
story:"博伊德最初困惑於一個反常的數據：朝鮮戰爭中，美軍F-86對蘇制米格-15的交換比接近10比1，但米格-15爬升更快、升限更高、火力更猛——按紙面參數該贏的是它。博伊德花了幾年找答案，結論出人意料：F-86有全景座艙蓋（看得更全）和液壓助力操縱（換動作更快）。美軍飛行員的單個動作未必佔優，但他能更快地完成「觀察—判斷—決策—行動」這一整圈，然後立刻進入下一圈。幾十個回合下來，米格飛行員永遠在應對一個已經過去的局面，最後自己亂掉。贏的不是更強的飛機，是循環更快的飛機。",
f:[{n:"OODA 循環",d:"觀察（Observe）→ 判斷定向（Orient）→ 決策（Decide）→ 行動（Act），然後立刻回到觀察。競爭的本質不是比誰單次做得更好，而是比誰把這一圈跑得更快。當你的循環快過對手，他的每一次反應都在解決一個已經不存在的問題——最終他不是被打敗的，是自己崩潰的。"},{n:"Orient 才是核心",d:"大多數人以為OODA的重點在「快」，博伊德說重點在第二步「定向」。定向由你的文化背景、既往經驗、現有分析模型共同決定，它是一副你摘不下來的眼鏡。同樣一份數據，兩個人的定向不同，會得出完全相反的結論。所以真功夫不在收集更多信息，在持續拆掉自己舊的解釋框架。",eg:"諾基亞看到了iPhone的銷量數據，而且看得很清楚。但它的「定向」裡手機的定義是通訊設備，於是那份數據被解讀成一個高價小眾品類。"},{n:"破壞對手的定向",d:"更高階的用法不是自己更快，而是往對手的定向環節裡灌進模糊、欺騙和不斷變化的信號，讓他的判斷過載。博伊德晚年把OODA從一套空戰戰術升格為一種戰略：目標不是消滅對手，是讓他在精神上癱瘓。",eg:"商業上的對應動作：不斷變換進攻的維度（價格→渠道→產品形態→組織方式），讓對手每次都要重新開會定義「我們到底在跟誰打」。"},{n:"能量機動理論",d:"他用一個可計算的指標（單位剩餘功率）取代了飛行員之間憑直覺的爭論，第一次讓「哪架飛機在哪個高度和速度下真正佔優」變成一張能畫出來的圖。這件事的方法論價值大於軍事價值：把一個人人憑感覺爭論的問題變成可量化比較的模型，本身就是最大的戰略優勢。"},{n:"快不等於草率",d:"他的完整表述是「更快的節奏」（tempo），指的是決策與行動的週期更短，並且能不規則地變速。忽快忽慢比一味求快更致命，因為對手無法對你建立任何預期——可預測本身就是一種脆弱。"},{n:"To be, or to do",d:"他給每一個年輕軍官講同一個選擇：你可以選擇「成為某個人」（升官、進圈子、被認可），也可以選擇「做成某件事」（推動真正的改變，代價是得罪所有擋路的人）。這兩條路在某個岔口一定會分開，你不能都要。他選了後者，一輩子被排擠，退休時軍銜仍是上校，而他的思想活到了今天。"}],
q:["機器不打仗，地形不打仗。人打仗。你必須進入人的頭腦裡去。","你可以選擇成為某個人，也可以選擇做成某件事。總有一天，你必須在這兩條路之間選一條。","混亂、無序和不確定，不是要消除的東西——是要製造出來送給對手的東西。","如果你的循環快過對手，那麼他做的每一個反應，都是在應對一個已經消失的世界。"],
apply:"把「我們做得對不對」換成「我們跑一圈要多久」。具體做法：給團隊的核心閉環計時——從看到一個用戶反饋，到判斷、決策、上線，一共幾天？先別談優化質量，先把這個數字砍掉一半，你會發現質量自己會上來，因為試錯的次數變多了。第二件事更重要：定期檢查你的「定向」。每個季度問一次——我們對這個市場的基本假設是什麼時候形成的，現在還成立嗎？絕大多數潰敗不是因為看不到信號，是因為在用一副過時的眼鏡看新信號。最後是那個不輕鬆的問題：眼下這件事，你是想「成為某個人」，還是想「做成某件事」？兩個答案會導向完全不同的日常選擇。",
l:["孫子兵法","戰爭論","張一鳴","毛澤東","托馬斯·謝林"],contrast:[{"n": "戰爭論", "why": "克勞塞維茨說戰爭的本質是摩擦與不確定，博伊德說：那就別費勁消除它，把它做成武器送給對手"}, {"n": "孫子兵法", "why": "「兵無常勢，水無常形」與OODA的變速節奏是同一個洞察，相隔2400年——孫子給出結論，博伊德給出機制"}, {"n": "張一鳴", "why": "字節的高頻迭代與A/B測試，本質是OODA循環的商業工業化版本——把決策週期壓到最短"}]},
{c:"識人與相處",n:"鬼谷子",e:"戰國·約前400—前320年",w:"捭闔之道",y:-400,d:"戰國縱橫家的祖師，隱於鬼谷，生平不可考，只留下一部《鬼谷子》。這是中國唯一一部系統講「如何說服一個具體的人」的典籍——不講道德該不該，只講話該怎麼開、怎麼合、怎麼試、怎麼鎖。歷代正統學者斥它為「小人之書」而不斷禁燬，它卻始終沒有失傳，因為凡是要靠說話推動別人做事的人，都繞不開它。",story:"相傳蘇秦、張儀同出鬼谷門下。學成之後，蘇秦推「合縱」，聯六國抗秦；張儀推「連橫」，拆六國事秦。一個師門教出兩個立場完全相反的人，各自佩相印，鬥了半輩子。後世常拿這件事譏諷鬼谷子沒有立場——但這恰恰是《鬼谷子》的本意：捭與闔、縱與橫，本來就是同一套技術的兩面，方向由局勢決定，不由技術決定。（馬王堆帛書出土後，學界已確認蘇秦晚於張儀，兩人同門對辯多半是漢代人的追述；但這個故事之所以流傳兩千年，是因為它準確地說出了這門學問的性質。）",f:[{n:"捭闔：開與合的節奏",d:"「捭者，開也、言也、陽也；闔者，閉也、默也、陰也。」說與不說是一對武器，而不是一個默認狀態。該開的時候把信息、姿態、誠意放出去，該合的時候一個字都不給。多數人的問題不是不會說，是不會停。",eg:"談判裡最貴的一句話往往是報完價之後的沉默。先開口解釋的一方，等於自己把剛才的報價打了折。"},{n:"反應：讓對方多說",d:"「欲聞其聲反默，欲張反斂。」想聽對方說，自己先閉嘴；想讓對方展開，自己先收。用「象比」（拋出一個類比或假設）當餌，看對方怎麼接——他接的方式，比他說的內容信息量大得多。",eg:"面試裡最有效的不是提問，是在對方答完後停三秒。八成的人會自己補充剛才沒說的那一層。"},{n:"揣摩：先量權，再揣情",d:"「揣情量權」是兩個動作。量權是算對方的硬條件——資源、位置、退路；揣情是摸對方真正想要和真正怕的。摩是拿小的試探去驗證你的判斷。三步走完再提方案，方案才有落點。",eg:"先做盡調再談條款，和先談條款再做盡調，是完全不同的兩筆生意。後者往往是在為一個自己都沒驗證過的假設爭價格。"},{n:"飛箝：先抬起來，再鎖住",d:"「飛」是引其言、稱其能，把對方托到一個位置上；「箝」是在這個位置上把話鎖死。人一旦接受了某個身份，就會自動維護它。這是《影響力》裡「承諾與一致」早了兩千三百年的版本。",eg:"「以您在這個行業的判斷力，應該早就看出這塊的問題了吧」——對方一旦點頭，後面的方案就變成了他自己的推論。"},{n:"內揵：結在對方的訴求上",d:"「內者，進說辭也；揵者，揵所謀也。」你的主張必須掛在對方本來就想要的東西上，才站得穩。掛在你自己的需求上，說得再對也是外物。"},{n:"制人而不見制於人",d:"「事貴制人，而不貴見制於人。制人者握權也，見制於人者制命也。」全書的落點：所有技術都是為了掌握主動權。誰定義議題、誰設定節奏、誰決定什麼時候結束，誰就握著這一局。"}],q:["口者，心之門戶也；心者，神之主也。","與智者言依於博，與拙者言依於辨，與辨者言依於要，與貴者言依於勢。","事貴制人，而不貴見制於人。","故知之始己，自知而後知人也。"],apply:"彙報、談判、銷售、募資，本質都是「讓一個具體的人改變立場」。可用的順序是：先量權（他手裡有什麼、退路在哪），再揣情（他真正怕什麼），然後用提問讓他多說，最後把你的方案掛到他自己的訴求上。全程管住一件事——不要在對方開口之前把自己的底放完。",l:["戰國策","韓非子","影響力","智慧書","張良"],contrast:[{n:"影響力",why:"同一批人性開關，西塞奧迪尼做的是實驗和防禦，鬼谷子做的是操作手冊——一個教你識別，一個教你使用"},{n:"蘇格拉底",why:"兩人都靠提問推動對方，蘇格拉底提問是為了逼近真相，鬼谷子提問是為了取得主動權"},{n:"論語",why:"孔子問的是「該不該說」，鬼谷子只問「怎麼說才有用」——中國思想裡公開的一面和被壓著的一面"}]},
{c:"識人與相處",n:"拉羅什富科",e:"法國·1613—1680年",w:"美德常是偽裝的惡德",y:1613,d:"法國公爵，投石黨運動的失敗者。半生卷在貴族政變裡，輸光了政治前途和一隻眼睛的視力，退隱之後在沙龍里寫下 641 條《箴言集》。他被稱為「人心的解剖者」：把慷慨、忠誠、謙遜、同情逐條拆開，發現底下坐著同一個東西——自愛（amour-propre）。這不是憤世嫉俗，是一個從內部看過那個圈子的人，拒絕再自欺。",story:"1652 年聖安托萬門之戰，他被火槍擊中面部，一度雙目失明。此前他已經在幾次政變裡站錯了隊，家族封地被削，政治生命結束。視力恢復後他不再回宮廷，轉而進入沙龍。有意思的是，他解剖的第一個對象是自己：《箴言集》最早的手稿裡有一篇長文專寫「自愛」，說它「像變色龍一樣善變，它活在一切之中，也活在虛無之中」。他寫的所有貴族的虛偽，都是他自己二十年間親身演過的。這就是為什麼這本書刻薄而不輕佻——它是一份供詞，不是一份指控。",f:[{n:"自愛是全部動機的底座",d:"「自愛是世上最大的諂媚者。」它不斷向你彙報你是個什麼樣的人，而彙報內容永遠對你有利。你以為的原則、品味、判斷，多數只是自愛替你挑好的說法。",eg:"復盤時把「我當時是為了團隊」換成「我當時想被看成為了團隊的人」，很多決策會立刻顯出另一副樣子。"},{n:"美德是偽裝得體的惡德",d:"「我們的美德常常只是偽裝起來的惡德。」慷慨可能是野心的支出，謙遜可能是求讚的迂迴路線，寬容可能只是懶得糾纏。他不是說美德不存在，是說別用行為反推動機。",eg:"一個人一貫大方，只說明大方對他划算；環境一變，划算的方向就變了。看結構，不要看人品。"},{n:"同情的不對稱",d:"「我們都有足夠的力量去忍受別人的不幸。」最冷也最難反駁的一條。它解釋了為什麼安慰總是顯得輕飄，也解釋了為什麼真正的支持稀缺——因為它要求人付出自己並不需要付出的代價。"},{n:"拒絕讚美是二次索取",d:"「拒絕讚美，其實是想被讚美第二次。」很多看起來是退讓的動作，本質是加價。識別它的方法很簡單：看這個動作有沒有給對方留下必須回應的空位。"},{n:"激情不會消失，只會換對象",d:"人老了不是慾望沒了，是慾望換了更安全的形式——從愛情換成體面，從野心換成對晚輩的安排。以為自己看開了的人，多數只是換了賽道。"},{n:"我們從不為自己以為的理由做事",d:"整本書的方法論：先假定給出的理由是事後編的，再去找那個不方便說出口的理由。這條對讀別人有效，對讀自己更有效。"}],q:["我們的美德常常只是偽裝起來的惡德。","我們都有足夠的力量去忍受別人的不幸。","拒絕讚美，其實是想被讚美第二次。","自愛是世上最大的諂媚者，它比世上最巧妙的人還要巧妙。","==我們承認小缺點，是為了讓人相信我們沒有大毛病。==","老年人愛給忠告，因為已經不能再樹立壞榜樣了。"],apply:"用在兩個地方。對內：任何一次自我辯解成立得太順暢的時候停一下，問「這個理由是不是剛好讓我很舒服」。對外：判斷合作方不要看他說的動機，看這件事對他劃不划算，以及環境變化後還劃不划算——把善意當結構來驗證，而不是當品質來相信。",l:["智慧書","馬基雅維利","影響力","尼采","思考，快與慢"],contrast:[{n:"智慧書",why:"同為箴言體，格拉西安教你在這個世界怎麼活下去，拉羅什富科只負責告訴你別騙自己——一個給方法，一個拆幻覺"},{n:"富蘭克林",why:"富蘭克林相信美德可以靠表格練成，拉羅什富科認為練成的只是美德的樣子。兩人可以對照著讀一整年"},{n:"論語",why:"孔子相信修身能通向仁，拉羅什富科懷疑修身只是自愛找到的更高級的形式"}]},
{c:"創業與產品",n:"保羅·格雷厄姆",e:"美國·1964年—",w:"做不可規模化的事",y:1964,d:"Lisp 黑客，1995 年做出 Viaweb——世界上第一個跑在瀏覽器裡的商用軟件，1998 年賣給雅虎。2005 年和幾個人辦了 Y Combinator，用「一次投一批、給小錢、給三個月」的方式重寫了早期投資的形態，Airbnb、Stripe、Dropbox 都從這裡出來。他真正的影響力在幾百篇 essay 裡：幾乎所有今天被當成創業常識的東西，都能在其中找到最早也最清楚的那一次表述。",story:"Airbnb 在 YC 的時候數據一直不動。格雷厄姆問他們用戶在哪，答：紐約。他說：那你們為什麼在這兒？去紐約，一家一家上門。創始人真的飛去紐約，挨家敲門，借了一臺相機替房東重拍房源照片——純手工，完全不可複製，一週只能覆蓋幾十個房源。照片換完之後，紐約的訂單翻了一倍多。這件事本身沒有任何技術含量，也永遠無法規模化，但它是 Airbnb 拿到的第一條真實增長曲線。格雷厄姆後來把它寫成了那篇《Do Things That Don't Scale》：創業者總想先搭好一個能自動增長的機器，但在你確認有人真的想要之前，那臺機器只是一個昂貴的假設。",f:[{n:"做不可規模化的事",d:"早期手動招募用戶，一個一個地找、一個一個地伺候。這個階段的低效不是浪費，它是唯一能讓你近距離看見用戶為什麼要、以及為什麼不要的方式。",eg:"Stripe 的做法叫「Collison 安裝法」：用戶說有興趣，創始人當場說「給我你的電腦」，直接幫他把代碼接上，而不是發一份文檔過去。"},{n:"做人們想要的東西",d:"YC 的牆上只有這一句。他的判斷是：殺死創業公司的錯誤說到底只有一個——做了沒有人真正想要的東西。其餘所有問題都是可以修的。",eg:"融資順利、團隊豪華、發布會漂亮，都無法補償這一條；反過來，只要這一條成立，其餘大部分錯誤都還有時間改。"},{n:"好想法的三個特徵",d:"自己就想要、自己有能力做、而且很少有人意識到它值得做。三條缺一條都危險：不是自己想要就沒法判斷細節，做不了就只能空想，別人都覺得值得做就已經太擠了。"},{n:"Schlep blindness：對麻煩的選擇性失明",d:"最好的機會常常藏在看起來又髒又煩的事情後面——對接銀行、跑合規、處理退款。人的大腦會自動跳過這類想法，跳過得如此之快，以至於你根本沒意識到自己跳過了。",eg:"支付、報稅、醫保結算這些領域長期沒人碰，不是因為難想，是因為一想到要處理的瑣事，腦子就自動換臺了。"},{n:"創造者時間表 vs 管理者時間表",d:"管理者按小時切分，創造者需要整塊。一個下午插進一個會，損失的不是那一小時，是整個下午——因為剩下的兩段都不夠長到進入狀態。"},{n:"寧可少數人愛，不要多數人還行",d:"一百個愛你的用戶，比一萬個覺得還行的用戶有價值得多。前者會告訴你為什麼愛、會替你傳播、會容忍你的粗糙；後者只會安靜地消失，什麼都不留下。"}],q:["創業只有一個致命錯誤：做了沒有人想要的東西。","先去做那些無法規模化的事，這是通往規模的唯一路徑。","與其讓很多人有點喜歡你，不如讓很少的人非常愛你。","最好的創業想法是：你自己想要、你自己能做，而別人沒意識到它值得做。","一個會議，可以毀掉一整個下午。"],apply:"冷啟動階段不要建渠道、不要投放、不要先做自動化，去手工找到前一百個用戶並逐個服務到滿意；只有當你被手工伺候的工作量壓垮時，才說明該做規模化了。判斷一個想法的時候先過三道題：我自己要不要用、我做不做得出來、為什麼現在還沒人做——第三題答不上來，多半是它沒那麼值得做，或者你還沒看見那堆麻煩。",l:["彼得·蒂爾","納瓦爾","貝索斯","王興","喬布斯"],contrast:[{n:"彼得·蒂爾",why:"同為硅谷思想源頭，蒂爾從「找到一個別人不同意的秘密、直奔壟斷」起手，格雷厄姆從「找到一百個愛你的用戶、慢慢長」起手"},{n:"創新者的窘境",why:"克里斯坦森說別只聽最好的客戶的，格雷厄姆說早期要拼命貼著少數用戶聽——不矛盾，是在講公司生命週期的兩端"},{n:"馬斯克",why:"馬斯克從物理約束往下推，格雷厄姆從用戶反饋往上長。兩條路都通，但混著用通常兩頭不靠"}]},
{c:"創業與產品",n:"松下幸之助",e:"日本·1894—1989年",w:"自來水哲學",y:1894,d:"9 歲輟學做學徒，23 歲帶著兩個人在自家做雙燈用插座，最後做出松下電器，被日本人稱為「經營之神」。他的價值不在於把公司做多大，而在於他是第一個把「企業為什麼存在」當成經營技術來回答的人：使命定得對，組織和產品會自己長出來；使命定不對，效率越高越危險。今天講的使命願景、事業部制、透明管理、現金冗餘，源頭多數在他這裡。",story:"1929 年大蕭條，松下銷售腰斬，倉庫堆滿，他本人正病著。兩位幹部拿著方案進來：裁掉一半員工。他在病榻上給了另一個答案——一個人不裁，工資全額照發，但生產立刻減半，工人上半天班，下半天全體出去賣庫存。兩個月，庫存清空，全線復產，一個人沒走。這件事後來被反覆引用為「人本經營」的樣板，但它真正的前提是他早就準備好的另一樣東西：現金。沒有餘量的公司做不了這個選擇，只能裁人。他把這套準備叫「水庫式經營」。",f:[{n:"自來水哲學",d:"1932 年他看見路邊有人擰開自來水管喝水，沒人阻止——水是有價的，但因為多到近乎無限，便宜到不構成偷竊。他由此定下松下的使命：把生活物資做到像自來水一樣取之不盡、價格低廉，以此消除貧困。他把這一天定為松下的「創業命知元年」。",eg:"使命一旦這樣定死，所有關於要不要降價、要不要走量的爭論都自動有了答案——不需要每次重新討論一遍。"},{n:"水庫式經營",d:"河上修水庫是為了蓄水調流，企業也要在資金、設備、庫存、人才上各修一座水庫，留出用不到的餘量。景氣時它看起來是浪費，不景氣時它是唯一讓你還能做選擇的東西。",eg:"一次演講後有聽眾問「怎麼才能有水庫」，松下答：「首先，你得真心想要有。」全場鬨笑，只有臺下的稻盛和夫像被電到——他後來說，這一句改變了他的一生。"},{n:"玻璃式經營",d:"財務和經營信息對內公開，像玻璃一樣看得見。它帶來的不是感動，是判斷力：知道數字的人才可能做對決策，不知道數字的人只能執行。"},{n:"造人先於造物",d:"「松下電器是製造人才的公司，兼做電器生意。」這句話被無數公司抄成標語，但他是當真的——他把培養判斷力當成主產品，把電器當成副產品。"},{n:"事業部制",d:"1933 年他首創事業部制，讓每個產品線獨立核算、自負盈虧。目的不是效率，是讓儘可能多的人在真實的損益表前面練習做決定。現代 BU 制、阿米巴、內部創業都是這條線下來的。"},{n:"三個恩惠",d:"他說自己有三樣運氣：家貧，所以從小知道錢怎麼來；體弱，所以只能把事交給別人做；沒上過學，所以事事都得向人請教。三樣都是短板，被他一一轉成了組織能力。",eg:"授權文化不是他想出來的管理理念，是他身體撐不住逼出來的——但結果是松下比同代企業更早學會不依賴創始人。"}],q:["松下電器是製造人才的公司，兼做電器生意。","生意人的使命，是讓寶貴的生活物資像自來水一樣取之不盡、用之不竭。","我有三個恩惠：家貧、體弱、沒上過學。","越是不景氣的時候，越要靠經營的力量。"],apply:"兩件事可以直接照搬。一是給現金、人才、時間各留一座水庫：留量在順境裡永遠顯得多餘，而它決定了你在逆境裡是能做選擇，還是只能裁人。二是把使命寫到能自動裁決具體爭論的程度——如果一句使命無法幫你判斷「這個價該不該降」，那它就還只是一句標語。",l:["稻盛和夫","任正非","段永平","安迪·格魯夫","塔勒布"],contrast:[{n:"稻盛和夫",why:"稻盛親耳聽過鬆下講水庫式經營並深受影響，兩人一脈相承；差別在松下靠結構留餘量，稻盛更靠人心和會計"},{n:"任正非",why:"都把「活下去」放在第一位，路徑相反：松下靠平時蓄水，任正非靠持續製造危機感"},{n:"塔勒布",why:"水庫式經營就是反脆弱的實業版本——冗餘在平時是成本，在衝擊到來時是全部的選擇權"}]},
{c:"世界如何運轉",n:"有限與無限的遊戲",e:"1986年",w:"求勝還是求續",y:1986,d:"紐約大學宗教史教授詹姆斯·卡斯寫的一本小冊子，101 個短章，沒有論證，只有陳述。它給出的區分極簡單：有限遊戲以取勝為目的，無限遊戲以延續遊戲本身為目的。但這個區分一旦裝進腦子，幾乎會重排你對野心、競爭、職業和公司的全部理解——因為你會開始發現，自己正在玩的很多局，其實從來沒人規定過它必須有個贏家。",story:"這本書出版時幾乎沒有反響。它不是商業書，也不是嚴格的學術著作，一個宗教史學者用格言體寫遊戲、劇場和死亡，兩邊都不討好。它真正被讀起來是在互聯網時代——創業者發現它精確描述了一件他們說不清的事：為什麼有些公司贏下了所有戰役卻死掉了，而有些公司從不宣布勝利卻一直在。在中文世界裡它最著名的傳播者是王興，美團價值觀裡那句「長期有耐心」，背後站著的就是這本書。",f:[{n:"兩種遊戲",d:"有限遊戲有確定的開始、結束和贏家，規則不可變，參與者在邊界內遊戲；無限遊戲沒有終點，規則必須隨時變化以保證遊戲能繼續，參與者與邊界本身遊戲。",eg:"一次融資、一場大促、一個季度是有限遊戲；一家公司、一段關係、一個人的手藝是無限遊戲。把無限遊戲當有限遊戲打的人，會在贏的那天不知道該幹什麼。"},{n:"規則的方向相反",d:"有限遊戲的規則不能變，變了遊戲就結束；無限遊戲的規則必須變，不變遊戲就結束。這一條最鋒利：所有「我們一直是這麼做的」，都是在把一個無限遊戲悄悄降級成有限遊戲。"},{n:"權力與力量",d:"有限遊戲的參與者為 power 參賽——權力是對頭銜的敬重，是別人給你的；無限遊戲的參與者憑 strength 參賽——力量不需要別人承認，也無法被剝奪。",eg:"一個人的頭銜換掉之後還剩下什麼，那部分就是 strength。多數職業焦慮的來源，是這兩者被長期混為一談。"},{n:"認真 vs 玩",d:"有限遊戲的參與者是「認真的」（seriously），因為結果關係到他的頭銜；無限遊戲的參與者是在「玩」（playfully），因為他隨時可以改變規則。玩不是不當回事，是保留了改變的自由。"},{n:"觀眾",d:"有限遊戲需要觀眾來認證勝利——沒有人看見的冠軍不成立；無限遊戲沒有觀眾，只有參與者。凡是必須被圍觀才成立的成就，都是有限遊戲。"},{n:"頭銜與死亡",d:"有限遊戲的贏家得到頭銜，而頭銜是過去時的、需要不斷被承認的；無限遊戲的參與者「除了自己的名字以外一無所有」。這句話讀起來像失敗，實際是最大的自由。"}],q:["有限遊戲以取勝為目的，無限遊戲以延續遊戲為目的。","有限遊戲的參與者在邊界內遊戲，無限遊戲的參與者與邊界遊戲。","有限遊戲的參與者為了權力而參賽，無限遊戲的參與者憑藉力量而參賽。","有限遊戲的規則不可改變，無限遊戲的規則必須改變。"],apply:"遇到一個讓你緊張的局面，先問一句：這是有限遊戲還是無限遊戲。是有限的，就明確贏的條件、打完收工，不要把它帶回家；是無限的，就別去追一個終局，把注意力放在「怎麼讓自己還能繼續玩下去」。職業選擇上，這一問尤其管用——升職是有限遊戲，能力是無限遊戲，前者會結束，後者不會。",l:["王興","莊子","系統之美","納瓦爾","尼采"],contrast:[{n:"孫子兵法",why:"孫子把競爭徹底當成有限遊戲來解，全部技術都服務於勝；卡斯要問的是，你為什麼默認這一局必須有終局"},{n:"彼得·蒂爾",why:"蒂爾的壟斷是有限遊戲贏到極致，卡斯會指出：贏下來之後，這個遊戲就結束了"},{n:"莊子",why:"「無用之用」和無限遊戲是同一個方向——不追求在既定規則裡勝出，而是保留改變規則的餘地"}]},
{c:"世界如何運轉",n:"槍炮、病菌與鋼鐵",e:"1997年",w:"環境而非人種",y:1997,d:"賈雷德·戴蒙德 1997 年的著作，次年獲普利策獎。它回答一個幾乎所有人都想過、但很少有人敢直接問的問題：為什麼是歐洲人帶著槍炮、病菌和鋼鐵去征服美洲和大洋洲，而不是反過來。戴蒙德的答案是環境，不是人——各大陸在可馴化物種和地理軸線上的差距，經由糧食生產這個中間變量，被放大成一萬三千年後的技術、文字、組織和免疫力的差距。",story:"1972 年，戴蒙德在新幾內亞的海灘上和當地政治家耶利散步。耶利問了他一個問題：「為什麼你們白人制造了那麼多貨物運到新幾內亞來，而我們黑人卻幾乎沒有屬於自己的貨物？」戴蒙德當場答不上來——他知道任何基於人種智力的解釋都是錯的，但他拿不出對的那個。這個問題他想了二十五年，最後寫成了這本書。全書的分量有一半來自這個開頭：它不是一個學者選定的課題，是一個被問住的人欠下的一筆賬。",f:[{n:"近因與終極因",d:"槍炮、病菌、鋼鐵都只是近因——它們是結果，不是原因。往回追，終極因是糧食生產：誰先有了農業和畜牧，誰就有了人口密度、剩餘產品、專業分工，然後才有了國家、文字、金屬和軍隊。",eg:"問「為什麼西班牙人有鋼劍」沒有意義，要問「為什麼歐亞大陸能養出一批不用種地的鐵匠」。"},{n:"可馴化物種的分布極不均勻",d:"全世界體重 45 公斤以上、可被馴化的野生哺乳動物只有 14 種，其中 13 種原產歐亞大陸。他稱之為「安娜·卡列尼娜原則」：可馴化的動物都是相似的，不可馴化的各有各的理由——脾氣、食性、繁殖習慣、群居結構，缺一樣就不行。",eg:"斑馬看起來和馬一樣，卻始終無法馴化：它會咬住人不鬆口。非洲不是沒試過，是這條路本來就不通。"},{n:"大陸軸線的方向",d:"歐亞大陸是東西走向，同一緯度氣候相近，作物、家畜和技術可以橫向平移幾千公里；美洲和非洲是南北走向，跨氣候帶傳播極慢甚至不可能。一條地圖上的線，決定了知識擴散的速度。",eg:"小麥從新月沃地傳到歐洲和印度不需要重新馴化；而玉米從墨西哥傳到北美東部花了數千年，還得改良品種。"},{n:"病菌是家畜的副產品",d:"天花、麻疹、流感都源自密集飼養的家畜。歐亞人為此付出了幾千年的代價，也因此帶上了免疫力。當這些病菌隨人抵達美洲，它們殺死的人遠比槍炮多。",eg:"皮薩羅以 168 人俘獲印加皇帝，通常被講成勇氣或火器的勝利。實際上天花已經先他一步抵達，殺死了老皇帝並引發了內戰——他面對的是一個剛打完內戰的國家。"},{n:"最優分裂原則",d:"歐洲破碎的地形造成了長期競爭的多國體系：一個國王拒絕哥倫布，他還可以去找下一個；中國的大一統則意味著一次決策失誤可以鎖死全國——鄭和的船隊被朝廷一紙令下終止，就再也沒有第二個出資方。",eg:"「統一帶來效率，分裂帶來選項」——這條對國家成立，對行業和公司同樣成立。"}],q:["各族群的歷史循著不同的軌跡展開，是環境的差異，而不是人的生物學差異。","可馴化的動物都是相似的，每一種不可馴化的動物各有各的不可馴化之處。","征服美洲的主力不是槍炮，而是隨征服者一起到達的病菌。","歷史上最大的那些模式，是由各大陸環境的差異塑造的。"],apply:"它給的是一種歸因紀律：看到顯著的結果差距時，先別急著歸因到人的素質、意志或文化，往回退兩步找結構性的初始條件——起點資源、傳播路徑、密度和時間。這條紀律用在看行業、看公司、看城市甚至看個人履歷上都成立，而且幾乎每次都會讓你的判斷更準一點、更少一點道德色彩。",l:["人類簡史","國家為什麼會失敗","國富論","系統之美","舊制度與大革命"],contrast:[{n:"國家為什麼會失敗",why:"庫裡最正面的一場辯論：戴蒙德說地理是終極因，阿西莫格魯說制度才是根本原因、地理只是背景。兩位作者公開互駁過，值得連著讀"},{n:"人類簡史",why:"同樣處理一萬年尺度，戴蒙德解釋各大陸之間為什麼不同，赫拉利解釋人這個物種為什麼特殊"},{n:"系統之美",why:"軸線、傳播、密度、反饋——戴蒙德實際上是在寫一個跨越一萬三千年的系統動力學案例"}]},{c:"權力與組織",n:"孟子",e:"戰國·前372—前289",w:"得民",y:-372,
d:"孔子之後最能把儒家寫成統治操作系統的人。他不把「仁」當成德行標語，而是當成權力能不能續上的約束條件：稅、兵、殺人權一旦失據，政權先空再垮。周遊列國而不遇合，這份清醒沒換來官位，卻把「民為貴」寫成了後世治國者躲不掉的警句。",
story:"齊宣王問孟子：湯武可以取天下嗎？孟子說：可以。鄰國連著三年乾旱，你沒去救；第二年又旱，你又沒去救——這不是仁而是殘。大王說我弱，孟子說不是力量問題，是你把民當作農產。這段對話把儒家從「向君講道德」扭成「向君算賬」：得民不是感情，是你還能不能徵稅、徵兵、死守。齊宣王沒用他，但這套賬本被後世治世者一遍遍重算。",
f:[{n:"得民者得天下",d:"「得道者多助，失道者寡助」。道在這裡不是經文，是你還能不能讓人願意跟你拼。稅賦超過生產、役使超過產出、殺人超過公平，民眾不會突然造反，但會先停止同意——權力就在這一步空掉。",eg:"周武王初年井田、商市、兵制都給了人一條活路，四方歸附；晚年大封建、重賦役，民眾一散。公司版：標準加班可以掙一季度，但核心員工開始裝死時，你的勢就散了。"},{n:"以德服人",d:"「以力服人者，非心服也；以德服人者，中心悅而誠服也」。力只買得順從，買不到判斷。你一離開現場，力就回零。能讓人在你看不見的地方仍按你的標準做事，才算服。",eg:"李世民能納諫，是因為朝臣相信誠諫不會換來報復；項羽能破城，卻留不住韓信。現代管理同理：密集監控能拔高週報表，拔不高一離開就掉隊的業務。"},{n:"恆產而非暴徵",d:"孟子對跟風求利的判詞是：不要跟著人搶已經開好的地，要把自己的地種好。人家一動你就跟，你永遠是第二名；把稅制、農時、學校穩住，別人的人會自己過來。",eg:"齊國跟著秦楚變法搶地皮，國力上去了一陣，但民眾沒跟上。公司跟風投三個賽道，賬面上有一季的熱度，但用戶不會記住你。"},{n:"知言不如養氣",d:"孟子講養浩然之氣，不是雞湯。他說的是：判斷經過反覆核對，你才敢在壓力下按原判斷行事。沒有這口氣，遇事就改口，不叫堅定，叫沒主見。",eg:"孟子見梁惠王，敢說「王之不王」；對照許多朝會上只敢說「再看看」的參謀。團隊裡最危險的不是有主見的人，是沒主見還裝得像有主見的人。"},{n:"生於憂患",d:"「生於憂患而死於安樂」。不是讓你苦修，是警告你：組織一旦進入舒適區，它就開始丟失警覺。憂患是信號，安樂是麻醉。",eg:"秦國在死亡邊緣能變法，統一後第二代就碎。創業公司活過兩個冬天還在，第三年開始買工位超過買用戶。"}],
q:["民為貴，社稷次之，君為輕。","得道者多助，失道者寡助。","以力服人者，非心服也；以德服人者，中心悅而誠服也。","生於憂患而死於安樂。","天時不如地利，地利不如人和。"],
apply:"做一季度決策前先問三個問題：這一刀會不會讓核心人停止同意？你不在現場時，人還會按這個標準做嗎？你是在種自己的地，還是在跟別人搶地？三個回答裡只要有一個是「會丟」，這一刀就先別下。",
l:["論語","韓非子","商鞅","李光耀","李世民"],contrast:[{"n": "韓非子", "why": "同樣寫治國：韓非信賞罰，孟子信得民。一個算人會怎麼動，一個算人還願不願意跟"}, {"n": "論語", "why": "論語給規範，孟子給約束。孔子講君子怎麼做人，孟子講國君怎麼才不會轉眼間丟掉政權"}],
fail:"孟子把仁政講得很透，但遊歷齊、宋、滕、梁，沒有一個國君把權給他。他的學說勝在書裡，輸在當世。戰國君主要的是能立刻拉得出的兵和稅，不是三年之後才能看到的人和。",
lesson:["一套正確的理論，如果沒有能承受它的主君，就只是正確。","得民是慢變量，打仗是快變量——當世總是先買快的。","把道德寫成賬本而不是教條，這是孟子比空談仁義的人強的地方。"]},

{c:"權力與組織",n:"荀子",e:"戰國·前313—前238",w:"化性起偽",y:-313,
d:"孟子講人天然可好，荀子講人天然可塑。「偽」不是假，是人工：禮儀、法度、師傅、反覆訓練，把生出來亂的材料裝進可用的形狀。韓非出他門下，秦制從他這裡接過力。他是中國思想裡最早把組織設計當成第一問題的人。",
story:"荀子在蘭陵議兵。春申君問他兵怎麼打，他不講奇謀，講兩件事：兵器要新，賞罰要信。他認為戰爭不是氣概比拼，是一套能不能把普通人訓成可用之器的制度。後來他到楚，做蘭陵令，把這套話落到縣政上。門生韓非把他的「人可塑」推到極致，變成了法術勢；但荀子自己沒有走到那一步——他相信訓練，不相信光靠恐懼。",
f:[{n:"化性起偽",d:"「人之性惡，其善者偽也」。人出生帶著的是偏好，不是美德。美德是裝出來的：用規則、儀式、反覆糾偏把人拉回可以合作的形狀。期望員工自覺，就是在拒絕做這份工。",eg:"富蘭克林用美德表格一天打一次分，是荀子的現代版。格魯夫在英特爾用週會和輸出表把經理訓成可用之器，也是同一套。"},{n:"青出於藍",d:"材料不決定上限，工序才決定。門生能超過老師，不是因為天賦更高，是因為把老師的方法用得更徹底。",eg:"韓非把荀子的「人可塑」推成法術勢，系統更冷；李斯把同門的韓非送進了監獄。工序沒有道德自帶制動。"},{n:"規矩方圓",d:"沒有工具就沒有直線。荀子說聖人也要借規矩方圓，更何況普通主管。你覺得「這事我心裡有數」，通常只是還沒把尺度寫下來。",eg:"商鞅徙木立信，把賞罰寫成可觀察的制度；很多公司的「價值觀」做不到這一點，所以只能貼在牆上。"},{n:"積微成著",d:"「不積跬步，無以至千里」。大變是小變的堆積。等待頓悟的組織，會在等待中散掉。",eg:"曾國藩講慎獨，一天改一點習慣；稻盛講精益求道，把工夫拆成每天能重複的動作。都是荀子這句話的實踐版。"},{n:"師法而非自覺",d:"荀子尊師。不是迷信權威，是承認：沒有外部校正，人會把自己的偏好當成真理。師傅的價值是把你拉回規矩，不是讓你舒服。",eg:"王陽明講知行合一，偏向內部覺悟；荀子偏向外部訓練。兩條路都能走通，但組織里不能只留一條。"}],
q:["人之性惡，其善者偽也。","青，取之於藍，而青於藍。","不積跬步，無以至千里。","蓬生麻中，不扶而直。"],
apply:"招人之後先別講「自驅動」。先寫清：什麼算做對、誰來檢查、檢查不過怎麼辦。三條都空的團隊，不是文化不夠，是你還停在性善論裡。",
l:["孟子","韓非子","王陽明","安迪·格魯夫","富蘭克林"],contrast:[{"n": "孟子", "why": "一個認為人可教，一個認為人可塑。孟子用養氣，荀子用工序"}, {"n": "韓非子", "why": "門生把老師的訓練論推成控制論。荀子還留著禮，韓非只留下柄"}],
fail:"荀子把人當成可塑的材料，也把自己的門生塑成了最冷的法家。韓非死在李斯手裡，秦制用完這套工具就碎。工序能造就人，也能造就武器。",
lesson:["不要把「人可塑」當成賭氣：你塑的方向，就是他們以後對他人的方向。","沒有檢查的自覺，只是還沒被測到的偏好。","師傅不是為了讓你舒服，是為了阻止你把偏好當成原則。"]},

{c:"創業與產品",n:"彼得·德魯克",e:"奧—美·1909—2005",w:"成果",y:1909,
d:"把管理從「管人」改成「對成果負責」的人。他不寫職位說明書，寫的是：你被僱不是因為忙，是因為要產出一個別人用得上的結果。GM、日本企業、非營利都用過他的問題清單。核心只有一句：活動不算數，成果才算。",
story:"二戰時德魯克在通用汽車做諮詢。他發現高管的日程塞滿了會議，但沒人能回答「你今年到底產出了什麼」。他把這份發現寫進《卓有成效的管理者》：把時間記錄一週，你會看見自己把最好的幾小時給了最不重要的事。這不是時間管理技巧，是成果觀的入口——你不測量貢獻，就只能測量出勤。",
f:[{n:"對成果負責",d:"管理者的工作不是把事做完，是讓正確的事發生。會議、報告、協調都是活動。活動能填滿日程，填不滿成績。",eg:"格魯夫在英特爾要求經理寫「我的業務是什麼」，不是寫職能清單。兩人接在同一條線上：先定義成果，再安排動作。"},{n:"效率不是效果",d:"把不該做的事做得很快，是最昂貴的浪費。先問這事該不該做，再問怎麼做得快。",eg:"許多公司用OKR把錯誤目標拆得很細，四個季度都達成了，公司仍在錯的賽道里。"},{n:"時間是唯一的材料",d:"你不能管理時間，只能管理自己把時間用在哪。把一週真實花掉的小時寫下來，你會發現戰略只佔了一小塊。",eg:"德魯克要求管理者把不重要的事找人接，不是因為懶，是因為你的時間比他人貴。"},{n:"人事決策是唯一不可推遲的決策",d:"錯的人放在對的位置上，會把對的制度拆掉。人事不是HR的事，是主管的主業務。",eg:"任正非把幹部輪換當成戰略動作，不是年底表演。德魯克會點頭。"},{n:"企業的目的是創造顧客",d:"不是創造利潤。利潤是結果，顧客是原因。把這兩個弄反了，你會為了財報傷客。",eg:"貝索斯講Day 1，松下講自來水哲學，都是這句話的產品版。"}],
q:["最無用的事，是把不該做的事做得非常高效。","效率是把事做對，效果是做對的事。","企業的目的是創造顧客。","管理者的時間是最稀缺的資源。"],
apply:"每週五寫三行：本週我產出了什麼、什麼本該產出卻沒產出、下週我準備停掉什麼活動。三行都寫不出來的周，就是你被日程吃掉的周。",
l:["安迪·格魯夫","松下幸之助","任正非","保羅·格雷厄姆"],contrast:[{"n": "安迪·格魯夫", "why": "格魯夫解決執行，德魯克解決取捨。一個問怎麼把事做通，一個問這事值不值得做"}, {"n": "保羅·格雷厄姆", "why": "PG講從零開始怎麼做，德魯克講規模化以後怎麼不變成忙碌"}],
fail:"德魯克把管理變成了一門學科。學科一成熟，就會生出大量論管理而不管理的人。他自己最怕的，正是人把他的書當成活動清單。",
lesson:["一本講成果的書，最容易被讀成活動手冊。","你若把德魯克當作課程，你已經輸了。","能寫出「我本週的成果」的人，才算讀懂了他。"]},

{c:"世界如何運轉",n:"哈耶克",e:"奧—英·1899—1992",w:"分散知識",y:1899,
d:"把「計劃為什麼會系統性算錯」寫成經濟學的人。不是因為計劃者懶，是因為做計劃所需的知識，散落在成千上萬個當事人頭裡。價格是這些知識的傳輸協議。他和凱恩斯辯了一輩子，勝的不是口才，是這一條知識論。",
story:"1945年哈耶克發表《知識在社會中的運用》。他說：一個計劃者要調配鋼材和麵包，必須知道每一個工廠、每一塊田的特殊情況。這些知識沒有人能全部掌握。市場用價格把它們縮成一個數字傳出去。凱恩斯認為聰明人能算清這筆賬；哈耶克認為再聰明的人也沒有這份清單。二十年後，計劃經濟的崩塌讓這篇文章變成了預言。",
f:[{n:"知識的分散",d:"真正有用的知識不是論文，是「此時此地」的細節：誰缺工、誰有庫存、哪條路堵了。這份清單不存在於任何一個人腦中。",eg:"張一鳴用推薦算法把分散的點擊收成信號，是價格機制的產品版。總部幹部一張表想代替市場，是反例。"},{n:"價格是協議",d:"價格不是價值判決，是壓縮過的消息。你不需要知道為什麼漲，只要知道它漲了，就能調整行動。",eg:"石油漲價時，全世界的司機和化工廠同時改行為，不需要一個部長召集他們開會。"},{n:"自生秩序",d:"沒人設計的秩序，不等於沒有秩序。語言、市場、法律習慣都是這一類東西。你可以干預它，但干預的代價通常在別處出現。",eg:"塔勗布講反脆弱：不要把系統打磨成一個人能控的樣子。哈耶克是這句話的前輩。"},{n:"自以為知",d:"最危險的不是無知，是把局部知識當成全局清單。計劃者的通病是：我能看到的，就是全部。",eg:"大公司的年度規劃常在四月失效，不是因為人笨，是因為現場在變。"},{n:"規則優於命令",d:"好的秩序是約束行為的規則，不是指定結果的命令。給人邊界，讓他們用自己的知識填充邊界裡面。",eg:"商鞅立法而不是每天給市長下命令；達里奧的原則是邊界，不是交易手冊。"}],
q:["經濟學的奇怪任務，是讓人看清：對自己以為能設計的東西，他們其實知道得多少。","價格體系是傳遞信息的機制。","沒有人能掌握做計劃所需的全部知識。"],
apply:"寫年度規劃之前先問：這份計劃依賴的知識，有多少不在我頭裡？把這些空白寫出來。空白超過一頁，就別把規劃寫得像命令，改成邊界和信號。",
l:["國富論","塔勒布","張一鳴","達里奧"],contrast:[{"n": "國富論", "why": "史密斯講分工能讓蠻力變富，哈耶克講分工之後信息怎麼傳回來"}, {"n": "塔勒布", "why": "塔勒布講你無法預知衝擊，哈耶克講你無法集中知識。一個對付隨機，一個對付自以為知"}],
fail:"哈耶克對中央計劃的警惕，常被讀成「什麼都不要管」。他自己強調的是規則而不是放任。沒有規則的市場，不是他要的自生秩序。",
lesson:["反對計劃，不是反對決策，是反對假裝全知的決策。","你看不到的知識，不會因為你看不到就消失。","把價格拆掉之後，你必須自己當信使。"]},

{c:"權力與組織",n:"俾斯麥",e:"普魯士·1815—1898",w:"聯盟幾何",y:1815,
d:"把歐洲當成一道幾何題來做的人。他不追求友誼，追求讓三方同時離不開你。打敗丹麥、奧地利、法國三場戰爭之後，他反而停下，用聯盟把德意志固住。拿破崙贏在打，他贏在停。",
story:"1871年德意志在凡爾賽宣告成立。俾斯麥沒有追擊巴黎，而是立刻轉向抹平法國以外的歐洲。他結三皇同盟，跟俄、奧、意、意大利分別談判，讓每一方都覺得離開柏林會更危險。法國被隔離了二十年。他一下臺，這張網就裂了——說明聯盟不是友情，是一個人的計算能不能續上。",
f:[{n:"可能性的藝術",d:"政治不是實現理想，是在可用的條件裡取最多。把目標寫成「必須如此」的人，會把局勢賠掉。",eg:"他統一德意志時不要南德，先要普魯士能控的那一半。產品版：不要一次打下全部市場，先打下你能守住的那一塊。"},{n:"三方離不開你",d:"最穩的位置不是強，是讓A需要你來防B，B需要你來防A。兩邊都不能掉，你就在中間。",eg:"三皇同盟讓俄、奧、德互相牽制。公司版：成為兩個巨頭都不能少的中間件，而不是跟一邊綁死。"},{n:"打完就收",d:"勝三場戰爭之後他停手。再多打一場，聯盟就會翻臉。勝利的下一步不是擴張，是把勝利變成別人能接受的現狀。",eg:"拿破崙打到墨西哥還想再打；俾斯麥打完法國就開始談賠償和孤立。"},{n:"不在主場硬碰",d:"他對英國海權、俄國在巴爾幹都避讓。主場是對手的生存點，你去碰，他會用全力。",eg:"張居正改明不動皇權核心，先動賦稅和考成。同一條几何。"},{n:"聯盟是消耗品",d:"聯盟靠人維持。人一走，紙面還在，結構就散。不要把一個人的計算能力寫進制度裡。",eg:"俾斯麥下臺後威廉二世拆掉重保險，歐洲重新走向對抗。創始人離開後的夥伴關係，也是這種消耗品。"}],
q:["政治是可能性的藝術。","誰要管治歐洲，誰就得管好自己的胃口。","法律像香腸，最好別看它怎麼做出來。"],
apply:"談一筆合作前先畫三個圈：他離不開你的原因、你離不開他的原因、第三方會怎麼移動。三個圈裡只有你單向需要對方，這筆合作就是你在送人情。",
l:["張居正","李光耀","拿破崙","托馬斯·謝林"],contrast:[{"n": "拿破崙", "why": "拿破崙靠勢湧到對手崩潰，俾斯麥靠停手把勝利固住。一個贏在打，一個贏在收"}, {"n": "李光耀", "why": "都是現實主義者。李光耀把小國守成了節點，俾斯麥把大國守成了支點"}],

lesson:["最好的布局如果只有你能維護，就是實驗室產品。","勝利之後還想再打一場，通常是起盤的時候。","聯盟不是友情，是讓對方離開你比留下更痛。"]},
{c:"心智與情緒",n:"布琳·布朗",e:"2010年·休斯頓大學",w:"羞恥與內疚",y:2010,
d:"社會工作研究者，花二十年做一件別人不願碰的事：把「羞恥」變成可以研究的對象，幾千份訪談。她最有用的貢獻不是鼓勵，是一個區分——內疚是「我做了一件壞事」，羞恥是「我是個壞人」。前者指向行為，後者指向人本身；同一件錯事，兩種說法帶來相反的後果。（注意：她關於羞恥與成癮、抑鬱、攻擊相關的那批結論出自她自己的質性研究與綜述，量化強度在學界有爭議。這個條目取她的區分，不取她的相關係數。）",
story:"2010年她在 TEDxHouston 講脆弱，視頻意外傳遍全球。第二年她回到同一個講臺，講的卻是羞恥——因為上一次演講之後她經歷了一場自己稱為「崩潰」的時期：把研究裡最私密的部分公開，等於把自己交給了所有人的評價。她在臺上把兩句話並排擺出來：內疚說的是「我很抱歉，我做錯了一件事」；羞恥說的是「我很抱歉，我就是一個錯誤」。差別只有幾個字，指向完全不同——一個指著行為，可以改；一個指著人，無處可改。她的結論很不客氣：羞恥不是道德的燃料，它是行動的剎車。",
f:[{n:"內疚指著行為，羞恥指著人",d:"這是全部區分的根。「我把這件事辦砸了」留下了一條路：下次怎麼辦。「我就是個辦不成事的人」把路堵死了——如果問題是「我是誰」，那就沒有動作可做，只剩逃避。所以同一件錯事，用哪個詞在心裡描述它，決定了接下來會不會有行動。",eg:"遲交了方案。說「我這次時間估錯了」，下一步是改估法；說「我就是個不靠譜的人」，下一步是不敢再接。"},
{n:"羞恥靠三樣東西活著：秘密、沉默、評判",d:"布朗的說法是，羞恥需要這三樣才能生長。反過來就是解法：說出來（打破秘密與沉默），並且說給一個不會評判你的人。這不是心理安慰，是拆掉它的生存條件——羞恥的力量來自「只有我這樣」，而這句話在被聽見的那一刻就不成立了。",eg:"最難開口的那件事，找一個你確信不會拿它評價你的人講一遍。挑錯人比不說更糟，所以選人比開口重要。"},
{n:"脆弱不是軟弱，是結果未知時的暴露",d:"她給脆弱下的定義裡沒有情緒，只有處境：不確定、有風險、情感上暴露。按這個定義，先開口示好、承認不會、提出一個可能被否的方案，都是脆弱。它和軟弱的區別在於是不是自己選的。",eg:"會上說「這塊我不懂，誰能講一下」——這是脆弱；會後私下問因為怕丟臉，是迴避。"},
{n:"羞恥不能當管理工具",d:"用羞恥推動別人，短期見效，長期讓人只學會隱藏。她在組織研究裡反覆看到同一個模式：一個靠羞辱糾錯的團隊，最後得到的不是更少的錯，是更少被報告的錯。",eg:"復盤會上問「誰幹的」，下一次事故你就聽不到了；問「哪一步的信息不夠」，才有人接著說。"}],
q:["羞恥的根是害怕失去聯結——怕自己做過的事，讓人不再想靠近你。——《脆弱的力量》（中譯，非出版原句）",
"我們沒法選擇性地麻木情緒：把痛感關掉，快樂也會一起關掉。——同上（中譯）",
"勇氣和舒適不能同時要。——她在多場演講裡反覆講的一句"],
apply:"下一次心裡難受時，先分清你在對自己說哪一句：「我做錯了一件事」還是「我就是不行」。前者接得下動作，後者接不下——如果發現自己在說後者，把它改寫成前者，具體到那一件事、那一個動作。然後挑一個不會拿它評價你的人講一遍。用反了：拿這個區分去替自己開脫，把該負的責任也一併劃成「那只是行為」；或者反過來，逼別人「別羞恥」——羞恥不是勸得掉的。",
l:["阿德勒","卡爾·羅傑斯","弗蘭克爾","非暴力溝通"],
contrast:[{"n": "阿德勒", "why": "都在處理「別人怎麼看我」：阿德勒說那是別人的課題，布朗說那是可以被拆解的羞恥機制——一個劃邊界，一個拆結構"},
{"n": "卡爾·羅傑斯", "why": "羅傑斯給的是「無條件積極關注」這個環境條件，布朗給的是當事人自己能做的那個動作"},
{"n": "曾國藩", "why": "曾國藩的慎獨是把自責做成日課，布朗會問：那句自責指著行為還是指著你自己"}]},

{c:"心智與情緒",n:"克里斯汀·內夫",e:"2003年·得州大學",w:"自我關懷",y:2003,
d:"心理學家，2003年把「自我關懷」從修行語彙變成可測量的心理學變量——她做的量表後來被大量研究採用。她的貢獻不是勸人對自己好一點，是給出了一個替代自尊的算法：自尊的定義裡含著「比別人強」，所以它靠比較供能，順利時最足、失手時最先撤走；而自我關懷不比較，它只問「我現在難受，需要什麼」。多項研究裡它在抑鬱、焦慮、改錯動機上都優於自尊。（注意：這一領域的效應量存在爭議，且量表多為自評；這個條目取她的結構，不取具體系數。）",
story:"她講過自己的起點：兒子被診斷為自閉症之後，她發現所有教她「要堅強」的東西都不管用——那些方法都要求她先證明自己撐得住。真正讓她能繼續下去的，是允許自己承認「這件事很難，我很難受」，同時不加一句「所以我不行」。她後來把這個過程拆成三個零件：善待自己、共通人性、靜觀。三樣必須同時在——只有善待自己而沒有共通人性，是自憐；認了共通人性卻仍在苛責，是硬扛；只清醒地看著痛苦而不肯善待自己，是抽離。缺一件，它就不是自我關懷，是另一樣東西。",
f:[{n:"自尊靠比較供能，所以在低谷時最靠不住",d:"只要定義裡含著「比別人強」，它就必須持續贏；一失手供能就中斷，而那正是最需要支撐的時刻。自我關懷不依賴名次，低谷時反而在場。這不是心態之爭，是兩套不同的供能方式。",eg:"被同期的人超過，自尊說「我不行了」；自我關懷說「這次難受，正常，下一步做什麼」。"},
{n:"它不降低標準，反而提高改錯的動機",d:"最常見的反駁是「對自己好會變懶」，數據指向相反：把注意力從「我是不是個失敗者」轉到「這件事怎麼辦」，人更願意承認錯誤、更快開始修補。羞恥讓人躲，自我關懷讓人回來看。",eg:"考砸之後罵自己一晚上，第二天不敢翻卷子；換個說法，當晚就能把錯題過一遍。"},
{n:"三個零件必須同時在，缺一件就換了名字",d:"這個模型的用處不在勵志，在診斷：難受時逐件問一遍，缺的通常只有一件。多數人缺共通人性（覺得只有我這樣），少數人缺靜觀（沉進去反覆回放，或者硬說沒事）。",eg:"已經很清醒、也知道別人也這樣，就是不肯對自己客氣——那缺的是第一件。"},
{n:"最好用的判據是「你會這樣對朋友說話嗎」",d:"把你對自己說的那句話，原樣說給一個正處在同樣處境的朋友。說不出口，就說明那句話不是實話，是攻擊。這一條不需要理解理論就能用，也不容易自欺。",eg:"「你這麼笨還想做這個」——不會對朋友說，那就也別對自己說。"}],
q:["自我關懷不是給自己找臺階，是把注意力從「我是誰」挪回「這件事怎麼辦」。——她對最常見誤讀的回應（中譯）",
"善待自己而不認共通人性，那是自憐；認了共通人性卻仍在苛責，那是硬扛。——三要素模型（中譯）",
"她的起點不是理論，是兒子確診之後發現「要堅強」這套話一句也用不上。"],
apply:"搞砸事情之後，先做一次校準：把你正在對自己說的那句話，試著原樣說給一個同樣處境的朋友——說不出口就換掉。然後逐件對三樣：我肯不肯對自己客氣？我是不是覺得只有我這樣？我有沒有把這件事的嚴重程度稱準（不放大也不否認）？缺的通常只有一件。用反了：把它當成不再復盤的許可；或者用「大家都這樣」去否定自己的具體處境——那句話一旦變成「所以你別叫」，就走反了。",
l:["布琳·布朗","弗蘭克爾","阿德勒","德韋克"],
contrast:[{"n": "布琳·布朗", "why": "都在處理「我是不是個壞人」：布朗給的是區分（內疚 vs 羞恥），內夫給的是替代方案（自我關懷 vs 自尊）"},
{"n": "德韋克", "why": "兩套都在改「我是誰」這個句式：德韋克把能力從固定改成可長，內夫把注意力從「我夠不夠好」挪開——一個改結論，一個改問題"},
{"n": "曾國藩", "why": "曾國藩的每日反省是對自己極嚴，內夫會問：那份嚴厲帶來了行動，還是只帶來了躲避"}]},

{c:"家庭與關係",n:"阿莉·霍克希爾德",e:"1983年·加州大學伯克利",w:"看不見的勞動",y:1983,
d:"社會學家，兩次給一件看不見的勞動起了名字。1983年《被管理的心》提出「情感勞動」：有些工作不只要求你做對，還要求你顯示出規定的情緒——空乘要熱情，催收員要冷硬；她的觀察是異化，那個笑不是「她的」笑，久了連自己真正的感受也認不出。1989年《第二班》提出：有工作的女性下班後還有一班無薪的活，按當時的時間使用調查，每週比男性多幹約15小時，一年相當於多出一個月的二十四小時。她做的事只有一件——把不進賬的勞動變成可以計量的東西。",
story:"她跟著達美航空的空乘做田野，注意到培訓手冊裡反覆出現一個詞：真誠的笑。公司不滿足於要求員工禮貌，它要求那個笑是真的——於是員工必須自己在心裡生產出那份高興，這部分工作沒有工時、沒有報酬、也沒有名字。她把它和體力勞動放在同一個位置上：搬箱子會累，裝高興也會累，只是後者的賬單來得晚，而且常常被記成「這人性格變了」。她對催收員的觀察是反面例證：那個崗位要求的是冷硬，同樣是被規定的情緒，同樣要人自己去生產。",
f:[{n:"不進工時表的勞動，代價由承擔者獨吞",d:"任何不被計量的工作都會被默認成「順手的」。它不會因為沒被記錄就消失，只會變成一個人的隱形負擔——而這個人往往連抱怨的語言都沒有，因為賬面上什麼都沒發生。",eg:"「你在家不上班」這句話之所以刺人，是因為它把一天十小時的活說成了零。"},
{n:"表層扮演與深層扮演，賬單來的時間不同",d:"表層是臉上裝、心裡知道自己在裝，累在緊繃；深層是說服自己真的這麼覺得，累在事後找不回自己。兩者都有成本，只是一個當晚結賬，一個幾年後結賬。",eg:"客服硬撐一天，晚上不想說話——表層的賬；做久了覺得自己空了——深層的賬。"},
{n:"代價隨「被要求的情緒與真實感受的距離」上升",d:"距離越遠越貴。要求你熱情而你正難受，比要求你冷靜而你本來平靜，成本高出很多。所以最傷人的崗位不是最忙的，是最常被要求裝出反向情緒的那些。",eg:"剛接完一個投訴電話，立刻要用同樣的語調接下一個——那一秒最貴。"},
{n:"照料類勞動的時長是剛性的",d:"寫方案能熬夜提速，餵飯和陪病人不能。所謂效率提升在照料上基本不成立——它只能被別人接手，或者乾脆不做，代價落在被照料的人身上。指望「更有條理」騰出時間的家庭，騰出的通常是睡眠。",eg:"兩個人都全職、又要照顧老人，缺口不是靠計劃能填的，是必須有人少上班或者花錢買時間。"}],
q:["情感勞動是對感受的管理，為的是製造一種公開可見的面部與身體表演。——《被管理的心》（中譯定義）",
"他們不是被要求假裝高興，是被要求真的高興——這是兩種不同的工作。",
"第一班在公司，第二班在家裡，只有第一班有工資。——《第二班》（中譯）"],
apply:"家裡的活總落在一個人身上、說過幾次也沒變，先別談公平，先做兩週的賬：每件事誰做了、花多久，全部記下來。多數分工談不成不是因為不願分，是兩個人手上的清單不一樣。工作上如果一天沒幹多少事卻一句話都不想說，問一句：今天有多少時間在維持一種被要求的情緒，那部分算進我的工作量了嗎——承認它是工作量，才排得進恢復時間。用反了：拿這兩個概念去算舊賬做道德指控；或者反過來用「大家都不容易」把清單再抹掉一次。",
l:["薩提亞","鮑恩","托馬斯·戈登","卡爾·紐波特"],
contrast:[{"n": "薩提亞", "why": "都看家裡那套隱形規則：薩提亞看壓力下的四種姿態，霍克希爾德看誰在承擔沒人計量的活——一個看溝通，一個看賬本"},
{"n": "卡爾·紐波特", "why": "都在算時間的真實成本：紐波特算注意力殘留，霍克希爾德算不進工時表的第二班"},
{"n": "稻盛和夫", "why": "稻盛把「全身心投入」當美德，霍克希爾德會問：被要求的那部分投入，有沒有人給它計時"}]},

{c:"創業與產品",n:"凱文·凱利",e:"2008年·《連線》創刊主編",w:"鐵桿粉絲",y:2008,
d:"《連線》雜誌創刊主編，2008年寫了一篇短文，把獨立創作者的生存問題變成一道算術：一千個鐵桿粉絲，每人每年為你花一百美元，就是十萬美元，夠一個人活下去。他給鐵桿粉絲的定義很硬——會買你做的一切，願意開兩百英里去看你演出。這道題真正的價值是把「成名」從必要條件裡拿掉：你不需要一百萬人喜歡你，你需要一千個人認真喜歡你。他同時設了第二個條件，多數人只記住第一個：你必須和粉絲有直接關係，錢要直接付給你。",
story:"這道算術他講得毫不浪漫。一千個人，一天認識三個，一年就夠了——這是一份可執行的日程；而一百萬人無論如何都不是靠努力湊出來的，那是一次抽獎。但他沒把這條路說成捷徑：維護一千個直接關係——回信、發貨、辦活動——本身耗時且磨人，他自己寫過，做好了它就是另一份全職工作。最難的位置不在起點也不在終點，是幾百人的時候：還養不活自己，但回信已經佔掉每天兩小時。他2008年的參照是博客和 MySpace；今天的平臺環境更緊，像 Spotify 那樣給你榜單數據、卻不給你聯繫方式。",
f:[{n:"一千是可以逐個數的，一百萬只能靠運氣",d:"這是這道題最實的部分。前者能拆成每天的動作——今天有沒有多一個真的會回來的人；後者只能等。把目標從後者換成前者，工作方式會立刻變得具體。",eg:"「今天有沒有多一個會回來的人」這個問題可以每天問，「今天有沒有火」不能。"},
{n:"每人每年一百塊反推的是產品結構",d:"這個數字倒過來是一道設計題：你一年要產出什麼，才值得一個真心喜歡你的人自願花掉一百塊。它逼你從「多做點內容」轉向「做一件他願意買的東西」，兩者的工作量完全不同。",eg:"免費更新一整年，不如一件他願意付錢的東西：一門課、一本印出來的書、一次線下。"},
{n:"名單在誰手上，命就在誰手上",d:"判據只有一句：如果明天這個平臺把你限流或封號，你還能不能找到那一千個人。找不到，說明你從來沒有過那一千個粉絲，你只是租用了平臺的流量。凡是能離開平臺帶走的，才算你的。",eg:"郵件列表、微信群、自己的站——都算；平臺粉絲數不算。"},
{n:"抽成抽掉的不只是錢，是反推的能力",d:"平臺在中間時，你看不到誰買了、為什麼買、什麼時候不買了。少掉的不只是那一成收入，是讓你能改進的那些信息。直接關係最貴的部分其實是反饋，不是錢。",eg:"一封「我為什麼退訂」的回信，比一張後臺留存曲線有用。"}],
q:["你不需要一百萬人喜歡你，你需要一千個人認真喜歡你。——《1000 True Fans》（中譯）",
"鐵桿粉絲的定義是：會買你做的一切。——同上",
"做好了，它會變成你的第二份全職工作。——他自己對這條路的提醒（中譯）"],
apply:"如果你在做內容或手藝卻一直在等爆款，先算兩個數：現在真正會為我付錢的有多少人、我叫得出幾個名字；一年內我能給他們一件值一百塊的東西嗎。然後做一件更要緊的事——在繼續漲粉之前，先把「怎麼把人帶走」解決掉：每條內容留一個能直接找到你的入口。順序反了的人，粉絲數最好看的那天往往就是議價能力最低的那天。用反了：把一千當成里程碑去刷數量，粉絲有了卻沒有一件可買的東西；或者以為有了名單就不用平臺——平臺是入口，名單是保險，兩件事不互相替代。",
l:["納瓦爾","保羅·格雷厄姆","黃仁勳","段永平"],
contrast:[{"n": "納瓦爾", "why": "都在講個人如何不靠組織變現：納瓦爾給的是「特定知識乘槓桿」，凱利給的是一道能倒推產品的算術"},
{"n": "保羅·格雷厄姆", "why": "「做不能規模化的事」和「一千個鐵桿粉絲」是同一件事的兩頭：前者說早期要手工，後者說手工能一直做到活下去"},
{"n": "彼得·蒂爾", "why": "蒂爾要壟斷一個大市場，凱利要一千個人的深度——兩條都繞開競爭，一條靠規模壁壘，一條靠關係壁壘"}]},

{c:"財富與風險",n:"稀缺",e:"2013年·穆來納森與沙菲爾",w:"帶寬",y:2013,
d:"行為經濟學家穆來納森與心理學家沙菲爾合著，回答的不是「怎麼賺錢」，是「已經不夠了會發生什麼」。核心主張是：稀缺本身會佔用認知帶寬——缺錢的人不是不理性，是腦子被「還差多少」持續佔著，剩下的判斷力就少了。他們最有名的證據是印度甘蔗農研究：同一批人，收成前手頭緊時與收成後錢到手時各測一次認知，差距相當於十幾個 IQ 點。這個模型同時解釋缺錢與缺時間，因為兩者搶的是同一份帶寬。（出處分級：甘蔗農那個具體數字有重複性爭議——Camerer 等人 2018 年的複製研究未能重複出 Shah 等 2012 年的部分結果，也有學者主張不該再講那個「修車花掉 13 個 IQ 點」的故事；作者自己後來做過高功效複製，說明了哪些結果穩、哪些不穩。這個條目取它的方向與機制，不取具體數值。）",
story:"這本書真正的轉向發生在提問方式上。關於貧困，通常的問法是「窮人為什麼做那些看起來很蠢的決定」——這個問法已經把答案預設成了性格。他們換了個問法：同一個人，在緊和不緊的兩個時刻，會不會做出不同的決定？甘蔗農研究之所以有力，正是因為它比的不是窮人和富人，是同一批人的兩個時刻。結果是：收成後不再犯的錯，就不該記在這個人的性子上。他們由此提出隧道效應——稀缺讓注意力收窄，眼前最急的被照得很亮，隧道之外的體檢、保險、還款計劃全部看不見；以及餘裕——有餘裕的人犯同樣的錯不痛不癢，沒餘裕的人一次小事故就翻船。",
f:[{n:"帶寬是一份，缺錢和缺時間搶同一份",d:"這個模型最有用的地方是把兩件看起來無關的事併成一件。月底算錢和趕死線，佔用的是同一份注意力，所以兩者同時發生時人會格外失控——不是意志薄弱，是帶寬被兩頭拉扯。",eg:"一邊算這個月還差多少，一邊趕方案，兩件都做不好——那不是懶。"},
{n:"判據是「他不緊的時候還這樣嗎」",d:"把性格解釋換成處境解釋需要一個可檢驗的條件。甘蔗農研究給的就是這個條件：同一個人的兩個時刻。凡是在寬裕時不會犯的錯，就不該算進這個人的性格。",eg:"收成後不再犯的錯，不該記在他的性子上。"},
{n:"隧道效應：急事把要緊事擠出視野",d:"稀缺讓注意力收窄。隧道里的專注能救急，代價落在隧道之外——體檢、保險、該打的電話，而且要過很久才收賬。把隧道當常態運轉方式的人，最後總在處理上一輪欠下的事。",eg:"靠死線逼出的高產，代價常常是那段時間徹底不體檢、不回消息、不做長期決定。"},
{n:"餘裕不是浪費，是犯錯的空間",d:"把時間表和賬戶排滿看起來是效率最大化，實際是把容錯清零。有餘裕時一次意外只是一次意外；沒餘裕時同一次意外會連鎖——借錢、罰息、耽誤正事，一路滾下去。同樣的錯誤，窮的那一方付的價錢高得多。",eg:"留一筆動不得的應急金，作用不是收益，是讓一次小事故不至於變成一串。"}],
q:["把問題從「他為什麼這麼蠢」換成「他現在缺什麼」，答案會完全不同。——本書的提問方式（中譯）",
"這套解釋是給制度用的：給緊張中的人少設幾道手續，比勸他想清楚點有效得多。",
"他們比的不是窮人和富人，是同一批人的兩個時刻——這是這項研究最硬的地方。"],
apply:"手頭緊或時間緊、同時接連做出後來看很蠢的決定時，先做一次歸因校準：這些錯，我在不緊的時候會犯嗎？如果不會，別先改性格，先把佔帶寬的事減掉幾件——把重要的事挪成不需要你記得的形式（自動扣款、預約好的體檢、別人替你盯的日程），因為提醒在隧道里是失效的：你不是忘了，是當時看不見。用反了：拿它當免罪符，把所有失誤都歸給處境；或者拿它去替別人下結論——這是解釋處境的模型，不是給人貼標籤的工具。",
l:["塔勒布","格雷厄姆","李嘉誠","卡爾·紐波特"],
contrast:[{"n": "格雷厄姆", "why": "都在講容錯：格雷厄姆的安全邊際是給估值留餘地，稀缺的餘裕是給生活留餘地——一個防看錯，一個防意外"},
{"n": "卡爾·紐波特", "why": "都在算注意力的賬：紐波特算切換的損耗，稀缺算「還差多少」這件事持續佔掉的那部分"},
{"n": "德韋克", "why": "兩者都被用來解釋「人為什麼不改變」：德韋克指向信念，稀缺指向處境——先排除處境，再談信念"}]},

{c:"識人與相處",n:"瑪麗亞·康妮科娃",e:"2016年·《騙局》",w:"為什麼會上當",y:2016,
d:"心理學背景的作家，研究騙局。她的結論把問題整個掉了個方向：被騙的關鍵不在智力，在你當時正缺什麼。騙子並不製造信任，他識別並利用你已經有的需要——他要回答的只有三句：這個人是誰，他想要什麼，我怎麼順著那個慾望拿到我要的。所以真正被利用的是那份渴望，不是你的判斷力，這也解釋了為什麼高學歷、見過世面的人一樣中招。她的第二個發現更可操作：上當集中在人生的轉變期，那時候舊的判斷模板剛好失效。",
story:"她研究的騙局橫跨假畫商、假醫生、龐氏局和街頭小騙，受害者裡有教授、律師、金融從業者。反覆出現的不是「這些人不夠精明」，是「這些人當時正需要什麼」——需要回本、需要被承認、需要一個說得通的解釋。她因此指出防騙最沒用的做法就是提高警惕：警覺在渴望面前會失效，因為渴望本身在削弱警覺。受害者事後最常說的一句是「我平時不這樣」，而那句話通常是真的。她給的另一半答案是時間：騙局在劇變的時候最容易得手——搬到陌生城市、離婚、喪親、失業、退休、剛拿到一筆錢，這些時刻你手上沒有可用的參照，於是任何一個說得通的解釋都顯得格外可信。",
f:[{n:"先看它滿足了你的哪個渴望",d:"任何一個讓你心動的提議，先別問它真不真，問它為什麼現在打動了你。答案通常指向你當時最缺的那樣東西。這個順序比查證更靠前——因為查證會被渴望帶偏，你會不自覺去找支持它的證據。",eg:"急著回本的人最容易碰上「保本高息」，不是巧合，是篩選。"},
{n:"被騙與聰明無關，與處境有關",d:"把原因歸到「我蠢」有兩個壞處：不準，而且讓人羞於說出來，於是同一個騙局能反覆得手。換成「我當時正缺什麼」，才問得出可以改的東西。",eg:"受害者最常說的是「我平時不這樣」——那句話通常是真的。"},
{n:"轉變期是高危窗口，可以提前標出來",d:"搬家、換工作、離婚、喪親、退休、突然拿到一筆錢——這些時刻的共同點不是脆弱，是你手上沒有判斷模板。這條把防騙從一種性格變成了一份日程表：你能提前知道自己哪幾個月最危險。",eg:"剛到一個新城市，什麼價格算正常你完全沒概念——那就是窗口。"},
{n:"對付它靠制度，不靠警覺",d:"規矩在你冷靜的時候定，在你不冷靜的時候生效：多大金額必須過夜再決定、必須有第二個人看過、必須能查到獨立來源。這比任何識人術都可靠，因為它不依賴你當時的狀態。",eg:"「超過某個數額，隔一天再籤」——這條規矩救的人比讀心術多。"}],
q:["受害者事後最常說的一句是「我平時不這樣」，而那句話通常是真的。——《騙局》（中譯）",
"防騙最沒用的做法就是提高警惕：警覺在渴望面前會失效，因為渴望本身在削弱警覺。",
"教授、律師、金融從業者都在她的受害者名單上——這份名單本身就是論點。"],
apply:"有人給了你一個很難拒絕的提議、你隱約覺得哪裡不對時，先別查證，先問一句：它滿足了我此刻最缺的哪一樣東西？答案越清楚，越該警惕。然後看日曆：我是不是正處在一段轉變期——剛搬家、剛換工作、剛失去一個人、手上剛多了一筆錢？如果是，給接下來三個月的大額決定預先加一道手續，找一個不在這段處境裡的人過一遍。用反了：把它變成誰都不信，那是另一種失能；或者拿它去指責已經被騙的人——這套論點的核心恰恰是那不是智力問題。",
l:["影響力","烏合之眾","曾國藩","稀缺"],
contrast:[{"n": "影響力", "why": "西奧迪尼講的是六種手法怎麼起作用，康妮科娃講的是同一套手法為什麼在某些時刻對某些人特別有效——一個看武器，一個看靶子"},
{"n": "曾國藩", "why": "曾國藩的廣收慎用是在真事裡看人，康妮科娃說的是當你正缺什麼的時候，那套看人的功夫會先失靈"},
{"n": "稀缺", "why": "兩者都把「他怎麼這麼蠢」換成了「他當時缺什麼」：稀缺講帶寬被佔，騙局講渴望被用"}]},

{c:"世界如何運轉",n:"格蘭諾維特",e:"1973年·美國社會學雜誌",w:"弱連接",y:1973,
d:"社會學家，1973年發表《弱連接的力量》，一篇被引用了幾萬次的論文。他調查282個人怎麼找到工作，發現靠人際關係拿到工作的那批人裡，56%說自己只是「偶爾」見到那位幫上忙的人，28%說「極少」——真正起作用的是關係不深的那些人。原因不在意願，在信息結構：你和好友的圈子高度重疊，他知道的機會你多半也知道；而不常見面的人站在另一片網絡裡。他由此給出一句更硬的結論：沒有一條強連接是橋。",
story:"那句「沒有一條強連接是橋」不是修辭，是幾何推導。如果你和A很親近、和B也很親近，那麼A和B大概率也彼此認識——親近的人會互相引見，圈子於是閉合。既然閉合了，你們三個知道的事就高度重疊，誰也不是通往外部的通道。而橋只能由那些不常來往的關係充當，因為只有它們兩頭連著不重疊的圈子。這條推論有個很實際的後果：換城市、離開一個行業時，最先消失的不是好朋友——那幾個會留下——而是那一大片偶爾見面的人。失去的正是提供新機會的那一層，所以換地方之後的機會荒不是錯覺，是結構性的，而且需要時間重建。",
f:[{n:"起作用的不是意願，是信息的新舊",d:"至交更願意幫你，但他能給的信息和你手上的高度重複——你們看同一批人、同一批消息。弱連接的價值不在於更熱心，而在於他站的位置不同，手上有你接觸不到的那部分。",eg:"同事群裡的機會你早知道了；真正的新消息來自那個一年見一次的人。"},
{n:"圈子閉合是強連接的必然結果",d:"這不是社交策略問題，是幾何：親近意味著高頻接觸，高頻接觸讓你的朋友們彼此認識。閉合本身很好——它帶來支持和信任——但它同時意味著信息在裡面循環，不再有新的進來。",eg:"抱團很緊的小團隊內部消息靈通，對外面正在發生什麼反而最遲鈍。"},
{n:"判斷一條關係是不是橋，看兩頭重不重疊",d:"判據很簡單：如果這個人認識你身邊大部分的人，他就不是橋；如果你倆的共同好友很少，他很可能是。橋的價值和你倆有多熟無關，只和兩頭的網絡重疊度有關。",eg:"共同好友只有一兩個的那位，比共同好友三十個的那位更可能帶來新東西。"},
{n:"換環境時，弱連接是最先斷的那一層",d:"搬去新城市、轉行、離開一個平臺，好友會留下，那一大片偶爾見面的人會斷。而那正是機會來源的那一層，所以新環境裡的機會荒是結構性的，靠努力彌補不了，只能靠時間重建。",eg:"到新城市半年沒有任何機會找上門，不是你變差了，是那一層還沒建起來。"}],
q:["我們靠親近的人活著，靠不親近的人改變處境。——對這項研究最常見的概括（中譯）",
"親近帶來支持，不親近帶來消息——兩者不能互相替代。",
"他沒有說要少交朋友，他說的是別指望朋友帶來新消息。"],
apply:"在找機會（工作、合作、客戶）卻只在最熟的幾個人裡打轉時，數一個數：過去半年我主動聯繫過的人裡，有多少是一年見不到幾次的？幾乎沒有，說明機會來源被掐掉了一層。要補的不是深度是廣度——讓更多弱連接保持「還認識、還知道你在做什麼」的狀態，成本很低，但那條線必須在你不用它的時候就留著。剛換城市或轉行的人尤其要算這筆賬：斷掉的正是這一層，重建需要時間，不是你變差了。用反了：去加一堆沒有內容的聯繫人——弱連接起作用的前提是對方還記得你是誰；或者因此冷落至交，那是另一種損失。",
l:["凱文·凱利","納瓦爾","主權個人","稀缺"],
contrast:[{"n": "凱文·凱利", "why": "兩條相反又互補的路：凱利要一千個鐵桿粉絲（強連接、深度），格蘭諾維特說機會來自弱連接（廣度）——一個用來養活自己，一個用來發現機會"},
{"n": "烏合之眾", "why": "都在講網絡裡的信息怎麼流動：勒龐看的是同質人群裡情緒如何傳染，格蘭諾維特看的是異質圈子之間信息如何跨越"},

{c:"家庭與關係",n:"阿德勒",e:"1870-1937年·奧地利",w:"課題分離",y:1870,l:["弗蘭克爾","愛比克泰德","尼采","非暴力溝通"],d:"個體心理學的創立者，弗洛伊德早期的同事，後來因為根本分歧決裂。弗洛伊德說人被過去決定，阿德勒說人被目的牽引——同一段童年，有人拿它當傷疤，有人拿它當藉口，有人拿它當燃料，差別不在經歷本身，在這個人想用它達成什麼。他還給出了人際關係裡最鋒利的一把刀：分清這件事的後果最終由誰承擔，就知道它是誰的課題。",story:"阿德勒本人是這套理論最好的註腳。他幼年患佝僂病，四歲才會走路，五歲差點死於肺炎，一生身高不足一米六，還有一個各方面都優於他的哥哥。按弗洛伊德的路徑，這該是一份創傷清單。阿德勒的解釋相反：正是這些讓他決定當醫生、研究人如何超越自身的限制。他把這個機制叫「自卑與超越」——自卑不是病，是驅動力；病的是把自卑當成不行動的理由。",f:[{n:"課題分離",d:"判據只有一個：這件事的後果最終由誰承擔，它就是誰的課題。孩子不寫作業，成績由孩子承擔；同事的情緒由同事承擔；父母的失望由父母承擔。別人怎麼看你，是別人的課題，你插不上手，也不必插手。",eg:"催孩子寫作業催到兩敗俱傷，是把孩子的課題攬成了自己的。你能做的是讓他知道後果、並在他求助時可用，僅此而已。"},{n:"目的論：不是因為，是為了",d:"阿德勒把「因為過去所以現在」翻成「為了某個目的所以現在」。一個人說因為童年陰影所以不敢社交，阿德勒會問：不社交讓你避開了什麼？答案往往是「避開被拒絕」。原因改不了，目的可以換。",eg:"「我因為太忙所以沒寫方案」——換個問法：不寫方案幫你避開了什麼？多半是避開被評判。這一問，卡點就從時間挪到了恐懼。"},{n:"自卑是燃料不是病",d:"阿德勒認為追求優越是人的常態，自卑感人人都有。區別在於：健康的人用它推動自己改善處境，形成「自卑情結」的人用它論證自己無法改善——「因為我不行，所以不必試」。同一份自卑，一個當油門，一個當剎車。",eg:"「我學歷不如他們」如果推著你去補短板，是燃料；如果成了你不投簡歷的理由，就是情結。"},{n:"共同體感覺",d:"阿德勒給心理健康下的定義不是自我實現，是「我對別人有用」這個實感。所以他治療抑鬱的方向常常是向外的：不是想辦法喜歡自己，是找一件能幫到別人的具體事。價值感是從貢獻里長出來的，不是從自我肯定裡。",eg:"反覆自我肯定卻越練越空，不如去做一件對具體的人有用的小事——後者產生的價值感更結實。"}],q:["==重要的不是過去發生了什麼，而是你如何解釋它。==","==別人怎麼看你，那是別人的課題。==","==決定我們自身的不是過去的經歷，而是我們賦予經歷的意義。=="],apply:"遇到人際的難受時，先做課題分離：這件事的後果最終誰承擔？不是我的課題，就交回去；是我的課題，別人的看法就不構成理由。再換目的論問一遍：我保持現狀，避開了什麼？",contrast:[{n:"弗蘭克爾",why:"兩人都從維也納出來、都反對「過去決定論」：阿德勒說人被目的牽引，弗蘭克爾說人在任何處境下保有選擇態度的自由"},{n:"愛比克泰德",why:"隔兩千年的同一刀：愛比克泰德分「可控與不可控」，阿德勒分「我的課題與你的課題」——都是把注意力從管不著的地方收回來"}]},
{c:"識人與相處",n:"非暴力溝通",e:"1999年·馬歇爾·盧森堡",w:"先說觀察",y:1999,l:["阿德勒","鬼谷子","蘇格拉底","影響力"],d:"盧森堡是臨床心理學家，一生在種族衝突、離婚調解、監獄和戰區做溝通調停。他發現絕大多數爭吵的引爆點不是分歧本身，而是把評論說成了觀察——「你從來不管孩子」聽著像陳述事實，其實是判決。他給出一個四步結構：觀察、感受、需要、請求。這套東西看著簡單，難在第一步就幾乎沒人做得到。",story:"盧森堡講過一次在難民營的演講。一個人站起來朝他喊「殺人犯」——因為盧森堡是美國人，而美軍的炸彈剛炸死他的孩子。盧森堡沒有辯解，他問：你是不是因為失去了孩子，憤怒到極點，希望有人明白這件事有多不公平？對方愣住，接著講了一個小時。演講結束時，那個人邀請盧森堡去他家吃飯。盧森堡說他什麼都沒做，只是把對方話裡的需要說了出來。",f:[{n:"觀察和評論必須分開",d:"「你這週遲到了三次」是觀察，「你總是遲到」是評論。前者對方無法反駁，後者對方必須反駁。絕大多數對話在第一句就輸了，因為說話的人以為自己在陳述事實，聽的人收到的是指控。",eg:"把「你根本不在乎這個項目」換成「這週三次會你都沒來」。同一件事，一句引發防禦，一句引發解釋。"},{n:"感受不是想法",d:"「我覺得你不尊重我」不是感受，是包著感受的評判——真正的感受是「我很難過」。區別在於：感受說的是我，評判說的是你。一旦句子的主語從我滑到你，對方就只能進入防守。",eg:"「我感覺被忽視了」裡的「被忽視」是對別人行為的判斷；「我有點失落」才是自己的狀態，對方沒法否認。"},{n:"需要藏在指責後面",d:"盧森堡的核心斷言：所有指責都是需要沒被滿足的笨拙表達。「你怎麼這麼自私」底下往往是「我需要被看見」。聽指責時如果只接收字面，就永遠在吵表層；把需要翻出來，衝突常常當場洩氣。",eg:"伴侶說「你眼裡只有工作」，字面是控訴，需要是陪伴。回應需要而不是反駁控訴，對話方向立刻變了。"},{n:"請求要具體到可執行",d:"「你能不能尊重我一點」不是請求，因為對方不知道該做什麼。「下次開會前你能不能先跟我說一聲」才是。模糊的請求註定落空，落空之後雙方都更確信「說了也沒用」。",eg:"把「多關心一下家裡」換成「每週三你能不能負責接孩子」。前者是抱怨，後者是可以答應或拒絕的事。"}],q:["==不帶評論的觀察是人類智力的最高形式。==","==所有的指責、攻擊、批判，都是需要沒有被滿足的悲劇性表達。==","==當我們把注意力放在彼此的需要上，衝突往往自行化解。=="],apply:"吵起來之前，先把要說的話過一遍四步：我看到的具體事實是什麼（不帶「總是」「從來」）？我的感受是什麼（主語是我）？我真正需要的是什麼？我具體請求對方做什麼？四步都填得出來再開口。",contrast:[{n:"鬼谷子",why:"兩套完全相反的說服術：鬼谷子研究怎麼摸清對方底牌再下手，盧森堡研究怎麼把雙方的需要都攤到桌面上"},{n:"蘇格拉底",why:"兩種讓對方自己說出答案的技術：蘇格拉底靠追問，盧森堡靠說出對方的需要"}]},
{c:"心智與情緒",n:"塞涅卡",e:"前4-65年·羅馬",w:"先算時間",y:-4,l:["馬可·奧勒留","愛比克泰德","蘇軾","弗蘭克爾"],d:"尼祿的老師、羅馬最富有的人之一，也是斯多噶派留下書信最多的人。他的特別之處在於：他不是在書齋裡談節制，他一邊在權力核心裡周旋一邊寫這些東西，最後被自己教過的學生賜死。他談憤怒、談時間、談死亡，都帶著一種被生活反覆驗證過的具體，而不是道德勸誡。",story:"塞涅卡在《論生命之短暫》裡算了一筆賬：人們吝惜財產，一枚錢幣都要計較，唯獨對時間揮霍無度——而時間是唯一失去後無法贖回的東西。他描述那些「忙碌者」：為別人的事奔波一生，臨死才發現從沒為自己活過。他的結論刻薄：不是我們擁有的時間太短，是我們浪費的太多；人生足夠長，只要你懂得使用它。",f:[{n:"憤怒是一個可以拆解的過程",d:"塞涅卡在《論憤怒》裡說憤怒不是瞬間爆發，而是三步：先接收到一個印象（他侮辱了我），再同意這個判斷（這確實是侮辱），最後決定報復。第二步是唯一的閘門——印象攔不住，判斷可以不給。",eg:"被頂撞時先別急著定性「他在挑釁」。把第二步停三秒，很多所謂侮辱只是對方笨拙。"},{n:"先預演最壞，恐懼就縮水",d:"斯多噶的「預想不幸」不是悲觀，是提前把最壞結果具體化：破產會怎樣、被解僱會怎樣。塞涅卡說恐懼的強度多半來自模糊，一旦你把它想到底，會發現自己扛得住，而且不必等它發生才開始準備。",eg:"怕丟工作，就把「丟了之後三個月怎麼過」寫清楚。寫完之後，那份怕會小很多，而且你已經有了預案。"},{n:"時間是唯一不能追回的成本",d:"錢丟了能再賺，時間不能。但人們對時間的態度恰好相反：會為幾十塊錢貨比三家，卻輕易答應一場毫無意義的應酬。塞涅卡要求把時間當成最稀缺的資產來算賬——誰在花你的時間，花得值不值。",eg:"評估一件事時，把「要花多少錢」換成「要花我多少小時，這些小時我本來會用來做什麼」。多數應酬當場就否了。"},{n:"不必等準備好才開始活",d:"塞涅卡最刺人的觀察是：人們總把生活推到將來——等升了職、等孩子大了、等退休。而將來是最不確定的東西。他說這類人不是活得短，是把一生都用在了準備上。",eg:"「等這個項目結束就……」如果這句話你說了三年，它要的不是更好的時機，是現在開始的一小步。"}],q:["==我們並不是擁有的時間太短，而是浪費的太多。==","==人生如果懂得利用，它就是漫長的。==","==你活著，彷彿註定要永遠活下去。=="],apply:"憤怒上來時，找到「同意」那一步，先不給判斷。做重要決定時，先把最壞的結果具體寫出來。評估任何一件事，先算它要花掉你多少小時。",contrast:[{n:"馬可·奧勒留",why:"同為斯多噶，位置相反：奧勒留是皇帝寫給自己的私人筆記，塞涅卡是權臣寫給別人的公開書信，一個更內省，一個更實用"},{n:"蘇軾",why:"東西方兩種逆境寫作：塞涅卡在權力中心寫節制，蘇軾在貶謫路上寫豁達——都是先被生活驗證過才寫下來的"}]},
{c:"識人與相處",n:"克里斯·沃斯",e:"2016年·FBI首席談判專家",w:"先標情緒",y:2016,l:["托馬斯·謝林","鬼谷子","非暴力溝通","影響力"],d:"FBI前首席國際人質談判專家，處理過綁架、劫持、恐怖襲擊。他的方法和商學院教的談判術幾乎相反：不談利益交換，先處理情緒。他的核心發現是，人在情緒沒被承認之前根本聽不進條件——所以第一步不是報價，是把對方的情緒準確說出來，讓對方覺得「這人懂我在想什麼」。",story:"沃斯講過一次銀行劫案的對峙。劫匪不接電話、不談條件。沃斯沒有喊話談判，他用一種刻意放慢的低沉聲音，隔著門說：看起來你不想出來。看起來你擔心一出來我們就會開槍。對方沉默很久，然後開口了。沃斯說，他沒有提出任何條件，只是把對方腦子裡最響的那句話替他說了出來——人一旦被準確地說中，就很難繼續把你當敵人。",f:[{n:"標註情緒，別評判情緒",d:"「看起來你有點為難」這種句式，沃斯叫標註（labeling）。要點是用「看起來 / 聽起來」開頭，不用「我覺得你」——前者是觀察，可以被否認，後者是斷言，會引發防禦。標註對了，對方會補充；標註錯了，對方會糾正——兩種都推進對話。",eg:"客戶沉默時說「聽起來這個方案有讓你顧慮的地方」，比問「您覺得怎麼樣」有效得多，因為它給了對方一個臺階開口。"},{n:"追求「說得對」而不是「說好」",d:"沃斯認為 yes 是最廉價的詞——人們為了脫身會隨口答應。真正有價值的是「說得對」（That's right），它意味著對方覺得你完整理解了他的立場。得到這三個字之後，談判才真正開始。",eg:"對方說「行行行」多半是想結束對話；對方說「對，就是這樣」才說明你說到了點上。前者要警惕，後者可以往下推。"},{n:"校準提問：把難題交回去",d:"用「怎麼做」和「是什麼」開頭的開放問題，替代要對方點頭的封閉問題。「我該怎麼做才能做到這一點？」這句話把壓力挪回對方那邊，且不帶對抗——對方要麼給出辦法，要麼自己意識到要求不合理。",eg:"對方壓價到成本以下，不必爭辯，問「按這個價格，你希望我怎麼保證質量」。多數時候對方會自己往回退。"},{n:"沒有交易好過壞交易",d:"沃斯說談判裡最強的位置是隨時可以走開。人質談判沒有這個選項，所以他更清楚有這個選項有多值錢。願意接受「談不成」的人，才不會被時間壓力和沉沒成本推著簽下傷人的條款。",eg:"進任何談判前先寫下自己的替代方案（談崩了我怎麼辦）。寫得越具體，桌上越不慌。"}],q:["==談判不是一場辯論，而是一個發現的過程。==","==「說得對」比「是」有價值得多。==","==把對方的情緒說出來，是消解它最快的辦法。=="],apply:"對話卡住時，別加碼論證，先標註對方的情緒：看起來你在擔心什麼。目標不是讓對方說「好」，是讓對方說「對，就是這樣」。被逼到牆角時，用「我該怎麼做」把問題交回去。",contrast:[{n:"非暴力溝通",why:"兩套都從情緒入手，目的不同：盧森堡為了讓雙方的需要都被看見，沃斯為了在對抗局面裡拿到結果"},{n:"托馬斯·謝林",why:"談判的兩面：謝林研究結構性的承諾與威脅，沃斯研究桌面上的語言和情緒——一個改變博弈的收益矩陣，一個改變對手的心理狀態"}]}
,
{c:"家庭與關係",n:"約翰·戈特曼",e:"1994年·華盛頓大學",w:"四種致命信號",y:1994,l:["非暴力溝通","阿德勒","影響力","克里斯·沃斯"],d:"心理學家，在實驗室裡錄下幾千對夫妻的對話，逐幀標記表情、語氣、心率，然後追蹤他們幾年後是否離婚。他的結論不靠理論：只看一段十五分鐘的爭吵，他判斷這對夫妻會不會分開，準確率超過九成。真正預測破裂的不是吵得兇不兇，是吵的時候有沒有出現四種特定的信號。（注意：那個「九成」是模型在自己擬合過的那批數據上的回頭準確率，不是對新樣本的預測——戈特曼與列文森 2002 年的論文自己寫明分析是事後的、結論只能當探索性的。四騎士這類行為編碼可以逐幀複核，那個預測數字不要照搬。）",story:"戈特曼把預測離婚的四種溝通模式稱為「末日四騎士」：批評（攻擊對方是什麼人，而不是這件事）、鄙視（諷刺、翻白眼、居高臨下——他說這是最強的單一預測因子）、防禦（把責任推回去）、冷戰（把人晾在那兒）。他同時發現健康的關係也吵架，區別在於吵的過程中會出現「修復嘗試」——一句玩笑、一個臺階、一次讓步。會不會修復，比會不會吵，重要得多。",f:[{n:"鄙視是最毒的一種",d:"四騎士裡鄙視殺傷力最大：翻白眼、嘲諷、模仿對方語氣，本質是「我比你高一等」。戈特曼的數據裡，鄙視出現頻率是離婚最強的單一預測因子，而且它還會影響接收方的免疫系統。這是必須完全戒掉的一種，不是少用。",eg:"「你懂什麼」「行行行你最厲害」這類話不是情緒發洩，是關係裡的慢性毒藥，說出口就要當場糾正。"},{n:"批評和抱怨不是一回事",d:"抱怨針對行為——「你今天沒洗碗，我很累」；批評針對人格——「你就是個懶人」。前者可以解決，後者只能防禦。戈特曼說很多人以為自己在提意見，其實每一句都在給對方定性。",eg:"把「你從來不管孩子」換成「這週三次接孩子都是我去的」。同一件事，後者對方能接。"},{n:"修復嘗試比不吵架重要",d:"健康關係不是沒有衝突，是衝突升級到一半有人能踩剎車——開個玩笑、說一句「等等，我們跑題了」。戈特曼發現幸福的夫妻修復嘗試的成功率高，不是因為技巧好，是因為對方願意接。願不願意接，取決於平時的賬戶餘額。",eg:"吵到一半有人說「我們是不是有點過了」，另一方順著臺階下，這一次衝突就止損了。硬要贏的那一方，贏的是這一局輸的是關係。"},{n:"五比一：平時的存款決定吵架時的額度",d:"戈特曼的量化發現：穩定關係裡，正面互動與負面互動的比例約為 5:1。這意味著修復能力不是吵架時的技巧，是平時積累的餘額——平時存得夠多，一次衝突才透支得起。",eg:"指望在衝突當下講道理化解，多半失敗；真正起作用的是過去幾週裡那些不起眼的回應和在場。"}],q:["==預測離婚最強的單一信號是鄙視。==","==幸福的伴侶不是不吵架，而是吵架時懂得修復。==","==穩定關係裡，正面互動與負面互動的比例大約是五比一。=="],apply:"衝突裡先自查四騎士：我這句是在說事還是在給人定性？有沒有諷刺和翻白眼？對方遞臺階時我接不接？平時的正面互動夠不夠撐起這次透支？",contrast:[{n:"非暴力溝通",why:"兩條路徑同一個方向：盧森堡教怎麼說，戈特曼用數據告訴你不這麼說的後果是什麼"},{n:"阿德勒",why:"阿德勒從課題歸屬處理關係，戈特曼從互動模式處理關係——一個改認知，一個改行為"}]},
{c:"家庭與關係",n:"關鍵對話",e:"2002年·帕特森等",w:"先造安全感",y:2002,l:["非暴力溝通","克里斯·沃斯","約翰·戈特曼","鬼谷子"],d:"四位作者研究了兩萬多人、上千個組織，想弄清一件事：為什麼有些人在高風險、有分歧、情緒激烈的對話裡能談成，多數人卻不能。他們的結論是，人在感到不安全的瞬間會退回沉默或暴力兩種本能，而對話一旦進入這兩種狀態，內容說得再對也沒用。所以關鍵不是準備論點，是先把安全感建起來。",story:"書裡反覆出現一個判斷：對話失敗的時刻，往往不是分歧最大的時刻，而是有一方覺得「我在這裡不安全」的時刻。他們觀察到人一旦感到不安全，只有兩條路——沉默（迴避、掩飾、退出）或暴力（貼標籤、控制、攻擊）。而絕大多數人在這時的反應是繼續講道理，越講對方越退。正確的做法反而是暫停內容，先修復安全感，再回到內容。",f:[{n:"先看狀態，再看內容",d:"對話中要同時盯兩件事：說的內容，和對方的狀態。一旦發現對方轉向沉默或攻擊，立刻停下內容——因為此刻說什麼都無效。修復安全感優先級永遠高於把話說完。",eg:"對方開始「嗯嗯」「隨便你」，別當成同意，那是沉默型退出。這時該問的不是「所以你同意嗎」，是「我是不是哪句話說重了」。"},{n:"從心出發：先問自己真正要什麼",d:"情緒上來時人的目標會偷偷改變——從「解決問題」變成「贏」「不丟臉」「懲罰對方」。作者的方法是當場自問：我真正想要的結果是什麼？我希望這段關係變成什麼樣？這一問能把目標拉回來。",eg:"爭到一半發現自己在乎的是「不能讓他覺得我錯了」——目標已經跑偏。承認這一點，對話才回得來。"},{n:"對比說明：先說不是什麼",d:"對方誤解你意圖時，最有效的修復句式是先否定誤解，再重申真意：「我不是想說你能力有問題，我是想說這個排期我們都低估了。」先拆掉威脅，再放內容，對方才聽得進後半句。",eg:"提意見前加一句「我說這個不是要追責」，能擋掉一大半防禦。"},{n:"共享事實池",d:"分歧往往不是結論不同，是各自握著對方不知道的信息。作者主張先把雙方的事實和推理都攤到桌面上，再討論結論——多數爭執在攤事實的過程中就自動消解了。",eg:"兩個部門吵優先級，各自說出自己看到的數據和被承諾過的事，常常發現吵的是兩件不同的事。"}],q:["==談不下去，多半不是分歧太大，是有人不安全了。==","==人一旦感到不安全，就會退回沉默或暴力。==","==先解決安全感，再解決問題。=="],apply:"對話變僵時，別加大論證力度，先判斷對方是沉默還是攻擊，然後停下內容修復安全感。開口前自問一次：我真正想要的結果是什麼。被誤解時用「我不是……我是……」把威脅拆掉。",contrast:[{n:"克里斯·沃斯",why:"都主張先處理情緒再談內容：沃斯在對抗局面裡標註對方情緒，《關鍵對話》在日常分歧裡重建安全感"},{n:"鬼谷子",why:"兩千年前後的兩套對話術：鬼谷子研究怎麼試探出對方的真實意圖，《關鍵對話》研究怎麼讓雙方都敢說真話"}]}
