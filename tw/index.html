<style>
:root{
  color-scheme:light only;
  --white:#fffdf8;--paper:#f7f4ec;--paper2:#efe8dc;
  --ink:#1c1917;--ink-70:#3a342f;--ink-50:#6b6358;--ink-30:#9a9184;
  --up:#9d2933;--sulfur:#f0ddd9;--up-bg:rgba(157,41,51,.12);
  --down:#9d2933;--down-bg:rgba(157,41,51,.10);
  --line:rgba(42,46,44,.08);--line-strong:rgba(42,46,44,.12);--line-2:rgba(42,46,44,.045);
  --tint:rgba(42,46,44,.03);--tint-hover:rgba(42,46,44,.055);
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-out-quart:cubic-bezier(0.25,1,0.5,1);
  --ease-spring:cubic-bezier(0.34,1.4,0.64,1);
  --dur-tap:100ms;--dur-fast:150ms;--dur-base:200ms;--dur-slow:260ms;
  --shadow-card:0 0 0 1px var(--line),0 1px 2px rgba(42,46,44,.04),0 4px 12px rgba(42,46,44,.02);
  --shadow-card-hover:0 0 0 1px var(--line-strong),0 2px 4px rgba(42,46,44,.05),0 8px 24px rgba(42,46,44,.05);
  --shadow-focus:0 0 0 3px rgba(42,46,44,.16);
  --glass-chrome:rgba(240,240,236,.72);--glass-light:rgba(250,250,247,.85);
  --r1:8px;--r2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-optical-sizing:auto;line-height:1.55;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 96px}

/* skip-link + focus */
.skip-link{position:absolute;left:12px;top:-52px;z-index:100;padding:8px 16px;background:var(--ink);color:var(--white);border-radius:6px;font-size:13px;font-weight:600;text-decoration:none;transition:top var(--dur-base) var(--ease-out-quart)}
.skip-link:focus{top:12px;outline:none}
:focus-visible{box-shadow:var(--shadow-focus);outline:none;border-radius:5px}

/* masthead — glass sticky */
/* unified brand lockup — match entry pages / yuansheng */
/* responsive lockup */
/* 頁頭的字號/尺寸/左右內距由 assets/hw-home-lockup.css 以 !important 統一接管，

   lockup 沒管的屬性：white-space。改頁頭請改 hw-home-lockup.css。
   小屏左右留白 24px 是選定的寬鬆版，不是漏改——原來那條 16px 的對比圖看過後

}

}

.hd-title{font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;font-size:clamp(22px,4.2vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.05}

@media(max-width:600px){
  .wrap{padding:0 24px 8px}

}

.hd{position:sticky;top:0;z-index:50;margin:0 -24px 26px;padding:26px 24px 15px;background:var(--glass-chrome);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.hd::after{content:'';position:absolute;left:24px;right:24px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(42,46,44,.10),transparent)}
.brand{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-50);margin-bottom:11px}

.hd-en{font-size:13px;color:var(--ink-50);letter-spacing:-.005em;font-weight:400}
.hd-stats{display:none}.share-btn{font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--white);color:var(--ink);cursor:pointer}.share-btn:active{transform:scale(.97)}
.stat{font-size:12px;color:var(--ink-50);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:160px;padding:9px 14px;border:none;border-radius:var(--r1);background:var(--white);box-shadow:var(--shadow-card);color:var(--ink);font-size:14px;font-family:inherit;transition:box-shadow var(--dur-base) var(--ease-out-quart)}
#q:focus{outline:none;box-shadow:var(--shadow-card-hover)}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.tab{padding:6px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;background:var(--white);color:var(--ink-70);box-shadow:0 0 0 1px var(--line);transition:color var(--dur-fast) var(--ease-out-quart),background var(--dur-fast) var(--ease-out-quart),box-shadow var(--dur-fast) var(--ease-out-quart);white-space:nowrap;user-select:none}
.tab.on{background:var(--ink);color:var(--white);box-shadow:none}
@media (hover:hover) and (pointer:fine){.tab:not(.on):hover{color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}}

/* timeline */
.era-block{margin-bottom:34px}
.era-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.era-label{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--ink-50);white-space:nowrap;padding:3px 10px;border-radius:20px;background:var(--tint);font-variant-numeric:tabular-nums}
.era-count{font-size:10px;color:var(--ink-30);white-space:nowrap;font-variant-numeric:tabular-nums}
.era-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(42,46,44,.10),transparent)}
.era-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tl-card{padding:13px 14px;border-radius:12px;background:var(--white);box-shadow:var(--shadow-card);cursor:pointer;transition:box-shadow var(--dur-base) var(--ease-out-quart);text-decoration:none;color:inherit;display:block}
.tl-year{font-size:10px;color:var(--ink-30);margin-bottom:5px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tl-name{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:8px;line-height:1.25}
.tl-word{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--up-bg);color:var(--up);display:inline-block;font-weight:600}
@media (hover:hover) and (pointer:fine){.tl-card:hover{box-shadow:var(--shadow-card-hover)}}
.empty{padding:56px;text-align:center;color:var(--ink-30);font-size:14px}

/* overlay + panel */
.ov{display:none !important;position:fixed;inset:0;background:rgba(42,46,44,.32);z-index:300;overflow-y:auto;padding:40px 16px 80px;display:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.ov.open{display:block}
.panel{background:var(--white);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 12px 48px rgba(42,46,44,.14);max-width:660px;margin:0 auto;padding:36px 40px;position:relative;animation:panel-in var(--dur-slow) var(--ease-out-expo);transform-origin:center top}
@keyframes panel-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.p-x{position:absolute;top:18px;right:18px;cursor:pointer;font-size:15px;color:var(--ink-50);background:var(--tint);border:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background var(--dur-fast),color var(--dur-fast)}
@media (hover:hover) and (pointer:fine){.p-x:hover{color:var(--ink);background:var(--tint-hover)}}
.p-cat{font-size:10px;color:var(--up);font-weight:600;text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px}
.p-name{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px;line-height:1.1}
.p-era{font-size:13px;color:var(--ink-50);margin-bottom:18px;font-variant-numeric:tabular-nums}
.word-row{margin-bottom:20px}
.wpill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--up-bg);color:var(--up)}
.p-desc{font-size:15px;color:var(--ink-70);line-height:1.75;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.sec{font-size:10px;font-weight:600;color:var(--ink-50);text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px;margin-top:26px}
.story-box{padding:14px 16px;border-left:2px solid var(--sulfur);background:var(--tint);border-radius:0 var(--r1) var(--r1) 0;font-size:14px;color:var(--ink-70);line-height:1.75}
.fw-list{display:flex;flex-direction:column;gap:8px}

.q-item{font-size:14px;color:var(--ink-70);line-height:1.7;padding:6px 14px;border-left:2px solid var(--line-strong);margin:6px 0;font-style:italic}

.contrast-name{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;padding-top:1px}

/* mobile */
@media(max-width:600px){
  .wrap{padding:0 24px 8px}
  .hd{margin:0 0 24px;padding:22px 0 14px}

/* ── 每日金句卡（OurWord 素紙濃墨 · 沉朱印 / 匯文明朝體） ────────────────── */

.dq{display:flex;gap:28px;align-items:center;margin:0 0 30px}
.dq-card{position:relative;flex:0 0 auto;width:320px;aspect-ratio:3/4;overflow:hidden;
  background:#f7f4ec;box-shadow:0 8px 32px rgba(0,0,0,.45)}

.dq-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dq-side{flex:1 1 auto;min-width:0}
.dq-hdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dq-eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--ink-50)}

.dq-from{margin-top:14px;font-size:14px;color:var(--ink-70);line-height:1.7}
.dq-cat{font-size:13px;color:var(--ink-50);margin-top:3px}

  padding-left:13px;border-left:2px solid var(--line-strong)}
.dq-link{background:none;border:none;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;
  border-bottom:1px solid var(--line-strong);transition:border-color var(--dur-fast) var(--ease-out-quart)}
.dq-link:hover{border-bottom-color:var(--ink)}
.dq-acts{display:flex;gap:8px;margin-top:20px}
.dq-sep{width:9px}
.dq-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line-strong);
  background:var(--white);color:var(--ink-70);border-radius:var(--r1);cursor:pointer;
  transition:transform var(--dur-tap) var(--ease-out-quart),background var(--dur-fast) var(--ease-out-quart),color var(--dur-fast) var(--ease-out-quart),border-color var(--dur-fast) var(--ease-out-quart)}
.dq-btn:hover{background:var(--tint-hover);color:var(--ink);border-color:var(--ink-30)}
.dq-btn:active{transform:scale(.97)}
.dq-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dq-toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:120;
  background:var(--ink);color:var(--white);font-size:13px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-out-quart),transform var(--dur-base) var(--ease-out-quart)}
.dq-toast.on{opacity:1;transform:translate(-50%,0)}
.dq-ov{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.88);display:none;

:root[data-theme="dark"]{--white:#1d1913;--line-strong:rgba(234,227,212,.22);--ink-30:rgba(234,227,212,.42);--ink-50:rgba(234,227,212,.6)}

:root[data-theme="dark"] #hwx .cf,:root[data-theme="dark"] #hwx .qc .who i,:root[data-theme="dark"] #hwx .nc .pn i,:root[data-theme="dark"] #hwx .seal{color:#ef8b78!important}

#hwx-theme{position:fixed;top:14px;right:14px;z-index:9999;width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:50%;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:none;padding:0}
#hwx-theme svg{width:17px;height:17px;display:block}
#hwx-theme:hover{color:var(--ink)}
/* 數量那一行自己佔一行：中文「80 個處境 · 253 個問題」短，跟在標題
   後面放得下；英文「80 situations · 253 questions」跟在後面就斷在
   「80」和「situations」之間，讀者看到的是標題行尾掛著一個孤零零的
   數字。讓它整塊下來一行。 */
#hwx-sccount{display:block}
#hwx .today{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin:18px 0 6px}
@media(max-width:700px){#hwx .today{grid-template-columns:1fr}}
/* 日夜切換是 fixed 在右上角的 36px 圓鈕；窄屏上它正壓在第一張卡的表頭右端
   （處境標籤那顆膠囊）上。表頭右邊讓出它的寬度。 */
@media(max-width:480px){#hwx .askhero .ahead{padding-right:38px}}
#hwx .tq{border:1px solid var(--line);border-radius:16px;padding:20px 22px;background:transparent;display:flex;flex-direction:column}
#hwx .tq .dt{font-size:12.5px;letter-spacing:.24em;color:var(--acc);font-weight:700;margin-bottom:6px}
#hwx .tq .tgl{font-family:"Noto Serif TC","Source Han Serif SC","Songti SC","STSong",serif;font-size:clamp(19px,3.4vw,24px);font-weight:700;line-height:1.75;color:var(--ink);opacity:1;margin:0 0 12px}
#hwx .tq .q{font-size:15px;line-height:1.9;color:var(--ink);opacity:.7;margin-bottom:10px}
#hwx .tq .src{font-size:13.5px;color:var(--muted)}
#hwx .tq .src a{color:var(--acc);text-decoration:none}

#hwx .tq .acts button{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;font-family:inherit;font-size:14px;cursor:pointer}

#hwx .askhero #hwx-asc-tag{margin:-6px 0 14px}
/* 搜不到時的那塊。語氣跟站上一致：先說沒找到什麼，再給一條出路。 */
#hwx #hwx-none{border:1px dashed var(--line);border-radius:14px;padding:20px 18px;margin:14px 0 8px;text-align:center}
#hwx #hwx-none b{display:block;font-family:"Noto Serif TC","Songti SC",serif;font-size:17px;line-height:1.7;color:var(--ink)}
#hwx #hwx-none i{display:block;font-style:normal;font-size:13.5px;line-height:1.8;color:var(--muted);margin:6px 0 14px}
#hwx #hwx-none button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 18px;font-family:inherit;font-size:13.5px;cursor:pointer}
#hwx .askhero #hwx-asc-tag button{border:0;background:transparent;color:var(--muted);padding:0;font-family:inherit;font-size:12.5px;line-height:1.7;cursor:pointer;text-align:left}
#hwx .askhero #hwx-asc-tag button:hover{color:var(--acc)}
#hwx .amine{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
/* 按鈕放進框裡的右下角。手機上預填句會折成三行，框一長高，貼在框外面的
   圓球就成了另一樣東西；放進去之後它跟著框底走，單行時正好居中（6+30+6=42）。 */
#hwx .amine .arow{display:flex;align-items:flex-end;gap:4px;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:0 6px 0 0}
#hwx .amine .arow:focus-within{border-color:var(--acc)}

#hwx .amine button{flex:0 0 auto;height:30px;margin:6px 0;border:none;border-radius:9px;background:var(--ink);color:var(--paper);font-family:inherit;font-size:14px;line-height:30px;padding:0 14px;cursor:pointer}
#hwx .amine button:disabled{opacity:.4;cursor:default}

#hwx .askhero .said{font-family:"Noto Serif TC","Songti SC",serif;font-size:13.5px;color:var(--acc);line-height:1.7;margin:11px 0 0}
#hwx .askhero .q{font-family:"Noto Serif TC","Source Han Serif SC","Songti SC","STSong",serif;font-size:21px;font-weight:700;line-height:1.75;margin:0 0 14px}

#hwx .askhero .go a{display:block;text-decoration:none;color:inherit;border-top:1px dashed var(--line);padding-top:11px;margin-top:12px}
#hwx .askhero .go a.lead b{font-size:17px;color:var(--ink)}
#hwx .askhero .go a.lead i{font-size:14px;line-height:1.75;color:var(--ink);opacity:.85}
#hwx .askhero .go a.sub b{font-size:14px}
#hwx .askhero .go a.sub i{font-size:12.5px}
#hwx .askhero .go b{font-family:"Noto Serif TC","Songti SC",serif;font-size:15.5px;display:block}
#hwx .askhero .go i{font-style:normal;font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
/* 今日一問主篇下的「這人是誰」：一天一張、位置最靠前，多一行憑據划算。
   處境卡不加——28 張連著刷，每張多一行會讓掃讀變慢，而卡片的主角是那句問題。 */

function drawCard(cb){
  var cv=document.createElement('canvas');cv.width=1080;cv.height=1440;var c=cv.getContext('2d');
  var loaded=0,need=3;function chk(){if(++loaded>=need)render();}
  document.fonts.load('900 128px "Noto Serif TC"').then(chk).catch(chk);
  document.fonts.load('700 58px "Noto Serif TC"').then(chk).catch(chk);
  document.fonts.load('500 34px "Noto Serif TC"').then(chk).catch(chk);
  function render(){
    c.fillStyle='#f5f1e8';c.fillRect(0,0,1080,1440);
    c.strokeStyle='#d8d2c6';c.lineWidth=2;c.strokeRect(46,46,988,1348);
    c.fillStyle='#a33b2e';c.font='900 128px "Noto Serif TC"';c.fillText(String(_n.getDate()),96,232);
    c.fillStyle='#8a8377';c.font='500 34px "Noto Serif TC"';c.fillText((_n.getMonth()+1)+'月 · 星期'+WD[_n.getDay()],100,296);
    c.fillStyle='#9d2933';
    (function(x,y,w){var r=w*0.22;c.beginPath();
      c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
      c.lineTo(x+w,y+w-r);c.quadraticCurveTo(x+w,y+w,x+w-r,y+w);
      c.lineTo(x+r,y+w);c.quadraticCurveTo(x,y+w,x,y+w-r);
      c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();c.fill();})(880,110,104);
    c.fillStyle='#fff';c.font='700 62px "Noto Serif TC"';
    c.textAlign='center';c.fillText('人',932,182);c.textAlign='left';
    c.fillStyle='#1f1c17';c.font='700 58px "Noto Serif TC"';
    var q='「'+q1.q+'」',lines=[],cur='',PUNC='，。、；：！？…」）';
    for(var i=0;i<q.length;i++){var tt=cur+q[i];if(c.measureText(tt).width>880&&PUNC.indexOf(q[i])<0){lines.push(cur);cur=q[i]}else cur=tt}
    if(cur)lines.push(cur);
    var y=560+(5-Math.min(lines.length,5))*46;
    lines.slice(0,6).forEach(function(l){c.fillText(l,100,y);y+=98});
    /* 解析：一句話，畫在署名之上；行數按實際內容，不預留空檔 */
    var ay=y+46;

      var wl=[],cu='';

        if(c.measureText(tw).width>860&&PUNC.indexOf(q1.gl[j])<0){wl.push(cu);cu=q1.gl[j]}else cu=tw}
      if(cu)wl.push(cu);
      wl=wl.slice(0,3);
      wl.forEach(function(l){c.fillText(l,100,ay);ay+=46});
    }
    ay+=54;   /* 與上一段空出一行 */
    c.fillStyle='#8a8377';c.font='500 34px "Noto Serif TC"';
    c.textAlign='right';c.fillText('—— '+q1.who+' · '+q1.cn,980,ay);c.textAlign='left';
    c.strokeStyle='#d8d2c6';c.lineWidth=2;c.beginPath();c.moveTo(100,1230);c.lineTo(980,1230);c.stroke();
    c.fillStyle='#1f1c17';c.font='700 34px "Noto Serif TC"';c.fillText('人類世界生存法則',100,1318);
    c.fillStyle='#a33b2e';c.font='500 30px "Noto Serif TC"';c.fillText('OurWord.ai',100,1366);
    var qr=new Image();

  b.dataset.g=s.g||'';

    scEl.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');

      return '<div class="qz"><div class="qzq">'+q.q+'</div>'

      b.classList.remove('on');

/* 默認只露兩行，其餘收起 */
(function(){
  var open=false;
  function tags(){return Array.prototype.filter.call(
    scEl.querySelectorAll('button'),function(b){return b!==scMore})}
  function showAll(){tags().forEach(function(b){b.style.display=''})}
  var PER_GROUP=2;   /* 每組默認露幾個——14 組 × 3 個佔了 1268px，近兩屏 */
  function heads(){return Array.prototype.slice.call(scEl.querySelectorAll('.scg'))}
  function fold(){
    if(open){
      showAll();heads().forEach(function(h){h.style.display=''});
      scMore.textContent='收起';return;
    }
    showAll();
    scMore.textContent='展開全部 '+D.S.length+' 個';
    /* 每組只留前 PER_GROUP 個；組標題始終顯示，讓用戶知道底下還有 */
    var count={};
    tags().forEach(function(b){
      var g=b.dataset.g||'';
      count[g]=(count[g]||0)+1;
      if(count[g]>PER_GROUP)b.style.display='none';
    });
    heads().forEach(function(h){h.style.display=''});
  }
  scMore.onclick=function(){open=!open;fold()};
  fold();
  window.addEventListener('resize',function(){if(!open)fold()});
  /* 默認展開第一個處境。用 open() 而不是 click()：
     click 會走「已選中則摺疊」這條分支，導致用戶點第二個標籤時
     第一下只是取消展開，要點兩下才切換。 */
  var first=tags()[0]; if(first && first._open) first._open();
})();

function cta(e){
  var T=['拆開看他的 '+e.nc+' 套打法 →','先讀「'+(e.c0||'')+'」→','他的答案分 '+e.nc+' 篇講透 →','進去偷師 →',

         '深讀 '+e.nc+' 篇，夠用很久 →','「'+(e.c0||'')+'」值得先看 →','他的方法都在裡面 →','讀透這 '+e.nc+' 篇再走 →',
         '看完你會換個打法 →',e.nc+' 篇深讀備好了 →','從最狠的一篇讀起 →','他的路數，'+e.nc+' 篇拆完 →'];
  var h=0;for(var i=0;i<e.s.length;i++)h=(h*31+e.s.charCodeAt(i))>>>0;

var SC_CAP=28;

var SCGRP='';

/* 從內容頁返回要停在原來的位置。
   信息流是 JS 渲染的，瀏覽器恢復滾動位置的時候卡片還沒畫出來，頁面高度
   還是零——恢復到哪都一樣，結果就是回到頂部，讀者得重新翻一遍。
   所以自己記：點進任何一張卡之前，把當前頁籤和位置存進 sessionStorage；
   回來渲染完再放回去，然後**立刻清掉**——只有「返回」該恢復，重新打開
   首頁不該。 */
var HWX_POS='hwx_feed_pos';
addEventListener('pagehide',function(){
  try{sessionStorage.setItem(HWX_POS,JSON.stringify({t:TAB,y:scrollY}))}catch(e){}
});
(function(){
  var raw=null;
  try{raw=sessionStorage.getItem(HWX_POS);sessionStorage.removeItem(HWX_POS)}catch(e){}
  if(!raw)return;
  var st=null; try{st=JSON.parse(raw)}catch(e){}
  if(!st||!st.y)return;
  /* 只有真的是「返回」才恢復：導航類型是 back_forward，或者上一頁就是本站。
     重新在地址欄打開首頁時不該跳到半截。 */
  var nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{};
  var back=nav.type==='back_forward'||(document.referrer&&document.referrer.indexOf(location.origin)===0);
  if(!back)return;
  /* 必須等 load 之後再放：頁面啟動時還會自己調一次 switchTab('境')
     （處境層的初始化），在 rAF 裡恢復的話頁籤會被它蓋回去 ——
     實測位置恢復對了、頁籤卻停在「處境」，而存的是「全部」。 */
  /* 恢復頁籤靠**點那個按鈕**，不靠比較 TAB。頁面上有不止一個叫 TAB 的
     變量（另一處的值是「最新」，而按鈕的 data-t 是「新/全/境」），拿它
     比較永遠對不上；點按鈕走的是和用戶完全一樣的那條路徑。
     再往後推一檔（load 之後再 60ms）：啟動時還有一次 switchTab('境')，
     早了會被它蓋回去 —— 實測位置恢復對了、頁籤卻停在「處境」。 */
  addEventListener('load',function(){setTimeout(function(){
    if(st.t){
      var b=document.querySelector('#hwx-tabs2 button[data-t="'+st.t+'"]');
      if(b&&!b.classList.contains('on'))b.click();
    }
    scrollTo(0,st.y);

/* 搜索原來兩個毛病疊在一起。
   一是逐字子串（data-t.indexOf(v)），差一個字就 0 條：搜「我很難受」出 0，
   可站裡的問句是「這件事為什麼讓我這麼難受？」。
   二是範圍只覆蓋「全部」裡的條目和金句卡——112 個處境、521 個問題
   壓根沒進索引，所以搜「突然沒了工作」（處境名逐字）也是 0，
   而那個處境下面掛著 8 個問題。
   讀者進這個站的方式恰恰是用自己的話說處境，最該管用的那類輸入全廢了。

   改成和懸浮球同一套：二元組 + IDF 加權。稀有的詞才是查詢的意思所在——
   「的人」在幾百張卡里都有，「裁員」只在一兩張裡有，兩者不能同權。
   而且真的按分數排序，不再讓 DOM 順序決定誰在前面。
   處境問題在有查詢時一併搜、一併排。 */
function _bg(t){var g={},i;for(i=0;i<t.length-1;i++)g[t.slice(i,i+2)]=1;return g}
var _IDF=null;
function _idf(){
  if(_IDF)return _IDF;
  var df={},docs=[],i;
  feed.querySelectorAll('.pc,.xtra').forEach(function(c){docs.push(c.getAttribute('data-t')||'')});
  for(i=0;i<scText.length;i++)docs.push(scText[i]);
  docs.forEach(function(d){var g=_bg(d);for(var k in g)df[k]=(df[k]||0)+1});
  _IDF={df:df,n:docs.length,dflt:Math.log(docs.length+1)};
  return _IDF;
}
function _score(hay,vg){
  var d=_idf(),s=0;
  for(var k in vg){
    if(hay.indexOf(k)<0)continue;
    var c=d.df[k];
    s+= c?Math.log((d.n+1)/(1+c)):d.dflt;
  }
  return s;
}
function applyFeed(){
  if(!feed||!ct)return;
  var v=(document.getElementById('q')||{value:''}).value.trim().toLowerCase();
  var vg=_bg(v),vn=0,_k;for(_k in vg)vn++;
  var full=vn?_score(v,vg):0;          /* 整條查詢自己的權重之和，當閾值的基準 */
  /* 兩條判據取「或」。按佔比會漏掉一類：搜「我很難受」，站裡的問句是
     「這件事為什麼讓我這麼難受？」——只對上「難受」一組，佔比不夠，
     可「難受」本身在全站只出現在很少幾張卡里，它就是這句查詢的意思所在。
     所以再加一條絕對權重：命中一個足夠稀有的詞，就夠了。 */
  var need=full*0.32;
  /* 只對短查詢放寬。長查詢本來就有足夠多的組，佔比是可靠的；
     再疊一條絕對權重，「一個能約的人都沒有」會從 30 條漲到 151 條——
     排序還是對的，但後面全是噪音。 */
  var rare=(vn<=4)?2.6:Infinity;

  if(!qres){qres=document.createElement('div');qres.id='hwx-qres';qres.className='scfeed';feed.parentNode.insertBefore(qres,feed);}

      var ok=(CAT==='全部');c.classList.toggle('hid',!ok);if(ok)vis0++;});

  }
  /* 條目卡和金句卡：打分、隱藏低分的、按分數重排 */
  var keep=[];
  feed.querySelectorAll('.pc,.xtra').forEach(function(c){
    var isPc=c.classList.contains('pc');
    var inCat=isPc?(CAT==='全部'||c.getAttribute('data-c')===CAT):(CAT==='全部');
    var hay=c.getAttribute('data-t')||'';
    var sc=(hay.indexOf(v)>=0)?full+1:_score(hay,vg);
    var ok=inCat&&sc>0&&(sc>=need||sc>=rare);
    c.classList.toggle('hid',!ok);
    if(ok)keep.push([sc,c]);

  keep.sort(function(a,b){return b[0]-a[0]});
  keep.forEach(function(p){feed.appendChild(p[1])});
  /* 處境裡的問題：只在有查詢時出現，排在條目前面——
     用自己的話搜處境的人，要的是「有人問過這件事」，不是一張人物名片。 */
  var hits=[];
  for(var i=0;i<scText.length;i++){
    var t=scText[i];
    var sc2=(t.indexOf(v)>=0)?full+1:_score(t,vg);
    if(sc2>0&&(sc2>=need||sc2>=rare))hits.push([sc2,i]);

  hits.sort(function(a,b){return b[0]-a[0]});
  hits=hits.slice(0,12);

  ct.textContent=(keep.length+hits.length)+' 條知識';
  /* 一條都沒有的時候得說話。原來是整片空白——讀者分不清是搜不到還是頁面壞了。
     另外兩個站都有這句（「沒有匹配的，換個詞試試」「沒有匹配的深讀」），只有這兒沒有。
     出路指向處境：用自己的話搜不到，多半是詞不對，而處境是按人話寫的。 */
  var none=document.getElementById('hwx-none');
  if(!none){none=document.createElement('div');none.id='hwx-none';none.style.display='none';feed.parentNode.insertBefore(none,feed);}
  if(keep.length+hits.length===0){
    none.innerHTML='<b>沒找到「'+esc(v)+'」</b>'
      +'<i>換個說法試試——或者到下面的處境裡挑你自己那一件。</i>'
      +'<button type="button" id="hwx-none-go">去挑處境 →</button>';
    none.style.display='';
    var g=document.getElementById('hwx-none-go');
    if(g)g.onclick=function(){

      var el=document.getElementById('hwx-tabs2');

   是 div 套一個鏈接——讀者點在卡片別處沒反應，等於每張卡有一小片能點、一大片不能。
   委託到 feed 上：點在真鏈接上走原生跳轉，點在卡片別處就跳這張卡唯一那個去處。 */
['hwx-ncfeed','hwx-feed','hwx-scfeed'].forEach(function(id){
  var el=document.getElementById(id); if(!el)return;
  el.addEventListener('click',function(e){
    if(e.target.closest('a'))return;
    var card=e.target.closest('.kc'); if(!card)return;
    var a=card.querySelector('a[href^="/tw/i/"]'); if(!a)return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
    a.click();
  });
});
/* 卡片點擊：用委託，三個 feed 一處覆蓋。只記卡片類型和去向，不記內容。 */
['hwx-ncfeed','hwx-feed','hwx-scfeed'].forEach(function(id){
  var el=document.getElementById(id); if(!el)return;
  el.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="/tw/i/"]'); if(!a)return;
    var card=e.target.closest('.pc,.nc,.qc,.kc');
    var kind=card?(card.classList.contains('kc')?'question':
              card.classList.contains('qc')?'quote':
              card.classList.contains('nc')?'chapter':'person'):'other';
    trk('card_click',{card_type:kind, feed:id.replace('hwx-',''), dest:a.getAttribute('href')});
  },true);
});
/* 處境層展開區的答案點擊 */
(function(){
  var r=document.getElementById('hwx-res'); if(!r)return;
  r.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="/tw/i/"]'); if(!a)return;
    trk('card_click',{card_type:'situation_answer', feed:'res', dest:a.getAttribute('href')});
  },true);
})();
/* 今日一問的答案點擊 */
(function(){
  var g=document.getElementById('hwx-ago'); if(!g)return;
  g.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="/tw/i/"]'); if(!a)return;
    trk('card_click',{card_type:'daily_question', feed:'hero', dest:a.getAttribute('href')});
  },true);
})();
switchTab('境');
})();</script>

<script>
const D=[{c:"謀略與競爭",n:"孫子兵法",e:"春秋·前500年前後",w:"先勝後戰",y:-500,
d:"十三篇，中國最重要的戰略體系，2500年來被兵家、商家、政治家反覆研讀。孫子的核心邏輯是：贏家在開戰前就確保了勝利，失敗者是先打再想怎麼贏。這不是在說運氣，是在說準備的深度決定結果的高度。孫子本人憑此書被吳王重用，以三萬兵破楚國二十萬，攻入楚國都城郢。",
story:"吳王要檢驗孫子的能力，讓他訓練宮廷美女。孫子把吳王的兩位寵姬任命為隊長，說明規則，擊鼓，美女們嬉笑不動。孫子說：規則不清，是將官之過——再次說明，再次擊鼓，美女還在笑。孫子說：規則已清，不從命，是隊長之過——斬了兩位寵姬。吳王大驚，孫子說：將在外，君命有所不受。此後吳軍紀律嚴整，無往不勝。這個故事說明孫子的核心：制度比熱情更重要，執行比計劃更關鍵。",
f:[{n:"先勝後戰",d:"「勝兵先勝而後求戰，敗兵先戰而後求勝」。贏家在開戰前就把勝利條件備齊——地形、兵力、補給、士氣全部到位才動手。創業版本：市場調研、資金儲備、團隊配置全部到位才啟動，而不是邊做邊想。",eg:"淝水之戰前，謝安確認北府兵戰力、地形、士氣全部就位才應戰，以8萬對80萬，大勝。項羽則反例：鉅鹿之戰後每仗都是「先打再說」，最終烏江自刎。"},{n:"不戰而屈人之兵",d:"「上兵伐謀，其次伐交，其次伐兵，其下攻城」。最高明的競爭不是打贏，而是讓對手根本不想打。商業版本：建立足夠強的護城河，讓競爭對手看到就打退堂鼓——蘋果的品牌、微信的社交關係鏈，都是這個邏輯。",eg:"戰國時張儀憑一張嘴讓楚國放棄齊國盟友，秦國未動一兵一卒就瓦解了合縱聯盟。商業上，英特爾用「Intel Inside」品牌讓下游PC廠商主動宣傳自己，護城河不是技術而是心智。"},{n:"奇正相生",d:"「以正合，以奇勝」。正兵守住基本盤，奇兵打出意外。不是說主業不重要，而是主業是「正」，創新是「奇」——沒有正的穩固，奇無從借力；沒有奇的突破，正只能防守。"},{n:"虛實相生",d:"「我專為一，敵分為十，是以十攻其一也」。集中優勢打對手薄弱點。不要在對手最強的地方硬碰，找他忽視的細分市場切入——這是所有弱者對抗強者的基本邏輯。"},{n:"慎戰原則",d:"「主不可以怒而興師，將不可以慍而致戰」。情緒是戰略的大敵。劉備因關羽之死一怒徵吳，夷陵大敗，蜀漢從此一蹶不振——這是「慍而致戰」的教科書級案例。"},{n:"知己知彼",d:"「知己知彼，百戰不殆；不知彼而知己，一勝一負；不知彼，不知己，每戰必殆」。完整含義是三層：同時瞭解自己和對手（不敗），只瞭解自己不瞭解對手（五五開），兩者都不瞭解（必敗）。",eg:"馬雲創立阿里前做了詳細競爭對手研究，同時對自身「只懂中國中小企業」的準確認知，讓他在這個點上集中所有資源。"},{n:"廟算勝負",d:"「廟算多者勝，廟算少者不勝」。開戰前先在廟堂推演，把所有變量算清楚。現代版：重大決策前先寫下失敗的所有可能原因——把風險前置化。"},{n:"造勢借勢",d:"「善戰者，求之於勢，不責於人」。高手不依賴個人超常發揮，而是創造勢能讓普通人做出超常行為。看清勢在哪裡，比找到最強的人更重要。"}],
q:["百戰百勝，非善之善者也；不戰而屈人之兵，善之善者也。","知己知彼，百戰不殆；不知彼而知己，一勝一負；不知彼，不知己，每戰必殆。","兵無常勢，水無常形，能因敵變化而取勝者，謂之神。","勝兵先勝而後求戰，敗兵先戰而後求勝。","上兵伐謀，其次伐交，其次伐兵，其下攻城。"],
apply:"產品競爭中，先搭好不敗之地（核心用戶基礎、差異化定位）再去擴張，比先跑量再想壁壘穩得多。遇到強對手，不要在他的主場硬拼，找他看不見的角落先站穩。",
l:["毛澤東","粟裕","韓信","范蠡","管仲"],contrast:[{"n": "項羽", "why": "項羽是孫子兵法的反面教材——力拔山兮氣蓋世，卻輸給了「先勝後戰」都不會的劉邦"}, {"n": "宮本武藏", "why": "同樣是兵法，孫子講「廟算」，宮本武藏講「無形」——戰略思維vs武道哲學"}]},

{c:"謀略與競爭",n:"毛澤東",e:"近代·1893-1976",w:"集中優勢",y:1893,
d:"從師範生到建立新中國，毛澤東一生最重要的能力是：在最混亂的局面裡找到主要矛盾，然後把全部力量壓上去。《矛盾論》《實踐論》《論持久戰》，是他把軍事實踐昇華為哲學的三件代表作。",
story:"1947年，國民黨重點進攻延安，毛澤東決定主動放棄延安，以空間換時間。果然，國民黨軍進入延安後疲於守點，解放軍在運動中各個殲滅，一年內戰局完全逆轉。",
f:[{n:"集中優勢兵力",d:"「傷其十指不如斷其一指」。不要同時打多個敵人，把力量集中在一個點上形成壓倒性優勢，打垮一個再打下一個。"},{n:"矛盾論",d:"每個階段只有一個主要矛盾，解決了它，其他問題跟著解決。創業初期的主要矛盾是「產品能不能解決用戶問題」，先把這個解決了。",eg:"滴滴早期主要矛盾是「司機夠不夠」，一切資源全壓在補貼司機上，解決了這個才談其他。"},{n:"實事求是",d:"「沒有調查，沒有發言權」。一切結論產生於調查情況的末尾，而不是開頭。"},{n:"持久戰",d:"弱者對陣強者，不能求速決。「戰略防禦→戰略相持→戰略反攻」三個階段。"},{n:"統一戰線",d:"「聯合次要敵人，打擊主要敵人」——先集中一切力量打最危險的那個，對其他人暫時妥協甚至聯合。"},{n:"群眾路線",d:"「從群眾中來，到群眾中去」——決策不從書本來，從真實用戶來；政策制定後，再回到群眾中驗證、修正。"}],
q:["沒有調查，沒有發言權。","戰略上藐視敵人，戰術上重視敵人。","集中優勢兵力，各個殲滅敵人。","存地失人，人地皆失；存人失地，人地皆存。"],
apply:"團隊每季度開始前先問：這個階段最主要的矛盾是什麼？把資源全部壓在那一件事上，其他事情能推就推，能緩就緩。",
l:["粟裕","孫子兵法","劉邦"],contrast:[{"n": "甘地", "why": "面對壓迫最極端的兩種路徑：毛澤東用武裝鬥爭，甘地用非暴力——都成功了，這是歷史奇蹟"}, {"n": "拿破崙", "why": "戰略思維的東西方對話：集中優勢vs奧斯特利茨——相隔150年的戰略共鳴"}]},

{c:"謀略與競爭",n:"粟裕",e:"近代·1907-1984",w:"以弱勝強",y:1907,
d:"解放軍第一戰將，淮海戰役以60萬對陣80萬，殲滅國民黨精銳55萬。他從不用蠻力，只用腦子——找對手必須救的地方打，讓對手陷入被動。",
story:"1947年淮海戰役前，粟裕三次向中央建議在長江以北打大殲滅戰。毛澤東最初不同意，粟裕堅持。最終毛澤東採納，淮海戰役一戰定乾坤。戰後毛澤東說：「淮海戰役，粟裕同志立了第一功」。",
f:[{n:"圍點打援",d:"攻打對手「必須救」的要點，在援軍來援的路上設伏——讓對手陷入「救也死，不救也死」的困境。"},{n:"運動戰",d:"「打得贏就打，打不贏就跑」——不是逃跑，是主動脫離不利戰場，保存實力，等待更好時機。"},{n:"殲滅戰思維",d:"不求佔領土地，只求消滅有生力量。不要追求市場份額數字，要削弱競爭對手的核心團隊和核心用戶。"},{n:"戰後復盤",d:"每次戰役結束，粟裕必有系統性總結。他從一個沒有軍校背景的普通士兵，用復盤積累成了解放軍第一戰將。",eg:"淮海戰役後，粟裕對每個戰鬥階段做詳細記錄，包括失誤和僥倖。他的戰後總結後來成為解放軍戰術教材。"},{n:"三次斗膽直陳",d:"面對毛澤東的戰略指示，粟裕曾三次「斗膽直陳」，堅持自己的判斷。他的方式是：用書面報告提出完整的戰略邏輯，讓事實和推理說話，不用情緒。"}],
q:["打得贏就打，打不贏就跑。","攻其所必救，殲其歸者。","情況明瞭，決心就大。"],
apply:"面對強大競爭對手，不要在他的主力產品上正面競爭。找他必須防守的側翼，持續施壓，讓他分散注意力，你再集中突破。",
l:["毛澤東","孫子兵法","韓信"],contrast:[{"n": "韓信", "why": "中國歷史上兩大「以弱勝強」軍事天才：韓信用奇謀，粟裕用圍點打援——都是把敵人逼入死地"}, {"n": "郭嘉", "why": "同樣的「斗膽直陳」精神：郭嘉敢對曹操說不，粟裕敢對毛澤東三次直陳"}]},

{c:"心智與情緒",n:"道德經",e:"春秋·前500年前後",w:"損",y:-500,
d:"老子五千言，是中國哲學的減法源頭。與儒家「為學日益」相對，老子說「為道日損」——不斷減掉，直到無為，然後無不為。道德經在西方被翻譯次數僅次於聖經。",
story:"老子騎青牛西出函谷關，守關令尹喜攔住他，請他留下智慧。老子寫了五千言，留下道德經，然後消失於歷史。",
f:[{n:"損之又損，以至於無為",d:"「為學日益，為道日損。損之又損，以至於無為，無為而無不為」。加法讓你知道更多，減法讓你看清本質。"},{n:"柔弱勝剛強",d:"「天下之至柔，馳騁天下之至堅」。水是天下最柔軟的東西，卻能穿石。持續的柔比短暫的剛更持久。"},{n:"反者道之動",d:"「反者道之動，弱者道之用」。物極必反，這是道的運動規律。看到頂點要想到衰退，看到低谷要相信轉機。"},{n:"知足者富",d:"「知足者富，強行者有志」。真正的富不是擁有更多，而是慾望更小。降低慾望，擴大自由。"},{n:"上善若水",d:"水處最低處（謙卑），繞開障礙（靈活），持續流動（堅持），最終穿石（效果）。以最小阻力達到最大效果。"},{n:"為而不爭",d:"「天之道，利而不害；聖人之道，為而不爭」——當所有人都在爭的時候，你退出競爭，你就沒有對手了。"}],
q:["為學日益，為道日損。損之又損，以至於無為，無為而無不為。","知人者智，自知者明。勝人者有力，自勝者強。","功遂身退，天之道也。","天下之至柔，馳騁天下之至堅。","知足者富，強行者有志。"],
apply:"每季度做一次「減法清單」：把當前做的所有事列出來，刪掉20%最不重要的。不是說這些事不好，是資源有限，專注才有力量。",
l:["王陽明","范蠡","李泌"],contrast:[{"n": "論語", "why": "中國思想史最重要的兩極：老子「損之又損」的減法哲學vs孔子「學而時習之」的加法實踐"}, {"n": "主權個人", "why": "兩千年的思想穿越：道德經「功遂身退、知足者富」是最古老的主權個人哲學"}]},

{c:"心智與情緒",n:"王陽明",e:"明·1472-1529",w:"知行合一",y:1472,
d:"龍場悟道，創立心學。他是中國歷史上極罕見的「立德、立功、立言」三不朽者。他的核心洞察：理不在外物，在人心——不是向外格物，而是向內致良知。",
story:"王陽明37歲被貶貴州龍場，瘴氣橫行，吃住都成問題。有一天夜裡，他在石棺裡打坐，突然大呼：「聖人之道，吾性自足！」——龍場悟道。他悟到：聖人的道理不需要向外尋找，人心裡本來就有。",
f:[{n:"心即理",d:"「心外無物，心外無理」。事物的意義和價值來自你的心。你的判斷標準來自內心，不來自外部權威。"},{n:"知行合一",d:"「知之真切篤實處即是行，行之明覺精察處即是知」。知和行不是兩件事，是一件事的兩個面。你說「我知道要早起」但從不早起——那叫「念頭」，不叫「知」。"},{n:"致良知",d:"良知是內心天然具備的判斷能力，只需要「致」——去除遮蔽良知的私慾（恐懼/貪婪/面子/惰性）。"},{n:"事上磨鍊",d:"「人須在事上磨鍊做功夫，乃有益」。不是坐在屋裡想通了就算，而是在真實事件中經受磨鍊。"},{n:"破心中賊",d:"「破山中賊易，破心中賊難」——真正的敵人不在外面，在心裡：恐懼、懶惰、虛榮、自欺。"},{n:"立志",d:"「志不立，天下無可成之事」——找到一個真正觸動你內心良知的方向，然後不管外部條件如何都堅持。"}],
q:["知行合一。","破山中賊易，破心中賊難。","此心不動，隨機而動。","人須在事上磨鍊做功夫，乃有益。","志不立，天下無可成之事。"],
apply:"當你發現團隊「知道但不做」，問題不在執行力，在激勵機制或認知——他們可能並不真的認為那件事重要。先解決認知問題，再談執行。",
l:["曾國藩","稻盛和夫","道德經"],contrast:[{"n": "蘇格拉底", "why": "東西方哲學的神奇互文：蘇格拉底「助產術」vs王陽明「致良知」——答案都在內心"}, {"n": "曾國藩", "why": "知行合一的理論與現實：王陽明悟道，曾國藩踐行"}]},

{c:"識人與相處",n:"曾國藩",e:"清·1811-1872",w:"慎",y:1811,
d:"歷史上最著名的「笨人逆襲」案例。他資質平平，考了七次才中舉。但他用「結硬寨打呆仗」的方法，把自己從一個普通官員做成了晚清最重要的人物。他的秘訣不是聰明，而是「比任何人都慎」。",
story:"曾國藩32歲開始寫日記，每天記錄自己的言行並嚴厲批評自己。有一次他在朋友面前辯論佔了上風，日記裡卻批評自己：「爭競之心太重，實為人品之大損」。他堅持寫日記三十年。",
f:[{n:"結硬寨打呆仗",d:"打仗時，每到一處必先紮營，營壘扎得極其堅固，然後挖壕溝把敵人圍起來，等待對方糧盡。他從不追求奇襲，從不走捷徑。",eg:"圍攻安慶，守了整整一年，沒有任何奇襲，城內糧盡，不戰而下。"},{n:"慎獨",d:"「慎獨則心安」。獨處時也守規矩，沒人看著的時候才是真正的考驗。"},{n:"每日反省",d:"堅持寫日記，不是記錄發生了什麼，而是批評自己：今天哪件事沒做好？哪句話說錯了？30年不斷的自我批評，形成了極強的自我校正能力。"},{n:"廣收慎用",d:"「廣收」是接觸大量人才；「慎用」是在真實任務裡考察，不靠簡歷面試。他發現李鴻章時，讓他參與真實的軍務決策，觀察他在壓力下的判斷。"},{n:"耐煩",d:"「天下事無所為而成者極少，有所貪有所利而成者居多，吾輩總以耐煩為第一要義」——所有重要的事都需要忍受漫長的無聊和重複。"}],
q:["天下古今之庸人，皆以一惰字致之；天下古今之才人，皆以一傲字致之。","慎之又慎，不可不慎。","困心橫慮，正是磨鍊英雄之時。","好漢打脫牙和血吞。"],
apply:"把「每日反省」變成一個儀式：每天睡前寫三行，今天做錯的一件事是什麼，原因是什麼，明天怎麼改。堅持一年，你會發現自己做決策的質量顯著提升。",
l:["王陽明","稻盛和夫","達里奧","諸葛亮"],contrast:[{"n": "馬可·奧勒留", "why": "東西方最相似的兩個人：都靠每日寫作反省，都在權力頂點保持克制"}, {"n": "王陽明", "why": "思想的傳承與落地：王陽明建立心學，曾國藩用一生實踐——悟道vs踐道"}],
fail:"1870年天津教案，他奉命查辦，為避免開戰接受了法國的條件——處死為首者、賠款、遣使道歉。輿論炸了：京師士大夫罵聲大作，「賣國賊」三字加在他頭上，湖南同鄉把他在北京會館裡的官爵匾額全部擊毀，連左宗棠和李鴻章都加入痛罵。曾紀澤記下父親那陣子給朋友寫信常寫的八個字：「外慚清議，內疚神明」。一年多後，他病死在兩江總督任上。",
lesson:["「耐煩」和「求穩」撐了他三十年，最後一次求穩毀了他的身後名。同一套方法，賭注不同，結果相反。","他一生對自己最嚴，卻栽在一件他自認無愧、別人認定有罪的事上。慎獨管得住動機，管不住別人怎麼定性。","有些位置上，避免更壞的結果和保住名聲只能選一個。選了前者，就得準備好被罵很多年。"]},

{c:"財富與風險",n:"范蠡",e:"春秋戰國·前536-前448",w:"進退",y:-536,
d:"中國歷史上最成功的退隱者，商聖陶朱公。他幫助越王勾踐從囚徒做到春秋霸主，然後在功成之日徹底離開——改名換姓，三次遷移，三次積累鉅富。",
story:"越國滅吳後，范蠡派人送信給文種：「飛鳥盡，良弓藏；狡兔死，走狗烹。越王為人長頸鳥喙，可與共患難，不可與共樂。子何不去？」文種不信留下，不久被賜死。范蠡當天就離開了，泛舟太湖。",
f:[{n:"知進退的時機",d:"「進」的時機：勢頭來了，全力投入；「退」的時機：功成之日，不等被推走——在頂點主動退比被動離場早一步。"},{n:"週期思維",d:"「旱則資舟，水則資車」——在旱的時候買船，因為你知道雨季會來。逆週期布局的祖師爺。"},{n:"散財之道",d:"范蠡三次積累鉅富，三次把財富散給鄰里。「財散則名聚」——散出去的財富換來的是更持久的東西：人心和安全感。"},{n:"飛鳥良弓",d:"權力關係是功能性的，不是情感性的。勾踐需要范蠡時，范蠡是寶；不需要時，范蠡是威脅。認清這一點，才知道什麼時候該留、什麼時候該走。"},{n:"擇人而處",d:"越王可與共患難，不可與共樂。判斷一個人能不能長期共事，看他得勢之後的行為，而不是落難之時。"}],
q:["飛鳥盡，良弓藏；狡兔死，走狗烹。","功遂身退，天之道也。","人取我予，人棄我取。","得時無怠，時不再來。"],
apply:"職業生涯的每個階段，定期問自己：這段關係/這份工作，我處於「可以繼續受益」還是「已經觸及天花板且開始積累風險」的階段？",
l:["白圭","李泌","張良","巴菲特","李嘉誠"],contrast:[{"n": "諸葛亮", "why": "功成的兩種選擇：范蠡在頂點主動退，諸葛亮至死不退——退vs不退的終極對照"}, {"n": "韓信", "why": "同樣功高蓋主：范蠡提前離場善終，韓信徘徊中間被殺——退的藝術"}]},

{c:"謀略與競爭",n:"韓信",e:"漢·前231-前196",w:"復盤",y:-231,
d:"中國歷史上最天才的軍事家。胯下之辱，背水一戰，十面埋伏——每一個都是教科書。但他的故事有兩面：軍事天才的崛起，和政治白痴的毀滅。",
story:"背水一戰前，韓信背靠河水列陣，軍官們全都覺得這是兵法大忌。戰後問他，韓信說：「兵法上說「陷之死地而後生，置之亡地而後存」——只有把他們逼到無路可退，才會拼死一戰。」",
f:[{n:"背水一戰",d:"「陷之死地而後生，置之亡地而後存」。去掉退路，才能激發最大潛能。"},{n:"明修棧道暗渡陳倉",d:"假裝修繕舊棧道（讓對手放鬆警惕），實際率主力從陳倉出擊，一舉定三秦。「以正合，以奇勝」的完美示範。"},{n:"功高震主的宿命",d:"韓信的錯不是「沒有造反」，而是「既不造反，也不交權」——這個中間狀態是最危險的，讓劉邦永遠不放心。"},{n:"復盤思維",d:"韓信每次打完仗必有總結。他從一個籍籍無名的流亡者，在極短時間內成為最偉大的軍事家。高手和普通人的差距，不在於錯了多少，在於從錯誤中學到了多少。"}],
q:["多多益善。","陷之死地而後生，置之亡地而後存。","悔不用蒯通之計，乃為兒女子所詐，豈非天哉！"],
apply:"每個重要項目結束後做「韓信復盤」：寫下這次為什麼成功或失敗的三個關鍵原因，不是表面原因，是根本原因。",
l:["劉邦","張良","孫子兵法"],contrast:[{"n": "張良", "why": "漢初三傑的命運分叉：張良徹底退善終，韓信不退不交權被殺"}, {"n": "霍去病", "why": "同為軍事天才：韓信善用奇謀，霍去病純粹燃燒——複雜vs純粹"}],
fail:"楚漢戰爭結束後，韓信被劉邦削去兵權，降為淮陰侯。公元前196年，呂后設局，以謀反之名請韓信入宮議事，當場處死，夷三族。他死前只說了一句話：「悔不用蒯通之計」。",
lesson:["知道危險不等於能躲開——韓信精通兵法，卻對自己的處境判斷失準。","「既不造反，也不交權」是最危險的中間狀態。","功高震主之後只有三條路：退（張良）、汙（蕭何）、交權（王翦）。不選，等於選了死。"]},

{c:"權力與組織",n:"劉邦",e:"漢·前256-前195",w:"用人",y:-256,
d:"歷史上最著名的「草根逆襲」案例。起點：一個基層官吏。終點：漢朝開國皇帝。他的唯一技能是「用人」——不是最聰明的，不是最能打的，但最擅長讓比他強的人為他效力。",
story:"垓下之戰後，劉邦大宴功臣，問：「我為什麼贏，項羽為什麼輸？」劉邦說：「夫運籌帷幄，決勝千里，吾不如子房；鎮國家，撫百姓，吾不如蕭何；連百萬之軍，戰必勝，吾不如韓信。此三者皆人傑，吾能用之，此吾所以取天下也。」",
f:[{n:"用人不疑",d:"劉邦給韓信百萬大軍，明知韓信比他強得多——他選擇相信。信任有成本，但不信任的成本更高。"},{n:"財散人聚",d:"劉邦最重要的用人法則：願意給。給錢、給權、給名聲——他自己不多留。項羽「愛將印，刓忍不能予」，一個捨不得給的領導，留不住真正的人才。"},{n:"從諫如流",d:"打下咸陽，張良說你要做天下之主就不要大肆搶劫。劉邦立刻收手，發布「約法三章」。"},{n:"約法三章",d:"「殺人者死，傷人及盜抵罪」——進入咸陽後只立三條法律，廢除秦朝苛法。讓關中百姓立刻倒向他。他懂得：規則的信任感比財貨更值錢。"}],
q:["夫運籌帷幄之中，決勝於千里之外，吾不如子房；鎮國家，撫百姓，給饋餉，不絕糧道，吾不如蕭何；連百萬之軍，戰必勝，攻必取，吾不如韓信。此三者，皆人傑也，吾能用之，此吾所以取天下也。","財散人聚，財聚人散。"],
apply:"招聘時問：這個人哪方面比我強？在哪些事上我應該聽他的而不是告訴他怎麼做？答案越清晰，你的團隊越強。",
l:["韓信","張良","曹操"],contrast:[{"n": "項羽", "why": "同樣起於亂世，劉邦用「軟」，項羽用「剛」——一個贏了天下，一個贏得了傳奇"}, {"n": "曹操", "why": "兩人都是用人高手，但劉邦靠散財，曹操靠制度"}],
fail:"公元前200年，劉邦率32萬大軍親征匈奴，輕率冒進，被冒頓單于40萬騎兵困在白登山七天七夜。最終靠賄賂冒頓之妻才得以脫身。原因：他把打敗項羽的經驗直接套用在完全不同的對手身上。",
lesson:["「上次贏了」是下次最危險的心理——打敗項羽的方法在草原上完全失效。","冒進是成功者的通病——越成功，越容易低估新的對手。"]},

{c:"權力與組織",n:"曹操",e:"漢末·155-220",w:"唯才是舉",y:155,
d:"被《三國演義》塑造成奸臣的曹操，歷史上是中國最早的系統性能力主義者。他一生發布三道求賢令：不看出身，不看品行，只看能力。同時是軍事家、政治家、詩人。",
story:"曹操下令：軍隊不得踐踏農田，否則斬首。結果他自己的馬受驚踏了麥田。他召集軍官，要自刎謝罪，被勸阻後，拔劍割下自己的頭髮，說：「發代首」。制度的公信力來自這裡：規則對所有人一視同仁，包括制定規則的人。",
f:[{n:"唯才是舉",d:"三道求賢令，核心都是：「唯才是舉，吾得而用之」。不拘出身，不拘品行，不拘舊仇，不拘名聲。結果：他的團隊人才密度遠超劉備和孫權。"},{n:"割發代首",d:"制度面前，領導者自罰比不罰更重要。如果老闆自己違規不受罰，下面的人就永遠不會真正遵守規則。"},{n:"挾天子以令諸侯",d:"196年，曹操率先迎接流亡的漢獻帝到許昌，「奉天子以令不臣」。先佔據政治合法性資源，讓自己的所有行動都有「正統」背書。"}],
q:["唯才是舉，吾得而用之。","老驥伏櫪，志在千里；烈士暮年，壯心不已。","對酒當歌，人生幾何？"],
apply:"招聘時，如果你只招「完美簡歷」的人，你會錯過大量真正有能力的人。試試只看一件事：這個人在他真正做過的事情上，結果怎麼樣？",
l:["劉邦","孫子兵法","韓非子","司馬懿"],contrast:[{"n": "劉邦", "why": "兩種梟雄的用人哲學：劉邦靠散財和信任，曹操靠制度和能力——財散人聚vs唯才是舉"}, {"n": "韓非子", "why": "法家理論的踐行者：韓非子寫了理論，曹操活出了法家邏輯——「割發代首」就是法術勢的完美示範"}],
fail:"公元208年，赤壁。曹操犯了兩個致命錯誤：強令北方旱地士兵水戰，又將戰船鐵索相連——給了周瑜火攻的機會。他輸給的不只是周瑜，是自己在頂點時的輕敵和急於求成。",
lesson:["在不熟悉的領域用熟悉的打法，是強者最常見的失誤。","越接近成功，越容易輕敵——赤壁之敗的根本原因是他認為勝負已定。"]},

{c:"謀略與競爭",n:"司馬懿",e:"三國·179-251",w:"忍",y:179,
d:"熬過曹操、曹丕、曹叡、曹芳四代，在70歲時發動高平陵之變，一夜奪取曹魏實際控制權。他用一生證明：在長期博弈裡，活得最久的那個人贏。",
story:"五丈原對峙。諸葛亮派使者送來一套女人的衣服，羞辱他躲著不敢打。司馬懿沒有發怒，欣然接受，還問使者：「諸葛丞相最近睡眠怎麼樣？」使者說：「丞相夙興夜寐，每天吃得很少。」司馬懿轉身說：「亮將死矣。」——他看生命週期，不看軍事實力。諸葛亮同年病逝，54歲。司馬懿此後又活了17年。",
f:[{n:"忍的四個層次",d:"忍辱（接受屈辱而不失控），忍欲（壓制急於行動的衝動），忍時（等待最佳時機），忍死（裝病裝弱，讓對手誤判）。四層疊加：對手看到的是奄奄一息的老人，實際上是蓄勢待發的獵豹。"},{n:"高平陵之變的精確時機",d:"司馬懿等了整整三年，等的就是：曹爽+皇帝同時離開洛陽，留下空城。他等的不只是機會，是「唯一的那個機會」。"},{n:"裝弱的藝術",d:"司馬懿把「裝病」用到了極致，讓兩個對手同時對他產生了錯誤判斷。信息是雙向武器：你對外展示什麼，決定了對手會如何行動。"},{n:"以守代攻",d:"五丈原是「守」贏了「攻」的最典型案例。司馬懿的邏輯極其簡單：我不需要贏，我只需要不輸，時間會幫我贏。"}],
q:["亮將死矣。","騎虎之勢，不得下也。"],
apply:"在競爭中，如果你的資源比對手少，考慮「時間戰術」：不求一戰定乾坤，求每次接觸後對手消耗得比你多。持續消耗，等待對手犯錯或資源耗盡。",
l:["范蠡","李泌","諸葛亮","孫子兵法"],contrast:[{"n": "諸葛亮", "why": "五丈原最極致的對照：諸葛亮以攻代守耗盡生命，司馬懿以守代攻耗死對手"}, {"n": "霍去病", "why": "知識庫裡兩種極端生命策略：霍去病24歲燃盡，司馬懿70歲出手"}]},

{c:"權力與組織",n:"諸葛亮",e:"三國·181-234",w:"隆中對",y:181,
d:"「運籌帷幄」的代名詞，「鞠躬盡瘁」的化身。他未出茅廬時就規劃了三分天下的格局，輔佐劉備建立蜀漢，治蜀二十年法治清明，六出祁山以攻代守。",
story:"諸葛亮最後一次北伐，在五丈原與司馬懿對峙。司馬懿向蜀軍使者打聽諸葛亮的日常，使者說：「丞相早起晚睡，凡是超過二十杖的刑罰都親自過目，每天吃得很少」。司馬懿對左右說：「食少事煩，豈能久乎？」——用生命力，贏了才華。",
f:[{n:"隆中對的戰略框架",d:"未出茅廬，分析了曹操（不可爭鋒）、孫權（可以聯盟）、荊州（必須取）、益州（根據地），設計了「跨有荊益、外結孫權、內修政理、待機北伐」的三步路徑。"},{n:"揮淚斬馬謖",d:"街亭失守，馬謖是諸葛亮最看重的將領，私交甚好。諸葛亮仍依法斬首，同時上表自貶三級。制度的公信力來自對「關係戶」的處理。"},{n:"以攻代守",d:"「不伐賊，王業亦亡；惟坐而待亡，孰與伐之？」蜀國弱，時間站在魏國這邊——蜀國越等越弱，所以必須主動進攻。"},{n:"事必躬親的教訓",d:"「凡二十杖以上皆親決」。他設定的標準太高，沒有人達到，所以他不敢放權，所以他死後沒有人能接續。"}],
q:["鞠躬盡瘁，死而後已。","非淡泊無以明志，非寧靜無以致遠。","不伐賊，王業亦亡；惟坐而待亡，孰與伐之？"],
apply:"如果你發現自己「事必躬親」，先問：是因為沒有人達到標準，還是因為我沒有真正教會他們標準？你的工作是培養能接替你的人。",
l:["曹操","孫子兵法","曾國藩","范蠡","司馬懿"],contrast:[{"n": "司馬懿", "why": "才華與壽命的對照：諸葛亮54歲耗盡，司馬懿活到73歲——以攻代守vs以守代攻"}, {"n": "范蠡", "why": "功成的兩種選擇：范蠡在頂點主動退，諸葛亮至死不退"}],
fail:"諸葛亮六出祁山，每次都因糧草或意外功敗垂成。最根本的失敗不在戰場，在組織——他讓自己成為不可替代的人。54歲，五丈原，他在案牘前走完最後一程。",
lesson:["「不可替代」是個人榮耀，是組織災難。","事必躬親的本質是不信任——結果是你累死，團隊沒有成長。"]},

{c:"權力與組織",n:"管仲",e:"春秋·前723-前645",w:"富民強國",y:-723,
d:"中國歷史上第一個系統性思考「經濟」和「治理」關係的政治家。他幫助齊桓公從一個普通諸侯國做到「九合諸侯，一匡天下」。孔子評價他：「微管仲，吾其被髮左衽矣」。",
story:"管仲和鮑叔牙年輕時合夥做生意，管仲多拿利潤，鮑叔牙不說他貪，說他家裡窮。後來鮑叔牙向齊桓公力薦管仲：「如果只想治理齊國，我鮑叔牙就夠了；如果想稱霸天下，非管仲不可。」管仲死前說：「生我者父母，知我者鮑子也。」",
f:[{n:"富民強國",d:"「凡治國之道，必先富民」——先讓老百姓富，國家才能真正強。「倉廩實則知禮節，衣食足則知榮辱」——基礎需求不滿足，談道德是奢侈。"},{n:"鹽鐵專賣",d:"把稅收「藏在」鹽鐵價格里，讓百姓不感覺到被徵稅，國家財政卻充足。現代版：蘋果的應用商店30%抽成——本質是同一件事。"},{n:"尊王攘夷",d:"幫齊桓公打出「尊王攘夷」的旗號，把競爭變成了「文明vs蠻夷」的框架。佔據道德制高點，是競爭中最有效的品牌策略。"}],
q:["倉廩實則知禮節，衣食足則知榮辱。","凡治國之道，必先富民。","一年之計，莫如樹谷；十年之計，莫如樹木；終身之計，莫如樹人。","生我者父母，知我者鮑子也。"],
apply:"管理團隊時，在談「文化」「使命」之前，先確認薪酬是否到位。員工在擔心房租的時候，講企業價值觀是無效的——物質基礎先於精神建設。",
l:["國富論","范蠡","孫子兵法","毛澤東","韓非子"],contrast:[{"n": "商鞅", "why": "兩種富國強兵的路徑：管仲「先富民」再強國，商鞅「先立法」再富國——經濟改革vs制度改革"}, {"n": "諸葛亮", "why": "兩位輔佐霸主的頂級宰相：管仲輔佐齊桓公成功，諸葛亮輔佐劉備未竟——成功與悲劇的對照"}]},

{c:"財富與風險",n:"巴菲特",e:"當代·1930-",w:"護城河",y:1930,
d:"奧馬哈的神奇老人，用60年把10000美元變成了一個千億美元帝國。他的方法：找到有護城河的好公司，以合理價格買入，然後長期持有。他最大的競爭優勢不是選股技能，而是情緒控制。",
story:"1973-1974年，美國股市大跌50%，華盛頓郵報股價從38美元跌到16美元。所有人在逃跑，巴菲特大筆買入。他給管理層寫信：「我以1000萬美元的價格，買入了一家你們自己也認為價值4-5億美元的公司」。後來這筆投資回報超過100倍。",
f:[{n:"護城河四種形式",d:"品牌（可口可樂），網絡效應（Visa），成本優勢（規模帶來的低成本），轉換成本（微軟Office：用慣了換別的太麻煩）。護城河越寬，未來收益越確定。"},{n:"能力圈",d:"「你不需要了解所有的公司，只需要瞭解你能理解的那些」。不懂科技股，就不買。能力圈的邊界比能力圈本身更重要。"},{n:"情緒護城河",d:"「別人貪婪時恐懼，別人恐懼時貪婪」。1987年股災、2000年互聯網泡沫、2008年金融危機，他都是在崩潰裡大量買入的那個人。"},{n:"複利的耐心",d:"巴菲特99%的財富是在他50歲之後積累的。複利不神秘：10%年回報率，30年變17倍，40年變45倍。時間是最好的乘法器。"},{n:"安全邊際",d:"「以50美分買價值1美元的東西」。永遠留有足夠的緩衝空間，即使判斷錯了也不會致命。"}],
q:["在別人貪婪時恐懼，在別人恐懼時貪婪。","第一，不要虧錢；第二，不要忘記第一條。","時間是好公司的朋友，是壞公司的敵人。","如果你不願意持有一隻股票十年，那你連十分鐘都不應該持有它。"],
apply:"下次投資決策之前，問三個問題：這個護城河五年後還在嗎？我真的理解這個生意的底層邏輯嗎？如果價格跌50%，我會慶幸機會來了還是恐慌賣出？",
l:["查理·芒格","范蠡","李嘉誠","段永平"],contrast:[{"n": "索羅斯", "why": "投資哲學的兩極：巴菲特長期持有好公司，索羅斯做空錯誤定價——價值投資vs反身性"}, {"n": "范蠡", "why": "跨越兩千年的商業智慧：范蠡「旱則資舟」的週期思維，是巴菲特「別人恐懼我貪婪」的古代版本"}],
fail:"1993年，巴菲特花4.33億美元收購Dexter鞋業，用伯克希爾股票支付。結果中國廉價鞋湧入市場，Dexter競爭優勢蕩然無存。那些股票後來價值超過35億美元。",
lesson:["護城河需要對抗真實競爭壓力才算數——Dexter的護城河只在沒有低成本競爭時成立。","他在致股東信裡公開承認這個失誤——這種透明度本身就是他護城河的一部分。"]},

{c:"財富與風險",n:"查理·芒格",e:"當代·1924-2023",w:"逆向",y:1924,
d:"巴菲特的合夥人，伯克希爾·哈撒韋副主席，99歲去世。他最重要的貢獻：把巴菲特從「撿菸蒂」進化到「以合理價格買優秀公司」。他的思維工具箱：多元思維模型+認知偏差清單。",
story:"芒格在哈佛法學院畢業典禮上演講，說：「我只想告訴你們如何必然走向不幸。」然後列舉了導致人生失敗的所有方法。他說：「如果你知道你會在哪裡死，你就永遠不會去那裡」——逆向思維的最佳示範。",
f:[{n:"逆向思維",d:"「反過來想，總是反過來想」。創業成功的路有無數條，失敗的模式只有幾種。把這些「死法」列出來，逐一規避，比追求「怎麼贏」更有效。"},{n:"多元思維模型",d:"「一個手裡只有錘子的人，看什麼都像釘子」。芒格積累了100個跨學科模型：數學的複利、物理的臨界點、生物的進化、心理學的認知偏差……"},{n:"激勵機制第一",d:"「告訴我激勵是什麼，我就告訴你結果會是什麼」。理解一個系統，先看激勵結構：每個人按自己的激勵行動，而不是按你期望的方式行動。"},{n:"能力圈的誠實",d:"「我沒有權利擁有一個我無法反駁的觀點」。如果你不能說出支持自己觀點的最強反對理由，你就不真正理解這個問題。"}],
q:["反過來想，總是反過來想。","告訴我激勵是什麼，我就告訴你結果會是什麼。","以合理價格買入卓越公司，遠勝於以便宜價格買入普通公司。","我沒有權利擁有一個我無法反駁的觀點。","如果我知道我會在哪裡死，我就永遠不會去那裡。"],
apply:"每次做重要決策前，花5分鐘做「逆向清單」：這個決策有哪些最可能失敗的原因？每個原因有沒有解決方案？",
l:["巴菲特","孫子兵法","韓非子","達里奧"],contrast:[{"n": "巴菲特", "why": "同一家公司的兩個大腦：巴菲特的天賦是耐心與定價，芒格的天賦是否定——他的職能是替巴菲特殺掉那些「看起來不錯」的想法。芒格自己說，伯克希爾的成功來自避免愚蠢，而不是追求聰明"}, {"n": "塔勒布", "why": "兩份互補的防錯清單：芒格列的是認知偏差（人腦內部的bug），塔勒布列的是隨機性陷阱（世界外部的bug）。只防一頭的人，會在另一頭被清算"}]},

{c:"財富與風險",n:"李嘉誠",e:"當代·1928-",w:"週期",y:1928,
d:"從塑料花小工廠到長和集團，李嘉誠用70年建立了橫跨地產、港口、電信、零售、能源的商業帝國。多次大危機（1967年暴動、1997年金融危機、2008年金融危機）都安然度過，靠的是「逆週期布局+永遠保持現金」兩個原則。",
story:"1967年，香港左派暴動，炸彈遍地，英資企業紛紛撤離，香港地產價格暴跌。所有人都在賣，李嘉誠在買。三年後，香港社會恢復穩定，他的資產翻了幾倍。",
f:[{n:"逆週期布局",d:"低谷收購，高峰套現。1967年香港暴動買地；2000年後逐步撤資中國樓市（比大多數人早了十年）。每次都是在別人還沒意識到週期轉折時行動。"},{n:"不賺最後一個銅板",d:"「我不賺最後一個銅板」——在他判斷的頂峰之前退出，讓出最後10-20%的漲幅，換來確定性。貪最後一個銅板意味著等到所有人都確認頂部才賣。"},{n:"現金流是氧氣",d:"在任何時候都保持大量現金儲備，寧可放棄一些投資回報，也要確保流動性。2008年金融危機很多大集團資金鍊斷裂，他安然度過。"},{n:"第一個桶紮實",d:"「第一個桶一定要紮實，才好放第二個桶」。不先把基本盤做穩就去擴張，是很多企業的死因。"}],
q:["擴張中不忘謹慎，謹慎中不忘擴張。","好景時不過分樂觀；不好景時不過度悲觀。","第一個桶一定要紮實，才好放第二個桶。","現金流是企業生存的氧氣。"],
apply:"每年年初做一次「現金壓力測試」：如果主要收入來源斷掉6個月，你的現金能撐多久？如果小於6個月，現在就開始增加現金儲備。",
l:["范蠡","巴菲特","段永平"],contrast:[{"n": "范蠡", "why": "跨越兩千年的商業智慧：范蠡逆週期布局，李嘉誠逆週期買地——同一套週期思維，古今互證"}, {"n": "巴菲特", "why": "價值投資的東西方實踐：都在別人恐懼時貪婪，都保持大量現金儲備"}]},

{c:"創業與產品",n:"喬布斯",e:"當代·1955-2011",w:"極簡",y:1955,
d:"蘋果聯合創始人，被迫離開蘋果，在NeXT和皮克斯度過12年，然後回來把瀕死的蘋果變成了全球最有價值的公司。他的思想核心是：簡單比複雜更難，專注意味著說不，設計是產品如何工作而不只是外觀。",
story:"1997年喬布斯迴歸蘋果時，蘋果有超過350個產品型號。他把所有產品線整理在一張紙上，然後劃掉了其中70%，說：「我們只做這四個」——消費臺式機、消費筆記本、專業臺式機、專業筆記本。接下來的幾年證明了他是對的：專注讓蘋果把有限資源全部投入四條產品線，每條都做到極致。",
f:[{n:"極簡三層次",d:"功能極簡（只留核心功能），設計極簡（一目瞭然），體驗極簡（用戶感受不到背後的技術複雜性）。「簡單可以比複雜更難實現：你必須把思維理清楚，讓它變得簡單，但最終是值得的」"},{n:"專注=說不",d:"「專注意味著對一百個其他好主意說不」。他迴歸蘋果的第一年，砍掉了350個產品中的70%。專注的本質是放棄，而不只是堅持。"},{n:"整體體驗",d:"喬布斯對產品的定義不只是產品本身，而是整個體驗：包裝設計（開箱像一個儀式），零售店，售後服務（天才吧），廣告（Think Different）——所有接觸點都在傳達同一個價值觀。"},{n:"現實扭曲力場",d:"他能讓人相信「不可能」是可能的，然後團隊真的把不可能做成了可能。當一個人真的相信自己在做一件改變世界的事，他能付出的超出他自己的預期。"}],
q:["簡單比複雜更難。你必須努力理清思路，讓它變得簡單。","專注意味著對一百個其他好主意說不。","設計不僅僅是外觀和感受。設計是產品如何工作。","保持飢餓，保持愚蠢。（Stay Hungry, Stay Foolish.）"],
apply:"列出你正在做的所有項目/功能/任務，然後問：如果只能保留一半，我會保留哪一半？被刪掉的那一半，現在就停止。",
l:["霍去病","彼得·蒂爾","任正非"],contrast:[{"n": "霍去病", "why": "燃燒型天才的兩種形態：霍去病24歲病逝，喬布斯56歲離世——都把全部能量給了一件事"}, {"n": "王陽明", "why": "極簡與致良知：喬布斯減法哲學和王陽明「損之又損」在精神上高度吻合"}],
fail:"1985年，喬布斯被他自己請來的CEO約翰·斯卡利趕出了蘋果。隨後12年，他創立NeXT：產品叫好不叫座，最終以被蘋果收購告終。",
lesson:["被自己的公司踢出去，是他職業生涯最重要的事——在NeXT學會妥協，在皮克斯學會講故事，回來時已不是原來那個只懂產品的人。","產品天才不等於管理天才。"]},

{c:"創業與產品",n:"張一鳴",e:"當代·1983-",w:"延遲滿足",y:1983,
d:"字節跳動創始人，抖音和今日頭條的締造者。他的特點：極度理性，反對模糊，用算法驅動一切。他相信人的認知偏差是最大的效率損耗，因此把「延遲滿足」和「反模糊」當成了個人和團隊的核心操作系統。",
story:"張一鳴的一段話常被引用：「我見過很多聰明人，但是願意延遲滿足的人很少。延遲滿足感程度在不同量級的人是沒法有效討論問題的。」他本人五年時間磨產品，幾乎沒有對外發聲，沒有參加演講，只是不停地打磨。",
f:[{n:"延遲滿足",d:"願意為了長期價值放棄短期快感，這是一種稀缺能力，也是分辨層次的關鍵指標。選合夥人、選員工的第一指標，不是能力，是延遲滿足感的程度。"},{n:"反模糊",d:"他要求所有人表達時不能用「可能、大概、感覺、似乎」——強制精確。說不清楚，說明還沒想透；沒想透的事，做了大概率是錯的。"},{n:"系統思維",d:"「把公司當產品來開發」——不只是做產品，同時也在設計組織系統、激勵系統、信息系統。局部優化往往製造整體問題。"},{n:"用戶價值的時間維度",d:"「這個產品三年後還有價值嗎？」——他拒絕為了短期數據犧牲長期價值。"}],
q:["延遲滿足感程度在不同量級的人是沒法有效討論問題的。","創業公司最大的競爭優勢是執行力，不是創意。"],
apply:"下次團隊會議上，要求每個人的表達不能包含「可能、大概、感覺」。把所有判斷都變成「我認為XX，因為XX，置信度XX%」的形式。",
l:["段永平","黃仁勳"],contrast:[{"n": "王興", "why": "同時代兩種創業哲學：張一鳴「延遲滿足」靠算法和理性，王興「九敗一勝」靠直覺和韌性"}, {"n": "稻盛和夫", "why": "兩種極度認真：稻盛靠「敬天愛人」的精神驅動，張一鳴靠「反模糊」的理性驅動"}]},

{c:"創業與產品",n:"段永平",e:"當代·1961-",w:"本分",y:1961,
d:"步步高集團創始人，OPPO和vivo的精神源頭，巴菲特股東大會上，出價62萬美元與巴菲特共進午餐的那個中國人。他的核心：本分（說話算數，做對的事）、長期主義、錯事即停。",
story:"2001年，段永平從步步高退出，去美國讀書，把公司留給團隊打理。結果：OPPO和vivo在他離開後，靠他打下的文化基礎，成長為全球前五的手機品牌。他說：「我的成功，是因為我知道很多事情不該做，而不是我會做什麼」。",
f:[{n:"本分",d:"「本分的意思就是1.0的厚度就說是1.0的厚度，句號」。本分在需要付出代價時還堅持，才是真本分。"},{n:"做對的事",d:"「做對的事情和把事情做對是兩回事。前者是原則，後者是執行」。他會在看清楚「這件事不對」後立刻停止，哪怕已經投入了大量資源。"},{n:"錯事即停",d:"「不管什麼錯誤，越早改正損失越小」。在雅達利上虧了大錢後，沒有「再搏一把」，直接清倉，不為自己辯護。認錯的能力，是比預測準確更重要的能力。"},{n:"長期主義",d:"持有蘋果超過十年，持有茅臺超過十年。「找到你真正理解的，買入，然後等」。"}],
q:["本分的意思就是1.0的厚度就說是1.0的厚度，句號。","做對的事情和把事情做對是兩回事。","不懂的東西不碰。","不管什麼錯誤，越早改正損失越小。"],
apply:"本週找一件你「知道是錯的但還在做」的事，停掉。不需要等到找到替代方案，先停掉錯的。",
l:["巴菲特","曾國藩","稻盛和夫","黃仁勳"],contrast:[{"n": "張一鳴", "why": "兩種中國式長期主義：段永平靠「本分」這套近乎道德律的自我約束做減法，先定不做什麼；張一鳴靠數據與算法做加法，用理性壓制直覺。一個是儒家的，一個是工程師的"}, {"n": "巴菲特", "why": "段永平是巴菲特最認真的中國學生，但他把護城河從投資挪到了經營：巴菲特買有護城河的公司，段永平親手造一條——「敢為天下後，後中爭先」"}]},

{c:"創業與產品",n:"稻盛和夫",e:"當代·1932-2022",w:"敬天愛人",y:1932,
d:"27歲創立京瓷，52歲創立KDDI（兩家都是世界500強），78歲臨危受命重建破產的日本航空，1年扭虧為盈，2年重新上市。他的思想核心是「利他」：不是道德選擇，是最優的長期商業策略。",
story:"2010年，日航宣告破產，日本政府請78歲的稻盛和夫出任CEO，薪水為零。他接受了。上任第一件事不是裁員，而是召集全體高管，問他們：「你們工作是為了什麼？」沉默。他說：「我們工作，是為了家人，是為了乘坐我們飛機的旅客，是為了社會」。一年後，日航創下歷史最高利潤。",
f:[{n:"人生方程式",d:"「人生·工作的結果=思維方式×熱情×能力」。三個變量中，只有思維方式可以為負——負的思維方式乘以再強的能力和熱情，結果依然為負甚至傷害社會。方向比速度更重要。"},{n:"六項精進",d:"付出不亞於任何人的努力、謙虛不驕傲、每天反省、活著就感謝、積善行思利他、不煩惱。六項都指向同一件事：消除自我中心。"},{n:"阿米巴經營",d:"把公司分成最小的獨立核算單元，每個單元自己有銷售額、成本、利潤，每天更新數據，所有人都能看到。激活了每個員工的主人翁意識。"},{n:"利他是最優策略",d:"「動機至善，私心了無」——短期來看，利己>利他；長期來看，利他帶來的信任和復購遠超利己帶來的短期收益。「讓別人先贏」的人，在重複博弈中總是最後的贏家。"}],
q:["敬天愛人。","極度認真地過好每一天。","工作是最好的修行。","動機至善，私心了無。","在利他中，找到利己。"],
apply:"每天睡前做一次「六項精進」的快速檢查：今天有沒有偷懶？有沒有驕傲？有沒有反省？有沒有感謝？有沒有利他？有沒有無謂的煩惱？",
l:["曾國藩","王陽明","范蠡","任正非"],contrast:[{"n": "曾國藩", "why": "東亞精神的兩座山：稻盛「極度認真過每一天」和曾國藩「結硬寨打呆仗」——日本vs中國，同一種「笨」的智慧"}, {"n": "王陽明", "why": "知行合一的兩種實踐：王陽明在龍場悟道，稻盛和夫在工廠踐道——哲學與商業的對話"}]},

{c:"創業與產品",n:"馬斯克",e:"當代·1971-",w:"第一性原理",y:1971,
d:"PayPal聯合創始人，特斯拉、SpaceX、Neuralink、X聯合創始人或創始人。他的方法論只有一個：回到物理原點，重新推演一切。別人覺得不可能的事，他先問：物理定律允許嗎？如果允許，那「不可能」只是工程問題。",
story:"SpaceX創立初期，馬斯克想買火箭，發現美國、俄羅斯的報價都貴得離譜。他把火箭拆解成基礎材料清單，算出原材料成本——結論是：現有火箭定價是原材料成本的50-100倍。他決定自己造火箭。",
f:[{n:"第一性原理",d:"「不要類比，不要參考別人，回到最基本的假設，從物理原點推演」。類比是思維的捷徑，也是思維的籠子。第一性原理拆掉所有類比，問：這件事的物理極限是什麼？",eg:"火箭為什麼貴？行業答案：「一直都這麼貴」。馬斯克拆解原材料成本是整體報價的2%，剩下98%是「行業慣例」。SpaceX把發射成本降到了傳統航天的1/10。"},{n:"物理極限思維",d:"「物理學是定律，其他一切都是建議」。任何技術的極限是物理定律設定的，不是現有技術能力設定的。從物理極限反推，倒逼工程創新。"},{n:"80%時間用於創造",d:"「80%的時間用在創造上，具體來說是用在工程和設計上」。他不開沒有必要的會，不做沒有實際產出的工作。"}],
q:["物理學是定律，其他一切都是建議。","努力成為有用的人。做有用的事，對別人，對這個世界。","80%的時間用在創造上。"],
apply:"下次遇到「不可能」的問題，先問：物理定律允許嗎？如果允許，那「不可能」只是現有技術和成本的約束——這些約束是暫時的，物理定律是永久的。",
l:["黃仁勳","彼得·蒂爾","段永平"],contrast:[{"n": "愛因斯坦", "why": "第一性原理的兩種實踐：愛因斯坦用思想實驗改變物理學，馬斯克用第一性原理改變工業"}, {"n": "霍去病", "why": "孤注一擲的生命策略：霍去病把全部押在戰場，馬斯克把全部押在幾個「不可能」上"}]},

{c:"創業與產品",n:"黃仁勳",e:"當代·1963-",w:"押注",y:1963,
d:"英偉達創始人兼CEO，30年沒有被趕走。他在2006年做了一個當時看來「浪費資源」的決定：開發CUDA，讓GPU可以做通用計算。2023年，ChatGPT爆發，AI需要大量GPU算力，英偉達成為全球最重要的公司之一。他押注了一個能力，等了17年。",
story:"1995年，英偉達第一款產品NV1上市，慘敗。微軟的DirectX取代了NV1的技術路線，英偉達瀕臨破產。黃仁勳面對剩下的員工說：「我需要你們幫我把英偉達從這個危機裡帶出來」——不是「我有計劃，你們跟著走」，而是「我需要你們」。",
f:[{n:"CUDA的長期主義",d:"2006年，GPU主要用於遊戲圖形。黃仁勳花費數億美元開發CUDA，當時沒有市場，沒有客戶，只有他的判斷：GPU的並行計算能力是稀缺的，總會在某個地方爆發價值。押注的不是某個應用，而是「底層能力」。"},{n:"永遠在邊緣",d:"「我們永遠處於公司即將倒閉的邊緣」——這不是謙虛，是他的內心狀態。英偉達經歷過至少三次幾乎破產的時刻。這種永久性危機感讓他在危機真正來臨時，沒有被打懵。"},{n:"60人直接彙報",d:"大多數管理學認為一個人最多管7-10人，黃仁勳有60位直接彙報。他的邏輯：「層級是信息的過濾器，每多一層，信息失真一點，決策慢一點。」"},{n:"苦難哲學",d:"「我希望你們都經歷過逆境，因為逆境賦予了你們決心、精神和身份認同」。順境給你資源，逆境給你清晰度。"}],
q:["我們永遠處於公司即將倒閉的邊緣。","苦難是一份禮物，我希望每個人都有機會經歷。","如果你們沒有失敗過，你們其實還沒有真正開始。"],
apply:"在產品/業務規劃中，除了「這個功能/市場現在有多大」，還要問「這個能力/平臺未來五年在哪些新場景會爆發價值」——押注底層能力往往比押注具體應用更有價值。",
l:["任正非","彼得·蒂爾","段永平","張一鳴"],contrast:[{"n": "任正非", "why": "兩種「押注一個能力、等十幾年」：黃仁勳押CUDA等了17年，任正非押芯片與操作系統做了十幾年備胎。區別在動機——一個賭最好的情況會來，一個賭最壞的情況會來"}, {"n": "彼得·蒂爾", "why": "蒂爾問「有什麼重要的真相是很少人認同你的」，2006年做CUDA的黃仁勳就是這道題的活體樣本——當時整個行業都認定GPU就該用來渲染畫面"}]},

{c:"創業與產品",n:"彼得·蒂爾",e:"當代·1967-",w:"從0到1",y:1967,
d:"PayPal聯合創始人，Facebook第一個外部投資人，硅谷最重要的反共識思想者。他的核心命題：競爭是意識形態陷阱，真正能創造價值的是壟斷而非競爭。",
story:"2004年，扎克伯格剛創立Facebook，彼得·蒂爾是第一個外部投資人，投了50萬美元，獲得10.2%股份。2012年Facebook上市，那50萬變成了10億美元。他在所有人還把它看作「哈佛的學生社區」時，看到了網絡效應形成後的壟斷價值。",
f:[{n:"從0到1",d:"「從1到N」是複製；「從0到1」是創造——做一個之前不存在的類別。大多數商業是從1到N的，競爭激烈、利潤稀薄；從0到1的機會極少，但一旦成功，價值是壟斷性的。"},{n:"競爭是陷阱",d:"「競爭是留給失敗者的」——如果你的主要精力在「打敗對手」上，你已經進入了零和博弈。找到或創造一個你可以主導的領域，把精力放在做大這個領域。"},{n:"冪次法則",d:"風險投資的回報不是正態分布，而是冪次分布：一個投資的回報可以超過其餘所有投資的總和。永遠全力押注你認為最可能產生冪次回報的那一個，而不是「平衡」分散。"}],
q:["我們想要一輛會飛的汽車，得到的卻是140個字符。","做得最好的企業是那些不競爭的企業。","你在哪個重要問題上，與大多數人的觀點相反？（他最著名的面試問題）"],
apply:"「彼得·蒂爾問題」：你相信什麼重要的事，是大多數人不同意的？如果你能給出一個真實的、有洞察的答案，那可能就是你的競爭優勢所在。",
l:["喬布斯","巴菲特","黃仁勳"],contrast:[{"n": "創新者的窘境", "why": "創新的兩面：窘境解釋「為什麼好公司會失敗」，蒂爾告訴你「如何成為那個顛覆者」"}, {"n": "巴菲特", "why": "投資哲學的兩極：巴菲特尋找護城河長期持有，蒂爾尋找從0到1的壟斷者——價值投資vs顛覆投資"}]},

{c:"創業與產品",n:"任正非",e:"當代·1944-",w:"韌",y:1944,
d:"1987年，43歲，用2萬元創立華為，從交換機代理商起步。30多年後，華為是全球最大電信設備商。他的管理思想：自我批判是組織免疫系統，以客戶為中心是組織的北極星。",
story:"2018年12月，任正非的女兒孟晚舟在加拿大被捕，美國隨後將華為列入實體清單。任正非在接受媒體採訪時說：「美國的打壓讓華為的內部鬥志空前高漲，就像你用棍子打螞蚱窩，螞蚱會四處飛散，但它們都不會死。」",
f:[{n:"活下去哲學",d:"「活下去是華為最樸素的目標，也是最高的目標」。企業死了，一切願景都是空談。他的危機意識讓華為在危機真正來臨時，沒有被打懵。"},{n:"自我批判",d:"在華為歷史上最成功的年份，他寫了《華為的冬天》，詳細描述華為可能如何死亡。在順境裡看見危機——自我批判不是自我懷疑，是對自身盲點的主動暴露。"},{n:"以客戶為中心",d:"「以客戶為中心，以奮鬥者為本」——前半句是方向（所有資源對準客戶價值），後半句是動力（讓真正在奮鬥的人獲得回報）。"}],
q:["活下去，是華為最樸素的目標，也是最高的目標。","華為沒有成功，只有成長。","十年來我天天思考的都是失敗，對成功視而不見，也沒有什麼榮譽感、自豪感，而是危機感。"],
apply:"每年底，給自己寫一份「公司/團隊冬天來了」的假設場景：如果最重要的客戶/收入來源在明年消失，你的應對方案是什麼？",
l:["稻盛和夫","曾國藩","喬布斯","黃仁勳"],contrast:[{"n": "稻盛和夫", "why": "兩種把企業當修行的東方樣本：稻盛靠「敬天愛人」的利他哲學凝聚人心，任正非靠自我批判與危機感驅動組織。一個用善，一個用怕——都能成，但組織的氣質完全不同"}, {"n": "曾國藩", "why": "同一套「結硬寨，打呆仗」：曾國藩用它打太平天國，任正非用它做通信設備。不取巧、不抄近路、每一步先立於不敗——相隔一百三十年，用的是同一種笨功夫"}]},

{c:"世界如何運轉",n:"主權個人",e:"1997年·戴維森&莫格",w:"數字主權",y:1997,
d:"1997年出版，比特幣誕生早了11年。兩位作者用「暴力經濟學」解釋了人類社會的全部歷史：誰控制暴力，誰就控制財富。他們預言了加密貨幣、遠程工作、數字遊民、國家權力衰退。",
story:"1997年，兩位英國作者寫道：「一種新的數字貨幣形式，由密碼加密序列組成，獨一無二、匿名、可驗證，可一鍵完成跨國交易」。2009年，比特幣誕生，和這段描述幾乎一字不差。",
f:[{n:"暴力經濟學",d:"「社會結構=f(暴力的成本, 暴力的收益)」。歷史上每一次技術革命，都改變了暴力的成本與收益——火藥讓貴族城堡失去意義，加密技術讓財富可以藏進一串數學裡，暴力無從觸達。"},{n:"主權個人的四個特徵",d:"1. 擁有私鑰=擁有不可沒收的財富；2. 收入來自全球網絡，不依賴單一管轄區；3. 技能是特定知識，無法被簡單替代；4. 自我教育，不依賴國家認證體系。"},{n:"技能資產vs位置資產",d:"工業時代最有價值的資產是「位置資產」（土地、工廠、執照）——容易被徵稅和管制。信息時代最有價值的是「技能資產」（特定知識、聲譽、網絡）——在你的大腦裡，無法被沒收。"}],
q:["未來是無序的。這是活著最好的時代，幾乎所有你自認了解的東西都是錯的。","暴力的成本和收益決定了人類社會的結構。","如果說人工智能是共產主義的，那麼加密技術就是自由主義的。——彼得·蒂爾序"],
apply:"檢驗自己是否在成為主權個人：收入來源是否跨管轄區？財富是否有一部分存在「數學裡」而非「權力裡」？技能是否無法被簡單證書替代？",
l:["納瓦爾","彼得·蒂爾","塔勒布","道德經","范蠡"],contrast:[{"n": "道德經", "why": "兩千年的思想穿越：道德經「功遂身退、知足者富」是最古老的主權個人哲學"}, {"n": "人類簡史", "why": "文明敘事的兩個方向：人類簡史看「系統如何塑造人」，主權個人看「人如何逃脫系統」"}]}

,{c:"權力與組織",n:"張良",e:"漢·前250-前186",w:"退",y:-250,
d:"漢初三傑裡最聰明的那個，也是唯一善終的那個。他的一生是三幕戲：第一幕學忍（圯上老人），第二幕用謀（鴻門宴），第三幕退場（留侯請退）。他的比較對象是韓信（不退被殺）和蕭何（半退苟活），張良選擇了最徹底也最優雅的路。",
story:"劉邦稱帝后，論功行賞，讓張良自擇齊地三萬戶。張良說：「我從下邳起兵，與陛下會於留。陛下用我計，幸而時中。我願封留縣，足矣。」只要一個小縣，放棄了三萬戶大封。之後他託病不出，學道辟穀，用身體上的「消失」來消除政治上的威脅感。他活到了漢朝穩定之後，看著韓信被殺、彭越被誅，安然離世。",
f:[{n:"留侯原則",d:"要夠用的，不要最多的。三萬戶是功績的符號，留地一縣是夠用的家園。要最多是貪，要夠用是智慧。這不是謙虛，是精確的風險計算：要求越少，威脅感越小，皇帝越放心，你越安全。"},{n:"圯上老人的教訓",d:"年輕的張良看見老人故意把鞋扔下橋，怒火中燒，但憋住了，下去撿回來，彎腰穿上。老人又扔，他又撿，三次。老人說：「孺子可教」，給了他太公兵法。忍不是軟弱，是對更大目標的投資——剋制當下的情緒，才能贏得長遠的機會。",eg:"張良第一次差點發火，第二次也差點，第三次才徹底平靜。情緒控制是可以訓練的技能，不是天生的性格。"},{n:"三傑對照",d:"張良徹底退，蕭何自汙留，韓信不退——是三種面對功高震主的策略。張良用「消失」換安全，蕭何用「示弱」換信任，韓信兩樣都沒做。結局：張良善終，蕭何善終，韓信被殺。策略對了，結局就對了。"},{n:"功成身退的時機判斷",d:"「飛鳥盡，良弓藏」——張良是把這句話活出來的人。最難的判斷是：什麼時候是「功成」？張良的答案是：在對方還沒開始猜忌之前。",eg:"韓信對照：韓信知道危險，卻既不退出也不交權——在最危險的中間地帶待了最久，最終被殺。張良的提前量：他看到天下基本平定時立刻請退，而不是等到被逼。提前量就是安全邊際——太晚就沒有選擇了。"},{n:"道德經落地",d:"道德經說「功遂身退，天之道也」——張良是把這句話活出來的人。這不是消極，是最優的生存策略：在別人都在爭的時候，你退出競爭，你就沒有對手了。"}],
q:["臣願封留足矣，不敢當三萬戶。","願棄人間事，欲從赤松子遊耳。","（劉邦評）運籌策帷幄之中，決勝於千里之外，吾不如子房。"],
apply:"下次升職或拿到重要職位時，記得「留侯原則」：要到「夠用且安全」的那個級別，而不是「最大」的那個。最大往往意味著最多的暴露面。",
l:["范蠡","李泌","韓信","道德經","劉邦"],contrast:[{"n": "韓信", "why": "漢初三傑的命運：張良徹底退善終，韓信不退不交權被殺"}, {"n": "范蠡", "why": "兩個最懂「退」的人：范蠡退出去做商人，張良退出去學道——退法不同，結果一樣"}]},

{c:"權力與組織",n:"李泌",e:"唐·722-789",w:"隱",y:722,
d:"中國歷史上最會生存的謀士，沒有之一。輔佐了唐玄宗、唐肅宗、唐代宗、唐德宗四代皇帝，三次主動退出朝堂，三次被重新召回，最終以宰相之位善終——73歲。在宦官橫行、政治險惡的環境裡，這是奇蹟。他比范蠡更難：范蠡退出後徹底消失，李泌是在權力旋渦裡穿行，退而不遠，隨時可用。",
story:"安史之亂，唐肅宗逃亡，李泌隨行出謀劃策。肅宗要重賞他，封他為高官。李泌說：「我是方外之人，不要官職，只求回山修道」。肅宗不許，李泌就穿著道袍上朝，不穿官服。用道士身份，他給自己創造了一個隨時可以離開的理由。宦官想陷害他，也找不到攻擊點——一個「方外之人」，沒有派系，沒有官職，有什麼可攻擊的？",
f:[{n:"道士護盾",d:"李泌不只是「會修道」，道士身份是他精心設計的護盾。「我是方外之人」讓他隨時可以離開（有理由）、沒有政敵（沒有官職就沒有競爭者）、不受禮法約束。現代版：顧問身份比員工身份靈活得多——進退自如，不被組織的興衰捆綁。",eg:"每次權力危機來臨，他的離開都有充分理由（方外之人歸隱），每次被召回也有充分理由（朝廷需要方外智慧）。身份本身是戰略工具。"},{n:"三入三出節奏",d:"每次「退」都是在危險積累之前主動退出，不等被推走。第一次：楊國忠嫉妒他，主動請求隱居；第二次：平亂功成，立刻辭官，不等被猜忌；第三次：宦官當道，借病隱退。每次主動退出，都為下次進入保留了資格和信任。"},{n:"謀而不爭",d:"安史之亂中，他提出的戰略（斷燕軍退路而非急攻長安）更優，肅宗沒聽。他沒有堅持，沒有爭，只是記錄在案。結果正如他所料，戰爭拖了幾年。他不說「我早就說了」，只是更加被信任。謀劃不等於執行，給建議不等於要求採納。",eg:"「謀而不爭」的反面：諸葛亮六出祁山，每次都堅持北伐到底，精力耗盡在執行上，最終54歲病逝。李泌給建議，採不採納是皇帝的事，他只負責把最優解擺在桌上——結果是他活到73歲，四朝皆用。"},{n:"不攬功不攬權",d:"「不以官為念」不是謙虛，是戰略。功勞是皇帝的，官職能推就推，自己不留把柄——沒有讓人嫉妒的東西，就沒有攻擊點。郭子儀也是同樣的路子：功勞給皇帝，錢財給兒子，權力不要。"}],
q:["臣方外之人，不以官為念。","功遂身退，天之道也。"],
apply:"在職場上做了重要貢獻後，不要急著攬功，讓功勞「自然」歸到老闆頭上。你得到的是信任和安全感——比獎金更持久的資產。",
l:["范蠡","張良","司馬懿","道德經"],contrast:[{"n": "范蠡", "why": "兩種「退而不遠」的智慧：范蠡徹底消失，李泌以道士身份穿行權力而不被吞噬"}, {"n": "張良", "why": "輔佐多代vs輔佐一代：李泌四朝全身而退，張良一朝功成徹底隱"}]},

{c:"權力與組織",n:"韓非子",e:"戰國·前280-前233",w:"法術勢",y:-280,
d:"法家集大成者，把商鞅的「法」、申不害的「術」、慎到的「勢」整合為一套完整的權力理論。他是中國歷史上最清醒的現實主義者——不談應該怎樣，只談實際上怎樣。他的理論直接為秦始皇統一中國提供了思想基礎。最大的諷刺：他知道所有權術，卻死於同學李斯的讒言。",
story:"韓非子和李斯是同學，同出荀子門下。韓非子口吃，不善言辭，卻把思想寫成了驚世文章。這些文章流到秦國，秦始皇讀後大喜：「寡人得見此人與之遊，死不恨矣！」於是發兵攻韓，逼韓王送來韓非子。李斯嫉妒韓非子的才華，在秦王面前進讒言，韓非子下獄，被逼飲鴆而死。最懂權術的人，死於權術——這是知識庫裡最大的諷刺。",
f:[{n:"法·術·勢三位一體",d:"法=明文制度（所有人都必須遵守的規則），術=馭人手段（如何考核識別臣下），勢=權力地位（位置本身帶來的權威）。三者缺法，制度被架空；缺術，陽奉陰違；缺勢，說話沒人聽。一個CEO必須同時掌握三者，只有其中一種，管理必然失效。",eg:"秦孝公時期：商鞅立法（法），秦孝公撐腰（勢），商鞅親自執行貴族違令也斬（術）——三者齊備，變法成功。對比明朝張居正：有法有術，但勢來自太后，萬曆親政後勢一消失，改革灰飛煙滅。"},{n:"人性趨利避害",d:"「人情者，有好惡，故賞罰可用」。韓非子不相信人天然忠誠，他相信激勵機制。設計好制度，人就會按你想要的方式行動——這和查理芒格「告訴我激勵是什麼，我就告訴你結果是什麼」是同一個底層邏輯。"},{n:"五蠹（組織毒瘤）",d:"學者（用嘴皮子混）、遊俠（靠關係解決）、縱橫家（靠說話不靠實績）、患御者（利用公資辦私活）、商工之民（不產出只倒騰）。換成現代職場：寫PPT不幹活的、靠人脈不靠能力的、用公司資源做副業的——韓非子兩千年前已經描述清楚了。"},{n:"說難",d:"「凡說之難，在知所說之心」。說話難不在於你的知識夠不夠，而在於你能否摸清對方真實在意什麼。韓非子專門寫了一篇分析說話的文章：揭穿對方不想被揭穿的事、說的時機不對、太過直白——都是致命的。他懂這一切，卻仍死於李斯的話，可見「知道」和「能做到」之間永遠有一道溝。"},{n:"賞罰兩柄",d:"「明主之所道制其臣者，二柄而已矣——刑與德也」——統治的核心工具只有兩個：獎勵和懲罰。關鍵不是兩者的大小，而是「執行的一致性」——賞罰失去一致性，制度立刻失效。",eg:"秦國軍功制度：無論出身，斬首一級升爵一級，貴族犯法與庶民同罪。對比很多公司：績效考核形式完備，執行時卻對核心員工網開一面——制度公信力一旦損失，比沒有制度更危險。"}],
q:["千里之堤，潰於蟻穴。","凡說之難，在知所說之心，可以吾說當之。","明主之所導制其臣者，二柄而已矣。二柄者，刑德也。"],
apply:"設計團隊激勵機制時，先問「這個制度會讓人做什麼」，而不是「這個制度應該讓人做什麼」。人永遠按利益行動，按你期望行動的前提是利益和期望一致。",
l:["曹操","查理·芒格","孫子兵法","馬基雅維利"],contrast:[{"n": "馬基雅維利", "why": "東西方權力理論的雙峰：相隔1700年，同樣把政治從道德里剝離，同樣死於自己研究的權術"}, {"n": "商鞅", "why": "法家理論與實踐：韓非子建立理論，商鞅付諸實踐——都死於自己創造的力量"}],
fail:"韓非子的文章傳到秦國，秦始皇如獲至寶。到秦國後，同學李斯嫉妒他，向秦始皇進讒言：「韓非子終究是韓國人，不會真心為秦效力。」韓非子下獄，李斯送去毒藥。他寫了《說難》，分析了進言的所有難處和風險，自己卻死於同學的一句讒言——知道所有陷阱，還是走了進去。",
lesson:["「知道」和「能做到」之間永遠有一道溝——韓非子是這道溝最悲劇的註腳。","最瞭解規則的人，往往成為最危險的存在——所有人都需要防他，所以所有人都在找機會反制他。","才華讓你被需要，也讓你被恐懼——李斯殺韓非子，不是因為恨，是因為怕。"]},

{c:"謀略與競爭",n:"霍去病",e:"漢·前140-前117",w:"純粹",y:-140,
d:"漢武帝外甥，17歲首戰率800騎兵深入敵後殲滅2028人，19歲兩次河西之戰殲滅4萬匈奴，22歲漠北之戰深入2000裡，封狼居胥山，飲馬瀚海。24歲病逝。他是歷史上最純粹的燃燒型天才——把全部能量給了一件事，然後熄滅。",
story:"漢武帝為霍去病修建了一座豪華府邸，讓他去看看是否滿意。霍去病拒絕參觀，說：「匈奴未滅，何以家為！」這句話後來成為中國歷史上最著名的拒絕享受的宣言。他不是作秀，他真的不在乎：他對戰場的專注是無可置疑的——他活著的每一天，都在打仗或者準備打仗。",
f:[{n:"純粹的力量",d:"不分心。武帝賜宅他不看，賞賜食物他不在乎，政治博弈他不參與——所有精力全在戰場上。這不是「努力」，是「純粹」：當一個人真的只在乎一件事時，他在那件事上能達到的高度，是普通人無法企及的。"},{n:"以戰養戰",d:"霍去病的戰術特點：不攜帶大量輜重，直接搶匈奴的糧草為自己補給。這讓他可以以極小的補給線維持極遠距離的突襲——代價是極高風險：一旦搶不到糧草，全軍覆沒。他把風險和回報都推到了極端。",eg:"創業公司的「以戰養戰」：不依賴外部融資，用第一個客戶的收入支付第二個客戶的成本，用增長本身來驅動增長。"},{n:"燃燒vs蓄積",d:"霍去病（24歲病逝，封狼居胥）和司馬懿（70歲政變）是知識庫裡最極端的兩種生命策略。沒有哪個更好：霍去病選擇了光芒最強，司馬懿選擇了持續最久。你要的是什麼？"},{n:"純粹的代價",d:"「匈奴未滅，何以家為」——他拒絕參觀府邸，說的不是場面話，是真實的價值排序。這種純粹產生了極致的戰場效果，但沒有給生命留下任何餘地。24歲病逝，連續多年深入大漠、極高強度作戰，已經說明了一切。",eg:"純粹是雙刃劍：喬布斯的極度專注產生了最偉大的產品，也讓他在56歲時用盡了身體。他們選擇了光芒最強，也接受了持續時間最短。沒有哪種選擇更對，只有哪種選擇是你真正想要的。"}],
q:["匈奴未滅，何以家為！","==顧方略何如耳，不至學古兵法。==","糧草不必自己帶，從對手那裡拿。"],
apply:"如果你發現自己在某件事上達到了霍去病式的專注——那件事就是你應該押注的地方。不要用「全面發展」的邏輯去稀釋它。",
l:["韓信","喬布斯","司馬懿","張良"],contrast:[{"n": "司馬懿", "why": "知識庫裡最極端的兩種人生策略：霍去病24歲燃盡，司馬懿70歲才出手"}, {"n": "宮本武藏", "why": "同樣純粹專注：霍去病把所有能量給了戰場，武藏把所有能量給了劍道"}]},

{c:"權力與組織",n:"李世民",e:"唐·598-649",w:"納諫",y:598,
d:"中國歷史上被公認最善於納諫的皇帝，貞觀之治的締造者。他的悖論：用最不道德的方式（玄武門之變，殺兄弟逼父退位）登上皇位，然後用最道德的方式（廣開言路、輕徭薄賦）治理天下。他證明了一件事：權力的來源和權力的使用可以是完全不同的兩件事。",
story:"魏徵曾是太子建成的謀士，力主殺掉李世民。玄武門之變後，李世民不但沒有殺魏徵，反而任命他為重臣，專門負責挑皇帝的毛病。有一次李世民得到一隻漂亮的鷂鷹，正在把玩，看見魏徵來了，立刻把鳥藏在袖子裡。魏徵裝作沒看見，故意慢慢彙報，等魏徵走了，鳥已經悶死在袖中。他寧可悶死愛鳥，也不願讓魏徵看見自己貪玩。這就是納諫：不只是聽，是真的被改變。",
f:[{n:"以人為鏡",d:"「以銅為鏡，可以正衣冠；以古為鏡，可以知興替；以人為鏡，可以明得失」——魏徵死後，李世民說「朕亡一鏡矣」。真正的納諫不是表演民主，是把批評者當成自己最寶貴的認知工具。",eg:"魏徵在世時，李世民多次被當眾批評，有時氣得牙癢癢，回宮說「總有一天要殺了這個鄉巴佬」，但從來沒有真的動手。因為他清楚：失去魏徵，他就失去了那面鏡子。"},{n:"用敵人的謀士",d:"魏徵、尉遲敬德等人都曾是他的對手。李世民的用人邏輯：才華比忠誠歷史更重要，能力比出身更重要。他用了玄武門之變後的所有敵方人才，建立了貞觀之治最核心的班底。"},{n:"玄武門的代價",d:"「太宗此舉，雖成功業，然骨肉相殘，終為德累」——司馬光評。他一生都帶著玄武門的心理債，正因為如此，他必須在治國上做出更多補償。有時候，揹負道德包袱的人反而比干淨的人更拼命證明自己。"},{n:"水能載舟",d:"「民者，國之根也。治國者，必先富民」——他比任何皇帝都清楚民心的力量，因為他親眼見過隋朝如何在民怨中轟然倒塌。「水能載舟，亦能覆舟」不是說教，是他看過的真實歷史。"},{n:"貞觀長策",d:"減稅、減役、減刑，「寧可府庫空虛，不可百姓困苦」。他把文景之治的無為而治升級成了有為而治：主動減少對民間的侵擾，同時主動建立制度。貞觀年間人口從200萬戶增長到380萬戶——這是最真實的治理成績單。"}],
q:["以銅為鏡，可以正衣冠；以古為鏡，可以知興替；以人為鏡，可以明得失。","水能載舟，亦能覆舟。","兼聽則明，偏信則闇。","天下英雄，入吾彀中矣。"],
apply:"團隊裡有沒有一個「魏徵」——專門負責指出你的錯誤、不怕得罪你的人？如果沒有，你正在失去最寶貴的認知工具。主動創造這個角色，哪怕你不喜歡聽。",
l:["曾國藩","諸葛亮","劉邦","資治通鑑"],contrast:[{"n": "朱元璋", "why": "兩種帝王用人哲學：李世民納諫開創盛世，朱元璋殺盡功臣保障皇權——截然相反的治國邏輯"}, {"n": "曾國藩", "why": "「以人為鏡」的兩種實踐：李世民靠魏徵這面鏡子，曾國藩靠日記這面鏡子"}]},

{c:"學習與成長",n:"蘇格拉底",e:"古希臘·前470-前399",w:"無知之知",y:-470,
d:"他沒有留下任何文字，所有思想都通過對話流傳下來。他是職業哲學家裡最窮的那個，不收學費，整天在廣場上問人問題。他被雅典判處死刑，罪名是「腐蝕青年」和「不敬神」——其實是因為他的問題讓權貴太難堪。他可以逃跑，弟子們為他安排好了一切，他拒絕了，飲下毒芹。兩千年來，他是人類史上死得最明白的人之一。",
story:"審判前，雅典給蘇格拉底三個選擇：停止哲學、流亡、或死亡。他選死亡。弟子克里托在獄中勸他越獄，已經打通了所有關節，連船都備好了。蘇格拉底問：「如果一個城邦的法律本身是錯的，公民可以隨意違反嗎？」克里托說不行。蘇格拉底說：「那我的離開，就是在教人隨意違反不喜歡的法律——這比任何罪行都更腐蝕雅典。」他選擇以死亮劍，用生命提出了人類歷史上最沉重的一個問題：什麼是真正值得服從的權威？",
f:[{n:"無知之知",d:"「我唯一知道的，是我什麼都不知道」——這不是謙虛，是認識論的起點。蘇格拉底去問雅典最聰明的人，發現他們都以為自己懂，實際上不懂；蘇格拉底不懂，但他知道自己不懂。這個「元認知」優勢讓他永遠保持開放——不懂的人才會真正去問，已經「懂」的人只會自我印證。",eg:"查理芒格說「我沒有權利擁有一個無法反駁的觀點」——和蘇格拉底兩千年後說的是同一件事。"},{n:"蘇格拉底式追問",d:"「你說的X是什麼意思？為什麼你認為X是對的？如果在Y情況下呢？」三個問題循環，直到對方自己發現邏輯矛盾。他不給答案，只給問題——因為他相信答案在對方自己心裡，追問只是幫助對方把答案「生出來」（他稱之為「助產術」）。最好的管理者、教練、父母都在用這套方法。"},{n:"審視過的人生",d:"「未經審視的人生不值得過」——這是他在法庭上說的最後一句話。你做的每一個選擇，是你真正思考過的，還是隨波逐流的？你的價值觀，是你自己檢驗過的，還是別人告訴你的？不審視自己，你活的是別人的人生。",eg:"稻盛和夫的「六項精進」、達里奧的「極度自我審視」、曾國藩的「日記三省」，都是對這個追問的不同版本的回應。"},{n:"為原則付出代價",d:"蘇格拉底有機會逃跑，弟子們安排好了一切。他拒絕，理由是：「如果我因為不喜歡判決就逃跑，我就在教人可以隨意違反不喜歡的法律。」他用自己的死，堅持了原則。言行一致的代價，有時候是生命——蘇格拉底用自己的結局，把「說到做到」這四個字定義到了極致。"},{n:"助產術",d:"「我是一個思想的助產士，幫助別人把自己內心的智慧生出來」——蘇格拉底不告訴你答案，他幫你發現你其實已經知道的答案。這和王陽明「致良知」（答案已在心中，只是被私慾遮蔽）是兩千年後的東西方回應。"}],
q:["我唯一知道的，是我什麼都不知道。","未經審視的人生不值得過。","我不是雅典人，也不是希臘人，我是世界公民。"],
apply:"下次你「確定」某件事的時候，試試蘇格拉底三問：這個判斷的依據是什麼？在什麼情況下這個判斷會失效？有沒有你沒有考慮到的角度？「確定」要麼更堅實，要麼露出了漏洞——兩種結果都有價值。",
l:["王陽明","道德經","查理·芒格","達里奧"],contrast:[{"n": "王陽明", "why": "東西方哲學的神奇互文：蘇格拉底「助產術」vs王陽明「致良知」——相隔兩千年說同一件事"}, {"n": "馬基雅維利", "why": "哲學的兩極：蘇格拉底為原則赴死，馬基雅維利研究如何在權力裡活下去"}]},

{c:"心智與情緒",n:"馬可·奧勒留",e:"羅馬·121-180",w:"剋制",y:121,
d:"羅馬皇帝，斯多葛哲學的最高實踐者。他是人類歷史上權力最大的人之一——羅馬帝國皇帝，管轄六千萬人，坐擁無限財富。但他每天寫的筆記，是提醒自己「不要被權力腐化」的私人日記，從未打算出版。這本筆記後來叫《沉思錄》，成為歷史上最多領導人隨身攜帶的書。一個手握一切的人，把全部精力用來管控自己——這本身就是最有力的示範。",
story:"公元170年代，馬可·奧勒留在多瑙河前線指揮抵抗日耳曼人入侵，條件惡劣，戰事艱難。每天戰役結束後，他在軍帳裡點亮油燈，用希臘語寫下對自己的提醒——不是給士兵的命令，是給自己靈魂的紀律。那些筆記裡沒有一句炫耀，只有不斷的自我檢視：「你今天是否按照理性行動？你是否因為別人的愚蠢而生氣？你是否被慾望驅動而不是被價值觀驅動？」他是帝國最高統治者，卻像一個初學者般每天重新校準自己。",
f:[{n:"控制二分法",d:"「有些事在你控制之內，有些事不在。」——只有你的判斷、意志、慾望在你控制之內；外部事件、他人行為、身體健康都不在。把精力放在控制之內的事，對控制之外的事保持接受。這是斯多葛哲學最核心的框架，也是現代心理韌性訓練的哲學根基。",eg:"他統治期間面對鼠疫（導致500萬人死亡）、日耳曼入侵、家人背叛。他無法控制這些。他能控制的：如何調度資源、如何自己保持清醒、如何對待犯錯的人。《沉思錄》裡沒有一句抱怨——不是壓抑，是真正區分了「我能做什麼」和「我無法左右什麼」。"},{n:"內在堡壘",d:"無論外部發生什麼，你的內心始終可以是不可侵犯的堡壘。財富可以被奪走，地位可以被剝奪，但你對這些事的判斷和態度，永遠在你掌控之內。這不是消極接受，而是在認清「什麼是真正屬於你的」之後的主動選擇。",eg:"維克多·弗蘭克爾在納粹集中營裡寫下：「人所擁有的任何東西都可以被剝奪，唯獨人類最後的自由——在任何境遇中選擇自己態度的自由——不能被剝奪。」他實踐的正是馬可·奧勒留的哲學。"},{n:"障礙就是道路",d:"「障礙本身就是道路」——當外部事件阻礙你的計劃，這個「障礙」不只是要被清除的敵人，而是包含了新的信息、新的機會、新的路徑。真正的實踐者不是「忍受」障礙，而是把障礙本身變成前進的燃料。",eg:"公司服務器在關鍵時刻崩潰（障礙）→因此重新設計了整個架構，比原來更健壯（障礙成為道路）。"},{n:"為宇宙寫作",d:"《沉思錄》不是給別人讀的，是馬可·奧勒留寫給自己的。他用寫作來對抗「權力帶來的自我放大」——每天寫下：我哪裡還沒做到？我哪裡被情緒控制了？這和曾國藩堅持三十年日記是同一個方法，相隔千年，相距萬里。",eg:"曾國藩的日記裡：「今日見友人，誇誇其談，言過其實，實為人品大損」——批評的是自己。馬可·奧勒留的沉思錄：「你以為自己重要，但宇宙繼續運轉，不因你而改變」——提醒的也是自己。最高級的日記，是批評自己比讚美自己更多的那種。"},{n:"義務倫理",d:"「你被賦予了角色，就要好好扮演。」——每個人在每個情境下都有義務：皇帝有皇帝的義務，兒子有兒子的義務，公民有公民的義務。不是「我想做什麼」，是「我的角色要求我做什麼」。他身為皇帝，沒有享受皇帝的特權，只承擔了皇帝的義務。"}],
q:["你有權控制你的思想，而非外部事件。認識到這一點，你便擁有了力量。","你浪費的每一刻，都是別人拼命想要的時間。","對於不在你掌控之內的事，不要浪費精力。","最好的復仇，是不要變得和對方一樣。"],
apply:"遇到讓你憤怒或焦慮的事時，用控制二分法快速分類：這件事的哪個部分在我控制之內？那部分，盡力；不在控制之內的部分，接受。不是消極，是把有限精力用在真正有用的地方。",
l:["愛比克泰德","曾國藩","王陽明","稻盛和夫","道德經","蘇格拉底"],contrast:[{"n": "曾國藩", "why": "東西方最相似的實踐者：兩人都靠每日寫作反省，都在最高權力位置保持克制"}, {"n": "弗蘭克爾", "why": "內在堡壘的兩種驗證：奧勒留在權力頂點主動剋制，弗蘭克爾在集中營被動考驗"}],
fail:"公元180年，他死在多瑙河前線，把帝國交給了親生兒子康茂德。康茂德十二年後被近臣勒死，羅馬從此進入長達一個世紀的動盪。需要說明的是：此前四位皇帝之所以過繼賢能，很大程度上是因為他們沒有活到成年的兒子——「傳賢不傳子」是不是一條自覺的原則，史學界至今有爭論。但事實這一層不含糊：一個用一生練習分辨「什麼在我控制之內」的人，在他真正能控制的那件事上，選了血緣。",
lesson:["控制二分法最難的不是接受不可控的，是承認某件事確實可控——那意味著結果全部記在你賬上。","《沉思錄》是寫給自己看的，沒打算給任何人看，也就沒有任何人能拿它來質問他。私人紀律沒有外部審計。","一生的自我檢視擋不住一次例外。原則的強度不由平均水平決定，由最重要那一次的表現決定。"]},

{c:"識人與相處",n:"馬基雅維利",e:"意大利·1469-1527",w:"現實",y:1469,
d:"文藝復興時期佛羅倫薩的外交官，《君主論》作者。他不是在教人變壞，他是第一個把政治從道德里剝離出來、單獨研究的人。「馬基雅維利主義」成了「不擇手段」的代名詞，但他的原意更復雜：他研究的是權力的真實運作規律，不管你喜不喜歡這些規律，它們都在運作。他的洞察和韓非子跨越兩千年高度吻合——不是因為他們都「邪惡」，而是權力的邏輯在任何文化裡都相同。",
story:"1512年，美第奇家族重新掌權佛羅倫薩，馬基雅維利因效忠共和國被捕，遭受酷刑，隨後被放逐到農村。他在農村度過了餘生，每天白天和農夫喝酒，晚上換上朝服，端坐書房，獨自和古代偉人對話，寫下《君主論》。他把這本書獻給新統治者美第奇，希望以此換得一官半職——始終沒有成功。一個研究權力的人，用盡對權力的理解，卻無法為自己換來權力——這是他最深刻的悲劇，也是這本書最誠實的註腳。",
f:[{n:"獅子與狐狸",d:"「君主必須同時是獅子和狐狸」——獅子用力量，狐狸用智慧。只有力量，會掉入陷阱；只有智慧，不夠震懾強敵。在權力博弈裡，單一策略總會被破解，能在力量與智慧之間隨時切換的人才能長久。這和孫子兵法「以正合，以奇勝」本質相同。"},{n:"命運與能力",d:"「命運是我們行動的一半，另一半由我們自己掌控」——Fortuna（命運）不可控，Virtù（能力/意志）可控。高明的君主不是不依賴運氣，而是在運氣好時把優勢夯實，讓運氣變差時仍有根基可依。他把命運比作洪水：防洪堤不能阻止洪水，但能減少洪水的破壞。",eg:"范蠡幫助越王勾踐時，提前布局自己的退路（Virtù），在Fortuna轉變之前已經離開。馬基雅維利最欣賞的，是在Fortuna到來之前就做好準備的人。"},{n:"恐懼與愛",d:"「被人愛戴和令人恐懼，哪個更好？理想是兩者兼得，但如果只能選一個，恐懼比愛戴更安全。」——這不是鼓勵暴政，是對人性的冷靜觀察：愛戴建立在好處上，好處消失，愛戴也消失；恐懼建立在懲罰的威懾上，威懾持續，恐懼持續。但他也說：要令人恐懼，但不要令人仇恨。"},{n:"新秩序的阻力",d:"「沒有什麼比開創新秩序更困難、更危險、更難以把握成功——因為改革者擁有的是軟弱的盟友（將要受益的人），面對的是強大的敵人（既得利益的受損者）」——這是政治改革必然遭遇阻力的結構性原因。",eg:"商鞅、王安石、張居正——所有改革者都面臨同樣的困境：改革的受益者（小農/百姓）沒有政治發聲能力，改革的受損者（貴族/官僚）有足夠的政治資源進行反撲。馬基雅維利在1500年就把這個結構說清楚了。"},{n:"眾人記憶",d:"「人們對傷害的記憶，比對好處的記憶更久」——你做了九件好事，一件壞事，人們記住的是那件壞事。這不是抱怨，是設計決策的依據：避免可能被記住的傷害，比創造被記住的好處更重要。",eg:"產品設計裡，UX的首要原則是「不要讓用戶犯錯」，而不是「給用戶驚喜」。一次糟糕的體驗會抹掉十次愉快的體驗。"}],
q:["君主必須同時是獅子和狐狸。獅子不知道陷阱，狐狸不能抵禦狼群。","人們對傷害的記憶，比對好處的記憶更久。","命運是我們行動的一半，另一半由我們自己掌控。","==被人畏懼比被人愛戴更安全，如果二者不可兼得。==","人忘記父親之死，比忘記財產的損失更快。"],
apply:"評估一段重要關係（上下級、合作伙伴）時，問自己：這段關係的基礎是真實的利益一致，還是僅僅是「好感」？好感會隨處境改變，利益綁定更穩固。馬基雅維利不是教你使壞，是教你看清關係的真實基礎。",
l:["韓非子","劉邦","曹操","司馬懿","孫子兵法"],contrast:[{"n": "韓非子", "why": "東西方最接近的政治現實主義者：相隔1700年，都研究權力的真實邏輯，都被權力反噬"}, {"n": "蘇格拉底", "why": "政治哲學的兩極：蘇格拉底為原則赴死，馬基雅維利研究如何在權力裡活下去"}]},

{c:"財富與風險",n:"達里奧",e:"當代·1949-",w:"原則",y:1949,
d:"橋水基金創始人，《原則》作者，全球規模最大的對沖基金。他在華爾街工作40年，經歷了無數市場崩潰，總結出一套可複製的決策框架。他最重要的信念：所有事情都有原則，原則可以被總結，總結後可以被系統化，系統化後可以被複制。",
story:"1982年，達里奧預測美國經濟將陷入嚴重衰退，在國會作證，向大型媒體發表預測。結果完全相反——美國股市開始了長達十八年的大牛市。他的基金近乎破產，不得不解僱所有員工，自己也面臨生活困境。他後來說：「這次失敗是我人生中最寶貴的禮物，因為它讓我認識到，要在市場上成功，必須極度謙遜，必須極度開放，必須假設自己隨時可能是錯的」。整個「原則」體系，就是從這次失敗里長出來的。",
f:[{n:"極度透明",d:"橋水所有會議錄音，任何員工可以調取，任何人可以批評任何人，包括達里奧本人。他的邏輯：不透明=信息扭曲=決策錯誤。透明的代價是「被批評的不舒適」，但這個代價換來了「知道真相的能力」。大多數組織選擇了舒適，代價是永遠活在自欺欺人裡。"},{n:"痛苦+反思=進步",d:"「Pain + Reflection = Progress」。痛苦是信號，說明某個你以為成立的假設出錯了。大多數人的反應是逃避（換話題、讓自己分心）或合理化（這不是我的錯）。達里奧的反應是：直面→深度分析→找出錯誤的假設→更新原則。每次失敗都是一次免費的、強制的系統升級。",eg:"1982年大預測失敗，幾乎讓橋水破產。達里奧沒有掩蓋，而是把整個預測過程拆解，找出哪個假設錯了，寫成內部備忘錄，強制所有人學習他失敗的過程。這次失敗直接催生了橋水後來所有的風險管理體系。"},{n:"債務大週期",d:"短週期（5-8年）：擴張→通脹→加息→衰退→降息→復甦。長週期（50-75年）：債務累積到無法靠降息解決，必須進行「去槓桿化」。1929年大蕭條、2008年金融危機都是長週期終點。理解你所處的週期階段，是宏觀資產配置最重要的變量。"},{n:"可信度加權決策",d:"不是多數投票，而是按每個人在這個領域的歷史準確率加權。不同人的意見有不同的重量——不是精英主義，是現實主義：在外科手術的問題上，外科醫生的意見比廚師重要，無論廚師的其他能力多麼出色。"},{n:"極度開放",d:"「極度開放地接受現實，極度誠實地面對自己」——他邀請所有人批評他的判斷，因為他們的視角可能看到他看不到的。大多數組織選擇了舒適（信息過濾、等級保護），代價是永遠活在自欺欺人裡。",eg:"亞馬遜的「逆向工作法」、Bridgewater的錄音文化——都是「用透明度換真相」的不同形式。你選擇舒適還是真相，決定了你能做出多高質量的決策。"}],
q:["痛苦+反思=進步。","極度開放地接受現實，極度誠實地面對自己。","失敗不是壞事，從失敗中不學習才是。","現實+對現實的接受=成功的機器。"],
apply:"下次遇到重大失敗，給自己48小時冷靜，然後做「達里奧復盤」：我的哪個假設被證明是錯的？這個假設是哪裡來的？下次遇到類似情況，我的決策邏輯應該怎麼更新？",
l:["曾國藩","王陽明","范蠡","查理·芒格","塔勒布"],contrast:[{"n": "曾國藩", "why": "東西方最接近的「反省系統」：曾國藩三十年日記，達里奧橋水錄音文化——用透明度對抗自欺"}, {"n": "塔勒布", "why": "風險哲學的互補：達里奧用原則系統管理風險，塔勒布用槓鈴策略擁抱風險"}]},

{c:"財富與風險",n:"塔勒布",e:"當代·1960-",w:"反脆弱",y:1960,
d:"黎巴嫩人，前期權交易員，後成為風險理論家。他親眼見證了黎巴嫩內戰、1987年股災、2008年金融危機，從真實的極端事件裡提煉出一套關於「不確定性」的完整哲學。他最重要的洞察：我們建立的大多數系統是脆弱的——一旦遇到意外就崩潰，而我們應該建立的是「反脆弱」的系統——從意外中變得更強。",
story:"2008年金融危機，雷曼兄弟破產，全球金融系統震顫。塔勒布的基金那一年盈利超過100%。不是因為他預測到了危機，而是因為他長期持有大量「尾部風險對沖」——那些極便宜、極少見會發動賠付的保險合約。平時每年虧一點，遇到黑天鵝暴賺。他的槓鈴策略在最壞的情況下達到最好的效果——不是因為他比別人聰明，而是因為他不假設「壞事不會發生」。",
f:[{n:"三元結構",d:"脆弱（被波動傷害，偏好穩定）→強韌（不被波動影響，中性）→反脆弱（從波動中獲益，偏好混亂）。大多數現代機構（大銀行、大公司）是脆弱的：表面穩定，遇到極端事件就崩塌。肌肉是反脆弱的：越用越強，不用就萎縮。你的職業、組織、財務，屬於哪一類？"},{n:"槓鈴策略",d:"90%極度安全（國債、現金）+10%極度高風險（期權、初創公司）；避免中間地帶（「相對安全」的債券、「平衡」的組合）。邏輯：中間地帶在黑天鵝面前最脆弱——它沒有足夠安全資產來抵禦衝擊，也沒有足夠高風險資產來從衝擊中獲益。"},{n:"皮膚在場",d:"「沒有皮膚在場的建議是無意義的噪音」。給出建議的人如果不承擔後果，他們的建議質量就無法保證。銀行家用客戶的錢冒險（自己只賺獎金不承擔損失），分析師給出推薦自己不買，政客決策自己不受影響——這些人的建議都要打折扣。"},{n:"黑天鵝的本質",d:"黑天鵝的本質不是「稀少」，而是「超出已有模型的預測範圍」——不是不常發生，而是你根本沒想到它會發生。COVID-19對公共衛生系統是黑天鵝，但對流行病學家不是。黑天鵝是相對的，取決於你的模型。"},{n:"倖存者偏差的陷阱",d:"「我們看到的是成功者，看不到失敗者」——大多數關於成功的建議，來自對倖存者的研究，而失敗者的墓地是沉默的。研究戰場上飛機被擊中的部位，應該加固沒有彈孔的地方（因為被擊中那裡的飛機都回不來了）。",eg:"創業成功學書籍幾乎都在研究活下來的公司，而死去的公司（也許做了完全相同的事）沒有人寫成書。任何成功學都要先問「失敗的人裡，有多少做了同樣的事」。"}],
q:["脆弱的對立面不是強健，而是反脆弱。","風會熄滅蠟燭，卻使篝火越燒越旺。對隨機性、不確定性和混沌也一樣：你需要擁抱它們，而不是逃避它們。","沒有皮膚在場的建議，是毫無意義的噪音。","預測未來是愚蠢的，為不可預測的未來做準備才是智慧。"],
apply:"審查你的職業收入結構：90%來自穩定的主業（安全墊），10%用於高風險高回報的探索（槓鈴策略的右端）。兩端都有，才能在意外來臨時不崩潰，甚至獲益。",
l:["道德經","納瓦爾","范蠡","孫子兵法","達里奧"],contrast:[{"n": "索羅斯", "why": "對不確定性的兩種策略：索羅斯主動識別錯誤，塔勒布被動構建反脆弱結構"}, {"n": "達里奧", "why": "風險哲學的兩個維度：達里奧建立原則系統對抗不確定性，塔勒布擁抱不確定性從中獲益"}]},

{c:"創業與產品",n:"納瓦爾",e:"當代·1974-",w:"槓桿",y:1974,
d:"AngelList聯合創始人，早期投資了Twitter、Uber、Notion等公司。2018年他在Twitter上發了一個推文串「如何在不出賣靈魂的情況下致富」，在全球傳播超過數百萬次。他不是財務顧問，是一個在數字時代找到了「個人主權」路徑的思考者。",
story:"Naval在AngelList工作期間注意到：為什麼一些人能在「不賣時間」的情況下變得非常富有，而大多數人不行？他花了數年時間整理出了他的理論：關鍵不是努力程度，而是「槓桿類型」。他自己的案例：AngelList平臺上的一個決策，可以同時影響數百家初創公司，這一個決策的價值遠超他賣100小時諮詢時間的價值——因為他用了「平臺」這個槓桿。",
f:[{n:"四種槓桿",d:"勞動力（管理他人）：古老，需要領導力；資本（用錢生錢）：強大，但需要先有資本；代碼（軟件）：寫一次，可以無限次運行，邊際成本為零；媒體（內容）：寫一篇文章，可以被無限次閱讀，邊際成本為零。代碼和媒體是「民主化」的槓桿——任何人都可以用，不需要許可，這在歷史上是前所未有的。",eg:"一個農民工，勞動力槓桿=1（只有自己的時間）。一個寫了爆款文章的人，媒體槓桿可以是100萬——同樣的內容，被100萬人讀到，創作時間一樣。ChatGPT背後的代碼，每天服務1億用戶，作者不需要為每個用戶多工作一秒。"},{n:"特定知識",d:"「在你認為是玩、別人認為是工作的地方，找你的特定知識」。特定知識不能被培訓產生，只能在熱情和好奇心的驅動下自然積累——因為這樣你會比任何為了工作而學的人學得更深入更自然。AI時代，可以被培訓出來的知識正在被AI替代；只有特定知識（你獨特的洞察+經歷+熱情的交叉點）才是持久稀缺的。"},{n:"財富vs金錢vs地位",d:"財富=睡覺時也在為你工作的資產（複利）；金錢=交換時間和勞動的工具（線性）；地位=社會等級中的排名（零和）。追求財富是正和遊戲，追求地位是零和遊戲。你花多少時間在各自上面，決定了你在哪個遊戲裡。"},{n:"幸福的減法",d:"「幸福不是通過滿足慾望獲得的，而是通過減少慾望獲得的」。每一個未滿足的慾望都是一個痛苦的來源。真正的平靜不是擁有一切，而是不被未擁有的東西困擾。這和道德經「知足者富」是同一句話——Naval讀了大量東方哲學，在現代語境裡重新表達了同樣的洞察。"},{n:"閱讀是終極元能力",d:"「閱讀讓你以幾小時的時間獲得一個人幾十年的精華」——納瓦爾把大量閱讀視為最高效的學習方式。他的閱讀方式：不追求「讀完」，只追求「讀到有用的」；隨時可以放棄一本書；同時讀多本；反覆讀經典而不是追逐新書。",eg:"他建議：與其每年讀50本新書，不如把「真正改變你的10本書」反覆讀。這和查理·芒格的建議幾乎一樣——芒格說他反覆讀的書只有幾十本，但他對這幾十本的理解程度，超過了大多數人對所有讀過的書的理解。"}],
q:["財富是你睡覺時也在為你工作的資產。","如果你的收入按小時計算，你永遠不會真正富有。","代碼和媒體是這個時代不需要許可的槓桿。","在你認為是玩、別人認為是工作的地方，找你的特定知識。","幸福不靠追求，靠移除障礙。"],
apply:"問自己：我的工作裡，哪個部分可以「寫一次，用多次」？代碼、內容、流程、框架、工具——把它們識別出來，優先投入時間在這些有槓桿效應的工作上。",
l:["彼得·蒂爾","道德經","主權個人","張一鳴","塔勒布"],contrast:[{"n": "范蠡", "why": "兩千年的財富哲學穿越：范蠡「三聚三散」和納瓦爾「財富是睡覺時也在工作的資產」——都在說真正的富是自由"}, {"n": "道德經", "why": "現代語境裡的東方智慧：納瓦爾大量引用道德經，「幸福是移除慾望」就是「知足者富」的現代版"}]},

{c:"創業與產品",n:"王興",e:"當代·1979-",w:"九敗一勝",y:1979,
d:"美團創始人，清華大學畢業。在創立美團之前，他已經失敗了八次：做過中國版Facebook（校內網），賣掉了；做過中國版Twitter（飯否），被關掉了。第十次創業，他押注團購，贏得了史上競爭最激烈的互聯網大戰「千團大戰」，把2000家對手打垮，最終把美團做成了一個管吃、管住、管出行的「超級生活平臺」。",
story:"2010年，美國Groupon模式傳入中國，一夜之間湧現出5000家團購網站，史稱「千團大戰」。王興沒有像別人那樣瘋狂燒錢搶市場，而是要求美團只在財務健康的城市擴張，堅決不做虧損的單量。所有人都認為他會輸——市場份額需要速度，不是節約。兩年後，99%的團購網站倒閉，美團活下來了，拿到了那1%。他後來解釋：「我們贏不是因為我們燒得比別人猛，是因為我們活得比別人久。」",
f:[{n:"九敗一勝",d:"王興在創立美團前已經連續創業失敗八次，每次失敗後都完整復盤，記錄「為什麼失敗、下次不能重複」。這不是勵志故事，是方法論：失敗是數據，不是結果。成功不是第一次就對，是把能犯的錯先犯完，再用積累的認知贏最關鍵的那一仗。",eg:"校內網被以極低價格出售的教訓，讓他在美團融資時堅決不接受不平等條款，寧可少拿錢也要保住控制權——第八次的失敗認知，直接影響了第十次的成敗。"},{n:"慢就是快",d:"王興拒絕「為增長而增長」——在美團擴張最快的階段，他要求所有城市的單位經濟模型先跑通再擴張。短期看，他的速度不如對手；長期看，沒有健康單位經濟模型的城市都成了燒錢黑洞，對手先死。「慢」的本質是：不把資源浪費在不能成立的事情上。",eg:"千團大戰時，拉手、糯米、點評都比美團規模大，但他們的城市擴張不看利潤只看GMV。兩年後美團是唯一健康活著的公司。他常說的一句話：「大多數人為了逃避真正的思考，願意做任何事情。」"},{n:"S曲線跳躍",d:"「每個業務都有一條S曲線：萌芽期→高速增長期→成熟期。你必須在第一條曲線的成熟期之前，找到第二條曲線的萌芽期。」美團在團購成熟之前切入外賣，在外賣高速增長時開始做酒旅。這種「曲線跳躍」不是隨機的，是系統的戰略設計。",eg:"柯達在膠捲S曲線頂點時，數碼相機已經發明瞭22年，但他們沒有跳。王興的解法：主動找下一條曲線，不等被逼著找。"},{n:"用戶價值是北極星",d:"「做任何新業務，第一個問題是：用戶為什麼要用這個？」——不是市場有多大，不是競爭對手在做，而是用戶的真實動機。他從校內網時代就培養了這個習慣：在大學宿舍裡親眼觀察學生怎麼用產品，不靠數據分析，靠真實場景理解。",eg:"美團外賣和餓了麼競爭，王興沒有簡單跟隨對手補貼邏輯，而是把「騎手速度」和「配送準時率」定為核心指標——因為用戶要的是「食物熱的時候到」，不是「價格最便宜」。"},{n:"長期主義的操作系統",d:"王興每年讀大量書，包括大量科幻小說——他認為科幻是「用想像力驗證長期邏輯」的工具。他的戰略決策依賴10年視角：「10年後這件事還重要嗎？如果是，現在就應該做，不管短期報表好不好看。」"}],
q:["大多數人為了逃避真正的思考，願意做任何事情。","選擇做正確的事情，而不是容易的事情。","我們贏不是因為燒得比別人猛，是因為活得比別人久。","慢慢來，比較快。"],
apply:"下次評估一個新業務或新方向時，先問「10年後這件事還重要嗎」，再問「用戶真正要的是什麼」，最後問「單位經濟模型能不能跑通」。三個問題都能回答，才值得投入。",
l:["張一鳴","彼得·蒂爾","巴菲特","任正非"],contrast:[{"n": "張一鳴", "why": "同時代兩種創業哲學：王興「九敗一勝」靠韌性，張一鳴「延遲滿足」靠理性——兩種不同的慢"}, {"n": "巴菲特", "why": "長期主義的兩種形態：巴菲特「如果不願持有十年就不持有一分鐘」，王興「10年後這件事還重要嗎」"}]},

{c:"謀略與競爭",n:"戰國策",e:"戰國·前453-前221年",w:"勢",y:-453,
d:"記錄戰國時期各國謀士縱橫捭闔的策略文集，是中國最刺激的歷史文獻之一。和史記的「評價」不同，戰國策更像是真實的策略備忘錄：蘇秦如何說服六國合縱，張儀如何各個擊破，馮諼如何為孟嘗君「狡兔三窟」。它不講道德，只講結果。兩千年來，但凡真正懂政治和商戰的人，都在私下裡讀它。",
story:"馮諼是孟嘗君門客，吃閒飯的，沒人看得起。他主動請命去薛地收債，走之前問孟嘗君：「收完債，帶什麼回來？」孟嘗君說：「你看家裡缺什麼就帶什麼」。馮諼到了薛地，直接把所有債券當眾燒掉，老百姓歡呼。回來後孟嘗君大怒，馮諼說：「你家裡什麼都不缺，只缺「義」——我幫你買回來了。」一年後孟嘗君被罷相，倉皇逃往薛地，薛地百姓夾道迎接。",
f:[{n:"狡兔三窟",d:"馮諼為孟嘗君設計三條退路：焚券買義（民心）、讓孟嘗君回齊國任相（權力迴歸）、在薛地建宗廟（政治合法性）。三個「窟」，每個都是不同層面的保障。現代應用：收入來源、人際關係、地理位置，分別有沒有三條退路？",eg:"2022年俄羅斯制裁：只有一條路的人被困死，提前在三個國家有資產、有關係、有居留權的人，順利撤離。馮諼的智慧不是古代的，是永恆的。"},{n:"遊說的核心技術",d:"戰國策裡幾乎每篇都是一個完整的說服案例。結構是固定的：找到對方的核心慾望（是恐懼還是貪婪？）→把你的方案包裝成滿足這個慾望的唯一路徑→讓對方感覺這是他自己想通的，不是被說服的。說服不是辯論，辯論讓對方輸，說服讓對方贏。",eg:"蘇秦遊說六國合縱：永遠先分析「這個國家最怕什麼」，然後把「合縱」包裝成唯一的解決方案。楚國怕秦國，蘇秦就說：「秦強楚弱，合縱是你唯一的出路」。他從不說「合縱對大家都好」——他說「合縱對你最好」。"},{n:"遠交近攻",d:"秦國的戰略：與遠國交好，進攻近鄰。這是地緣政治的基本邏輯：遠鄰沒有直接威脅感，可以成為盟友；近鄰是直接競爭者，必須先消滅。現代應用：進攻直接競爭對手，同時與間接競爭對手建立合作。",eg:"美團和餓了麼爭外賣市場（近攻），同時與阿里雲、騰訊雲合作（遠交）。「遠交近攻」不是古代策略，是任何競爭格局裡都成立的資源分配原則。"},{n:"察勢",d:"「聖人見微以知萌，見端以知末」——真正的智慧不是看到眼前的危機，而是在危機還沒出現時就看到它的萌芽。見萌芽的能力，比見危機的能力貴十倍。",eg:"張儀在連橫成功的頂峰，而合縱還沒失敗時，已經開始為秦國下一步布局。見萌芽的具體操作：定期問自己「現在表面看起來成功的東西，三年後會因為什麼失敗」。"},{n:"勢的本質",d:"戰國策最核心的概念：「勢」——不是實力，是「讓對方認為你有實力」的狀態。蘇秦身佩六國相印，未必真有六國之力，但這個姿態讓秦國忌憚了十五年。製造勢、借勢、破勢，是戰國策裡所有謀略的底層邏輯。"}],
q:["士為知己者死，女為悅己者容。","狡兔有三窟，僅得免其死耳。","父母之愛子，則為之計深遠。","見兔而顧犬，未為晚也；亡羊而補牢，未為遲也。"],
apply:"「狡兔三窟」是最實用的風險框架：你的主要收入來源有沒有備選？你的核心人際關係有沒有多條通道？你的地理位置有沒有plan B？任何一項只有一個答案的，現在就開始準備第二條路。",
l:["孫子兵法","范蠡","史記","道德經","韓非子"],contrast:[{"n": "孫子兵法", "why": "同一時代的兩種兵法：《孫子》講「戰與不戰」的原則，可以公開教；《戰國策》記的是具體怎麼說動某一個人在某一個時點改變主意，只能私下讀。一個是道，一個是術"}, {"n": "論語", "why": "同一段亂世的兩副面孔：《論語》講人應該成為什麼樣的人，《戰國策》記人實際上是怎麼行動的。前者是理想，後者是現場筆錄——兩本一起讀，才不會天真，也不至於犬儒"}]},

{c:"識人與相處",n:"論語",e:"春秋·前551-前479",w:"仁",y:-551,
d:"孔子和弟子的對話錄，中國兩千年來讀書人的基本教材。但論語被後代統治者包裝成了「聽話」的哲學，實際上孔子說的很多話和這個方向相反：他辭官、周遊列國、不停批評當權者。論語的核心不是禮教，是「仁」——對人真實的關懷。孔子本人是個失敗的政治家，卻是最成功的教育家：三千弟子，七十二賢人，他的思想統治中國兩千年。",
story:"孔子55歲開始周遊列國，帶著弟子四處碰壁，沒有一個國君真正採納他的主張。在陳蔡之間，他們被困絕糧，七天沒吃東西，弟子們開始動搖。子路問：「君子也有窮途末路嗎？」孔子說：「君子固窮，小人窮斯濫矣」——君子當然也有困境，但君子在困境裡守住自己，小人在困境裡什麼都做得出來。他沒有低頭，也沒有放棄，最終回到魯國，專心整理六經，寫下春秋。失敗的政治家，用失敗本身示範了什麼是「君子固窮」。",
f:[{n:"仁的本質",d:"「仁者愛人」——不是抽象的博愛，是對眼前這個具體的人真實的關懷。孔子被問「仁」超過一百次，每次回答不一樣，因為「仁」是根據對方的處境給出的答案，不是一個標準公式。",eg:"子路問仁，孔子說「克己復禮」（因為子路太沖動）；顏回問仁，孔子說同樣的話卻是更高要求；樊遲問仁，孔子說「愛人」（因為樊遲需要最基礎的理解）。同一個問題，三個答案——這就是因材施教。"},{n:"君子與小人",d:"論語裡的「君子」不是貴族，是「持續提升自己的人」；「小人」不是壞人，是「只顧眼前利益的人」。「君子和而不同，小人同而不和」——好的團隊裡，每個人都有不同意見但指向同一目標；糟糕的團隊裡，表面一致但背後各懷鬼胎。",eg:"現代公司文化裡，鼓勵「不同意見」的文化是君子文化，要求「統一口徑」的是小人文化。"},{n:"學而時習之",d:"「學而時習之，不亦說乎」——「習」的原意是「實踐」，不是「複習」。真正的意思是：學了之後去實踐，在實踐中驗證，這才是快樂的來源。這和王陽明「知行合一」、達里奧「痛苦+反思=進步」本質相同——知識只有在行動中才真正變成智慧。"},{n:"吾日三省吾身",d:"曾子說「吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？」——每天三個問題，檢查自己的核心行為是否符合自己的標準。頻繁的小反思比偶爾的大反思更有效：問題在萌芽狀態就被發現，不會積累成無法糾正的習慣。",eg:"達里奧的「痛苦+反思=進步」、曾國藩三十年日記、王陽明「致良知」——都是「吾日三省」的不同形式。"},{n:"三人行必有我師",d:"「三人行，必有我師焉：擇其善者而從之，其不善者而改之」——不是說每個人都比你厲害，而是說每個人都有值得學習的地方，同時也有值得以此為戒的地方。學習的主動權在你，不在對方是否「配」當老師。",eg:"喬布斯向索尼學設計，向百麗酒店學服務體驗，向寶馬學「去掉一切多餘」——這些都不是「比蘋果更厲害的公司」，但他們在某個維度上有值得學習的東西。"}],
q:["學而不思則罔，思而不學則殆。","知之者不如好之者，好之者不如樂之者。","君子和而不同，小人同而不和。","三人行，必有我師焉。","吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？","君子固窮，小人窮斯濫矣。"],
apply:"每天三省：今天為別人做的事，有沒有偷懶？和朋友的約定，有沒有守住？學到的東西，有沒有真正去用？不是道德約束，是最低成本的自我校正系統——堅持一年，判斷力和信譽都會顯著提升。",
l:["王陽明","曾國藩","道德經","蘇格拉底"],contrast:[{"n": "道德經", "why": "中國思想的兩條主線：孔子「仁」的加法vs老子「損」的減法——儒道互補，缺一不可"}, {"n": "蘇格拉底", "why": "東西方哲學的驚人同步：孔子和蘇格拉底幾乎同一時代，都用對話教學，都為原則付出代價"}]},

{c:"世界如何運轉",n:"人類簡史",e:"2011年·赫拉利",w:"虛構",y:2011,
d:"以色列歷史學家尤瓦爾·赫拉利用一本書重新解釋了人類6萬年的歷史。核心論點驚人簡潔：智人能統治地球，不是因為最強壯或最聰明，而是因為唯一能相信「虛構」的動物——金錢、國家、宗教、法律、公司，都是集體想像出來的「虛構」。這些虛構讓陌生人能夠大規模合作，這才是人類最危險的武器。",
story:"農業革命被大多數人認為是人類的偉大進步。赫拉利說：這其實是歷史上最大的騙局。農業革命之前，採集者每天工作4-5小時，飲食多樣，體格健壯；農業革命之後，農民每天工作12小時，飲食單一，平均壽命縮短。個體變得更慘，但小麥和水稻的總數量爆炸式增長——農業革命是小麥馴化了人類，不是人類馴化了小麥。這個「反轉」是全書最有衝擊力的洞察：進步可能對個體是倒退。",
f:[{n:"虛構的力量",d:"「智人統治世界，靠的不是個人能力，而是大規模合作；大規模合作的基礎，是相信共同的虛構」——公司是虛構的（在法律文件之外不存在），貨幣是虛構的（紙本身毫無價值），國家是虛構的（邊境線是想像出來的）。理解這一點，你就理解了所有「制度」和「權威」的本質：它們是有效的，只要足夠多的人相信它們。",eg:"比特幣是一個新的「虛構」——沒有任何實物支撐，價值完全來自「足夠多的人相信它有價值」。這和黃金、美元、公司股票的邏輯完全相同。"},{n:"認知革命",d:"大約7萬年前，智人突然獲得了「講故事」的能力——不只是描述現實，而是描述「不存在的事物」。這讓智人能夠組織大規模合作，而其他動物不能。任何成功的品牌都是認知革命的產物：耐克的「Just Do It」不是描述鞋子，是構建一個關於自我超越的虛構世界。"},{n:"農業革命的陷阱",d:"農業革命讓糧食總量增加，但個體的生活質量下降。赫拉利的框架：「集體的進步」和「個體的幸福」往往是兩回事。衡量一個「進步」是否真的是進步，不應該只看總量，還應該看個體體驗。",eg:"公司上市（集體進步：規模擴大、股價上漲），但員工幸福感可能下降（官僚增加、文化變質）。這不是反對上市，而是在評估「成功」時，需要同時看兩個維度：總量和個體體驗。"},{n:"幸福悖論",d:"「現代人擁有的比任何時代的祖先都多，卻不一定比他們更快樂」。經濟增長、科技進步、預期壽命延長——這些讓人類「更好」，但不一定讓人更幸福。主觀幸福感與客觀條件的脫節，是現代最大的哲學困境之一。"},{n:"歷史的方向",d:"「歷史是走向更大合作規模的過程」——從部落到城邦，從城邦到帝國，從帝國到民族國家，從民族國家到全球體系。每次擴大，都靠新的「共同虛構」。下一次擴大需要什麼新的虛構？赫拉利認為：人工智能和算法可能是新的「虛構基礎設施」。"}],
q:["智人統治地球，不是因為最強壯或最聰明，而是因為唯一能相信共同虛構的動物。","農業革命是歷史上最大的騙局。","能力的提升並不必然帶來幸福的提升。","我們創造的神，反過來控制了我們。"],
apply:"評估任何「制度」「規則」「權威」時，先問：這是真實存在的，還是共同虛構的？如果是虛構的，它靠什麼維持？什麼情況下這個虛構會崩塌？這個框架讓你看穿所有「理所當然」背後的脆弱性。",
l:["主權個人","道德經","孫子兵法","資治通鑑","塔勒布"],contrast:[{"n": "主權個人", "why": "文明敘事的兩個方向：人類簡史講「系統如何控制個人」，主權個人講「個人如何從系統中解放」"}, {"n": "影響力", "why": "人類行為的兩種解釋：人類簡史從物種進化角度，影響力從心理機制角度解釋人為什麼不理性"}]}
,{c:"謀略與競爭",n:"王翦",e:"秦·前280-前220",w:"自保",y:-280,
d:"秦國第一名將，滅趙、滅燕、滅楚，參與滅五國，是秦始皇統一六國的最核心執行者。但更重要的是：他是知識庫裡在「功高震主」這個問題上處理得最好的人。與他同時代的白起（同等才華，被賜死），形成了最清晰的對比。",
story:"秦始皇要滅楚，先問李信需要多少兵，李信說20萬。又問王翦，王翦說60萬，少一兵不行。秦始皇嫌王翦保守，派李信，大敗。然後親自去請王翦復出。王翦出征，到了函谷關，先派使者回去請賜「美田宅園池」。旁邊人說將軍你這要求太過分了。王翦說：秦王把全國軍隊都交給我，如果我不多要田宅來表明自己「只是貪財沒有野心」，他難道不會坐在那裡猜疑我嗎？——他用「貪財」這個小缺點，換來了統帥六十萬大軍時皇帝的信任。",
f:[{n:"主動示弱的邏輯",d:"王翦不是真的貪財，他是在做信號傳遞：「我的追求是財富，不是權力」。這個信號讓秦始皇放心——一個只想要田宅的老將軍，不會威脅皇權。這是信息博弈：用一個顯而易見的小弱點，消除對方對一個看不見的大威脅的猜忌。",eg:"商業談判裡，主動暴露一個「可控的弱點」（我們資金有限、團隊小、技術不成熟），反而讓對方放鬆警惕，接受更平等的條款。"},{n:"白起的反面教材",d:"白起長平之戰坑殺40萬，軍事才華與王翦相當，甚至更出名。但他多次拒絕執行秦王的命令，在秦王面前堅持自己的軍事判斷優先於君主命令。這在技術上是對的，在政治上是致命的——被賜死。"},{n:"只打仗不參政",d:"王翦從不參與朝廷政治，不結黨，不進言，只管打仗。越過職責邊界是功高震主的根本原因——當一個人開始在職責之外的領域發揮影響力，才真正讓掌權者感到威脅。"},{n:"功成急流勇退",d:"滅楚後，王翦立刻辭官，回家養老。不等被猜忌，主動退出。這是張良「留侯」路線的變體：張良用「微不足道的封地」來退，王翦用「辭官回鄉」來退。形式不同，本質相同。"},{n:"滅楚六十萬的判斷",d:"秦王先問李信，李信說二十萬足夠。秦王覺得王翦太保守，選了李信，大敗。再請王翦，王翦要六十萬，一兵不少。他的判斷不是基於自信，而是對楚國地形、軍隊、民心的精確計算——他知道低估的代價，所以寧可被認為保守。",eg:"項目管理裡，「樂觀估計」幾乎總是錯的。王翦的方法：把所有變量算進去，加上緩衝，給出你真正相信的數字，然後不為壓力而妥協。寧可因「太保守」被質疑，也不因「太樂觀」讓項目失敗。"}],
q:["秦王多疑，今空秦國甲士而專委於我，我不多請田宅以自固，顧令秦王坐而疑我邪？"],
apply:"當你在一個項目或團隊裡承擔了遠超普通的責任時，主動做一件事：把功勞公開歸給上級，同時表達「我只想把手頭的事做好」的信號。這不是虛偽，是維護關係健康的必要動作。",
l:["張良","韓信","司馬懿","范蠡"],contrast:[{"n": "韓信", "why": "功高震主的兩種結局：王翦裝貪財善終，韓信不退不交權被殺——同樣的功績，截然不同的處理方式"}, {"n": "范蠡", "why": "兩種功成身退：范蠡徹底消失做商人，王翦辭官回鄉——都在頂點主動退，都善終"}]},

{c:"謀略與競爭",n:"項羽",e:"楚·前232-前202",w:"剛",y:-232,
d:"中國歷史上最完美的失敗者。力拔山兮氣蓋世，以一己之力推翻了秦朝——這件事劉邦做不到。但他最終輸給了一個資質普通的沛縣亭長。他的失敗不是能力的失敗，是認知的失敗：他以為戰爭是強者對弱者的碾壓，卻不知道劉邦打的是另一種遊戲——用人的遊戲。",
story:"垓下被圍，四面楚歌。項羽帶著八百騎突圍，渡過淮河，身邊只剩二十八騎。追兵將至，有船伕願意送他渡烏江，說江東雖小，足以稱王，東山再起。項羽拒絕了：「天之亡我，我何渡為！且籍與江東子弟八千人渡江而西，今無一人還，縱江東父兄憐而王我，我何面目見之？」他不是不能跑，是不肯跑。然後獨自面對漢軍，殺敵數百，最終自刎。",
f:[{n:"力與謀的失衡",d:"項羽的軍事才華無可挑剔——破釜沉舟、彭城之戰以三萬騎兵擊潰劉邦五十六萬——但他只會用「力」，不會用「謀」。他消滅的是眼前的敵人，劉邦消滅的是未來的威脅。兩種戰爭觀，導致兩種結局。",eg:"鴻門宴，范增示意項羽殺劉邦，項羽不忍下手。不是因為仁慈，是因為他的戰爭邏輯裡，敵人應該在戰場上被打敗，而不是在宴會上被刺殺——他的「剛」讓他看不見劉邦軟弱外表下的威脅。"},{n:"不能用人",d:"「項羽有一范增而不能用，此所以為我擒也」——劉邦自己說的。范增是項羽最重要的謀士，屢次給出正確建議，項羽屢次不聽。他把個人判斷凌駕於一切之上，結果是：聰明人都離開了他，或者留下來卻無法發揮作用。"},{n:"分封的錯誤",d:"推翻秦朝後，項羽分封十八路諸侯，把劉邦發配到巴蜀。這個方案讓所有人都不滿意：分到好地方的人不感激，分到壞地方的人心存怨恨。他試圖用「公平」維持秩序，卻製造了一個所有人都有動機反抗他的格局。",eg:"組織重組後的利益分配，往往製造的不滿遠超製造的滿意——因為得到的人以為理所當然，沒得到的人耿耿於懷。"},{n:"烏江拒渡的人格",d:"項羽在最後時刻拒絕渡江，不是戰略失誤，是人格選擇。他活在一套「英雄必須正面迎戰、失敗了不能苟活」的價值體系裡。這套價值體系讓他成為傳奇，也讓他無法成為劉邦那樣的贏家。",eg:"「留得青山在，不怕沒柴燒」是劉邦的邏輯；「縱死猶聞俠骨香」是項羽的邏輯。兩種選擇沒有高下，但在爭奪天下這件事上，劉邦的邏輯贏了。"},{n:"失敗的完整清單",d:"項羽的失敗給出了一個完整的反面清單：不用謀士（范增被氣走）、不能用人（韓信從他這裡跑去了劉邦那裡）、賞罰不公（刻印不肯給）、婦人之仁（鴻門宴放走劉邦）。每一條都是確定性的自我削弱。",eg:"他是知識庫裡最好的「反面教材」——不是因為他不夠強，恰恰是因為他太強了，強到不需要任何人，強到可以無視所有規則，強到最後只剩他一個人。"}],
q:["力拔山兮氣蓋世，時不利兮騅不逝。騅不逝兮可奈何，虞兮虞兮奈若何！","此天之亡我，非戰之罪也。","縱江東父兄憐而王我，我何面目見之？"],
apply:"審視自己的團隊：有沒有「范增」——那個說了正確的話但被你忽視的人？不聽謀士的領導，最終只能用自己一個人的腦子對抗所有人。",
l:["劉邦","韓信","孫子兵法","范蠡"],contrast:[{"n": "劉邦", "why": "最完美的失敗者對最不完美的成功者——才華的極限vs用人的極限"}, {"n": "凱撒", "why": "西方與東方的悲劇英雄：凱撒死於信任的人，項羽死於不肯渡河"}],
fail:"垓下之戰，項羽以十萬對陣劉邦六十萬聯軍，四面楚歌，軍心瓦解。他本可突圍，本可渡江，本可東山再起。他選擇了死。不是因為無路可走，是因為他的「剛」讓他認為，一個真正的英雄不應該以這種方式活著。他贏得了傳奇，輸掉了天下。",
lesson:["「剛」是最耀眼的品質，也是最致命的弱點——它讓你無法彎曲，而彎曲往往是生存的前提。","才華的上限是你一個人能做到的極限；用人的上限是所有人能做到的總和——項羽永遠活在前者裡。","失敗者的教訓比成功者的經驗更清晰：所有的「不肯」背後，都有一套讓自己感覺正確的價值體系在支撐。"]},

{c:"權力與組織",n:"武則天",e:"唐·624-705",w:"破局",y:624,
d:"中國歷史上唯一的女皇帝。從14歲入宮做才人，到80歲退位，用了66年時間打破了所有規則。在一個「女人不得干政」的時代，她把每一條規則都變成了可以穿越的障礙。",
story:"武則天入宮時是才人，地位很低。太宗死後，按規矩，沒有生育的妃嬪要去感業寺出家。她在感業寺等待，等到了太宗的兒子高宗來祭祀——高宗對她早有情意。她從尼姑變回妃嬪，然後一步步排擠王皇后，成為皇后。她親手掐死了自己剛出生的女兒，嫁禍給王皇后——沒有人能證明這件事，但所有人都相信她做得到。這個故事展示了一種極其清醒的權力認知：在生死存亡的時刻，沒有任何籌碼是不可以押上的。",
f:[{n:"破局思維",d:"武則天的每一步都是在打破「這是不可能的」。女人不能幹政→她幹了；沒有生育不能回宮→她回來了；皇后不能被廢→她廢掉了；女人不能稱帝→她稱了。她的方法論：把每一條規則分解成「誰在執行這條規則」和「執行者有什麼弱點」，然後從弱點入手。",eg:"現代創業裡的「這個市場已經有巨頭了，我們沒有機會」——武則天式的思維是：把這句話拆解成「哪些人在維護這個格局」「他們的利益是什麼」「什麼情況下他們會放棄維護」。"},{n:"聯盟的精確計算",d:"武則天在權力上升期，精確計算每個人的立場：誰是天然盟友（和她利益一致的），誰是可以中立化的（用利益收買），誰是必須消滅的（利益根本對立）。她從不做無謂的爭鬥，每次出手都在己方優勢最大的時刻。"},{n:"用人超越門第",d:"武則天重用了大量寒門出身的人才，通過完善科舉制度打破門閥壟斷。這不只是進步主義，是精確的政治計算：寒門出身的人沒有家族資源，只能依附於皇權——她給他們機會，他們給她忠誠。",eg:"她擴大科舉，增設殿試，讓更多人有機會進入權力核心。表面上是改革，實質是：建立一批只對她負責、沒有其他退路的權力代理人。"},{n:"晚年的清醒",d:"武則天在晚年立唐中宗（兒子）為太子，而不是自己侄子武三思，實際上是承認了武週會隨她而去。她足夠清醒地知道：她建立的權力來自對李唐的「借用」，而不是真正取代——最終選擇迴歸，讓唐朝延續。"},{n:"名聲的代價",d:"武則天的手段讓她被寫成了「毒婦」，但她治下的唐朝版圖沒有縮減，科舉人才輩出，經濟繼續發展。歷史上對女性權力者的記載往往比對男性更苛刻——同樣的手段，男皇帝叫「雄才大略」，她叫「心狠手辣」。這本身是一個值得思考的觀察。"}],
q:["凡是有才能的人，不問出身，皆可為官。"],
apply:"遇到「這件事不可能」的時候，武則天式的問法是：這條規則是誰在執行的？執行者的利益是什麼？什麼條件下他們會停止執行？把抽象的「不可能」變成具體的「誰」和「什麼條件」，可能性立刻變大。",
l:["劉邦","韓非子","馬基雅維利","資治通鑑"],contrast:[{"n": "馬基雅維利", "why": "權力現實主義的東西方實踐：馬基雅維利寫了《君主論》，武則天把它活了出來"}, {"n": "商鞅", "why": "兩個打破規則的改革者：商鞅打破貴族特權，武則天打破性別禁區——都付出了巨大代價"}]},

{c:"權力與組織",n:"朱元璋",e:"明·1328-1398",w:"絕境",y:1328,
d:"史上最徹底的草根逆襲。出發點：一個家裡人全死於饑荒的16歲孤兒，討飯為生，當過和尚。終點：明朝開國皇帝，統一天下。他的成功邏輯和所有「精英創始人」完全不同：不是靠資源，不是靠人脈，只靠「活下去」這一個目標。但他的黑暗面同樣顯著：開國功臣幾乎被殺盡，四大案死亡人數超過十萬。",
story:"朱元璋17歲時，父母哥哥相繼死於饑荒。他去皇覺寺當和尚，沒幾個月寺裡也斷糧，他出門化緣（乞討）。三年間，他走遍了淮河流域的山河，見過了最底層的人間疾苦，也見過了元朝官員的腐敗和殘暴。25歲加入紅巾軍時，他已經是那個時代最瞭解「底層是怎麼想的」的人之一。這種對底層的理解，後來轉化成了極強的動員能力——他知道怎麼讓絕望的人有希望，怎麼讓流民變成戰士。",
f:[{n:"絕境優勢",d:"「輸得起」是最被低估的競爭優勢。朱元璋沒有退路，所以他敢全押；陳友諒、張士誠有東西要保，所以他們有時候選擇保守。在初始資源極少的情況下，「什麼都不怕輸」反而是一種自由——這就是草根創業者面對資本充裕的對手時，有時候反而能贏的原因。"},{n:"草根心理學",d:"出身底層，見過剝削，導致朱元璋對「精英階層」有永久性不信任。這種不信任推動了他對官員的極端管控（錦衣衛、特務政治），也推動了他大規模殺功臣——「完美無缺的人」在他眼裡最危險，因為他見過太多「完美無缺」背後的真實。"},{n:"四大案的邏輯",d:"洪武四大案死亡人數超過10萬。用意很清晰：他知道繼承人朱允炆性格軟弱，壓不住這些強勢功臣，所以他在活著的時候替孫子清場。這是他作為「創始人」最冷酷也最清醒的一面——把短期惡名換成長期政權穩定。",eg:"創始人把身邊的人當工具，工具用完了丟掉，最終自己陷入孤立。領導力不只是「用人」，還有「留人」和「信人」。"},{n:"標準化的力量",d:"朱元璋建立了中國歷史上最詳細的行政規範體系：《大明律》、《皇明祖訓》——規定了每種情況下官員必須怎麼做，以及懲罰標準。這種極度標準化來自他對貧苦出身的深刻記憶：他見過太多官吏的任意性，知道沒有標準就沒有公正。",eg:"麥當勞標準化的操作手冊，讓一個大學生能在一週內勝任任何崗位——這和朱元璋對官員行為的標準化是同一個邏輯：把知識從個人身上剝離，放進系統裡，讓系統可以在沒有特別優秀的個人時依然運轉。"},{n:"兩種草根路徑",d:"朱元璋和劉邦都是草根出身，但路徑截然不同。劉邦「財散人聚」，通過給予建立團隊忠誠；朱元璋「殺盡功臣」，通過恐懼建立皇權穩定。前者建立了四百年漢朝，後者建立了二百七十年明朝——兩種路徑都有效，但代價和機制完全不同。"}],
q:["我本淮右布衣，天下於我何加焉。","驅逐胡虜，恢復中華，立綱陳紀，救濟斯民。"],
apply:"在創業或項目初期，資源極少時，「沒有退路」可以轉化為優勢：明確告訴團隊「我們只有這一次機會」，激發不同於有退路時的專注和創造力。",
l:["劉邦","韓非子","曹操"],contrast:[{"n": "劉邦", "why": "兩個草根皇帝的用人哲學：劉邦「財散人聚」信任功臣，朱元璋殺盡功臣不信任任何人"}, {"n": "曼德拉", "why": "從絕境崛起的兩種心理：朱元璋的絕境讓他永久不信任人，曼德拉的絕境讓他學會了放下仇恨"}],
fail:"朱元璋晚年，大規模株連功臣——胡惟庸案、藍玉案牽連數萬人。他試圖用恐懼和清洗來保證政權穩定，卻製造了一個悖論：殺掉了所有有能力的人，讓繼承人面對燕王朱棣的靖難時，朝廷找不到一個能打仗的將領。清場的代價，是讓下一代無人可用。",
lesson:["「絕境」給了他超越一切的動力，也讓他永遠無法信任任何人。","殺功臣解決了短期的威脅感，卻製造了長期的能力真空——安全感不能靠消滅威脅來獲得，只能靠建立真正的信任。","草根出身是最深刻的認知來源，也是最持久的心理創傷。"]},

{c:"權力與組織",n:"張居正",e:"明·1525-1582",w:"改",y:1525,
d:"明朝兩百七十餘年，唯一一個真正做到「改變國家」的宰相。萬曆新政期間，他推行一條鞭法（稅制改革）、考成法（官員考核）、清丈田畝——國庫從虧空變為儲銀400萬兩。他活著時權傾天下，死後不到一年被清算，家破人亡。這是知識庫裡改革者宿命的最完整版本。",
story:"張居正的權力來自一個奇特的三角：幼年萬曆皇帝（名義最高權威）、李太后（實際最高權威）、宦官馮保（內廷掌控者）。張居正搞定了太后和馮保，才能推行改革。但他對萬曆的管教極為嚴格——要求皇帝勤政、節儉、學習，萬曆十歲起就過著被管控的生活。張居正死後，萬曆親政，第一件事就是清算張居正。這不只是政治，也是心理創傷的報復——一個被壓抑了十年的皇帝，終於找到了發洩的機會。",
f:[{n:"一條鞭法的革命性",d:"把幾十種稅（糧食、布匹、勞役……）全部合併為一種，統一折算成白銀徵收。標準化=減少腐敗空間（稅種複雜=官員有靈活操作空間）。貨幣化=人口流動（勞役制消失，人可以離開土地）。一次改革同時解決了兩個深層問題。"},{n:"考成法的執行力",d:"官員立年度目標，按季彙報，完不成者降級。這等於給整個官僚機器加上了考核機制——結果：政令暢通，效率大增，同時積累了大量記恨他的官員。改革的代價不是眼前的阻力，而是未來的敵人。",eg:"績效考核在任何組織里都是最危險的改革：做之前所有人都支持「公平」，做了之後被考核不達標的人開始尋找反擊機會。"},{n:"改革者的宿命",d:"商鞅/吳起/王安石/張居正四人有同一個結局模式：改革成功→觸動大量既得利益者→靠權力推行→靠山死或權力消失→利益受損者反撲。解法只有一個：讓改革「生根」，形成新的受益群體來守護改革成果。張居正失敗在這裡——一條鞭法的受益者（普通百姓）沒有政治發聲能力，無法對抗利益受損的官僚階層。"},{n:"壓制皇帝的代價",d:"張居正對萬曆的高壓管教，是他最大的戰略失誤。他用十年時間把萬曆訓練成了一個完美的皇帝，同時也把萬曆變成了他死後最大的敵人。在權力關係裡，「恩人」和「壓迫者」有時候是同一個人——萬曆最終選擇了把張居正定義為後者。",eg:"創始人和職業經理人的關係裡，這個模式反覆出現：強勢的導師/上司把下屬培養成才，下屬成才後的第一件事往往是擺脫那個「太強勢的人」。"},{n:"獨攬大權的陷阱",d:"張居正的權力建立在三角關係上，而不是制度賦予的宰相權力。當太后失勢、馮保被清洗，他的權力基礎瞬間消失——個人權力是脆弱的，制度權力才持久。"}],
q:["天下之事，不難於立法，而難於法之必行。","我非相，乃攝也。"],
