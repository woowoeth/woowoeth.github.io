const DQX={"做點新東西，不要隨大流。":"他人生五條準則的第一條。隨大流的問題不在於錯，在於即便對了，收益也早被分完了——優勢只存在於還沒有人站的地方。","和你能找到的最聰明的人在一起，然後放手讓他們做。":"兩個動作缺一不可。只招不放，等於花大價錢買來一群執行者；而放手比招人難得多，因為它要求你承認自己不是最強的那個。","我是模型先生，不做基本面分析。模型的好處之一，是它能降低風險。":"放棄理解，換來不被自己的故事欺騙。他的收益不來自看得更準，來自把判斷這一環從流程裡整個刪掉。","如果你花在選股上的時間比挑一臺冰箱還少，那你活該虧錢。":"一句刺人的對照：買冰箱會比價、查參數、看評測，買股票卻靠一條消息。投入的注意力和金額完全不成比例。","如果你每年花13分鐘研究宏觀經濟，那你就浪費了10分鐘。":"不是說宏觀不重要，是說它不可預測且不可行動。把時間投進一個無法轉化為決策的變量，是最隱蔽的浪費。","在股市裡最重要的器官是胃，不是腦子。":"判斷的門檻遠低於承受的門檻。多數人不是沒看對，是在看對的位置上被波動搖了出去。","翻的石頭越多，找到的東西越多。":"他全部方法的底座，也是最難抄的一條：超額收益來自調研次數，而次數是體力活，不是洞察力。","讓人對你有所期待，勝過讓人看清你的底。":"已知的能力會被定價，未知的能力才有溢價。一次把實力放滿的人，從此只能按那個標準被要求。","不要把話說盡，也不要把事做絕：留下退路，是智者最後的體面。":"留退路不是怯懦，是承認自己會判斷錯。把話說死的人，等於賭自己永遠不需要改口。","凡事都有一個把手，抓住對的那一個，就能推動任何人。":"比《影響力》早了三百多年的同一個洞察，而且更冷：每個人身上都有一處可施力的位置，找錯了就是白費勁。","第一流的能力，是知道什麼時候不用它。":"能力和調用能力是兩件事。逢事必出手的人，會把自己變成一個隨時可以被消耗的資源。","寧可與聰明人為敵，不與愚人為友。":"敵人的水平決定你的上限，同伴的水平決定你的成本。和糊塗人相處，光是解釋就會吃掉你全部的時間。","國家之所以失敗，是因為攫取性制度無法創造激勵，讓人們去儲蓄、投資和創新。":"全書的結論句。窮不是因為人懶或笨，是因為在那套規則下，努力的人拿不到努力的結果。","創造性破壞重新分配的不只是收入和財富，還有政治權力":"這才是創新被壓制的真正原因。既得利益者反對的從來不是新技術，是新技術帶來的重新洗牌。","繁榮的根源不是自然資源、地理位置或文化傳統，而是制度。":"一次性排除了三種最流行的解釋。資源可以是詛咒，地理兩邊相同，文化同宗同源——只剩規則不一樣。","貧窮不是因為不知道該怎麼做，而是因為掌權者不願意那樣做。":"把發展問題從技術層拽回權力層。好政策的設計從來不難，難在它會削弱正在受益的那批人。","我從不被理論指導。我只問一個問題：這行得通嗎？":"極端實用主義的代價與紅利都在這句裡：他因此避開了所有意識形態陷阱，也因此難以被任何一套價值觀辯護。","如果你付花生米的工資，你請到的就只能是猴子。":"把廉潔做成理性選擇，而不是道德要求。任何需要人性高尚才能運轉的制度，長期都會失效。","我們是一條必須融入魚群的小魚。":"弱者的生存策略不是變強，是讓自己不值得被單獨挑出來。孤立是小國和小公司真正的死因。","在被愛戴和被畏懼之間，我一直認為馬基雅維利是對的":"他極少數一次公開的價值觀表態。值得注意的是他說的是「被畏懼」，不是「被討厭」——兩者的成本天差地別。","我不在乎民調，我在乎的是三十年後這個國家還在不在。":"長期主義的真實形態：不是有耐心，是願意在自己的任期內承擔罵名，把成果留給一個自己看不到的時點。","機器不打仗，地形不打仗。人打仗。你必須進入人的頭腦裡去。":"把競爭的目標從對手的資產改成對手的判斷。裝備和陣地都只是變量，真正的戰場在對方怎麼理解局面。","你可以選擇成為某個人，也可以選擇做成某件事。總有一天，你必須在這兩條路之間選一條。":"他給每個年輕軍官講的岔路。兩條路在早期看起來完全重合，等你發現它們分開時，通常已經選過了。","混亂、無序和不確定，不是要消除的東西":"對克勞塞維茨「摩擦」的一次反轉：既然迷霧無法清除，就別浪費力氣清除它，把它定向輸送給對手。","如果你的循環快過對手，那麼他做的每一個反應，都是在應對一個已經消失的世界。":"速度優勢的真正殺傷力不在快，在於讓對手的每一次正確決策都自動過期。他不是被打敗，是自己亂掉的。","百戰百勝，非善之善者也；不戰而屈人之兵，善之善者也。":"打贏一百次也是一百次消耗。孫子的標準不是勝率，是代價——最好的勝利不在戰場上產生，而在對方算完得失後自己放棄。談判和競爭同理：逼對方算清楚，比逼對方認輸便宜得多。","知己知彼，百戰不殆；不知彼而知己，一勝一負；不知彼，不知己，每戰必殆。":"三種狀態對應三種勝率，最該注意的是中間那檔：只知己不知彼是五五開，等於把結果交給運氣。多數人敗在只做了一半功課，就以為自己準備好了。","兵無常勢，水無常形，能因敵變化而取勝者，謂之神。":"「神」不是算無遺策，是不帶預設方案入場。凡是把上一次贏的打法當模板的，都在等一個必然到來的失敗。","勝兵先勝而後求戰，敗兵先戰而後求勝。":"順序決定生死：贏家先把勝負條件湊齊再開打，輸家先開打再想辦法贏。所有臨場翻盤的故事，都是倖存者偏差。","上兵伐謀，其次伐交，其次伐兵，其下攻城。":"一張四級成本表，越往下越貴：攻心最便宜，攻城最貴。真正的問題是，人的本能恰好是從最貴的那一層開始。","戰略上藐視敵人，戰術上重視敵人。":"兩個層次不能串臺：戰略上怕，就不敢下場；戰術上不怕，就會輕敵送命。而多數人恰好反著來——戰略上盲目樂觀，戰術上畏首畏尾。","集中優勢兵力，各個殲滅敵人。":"弱者唯一能贏的方式：全局劣勢不重要，只要每一次局部交手你都是多打少。資源不夠的時候不要攤開，要疊起來。","存地失人，人地皆失；存人失地，人地皆存。":"地會再長出來，人不會。凡是為了保住陣地、面子或估值而把人打光的，最後兩樣都留不住。","打得贏就打，打不贏就跑。":"聽著像取巧，其實最難：它要求你隨時誠實評估自己打不打得贏，並且在承認不行的那一刻立刻放棄已經投入的成本。","為學日益，為道日損。損之又損，以至於無為，無為而無不為。":"兩條方向相反的曲線：學知識是加法，練判斷是減法。多數人一輩子只走加法那條，收集越來越多的方法，卻沒有能力刪掉錯的。","知人者智，自知者明。勝人者有力，自勝者強。":"四句裡最狠的是最後三個字。贏別人靠能力，贏自己靠結構——前者有天花板，後者沒有。","天下之至柔，馳騁天下之至堅。":"柔不是軟弱，是不給對方著力點。硬碰硬會同時磨損兩邊，水不會。","破山中賊易，破心中賊難。":"外部的敵人有形狀、有位置、可以調兵；內心的懶惰、傲慢和恐懼沒有戰場。他打贏了所有的仗，然後說難的是這個。","人須在事上磨鍊做功夫，乃有益。":"反對純粹的書房修養：道理在書房裡永遠成立，只有放進具體的事、具體的人、具體的利益衝突裡，它才會露出你沒想到的那一面。","志不立，天下無可成之事。":"不是雞湯。沒有立志的人不是不努力，而是每一次選擇都缺一把尺子，於是長期看下來是隨機遊走。","天下古今之庸人，皆以一惰字致之；天下古今之才人，皆以一傲字致之。":"一份兩欄的死亡清單：平庸的人敗於懶，有才的人敗於傲。越是聰明人，越該盯右邊那一欄。","困心橫慮，正是磨鍊英雄之時。":"把難受重新定義為過程指標：正在被擰的那個時刻，恰好是能力邊界正在移動的時刻。","飛鳥盡，良弓藏；狡兔死，走狗烹。":"組織不是忘恩負義，是需求變了。戰時最有價值的那種能力，和平時期可能變成最大的威脅——關鍵是提前看見這個切換點。","陷之死地而後生，置之亡地而後存。":"極高風險的動員術：去掉退路能榨出全部潛力。但它只對本來就沒有選擇的人有效；主動給自己斷後路的，多數只是在賭。","老驥伏櫪，志在千里；烈士暮年，壯心不已。":"五十三歲寫的。它的重量不在豪情，而在於承認了「暮年」這個前提之後，仍然選擇不停。","非淡泊無以明志，非寧靜無以致遠。":"兩個負向條件：不是讓你清心寡慾，而是說慾望太密時人看不清自己要什麼，噪音太大時人算不了遠。","不伐賊，王業亦亡；惟坐而待亡，孰與伐之？":"明知打不贏還要打的理由：坐著等死和站著輸是兩種不同的結局。有些仗的目的不是贏，是不讓局面停在必死的那一格。","倉廩實則知禮節，衣食足則知榮辱。":"道德是有物質門檻的。任何指望靠說教解決的問題，先去查一下它的生存條件夠不夠。","一年之計，莫如樹谷；十年之計，莫如樹木；終身之計，莫如樹人。":"一份複利期限表：一年、十年、一生。絕大多數組織的所有動作，都停在第一欄。","生我者父母，知我者鮑子也。":"中國最著名的一句致謝。管仲從來不缺能力，缺的是在他一無所有時有人替他背書——而這恰恰是最稀缺的資源。","在別人貪婪時恐懼，在別人恐懼時貪婪。":"逆向不是唱反調，是給情緒定價：市場情緒最貴的時候資產最便宜，反之亦然。難點在於，你自己也泡在同一種情緒裡。","第一，不要虧錢；第二，不要忘記第一條。":"複利的算術：虧掉50%需要漲回100%才能回本。所以第一條不是關於謹慎，是關於數學。","時間是好公司的朋友，是壞公司的敵人。":"時間會放大一切，包括缺陷。拿不住的公司不是因為拿得不夠久，是本來就不該拿。","如果你不願意持有一隻股票十年，那你連十分鐘都不應該持有它。":"一把過濾器：把持有期拉長到十年，大部分買入理由會自動失效——撐不過十年的理由，通常關於價格波動，而不是生意本身。","反過來想，總是反過來想。":"正面求解太難時先求反解：問「怎樣才能失敗得最徹底」，答案往往清晰得多，而光是避開它們就已經贏了大半。","告訴我激勵是什麼，我就告訴你結果會是什麼。":"想改變行為，別去改口號，去改激勵。所有和激勵設置相反的道德要求，長期都會輸。","以合理價格買入卓越公司，遠勝於以便宜價格買入普通公司。":"從「撿菸蒂」進化到「買質量」的那一步：便宜的東西通常有便宜的理由，而優秀的公司會自己長大，替你修正買入價上的誤差。","我沒有權利擁有一個我無法反駁的觀點。":"一條極高的發言門檻：你必須能把反方立場講得比反方還好，才算真正擁有這個觀點。否則你只是複述了一個偏好。","如果我知道我會在哪裡死，我就永遠不會去那裡。":"反向思考的極簡版：先列出所有確定的死法，然後用一輩子繞開它們。不需要預測未來，只需要標出雷區。","擴張中不忘謹慎，謹慎中不忘擴張。":"兩個相反的動作必須同時在場。只擴張的死於現金流，只謹慎的死於錯過窗口——難的是在同一時刻做兩件互相矛盾的事。","好景時不過分樂觀；不好景時不過度悲觀。":"情緒的減震器。順境裡的樂觀和逆境裡的悲觀，都會讓你在最壞的時點做出最大的動作。","第一個桶一定要紮實，才好放第二個桶。":"第一桶金的意義不在金額，在於它驗證了你的方法有效。方法還沒驗證就上槓杆，等於在放大一個未知數。","現金流是企業生存的氧氣。":"利潤是觀點，現金是事實。企業不會因為不賺錢倒閉，只會因為付不出錢倒閉。","簡單比複雜更難。你必須努力理清思路，讓它變得簡單。":"複雜是偷懶的產物——把所有可能性都留著，就不必做判斷。簡單要求你先徹底想明白，然後承擔刪掉的風險。","專注意味著對一百個其他好主意說不。":"專注真正的成本不是拒絕壞主意，是拒絕好主意。難的從來是那一百個都成立的選項。","設計不僅僅是外觀和感受。設計是產品如何工作。":"把「設計」從表層挪到結構層。看起來的樣子只是結果，決定體驗的是它究竟怎麼運轉。","延遲滿足感程度在不同量級的人是沒法有效討論問題的。":"一句冷酷的判斷：這不是能力差異，是時間尺度差異。尺度不同的兩個人討論同一件事，只會各說各話。","創業公司最大的競爭優勢是執行力，不是創意。":"創意的稀缺性被嚴重高估了。同一個想法此刻正同時出現在很多人腦子裡，分勝負的是誰先把它做出來、並且做對。","做對的事情和把事情做對是兩回事。":"兩個不同的維度：方向錯的時候，效率越高死得越快。先確認在做對的事，再談怎麼把它做好。","不管什麼錯誤，越早改正損失越小。":"沉沒成本的解藥：改正的代價隨時間指數上升，而不是線性。發現錯了的那一刻，就是最便宜的時刻。","物理學是定律，其他一切都是建議。":"第一性原理的入口：把所有「行業慣例」「大家都這麼做」降級為建議，只承認物理約束是硬的。","努力成為有用的人。做有用的事，對別人，對這個世界。":"一個極樸素的效用標準，用來對抗那些「看起來重要」的事。有用是可以驗證的，重要往往不能。","80%的時間用在創造上。":"時間分配就是戰略。會議、彙報、協調都必要，但它們只搬運已有的東西，不產生新的。","我們永遠處於公司即將倒閉的邊緣。":"一句維持了三十年的自我暗示。它的作用不是製造焦慮，是防止組織把當下的領先誤當成安全。","苦難是一份禮物，我希望每個人都有機會經歷。":"有爭議的一句。他的意思是韌性只能在真實的困難里長出來，而不是說困難本身有什麼價值。","如果你們沒有失敗過，你們其實還沒有真正開始。":"失敗率為零，說明你只做了確定能做成的事——而確定的事通常沒有超額回報。","我們想要一輛會飛的汽車，得到的卻是140個字符。":"對一整個時代的指控：資本湧向了容易的軟件創新，而難的、物理世界裡的東西進展緩慢。","做得最好的企業是那些不競爭的企業。":"競爭會把利潤磨到零。真正賺錢的公司都在做別人沒做的事——壟斷不是結果，是起點。","你在哪個重要問題上，與大多數人的觀點相反？":"他的面試題。一個只能私下回答的問題，因為如果大家都同意，它就不再是秘密了。","活下去，是華為最樸素的目標，也是最高的目標。":"最低目標和最高目標是同一個。聽起來消極，實際是把所有戰略動作都拉回同一個約束條件下檢驗。","華為沒有成功，只有成長。":"拒絕給自己定性。一旦承認成功，組織就會開始保護已有的東西，而不是繼續生長。","十年來我天天思考的都是失敗，對成功視而不見，也沒有什麼榮譽感、自豪感，而是危機感。":"把危機感做成制度，而不是情緒。它要求組織把注意力永久性地放在「哪裡可能塌」，而不是「我們贏了什麼」。","未來是無序的。這是活著最好的時代，幾乎所有你自認了解的東西都是錯的。":"1997年的判斷。它的價值不在預言準不準，而在提醒你：你確信的大部分東西，來自一套即將過期的舊結構。","暴力的成本和收益決定了人類社會的結構。":"一把解釋歷史的鑰匙：社會形態由「施加暴力的成本」決定。技術一旦改變這個成本，社會結構就跟著變。","如果說人工智能是共產主義的，那麼加密技術就是自由主義的。":"一句極簡的技術政治學：AI天然中心化、集中權力，加密天然分散、對抗權力。而這兩樣正在同時到來。","臣願封留足矣，不敢當三萬戶。":"功成之後主動要小地方，而不是要三萬戶。他把「封賞」看成風險敞口：賞越大，越顯眼，越接近清算名單的前排。","願棄人間事，欲從赤松子遊耳。":"退出的話術。他沒有說不幹了，說的是要去修仙——給權力一個體面的臺階，比直接辭職安全得多。","臣方外之人，不以官為念。":"同樣是退，李泌用的是「我本來就不是體制內的人」。不進入身份，就不必參與身份的爭奪。","明主之所導制其臣者，二柄而已矣。二柄者，刑德也。":"把管理壓縮成兩個動作：賞和罰。韓非的冷酷之處在於，他認為這兩樣一旦交出去，君主就什麼都不是了。","以銅為鏡，可以正衣冠；以古為鏡，可以知興替；以人為鏡，可以明得失。":"三面鏡子對應三種反饋源：自己、歷史、他人。最難的是第三面——因為它需要有人敢說，也需要你敢聽。","我唯一知道的，是我什麼都不知道。":"不是謙虛，是認識論的起點。他去問雅典最聰明的人，發現他們都以為自己懂；他不懂，但他知道自己不懂——這個差別決定了誰還能繼續學。","未經審視的人生不值得過。":"法庭上的最後陳述。他的意思是：你的價值觀如果沒有被自己檢驗過，你過的就是別人的人生。","我不是雅典人，也不是希臘人，我是世界公民。":"公元前五世紀說出「世界公民」。在城邦即身份的年代，這句話等於主動放棄了最大的一層保護。","你有權控制你的思想，而非外部事件。認識到這一點，你便擁有了力量。":"斯多葛的核心操作：力量不來自改變外部，來自認清哪些根本不歸你管，然後把全部資源投到歸你管的那部分。","你浪費的每一刻，都是別人拼命想要的時間。":"時間是唯一不可再生的資源，而它的稀缺性只在失去時才顯形。這句話是讓你提前感受那個稀缺。","對於不在你掌控之內的事，不要浪費精力。":"注意力是有限的。為不可控的事消耗情緒，本質上是在挪用你本該用於可控之事的資源。","最好的復仇，是不要變得和對方一樣。":"以牙還牙的隱性代價是：你會變成對方那樣的人。他給出的替代方案不是原諒，是不被對方定義。","君主必須同時是獅子和狐狸。獅子不知道陷阱，狐狸不能抵禦狼群。":"兩種能力缺一不可：獅子有力量但看不見陷阱，狐狸能識破陷阱但打不過狼。只強不智，或只智不強，都會死。","人們對傷害的記憶，比對好處的記憶更久。":"一條不對稱的人性定律：傷害在記憶裡的半衰期遠長於恩惠。所以施恩要持續，傷害要一次到位或者根本不做。","命運是我們行動的一半，另一半由我們自己掌控。":"一半一半的世界觀。既反對宿命論，也反對全能感——你能掌控的只有你那一半，但那一半必須做滿。","極度開放地接受現實，極度誠實地面對自己。":"兩個「極度」是一套配對：只對外開放不對己誠實，會變成好好先生；只對己誠實不對外開放，會變成偏執。","失敗不是壞事，從失敗中不學習才是。":"把失敗從結果重新定義為原料。真正致命的不是虧損本身，是同一個虧損重複出現。","現實+對現實的接受=成功的機器。":"一個把主觀願望排除在外的公式。「接受」是最難的那一項——大多數人卡在不肯承認現實是這樣。","脆弱的對立面不是強健，而是反脆弱。":"他造了一個詞，因為原來的詞彙裡沒有：強健只是扛住衝擊，反脆弱是從衝擊裡獲益。絕大多數系統只做到了前者。","風會熄滅蠟燭，卻使篝火越燒越旺。對隨機性、不確定性和混沌也一樣：你需要擁抱它們，而不是逃避它們。":"同一陣風，對蠟燭和篝火的作用完全相反。差別不在風，在於你的結構是消耗型還是供給型。","沒有皮膚在場的建議，是毫無意義的噪音。":"檢驗建議的唯一標準：給建議的人是否承擔後果。不承擔後果的判斷，無論多有道理，都只是噪音。","預測未來是愚蠢的，為不可預測的未來做準備才是智慧。":"把重心從「預測」挪到「配置」。預測的準確率無法提升，但抗打擊的結構可以設計。","財富是你睡覺時也在為你工作的資產。":"財富和收入的分水嶺：一個在你睡覺時繼續工作，一個在你停下時立刻歸零。","如果你的收入按小時計算，你永遠不會真正富有。":"按小時計價的本質是把時間零售出去，而時間的庫存是固定的。這決定了它的天花板不由你的能力決定。","代碼和媒體是這個時代不需要許可的槓桿。":"和資本、人力不同，代碼和媒體的複製成本為零，且不需要任何人批准。這是普通人這個時代唯一免費的槓桿。","在你認為是玩、別人認為是工作的地方，找你的特定知識。":"尋找特定知識的方法：在你覺得是玩、別人覺得是苦工的地方，你的投入產出比天然比所有人高。","幸福不靠追求，靠移除障礙。":"把幸福從「獲得」改成「減少」。追求的對象會不斷後退，而障礙是有限的、可以逐一清理的。","大多數人為了逃避真正的思考，願意做任何事情。":"一句刺人的觀察：思考很痛苦，所以人會用忙碌、開會、刷手機來替代它，並且覺得自己很努力。","選擇做正確的事情，而不是容易的事情。":"兩條路每天都在分岔，而容易的那條通常偽裝成「更現實」。區分它們的方法是問：我是在解決問題，還是在迴避不適？","我們贏不是因為燒得比別人猛，是因為活得比別人久。":"補貼戰的終局判斷。燒錢決定誰跑得快，效率決定誰活得久——而最後一個還站著的人拿走全部。","士為知己者死，女為悅己者容。":"最早的「知遇」定價。它揭示了一種非貨幣的激勵：被真正看見的人，願意付出金錢買不到的東西。","狡兔有三窟，僅得免其死耳。":"馮諼給孟嘗君設計的結構：不是一個後路，是三個。單一備份等於沒有備份，這是兩千年前的冗餘設計。","父母之愛子，則為之計深遠。":"觸龍說趙太后的核心一句。真正的愛是替對方安排長期的位置，而不是給他眼前的舒服。","見兔而顧犬，未為晚也；亡羊而補牢，未為遲也。":"兩個「未晚」是這句話的重點：它反對的不是犯錯，是發現錯了之後因為羞恥而不動手。","學而不思則罔，思而不學則殆。":"兩個失效模式：只學不想會淹沒在信息裡，只想不學會困在自己的循環裡。多數人常年偏在其中一邊。","知之者不如好之者，好之者不如樂之者。":"三級動力：知道、喜歡、享受。前兩級要靠意志維持，第三級不需要——長期競爭最後拼的是這個。","君子和而不同，小人同而不和。":"一條關於團隊的判據：能容納分歧的一致才是真的，靠消滅分歧換來的一致最脆弱。","吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？":"關鍵在「日」字。它把反省從偶發的頓悟變成每天的例行動作——曾國藩的日記，本質上是這句話的執行版。","君子固窮，小人窮斯濫矣。":"逆境是照妖鏡。人的下限不在順境裡顯形，只在被逼到牆角的時候露出來。看人要看這一刻。","智人統治地球，不是因為最強壯或最聰明，而是因為唯一能相信共同虛構的動物。":"整本書的核心論斷：讓人類形成超大規模協作的，不是力量或智力，而是相信不存在之物的能力——國家、貨幣、公司都是。","農業革命是歷史上最大的騙局。":"最反直覺的一章：從物種角度農業是巨大成功，從個體角度它帶來了更長的勞動、更差的營養和更多的疾病。指標選錯，結論就反了。","能力的提升並不必然帶來幸福的提升。":"技術曲線和幸福曲線沒有綁定。這句話是整本書對「進步」這個詞最大的保留。","我們創造的神，反過來控制了我們。":"虛構是工具，但工具會反過來定義使用者。貨幣、KPI、公司都經歷過這個反轉。","力拔山兮氣蓋世，時不利兮騅不逝。騅不逝兮可奈何，虞兮虞兮奈若何！":"垓下絕唱。值得注意的是他到最後關心的仍是「時」和「虞姬」，而不是自己哪一步走錯了。","此天之亡我，非戰之罪也。":"他至死沒有歸因到自己。這句話是整個知識庫裡最典型的一次外部歸因——也是他失敗的真正原因。","縱江東父兄憐而王我，我何面目見之？":"面子成了最後一道關。可以東山再起的條件全部具備，唯一缺的是接受自己已經輸了的能力。","我本淮右布衣，天下於我何加焉。":"稱帝之後仍然強調布衣出身。它既是自信，也是一種統治技術：出身越低，越能證明結果全靠自己。","天下之事，不難於立法，而難於法之必行。":"變法者的共同發現：立法是技術問題，執行是權力問題。張居正的考成法，就是專門為後半句造的。","竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。":"貶謫路上遇雨。它的力量在於「輕勝馬」三個字——沒有馬的人說騎馬不如走路，而且是真心的。","回首向來蕭瑟處，歸去，也無風雨也無晴。":"回望的姿態。不是雨過天晴，是連晴和雨的分別都消失了——這比樂觀高一個層級。","古之成大事者，不惟有超世之才，亦必有堅忍不拔之志。":"給「有志」加了一個前提：才華是入場券，堅忍才是決定名次的東西。這兩樣他都不缺，所以說得出口。","凡殺不死我的，必使我更強大。":"被引用最多也被誤用最多的一句。原意不是苦難有益，而是能被你消化的衝擊會轉化成結構——消化不了的會直接摧毀你。","每個不曾起舞的日子，都是對生命的辜負。":"針對的是把生活過成待辦清單的人。舞蹈在這裡代表一切沒有產出、卻證明你還活著的行為。","人之所以偉大，在於他是橋梁，而非目的。":"人的價值在於「正在通向什麼」，而不是「已經是什麼」。這句話取消了所有終點式的自我定義。","你必須有混沌，才能誕生一顆閃耀的星。":"創造的前提是先容忍無序。過早追求整齊的人，得到的通常是平庸的秩序。","人類所有的一切都可以被剝奪，唯有人類最後的自由":"集中營裡得出的結論：外部可以剝奪一切，唯獨不能替你選擇態度。這是控制二分法最極端的一次實證。","如果生命有意義，那麼苦難也有意義。":"他把邏輯倒過來用：如果承認生命有意義，就必須承認苦難也在意義之內，否則意義會在最需要它的時候失效。","我比任何人都更清楚地意識到我可能是錯的。":"頂級投機者的自我定位。他的優勢不是判斷更準，而是糾錯更快——前提是先承認自己會錯。","如果投資是有趣的，如果你玩得開心，你可能沒有賺到錢。真正的投資是枯燥的。":"刺激感和收益率是負相關的。讓你興奮的交易通常在滿足情緒，而不是在賺錢。","我之所以富有，是因為我知道自己什麼時候是錯的。":"財富的來源被他歸給了糾錯能力，而不是預測能力。這是他和大多數人對「投資高手」理解的根本分歧。","人類是行走的觸發器，很少有真正理性的決策。":"整本書的前提：人的大部分決策由固定的觸發模式驅動，理性只在事後負責編理由。","最好的防禦：放慢速度，問自己為什麼要做這個決定。":"唯一有效的防禦是時間。所有影響力技術都依賴於讓你立刻決定——一旦慢下來，多數就失效了。","優秀的管理，正是導致領導企業失敗的原因。":"最反直覺的結論：不是管理不善導致失敗，恰恰是「聽客戶的、投高利潤項目」這些正確動作，把資源系統性地擋在了新市場之外。","破壞性技術不是從最好的客戶那裡產生，而是從被忽視的客戶那裡產生。":"新技術最初總是更差、更便宜、利潤更薄，因此最好的客戶不會要它。等他們要的時候，你已經來不及了。","傾聽客戶的聲音，可能是你能犯的最大錯誤。":"這句話不是反對聽客戶，是提醒你：客戶只能告訴你他們已知的需求，而顛覆總是從他們說不清的地方開始。","成功企業的最大威脅，往往來自它們最不關注的市場。":"威脅的來源和你的注意力分布是反比的。你越不關注的市場，越沒有防禦，也越沒有預警。","袁紹多端寡要，好謀無決，難成大事。":"郭嘉對袁紹的四字判詞。「好謀無決」是最致命的一條——想得多而定不下來，等於把時間免費送給對手。","哀哉奉孝！痛哉奉孝！惜哉奉孝！":"曹操在赤壁戰敗後的哭喊。它的意義不在悼念，在於承認了一個人的判斷力對整個組織意味著什麼。","清空你的思維，無形無態，像水一樣。水可以流動，也可以衝擊。做水吧，我的朋友。":"最廣為流傳的一句。水的關鍵不是柔，是沒有固定形狀——它隨容器成形，卻始終是水。方法可以變，內核不能。","吸收有用的，去除無用的，加入自己獨特的。":"三步學習法：吸收、去除、獨創。多數人只做第一步，於是收藏了一堆別人的方法，沒有一樣是自己的。","認識自我是所有知識中最重要的。":"所有「吸收有用的」都以這句為前提——不知道自己是誰，就無法判斷什麼對你有用。","不要在腦子裡想太多，用感覺去打。":"針對的是過度分析。在需要臨場反應的場合，思考是延遲；只有已經內化進身體的東西才用得上。","如果你花太多時間思考一件事，你就永遠無法完成它。":"完美主義的解藥。想得越久，行動的門檻被自己抬得越高，最後卡在啟動這一步。","我不怕一個練了一萬種踢法的人，我怕一個把同一種踢法練了一萬次的人。":"一萬種和一萬次的差別。前者是廣度的幻覺，後者是深度的複利——真正的威脅永遠來自後者。","人固有一死，或重於泰山，或輕於鴻毛，用之所趨異也。":"司馬遷受宮刑後活下去的理由。他把死的意義交給了「用之所趨」——不是死本身，是你為什麼而死。","究天人之際，通古今之變，成一家之言。":"他給自己定的三個目標：理解規律、看清變化、寫出判斷。最後一句最勇敢——他承認自己有立場，然後誠實地寫出來。","天下熙熙，皆為利來；天下攘攘，皆為利往。":"在重農抑商的年代承認逐利是常態。這不是諷刺，是他為商業行為做的正名。","才德全盡謂之聖人，才德兼亡謂之愚人，德勝才謂之君子，才勝德謂之小人。":"司馬光的用人四象限。最重要的判斷是：德勝才可用，才勝德最危險——因為能力會放大品行的方向。","臣聞天子之職莫大於禮，禮莫大於分，分莫大於名。":"整部《資治通鑑》的開篇立論。名分不是虛禮，是秩序的最小單位——名一亂，後面全亂。","成為你希望在世界上看到的改變。":"最常被印在海報上、也最常被誤解的一句。它的重點不是號召別人，是把改變的起點強行拉回自己身上。","非暴力是人類可以支配的最強大的力量，它比人類發明的最強大的武器更強大。":"非暴力在他這裡不是道德姿態，是策略：它讓施暴者失去正當性，把對抗的戰場從力量轉移到輿論。","先他們忽視你，然後他們嘲笑你，然後他們攻擊你，然後你贏了。":"一條運動的四階段路線圖。它真正的用處是在第二、三階段——被嘲笑和被攻擊時，知道這是進度而不是失敗。","弱者永遠無法寬恕，寬恕是強者的特質。":"寬恕被他重新定義為強者的特權：只有不再需要靠仇恨支撐自己的人，才付得起寬恕的成本。","眼睛還牙齒，只會讓整個世界都變瞎。":"報復的數學結果。對等報復看似公平，但它沒有終止條件——每一輪都合理，整體走向毀滅。","想像力比知識更重要，因為知識是有限的，而想像力包圍著整個世界。":"知識是存量，想像力是生成能力。前者有邊界，後者沒有——這是他給創造力排的序。","如果你無法簡單地解釋它，說明你還沒有真正理解它。":"檢驗理解的唯一標準。講不簡單，通常不是聽眾的問題，是你自己還停在術語層面。","我沒有特別的才華，我只是有強烈的好奇心。":"他把自己的成就歸因於好奇心而非天賦。這不是謙虛——好奇心是可以選擇的，天賦不是。","邏輯會把你從A帶到B，想像力能帶你去任何地方。":"邏輯負責驗證，想像負責提出。只有邏輯的人永遠走不出已知的範圍。","上帝不擲骰子。（他對量子力學概率解釋的抗議":"他一生最著名的一次判斷失誤。這句話值得記住的是：即使是他，也會因為審美偏好而拒絕正確的理論。","我不知道第三次世界大戰會用什麼武器打，但第四次世界大戰一定是用石頭和棍子打的。":"關於核武器最冷的一句預言。它不預測戰爭，它預測的是文明可以被打回原點。","治世不一道，便國不法古。":"變法的合法性宣言：治理沒有唯一正確的方法，對國家有利就不必效法古人。這句話的代價是他自己的命。","利不百，不變法；功不十，不易器。":"變法者少有的剋制：收益不到百倍不改法，不到十倍不換工具。改革本身是有成本的，隨便改比不改更壞。","寧為鄉村第一，不為羅馬第二。":"路過一個小鎮時說的。它揭示了一種偏好：寧可在小池塘做主導者，也不在大池塘做從屬——因為主導權才能積累。","當我走出監獄大門，我知道如果我不能把悲痛和仇恨留在身後，我就仍然是個囚徒。":"走出監獄那天的自述。這句話把「自由」重新定義為一種內在狀態——牢門打開不等於出獄。","教育是可以改變世界的最強大武器。":"他把教育當成武器而非福利。因為教育改變的是下一代的選擇集，這是唯一不可逆的改變。","仇恨就像喝下毒藥，卻期待對方死去。":"仇恨的代謝邏輯：它傷害的是持有它的那個人，而對象往往毫無察覺。","勇敢不是沒有恐懼，而是判斷還有比恐懼更重要的事情。":"勇敢的定義被他改寫：不是消除恐懼，是在恐懼仍然存在時，判斷出有更重要的事。","戰略是決定在哪裡作戰，戰術是決定怎麼作戰。":"兩個層級不能混：選錯戰場，戰術再好也只是把敗仗打得漂亮一點。多數人的努力都花在下面那一層。","一個好的將軍，勝在最後五分鐘還能思考清楚。":"混亂中保持思考的能力，比任何計劃都值錢。因為所有計劃都會在接觸敵人後的第五分鐘失效。","今日勝昨日之我，明日勝不如我者":"兩條不同的標尺：和昨天的自己比是縱向，和不如自己的人比是橫向。他把縱向放在前面。","不執著於一種武器，不執著於一種思想。":"反對路徑依賴的極簡表述。武器和思想一樣，一旦成為身份的一部分，就會開始限制你。","兵法之道，即萬事萬物之道。":"他把劍術升格為通用方法論：任何一門技藝練到底，得到的都不是技巧，而是處理不確定性的方式。","以千日之功，磨一日之鋒。":"千日與一日的比例，就是準備和發揮的真實配比。真正的較量早在那一天之前就分出了勝負。","空者，無形無相，不可捉摸，卻包容萬物。":"《五輪書》最後一卷。「空」不是虛無，是不預設——留出空位，才能裝下當下真實發生的東西。","吾生也有涯，而知也無涯。以有涯隨無涯，殆已。":"常被斷章取義成勸學，原意恰好相反：知識無限而生命有限，用有限追無限是危險的。重點是選擇，不是勤奮。","人皆知有用之用，而莫知無用之用也。":"無用之用的經濟學：所有留白、閒置和看似浪費的部分，恰恰是系統抗壓和轉向的餘量。","井蛙不可以語於海者，拘於虛也；夏蟲不可以語於冰者，篤於時也。":"兩種認知牢籠：空間的和時間的。而被困住的人無法意識到自己被困——這才是這句話真正的鋒利處。","君子之交淡若水，小人之交甘若醴。":"關係的濃度和壽命成反比。太甜的開始通常靠情緒支撐，而情緒是會退潮的。","相濡以沫，不如相忘於江湖。":"最被誤讀成涼薄的一句。它說的是：與其在困境裡互相消耗以維繫關係，不如各自回到能自由呼吸的地方。","至人之用心若鏡，不將不迎，應而不藏，故能勝物而不傷。":"心如鏡的三個動作：不迎、不留、不藏。鏡子照物但不佔有物，所以永遠不會被它照過的東西損傷。","權，借物也，召之即來，揮之即去。":"郭子儀對權力的定性：它是借來的東西，不是你的資產。凡是把借來的當自己的人，都在等歸還的那一天。","如果你想說服別人，要訴諸利益，而非訴諸理性。":"說服的第一原理。訴諸理性是在要求對方否定自己，訴諸利益是給對方一個改變立場的臺階。","不要把今天能做的事拖到明天。":"他把這條寫進了每日清單。它的價值不在勤奮，在於拖延會讓任務的成本隨時間上升。","有些人25歲就死了，只是到75歲才埋。":"最鋒利的一句。它區分了「活著」和「在過日子」——很多人在某個時點停止了更新，之後只是在重複。","市場短期是投票機，長期是稱重機。":"整個價值投資的地基：短期價格由人氣決定，長期價格由內在價值決定。所有痛苦都來自把兩者的時間尺度搞混。","聰明的投資者是現實主義者，他們向樂觀主義者賣出股票，並從悲觀主義者手中買進股票。":"交易的對手盤永遠是情緒。他把買賣雙方描述成兩種情緒狀態，而你的收益就來自這兩種情緒的差值。","你是對的，是因為你的數據和推理是對的":"這句話切斷了「市場認可」和「判斷正確」之間的聯繫。對錯由證據決定，而不是由是否被人同意決定。","投資者最大的敵人，很可能就是他自己。":"敵人不在市場裡，在你自己的反應模式裡。這也是為什麼方法可以公開，收益卻無法複製。","牛市是普通投資者虧損的主要原因。":"反直覺但可驗證：牛市讓人誤以為收益來自能力，於是加槓桿、放寬標準，最終在下一輪全部還回去。","華爾街沒有新鮮事，因為投機像山嶽一樣古老。":"人性不變，所以模式重複。這句話既是安慰也是警告——歷史會重演，包括你上次犯的那個錯。","賺大錢靠的不是思考，而是坐功。能同時做到判斷正確又堅持不動的人極為罕見。":"「坐功」兩個字是全書重點。判斷正確只是入場券，能在正確的判斷上一動不動，才是收益的真正來源。","市場永遠不會錯，只有人的判斷會錯。":"市場沒有義務符合你的邏輯。當兩者衝突時，需要修改的永遠是你的判斷，而不是等市場認錯。","投機者的致命敵人是：無知、貪婪、恐懼和希望。":"四個敵人裡最隱蔽的是「希望」——它讓人在應該止損的時候繼續持有，並稱之為堅持。","一個人若不犯錯，一個月內就能擁有整個世界；但他若不從錯誤中吸取教訓，就連一樣東西也留不住。":"兩句連讀才完整：犯錯不致命，不從錯誤裡提取教訓才致命。前者是學費，後者是復購。","我們對顯而易見的事視而不見，而且對自己的視而不見也視而不見。":"雙重盲區：看不見，且不知道自己看不見。這是所有認知偏差裡最難自救的一種。","任何事都不如你正在想它時顯得那麼重要。":"聚焦錯覺。任何被你正在思考的事情，都會自動獲得誇大的重要性——所以重大決定不要在情緒現場做。","自信是一種感覺，它反映的是故事的連貫性，而不是證據的質量。":"自信被拆穿了：它衡量的是故事講得順不順，而不是證據夠不夠。講得越順，越該警惕。","人類的大腦是一臺急於下結論的機器。":"系統1的默認行為是用現有信息拼出一個完整故事，而不是承認信息不足。缺失的部分它會自己補。","要相信別人比你更容易看清你的錯誤。":"旁觀者沒有你的自我保護機制。這句話的實用價值是：主動去找那個會直說的人，並且不要反駁他。","群體中累積的只有愚蠢，而不是天生的智慧。":"群體的智力不做加法。它取的是下限而不是平均，因為能被所有人接受的，只有最簡單的那一層。","群體不善推理，卻急於採取行動。":"群體最危險的組合：判斷力下降的同時行動力上升。這解釋了絕大多數集體性災難。","影響大眾想像力的，不是事實本身，而是它呈現的方式。":"傳播的關鍵在形式而非事實。同一個事實換一種呈現方式，效果可以相反——這既是宣傳術，也是防禦的起點。","群體因為誇大自己的感情，所以只會被極端感情打動。":"群體的情緒沒有中間檔。溫和、複雜、有保留的表達在群體裡傳不動，只有極端的能傳開。","做作和辭藻華麗的東西對群體的影響，遠勝邏輯。":"對邏輯最不客氣的一句。它提醒你：在面向大眾的場合，講道理往往輸給講得好聽。","你的利潤率就是我的機會。":"對亞馬遜商業模式最精煉的概括。他人的高毛利被他視為一片尚未被效率打穿的空白地。","聰明是一種天賦，而善良是一種選擇。":"天賦不需要負責，選擇需要。這句話把善良從性格問題挪到了責任問題。","如果你把眼光放到未來三年，和你競爭的人很多；如果你能看到未來七年，和你競爭的人就很少了。":"時間維度就是競爭壁壘。看得越遠，願意陪你走的對手越少，因為大部分組織無法承受那麼長的不確定。","要以傳教士的心態創業，而不是僱傭兵的心態。":"兩種動機在順境裡看不出差別，只在長期低谷時分化：傳教士留下來，僱傭兵會離開。","失敗和發明是一對不可分割的雙胞胎。":"發明的成功率天然很低，所以想要更多發明，只能先接受更多失敗。想兩者兼得的組織最後什麼都沒有。","系統的行為，不能只靠瞭解構成它的元素來理解。":"整本書的第一原理：把每個元素都研究透，仍然預測不了系統的行為——因為行為產生於連接方式，不是元素本身。","人們憑直覺就能找到槓桿點……然後所有人都在拼命朝錯誤的方向推。":"人的直覺能找到關鍵槓桿點，但推的方向常常是反的。這是全書最具反諷意味的一句。","我們無法控制系統，也無法徹底搞懂它。但我們可以與它共舞。":"她給出的不是控制方案，是相處方案。承認系統不可完全掌控，反而是有效干預的起點。","對於一個壞政府來說，最危險的時刻通常就是它開始改革的時刻。":"托克維爾最著名的判斷：改革釋放了希望，希望改變了忍耐的基準線。這既是歷史規律，也是任何組織變革的風險提示。","被革命摧毀的政權，幾乎總是比它前面的那個政權更好。":"革命的悖論：被推翻的往往是那個已經開始鬆動、變好的政權，而不是最壞的那個。","人們耐心忍受著苦難，以為這是不可避免的；可是一旦有人提出可以擺脫它，這苦難就立刻變得無法忍受。":"忍耐力不取決於苦難的絕對量，而取決於是否存在可替代的想像。一旦出現替代方案，原來的處境立刻不可接受。","戰爭無非是政治用另一種手段的延續。":"《戰爭論》最重要的一句。它把戰爭降級為工具——一旦脫離政治目的，軍事上的勝利可以毫無意義。","戰爭中的一切都很簡單，但最簡單的事也是困難的；這些困難累積起來，就產生了一種摩擦。":"「摩擦」是他造的概念：單個動作都不難，難的是在真實世界裡累積起來的阻力。這解釋了所有計劃為什麼會走樣。","戰爭是不確定性的王國。行動所依據的東西，有四分之三籠罩在或大或小的迷霧之中。":"四分之三籠罩在迷霧裡。這個比例是他給指揮官的心理準備——決策永遠在信息不足的條件下做出。","約束對手的能力，往往取決於約束自己的能力。":"承諾的悖論：讓自己失去選擇，反而增加了對別人的約束力。燒掉退路是一種談判資產。","威懾的力量不在於擁有毀滅的能力，而在於讓對方相信你會使用它。":"威懾的真正門檻不是能力，是可信度。所有威懾失敗都失敗在對方不相信你真的會執行。","有一種威脅把一部分結果交給了偶然":"他稱之為「留有餘地的威脅」。把結果部分交給偶然，反而比明確的承諾更有威懾力——因為對方無法賭你的理性。","凡百貿易均著不得欺字，藥業關係性命，尤為萬不可欺。":"胡慶餘堂的「戒欺」匾額，他親筆所撰。值得注意的是：他在經營上說到做到，但在結構上給自己留了致命的槓桿。","我們的晚餐並非來自屠夫、釀酒師或麵包師的恩惠，而是出於他們對自身利益的考慮。":"整本《國富論》最有名的一句。它不是在讚美自私，而是在指出：可靠的協作建立在利益一致上，而不是善意上。","同行的人很少聚在一起，哪怕只是為了娛樂消遣，但他們的談話最後總是以合謀對付公眾、或是密謀抬高價格告終。":"斯密對商人的警惕遠超後世對他的印象。反壟斷的思想源頭就在這句話裡。","消費是一切生產的唯一目的，而生產者的利益，只有在能促進消費者利益時才應當被照顧。":"一句被後世不斷忽略的立場聲明：生產者的利益不是目的，只有當它服務於消費者時才值得保護。","困擾人的不是事情本身，而是人們對事情的看法。":"認知行為療法的源頭。事件是中性的，痛苦產生在事件和「這對我很糟」這個判斷之間——而判斷是可以修改的。","有些事在我們能力之內，有些不在。在我們能力之內的是判斷、意圖、慾望和厭惡":"《手冊》開篇第一句。幾乎所有痛苦都來自把第二類誤當成第一類，練習就是持續地重新分類歸位。","不要說「我失去了它」，要說「我把它還回去了」。":"把「擁有」換成「保管」。這不是叫人冷漠，是把珍惜和佔有分開——佔有的人一失去就崩，保管的人失去了還完整。","你可以鎖住我的腿，但連宙斯也奪不走我的意志。":"面對暴君威脅時的回答。它劃出了那條誰也越不過的界線：身體可以被支配，判斷不能。","智不足與權變，勇不足以決斷，仁不能以取予，強不能有所守，雖欲學吾術，終不告之矣。":"他收學生的四條門檻，缺一樣就不教。前兩條決定你能不能賺到，後兩條決定你能不能留住——多數人死在後兩條。","吾治生產，猶伊尹、呂尚之謀，孫吳用兵，商鞅行法是也。":"在重農抑商的戰國說這句話，是一次身份宣言：經商是有原理、有紀律、可以傳授的技藝，不是投機取巧。","如果我們被踢出去，董事會找來一個新 CEO，他會怎麼做？那我們為什麼不自己走出這扇門，再走回來，然後自己幹這件事？":"英特爾轉型時他問安迪·摩爾的那句話。它的作用是強行剝離沉沒成本——用新CEO的視角，看你自己今天該做什麼。","壞消息傳播得越快，越有可能被處理。":"組織健康度的核心指標。壞消息的傳播速度，決定了你在問題變成災難之前還剩多少時間。","經理人的產出，等於他直接管轄的組織的產出，加上他間接影響的組織的產出。":"他給管理者產出下的定義。它否定了「我自己很忙」這種自我安慰——你的產出不在你手上，在別人手上。","戰略轉折點到來時，它看起來只是一個糟糕的季度。":"最難的地方在於它的偽裝。真正的轉折點不會宣布自己到來，它看起來只是運氣不好的一個季度。","泡沫時期的浪費，是社會為快速建成新基礎設施所支付的代價。":"對泡沫最不帶道德判斷的一句解釋。鐵路、光纖、算力都是這樣鋪出來的——錢虧掉了，基礎設施留下來了。","每一次技術革命，都要先經歷一場金融狂熱，才能到達它的黃金時代。":"她的兩階段模型：狂熱期負責融資和鋪設，黃金期負責普及和收穫。跳過前者，後者不會到來。","技術革命需要二三十年的動盪，才能完成對社會制度的重塑。":"技術本身幾年就成熟，難的是制度、組織和習慣跟上來——這個時差就是二三十年動盪的來源。","我們也許永遠不知道要去往何方，但最好明白我們身在何處。":"他對「預測」和「定位」的切割。預測未來做不到，但判斷當下處在週期哪一格是可以做到的。","買得好，比買好的更重要。":"把注意力從標的質量挪到買入價格。再好的資產，買貴了也會變成差投資——這是他和成長派最大的分歧。","投資中最危險的一句話是：這次不一樣。":"週期的每一次頂部都伴隨這句話。它的出現本身，就是最可靠的過熱信號。","風險不是波動，風險是永久性損失的可能。":"對風險的重新定義。波動會自己恢復，永久性損失不會——把兩者混為一談，是大多數風險模型的根本錯誤。","沒有人會因為你不揮棒而判你出局。":"借棒球說倉位。市場不強迫你出手，空倉不算失誤——但大多數人受不了長期不動。","下不欺於地，中不欺於人，上不欺於天。":"《長樂老自敘》裡的自我辯護。三個「不欺」迴避了最關鍵的一條：對君主的忠。這正是後世罵他的地方。","此時百姓，佛再出救不得，惟皇帝救得。":"契丹滅晉後他對耶律德光說的話。用奉承換生民，是他最被認可的一次操作，也是他全部爭議的濃縮。","但知行好事，莫要問前程。":"他一生的行事準則。它可以理解為務實的善，也可以理解為對是非的迴避——這正是馮道難評的原因。","菩提本無樹，明鏡亦非臺，本來無一物，何處惹塵埃。":"針對神秀的「時時勤拂拭」而作。他的主張是：本來就沒有需要擦的東西，問題不在灰塵，在於你認為有鏡子。","佛法在世間，不離世間覺；離世覓菩提，恰如求兔角。":"禪宗最重要的一次落地。修行不在別處，就在日常之中——離開世間去找覺悟，等於找兔子的角。","不是風動，不是幡動，仁者心動。":"風幡之爭。他把爭論從外部現象拉回觀察者本身——你爭的從來不是事實，是你對事實的反應。","於諸境上心不染，曰無念。":"「無念」不是沒有念頭，是念頭經過而不沾附。這和斯多葛的「不將不迎」是同一種心法。","前念迷即凡夫，後念悟即佛。":"頓悟的時間尺度：不是多年苦修，是一個念頭的轉向。這也意味著，它隨時可以發生，也隨時可能退回去。","口者，心之門戶也；心者，神之主也。":"把嘴定義成門，而不是出口。門的意義在於可開可關，而多數人的門一直敞著——你說出去的每一句，都在替對方描繪你的內部結構。","與智者言依於博，與拙者言依於辨，與辨者言依於要，與貴者言依於勢。":"同一件事對四種人有四種講法。它不是圓滑，是承認：內容能不能被接住，取決於對方的接口，而不是取決於你講得對不對。","事貴制人，而不貴見制於人。":"全書的落點。主動權不在於誰說得多，在於誰定義議題、誰掌握節奏、誰決定什麼時候結束這一局。","故知之始己，自知而後知人也。":"讀人的順序是從自己開始。看不清自己的動機和偏好，讀到的所有人都會被自己的投影汙染一遍。","我們的美德常常只是偽裝起來的惡德。":"他不是說美德不存在，是說別用行為反推動機。一個人一貫大方，只證明大方對他划算；環境一變，划算的方向就變了。","我們都有足夠的力量去忍受別人的不幸。":"全書最冷的一句。它解釋了為什麼安慰總顯得輕飄，也解釋了真正的支持為什麼稀缺——它要求人付出自己本不必付出的代價。","拒絕讚美，其實是想被讚美第二次。":"很多看起來是退讓的動作，本質是加價。識別方法很簡單：看這個動作有沒有給對方留下一個必須回應的空位。","自愛是世上最大的諂媚者，它比世上最巧妙的人還要巧妙。":"自愛不斷向你彙報你是個什麼樣的人，而彙報的內容永遠對你有利。它比任何外部的奉承都更難察覺，因為它用的是你自己的聲音。","創業只有一個致命錯誤：做了沒有人想要的東西。":"其餘所有問題都是可以修的。融資順利、團隊豪華、發布會漂亮，都無法補償這一條；而這一條成立，別的錯誤大多還有時間改。","先去做那些無法規模化的事，這是通往規模的唯一路徑。":"早期的低效不是浪費。在確認有人真的想要之前，任何自動增長的機器都只是一個昂貴的假設。","與其讓很多人有點喜歡你，不如讓很少的人非常愛你。":"一百個愛你的用戶會告訴你為什麼愛、替你傳播、容忍你的粗糙；一萬個覺得還行的用戶只會安靜消失，什麼都不留下。","最好的創業想法是：你自己想要、你自己能做，而別人沒意識到它值得做。":"三條缺一條都危險：不是自己想要就判斷不了細節，做不了就只能空想，別人都覺得值得做的地方早就擠滿了。","一個會議，可以毀掉一整個下午。":"損失的不是那一小時，是整個下午——因為剩下的兩段都不夠長到重新進入狀態。時間的價值不在總量，在連續性。","松下電器是製造人才的公司，兼做電器生意。":"這句話被無數公司抄成標語，但他是當真的：他把培養判斷力當成主產品，把電器當成副產品，然後按這個順序分配資源。","生意人的使命，是讓寶貴的生活物資像自來水一樣取之不盡、用之不竭。":"使命一旦定到這個程度，很多具體爭論就自動有了答案——該不該降價、該不該走量，不需要每次重新討論一遍。","我有三個恩惠：家貧、體弱、沒上過學。":"三樣都是短板：家貧讓他知道錢怎麼來，體弱逼他授權，沒學歷逼他請教。短板本身不值錢，把短板轉成組織能力才值錢。","越是不景氣的時候，越要靠經營的力量。":"順境掩蓋一切經營問題，逆境把它們全部顯影。所以蕭條不是要熬過去的壞天氣，是一次強制體檢。","有限遊戲以取勝為目的，無限遊戲以延續遊戲為目的。":"全書的地基。把無限遊戲當有限遊戲打的人，會在贏的那一天忽然不知道該幹什麼——因為他一直在為一個不存在的終點做準備。","有限遊戲的參與者在邊界內遊戲，無限遊戲的參與者與邊界遊戲。":"兩種關係：一種把規則當前提，一種把規則當對象。所有真正的突破都發生在第二種人身上。","有限遊戲的參與者為了權力而參賽，無限遊戲的參與者憑藉力量而參賽。":"權力是別人給你的頭銜，可以被收回；力量不需要承認，也無法被剝奪。頭銜換掉之後還剩下的，才是後者。","有限遊戲的規則不可改變，無限遊戲的規則必須改變。":"最鋒利的一條。所有「我們一直是這麼做的」，都是在把一個本來無限的遊戲，悄悄降級成一個會結束的遊戲。","各族群的歷史循著不同的軌跡展開，是環境的差異，而不是人的生物學差異。":"整本書的論點，也是一條歸因紀律：看到巨大的結果差距，先往回退兩步找初始條件，而不是停在人的素質上。","可馴化的動物都是相似的，每一種不可馴化的動物各有各的不可馴化之處。":"成功需要所有條件同時滿足，失敗只需要缺一樣。這條「安娜·卡列尼娜原則」在馴化之外同樣成立。","征服美洲的主力不是槍炮，而是隨征服者一起到達的病菌。":"最反直覺也最確鑿的一條。看得見的武器往往不是勝負手，真正起決定作用的力量通常不在現場被看見。","歷史上最大的那些模式，是由各大陸環境的差異塑造的。":"尺度越大，個人和文化的解釋力越弱，結構性條件的解釋力越強。這也是他和制度學派爭論的真正焦點。"};
const DQ_ALL=[],_dqSeen=new Set();
D.forEach(d=>(d.q||[]).forEach(t=>{
  let body=String(t).split("——")[0].trim()
    .replace(/^[（(][^）)]*[）)]\s*/,"")            // 去掉句首括號註釋
    .replace(/\s*[（(][^）)]*[）)]\s*$/,"")         // 去掉句尾括號註釋
    .replace(/^[「"']|[」"']$/g,"").trim();
  if(body.length<12)return;
  if(DQ_DROP.some(k=>body.indexOf(k)>=0))return;
  if(_dqSeen.has(body))return;                       // 跨條目去重
  _dqSeen.add(body);
  DQ_ALL.push({t:body,n:d.n,c:d.c,w:d.w});
}));
// 覆蓋率自檢：新增條目/金句後若漏寫解析，控制台會點名（頁面對用戶無影響，解析區自動隱藏）
if(DQ_ALL.some(q=>!DQX[q.t]))console.warn("[DQX] 缺解析的金句：",DQ_ALL.filter(q=>!DQX[q.t]).map(q=>q.n+"｜"+q.t));
// 打散出處：把每個出處的 k 條按 N/k 的步長在「環」上均勻布點（序列會循環，
// 所以必須按環處理，否則最大的組會同時佔住首尾兩端）。確定性，無隨機。
function dqInterleave(list){
  const g=new Map();
  list.forEach(q=>{if(!g.has(q.n))g.set(q.n,[]);g.get(q.n).push(q);});
  const groups=[...g.entries()].sort((a,b)=>b[1].length-a[1].length||(a[0]<b[0]?-1:a[0]>b[0]?1:0));
  const N=list.length,out=new Array(N).fill(null);
  let cursor=0;
  for(const e of groups){
    const arr=e[1],k=arr.length,step=N/k;
    for(let j=0;j<k;j++){
      const want=Math.round(cursor+j*step)%N;
      let p=want,d=0;
      while(out[p]!==null){d++;p=(want+(d%2?(d+1)/2:-d/2)+N*2)%N;}   // 就近找空位，左右交替
      out[p]=arr[j];
    }
    cursor=(cursor+1)%N;
  }
  // 環形收尾：若仍有相鄰同出處，與一個安全位置對調
  for(let i=0;i<N;i++){
    const a=out[i],b=out[(i+1)%N];
    if(a.n!==b.n)continue;
    for(let d=2;d<N;d++){
      const j=(i+d)%N,pv=out[(j-1+N)%N],nx=out[(j+1)%N];
      if(pv.n===b.n||nx.n===b.n)continue;
      const pb=out[i],nb=out[(i+2)%N];
      if(out[j].n===pb.n||out[j].n===nb.n)continue;
      const t=out[(i+1)%N];out[(i+1)%N]=out[j];out[j]=t;break;
    }
  }
  return out;
}

const DQ_BRK="，。；！？、：…,;.!?";

function dqLines(text,px,maxW,ls){

const DQ_SIZES=[.086,.080,.075,.070,.066,.062,.058,.054,.050,.046,.042];
const DQ_LHMAX=1.40;                      // 行距上限（行間距 ≤0.40em）

function dqBand(){

function dqLayout(d){
  const B=dqBand(),W=B.W,maxW=W-Math.round(W*.09)*2;
  const core=d.t.replace(/[。，、；：？！…\.]+$/,"");
  const dup=core===d.w||(d.w.length>=2&&core.indexOf(d.w)>=0&&core.length<=d.w.length+3);
  const hd=dup?"":d.w,headSize=hd?dqHeadSize(hd.length):0;
  const hb=B.top+(headSize?Math.round(W*headSize)*.95+W*.07:0);

    const px=Math.round(W*size);

    const end=hb+px*.9+(lines.length-1)*px*lh+px*.28;

<!--GEO:BODY:START--><noscript><section id="geo-index"><h2>人類世界生存法則 — 遇到事了，看看以前的人怎麼處理</h2><p>一個關於「世界到底怎麼運轉」的知識庫：戰略、財富、權力、人性、創業，取自 159 位人物與典籍，跨越 2600 年。每一條都寫清楚這個人真正留下的那一個想法、背後的故事、拆開的分則與例子，以及今天怎麼用。</p><p>按主題瀏覽： <a href="https://ourword.ai/tw/t/modern/">現代</a> · <a href="https://ourword.ai/tw/t/industrial-age/">工業時代</a> · <a href="https://ourword.ai/tw/t/classical-era/">先秦與古典時代</a> · <a href="https://ourword.ai/tw/t/mind/">心智與情緒</a> · <a href="https://ourword.ai/tw/t/power/">權力與組織</a> · <a href="https://ourword.ai/tw/t/startups/">創業與產品</a> · <a href="https://ourword.ai/tw/t/strategy/">謀略與競爭</a> · <a href="https://ourword.ai/tw/t/wealth/">財富與風險</a> · <a href="https://ourword.ai/tw/t/learning/">學習與成長</a> · <a href="https://ourword.ai/tw/t/people/">識人與相處</a> · <a href="https://ourword.ai/tw/t/family/">家庭與關係</a> · <a href="https://ourword.ai/tw/t/living/">身心與生活</a> · <a href="https://ourword.ai/tw/t/early-modern/">近世</a> · <a href="https://ourword.ai/tw/t/han-wei/">秦漢至魏晉</a> · <a href="https://ourword.ai/tw/t/medieval/">中古</a> · <a href="https://ourword.ai/tw/t/world/">世界如何運轉</a></p><ul><li><a href="https://ourword.ai/tw/i/bj-fogg/">BJ·福格</a> — BJ·福格（2019年·斯坦福行為設計實驗室）——小到不會失敗。斯坦福行為設計實驗室創始人，研究行為如何被設計出來。他給出一個公式：行為發生需要動機、能力、提示三者同時到位。多數人失敗在只調動機——靠決心和自我激勵——而動機天然起伏，靠它維持的習慣必然崩。他的主張相反：把行為縮到小得不需要動機，然後掛在一個已有的動作後面。</li><li><a href="https://ourword.ai/tw/i/cs-lewis/">C.S.劉易斯</a> — C.S.劉易斯（1898-1963年·英國牛津）——妻子死後幾個月的日記。作家，牛津和劍橋的教授，寫過《納尼亞傳奇》和大量勸人信仰的書。五十八歲結婚，妻子喬伊四年後因癌症去世。之後幾個月他在四本練習簿上記自己的狀態，後來用筆名出版，就是《卿卿如晤》。收他是因為「重要的人走了」那六個問題，原來靠弗蘭克爾和蘇軾在答——一個是集中營的倖存者，一個是被貶的官員</li><li><a href="https://ourword.ai/tw/i/churchill/">丘吉爾</a> — 丘吉爾（1874-1965年·英國）——被晾了十年，六十五歲回來。政治家、寫作者。1929 年隨內閣下臺丟了財政大臣的位置，此後十年沒有官職，史稱荒野歲月。這十年他靠寫書養家，四卷本的《馬爾博羅傳》出在這期間；在自己家裡動手砌磚砌牆，還畫油畫。三十年代他在議會反覆講德國重新武裝、英國空軍跟不上，被同僚當成好戰和過時的人，他沒有改口，把飛機產量的</li><li><a href="https://ourword.ai/tw/i/sovereign-individual/">主權個人</a> — 主權個人（1997年·戴維森&amp;莫格）——數字主權。1997年出版，比特幣誕生早了11年。兩位作者用「暴力經濟學」解釋了人類社會的全部歷史：誰控制暴力，誰就控制財富。他們預言了加密貨幣、遠程工作、數字遊民、國家權力衰退。</li><li><a href="https://ourword.ai/tw/i/crowd/">烏合之眾</a> — 烏合之眾（法·1895年）——群體心理的操作系統。古斯塔夫·勒龐著，群體心理學的開山之作。寫於法國大革命後百年、大眾時代來臨前夜，一百多年來被政治家、革命者、廣告人、操盤手反覆研讀——據說墨索里尼倒背如流，羅斯福床頭常備。核心論斷冷酷而精確：個體一旦進入群體，智力被拉平向下，情緒相互傳染，責任感因匿名而消失——「群體中累積的只有</li><li><a href="https://ourword.ai/tw/i/jobs/">喬布斯</a> — 喬布斯（當代·1955-2011）——極簡。蘋果聯合創始人，被迫離開蘋果，在NeXT和皮克斯度過12年，然後回來把瀕死的蘋果變成了全球最有價值的公司。他的思想核心是：簡單比複雜更難，專注意味著說不，設計是產品如何工作而不只是外觀。</li><li><a href="https://ourword.ai/tw/i/sapiens/">人類簡史</a> — 人類簡史（2011年·赫拉利）——虛構。以色列歷史學家尤瓦爾·赫拉利用一本書重新解釋了人類6萬年的歷史。核心論點驚人簡潔：智人能統治地球，不是因為最強壯或最聰明，而是因為唯一能相信「虛構」的動物——金錢、國家、宗教、法律、公司，都是集體想像出來的「虛構」。這些虛構讓陌生人能夠大規模合作，這才是人類最危險的武器。</li><li><a href="https://ourword.ai/tw/i/ren-zhengfei/">任正非</a> — 任正非（當代·1944-）——韌。1987年，43歲，用2萬元創立華為，從交換機代理商起步。30多年後，華為是全球最大電信設備商。他的管理思想：自我批判是組織免疫系統，以客戶為中心是組織的北極星。</li><li><a href="https://ourword.ai/tw/i/excellent-sheep/">優秀的綿羊</a> — 優秀的綿羊（2014年·德雷謝維奇）——會考不會想。作者在耶魯任教十年、做過招生評審，寫下對精英教育的批評。他的觀察是：這套系統篩選出的年輕人極其擅長跨越一道道設定好的欄杆——成績、競賽、實習、簡歷——卻普遍說不出自己想要什麼。他稱他們為優秀的綿羊：能力很強，方向全靠外部給定，一旦沒有下一道欄杆就陷入茫然，且對失敗有超出常人的恐懼</li><li><a href="https://ourword.ai/tw/i/attachment-theory/">依戀理論</a> — 依戀理論（1950-1970年代·鮑爾比與艾恩斯沃斯）——早期模板。鮑爾比研究戰後孤兒院的孩子，提出人對親近關係的需求是本能而非依賴；他的合作者艾恩斯沃斯設計了「陌生情境」實驗，把一歲嬰兒與照料者短暫分離再重聚，從重聚那一刻的反應裡，識別出幾種穩定的依戀模式。這套模式會成為一個人此後處理親密關係的默認模板——不是決定論，但確實是出廠設置。</li><li><a href="https://ourword.ai/tw/i/paul-graham/">保羅·格雷厄姆</a> — 保羅·格雷厄姆（美國·1964年—）——做不可規模化的事。Lisp 黑客，1995 年做出 Viaweb——世界上第一個跑在瀏覽器裡的商用軟件，1998 年賣給雅虎。2005 年和幾個人辦了 Y Combinator，用「一次投一批、給小錢、給三個月」的方式重寫了早期投資的形態，Airbnb、Stripe、Dropbox 都從這裡出來。</li><li><a href="https://ourword.ai/tw/i/bismarck/">俾斯麥</a> — 俾斯麥（普魯士·1815—1898）——聯盟幾何。把歐洲當成一道幾何題來做的人。他不追求友誼，追求讓三方同時離不開你。打敗丹麥、奧地利、法國三場戰爭之後，他反而停下，用聯盟把德意志固住。拿破崙贏在打，他贏在停。</li><li><a href="https://ourword.ai/tw/i/chris-voss/">克里斯·沃斯</a> — 克里斯·沃斯（2016年·FBI首席談判專家）——先標情緒。FBI前首席國際人質談判專家，處理過綁架、劫持、恐怖襲擊。他的方法和商學院教的談判術幾乎相反：不談利益交換，先處理情緒。他的核心發現是，人在情緒沒被承認之前根本聽不進條件——所以第一步不是報價，是把對方的情緒準確說出來，讓對方覺得「這人懂我在想什麼」。</li><li><a href="https://ourword.ai/tw/i/kristin-neff/">克里斯汀·內夫</a> — 克里斯汀·內夫（2003年·得州大學）——自我關懷。心理學家，2003年把「自我關懷」從修 慮。瞭解這六個觸發器，你既能識別別人對你的操控，也能更有效地影響別人。</li><li><a href="https://ourword.ai/tw/i/drucker/">彼得·德魯克</a> — 彼得·德魯克（奧—美·1909—2005）——成果。把管理從「管人」改成「對成果負責」的人。他不寫職位說明書，寫的是：你被僱不是因為忙，是因為要產出一個別人用得上的結果。GM、日本企業、非營利都用過他的問題清單。核心只有一句：活動不算數，成果才算。</li><li><a href="https://ourword.ai/tw/i/lynch/">彼得·林奇</a> — 彼得·林奇（美國·1944-）——翻石頭。富達麥哲倫基金經理13年（1977-1990），年化29%，管理資產從2000萬美元做到140億美元，累計回報27倍，同期標普500只有4.7倍。他46歲在業績巔峰主動退休，理由是不想錯過女兒長大。他的方法沒有任何秘密可言，恰恰因此最難複製：一年調研200到300家公司，辦公室裡</li><li><a href="https://ourword.ai/tw/i/thiel/">彼得·蒂爾</a> — 彼得·蒂爾（當代·1967-）——從0到1。PayPal聯合創始人，Facebook第一個外部投資人，硅谷最重要的反共識思想者。他的核心命題：競爭是意識形態陷阱，真正能創造價值的是壟斷而非競爭。</li><li><a href="https://ourword.ai/tw/i/dweck/">德韋克</a> — 德韋克（2006年·斯坦福大學）——能力可長。斯坦福心理學家，提出固定型思維與成長型思維的區分：前者認為能力是天生定量的，後者認為能力可以通過努力和方法生長。兩種信念帶來完全不同的行為——認為能力固定的人會迴避可能失敗的挑戰，因為失敗等於證明自己不行；認為能力可長的人把失敗當作信息。這個概念影響極大，也因此被大量簡化和濫用，</li><li><a href="https://ourword.ai/tw/i/thinking-fast-and-slow/">思考，快與慢</a> — 思考，快與慢（美·2011年）——系統1與系統2。丹尼爾·卡尼曼著，行為經濟學的奠基之作。卡尼曼是史上唯一以心理學家身份獲諾貝爾經濟學獎的人（2002年），這本書是他與阿莫斯·特沃斯基四十年研究的總結。核心發現足以顛覆你對自己的信任：人腦有兩套系統——系統1快速、自動、情緒化，系統2緩慢、費力、講邏輯；你以為自己在用系統2理性決</li><li><a href="https://ourword.ai/tw/i/on-war/">戰爭論</a> — 戰爭論（普魯士·1832）——摩擦。克勞塞維茨（1780-1831）12歲參軍，親歷耶拿會戰的慘敗和拿破崙徵俄的潰退，一輩子在打敗仗和研究敗仗。他51歲死於霍亂，書沒寫完，由遺孀整理出版。《孫子兵法》教你如何取勝，《戰爭論》告訴你為什麼你的計劃一定會走樣——這是孫子完全沒有提供的那一半。</li><li><a href="https://ourword.ai/tw/i/strategies-of-the-warring-states/">戰國策</a> — 戰國策（戰國·前453-前221年）——勢。記錄戰國時期各國謀士縱橫捭闔的策略文集，是中國最刺激的歷史文獻之一。和史記的「評價」不同，戰國策更像是真實的策略備忘錄：蘇秦如何說服六國合縱，張儀如何各個擊破，馮諼如何為孟嘗君「狡兔三窟」。它不講道德，只講結果。兩千年來，但凡真正懂政治和商戰的人，都在私下裡讀它。</li><li><a href="https://ourword.ai/tw/i/thomas-gordon/">托馬斯·戈登</a> — 托馬斯·戈登（1962年·父母效能訓練）——我信息。羅傑斯的學生，把人本主義心理學做成了普通父母能學的課程——父母效能訓練（P.E.T.）。他的兩個核心工具比後來流行的溝通方法更早也更具體：一是「我信息」，用描述自己而非評判對方的方式表達不滿；二是「問題歸屬」，先分清這件事困擾的是誰，因為歸屬不同，該用的方法完全不同。</li><li><a href="https://ourword.ai/tw/i/schelling/">托馬斯·謝林</a> — 托馬斯·謝林（美國·1921-2016）——自縛其手。冷戰最危險的年代裡，最有影響力的戰略思想家不是將軍，是一個經濟學家。謝林用博弈論重新定義了「威懾」，2005年因此與奧曼共獲諾貝爾經濟學獎。他最反直覺的發現是：在談判和對抗中，主動削掉自己的選項、讓自己無路可退，反而是增強議價能力最有效的方式。燒掉退路不是悲壯，是戰術。</li><li><a href="https://ourword.ai/tw/i/technological-revolutions/">技術革命與金融資本</a> — 技術革命與金融資本（佩蕾絲·2002）——泡沫是必要成本。卡蘿塔·佩蕾絲（Carlota Perez）用兩百年、五次技術革命的數據，論證了一件反直覺的事：金融泡沫不是技術革命的意外，是它的融資機制。從 1771 年的工業革命到 1971 年開始的信息革命，每一次都走同一條路——技術爆發、金融狂熱、崩盤、制度重構，然後才輪到真正的黃金時代</li><li><a href="https://ourword.ai/tw/i/la-rochefoucauld/">拉羅什富科</a> — 拉羅什富科（法國·1613—1680年）——美德常是偽裝的惡德。法國公爵，投石黨運動的失敗者。半生卷在貴族政變裡，輸光了政治前途和一隻眼睛的視力，退隱之後在沙龍里寫下 641 條《箴言集》。他被稱為「人心的解剖者」：把慷慨、忠誠、謙遜、同情逐條拆開，發現底下坐著同一個東西——自愛（amour-propre）。這不是憤世嫉俗，是一個從內部看過那</li><li><a href="https://ourword.ai/tw/i/napoleon/">拿破崙</a> — 拿破崙（法國·1769-1821）——勢。科西嘉窮小子，20歲時法國還不是他的國家。10年後，他是法國皇帝，歐洲大陸的主宰者。再過10年，他在聖赫勒拿島孤獨死去，51歲。他的一生是「勢」的完整教科書：借勢崛起（大革命）→造勢稱霸（奧斯特利茨）→失勢覆滅（俄國）。拿破崙法典今天還在40多個國家使用。</li><li><a href="https://ourword.ai/tw/i/old-regime/">舊制度與大革命</a> — 舊制度與大革命（法國·1856）——改善催生不滿。托克維爾（1805-1859）出身法國舊貴族，家人在大革命中上了斷頭臺。他一生在追問一件事：為什麼革命偏偏發生在法國？答案顛覆了所有人的常識——革命不是被壓迫壓出來的，是被改善催出來的。這本書1856年出版，至今仍是對「改革為什麼反而引爆危機」最鋒利的解釋。</li><li><a href="https://ourword.ai/tw/i/i-ching/">易經</a> — 易經（西周至戰國·中國）——什麼時候該動，什麼時候該等。六十四卦，每卦六爻，講的其實是同一件事：一個人在不同位置上該怎麼做。乾卦最下面一格是「潛龍勿用」，最上面一格是「亢龍有悔」；泰卦和否卦緊挨著排；《繫辭》把規律總結成「窮則變，變則通，通則久」。收它是因為「進退取捨」那一組二十一個問題，原來靠荀子、諸葛亮、馮道零散地拼，庫裡一直缺一</li><li><a href="https://ourword.ai/tw/i/art-of-worldly-wisdom/">智慧書</a> — 智慧書（西班牙·1647年）——藏鋒。西班牙耶穌會士巴爾塔沙·格拉西安寫的300則處世箴言，1647年出版，四百年暢銷不衰。叔本華親手把它譯成德文，說它是「一本隨時都能用上的書，簡言之，是一位終身伴侶」，並稱其「絕對獨一無二」；尼采說，關於精神上的高貴，歐洲從未寫出過比它更精微的東西。它與《君主論》《孫子兵法》並稱三</li><li><a href="https://ourword.ai/tw/i/cao-cao/">曹操</a> — 曹操（漢末·155-220）——唯才是舉。被《三國演義》塑造成奸臣的曹操，歷史上是中國最早的系統性能力主義者。他一生發布三道求賢令：不看出身，不看品行，只看能力。同時是軍事家、政治家、詩人。</li><li><a href="https://ourword.ai/tw/i/mandela/">曼德拉</a> — 曼德拉（南非·1918-2013）——和解。坐了27年牢，出來後沒有復仇，而是選擇和解，建立了彩虹國家。他是人類歷史上「放下仇恨」最有力的示範。他的獨特性在於：他不是天生的聖人，他年輕時是武裝鬥爭的支持者，親手參與建立了武裝組織。27年牢獄把他從「憤怒的革命者」變成了「有耐心的建設者」——逆境改變了他的策略，沒有改變他的目</li><li><a href="https://ourword.ai/tw/i/zeng-guofan/">曾國藩</a> — 曾國藩（清·1811-1872）——慎。歷史上最著名的「笨人逆襲」案例。他資質平平，考了七次才中舉。但他用「結硬寨打呆仗」的方法，把自己從一個普通官員做成了晚清最重要的人物。他的秘訣不是聰明，而是「比任何人都慎」。</li><li><a href="https://ourword.ai/tw/i/hot-metal/">最後一版</a> — 最後一 章第四十七頌的通行漢譯大意是「你只有做事的權利，沒有對結果的權利」，甘地稱這本書是自己</li><li><a href="https://ourword.ai/tw/i/chu-shijian/">褚時健</a> — 褚時健（1928-2019年·雲南）——七十四歲上山種橙。雲南人。五十一歲起管玉溪捲菸廠，把紅塔山做成全國第一的品牌，出名的是把每個環節的標準定死、把每個人的收入和質量綁在一起。七十四歲那年原來的一切都沒了——位置、名聲、積蓄大半也沒了，身體也不好。他和妻子跑到哀牢山，承包兩千四百畝荒山種冰糖橙，橙樹四五年才結果，真正大賣是十年後，他八</li><li><a href="https://ourword.ai/tw/i/analects/">論語</a> — 論語（春秋·前551-前479）——仁。孔子和弟子的對話錄，中國兩千年來讀書人的基本教材。但論語被後代統治者包裝成了「聽話」的哲學，實際上孔子說的很多話和這個方向相反：他辭官、周遊列國、不停批評當權者。論語的核心不是禮教，是「仁」——對人真實的關懷。孔子本人是個失敗的政治家，卻是最成功的教育家：三千弟子，七十二賢人，他</li><li><a href="https://ourword.ai/tw/i/zhuge-liang/">諸葛亮</a> — 諸葛亮（三國·181-234）——隆中對。「運籌帷幄」的代名詞，「鞠躬盡瘁」的化身。他未出茅廬時就規劃了三分天下的格局，輔佐劉備建立蜀漢，治蜀二十年法治清明，六出祁山以攻代守。</li><li><a href="https://ourword.ai/tw/i/wiener/">諾伯特·維納</a> — 諾伯特·維納（1894-1964年·美國）——技術還沒落地就去提醒人。控制論的提出者，1948 年《控制論》出版，1950 年《人有人的用處》。他的位置在這個庫裡比較特殊：他既是把機器控制這套東西推出來的人，也是最早公開說它會大規模頂替流水線工人的人。1949 年他寫信給美國汽車工人聯合會的領袖魯瑟，說自己不願意這件事在毫無準備的情況下發生，希望工</li><li><a href="https://ourword.ai/tw/i/bezos/">貝索斯</a> — 貝索斯（美·1964年-）——飛輪效應·Day 1。傑夫·貝索斯，亞馬遜創始人。1994年放棄華爾街對沖基金高薪，在車庫創辦網上書店，把它做成橫跨電商、雲計算（AWS）、物流、硬件的兩萬億美元帝國。他是長期主義最極端的實踐者：亞馬遜連續二十年微利甚至虧損，把所有現金流砸進飛輪，被華爾街嘲諷二十年，然後贏了二十年。他的方法論——飛輪</li><li><a href="https://ourword.ai/tw/i/feynman/">費曼</a> — 費曼（1918-1988年·美國）——不騙自己。諾貝爾物理獎得主，參與過曼哈頓計劃，調查過挑戰者號事故。他留給非物理學家的東西比留給物理學家的更多——一套關於「怎麼知道自己是不是真懂」的判據。他的標準苛刻到近乎冒犯：如果你不能把一個概念講到大一新生聽懂，說明你自己沒懂。他也把這條用在整個科學界身上：科學的第一原則是不要騙自己，</li><li><a href="https://ourword.ai/tw/i/zizhi-tongjian/">資治通鑑</a> — 資治通鑑（北宋·1065-1084）——鑑。司馬光用19年主持編寫，294卷，記錄前403年到959年共1362年歷史。書名由宋神宗題：「鑑於往事，有資於治道」。它是給統治者看的歷史教科書，核心問題只有一個：政權為什麼興，政權為什麼亡。186篇「臣光曰」是司馬光的判斷，精華在這裡。與史記的「寫人」不同，資治通鑑寫的是「權力</li><li><a href="https://ourword.ai/tw/i/dalio/">達里奧</a> — 達里奧（當代·1949-）——原則。橋水基金創始人，《原則》作者，全球規模最大的對沖基金。他在華爾街工作40年，經歷了無數市場崩潰，總結出一套可複製的決策框架。他最重要的信念：所有事情都有原則，原則可以被總結，總結後可以被系統化，系統化後可以被複制。</li><li><a href="https://ourword.ai/tw/i/tao-te-ching/">道德經</a> — 道德經（春秋·前500年前後）——損。老子五千言，是中國哲學的減法源頭。與儒家「為學日益」相對，老子說「為道日損」——不斷減掉，直到無為，然後無不為。道德經在西方被翻譯次數僅次於聖經。</li><li><a href="https://ourword.ai/tw/i/guo-jia/">郭嘉</a> — 郭嘉（三國·170-207）——奇。曹操最倚重的謀士，被曹操稱為「吾之奇佐」。他27歲投奔曹操，此後11年，幾乎每一個關鍵決策背後都有他的身影。官渡之戰前的「十勝十敗論」、袁紹死後的「急攻不如緩圖」、北征烏桓時的「虛國遠征」……他的判斷每次都精準到令人驚歎。唯一的遺憾：38歲病逝，沒有活到赤壁之戰。曹操在赤壁大敗後</li><li><a href="https://ourword.ai/tw/i/guo-ziyi/">郭子儀</a> — 郭子儀（唐·697-781年）——功高不震主。唐代名將，平安史之亂、退吐蕃、撫回紇，兩次收復長安，史稱「再造王室」。但他真正的傳奇不在戰場：歷玄宗、肅宗、代宗、德宗四朝，功蓋天下而主不疑，位極人臣而眾不嫉，富貴壽考八十五歲善終，子孫滿堂。《舊唐書》的這句評語，兩千年裡幾乎找不到第二個人配得上。韓信、岳飛、年羹堯都倒在「功高震</li><li><a href="https://ourword.ai/tw/i/adler/">阿德勒</a> — 阿德勒（1870-1937年·奧地利）——課題分離。個體心理學的創立者，弗洛伊德早期的同事，後來因為根本分歧決裂。弗洛伊德說人被過去決定，阿德勒說人被目的牽引——同一段童年，有人拿它當傷疤，有人拿它當藉口，有人拿它當燃料，差別不在經歷本身，在這個人想用它達成什麼。他還給出了人際關係裡最鋒利的一把刀：分清這件事的後果最終由誰承擔，就</li><li><a href="https://ourword.ai/tw/i/hochschild/">阿莉·霍克希爾德</a> — 阿莉·霍克希爾德（1983年·加州大學伯克利）——看不見的勞動。社會學家，兩次給一件看不見的勞動起了名字。1983年《被管理的心》提出「情感勞動」：有些工作不只要求你做對，還要求你顯示出規定的情緒——空乘要熱情，催收員要冷硬；她的觀察是異化，那個笑不是「她的」笑，久了連自己真正的感受也認不出。1989年《第二班》提出：有工作的女性下班後還有一</li><li><a href="https://ourword.ai/tw/i/tao-yuanming/">陶淵明</a> — 陶淵明（365-427年·潯陽）——辭官八十天，窮一輩子。詩人。四十一歲當彭澤縣令，幹了八十多天，郡裡派督郵下來要他穿戴整齊去迎，他說「吾不能為五斗米折腰向鄉里小人」，當天解印走了，之後再沒出來做官。辭官後是真窮：四十四歲家裡失火房子燒光，有一年斷了糧出門去討，回來寫了一首《乞食》。收他是因為「人生轉彎」那一組蘇軾一人答了十個——庫裡缺</li><li><a href="https://ourword.ai/tw/i/marks/">霍華德·馬克斯</a> — 霍華德·馬克斯（美國·1946-）——第二層思維。橡樹資本創始人，管理規模逾兩千億美元，主戰場是不良債權和高收益債——一門只在別人恐慌時才有生意的行當。他從 1990 年開始寫投資備忘錄，巴菲特說「我第一個打開來讀的郵件就是霍華德的備忘錄」。他的獨特之處在於公開放棄了預測：不猜宏觀、不猜利率、不猜明年，只做一件事——判斷我們現在</li><li><a href="https://ourword.ai/tw/i/huo-qubing/">霍去病</a> — 霍去病（漢·前140-前117）——純粹。漢武帝外甥，17歲首戰率800騎兵深入敵後殲滅2028人，19歲兩次河西之戰殲滅4萬匈奴，22歲漠北之戰深入2000裡，封狼居胥山，飲馬瀚海。24歲病逝。他是歷史上最純粹的燃燒型天才——把全部能量給了一件事，然後熄滅。</li><li><a href="https://ourword.ai/tw/i/nonviolent-communication/">非暴力溝通</a> — 非暴力溝通（1999年·馬歇爾·盧森堡）——先說觀察。盧森堡是臨床心理學家，一生在種族衝突、離婚調解、監獄和戰區做溝通調停。他發現絕大多數爭吵的引爆點不是分歧本身，而是把評論說成了觀察——「你從來不管孩子」聽著像陳述事實，其實是判決。他給出一個四步結構：觀察、感受、需要、請求。這套東西看著簡單，難在第一步就幾乎沒人做得到。</li><li><a href="https://ourword.ai/tw/i/han-xin/">韓信</a> — 韓信（漢·前231-前196）——復盤。中國歷史上最天才的軍事家。胯下之辱，背水一戰，十面埋伏——每一個都是教科書。但他的故事有兩面：軍事天才的崛起，和政治白痴的毀滅。</li><li><a href="https://ourword.ai/tw/i/han-feizi/">韓非子</a> — 韓非子（戰國·前280-前233）——法術勢。法家集大成者，把商鞅的「法」、申不害的「術」、慎到的「勢」整合為一套完整的權力理論。他是中國歷史上最清醒的現實主義者——不談應該怎樣，只談實際上怎樣。他的理論直接為秦始皇統一中國提供了思想基礎。最大的諷刺：他知道所有權術，卻死於同學李斯的讒言。</li><li><a href="https://ourword.ai/tw/i/xiang-yu/">項羽</a> — 項羽（楚·前232-前202）——剛。中國歷史上最完美的失敗者。力拔山兮氣蓋世，以一己之力推翻了秦朝——這件事劉邦做不到。但他最終輸給了一個資質普通的沛縣亭長。他的失敗不是能力的失敗，是認知的失敗：他以為戰爭是強者對弱者的碾壓，卻不知道劉邦打的是另一種遊戲——用人的遊戲。</li><li><a href="https://ourword.ai/tw/i/marcus-aurelius/">馬可·奧勒留</a> — 馬可·奧勒留（羅馬·121-180）——剋制。羅馬皇帝，斯多葛哲學的最高實踐者。他是人類歷史上權力最大的人之一——羅馬帝國皇帝，管轄六千萬人，坐擁無限財富。但他每天寫的筆記，是提醒自己「不要被權力腐化」的私人日記，從未打算出版。這本筆記後來叫《沉思錄》，成為歷史上最多領導人隨身攜帶的書。一個手握一切的人，把全部精力用來管控自</li><li><a href="https://ourword.ai/tw/i/machiavelli/">馬基雅維利</a> — 馬基雅維利（意大利·1469-1527）——現實。文藝復興時期佛羅倫薩的外交官，《君主論》作者。他不是在教人變壞，他是第一個把政治從道德里剝離出來、單獨研究的人。「馬基雅維利主義」成了「不擇手段」的代名詞，但他的原意更復雜：他研究的是權力的真實運作規律，不管你喜不喜歡這些規律，它們都在運作。他的洞察和韓非子跨越兩千年高度吻合——</li><li><a href="https://ourword.ai/tw/i/musk/">馬斯克</a> — 馬斯克（當代·1971-）——第一性原理。PayPal聯合創始人，特斯拉、SpaceX、Neuralink、X聯合創始人或創始人。他的方法論只有一個：回到物理原點，重新推演一切。別人覺得不可能的事，他先問：物理定律允許嗎？如果允許，那「不可能」只是工程問題。</li><li><a href="https://ourword.ai/tw/i/guiguzi/">鬼谷子</a> — 鬼谷子（戰國·約前400—前320年）——捭闔之道。戰國縱橫家的祖師，隱於鬼谷，生平不可考，只留下一部《鬼谷子》。這是中國唯一一部系統講「如何說服一個具體的人」的典籍——不講道德該不該，只講話該怎麼開、怎麼合、怎麼試、怎麼鎖。歷代正統學者斥它為「小人之書」而不斷禁燬，它卻始終沒有失傳，因為凡是要靠說話推動別人做事的人，都繞不開它。</li><li><a href="https://ourword.ai/tw/i/bowen/">鮑恩</a> — 鮑恩（1978年·家庭系統理論）——分化。精神科醫生，提出家庭系統理論。他關注的核心是「自我分化」——一個人在與親近的人保持連接的同時，能不能保有獨立的思考和情緒。分化低的人被家庭的情緒場裹挾：別人焦慮他就焦慮，為了平息衝突不惜放棄立場。他的另一個重要概念是三角關係：兩個人之間張力過大時，會自動拉進第三個人來分散，而這會</li><li><a href="https://ourword.ai/tw/i/huang/">黃仁勳</a> — 黃仁勳（當代·1963-）——押注。英偉達創始人兼CEO，30年沒有被趕走。他在2006年做了一個當時看來「浪費資源」的決定：開發CUDA，讓GPU可以做通用計算。2023年，ChatGPT爆發，AI需要大量GPU算力，英偉達成為全球最重要的公司之一。他押注了一個能力，等了17年。</li></ul><p><a href="https://ourword.ai/tw/all/">全部條目</a> · <a href="https://ourword.ai/tw/llms.txt">llms.txt</a> · <a href="https://ourword.ai/tw/llms-full.txt">llms-full.txt</a> · <a href="https://ourword.ai/tw/sitemap.xml">sitemap.xml</a> · <a href="https://ourword.ai/tw/feed.xml">feed.xml</a></p><p><a href="https://ourword.ai/tw/">人類世界生存法則</a> · <a href="https://ourword.ai/podcast/tw/">原聲</a> · <a
