{c:"學習與成長",n:"費曼",e:"1918-1988年·美國",w:"不騙自己",y:1918,l:["愛因斯坦","蘇格拉底","查理·芒格","卡爾·波普爾"],d:"諾貝爾物理獎得主，參與過曼哈頓計劃，調查過挑戰者號事故。他留給非物理學家的東西比留給物理學家的更多——一套關於「怎麼知道自己是不是真懂」的判據。他的標準苛刻到近乎冒犯：如果你不能把一個概念講到大一新生聽懂，說明你自己沒懂。他也把這條用在整個科學界身上：科學的第一原則是不要騙自己，而你恰恰是最好騙的那個人。",story:"挑戰者號失事後，費曼在調查委員會上做了一件事：他要來一杯冰水，把 O 型密封圈的樣品夾住浸進去，幾秒後取出，當著攝像機捏了捏——橡膠失去了彈性。NASA 的報告用幾百頁論證發射決策的合理性，費曼用一杯冰水說明了低溫下密封圈會失效。他在附錄裡寫下那句著名的結論：對於一項成功的技術，現實必須優先於公關，因為自然不可欺騙。",f:[{n:"講不明白就是沒懂",d:"費曼的自檢法：把一個概念講給完全外行聽，卡住的地方就是你自己沒通的地方。這條之所以有效，是因為專業術語可以掩蓋理解的空洞——一旦不許用術語，空洞立刻現形。",eg:"給同事講你負責的模塊，每次都要繞回專業名詞才能繼續，那幾處就是你真正沒想清楚的地方。"},{n:"最容易騙的人是自己",d:"他說科學的第一原則是不要騙自己，而自己是最好騙的那個。因為動機在這一側：我們希望自己的方案對、希望投入沒白費。所以誠實不是道德要求，是方法要求——不主動找反例，就會自動只看見支持的證據。",eg:"復盤時先列「有哪些跡象說明我錯了」，再列支持的證據。順序反過來，後一欄會自動寫得更長。"},{n:"現實優先於公關",d:"挑戰者號的教訓不是技術問題，是組織寧願相信一份好看的論證。費曼的句子是給所有組織的：當報告和物理事實衝突，改的只能是報告。這條在任何有彙報關係的地方都成立。",eg:"數據不好看時，先問「要改的是結論還是措辭」。改措辭能過這一關，下一關還在。"},{n:"從頭搞懂一次，勝過記住十次",d:"費曼學習的方式是把結論丟開、自己重新推一遍，卡住就回去補。慢，但推完的東西不會忘，也能遷移到別的問題上。記住的答案只對原題有效，推出來的過程對整類問題有效。",eg:"與其背下公式的適用條件，不如自己推一次它是怎麼來的——推過之後條件是自明的。"}],q:["==第一原則是不要欺騙自己，而你自己是最容易被騙的人。==","==對於一項成功的技術，現實必須優先於公關，因為自然不可欺騙。==","==如果你不能用簡單的方式解釋它，說明你還沒有真正理解它。=="],apply:"想確認自己是不是真懂：講給外行聽，卡住的地方就是沒懂的地方。做判斷前先找反例，因為你最想騙的人是你自己。報告與事實衝突時，改的只能是報告。",contrast:[{n:"愛因斯坦",why:"兩位物理學家的方法差異：愛因斯坦擅長把問題重新表述，費曼擅長把答案重新推導"},{n:"蘇格拉底",why:"都靠追問逼出無知：蘇格拉底問別人，費曼問自己"}]},
{c:"家庭與關係",n:"卡爾·羅傑斯",e:"1902-1987年·美國",w:"先被接住",y:1902,l:["非暴力溝通","阿德勒","蘇格拉底","弗蘭克爾"],d:"人本主義心理學的創立者，第一個把心理治療過程全程錄音、拿出來做研究的人——在此之前治療室裡發生什麼全憑治療師轉述。他的核心主張與當時主流相反：治療師不該是解讀者和指導者，而應提供三個條件——真誠、無條件積極關注、共情性理解——人在這三樣齊備的環境裡會自己往好的方向長。",story:"羅傑斯做了一件在當時近乎冒犯的事：他把治療全程錄下來，逐字整理，公開發表。同行認為這破壞了治療的神秘性，他認為不公開就無從檢驗。這批錄音後來成了心理治療實證研究的起點。他從中得出一個反直覺的結論：來訪者的改變程度，與治療師用了什麼流派幾乎無關，與治療師是否真誠、是否不帶條件地接納、是否真的聽懂了，高度相關。方法不如態度重要。",f:[{n:"無條件不是無原則",d:"無條件積極關注指的是「不因為你說了什麼而收回接納」，不是「你做什麼都對」。區別在於：接納的是人，評價的仍是行為。這一條做到了，對方才敢說真話——因為說真話不會被撤回關係。",eg:"孩子承認闖了禍，先接住「你願意說出來」，再談這件事怎麼處理。順序反了，下次他就不說了。"},{n:"共情是複述到對方點頭",d:"羅傑斯的共情不是「我理解你的感受」這句話，是把對方的意思用自己的話說回去，說到對方確認為止。它的作用不只是讓對方感到被懂——很多時候對方是在聽你複述的過程中，才第一次聽清自己在說什麼。",eg:"朋友傾訴時別急著給建議，先說「你的意思是不是……」。他糾正你兩次之後，事情往往自己清楚了。"},{n:"真誠優先於技術",d:"三條件裡他最看重真誠——治療師不能演。裝出來的接納會被感知到，而且比直接的不接納更傷，因為它同時傳遞了「你不值得我說真話」。這條對所有關係成立：技巧能提高效率，裝出來的技巧會摧毀信任。",eg:"用共情句式卻心裡不耐煩，對方一定聽得出來。這時更誠實的做法是說「我現在狀態不好，晚點聊」。"},{n:"人不需要被推，需要被鬆開",d:"羅傑斯的基本信念是人有自我實現的傾向，卡住通常不是因為缺動力，是因為環境裡有條件——「你要這樣才值得被愛」。把條件撤掉，方向自己會出現。這決定了幫助的姿態是撤除障礙，不是設定目標。",eg:"下屬沒狀態時，先問「有什麼在攔著你」，而不是「你的目標是什麼」。多數時候攔著的是怕做錯被否。"}],q:["==當我接納自己本來的樣子時，我才能改變。==","==一個人如果被真誠地傾聽和理解，他就能用新的眼光看待自己。==","==好奇怪的悖論：當我接受自己原本的樣子，我就能改變了。=="],apply:"想讓一個人說真話：先讓他確認說了不會被撤回關係。想讓他想清楚：把他的話複述回去，說到他點頭。做不到真誠時，寧可說自己狀態不好，也別演。",contrast:[{n:"非暴力溝通",why:"盧森堡把羅傑斯的臨床態度拆成了普通人能操作的四步"},{n:"蘇格拉底",why:"兩種讓人自己找到答案的方式：蘇格拉底靠追問施壓，羅傑斯靠接納鬆綁"}]},
{c:"家庭與關係",n:"依戀理論",e:"1950-1970年代·鮑爾比與艾恩斯沃斯",w:"早期模板",y:1969,l:["阿德勒","卡爾·羅傑斯","約翰·戈特曼","弗蘭克爾"],d:"鮑爾比研究戰後孤兒院的孩子，提出人對親近關係的需求是本能而非依賴；他的合作者艾恩斯沃斯設計了「陌生情境」實驗，把一歲嬰兒與照料者短暫分離再重聚，從重聚那一刻的反應裡，識別出幾種穩定的依戀模式。這套模式會成為一個人此後處理親密關係的默認模板——不是決定論，但確實是出廠設置。",story:"艾恩斯沃斯的實驗設計精巧在於：真正的信息不在分離時，而在重聚時。安全型的孩子會哭，但母親回來後很快被安撫，然後繼續去玩；迴避型的孩子看起來不在意母親離開，也不去迎接——但心率監測顯示他們的壓力水平和哭的孩子一樣高，只是學會了不表達；矛盾型的孩子則又要抱又推開，久久平復不了。她由此提出「安全基地」：人只有在確信身後有個能回去的地方時，才敢往外探索。",f:[{n:"看重聚，不看分離",d:"實驗最反直覺的一點：不哭的孩子不等於不焦慮。迴避型的生理指標和哭鬧的孩子一樣高，他們只是學會了不表達——因為表達過而沒被回應。所以判斷一個人在關係裡的狀態，看他遇到問題時求不求助，比看他表現得慌不慌準。",eg:"團隊裡從不提困難的人不一定沒困難，可能是提過沒用。要看的是他上一次求助的下場。"},{n:"安全基地：有退路才敢往前",d:"鮑爾比的核心發現是探索行為依賴於安全感——孩子只有確信母親還在，才會跑遠去玩。成年後同理：知道搞砸了不會失去關係的人，敢冒更大的險。所謂支持，不是替他做事，是讓他知道退回來這裡還在。",eg:"想讓人敢做決定，先明確「做錯了我們一起收拾」。這句話的作用比任何激勵都大。"},{n:"是模板，不是判決",d:"依戀模式穩定但可變——後來的穩定關係、治療、甚至一段長期友誼都能改寫它。把它當解釋很有用（原來我一緊張就想推開人），當藉口就有害（我就是迴避型沒辦法）。它解釋起點，不決定終點。",eg:"意識到自己衝突時習慣冷戰，是進步；用「我依戀類型如此」拒絕改變，是把工具用成了盾牌。"},{n:"兩個人的模式會互相咬合",d:"焦慮型追、迴避型退，是最常見也最痛苦的組合：一方越靠近另一方越退，退又讓前者更焦慮。看懂這個循環的價值在於，它把「你有問題」變成了「我們卡在一個循環裡」——後者才有解。",eg:"吵架時一方追問一方沉默，這不是誰對誰錯，是兩種應對方式互相觸發。先命名這個循環，才談得下去。"}],q:["==只有在確信身後有安全基地時，人才敢向外探索。==","==不表達的孩子並非不焦慮，他們只是學會了不表達。==","==早期關係形成的內部工作模型，會成為此後所有親密關係的模板。=="],apply:"判斷一個人在關係裡安不安全，看他遇到困難求不求助，不看他表現得慌不慌。想讓人敢冒險，先給他一個退回來還在的地方。看懂追與退的循環，比追究誰的錯有用。",contrast:[{n:"阿德勒",why:"兩種解釋人際困境的路徑：阿德勒問「你想用它達成什麼」，依戀理論問「你的模板是怎麼形成的」"},{n:"約翰·戈特曼",why:"依戀理論解釋模式從哪來，戈特曼測量模式在當下如何運作"}]},
{c:"身心與生活",n:"原子習慣",e:"2018年·詹姆斯·克利爾",w:"改系統不改目標",y:2018,l:["富蘭克林","李小龍","艾利克森","曾國藩"],d:"克利爾高中時被棒球棒擊中面部重傷，康復過程讓他對「微小改進的累積」有了切身認識。這本書的主張是：人們高估了目標的作用，低估了系統的作用——因為贏家和輸家的目標往往完全相同，區別在系統。他給出的操作層面比多數習慣書更細：從行為的四個環節（提示、渴求、反應、獎賞）分別下手，而不是靠意志力硬扛。",story:"英國自行車隊一百年沒贏過環法。新教練布雷斯福德的做法是把所有環節拆開，每一處改進百分之一：座椅調整、車手用的枕頭帶上路、洗手方式改成外科醫生的標準以減少感冒。單看每一項都微不足道，五年內這支隊伍拿下了環法冠軍和多枚奧運金牌。克利爾用這個例子說明覆利在行為上同樣成立：每天進步百分之一，一年後是三十七倍。",f:[{n:"目標一樣，系統不一樣",d:"參賽的每支隊都想贏冠軍，目標不區分勝負。真正決定結果的是日常運轉的方式。所以設定目標的邊際收益很低，改造系統的邊際收益很高——這也解釋了為什麼「今年一定要」很少奏效。",eg:"「今年讀十二本書」和「把手機充電器放到客廳、床頭放一本書」，後者才改變了結果。"},{n:"從身份下手，不從結果下手",d:"克利爾的核心轉換：不說「我要戒菸」，說「我不是抽菸的人」。前者是和慾望對抗，後者是讓行為符合自我認知。每一次小行動都是給某個身份投一票，票數夠了，行為就不需要靠意志力維持。",eg:"想開始運動，先做「我是每天動一下的人」這個身份——哪怕只做五分鐘，重要的是那一票。"},{n:"讓好行為省力，讓壞行為費力",d:"四環節裡最容易操作的是環境。把想做的事的啟動成本降到最低（運動服前一晚放床邊），把不想做的事的啟動成本抬高（手機放另一個房間）。這比培養毅力可靠得多，因為它不消耗意志力。",eg:"想少刷手機，刪掉 app 比「控制自己」有效——重裝要花兩分鐘，這兩分鐘就夠了。"},{n:"別斷第二次",d:"他給的一條實用規則：偶爾中斷沒關係，絕不連續中斷兩次。一次是意外，兩次就開始變成新常態。這條把「破戒之後乾脆放棄」的常見崩潰點堵住了。",eg:"今天沒跑步，明天必須跑，哪怕只跑十分鐘。保住的不是里程，是這件事還在進行中的狀態。"}],q:["==你不會升到目標的高度，你會落到系統的水平。==","==每天進步百分之一，一年後你會強大三十七倍。==","==每一個行動都是對你想成為的那類人投的一票。=="],apply:"想改變結果，先改系統不改目標。從身份說起：我是什麼樣的人，而不是我要達成什麼。把想做的事變省力、不想做的變費力。可以斷一次，絕不連斷兩次。",contrast:[{n:"富蘭克林",why:"兩套自我改造法：富蘭克林一週只練一條美德，克利爾把行為拆成四個環節分別下手"},{n:"曾國藩",why:"都靠日常小動作累積：曾國藩用日課自省，克利爾用環境設計——一個靠自律，一個靠省掉自律"}]},
{c:"學習與成長",n:"卡爾·波普爾",e:"1902-1994年·奧地利",w:"能被證偽",y:1902,l:["費曼","愛因斯坦","蘇格拉底","思考，快與慢"],d:"科學哲學家。他要解決的問題是：占星術和物理學都能解釋現象，憑什麼說後者是科學？他的答案改變了整個科學觀——區別不在能不能解釋，而在能不能被推翻。一個理論如果任何觀察都不能與之矛盾，那它不是強大，是空洞。這條判據同樣適用於日常判斷：一個說什麼都對的說法，等於什麼都沒說。",story:"波普爾年輕時同時接觸到愛因斯坦和當時流行的兩種理論。後兩者的信徒總能用理論解釋任何案例——他們把這當作理論強大的證據。而愛因斯坦的廣義相對論做了一個危險的預言：星光經過太陽會偏折特定角度，如果觀測不符，理論就完了。1919 年日食觀測驗證了它。波普爾由此明白：區別不在解釋力，在於願不願意事先說出「什麼情況下我就錯了」。",f:[{n:"能解釋一切等於沒有解釋",d:"一個理論如果無論出現什麼結果都能自圓其說，它就不含信息。判斷的辦法是問：什麼樣的觀察會讓你放棄它？答不上來，說明這個說法不能被檢驗，也就不能被信任。",eg:"「市場情緒推動了這次上漲」——那下跌時呢？也是市場情緒。這句話解釋了一切，因此什麼也沒解釋。"},{n:"事先說出證偽條件",d:"波普爾的標準動作是在驗證之前公開「什麼會推翻我」。這一步的價值在於它防止事後調整：人有極強的能力把任何結果讀成支持自己的證據，唯一的解藥是把判據提前釘死。",eg:"上線新功能前先寫「如果兩週後這個指標沒動，就承認假設錯了」。寫在前面，才不會事後找補。"},{n:"證偽不等於放棄",d:"常見誤讀是「被證偽就該扔掉」。波普爾的意思是理論要經得起嘗試推翻——大多數好理論是在一次次被逼到牆角又挺住之後才變強的。關鍵是你有沒有真的去試著推翻它，而不是有沒有被推翻。",eg:"對自己的核心判斷，定期主動找最強的反面證據。找不到，這個判斷才真的可靠。"},{n:"從確認轉向反駁",d:"人的默認模式是找支持自己的例子，而支持的例子再多也不能證明結論。真正提供信息的是反例——一個就夠。所以有效的求證方式是主動去找那個可能存在的反例，而不是收集第一百個正面案例。",eg:"驗證「我們的客戶都喜歡這個功能」，別去問已經在用的人，去問三個流失的。"}],q:["==一個理論如果不能被任何可想像的事件所反駁，那它就是非科學的。==","==不可證偽不是理論的優點，而是它的缺陷。==","==我們不能證明一個理論為真，只能暫時地讓它經受住反駁。=="],apply:"聽到一個說法，先問：什麼情況下它會是錯的？答不出來就別信。做判斷前把證偽條件寫下來，防止事後找補。想驗證結論，去找反例而不是再找一個支持的例子。",contrast:[{n:"費曼",why:"同一件事的兩個說法：波普爾給出邏輯判據，費曼給出心理警告——你最想騙的人是自己"},{n:"思考，快與慢",why:"波普爾說該怎麼做，卡尼曼說人實際上會怎麼偏離——一個是規範，一個是診斷"}]},
{c:"學習與成長",n:"艾利克森",e:"1993年·刻意練習研究",w:"練法比時長重要",y:1993,l:["李小龍","費曼","原子習慣","宮本武藏"],d:"心理學家，專門研究各領域頂尖高手是怎麼練出來的。他最廣為人知的研究被流行文化簡化成了「一萬小時定律」，而這恰恰是他反覆澄清過的誤讀——決定水平的不是時長，是練法。重複做已經會的事，做十年也不會變強；只有持續在能力邊緣、帶著明確目標和即時反饋的練習，才產生進步。他把這種練法叫「刻意練習」。",story:"艾利克森研究柏林音樂學院的小提琴學生，把他們按水平分組，發現頂尖組累計練習時間確實更長。但更關鍵的差別在練習的內容：普通學生練習時反覆演奏已經熟練的曲目，享受流暢感；頂尖學生把時間花在自己彈不好的那幾個小節上，一遍遍卡在難處。他後來反覆強調，時長只是相關，真正的因果在於是否持續處理自己做不到的部分。",f:[{n:"練已經會的等於休息",d:"重複熟練的動作讓人愉快，也讓人誤以為在進步。真正產生進步的是停留在「剛好做不到」的區域——那裡不舒服，效率看起來低，但只有那裡在改變能力。舒適的練習是娛樂，不是訓練。",eg:"練琴一小時全在彈熟悉的曲子，等於聽了一小時自己的演奏。真正該練的是那三個總錯的小節。"},{n:"必須有即時反饋",d:"沒有反饋的重複不產生學習——你不知道哪裡錯了，就只是在鞏固錯誤。這解釋了為什麼很多人開車三十年技術並無長進：全程沒人告訴他哪一次轉向不對。所以練習的設計裡，反饋的優先級高於時長。",eg:"寫作想進步，光寫不夠，要有人具體指出哪一段讀不下去——或者隔一週自己回看，製造反饋。"},{n:"高手靠的是心理表徵，不是記憶",d:"艾利克森發現專家的優勢在於對該領域形成了精細的內部模型——棋手看到的不是棋子而是局面，醫生看到的不是症狀而是模式。這套模型只能通過在真實問題上反覆試錯建立，不能通過看和背獲得。",eg:"看一百場比賽不如自己下十局並復盤。前者積累印象，後者才在建模型。"},{n:"一萬小時是被誤讀的結論",d:"艾利克森本人多次澄清：不存在一個通用的時數門檻，不同領域差異巨大，而且不帶反饋的低質量練習再多也無效。把它當成「熬夠時間就行」的許可，正好錯過了他研究的全部要點。",eg:"入行十年不等於十年經驗，可能是一年經驗重複了十次——區別在這十年裡有沒有持續處理做不到的事。"}],q:["==決定水平的不是練習時間的長短，而是練習的方式。==","==有目的的練習必須發生在舒適區之外。==","==沒有反饋的練習，只是在鞏固已有的錯誤。=="],apply:"檢查自己的練習：我在練已經會的，還是剛好做不到的？有沒有人或機制告訴我哪裡錯了？如果沒有反饋，先去造一個反饋，再談時長。",contrast:[{n:"李小龍",why:"都反對堆數量：李小龍練一萬次同一腳是把一招練到極致，艾利克森說清了那一萬次必須帶反饋才有效"},{n:"宮本武藏",why:"兩種精進觀：武藏強調不可有偏愛的兵器，艾利克森強調必須待在做不到的邊緣"}]},
{c:"家庭與關係",n:"蒙臺梭利",e:"1907年·羅馬兒童之家",w:"環境替代管教",y:1907,l:["卡爾·羅傑斯","依戀理論","阿德勒","荀子"],d:"意大利第一批女醫生之一，從研究智力障礙兒童起步，後來把方法用在正常兒童身上，創辦了羅馬「兒童之家」。她的核心發現是：兒童不需要被塑造，需要一個被準備好的環境——把工具做成兒童尺寸、把選擇權交給兒童、把成人從指揮者退成觀察者，此前被認為無法專注的孩子會自發進入長時間的專注狀態。",story:"蒙臺梭利在貧民區的兒童之家做了一件當時看來荒謬的事：她把桌椅換成兒童尺寸、讓孩子自己選擇做什麼、成人只在被需要時介入。結果被視為不可管教的三到六歲孩子開始自發地重複某項活動幾十分鐘，且完成後主動收拾。她把這種狀態稱為「常態化」，並得出那句成為整套方法基石的話：幫助我，讓我自己做。",f:[{n:"先改環境，再談行為",d:"孩子夠不到的水杯、只能由大人操作的工具，本身就在製造依賴和挫敗。蒙臺梭利的做法是把環境改到孩子能獨立完成，行為問題往往隨之消失。這條對成人同樣成立——很多所謂自律問題其實是環境問題。",eg:"孩子總打翻水杯，換一個他握得住的小壺，比說一百次「小心點」有用。"},{n:"幫助我，讓我自己做",d:"這句話劃出了幫助的邊界：目標是讓對方能獨立完成，不是讓事情快點完成。成人替孩子做完，效率高但剝奪了那次學習。所以正確的介入是把難度降到剛好夠得著，而不是代勞。",eg:"孩子繫鞋帶慢得讓人抓狂，你係上只省了兩分鐘，代價是他明天還不會。"},{n:"專注是長出來的，不是要求出來的",d:"她觀察到孩子在自選的活動上能專注很久，而在被指定的任務上很快分心。所以培養專注的路徑是提供有吸引力的選擇並且不打斷——最常見的破壞行為，恰恰是成人出於關心的隨時打擾。",eg:"孩子正在投入地擺積木，別去表揚也別去糾正。表揚會中斷他，也會把動力從事情轉到你的反應上。"},{n:"敏感期：時機不對事倍功半",d:"她提出兒童在不同階段對特定能力有天然的高吸收期——秩序、語言、細節、動作。踩在敏感期上，學習幾乎不費力；錯過了再補，要花幾倍力氣還未必自然。這提示教育的關鍵是識別時機而不是加大力度。",eg:"兩歲孩子對秩序極其敏感，此時建立收拾的習慣很容易；等到七歲再立規矩，難度完全不同。"}],q:["==幫助我，讓我自己做。==","==兒童的工作不是被教出來的，而是在準備好的環境中自然發生的。==","==教育不是老師講了什麼，而是兒童自己做了什麼。=="],apply:"孩子做不到時，先看是不是環境不匹配，再談要求。幫助的目標是讓他能獨立完成，不是讓事情快點結束。他專注時別打斷——包括別表揚。",contrast:[{n:"卡爾·羅傑斯",why:"同一個信念的兩個領域：人有自我發展的傾向，需要的是撤除障礙而非推動"},{n:"荀子",why:"兩種人性起點：荀子主張用制度矯正，蒙臺梭利主張用環境釋放"}]},
{c:"身心與生活",n:"約翰·瑞迪",e:"2008年·哈佛醫學院",w:"先動再想",y:2008,l:["原子習慣","富蘭克林","塞涅卡","弗蘭克爾"],d:"哈佛醫學院精神科教授。他把運動重新定義了一遍：運動的首要收益不是身材，是大腦。運動會促使大腦分泌一類支持神經元生長與連接的蛋白，他稱之為「大腦的肥料」，直接影響學習效率、情緒調節和抗壓能力。他的主張是，把運動當成健身房裡的事，等於把最便宜的認知與情緒藥物放著不用。",story:"芝加哥郊區的內珀維爾中學做了一個實驗：把體育課挪到第一節，並且不比誰跑得快，只要求學生保持在自己的高心率區間。結果是這批學生在國際數學與科學測評中的成績遠超同齡群體。瑞迪用這個案例說明運動與認知的關係不是玄學：運動後的一段時間裡，大腦處於更容易建立新連接的狀態，把最難的學習任務放在那個窗口裡最划算。",f:[{n:"運動是給大腦用的，不只給身體",d:"瑞迪的重構很關鍵：如果目標是身材，動力靠意志；如果知道它直接改善注意力、情緒和抗壓，動機就變成了當天可感的收益。而後者是真的——效果在運動後幾小時內就能體感到。",eg:"下午注意力散了，與其硬撐或喝咖啡，二十分鐘快走的恢復效果通常更好且不欠債。"},{n:"焦慮時動比想有用",d:"焦慮的生理成分很重，而運動直接作用於那套系統——它消耗掉待命的應激激素，並給大腦一個「已經跑掉了」的信號。這解釋了為什麼想不通的事，走一圈之後常常沒那麼可怕。",eg:"心裡堵得慌又反覆琢磨，先出門走二十分鐘。回來再想同一件事，分量會不同。"},{n:"強度比時長重要",d:"內珀維爾的做法是讓每個人保持在自己的高心率區間，而不是比誰跑得快。這一點對普通人是好消息：不需要長時間訓練，需要的是心率真的上去過——十幾分鐘的有效強度勝過一小時的散步式消耗。",eg:"沒時間時做十五分鐘能讓你喘起來的運動，效果好過一小時慢悠悠的健身房打卡。"},{n:"放在需要腦力的事之前",d:"既然運動後的窗口期大腦更容易建立新連接，安排上就該把最難的學習或思考放在運動之後，而不是運動之前。內珀維爾把體育課挪到第一節正是這個邏輯。",eg:"要啃一份難讀的材料，先動二十分鐘再坐下來，比直接硬啃省時間。"}],q:["==運動不只是塑造身體，它塑造大腦。==","==身體活動帶來的神經生長因子，是大腦的肥料。==","==把最難的學習任務安排在運動之後。=="],apply:"注意力散了或焦慮上來，先動二十分鐘再回來處理。強度比時長重要——要讓心率真的上去。把最難的腦力活安排在運動之後的窗口裡。",contrast:[{n:"原子習慣",why:"一個說明為什麼值得動，一個說明怎麼讓自己真的動起來"},{n:"塞涅卡",why:"兩種處理焦慮的路徑：塞涅卡從判斷入手拆解，瑞迪從生理入手消耗"}]},
{c:"身心與生活",n:"卡爾·紐波特",e:"2016年·喬治城大學",w:"專注是稀缺品",y:2016,l:["原子習慣","艾利克森","約翰·瑞迪","富蘭克林"],d:"計算機科學教授，同時研究知識工作者的生產方式。他提出一組對立概念：深度工作是在無干擾狀態下的專注思考，能創造新價值、難以複製；浮淺工作是瑣碎的事務性動作，容易複製、不產生新能力。他的論斷是，隨著協作工具讓人隨時可被打斷，深度工作正在變得稀有，而恰恰因為稀有，它成了少數還能拉開差距的能力。",story:"紐波特舉了一個反例來說明代價：一位管理者要求團隊隨時在線響應，團隊看起來高效——消息秒回、會議不斷——但一年下來沒有產出任何需要長時間思考才能做出的東西。紐波特的觀察是，注意力被切碎之後不會自動復原：每一次切換都留下「注意力殘留」，人以為自己回到了原來的任務上，實際上有一部分還掛在上一件事上。所以真正的成本不是被打斷的那五分鐘，是之後半小時的低效。",f:[{n:"注意力殘留：代價不在被打斷的那幾分鐘",d:"切換任務後，一部分注意力仍留在上一件事上，需要時間才能完全轉移。這意味著「就看一眼消息」的真實成本遠高於那一眼，而人幾乎感知不到這部分損耗——因為回到任務時主觀上覺得自己在專注。",eg:"寫方案時回了一條消息，之後二十分鐘的思考質量都受影響，而你並不會察覺。"},{n:"深度工作要靠日程保護，不能靠意志",d:"指望在隨時可被打斷的環境裡靠自制力保持專注是不現實的。有效的做法是把深度時段寫進日程並對外聲明——像開會一樣佔住它，而不是等有空再說。空檔永遠不會自己出現。",eg:"每天上午留出兩小時標為不可約，比「今天找時間想一下」可靠得多。"},{n:"浮淺工作要限量，不是清零",d:"郵件、會議、協調這些事必要但不產生新能力。紐波特的主張不是取消，是給它設上限並集中處理——把它們壓進固定時段，剩下的時間才可能連成塊。",eg:"把郵件集中在兩個固定時點處理，而不是全天隨到隨回。總量沒變，但整塊時間保住了。"},{n:"無聊是能力的一部分",d:"如果每一個空隙都用刷手機填滿，大腦會習慣於持續的新鮮刺激，此後面對需要長時間專注的任務會格外痛苦。所以訓練專注的方式之一，是允許自己無聊——排隊時不掏手機。",eg:"等電梯的兩分鐘不看手機。這類小場合決定了你能不能忍受一小時不被打斷的思考。"}],q:["==深度工作正在變得稀有，而恰恰因為稀有，它變得珍貴。==","==注意力殘留會讓你在切換任務後很久仍無法全速運轉。==","==如果每個空隙都用刺激填滿，你就失去了專注的能力。=="],apply:"想做需要長時間思考的事，先在日程上佔住整塊時間並對外聲明。把瑣事集中到固定時段。不要用「就看一眼」評估打斷的代價——代價在之後半小時。",contrast:[{n:"原子習慣",why:"都靠設計而非意志：克利爾改環境降低啟動成本，紐波特改日程保護整塊時間"},{n:"艾利克森",why:"刻意練習需要高強度專注，紐波特說清了這種專注在今天為什麼難以獲得"}]}
,
{c:"身心與生活",n:"契克森米哈賴",e:"1990年·芝加哥大學",w:"心流",y:1990,l:["艾利克森","卡爾·紐波特","原子習慣","弗蘭克爾"],d:"心理學家，用「經驗取樣法」研究人什麼時候最投入——給幾千人配呼叫器，隨機時刻響起就記錄當下在做什麼、感覺如何。他發現最好的體驗不是放鬆，而是一種全神貫注到忘記時間的狀態，他稱之為心流。觸發條件很具體：任務難度與你的能力剛好匹配，目標清晰，反饋即時。三者缺一，人要麼焦慮要麼無聊。",story:"他的數據推翻了一個常識：人們以為休閒最快樂，實際記錄顯示心流在工作中出現的頻率遠高於閒暇。看電視時人普遍感到輕度低落，而在挑戰適中的工作裡最常報告「非常投入、非常滿足」。矛盾在於，被問「想做什麼」時人還是選擇休息。他的解釋是，心流有進入成本——需要集中注意力、需要面對可能失敗，而放鬆沒有門檻。人於是持續選擇低迴報但零門檻的活動。",f:[{n:"難度與能力必須匹配",d:"太難產生焦慮，太易產生無聊，只有卡在能力邊緣略偏上的地方才進入心流。這解釋了為什麼同一件事對不同人有完全不同的體驗，也解釋了為什麼熟練之後必須加難度，否則曾經的心流活動會變成乏味。",eg:"打球總贏或總輸都不好玩，跟水平接近的人打才停不下來。工作同理，長期做已經會的事會先舒服後麻木。"},{n:"目標清晰、反饋即時",d:"心流要求你隨時知道自己做得怎麼樣。攀巖、下棋、演奏天然滿足；而寫方案、做管理這類工作的反饋週期以周計，所以很難進入。可行的做法是人為切出帶反饋的小段落。",eg:"把「寫完這份報告」拆成「先把這一節的論證跑通，跑通了自己能判斷」，反饋週期從一週縮到一小時。"},{n:"最好的體驗發生在工作裡，不在休息裡",d:"這是他數據裡最反直覺的一條。休閒的門檻低，但心流需要投入，所以人常常在有能力獲得高質量體驗的地方選擇了低質量的放鬆。認識到這點，對如何安排一天有直接影響。",eg:"下班後累到只想刷手機，刷完往往更空。同樣的兩小時用來做一件有難度的事，結束時反而是恢復的。"},{n:"心流不等於快樂",d:"進入心流的當下人往往感覺不到快樂——注意力全在事情上，沒有餘裕評價自己。滿足感是事後才湧上來的。所以用「此刻開不開心」來選活動，幾乎必然選錯。",eg:"專注寫完一段東西的過程並不愉快，寫完那一刻的踏實才是回報。按當下感受決策，你永遠不會開始。"}],q:["==最好的時刻，通常發生在一個人為了完成某件困難而有價值的事，自願把身心能力發揮到極限的時候。==","==挑戰與技能相匹配時，心流出現；前者過高是焦慮，過低是無聊。==","==人們以為休閒最快樂，但記錄顯示，心流更多發生在工作中。=="],apply:"想進入狀態，先檢查三件事：難度是不是剛好比我現在的能力高一點？目標夠不夠具體？我能不能隨時知道自己做得如何？累到只想癱著的時候，注意「當下想做什麼」幾乎必然指錯方向。",contrast:[{n:"艾利克森",why:"同樣要求待在能力邊緣：艾利克森講怎麼練才長本事，契克森米哈賴講那個位置為什麼讓人上癮"},{n:"卡爾·紐波特",why:"一個說明專注狀態的內部條件，一個說明外部條件——日程和環境怎麼保護它"}]},
{c:"身心與生活",n:"薩波爾斯基",e:"1994年·斯坦福大學",w:"壓力是錯配",y:1994,l:["約翰·瑞迪","塞涅卡","愛比克泰德","契克森米哈賴"],d:"神經內分泌學家，在東非觀察野生狒狒群三十年，同時研究人類的壓力生理。他那本書的標題就是全部論點：斑馬不得胃潰瘍，因為它的壓力反應只在獅子撲來的幾分鐘裡全開，跑掉之後立刻關閉。人的這套系統一模一樣，卻被用來應付房貸、上司和一封沒回的郵件——為幾十秒逃命設計的機制，被開成了幾十年的常態。",story:"他在狒狒群裡發現了一個清晰的規律：地位低的個體，壓力激素長期偏高，健康指標全面更差。但更關鍵的不是地位本身——是可預測性和控制感。同樣處在下位，能預知何時被欺負、有社交同盟的個體，生理指標明顯更好。他由此指出人類壓力研究裡最實用的一條：讓人生病的往往不是壓力的強度，是持續時間加上無法預測與無從掌控。",f:[{n:"急性反應有用，慢性開啟有害",d:"心跳加快、血糖釋放、免疫暫緩——這套反應對逃命極其有效，代價是暫停了修復、消化和長期建設。短時無妨，長期開啟就把身體的維護預算持續挪走。所以問題從來不是有沒有壓力，是它關不關得掉。",eg:"一週的衝刺沒事，連續兩年的「隨時待命」才是問題——後者身體一直沒進過修復模式。"},{n:"不可預測比強度更傷",d:"實驗反覆顯示：知道電擊何時到來的動物，生理損傷遠小於隨機受擊的。人也一樣——明確的壞消息比懸著的不確定更好受。這條對管理和為人父母都成立。",eg:"重組期遲遲不公布方案，團隊的損耗常常超過方案本身。給一個確定的時間點，比繼續保密更省人。"},{n:"控制感是緩衝器",d:"同樣的工作量，能自己決定順序和節奏的人壓力反應明顯更低。所以增加自主權是成本極低的干預——不必減少任務，只需把「怎麼做、先做哪個」交回去。",eg:"把「今天必須完成這五項」換成「這五項今天內完成，順序你定」，負荷沒變，損耗差別很大。"},{n:"社會支持不是軟話題",d:"狒狒裡有同盟的個體、人群裡有穩定關係的人，同等壓力下的生理指標都更好。這不是心理安慰，是可測量的生理差異。孤立本身就是一項健康風險。",eg:"高壓項目裡保住一兩個能說真話的同事，比多睡一小時更能扛。"}],q:["==斑馬不得胃潰瘍，因為它的壓力反應只開幾分鐘。==","==讓人生病的不是壓力本身，而是壓力反應長期開著關不掉。==","==同樣的壓力，可預測和有控制感時，損傷小得多。=="],apply:"長期緊繃時，別只想著減少任務量：先看能不能增加可預測性（明確的時間點、明確的壞消息）和控制感（順序自己定）。這兩項的改善成本低，效果比硬扛大。",contrast:[{n:"塞涅卡",why:"兩條路處理同一件事：塞涅卡從判斷入手拆解憤怒與恐懼，薩波爾斯基說明它們在身體裡是怎麼運作的"},{n:"約翰·瑞迪",why:"瑞迪講怎麼用運動消耗掉待命的應激激素，薩波爾斯基講那些激素為什麼會一直待命"}]},
{c:"身心與生活",n:"BJ·福格",e:"2019年·斯坦福行為設計實驗室",w:"小到不會失敗",y:2019,l:["原子習慣","契克森米哈賴","卡爾·紐波特","富蘭克林"],d:"斯坦福行為設計實驗室創始人，研究行為如何被設計出來。他給出一個公式：行為發生需要動機、能力、提示三者同時到位。多數人失敗在只調動機——靠決心和自我激勵——而動機天然起伏，靠它維持的習慣必然崩。他的主張相反：把行為縮到小得不需要動機，然後掛在一個已有的動作後面。",story:"福格自己的例子被反覆引用：他想養成做俯臥撐的習慣，於是規定每次上完廁所做兩個。兩個少到任何狀態下都做得到，所以從不失敗；而做完兩個之後經常會多做幾個。幾個月後他每天做幾十個，但從沒依賴過意志力。關鍵不在兩個俯臥撐的效果，在於「上廁所」是每天必然發生且位置固定的錨點，以及做完之後立刻給自己一個慶祝——他堅持這個慶祝動作是讓大腦記住這件事的關鍵一步。",f:[{n:"動機不可靠，所以別依賴它",d:"動機像潮水，起落不由你。用高動機時定的計劃去要求低動機的日子，註定斷。正確的做法是把行為的難度降到最低動機時也做得到，剩下的交給錨點。",eg:"下決心時報名年卡、買齊裝備，都是在高動機狀態下透支——真正決定成敗的是沒勁那天做不做得到。"},{n:"錨在已有行為後面",d:"新習慣最難的是想不起來。福格的解法是把它掛在一個每天必然發生的動作之後：「刷完牙之後，我就……」。錨點提供了提示，你不必再靠記憶或提醒。",eg:"「倒完咖啡之後，我就寫三句話。」比「每天早上寫作」可靠，因為前者有具體的觸發時刻。"},{n:"小到不可能失敗",d:"兩個俯臥撐、讀一頁、寫三句——小到在最糟的一天也能完成。目的不是這點量的收益，是保住「這件事還在進行」的連續性，以及跨過啟動那道坎。開始之後往往會自然做多。",eg:"把「跑三公里」改成「換上跑鞋出門」。換完鞋還不去的人很少，而目標是三公里的人經常連鞋都不換。"},{n:"做完立刻慶祝",d:"這是福格與多數習慣理論的差別：他認為大腦靠情緒而非重複次數來固化行為。所以完成後要立刻給自己一個明確的正向信號——握拳、說一句「不錯」——聽著傻，但它承擔了讓行為被記住的功能。",eg:"做完那兩個俯臥撐，認真對自己說一句「做到了」。省掉這一步，習慣的固化會慢很多。"}],q:["==行為的發生需要動機、能力和提示同時到位。==","==把行為縮小到你在最沒狀態的一天也能完成。==","==讓大腦記住一個習慣的，是完成時的情緒，不是重複的次數。=="],apply:"新習慣建不起來時，別加決心：把它縮到最糟那天也能做到的大小，掛在一個每天必然發生的動作後面，做完立刻給自己一個正向信號。",contrast:[{n:"原子習慣",why:"克利爾從系統與身份下手，福格從觸發與最小動作下手——一個改框架，一個改起跑線"},{n:"富蘭克林",why:"富蘭克林一週只練一條美德，靠的是自律；福格把難度降到不需要自律"}]},
{c:"家庭與關係",n:"薩提亞",e:"1964年·家庭治療先驅",w:"看冰山下面",y:1964,l:["卡爾·羅傑斯","非暴力溝通","阿德勒","依戀理論"],d:"家庭治療的開創者之一。她的轉折性主張是：一個人出問題，往往是整個家庭系統在維持某種平衡，把症狀放在了最脆弱的那個成員身上。所以治療對象不該只是那個人。她還給出一套辨識方法：人在壓力下會退回四種固定的應對姿態——討好、指責、超理智、打岔——而第五種「一致性」才是健康的表達。",story:"薩提亞會讓全家人站起來擺出雕塑：誰離誰近、誰背對誰、誰被擋在後面。她說家庭的真實結構在語言裡說不清楚，但擺出來所有人一眼就看見了。這個方法的犀利之處在於它繞過了辯解——沒人能否認自己站在哪。她的另一句常被引用的話是：問題本身不是問題，如何應對才是問題。",f:[{n:"冰山：行為之下還有幾層",d:"她把一個人分成水面上的行為，和水下的感受、觀點、期待、渴望、自我。衝突幾乎都發生在水面，而解決要到水下——對方發火（行為）底下是失望（感受），再底下是「我希望被重視」（期待）。停在水面上爭對錯，永遠吵不完。",eg:"伴侶抱怨你回家太晚，字面是時間安排，底下多半是「我在這個家裡排第幾」。"},{n:"四種應對姿態",d:"討好（放棄自己）、指責（放棄對方）、超理智（放棄雙方只講道理）、打岔（放棄話題）。四種都是壓力下的自動反應，都在迴避真實。第五種一致性是同時顧及自己、對方和情境——這是要練的，不是天生的。",eg:"吵架時你開始一條條講邏輯而對方越來越激動，那多半是超理智對上了指責，兩個人都不在場上。"},{n:"問題不是問題，應對才是",d:"家庭裡的困難本身常常無解——收入、疾病、性格差異。真正決定日子好不好過的是應對方式。這句話把注意力從「誰造成的」轉到「我們怎麼處理」，後者才是能動的部分。",eg:"孩子成績下滑這件事無法立刻改變，但全家是互相指責還是一起想辦法，決定了它會變成什麼。"},{n:"症狀可能是系統的產物",d:"某個成員的問題常常在替系統承擔功能——孩子出狀況讓瀕臨破裂的父母暫時聯合起來。只治那個人而不動系統，症狀會轉移到別人身上。",eg:"孩子的問題一好轉夫妻就開始吵，往往說明之前那個問題在替婚姻擋事。"}],q:["==問題本身不是問題，如何應對才是問題。==","==壓力之下，人會退回討好、指責、超理智或打岔。==","==症狀常常不屬於那個表現出症狀的人，而屬於整個系統。=="],apply:"家裡反覆出現同一種衝突時，先別追究誰不對：看雙方各自退回了哪種姿態，再看水面下真正的期待是什麼。如果某個人的問題一好轉別處就出事，那多半是系統在移動。",contrast:[{n:"依戀理論",why:"依戀理論解釋個人的模板從哪來，薩提亞解釋家庭系統當下如何維持平衡"},{n:"非暴力溝通",why:"都主張從行為走到需要：盧森堡給四步句式，薩提亞給冰山與姿態兩把尺"}]},
{c:"家庭與關係",n:"鮑恩",e:"1978年·家庭系統理論",w:"分化",y:1978,l:["薩提亞","阿德勒","依戀理論","約翰·戈特曼"],d:"精神科醫生，提出家庭系統理論。他關注的核心是「自我分化」——一個人在與親近的人保持連接的同時，能不能保有獨立的思考和情緒。分化低的人被家庭的情緒場裹挾：別人焦慮他就焦慮，為了平息衝突不惜放棄立場。他的另一個重要概念是三角關係：兩個人之間張力過大時，會自動拉進第三個人來分散，而這會把張力固定下來。",story:"鮑恩觀察到家庭焦慮的傳導極快且不講道理：一個人緊張，全家都緊張，且沒人說得清為什麼。他把這叫情緒融合。他給出的方向不是切斷關係——那是另一種被支配，叫情緒切割——而是分化：既留在關係裡，又不被捲走。他有一句話概括了這個難處：能同時做到「我是我」和「我們在一起」的人，比想像中少得多。",f:[{n:"分化：連接與獨立要同時成立",d:"分化低有兩種表現，看著相反其實同源：一種是被牽著走、家人不高興就妥協；另一種是乾脆斷絕往來。前者是融合，後者是切割，都是無法在關係裡保持自己。真正的分化是留在關係裡而立場不塌。",eg:"過年被催婚，跟著難受一整晚是融合，從此不回家是切割。第三條路是照常回去，且不為這個話題爭辯也不改變主意。"},{n:"三角關係把張力固化",d:"兩人張力過大時，會本能地拉入第三方——向朋友抱怨伴侶、父母把孩子拉進自己的矛盾。短期確實緩解，代價是那對矛盾從此不需要被解決了，因為張力已經有地方洩。",eg:"跟同事有意見不直說，轉而跟第三個人說——問題不會消失，只會變成三個人的長期結構。"},{n:"焦慮會沿著系統傳導",d:"家庭裡的焦慮像水，從壓力最大的地方流向最脆弱的地方，常常落在孩子身上。所以父母處理好自己的焦慮，比任何針對孩子的方法都管用——這是鮑恩最具操作性的推論。",eg:"父母對前途的焦慮，孩子幾乎必然接收到，哪怕一個字沒說。先處理自己那份，孩子的狀態常常自動變化。"},{n:"分化是練出來的，且會傳代",d:"分化水平大體在原生家庭裡形成，也會傳給下一代。但它可以有意識地提高——方法是在最容易被捲走的關係裡，反覆練習「我知道你不高興，我理解，但我的看法不變」。",eg:"每次面對家人的情緒都能既不冷漠也不投降，這個能力就長一分，下一代接到的起點也高一分。"}],q:["==分化，是在與人保持連接的同時，仍然保有自己。==","==兩個人之間的張力過大時，會自動拉進第三個人。==","==焦慮沿著家庭系統傳導，落在最脆弱的那個人身上。=="],apply:"被家人的情緒牽著走時，先分清：我是在融合（跟著難受、趕緊妥協）還是切割（乾脆不來往）。想解決兩個人的矛盾，注意別拉第三個人進來——那會讓它變成長期結構。",contrast:[{n:"薩提亞",why:"同為家庭系統取向：薩提亞看當下的應對姿態，鮑恩看跨代的分化水平"},{n:"阿德勒",why:"兩把劃邊界的刀：阿德勒問「這是誰的課題」，鮑恩問「我有沒有被捲進他們的情緒」"}]},
{c:"家庭與關係",n:"托馬斯·戈登",e:"1962年·父母效能訓練",w:"我信息",y:1962,l:["非暴力溝通","卡爾·羅傑斯","蒙臺梭利","阿德勒"],d:"羅傑斯的學生，把人本主義心理學做成了普通父母能學的課程——父母效能訓練（P.E.T.）。他的兩個核心工具比後來流行的溝通方法更早也更具體：一是「我信息」，用描述自己而非評判對方的方式表達不滿；二是「問題歸屬」，先分清這件事困擾的是誰，因為歸屬不同，該用的方法完全不同。",story:"戈登指出多數父母只會兩招——要麼贏（我說了算），要麼輸（算了隨他）。他把這叫輸贏法，並指出兩種都有長期代價：贏法培養出順從或對抗，輸法培養出不顧及他人。他提出第三法：把衝突變成共同解決的問題，讓雙方一起找出彼此都能接受的方案，且不投票、不折中，而是找一個真正滿足兩邊需要的辦法。這在當時的育兒觀念裡近乎異端。",f:[{n:"我信息：說自己，不評判對方",d:"完整的我信息有三部分：具體行為、對我的實際影響、我的感受。「你把玩具留在樓梯上（行為），我抱東西下樓會踩到（影響），我很擔心（感受）」。它之所以有效，是因為沒有一句在說對方是什麼人，對方不必防禦。",eg:"把「你怎麼這麼不小心」換成「東西放在樓梯上，我抱著箱子看不見會摔倒」。同一件事，後者孩子會去挪。"},{n:"先分清這是誰的問題",d:"孩子考砸了難受，問題在孩子那邊，父母該做的是傾聽；孩子把客廳弄亂讓你沒法工作，問題在你這邊，該用我信息。用反了最常見：孩子難受時父母急著講道理，等於把自己的問題疊上去。",eg:"孩子被同學孤立回來哭，此刻不該分析原因和給建議，那是把問題接管過來了。先聽。"},{n:"第三法：不靠輸贏解決衝突",d:"要麼聽我的、要麼聽你的，長期都在積累賬。戈登的做法是把衝突攤開成一個待解的問題：雙方說出各自真正的需要，再一起找方案。關鍵在於找的是滿足兩邊需要的第三條路，不是各讓一步的折中。",eg:"孩子要玩到十點、你要他九點睡，折中九點半兩邊都不滿意；問清楚他要的是玩完這一局，改成九點前打完，兩邊都成立。"},{n:"傾聽是有動作的",d:"戈登要求的傾聽不是沉默，是把對方的意思用自己的話說回去，讓對方確認。這來自他老師羅傑斯，但他把它拆成了父母可以照著做的步驟，而不是一種態度。",eg:"孩子說「我再也不去上學了」，回一句「聽起來今天在學校發生了很不好的事」，比問「為什麼」更容易讓他說下去。"}],q:["==用我信息，不用你信息：說這件事對我的影響，不說你是什麼樣的人。==","==先弄清這個問題困擾的是誰，再決定用哪種方法。==","==衝突不必以誰贏誰輸收場。=="],apply:"要提意見時，先把話拆成「具體行為 + 對我的實際影響 + 我的感受」，一句都不評價對方是什麼人。開口之前先問：這件事困擾的是我還是他？困擾他的時候，先聽不講。",contrast:[{n:"非暴力溝通",why:"戈登比盧森堡早二十年，兩套結構高度相似；戈登多了一層「問題歸屬」的判斷"},{n:"蒙臺梭利",why:"都主張成人退後：蒙臺梭利改環境讓孩子自己做，戈登改說法讓孩子自己想"}]},
{c:"學習與成長",n:"維果茨基",e:"1934年·蘇聯心理學家",w:"再高一點",y:1934,l:["艾利克森","蒙臺梭利","費曼","契克森米哈賴"],d:"蘇聯心理學家，三十七歲去世，留下的概念卻影響了整個教育學。他最重要的貢獻是「最近發展區」——一個人能力有兩條線：自己能做到的，和在他人幫助下能做到的。兩條線之間那段空隙，才是學習真正發生的地方。低於它是重複，高於它是挫敗。他還強調思維是從社會互動內化來的：先是和別人一起做，然後才變成自己會做。",story:"維果茨基與當時主流的發展觀相反。皮亞傑認為要等孩子發展到某個階段才能教相應的內容，維果茨基認為教學應當走在發展前面——恰當的引導會把發展往前拉。他舉的例子是：兩個孩子獨立解題都停在同一水平，但給一點提示後，一個能往前走很遠，另一個走不動。這兩個孩子的實際水平相同，最近發展區卻完全不同，而後者才決定他們接下來能學到什麼。",f:[{n:"看能力的兩條線，不只看一條",d:"評估一個人只看他獨立能做什麼，會低估差別。真正有預測力的是「給一點幫助後能做到什麼」——它顯示這個人接下來能長到哪。對帶人和教孩子都是同一件事：別只看現在的成績，看提示之後的反應。",eg:"兩個下屬現在的產出差不多，給同樣一句指點後，一個立刻能推進、一個還是原地——培養重點該放在前者。"},{n:"腳手架：給了要撤",d:"幫助的正確形態是腳手架——搭起來是為了讓人夠到更高處，夠到之後要拆。不拆的幫助會變成依賴，讓人停在被扶著的水平上。所以每一次介入都該帶著「什麼時候不再需要」的問題。",eg:"教孩子解題時先示範一步、讓他做下一步，下次只提示第一句，再下次不提示。不撤的示範會一直被等著。"},{n:"教學應當走在發展前面",d:"等準備好了再教，會錯過窗口；教遠超出的東西，只會挫敗。正確的位置是略高於當前——難到需要幫助，又沒難到幫了也做不成。這與刻意練習的舒適區邊緣是同一個位置的兩種說法。",eg:"孩子剛會加法就教方程是無效的；但一直只讓他做加法，那個能往前一步的窗口就白白關掉了。"},{n:"先在人之間，後在人心裡",d:"維果茨基認為高級思維先發生在互動中，再內化成個人能力——孩子先是被大人提問，後來才學會自己問自己。這解釋了為什麼討論、複述、教別人比默讀有效：它把還沒內化的過程先在外面走一遍。",eg:"學不明白的東西，找人講一遍。你在講的過程中借用的正是那個還沒內化的結構。"}],q:["==一個人獨立能做到的，與在幫助下能做到的，兩者之間就是最近發展區。==","==教學應當走在發展的前面。==","==高級的思維先發生在人與人之間，然後才發生在人的內部。=="],apply:"教人或自學時，找那個「一個人做不到、給點提示就能做到」的位置——低於它是重複，高於它是挫敗。幫助要按腳手架來：給了就要計劃什麼時候撤。",contrast:[{n:"艾利克森",why:"同一個位置的兩種說法：艾利克森叫舒適區之外，維果茨基叫最近發展區，前者講怎麼練，後者講怎麼教"},{n:"蒙臺梭利",why:"兩種兒童觀：蒙臺梭利主張準備環境讓孩子自己長，維果茨基主張教學要主動往前拉"}]},
{c:"學習與成長",n:"德韋克",e:"2006年·斯坦福大學",w:"能力可長",y:2006,l:["艾利克森","維果茨基","原子習慣","費曼"],d:"斯坦福心理學家，提出固定型思維與成長型思維的區分：前者認為能力是天生定量的，後者認為能力可以通過努力和方法生長。兩種信念帶來完全不同的行為——認為能力固定的人會迴避可能失敗的挑戰，因為失敗等於證明自己不行；認為能力可長的人把失敗當作信息。這個概念影響極大，也因此被大量簡化和濫用，需要分開看待。",story:"她最有名的實驗是給學生做完一組題後給兩種不同的表揚：一組被誇「你真聰明」，一組被誇「你很努力」。隨後讓他們選下一組題，被誇聰明的更多選擇了簡單的，被誇努力的更多選擇了有挑戰的。她的解釋是，誇天賦讓孩子把成績當成天賦的證明，此後每一次挑戰都變成了對自我的威脅。誇過程則把注意力放在可控的部分上。",f:[{n:"誇過程，別誇天賦",d:"這是這套理論裡最實用也最容易執行的一條。誇聰明會讓人保護「聰明」這個標籤，從而回避挑戰；誇具體的做法（你把這一步拆開了、你換了三種方法）讓人把注意力放在可改進的地方。",eg:"孩子考得好，說「你這次把錯題都過了一遍」，不說「你真聰明」。前者可複製，後者只能守。"},{n:"失敗是信息還是判決",d:"兩種思維的分水嶺在失敗發生的那一刻：一種把它讀成「我不行」，另一種讀成「這個方法不行」。差別不在情緒強度，在於接下來會不會去找原因。",eg:"方案被否，問「哪裡不成立」的人下次能改；認定「我不適合做這個」的人，下次連提都不提了。"},{n:"「還沒有」這個詞",d:"德韋克提到一所學校用「尚未通過」代替「不及格」，把結果從一個判決改成一個時間點。這個小改動之所以有效，是因為它把注意力從「我是什麼水平」轉到「我到哪一步了」。",eg:"把「我不會寫」改成「我還不會寫」。一個字的差別，決定了後面那句是找方法還是找理由。"},{n:"這個效應比流行說法小得多",d:"必須說清楚：近年多項大規模重複實驗發現，思維模式干預的實際效應量遠小於原書傳達的印象，在部分人群裡接近於零。它是一個真實但溫和的因素，不是決定成敗的開關。把它當萬能鑰匙，會讓人忽略資源、方法和環境這些更重的變量。",eg:"孩子學不好，先看教法、基礎和睡眠，別一上來就歸因為「心態不對」——那既不準確，也把責任全推給了孩子。"}],q:["==誇獎天賦會讓人迴避挑戰，誇獎過程會讓人接受挑戰。==","==在成長型思維裡，失敗是信息；在固定型思維裡，失敗是判決。==","==用「還沒有」代替「不行」。=="],apply:"給反饋時誇具體做法，不誇天賦。自己失敗時先問「哪個方法不成立」，而不是「我是不是不行」。但別把思維模式當成萬能解釋——效應比流行說法小得多，先檢查方法、資源和休息。",contrast:[{n:"艾利克森",why:"德韋克講相信能力可長，艾利克森講具體怎麼長——只有信念沒有練法，是空的"},{n:"維果茨基",why:"兩者都指向「再高一點」的位置：一個說該相信能到，一個說該怎麼搭梯子"}]},
{c:"學習與成長",n:"優秀的綿羊",e:"2014年·德雷謝維奇",w:"會考不會想",y:2014,l:["費曼","蘇格拉底","卡爾·紐波特","尼采"],d:"作者在耶魯任教十年、做過招生評審，寫下對精英教育的批評。他的觀察是：這套系統篩選出的年輕人極其擅長跨越一道道設定好的欄杆——成績、競賽、實習、簡歷——卻普遍說不出自己想要什麼。他稱他們為優秀的綿羊：能力很強，方向全靠外部給定，一旦沒有下一道欄杆就陷入茫然，且對失敗有超出常人的恐懼，因為從沒被允許失敗過。",story:"他描述那種典型的困境：一個各方面都出色的學生來找他，說自己不知道為什麼要讀這個專業，也不知道畢業後想做什麼，只知道必須做到最好。德雷謝維奇指出這不是個人問題，是系統的產物——一個從小被優化到「滿足每一項評價標準」的人，從來沒有機會練習「自己決定什麼重要」這件事。他的處方不是換個專業，是給自己一段沒有評價標準的時間。",f:[{n:"擅長跨欄，不擅長選路",d:"長期在明確評價體系裡勝出的人，會把「做到最好」內化成默認目標，而從沒練過「決定什麼值得做」。這兩種能力完全不同，且後者只能在沒有標準答案的處境裡練。",eg:"從優等生到工作後陷入迷茫的落差，多半不是能力問題，是第一次沒人給標準了。"},{n:"怕失敗到不敢嘗試",d:"一路順利的代價是沒有失敗的經驗，於是失敗被想像得極其可怕。結果是迴避一切可能不擅長的事，能力越來越窄——恰恰是最需要拓寬的時候。",eg:"不敢轉去自己真正想做的方向，理由是「我在現在這行已經積累了」，但真實原因常常是不能接受從頭當新手。"},{n:"給自己一段沒有評價的時間",d:"他的建議很樸素：去做一件不被記分的事，做夠長。因為「我想要什麼」這個問題只有在沒人打分的時候才浮得上來，有評分標準時人會自動去優化那個標準。",eg:"業餘認真做一件沒人看的事，做半年。這半年產生的判斷，比任何職業規劃課有用。"},{n:"批評的對象是系統，不是學生",d:"這本書容易被誤讀成指責年輕人不夠獨立。作者的對象是把人訓練成這樣的篩選機制——每一步都理性的選擇，加起來變成一個沒有方向的人生。看清這一層，才不會把它當成又一次「現在的年輕人怎麼了」。",eg:"用它自省可以，用它教訓別人不行——那些欄杆是誰設的、誰在收益，才是這本書真正問的問題。"}],q:["==他們非常擅長跨越欄杆，卻說不出自己想去哪裡。==","==從未被允許失敗的人，會把失敗想像得無比可怕。==","==只有在沒有人打分的時候，你才知道自己真正想要什麼。=="],apply:"發現自己只會問「怎樣才算做得好」而答不上「我想要什麼」時，去做一件不被記分的事，做夠長。判斷一個選擇時，先分清是我想要，還是它恰好是下一道欄杆。",contrast:[{n:"蘇格拉底",why:"兩種把人從現成答案裡叫醒的方式：蘇格拉底靠追問，德雷謝維奇靠指出提問的人一直在替別人答題"},{n:"尼采",why:"都在質疑外部給定的價值：尼采針對道德體系，德雷謝維奇針對精英篩選體系"}]},
{c:"家庭與關係",n:"哈佛成人發展研究",e:"1938年至今·哈佛醫學院",w:"關係的質量決定晚年",y:1938,
d:"人類史上最長的一項成年人追蹤研究。1938年從268名哈佛大二學生開始，後來併入波士頓貧民區的456個男孩，兩組人每兩年問一次近況、每五年做一次體檢，很多人被跟了一輩子，如今已經跟到他們的子女。第四任主任羅伯特·瓦爾丁格把八十多年的數據壓成一句話：讓人晚年健康又快活的，既不是財富也不是名聲，是關係的質量。這項研究的分量不在結論本身——那句話人人都會說——而在它是極少數用幾十年縱向數據把這句話釘住的證據。",
story:"研究開始時的設想完全不是這個。1938年立項要找的是「什麼樣的年輕人會長成健康成功的成年人」，測的是體格、血壓、家庭背景，甚至量過顱骨，研究者預期答案會落在體質和出身上。幾十年過去，這些指標一個接一個失去解釋力，剩下的那一項恰恰是他們最初沒打算測的：這個人有沒有穩定、可依靠的關係。樣本里有出身極好卻晚景孤零的人，也有從貧民區出來、一輩子被朋友和家人圍著的人——後者的健康曲線更高。",
f:[{n:"關係是預測項，不是安慰話",d:"五十歲時對親密關係的滿意度，比同期的膽固醇水平更能預測八十歲時的健康。這不是說心情好身體就好，是長期的關係狀況會順著壓力、睡眠、炎症這些通道落到身體上。",eg:"研究裡事業極成功但關係疏離的那一批，晚年的健康和記憶衰退都更早。"},
{n:"質量算數，數量不算",d:"起保護作用的不是朋友的個數，是有沒有幾個能真托住你的人。這項研究常用的量法只有一個問題：半夜出事你能打給誰。答不出名字的人裡，社交很活躍的不在少數。",eg:"通訊錄兩千人，半年內說過話的不到十個——後一個數字才是真的。"},
{n:"高衝突的關係比沒有關係更傷",d:"數據裡不好聽的一條：長期互相消耗的婚姻，對健康的損害超過分開。所以「維持」本身不是目的，為了孩子硬撐二十年這個選擇，在健康這本賬上要單獨算一筆。",eg:"硬撐下去的那種婚姻，兩個人的體檢報告都在替它付錢。"},
{n:"改善的窗口一直開著",d:"這項研究裡改善最明顯的一批人，是五六十歲才開始主動修復關係的——重新聯繫斷掉的親人，把泛泛之交變成常來往的人。瓦爾丁格給這件事起名叫社交健身：不練就退。",eg:"六十歲重新聯繫上老同學，之後十年的心情和體檢都被抬了一截。"}],
q:["==排在第一位的既不是錢，也不是名聲，是身邊那幾個人。==",
"半夜兩點你出事了，能打給誰——這個問法比問你有幾個朋友準。",
"==它和肌肉是一回事：不是練成了就一直在，是停下就會退。=="],
apply:"覺得關係可以等忙完這陣再說時，先數一個數：過去一個月我跟人有過幾次不為辦事的來往。數不出來，它就不是「以後再說」的事。要動就從最小的一步開始：每週挑一個人，發一條不為辦事的消息。用反了：拿它去逼自己維持一段正在消耗你的關係，那恰好是數據裡最傷身體的那一類；或者讀成必須有很多朋友，它說的一直是質量不是數量。",
l:["依戀理論","格蘭諾維特","弗蘭克爾","阿莉·霍克希爾德"],
contrast:[{n:"格蘭諾維特",why:"都在講關係的結構：格蘭諾維特看弱連接怎麼帶來機會，哈佛研究看強連接怎麼托住晚年——一個管信息，一個管身體"},
{n:"約翰·卡喬波",why:"同一件事的兩端：哈佛研究給出關係值多少，卡喬波給出缺了它的時候身體和腦子會發生什麼"},
{n:"優秀的綿羊",why:"都在問什麼才算過得好：綿羊質疑評分體系，哈佛研究直接給出八十年數據裡排第一的那一項"}]},
{c:"心智與情緒",n:"約翰·卡喬波",e:"1951-2018·芝加哥大學",w:"孤獨是信號不是缺陷",y:2008,
d:"社會神經科學的創立者之一，一輩子研究一件事：孤獨在身體和大腦裡到底是什麼。他做的第一件事是把定義擰緊——孤獨不是身邊沒人，是你想要的聯結和實際有的之間那道差，所以熱鬧的房間裡也可以很孤獨。定義一改，孤獨就從性格問題變成了信號，和飢餓、口渴、疼痛歸進同一類：都在提醒你去補一樣對生存要緊的東西。他後半生的工作是證明這個信號有實打實的生理後果，以及找出真正能關掉它的辦法——那個辦法和幾乎所有人的直覺都不一樣。",
story:"卡喬波做過一個讓人不太舒服的實驗：給被試看一批中性的面孔，孤獨程度高的人更容易把它們讀成不友好，對負面社交詞的反應也更快。他的解釋是進化——落單的個體必須提高警覺才活得下來，這套機制在原始環境裡是救命的。問題是它在今天會反噬：你把別人的冷淡讀成敵意，於是先退一步；對方察覺到疏遠，也退一步。這個循環不需要誰真的排斥過你，它自己就轉得下去。",
f:[{n:"孤獨是信號，不是性格缺陷",d:"當成缺陷，第一反應是瞞著不說，而瞞住恰好堵死了唯一的出口。當成信號就沒有這個包袱：它不說明你這人有毛病，只說明有件事該做了，跟餓了該吃飯是同一類事。",eg:"「我這人就是不合群」——這句話一齣口，能做的事就全關掉了。"},
{n:"獨處不等於孤獨，所以很多辦法用錯了地方",d:"判據是主觀的：有沒有人讓你覺得被懂，而不是身邊站著幾個人。搬去人多的城市、參加更多活動，加的都是獨處的反面，補的不是那道差。",eg:"天天有飯局卻越吃越空，說明加的那一項根本不在賬上。"},
{n:"警覺會把孤獨自己養大",d:"孤獨讓人對社交威脅過度敏感，敏感讓人先撤，先撤讓關係變淡，變淡又坐實了「我果然不受歡迎」。它是個自己轉的圈，所以光靠多接觸人打不斷。",eg:"消息沒秒回就斷定人家不想理你——多數時候他只是在開會。"},
{n:"最有效的干預是改解讀，不是加機會",d:"2011年他和同事做的元分析把辦法分成四類：加社交機會、加社會支持、練社交技巧、改對社交的解讀。前三類是所有人的直覺，效果都不大，排第一的是第四類。",eg:"把「他嫌我煩」先改寫成「他可能在忙」，隔天再發一條試試。"}],
q:["==身邊站著幾個人，和有沒有人懂你，是兩件事。==",
"孤獨和餓是同一類東西：都在提醒你，有樣要緊的缺了。",
"==誰也沒排斥過你，可它就是這麼一直轉下去了。=="],
apply:"覺得孤獨又不好意思說出口時，先分一句：我缺的是有人在場，還是有人懂我。前者去人多的地方管用，後者去了也白去。如果是後者，別急著加社交，先抓住那個自動冒出來的結論——「他肯定嫌我煩」——把它寫下來，問一句憑什麼，然後找機會驗一次。用反了：拿它當成必須馬上擴大社交圈，那是在加數量；也別反過來責備自己不夠開朗，信號不挑性格，外向的人一樣會亮。",
l:["哈佛成人發展研究","布琳·布朗","克里斯汀·內夫","薩波爾斯基"],
contrast:[{n:"格蘭諾維特",why:"都在數關係，但數的東西不同：格蘭諾維特數你能通到幾個不重疊的圈子，卡喬波數你覺不覺得被懂"},
{n:"布琳·布朗",why:"兩種「說不出口」：羞恥靠秘密和沉默活著，孤獨靠警覺和先撤活著——都是越藏越大"},
{n:"阿德勒",why:"阿德勒說人的煩惱都來自人際關係，卡喬波把這句話拿去做了實驗，量出它在血壓和睡眠上的讀數"}]},
{c:"學習與成長",n:"村上春樹",e:"1949-·《當我談跑步時我談些什麼》2007",w:"把創作變成體力活",y:2007,
d:"三十歲前開著一家爵士酒吧，1978年在球場看棒球時忽然決定寫小說，1981年關掉店專職寫作，同時開始跑步——理由很實際：坐著寫東西會發胖，煙也抽得太兇。此後三十多年，他跑完過三十多次全程馬拉松和一次一百公里超馬，寫作與跑步用的是同一套辦法。他這本談跑步的書之所以被大量不跑步的人讀，是因為它其實在回答另一個問題：一件沒人要求你做、也不知道有沒有人看的事，怎麼才能做上幾十年。",
story:"寫長篇的時候他給自己定死了每天的量：十頁稿紙，每頁四百字。寫得不順，硬湊也要湊滿；寫得正順、還想接著寫，也在這裡停。他說這不是自律的表演，是為了明天——今天把話說盡，明天坐下來面對的就是一片空白；留一截沒寫完的，第二天才接得上。跑步同理：狀態再好，跑完當天的量就回家。他把這套東西叫作和肌肉打交道的方式——肌肉記得住負荷，但它只認每天都來的那種。",
f:[{n:"停在還想寫的地方",d:"寫作最難的不是寫，是重新開始寫。把結尾停在一個自己知道下一句是什麼的位置，第二天的啟動成本接近於零。反過來，一段徹底寫完再收工，明天面對的是從頭找入口。",eg:"停在一句話中間，第二天坐下就能直接接著敲。"},
{n:"定上限，不只定下限",d:"多數人只給自己定下限。定上限是為了防止狀態好的那天透支——那天多寫的部分，通常要用後面三天的枯竭來還。產量真正的敵人不是懶，是忽高忽低。",eg:"週末爆寫兩萬字，接下來兩週一個字都碰不了，賬是平的甚至虧的。"},
{n:"才能之外還有兩樣，而且能練",d:"他說寫小說要三樣：才能、集中力、持續力。才能有多少是天給的，不歸你管；後兩樣跟練肌肉一樣，每天給一點負荷就會長。糾結第一樣不產生任何動作，能下手的一直是後兩樣。",eg:"「我沒天賦」這個結論就算是對的，也推不出今天該做什麼。"},
{n:"沒人要求你做，所以理由只能自己給",d:"上班有考核，讀書有考試，理由是外面給的。自己選的長期事情沒有這一套——一旦拿閱讀量、點贊、別人的評價當理由，那個理由隨時會被抽走。他的替代方案是跟昨天的自己比：參照物每天都在，而且不會耗盡。",eg:"發了三篇沒人看就不寫了，說明當初寫的理由本來就在別人手裡。"}],
q:["==每天寫得完的量，才是能寫十年的量。==",
"跑不跑沒人管，所以停下來也沒人攔——難的是這個。",
"==熱情靠不住，定額靠得住。=="],
apply:"做一件長期的事而進度全看狀態時，先定一個不問心情的每日量，並且把它壓低到最差的那天也做得完——用單日的上限換年度的總量。收工別停在寫完的地方，停在還想往下寫的地方。想放棄的時候先分一句：是因為做得不好，還是因為沒人看見。用反了：拿它合理化閉門造車，不看反饋和不靠反饋是兩回事；也別把每日量定成成果量，村上定的一直是投入量。",
l:["艾利克森","BJ·福格","卡爾·紐波特","李小龍"],
contrast:[{n:"艾利克森",why:"都在講長期練什麼：刻意練習要你待在做不到的邊緣，村上要你把每天的難度降到不會斷——一個管長進，一個管別停"},
{n:"BJ·福格",why:"同一個思路的兩端：福格把習慣縮到最糟那天也做得到，村上把每日產量壓到狀態最差也交得出"},
{n:"凱文·凱利",why:"都在回答「沒人看怎麼辦」：凱文·凱利說你只需要一千個鐵桿粉絲，村上說這個問題的答案不該在外面找"}]},
{c:"身心與生活",n:"凱博文",e:"1941-·哈佛大學·醫學人類學",w:"治不好，還照護得了",y:1988,
d:"哈佛的醫學人類學家，也是精神科醫生，在中國做過多年田野。他一輩子在做同一件事：把「病」拆成兩半。一半是醫生看到的——檢查單上的指標、器官裡的病變；另一半是病人過的那段日子——疼、怕、幹不成事、在家裡變成另一個角色。現代醫學幾乎全部力氣都花在前一半上，而人真正在受的是後一半。2011年他的妻子瓊因早發型阿爾茨海默病去世，此前十年由他照顧。研究了一輩子照護的人說自己完全沒準備好，這句話是他後半生工作的起點。",
story:"他的妻子瓊在五十多歲確診，此後十年一點點忘掉自己是誰，也忘掉他是誰。凱博文那時已經是照護研究的權威，教了幾十年，輪到自己才發現書上的東西大半用不上：真正難的不是技術，是每天早上重新接受今天的她和昨天不一樣。他後來寫下這段，得出的結論只有一句——治癒會走到走不下去的地方，照護不會。醫學有交出去的那一刻，而陪著這件事，一直到最後一天都還做得了。",
f:[{n:"「指標正常」和「你沒事」是兩句話",d:"檢查單能宣布病變消失，宣布不了那段日子留下的影響。很多人在治療結束後反而更難受，因為醫學的任務完成了，而生活裡的那一半還沒有人管——它本來就不在那張單子上。",eg:"化驗全正常，可還是不敢一個人出門——這不是矯情，是另一半沒被處理。"},
{n:"解釋模型八問，最後一問最要緊",d:"1978年他提出一組問題：你管它叫什麼病、覺得是什麼引起的、為什麼這時候來、有多嚴重、該怎麼治、惹了哪些麻煩、你最怕它哪一點。前七個問理解，最後一個問恐懼——而恐懼常常才是真正攔住人的那樣東西。",eg:"醫生反覆說這個病能控制，而他怕的其實是同事會怎麼看他。"},
{n:"治癒和照護是兩個目標，答案在不同人手上",d:"治癒問能不能好，答案有時候是不能；一旦是不能，按這個目標走的人就無事可做了。照護問今天能不能好過一點，這個問題每天都有答案，而且答案一直在你手上。",eg:"「治不好了」之後仍然有一整天要過，那一天怎麼過是可以決定的。"},
{n:"照護的人也在被消耗，這一項要單獨算",d:"他寫得最不留情的一段是自己的崩潰：疲憊、內疚、偶爾冒出來的怨氣。他堅持這不是道德問題而是結構問題——長期照護的成本必須被看見、被分擔，否則倒下的會是兩個人。",eg:"獨自扛了兩年之後自己先病倒，這在長期照護裡是常態不是意外。"}],
q:["==檢查單上的病好了，日子裡的那一半還在。==",
"他是這一行的權威，輪到自己一樣被打得措手不及。",
"==別問能不能治好，先問今天能不能好過一點。=="],
apply:"查出一個要長期帶著的病，先把兩件事分開各寫一列：醫生說的那件，和我每天真正難受的那件。它們常常不是同一件，而第二列沒人替你處理。陪人看病之前先問一句「你最怕的是哪一點」，比問哪兒不舒服有用——恐懼才是決定他配不配合的東西。已經治不好的時候，把「治好」這個目標放一邊，只問今天有哪件小事能讓這一天好過一點。用反了：拿照護替代該做的治療；或者讀成必須一個人扛到底——他這本書很大一部分正是在講扛不住會怎樣。",
l:["薩波爾斯基","弗蘭克爾","阿莉·霍克希爾德","卡爾·羅傑斯"],
contrast:[{n:"弗蘭克爾",why:"都在回答「這件事改不了了怎麼辦」：弗蘭克爾講極端處境下態度是最後的自由，凱博文講日常的長期消耗裡照護一直做得了"},
{n:"卡爾·羅傑斯",why:"都要求先聽懂對方的世界：羅傑斯給的是複述到對方點頭，凱博文給的是八個具體問題"},
{n:"阿莉·霍克希爾德",why:"都在給不被計量的勞動記賬：霍克希爾德算家務和情感勞動，凱博文算長期照護——兩筆都默認由一個人獨吞"}]},
{c:"心智與情緒",n:"榮格",e:"1875-1961·蘇黎世",w:"人生下午的綱領不一樣",y:1931,
d:"分析心理學的創立者，弗洛伊德最看重的學生，也是最著名的那個決裂者。他留下的東西里有不少難以驗證的部分——集體無意識、原型、共時性——但另外三個概念被反覆用了近一百年，因為它們直接對著一個人怎麼過日子：把一生分成上午和下午，兩段的任務不同；把自己壓下去、又從別人身上跳出來的那部分叫陰影；把在外面扮演的那一套叫面具。這三樣的共同點是都能拿來當自查的工具，而不是只能拿來解釋。",
story:"他把一生比作一天。上午的任務是往外——立業、成家、在世界上掙一個位置，標準是外面給的，也確實管用。他觀察到的是：很多人到了中年忽然失速，不是能力退了，而是還在用上午的綱領過下午。他為此寫下那句常被引用的話——早晨為之偉大的東西，到了傍晚會變得微不足道。下午的方向掉了個頭：從爭取變成整理，從往外證明變成把那些一直沒被用上的部分撿回來，判斷標準也從別人手裡換回了自己。",
f:[{n:"中年的失速多半是到點，不是故障",d:"做得好好的人忽然提不起勁，第一反應總是找毛病：累了、行業選錯了。另一種讀法是上午那道題基本答完，下午的還沒接上，中間那段空白就是這個感覺。",eg:"該有的都有了卻更空，這種空比一無所有時更難跟人解釋。"},
{n:"上午的解法用在下午會加倍失效",d:"上午卡住就加碼——再努力一點、再多要一點。下午再用這一招，只會把空的地方填得更滿。中年拼命升職換房、之後發現那種感覺一點沒少的，多半是這個。",eg:"升了職反而更空，說明加的那一項本來就不在賬上。"},
{n:"過度的反感是陰影在說話",d:"看不慣一個人很正常，但反應大到不成比例——一提就來氣、不相干也要說兩句——就不只是關於他了。壓下去的東西不會消失，它換個出口，常常從別人身上跳出來。",eg:"對愛出風頭的人深惡痛絕的，往往自己最想被看見。"},
{n:"面具是必需品，但要脫得下來",d:"職務、身份、別人期待你有的樣子，都是面具，也都該有。危險在戴久了當成自己：退休、失業、孩子離家，面具被外部收走，剩下的那個人不知道自己算誰。",eg:"退休頭半年最難熬的往往不是沒事做，是不知道現在該是誰。"}],
q:["==同一套辦法，上午管用，下午就不管用了。==",
"讓你一提就來氣的那類人，值得你多看兩眼。",
"==明天這個身份沒了我還剩什麼——寫得出三樣就還好。=="],
apply:"三四十歲做得不差卻越來越提不起勁，先別忙著找毛病。問一句：我最近在使的勁，是不是還在解上午那道題——如果那道題基本答完了，繼續加碼就沒用了。遇到一想到就來氣的人，把討厭他的那一點寫下來，再問這一點我身上有沒有、只是從來不許它出來。另外長期留一件跟身份無關的事：一個愛好，一群不認識你職務的人；角色被收走那天你站在什麼上面，就靠它。用反了：拿它當撂挑子的理由，榮格說的是重心轉移；也別把每一次疲憊都讀成人生轉向。",
l:["弗蘭克爾","優秀的綿羊","莊子","布琳·布朗"],
contrast:[{n:"優秀的綿羊",why:"都在講外部標準失效之後怎麼辦：綿羊說的是一路優秀的年輕人忽然沒了評分，榮格說的是中年人上午那套綱領到點了"},
{n:"布琳·布朗",why:"都在處理不肯認的那部分自己：布朗講羞恥靠沉默活著，榮格講陰影靠投射活著——都是不認就更兇"},
{n:"阿德勒",why:"兩種看不慣別人的解法：阿德勒問這是誰的課題，榮格問這一點我身上有沒有"}]},
{c:"身心與生活",n:"老鼠公園",e:"1978年·西蒙菲莎大學",w:"成癮要看籠子",y:1978,
d:"七十年代末的一組實驗，加上一場沒人設計的自然實驗，合起來動搖了關於成癮的一個常識。標準做法是把老鼠單獨關在空籠子裡，給一瓶摻嗎啡的水，它會喝到死——結論看著很硬：一沾就完。布魯斯·亞歷山大問了另一個問題：如果籠子不是空的呢。他造了一個有同伴、有輪子、有隧道的大圍欄，同樣兩瓶水，那裡的老鼠對嗎啡水興趣小得多。同一時期，越戰歸國士兵的追蹤數據給出了人身上的版本。這個條目要說的不是藥不重要，是處境這一項被長期低估了。",
story:"1971年美國政府發現駐越美軍裡有相當比例的人對海洛因成癮，所有人都在等一場災難——這些人回國會把問題帶回城市。羅賓斯團隊做了追蹤，結果和預期完全相反：絕大多數人回國之後自己就停了，一年內復吸的只佔很小一部分。同一批人，同一種藥，換了地方就不一樣。回國換掉的不只是地點，是一整套東西：不再隨時可能死、身邊是家人不是戰友、有工作有日程、拿到那樣東西也變難了。",
f:[{n:"籠子也是變量，不只是背景",d:"原來的實驗默認籠子是背景，只有藥是變量。把籠子也變成變量之後結論就變了：同一只老鼠、同一瓶水，處境不同，行為差得很遠。藥的作用沒被否認，只是它不是唯一那一項。",eg:"同樣一款遊戲，暑假在家的孩子和有事可做的孩子，玩法完全不同。"},
{n:"空出來的地方本身在製造需求",d:"公園裡的老鼠不是被管住了，是本來就不太想喝。亞歷山大後來用了一個詞——錯位：個體被從他該在的關係和位置裡拔出來，就會去找任何能填的東西。",eg:"搬到陌生城市、一個朋友都沒有的那段時間，什麼都容易上癮。"},
{n:"先記賬，找那個固定的空檔",d:"用起來是反直覺的：先別跟那件事較勁，先記十次——什麼時候、在哪兒、手上有沒有別的事、旁邊有誰。多數人記完會發現，觸發它的不是渴望，是某個固定的空檔。",eg:"十次裡八次是睡前躺床上，那要改的是睡前那半小時的安排。"},
{n:"這條有邊界，說清楚才用得對",d:"老鼠公園的複製並不都成功，學界對解釋也一直有爭論；越戰那組數據裡也仍有一部分人回國後繼續。穩妥的讀法是處境解釋了大頭，不是全部——用它解釋一切，會讓該就醫的人被耽誤。",eg:"「換個環境就好了」對一部分人成立，對另一部分人是危險的建議。"}],
q:["==問題可能不在那瓶水，在那個籠子。==",
"戒不掉常常不是意志不夠，是那個空一直在。",
"==撤掉一樣東西會留下一個位置，那個位置得有人補。=="],
apply:"想戒掉一件事而每次都靠忍、每次都在同一個地方破功時，先別動那件事，先記賬：最近十次是什麼時間、什麼地點、當時手上有沒有別的事、旁邊有誰。找那個共同點，先撤它——把這件事撐住的條件一條條拿掉，它會自己變難；正面硬扛撤掉的只有你的意志力，那是最先耗盡的一項。撤完記得補：空出來的位置不填，會被原樣填回來。用反了：當成萬能解釋去替代該有的醫療幫助；也別以為搬個家就自動解決，越戰那組數據裡換掉的是一整套處境，不是一個地址。",
l:["蒙臺梭利","BJ·福格","原子習慣","薩波爾斯基"],
contrast:[{n:"蒙臺梭利",why:"同一個思路用在兩處：蒙臺梭利說先改環境再談行為，老鼠公園說先改籠子再談意志——都是把擔子從人身上挪回處境"},
{n:"BJ·福格",why:"都不跟意志力賭：福格靠把動作縮到最小，老鼠公園靠把支撐條件撤掉——一個降門檻，一個拆腳手架"},
{n:"約翰·卡喬波",why:"兩邊指向同一個空：卡喬波量的是孤獨在身體上的讀數，老鼠公園量的是那個空會被什麼東西填上"}]},
{c:"家庭與關係",n:"埃絲特·佩雷爾",e:"1958-·比利時/紐約·伴侶治療",w:"沒感覺了不等於壞了",y:2006,
d:"做了三十多年伴侶治療，會說九種語言，接的個案橫跨很多文化。她處理的不是「怎麼吵架」那一類問題——那一層戈特曼已經講得很細——而是另一種更難開口的：什麼都好，就是沒感覺了。她給的解釋不歸咎於任何一方：親密要的是靠近、熟悉、可預測，慾望要的是距離、未知、還沒完全拿到手的東西，兩樣都是真需要，方向卻相反。所以關係越安穩，第二樣越容易被擠沒。這不是感情壞了，是把一樣東西做到極致就壓掉了另一樣。",
story:"她最常聽到的一句話是「我們什麼都好，就是沒感覺了」。多數人把它當成感情出了問題，於是坐下來反覆談、反覆分析，越談越沉重。佩雷爾的處方常常反過來：各自去做一件對方不參與的事，重新變回兩個人，再回來。距離在她這裡不是感情的敵人，是慾望的燃料——彼此的行程精確到小時，反而是很多長期關係裡最先失去的那點空氣。她也提醒過一個常見的誤診：把「平淡」當成「破裂」來治。破裂有傷口，那要修；平淡沒有傷口，只是空了，那要的是補。兩個動作方向相反，用錯了會越弄越糟。",
f:[{n:"親密與慾望要的東西相反",d:"親密要靠近、熟悉、可預測；慾望要距離、未知、還沒被完全拿到的東西。兩樣都是真需要，只是方向相反。關係越安穩，第二樣越容易被擠沒——這不是誰的錯，是結構。",eg:"在一起十年、什麼都好、就是沒勁——這句話裡沒有一個字在說感情壞了。"},
{n:"先分清是有傷口，還是空了",d:"有蔑視、翻舊賬、當人面貶低，那是傷口，要先停下、先道歉、先安全；一樣都沒有只是沒勁，那是空，要往外走、去添新的。本該添的時候一直在道歉，本該道歉的時候忙著安排旅行，都是這一步沒分清。",eg:"從不吵架卻越來越沉默，和一吵就翻舊賬，是兩種病。"},
{n:"空的時候，越努力溝通越糟",d:"每週固定坐下來「聊聊我們」，會把最後一點輕鬆也談沒——分析本身就是把關係變成一個任務。空需要的是一起經歷點新的，不是把它攤開研究。",eg:"為了拿到一個答案而反覆問要不要分手，通常說明前一步還沒做。"},
{n:"要數的不是時長，是在場",d:"在一起是時長，在場是注意力，兩筆完全不同的賬。同一張沙發上各刷各的手機，物理上一整晚，在場時間是零。她常問的一個很具體的問題是：上一次你專門看著對方說話、中間沒被任何屏幕打斷，是什麼時候。",eg:"一起過了整個週末，回想卻說不出對方那兩天在想什麼。"}],
q:["==過得越安穩，越容易把另一樣擠沒——這不是誰的錯。==",
"距離在她這裡不是感情的敵人，是慾望要燒的那種柴。",
"==邊聽邊回消息，對方記住的不是你說的話，是你在看別處。=="],
apply:"沒吵架、沒大事，就是沒什麼感覺了的時候，先別急著談感情。第一步分清：最近三個月有沒有出現過蔑視、翻舊賬、當人面貶低。有就是傷口，先處理這個；一樣都沒有，那是空，處理辦法完全相反——各自去做一件對方不參與的事，回來還有得聊。第二步查在場：上一次看著他說話、中間沒碰手機是哪一天，想不起來就先補這個，一天十五分鐘就夠。用反了：拿「製造距離」去合理化冷落對方；或者把它讀成必須重新戀愛一次——它講的是騰位置，不是加大力氣。",
l:["約翰·戈特曼","哈佛成人發展研究","薩提亞","阿莉·霍克希爾德"],
contrast:[{n:"約翰·戈特曼",why:"兩種關係問題的分工：戈特曼修有傷口的（末日四騎士、修復嘗試），佩雷爾補空掉的——她自己說這兩個動作方向相反"},
{n:"哈佛成人發展研究",why:"都在說「維持著」不等於「好」：哈佛的數據說高衝突比分開更傷身體，佩雷爾說沒衝突也可能已經空了"},
{n:"約翰·卡喬波",why:"同一件事的兩個位置：卡喬波講身邊沒人的孤獨，佩雷爾講身邊有人卻還是孤獨"}]},
{c:"身心與生活",n:"克里斯蒂娜·馬斯拉赫",e:"1946-·加州大學伯克利",w:"倦怠是工作的問題",y:1981,
d:"職業倦怠這個概念能被量出來，主要是她的工作。1981年她做出一套量表，把倦怠拆成三樣：情緒耗竭、疏離、成就感下降——只有第一樣和「累」重合，所以一個人可以看起來還在正常上班、活兒也交得出來，而後兩樣早就開始了。她幾十年來最堅持也最不受歡迎的一個主張是：倦怠是工作環境的問題，不是個人韌性的問題。市面上的解法幾乎全在教人放鬆，她說那等於讓承受者自己去修造成問題的東西，還順帶告訴他：你扛不住是你不夠強。",
story:"她和萊特把倦怠的來源拆成六項，講的是人和工作在哪裡對不上：工作量、掌控感、回報、歸屬、公平、價值。多數人只盯著第一項，而在她的數據裡後面幾項常常更致命——尤其是說了不算，和做的事跟自己在意的東西相反。同樣的工時，六項都對得上的人不容易垮，缺兩三項的很快就垮。這也解釋了一個常見的錯覺：一天只有三件事、但每件都要等三個人點頭，比十件事自己拍板更累。",
f:[{n:"三樣裡只有一樣是「累」",d:"情緒耗竭是力氣被抽空，睡一覺補不回來；疏離是對同事、客戶、家人都提不起勁，說話變得程式化；成就感下降是同樣的活幹完，以前有一點滿足，現在什麼都沒有。多數人先疏離，再耗竭，最後才是成就感塌掉。",eg:"接電話的語氣自己聽著都陌生，像在照著稿子說話。"},
{n:"該修的是工作，不是人",d:"當一個人被告知問題出在自己的心態上，他會先增加一層自責，再繼續待在原來的環境裡——這兩樣疊起來比單純的疲憊更難走出來。她沒說睡眠運動無效，她說的是次序：先看工作條件能不能改，再談個人調節。次序一反，個人調節就從輔助變成了掩蓋。",eg:"公司發正念課程而不改排班，員工學完回來面對的是同一張表。"},
{n:"失控比量大更傷人",d:"掌控感是六項裡最常被低估的。事情不多但每件都要請示、隨時可能被推翻，消耗遠大於活多但自己能安排——這跟壓力研究裡的結論一致：可預測和控制感比強度更要緊。",eg:"以為自己需要休假，查完發現真正壓垮人的是每件事都要請示。"},
{n:"價值衝突最慢，也最深",d:"做的事跟自己在意的東西相反，不會當天發作，而是一點點把意義掏空——幹得越久越空，也越說不出為什麼。前五項都補上了，這一項不解決還是會垮。",eg:"每天要說自己不信的話，錢給得再多也補不上那一塊。"}],
q:["==三樣裡只有一樣是累，另外兩樣休息補不回來。==",
"六項對不上的位置不同，該談的、該換的、該退的完全不同。",
"==別人勸你調整心態之前，先問休一個月回來是不是同一張表。=="],
apply:"覺得快撐不住時，先分清是累還是倦怠：力氣抽空、對人提不起勁、做完沒有任何滿足——只中第一條是累，中了後兩條之一就是另一件事。確認之後別急著做個人調節，先查環境：工作量、說了算、回報、歸屬、公平、價值，這六項裡我明確對不上的是哪幾項，逐項寫一句話。籠統說一句「太累了」推不出任何動作，逐項一查答案通常很具體——要爭的是決定權，要談的是公平，還是要換一件不違背自己的事。用反了：拿它論證只能辭職，六項裡有幾項是可以談可以調的；也別用它替代必要的醫療幫助，倦怠和抑鬱不是一回事，分不清就去看醫生。",
l:["薩波爾斯基","阿莉·霍克希爾德","卡爾·紐波特","契克森米哈賴"],
contrast:[{n:"薩波爾斯基",why:"都在講長期消耗：薩波爾斯基給的是生理通道（不確定比強度更傷），馬斯拉赫給的是工作條件的六個位置"},
{n:"阿莉·霍克希爾德",why:"都在給看不見的消耗記賬：霍克希爾德算不進工時表的情感勞動，馬斯拉赫算的是六項裡哪一項對不上"},
{n:"稻盛和夫",why:"稻盛把「全身心投入」當美德，馬斯拉赫會先問：這六項裡有幾項是對得上的，對不上而硬投入，垮的是人"}]},
{c:"學習與成長",n:"蒲松齡",e:"1640-1715年·山東淄川",w:"主線沒成，副業成了",y:1679,
d:"十九歲應童子試，縣、府、道三試第一，一時名動鄉里。然後他考了一輩子舉人，從二十多歲考到六十多歲，一次沒中，靠在縉紳家坐館教書養活一家人，七十一歲才援例補了個歲貢生。這個庫裡絕大多數人是最終成了的人——連敗局也是通往成功路上的敗局；蒲松齡不是。他這一生的正事從頭到尾沒成，而順手做的那件成了：《聊齋志異》寫了四十年、近五百篇，在他眼裡是閒書，生前只在朋友間傳抄，他沒能等到它刊印。",
story:"他的失敗沒有一個轉折點。不是打了一場大的然後重來，是每三年一次、每次都差一點，一直差到老——這中間沒有哪一年值得復盤，也看不出該不該停。他做的事是兩件同時進行：考照考，坐館的活照幹，故事照收。四十年裡，他手上始終有一件正在往前走的東西，只是那件東西在他自己的排序裡排在末位。今天記得他的人，幾乎沒有一個是因為他的八股文。",
f:[{n:"沒有轉折點的失敗，最難處理",d:"打了一場敗仗還能復盤、能轉向；四十年每次差一點，沒有哪一次值得復盤。多數「敗了怎麼辦」的答案都假設有一個轉折點可指，這種情況下全都用不上。",eg:"考研考編考了六年、每年差幾分，這跟一次創業失敗不是一回事。"},
{n:"別讓那件沒成的事變成唯一在做的事",d:"他既沒放棄考，也沒把日子全押上去。同時進行的意思是：那件一直不成的事失敗時，你手上還有別的是成的。一年下來若只剩「又沒考上」一個結論，那不是這一年真的空白。",eg:"主業遲遲不成的時候，最要緊的是別讓它變成你唯一的讀數。"},
{n:"順位不是由你排的",d:"一件事在你心裡的位置，和它最終能長成什麼，是兩件不相干的事。前者由當下的標準決定，後者要幾十年才見分曉。所以「哪個才是我的主業」這個問題，當時問往往答不準。",eg:"花最多力氣的那件常常沒結果，隨手做的那件反而被人記住。"},
{n:"但副業得到的是真投入，不是隨手",d:"《聊齋》不是隨便寫的——四十年、近五百篇、反覆改。它只是在他的排序裡靠後，不在他的投入裡靠後。而且他沒有辭職去寫：坐館給了他飯吃，也給了他四十年不間斷的時間。",eg:"「反正是副業」這個念頭一旦落到投入上，它就真的只能是副業了。"}],
q:["==這個庫裡絕大多數人是最終成了的人，他不是。==",
"他至死把那本書當閒書，而今天記得他的全是因為它。",
"==不是辭了工去寫的，是在工上寫了四十年。=="],
apply:"一件事做了很多年一直沒成、也說不出什麼時候會成時，先別問要不要堅持，先問這一年除了它，我手上還有哪一件是往前走了的——說不出來，先補這一格。業餘那件越做越好、想換過來的時候，先算這三年真投進去多少：投入夠了再談換，不夠就先補投入，別先動名分。用反了：拿他論證「堅持就會有回報」，他到死也沒考上；反過來讀成該放棄也不對，他沒放棄，只是沒讓它成為唯一的事。",
l:["村上春樹","凱文·凱利","優秀的綿羊","弗蘭克爾"],
contrast:[{n:"村上春樹",why:"都在答「沒人看還做不做」：村上是主動選的、並且成了；蒲松齡是沒得選、而且到死不知道成了——後者更接近多數人的處境"},
{n:"范蠡",why:"兩種失敗的對照：范蠡是打完一場大的然後功成身退，有明確的轉折點；蒲松齡沒有轉折點，四十年每次差一點"},
{n:"優秀的綿羊",why:"都在講外部標準：綿羊說的是從小按分數活的人沒了分數會茫然，蒲松齡是分數考了一輩子也沒拿到，卻在別處長出了東西"}]},
{c:"學習與成長",n:"卡斯帕羅夫",e:"1963年- ·蘇聯巴庫",w:"輸給機器之後",y:1997,
d:"國際象棋世界冠軍，1985 到 2000 年在位十五年。1996 年在費城贏了 IBM 的深藍，1997 年 5 月紐約六局重賽以 2.5:3.5 輸掉——那是人類冠軍第一次在正式比賽中敗給機器。這個庫裡多數人處理的是人與人之間的事，他處理的是另一件：一門練了一輩子的手藝，被一臺機器在它最核心的那一項上超過之後，人還剩什麼。他給出的答案不是加練，是改比賽規則。",
story:"輸掉之後他在發布會上指責 IBM 有人工干預、要求重賽，IBM 拒絕，並且把深藍拆了——他連一個可以再打一次的對手都沒有。但同一段時間裡他做了另一件事：1998 年在西班牙萊昂辦了一場新規則的比賽，雙方各帶一臺電腦上場，隨時可以查、可以算。他管這叫 Advanced Chess。理由很直接：計算這一項已經比不過了，那就別再比誰算得快。",
f:[{n:"先劃掉已經輸掉的那一項",d:"機器在計算深度上贏的那天，「誰算得遠」這條賽道就關了。繼續在關掉的賽道上加練，練多少都沒有出口。第一步不是更努力，是把它從自己的價值清單上劃掉。",eg:"查資料的速度、把話寫通順的速度，都已經不是可以拿來比的東西。"},
{n:"改規則，而不是改努力",d:"他沒轉行也沒加練，他改的是比賽允許什麼。一項能力被工具追平之後，值錢的位置會挪到「怎麼用這個工具」上，而這個位置需要有人先把它定義出來。",eg:"不是「我要比它寫得快」，是「我來定這篇該怎麼寫、哪一段該誰寫」。"},
{n:"申辯和下一步搶的是同一段時間",d:"證明「那一場不算」要花的力氣，和琢磨「接下來練什麼」要花的力氣出自同一個人。前者哪怕贏了也換不來新本事，而把你替掉的那一方不需要你的承認。",eg:"花半年證明是工具用錯了，那半年就沒有用來練怎麼用對。"}],
q:["機器贏的那一項，從此不必再比。",
"被替掉的人最容易做的事，是證明那一場不算。",
"工具變強的時候，值錢的位置會挪，不會消失。"],
apply:"你這行某一項核心手藝被工具追平時，先別加練，先問：哪一項已經明確比不過了？把它劃掉之後我手上還剩什麼是它替不了的？發現自己最近老在說「它其實不行」的時候，數一數這個月講了幾次，同一段時間裡練了什麼新的——申辯和練新的搶的是同一段時間。用反了：讀成「練不過就別練」，他沒停止下棋，停的是在計算上爭高下；也別把「改規則」當成誰都能做，先得在原來那行做到看得懂規則。",
l:["納瓦爾","凱文·凱利","費曼","塔勒布"],
contrast:[{n:"李小龍",why:"都在答「舊的一套不管用了怎麼辦」：李小龍講的是別被固定招式鎖死，卡斯帕羅夫講的是那一項已經輸給機器、該整個換賽道"},
{n:"創新者的窘境",why:"一個從行業看、一個從個人看同一件事：窘境說的是好公司為什麼會被新東西掀翻，卡斯帕羅夫說的是被掀翻的那個人接下來怎麼辦"}]},
{c:"世界如何運轉",n:"諾伯特·維納",e:"1894-1964年·美國",w:"技術還沒落地就去提醒人",y:1948,
d:"控制論的提出者，1948 年《控制論》出版，1950 年《人有人的用處》。他的位置在這個庫裡比較特殊：他既是把機器控制這套東西推出來的人，也是最早公開說它會大規模頂替流水線工人的人。1949 年他寫信給美國汽車工人聯合會的領袖魯瑟，說自己不願意這件事在毫無準備的情況下發生，希望工會先介入、一起想辦法。那一年自動化還沒大規模上線，工人還沒失業。",
story:"《控制論》給「控制」下的定義不是發出指令，而是拿實際結果去修正下一步動作——這就是反饋迴路。他舉的例子是人伸手拿杯子：眼睛不斷把手和杯子的差距報回來，手邊走邊改；切斷這條回報，動作立刻失準，不管一開始瞄得多準。他說機器和生物在這一點上服從同一套東西。這個定義後來被用在管理、教育、練習上：交代得再清楚，沒有一條把結果送回來的通道，你手上就只有意圖沒有控制。",
f:[{n:"看得見趨勢的人通常還沒被壓到",d:"他寫信那年自動化還沒上線，正因為還沒壓到，他才有時間做安排。等壓到的時候人只剩反應，沒有布置的餘地。還有活幹的這段時間，是唯一能主動安排的窗口。",eg:"還沒被裁的這幾個月，是能主動布置的窗口，不是等消息的時間。"},
{n:"「它能做」推不出「該給它做」",d:"機器能力和人的用處是兩個獨立問題。把所有它能做的都交出去，剩給自己的往往是它做不了但也沒長進的碎活。該交出去的是重複的部分，不是需要拿主意的部分。",eg:"讓它寫初稿可以，讓它替你決定這篇要說什麼就交錯了。"},
{n:"沒有回報的指令不構成控制",d:"走樣多半不是執行的人不聽話，是迴路斷了，誰都不知道偏了多少。迴路的價值不在有沒有，在隔多久報一次——一週一次和一天一次，能糾的偏差差一個量級。",eg:"月底才知道這個月做偏了，那一個月已經花掉了。"}],
q:["他不擔心機器像人，擔心人被安排成機器。",
"發明它的人，也可以是最早去提醒的人。",
"意圖不等於控制，中間差一條把結果送回來的通道。"],
apply:"一項技術正在你這行鋪開、還沒影響到你飯碗的時候，別等看清了再說——先問它已經能替掉我手上哪一件活，這件事我跟同行裡的誰聊過。往工具那邊挪活的時候，先分清交出去的是重複的部分還是要拿主意的部分：交完之後手上剩的活如果還是不用判斷的，就交錯了。交代的事總走樣、或者練一門手藝沒長進的時候，先看實際結果多久回到你這裡一次。用反了：拿他當「技術會毀掉一切」的證詞，他自己就是推動者；也別讀成要盯得更細，他講的是縮短回報週期，不是提高干預頻率。",
l:["卡斯帕羅夫","系統之美","彼得·德魯克","艾利克森"],
contrast:[{n:"卡斯帕羅夫",why:"同一件事的兩頭：維納是技術還沒落地時就去提醒會被沖掉的人，卡斯帕羅夫是已經被超過之後怎麼重新安排自己"},
{n:"系統之美",why:"都在講迴路：系統之美從結構看行為為什麼反覆，維納給出的是最小單位——拿結果修正下一步這一條通道"}]},
{c:"學習與成長",n:"最後一版",e:"1978年·紐約",w:"一門手藝整體消失",y:1978,
d:"1978 年 7 月 1 日，紐約時報最後一次用鉛字熱排出版，同一天照相排版接手。這門手藝從學徒到出師要好幾年，鑄排機的鍵盤和打字機完全不同，練出來的是一套只在這裡管用的本事——第二天，那套本事在報社裡沒有位置了。有一部紀錄片拍下了那一夜，片名叫《Farewell, Etaoin Shrdlu》：etaoin shrdlu 是鑄排機鍵盤頭兩列的字母順序，排字工手滑時會打出這一串，成了這門手藝的暗號。收它不是為了懷舊，是因為它是「手藝被技術整體抹掉」這件事發生過的樣本，不是比喻。",
story:"排字工裡最受尊敬的是手最快的那批：一分鐘能排多少行，是這門手藝公開的計分板。照相排版一上，這塊計分板整塊作廢——機器排得比誰都快，而且不累。於是出現了一個反常識的現象：最熟練的人受衝擊最大，因為他們的全部身價壓在被替掉的那一項上；反倒是本來不算最快、但懂版面怎麼讀、懂哪行不能斷開的人，換個工具照樣幹。行業不是不再需要人，是需要的人變了：從「排得又快又準」變成「知道這一版為什麼這麼排」。",
f:[{n:"替代不是慢慢變少，是一天換掉",d:"設備一旦裝好、流程一旦切換，舊崗位是整批停用而不是逐年縮減。指望有幾年緩衝期慢慢調整的人，通常等不到那個緩衝期。",eg:"不是訂單一年比一年少，是某個月起整條線換了做法。"},
{n:"最熟練的人受衝擊最大",d:"你在哪一項上爭第一，通常是行業早就定好的。那塊計分板作廢時，排名靠前的人損失最大——他把全部籌碼押在了一個會被整塊拿走的位置上。而過去每一年，繼續加練它都是最划算的選擇。",eg:"最快、最準、最熟這類指標，正好是工具最先追平的那幾項。"},
{n:"能說清為什麼的人換工具不掉價",d:"同一件活裡，怎麼做屬於工具，為什麼這麼做屬於判斷。前者隨工具作廢，後者跟著人走。老手身上最值錢的常常是說不出口的那部分，而工具追平的正是能被說清的那一半。",eg:"「這樣不好看」得能拆成三條具體理由，才帶得走。"}],
q:["熟練在某個時刻會變成負債。",
"需要的人沒有變少，是換了一批。",
"舊活還養得起你的時候試新的，比斷了之後再學便宜。"],
apply:"你這行有新做法正在鋪開、而你的本事大半圍繞舊工具練出來的時候，先問：我最拿手的那幾項，哪些離開這套工具還成立，哪些一換就歸零。在行業公開的計分板上排得靠前的時候，數一數那塊板上有哪一項工具已經比你強了，除了這塊板你還有什麼。想知道自己屬於哪一批，就問這活裡哪一部分你講得清為什麼這麼做——講不清的那部分，這個月能不能拆出三條具體理由。用反了：讀成「別練到最好」或者「專精沒用」，他們靠這門手藝養了幾代人；分界不在精不精，在於本事離具體設備有多遠。",
l:["卡斯帕羅夫","諾伯特·維納","費曼","納瓦爾"],
contrast:[{n:"卡斯帕羅夫",why:"一個是個人被超過之後怎麼改賽道，一個是整門手藝被抹掉時那批人身上發生了什麼——後者沒有改規則的餘地"},
{n:"創新者的窘境",why:"都在講被新技術掀翻：窘境站在公司一側解釋決策為什麼合理，最後一版站在工人一側記錄那一夜之後的事"}]},
{c:"心智與情緒",n:"司馬遷",e:"前145-約前86年·夏陽",w:"受辱之後把書寫完",y:-99,
d:"太史令，《史記》的作者。天漢二年李陵兵敗投降，他替李陵說了幾句話，觸怒武帝下獄，第二年受腐刑。按當時士人的規矩，受這種刑體面的做法是自殺，他沒有。多年後給獄中的任安寫信，把這件事說透了：不是不知道該死，是書沒寫完。《史記》這部書早在庫裡，收他本人是因為他自己那件事——真受過辱、真沒說出口、真活下來把一件事做完——正是「說不出口」這一類處境最缺的樣本。",
story:"《報任安書》裡有一段幾乎是名單：文王拘而演周易，仲尼厄而作春秋，屈原放逐乃賦離騷，左丘失明厥有國語，孫子臏腳兵法修列——一口氣七八個人，共同點不是有才，是都在最壞的時候寫出了傳世的東西。他把自己排在名單末尾。同一封信裡他寫那種恥辱「每念斯恥，汗未嘗不發背沾衣」，一直在。他是帶著這個寫完《史記》的，不是先治好了再寫。這兩件事同時成立：恥辱沒有退場，書寫完了。",
f:[{n:"把關於臉面的問題換成關於事的問題",d:"「我還有臉活嗎」沒有答案，越想越沉；「我手上哪件事沒交」有答案，而且指向動作。他在信裡做的就是這一步換題，羞恥從決定生死的位置上被挪開了。",eg:"出了大丑之後，別問自己還配不配，先問手上哪件事還沒交。"},
{n:"先給自己找一排先例",d:"覺得只有自己這麼慘的時候，什麼道理都聽不進去。他做的是列一張名單：處境相似、後來做成了事的人。名單本身就是解藥，比道理管用。",eg:"覺得自己是唯一一個這麼倒霉的，先去找三個比你更倒霉卻做成了事的人。"},
{n:"活下去需要一件只有你能做完的事",d:"史料在他手裡，父親的筆記在他手裡，換任何人都做不出這一部。這種不可替代不是自戀是事實，正是它讓「我死了這件事就沒了」成立。從別人手裡接過來的責任，在自己不想活的時候仍然成立。",eg:"找那件你不做就沒人能接的事，它比你替得掉的任何工作更能撐住你。"}],
q:["恥是真的，事也是真的，他選了讓事說話。",
"最壞的日子裡寫出來的東西，反而最能留下來。",
"活下去這件事，有時候需要一筆欠著的賬。"],
apply:"做了沒臉的事、或者被人當眾羞辱之後，先別問自己還配不配，問手上有沒有一件沒做完、只有你能做完的事。找不到撐下去的理由時，問有沒有誰把什麼託付給了你——從別人手裡接過來的責任，比自己想出來的意義穩。正處在被打壓、被邊緣的日子裡，先去找三個處境比你糟、後來卻做成了事的人，一張名單比一堆道理管用。用反了：把它讀成「忍辱負重是對的」，他忍的前提是書沒寫完，不是為了忍而忍；也別以為羞恥能被想通，他到死都「汗未嘗不發背」，只是沒讓它決定生死。",
l:["史記","蘇軾","弗蘭克爾","布琳·布朗"],
contrast:[{n:"布琳·布朗",why:"都在講羞恥：布朗是研究者，講羞恥怎麼長、怎麼拆；司馬遷是當事人，講帶著它怎麼把事做完——前者給機制，後者給樣本"},
{n:"蒲松齡",why:"兩種「一直沒成」：蒲松齡是四十年每次差一點、沒有轉折點；司馬遷是一次重創之後從頭活，轉折點清清楚楚"}]},
{c:"身心與生活",n:"史鐵生",e:"1951-2010年·北京",w:"職業是生病，業餘在寫作",y:1991,
d:"作家。二十一歲雙腿癱瘓，之後十五年幾乎每天搖著輪椅去家附近的地壇公園坐著，《我與地壇》寫的就是那段。四十七歲起患尿毒症，每週三次透析，直到五十九歲去世，《病隙碎筆》是在透析間隙寫的。收他是因為「身心與生活」這個領域裡原來九條全是研究者——瑞迪、薩波爾斯基、馬斯拉赫——沒有一個自己病過、自己垮過的人。他是那個人，而且把這件事從裡面寫了三十年。",
story:"他在地壇裡想的是三件事：要不要死，為什麼活，幹嘛要寫作。想了很多年，第一件想明白的是「一個人，出生了，這就不再是一個可以辯論的問題」——人不是自己選的，那就不該由自己判定該不該有。這道題收掉之後，剩下兩道才有地方想。後來他說出了那句話：「死是一件不必急於求成的事，死是一個必然會降臨的節日」。既然一定來，就不必自己去趕；剩下的就是怎樣活的問題了。",
f:[{n:"有些問題不是想通的，是收掉的",d:"「為什麼偏偏是我」沒有答案也不需要答案，它只是一個事實。他花了幾年才承認：這道題不是解出來的，是從待辦清單上劃掉的。劃掉之後，力氣才能往有答案的問題上去。",eg:"別再問「為什麼是我」，問「既然是我了，今天怎麼辦」。"},
{n:"把病放在主位，剩下的時間才能用",d:"透析每週三次、每次四個多小時。不承認病是主業的人每天跟病搶時間，搶不過，剩下的時間也在懊惱裡過掉。他反過來：先把病要的時間全給它，剩下的才算自己的，一分鐘都不浪費在生氣上。",eg:"先把治療、休息的時間釘死，剩下的才算「我的時間」，別倒過來算。"},
{n:"一個每天都回去的地方",d:"地壇他一坐十五年，強調的是「每天」。人垮掉的時候需要一個不會變的座標，它不解決任何事，但它每天都在，這就夠了。振作得太早的人，情緒沒過完，後面還得再倒一次。",eg:"剛出事那陣子，找個固定的地方待著，比立刻規劃下一步更要緊。"}],
q:["他沒有和命運和解，只是不再跟「為什麼是我」較勁。",
"地壇不解決任何事，可它每天都在。",
"把死放回它該在的位置，日子才騰得出地方。"],
apply:"出了一件改不了的事——病、殘、失去——滿腦子都是「為什麼偏偏是我」的時候，先問這道題是不是該劃掉而不是該解開，再找一個每天都能回去待一會兒的地方。查出要長期帶著的病、或者長期垮著，別再為「做不成原來那麼多事」難受，先把病要的時間排第一，看剩下幾個鐘頭能做的最小一件事是什麼。夜裡想到死就睜眼，先找一個白天清醒的時候把它從頭到尾想一遍，想到底了它就不會半夜反覆冒出來。用反了：讀成「接受命運」，他沒接受，他跟疾病較勁了三十八年；也別讀成「病了就該躺平」，他透析十二年寫了幾本書。",
l:["凱博文","弗蘭克爾","蘇軾","蒙田"],
contrast:[{n:"凱博文",why:"一個是醫生寫病人，一個是病人寫自己：凱博文講醫生看到的病和病人過的日子是兩件事，史鐵生就是那個過日子的人"},
{n:"弗蘭克爾",why:"都在回答「處境壓到毫無選擇時靠什麼」：弗蘭克爾的答案是意義，史鐵生的答案更小——一個每天都去的地方、一段病的縫隙"}]},
{c:"謀略與競爭",n:"易經",e:"西周至戰國·中國",w:"什麼時候該動，什麼時候該等",y:-800,
d:"六十四卦，每卦六爻，講的其實是同一件事：一個人在不同位置上該怎麼做。乾卦最下面一格是「潛龍勿用」，最上面一格是「亢龍有悔」；泰卦和否卦緊挨著排；《繫辭》把規律總結成「窮則變，變則通，通則久」。收它是因為「進退取捨」那一組二十一個問題，原來靠荀子、諸葛亮、馮道零散地拼，庫裡一直缺一部專講進退的典籍。",
story:"乾卦從下往上是一條龍從潛到飛再到亢的過程。初九潛龍勿用——龍在水底，別動，不是沒本事，是位置還在最下面；九三終日乾乾、夕惕若厲——整天干，晚上還得警醒；九五飛龍在天，看著是頂點了。可上面還有一格，上九亢龍有悔。《文言傳》解釋這個「亢」：知進而不知退，知存而不知亡，知得而不知喪——一路只學了進、存、得，從沒練過退、亡、喪那一半。到了最高處，缺的那一半就是掉下來的原因。",
f:[{n:"有本事和該出手，是兩個時間點",d:"初九和九五都是龍，差的不是能力是位置。剛到一個新位置就急著證明自己，用的是自己的力，扛的是全部的險。急，多半是把能力和時機混成了一件事。判斷自己在第幾格，比知道所有格的做法更要緊。",eg:"新到一個團隊，頭一個月先別改東西——不是不該改，是這時候改代價最大。"},
{n:"頂點的上面還有一格",d:"多數人以為九五就是終點，其實卦還沒完。盛極的問題不是盛，是不知道已經到頂了還在加。「亢龍有悔」寫給還在飛的人看：你現在的位置，往上一格就是它。",eg:"順風順水的時候讀這句，比摔了之後讀有用。"},
{n:"泰的下一卦就是否",d:"泰卦最上一爻已經寫著「城復於隍」——城牆倒回溝裡。翻轉不是在壞日子開始的，是在好日子的最後一格就開始了。反過來，否卦到頂是「先否後喜」。每一種狀態都自帶它的盡頭，「現在」不是常態，是某一卦的某一格。",eg:"生意最好那年就該想它是怎麼壞的，等壞了再想已經在否卦裡了。"}],
q:["六爻講的是同一條龍在不同位置該做的事。",
"最高那格不叫最好，叫有悔。",
"泰的旁邊就是否，哪一卦都不長久。"],
apply:"剛接手一個位置想盡快證明自己的時候，先問自己在這件事的第幾格——最下面那格該攢的東西攢夠了沒有。連著順了很久、站在從沒到過的高處想再加一把時，問自己是九五還是已經到了上九，這些年練過退和喪沒有，還是只練了進和得。一切順利時問「城復於隍」那格還有多遠；卡死了則問有沒有把它當成「窮則變」的入場券。用反了：把它讀成宿命論，「反正會翻做什麼都沒用」——《繫辭》說的是窮則變，變是要人去做的動作；也別讀成「剛來就該躲著不幹」，初九是勿用不是勿動。",
l:["孫子兵法","道德經","范蠡","智慧書"],
contrast:[{n:"道德經",why:"都講盛極而衰：道德經的「反者道之動」是總規律，易經把它拆成六格，告訴你在哪一格該做什麼"},
{n:"智慧書",why:"格拉西安說「在運氣正盛時退場」，易經說的是退場之前還有一格叫有悔——一個給結論，一個給刻度"}]},
{c:"心智與情緒",n:"蒙田",e:"1533-1592年·法國波爾多",w:"把自己的短處先寫出來",y:1580,
d:"法國作家，《隨筆集》的作者。三十八歲辭掉法官職位，退回自家城堡，把一座塔樓改成書房，之後二十年在那裡寫作，中間還當了兩任波爾多市長。他給自己鑄過一枚徽章，刻著「我知道什麼？」。整本《隨筆集》寫的都是他自己：怕疼、記性差、優柔寡斷、墜馬濱死、腎結石。收他是因為「說不出口」那一組——怕死、怕被看穿、想太多——原來全靳布琳·布朗一人在答；蒙田是四百年前把這些事寫成書的人，而且寫的是自己。",
story:"他有一章直接叫《哲學就是學習死亡》，辦法反著來：別躲，天天想它，想到它不再陌生。他不是空談。三十多歲那年騎馬被人從背後撞飛，昏迷很久，周圍人以為他死了。醒來後他把整個過程寫下來：那一段其實很輕，像睡著，沒有他一直想像的恐怖。他由此下了結論：真正折磨人的不是死，是對死的想像。他還說過，我最怕的就是怕本身。",
f:[{n:"先亮的底牌，沒人能拿它打你",d:"怕被看穿的人，怕的是短處被別人先說出來。他反過來：自己先說，說得比別人能說的還全。一件事已經擺在桌上了，就不再是別人手裡的牌。四百年後這本書還在被讀，恰恰因為它把作者的短處擺在最前面。",eg:"「這塊我不熟」自己先講出來，比等人問到時支吾強得多。"},
{n:"怕的多半是想像，不是那件事",d:"他親身經歷了一次幾乎死掉，發現真到那一刻反而平靜，之前幾十年怕的是自己腦子裡造出來的版本。先分清怕的是事，還是怕的是自己對事的想像。陌生的東西才可怕，熟了就只是一件事。",eg:"半夜冒出來的那種怕，多半是腦子裡自己拍的一部片子，不是那件事本身。"},
{n:"不是退出，是劃一塊地方",d:"他沒有徹底隱居，後來還當了市長。他做的是把一個空間和一段時間釘死為自己的，其餘照常，還把決定刻在書房牆上。全退是逃，全不退是被吃掉，中間才站得住。",eg:"每天有一段時間、一個地方是別人碰不到的，其餘照常，這比徹底換生活容易得多。"}],
q:["他先把自己的怯懦寫進書裡，四百年沒人能拿它打他。",
"他把死當熟人，天天見。",
"留一塊別人碰不到的地方，其餘照常。"],
apply:"坐在一個位置上心裡發虛、怕被人發現其實沒那麼行的時候，先問最怕被發現的那三個短處有沒有一個是自己先講出來過的。夜裡想到死就睡不著，先問怕的是那件事還是腦子裡的版本，有沒有在白天清醒的時候把它從頭到尾想過一遍。日程被別人的事佔滿，問能不能劃出一塊只屬於自己的地方和時間，其餘不動，並且把它寫在看得見的地方。用反了：讀成「想開就不怕了」，他到老還是怕，只是不再被怕支配；讀成「辭職歸隱」，他退進塔樓之後還當了兩任市長。",
l:["塞涅卡","馬可·奧勒留","布琳·布朗","史鐵生"],
contrast:[{n:"布琳·布朗",why:"都在拆羞恥和恐懼：布朗給的是實驗室的機制，蒙田給的是一個人四百年前拿自己做的實驗"},
{n:"塞涅卡",why:"都講學習死亡：塞涅卡是從上往下的勞告，蒙田是從自己墜馬那次往外寫，一個教，一個記"}]},
{c:"身心與生活",n:"陶淵明",e:"365-427年·潯陽",w:"辭官八十天，窮一輩子",y:405,
d:"詩人。四十一歲當彭澤縣令，幹了八十多天，郡裡派督郵下來要他穿戴整齊去迎，他說「吾不能為五斗米折腰向鄉里小人」，當天解印走了，之後再沒出來做官。辭官後是真窮：四十四歲家裡失火房子燒光，有一年斷了糧出門去討，回來寫了一首《乞食》。收他是因為「人生轉彎」那一組蘇軾一人答了十個——庫裡缺一個轉了彎之後窮了一輩子、也沒回頭的人。",
story:"走之前他寫了《歸去來兮辭》，裡面有一句「悟已往之不諒，知來者之可追。實迷途其未遠，覺今是而昨非」——走過的路錯了，好在沒走遠。他強調的不是決心，是距離。後來在《歸園田居》裡他這樣說自己：「少無適俗韻，性本愛丘山。誤落塵網中，一去三十年」。注意他的說法，不是「我一直想種地」，是「我一直不適合那個」。他清楚的是不要什麼，從「不要」出發，走到了一個能過下去的地方。",
f:[{n:"轉向要趁沒走遠",d:"「迷途其未遠」——走錯了但回得來。轉向的代價隨時間漲，八十天回頭和八年回頭不是一個價。等「更合適的時機」，往往等到的是更貴的價。壓垮他的不是大是大非，是一件小事把「我到底在幹什麼」擺到了眼前。",eg:"剛發現不對的時候轉，代價最低；幹滿一任再轉，已經欠了一任的賬。"},
{n:"選了的路，路上的代價原樣接住",d:"他沒把窮寫成受害也沒寫成清高，就是記賬：餓了，去討，說不出話。選了一條路，代價不往別人身上推，也不往自己身上貼金。窮是真的，沒回頭也是真的——兩件事同時成立，說明轉向不是衝動，是算過價的。",eg:"轉錯的判據是「我想回去嗎」，不是「我過得苦嗎」。"},
{n:"「想要什麼」答不出，「不要什麼」答得出",d:"多數人被「你到底想要什麼」卡死，因為它要求一個正面答案。他的路徑是反的：先把明確不要的劃掉，剩下的範圍小了，答案自己就出來了。他給自己定的新方向也很小——守拙，守住笨。",eg:"列不出想要的，先列三件絕對不要的，剩下的路一下子就少了。"}],
q:["走的那天他四十一歲，之後二十多年沒回頭。",
"認了那條路的價，就不必怨。",
"先劃掉不要的，路自己就窄下來了。"],
apply:"現在做得還行但心裡清楚不是你要的、想轉又想等個好時機的時候，先問離「走遠」還有多遠，讓你想走的那件小事說明了什麼。換了自己要的路之後手頭緊、開始懷疑選錯了，問難受的是「日子苦」還是「想回去」。說不出想要什麼，先列三件絕對不要的，再把下一步定得小到一定做得到。用反了：讀成「一不順就走」，他辭的是當官這條路而不是某件不順的事；讀成「安貧樂道」，他寫的是「叩門拙言辭」，苦是真苦。",
l:["蘇軾","蒲松齡","杜甫","弗蘭克爾"],
contrast:[{n:"蘇軾",why:"兩種離開官場：蘇軾是被貶、一路被動，陶淵明是自己走的、當天走的——前者講怎麼在被安排裡過好，後者講怎麼自己做那個決定"},
{n:"蒲松齡",why:"都窮了一輩子：蒲松齡是一直在考、一直沒成，陶淵明是主動不考了——一個沒得選，一個選了"}]},
{c:"家庭與關係",n:"C.S.劉易斯",e:"1898-1963年·英國牛津",w:"妻子死後幾個月的日記",y:1961,
d:"作家，牛津和劍橋的教授，寫過《納尼亞傳奇》和大量勸人信仰的書。五十八歲結婚，妻子喬伊四年後因癌症去世。之後幾個月他在四本練習簿上記自己的狀態，後來用筆名出版，就是《卿卿如晤》。收他是因為「重要的人走了」那六個問題，原來靠弗蘭克爾和蘇軾在答——一個是集中營的倖存者，一個是被貶的官員，都不是喪親的當事人。他是，而且沒把日記整理成道理，留的就是當時的樣子。",
story:"第一句是：「沒人告訴過我，悲傷感覺這麼像恐懼」——不是像難過，是像怕，胃裡翻騰，坐不住。他還記下另一件沒人提前說過的事：悲傷讓人懶，連刮鬍子都嫌麻煩。再往後他發現更可怕的一件：越用力回憶妻子，腦子裡的那個人就越走樣，變成一個更溫順、更符合他想像的版本。有一天他不再刻意去想，她反而清清楚楚地回來了，帶著原來的樣子。抓得越緊，走樣越快；鬆開手，真的才回來。",
f:[{n:"先認出它是什麼",d:"他一直以為悲傷是「難過」，是情緒；結果發現它更像恐懼，是身體的。認錯了名字就用錯了辦法——對付難過靳想通，對付恐懼靳讓身體安靜下來。什麼都不想幹也是它的一部分，不必在悲傷之上再加一條懶的罪名。",eg:"如果是胃在翻、坐不住，那是怕不是傷心，先讓身體安靜下來，別急著想通。"},
{n:"沒被檢驗過的相信，不知道算不算相信",d:"他講了幾十年的道理在自己身上不管用了。這不說明道理錯，說明它從沒被壓過。塌了先別急著重建，急著重建的人往往拿同樣的紙再糊一座；等一等，看哪些是塌了以後還站著的。",eg:"撐你的那套說法失效了，先別急著換一套，看看剩下什麼還站著。"},
{n:"刻意記住的，會變成你想要的版本",d:"記憶不是錄像，每次回放都在重寫。用力回憶一個人，就是在按自己的需要重寫他。他特別珍惜妻子那些不討人喜歡的地方——直率、愛爭、不客氣——因為那些是他造不出來的。",eg:"記住他讓你煩的那幾點，那些比他的好更像他。"}],
q:["悲傷先到的是胃，不是心。",
"撐了一輩子的東西，第一次承重才知道是不是真的。",
"他沒有失去她，他是第一次知道自己有多少。"],
apply:"剛失去一個很重要的人、日子完全接不上的時候，先問身上的感覺更像難過還是更像怕，有沒有把「什麼都不想幹」也算成自己的錯，今天能不能寫三行當天的樣子。一直撐著你的那套想法這回不管用了，問它以前有沒有真正承過重，塌了以後還有什麼站著，能不能把「被奪走」改說成「被檢驗」。怕時間久了把他忘了、每天刻意回憶，問現在記住的那個人有沒有比真人更溫和、更完美。用反了：讀成「悲傷有標準階段」，他後來說悲傷不是過程是一段路，每次轉彎都以為到頭了；讀成「信的東西都是假的」，他最後沒放棄，只是換了一座不是紙糊的。",
l:["弗蘭克爾","蘇軾","約翰·戈特曼","史鐵生"],
contrast:[{n:"弗蘭克爾",why:"都寫失去之後：弗蘭克爾寫的是集中營裡找意義，劉易斯寫的是失去一個人之後連意義都先塌了——前者給出路，後者先給現場"},
{n:"約翰·戈特曼",why:"一個研究關係怎麼維持，一個記錄關係結束之後的人：戈特曼看的是五比一的互動，劉易斯看的是五比一沒了之後胃裡的翻騰"}]},
{c:"創業與產品",n:"大野耐一",e:"1912-1990年·日本豐田",w:"問五次為什麼",y:1978,
d:"豐田生產方式的主要建立者。他在車間裡做出來的幾件事後來成了整個製造業的常識：問五次為什麼、任何工人都可以拉繩停線、把庫存壓低讓問題露出來。收他是因為「把事做成」和「帶人」兩組裡，錯反覆犯、交上來走樣、成本降不動這幾個問題，原來答的多是道理；他是把這幾件事一條條做出來的人，每一條都能直接變成動作。也補上日本——庫裡只有四條。",
story:"書裡有個例子。機器停了。為什麼停？保險絲燒了。為什麼燒？軸承沒潤滑。為什麼沒潤滑？潤滑泵抽不上油。為什麼抽不上？泵軸磨損了。為什麼磨損？沒裝濾網，鐵屑進去了。問到第五個才到該修的地方：裝濾網。只問一次的話修的是保險絲，下週再燒。另一件事來自豐田最早的織布機：線一斷機器自己停，不會帶著斷線織出一匹廢布。他把這個搬到汽車線上，每個工位一根拉繩，任何人發現問題都可以拉，整條線停，問題在發生的那一秒就露出來。",
f:[{n:"第一個原因幾乎從來不是原因",d:"保險絲燒了是事實不是原因，它只是鏈條上最先露出來的那一環。多數復盤停在這一層，因為它最容易看見也最容易改。追到根上的修法往往是最小的動作——濾網比泵便宜、比停機便宜。",eg:"「這次是他沒仔細」——這是保險絲，往下問：他為什麼沒仔細，什麼讓他沒法仔細。"},
{n:"停線的權力要給到最下面的人",d:"最先看見問題的是線上的人，不是經理。如果只有經理能停，問題要先往上報、等批准，那時早流過去了。一個錯在第一道工序被攔住是一分鐘，流到最後是整件報廢。",eg:"讓直接幹活的人有權說「等一下，這不對」，比你事後檢查有用十倍。"},
{n:"庫存像水，問題像水底的石頭",d:"水位高的時候船開得順，因為石頭全在水下——機器不穩、供貨不準，全被庫存兜住了。把水位降下去石頭才露出來，撞一塊修一塊。每一處寬裕都在替某個問題兜底，問題被兜住了就不會被修。",eg:"哪個環節總留餘量，那個環節底下就有一個沒人修的問題。"}],
q:["修保險絲的人下週還得修。",
"讓最先看見的人有權喊停。",
"水位高的時候，石頭都在水下。"],
apply:"同一類問題反覆出現、復盤也寫了、下次照樣的時候，問上次改的是保險絲還是濾網，從「出事」往下問到了第幾層，最後那層對應的改動是不是很小。布置的事交上來總走樣，問從布置到交付中間有幾個能喊停的點，幹活的人發現不對時敢不敢、能不能停。該降的成本都降了不知道還能從哪下手，問哪幾個環節總留著餘量，拿掉一處會露出什麼問題，準備好修它了嗎。用反了：把「五個為什麼」變成問「誰的責任」，他問的是鏈條不是人；把「壓庫存」學成一次砍光，那是撞船不是通河道。",
l:["彼得·德魯克","系統之美","稻盛和夫","松下幸之助"],
contrast:[{n:"系統之美",why:"都講結構決定行為：系統之美從理論上說槓桿點在哪，大野耐一在車間裡給出了找槓桿點的具體動作——多問四次為什麼"},
{n:"彼得·德魯克",why:"德魯克管的是選哪件事、大野耐一管的是每一道工序怎麼不出錯——一個在桌上定方向，一個在車間裡定標準"}]},
{c:"心智與情緒",n:"奧古斯丁",e:"354-430年·北非希波",w:"賜我貞潔，但不是現在",y:400,
d:"基督教思想家，《懺悔錄》的作者。這本書是他四十多歲回頭寫自己的前半生：十六歲偷梨、年輕時的放縱、想改改不動、三十二歲在一個花園裡的下午終於改了過來。收他是因為「知道做不到」「拖著不開始」「想戒又戒不掉」這幾組問題，原來答的是原子習慣、福格、老鼠公園——都是方法；他是一千六百年前把這件事從裡面寫出來的人：他知道該做什麼，他真的做不到，他把做不到的那個機制拆開了。",
story:"他回憶年輕時的一句禱告：「賜我貞潔與節制——但不是現在」。他說自己當時真的想要那樣的生活，也真的害怕祈禱立刻應驗，因為那意味著今天就得放棄眼前這些。拖延不是不想要，是把「要」和「今天」拆開了。後來他在花園裡想改改不動，急得撕頭髮，發現一件怪事：心命令手抬起來，手立刻抬起來；心命令心自己去做一件事，心卻不動。他的結論是：不是意志太弱，是意志有兩個——一個要，一個不要，兩個都是他自己。",
f:[{n:"「想要」是真的，「不是現在」也是真的",d:"拖延的人常被說成不夠想要。他說不對，想要那一半本來就夠；要動的是「不是現在」那一半——它每天都成立，是一個可以無限續期的許可，不會自己到期。拖著的人怕的常常不是做不成，是做成了之後眼前這份舒服就沒了。",eg:"「等這陣忙完」這句話你說了幾次了？它不會自己失效，得你去撕。"},
{n:"有些錯沒有理由，找理由是在原地打轉",d:"十六歲那年他和一群同伴偷鄰家的梨，家裡不缺，偷來的扔給了豬。幾十年後他追問為什麼，最後的答案是：沒有動機，只有場合——要是一個人絕不會去。承認「沒有理由」反而是出口；看那天旁邊是誰，比拷問自己是什麼人更準。",eg:"「我為什麼會那樣」問了很多遍沒答案，那就把這道題劃掉，它可能真沒答案。"},
{n:"不是意志不夠，是意志分裂",d:"「道理都懂就是不動」的人通常被勸要更有決心。可決心本來就在，只是同時還有一個反方向的決心。再加決心是往一邊加，另一邊也在，還是僵住。解開的方式不是更用力，是找那件能讓「想」和「不想」不再對著幹的東西。",eg:"「我不想」不是懶，是你的一部分在護著什麼，先問它護的是什麼。"}],
q:["他把拖延寫成了一句禱告。",
"偷來的梨扔給了豬，他要的從來不是梨。",
"心命令手，手就抬；心命令心，心不動。"],
apply:"知道該做、也想做成、就是一直「等一等再開始」的時候，問「不是現在」這三個字這個月說了幾次，真開始了會失去哪一樣眼下的舒服。做過一件說不出理由的錯事、過了很久還覺得自己很糟，問是不是一直在給它找理由，那天旁邊是誰，有沒有把它完整寫過一遍。道理全懂就是動不了、已經下過很多次決心，問那個「不想」的我在護著什麼，如果它護的東西能換個方式滿足，還會僵嗎。用反了：讀成「想要就該立刻做」，他也不是當天改過來的；讀成「都是別人帶壞的」，他說的是「要是一個人我不會去」，責任還在自己。",
l:["原子習慣","BJ·福格","老鼠公園","王陽明"],
contrast:[{n:"王陽明",why:"都在講知道做不到：王陽明說知而不行只是未知，奧古斯丁說知是真知、行也是真想行，卡住的是兩個意志在打架——一個從知識那頭解，一個從意志那頭拆"},
{n:"原子習慣",why:"原子習慣給的是改系統的方法，奧古斯丁給的是方法用不上時人心裡到底在發生什麼——先看懂後者，前者才用得上"}]},
{c:"權力與組織",n:"漢娜·阿倫特",e:"1906-1975年·德國→美國",w:"不思考是一種狀態",y:1963,
d:"政治思想家。1961 年她去耶路撒冷旁聽一場審判，原以為會看到一個惡魔，結果看到的是一個平庸的人：滿嘴套話，講不出一句自己的話，反覆說自己只是執行命令。她給這個現象起了個名字，平庸之惡——不是因為壞才做的，是因為根本沒想過。她自己的經歷是另一條線：1933 年在柏林被捕後流亡，1941 年到紐約，三十五歲，不會英文，從頭開始，十年後寫出成名作。收她寫的是「不思考」這個機制和她自己的重來，不是那段歷史的是非。",
story:"她注意到那個人最突出的特徵不是愚蠢，是不思考：把判斷整個交出去，自己只負責執行。套話是這個狀態的症狀——有現成的句子可以說，就不必自己想。她後來追問：一個人不做壞事，靳的到底是什麼？答案不是好的規則也不是好的教育，那些都可能被換掉；是「停下來想」這個動作本身，在做一件事之前自己跟自己對一遍。這種想不產生知識，產生的是「我做不出這種事」的那道底線。規則可以變，周圍人可以全變，這道底線是一個人自己生的，沒法外包。",
f:[{n:"「照單子做」本身就是一個選擇，而且是最省力的那個",d:"不問為什麼不是中立的，它把判斷交給了寫單子的人。它省力因為不用為結果負責，它危險因為你成了任何單子的執行器。「不想」是可以被訓練出來的：每次不問、每次照辦，都在加固這個習慣；反過來想也是習慣。",eg:"「上面讓我這麼做的」這句話說的次數越多，你自己的判斷萎縮得越快。"},
{n:"「大家都這麼做」不構成理由",d:"這句話之所以危險，是它把判斷的責任分散到所有人身上，每個人都只剩一小份。可事是你做的，份額不會因為人多而變小。想不是為了得出結論，是為了跟自己對一遍——我願意跟做了這件事的自己相處嗎。",eg:"「同行都這麼幹」可以用來解釋行情，不能用來替你決定要不要幹。"},
{n:"帶得走的是方式，不是位置",d:"到紐約時她的學歷、圈子、身份全沒了，帶走的只有怎麼想問題。這東西不佔行李，不需要證件。她第一件事是去人家裡住兩個月專門學英語，不是找工作——語言是所有其他事的前提。從零開始的賬按十年算，按三年算的人多半在第三年放棄。",eg:"重來之前盤一遍：哪些東西離了原來的位置就沒了，哪些跟著我走。"}],
q:["他不是惡魔，他是一個不想的人。",
"別人都這麼做，責任不會因此變小。",
"證件會被收走，腦子裡那套不會。"],
apply:"你的活基本是照單子做、越來越說不出為什麼這麼做的時候，問這份活裡哪幾步你說得出為什麼，解釋工作時用的是自己的話還是現成的套話。規則是別人定的、覺得自己什麼都說了不算，問這些規矩裡有沒有一條停下來想過就知道自己做不出，上一次動手前跟自己對一遍是什麼時候。換了城市或國家一個人都不認識，問身上哪些是位置帶來的、哪些是方式帶來的，語言這一關過了沒有，時間表是三年還是十年。用反了：讀成「執行的人都有罪」或拿它審判身邊照章辦事的人，她講的是狀態不是定性；讀成事事質疑，她說的是保住「能停下來想」的能力，不是抗命。",
l:["韓非子","馬基雅維利","卡斯帕羅夫","論語"],
contrast:[{n:"韓非子",why:"韓非子講的是不指望人性善、用制度讓人照做；阿倫特講的是照做本身能走到哪裡——一個從設計者看，一個從執行者看"},
{n:"卡斯帕羅夫",why:"都在答「工具替我想了」：卡斯帕羅夫說人的位置在機器分歧的那幾步，阿倫特說交出判斷這件事本身就是一種狀態，不管接手的是人還是機器"}]},
{c:"學習與成長",n:"福澤諭吉",e:"1835-1901年·日本大阪",w:"看見招牌那天重學",y:1872,
d:"日本明治時期的教育家，慶應義塾的創辦人。二十歲出頭在大阪學荷蘭語學得極好，1859 年去剛開港的橫濱，看到街上的招牌一個字都不認識——全是英文。他沒有回去繼續鑽荷蘭語，第二天開始找英文教材從頭學。後來他寫《勸學篇》，第一句是「天不在人上造人，不在人下造人」，賣了三百多萬冊，讀者多是剛起步、不知道該學什麼的年輕人。收他是因為「剛起步」那一組原來沒有一個人自己的起步故事，也補上日本。",
story:"他在自傳裡寫橫濱那一刻像被人一棒子打在頭上：幾年苦學，在這個新開的口岸上派不上用。但他沒把那幾年當成白費，也沒護著它繼續學下去，而是把招牌當成一條信息：風向變了。後來他說荷蘭語沒有白學，學語言的方法是通的，第二門快得多。《勸學篇》裡他講該學什麼：不是背誦難懂的古文，是「實學」——寫信、記賬、打算盤、看地圖，天天用得上的那些。他把這些排在四書五經前面，理由很直接：一個人先要能自己養活自己，再談別的。",
f:[{n:"「用不上」是一條信息，不是一個判決",d:"用不上說明的是方向，不是你的能力。看清方向之後力氣該往哪去就很清楚。換賽道要當天不要等，等的每一天都在給舊賽道加碼。真正的浪費不是學了過期的東西，是死守著它不換。",eg:"發現學的對不上，先別惋惜那幾年，先問它告訴了你什麼方向。"},
{n:"先學明天就用得上的",d:"他的排序標準只有一條：用得上的頻率。天天用的排最前，一年用一次的排後面。不是說後面的不重要，是剛起步的人力氣有限。要不要繼續讀書，標準不是學歷高低，是讀的東西能不能落到手上。",eg:"不知道該練什麼的時候，列出明天上班就要用到的三樣，先練那三樣。"},
{n:"把差距的原因放到能改的地方",d:"「天生不如人」這個念頭最要命的地方不是它對不對，是它把原因放在了改不了的地方。他把原因搬到「學沒學」——這不一定完全對，但它能動。別人顯得穩，往往是早幾年練過你還沒練的東西，把「強弱」翻譯成「早晚」，焦慮就少一大半。",eg:"覺得比不過別人時，把原因從「我天生如此」搬到「我哪一塊沒練」，後者才有下一步。"}],
q:["學錯了方向不可怕，守著不換才可怕。",
"先學明天就要用的。",
"差別在學沒學，這是唯一能改的地方。"],
apply:"花了幾年學的一套東西在現在的地方對不上、一動手就露怯，先問它告訴了你什麼方向，學它時練出來的方法有哪些能直接用到新的上。不知道該練什麼或糾結要不要接著讀書，問明天就要用到的三樣是什麼，現在學的哪一樣能直接落到手上。覺得身邊人都比你穩、自己是不是天生不如人，問那幾項是他們生下來就會的，還是比你早幾年練的。用反了：讀成「學過的都該扔」，他的荷蘭語功底讓英文學得比別人快得多；讀成「只學有用的」，他自己讀了一輩子書，這是剛起步時的排序不是一輩子的。",
l:["艾利克森","優秀的綿羊","稻盛和夫","卡斯帕羅夫"],
contrast:[{n:"優秀的綿羊",why:"綿羊說的是一路按分數活的人沒了分數就茫然，福澤說的是先學明天用得上的、能自己站住——一個診斷病，一個給起步的順序"},
{n:"李小龍",why:"都講舊的一套不管用了：李小龍講別被固定招式鎖死，福澤講的更具體——看見招牌那天就換，方法帶走，內容換掉"}]},
{c:"身心與生活",n:"杜甫",e:"712-770年·河南鞏縣",w:"四十八歲棄官入蜀",y:759,
d:"詩人。三十五歲到長安求官，一待十年，考過、獻過賦、四處投詩，沒有一個像樣的位置，四十四歲才得了個看管兵器庫的小官，安史之亂隨即爆發。755 年冬他回奉先縣家裡，小兒子餓死了。759 年辭掉華州的小官帶著家人一路往西南走，幾乎斷糧，760 年到成都靳朋友接濟搭了一間草堂。他一生最好的詩多數寫在這之後的十年。收他是因為「人生轉彎」那一組蘇軾一人答了十個，庫裡缺一箇中年之前一直沒成、中年之後從頭搭起來的人。",
story:"長安十年他在給韋濟的詩裡這樣記自己的日子：「朝扣富兒門，暮隨肥馬塵。殘杯與冷炙，到處潛悲辛」——早上去敲有錢人家的門，晚上跟在人家馬後頭吃灰。這不是自嘲，是記賬，十年沒成他一年一年記著。755 年那次回家，他寫下「入門聞號咷，幼子餓已卒」，接著是「所愧為人父，無食致夭折」——作為父親我慚愧，沒有飯，孩子死了。沒有繞開，也沒有解釋，就這四句。這首五百字的長詩後面寫的是天下人的苦，但先寫的是自己家這一件最不想寫的。",
f:[{n:"沒成的日子也要有記錄，不然它就是空白",d:"十年沒結果，最容易的處理方式是不提。他把每一段都寫下來了——敲誰的門、吃了什麼、什麼感覺。寫的不是「我在堅持理想」，是殘杯冷炙，把窘迫原樣寫出來，不往上貼任何體面的說法，這樣的記錄才留得住。",eg:"記這段日子的時候別寫「我在堅持」，寫「今天又去敲了誰的門，什麼感覺」。"},
{n:"最不想寫的那件，先寫",d:"這首詩要講天下的苦，可先講的是自己家的。繞開自己那件去講別人的，誰都看得出是躲。「所愧」兩個字不解釋也不推——戰亂、沒錢、在外求官都是真的，他一句沒提。認賬認得乾淨，事情才能過。",eg:"做錯了或沒做到的事，說「我沒做到」就夠了，後面的「因為」全都不用加。"},
{n:"從頭開始先要一間房，不要一個位置",d:"他到成都做的第一件事是搭一間能住的屋子，不是去找官做。中年重來的人容易先找位置——名分、頭銜、原來那個層級。房子有了，寫詩的桌子才有地方放。「太晚」這個判斷，常常是因為還留著別的選項在比。",eg:"重來的第一步是能過日子的最小配置，不是恢復原來的體面。"}],
q:["他把最不想寫的寫在了最前面。",
"沒成的十年，一年一年都有賬。",
"最好的東西寫在最難的十年裡。"],
apply:"在一件事上耗了很多年一直差一點，問這幾年有沒有原樣記下來，除了那件沒成的有沒有一件一直在往前走的。做了自己覺得最沒臉的事、或者沒做到最該做到的，問要把這段日子講清楚最不想提的是哪件，能不能只說「我沒做到」不加任何「因為」。人到中年原來那條路斷了，問現在要的是一間能過日子的房還是原來那個位置，是不是還留著一條「萬一能回去」的路在跟新路比。用反了：讀成「堅持十年總會成」，他求官這件事到死也沒真成；讀成「中年歸零反而好」，他是被逼到那一步的，路上真的差點餓死。",
l:["蘇軾","蒲松齡","陶淵明","司馬遷"],
contrast:[{n:"蘇軾",why:"都是四十多歲之後從頭搭：蘇軾到黃州先開地，杜甫到成都先搭房——兩個人都先要能過日子的東西，不要位置；差別是蘇軾後來又回去了，杜甫沒有"},
{n:"陶淵明",why:"一個是自己走的，一個是沒得選：陶淵明辭官那天就知道往哪去，杜甫棄官之後一路走一路找，到成都才停下"}]},
{c:"創業與產品",n:"褚時健",e:"1928-2019年·雲南",w:"七十四歲上山種橙",y:2002,
d:"雲南人。五十一歲起管玉溪捲菸廠，把紅塔山做成全國第一的品牌，出名的是把每個環節的標準定死、把每個人的收入和質量綁在一起。七十四歲那年原來的一切都沒了——位置、名聲、積蓄大半也沒了，身體也不好。他和妻子跑到哀牢山，承包兩千四百畝荒山種冰糖橙，橙樹四五年才結果，真正大賣是十年後，他八十四歲。收他寫的是這個人：七十四歲上山、等五年、把一件事管到位的本事。",
story:"當時幾乎所有人都覺得這是老人打發日子。他不這麼算：橙樹四五年結果，他七十四，等到七十九能看到第一批果——這個年紀的人多數活得到。算出來夠，就幹。上山第一年住的是工棚。果樹沒結果的那幾年他不是乾等：修水利、測每塊地的土壤、請農科所的人定肥料配方，還把果樹密度從每畝一百多棵砍到八十棵，因為太密的果不甜。煙和橙子是兩個行業，他七十多歲才碰橙子，可管法一樣：每塊地包給一戶人家，按果子的質量算錢不按斤數，剪枝、施肥、採摘的標準全寫成規矩。",
f:[{n:"「太晚」要拿數字算，不能拿感覺判",d:"他沒有說「我還年輕」，他算的是樹幾年結果、我大概還能活幾年、夠不夠。「太晚」這個判斷多數時候是感覺，感覺是算不出年數的。什麼都沒了的人反而沒什麼可比的了——那間辦公室已經不存在，全部退路斷掉的人幹得專心。",eg:"覺得太晚的時候，寫下這件事要幾年、你大概還有幾年，兩個數擺在一起看。"},
{n:"看不到結果的年份，是修基礎設施的年份",d:"果樹沒結果的那幾年他修水利、測土壤、定配方，這些事在有果的年份反而沒時間做。五年很長，可他每天上山做的是具體的一件事。第一批果不好吃他沒當成失敗，當成信息：知道了哪裡不對，接著調。",eg:"還沒出結果的這段時間，去修那些一旦忙起來就永遠修不了的底層東西。"},
{n:"行業換了，管法沒換",d:"他沒有從頭學怎麼管，只是把原來那套用到新東西上：定標準、綁質量、每天到現場。行業知識是新的可以請人，管法是舊的是他自己的。他請農科所的人定配方，自己不假裝懂——管到位是讓懂的人在對的位置，不是自己樣樣都懂。",eg:"換行的時候盤一下：哪些是這個行業的知識（可以請人），哪些是你做事的方法（跟著你走）。"}],
q:["七十四歲算的是一道減法題，不是一個感覺。",
"等五年的人，每天都在做一件事。",
"位置能收走，本事收不走。"],
apply:"這個年紀要從頭開始一件事、身邊人都覺得太晚了，先算這件事要幾年見結果、你大概還有幾年，兩個數擺在一起夠不夠，再問是不是還留著一條「萬一能回去」的路。投進去一件事要好幾年才見結果、正在看不到任何回報的那一段，問這段時間在修哪些以後就沒空修的東西，「等」拆成每天的一件事了嗎，第一批出來的東西不行當成了信息還是判決。沒了原來的位置覺得自己什麼都不是了，問原來那套做事的方法哪幾條跟著你走，到了新地方是卡在「不懂」上還是卡在「不想請懂的人」上。用反了：讀成「什麼年紀開始都不晚」，他算過、算出來夠才幹的；讀成「只要等夠久就會成」，他等的五年每天都在幹活。",
l:["稻盛和夫","李嘉誠","蒲松齡","蘇軾"],
contrast:[{n:"蘇軾",why:"都是失了位置之後先做一件小事：蘇軾到黃州先開地，褚時健上山先修水利——兩個人都不等人重新承認自己，先讓手上有一件做成的"},
{n:"稻盛和夫",why:"都講把一件事管到位：稻盛講的是動機和思維方式，褚時健講的是標準和質量綁定——一個從人心下手，一個從規矩下手"}]},
{c:"心智與情緒",n:"丘吉爾",e:"1874-1965年·英國",w:"被晾了十年，六十五歲回來",y:1929,
d:"政治家、寫作者。1929 年隨內閣下臺丟了財政大臣的位置，此後十年沒有官職，史稱荒野歲月。這十年他靠寫書養家，四卷本的《馬爾博羅傳》出在這期間；在自己家裡動手砌磚砌牆，還畫油畫。三十年代他在議會反覆講德國重新武裝、英國空軍跟不上，被同僚當成好戰和過時的人，他沒有改口，把飛機產量的數字一次次念進會議記錄。1939 年重回海軍部，1940 年五月出任首相，六十五歲。收他是因為「被晾在一邊」和「一直沒成」這兩個處境現在主要靠蘇軾和弗蘭克爾答，缺一個不是貶謫、不是受難，只是沒人再找你、而每天照樣得交出東西的樣本。",
story:"這十年他沒有一個頭銜。寫作是職業不是消遣——稿費是一家人的收入；砌牆是真砌，早幾年他還加入過建築工會。同一天裡腦子和胳膊都用上，人才不至於整天在心裡跟不在場的人打官司。議會裡他講的那件事沒人愛聽，他的辦法不是提高音量，而是把話換成能核對的東西：對面今年造了多少架飛機，我們造了多少。這些發言當時改變不了任何一次投票，可它們帶著日期留在了記錄裡。十年後有人急著找一個對這件事有現成判斷的人，只剩他一個。",
f:[{n:"沒人找你的時候，讓每天都有東西出手",d:"被排除在外最難受的是不知道自己還算不算數。他的解法是交付：一章書稿、一段牆、一幅畫。而且那件事得真養著他——有人付錢、有截稿日，它才不是等著回去的中場休息。",eg:"定一件每天能交出成品的事，最好是有人付錢的那種。"},
{n:"說了沒人聽，就把話換成能對賬的",d:"感慨沒法驗證，說十遍還是一遍。換成數字、日期、具體的比較，對方當時可以不理，可它留在那兒，後來能對賬。他真正沒做的一件事是改口——一改口，將來需要判斷的時候就沒人想起你了。",eg:"把沒人聽的那個判斷寫成一句能驗證的話，標上日期存好。"},
{n:"機會來時，看的是你手上現成的東西",d:"那一刻沒人有時間培養誰。找他是因為這件事上只有他有現成的判斷、現成的記錄、現成的說法。攢的時候不知道會用在哪兒，只能保證攢的是真東西，不是消磨。",eg:"問自己：明天有人急用，我手上現成能拿出去的是什麼？"}],
q:["十年沒有頭銜，每天照樣有東西出手。","他一句沒改，所以後來只剩他一個。","那幾年他既寫書，也真的在砌牆。"],
apply:"被排除在核心之外、沒人再找你商量的時候，問今天交出了什麼、這件事有沒有人付錢和截稿日，再安排一件出力氣的活跟腦子裡那場官司搶時間。看見了別人還沒當回事的事、說了幾次沒人聽，問這個判斷能不能改寫成可核對的一句話、有沒有帶日期記下來、最近有沒有為了好過一點悄悄把話說軟。攢了很久看不到出口時，問如果明天有人急用、我現成能拿出去的是什麼。用反了：讀成「熬著總會回來」，他這十年沒有一天在熬，而且很可能一輩子回不去；讀成「堅持己見總會被證明」，他也有判斷錯的時候，這裡說的是把話說成能對賬的形式，不是自信本身。",
l:["蘇軾","蒲松齡","弗蘭克爾","司馬遷"],
contrast:[{n:"蘇軾",why:"都是被挪開之後過了很多年：蘇軾是被貶，位置由別人定；丘吉爾是落選，位置由制度換手——一個學會在原地過日子，一個每天在攢能帶回去的東西"},{n:"蒲松齡",why:"都在沒人看見的年頭裡出活：蒲松齡考了四十年沒成，靠路邊收來的故事撐住；丘吉爾的十年有稿費養著，兩個人手裡的憑據不一樣"}]},
{c:"身心與生活",n:"瑪麗·居里",e:"1867-1934年·華沙/巴黎",w:"丈夫死後第七個月接過他的課",y:1906,
d:"物理學家、化學家。1867 年生於華沙，1891 年到巴黎求學，1903 年與丈夫皮埃爾、貝克勒爾同獲諾貝爾物理學獎。1906 年 4 月 19 日皮埃爾在巴黎街頭被馬車撞倒身亡；同年索邦把他的教席給了她，11 月 5 日她上第一堂課，一句悼詞沒有，從丈夫上次講停的地方接著往下講，成了索邦第一位女教授。喪夫後一年多，她在一個本子上寫給皮埃爾的話，生前沒給任何人看過。一戰期間她放下實驗室，籌錢改裝汽車、裝上 X 光設備開往前線，自己學開車學修車，帶著十幾歲的女兒同去，士兵管這些車叫小居里。收她是因為「重要的人走了」這個處境答的人偏少，庫裡也缺一個把哀悼過成日子的親歷者。",
story:"第一堂課教室外擠滿了人，記者也來了，都等著聽她說點什麼。她沒有給。開口就接上丈夫上次停下的地方，往下講。同一段日子裡，她晚上在本子上對他說話：今天去了哪兒、孩子說了什麼、她怎麼受不了，句子裡全是「你」，沒有一句是「我要走出來」。八年後戰爭爆發，前線的傷員要送到後方才照得上片子，很多人等不到，她去籌錢、改車、學開車，把設備開到前線附近。那幾年她學術上幾乎是空白。",
f:[{n:"先接住一件有鐘點有地點的事",d:"巨大的空白沒法直接面對，能面對的是星期一下午兩點那間教室。而她接的正是他沒講完的那一段——紀念一個人最實在的方式，往往是把他手上的事接著做下去。",eg:"先固定一件非做不可的具體事，有鐘點、有地點的那種。"},
{n:"說不出口的話，寫給那個人",d:"對活人說會變成求安慰，對自己說會變成分析，只有對著他說才說得出實話。她也沒給自己定期限——把哀悼當成有終點的任務，人會一邊難過一邊怪自己怎麼還沒好。",eg:"抬頭寫他的名字，用「你」，寫在確定不會被看見的地方。"},
{n:"本事要往眼下最缺它的地方放",d:"她的本行是研究，戰時最缺的卻是讓傷員馬上照上片子。為此她學的是駕駛和修車這種沒有身份的活。那幾年按論文算是空白，按用處算不是。",eg:"問一句：眼下最缺我這身本事的，是哪件具體的事？"}],
q:["她沒有說再見，她把那堂課講完了。","本子上全是「你」，一句沒給別人看。","戰時她學的是開車和修車。"],
apply:"最重要的那個人剛走、日子還得往下過的時候，先問這幾天有沒有一件非做不可、有鐘點有地點的事，他手上有沒有一件你接得住的事，你是不是在勉強自己給別人一個交代。有些話對誰都說不出口時，問這些話真正的收信人是誰、能不能就寫給他，以及是不是在給自己定「什麼時候該好了」。手上的本事和眼前的事對不上時，問眼下最缺它的是哪件具體的事、其中最沒身份的那段活接不接。用反了：讀成「忙起來就不痛了」，她白天講課、晚上寫那個本子，兩件事是一起的；讀成「本行不重要」，她做的事和專業直接相關，只是換了用法。",
l:["C.S.劉易斯","史鐵生","弗蘭克爾","蒙田"],
contrast:[{n:"C.S.劉易斯",why:"都在配偶死後寫了東西：劉易斯寫的是自己信仰塌了、怕把人換成記憶；居里寫的是日常，今天去了哪兒、孩子說了什麼——一個在追問，一個在陪著"},{n:"史鐵生",why:"都是把不可挽回的事過成日子：史鐵生面對的是自己的身體，居里面對的是別人的死；兩個人都沒有等一個好起來的日子，而是先給每天找了件具體的事"}]},
{c:"識人與相處",n:"菜根譚",e:"明代·約1590年代",w:"三百多條講人前人後怎麼過",y:1590,
d:"明代洪應明著，約成書於萬曆年間，三百餘條語錄。「徑路窄處，留一步與人行」把讓一步說成讓自己好過的辦法，不是美德；「藏巧於拙，用晦而明」講的是一個人在人群裡的藏身之處，理由是藏身不是謙虛；「毋以己之長而形人之短，毋因己之拙而忌人之能」把急著顯強和見不得別人好說成同一件事的兩頭。書名出自宋人汪信民「人常咬得菜根，則百事可做」。收它是因為「說不出口」那一組——看不得別人好、怕被看穿、總在討好——現在布琳·布朗一人答了十二個，而且答的全是外國人，中文裡最貼這一組的書就是這本。",
story:"「徑路窄處，留一步與人行；滋味濃的，減三分讓人嗜。此是涉世一極安樂法。」要緊的是最後五個字：他沒說這樣高尚，說的是這樣自己好過。為了別人而忍，忍到後面會記賬；為了自己不必繃著而讓，讓完就過去了。他給的量也清楚——留一步、減三分，不是全讓，全讓出去的人得靠對方的良心過日子。另一條講藏：藏巧於拙、以屈為伸，圖的是能在人群裡待住。",

story:"全書從一個人動不了開始。阿周那不是不會打，他是把所有後果一次性攤在了眼前，手就軟了。克里希那沒有說別想那麼多，也沒有催他，而是陪他把這件事從頭論了十八章。中間那句被引了兩千年：你只有做事的權利，沒有對結果的權利；不要為了結果去做事，也不要因此就不做事。這話不是在書房裡說的，是在一個人馬上要付出代價的時候說的。論完之後他還是去打了——代價一分沒少。",
f:[{n:"把權利劃開：動作在你手上，收成不在",d:"做不做、怎麼做、今天做多少全在這邊；市場認不認、上面批不批、對方回不回全在那邊。不問收成不等於不看結果——結果是信息，用來調整動作，不是用來決定今天還做不做。",eg:"把事情拆成兩欄：我說了算的和我說了不算的，只動左邊。"},

// 反向關聯索引。l 與 contrast 都是逐條手寫的單向邊，於是被指向的一方看不到來源：
// 全庫有 291 條 l、119 條 contrast 只存在於一個方向，另有 9 條（武則天、富蘭克林、胡雪巖、
// 安迪·格魯夫、六祖慧能，以及新收錄的幾條）沒有任何條目指向它們，只能從「最新」或搜索進入。
// 這裡在渲染期補齊反向邊：人工挑選的正向關聯仍排在前面，自動補全的反向關聯接在後面，去重。
// 好處是數據不必寫兩遍，此後新增條目自動雙向可達。
const RL={},RC={};
D.forEach(d=>{
  (d.l||[]).forEach(x=>{(RL[x]=RL[x]||[]).push(d.n)});
  (d.contrast||[]).forEach(c=>{(RC[c.n]=RC[c.n]||[]).push({n:d.n,why:c.why})});
});
function relOf(d){
  const fwd=d.l||[],seen=new Set(fwd),add=[];
  (RL[d.n]||[]).forEach(x=>{if(x!==d.n&&!seen.has(x)){seen.add(x);add.push(x);}});
  return fwd.concat(add);
}
function contrastOf(d){
  const fwd=d.contrast||[],seen=new Set(fwd.map(c=>c.n)),add=[];
  (RC[d.n]||[]).forEach(c=>{if(c.n!==d.n&&!seen.has(c.n)){seen.add(c.n);add.push(c);}});
  return fwd.concat(add);
}

let TAB="最新";

function renderTL(){
  return;
  const q=document.getElementById('q').value.toLowerCase();
  const list=D.map((d,i)=>Object.assign({_i:i},d)).filter(d=>
    (TAB==="全部"||TAB==="最新"||d.c===TAB) &&
    (!q||[d.n,d.w,d.c,d.e,d.d].some(x=>x.toLowerCase().includes(q)))
  );
  document.getElementById('ct').textContent=`共 ${list.length} 位`;
  const wrap=document.getElementById('tl-wrap');
  if(TAB==="最新"){
    const items=list.slice().sort((a,b)=>b._i-a._i);
    wrap.innerHTML=`<div class="era-block">
<div class="era-head">
  <div class="era-label">按收錄順序 · 最新在前</div>
  <span class="era-count">${items.length}位</span>
  <div class="era-line"></div>
</div>
<div class="era-cards">
  ${items.map(d=>`<a class="tl-card" href="/tw/i/${encodeURIComponent(slugOf(d.n))}/">
    <div class="tl-year">${d.e}</div>
    <div class="tl-name">${d.n}</div>
    <span class="tl-word">${d.w}</span>
  </a>`).join('')}
</div>
</div>`;
    return;
  }
  wrap.innerHTML=ERAS.map(era=>{
    const items=list.filter(d=>d.y>=era.min&&d.y<era.max).sort((a,b)=>a.y-b.y);
    if(!items.length)return'';
    return`<div class="era-block">
<div class="era-head">
  <div class="era-label">${era.label}</div>
  <span class="era-count">${items.length}位</span>
  <div class="era-line"></div>
</div>
<div class="era-cards">
  ${items.map(d=>`<a class="tl-card" href="/tw/i/${encodeURIComponent(slugOf(d.n))}/">
    <div class="tl-year">${d.e}</div>
    <div class="tl-name">${d.n}</div>
    <span class="tl-word">${d.w}</span>
  </a>`).join('')}
</div>
</div>`;
  }).join('');
}
