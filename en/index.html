<style>
:root{
  color-scheme:light only;
  --white:#fffdf8;--paper:#f7f4ec;--paper2:#efe8dc;
  --ink:#1c1917;--ink-70:#3a342f;--ink-50:#6b6358;--ink-30:#9a9184;
  --up:#9d2933;--sulfur:#f0ddd9;--up-bg:rgba(157,41,51,.12);
  --down:#9d2933;--down-bg:rgba(157,41,51,.10);
  --line:rgba(42,46,44,.08);--line-strong:rgba(42,46,44,.12);--line-2:rgba(42,46,44,.045);
  --tint:rgba(42,46,44,.03);--tint-hover:rgba(42,46,44,.055);
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-out-quart:cubic-bezier(0.25,1,0.5,1);
  --ease-spring:cubic-bezier(0.34,1.4,0.64,1);
  --dur-tap:100ms;--dur-fast:150ms;--dur-base:200ms;--dur-slow:260ms;
  --shadow-card:0 0 0 1px var(--line),0 1px 2px rgba(42,46,44,.04),0 4px 12px rgba(42,46,44,.02);
  --shadow-card-hover:0 0 0 1px var(--line-strong),0 2px 4px rgba(42,46,44,.05),0 8px 24px rgba(42,46,44,.05);
  --shadow-focus:0 0 0 3px rgba(42,46,44,.16);
  --glass-chrome:rgba(240,240,236,.72);--glass-light:rgba(250,250,247,.85);
  --r1:8px;--r2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-optical-sizing:auto;line-height:1.55;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 96px}

/* skip-link + focus */
.skip-link{position:absolute;left:12px;top:-52px;z-index:100;padding:8px 16px;background:var(--ink);color:var(--white);border-radius:6px;font-size:13px;font-weight:600;text-decoration:none;transition:top var(--dur-base) var(--ease-out-quart)}
.skip-link:focus{top:12px;outline:none}
:focus-visible{box-shadow:var(--shadow-focus);outline:none;border-radius:5px}

/* masthead — glass sticky */
/* unified brand lockup — match entry pages / yuansheng */
/* responsive lockup */
/* 页头的字号/尺寸/左右内距由 assets/hw-home-lockup.css 以 !important 统一接管，
   这里再写一遍不会生效（曾经写过，DESIGN.md 也照抄成了规范）。下面只保留
   lockup 没管的属性：white-space。改页头请改 hw-home-lockup.css。
   小屏左右留白 24px 是选定的宽松版，不是漏改——原来那条 16px 的对比图看过后
   决定不采用，别再补回来。见 DESIGN.md §7「留白宽松是选定的」。 */
@media(max-width:720px){
  .brand-lockup{align-items:flex-start}
  .hd-title{white-space:nowrap}
  .hd-en{margin:0;font-size:12.5px}
}
@media(max-width:480px){
  .hd-title{white-space:normal}
}

.hd{position:relative;z-index:50;margin:0 0 28px;padding:clamp(36px,6vw,64px) 0 22px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.hd::after{display:none}
.brand-lockup{display:flex;align-items:flex-start;gap:14px;text-decoration:none;color:inherit;margin:0 0 14px}
.brand-lockup:hover{color:inherit}
.brand-logo{width:44px;height:44px;border-radius:11px;flex:none;box-shadow:0 1px 0 rgba(28,25,23,.06)}
.brand-copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.hd-title{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:clamp(22px,4.2vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hd-title .dot{color:#9d2933}
.hd-en{font-size:13.5px;color:var(--ink-50);letter-spacing:0;font-weight:400;margin:0}
.hd-row{display:none}
.hd .brand{display:none}
@media(max-width:600px){
  .wrap{padding:0 24px 8px}
  .hd{margin:0 0 22px;padding:22px 0 8px}
  .hd-en{margin-left:0}
}

.hd{position:sticky;top:0;z-index:50;margin:0 -24px 26px;padding:26px 24px 15px;background:var(--glass-chrome);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.hd::after{content:'';position:absolute;left:24px;right:24px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(42,46,44,.10),transparent)}
.brand{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-50);margin-bottom:11px}
.hd-row{display:flex;align-items:baseline;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.hd-title{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hd-en{font-size:13px;color:var(--ink-50);letter-spacing:-.005em;font-weight:400}
.hd-stats{display:none}.share-btn{font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--white);color:var(--ink);cursor:pointer}.share-btn:active{transform:scale(.97)}
.stat{font-size:12px;color:var(--ink-50);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:160px;padding:9px 14px;border:none;border-radius:var(--r1);background:var(--white);box-shadow:var(--shadow-card);color:var(--ink);font-size:14px;font-family:inherit;transition:box-shadow var(--dur-base) var(--ease-out-quart)}
#q:focus{outline:none;box-shadow:var(--shadow-card-hover)}
#q::placeholder{color:var(--ink-30)}
.ctxt{font-size:12px;color:var(--ink-50);white-space:nowrap;font-variant-numeric:tabular-nums}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.tab{padding:6px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;background:var(--white);color:var(--ink-70);box-shadow:0 0 0 1px var(--line);transition:color var(--dur-fast) var(--ease-out-quart),background var(--dur-fast) var(--ease-out-quart),box-shadow var(--dur-fast) var(--ease-out-quart);white-space:nowrap;user-select:none}
.tab.on{background:var(--ink);color:var(--white);box-shadow:none}
@media (hover:hover) and (pointer:fine){.tab:not(.on):hover{color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}}

/* timeline */
.era-block{margin-bottom:34px}
.era-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.era-label{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--ink-50);white-space:nowrap;padding:3px 10px;border-radius:20px;background:var(--tint);font-variant-numeric:tabular-nums}
.era-count{font-size:10px;color:var(--ink-30);white-space:nowrap;font-variant-numeric:tabular-nums}
.era-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(42,46,44,.10),transparent)}
.era-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tl-card{padding:13px 14px;border-radius:12px;background:var(--white);box-shadow:var(--shadow-card);cursor:pointer;transition:box-shadow var(--dur-base) var(--ease-out-quart);text-decoration:none;color:inherit;display:block}
.tl-year{font-size:10px;color:var(--ink-30);margin-bottom:5px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tl-name{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:8px;line-height:1.25}
.tl-word{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--up-bg);color:var(--up);display:inline-block;font-weight:600}
@media (hover:hover) and (pointer:fine){.tl-card:hover{box-shadow:var(--shadow-card-hover)}}
.empty{padding:56px;text-align:center;color:var(--ink-30);font-size:14px}

/* overlay + panel */
.ov{display:none !important;position:fixed;inset:0;background:rgba(42,46,44,.32);z-index:300;overflow-y:auto;padding:40px 16px 80px;display:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.ov.open{display:block}
.panel{background:var(--white);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 12px 48px rgba(42,46,44,.14);max-width:660px;margin:0 auto;padding:36px 40px;position:relative;animation:panel-in var(--dur-slow) var(--ease-out-expo);transform-origin:center top}
@keyframes panel-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.p-x{position:absolute;top:18px;right:18px;cursor:pointer;font-size:15px;color:var(--ink-50);background:var(--tint);border:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background var(--dur-fast),color var(--dur-fast)}
@media (hover:hover) and (pointer:fine){.p-x:hover{color:var(--ink);background:var(--tint-hover)}}
.p-cat{font-size:10px;color:var(--up);font-weight:600;text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px}
.p-name{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px;line-height:1.1}
.p-era{font-size:13px;color:var(--ink-50);margin-bottom:18px;font-variant-numeric:tabular-nums}
.word-row{margin-bottom:20px}
.wpill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--up-bg);color:var(--up)}
.p-desc{font-size:15px;color:var(--ink-70);line-height:1.75;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.sec{font-size:10px;font-weight:600;color:var(--ink-50);text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px;margin-top:26px}
.story-box{padding:14px 16px;border-left:2px solid var(--sulfur);background:var(--tint);border-radius:0 var(--r1) var(--r1) 0;font-size:14px;color:var(--ink-70);line-height:1.75}
.fw-list{display:flex;flex-direction:column;gap:8px}
.fw{padding:12px 15px;border-radius:var(--r1);background:var(--tint)}
.fw-n{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:5px}
.fw-d{font-size:13.5px;color:var(--ink-70);line-height:1.7}
.fw-eg{font-size:12.5px;color:var(--ink-50);margin-top:8px;padding:7px 11px;background:var(--white);border-radius:6px;line-height:1.6}
.q-item{font-size:14px;color:var(--ink-70);line-height:1.7;padding:6px 14px;border-left:2px solid var(--line-strong);margin:6px 0;font-style:italic}
.apply-box{padding:14px 16px;border-radius:var(--r1);font-size:13.5px;color:var(--ink-70);line-height:1.7;background:var(--up-bg)}
.fail-box{padding:14px 16px;border-left:2px solid var(--down);background:var(--down-bg);border-radius:0 var(--r1) var(--r1) 0;font-size:13.5px;color:var(--ink-70);line-height:1.75}
.lesson-list{display:flex;flex-direction:column;gap:7px}
.lesson-item{font-size:13.5px;color:var(--ink-70);line-height:1.7;padding:9px 13px;border-left:2px solid var(--down);background:var(--down-bg);border-radius:0 var(--r1) var(--r1) 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12px;padding:4px 11px;border-radius:20px;color:var(--ink-70);background:var(--tint);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast)}
@media (hover:hover) and (pointer:fine){.chip:hover{background:var(--tint-hover);color:var(--ink)}}
.contrast-list{display:flex;flex-direction:column;gap:8px}
.contrast-item{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r1);background:var(--tint);cursor:pointer;transition:background var(--dur-fast);align-items:flex-start}
@media (hover:hover) and (pointer:fine){.contrast-item:hover{background:var(--tint-hover)}}
.contrast-name{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;padding-top:1px}
.contrast-arrow{font-size:12px;color:var(--ink-30);white-space:nowrap;padding-top:2px}
.contrast-why{font-size:12.5px;color:var(--ink-70);line-height:1.6;flex:1}


/* mobile */
@media(max-width:600px){
  .wrap{padding:0 24px 8px}
  .hd{margin:0 0 24px;padding:22px 0 14px}
  .hd::after{left:16px;right:16px}
  .hd-title{font-size:17px}
  .panel{padding:26px 20px;border-radius:14px}
  .p-name{font-size:25px}
  .era-cards{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}

/* accessibility triple */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (prefers-reduced-transparency:reduce){.hd{background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none}.ov{-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){.hd{border-bottom:1px solid var(--ink-70)}.tl-card,.panel{box-shadow:0 0 0 1px var(--ink-70)}}

/* ── Line of the day卡（OurWord 素纸浓墨 · 沉朱印 / 汇文明朝体） ────────────────── */

.dq{display:flex;gap:28px;align-items:center;margin:0 0 30px}
.dq-card{position:relative;flex:0 0 auto;width:320px;aspect-ratio:3/4;overflow:hidden;
  background:#f7f4ec;box-shadow:0 8px 32px rgba(0,0,0,.45)}
.dq-card canvas{display:block;width:100%;height:100%}
.dq-card.fade canvas{animation:dqfade .26s var(--ease-out-quart)}
@keyframes dqfade{from{opacity:0}to{opacity:1}}
.dq-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dq-side{flex:1 1 auto;min-width:0}
.dq-hdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dq-eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--ink-50)}
.dq-date{font-size:13px;color:var(--ink-30);font-variant-numeric:tabular-nums}
.dq-from{margin-top:14px;font-size:14px;color:var(--ink-70);line-height:1.7}
.dq-cat{font-size:13px;color:var(--ink-50);margin-top:3px}
.dq-note{margin:14px 0 0;font-size:14px;line-height:1.85;color:var(--ink-70);max-width:46em;
  padding-left:13px;border-left:2px solid var(--line-strong)}
.dq-link{background:none;border:none;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;
  border-bottom:1px solid var(--line-strong);transition:border-color var(--dur-fast) var(--ease-out-quart)}
.dq-link:hover{border-bottom-color:var(--ink)}
.dq-acts{display:flex;gap:8px;margin-top:20px}
.dq-sep{width:9px}
.dq-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line-strong);
  background:var(--white);color:var(--ink-70);border-radius:var(--r1);cursor:pointer;
  transition:transform var(--dur-tap) var(--ease-out-quart),background var(--dur-fast) var(--ease-out-quart),color var(--dur-fast) var(--ease-out-quart),border-color var(--dur-fast) var(--ease-out-quart)}
.dq-btn:hover{background:var(--tint-hover);color:var(--ink);border-color:var(--ink-30)}
.dq-btn:active{transform:scale(.97)}
.dq-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dq-toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:120;
  background:var(--ink);color:var(--white);font-size:13px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-out-quart),transform var(--dur-base) var(--ease-out-quart)}
.dq-toast.on{opacity:1;transform:translate(-50%,0)}
.dq-ov{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.88);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.dq-ov.on{display:flex}

   还是零——恢复到哪都一样，结果就是回到顶部，读者得重新翻一遍。
   所以自己记：点进任何一张卡之前，把当前页签和位置存进 sessionStorage；
   回来渲染完再放回去，然后**立刻清掉**——只有「返回」该恢复，重新打开
   Home不该。 */
var HWX_POS='hwx_feed_pos';
addEventListener('pagehide',function(){
  try{sessionStorage.setItem(HWX_POS,JSON.stringify({t:TAB,y:scrollY}))}catch(e){}
});
(function(){
  var raw=null;
  try{raw=sessionStorage.getItem(HWX_POS);sessionStorage.removeItem(HWX_POS)}catch(e){}
  if(!raw)return;
  var st=null; try{st=JSON.parse(raw)}catch(e){}
  if(!st||!st.y)return;
  /* 只有真的是「返回」才恢复：导航类型是 back_forward，或者上一页就是本站。
     重新在地址栏打开Home时不该跳到半截。 */
  var nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{};
  var back=nav.type==='back_forward'||(document.referrer&&document.referrer.indexOf(location.origin)===0);
  if(!back)return;
  /* 必须等 load 之后再放：页面启动时还会自己调一次 switchTab('境')
     （处境层的初始化），在 rAF 里恢复的话页签会被它盖回去 ——
     实测位置恢复对了、页签却停在「处境」，而存的是「全部」。 */
  /* 恢复页签靠**点那个按钮**，不靠比较 TAB。页面上有不止一个叫 TAB 的
     变量（另一处的值是「最新」，而按钮的 data-t 是「新/全/境」），拿它
     比较永远对不上；点按钮走的是和用户完全一样的那条路径。
     再往后推一档（load 之后再 60ms）：启动时and 一次 switchTab('境')，
     早了会被它盖回去 —— 实测位置恢复对了、页签却停在「处境」。 */
  addEventListener('load',function(){setTimeout(function(){
    if(st.t){
      var b=document.querySelector('#hwx-tabs2 button[data-t="'+st.t+'"]');
      if(b&&!b.classList.contains('on'))b.click();
    }
    scrollTo(0,st.y);
  },60)});
})();
/* 搜索原来两个毛病叠在一起。
   一是逐字子串（data-t.indexOf(v)），差一个字就 0 条：搜「我很难受」出 0，
   可站里的问句是「这件事为什么让我这么难受？」。
   二是范围只覆盖「全部」里的条目和Lines to keep卡——112 个处境、521 questions
   压根没进索引，所以搜「突然没了工作」（处境名逐字）也是 0，
   而那个处境下面挂着 8 questions。
   读者进这个站的方式恰恰是用自己的话说处境，最该管用的那类输入全废了。

   改成和悬浮球同一套：二元组 + IDF 加权。稀有的词才是查询的意思所在——
   「的人」在几百张卡里都有，「裁员」只在一两张里有，两者不能同权。
   而且真的按分数排序，不再让 DOM 顺序决定谁在前面。
   处境问题在有查询时一并搜、一并排。 */
function _bg(t){var g={},i;for(i=0;i<t.length-1;i++)g[t.slice(i,i+2)]=1;return g}
var _IDF=null;
function _idf(){
  if(_IDF)return _IDF;
  var df={},docs=[],i;
  feed.querySelectorAll('.pc,.xtra').forEach(function(c){docs.push(c.getAttribute('data-t')||'')});
  for(i=0;i<scText.length;i++)docs.push(scText[i]);
  docs.forEach(function(d){var g=_bg(d);for(var k in g)df[k]=(df[k]||0)+1});
  _IDF={df:df,n:docs.length,dflt:Math.log(docs.length+1)};
  return _IDF;
}
function _score(hay,vg){
  var d=_idf(),s=0;
  for(var k in vg){
    if(hay.indexOf(k)<0)continue;
    var c=d.df[k];
    s+= c?Math.log((d.n+1)/(1+c)):d.dflt;
  }
  return s;
}
function applyFeed(){
  if(!feed||!ct)return;
  var v=(document.getElementById('q')||{value:''}).value.trim().toLowerCase();
  var vg=_bg(v),vn=0,_k;for(_k in vg)vn++;
  var full=vn?_score(v,vg):0;          /* 整条查询自己的权重之和，当阈值的基准 */
  /* 两条判据取「或」。按占比会漏掉一类：搜「我很难受」，站里的问句是
     「这件事为什么让我这么难受？」——只对上「难受」一组，占比不够，
     可「难受」本身在全站只出现在很少几张卡里，它就是这句查询的意思所在。
     所以再加一条绝对权重：命中一个足够稀有的词，就够了。 */
  var need=full*0.32;
  /* 只对短查询放宽。长查询本来就有足够多的组，占比是可靠的；
     再叠一条绝对权重，「一个能约的人都没有」会从 30 条涨到 151 条——
     排序还是对的，但后面全是噪音。 */
  var rare=(vn<=4)?2.6:Infinity;
  var qres=document.getElementById('hwx-qres');
  if(!qres){qres=document.createElement('div');qres.id='hwx-qres';qres.className='scfeed';feed.parentNode.insertBefore(qres,feed);}
  if(!v){
    qres.innerHTML='';qres.style.display='none';
    var _n0=document.getElementById('hwx-none'); if(_n0)_n0.style.display='none';
    var vis0=0;
    feed.querySelectorAll('.pc').forEach(function(c){
      var ok=(CAT==='All'||c.getAttribute('data-c')===CAT);
      c.classList.toggle('hid',!ok);if(ok)vis0++;});
    feed.querySelectorAll('.xtra').forEach(function(c){
      var ok=(CAT==='All');c.classList.toggle('hid',!ok);if(ok)vis0++;});
    ct.textContent=vis0+' entries';
    return;
  }
  /* 条目卡和Lines to keep卡：打分、隐藏低分的、按分数重排 */
  var keep=[];
  feed.querySelectorAll('.pc,.xtra').forEach(function(c){
    var isPc=c.classList.contains('pc');
    var inCat=isPc?(CAT==='All'||c.getAttribute('data-c')===CAT):(CAT==='All');
    var hay=c.getAttribute('data-t')||'';
    var sc=(hay.indexOf(v)>=0)?full+1:_score(hay,vg);
    var ok=inCat&&sc>0&&(sc>=need||sc>=rare);
    c.classList.toggle('hid',!ok);
    if(ok)keep.push([sc,c]);
  });
  keep.sort(function(a,b){return b[0]-a[0]});
  keep.forEach(function(p){feed.appendChild(p[1])});
  /* 处境里的问题：只在有查询时出现，排在条目前面——
     用自己的话搜处境的人，要的是「有人 asked这件事」，不是一张人物名片。 */
  var hits=[];
  for(var i=0;i<scText.length;i++){
    var t=scText[i];
    var sc2=(t.indexOf(v)>=0)?full+1:_score(t,vg);
    if(sc2>0&&(sc2>=need||sc2>=rare))hits.push([sc2,i]);
  }
  hits.sort(function(a,b){return b[0]-a[0]});
  hits=hits.slice(0,12);
  qres.innerHTML=hits.map(function(p){return scCells[p[1]]}).join('');
  qres.style.display=hits.length?'':'none';
  ct.textContent=(keep.length+hits.length)+' entries';
  /* 一条都没有的时候得说话。原来是整片空白——读者分不清是搜不到还是页面坏了。
     另外两个站都有这句（「没有匹配的，换个词试试」「没有匹配的Deep read」），只有这儿没有。
     出路指向处境：用自己的话搜不到，多半是词不对，而处境是按人话写的。 */
  var none=document.getElementById('hwx-none');
  if(!none){none=document.createElement('div');none.id='hwx-none';none.style.display='none';feed.parentNode.insertBefore(none,feed);}
  if(keep.length+hits.length===0){
    none.innerHTML='<b>Nothing found for “'+esc(v)+'」</b>'
      +'<i>Try saying it another way — or pick your own from the situations below.</i>'
      +'<button type="button" id="hwx-none-go">Pick a situation →</button>';
    none.style.display='';
    var g=document.getElementById('hwx-none-go');
    if(g)g.onclick=function(){
      var qi=document.getElementById('q'); if(qi)qi.value='';
      SCSEL=''; SCGRP=''; switchTab('境'); applyFeed(); scBuild(); scRender(); scReveal();
      var el=document.getElementById('hwx-tabs2');
      if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'start',behavior:'smooth'})}catch(e){}
    };
  }else{none.style.display='none';}
}
/* 搜索框接管 */
var qin=document.getElementById('q');
if(qin){qin.oninput=null;
  /* 搜索落空记录：这是三个埋点里最值钱的一个——用户搜了什么、我们没有，
     直接告诉我们该补什么内容，比坐着推理准得多。
     只在停止输入 1.2 秒后发一次，避免把「睡」「睡不」「睡不着」都记下来。 */

    else{applyFeed();}
    clearTimeout(_mt);

      if(n===0) trk('search_miss',{term:v.slice(0,40)});
      else trk('search_hit',{term:v.slice(0,40), results:n});
    },1200);
  });}
/* 初始化 */
/* 一行入口：点它切到「处境」tab，不再就地展开 1049px 的标签目录 */
(function(){
  var line=document.getElementById('hwx-scline');

    switchTab('境');

})();
/* 问题卡整块可点。条目卡（.nc）和人物卡（.pc）本来就是一整个 <a>，只有问题卡
   是 div 套一个链接——读者点在卡片别处没反应，等于每张卡有一小片能点、一大片不能。
   委托到 feed 上：点在真链接上走原生跳转，点在卡片别处就跳这张卡唯一那个去处。 */
['hwx-ncfeed','hwx-feed','hwx-scfeed'].forEach(function(id){
  var el=document.getElementById(id); if(!el)return;

    if(e.target.closest('a'))return;

    var a=card.querySelector('a[href^="/en/i/"]'); if(!a)return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
    a.click();
  });
});
/* 卡片点击：用委托，三个 feed 一处覆盖。只记卡片类型和去向，不记内容。 */
['hwx-ncfeed','hwx-feed','hwx-scfeed'].forEach(function(id){
  var el=document.getElementById(id); if(!el)return;
  el.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="/en/i/"]'); if(!a)return;
    var card=e.target.closest('.pc,.nc,.qc,.kc');
    var kind=card?(card.classList.contains('kc')?'question':
              card.classList.contains('qc')?'quote':
              card.classList.contains('nc')?'chapter':'person'):'other';
    trk('card_click',{card_type:kind, feed:id.replace('hwx-',''), dest:a.getAttribute('href')});
  },true);
});
/* 处境层展开区的答案点击 */
(function(){
  var r=document.getElementById('hwx-res'); if(!r)return;
  r.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="/en/i/"]'); if(!a)return;
    trk('card_click',{card_type:'situation_answer', feed:'res', dest:a.getAttribute('href')});

})();
/* Today's question的答案点击 */
(function(){

switchTab('境');
})();</script>

and you win half; know neither and you lose every time. Most people read this as reconnaissance. Half of it is about you.", "eg": "He had the competitor's roadmap and no honest number for how long his own team actually takes. That is the half that loses."}], "q": ["The victorious army wins first and seeks battle afterwards.", "Winning a hundred battles is not the height of skill. Subduing the enemy without fighting is.", "Know the other side and know yourself, and you will not be in danger in a hundred battles."], "apply": "Before the next thing you are about to launch, argue, or confront, write down what would have to be true for it to be already won. If none of it is true yet, you are not ready to start — you are ready to prepare.", "l": ["Han Feizi", "John Boyd", "Fan Li"], "contrast": [{"n": "John Boyd", "why": "Both put the decision before the clash. Sun Tzu settles it in preparation, Boyd in speed of turning"}]}, {"c": "How the world works", "n": "Tao Te Ching", "e": "Spring and Autumn · c. 500 BC", "w": "Subtract", "y": -500, "d": "Five thousand characters, and after the Bible the most translated book there is. Where most instruction is addition — learn more, do more, add another method — this one runs the other way. In learning you gain daily; in the way you lose daily, until there is nothing left to force, and then nothing is left undone.", "story": "Laozi rode west out of the pass on an ox, leaving a country he had given up on. The keeper of the pass stopped him and asked him to write something down before he went. He wrote five thousand characters and disappeared from the record. That is the whole biography, and the book is consistent with it: everything in it argues that the position of least insistence is the strong one.", "f": [{"n": "Reversal is how the way moves", "d": "Whatever reaches its extreme turns into its opposite. It is not consolation for bad times; it is a reading instrument. At the top, look for what is already turning. At the bottom, the same rule is working for you.", "eg": "The quarter everything was going right is the quarter nobody asked what would happen if the one channel bringing all the customers stopped."}, {"n": "Water beats stone by not arguing", "d": "The softest thing in the world runs through the hardest. Not passivity — water keeps going and takes the shape of whatever it meets. Persistence in a form that nothing can push back on outlasts a harder push that has to be sustained.", "eg": "Two years of quietly fixing the thing nobody owned moved more than the reorg that was announced twice and cancelled twice."}, {"n": "The empty part is the useful part", "d": "The wheel is useful because of the hole at the centre, the pot because of the space inside, the room because of the gaps where the doors and windows are. What you build gets the credit; what you left out is doing the work.", "eg": "The calendar with two empty afternoons is where the thinking happened. The full one produced attendance."}], "q": ["In learning you gain daily. In the way you lose daily.", "The softest thing in the world runs through the hardest.", "Knowing others is intelligence. Knowing yourself is clarity."], "apply": "Take the thing you are trying to fix by adding — another tool, another rule, another meeting — and ask what you would remove instead. Try the subtraction first; it is cheaper and it is reversible.", "l": ["Zhuangzi", "Huineng", "Su Shi"], "contrast": [{"n": "Zhuangzi", "why": "Same tradition, different address: Laozi writes for whoever has to govern, Zhuangzi for whoever wants out"}]}, {"c": "Money and risk", "n": "Warren Buffett", "e": "Contemporary · 1930–", "w": "The moat", "y": 1930, "d": "Sixty years of compounding, and a method simple enough to say in a sentence: buy a business with a durable advantage at a sensible price and then do nothing for a very long time. His real edge is not stock-picking. It is that he can sit still while other people cannot.", "story": "In 1973–74 the American market ntence why this thing will still be earning in ten years. If you cannot write the sentence, you are not buying a business; you are buying a price movement.", "l": ["Charlie Munger", "Li Ka-shing", "Fan Li"], "contrast": [{"n": "Charlie Munger", "why": "The partner who moved him from cheap and broken to good and fairly priced"}]}, {"c": "Starting and building", "n": "Steve Jobs", "e": "Contemporary · 1955–2011", "w": "Subtract", "y": 1955, "d": "Co-founded Apple, was pushed out of it, spent twelve years at NeXT and Pixar, came back and turned a company weeks from insolvency into the most valuable one in the world. The centre of his thinking is that simple is harder than complex, that focus is a word for refusal, and that design is how a thing works rather than how it looks.", "story": "In 1985 he lost a board fight and left the company he had started. He has said the twelve years that followed were the most creative of his life, and the arithmetic supports him: NeXT built the operating system Apple eventually bought to save itself, and Pixar changed what an animated film was. Neither was a detour back to Apple. Both were the thing itself, done properly, by someone who no longer had a large company's permission to worry about.", "f": [{"n": "Simplicity is expensive", "d": "Making something simple is not removing features until it is thin. It is understanding the thing well enough that the shape becomes obvious. That takes longer than adding, which is why most products are complicated: complication is what you ship when you ran out of time to understand.", "eg": "The settings screen with forty switches is not generous. It is a record of forty arguments nobody was willing to settle."}, {"n": "The product is every point of contact", "d": "He treated the box, the shop, the repair counter and the advertising as parts of the product, because the customer does not experience them separately. A company that is excellent in the object and careless at the counter has not made a good product; it has made a good component.", "eg": "Unboxing designed as a small ceremony does more for how the thing feels than another processor generation."}, {"n": "Belief is a resource, and it is borrowed", "d": "The famous distortion field was not a trick. People delivered work they did not believe possible because somebody credible refused to accept it was not. Used well it raises what a group thinks it can attempt; used badly it is a way of demanding miracles and blaming people for the shortfall.", "eg": "The same sentence, this has to be twice as fast, is either the best week a team ever had or the reason three of them leave. The difference is whether the person saying it is also in the room at two in the morning."}], "q": ["Simple can be harder than complex; you have to work to get your thinking clean.", "Focus means saying no to the hundred other good ideas that there are.", "Design is not just how it looks. Design is how it works."], "apply": "List everything you are currently working on and ask which half you would keep if you could only keep half. Then stop the other half today, and write down who is accountable for having stopped it.", "l": ["Peter Thiel", "Jeff Bezos", "Paul Graham"], "contrast": [{"n": "Jeff Bezos", "why": "Cut to four products; the other man expanded into everything and won too"}]}, {"c": "Starting and building", "n": "Elon Musk", "e": "Contemporary · 1971–", "w": "First principles", "y": 1971, "d": "Co-founder of PayPal, Tesla, SpaceX and Neuralink. The method is a single move repeated: go back to what is physically true and re-derive everything from there. When told a thing is impossible, his first question is whether physics forbids it. If not, impossible is a description of current engineering and current prices, and both of those are temporary.", "story": "2008 was the year it nearly ended. The first three Falcon 1 launches failed, Tesla could not fund production of the Roadster, and the money was gone. The fourth Falcon flew in September and reached orbit; the Tesla financing closed on Christmas Eve. He has said that if the fourth launch had failed there was nothing left for a fifth. The interesting part is not the survival. It is that the same method produced three catastrophic failures and then the thing nobody else had done, and there was no way to tell those apart from inside.", "f": [{"n": "Physics is law; the rest is advice", "d": "The limit of any technology is set by physical law, not by what the current industry can do. Working back from the physical limit rather than forward from today's practice changes what counts as an acceptable answer, and forces engineering that the incremental route never reaches.", "eg": "Asking how much lighter this can be given the material produces a different programme from asking how much lighter than last year's."}, {"n": "Most of the week should go into making the thing", "d": "He has said roughly eighty per cent of his time goes to engineering and design. That is a budget, not a boast: meetings without an output, reviews that only inform, and reporting that changes no decision are the default state of any organisation past a certain size, and they consume exactly the hours the product needed.", "eg": "Cancel the standing meeting for a month and see what actually breaks. Usually the answer is the feeling of being informed."}, {"n": "The method does not tell you when you are wrong", "d": "Reasoning up from fundamentals is equally confident when the fundamentals are misjudged, and it removes the handrail that convention provides. That is the real cost of it: no external check, and a strong internal one. It belongs on the few questions worth that exposure.", "eg": "The schedule derived from physics is right about what is possible and famously wrong about when. Both come from the same calculation."}], "q": ["Physics is the law. Everything else is a recommendation.", "We reason from first principles rather than by analogy.", "Try to be useful. Do things that are useful to other people."], "apply": "Next time something is described as impossible or as simply costing what it costs, ask what physical law or published price actually sets the floor. Everything between that floor and today's number is somebody's decision, and decisions can be remade.", "l": ["Peter Thiel", "Jeff Bezos", "Charlie Munger"], "contrast": [{"n": "Charlie Munger", "why": "Reduce to physics, or carry many borrowed models at once — two opposite cures for the same blindness"}]}, {"c": "Starting and building", "n": "Jeff Bezos", "e": "United States · 1964–", "w": "The flywheel", "y": 1964, "d": "Left a Wall Street job in 1994 to sell books out of a garage and built it into a two-trillion-dollar company across retail, cloud, logistics and hardware. He is the most extreme practitioner of the long term on record: twenty years of thin profit and open ridicule while every dollar went back into the flywheel, and then twenty years of winning.", "story": "In 1994 he was a vice-president at a New York hedge fund and wanted to leave and sell books online. His boss told him it was a good idea, but a better one for somebody who did not already have a good job. So he invented a way to decide: project yourself to eighty and look back — which choice would you regret? He knew at eighty he would not remember a bonus he gave up in 1994, and would mind very much never having been part of the internet at all. He resigned within days. What makes the frame sharp is that it changes the timescale of the question by force, and once the timescale moves the answer surfaces on its own.", "f": [{"n": "Regret minimisation", "d": "For decisions large enough to define a stretch of life, shift the vantage point to eighty. Short-term losses — salary, standing, safety — shrink automatically from there, and the things that turn out to matter, whether you tried, whether you were there, enlarge automatically. It is built for the fork between safe and unremarkable and risky and alive.", "eg": "The offer you keep re-reading at midnight is not a spreadsheet problem. Run it from eighty and it usually stops being close."}, {"n": "The flywheel is slow before it is fast", "d": "Lower prices bring customers, customers bring traffic, traffic brings sellers, scale lowers cost, and cost lowers prices again. No first step and no last one. The part people underestimate is the beginning, where it is heavy, exhausting and appears to do nothing — which is where almost everyone stops.", "eg": "Find the loop where each turn makes the next one easier, then accept that the first two years will look indistinguishable from failure."}, {"n": "Your margin is my opportunity", "d": "Every comfortable high margin in an industry is a door held open for an attacker. He compressed his own margins deliberately to leave nothing worth attacking. Turn it around as a self-check: whatever you are earning comfortably from is precisely what somebody is currently aiming at.", "eg": "The product line nobody wants to touch because it funds everything else is the one a competitor is already modelling."}], "q": ["Your margin is my opportunity.", "If you think three years out you have many competitors. Think seven and you have few.", "Failure and invention are inseparable twins."], "apply": "Sort your decisions by whether they can be undone: the reversible ones move fast and low, the irreversible ones get the meeting. Before starting anything new, write the press release you would publish on launch day — if you cannot make it exciting to a customer, do not start.", "l": ["Warren Buffett", "Elon Musk", "Steve Jobs"], "contrast": [{"n": "Steve Jobs", "why": "One cut the range to four; the other refused to stop adding — both were right about their own business"}]}, {"c": "Starting and building", "n": "Peter Thiel", "e": "Contemporary · 1967–", "w": "Zero to one", "y": 1967, "d": "Co-founded PayPal, was the first outside investor in Facebook, and is the most consequential contrarian in the Valley. His central claim: competition is an ideological trap, and what actually creates value is a monopoly rather than a fight.", "story": "In 2004 Facebook was a few months old and looked to most people like a social directory for Harvard undergraduates. He put in half a million dollars for a bit over ten per cent. By the 2012 listing that half million was worth around a billion. What he had seen was not that students liked it. It was that once a network of that shape closes, leaving costs the user everything and nothing else can be substituted for it — which is his definition of the only kind of business worth owning.", "f": [{"n": "Zero to one, not one to n", "d": "Going from one to n is copying: more of something that exists, in a crowd, at thin margins. Going from zero to one is making a category that was not there. Almost all commerce is the first kind. The second is rare, and when it works the value is not competed away because there is nobody to compete with yet.", "eg": "A better version of an existing product is a fight over an existing pool. A thing people had no word for last year is not."}, {"n": "The power law is not a slogan about focus", "d": "Venture returns are not normally distributed: a single investment can return more than everything else combined. The consequence is uncomfortable — spreading effort evenly for the sake of balance guarantees you miss the only outcome that mattered. Back the one you believe can be that, with everything.", "eg": "The portfolio designed so nothing can go badly wrong is also designed so nothing can go extraordinarily right."}, {"n": "Definite optimism", "d": "He divides views of the future by two axes: optimistic or pessimistic, definite or indefinite. His complaint about the present is indefinite optimism — a belief things will improve with no plan for how. Definite optimism is having an actual picture of the thing you intend to build, which is what makes long projects possible at all.", "eg": "We are excited about the space is indefinite. We are building this specific thing and it will take six years is definite, and only the second can be worked on today."}], "q": ["Competition is for losers.", "The best businesses are the ones that do not compete.", "What important truth do very few people agree with you on?"], "apply": "Run the question on yourself: what important thing do you believe that most people disagree with? If you can give a real answer with evidence behind it, that is where your advantage probably is. If you cannot, your judgement is currently the room's average.", "l": ["Steve Jobs", "Sun Tzu", "Warren Buffett"], "contrast": [{"n": "Paul Graham", "why": "One starts from the structure of the market, the other from the hundred people in front of you"}]}, {"c": "Starting and building", "n": "Paul Graham", "e": "United States · 1964–", "w": "Do things that do not scale", "y": 1964, "d": "A Lisp hacker who built Viaweb in 1995 — the first commercial software that ran inside a browser — and sold it to Yahoo in 1998. In 2005 he started Y Combinator and rewrote what early-stage investment looked like. His real influence is in several hundred essays: most of what now passes for startup common sense has its earliest and clearest statement in one of them.", "story": "Y Combinator began as a summer experiment with a deliberately strange shape: fund a whole batch at once, give each of them a small amount of money and three months, and have dinner with them every week. Every part of it was the opposite of how investment worked — small cheques, no track record required, founders as young as they came, decisions in a ten-minute interview. The batch was the point. Founders learn more from the company two tables over, at the same stage and similarly frightened, than from anybody with an office.", "f": [{"n": "Make something people want", "d": "It is the only thing on the wall at YC. His judgement after thousands of companies is that the fatal mistake is singular: building something nobody actually wanted. Everything else — the wrong hire, the wrong price, the bad quarter — is repairable.", "eg": "A team can survive being outbuilt. It cannot survive having been right about a need that was not there."}, {"n": "Schlep blindness", "d": "The best openings often sit behind work that is tedious and unglamorous — bank integrations, compliance, refunds. The mind skips over those ideas so quickly that you never notice having skipped. Which is exactly why they are still available.", "eg": "Everybody saw the market. The reason nobody took it is that the first nine months are paperwork."}, {"n": "A maker's day is not divisible", "d": "Managers work in hours, makers need whole blocks. A single meeting in the middle of an afternoon does not cost an hour; it costs the afternoon, because neither remaining piece is long enough to get into the work.", "eg": "Push every meeting to one end of the day. The output change is larger than any productivity system."}, {"n": "Better a few who love it", "d": "A hundred users who love the thing are worth more than ten thousand who find it acceptable. The first group tells you why, brings other people, and forgives the rough edges. The second leaves quietly and teaches you nothing.", "eg": "Chasing a satisfaction score upward across everyone is usually how a product becomes something nobody would miss."}], "q": ["There is one fatal mistake: building something nobody wants.", "Do things that do not scale. It is the only route to scale.", "Better to have a few people love you than many find you acceptable."], "apply": "In the cold-start phase do not build channels, buy traffic or automate. Find the first hundred users by hand and serve each one until they are happy; when that work is crushing you, that is the signal to scale. Test an idea on three questions: do I want it, can I build it, and why has nobody done it — no answer to the third usually means it is not worth doing, or you have not yet seen the tedium hiding in it.", "l": ["Peter Thiel", "Naval Ravikant", "Jeff Bezos", "Steve Jobs"], "contrast": [{"n": "Peter Thiel", "why": "Start from the users in front of you, or start from whether the market can ever hold a profit"}]}, {"c": "Starting and building", "n": "Naval Ravikant", "e": "Contemporary · 1974–", "w": "Leverage", "y": 1974, "d": "Co-founder of AngelList and an early investor in Twitter, Uber and Notion. In 2018 he posted a numbered thread called how to get rich without getting lucky, which has since been read millions of times. He is not a financial adviser. He is someone who worked out a route to personal sovereignty in a digital economy and then wrote the route down.", "story": "The thread was later compiled into a book by a reader, Eric Jorgenson, and released free — the whole text, downloadable, with Naval taking nothing from it. For a man whose entire subject is leverage, that is the argument made in the form of a decision rather than a sentence: a book that costs nothing travels further than one that earns, and reach compounds where royalties merely add. He gave away the thing most authors protect, because giving it away was the higher-leverage move.", "f": [{"n": "Four kinds of leverage, and two need permission", "d": "Labour means managing other people and requires leadership. Capital means money making money and requires having some. Code runs once written, at zero marginal cost. Media is read once written, at zero marginal cost. The first two need somebody's consent; the last two need nobody's, and that is historically new.", "eg": "The essay published tonight and the fund raised next spring carry the same idea. Only one of them can start tonight."}, {"n": "Wealth, money and status are three different games", "d": "Wealth is assets that work while you sleep and it is positive sum. Money is the instrument for moving wealth about. Status is your rank, and it is zero sum — for you to rise somebody falls. How much time goes into each decides which game you are actually in, whatever you say you are doing.", "eg": "A year spent on titles and a year spent on something that earns are indistinguishable while they are happening, and very distinguishable afterwards."}, {"n": "Happiness by subtraction", "d": "He argues happiness comes from removing desires rather than satisfying them: every unmet want is a standing source of unhappiness, so peace is not owning everything but no longer being pulled by what you do not own. He read a great deal of eastern philosophy and is restating an old line in a modern setting.", "eg": "The list of things that would finally make it fine has been rewritten four times, and each version was believed completely at the time."}], "q": ["Wealth is assets that earn while you sleep.", "If your income is measured in hours you will never truly be wealthy.", "Code and media are the permissionless leverage of this era."], "apply": "Ask which part of your work could be written once and used many times — code, writing, a process, a framework, a tool. Identify those and move your hours towards them, because everything else is priced by the hour and stops when you do.", "l": ["Peter Thiel", "Tao Te Ching", "Warren Buffett"], "contrast": [{"n": "Tao Te Ching", "why": "Both end at enough; one arrives through leverage, the other by never picking the load up"}]}, {"c": "Learning and growth", "n": "Charlie Munger", "e": "Contemporary · 1924–2023", "w": "Invert", "y": 1924, "d": "Buffett's partner for more than half a century, and the reason Berkshire stopped buying cheap broken companies and started buying good ones at fair prices. His own contribution is a method rather than a portfolio: work out how a thing fails, then don't do that.", "story": "Invited to give a commencement address at Harvard Law, he told the graduating class he would explain how to guarantee a miserable life, and then listed the ways: unreliability, envy, resentment, learning only from your own experience, giving up after the first reverse. It is the method demonstrated on itself. If you knew where you were going to die, he liked to say, you would simply never go there.", "f": [{"n": "Invert, always invert", "d": "There are countless routes to a thing going well and only a handful of ways it reliably goes wrong. Listing the failure modes and avoiding them is a shorter, more tractable problem than working out how to win.", "eg": "Nobody could say what would make the launch succeed. Everyone could name the three things that would sink it, and two were already true."}, {"n": "One hammer is not enough", "d": "To a man with only a hammer everything looks like a nail. He collected models from other fields — compounding from mathematics, critical mass from physics, selection from biology, the standard biases from psychology — because a problem rarely arrives in the shape of your one discipline.", "eg": "The retention problem was not a product problem. It was a queueing problem, and nobody in the room had ever been handed that model."}, {"n": "Look at the incentive first", "d": "Show me the incentive and I will show you the outcome. To understand why a system produces what it produces, do not start with what people say they value; start with what they are paid, promoted and forgiven for.", "eg": "The review process rewarded shipping. Nobody was ever promoted for deleting a feature, so the surface grew every year and nobody had decided that."}], "q": ["It is remarkable how much long-term advantage we have got by trying to be consistently not stupid.", "Knowing what you don't know is more useful than being brilliant.", "Spend each day trying to be a little wiser than you were when you woke up."], "apply": "Take the plan you are about to commit to and spend twenty minutes writing only the ways it fails. Then check how many are already true. That list is more useful than the plan.", "l": ["Warren Buffett", "Han Feizi", "John Boyd"], "contrast": [{"n": "Warren Buffett", "why": "Same desk for fifty years: Buffett holds the temperament, Munger supplies the checklist of ways to be wrong"}]}, {"c": "Mind and feeling", "n": "Su Shi", "e": "Northern Song · 1037–1101", "w": "Unbowed", "y": 1037, "d": "One of the great Chinese poets, and also a calligrapher, a painter, a hydraulic engineer, a cook and a provincial governor. He was banished three times, each further than the last, and got steadily more open-hearted as it happened — not enduring the worst circumstances of his life but finding the best of himself inside them. Almost everything he is remembered for was written after his career ended.", "story": "It is worth knowing the range before the philosophy. The same man who wrote the most quoted lines in the language dredged the West Lake at Hangzhou and built a causeway across it that still carries his name; set up what may be China's first public clinic; campaigned to stop infant drowning in Huangzhou; lived on the city wall during a flood at Xuzhou saying that while he was there the water would not take the city; and left recipes. None of that is decoration on the poetry. It is the same disposition doing different work.", "f": [{"n": "The openness has a structure", "d": "It wasn't a temperament he was born with. His writing records the sequence: the blow lands, there is a long stretch of real pain, attention turns inward, the present moment turns out to be full, and only then the release. He didn't skip to serenity. He walked through the middle.", "eg": "Two people laid off the same week. One posts about the fresh start on day three and is still hollow in month six; the other is wretched for a month, then starts."}, {"n": "The constraint produced the work", "d": "His three years in Huangzhou produced the two Red Cliff rhapsodies and his best-known lyrics. Having lost the ability to change anything outside himself, he was left with what he could still do — and that turned out to be the most concentrated output of his life.", "eg": "The book got written the year the funding fell through, because there was nothing left to run and the writing was the only thing still in his hands."}, {"n": "He lost the politics and won everything else", "d": "He opposed the reformers' new laws, then opposed the conservatives when they abolished all of them. He held to the measure rather than the side, and both sides exiled him for it. In the political record he is a failure. A thousand years later he is the one people quote.", "eg": "The one who wouldn't sign either faction's memo got passed over twice, and is the person both sides quote when they explain what went wrong."}], "q": ["A bamboo stick and straw sandals beat a horse. Who's afraid?", "Looking back at that bleak road — no wind, no rain, no sun.", "Where the heart is at rest, that is my home."], "apply": "Next time you're overruled, shelved, or watching something fail, try treating the stretch that follows as an enforced turn inward. The best thinking and the best work often happen in the period when there is nothing to administer.", "l": ["Wang Yangming", "Fan Li", "Zhuangzi"], "contrast": [{"n": "Zhuangzi", "why": "Two ways of not being owned: Zhuangzi refuses the post, Su Shi takes it and refuses to be defined by losing it"}, {"n": "C.S. Lewis", "why": "Both wrote through the worst of it. Lewis to find out what he actually believed, Su Shi to find out what was still enjoyable"}]}, {"c": "Mind and feeling", "n": "Wang Yangming", "e": "Ming · 1472–1529", "w": "Knowing is doing", "y": 1472, "d": "A philosopher who was also the most effective general of his generation — an almost unheard-of combination. His central claim is that the principle you are looking for is not out in the things of the world but in the mind that meets them, and that anyone who says they know something and doesn't act on it has not yet understood it. He is the origin of most of what later East Asia means by practical philosophy.", "story": "In 1506 he offended a powerful eunuch, was beaten in open court and exiled to Longchang in Guizhou — a malarial posting on the edge of the empire where he had to build his own shelter and grow his own food. The officials sent there mostly died. He had a stone coffin made and slept beside it, on the reasoning that the only thing he had not yet let go of was the fear of dying. One night he woke shouting. The way of the sage is complete within my own nature — he had spent twenty years looking outside for something that was not out there.", "f": [{"n": "The mind is the principle", "d": "The meaning and value of a thing arrive with the mind that meets it. Practically, this moves the standard: your judgement doesn't come from an external authority that has to be consulted before you may act.", "eg": "You already know the deck is dishonest. Waiting for someone senior to say it first is not caution; it is looking for a person to hold the judgement for you."}, {"n": "Knowing and doing are one", "d": "'I know I should get up early' from someone who never does is not knowledge, it's an idea about knowledge. Real knowing shows up in the body. This is the sentence he is most quoted for and the one most often quoted without being applied.", "eg": "'I know I should exercise' from someone who hasn't in a year is not knowledge. The knowing showed up in the ones who went twice this week."}, {"n": "The hardest campaign is interior", "d": "He never lost a battle, and wrote from the field that breaking the bandits in the hills is easy and breaking the ones in the heart is hard. What actually stops people is fear, laziness, vanity and self-deception — none of which appears on any plan.", "eg": "The plan was never the problem. Sending the email that admits the number was wrong is the whole difficulty, and no amount of planning touches it."}], "q": ["Breaking the bandits in the hills is easy. The ones inside aren't.", "When this mind does not move, you can move with the moment.", "Without a settled aim, nothing in the world gets finished."], "apply": "When a team knows what to do and doesn't do it, the problem is usually not execution. Either they don't actually believe it matters, or the incentives point elsewhere. Fix what they believe before you talk about delivery.", "l": ["Huineng", "Su Shi", "Zhuangzi"], "contrast": [{"n": "Huineng", "why": "The same insight in two traditions: Huineng says what you seek is already complete in you, Wang Yangming says so and then goes and governs a province with it"}]}, {"c": "Mind and feeling", "n": "Zhuangzi", "e": "Warring States · c. 369–286 BC", "w": "Free and equal", "y": -369, "d": "The second peak of Daoism, and a very different writer from Laozi. Where Laozi addresses the person who has to govern, Zhuangzi addresses the individual who wants out. He held one minor post and never took another, was poor enough to borrow rice, and turned down the premiership of a large state. His thirty-three chapters use parables to make one point: how to get your interior life back when reputation, argument and gain have tied it up.", "story": "He was fishing on the Pu river when two officials arrived from the king of Chu to offer him the government of the state. He didn't put the rod down. I hear, he said, that Chu keeps a sacred tortoise, dead three thousand years, wrapped in cloth and housed in the ancestral temple. Would that tortoise rather be dead and venerated, or alive and dragging its tail in the mud? Alive in the mud, they said. Then go away, said Zhuangzi. I intend to drag my tail in the mud. He refused the trade itself, not the job. Most of the strategists competing for those posts died in the resulting purges. He lived past eighty.", "f": [{"n": "The use of the useless", "d": "The tree too crooked to be timber is the one that reaches a thousand years. Things with no immediate use — a hobby that earns nothing, reading with no purpose, experience that won't fit a CV — are often what still holds when everything scheduled has been spent.", "eg": "The reading that earned nothing for six years is what made you the only person in the room who saw the second-order effect."}, {"n": "Cut along the grain", "d": "His cook's blade lasts nineteen years because it never meets bone, only the gaps between joints. Effort that meets resistance everywhere is usually not short of force. It is in the wrong place.", "eg": "The rewrite that ate three weekends went in on a Tuesday evening, once he stopped fighting the framework and used the hook it already had."}, {"n": "Whose standard is this", "d": "There is a right and wrong on that side and one on this side. What looks like stupidity from where you stand is generally coherent from where they stand. Holding several positions at once isn't fence-sitting; it's the thing that shrinks your blind spot.", "eg": "The team that moves too slowly is optimising for the outage you have never had. From where they sit, your speed is the reckless part."}], "q": ["Everyone knows the use of the useful. Nobody knows the use of the useless.", "A frog in a well can't discuss the sea. It is bound by its hole.", "The friendship of the wise is bland as water."], "apply": "In an environment where everyone is competing, the scarcest capacity is the ability not to enter. Before joining the race everyone else is running, ask whose right and wrong you are using. Keep a third of your time for things with no use — over a long enough horizon that is usually the best-performing position you hold.", "l": ["Su Shi", "Huineng", "Wang Yangming"], "contrast": [{"n": "Han Feizi", "why": "The same century, opposite conclusions: Han Feizi builds the machine of state, Zhuangzi declines to be a part in it"}]}, {"c": "Mind and feeling", "n": "Huineng", "e": "Tang · 638–713", "w": "Already complete", "y": 638, "d": "An illiterate woodcutter from the far south who became the sixth patriarch of Chan Buddhism. The record of his teaching is the only native Chinese text ever called a sutra. What he did was an extreme piece of subtraction: he took the practice out of the commentaries, the graded stages and the monastery, and reduced it to one sentence — the thing you are looking for is already in you, and the problem is that you keep looking outward.", "story": "Years after receiving the transmission he was still living unrecognised among a band of hunters. Arriving at last at a monastery, he found two monks arguing about a banner moving in the wind — one saying the wind moved, the other saying the banner moved. Neither the wind nor the banner is moving, he said. Your minds are moving. The abbot, hearing it, understood who had just walked in. The remark is not a riddle. It is his whole method in one line: before adjusting the object, check the thing doing the looking.", "f": [{"n": "Sudden doesn't mean fast", "d": "Gradual practice assumes distance from the goal and so requires accumulation. Sudden awakening says the distance was never there — only a misrecognition. So 'sudden' isn't speed. It is the discovery that there is nowhere to travel.", "eg": "Nothing new arrived the day she stopped apologising for the price. She had the same evidence in January; what changed was that she stopped waiting to deserve it."}, {"n": "No-thought is not blankness", "d": "It means a thought arises, you see it, and you neither follow it nor suppress it. This is the part of the text closest to something modern and operable — it describes keeping distance from a feeling rather than eliminating it.", "eg": "The urge to check the message is there either way. Watching it pass without opening the app is the practice; suppressing it is just a second urge."}, {"n": "Everything outward rests on 'I am not enough'", "d": "Books, teachers, the next achievement: every outward search is built on a premise nobody examines. He puts the premise itself in question, which is why this is the only subtraction in a library otherwise made of addition.", "eg": "Another course, another certificate, one more year of preparation. Each purchase quietly restates the premise that you are not ready yet."}], "q": ["There was never a thing there, so where would dust settle?", "Not the wind moving, not the flag moving. Your mind is moving.", "The teaching is in the world. Awakening is not apart from it."], "apply": "Almost all modern self-improvement is addition — one more book, one more course, one more streak — and the unstated premise is always that who you are now is insufficient. Next time something grips you, do one thing only: notice the thought, say 'there it is', and neither follow it nor scold yourself for having it. Most of the pain is in the long derivation that follows, not in the thought.", "l": ["Wang Yangming", "Zhuangzi", "Su Shi"], "contrast": [{"n": "Wang Yangming", "why": "Huineng is upstream: 'the nature is already complete' and 'innate knowing' are one idea in two vocabularies"}]}, {"c": "Money and risk", "n": "Fan Li", "e": "Spring and Autumn · 536–448 BC", "w": "When to go", "y": -536, "d": "The most successful exit in Chinese history. He spent more than twenty years helping the king of Yue climb from hostage to hegemon, and walked away on the day it was finished — changed his name, moved three times, and built a great fortune three times over, giving it away on each occasion. He is remembered both as a strategist and as the patron figure of Chinese commerce.", "story": "The part usually skipped is the twenty years before the exit. Yue had been crushed; its king was a servant in the enemy capital. Fan Li went with him and stayed through the whole of it, and the plan he ran was measured in decades, not seasons — grow the population, stock the granaries, keep the enemy complacent, and do not move early. The man famous for leaving at the right moment had first spent twenty years not leaving. Knowing when to go is not restlessness. It is the same faculty that knows when to stay.", "f": [{"n": "Read the person, not the situation", "d": "His judgement about the king wasn't 'this is dangerous now' but 'here is what this man becomes when things go well' — true long before it mattered. Situations change; the construction of a person doesn't.", "eg": "He was generous when the round closed and vicious when it didn't. That wasn't the market changing him; it was one man under two conditions."}, {"n": "Buy what nobody wants", "d": "In drought, stock boats; in flood, stock carts. The entire difficulty of the rule is that at the moment of buying, every visible piece of evidence says the thing is worthless.", "eg": "The hard part is not spotting the empty office block. It is signing the lease in the month every person you respect tells you the sector is finished."}, {"n": "Letting go is harder than accumulating", "d": "Three fortunes made and three given away, a chancellorship returned. Many people can accumulate. Almost nobody puts down a position already in hand and starts again.", "eg": "Plenty of people can build the team to forty. Almost nobody hands it over while it is still going well and starts again at one."}], "q": ["The birds are gone, so the good bow is put away.", "You can share hardship with him. You cannot share ease.", "In drought, stock boats. In flood, stock carts."], "apply": "At every stage of a career, ask periodically: is this relationship, or this job, still in the phase where I gain from it, or has it hit its ceiling and started accumulating risk? The second phase looks exactly like the first from inside.", "l": ["Li Ka-shing", "Su Shi"], "contrast": [{"n": "Li Ka-shing", "why": "Two and a half millennia apart, the same two rules: buy when nobody wants it, and leave before the top"}]}, {"c": "Money and risk", "n": "Li Ka-shing", "e": "Contemporary · 1928–", "w": "Cycles", "y": 1928, "d": "From a plastic flower workshop to a group spanning property, ports, telecoms, retail and energy. What is worth studying is not the scale but the survival: the 1967 riots, the 1997 Asian crisis and the 2008 crash all passed through Hong Kong without damaging him, on two rules he states plainly — buy counter-cyclically, and never run out of cash.", "story": "In 1967 Hong Kong was in the middle of riots. Bombs were being left in the streets, British firms were pulling out, and property prices collapsed. Everyone was selling. He was buying. Three years later the city had stabilised and his holdings were worth several times what he paid. The move looks like nerve and is mostly arithmetic: he had done the work of imagining how it could go wrong, and he had the cash to be wrong for a while.", "f": [{"n": "Counter-cyclical, in both directions", "d": "Buy in the trough, take money off the table at the peak. Land in the 1967 riots; a steady withdrawal from mainland property from the 2010s, roughly a decade before the consensus. Each time, acting before others noticed the turn.", "eg": "Hiring in the quarter everyone else froze feels like a mistake for eighteen months, which is exactly how long it has to feel wrong to still be cheap."}, {"n": "Never take the last coin", "d": "He exits before his own estimate of the top, giving up the final ten or twenty per cent in exchange for certainty. Wanting the last coin means selling only once everyone agrees the top has passed.", "eg": "You sold at eight and it went to ten. The twenty per cent you left behind is what bought you never having to guess where the top was."}, {"n": "Cash is oxygen", "d": "Large reserves at all times, accepting lower returns to keep liquidity. In 2008 several large groups ran out of funding. He didn't. Low gearing isn't caution — it buys more chances to be wrong.", "eg": "Six months of runway isn't caution. It is the number of times you get to be wrong before being wrong is fatal."}], "q": ["Never forget stability while growing; never forget growth while stable.", "Ninety per cent of my time, I spend considering failure.", "The first barrel must be solid before you add the second."], "apply": "Once a year, run a cash stress test: if your main income stopped for six months, how long would your reserves last? If the answer is under six months, start building the reserve now rather than after the answer matters.", "l": ["Fan Li"], "contrast": [{"n": "Fan Li", "why": "Both left before the top. Fan Li left the whole game; Li Ka-shing left one position and stayed in"}]}, {"c": "Power and organisation", "n": "Han Feizi", "e": "Warring States · 280–233 BC", "w": "Law, method, position", "y": -280, "d": "The systematiser of Chinese Legalism, who combined law, administrative method and positional authority into one theory of power. He is the most clear-eyed realist in the tradition — he never argues about how things ought to be, only about how they work — and his writing gave the first emperor the framework for unifying China.", "story": "He had a stammer and could not argue in person, so he wrote. His essays reached the king of Qin, who read them and said that if he could meet this man he would die content, then invaded Han to get him. At the Qin court Han Fei was undone by a fellow student from his own teacher's school, Li Si, who was jealous of him and spoke against him; he was imprisoned and forced to take poison. The man who wrote the definitive analysis of persuasion and court intrigue was killed by a piece of court intrigue. Knowing and being able to do it are not the same faculty.", "f": [{"n": "Law, method and position together", "d": "Law is the written rule everyone is held to; method is how you assess and check the people below you; position is the authority the seat itself carries. Missing the first, the rules get bypassed. Missing the second, you get compliance in form only. Missing the third, nobody listens.", "eg": "The policy exists, nobody checks it, and the person enforcing it has no standing to say no. Any one of the three missing and the other two stop working."}, {"n": "People follow interest, not exhortation", "d": "He doesn't believe in natural loyalty; he believes in incentives. Design the system well and people behave the way you wanted. It is Munger's 'show me the incentive and I'll show you the outcome', stated twenty-two centuries earlier.", "eg": "The all-hands asked everyone to prioritise quality. Bonuses stayed tied to shipped count. Everyone shipped."}, {"n": "The difficulty of persuasion", "d": "The hard part of speaking, he wrote, is not what you know but working out what the listener actually cares about. He catalogued the fatal errors — exposing what they don't want exposed, speaking at the wrong moment, being too direct — and then died of one.", "eg": "Your deck answered whether it could be built. The one person who could approve it was worried about who gets blamed if it fails."}], "q": ["The ruler controls by two handles: punishment and favour.", "The difficulty of persuasion is knowing the listener's mind.", "A thousand-mile dyke collapses from an ant hole."], "apply": "When designing incentives for a team, ask what this system will make people do, not what it ought to make them do. People act on interest. Aligning what you want with what pays is the whole of the job.", "l": ["Fan Li"], "contrast": [{"n": "Zhuangzi", "why": "Same era, opposite answers: Han Feizi designs the machine, Zhuangzi declines to be a component"}, {"n": "Thomas Gordon", "why": "Two theories of getting compliance: rules and consequences, or naming the effect on you. Both work, on different things"}]}, {"c": "Learning and growth", "n": "Pu Songling", "e": "1640–1715 · Shandong", "w": "The side thing won", "y": 1679, "d": "At nineteen he came first in three examinations and was locally famous. Then he sat the provincial examination for forty years and never passed, supporting his family as a live-in tutor. Almost everyone else in this library eventually succeeded — even their defeats are defeats on the way somewhere. He is the exception. The work he considered his life's business never came off, and the thing he did on the side became one of the most-read books in the language.", "story": "At seventy-one he was finally granted a minor honorary status — not passed, but awarded by seniority to a candidate who had simply been at it long enough. It was the only official recognition of his life and it arrived when it could change nothing. By then he had been writing his 'idle book' for four decades: nearly five hundred stories, revised repeatedly, circulated in manuscript among friends. He died before it was printed, and never knew.", "f": [{"n": "Failure with no turning point", "d": "There was no decisive year — not one big defeat and a restart, but once every three years, just short, until he was old. Most advice about failure assumes a turning point to point at. Here there isn't one, and none of it applies.", "eg": "Not one bad year: eleven rounds of interviews across four years, each ending at the final stage, with nothing to point at as the moment it went wrong."}, {"n": "He never let it be the only thing", "d": "He didn't stop sitting the exam and he didn't stake his life on it. The tutoring continued, the family was kept, the stories accumulated. Running things in parallel means that when the thing that never works fails again, something else in your hands is working.", "eg": "Keeping the job while the thing you care about takes years means a bad year stays a bad year, instead of becoming the end of the story."}, {"n": "The side thing got real investment", "d": "The stories weren't dashed off — forty years, nearly five hundred pieces, repeatedly revised. They were last in his ranking, not last in his investment. And he never quit the job: the tutoring fed him and gave him the forty uninterrupted years.", "eg": "Two hours every Sunday for six years is not a hobby. It was last in his ranking and first in his hours."}], "q": ["Almost everyone here eventually made it. He didn't.", "He called it an idle book until he died. It is why he is remembered.", "He didn't quit the job to write. He wrote on the job."], "apply": "When something you've worked at for years hasn't happened and you can't say when it would, don't start with whether to persist. Ask what else moved forward this year. If you can't name one thing, fill that gap first. And if the side thing is growing, count what you've actually put into it over three years before you talk about swapping their status.", "l": ["Excellent Sheep", "Fan Li"], "contrast": [{"n": "Excellent Sheep", "why": "Two ways of having no scoreboard: they were never given one, he had one and it never once said yes"}]}, {"c": "Learning and growth", "n": "Garry Kasparov", "e": "1963– · Baku", "w": "After losing to the machine", "y": 1997, "d": "World chess champion for fifteen years, from 1985 to 2000. In 1996 he beat IBM's Deep Blue in Philadelphia; in the May 1997 rematch in New York he lost 2.5–3.5, the first time a reigning world champion lost a match to a machine. Most people in this library are dealing with other people. He is dealing with something else: what is left of a craft you spent a life on after a machine passes you at the thing it is built on.", "story": "The 1996 match is usually left out, and it matters. He won it 4–2, losing only the first game — the first time a machine had beaten a world champion under tournament conditions, which at the time was itself the headline. He then had a year to prepare, and IBM had a year to rebuild. What he faced in 1997 was not the machine he had beaten. That is the ordinary shape of it: you win the first round against a tool, conclude the threat was overstated, and meet a different thing the following year.", "f": [{"n": "Strike out what is already lost", "d": "The day machines won on depth of calculation, that track closed. Training on a closed track has no exit however hard you train. The first move isn't redoubling effort; it's removing the lost item from your own list of what you are worth.", "eg": "No amount of practice makes you faster than the model at drafting a first version. The real question is which part of the work that leaves you."}, {"n": "Change the rules, not the effort", "d": "He didn't train harder and he didn't leave chess. A year later he staged a tournament where each side brought a computer to the board. When a tool matches an ability, the valuable position moves to how the tool is used — and someone has to define that position first.", "eg": "The translators who priced per word lost. The ones who charged for deciding what not to translate did not."}, {"n": "The appeal and the next move cost the same hours", "d": "He spent years arguing the match hadn't been fair, and withdrew all of it in 2017. Proving the loss didn't count and working out what to train next come out of the same person in the same stretch of time.", "eg": "The months spent proving the review was unfair were the same months available for the work that would have made the review irrelevant."}], "q": ["Calculation was already lost, so stop competing on calculation.", "The first step isn't more effort. It's striking out what's lost.", "Whatever replaced you does not need your agreement."], "apply": "When a core skill in your field gets matched by a tool, don't train harder first. Ask which item is now clearly lost, strike it out, and see what's left that the tool can't replace. And if you notice yourself repeating that it isn't actually any good, count how many times this month — then count what new thing you practised in the same month.", "l": ["Norbert Wiener", "John Boyd"], "contrast": [{"n": "Norbert Wiener", "why": "One built the thing and warned the people it would displace; the other was displaced and redesigned the contest"}]}, {"c": "How the world works", "n": "Norbert Wiener", "e": "1894–1964 · United States", "w": "He warned them first", "y": 1948, "d": "The founder of cybernetics: Cybernetics in 1948, The Human Use of Human Beings in 1950. His position here is unusual — he is both the person who put machine control into the world and the first to say publicly that it would displace factory workers on a large scale. In 1949 he wrote to Walter Reuther of the United Auto Workers saying he was unwilling for it to happen with no preparation. Automation had not yet been deployed and nobody had lost a job.", "story": "Cybernetics came out of the war. He worked on the problem of aiming anti-aircraft guns at aircraft that were manoeuvring — which meant predicting where a human pilot would go, and correcting continuously from what the last shot did. The feedback loop was invented while trying to shoot at people. That origin is why the ethics arrive so early in his work: he had already spent years modelling a person as a component in a system, and had seen exactly what that framing permits.", "f": [{"n": "The people who see it coming aren't hit yet", "d": "The year he wrote to the union there was still time to arrange something. Once it lands you only get to react. The stretch while you still have work is the only window you get to plan in.", "eg": "The time to learn the next thing is while the current work still pays. Once it stops you are learning and job-hunting at the same time."}, {"n": "'It can' doesn't imply 'give it to it'", "d": "Whether a machine can do a task is technical. What is left of the person afterwards is a different question, and the answer isn't automatically good. Hand over the repetition, not the judgement.", "eg": "Let it draft the summary. Deciding which three of the twenty issues actually get raised is the part that was your job."}, {"n": "Control is a loop, not an order", "d": "His definition: not issuing an instruction but correcting the next move from the actual result. Cut the report back and the movement goes off, however well it was aimed. It applies unchanged to managing people and to practising a skill.", "eg": "You set the goal in January and next heard about it in June. The instruction was fine; there was nothing correcting it in between."}], "q": ["What a machine can do and what people are for are separate questions.", "He feared people being arranged like machines, not the reverse.", "Control isn't issuing an order. It's correcting from the result."], "apply": "When something is spreading through your field and hasn't reached your income yet, ask which of your tasks it can already do, and who in your field you have actually talked to about it. When shifting work onto a tool, check whether what's left needs any judgement — if it doesn't, you handed over the wrong half.", "l": ["Garry Kasparov", "John Boyd"], "contrast": [{"n": "Garry Kasparov", "why": "Wiener warned before it arrived; Kasparov was the first person it arrived for"}]}, {"c": "Learning and growth", "n": "Excellent Sheep", "e": "2014 · William Deresiewicz", "w": "Can clear, can't choose", "y": 2014, "d": "A critique of elite education by someone who taught at Yale for ten years and sat on admissions. His observation: the system produces young people who are extraordinarily good at clearing a series of set hurdles — grades, competitions, internships, the CV — and who generally cannot say what they want. Very capable, entirely externally directed, lost the moment there is no next hurdle, and unusually afraid of failure because they have never been allowed to fail.", "story": "He left academia after writing it. The book began as an essay that circulated very widely, and the argument it makes — that the institutions doing the selecting are the problem, not the students being selected — is not one that makes a person welcome inside those institutions. That is worth knowing before reading it as a lecture to young people. His target is the machinery: every step in it rational, and the sum a life with no direction.", "f": [{"n": "Two abilities that don't substitute", "d": "'Be best at this' is drilled constantly inside any evaluation system. 'Decide what's worth doing' can only be trained where there is no correct answer. So the smoother the run, the likelier the second is blank.", "eg": "Ten years of being the person who clears every bar, and the first question with n
