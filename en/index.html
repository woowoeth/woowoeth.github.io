. Not doing it, he said, is a different thing from not being able to.", "f": [{"n": "Win the people and the rest follows", "d": "He who has the way has many helpers; he who loses it has few. The way here is not scripture. It is whether people will still put themselves out for you. Tax past what is produced, demand past what can be given, punish past what is fair, and they do not revolt. They stop consenting.", "eg": "Mandatory overtime buys a quarter. The moment your best people start playing dead, the thing that made them useful has already gone."}, {"n": "Force buys compliance, never judgement", "d": "Those subdued by force do not submit in their hearts, they submit because their strength is short. So force has to be reapplied continuously, and the standard is exactly as high as your attention. What you want is people holding the line where you cannot see them.", "eg": "Heavy monitoring lifts the weekly report and never lifts the work, which is why the numbers fall the week the manager is away."}, {"n": "No settled livelihood, no settled heart", "d": "He is specific about sequence: first make sure people can keep their parents and feed their children, then lead them towards the good. Demanding standards from people whose footing is not secure is not strictness, it is a category error about what they have available.", "eg": "Asking for craftsmanship from a team that cannot see past next month's contract is asking a question their situation cannot answer."}, {"n": "Born in adversity, dead in comfort", "d": "Not an argument for hardship as a virtue. It is a warning about attention: an organisation entering comfort starts losing its alertness first and its position later. Difficulty is a signal. Ease is an anaesthetic.", "eg": "Qin could remake itself while it was close to death and fell apart one generation after winning everything."}], "q": ["The people come first, the altars of the state next, the ruler last.", "He who has the way has many helpers; he who loses it has few.", "Born in adversity, dead in comfort."], "apply": "Before the next decision that costs somebody else something, ask three questions. Will the people carrying the cost still consent to the next thing? Will the standard hold while you are not there? Is what you are asking for actually available to someone in their situation? One no, and the decision is not ready.", "l": ["The Analects", "Han Feizi", "Shang Yang", "Li Shimin", "Lee Kuan Yew"], "contrast": [{"n": "Han Feizi", "why": "Both are writing about how to govern. Han Feizi trusts reward and punishment; Mencius asks whether people are still willing to follow you at all"}, {"n": "The Analects", "why": "The Analects tells a gentleman how to conduct himself; Mencius tells a ruler what will remove him"}]}, {"c": "Power and organisation", "n": "Zhang Liang", "e": "Han · c. 250–186 BC", "w": "Asking for less", "y": -250, "d": "The cleverest of the three men credited with founding the Han, and the only one of them who died in his bed. The life runs in three acts: learning to endure, on a bridge at Xiapi; using the plan, at the Feast at Hong Gate; and leaving, when he asked for one small county instead of thirty thousand households. His comparisons are Han Xin, who did not withdraw and was killed, and Xiao He, who half withdrew and survived.", "story": "Liu Bang had taken the capital first, and Xiang Yu was arriving with a far larger army and every intention of destroying him. Xiang Bo, an uncle of Xiang Yu, rode over in the night to warn Zhang Liang privately and get him out, because Zhang Liang had once saved his life. Zhang Liang refused to leave. He told Liu Bang, brought Xiang Bo in and had him introduced, and set up the meeting at Hong Gate the next morning where Liu Bang apologised in person and left the banquet alive. The favour he would not spend on himself is what saved everybody.", "f": [{"n": "The Liu county rule", "d": "Take what is enough, not what is most. Thirty thousand households is a symbol of achievement; one small county is a home. Asking for less was not modesty, it was a calculation: the smaller the request, the smaller the threat, the safer the man who made it.", "eg": "The largest available title comes with the largest available surface area for somebody else to aim at."}, {"n": "Three men, three answers to the same danger", "d": "Facing the same problem of having served too well, Zhang Liang disappeared, Xiao He made himself look small and slightly disreputable, and Han Xin did neither. Two of them died in their beds. The strategy decided the outcome, not the loyalty.", "eg": "When a founder starts feeling crowded, the people who narrow their own footprint early are not being timid. They are reading the same signal."}, {"n": "The timing question is when, not whether", "d": "When the birds are gone the good bow is put away. The difficult judgement is what counts as done. His answer was: before the other side has begun to wonder about you. After that, the same move means something else entirely.", "eg": "Han Xin knew the danger, and neither left nor handed back command. He spent the longest time of the three in the middle ground, which is the one place with no exit."}, {"n": "The Tao Te Ching line, lived", "d": "Withdraw when the work is done: that is the way of heaven. He is the person who actually did it. Not passivity, but the best available survival play: step out of the contest while everyone else is still in it, and you no longer have opponents.", "eg": "Handing the thing over while it is going well converts a rival into a beneficiary. The same handover after the decline converts nothing."}], "q": ["Enfeoff me at Liu and it is enough.", "I wish to drop the affairs of men and follow Master Red Pine.", "Withdraw when the work is done: that is the way of heaven."], "apply": "Next time a promotion or a larger position is put in front of you, run the Liu county rule before you answer. Ask for the level that is sufficient and safe rather than the largest one on offer. The extra mostly buys exposure.", "l": ["Fan Li", "Li Bi", "Han Xin", "Tao Te Ching", "Liu Bang"], "contrast": [{"n": "Han Xin", "why": "Same founding, opposite endings: Zhang Liang withdrew completely and died old, Han Xin kept both his army and his ambitions and was killed"}, {"n": "Fan Li", "why": "The two men who understood leaving. Fan Li left to trade, Zhang Liang left to study the way. Different exits, identical result"}]}, {"c": "Power and organisation", "n": "Zhuge Liang", "e": "Three Kingdoms · 181–234", "w": "The Longzhong plan", "y": 181, "d": "The most admired administrator in Chinese history, and the standard image of both strategic foresight and working yourself to death. He described the three-way division of the empire before he had left his farm, built the state of Shu with Liu Bei, governed it for twenty years with a legal system nobody accused of favouritism, and went north six times against a much larger enemy because waiting was the worse option.", "story": "On the last campaign, held on the Wuzhang Plains, Sima Yi refused battle and questioned the Shu envoy about his opposite number's daily habits instead. The envoy said the chancellor rose early and went to bed late, personally reviewed every punishment above twenty strokes, and ate very little. Sima Yi turned to his staff: eating little and handling much, how can he last? He was right, and within months he was proved right. The campaign was settled by which man would live longer, not by which had more ability.", "f": [{"n": "A framework before there was anything to frame", "d": "Still on the farm, he sorted the board: Cao Cao not to be contended with, Sun Quan to be allied and not attacked, Jing province to be taken, Yi province to be the base. Then three moves in order, and a condition that had to appear before the last one.", "eg": "A plan that names what it will not touch, and what has to become true before the big move, survives contact. A list of ambitions does not."}, {"n": "Attack because waiting is worse", "d": "If we do not attack, the royal cause dies anyway; better than sitting and waiting to die. Shu was the weaker state and time was working for Wei, so passivity was not the safe option, it was the slow version of the same defeat.", "eg": "When the gap with a larger competitor widens every quarter you do nothing, holding position is a decision with a cost, not the absence of one."}, {"n": "The law that reached his favourite", "d": "Ma Su lost Jieting and was executed, though he was the man Zhuge Liang had promoted over everyone's advice and was personally close to. Then the second half: a memorial asking for his own demotion by three ranks. A system is credible at the point where it touches the favourite.", "eg": "Everyone learns what the rules are from the first case involving someone the boss likes. Nothing written down changes that lesson."}, {"n": "The cost of doing all of it yourself", "d": "Every punishment above twenty strokes reviewed personally. He set a standard nobody else met, so he could not delegate, so nothing survived him. Being irreplaceable is a personal distinction and an organisational disaster.", "eg": "If you cannot name the person who could run this without you, the thing you have built has an expiry date and it is your own."}], "q": ["I shall bend to the task until my strength is spent, and only then stop.", "Without detachment no clarity of purpose; without stillness no reaching far.", "If we do not attack, the cause dies anyway. Better than sitting and waiting."], "apply": "If you find that everything is passing through you, ask which of the two it is: nobody has reached the standard, or nobody was ever actually taught it. Then take one thing this week and teach the standard instead of applying it. Producing your own replacement is the job.", "l": ["Cao Cao", "Sun Tzu", "Zeng Guofan", "Fan Li", "Sima Yi"], "contrast": [{"n": "Sima Yi", "why": "Talent against longevity: Zhuge Liang burned out at fifty-four, Sima Yi waited until seventy-three and collected everything"}, {"n": "Fan Li", "why": "Two answers to having succeeded: Fan Li walked away at the summit, Zhuge Liang never put it down at all"}]}, {"c": "Power and organisation", "n": "Otto von Bismarck", "e": "Prussia · 1815–1898", "w": "Alliance geometry", "y": 1815, "d": "The man who treated Europe as a geometry problem. He did not want friends, he wanted an arrangement in which three other parties could not do without him. Having beaten Denmark, Austria and France in three short wars, he stopped, and spent the rest of his career holding the new Germany in place with treaties. Napoleon won by fighting. Bismarck won by stopping.", "story": "The German Empire was proclaimed at Versailles in 1871 and he did not press further. He turned at once to arranging the rest of Europe around the new fact, negotiating separately with Russia, Austria and Italy, building the League of the Three Emperors, making each capital feel that leaving Berlin was more dangerous than staying. France stayed isolated for twenty years. Then he was dismissed, and the network tore within a few years, which tells you what it had been: not friendship, but one man's calculation, running only while he was there.", "f": [{"n": "The art of the possible", "d": "Politics is not the realisation of an ideal, it is extracting the most from the conditions available. The person who writes his objective as it must be this loses the position while defending the sentence.", "eg": "Unifying Germany, he left the south out at first and took the half Prussia could hold. Take the piece you can defend before the piece you can reach."}, {"n": "Make three parties unable to do without you", "d": "The safest position is not the strongest one. It is the one where A needs you against B and B needs you against A. Neither can drop you, so you sit in the middle without being the biggest thing on the board.", "eg": "Being the component both giants have to design around beats being tied exclusively to whichever of them looks stronger this year."}, {"n": "Stop when you have won", "d": "Three wars, and then he halted. One more would have turned the alliances. The move after a victory is not expansion, it is converting the victory into an arrangement the losers can live inside.", "eg": "Napoleon was still looking for the next campaign. Bismarck finished with France and immediately started negotiating the terms of the peace."}, {"n": "Do not push on the other side's home ground", "d": "He kept away from British sea power and from Russian interests in the Balkans. A home ground is where the other party's survival is at stake, and pressure there buys you their entire strength rather than part of it.", "eg": "Zhang Juzheng reformed the Ming finances and the personnel system and never touched the throne itself. The same geometry."}, {"n": "An alliance is a consumable", "d": "It runs on a person. When the person goes the paper remains and the structure disperses. Never let a calculation that lives in one head be treated as an institution.", "eg": "After he fell, Wilhelm II let the reinsurance arrangement lapse and Europe went back to two camps. Partnerships held together by a founder behave the same way."}], "q": ["Politics is the art of the possible, the attainable, the next best.", "We are a satiated state.", "An honest broker who really wants to put the business through."], "apply": "Before agreeing to any partnership, draw three circles: why they cannot do without you, why you cannot do without them, and how a third party moves when the deal is signed. If the only real dependency runs from you to them, this is a favour you are giving, not a deal you are making.", "l": ["Zhang Juzheng", "Lee Kuan Yew", "Napoleon", "Thomas Schelling"], "contrast": [{"n": "Napoleon", "why": "Napoleon rode momentum until his opponents collapsed; Bismarck fixed his winnings by halting. One won at fighting, the other at stopping"}, {"n": "Lee Kuan Yew", "why": "Two realists: Lee held a small state as a node, Bismarck held a large one as a pivot"}]}, {"c": "Power and organisation", "n": "Feng Dao", "e": "Five Dynasties · 882–954", "w": "Serving ten emperors", "y": 882, "d": "The hardest man in Chinese history to grade. He held office through the Later Tang, Later Jin, Later Han and Later Zhou, served ten emperors including the Khitan conqueror who took the capital, was chief minister under nearly all of them, passed through every change of dynasty untouched and died at seventy-three. Ouyang Xiu called him shameless and Sima Guang the worst of traitors, while in his own lifetime, it was written, wise and foolish alike looked to him as the elder of the age. He is not here to be acquitted. Everyone else in this collection is an example to follow, and a collection with no uncomfortable mirror in it is missing something.", "story": "Yelu Deguang, having taken the capital, put a question to him in front of the court: and what sort of old fellow are you? The tone was contempt, and any dignified answer would have been an argument with a conqueror. Feng Dao said: an old fellow with no talent and no virtue, foolish and stubborn. No defence, nothing to push against, and the insult found nothing to land on. That was roughly his posture for seventy years. Never meet violence head on, and work in the gaps where it has let go.", "f": [{"n": "He moved the object of loyalty", "d": "In his scheme the emperor is a replaceable political symbol and the people are the constant. The Five Dynasties gave that view a real basis: fifty-three years, five dynasties, fourteen emperors, and dying for any one of them would have been a joke. It is also the most convenient defence an opportunist could have. The tension does not resolve, and that is the value of the entry.", "eg": "The useful reading is not guilty or innocent. It is noticing which standard you are judging by, and who set that standard, and for what."}, {"n": "Minimum exposed surface", "d": "No faction, no troops, no fortune, no enemies, nothing left lying around to be used against him. At each new accession he was the man with the least reason to be purged. His safety came from nobody profiting by his removal, which is the opposite of picking a side.", "eg": "Hu Xueyan is the inverse case: the patron held tighter and tighter, the exposure grew, and when the patron fell everything was settled at once."}, {"n": "Do the work where work is possible", "d": "He did not prevent a single change of dynasty and could not have. In office he argued against campaigns, organised famine relief, protected scholars and had the Nine Classics cut and printed, which carried the texts through the disorder and begins large-scale official printing in China.", "eg": "The fair question about an official in a collapsing order may not be who he was loyal to. It may be how many people were alive because he held that seat."}, {"n": "Do not fight for the right to define you", "d": "Insulted, he agreed with the insult and made it smaller. There was no target left, so the contempt did no work. Arguing would have made him one. The price of the technique is that you have to genuinely not care about the verdict.", "eg": "Accepting a diminishing label in your own words removes its force. It also only works if you are not quietly keeping score."}, {"n": "The real cost of this road", "d": "Do not read him as universal smoothness. Giving up a position meant giving up the power to change anything. He preserved himself and many others, and the Five Dynasties were the Five Dynasties precisely because the whole official class chose his method.", "eg": "Individually optimal choices can add up to the worst available system. That is the problem he leaves behind, and the reason he is not simply survival advice."}], "q": ["Not deceiving the earth below, nor men between, nor heaven above.", "The Buddha could come again and not save them. Only the emperor can.", "An old fellow with no talent and no virtue, foolish and stubborn.", "Just do good things. Do not ask about the road ahead."], "apply": "This entry is a diagnostic rather than an instruction. When you are inside something you cannot steer, a company changing direction or a decision you do not agree with, separate two things: what you must take a position on, and what you can still get done without taking one. His method was to make the first as small as possible and the second as large as possible. Keep the cost in view. If everybody chooses this, nothing ever changes, and one day you may find that what you preserved was no longer worth preserving. When to be Feng Dao and when to stand up is the question he leaves with you, and nobody can answer it on your behalf.", "l": ["Sima Yi", "Guo Ziyi", "Zeng Guofan", "Machiavelli", "Su Shi"], "contrast": [{"n": "Guo Ziyi", "why": "Two first-rate survivors of disorder, but Guo Ziyi stayed loyal inside one dynasty while Feng Dao crossed four. Where the boundary of loyalty sits, they answer differently"}, {"n": "Machiavelli", "why": "Machiavelli argued in a book that outcomes outrank motives; Feng Dao spent a life doing it. Theory and specimen, both abused for centuries"}, {"n": "Zeng Guofan", "why": "Zeng Guofan held an army and cut back his own wings to keep his name; Feng Dao had neither troops nor money and sought only to keep people alive"}]}, {"c": "Power and organisation", "n": "Guo Ziyi", "e": "Tang · 697–781", "w": "Great merit, no threat", "y": 697, "d": "The general who put down the An Lushan rebellion, retook the capital twice, held off the Tibetans and kept the Uighurs friendly. His real achievement is not on the battlefield. He served four emperors, and the official history says his merit covered the empire and his ruler did not suspect him, his rank was the highest and nobody resented it. He died in bed at eighty-five. Han Xin and almost everyone else in his position did not, and what he did differently was a deliberate, expensive, lifelong piece of engineering.", "story": "The eunuch Yu Chaoen hated him, and while he was away with the army had his father's grave dug up. The court waited for the response: he had the troops, and everyone assumed he would use them. He came back, wept in front of the emperor, and said that he had commanded armies for years and had not been able to stop his own soldiers desecrating graves, so what had happened to his family was heaven's judgement, not any man's doing. There was nothing left to accuse him of. Later Yu Chaoen invited him to dinner; everyone said it was a trap; he went with a few servants, and Yu Chaoen wept and became his protector.", "f": [{"n": "Swallow the blow you cannot answer", "d": "He could have retaliated and would have won the exchange. He would also have proved that a general with an army settles his own scores, which was exactly the charge against him. Refusing the fight cost him a grave and bought him the emperor's certainty.", "eg": "Winning an argument with someone who can outlast you often costs more than the argument was worth."}, {"n": "Bind your own family first", "d": "When his son quarrelled with the princess and said something that could have ended the clan, Guo Ziyi tied him up and delivered him to the emperor before anyone else could. The point is not the punishment. Handing over the evidence yourself leaves nobody anything to prosecute.", "eg": "Reporting your own team's failure before it is discovered changes what the conversation can be about."}, {"n": "Give the command back the same day", "d": "He was stripped of his armies repeatedly. Every time the order arrived he set out for the capital that day, and every time he was recalled he went the same day. He treated command as borrowed. Plenty of people can pick power up; the rare thing is putting it down without argument.", "eg": "Han Xin, in the same position, bargained for a bigger title. Each move proved he was a risk, and eventually he was treated as one."}, {"n": "Do not present as flawless", "d": "In old age he lived lavishly and made no attempt to hide it. That was not decay, it was design. A man with an obvious appetite is legible and therefore manageable. A man who wants nothing invites the question of what he really wants.", "eg": "Wang Jian, before invading Chu, kept pestering the king for estates. Same craft: display one harmless want, to cover the suspicion that matters."}], "q": ["His merit covered the empire and his ruler did not suspect him.", "I deal with people honestly, so what would I need defences for?", "Command is a borrowed thing: it comes when called and goes when waved away."], "apply": "After a win, the safer position is being easy to see through, not being indispensable. Publish more than you are asked to, report your own mistakes first, and hand back whatever authority you no longer need. The question to ask after doing something well is not what else can I get, but what should I put down.", "l": ["Han Xin", "Zhang Liang", "Zeng Guofan", "Sima Yi", "Wang Jian"], "contrast": [{"n": "Han Xin", "why": "The same impossible position: Han Xin kept proving he was a threat and his clan was destroyed, Guo Ziyi kept proving he was harmless and died in bed"}, {"n": "Zhang Liang", "why": "Two ways to survive success: Zhang Liang left the table, Guo Ziyi stayed at it with his cards face up, which is much the harder trick"}]}, {"c": "Power and organisation", "n": "Lee Kuan Yew", "e": "Singapore · 1923–2015", "w": "Survival first", "y": 1923, "d": "In 1965 Singapore was expelled from the Malaysian federation and forced into independence: an island with no hinterland, no fresh water, no resources, two million people, riots between ethnic groups in living memory, and large neighbours. By the time he handed over, income per head had passed that of the country that once ruled it. Almost every ruler in this collection inherited a great state. He is the one who started from too weak to exist, which is where most people and most companies actually start.", "story": "At the press conference on the day of separation he broke down and stopped for twenty minutes. He explained later that this was not weakness but arithmetic: roughly three quarters of Singapore's fresh water came through pipes from Malaysia, and a single decision at the other end could end the country. Among the first things he started was one that looked in no way urgent, and took decades: desalination and water recycling, until supply was close to self-sufficient. Asked why that came before the emergencies, he said that the place where somebody else can decide whether you live is your only real strategic problem.", "f": [{"n": "Deal with the hand around your throat first", "d": "A weak party does not sort its priorities by urgency but by who can end it with one decision. Water, defence and recognition got money when there was no money, rather than waiting until there was.", "eg": "Does your income come from one client, one platform, one boss? That is not efficiency. Somebody else is holding your water pipe."}, {"n": "A small fish needs more than one big fish", "d": "Friendly with the United States without alliance, engaged with China without leaning, actively inviting several powers to be present in the region. The logic: while two or more great powers compete, a small state has room to manoeuvre. The worst outcome is a region with only one.", "eg": "Between two strong parties, staying useful to both beats picking early. Once you have one option, your price is whatever they say."}, {"n": "Do not build systems that need people to be noble", "d": "Ministers were paid against top private salaries, and corruption was prosecuted without exception, including his own old friend the minister for national development. Two faces of one rule: make honesty the rational choice rather than the virtuous one.", "eg": "His own line: if you pay peanuts, you get monkeys."}, {"n": "Cohesion is designed, not hoped for", "d": "In a city of Chinese, Malay and Indian residents that had just had race riots, he did not wait for integration to happen. Public housing was allocated by ethnic quota so blocks stayed mixed, English became the common working language because it favoured nobody, and mother tongues were kept in school.", "eg": "Unity in his hands was never a mood. It was a set of policies somebody had to enforce."}], "q": ["If you pay peanuts, you get monkeys.", "Between being loved and being feared, I have always believed Machiavelli was right.", "The pipe somebody else can close is the only strategic problem you have."], "apply": "The first lesson for the weaker party is not how to get strong. It is to count the pipes somebody else is holding: one client, one platform, one income, one person who signs. Take the thickest of them and spend three years turning it into two, even though two costs more and runs slower. The second lesson is not to pledge loyalty early. The moment you have only one option, your bargaining power is zero.", "l": ["Guan Zhong", "Shang Yang", "Why Nations Fail", "Machiavelli", "Ren Zhengfei"], "contrast": [{"n": "Guan Zhong", "why": "Two operators building a small state from nothing, twenty-six centuries apart: Guan Zhong through trade and price control, Lee through institutions and balance"}, {"n": "Why Nations Fail", "why": "The book argues inclusive political institutions are the condition for lasting prosperity, and Singapore is its most cited counter-example. Read them together"}]}, {"c": "Power and organisation", "n": "Li Bi", "e": "Tang · 722–789", "w": "Close in, never held", "y": 722, "d": "The most skilled survivor in the whole tradition of Chinese advisers. He served four emperors, walked out of the court three times of his own accord, was called back every time, and ended as chief minister at an age most of his contemporaries did not reach. In an era of eunuch power and permanent purges this is close to impossible. It is harder than what Fan Li did: Fan Li vanished, while Li Bi kept moving through the middle of power without being swallowed by it.", "story": "He was seven when Xuanzong had him brought to court. The emperor was at a game of go, and the minister Zhang Yue was told to test the boy: make something of square and round, movement and stillness. Zhang Yue did it as a description of the board itself — square like the board, round like the stones, moving when a stone lives, still when it dies. The child would not take the board. Square is acting justly, he said, round is using wit, moving is showing what you can do, still is having got what you wanted. Zhang Jiuling, later chief minister, took to calling him my young friend.", "f": [{"n": "The robe was a shield", "d": "Wearing a Taoist's robe to court was not piety, it was engineering. A man outside the world has a standing reason to leave, no faction, no post anyone is competing for, and no obligation to the usual forms. An identity can be a structural tool.", "eg": "The consultant and the employee say the same sentence. Only one of them is heard as saying it for a reason."}, {"n": "Three exits, and each one timed early", "d": "Every withdrawal came before the danger arrived rather than after: jealousy from a chief minister, the end of a campaign he had won, the rise of the eunuchs. Leaving voluntarily each time is what preserved the standing to be called back.", "eg": "Leaving while people still want you to stay is what makes the door open again. Leaving after that is just leaving."}, {"n": "Advise without contending", "d": "His plan to strike the rebels at their base was better than the one that was chosen. He did not insist, did not fight for it, and never said afterwards that he had been right, though he was. Proposing and demanding adoption are two different jobs.", "eg": "Being right and needing to be seen to be right cost most advisers their access. Not needing it is what kept his."}, {"n": "Take no credit and hold no power", "d": "Declining honours was not modesty. Credit went to the throne, posts were refused where possible, and nothing was accumulated that anyone might want. With nothing to envy, there is nothing to attack.", "eg": "Guo Ziyi ran the same policy from the other end of the empire: results to the emperor, money to the sons, power handed back."}], "q": ["I am a man outside the world; office is not on my mind.", "When the work is done, withdraw. That is the way of heaven.", "Riding out they shared reins; sleeping, facing couches; nothing was settled without him."], "apply": "When you have something difficult to say, the problem is usually not the content but the attribution. Before you say it, work out what people will assume you are getting out of it, and see whether there is a footing — a role, a written record, a public declaration of your own interest — that removes the assumption. And notice which of your opinions you can only afford to hold because you have somewhere else to go.", "l": ["Fan Li", "Zhang Liang", "Sima Yi", "Tao Te Ching", "Guo Ziyi"], "contrast": [{"n": "Fan Li", "why": "Two versions of leaving without going far: Fan Li disappeared completely, Li Bi kept walking through the centre of power in a robe that let him leave at will"}, {"n": "Zhang Liang", "why": "One reign or four: Zhang Liang withdrew for good once the founding was over, Li Bi came back and left four times and finished holding the top office"}]}, {"c": "Power and organisation", "n": "Shang Yang", "e": "Warring States · 390–338 BC", "w": "Credit before command", "y": -390, "d": "The designer and enforcer of the reforms that turned Qin from a backward frontier state into the machine that conquered China. Two rounds of legislation rebuilt landholding, taxation, military rank and household registration. He was torn apart by chariots for his trouble. But the rules he wrote were still running a century after his death and they finished the job: the man died, the system lived, which is the best available ending for a reformer and not a happy one.", "story": "After his patron Duke Xiao died, the old nobility charged him with treason and he ran. At nightfall he tried to take a room at an inn on the road, and the innkeeper turned him away: under Lord Shang's law, a guest without papers cannot be lodged, and the house would be punished. He is said to have understood at that moment what he had built. He fled to his own fief, raised troops, lost, and was executed and his family destroyed. The detail that everyone remembers is the inn, because it is the only case in which the law was tested on the man who wrote it.", "f": [{"n": "Certainty of reward, certainty of punishment", "d": "The core of the reform was not severity but reliability. One head taken in battle was one step of rank, whatever your birth. The Qin army did not outfight six states because its soldiers were braver; the arithmetic was simply clearer to them than to anyone else.", "eg": "People do what the system actually pays for. Announcing different priorities changes nothing until the payout changes."}, {"n": "The man dies, the system lives", "d": "Compare Zhang Juzheng, whose reforms were being dismantled within two years of his death. Shang Yang's survived because they had created a large class — ordinary soldiers and farmers who could now rise — with a reason to defend them.", "eg": "Real reform is not I will push this through. It is I will manufacture a group of people who need this to continue."}, {"n": "Break the land monopoly", "d": "Abolishing the well-field system ended aristocratic control of land and allowed it to be bought and sold. Farmers kept the surplus, so they had a reason to grow one. It is the oldest recorded case of a rule change releasing output that was already there.", "eg": "Whenever effort and reward are reconnected, production that looked impossible turns out to have been suppressed."}, {"n": "The designer has to be inside the design", "d": "The inn is not an ironic footnote, it is the test result. A set of rules that binds everyone except its author is personal rule under another name. His death is the strongest evidence that what he built was real.", "eg": "Any leader who says the rules are for other people is dismantling their own system while announcing it."}], "q": ["When the law is not carried out, it is those above who break it.", "A sage who can strengthen the state does not copy the past.", "Do not change the law for less than a hundredfold gain."], "apply": "Before you push any new rule, do one small thing that proves you deliver: a visible case, settled immediately, at a cost large enough that people are surprised. Then, before you start, name the group who will be better off if the rule survives you — if you cannot name them, the rule dies the day you leave.", "l": ["Han Feizi", "Zhang Juzheng", "Guan Zhong", "Cao Cao", "Li Shimin", "The Wealth of Nations"], "contrast": [{"n": "Zhang Juzheng", "why": "The same fate, opposite legacies: Shang Yang died and his system lived, Zhang Juzheng died and his was taken apart. The difference is who was left with a reason to defend it"}, {"n": "Han Feizi", "why": "Theory and practice of the same school: Han Feizi wrote the system down, Shang Yang ran it, and both were killed by the thing they had built"}]}, {"c": "Power and organisation", "n": "Wu Zetian", "e": "Tang · 624–705", "w": "Breaking the frame", "y": 624, "d": "The only woman to rule China as emperor in her own name. She entered the palace at fourteen as a junior concubine and abdicated at eighty, and in between she broke every rule that was supposed to stop her. Her method is worth more than her biography: she treated each rule not as a wall but as a thing certain people were choosing to enforce, and went to work on those people. Her reign expanded the examination system and the empire did not shrink.", "story": "When Taizong died, a concubine who had borne no child was sent to a temple to become a nun, and she went. What she waited for at Ganye Temple was the day the new emperor, Taizong's son, came to burn incense for his father — a man who had already noticed her. She left the temple, re-entered the palace, and worked her way past the standing empress. The histories say she strangled her own newborn daughter and let the blame fall on the empress. Nobody could prove it. Everybody believed she was capable of it, and being thought capable of it was itself a kind of power.", "f": [{"n": "Take the rule apart into people", "d": "Every step of hers began at a wall: women do not govern, a childless concubine does not return, an empress cannot be deposed, a woman cannot take the throne. Her habit was to resolve each rule into who is enforcing this and what do they need, and to work on that instead.", "eg": "This market already has a giant, so there is no room. Break it down: who holds the position, what does it pay them, and under what conditions do they stop defending it?"}, {"n": "Alliances counted precisely", "d": "On the way up she kept an exact account of where each person stood: natural allies whose interests already matched hers, people who could be neutralised by being paid off, and those who had to go. She fought nothing for its own sake and moved when her side of the ledger was strongest.", "eg": "Most political energy in an organisation is spent on fights that were never going to change anything."}, {"n": "Recruit past birth", "d": "She promoted men of no family, widened the examinations and added the palace examination, breaking the aristocratic clans' grip on office. This was not only progress, it was arithmetic: men with no clan behind them depended on the throne alone.", "eg": "Give opportunity to people who have no other route and you get loyalty that no incentive scheme can buy."}, {"n": "The clear-eyed end", "d": "In old age she named her son, of the Tang house, as heir rather than her own nephew, which meant accepting that her dynasty would end with her. She understood that her power had been borrowed against the Tang rather than replacing it, and chose to give it back.", "eg": "Knowing what your position actually rests on is rarer than getting the position."}], "q": ["Even an absurd man, if what he said fitted, was promoted out of turn.", "How did the chancellor come to lose this man?", "A wide gate is only safe if the exit is cheap."], "apply": "The next time something is described as impossible, do not argue with the word. Ask who is enforcing this, what does enforcing it pay them, and what would have to change for them to stop. An abstract impossibility has no handles. A named person with an interest has several.", "l": ["Liu Bang", "Han Feizi", "Machiavelli", "The Comprehensive Mirror"], "contrast": [{"n": "Machiavelli", "why": "Political realism written and political realism lived: he set down what a prince must actually do, she had already done it eight centuries earlier"}, {"n": "Shang Yang", "why": "Two people who broke a settled order: Shang Yang broke aristocratic privilege, she broke the bar on her sex, and both paid heavily for it"}]}, {"c": "Power and organisation", "n": "Zhang Juzheng", "e": "Ming · 1525–1582", "w": "Reform and the reckoning", "y": 1525, "d": "In two hundred and seventy years of Ming rule he is the one chief minister who actually changed the state. The single whip reform merged the tax system, the evaluation ledgers put every order on a name and a date, and land was resurveyed; the treasury went from empty to four million taels of silver in reserve. He was the most powerful man alive while he lived, and within a year of his death his house was raided and his family destroyed. This is the fullest version of the reformer's fate in the collection.", "story": "His power rested on a triangle: a boy emperor who was the formal authority, the empress dowager who was the real one, and the chief eunuch who controlled the palace. He secured the last two, and only then could he govern. With the boy he was severe — diligence, frugality, lessons, a childhood entirely managed, from the age of ten. He died at the height of his power. The emperor, now grown, took his revenge within the year: the estate seized, the eldest son driven to suicide, the reforms picked apart. It was politics, and it was also ten years of a boy waiting.", "f": [{"n": "The triangle was not an institution", "d": "His authority came from three personal relationships, not from any power the office of chief minister actually held. When the dowager lost influence and the eunuch was purged, the base vanished at once. Personal power is fragile; only institutional power lasts.", "eg": "Ask what happens to your position if the two people who back you leave. If the answer is nothing survives, you have influence, not a role."}, {"n": "A reform needs beneficiaries who can speak", "d": "The single whip helped ordinary taxpayers, who had no political voice at all. The officials and local gentry it hurt had plenty. So the moment the protection was gone, one side could act and the other could not.", "eg": "Design the beneficiaries deliberately, and check that they are people with the standing to defend what they got."}, {"n": "Do not suppress the person who will outlive you", "d": "Ten years of strict tutoring produced an emperor who was competent and who hated him. In power relationships the benefactor and the oppressor are often the same person, and which one you turn out to have been is decided by the other party, later.", "eg": "The strong mentor makes the junior. The first thing the junior does once made is get out from under the mentor."}, {"n": "Assessment is the dangerous reform", "d": "The evaluation ledgers made government work. They also created, one by one, every official who later had a reason to want him gone. The cost of a reform is not the resistance in front of you; it is the enemies waiting behind it.", "eg": "Everyone supports fairness before performance review arrives. Afterwards, the people it marked down start looking for a way back."}], "q": ["The hard part is not making the law; it is making sure the law is carried out.", "I am not a chief minister. I am a regent.", "A decision with no name and no date on it is a wish."], "apply": "If you are pushing a change through an organisation, spend as much time designing who benefits as designing the change. Make the gains land on people with enough standing to defend them, and make sure they know the gains came from the new arrangement. A reform with no constituency is undone the week its sponsor leaves.", "l": ["Guan Zhong", "Han Feizi", "Zeng Guofan", "Wang Yangming", "Shang Yang"], "contrast": [{"n": "Shang Yang", "why": "The reformer's fate in two versions: Shang Yang died and his system stood, Zhang Juzheng died and his was dismantled. The difference is who was left to defend it"}, {"n": "Zhuge Liang", "why": "Two tragedies of being irreplaceable: after Zhuge Liang there was nobody to take over, after Zhang Juzheng the whole programme collapsed at once"}]}, {"c": "Power and organisation", "n": "Zhu Yuanzhang", "e": "Ming · 1328–1398", "w": "Nothing to lose", "y": 1328, "d": "The most complete rise from the bottom in Chinese history. Starting point: a sixteen-year-old orphan whose family had died in a famine, begging, then a monk. Finish: founding emperor of the Ming and ruler of a unified empire. His logic has nothing in common with the well-resourced founder — no capital, no network, one objective, which was to stay alive. The dark half is just as large: the men who founded the dynasty with him were killed almost to the last, and the four great cases took more than a hundred thousand lives.", "story": "At seventeen he lost his father, mother and eldest brother to famine within weeks. He went to the Huangjue monastery to be a monk, and within months the monastery ran out of food too, so he was sent out to beg. For three years he walked the Huai river country. He saw how the poorest people lived and how the Yuan officials treated them, and by the time he joined the Red Turban army at twenty-five he was one of the few men of that generation who genuinely knew what the bottom of society was thinking. That knowledge later became the ability to turn desperate men into soldiers.", "f": [{"n": "Having nothing to lose is an advantage", "d": "Being able to lose everything is the most underrated competitive position there is. He had no way back, so he could commit fully. Chen Youliang and Zhang Shicheng had holdings to protect, and so they sometimes chose to be careful.", "eg": "It is why a founder with nothing occasionally beats a well-funded rival. One of them can afford to be wrong about everything except this."}, {"n": "The begging years set his mind permanently", "d": "Coming from the bottom and having watched the officials at work left him with a permanent distrust of educated elites. That distrust drove the secret police, the extreme control of officials, and the destruction of his own founding generals.", "eg": "The men who could have been most use to his heirs were the ones he could least bring himself to leave alive."}, {"n": "Clearing the ground for the next holder", "d": "The purges have a cold logic. He knew his grandson was mild and could not control the founding generals, so he removed them while he was still alive. Short-term infamy exchanged for long-term stability, decided by a founder about his own succession.", "eg": "It failed on its own terms. When the throne was challenged there was no commander left who could fight, because he had killed them all."}, {"n": "Standardisation as a memory", "d": "He wrote the most detailed administrative code in Chinese history, specifying what an official must do in each situation and the penalty for not doing it. It came directly from what he had seen as a beggar: without a standard, there is only whatever the man in front of you feels like.", "eg": "Taking the knowledge out of individuals and putting it into the system is what lets the system run without exceptional people in it."}], "q": ["I was a commoner of Huaixi. What does the empire add to me?", "I rose from Chuyang, a commoner with a three-foot sword.", "Having no way back is a real advantage and a permanent injury."], "apply": "Early on, when resources are thin, no way back can be converted into an asset: say plainly that there is one attempt and no reserve, and the focus that produces is not available to people with a fallback. The warning attached is his own: the mind that gets you through the scarce years is the one that will not let you trust anybody later.", "l": ["Liu Bang", "Han Feizi", "Cao Cao", "Zhang Juzheng"], "contrast": [{"n": "Liu Bang", "why": "Two emperors from the bottom, opposite policies on the men who got them there: Liu Bang scattered wealth to hold them, Zhu Yuanzhang killed them to be safe"}, {"n": "Nelson Mandela", "why": "Two minds shaped by an extreme start: it left Zhu Yuanzhang unable to trust anyone for the rest of his life, and left Mandela able to put the grievance down"}]}, {"c": "Power and organisation", "n": "The Comprehensive Mirror", "e": "Northern Song · 1065–1084", "w": "Why regimes fall", "y": 1065, "d": "Sima Guang directed the compilation for nineteen years: two hundred and ninety-four volumes covering the thirteen hundred and sixty-two years from 403 BC to AD 959. The emperor Shenzong named it — a mirror of what has been, useful to the art of governing. It is a history textbook written for a ruler, and it asks one question throughout: why do regimes rise and why do they fall. The Records of the Grand Historian is about people. This is about power as a system.", "story": "The book was finished by a man who had lost the argument. Sima Guang opposed Wang Anshi's New Policies, lost, and left the capital for Luoyang, where he spent fifteen years out of office with nothing to do but this. The discarded drafts kept there are said to have filled two rooms, and a later reader who went through them reported that not one character had been written carelessly. He returned to power in 1085, the year after the book was presented, and was dead within about a year. The work that outlasted everything was the one he did while sidelined.", "f": [{"n": "The consort clans and the eunuchs, again", "d": "One cycle recurs from the Later Han to the Tang: a child emperor, a dowager who brings in her own family, the family taking over, the emperor growing up and using the eunuchs against them, the eunuchs taking over, a new child emperor. Understand the loop and two dynasties become legible.", "eg": "The modern version has different names. A vacuum in authority is filled by whoever is standing closest, every time."}, {"n": "What the hundred and eighty-six comments judge by", "d": "Sima Guang's own verdicts run on three things: the ritual order that fixes rank, government by character, and putting capable people in office. Reduced to one line, whoever holds the people holds the empire — offered as a finding from thirteen centuries, not as a sermon.", "eg": "He is arguing that legitimacy is a resource with a balance that can be spent down, long before anyone put it that way."}, {"n": "The dangerous moment is the strong one", "d": "The pattern repeats: a capable ruler, hard work, prosperity, a peak — then the succession problem, the bad ministers, the consort clans, and collapse. He observed that nothing was ever destroyed from outside before it had rotted inside first.", "eg": "The An Lushan rebellion arrived at the height of the Tang. The fall of the Northern Song came at its richest. Neither was struck down while weak."}, {"n": "Read it against the Records", "d": "The Records of the Grand Historian asks why a person succeeded or failed, and reads like a novel. This asks why a regime rose or fell, keeps to a timeline, and reads like a case file. One shows you how people work, the other how systems work.", "eg": "On the same event, the Records gives you the last words at the river. This gives you how the strategic position had shifted over three years."}], "q": ["Good faith is the ruler's greatest treasure.", "No duty of a ruler is greater than keeping the order of rank.", "No dynasty fell to an outside enemy before it had rotted inside."], "apply": "To judge whether an organisation is healthy, use its questions rather than its finances. Is there anybody who can check the person deciding? Does bad news travel upwards? Would anyone say out loud that the emperor has no clothes? The answers move before the numbers do.", "l": ["Records of the Grand Historian", "Sima Qian", "Cao Cao", "Zhuge Liang", "Li Bi", "Li Shimin"], "contrast": [{"n": "Records of the Grand Historian", "why": "The two histories that complete each other: the Records puts people at the centre, the Mirror puts power at the centre, and you need both"}, {"n": "The Innovator's Dilemma", "why": "Structural failure, ancient and modern: the Mirror on why regimes rot, the Dilemma on why good companies lose. The underlying pattern is the same"}]}, {"c": "Strategy and competition", "n": "Mao Zedong", "e": "Modern · 1893–1976", "w": "Concentrate", "y": 1893, "d": "Between 1936 and 1949 he wrote a set of essays that survive as method rather than as history: On Contradiction, On Practice, On Protracted War, and the strategy papers of the Red Army years. One habit runs through all of them. In a confused situation, find the single contradiction that governs the others, and put everything on it. The military writing turns that habit into operating orders: fight with the weapons you actually have, concentrate a superior force, finish one opponent before starting the next. What is collected here is that method, not the later career.", "story": "In 1947 the Nationalist offensive was aimed at Yan'an, and he chose to give the town up rather than hold it. The columns that took Yan'an spent the following year garrisoning ground, strung out and tied down, while the field army stayed mobile and destroyed them piece by piece. Within a year the situation in the northwest had turned over completely. A place had been traded for the force that could still move, which is the same arithmetic as keeping the main body alive instead of reporting a win for every position held.", "f": [{"n": "One principal contradiction per stage", "d": "Many contradictions exist at any moment and one of them governs the rest. Solve that one and the others change shape by themselves. The work is not effort, it is identification, and then the harder half, which is putting the rest down for this stage.", "eg": "Weak product, few users, thin channel and a loud competitor were all shouting. Supply was the switch, and the money went there until it turned."}, {"n": "Concentrate a superior force", "d": "Better to sever one finger than to wound ten. Do not fight several opponents at once; mass overwhelming strength at one point, break it, and only then move to the next. Spread evenly, it looks like fighting everywhere and punches through nowhere.", "eg": "Five features shipped in a quarter and not one of them gives anybody a reason to stay. One at full strength beats five at a fifth."}, {"n": "No investigation, no right to speak", "d": "Conclusions belong at the end of looking into something, not at the beginning. A judgement that has not been struck back at by events is a sentence nobody has paid for, and the loop that makes knowledge is act, review, act again.", "eg": "Twenty books of method and no plan anyone can execute is normal. Those were twenty circuits other people walked."}, {"n": "The weaker side plays for time", "d": "Against someone stronger, a quick decision is their game. The three stages are defensive, stalemate, counter-offensive, and the middle one looks most like no progress while it is doing the actual work of changing the rules of the fight.", "eg": "Nine months of cash left: cut three lines to keep one alive rather than starve four together, and stop reporting a win for every position."}], "q": ["No investigation, no right to speak.", "Concentrate a superior force and destroy the enemy one by one.", "Better to sever one finger than to wound all ten.", "Keep the people and lose the ground, and you keep both."], "apply": "Before the next quarter starts, get the team to answer one question out loud: what is the principal contradiction of this stage? Put the resources on that single thing, and name what is not being done because of it.", "l": ["Sun Tzu", "Liu Bang", "Han Xin"], "contrast": [{"n": "Napoleon", "why": "Both mass everything at one point, and then split: Napoleon wants the whole thing decided in one quick battle, and On Protracted War is built on refusing that battle until the fist has formed"}, {"n": "Jeff Bezos", "why": "Opposite readings of what to hold steady. Bezos says bet on the need that will not change in ten years; this says the governing problem is different in every stage and yesterday's priority is how people die"}]}, {"c": "Strategy and competition", "n": "Guo Jia", "e": "Three Kingdoms · 170–207", "w": "Count, don't cheer", "y": 170, "d": "Cao Cao's most trusted adviser, and the one he called his extraordinary aide. He arrived at twenty-seven and for the next eleven years stood behind almost every decision that mattered: the ten defeats and ten victories before Guandu, the argument for striking north at once, and the plan for Liaodong that he left behind when he died. What the three have in common is a refusal to work in impressions. Each replaces a feeling with something that can be checked, subtracted or waited out.", "story": "He went to Yuan Shao first. After one meeting he told his friends that Shao was full of schemes and short on essentials, fond of planning and unable to decide, and would never come to anything, and he left, at a time when Shao was the strongest man in the north and Cao Cao was not. He was introduced to Cao Cao, and they talked. This, he said afterwards, is truly my lord. He was twenty-seven. Eleven years later he was dead at thirty-eight, and after the defeat at Red Cliff Cao Cao said that had Guo Jia lived, he would never have come to this.", "f": [{"n": "Ten defeats and ten victories", "d": "Facing a stronger opponent, his method was not encouragement but decomposition: turn who will win into ten specific sub-questions and answer each. The value is that a feeling becomes a judgement, and a judgement can be argued with item by item.", "eg": "We cannot beat the incumbent is a mood. Cost structure, delivery time, decision speed and channel depth, compared one by one, usually show you are not weak everywhere."}, {"n": "The window that closes", "d": "After Yuan Shao died and his son fled to the Wuhuan, everyone advised securing the rear first. Guo Jia pressed for an immediate march north: speed is the essence of war, and a chance that exists briefly is gone once the other side is settled in.", "eg": "The first two years of a new technology are the cheap years, because nothing is fixed yet. Enter after the positions harden and the price doubles."}, {"n": "The last plan, and the patience in it", "d": "Dying, he left word not to attack Gongsun Kang but to wait for him to send the heads himself. Press two wary parties and they combine against you; ease off and the old account between them reopens. Withdrawal here is a specific act, not a surrender.", "eg": "Two departments stop fighting each other the moment you intervene, and align their story against you instead. Step out and the real conflict comes back."}, {"n": "The person hardest to replace", "d": "What Cao Cao lost was not an executor. It was the one man who could see the shape of a situation and say so to his face. A team without anyone willing to say this one is wrong loses decision quality steadily, and not because anybody got stupider.", "eg": "Count the people in your last three meetings who contradicted the most senior person present. If the count is zero, that is the finding."}], "q": ["Shao has ten defeats and you have ten victories.", "Speed is the essence of war.", "Press him and they combine; ease off and they plot against each other.", "Shao is full of schemes and short on essentials."], "apply": "Take the competitive judgement you are least sure of and stop arguing about it as a whole. Write five to ten named dimensions, score each one, and start with a page listing the three ways the other side genuinely beats you.", "l": ["Cao Cao", "Sun Tzu", "Han Feizi"], "contrast": [{"n": "Zhuge Liang", "why": "The two great advisers of the age divide on risk: Guo Jia looks for the move nobody expects and takes the narrow window, Zhuge Liang builds the position that cannot be knocked over"}, {"n": "Fan Li", "why": "Two ways a gifted adviser ends. Guo Jia burned out at thirty-eight inside the work; Fan Li walked away on the day it was won and lived a long time afterwards"}]}, {"c": "Strategy and competition", "n": "The I Ching", "e": "Zhou to Warring States · China", "w": "When to move, when to wait", "y": -800, "d": "Sixty-four hexagrams, six lines each, and underneath the divination they are all asking one question: given where you are standing, what should you do? The bottom line of the first hexagram says the hidden dragon does not act, and the top line of the same hexagram says the overreaching dragon repents. The eleventh hexagram is free passage and the twelfth is blockage, sitting next to each other in the order. The Great Commentary condenses the whole thing: at the limit it changes, changed it passes through, and passing through it lasts.", "story": "Sixty-four hexagrams at six lines each comes to three hundred and eighty-four short texts, and almost none of them says do this. They say, from where you are standing, do this. The same hexagram issues six different instructions depending on which line you occupy, and the two most famous lines of the first hexagram point in opposite directions. Read straight through, the book is one long argument that the right move is a function of position, and that no position lasts.", "f": [{"n": "Being able and being due are two different times", "d": "The bottom line and the fifth are both the dragon; what differs is position, not power. Rushing to prove yourself in a new place spends your own force and carries all of the risk, and the same act two lines later is ordinary.", "eg": "New to a team, change nothing in the first month. Not because it should not be changed, but because that is when it costs the most to change."}, {"n": "There is one line above the summit", "d": "Most people take the flying dragon for the end of the hexagram. It is not. The trouble at a peak is not the height but the adding that continues after you have reached it, and what a long good run never trains is retreat, loss and letting go.", "eg": "Someone who has only ever added is clumsy the first time subtraction is the correct move."}, {"n": "The hexagram after Peace is Standstill", "d": "The wall falls back into the moat is written into the top line of Peace, not into Standstill. The turn begins at the last position of the good stretch. Read the other direction, being fully jammed is the condition under which change finally becomes possible.", "eg": "The best year is the year to work out how this ends. Equally, stop forcing a change while it still half works and push when it genuinely seizes."}], "q": ["The hidden dragon does not act.", "The overreaching dragon repents.", "At the limit it changes; changed it passes through, and so lasts.", "Now is not the normal state. It is one line of one hexagram."], "apply": "Take the thing you are in the middle of and answer one question before any other: which line am I on. If it is the bottom one, spend the month gathering rather than proving. If it is near the top, name what you have never practised.", "l": ["Sun Tzu", "Fan Li", "Zhuangzi"], "contrast": [{"n": "Tao Te Ching", "why": "Same observation, different resolution. Reversal is the movement of the Way states the law in one sentence; the I Ching cuts the same law into six positions and tells you what to do in each of them"}, {"n": "The Art of Worldly Wisdom", "why": "One says leave while your luck is still good, which is a conclusion. The I Ching says there is one more position above the good luck and it is called repentance, which is a scale"}]}, {"c": "Strategy and competition", "n": "Julius Caesar", "e": "Rome · 100–44 BC", "w": "The crossing", "y": -100, "d": "Rome's most famous general and its dictator, and the source of the line about the die being cast. He went from an aristocrat buried in debt to the conquest of Gaul, victory in the civil war and dictator for life, in about twenty years. Two of his decisions are worth more than the biography: the pause at the Rubicon, which was arithmetic rather than nerve, and the policy of pardoning defeated enemies, which he explained in a letter and which eventually helped kill him.", "story": "On the fifteenth of March, 44 BC he walked into the senate and was killed with twenty-three wounds. Among the men holding knives were Pompeians he had pardoned during the civil war and afterwards promoted, Brutus among them. He had waved away every warning that an attempt was coming, because he believed pardon bought loyalty. Suetonius reports that when he saw Brutus he spoke his last words in Greek: you too, my child? Everything he had built to defend himself faced outward, and nothing came from that direction.", "f": [{"n": "The pause is the decision", "d": "He halted at the Rubicon a long while and said out loud that they could still turn back, but that past the little bridge it would all be settled by arms. Reversible decisions deserve speed; a decision that deletes the way back deserves the night.", "eg": "Changing a tool is undone in a fortnight and needs no committee. An exclusive contract or a public side taken is worth a night at the bank."}, {"n": "The sums were done before the sentence", "d": "Ten years in Gaul had made his legions the best in Rome, Pompey's forces were scattered in Spain, and the city had nothing to hold it with. He took Italy in sixty days and almost without blood. The famous line is theatre placed on top of a calculation.", "eg": "Before you commit in public, know your own core capability, the gap in theirs, and the position you can hold in the first month."}, {"n": "Mercy as a policy, not a mood", "d": "At Corfinium he released every captured senator and returned their property, and wrote to his staff that mercy and generosity would be their new way of winning, in explicit contrast to Sulla's terror. It worked because it changed what the other side expected defeat to mean.", "eg": "When defeat means ruin, everyone fights to the end. When it means going home, resistance stops being worth paying for."}, {"n": "The narrative was part of the campaign", "d": "He wrote the Gallic War while campaigning and told it in the third person, so that the account reads as record rather than boast while building the name Caesar at the same time. Winning a war and owning the story of the war are separate pieces of work.", "eg": "He did both. Most people who did the work do only the first, and then wonder why somebody else is credited with it."}, {"n": "What outlived him was the design", "d": "His adopted son used the name to build an empire, and the name itself became the word for emperor in languages he never heard, Kaiser and Tsar among them. What lasts is rarely the memorial; it is whether the thing you set up runs without you.", "eg": "The test is unsentimental. Take yourself out for a quarter and see which of the things you built are still standing when you come back."}], "q": ["The die is cast.", "We can still turn back; beyond that bridge, arms decide everything.", "Let mercy and generosity be our new way of winning.", "I would rather be first in a village than second in Rome."], "apply": "Sort your open decisions into two piles, the ones you can walk back and the ones you cannot. Move fast on the first pile immediately, and give one of the second pile a full evening with the numbers before you say anything out loud.", "l": ["Napoleon", "Liu Bang", "Huo Qubing"], "contrast": [{"n": "Xiang Yu", "why": "Both made the irreversible move famous, and only one of them had done the sums first: Caesar crossed after a long pause and a count, Xiang Yu sank the boats and trusted the nerve"}, {"n": "Machiavelli", "why": "Machiavelli says an injured enemy must be either conciliated past all revenge or removed; Caesar pardoned and promoted his, which won the war and produced the men who killed him"}]}, {"c": "Strategy and competition", "n": "Han Xin", "e": "Han · 231–196 BC", "w": "The middle state", "y": -231, "d": "The most gifted commander in Chinese history, and the source of half the standard examples: the crawl between a bully's legs, the battle fought with a river at his back, the repaired plank road and the crossing at Chencang. His story has two halves that do not match. The rise is a military education in itself, and the fall is a single unforced error repeated for years: he would neither revolt nor hand over his power, and the middle position is the one that gets you killed.", "story": "Liu Bang once asked him how many troops the emperor himself could command. No more than a hundred thousand, said Han Xin. And you? For me, the more the better. Liu Bang laughed and asked why, in that case, he was the captive. Because your majesty cannot command troops but is very good at commanding commanders, he said, and that is heaven's gift rather than anything a man learns. It is the most honest thing he ever said, and read back from the end, the least careful.", "f": [{"n": "Dead ground, and its two conditions", "d": "Throw them onto dead ground and they will live is the famous half. The half he added is that these were men levied off the market who would have run from open ground, and that two thousand horse were meanwhile changing every flag in the enemy camp.", "eg": "A hard deadline can weld a team that has just formed. The same move on people who could already fight destroys a better rhythm."}, {"n": "Repair the plank road, cross at Chencang", "d": "He made a show of rebuilding the burned mountain walkways, which was slow, visible and exactly what the other side expected, and took his main force out through Chencang instead. Engage with the orthodox and win with the unexpected, executed once and cleanly.", "eg": "The announcement everyone can see is usually not the move. Ask what the same team is quietly doing in the same week."}, {"n": "Neither revolt nor hand over", "d": "His error was not failing to rebel. It was holding an army that frightened his king while having no intention of using it, for years. Threat is assessed on capability, never on sincerity, and the middle carries both risks at once.", "eg": "The only person who can run the one critical system is a risk however loyal they are. The answer is a second person, not a protestation."}, {"n": "He reviewed every battle", "d": "He went from an unknown drifter to the best general of the age in a very short time, and what he did after each engagement was go back over it. The gap between an expert and everyone else is not how few mistakes were made but how much came out of them.", "eg": "After the next project ends, write the three real reasons it went the way it did. Not the presentable reasons, the actual ones."}], "q": ["Throw them onto dead ground and they will live.", "He whose valour overawes his lord stands in danger.", "The hares dead, the hounds are cooked; the birds gone, the bow stored.", "For me, the more the better."], "apply": "Find the one place where you hold something other people depend on and cannot replace. Then pick a side this month: either use that position for something, or deliberately make it replaceable. Do not stay in the middle for another quarter.", "l": ["Liu Bang", "Sun Tzu", "Xiang Yu"], "contrast": [{"n": "Zhang Liang", "why": "The same court, the same victory, opposite endings: Zhang Liang stepped all the way out and died old, Han Xin kept the power and the loyalty both and lost everything"}, {"n": "Huo Qubing", "why": "Two kinds of military genius. Han Xin wins by arrangement and misjudges his own position; Huo Qubing wins by pure speed and never lives long enough for the position to matter"}]}, {"c": "Strategy and competition", "n": "Huo Qubing", "e": "Han · 140–117 BC", "w": "Undivided", "y": -140, "d": "Nephew of Emperor Wu of Han. At seventeen he took eight hundred riders far behind the Xiongnu lines; at nineteen he ran two campaigns through the Hexi corridor; at twenty-two he drove two thousand li north and made the sacrifice at Mount Langjuxu. He was dead at twenty-four. He is the clearest case in this collection of a talent that burns rather than accumulates: everything given to one thing, and then out.", "story": "Emperor Wu had a grand residence built for him and told him to go and see whether it suited. Huo Qubing declined to look at it. The Xiongnu are not yet destroyed, he said; how can I make a home? The line became the most famous refusal of comfort in Chinese history, and it was not a performance. He genuinely did not care. Every day he was alive he was fighting or preparing to fight, and he was alive for twenty-four years.", "f": [{"n": "The strength of caring about one thing", "d": "No distraction. The emperor gave him a house and he did not look at it; gifts of food did not interest him; he stayed out of court politics entirely. That is not effort, it is singularity, and what a person can reach in the one thing he genuinely minds about is not available to anyone spreading themselves.", "eg": "Whatever you find yourself giving that kind of attention to is the thing to bet on. Do not dilute it with an argument about being well rounded."}, {"n": "Never mind the old manuals", "d": "Offered instruction in the classics of war, he answered that what matters is how the plan for this campaign is drawn. The manuals encoded an army of infantry and chariots tied to a grain road; he had cavalry and no rear. The tools had changed, so the best answer had changed.", "eg": "The playbook that made the last decade of growth was written when attention was cheap. Copied faithfully now, it fails faithfully."}, {"n": "War that feeds itself", "d": "No baggage train. He resupplied from the Xiongnu camps he broke on the way, which is what made raids of two thousand li possible. The hidden premise is that every encounter must be won fast and won with enough taken. The risk did not go away; it moved out of logistics and into fighting.", "eg": "Funding each new market from the cash the last one throws off works only while every one of them turns positive fast. It is not safer than raising money."}, {"n": "What it cost, recorded in the same chapter", "d": "The historian who praised the marches also wrote that he was high-born and careless of his men, that he came back throwing away fine food while his own soldiers went hungry. Extreme tactical skill and neglect of the people carrying it sat inside one man, and both were written down.", "eg": "The manager with the best numbers on the floor can have the worst attrition. Read one fact without the other and you will staff the next team wrong."}], "q": ["The Xiongnu are not yet destroyed. How can I make a home?", "What matters is the plan for this campaign, not the old texts.", "You do not have to carry the grain. Take it from them."], "apply": "Find the one thing you already treat the way he treated the steppe, and stop apologising for the balance you are not keeping. Then check the other half of the record: name one cost that concentration is imposing on people around you, and decide whether you are willing to pay it.", "l": ["Han Xin", "Sima Yi", "Sun Tzu", "Steve Jobs"], "contrast": [{"n": "Sima Yi", "why": "The two extreme life strategies here: Huo Qubing burnt out at twenty-four, Sima Yi moved at seventy"}, {"n": "Miyamoto Musashi", "why": "Both gave everything to one craft. Musashi got sixty years of it and wrote it down; Huo Qubing got seven"}]}, {"c": "Strategy and competition", "n": "Miyamoto Musashi", "e": "Japan · 1584–1645", "w": "Unattached", "y": 1584, "d": "The most famous swordsman in Japanese history: more than sixty duels, none of them lost, the first at thirteen. At sixty he wrote the Book of Five Rings, which turned a lifetime of fighting into a general method. His claim is that the way of strategy is the way of everything, and the two rules he actually gives are both refusals: do not love a weapon, and do not look at the blade.", "story": "At about sixty he withdrew to a cave outside Kumamoto and spent two years writing. He knew he had little time. Five scrolls came out of it, named for earth, water, fire, wind and the void, and the last is a few lines long. There is no boasting in them and no list of victories. What he sets down instead is a daily discipline: rise early, train, keep at it year after year, and understanding arrives by itself. He finished the book and died within weeks.", "f": [{"n": "No favourite weapon", "d": "Leaning too hard on one weapon is the same error as not knowing how to use it. A long blade has long-blade weaknesses; a short one has short-blade weaknesses. What he refuses is not the tool but the attachment, because attachment quietly lets a tool decide which fights you can take.", "eg": "The engineer who knows one framework and the team that only knows paid acquisition both started as specialists and ended as a shape of work."}, {"n": "Perception strong, sight weak", "d": "He splits looking into two. Perception takes in the whole and the intention behind it and should be strong; sight tracks the particular movement and should be weak. See distant things as if close and close things as if distant. Watch the sword and the sword sets your tempo.", "eg": "Reacting to each of a rival's launches keeps you a beat late. Their hiring and where the money goes is the weight shifting before the launch."}, {"n": "Two swords as a way of thinking", "d": "His school used the long and the short sword together, which is a tactic and also a habit of mind: hold two views at once, one attacking and one covering, one near and one far. He drilled the refusal of a single viewpoint until it lived in the body.", "eg": "Running an argument and its inversion at the same time is the same move. The discipline is holding both without collapsing early into one."}, {"n": "The bout was decided before it began", "d": "At Ganryujima his opponent carried a famous long sword. Musashi came ashore with a wooden one cut from a boat oar, longer than the blade and belonging to no school anyone could read. Beating a man on the parameter he is proudest of turns years of his training into a liability.", "eg": "If their strength is response time, open where their response process does not reach. The stronger the strength, the slower the turn."}], "q": ["Do not have a favourite weapon.", "In all things whatsoever, rely on nothing.", "Perception is strong; sight is weak.", "See distant things as if close, and close things as if distant."], "apply": "Name the tool you reach for first and write down the situation in which it must lose. Then check this week's calendar against that description. If you are in that situation now, the question is not how to use the tool better.", "l": ["Bruce Lee", "Sun Tzu", "Tao Te Ching", "Zeng Guofan", "Kazuo Inamori"], "contrast": [{"n": "Bruce Lee", "why": "Three hundred years apart and the same instruction: Musashi says rely on nothing, Lee says be like water"}, {"n": "Huo Qubing", "why": "Both refused the inherited manual. Musashi replaced it with a method he wrote down; Huo Qubing left none"}]}, {"c": "Strategy and competition", "n": "Napoleon", "e": "France · 1769–1821", "w": "Concentration", "y": 1769, "d": "A poor Corsican who at twenty was not even a Frenchman by birth, emperor ten years later, and dead alone on Saint Helena ten years after that at fifty-one. His campaigns are the clearest demonstration anywhere of one idea: the side with fewer men in total can still be the larger side at the place where it is decided. The Civil Code he pushed through is still law in dozens of countries.", "story": "Austerlitz, 1805. Seventy-five thousand French against ninety thousand Russians and Austrians. He deliberately left his right wing thin and visible, and the allies did what the sight of it invited: they moved weight onto it, which hollowed out their own centre. When they were fully committed he sent his best troops straight through the middle, cut the allied army in two and destroyed each half. French losses around nine thousand, allied losses around thirty-six thousand.", "f": [{"n": "More men where it is decided", "d": "The art of war, in his own maxim, is to have more force at the point attacked or defended even when the army as a whole is weaker. Comparisons of total strength are a summary table; outcomes happen at points of contact, and a smaller side can win each of them in turn.", "eg": "A small team cannot compete across a market and can outspend a large company inside one account. At that point you are the big company."}, {"n": "Their dispersal is something you cause", "d": "The columns he beat piecemeal in Italy were not merely careless. His line of march threatened several objectives at once and forced them to cover each. Making the other side afraid to leave anything uncovered is the same act as making him too weak everywhere.", "eg": "Visible probes in three directions divide their defensive budget three ways. You mean to attack one; they have to hold all of it."}, {"n": "The method runs on a time difference", "d": "Beating two forces in turn requires that turning from the first to the second is faster than the two can join. Lengthen the supply, add layers of approval, and the interior position inverts into encirclement. This is how it eventually failed in his own hands.", "eg
