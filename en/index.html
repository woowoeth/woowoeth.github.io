 "why": "Franklin believed virtue could be drilled in with a chart. La Rochefoucauld thought what gets drilled in is the appearance of virtue. Read the two together for a year"}, {"n": "The Analects", "why": "Confucius holds that self-cultivation leads to benevolence. La Rochefoucauld suspects self-cultivation is only the most sophisticated form self-love has found so far"}]}, {"c": "Reading people", "n": "Nelson Mandela", "e": "South Africa · 1918–2013", "w": "Reconciliation", "y": 1918, "d": "Twenty-seven years in prison, and no revenge on the way out. He chose reconciliation and built the rainbow nation instead, which is the strongest demonstration on record of putting hatred down. The part that matters is that he was not born saintly: as a young man he backed armed struggle and helped found the wing that carried it out. Prison turned an angry revolutionary into a patient builder. The adversity changed his method and left his objective exactly where it was.", "story": "In 1994, at his inauguration as the first democratically elected black president of South Africa, three of the white warders who had guarded him on Robben Island were seated among the guests of honour. He had invited them himself. Four years earlier, walking out of the prison gate after twenty-seven years with every camera in the world pointed at him, he had raised his fist and declined to say anything angry at all. He put it later in one sentence: as he walked towards the gate, he knew that if he did not leave the bitterness and hatred behind, he would still be in prison.", "f": [{"n": "Hatred is the second prison", "d": "Resentment is drinking poison and expecting the other person to die. He had unusual amounts of time to watch what it did to people: men whose bodies were released and whose minds stayed locked in the anger. What he chose was not forgiveness, which requires an apology from someone else, but letting go, which requires only your own decision.", "eg": "He read Stoic philosophy in prison, and Sun Tzu, and anything that kept him clear-headed. The cell became a school, which is the same move Frankl made in the camps."}, {"n": "Twenty-seven years of conversion", "d": "He went in a militant who wanted the apartheid state overthrown by force. He came out the most patient man at the negotiating table. That is not softening, it is an upgrade: he had worked out that an overthrow manufactures more hatred, and that only reconciliation produces a country that lasts.", "eg": "The change is itself the argument. He had tried the other road first, which is why his conclusion is worth more than anyone's who only ever held one position."}, {"n": "Inviting the warders was political design", "d": "Seating his own jailers in the guests of honour was not a display of magnanimity. It was an exactly aimed signal to white South Africa that there was a place for them in the new country. Reconciliation was the moral choice and also the optimal strategic one.", "eg": "Reconciliation that lasts always satisfies both the moral and the practical case, so both sides can accept it because it suits them, not only because it is right."}, {"n": "Truth in exchange for amnesty", "d": "Forgiving needs the other side to admit what they did; letting go does not. Rather than demand universal apology he built the Truth and Reconciliation Commission: tell what happened and you can be pardoned. It gave perpetrators a way out and gave victims an answer, which is a form of justice that is not punishment.", "eg": "Societies coming out of conflict have studied the model ever since. Its insight is that sometimes the truth itself is the justice that was missing."}], "q": ["It is an ideal for which I am prepared to die.", "Courage was not the absence of fear, but the triumph over it.", "Sport has the power to change the world."], "apply": "Next time you notice an old grievance still drawing on you, make his distinction: forgiving and letting go are separate acts. You do not have to forgive anybody. You can decide unilaterally to put it down, not for their sake but to get yourself out of the second prison.", "l": ["Gandhi", "Viktor Frankl", "Marcus Aurelius", "Su Shi", "Wang Yangming"], "contrast": [{"n": "Viktor Frankl", "why": "Extreme adversity at its highest setting: Frankl found meaning inside a camp, Mandela turned a prison term into a political education"}, {"n": "Gandhi", "why": "Nonviolence inherited and revised: Mandela chose arms first and only arrived at Gandhi's position after twenty-seven years inside"}]}, {"c": "Reading people", "n": "Nonviolent Communication", "e": "1999 · Marshall Rosenberg", "w": "Observation first", "y": 1999, "d": "Rosenberg was a clinical psychologist who spent his working life mediating in race conflicts, divorces, prisons and war zones. What he found is that most arguments do not ignite on the disagreement itself but on an evaluation delivered as an observation. You never look after the children sounds like a statement of fact and arrives as a verdict. His structure has four steps: observation, feeling, need, request. It looks simple, and almost nobody manages the first one.", "story": "He traced the whole project back to being ten years old in Detroit in 1943, during the race riots, when the family stayed indoors for days while people were killed in the streets outside. When school started again he was beaten for his name. Two questions came out of that summer and he spent fifty years on them: what happens to people that lets them turn violent, and what is it that some people have that keeps them compassionate even then. He trained under Carl Rogers, and the method he eventually wrote down is an answer to the second question rather than the first.", "f": [{"n": "Observation and evaluation have to be separated", "d": "You were late three times this week is an observation and there is nothing in it to dispute. You are always late is an evaluation and has to be disputed. Most conversations are lost on the opening sentence, because the speaker believes they are reporting a fact and the listener receives an accusation.", "eg": "Change you do not care about this project into you were not at three of this week's meetings. Same event, one provokes defence and one provokes explanation."}, {"n": "A feeling is not a thought", "d": "I feel that you do not respect me is not a feeling, it is a judgement wrapped in one. The feeling is I am upset. The difference is the subject: a feeling is about me, a judgement is about you, and as soon as the subject slides across, the other person can only defend.", "eg": "Being ignored, in I feel ignored, is a claim about somebody else's behaviour. I am disappointed reports your own state, and nobody can contradict it."}, {"n": "There is a need underneath the blame", "d": "His central claim is that all blame is an inept expression of a need that has not been met. Underneath how can you be so selfish there is usually I need to be seen. Take blame at face value and you argue on the surface forever. Bring the need up and the conflict often deflates on the spot.", "eg": "When a partner says all you care about is work, the surface is an accusation and the need is company. Answer the need instead of the accusation and the direction changes immediately."}, {"n": "A request has to be something you could refuse", "d": "Could you show me a bit more respect is not a request, because nobody could tell you what would count as complying. Could you tell me before the meeting starts is. Vague requests fail, and after they fail both sides are more certain than before that saying anything is pointless.", "eg": "Change be more involved at home into can you do the Wednesday school run. The first is a complaint, the second is something that can be accepted or declined."}], "q": ["Observing without evaluating is the highest form of human intelligence.", "All criticism is a tragic expression of an unmet need.", "Everything we do is in service of our needs."], "apply": "Before the argument starts, run what you are about to say through the four steps. What is the specific fact I saw, with no always or never in it? What am I feeling, with myself as the subject? What do I actually need? What exactly am I asking this person to do? Speak once all four have answers.", "l": ["Alfred Adler", "Guiguzi", "Socrates", "Chris Voss", "Carl Rogers"], "contrast": [{"n": "Guiguzi", "why": "Two opposite arts of persuasion: Guiguzi works out what the other side is holding before moving on them, Rosenberg puts both sides' needs on the table in the open"}, {"n": "Socrates", "why": "Two ways of getting somebody to say the answer themselves: Socrates by questioning, Rosenberg by naming the need the other person has not said out loud"}]}, {"c": "Starting and building", "n": "Chu Shijian", "e": "1928–2019 · Yunnan", "w": "Up the mountain at seventy-four", "y": 2002, "d": "A man from Yunnan who ran a cigarette factory from the age of fifty-one and made Hongtashan the best-selling brand in China, known for nailing down the standard at every step and tying every person's pay to quality. At seventy-four it was all gone: the position, the name, most of the savings, his health. He and his wife leased four hundred acres of bare hillside and planted sugar oranges, which take four or five years to bear. The fruit sold properly a decade later, when he was eighty-four.", "story": "He was fifty-one when he was put in charge of a cigarette factory in Yuxi. What he did there was unglamorous and relentless: a written standard at every step of the process, and every person's pay tied to the quality of what came out rather than the quantity. Within a decade Hongtashan was the best-selling cigarette in the country. Two decades after that he was seventy-four, living in a work shed on a mountain with none of it left — no position, no name, no savings to speak of — except the way he ran things.", "f": [{"n": "Too late is a subtraction problem", "d": "He never argued that he was still young. He counted: an orange tree fruits in four or five years, he was seventy-four, so the first crop landed at seventy-nine, an age most people reach. The numbers cleared, so he went. Too late is nearly always a feeling, and feelings cannot count years.", "eg": "When something feels too late, write down the years it needs and the years you probably have, and look at the two numbers together."}, {"n": "The years with nothing to show are the years for foundations", "d": "While the trees carried nothing he built the irrigation, had every plot's soil tested, brought in agricultural researchers for the fertiliser mix, and cut the planting density because crowded trees give sour fruit. None of that is possible in a year with a harvest to bring in.", "eg": "Spend the stretch before results arrive on the underlying work you will never get back to once you are busy."}, {"n": "The method travelled; the industry knowledge was hired", "d": "Tobacco and oranges have nothing in common, and he first touched an orange in his seventies. The management did not change: each plot contracted to one household, paid on quality rather than weight, pruning and fertiliser and picking all written down as rules. He never pretended to know oranges. He hired the people who did.", "eg": "Changing field, sort what you know into two piles: what belongs to the industry and can be hired, and how you work, which travels with you."}, {"n": "A title is lent. A skill is grown", "d": "The first reaction to losing a position is that you are now nothing. The hillside proved the reverse: the title came from the seat and the skill came from the man, and only one of them could be taken back. Good times never make that distinction visible.", "eg": "After the position goes, do not start with who am I. Start with what can I do. That list is longer than it feels."}], "q": ["Too late is usually a feeling, and feelings cannot count years.", "The years with no harvest are the years for building the irrigation.", "A title is lent by the seat. A skill is grown by the man."], "apply": "Before deciding something is too late, put two numbers on paper: how many years the thing needs before it shows a result, and how many years you can reasonably expect to have. Only if the first fits inside the second does the question get interesting — and then ask what you are still holding as a route back.", "l": ["Kazuo Inamori", "Li Ka-shing", "Taiichi Ohno"], "contrast": [{"n": "Su Shi", "why": "Both began with one small concrete job after losing the position: Su Shi broke ground at Huangzhou, Chu Shijian built the irrigation first. Neither waited to be recognised again"}, {"n": "Kazuo Inamori", "why": "Both are about running one thing properly to the end. Inamori works on the motive and the way of thinking; Chu Shijian works on the written standard and pay tied to quality"}]}, {"c": "Starting and building", "n": "Taiichi Ohno", "e": "1912–1990 · Toyota, Japan", "w": "Ask why five times", "y": 1978, "d": "The principal architect of the Toyota Production System. Three things he worked out on the shop floor became common sense across manufacturing: ask why five times, let any worker stop the whole line, and hold inventory down so problems have nowhere to hide. Read as techniques they are a toolkit. Read properly they are one idea — every instrument he built exists to make a problem visible at the second and the place it occurs.", "story": "The book came out in 1978 and the world copied the visible half. Factories everywhere put up the boards, printed the cards, hung the cords, learned the vocabulary, and left their buffer stocks exactly where they were. The cord was there and nobody pulled it. What had been copied was the equipment; what had not was the point of it, which is that the whole system is an instrument for making problems impossible to cover up. Remove the willingness to be embarrassed in public, at the moment it happens, and none of the hardware does anything.", "f": [{"n": "The first cause is almost never the cause", "d": "A machine stops. The fuse blew — but why the overload? The bearing was not lubricated. Why not? The pump was not pumping. Why not? The shaft was worn. Why? No strainer was fitted and metal scrap got in. The fifth answer is the repair, and it is the cheapest thing in the chain.", "eg": "He was careless this time is a fuse. Keep going: why was he careless, and what made being careful impossible there?"}, {"n": "The power to stop belongs at the bottom", "d": "Whoever sees a problem first is on the line, not in the office. If only a manager may stop, the fault has to travel upward and wait for permission, and by then it has flowed past. An error caught at the first station costs a minute; found at the last it costs the whole unit.", "eg": "Letting the person doing the work say wait, this is not right is worth ten times any inspection afterwards."}, {"n": "Inventory is water and problems are rocks", "d": "With the water high the boat runs smoothly, because every rock is submerged: the unreliable machine, the supplier who misses dates, the handover nobody sorted out. Lower the water and they surface one at a time. Every margin is underwriting some problem, and an underwritten problem never gets repaired.", "eg": "Whichever stage always keeps a margin has, underneath that margin, a problem nobody has fixed."}, {"n": "Stopping is what produces", "d": "Management's instinct is to keep the line moving, because output matters. What keeps moving, though, is defective output, and more of it is worse. He inverted the order: you stop in order to produce, and refusing to stop is what actually cuts production.", "eg": "Get it out now and fix it later mostly produces rework, and rework costs far more than the pause would have."}], "q": ["Repeat why five times and the real cause shows itself.", "The man who replaces the fuse will be back next week.", "When the water is high, all the rocks are underneath it."], "apply": "Take one problem that has come back three times. Write the incident at the top of a page, then ask why underneath it five times, each answer becoming the next question. Stop when you cannot answer. If the change implied at the bottom is small and cheap, you have reached it. If it is large, you have not.", "l": ["Peter Drucker", "Kazuo Inamori", "Chu Shijian"], "contrast": [{"n": "Peter Drucker", "why": "Drucker decides which thing to do; Ohno decides how a step is kept from going wrong. One sets the direction at a desk, the other sets the standard on the floor"}, {"n": "Elon Musk", "why": "Both attack cost by refusing the answer they are given. Musk goes down to the physics of the materials; Ohno goes down the chain of causes on a stopped machine"}]}, {"c": "Starting and building", "n": "Peter Drucker", "e": "1909–2005 · Vienna to America", "w": "Results, not activity", "y": 1909, "d": "The man who turned management from supervising people into being answerable for results. He did not write job descriptions. He wrote that you are employed not because you are busy but because something usable has to come out of you. General Motors, Japanese industry and the non-profit sector all worked through his list of questions. The core is one sentence: activity does not count, results do.", "story": "During the war he was given the run of General Motors for two years. What struck him was not the strategy but the calendars: the executives were booked solid, and not one of them could say what he had actually produced that year. The advice he eventually gave is unglamorous — write down where your hours really went for one week, then look at the page. Almost nobody's best hours are on his most important work. It is not a time-management trick. It is the door into the argument that activity is not achievement.", "f": [{"n": "The purpose of a business is to create a customer", "d": "Not to create profit. Profit is the test of validity and the risk premium on the future, a result rather than a cause. Make it the purpose and everyone turns inward and decides from the statements, which is how a company comes to damage its customers in order to improve a reading.", "eg": "Four quarters of hitting profit by trimming costs, and in the fifth there is nothing left to trim and half the customers have gone."}, {"n": "Efficiency is not effectiveness", "d": "There is nothing so useless as doing with great efficiency what should not be done at all. Ask whether the thing should be done before asking how to do it faster. With the direction wrong, efficiency is an amplifier.", "eg": "Plenty of companies break the wrong goal into beautifully specific quarterly targets, hit all four, and remain on the wrong track."}, {"n": "What does the customer actually buy", "d": "The Cadillac customer buys not transportation but status. The first instinct always stops at the product. Push one layer down to what he solves with it, and the boundary of the business, its rivals and its openings are all redrawn.", "eg": "A cafe thinks it sells coffee until it notices the afternoon customer is buying a seat that is neither the office nor home."}, {"n": "Time is the only material", "d": "You cannot manage time, only what you spend it on. Write down where a week really went and strategy occupies a thin slice of the page. He told executives to hand the unimportant work to somebody else, not out of laziness but because their hours cost more.", "eg": "The meeting that exists because it has always existed is the cheapest thing on the calendar to cancel and the least likely to be cancelled."}], "q": ["There is only one valid definition of business purpose: to create a customer.", "Nothing is so useless as doing efficiently what should not be done.", "Efficiency is doing things right; effectiveness is doing the right things.", "If we were not in this already, would we go into it now?"], "apply": "On Friday write three lines: what you produced this week, what should have been produced and was not, and one activity you will stop next week. A week in which you cannot write all three is a week your calendar ate.", "l": ["Andy Grove", "Jeff Bezos", "Taiichi Ohno", "Paul Graham"], "contrast": [{"n": "Andy Grove", "why": "Grove solves execution, Drucker solves choice. One asks how a thing gets through the organisation, the other asks whether it is worth doing at all"}, {"n": "Paul Graham", "why": "Graham writes about the first hundred users and doing things that do not scale; Drucker writes about what happens after scale, when the activity outlives the reason for it"}]}, {"c": "Starting and building", "n": "Duan Yongping", "e": "Contemporary · 1961–", "w": "The stop-doing list", "y": 1961, "d": "Founder of BBK, and the source of the culture behind OPPO and vivo, two of the largest phone brands on earth, neither of which invented anything. He is the Chinese investor who paid over six hundred thousand dollars for lunch with Warren Buffett. His two rules are subtractive: do the right thing before doing the thing right, and the moment you find something is wrong, stop, whatever it costs.", "story": "In 2006 he won the auction for a charity lunch with Warren Buffett, bidding six hundred and twenty thousand dollars. What he says he took away was not a stock. It was a subtraction: an account of what a person will simply not do, held to long enough that it stops having to be argued each time. He has said as much about his own record — that it went well not because he knew what to do, but because he knew a great many things not to do.", "f": [{"n": "Do the right thing, then do the thing right", "d": "The order is the whole point. Doing a thing right is a question of skill and can be learned slowly. Doing the right thing is a question of choice, and once that choice is wrong, more effort makes the result worse. Direction is the sign; execution is only the magnitude.", "eg": "A team polishing the wrong product to a superb finish has built a motorway to the wrong destination. The better the road, the larger the loss."}, {"n": "The moment you find it is wrong, stop", "d": "Whatever it costs to stop today is the smallest cost available, because today's cost is fixed and known while the cost of continuing compounds and is not. The severity of the rule is that it deletes the most comfortable option in business, which is to watch it another quarter.", "eg": "Every quarter a wrong direction survives pulls in another cohort, another budget and a few more public promises. The cut in three months is twice as thick."}, {"n": "Dare to be last", "d": "When a category first appears nobody knows whether the demand is real or where the holes are, and the pioneers answer with their own money. Enter once the answers are visible and build it better. The condition is brutal: on entry day your version has to be visibly better, or late is only late.", "eg": "Music players, smartphones, electric cars — in each category the eventual winner was not the inventor."}, {"n": "A stop-doing list is more reliable than a to-do list", "d": "What you should do is uncertain and keeps moving. What you should not do follows from your principles and holds for years. The list also saves judgement: when something on it arrives there is nothing to argue about and no meeting to hold.", "eg": "Write your three no matter how profitable, never rules. Half your future opportunity reviews will end in ten seconds."}], "q": ["Do the right thing, and then do the thing right.", "However large the cost of stopping today, it is the smallest one.", "Dare to be last, then come first from behind.", "I know a great many things not to do."], "apply": "This week find one thing you know is wrong and are still doing, and stop it. You do not need a replacement lined up first. Stopping the wrong thing is a separate action from finding the right one, and it is the one that gets postponed.", "l": ["Warren Buffett", "Kazuo Inamori", "Jensen Huang", "Chu Shijian"], "contrast": [{"n": "Warren Buffett", "why": "Duan Yongping is Buffett's most serious Chinese student, but he moved the moat from investing to operating: Buffett buys the company that has one, Duan builds one by entering last and building better"}, {"n": "Peter Thiel", "why": "Thiel says be first into a category nobody believes in; Duan says be last into one somebody else has already proved. Both are refusals to fight in a crowd, from opposite ends"}]}, {"c": "Starting and building", "n": "Andy Grove", "e": "1936–2016 · Budapest to Intel", "w": "Strategic inflection point", "y": 1936, "d": "Intel's third employee and its fourth chief executive. He took over a memory company that Japanese competitors had driven into the wall, and left a chip company worth roughly thirty times more. His real contribution was not silicon: he wrote down how a company that has already won avoids dying. Only the Paranoid Survive is about strategic inflection points; High Output Management is the source of nearly every one-to-one and objectives system in use today.", "story": "He was born in Budapest in 1936 to a Jewish family, survived the Holocaust as a small boy living under a false name, and at twenty escaped a Hungary under Soviet control, arriving in America with almost no English. He took a doctorate in chemical engineering, joined Intel as its third employee, and ended as the chief executive who cut the business the company had been built on. The alertness people later read as a management style was not learned in business. It is the residue of a childhood spent noticing early what the adults noticed late.", "f": [{"n": "The new chief executive test", "d": "In 1985 he asked Gordon Moore what a new chief executive brought in to replace them would do. Moore said, get us out of memories. Grove said, then why don't we walk out the door, come back and do it ourselves. What blocks the decision is never information. It is attachment.", "eg": "Neither Kodak nor Nokia lacked people who could see the trend. Kodak invented the digital camera. What was missing was somebody able to cut into who we are."}, {"n": "Strategic inflection points", "d": "One of the forces around a business moves by a factor of ten, the old rules stop applying, and nobody sends a notice. The frightening part is that the beginning looks exactly like an ordinary bad quarter. By the time it is unambiguous in the numbers, the choice is no longer yours.", "eg": "To judge whether something is a tenfold change for an industry, ask whether it alters the cost structure or only the interface. The first rewrites the rules; the second is a new skin."}, {"n": "Bad news has to travel faster than good", "d": "Somebody always feels the change first, and they sit near the customer, not near the board. The question is what happened to the last person who brought bad news. If they were quietly frozen out, everybody who saw it next learned to be quiet.", "eg": "Snow melts first at the periphery. In a review, ask who noticed first, whether they said so, and what happened to them next."}, {"n": "A manager's output is the output of everyone he touches", "d": "It is the output of the organisation under him plus that of the organisations he influences. How much he did himself counts for nothing; only how much he multiplied counts. Which leaves three high-leverage activities — training, one-to-ones and decisions — and very little else.", "eg": "A ninety-minute one-to-one covers a fortnight of somebody's work. Run as a status report, it has only the value of a status report."}], "q": ["Only the paranoid survive.", "If we got kicked out, what would a new chief executive do?", "Let bad news travel faster than good news.", "Snow melts first at the periphery.", "A strategic inflection point looks at first like a bad quarter."], "apply": "Once a quarter, run the new chief executive test on yourself. If somebody landed in your seat tomorrow with no attachment to anything you have built, what would they cut in the first week and what would they double? Write both lists, then answer honestly why you are not doing it. The answer is rarely the timing.", "l": ["Jensen Huang", "Peter Drucker", "Steve Jobs", "Jeff Bezos", "Duan Yongping"], "contrast": [{"n": "Steve Jobs", "why": "Jobs disrupted other people on instinct and taste; Grove disrupted himself on process and data. The same act performed by two temperaments"}, {"n": "Jensen Huang", "why": "Both walked out of the business that was making the money. Grove left memory under fire; Huang left mobile chips while they were still growing"}]}, {"c": "Starting and building", "n": "Jensen Huang", "e": "Contemporary · 1963–", "w": "Zero-billion markets", "y": 1963, "d": "Founder and chief executive of Nvidia, still in the seat after more than thirty years. In 2006 he made a decision that looked like burning money: build CUDA, so a graphics chip could do general computation. There were no customers for it and no market. Seventeen years later the AI boom arrived and all of it was running on his foundations. He did not bet on an application. He bet on a capability, and then paid to keep it alive.", "story": "In 1995 Nvidia's first product shipped and failed. Microsoft's DirectX made the approach it was built on obsolete almost overnight, and the company was close to finished. He stood in front of the staff who were left and said, in effect, that he needed their help to get Nvidia out of this. Not I have a plan, follow me. I need you. It is a small thing to notice about a man now running one of the most valuable companies on earth, and it is why there was anybody left to run it.", "f": [{"n": "Zero-billion-dollar markets", "d": "Not billion-dollar markets: markets whose size today is zero, where there are no competitors because there are no customers. Enter one and the toolchain, the interfaces and the developers' habits are yours to define. What you buy is not a head start but the seat where the rules get written.", "eg": "Early in a category the valuable move is not selling units. It is making your interface the default that later arrivals have to build on."}, {"n": "Two lines of blood supply", "d": "A zero market pays nothing for a decade. Gaming cards were the mature business feeding cash while CUDA burned it. Without the first the second is suicide; without the second the first is only a good business. Ambition shows up as a line you let look terrible for ten years.", "eg": "Most companies cannot hold a dark line open, not for lack of money but because they cannot survive the quarterly question about when it will earn."}, {"n": "Always thirty days from going out of business", "d": "He says the company is thirty days from going out of business, and it is not modesty. Nvidia has been near the end at least three times. A permanent sense of the edge means that when the real emergency lands, nobody in the room is stunned by it.", "eg": "The teams that handle a crisis worst are the ones that had never once rehearsed the sentence this could end."}, {"n": "Retreat is hardest for the ablest", "d": "Nvidia left mobile chips while they were still growing, on the structure rather than the quarter, and moved the engineers to robotics. He told the Taipei graduates that retreat does not come easily to brilliant people, and that deciding what to give up is central to success.", "eg": "The failing project hardest to kill is the one given to the best team, because nobody wants a loss on that record."}], "q": ["We go after zero-billion-dollar markets.", "Our company is thirty days from going out of business.", "Retreat does not come easily to brilliant, successful people.", "Run, don't walk."], "apply": "In your next plan, add a second question to how big is this market today. Ask which underlying capability, if it kept improving for five years, would unlock things that cannot be built now — and what it would cost to keep that line alive until then. Betting on a capability usually beats betting on an application.", "l": ["Andy Grove", "Peter Thiel", "Duan Yongping", "Elon Musk"], "contrast": [{"n": "Peter Thiel", "why": "Thiel asks what important truth very few people agree with you on. Building CUDA in 2006, when the industry was certain a graphics chip was for drawing pictures, is a live specimen of the answer"}, {"n": "Duan Yongping", "why": "Opposite entries into a new category. Huang goes in before it exists and pays for a decade; Duan waits until somebody else has proved it and then builds the better version"}]}, {"c": "Starting and building", "n": "Kazuo Inamori", "e": "1932–2022 · Kyoto", "w": "The multiplier", "y": 1932, "d": "Founded Kyocera at twenty-seven and the telecoms company that became KDDI at fifty-two, both of which reached the Fortune 500. At seventy-eight he was asked to take over Japan Airlines, then bankrupt, and did it for no salary; it was profitable within a year. His central idea is that acting for others is not a moral choice but the better long-term strategy, and he reduced it to arithmetic anybody can run.", "story": "In 2010 Japan Airlines went bankrupt and the government asked a man of seventy-eight to run it. He took the job and no salary. The first thing he did was not to cut staff. He called the senior managers together and asked them what they were working for. Nobody answered. He told them: for your families, for the passengers on your aircraft, for the society you belong to. A year later the airline posted the largest profit in its history. The route-by-route accounting mattered too, but the silence in that room is where it started.", "f": [{"n": "The formula for a life", "d": "The result of life and work equals way of thinking times enthusiasm times ability. Ability and enthusiasm run from zero to a hundred. The way of thinking runs from minus a hundred to plus a hundred, and it is the only factor carrying a sign. Direction beats speed because multiplication carries the sign.", "eg": "A top performer who grabs credit and pushes blame down computes to a large negative. His ability is amplifying his direction."}, {"n": "Six ways of improving", "d": "Work harder than anyone, stay humble, reflect daily, live in gratitude, do good and act for others, and do not brood on troubles. Six items, all pointing at one thing: taking the self out of the centre.", "eg": "Run the six as a checklist before sleep. Was I lazy today? Proud? Did I reflect, thank anyone, help anyone, or worry pointlessly?"}, {"n": "Amoeba management", "d": "The company is divided into the smallest units that can keep their own books, each with its own revenue, cost and profit, updated daily and visible to everyone in it. What it produces is not better reporting but ownership: at that size a person can see his own hand in the number.", "eg": "A team that cannot see its own revenue and cost line has no way to feel responsible for either, whatever the poster on the wall says."}, {"n": "Acting for others is the better strategy", "d": "Is my motive pure, is there any self-interest in it: the question he put to himself nightly for six months before founding a telecoms company. Over a single round self-interest wins. Over a repeated game, the trust earned by letting the other side win first outruns it.", "eg": "The founder who takes no pay and gives shares away earns real trust. If the numbers are still wrong, that trust only makes everyone pull harder into the iceberg."}], "q": ["Respect the divine and love people.", "Result of life and work equals thinking times enthusiasm times ability.", "Is my motive pure? Is there any self-interest in it?", "Work is the best training."], "apply": "Before sleep, run the six briefly: did I work hard, stay humble, reflect, give thanks, do something for somebody, and refuse to brood? It takes a minute, and its value is not the score. It is that the questions are all about direction, and direction is the only factor in the formula that can go negative.", "l": ["Chu Shijian", "Taiichi Ohno", "Duan Yongping", "Warren Buffett"], "contrast": [{"n": "Chu Shijian", "why": "Both are about running one thing properly to the end. Inamori starts from the motive and the way of thinking; Chu Shijian starts from the written standard and pay tied to quality"}, {"n": "Charlie Munger", "why": "Two versions of character as a business input. Munger treats reliability as a way of not being stupid; Inamori puts it in the formula as the one factor that can turn the answer negative"}]}, {"c": "Starting and building", "n": "The Innovator's Dilemma", "e": "1997 · Clayton Christensen", "w": "Disruption", "y": 1997, "d": "Clayton Christensen asked one of the most useful questions in business history: why do excellent companies fail? Not through laziness or stupidity, but because they did everything right — listened to their best customers, invested in their most profitable products, concentrated on their largest markets. Those correct decisions are exactly what leaves them blind to a disruptive technology. The book describes a mechanism, not a character flaw.", "story": "In 1975 a Kodak engineer named Steve Sasson built the first digital camera. He took it to management, and the response was: that is cute, but do not tell anyone about it. The reason was simple. A digital camera would eat the film business, and film carried extraordinary margins. Twenty years later digital had wiped out the film market and Kodak filed for bankruptcy. This was not a blunder. In 1975, judged purely as profit maximisation, suppressing the camera was the correct call. They took the short-term optimum and gave up long-term survival.", "f": [{"n": "Disruptive innovation", "d": "Disruptive innovation is not better technology. It usually starts out worse than what exists, but cheaper, simpler, and aimed at customers you do not serve. It begins in markets that are not good enough to matter, improves steadily, and by the time it serves the mainstream well enough the leader has run out of time to react.", "eg": "Early personal computers were far weaker than mainframes, but cheap and made for ordinary people. Mainframe firms judged them not a competitor, because their customers, enterprises, would never buy one. By the time a PC was good enough for the enterprise, the mainframe market had shrunk badly."}, {"n": "The value network trap", "d": "Every company is embedded in a value network: particular customers, suppliers, partners and processes. That network decides what counts as valuable and what counts as pointless. A disruptive technology looks worthless inside the existing network and central inside the new one, and switching networks means rebuilding almost the whole company.", "eg": "Nokia was perfect inside the feature-phone network: carrier channels, low-cost global manufacturing, a formidable supply chain. Smartphones needed a different network entirely — software ecosystem, third-party developers, internet services. The advantage and the shackle were the same asset."}, {"n": "The resource-allocation paradox", "d": "The daily work of a good manager is to send resources toward the highest margin and the largest market. That guarantees a disruptive technology never gets funded, because its market is small and its margin is thin. The failure is not a strategic mistake; it is the allocation machinery working correctly.", "eg": "Kodak knew digital was coming. Film contributed sixty per cent of profit, and any resource moving from film to digital damaged the current statement. Reasonable short-term decisions, accumulated, are the dilemma."}, {"n": "The remedy is a separate organisation", "d": "Christensen's answer is to give the disruptive technology to an organisation that is genuinely independent, so it is not bound by the parent's value network and is small enough to be excited by orders the parent would round to zero.", "eg": "Amazon built AWS well outside the retail body, at a time when everyone considered cloud a fringe business. The independence is what let it build a value network of its own."}, {"n": "The managers did nothing wrong", "d": "The most important line in the book is the least comfortable one: the managers of the disrupted companies usually made no mistakes. They served their customers, allocated capital well and chased higher returns. Every decision was right and the outcome was wrong, which puts the fault in the incentive system rather than in the people."}], "q": ["Good management was the most powerful reason they failed to stay atop their industries.", "Disruptive technologies are not born among your best customers.", "Listening to your customers can be the largest mistake you make.", "Small markets don't solve the growth needs of large companies."], "apply": "Look hard at your main business. Is there a slightly worse substitute growing in a market you look down on, at a margin you consider too thin to bother with? If there is, it may be your disrupter — not because it is better today, but because it runs on a logic your own process cannot switch to.", "l": ["Peter Thiel", "Wang Xing", "Zhang Yiming", "Andy Grove"], "contrast": [{"n": "Peter Thiel", "why": "Two sides of one event: the dilemma explains why a good company loses, Thiel tells you how to be the thing that makes it lose"}, {"n": "Jeff Bezos", "why": "Bezos ran Christensen's remedy deliberately — AWS was built outside the retail body, and that independence is what allowed it to be small"}]}, {"c": "Starting and building", "n": "Kevin Kelly", "e": "2008 · founding editor of Wired", "w": "True fans", "y": 2008, "d": "Founding editor of Wired. In 2008 he turned the survival problem of the independent creator into arithmetic: a thousand true fans, a hundred dollars each a year, is a hundred thousand dollars — enough for one person to live on. His definition of a true fan is strict: someone who will buy anything you produce and drive two hundred miles to see you play. The value of the sum is that it takes fame off the list of requirements. He attached a second condition most people forget: the money has to reach you directly.", "story": "The fashionable idea in 2008 was the long tail — infinite shelf space, everything findable, an audience for every niche. Kelly's essay opens by granting the point and then turning it over. The long tail is famously good news for a handful of aggregators and for consumers; for the individual creator standing out in the tail it is a decidedly mixed blessing, because the tail is long and it is thin. So he asked a different question. Not how do I climb toward the head of the curve, but how many people, exactly, does one person need. Then he did the multiplication.", "f": [{"n": "A thousand can be counted; a million is a lottery", "d": "The solid part of the sum is that a thousand people can be reached three a day for a year, which is a schedule somebody can actually execute. A million is not assembled by effort. Swap the target and the working day changes shape immediately.", "eg": "Did one more person who will actually come back arrive today? You can ask that every evening. Did I go viral today? You cannot."}, {"n": "A hundred dollars a year is a design brief", "d": "Read the number backwards and it stops being a revenue target and becomes a question about what you make: what must exist in a year that somebody who genuinely likes you will spend a hundred dollars on? That pushes you off producing more and onto producing one thing worth buying.", "eg": "A whole year of free updates is worth less than one thing they will pay for: a course, a printed book, an evening in a room."}, {"n": "Whoever holds the list holds your living", "d": "There is one test, and it is unkind. If this platform throttled or banned you tomorrow, could you still reach those thousand people? If not, you never had a thousand fans — you were renting traffic and calling it an audience.", "eg": "A mailing list, a group chat, your own site: anything you could walk out with counts. A follower number does not."}, {"n": "The cut takes the feedback, not only the money", "d": "With an intermediary in the middle you cannot see who bought, why they bought, or when they stopped. The percentage is the visible loss; the invisible one is the information that would have told you what to change next.", "eg": "One reply explaining why somebody unsubscribed is worth more than a retention curve on a dashboard."}], "q": ["A creator needs to acquire only 1,000 True Fans to make a living.", "A True Fan is defined as a fan that will buy anything you produce.", "You must have a direct relationship with your fans; they must pay you directly."], "apply": "If you make things and keep waiting for one to break out, count two numbers first: how many people would pay you today, and how many of them you can name. Then do the more urgent thing — before growing the audience further, solve how you would take them with you, by putting one direct route to yourself into every piece you publish. Do it in the other order and the day your follower count looks best is usually the day your leverage is lowest.", "l": ["Naval Ravikant", "Paul Graham", "Jensen Huang", "Duan Yongping"], "contrast": [{"n": "Naval Ravikant", "why": "Both are about earning without an employer: Naval gives you specific knowledge times leverage, Kelly gives you a sum you can run backwards into a product"}, {"n": "Paul Graham", "why": "Do things that do not scale and a thousand true fans are the two ends of one idea: the first says start by hand, the second says by hand can carry you all the way"}, {"n": "Peter Thiel", "why": "Thiel wants a monopoly on a large market, Kelly wants depth with a thousand people — both routes avoid competition, one by scale, one by relationship"}]}, {"c": "Starting and building", "n": "Konosuke Matsushita", "e": "Japan · 1894–1989", "w": "Tap water", "y": 1894, "d": "He left school at nine to be an apprentice, started at twenty-three making a two-socket lamp fitting at home with two helpers, and ended with Matsushita Electric, now Panasonic. Japan called him the god of management. What makes him worth reading is not the size of the company but that he was the first to treat why does this company exist as a technical question with a technical answer: get the mission right and the organisation grows out of it; get it wrong and efficiency only makes you more dangerous.", "story": "Late in life he lectured on what he called dam management: build a reservoir into your cash, your equipment, your inventory and your people, the way a dam holds water against a dry season. In the questions afterwards somebody asked, reasonably enough, how a company with no spare money is supposed to build a reservoir. Matsushita paused and said: first, you have to genuinely want one. The hall laughed. One man in the audience did not. Kazuo Inamori later said the sentence went through him like a current, and that it changed his life.", "f": [{"n": "Dam management", "d": "A dam on a river exists to hold water and regulate the flow, and a company needs one in capital, equipment, inventory and talent: a margin it does not currently use. In good years the reserve looks like waste. In bad years it is the only reason you still have choices.", "eg": "A firm with reserves can halve production and keep everybody. A firm without them can only cut people. The humane option is bought years in advance."}, {"n": "Glass-box management", "d": "Financial and operating information is open internally, visible like glass. The point is not to move people emotionally, it is judgement: someone who knows the numbers can make a decision, and someone who does not can only carry out instructions.", "eg": "Show a team the unit economics of what they build and the arguments change register within a month."}, {"n": "Make people before you make products", "d": "Matsushita Electric makes people, and also happens to make electrical goods. Countless companies have copied that sentence onto a wall, but he meant it literally, treating the manufacture of judgement as the main product and the appliances as the by-product.", "eg": "He asked staff who were questioned about their employer to answer with the people line first and the product line second."}, {"n": "The divisional system", "d": "In 1933 he invented the divisional company, giving each product line its own accounts and its own profit and loss. The aim was not efficiency. It was to have as many people as possible practising decisions in front of a real statement.", "eg": "Modern business units, the amoeba system and internal startups all run down this line from 1933."}, {"n": "Three blessings", "d": "He said he had three pieces of luck: a poor family, so he learned early where money comes from; a weak body, so he had to hand work to others; no schooling, so he had to ask everyone about everything. Three deficits, each converted into an organisational capability.", "eg": "Delegation was not a management theory he adopted. His health forced it, and the result was a company that learned not to depend on its founder."}], "q": ["Matsushita Electric makes people, and also makes electrical goods.", "Make goods as inexhaustible and as cheap as tap water.", "My three blessings: a poor family, a weak body, no schooling.", "The worse the times, the more the power of management counts."], "apply": "Two things transfer directly. First, build a reservoir into cash, people and time: the reserve always looks excessive while things are good, and it decides whether a bad year leaves you with choices or only with layoffs. Second, write the mission until it can settle a concrete argument on its own — if it cannot help you judge whether this particular price should come down, it is still only a slogan.", "l": ["Kazuo Inamori", "Ren Zhengfei", "Duan Yongping", "Andy Grove", "Nassim Taleb"], "contrast": [{"n": "Kazuo Inamori", "why": "Inamori heard the dam lecture in person and never got over it; the difference is that Matsushita keeps his margin in the structure, Inamori keeps it in people and accounting"}, {"n": "Ren Zhengfei", "why": "Both put survival first and take opposite routes: Matsushita stores water in the good years, Ren manufactures a sense of crisis so nobody relaxes"}, {"n": "Nassim Taleb", "why": "Dam management is antifragility in industrial form — redundancy is a cost in calm weather and the whole of your optionality when the shock lands"}]}, {"c": "Starting and building", "n": "Ren Zhengfei", "e": "Contemporary · 1944–", "w": "Endurance", "y": 1944, "d": "In 1987, at forty-three, he put twenty thousand yuan into a Shenzhen company reselling other people's telephone switches. Three decades later Huawei was the largest maker of telecommunications equipment in the world. Two ideas run through everything he writes to staff: self-criticism is the organisation's immune system, and the customer is its north star. He is unusual among founders in that most of his thinking survives as ordinary internal documents, published and readable.", "story": "He started late. At forty-three, an age when most people have stopped starting things, he was reselling switches made by other companies out of an office in Shenzhen. Thirty years later the company was the largest equipment maker in its industry anywhere. Asked about that arc, his line was that Huawei has had no success, only growth. It is not modesty. In his vocabulary success is a place where you are allowed to stand still, and standing still is precisely what he has spent thirty years designing the company not to do.", "f": [{"n": "Survival is the goal", "d": "Staying alive is the plainest goal Huawei has, and also the highest one. A dead company's vision is worth nothing, so everything else is subordinate to the question of whether the firm is still here in ten years. The habit is what kept the organisation from freezing when trouble actually arrived.", "eg": "Ask of any strategy proposal: does this raise or lower our chance of existing in a decade? Many impressive plans do not survive the question."}, {"n": "Self-criticism as an immune system", "d": "In the best year of Huawei's history he wrote an essay describing in detail how the company might die. Seeing risk while conditions are good is the whole trick: self-criticism is not self-doubt, it is the deliberate exposure of your own blind spots before someone else finds them.", "eg": "Put the near-miss, not the win, at the top of the weekly agenda and the organisation slowly grows a warning system instead of a congratulation system."}, {"n": "Customer first, striver second", "d": "Customer-centred, striver-based is one sentence with two jobs. The first half sets direction, aiming every resource at customer value. The second half supplies the motive, by making sure the people actually doing the work are the people who get paid for it.", "eg": "A reward system that pays proximity to power rather than proximity to the customer will quietly reverse the first half of the sentence within a year."}, {"n": "Sew the winter coat in summer", "d": "Winter passes and spring returns, but the coat has to exist before the cold does. Contingency, cash and a second capability are cheap to build in a strong year and impossible to build in a weak one, which is why the timing of his most famous essay is the argument.", "eg": "Run the stress test in the record quarter. The same exercise in a falling quarter reads as panic and lands on morale."}], "q": ["Staying alive is Huawei's plainest goal and its highest one.", "Huawei has had no success, only growth.", "For ten years I have thought about failure every day, not success.", "Let the people who hear the gunfire call in the artillery."], "apply": "Once a year, write yourself the winter scenario: if the most important customer or the largest source of revenue disappeared next year, what exactly would you do? Write it while the numbers are good, because the same document written in a bad quarter is no longer planning, it is triage.", "l": ["Kazuo Inamori", "Zeng Guofan", "Steve Jobs", "Jensen Huang"], "contrast": [{"n": "Kazuo Inamori", "why": "Two eastern versions of the company as a practice: Inamori binds people with an ethic of doing right by them, Ren drives them with self-criticism and a sense of crisis — one uses good, one uses fear"}, {"n": "Zeng Guofan", "why": "The same method a hundred and thirty years apart: build the solid camp and fight the slow fight, no shortcuts, no clever moves, never be beatable before you try to win"}]}, {"c": "Starting and building", "n": "Wang Xing", "e": "Contemporary · 1979–", "w": "Nine losses, one win", "y": 1979, "d": "Founder of Meituan. Before it he had failed eight times: a Chinese Facebook, sold; a Chinese Twitter, shut down. On the tenth attempt he bet on group buying, survived the most violent competition in Chinese internet history, and turned Meituan into a platform for eating, staying and getting around. What he is worth reading for is the pair of tests he runs: what actually counts as our business, and what is all this activity replacing.", "story": "In 2010 the group-buying model reached China and five thousand sites appeared almost overnight, in what became known as the war of a thousand groupons. Wang Xing did not burn money to buy share the way everyone else did. He required Meituan to expand only into cities whose numbers were healthy and refused orders that lost money. Everyone expected him to lose, because share needs speed, not thrift. Two years later ninety-nine per cent of those sites were gone and Meituan held the remaining one per cent. His account of it: we did not win by burning harder, we won by lasting longer.", "f": [{"n": "Nine losses, one win", "d": "Eight consecutive failed companies, each one fully reviewed afterwards and written up as why this failed and what must not repeat. That is a method rather than an inspirational story: failure is data, not a verdict. You make the available mistakes first and spend the accumulated understanding on the fight that matters.", "eg": "Having sold one company far too cheaply, he refused unequal terms when raising money for Meituan, taking less cash to keep control. The lesson from the eighth attempt decided the tenth."}, {"n": "Slow is fast", "d": "He refused growth for the sake of growth, and required each city to have working unit economics before the next one opened. Short term that is slower than the competition. Long term the cities without working economics turn into holes that burn cash, and the competition falls in first.", "eg": "During the group-buying war several rivals were larger than Meituan and expanded on gross volume with no view of profit. Two years later Meituan was the only healthy company left standing."}, {"n": "Jumping the S-curve", "d": "Every business has an S-curve, from emergence through rapid growth to maturity, and you have to find the next curve's beginning before the current one matures. Meituan entered delivery before group buying peaked, and started hotels while delivery was still accelerating. The jumps were designed, not lucky.", "eg": "Kodak sat at the top of the film curve twenty-two years after the digital camera had been invented and did not jump. The alternative is to go looking for the next curve before anything forces you to."}, {"n": "User value is the north star", "d": "The first question on any new business is why would somebody use this — not how large the market is and not what the competition is doing, but the real motive of the person. He built the habit early by watching students use his product in their own rooms rather than reading reports about it.", "eg": "Against a subsidy war in food delivery he made courier speed and on-time rate the core metrics, because what the customer wants is food that is still hot, not food that is cheapest."}, {"n": "A ten-year operating system", "d": "He reads heavily, science fiction included, on the grounds that it is a way of testing long-range logic with the imagination. Decisions get taken on a ten-year view: will this still matter in a decade, and if so it should be started now whatever this quarter's statement looks like.", "eg": "Ask of a proposal only that it clear three bars: will it matter in ten years, what does the user actually want, and do the unit economics close."}], "q": ["Most people will do anything rather than face real thinking.", "Choose the right thing to do, not the easy thing.", "We did not win by burning harder. We won by lasting longer.", "Too many people watch the boundary instead of the core."], "apply": "Next time you weigh a new business or a new direction, ask the three questions in order: will this still matter in ten years, what does the user actually want, and can the unit economics close. Only something that survives all three is worth the resources.", "l": ["Zhang Yiming", "Peter Thiel", "Warren Buffett", "Ren Zhengfei"], "contrast": [{"n": "Zhang Yiming", "why": "Two philosophies from the same generation: Wang Xing's nine losses and one win runs on endurance, Zhang Yiming's delayed gratification runs on arithmetic — two different kinds of slow"}, {"n": "Warren Buffett", "why": "Two shapes of the long view: Buffett will not own something for ten minutes he would not own for ten years, Wang Xing asks whether the thing will still matter in ten years"}]}, {"c": "Starting and building", "n": "Zhang Yiming", "e": "Contemporary · 1983–", "w": "Delayed gratification", "y": 1983, "d": "Founder of ByteDance, the company behind Toutiao and TikTok. Relentlessly rational, hostile to vague language, willing to let a recommendation engine decide what a person sees. He treats cognitive bias as the largest single source of wasted effort, which is why delayed gratification and a ban on hedging words became the operating system for himself and for his teams.", "story": "One passage of his gets quoted constantly: I have met a great many clever people, but very few willing to delay gratification, and people at different orders of that willingness cannot usefully discuss a problem at all. He spent five years grinding on product with almost nothing said in public — no speaking slots, no profiles, just the work. The sentence is not advice about patience. It is a claim that this one trait sorts people into groups that cannot hold a conversation with each other.", "f": [{"n": "Delayed gratification", "d": "Giving up a present pleasure for a longer-run value is a scarce capability and, in his account, the sharpest way to tell people apart. When he picks a partner or an employee the first measure is not raw ability but how far out that person is willing to place the payout.", "eg": "Look at a record of past moves: always the highest immediate pay, or sometimes the steepest slope. The answer is already written down."}, {"n": "Against vagueness", "d": "He asks people to speak without maybe, roughly, I feel and it seems, forcing precision. If you cannot say it clearly you have not thought it through, and something not thought through is most likely wrong before anyone starts building it.", "eg": "Rewrite a hedged claim as: I think X, because Y, confidence Z per cent. Half the sentences do not survive the rewrite."}, {"n": "The company is the product", "d": "Develop the company as though it were a product: you are not only building the thing users touch but also the organisation, the incentives and the information flow behind it. Optimising one part in isolation is the usual way of manufacturing a problem somewhere else.", "eg": "A team rewarded on its own metric will improve that metric and quietly damage two others nobody is watching."}, {"n": "User value has a time dimension", "d": "Will this product still be worth something in three years is the question he puts against short-term numbers, and he refuses trades that lift this quarter by taking from the experience that produces every later quarter.", "eg": "An extra advertising slot lifts revenue this month and is deducted from retention later. Put both curves on one chart before deciding."}], "q": ["People at different orders of delayed gratification cannot discuss problems usefully.", "Delayed gratification is one of the qualities I value most.", "A startup's biggest advantage is execution, not the idea.", "Keep an ordinary mind while doing extraordinary things."], "apply": "At the next team meeting, ban maybe, roughly and I feel from everyone's speech, and require every judgement in the form: I think X, because Y, confidence Z per cent. The point is not precision for its own sake. It is that a claim in that shape can be proved wrong, and the ones that cannot be stated in it were never judgements at all.", "l": ["Duan Yongping", "Jensen Huang", "Wang Xing"], "contrast": [{"n": "Wang Xing", "why": "Two philosophies from the same generation: Zhang Yiming runs on algorithms and arithmetic, Wang Xing on intuition and endurance"}, {"n": "Kazuo Inamori", "why": "Two kinds of extreme seriousness: Inamori is driven by an ethic he treats as almost religious, Zhang Yiming by a refusal to let anything stay vague"}]}, {"c": "Mind and feeling", "n": "Augustine", "e": "354–430 · Hippo, North Africa", "w": "Grant me chastity, but not yet", "y": 400, "d": "A bishop in Roman North Africa, and the author of the Confessions, which he wrote in his forties about the first half of his own life. It is the first book in the West that reports from inside the experience of knowing exactly what to do and not doing it. He is here not as a theologian but as a witness: he wanted to change, he could not, and he took the failure apart while it was still happening to him. Sixteen centuries before habit science, he had already located the problem in the will rather than in the knowledge.", "story": "Book Eleven of the Confessions stops the autobiography dead and asks what time is. The answer is one of the most quoted sentences in philosophy: if nobody asks me, I know; if I want to explain it to someone who asks, I do not know. Then, instead of retreating behind the paradox, he keeps going, and works out that past and future have no existence outside a present mind holding them. It is the same procedure he uses on his own failures. Take an experience everybody has, refuse the ready-made account of it, and keep looking until the mechanism shows.", "f": [{"n": "The wanting is real, and so is the not yet", "d": "Grant me chastity and continence, but not yet. He is clear that both halves were sincere: he wanted the outcome and he did not want today. So reinforcing the wanting does nothing, because that side was never short. Not yet is a permit that renews itself every morning, and it will not lapse on its own.", "eg": "How many times have you said after this busy stretch? Somebody has to tear that up; it does not expire."}, {"n": "Some wrongs have no reason at all", "d": "At sixteen he and a gang stripped a neighbour's pear tree. There were better pears at home and they threw most of the stolen ones to the pigs. Decades later he hunts for a motive and concludes there was none, only an occasion: alone, he says, he would never have gone.", "eg": "If why did I do that has produced nothing after twenty attempts, cross the question out and look at who was standing there."}, {"n": "Not a weak will, a divided one", "d": "In the garden he notices that the mind commands the body and is instantly obeyed, while the mind commands itself and is resisted. His conclusion is that there are two wills and both are his. That is why more resolve does not help: it adds to one side while the other stays exactly where it was.", "eg": "I do not want to is not laziness. Some part of you is guarding something. Ask what it is guarding before you decide again."}], "q": ["He turned putting it off into a prayer, and meant both halves.", "The pears went to the pigs. He never wanted pears.", "The hand obeys the mind. The mind does not."], "apply": "Take the thing you keep not starting and count how many times this month you have said not yet, then name the one comfort that starting tonight would cost you. That comfort, not a shortage of resolve, is what the other half of you is protecting.", "l": ["Atomic Habits", "BJ Fogg", "Rat Park", "Wang Yangming"], "contrast": [{"n": "Wang Yangming", "why": "Both on knowing and not doing. Wang says knowing without acting was never real knowing; Augustine says the knowing is real and two wills are fighting"}, {"n": "Atomic Habits", "why": "One gives the method for redesigning the system, the other reports what is happening inside when no method will go in"}]}, {"c": "Mind and feeling", "n": "The Bhagavad Gita", "e": "India · c. 200 BC–200 AD", "w": "A right to the act, not the fruit", "y": -200, "d": "Seven hundred verses in eighteen chapters, embedded in the Indian epic the Mahabharata, and dated by most scholars somewhere between the second century BC and the second century AD. The whole of it is one conversation on the eve of a battle, between the archer Arjuna and his charioteer Krishna. Arjuna looks across at the opposing army, sees his own relatives and teachers in the ranks, and refuses to fight. Chapter two, verse forty-seven is the line the world quotes: your right is to action alone, never to its fruits. Gandhi called the book his spiritual dictionary.", "story": "Most English readers have already met this book once, at second hand. Watching the first atomic test in 1945, Robert Oppenheimer said a line from its eleventh chapter came into his mind: now I am become Death, the destroyer of worlds. He had learned Sanskrit in order to read it. What that famous moment hides is the situation the book is actually about, which is much smaller and much more common. One man, before anything has happened, who can see exactly what his own action will cost and cannot make himself begin.", "f": [{"n": "The line falls between the act and the yield", "d": "Whether you do it, how, and how much today are on your side. Whether the market takes it, the committee approves it, the other person replies, are not. Not asking for the harvest is not the same as refusing to look at it: results are information for adjusting the next action, not a vote on whether to continue.", "eg": "Two columns, mine and not mine. Work the left one, and read the right one only to see what changes tomorrow."}, {"n": "Being stuck is usually seeing the whole cost at once", "d": "Arjuna is the best archer alive; his ability is not the problem. He has loaded every consequence of the whole war into a single view, and under that load no individual step is bearable. Telling a man in that state that he can do it is useless, because confidence is not what jammed.", "eg": "Price today's step on its own. Stop costing out the entire road every time you sit down."}, {"n": "The test is what happens if the reward is removed", "d": "Suppose the return is definitely gone. Do you still do it? If not, the payoff was the work all along and this was only the road to it. Opening the hand does not mean caring less; it means today's quantity is set by you rather than by the day's news.", "eg": "Decide the amount in advance and hold it whether or not anything good arrives in the inbox."}], "q": ["The line falls on the side of the act, not the harvest.", "Eighteen chapters of argument, and he still has to walk over there himself.", "Take the reward away. Whether you still do it is the fact."], "apply": "Name the parts of your stalled project that are genuinely yours, set today's amount in advance, and then check the result for one purpose only: which part of tomorrow's action changes. If you cannot move at all, stop costing the whole road and price only the next step.", "l": ["Epictetus", "Viktor Frankl", "Zhuangzi", "Marcus Aurelius"], "contrast": [{"n": "Epictetus", "why": "The same border drawn in two places. Epictetus draws it between what is up to you and what is not; the Gita draws it between the act and its fruit"}, {"n": "Wang Yangming", "why": "Both on understanding without moving. Wang puts the weight on the knowing; the Gita puts it on arguing the consequences all the way down before anyone moves"}]}, {"c": "Mind and feeling", "n": "Marcus Aurelius", "e": "121–180 · Rome", "w": "Restraint", "y": 121, "d": "Roman emperor from 161 to 180, and the most quoted of the Stoics, largely on the strength of a notebook he never intended anyone to read. He ruled sixty million people through a plague, a long war on the northern frontier and a revolt by one of his own generals. What he wrote in private was not policy and not memoir: it was a set of instructions to himself, repeated because they kept being needed. A man holding absolute power spent his private hours on the only person he could actually govern.", "story": "The book was never meant to exist. It has no title of its own; the heading that comes down to us means something close to to himself. He wrote it in Greek rather than in the Latin of his court, in camp on the northern frontier, and there is no sign he expected a single reader. It survived by accident, down a thin chain of copies that nearly broke more than once, and became the book most often carried by people who hold power. Nothing in it is addressed outward. Every entry is one man correcting himself, with no audience to perform for.", "f": [{"n": "Sort what is yours before you spend anything on it", "d": "Some things are up to you and some are not. Your judgement, your intention and your response are; events, other people and your own body are not. The discipline is not resignation, it is budgeting: attention is finite and most of it gets spent on the far side of the line.", "eg": "He could not stop the plague or the revolt. He could decide how the resources moved and how he treated the man who had failed."}, {"n": "What stands in the way becomes the way", "d": "The impediment to action advances action. The mechanism is a fire: a small one is smothered by a large log, a big one turns the log into more flame. So the same setback lands differently on different people, and the difference sits in what was already burning, not in the setback.", "eg": "The server failed at the worst moment, and the rebuild it forced was sturdier than the thing it replaced."}, {"n": "Rehearse the morning before it happens", "d": "Book Two opens with a script for waking: today I shall meet the busybody, the ungrateful, the arrogant, the deceitful. The reason he gives is that they cannot tell good from harm. Assuming ignorance rather than malice leaves you something to work on; assuming malice leaves only a fight.", "eg": "Before the meeting you dread, write the three hardest things they could say and what you intend to do at that moment."}, {"n": "The notebook has no reader and no defence", "d": "Nobody was going to check it, which is why it can be trusted and also where its limit sits. Private discipline has no external audit. The record is a lifetime of self-correction, and it did not stop him from leaving the empire to his own son.", "eg": "Commodus was strangled twelve years later and Rome entered a century of disorder. On the one thing he fully controlled, he chose blood."}], "q": ["The impediment to action advances action.", "A fire makes flame out of everything thrown into it.", "He governed sixty million people and audited only one."], "apply": "When something makes you angry or anxious, sort it in one pass: which part of this is mine, and which is not. Put everything into the first part and let the second go. Then, before the next difficult conversation, rehearse your own move rather than their behaviour.", "l": ["Epictetus", "Seneca", "Zeng Guofan", "Viktor Frankl", "Montaigne"], "contrast": [{"n": "Epictetus", "why": "A slave and an emperor reaching the same rule about what is up to you, from opposite ends of the same empire"}, {"n": "Viktor Frankl", "why": "Two tests of the inner citadel: Marcus holds it voluntarily at the top of power, Frankl has it tested with everything else taken away"}]}, {"c": "Mind and feeling", "n": "Montaigne", "e": "1533–1592 · Bordeaux", "w": "Weaknesses on the table first", "y": 1580, "d": "French writer, and the inventor of the essay. At thirty-eight he resigned as a magistrate, went home to the family estate and turned the third floor of a tower into a library, where he wrote for the next twenty years, serving two terms as mayor of Bordeaux in the middle of it. He had a medal struck for himself carrying the words What do I know? The whole book is about himself: his fear of pain, his terrible memory, his dithering, the riding accident that nearly killed him, the kidney stones that nearly finished the job.", "story": "The book opens with a note to the reader that would be strange in any century. He says it has no purpose beyond a private and domestic one, that he has set out to be seen in his simple and ordinary fashion, and that the reader would be unreasonable to spend leisure on so frivolous a subject. Then the line that turned into a literary form: I am myself the matter of my book. He called the pieces essais, attempts, because none of them claims to arrive anywhere. Nobody had written like this before, and it is still the model.", "f": [{"n": "A card you play yourself cannot be played against you", "d": "People afraid of exposure are afraid that someone else will name the weakness first. He names it himself, more fully than anyone else would bother to, which takes it out of everyone's hand. Four hundred years on, nobody has found an attack on him that he had not already made.", "eg": "This part is not my area, said up front, costs far less than being caught out on it in a meeting."}, {"n": "Mostly you fear the imagining, not the thing", "d": "Thrown from his horse in his thirties, unconscious long enough that those around him thought he was dead, he came back and found the experience had been light, like falling asleep. Decades of dread had been aimed at a version his own head had built. Only the unfamiliar is frightening; once familiar it is a fact.", "eg": "The fear that arrives at two in the morning is usually a film. Look at it in daylight and it flattens."}, {"n": "Not withdrawal, a fenced-off piece", "d": "He did not become a hermit; he was mayor twice after moving into the tower. What he did was nail down one space and one stretch of time as his own and leave everything else running, with the decision carved into the wall so he walked past it every morning.", "eg": "One room and one hour a day nobody else can reach. Far easier to hold than a whole new life."}], "q": ["He put his own cowardice in the book, and nobody has been able to use it since.", "He kept death as an acquaintance so it would stop being a stranger.", "Keep one piece for yourself. Let the rest run."], "apply": "Pick the fault you would least like exposed and find a plain sentence for it that you can say first, before anyone asks. Then fence off one hour and one place as yours, write the decision down where you will see it, and leave the rest of the calendar alone.", "l": ["Seneca", "Marcus Aurelius", "Brené Brown", "Shi Tiesheng"], "contrast": [{"n": "Brené Brown", "why": "Both take shame and fear apart. She has the laboratory findings; he has one man running the experiment on himself four hundred years earlier"}, {"n": "Seneca", "why": "Both on learning to die. Seneca instructs from above; Montaigne writes outward from the afternoon he was thrown off a horse"}]}, {"c": "Mind and feeling", "n": "Sima Qian", "e": "Han · c. 145–86 BC", "w": "Disgraced, and finished the book", "y": -99, "d": "Court historian to Emperor Wu of Han, and the author of the Records of the Grand Historian, the founding work of Chinese history writing. In 99 BC he spoke in defence of a general who had surrendered, was imprisoned for it and castrated the following year. The convention of his class was suicide; he declined, served on as palace secretary and finished the book. Years later he explained himself in a letter to a condemned friend, and that letter is one of the most direct accounts anyone has left of living with a disgrace that cannot be spoken about.", "story": "The book he was finishing runs to a hundred and thirty chapters and covers roughly two thousand years, from the Yellow Emperor down to his own emperor. He invented its architecture: annals for the rulers, chronological tables, treatises on ritual and rivers and money, and then a long closing section of individual lives. The lives are not only the great ones. He wrote up assassins, merchants, physicians and court jesters. Two thousand years of Chinese historians copied the form, and almost everything later readers know about the period stands behind his account, including the parts that make his own emperor look bad.", "f": [{"n": "Swap the question about face for a question about work", "d": "Can I still show my face has no answer and sinks the longer you hold it. Is anything still unfinished has one, and the answer points at something to do. The letter is that substitution: the shame was not resolved, it was taken off the switch that decided whether he lived.", "eg": "After a public disgrace, do not ask whether you deserve to be here. Ask what you still owe and to whom."}, {"n": "Find yourself a row of precedents", "d": "While a person believes nobody has ever had it this bad, no argument gets in. So he lists them: King Wen in captivity expanding the Book of Changes, Confucius in distress, Qu Yuan banished, Zuo Qiuming blind, Sun Bin without his feet. The list is the remedy, not the reasoning.", "eg": "If you think you are the only one this unlucky, go and find three who had it worse and finished something."}, {"n": "Staying alive takes one thing only you can finish", "d": "The archives were in his hands, his father's notes were in his hands, and the framework was in his head. Nobody else could have produced that book, which is what makes if I go this ends true rather than vain. An obligation handed to you by someone else holds on the days you cannot hold yourself.", "eg": "Find the thing nob
