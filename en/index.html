": "Any strategy living off a timing gap loses a beat for every layer the organisation adds. Run the old lightning method through a long chain and it walks into a trap."}, {"n": "A bet with no exit written into it", "d": "In 1812 he crossed into Russia with over six hundred thousand men and brought back fewer than a tenth. He lost no major battle and entered Moscow. What he had no plan for was winning while the other side declines to concede: an empty capital, a Tsar who would not negotiate, winter.", "eg": "Write the withdrawal date and the withdrawal number before you enter a new market. Write them while you are clear, because later one more push will feel obvious."}], "q": ["Have more force at the point attacked, even when weaker overall.", "In war, the moral is to the physical as three to one.", "From the sublime to the ridiculous there is only one step."], "apply": "List the points where the contest you are in is actually settled. Pick one and put more into it than the larger side puts into that same point, and accept that you are giving up the others. Then, before you commit, write the date and the number at which you stop.", "l": ["Sun Tzu", "On War", "Julius Caesar", "Fan Li", "Shang Yang"], "contrast": [{"n": "Julius Caesar", "why": "The same arc a lifetime apart: both rose on a revolution's wreckage, both fell at the top, both left a legal order behind them"}, {"n": "On War", "why": "Clausewitz spent his life studying him: the first half of the book explains the victories, the second half the road out of Moscow"}]}, {"c": "Strategy and competition", "n": "On War", "e": "Prussia · 1832", "w": "Friction", "y": 1832, "d": "Clausewitz joined the army at twelve, lived through the catastrophe at Jena and the destruction of Napoleon's army in Russia, and spent a career studying defeats. He died of cholera at fifty-one with the book unfinished; his widow Marie edited and published it. Sun Tzu tells you how to win. This tells you why your plan will not survive contact, which is the half Sun Tzu leaves out.", "story": "In 1812 he was attached to the Russian army and watched the Grande Armee come apart. Nearly half a million men went in and under thirty thousand came out. What struck him was that the Russians had barely fought a proper battle. What destroyed the strongest army in Europe was mud, misdelivered orders, supply carts nobody could find, columns that lost each other, an early frost, and thousands of small things a day that should have gone smoothly and did not.", "f": [{"n": "Friction: the plan always deforms", "d": "Every step is feasible on paper and the whole is not, because each link carries a little resistance: fatigue, misunderstanding, weather, fear, a broken axle. Individually trivial, stacked they seize the plan. It cannot be removed, only budgeted for, and armies differ in whether they keep moving inside it.", "eg": "Every line of a schedule is reasonable and the sum of them is late. Not weak execution: nobody gave friction a budget."}, {"n": "The fog: information is never complete", "d": "War is the realm of uncertainty, and three quarters of what action rests on lies in fog. He does not tell you to wait for the picture to clear, because it will not. He asks for a different capacity: judge well on partial and partly wrong information, and then hold to it.", "eg": "This collides with know your enemy and know yourself head on. Sun Tzu assumes the count can be completed; Clausewitz assumes it cannot."}, {"n": "Centre of gravity", "d": "Every opponent has a hub that his strength and his freedom of action depend on: the main army, the capital, an alliance, public support. The core work of strategy is identifying it and concentrating against it. Ten successful attacks on secondary targets are worth less than one on the hub.", "eg": "Do not turn competitor analysis into a feature grid. Ask which single thing, if it went, would make the whole thing stop working."}, {"n": "Defence is the stronger form", "d": "His most counter-intuitive result. The defender holds the ground, has shorter supply, wears the attacker down and has time on his side. Correspondingly the attacker has a culminating point, beyond which every further step weakens him. Napoleon went past his own in Moscow.", "eg": "Every new city, category and market lengthens the line. Most companies are not killed by a rival; they run past their own culminating point."}], "q": ["War is merely the continuation of policy by other means.", "Everything in war is very simple, but the simplest thing is difficult.", "Three quarters of the factors in war lie in a fog."], "apply": "Add a friction audit to the next plan: list every handoff that crosses a person, a team or a time zone, because that is where the delay actually lives. For any expansion, name your culminating point and the signal that says you have reached it, in advance, because from inside you will not see it.", "l": ["Sun Tzu", "Napoleon", "Su Yu", "Xiang Yu", "John Boyd"], "contrast": [{"n": "Sun Tzu", "why": "The two halves of the subject: Sun Tzu on how to win, Clausewitz on why the plan deforms. One assumes the count can be completed, the other that it never is"}, {"n": "Napoleon", "why": "The book was written against his career: it explains both the concentration that won and the culminating point he ran past"}]}, {"c": "Strategy and competition", "n": "Thomas Schelling", "e": "United States · 1921–2016", "w": "Commitment", "y": 1921, "d": "In the most dangerous years of the Cold War the most influential strategist was not a general but an economist. Schelling rebuilt the theory of deterrence out of bargaining, and shared the 2005 Nobel in economics for it. His most counter-intuitive result is that cutting away your own options, in public, is the most effective way to strengthen your position. Burning the way back is a tactic, not a gesture.", "story": "The American garrison in West Berlin could not have held the city for a day against a Soviet attack, and everyone involved knew it. Schelling's point was that holding was never its function. Its function was to make American involvement automatic: any attack would kill American soldiers on the first morning, and no president would then be free to decide whether to respond. It was not a line of defence. It was a trip-wire, and its weakness was the whole design.", "f": [{"n": "Credible commitment: weaken yourself to gain leverage", "d": "Bargaining power comes less from what you can do than from what you can no longer do. While you keep the ability to concede, they keep pushing. Lock yourself in a way they can verify and the pressure reverses. Verifiable is the operative word; a private resolution is worth nothing.", "eg": "Announcing that a product will never carry advertising ties your hands now and builds trust a rival cannot copy without burning the same exit."}, {"n": "Deterrence and compellence are not the same", "d": "Deterrence says do not do that or else, succeeds invisibly, and has no deadline. Compellence says you must do this or else, requires them to act, to be seen backing down, and to do it by a date. The second is far harder and costs far more.", "eg": "If you are late again there are consequences usually works. Apologise in front of everyone provokes a fight, because the price includes their dignity."}, {"n": "Focal points: coordinating without talking", "d": "Asked to meet a stranger in New York with no way to arrange it, most people say Grand Central at noon. Nothing makes it optimal; it is simply the point everyone expects everyone to expect. Round numbers, precedent, the middle and the old boundary all work the same way.", "eg": "Prices ending in ninety-nine, splitting it down the middle, a ceasefire on the old border. When you design a rule, find the focal point before you argue the optimum."}, {"n": "A commitment is only credible if it cost something", "d": "The thread through all his work: a signal carries information only when the sender paid a real and unrecoverable price for it. Free promises are not promises. Deposits, penalty clauses, public declarations and a founder's own money all convert words into sunk cost.", "eg": "Investors check whether a founder is full time and whether their own money is in. They are measuring the price of the promise, not the wording."}], "q": ["The power to constrain an adversary may depend on the power to bind oneself.", "In bargaining, weakness is often strength.", "A promise that costs nothing carries no information."], "apply": "Next time you are stuck, do not raise the threat. Ask why they believe you will move, and the answer is almost always because you still can. Close that route where they can see it. Run the same test in reverse when it is used on you: what would it actually cost them to take that commitment back?", "l": ["Strategies of the Warring States", "Han Feizi", "Peter Thiel", "Nassim Taleb", "Sun Tzu"], "contrast": [{"n": "Strategies of the Warring States", "why": "Two arts of negotiation: the persuaders change what the other side believes, Schelling changes what the other side can choose"}, {"n": "Nassim Taleb", "why": "Skin in the game and credible commitment are one coin: Taleb uses cost to decide whose word to trust, Schelling to make his own word land"}]}, {"c": "Strategy and competition", "n": "Sima Yi", "e": "Three Kingdoms · 179–251", "w": "Patience", "y": 179, "d": "He outlasted four rulers of Wei and at seventy took control of the state in a single morning. The record has two operations in it that look opposite and are not: a march that arrived in eight days when a month was expected, and ten years of illness that were not illness. Both work off the same insight, which is that the other side's plan is built out of assumptions about what you will do.", "story": "The standoff at the Wuzhang Plains. Zhuge Liang sent him a set of women's clothes, a public insult meant to shame him into giving battle. He did not lose his temper. He accepted the gift pleasantly, and asked the messenger how the chancellor had been sleeping. The messenger said his master rose early, stayed late and ate very little. Sima Yi turned away and said that Liang was not going to live long. Zhuge Liang died that year, at fifty-four. Sima Yi lived another seventeen.", "f": [{"n": "Their timetable is a list of your openings", "d": "Meng Da worked out precisely how long Sima Yi would need: the distance, plus a month for a memorial to the throne and a reply. Every figure was right. The one error was assuming the procedure would be followed. Sima Yi did not report, and was under the walls in eight days.", "eg": "They have always shipped at quarter end, so every defence is scheduled for quarter end. The real threat comes when they skip the process."}, {"n": "Feign weakness until the watching stops", "d": "Half-hearted quietness leaves the eyes on you. When Cao Shuang sent a man to look him over, he could not hold the cup and let the porridge run down his chest, and mistook one province for another twice. The report came back that he was a breathing corpse. Then the surveillance went.", "eg": "To move a rival's attention off you, vague public positioning is not enough. There has to be nothing worth following up."}, {"n": "The window is recognised, not made", "d": "He waited on one specific condition: the Cao brothers out of the capital on the same day, the centre of power and the centre of force both absent at once. He did not create that. The whole function of the patience was to still be there, intact, when it came.", "eg": "Turning points in an industry are usually triggered outside your control. What you control is being at the table that day with cards in hand."}, {"n": "Defence as the cheaper form of attack", "d": "At the Wuzhang Plains he declined battle for months while the other side burned supply and, as it turned out, a life. His logic was plain: I do not need to win, I need not to lose, and the clock does the rest. He read life expectancy where others read order of battle.", "eg": "With fewer resources than a rival, stop trying to settle it in one engagement. Make each contact cost them more than it costs you."}], "q": ["Liang is not going to live long.", "Riding a tiger, you cannot get down.", "The patience exists to keep you alive until the window opens."], "apply": "If you are waiting, write down the exact condition you are waiting for, in a sentence someone else could verify. If you cannot write it, you are not waiting, you are stalling. Then ask the second question: on the day it appears, could you finish the whole thing at once?", "l": ["Fan Li", "Li Bi", "Zhuge Liang", "Sun Tzu"], "contrast": [{"n": "Zhuge Liang", "why": "The sharpest pairing on the site: one attacked to defend and spent his life doing it, the other defended to attack and outlived him"}, {"n": "Huo Qubing", "why": "Two extreme strategies for a life: burn everything at twenty-four, or hold everything back until seventy"}]}, {"c": "Strategy and competition", "n": "Strategies of the Warring States", "e": "Warring States · 453–221 BC", "w": "Persuasion", "y": -453, "d": "A collection of the persuasions that travelling strategists used on the rulers of the warring kingdoms, recorded close to the ground. Unlike a chronicle, it is not judging anybody: it preserves the argument that worked along with what the speaker wanted out of it. Su Qin assembling an alliance of six states, Zhang Yi taking it apart one at a time, Feng Xuan buying his lord a thing no ledger could hold.", "story": "Pang Cong was about to leave as escort to a hostage prince and asked the king of Wei a question first. If one man tells you there is a tiger in the marketplace, do you believe it? No. If two do? I would begin to doubt. If three do? Then I would believe it. There is no tiger in the marketplace, said Pang Cong, and three men can produce one; I am going far away and more than three will talk about me. He went. The talk came. He never got an audience again.", "f": [{"n": "Three men make a tiger", "d": "Repetition does the work that evidence cannot. A claim heard from enough separate mouths stops being assessed and starts being assumed, and the person it is about is usually the last to hear it and the least able to answer. The mechanism needs nobody to be lying deliberately.", "eg": "A version of events that circulates while you are away on a long project is settled before you return. Answering it then costs ten times what noticing it early would have."}, {"n": "Three people praise you, three motives", "d": "Zou Ji was told by his wife, his concubine and a guest that he was better looking than Xu Gong. When Xu Gong turned up he saw it was not true, and worked out that one favoured him, one feared him and one wanted something. The words were identical; only the relationships differed.", "eg": "Your report, your supplier and your investor all say the plan is good. Three different reliabilities, one identical sentence."}, {"n": "Buying what the ledger cannot hold", "d": "Sent to collect debts at Xue, Feng Xuan checked the bonds against the people and then burned them, and told his lord he had bought righteousness, since the house lacked nothing else. A year later, out of office, that lord was met a hundred li from the town by the whole population.", "eg": "Over-compensating early users is pure loss in the accounts and the only asset that speaks for you when something goes publicly wrong."}, {"n": "Persuasion is not argument", "d": "Almost every piece in the book has the same structure: find what this particular ruler is most afraid of or most wants, present your proposal as the only route to it, and leave him feeling he reasoned his way there. An argument makes the other person lose. A persuasion lets him win.", "eg": "Su Qin never said the alliance is good for everyone. To each king he said this is your only way out, and named the thing that king lay awake over."}], "q": ["There is no tiger in the marketplace, and three men can make one.", "My wife favours me, my concubine fears me, my guest wants something.", "A cunning rabbit has three burrows, and only just escapes with its life."], "apply": "Take the last decision that was praised by everyone around you and write, next to each name, what that person stands to gain or lose from you. Then go and find one reference point that owes you nothing: a rival's real numbers, a user talking when you are not in the room. Xu Gong has to walk in.", "l": ["Sun Tzu", "Fan Li", "Records of the Grand Historian", "Han Feizi", "Guiguzi"], "contrast": [{"n": "Sun Tzu", "why": "One states principles that can be taught in public; the other records what was actually said to one man on one day to change his mind"}, {"n": "The Analects", "why": "Two faces of the same broken age: one on what a person ought to become, the other on how people behaved. Read only one and you end up naive or cynical"}]}, {"c": "Strategy and competition", "n": "Su Yu", "e": "China · 1907–1984", "w": "Outnumbered", "y": 1907, "d": "A field commander who was almost always the smaller force and who is worth reading for exactly that reason. He had no staff college behind him and built his method out of after-action review. The method is consistent: do not take ground, destroy force; attack what they cannot afford to leave alone; and treat an order from above as something you may argue with, once your own preparation is complete.", "story": "Eastern Henan, the summer of 1948. Rather than look for the enemy's main force, he took Kaifeng, a provincial capital they could not afford to leave in his hands. The relief columns had to come, and they had to come along roads he had already chosen. He let go of the city and turned on the column, and the operation ended with over ninety thousand enemy casualties. Nothing about it was a stronger army beating a weaker one. It was a choice of target that removed the other side's options.", "f": [{"n": "Besiege what they must relieve", "d": "Attack the point the other side cannot afford to lose, and then fight the relief force on ground you picked. It puts them in a position where coming costs them and not coming costs them, and it converts a defensive advantage into an engagement on your terms.", "eg": "Do not attack a larger rival's flagship head on. Press something they are obliged to defend and fight where they have to come to you."}, {"n": "Destroy force, do not take ground", "d": "Territory taken has to be held, and holding disperses you. The unit of account he used was enemy strength removed, not places occupied. It is an unglamorous scoreboard and it compounds, because every unit gone is one that does not come back next month.", "eg": "Chasing a market share number can leave a rival's core team and core customers intact. Those are what actually decide the following year."}, {"n": "Fight when you can win, leave when you cannot", "d": "The line usually quoted as if it were about running away is about refusing an unfavourable field. Withdrawing intact from a fight you would lose preserves the force that wins a later one. The decision is made on the terms of the engagement, not on pride.", "eg": "Declining to compete in a segment where your economics cannot work is not retreat. It is keeping the budget for the segment where they can."}, {"n": "Dissent with the execution already finished", "d": "Twice in 1948 he argued against a plan settled above him, while the preparations for that plan carried on at full speed. The second telegram did not repeat the first; it brought a finer set of numbers. When the recommendation was taken, he accepted a stated result in his own name.", "eg": "Oppose a settled direction only after its preparation is genuinely done, come back with better arithmetic rather than more conviction, and sign for the new route."}], "q": ["Fight when you can win; withdraw when you cannot.", "Attack what they must relieve; destroy them as they withdraw.", "When the situation is clear, the decision can be bold."], "apply": "Facing something much larger, stop looking at its strongest product. Find the thing it is obliged to defend, apply steady pressure there, and concentrate somewhere else while its attention is committed. Count what you have removed from the other side, not what you have occupied.", "l": ["Sun Tzu", "Han Xin", "On War", "John Boyd"], "contrast": [{"n": "Han Xin", "why": "Two commanders who made a habit of winning outnumbered: Han Xin by putting his own men where retreat was impossible, Su Yu by choosing what the enemy had to come and save"}, {"n": "On War", "why": "He kept enlarging plans mid-operation, which is exactly the risk Clausewitz names: every step past your culminating point weakens you"}]}, {"c": "Strategy and competition", "n": "Wang Jian", "e": "Qin · c. 280–220 BC", "w": "Self-preservation", "y": -280, "d": "The leading general of Qin, who took Zhao, took Yan, took Chu and had a hand in the fall of five states: the man who actually executed the unification. He is here less for the campaigns than for a harder problem he solved. He is the person in this collection who handled being too useful to a suspicious ruler best. Bai Qi, his equal in talent, was ordered to kill himself.", "story": "In Chu with six hundred thousand men, he refused to fight. He fortified the camp and kept it shut, had the men wash, rest and eat well, and ate with them. After a long while he asked what the troops were doing with themselves. Throwing stones and jumping for distance, he was told. Then they can be used, he said. The Chu army had by then given up on provoking him and turned east, and he moved the moment they did, and broke them.", "f": [{"n": "Give the real number", "d": "Asked what it would take to conquer Chu, Li Xin said two hundred thousand and Wang Jian said six hundred thousand. The king thought him timid and sent Li Xin, who was broken. His figure was not confidence; it was a count of ground, army and population, and he preferred to be called cautious.", "eg": "Optimistic estimates are almost always wrong. Count everything, add buffer, give the number you believe, and then do not move under pressure."}, {"n": "Do not revise after the refusal", "d": "Turned down, he did not compromise at four hundred thousand. He pleaded illness and went home. Had he revised, he would have proved the first figure was padding. When the king came in person to apologise, the number he named was the same number.", "eg": "Estimate two people, get cut to one, then say you will try to make it work, and every estimate you give afterwards is discounted automatically."}, {"n": "Show a weakness you choose", "d": "Setting out with almost the whole army of Qin, he asked for fields, houses and ponds, and asked five more times on the march. Not because he was greedy. Holding that much and wanting nothing reads to a suspicious ruler as a larger design; a small visible appetite reads as safe.", "eg": "Deliberately exposing a controllable weakness in a negotiation, such as a limited budget or a small team, often gets you more equal terms than projecting strength."}, {"n": "Stay inside the job", "d": "He kept out of court politics, built no faction and offered no opinions outside his command, and after Chu he retired rather than wait to be suspected. Crossing out of your remit is what actually threatens the people above you; competence inside it rarely does.", "eg": "Influence acquired outside your defined responsibility is what gets read as ambition. The work itself almost never is."}], "q": ["It cannot be done with fewer than six hundred thousand men.", "The king is suspicious and trusts nobody.", "Revise the number after a refusal and you have proved it was padding."], "apply": "Next time you name a number, name the one you believe, and then hold it through the meeting where holding it is expensive. Separately, if you have become unusually important to someone, make sure they know what you want and that it is something they can comfortably give.", "l": ["Zhang Liang", "Han Xin", "Sima Yi", "Fan Li"], "contrast": [{"n": "Han Xin", "why": "Identical achievements, opposite endings: Wang Jian made himself look greedy and died in bed, Han Xin held on to his standing and did not"}, {"n": "Fan Li", "why": "Two ways of leaving at the top: Fan Li vanished and became a merchant, Wang Jian resigned and went home to his fields"}]}, {"c": "Strategy and competition", "n": "Xiang Yu", "e": "Chu · 232–202 BC", "w": "Unbending", "y": -232, "d": "The most complete loser in Chinese history, which is why he is worth the time. He brought down the Qin almost single-handedly, something his rival could not have done, and then lost everything to an unremarkable minor official. The failure was not in ability. It was in what he thought the contest was: he believed war was the strong crushing the weak, and Liu Bang was playing a game about people.", "story": "Surrounded at Gaixia, hearing the songs of Chu coming from every side of the ring, he broke out with eight hundred riders. By the time he reached the Wu River twenty-eight were left. A boatman offered to take him across, and said the lands east of the river were small but enough to be king in, enough to begin again. He refused. Eight thousand sons of the east crossed westward with me and not one is going back; what face could I meet their fathers with? Then he turned and fought until he cut his own throat.", "f": [{"n": "Force without design", "d": "His generalship is not in question: sinking the boats at Julu, thirty thousand cavalry breaking a force many times the size at Pengcheng. But he only ever used force. He destroyed the enemy in front of him while Liu Bang was destroying the threat that had not arrived yet.", "eg": "At the Hongmen banquet Fan Zeng signalled to kill Liu Bang and he would not. Not mercy: in his logic enemies are beaten on a battlefield, not stabbed at dinner."}, {"n": "The win too large to revise", "d": "Julu proved to him that overwhelming frontal attack answers everything, and a belief confirmed by an enormous success is close to unfalsifiable. Every later deadlock got the same treatment, right through to Gaixia. The most successful experience is the hardest one to overturn.", "eg": "A company built on one spectacularly successful method keeps running it after the conditions change. Not blind to the change: the success was too big to doubt."}, {"n": "He could not use people", "d": "He had one first-rate adviser in Fan Zeng and repeatedly ignored him, and Han Xin left him to go and serve the other side. Placing your own judgement above everyone else's has a predictable result: the capable go, and the ones who stay cannot act.", "eg": "The seal is worn smooth in his hand because he cannot bear to hand it over. Reward withheld is read by everyone watching, not just by the person who did not get it."}, {"n": "Deciding in order to be seen", "d": "Urged to keep Guanzhong, defensible and rich, he went home to Pengcheng instead, because to be rich and not go home is to wear brocade at night. The strategic gap was obvious. Recognition simply outranked it, and the man who said so out loud was boiled.", "eg": "Choosing the visible path over the one that compounds, with reasons ready, and the actual reason being who will see it."}], "q": ["To be rich and not go home is to wear brocade at night.", "Heaven is destroying me. It is no fault of my arms.", "Not one of the eight thousand is going back. What face could I meet them with?"], "apply": "Look at your own team for the Fan Zeng: the person who has been right and whom you have been discounting. Then take the decision you are closest to making and ask whether you would still make it if the result were invisible to everyone you know.", "l": ["Liu Bang", "Han Xin", "Sun Tzu", "Fan Li"], "contrast": [{"n": "Liu Bang", "why": "The perfect loser against the imperfect winner: the ceiling of one man's talent against the ceiling of what many people will do for you"}, {"n": "Julius Caesar", "why": "Two tragic ends in two traditions: Caesar killed by the people he trusted, Xiang Yu by refusing to get into a boat"}]}, {"c": "Reading people", "n": "The Analects", "e": "Spring and Autumn · 551–479 BC", "w": "The answer fits the asker", "y": -551, "d": "A record of a teacher answering particular students, compiled after his death. In English it usually arrives as loose maxims, which loses the thing that makes it usable: almost every line was said to one named person in one situation, and the same question gets different answers depending on who is asking. Later dynasties packaged it as a philosophy of obedience, which is close to the opposite of what he did — he resigned, he travelled for years looking for a ruler worth serving, and he criticised the ones he met. He was an unsuccessful politician and the most successful teacher in Chinese history.", "story": "At fifty-five he set out with his students to find a ruler who would use him, and for fourteen years none would. Between Chen and Cai the party was cut off and the provisions ran out; seven days with nothing to eat, and some of the students began to give way. Zilu came to him angry: does a gentleman also come to the end of his rope? He does, Confucius said. The gentleman holds when he is cornered; the small man, cornered, will do anything at all. He went home to Lu in the end and spent what was left of his life putting the old texts in order.", "f": [{"n": "Every answer has a name attached", "d": "He was asked what ren is more than a hundred times and answered differently nearly every time, because the answer was cut to the person asking. Read the answers with the askers deleted and you get a bag of contradictions. Read them with the askers restored and you get a method.", "eg": "The impulsive student is told to restrain himself and return to form. The plodding one is told, simply, to love people. Same question, different prescriptions."}, {"n": "Say what you do not know", "d": "Knowing what you know and knowing what you do not know is what he calls knowledge. He held to it himself: asked something by a countryman, he said his mind went blank and all he could do was work in from both extremes of the question.", "eg": "Guessing at a number in a meeting costs nothing that morning and costs three teams two weeks once they have planned against it."}, {"n": "Three layers for reading a person", "d": "See what he does, mark his motives, examine where he rests. Behaviour can be staged for as long as somebody is watching, the route he took to get here is expensive to stage, and what he is comfortable with when nothing is at stake can hardly be staged at all.", "eg": "Two people hit the same number. One spent next year's budget to do it. The route, not the number, predicts the next quarter."}, {"n": "Harmony is not sameness", "d": "The gentleman harmonises without conforming; the small man conforms without harmony. A room in complete agreement about something complicated has usually not agreed. The disagreement has moved outside the meeting, where nothing can be done with it.", "eg": "No questions at the review, and then the problems arrive one by one after launch — each of them seen by somebody beforehand."}, {"n": "One rule for a lifetime, and it is a prohibition", "d": "Asked for a single word to act on all one's life, he gave reciprocity: what you do not want done to yourself, do not do to others. The negative form is the point. It needs no knowledge of the other person, only honesty about yourself.", "eg": "Read the hard email once as if it had landed in your own inbox before you send it."}], "q": ["Knowing what you know and what you do not: that is knowledge.", "See what he does. Mark his motives. Examine where he rests.", "What you do not want done to yourself, do not do to others.", "The gentleman harmonises without conforming; the small man conforms without harmony."], "apply": "Pick the last decision you made that landed on somebody who had no vote in it, and run the one test: would you have accepted it if it had been done to you, in that manner, on that notice? Where the answer is no, the part that has to change is usually not the decision but how it was delivered.", "l": ["Wang Yangming", "Zeng Guofan", "Tao Te Ching", "Socrates", "Mencius"], "contrast": [{"n": "Tao Te Ching", "why": "The two main lines of Chinese thought: Confucius adds — cultivate, practise, take part — where Laozi subtracts. Neither is complete without the other"}, {"n": "Socrates", "why": "Near contemporaries who both taught by asking rather than telling, and both paid for holding a position against the people in power"}]}, {"c": "Reading people", "n": "Tending the Roots of Wisdom", "e": "Ming · c. 1590s", "w": "A method of ease", "y": 1590, "d": "Three hundred-odd short entries by Hong Yingming, written in the Wanli years of the Ming, on how to live among other people. It reads at first like an aphorism collection about being gracious, and it is not: each entry names a self-interested reason. Leaving a step for someone on a narrow path is filed under a method of ease, not under virtue. Keeping your skill out of sight is called a place to hide in, not modesty. And the sourness you feel when someone near you does well is traced not to their gift but to your own empty square.", "story": "Almost nothing survives about Hong Yingming beyond a studio name and the decades he wrote in. What survives is the title, borrowed from a line by the Song scholar Wang Xinmin: a man who can chew through vegetable roots can do anything. Vegetable roots are what is left when there is nothing else — bitter, stringy, what the poor ate. The book never once promises that things will go your way. It assumes they will not, and then works on what is still yours: how much you show, how much you give up, and what you do with the ache when somebody else succeeds.", "f": [{"n": "Give way for your own sake, not theirs", "d": "Where the path is narrow, leave a step for others to pass. Two people wedged against each other on a narrow path means nobody passes. Whoever has to be first at everything wins each occasion and loses the next, because the man opposite braces on sight from then on.", "eg": "Enduring for somebody else's sake keeps a ledger and presents the bill later. Giving way so you need not stay braced is over when it is over."}, {"n": "Three parts off, not the whole dish", "d": "The instruction is measured: a step, three parts. Whoever hands everything over ends up living on the other person's conscience, which is no steadier a position than having to win every time. Seven parts stay with you, and that is what makes it repeatable.", "eg": "Put a figure on the concession before you make it: how much this time, and what is still mine afterwards."}, {"n": "The fear of exposure is an arithmetic problem", "d": "Being afraid of being found out means more has been put on display than is actually held. What wants treating is the gap, not the fear: fill in what you have, or take back part of what you showed. Both beat holding up a front that must never be tested.", "eg": "Do not exhibit your single best performance as the normal one. Expectations settle at whatever height you showed."}, {"n": "Envy starts in your gap, not in their gift", "d": "Do not use your own strength to throw another's weakness into relief; do not let your own clumsiness turn into resentment of another's skill. Two clauses, one thing: hurrying to look strong and being unable to bear good news run off the same root.", "eg": "You can make someone smaller without a single hard word, simply by steering every conversation back onto the ground you are best on."}], "q": ["Where the path is narrow, leave a step for others to pass.", "He calls it a method of ease, not a virtue.", "Hide skill in clumsiness; be bright by seeming dim.", "Not that he is too good, but that this square of yours is empty."], "apply": "Take the next concession you are about to make and put a number on it before you make it: is this three parts or all of it, and am I doing it for him or so that I can stop holding myself tight? The measured version is the one you will still be able to do in a year.", "l": ["Brené Brown", "The Art of Worldly Wisdom", "Feng Dao", "La Rochefoucauld", "Tao Te Ching"], "contrast": [{"n": "The Art of Worldly Wisdom", "why": "Two collections of maxims on showing and hiding, written a generation apart at opposite ends of the world: Gracián teaches how to be seen well, this one how not to need to be seen"}, {"n": "Brené Brown", "why": "Both work on the fear of being found out. Her answer is to say it aloud so shame cannot survive being spoken; his is to stop putting so much on display"}]}, {"c": "Reading people", "n": "Guiguzi", "e": "Warring States · c. 400–320 BC", "w": "Open, close, sound out", "y": -400, "d": "The founding text of the Warring States persuaders, attributed to a recluse of Ghost Valley about whom nothing verifiable survives. It is the one Chinese classic that is a systematic handbook on moving a single specific person: not whether a thing ought to be said, only how speech should be opened, closed, tested and locked. Orthodox scholars called it a book for small men and had it suppressed repeatedly. It never disappeared, because anyone whose work depends on getting one other person to move ends up needing what is in it.", "story": "Tradition sends both Su Qin and Zhang Yi to the same teacher in Ghost Valley. Su Qin then sold the vertical alliance, six states banded against Qin; Zhang Yi sold the horizontal one, six states each cutting its own deal with Qin. One school, two men on exactly opposite sides, each carrying a chancellor's seal, fighting each other for half a lifetime. It is usually told against him, as proof that the school had no position. That is the point of the book. Vertical and horizontal are two faces of one technique, and which face gets used is decided by the situation. The silk manuscripts found at Mawangdui place Su Qin a generation after Zhang Yi, so the shared classroom is probably a later reconstruction; the story lasted anyway, because it names the thing accurately.", "f": [{"n": "Opening and closing are a pair of tools", "d": "To open is to speak, to close is to keep silent, and the mouth is the door of the heart. Speech and silence are two weapons rather than one default state. Most people's problem is not that they cannot speak; it is that they cannot stop.", "eg": "The most expensive sentence in a negotiation is usually the one that breaks the silence after your own price."}, {"n": "To hear him speak, be silent", "d": "Four reversals: to hear him, be silent; to have him open out, draw in; to stand high, stand low; to take, first give. Each of them is a sequence rather than a posture — nothing is exchanged until something has been put down first.", "eg": "Want their timeline? Give yours. Most people match it, and it is information you cannot get by asking for it directly."}, {"n": "Weigh the hard facts, then sound out the wants", "d": "Two separate operations. Weighing is the countable side — what he holds, where he stands, what his fallback is. Sounding is the other one: what he actually wants and what he is actually afraid of, read at the moments when he has no attention left for editing.", "eg": "Diligence before terms and terms before diligence are two different transactions. The second argues price over an assumption nobody checked."}, {"n": "Knowing begins with yourself", "d": "Know yourself and then you know others. Every judgement you make about a person passes through your own instrument, and an uncalibrated instrument adds the same error to everything it measures. This is the precondition the manipulation reading skips.", "eg": "If slow talkers always strike you as unreliable, that is a fixed offset, not a talent for reading people."}, {"n": "Hold the initiative rather than be held", "d": "The whole book lands here: it is better to control others than to be controlled by them. Whoever defines the question, sets the tempo and decides when it ends is holding the exchange, whatever the stated agenda says.", "eg": "Look at last week. Did you write the calendar, or did their moves write it for you?"}], "q": ["The mouth is the door of the heart.", "To hear him speak, be silent. To take, first give.", "Knowing begins with yourself; know yourself, then you know others.", "It is better to control others than to be controlled by them."], "apply": "Before the next conversation that matters, write down two lines instead of a script: what am I putting down first, and what does not have to be given at this stage. Then ask your question and count to five before saying anything else. The silence will return more than the follow-up would have.", "l": ["Strategies of the Warring States", "Han Feizi", "Influence", "The Art of Worldly Wisdom", "Zhang Liang"], "contrast": [{"n": "Influence", "why": "The same set of human switches, approached from opposite ends: Cialdini runs experiments and teaches you to spot them being pulled, Guiguzi writes the operating manual"}, {"n": "The Analects", "why": "Confucius asks whether a thing should be said at all; Guiguzi asks only how to say it so that it works. The avowed and the suppressed halves of the same tradition"}]}, {"c": "Reading people", "n": "Machiavelli", "e": "Florence · 1469–1527", "w": "What is done", "y": 1469, "d": "A Florentine diplomat, secretary of the republic's second chancery, and the author of The Prince. He was not teaching people to be wicked; he was the first to detach politics from moral instruction and study it on its own. The adjective made from his name now means unscrupulous, which flattens what he actually did: he wrote down how power behaves whether or not anyone approves, and he attached limits to it that the famous quotations leave out. His conclusions and Han Feizi's line up across seventeen hundred years, not because both men were sinister but because the mechanics repeat.", "story": "In 1512 the Medici returned to Florence, and the man who had run the republic's second chancery was arrested, put to the rope, and released into the countryside. He spent his days among farmers and card players. In the evening, he wrote to a friend, he took off the mud-caked working clothes, put on court dress, and entered the courts of the ancient men, where he was received kindly and was not ashamed to speak with them. That is where The Prince was written. He dedicated it to the new ruler hoping for a post and never received one. The man who understood power better than anyone then living could not obtain any of it for himself.", "f": [{"n": "Start from what is done, not what ought to be done", "d": "How one lives is so far distant from how one ought to live, he writes, that a man who neglects the first for the second learns his own ruin. That is a statement of subject matter rather than a licence: the book is about how politics runs, not how it should.", "eg": "An allowance everyone is trusted not to abuse gets used to the last unit. Assume that, then set the number."}, {"n": "Feared rather than loved, and never hated", "d": "If one has to be given up, being feared is safer than being loved, because love runs on the other person's willingness. Then the clause that rarely travels with the quotation: avoid being hated, which means keeping off their property and their family.", "eg": "Cutting a bonus is inside the rules. Humiliating someone in front of the room, or withholding pay already agreed, is over the line and buys an enemy."}, {"n": "Half is fortune, and the other half has a deadline", "d": "Fortune is the arbiter of about half our actions and leaves the rest to us. The river floods and carries everything away, but in quiet weather men can raise dykes and channels. The half you govern has to be finished before the water rises.", "eg": "Cash buffer, second supplier, a backup for the person who holds the system. All look like waste until the day they are the only things working."}, {"n": "Injury is remembered longer than benefit", "d": "Men forget the death of a father sooner than the loss of a patrimony. Nine good turns and one injury leaves the injury standing. Read as design guidance rather than complaint, it says avoiding a memorable harm beats manufacturing a memorable delight.", "eg": "The first rule of interface design is not to let people make mistakes. One bad experience erases ten pleasant ones."}, {"n": "New arrangements have weak friends and strong enemies", "d": "Nothing is harder to take in hand than the introduction of a new order, because those who would gain from it are lukewarm and those who lose by it are committed. That asymmetry, not stupidity, is why reforms stall.", "eg": "The people a change would help have no way to speak for it. The people it costs have every resource needed to push back, and they use them."}], "q": ["How one lives is so far distant from how one ought to live.", "It is far safer to be feared than loved, if you cannot be both.", "Men forget the death of a father sooner than the loss of a patrimony.", "Fortune is the arbiter of half our actions; she leaves us the rest."], "apply": "Take one rule or incentive you are responsible for and re-read it as though everyone using it were maximising their own position with no goodwill at all. Whatever breaks under that reading was built on ought. Rewrite that part before it is tested for you.", "l": ["Han Feizi", "Liu Bang", "Cao Cao", "Sima Yi", "Sun Tzu"], "contrast": [{"n": "Han Feizi", "why": "The two closest political realists East and West, seventeen centuries apart: both studied how power actually works, and both were destroyed by the power they studied"}, {"n": "Socrates", "why": "Opposite poles of political philosophy: Socrates died for a principle, Machiavelli spent his life on the question of how to stay alive inside power"}]}, {"c": "Reading people", "n": "Zeng Guofan", "e": "Qing · 1811–1872", "w": "Dull and unbreakable", "y": 1811, "d": "The most famous case in Chinese history of an ordinary man getting there by grinding. He was not gifted — he sat the examination seven times before passing — and he put down the Taiping Rebellion, the largest of the century, with a method he admitted was stupid: build a solid camp and fight a dull battle. He kept a diary auditing his own conduct for thirty years and circulated it to friends. He hired by handing people real work rather than by interviewing them. Nothing about his method requires talent, which is exactly why it is worth reading.", "story": "In 1854, at Jinggang, the river force of the militia he had been ordered to raise met the rebels and was broken. His boats were scattered and his men ran. He went over the side into the river and was pulled out by his own staff. He was a civil official with no military training, humiliated in front of the province, and what he did afterwards is the whole of him: he stopped looking for a battle he could win. From then on the army dug before it fought, and the war became a matter of trenches, supply and time.", "f": [{"n": "Solid camp, dull fight", "d": "On arriving anywhere the army camped before anything else — trench, wall, stockade — and cities were encircled and squeezed rather than stormed. It converted taking a city from an event full of accidents into a question of time and supply.", "eg": "Anqing was held under siege for over a year and Tianjing for more than two. No single mistake could collapse either operation."}, {"n": "A method that does not need talent", "d": "The other side of a dull method is that it copies. Any commander with any unit could follow it and reach a passing grade, whereas a brilliant stroke depends on that person on that day. An army raised from nothing could be carried by it for that reason.", "eg": "A process worth eighty that anyone can run beats one star worth a hundred. The first goes to thirty cities; the second leaves when he does."}, {"n": "Watchfulness when alone", "d": "Anybody keeps the rules while being watched. His answer to the unwatched stretch was not willpower but record: write the day down, wrong thoughts included, and the moment acquires a witness. Then he handed the record to friends, which is cheaper than resolve and works better.", "eg": "Expenses nobody audits, code nobody reviews, a report nobody reads. Those three places describe a person more accurately than any appraisal."}, {"n": "Daily disciplines have to be checkable", "d": "I will become more disciplined cannot be executed. His twelve were actions you can tick tonight: rise early, sit in stillness, read one book at a time, keep the diary, note what was said over tea. Small enough to answer did it or did not.", "eg": "Read more this year cannot be settled in December. Ten pages a day, three lines written after, settles itself every night."}, {"n": "Take in widely, employ carefully", "d": "A low bar at the door and a high one at the far end. He kept a large staff and then judged people on a real piece of work under real pressure — how they reported, and what they did with the part they could not do.", "eg": "Li Hongzhang came up that way, from the staff to independent command. Ask where this is not finished; the clean answer is the one to promote."}], "q": ["Watchfulness when alone brings peace of mind.", "Fight without haste: first make it stable, then look for change.", "Principle without officialdom, order in the head and few big words.", "Steady work that never breaks off beats a burst of courage."], "apply": "Turn the goal you keep losing in week three into something you can tick tonight, then post this week's version where somebody else will read it. The grain size and the audience are doing the work; resolve was never the variable.", "l": ["Wang Yangming", "Kazuo Inamori", "Ray Dalio", "Zhuge Liang", "The Analects"], "contrast": [{"n": "Marcus Aurelius", "why": "The closest pair East and West: both wrote themselves down every day, and both used the writing to hold themselves in check at the top of their own power"}, {"n": "Wang Yangming", "why": "Doctrine and practice: Wang built the school of mind, Zeng spent a lifetime executing it. Reaching the insight against grinding it out daily"}]}, {"c": "Reading people", "n": "The Art of Worldly Wisdom", "e": "1647 · Baltasar Gracián", "w": "Concealment", "y": 1647, "d": "Three hundred maxims by a Spanish Jesuit, published in 1647 and in print ever since. Schopenhauer translated it into German himself and called it a companion for life; Nietzsche thought Europe had never produced anything finer on the subject of mental nobility. Where Machiavelli tells a prince how to handle a state, Gracián answers a smaller and more common question: how does a clever man with no power of his own survive in a place that is full of it, and do more than survive.", "story": "His own life is the book's footnote. He was a Jesuit priest, and the order forbade its members to publish secular work without permission. He used his brother's name and got the books out one at a time. Warned repeatedly, he did not stop. In 1651 he published the first part of El Criticon anonymously; the order was furious, and in 1658 it stripped him of his post, sent him to a remote town, and forbade him pen and paper. He died that year, aged 58. A man who wrote three hundred maxims about keeping something back was finished by the one thing he could not keep back.", "f": [{"n": "Keep something in reserve", "d": "Do not play out all your cards. A capacity everyone has seen is discounted; a capacity nobody has measured still carries weight. Always hold a margin, so that nobody can work out where your limit is. This is not deceit. It is declining to become a quantity that can be fully calculated.", "eg": "Deliver at a hundred and twenty per cent once and you are measured at a hundred and twenty from that day on, and nobody remembers it was ever extra."}, {"n": "Hide the effort, not the result", "d": "The height of skill is to conceal the skill. Visible strain subtracts from the thing achieved. His word for the quality he wants is despejo, an unforced ease. The modern form of the rule: the person who keeps mentioning how hard they worked is assumed to be short of ability.", "eg": "Two people ship the same feature. The one who explains the weekend they spent on it is quietly marked down for it."}, {"n": "Leave while you are winning", "d": "Gamblers and reputations are both ruined on the last hand. What people remember is not your best moment but your final one. He reaches the same conclusion as Fan Li and Zhang Liang, from a completely separate tradition and with no contact between them.", "eg": "The founder who sells at the peak is called shrewd. The same founder eighteen months later is called unlucky, for the same business."}, {"n": "Everyone has a handle", "d": "He says every person has an asa, a handle, and that gripping the right one moves them: vanity for some, fear for others, the wish to be recognised, the wish to avoid trouble. It is the nearest thing in the book to Cialdini, three centuries earlier and considerably colder.", "eg": "Before asking anyone for anything, work out what the request costs them and which of those four it touches. Most refusals are aimed at the wrong handle."}], "q": ["Leave your luck while winning. All the best players do so.", "Things do not pass for what they are but for what they seem.", "What is not seen is as if it did not exist."], "apply": "Take the maxim that annoys you most and use that one first: do not spend your whole capacity on a single delivery. The point is not to work less, it is to separate finishing a task from spending your reserve. Keep the top fifth for the occasion that actually decides where you stand.", "l": ["Machiavelli", "Zeng Guofan", "Influence", "Fan Li", "Feng Dao"], "contrast": [{"n": "Machiavelli", "why": "The same century's problem at two altitudes: Machiavelli instructs a prince on handling a state, Gracián instructs a man with no power on surviving among people who have it"}, {"n": "La Rochefoucauld", "why": "Two books of maxims with opposite jobs: Gracián hands you a method for getting through the world, La Rochefoucauld only takes away the illusions you were using instead"}, {"n": "Influence", "why": "One subject, three hundred years apart: Gracián found the handles by watching people, Cialdini turned the same material into six principles you can test"}]}, {"c": "Reading people", "n": "Chris Voss", "e": "2016 · Never Split the Difference", "w": "Label it first", "y": 2016, "d": "A former lead international kidnapping negotiator for the FBI, with a career spent on sieges, abductions and hostage-takings. His method runs almost opposite to the one taught in business schools: before any trade of interests, deal with the state the other person is in. The finding underneath it is that people do not take in terms while their own feelings are still unacknowledged. So the opening move is not a number, it is saying the other person's position back to them accurately enough that they feel known.", "story": "A kidnapping in Haiti. The gang opened with a ransom the family could not come close to and set a deadline, the standard shape of the trade. Voss did not counter-offer and did not argue about the sum. His people kept returning one question in a calm, unhurried voice: how am I supposed to do that? Not a refusal, not a plea, just a problem handed back across the table. Each time, the kidnappers had to answer it themselves, and each time the number came down. The hostage came home for a fraction of the opening demand, and nobody had won an argument.", "f": [{"n": "Label the feeling, do not judge it", "d": "It seems like, it sounds like, it looks like. Voss calls the move labelling, and the sentence opening matters more than the content. It seems like is an observation and can be denied. I think you are is an assertion and provokes a defence. Get the label right and they add to it; get it wrong and they correct you. Both are progress.", "eg": "When a client goes quiet, it sounds like something in here is worrying you works far better than how do you feel about it, because it gives them a specific door."}, {"n": "Aim for that's right, not for yes", "d": "Yes is the cheapest word available; people produce it to get out of a conversation. The valuable answer is that's right, which means the other side believes you have understood their position in full. Negotiation begins after those two words, not before.", "eg": "Fine, fine, no problem usually means they want the meeting to end. That's exactly it means you have reached the thing they care about."}, {"n": "Calibrated questions hand the problem back", "d": "Replace closed questions that want a nod with open ones starting how and what. How am I supposed to do that moves the pressure across the table without any confrontation in it. Either they produce a way, or they hear for themselves that the demand does not work.", "eg": "When someone pushes the price below your cost, do not argue. Ask how you are supposed to hold the quality at that number. Most of the time they retreat unprompted."}, {"n": "No deal beats a bad deal", "d": "The strongest position in any negotiation is being able to walk away at any moment. Hostage negotiators never have that option, which is why he knows exactly what it is worth. Someone genuinely willing to end without agreement cannot be pushed into damaging terms by a deadline or by what they have already spent.", "eg": "Write your alternative down before you walk in: what happens if this collapses. The more concrete it is, the calmer you are at the table."}], "q": ["Negotiation is not an act of battle; it's a process of discovery.", "That's right is better than yes.", "No is the start of the negotiation, not the end of it."], "apply": "Next time a conversation jams, stop adding arguments and label the other person instead: it seems like you are worried about something here. You are not trying to get a yes, you are trying to get a that's right. And when you are pushed into a corner, hand it back with how am I supposed to do that.", "l": ["Nonviolent Communication", "Influence", "Guiguzi", "Thomas Schelling"], "contrast": [{"n": "Nonviolent Communication", "why": "Both start from the feeling and want different things: Rosenberg so that both sides' needs get onto the table, Voss so that you get a result out of an adversarial room"}, {"n": "Thomas Schelling", "why": "The two halves of bargaining: Schelling works on structural commitments and threats, Voss on the language in the room. One alters the payoff matrix, the other alters the person"}]}, {"c": "Reading people", "n": "The Crowd", "e": "1895 · Gustave Le Bon", "w": "How a crowd runs", "y": 1895, "d": "The founding book of crowd psychology, written a century after the French Revolution and just before the age of mass politics it predicted. Politicians, revolutionaries, advertisers and market operators have studied it ever since. The central claim is cold and precise: an individual entering a crowd is levelled downward, infected by the feelings around him, and released from responsibility by anonymity. Reading it is not about despising the public. It is about not being carried by a crowd, and about understanding every business that addresses one.", "story": "Le Bon returns again and again to the September massacres of 1792, when improvised tribunals of Paris citizens put more than a thousand prisoners to death. The men doing it were not thugs. Most were shopkeepers, craftsmen and clerks, mild enough on any ordinary day. When they had finished they emptied the dead men's pockets and handed the valuables in to the committee, considered themselves to have performed a patriotic duty, and afterwards applied to the authorities for recognition. That, he says, is the real horror of crowds. Not bad people gathering to do harm, but ordinary people doing what none of them would have done alone, and believing throughout that they were doing good.", "f": [{"n": "Three laws of the crowd mind", "d": "First, intelligence levels downward: a crowd does not perform at the average of its members but near the floor, because only the simplest feelings and slogans travel in it. Second, feeling is contagious, and panic and enthusiasm move far faster than reasoning. Third, anonymity loosens restraint, because a contribution nobody can pick out costs nobody anything.", "eg": "Buying frenzies, bank runs, pile-ons online. To tell whether a room has gone crowd-shaped, watch whether a reasonable sentence still finds any buyer."}, {"n": "Affirm, repeat, infect", "d": "His three moves for handling a crowd. Affirmation: state it flatly, explain nothing, prove nothing. Repetition: say the same sentence until it settles in as though it were a fact. Contagion: once enough people hold it, it spreads on its own and needs no further push. Every successful slogan runs down this line.", "eg": "Take any advertising line you can still recite. It carried no argument, and you heard it several hundred times."}, {"n": "A crowd takes images, not logic", "d": "What acts on a crowd is not the fact but the way it is presented. Crowds are not reached by reasoning, they are reached by pictures, stories and symbols. Statistics delivered to a crowd do nothing; one specific person with a name does the work of ten thousand rows.", "eg": "An appeal built around one named child raises more than one built on three million out of school. Absurd arithmetically, inevitable psychologically."}, {"n": "Turn it round and use it as a defence", "d": "Knowing how a crowd is worked tells you when you are being worked. Three signals: when your anger or enthusiasm arrives at the same moment as everyone else's; when an idea is so simple you want to pass it on without thinking; and when you catch yourself saying that this many people cannot all be wrong.", "eg": "Any of the three should send you out of the crowd to recompute the thing on your own, slowly."}], "q": ["In crowds it is stupidity and not mother wit that is accumulated.", "Isolated, he may be a cultivated individual; in a crowd, he is a barbarian.", "In a crowd every sentiment and act is contagious."], "apply": "Use it in two directions. When you are communicating, translate the argument into a story and a picture, and accept that repetition does the work that proof will not. When you are deciding, treat everyone thinks so as the exact moment to run your own numbers. Ask periodically whether the view you are holding was calculated or caught.", "l": ["Influence", "George Soros", "Machiavelli", "Thinking, Fast and Slow"], "contrast": [{"n": "Influence", "why": "Micro and macro of the same subject: Cialdini works on the switches that persuade one person, Le Bon on what happens to judgement when many are in a room together"}, {"n": "George Soros", "why": "Reflexivity is the financial version of this book: the crowd's mistaken belief moves the price and the price confirms the belief. Le Bon describes the pathology, Soros priced it"}]}, {"c": "Reading people", "n": "Gandhi", "e": "India · 1869–1948", "w": "Nonviolence", "y": 1869, "d": "An Indian lawyer thrown off a train in South Africa who ended up leading an empire out of his country without a battle. What he demonstrated is narrower and more interesting than the legend: under specific conditions, moral pressure plus sheer endurance beats military force. His instruments were salt, a spinning wheel, fasting and walking. The conditions matter, and he said so himself: the method works on an opponent who still needs to look legitimate.", "story": "In South Africa he was jailed by Jan Smuts, the general who was his chief opponent there. In prison Gandhi made a pair of sandals by hand and, on his release, sent them to Smuts as a gift. Smuts kept them for a quarter of a century. In 1939, on Gandhi's seventieth birthday, he returned them, with a note saying he had worn them for many summers and had never felt worthy to stand in the shoes of so great a man. One pair of sandals accomplished what no speech of his ever did.", "f": [{"n": "The physics of nonviolence", "d": "Satyagraha, truth-force, is not passive non-resistance but an active moral offensive. Faced with unjust force you can answer in kind, which means entering the game the other side is expert at, or absorb it and transfer the moral cost to them. What a violent regime fears is not greater violence, it is a problem that violence cannot close.", "eg": "His demands on followers were severe: struck, do not strike back; insulted, do not answer; arrested, do not run. Every act of endurance accumulated capital, and every crackdown spent the other side's legitimacy."}, {"n": "Do the thing you are asking for", "d": "Be the change you want to see has been worn into a greeting card, but he meant it literally. He asked Indians to spin their own cloth and boycott British goods, and he span for an hour a day until he died. He asked people to fast, and he fasted to the edge of his life more than once. Leadership was not go and do it, it was watch me first.", "eg": "Most reformers fail on exactly this line: they require of others what they have not done. He gave up a comfortable legal career, wore homespun, lived in an ashram and held no privileges."}, {"n": "Keep the opponent human", "d": "He never defined the British as evil. He defined them as people acting inside a wrong system, and held that a conscience existed in each of them that the movement was there to wake rather than destroy. That framing is what made the campaign legible far outside India: not one nation against another, but conscience against an unjust arrangement.", "eg": "It also made surrender survivable. An enemy who has been declared evil cannot concede without disgrace, so he will fight past the point of sense."}, {"n": "The means decide what you end up with", "d": "In Hind Swaraj he settled the question in 1909: the means are the seed and the end is the tree, and the connection between them is as fixed as the one between seed and tree. An India taken by force would be run by people who were good at force, which he called English rule without the Englishman.", "eg": "The test travels: whatever capability wins a fight becomes the capability the winners promote for, long after the fight is over."}], "q": ["With this, I am shaking the foundations of the British Empire.", "The means may be likened to a seed, the end to a tree.", "Nonviolence is the weapon of the strong."], "apply": "Next time you face someone stronger, add a dimension nobody in the room is counting: what does pressure cost them in legitimacy? In some contests declining to hit back is the heaviest available blow, because it moves the entire moral cost onto the other side and leaves them no dignified move.", "l": ["Nelson Mandela", "Viktor Frankl", "Marcus Aurelius", "Socrates"], "contrast": [{"n": "Nelson Mandela", "why": "The same idea one generation on: Mandela began with armed struggle and arrived at Gandhi's position after twenty-seven years in prison, which makes his version the tested one"}, {"n": "Machiavelli", "why": "The two answers to whether the end justifies the means: Machiavelli says judge by the result, Gandhi says the result is already contained in the method"}]}, {"c": "Reading people", "n": "Influence", "e": "1984 · Robert Cialdini", "w": "Triggers", "y": 1984, "d": "Cialdini spent three years undercover among salespeople, fundraisers and advertisers, studying how persuasion actually happens. What he found were six triggers: pull one and a person runs a preset routine rather than thinking it through. Reciprocity, commitment and consistency, social proof, authority, liking, scarcity. Knowing them lets you see what is being done to you, and lets you ask for things in a way people can say yes to.", "story": "A jewellery shop in Arizona could not shift a tray of turquoise. On her way out of town the owner scribbled a note to her assistant telling her to halve the price on everything in the case. She came back to find the whole lot sold. The assistant had misread the note and doubled the prices instead. Customers who knew nothing about turquoise had used the only rule available to them, expensive means good, and the trigger produced the purchase with no thinking in between. A great deal of human decision-making works like that.", "f": [{"n": "Reciprocity", "d": "A gift creates an obligation to repay. Take something from somebody, even something you did not want, and refusing their next request becomes difficult. The free sample, the opening concession in a negotiation, the unprompted kindness: all of them are switching on the same rule, and the initiative belongs to whoever moves first.", "eg": "The supermarket tasting stand is not there for the taste. The counter-question is whether you want this, or want it because they gave you something."}, {"n": "Commitment and consistency", "d": "People stay in line with what they have already said and done, because contradicting it means contradicting themselves. Once a position has been stated in public, backing out costs more than going through with it. This is why a public commitment is one of the most reliable ways to change behaviour.", "eg": "A trainer who gets you to announce your goal to friends is using it. On the evening you do not want to go, consistency does the pushing."}, {"n": "Social proof, authority, scarcity", "d": "If everybody is doing it, it is probably right, which is a sound shortcut most of the time and the engine of every panic and bubble. Authority is the same shortcut applied to expertise, and the appearance of authority is easy to fake while the competence is not. Scarcity says harder to get means more wanted.", "eg": "Research shows is the authority switch. Only three places left is the scarcity one. Ask whether the expert is speaking inside their field, and whether the thing is still worth having once the deadline passes."}, {"n": "Liking", "d": "We are persuaded more easily by people we like, and attractiveness, similarity, familiarity and flattery all raise the odds. You buy what a friend recommends not because your friend has better judgement than a stranger, but because you like your friend.", "eg": "The first lesson in sales training is find something in common. The check is whether you are accepting the argument or the person making it."}], "q": ["We should try to repay, in kind, what another person has provided us.", "We determine what is correct by finding out what other people think is correct.", "The best defence is to slow down and ask why you are deciding this."], "apply": "Before your next purchase, investment or significant decision, name the trigger that is pushing it. Reciprocity, because they gave you something? Social proof, because everyone is in? Scarcity, because it closes on Friday? Naming it is enough to pause it, and then you can put your own judgement back in its place.", "l": ["Han Feizi", "Charlie Munger", "The Crowd", "Maria Konnikova"], "contrast": [{"n": "Han Feizi", "why": "Two systems for moving people: Han Feizi designed law, technique and position two thousand years earlier, Cialdini found six triggers. Both are asking how to make people act as you want"}, {"n": "The Crowd", "why": "One reader at a time against a room at a time: Cialdini studies the switches inside one person, Le Bon what happens to all of them once they are gathered"}]}, {"c": "Reading people", "n": "Maria Konnikova", "e": "2016 · The Confidence Game", "w": "Why we fall for it", "y": 2016, "d": "A writer with a psychology background who studies confidence tricks. Her conclusion turns the usual question round: whether you get taken in has little to do with intelligence and a great deal to do with what you were short of at the time. The con artist does not manufacture trust, he locates a need you already have. What gets used is the wanting, not the judgement, which is why the educated and the well-travelled are on the victim lists too. Her second finding is more practical: the losses cluster in periods of transition, when the old way of reading a situation has just stopped working.", "story": "The cases she worked through run from fake art dealers and fake doctors to Ponzi schemes and street hustles, and the victims include professors, lawyers and people who work in finance for a living. What repeats is not that these people were careless. It is that each of them needed something at that moment: to recover a loss, to be taken seriously, to have an explanation that finally made sense. Which is why she says raising your guard is the least useful defence available. Wanting is the thing that lowers the guard, so the guard is already down by the time you would need it.", "f": [{"n": "Ask which need it answered", "d": "When a proposal moves you, postpone the question of whether it is true and ask why it is landing now. The answer usually names the thing you are shortest of. This comes before checking, because checking gets bent by wanting and you go looking for what supports it.", "eg": "The people in a hurry to recover a loss are the ones who meet guaranteed high yield. That is selection, not coincidence."}, {"n": "It is about circumstance, not intelligence", "d": "I was stupid is both inaccurate and expensive: it is the wrong diagnosis, and it makes the story too humiliating to repeat, so the same trick keeps working on the next person. What was I short of is a question with an actionable answer.", "eg": "The sentence victims say most often is that they are not normally like this. It is almost always true."}, {"n": "Transitions are the high-risk window", "d": "A move, a new job, a divorce, a death, retirement, a windfall. What these have in common is not weakness, it is that no usable template exists for what you are now facing, so any story that hangs together sounds credible. This converts the problem from a character trait into a diary entry.", "eg": "Newly arrived in a city, you have no idea what a normal price is for anything. That is the window, and it is predictable in advance."}, {"n": "Procedure, not vigilance", "d": "Rules are made while you are calm and take effect while you are not: above this figure, sleep on it; a second person has to see it; there has to be an independent source. This works precisely because it does not depend on your state at the time.", "eg": "Anything over this amount waits a day before I sign. That one rule has rescued more people than any talent for reading faces."}], "q": ["The con artist does not build trust. He uses the need you already have.", "What gets used is the wanting, not your judgement.", "It turns not being conned from a personality into a calendar."], "apply": "When somebody hands you an offer that is hard to refuse and something feels wrong, do not start checking. Start by asking which of the things you are short of it answers, and treat a clear answer as the warning. Then look at the calendar: have you just moved, changed jobs, lost someone, or come into money? If so, put a step in front of every large decision for three months and find one person outside the situation to look at it.", "l": ["Influence", "The Crowd", "Scarcity", "Zeng Guofan"], "contrast": [{"n": "Influence", "why": "Cialdini explains how the six devices work, Konnikova explains why the same devices work so well on certain people at certain moments. One studies the weapon, the other the target"}, {"n": "Scarcity", "why": "Both replace how could they be so stupid with what were they short of: Scarcity is about bandwidth being taken, the con is about wanting being used"}]}, {"c": "Reading people", "n": "La Rochefoucauld", "e": "France · 1613–1680", "w": "Virtues in disguise", "y": 1613, "d": "A French duke and a loser of the Fronde. He spent half his life inside aristocratic conspiracies and came out of them with his political career finished and the sight of one eye damaged. In retirement he wrote the Maxims, taking generosity, loyalty, modesty and pity apart one at a time and finding the same thing sitting underneath each of them: self-love. It is not misanthropy. It is a man who saw that world from the inside refusing to keep lying to himself about it.", "story": "At the battle of the Faubourg Saint-Antoine in 1652 a musket shot hit him in the face and blinded him for a time. He had already backed the wrong side in several conspiracies; the family lands were cut, the political life over. When his sight came back he did not return to court, he went to the salons instead. The interesting part is what he dissected first. The earliest manuscript of the Maxims carries a long essay on self-love, which he says changes like a chameleon and lives in everything and in nothing. Every aristocratic pretence in the book is one he had spent twenty years performing himself, which is why it reads as a confession and not an indictment.", "f": [{"n": "Self-love is the floor under every motive", "d": "Self-love is the greatest of flatterers. It reports back to you continuously on what kind of person you are, and the report is always favourable. What you take to be your principles, your taste and your judgement are frequently just the version self-love picked out for you.", "eg": "In a review, change I did it for the team to I wanted to be seen as someone who did it for the team. A surprising number of decisions look different immediately."}, {"n": "Virtues are vices in good clothes", "d": "Our virtues are most frequently but vices disguised. Generosity may be ambition spending money; modesty may be a longer route to praise; tolerance may be an unwillingness to be bothered. He is not saying virtue does not exist. He is saying do not infer motive from behaviour.", "eg": "A consistently generous person tells you only that generosity pays here. Change the conditions and the direction of what pays changes. Read the structure, not the character."}, {"n": "Nobody complains about their judgement", "d": "Everyone complains of his memory, no one complains of his judgment. A weak memory is a hardware fault and costs nothing to admit. Weak judgement would mean every past decision rested on nothing, and nobody can hold that thought, so memory quietly rewrites the misjudgements instead.", "eg": "Write one page before a big decision saying what you expect and why. Read it half a year later. The first time is usually a shock."}, {"n": "Hypocrisy tells you the exchange rate", "d": "Hypocrisy is the homage vice pays to virtue. Vice has to wear virtue's clothes to circulate, which proves virtue is the currency in that place, because nobody bothers disguising themselves as something worthless. So watch the direction of the pretending.", "eg": "To find out what an organisation truly rewards, ignore the values on the wall and watch what a new hire has learned to perform by month three."}], "q": ["We all have strength enough to bear the misfortunes of others.", "Refusing praise is a wish to be praised twice.", "Old people give good advice to console themselves for no longer setting a bad example."], "apply": "Two uses. Inward: when one of your own justifications comes together a little too smoothly, stop and ask whether the reason happens to be extremely comfortable. Outward: judge a partner not by the motive they state but by whether the thing pays them, and by whether it would still pay them after the conditions change. Verify goodwill as a structure rather than believing it as a quality.", "l": ["The Art of Worldly Wisdom", "Machiavelli", "Influence", "Nietzsche", "Thinking, Fast and Slow"], "contrast": [{"n": "The Art of Worldly Wisdom", "why": "Two books of maxims with different jobs: Gracián teaches you how to get through this world, La Rochefoucauld only undertakes to stop you deceiving yourself. One supplies method, the other removes illusion"}, {"n": "Benjamin Franklin",
