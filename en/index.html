ody picks up if you put it down. It carries more weight than any job you could be replaced in."}], "q": ["The shame was real and so was the work. He let the work speak.", "The books that lasted were mostly written in the worst years.", "Sometimes staying alive needs a debt left outstanding."], "apply": "After something you cannot say out loud, stop asking whether you still deserve to be here and ask instead what is unfinished and only yours to finish. Tell the whole of it to exactly one person, start to end. Then work while the shame is still in the room, because it does not leave first.", "l": ["Records of the Grand Historian", "Su Shi", "Viktor Frankl", "Brené Brown"], "contrast": [{"n": "Brené Brown", "why": "Both on shame. She is the researcher and gives the mechanism; he is the subject and gives the sample of someone finishing the work while carrying it"}, {"n": "Pu Songling", "why": "Two kinds of it never worked. Pu Songling came close for forty years with no turning point; Sima Qian has one catastrophe and a life visibly divided by it"}]}, {"c": "Mind and feeling", "n": "Epictetus", "e": "c. AD 55–135 · Rome and Nicopolis", "w": "What is yours, what is not", "y": 55, "d": "Born a slave; his owner was Epaphroditus, a secretary to Nero. One leg was lame and stayed lame. Freed, he taught in Rome until Domitian expelled the philosophers from Italy in AD 93, then moved to Nicopolis in north-west Greece and taught there until he died. He wrote nothing: the Discourses and the Handbook are lecture notes taken by his student Arrian, which is why the tone is blunt and often scolding. The Handbook runs to fifty-three chapters and the first sentence of the first one is the dichotomy of control. Eighteen centuries later that sentence became the opening lesson of cognitive behavioural therapy.", "story": "There was almost nothing in his room. The one thing worth stealing was an iron lamp, and one night it was stolen. Tomorrow, he told his students, you will find an earthenware one here — a man loses only what he has. Asked whether he was not angry, he said the thief had traded his own character for a lamp. For a lamp he became a thief; for a lamp he became a man nobody can trust. It was a bad deal, and it was the thief who made it. That is not good temper. It is the direct output of the philosophy: the lamp was outside his control, his view of the lamp was inside it, and the only thing that was ever truly his — how he responded — was never once taken.", "f": [{"n": "The dichotomy of control", "d": "The Handbook opens with a filing rule. Some things are in our power — opinion, impulse, desire, aversion, in a word our own acts. Some are not: body, property, reputation, office. His claim is extreme: almost all suffering comes from putting something in the second class into the first. The practice is not becoming stronger, it is re-filing every painful thing as it arrives.", "eg": "In trading you control the size, the discipline and the basis of the decision. You do not control the outcome of this one trade. Stake your feelings on outcomes and randomness will take you apart by instalments."}, {"n": "It is not the thing, it is the view you took of it", "d": "What disturbs a man is not the thing itself but the view he takes of it. The event is neutral; the pain is made between the event and the verdict that this is bad for me. When somebody angers you, he says, what angers you is your own judgement — so watch the judgement before you answer. Albert Ellis lifted this straight into rational emotive therapy, and it is the floor modern CBT stands on.", "eg": "One piece of harsh feedback. Read as I have been rejected it flattens you; read as a free piece of outside information it improves the work. Identical facts, and the verdict in the middle decides everything after it."}, {"n": "The actor and the script", "d": "Remember that you are an actor in a play, and the play is whatever the author wants. If he wants it short, it is short. If he casts you as a beggar, play a beggar; a cripple, an official, a private man, the same. Your business is to act well the part given you. Choosing the part is somebody else's business. It is the coldest available handling of an unfair start: neither denying it nor stopping at the protest.", "eg": "Where you were born, which way the industry is turning, the slot the company put you in — that is casting. What you do at that level is the performance."}, {"n": "Rehearse the loss", "d": "When you kiss your child, he says, say to yourself that tomorrow she may die. It sounds cruel and the effect runs the other way: rehearsing a loss in advance blunts the shock when it lands and makes the thing valuable while you still have it. The Stoics called it the premeditation of evils. It is not pessimism, it is inoculating the feeling.", "eg": "Before a large bet, walk all the way through total failure and the capital gone, and accept it, and then act. People who can carry the worst outcome do not lose their shape mid-move."}], "q": ["Men are disturbed, not by things, but by the principles and notions which they form concerning things.", "Some things are in our control and others not.", "Never say of anything, I have lost it; but, I have restored it.", "You may fetter my leg, but my will not even Zeus himself can overpower."], "apply": "Take a sheet of paper and write down the three things that hurt most this week. Split each into two columns: what I control, what I do not. Most people find that nearly everything eating their emotion sits in the right-hand column. Then do one thing only — put next week's attention entirely on the specific actions in the left. The value is not in having understood something. It is in seeing, in your own handwriting, what you have been paying for.", "l": ["Marcus Aurelius", "Seneca", "Viktor Frankl", "Zhuangzi", "Socrates", "Nassim Taleb"], "contrast": [{"n": "Marcus Aurelius", "why": "The slave and the emperor on one doctrine: one owned nothing, was lame and was exiled, the other ruled the known world, and they arrive at the same conclusion — and Marcus was reading these lecture notes when he wrote the Meditations"}, {"n": "Viktor Frankl", "why": "The same finding eighteen centuries apart: Frankl said in the camps that the last human freedom is the choice of one's attitude, which is the dichotomy of control tested at the floor of human experience"}]}, {"c": "Mind and feeling", "n": "Seneca", "e": "4 BC–AD 65 · Rome", "w": "Count the hours first", "y": -4, "d": "Nero's tutor, one of the richest men in Rome, and the Stoic who left the most letters behind. What separates him from the rest of the school is his position: he was not discussing restraint from a quiet study, he wrote while manoeuvring at the centre of power, and in the end the pupil he had taught ordered him to die. On anger, on time, on death he writes with the concreteness of a man being tested weekly rather than the tone of moral instruction. The charge of hypocrisy has followed him for two thousand years, and it is worth keeping in view while you read him.", "story": "In AD 65 he was named in the Pisonian conspiracy and Nero sent an officer with the order to die. Tacitus reports the scene. Forbidden to alter his will, he turned to the friends around him and said that since he was prevented from repaying what he owed them, he would leave them the one possession still his and the finest he had — the pattern of his life. Then he opened the veins of his arms. He was old and thin and the blood came too slowly, so he cut the veins behind the knees as well, took poison that failed to work, and was finally carried into a hot bath, where the steam suffocated him. He had written about dying for thirty years. This was the examination.", "f": [{"n": "Anger is a process you can take apart", "d": "On Anger says the thing is not one explosion but three movements. An impression arrives — he insulted me. Then you assent: yes, an insult. Only then the decision to retaliate. The second step is the only gate. The impression cannot be stopped and the retaliation is already motion, so the whole of the training sits in withholding the assent.", "eg": "Contradicted in front of people, do not certify he is picking a fight. Hold the second step for three seconds. A great many insults turn out to be clumsiness."}, {"n": "Rehearse the worst and the fear shrinks", "d": "The Stoic premeditation of misfortune is not gloom, it is making the worst outcome specific: what bankruptcy would actually look like, what being sacked would actually look like. He argues that most of the intensity of fear comes from vagueness. Think it all the way down and you usually find you could carry it, and you no longer have to wait for the event to start preparing.", "eg": "Afraid of losing the job, write out how the three months after would go, in detail. The fear comes down, and you finish with a plan you did not have before."}, {"n": "Time is the one cost that cannot be recovered", "d": "Money lost can be earned again; time cannot. People behave as if the reverse were true, comparing prices across three shops over a trivial sum and giving away an entire evening to something meaningless without a second thought. He wants time accounted for as the scarcest asset on the books: who is spending yours, and at what rate of return.", "eg": "Replace what will this cost with how many of my hours does this take, and what would those hours otherwise have been. Most invitations fail that test on the spot."}, {"n": "You do not have to be ready to start living", "d": "His sharpest observation is that people keep postponing life — after the promotion, once the children are grown, in retirement — and the future is the least reliable thing they own. Such people, he says, are not living briefly. They have spent the whole of it getting ready.", "eg": "Once this project is done, I will. If that sentence is three years old, what it needs is not a better moment. It needs one small step today."}], "q": ["It is not that we have a short time to live, but that we waste a lot of it.", "Life, if you know how to use it, is long.", "You live as if you were destined to live for ever.", "The greatest remedy for anger is delay."], "apply": "When anger rises, find the assent step and refuse to give it. Before a decision that matters, write the worst outcome out in full and read it back. And price everything in hours before you price it in money: how many of mine does this take, and where would those hours have gone.", "l": ["Marcus Aurelius", "Epictetus", "Su Shi", "Viktor Frankl"], "contrast": [{"n": "Marcus Aurelius", "why": "Two Stoics in opposite seats: the emperor writing a private notebook to himself, the courtier writing public letters to other people — one turns inward, the other stays practical"}, {"n": "Su Shi", "why": "Two ways of writing out of adversity: Seneca writes about restraint from inside the machinery of power, Su Shi writes about lightness on the road into exile, and both had been tested before either wrote a line"}]}, {"c": "Mind and feeling", "n": "Nietzsche", "e": "1844–1900 · Germany", "w": "Overcoming", "y": 1844, "d": "The most misread philosopher there is. The Nazis used his overman to underwrite racism, while he himself loathed antisemitism and broke with his own sister over exactly that. What he actually argued is that a person can go past herd morality and become someone who creates their own values. He lost his father at ten, was physically wretched for most of his life, and collapsed mentally at forty-four — having written, before that, some of the most forceful prose in Western philosophy.", "story": "In January 1889, in a street in Turin, Nietzsche saw a horse being whipped by its driver. He ran across, threw his arms round the animal's neck and wept, and then broke down. He never recovered his reason and spent the remaining eleven years in madness. A man who had spent his working life on the will to power finished his philosophy in front of an innocent horse, in tears. The thinking is full of strength and conquest and the life was full of weakness and pain. That contradiction is the most useful door into him.", "f": [{"n": "Eternal recurrence", "d": "If you had to repeat what you are doing now for ever, what would you choose? It is not a claim that the universe actually loops. It is a test at the limit: a thing worth repeating without end is a thing genuinely worth doing, and a thing you could not stand to repeat was never really what you wanted. There is no stricter instrument for checking what you value.", "eg": "Two hours on the phone tonight — would you take that for ever? Run the same question over the three things that took the most of today."}, {"n": "The will to power", "d": "The essence of life is to expand, to overcome, to become more. His will to power is not political office, it is an internal drive to go past yourself. What he calls master morality is creating your own standard of value and beating yesterday's version of yourself, rather than using phrases like humility is a virtue to keep the strong in check.", "eg": "An athlete going past a limit, an artist breaking a style, a founder walking into unknown territory. None of it is taking something off somebody else."}, {"n": "God is dead", "d": "God is dead, and we have killed him. Not an atheist announcement but a diagnosis of modernity: with the traditional moral system gone, the source of meaning goes with it and nihilism moves in. His remedy is that each person has to become a maker of values. The overman is not a superhero, he is someone able to create a meaning for his own existence.", "eg": "Inherited belief, family structure and national identity all coming apart at once, with no answer left to why am I alive. The modern crisis of meaning is what the sentence was pointing at."}, {"n": "Perspectivism", "d": "There are no facts, only interpretations. What anybody sees is an interpretation issued from their own vantage, history and interest, and not the objective article. This is not relativism, it is epistemic humility: knowing your own angle is partial, and going out to collect the other angles on purpose.", "eg": "Ray Dalio's radical open-mindedness is perspectivism in practice — invite everybody to attack your judgement, because their vantage may hold what yours cannot."}], "q": ["What does not kill me makes me stronger.", "We should consider every day lost on which we have not danced at least once.", "Man is a rope, tied between beast and overman, a rope over an abyss.", "One must still have chaos in oneself to be able to give birth to a dancing star.", "He who has a why to live can bear almost any how."], "apply": "Run the eternal recurrence test. Take the three things that took the most of your time today and ask, one by one, whether you would accept repeating them for ever. Cut the ones that come back no, and go deeper into the ones that come back yes. It is more direct than any system of time management.", "l": ["Wang Yangming", "Kazuo Inamori", "Naval Ravikant", "Socrates", "Ray Dalio", "Viktor Frankl"], "contrast": [{"n": "Socrates", "why": "His fiercest target was Socrates: he held that the cult of reason had castrated the vitality of the Greeks and turned philosophy into a denial of life — the two of them side by side is the most important collision in Western thought"}, {"n": "Viktor Frankl", "why": "He who has a why to live can bear almost any how is Nietzsche's line, and Frankl carried it into Auschwitz and tested it: one man worked it out in a study, the other verified it where verification cost everything"}]}, {"c": "Mind and feeling", "n": "Viktor Frankl", "e": "1905–1997 · Vienna", "w": "Meaning", "y": 1905, "d": "Psychiatrist, camp survivor, and the founder of logotherapy. In Auschwitz he watched something he could not explain with physiology: under identical extreme conditions some people broke and some did not, and the difference was not physical strength but whether a person had a reason to stay alive. His central proposition is that the last of the human freedoms, the one that cannot be confiscated, is the choice of your own attitude in any given set of circumstances.", "story": "Entering the camp, his manuscript was taken from him — years of psychological work, gone in the first hour. Standing naked in the inspection line, he realised they could take everything and still not take how he chose to answer it. That realisation is what he lived on. He began observing systematically which prisoners came through and which gave up, and found that men with something unfinished waiting in the future — a book, a family, a task — outlasted men with nothing pulling at them. After the war he dictated the book in nine days.", "f": [{"n": "Meaning is the last freedom", "d": "In any circumstances a person can choose their own attitude. This is not positive thinking; it is a regularity he observed in a camp. External conditions can strip away food, health, liberty and family. The interpretation of that stripping — this is destroying me, or this is tempering me — stays in your hands the whole way down.", "eg": "Marcus Aurelius on the inner citadel and Frankl on the last freedom are the same proposition: a Roman emperor and a twentieth-century survivor, different vocabulary, one claim."}, {"n": "The meaning of suffering", "d": "What he found most dangerous in extreme suffering was not the pain but the verdict that the pain is pointless. Once a person concludes their suffering means nothing, the collapse follows. Conversely the smallest sense of purpose — I will live to tell the world what happened here — will carry someone through an amount of suffering that should not be survivable.", "eg": "If there is a meaning in life at all, he wrote, then there must be a meaning in suffering. That sentence is not consolation, it is the load-bearing wall of the whole therapy."}, {"n": "Pull from the future", "d": "Prisoners with a strong future object — a reunion waiting after the war, unfinished work, a specific mission — survived at higher rates than those with nothing ahead of them. Why you are living matters more than how you are living, because the direction sets how much you are prepared to spend.", "eg": "He kept picturing himself lecturing after the war on the psychology of the camps, which turned what he was enduring into material for work not yet done."}, {"n": "The existential vacuum", "d": "Modern people have unprecedented material conditions and an increasing sense of hollowness. He called it the existential vacuum, and said it shows up as boredom, as imitation — doing what others treat as important — and as conformity, doing what others ask. The prescription is not less pain. It is a meaning that is actually yours.", "eg": "Don't aim at success, he wrote: the more you aim at it and make it a target, the more you are going to miss it. It arrives only as the side effect of dedication to a cause greater than oneself."}], "q": ["Everything can be taken from a man but one thing: the last of the human freedoms.", "If there is a meaning in life at all, then there must be a meaning in suffering.", "Don't aim at success. The more you aim at it and make it a target, the more you are going to miss it.", "He who has a why to live for can bear with almost any how."], "apply": "When the emptiness arrives, his question is not how do I become happy. It is what is life asking of me at this moment. Move the attention off what I want and onto what I can do for something outside myself, and the sense of meaning tends to arrive behind it rather than in front.", "l": ["Marcus Aurelius", "Epictetus", "Nietzsche", "Socrates", "Kazuo Inamori", "Wang Yangming"], "contrast": [{"n": "Nelson Mandela", "why": "Two answers to extreme adversity: Frankl found meaning inside the camp, Mandela turned twenty-seven years in prison into a political transformation — one worked on the inner position, the other on the outer one"}, {"n": "Su Shi", "why": "Creation under punishment: Su Shi wrote his best work in exile, Frankl finished logotherapy in the camps — both took the worst stretch of a life and made it the productive one"}]}, {"c": "Mind and feeling", "n": "Benjamin Franklin", "e": "1706–1790 · Boston and Philadelphia", "w": "Thirteen virtues, compounded", "y": 1706, "d": "A rare full-stack life. A printer by trade, he arrived in Philadelphia at seventeen with nothing, was financially independent at forty-two, and then became a scientist in electricity, an inventor of the lightning rod and bifocals, the author of Poor Richard's Almanack, the diplomat who brought France into the American war, and the only man to sign all four of the Declaration of Independence, the alliance with France, the Treaty of Paris and the Constitution. Charlie Munger has said Franklin is the man he spent his life imitating. The method underneath all of it is one idea: treat character as a system that can be practised deliberately and compounded.", "story": "He had an opponent in the Pennsylvania Assembly, a man of standing whom he had no realistic way of winning over directly. Hearing that the man owned a scarce and curious book, Franklin wrote asking to borrow it for a few days. It came at once. He returned it a week later with a warm note. At their next meeting in the House the man spoke to him — which he had never done — and with great civility, and they were friends for the rest of his life. Franklin's own summary: he that has once done you a kindness will be more ready to do you another than he whom you yourself have obliged. Asking for a small favour is not taking on a debt. It hands the other person evidence that he likes you.", "f": [{"n": "The thirteen-virtue operating system", "d": "Temperance, silence, order, resolution, frugality, industry, sincerity, justice, moderation, cleanliness, tranquillity, chastity, humility. The list is not the point; the execution is. One virtue a week, a small book with a page each, a mark against every breach, thirteen weeks to a course and four courses a year. He kept at it for fifty years — the earliest habit tracker there is, turning character into an engineering problem with iterations.", "eg": "Zeng Guofan's daily disciplines are startlingly similar. Two of the most self-managed men in either hemisphere independently invented one method: record daily, work one point at a time, iterate for life."}, {"n": "Appeal to interest, not to reason", "d": "He worked from interest rather than from argument. People are rarely moved by being shown the reasoning; they are moved by what a thing costs and pays them. Persuading the colonies to unite, persuading France into the war, he did not plead the higher cause. He totalled up the other side's account.", "eg": "Selling, raising money and getting another department to help are all the same operation: translate what I need you to do into what you get out of it."}, {"n": "Compounding, applied to a life", "d": "Money is of a prolific generating nature. Money can beget money, and its offspring can beget more. He was the earliest to carry compounding out of finance and into everything else — knowledge, credit, relationships, habits all obey the same law. His will left a thousand pounds each to Boston and Philadelphia on condition that it sit for two hundred years. It came out in the millions.", "eg": "Naval Ravikant's case for compounding wealth and judgement together traces straight back to this."}, {"n": "The Junto", "d": "At twenty-one he organised twelve men into the Leather Apron Club, meeting Friday evenings to discuss morals, politics and science, and introducing each other to business. That small group went on to produce America's first subscription library, its first volunteer fire company, and the academy that became the University of Pennsylvania. Do not grind away alone. Organise the capable people and you become the node.", "eg": "A standing group of a dozen people who meet on a fixed evening will out-produce any amount of individual networking, because the meeting happens whether or not anyone feels like it."}], "q": ["Never leave that till tomorrow which you can do today.", "It is hard for an empty bag to stand upright.", "Well done is better than well said.", "He that has once done you a kindness will be more ready to do you another."], "apply": "Turn self-improvement from resolve into a system. Pick one behaviour for this week, mark every day, and change one thing at a time. Build relationships by asking for small favours rather than agonising over what gift to send. And when you state a view, swap it is certainly for I am inclined to think — it costs nothing and halves the resistance.", "l": ["Zeng Guofan", "Charlie Munger", "Warren Buffett", "Naval Ravikant"], "contrast": [{"n": "Zeng Guofan", "why": "The matched pair of the two hemispheres: both of ordinary natural ability, both forging themselves with a daily ledger — between them the evidence that character is an engineering problem rather than a gift"}, {"n": "Naval Ravikant", "why": "The same algorithm two hundred and fifty years apart: compounding, leverage, reputation, and the pursuit of knowledge once money stops being the question"}]}, {"c": "Mind and feeling", "n": "Brené Brown", "e": "2010 · University of Houston", "w": "Shame and guilt", "y": 2010, "d": "A social work researcher who spent twenty years on the thing most people will not touch: making shame into an object that can be studied, across thousands of interviews. Her most useful contribution is not encouragement, it is a distinction. Guilt is I did something bad; shame is I am bad. The first points at a behaviour, the second at the person, and the same mistake produces opposite consequences depending on which one you reach for. (Her conclusions linking shame to addiction, depression and aggression come from her own qualitative work and reviews, and the quantitative strength of them is disputed. This entry takes the distinction, not the coefficients.)", "story": "The 2010 TEDxHouston talk on vulnerability was given to a local audience. She went home from it with what she later called a vulnerability hangover — certain she had said far too much about herself, hoping mainly that nobody she knew would ever see it. The video then went out to millions of people. A researcher who had spent two decades studying what happens to a person when the most private part of their life becomes available for public grading had, by accident, put herself inside her own experiment. When she next stood up to talk, the subject was not vulnerability. It was shame.", "f": [{"n": "Guilt points at the behaviour, shame points at the person", "d": "This is the root of the whole distinction. I made a mess of this leaves a road open: what to do next time. I am the kind of person who cannot get things done closes the road, because if the problem is who I am then there is no action available and only avoidance is left. One mistake, and the word you describe it with decides whether anything follows.", "eg": "The proposal went in late. I misjudged the time leads to a better estimate. I am unreliable leads to not accepting the next piece of work."}, {"n": "Shame lives on three things: secrecy, silence, judgment", "d": "Her formulation is that shame needs those three to grow exponentially, which read backwards is the remedy: say it, and say it to somebody who will not grade you. This is not comfort, it is dismantling the conditions the mechanism runs on. All of shame's force comes from the line it is only me, and that line fails the moment it is heard.", "eg": "Take the hardest thing to say and say it once, to a person you are sure will not use it to define you. The wrong listener is worse than none, so choosing matters more than speaking."}, {"n": "Vulnerability is exposure with the result unknown", "d": "Her definition contains no emotion at all, only a situation: uncertainty, risk, emotional exposure. On that definition, making the first friendly move, admitting you do not know something, and putting up a proposal that may be refused are all vulnerability. What separates it from weakness is whether you chose it.", "eg": "Saying in the meeting that you do not follow this part and asking somebody to explain is vulnerability. Asking quietly afterwards because of how it would look is avoidance."}, {"n": "Shame does not work as a management tool", "d": "Driving people with shame works briefly and teaches concealment permanently. In her organisational work the same pattern turns up repeatedly: a team corrected by humiliation ends up not with fewer errors but with fewer errors reported.", "eg": "Ask who did this at the post-mortem and you will not hear about the next incident. Ask which step had too little information and people keep talking."}], "q": ["Shame is I am bad. Guilt is I did something bad.", "Shame is really easily understood as the fear of disconnection.", "Vulnerability is uncertainty, risk, and emotional exposure.", "You can choose courage, or you can choose comfort, but you cannot choose both."], "apply": "Next time the bad feeling starts, work out which sentence you are saying to yourself: I did something wrong, or I am no good. The first has an action after it and the second does not. If you find the second, rewrite it down to the specific thing and the specific act. Then say it once to somebody who will not use it to define you. Used wrongly: filing responsibility you actually owe under just a behaviour, or telling somebody else to stop feeling shame, which is not something that can be argued away.", "l": ["Alfred Adler", "Carl Rogers", "Viktor Frankl", "Nonviolent Communication"], "contrast": [{"n": "Alfred Adler", "why": "Both are working on what other people think of me: Adler says it is their task and not yours, Brown says it is a mechanism that can be taken apart — one draws a boundary, the other dismantles a structure"}, {"n": "Carl Rogers", "why": "Rogers supplies the environmental condition, unconditional positive regard; Brown supplies the move the person in the chair can make for themselves"}, {"n": "Zeng Guofan", "why": "Zeng turned self-reproach into a daily discipline; Brown would ask whether that sentence is pointing at the behaviour or at the man writing it"}]}, {"c": "Mind and feeling", "n": "Kristin Neff", "e": "2003 · University of Texas", "w": "Self-compassion", "y": 2003, "d": "The psychologist who in 2003 turned self-compassion from a devotional word into a measurable psychological variable; the scale she built has been used across a large body of research since. Her contribution is not advice to be nicer to yourself. It is an alternative algorithm to self-esteem. Self-esteem has better than others inside its definition, so it runs on comparison: strongest when things go well, first to leave when you fail. Self-compassion does not compare. It asks only what do I need now that this hurts. (Effect sizes in this field are disputed and the scales are self-report; this entry takes her structure, not the coefficients.)", "story": "She has described where it started. After her son was diagnosed with autism, she found that everything which had taught her to be strong was useless, because all of it required her to prove first that she could take it. What let her keep going was permission to say that this was hard and that she was suffering, without adding the clause and therefore I am not up to it. That distinction — between admitting the difficulty and convicting yourself of inadequacy — is the whole of the research programme that followed, in one moment.", "f": [{"n": "Self-esteem runs on comparison, so it fails in the trough", "d": "While better than others sits inside the definition, the thing has to keep winning to keep supplying. One failure cuts the supply, and that is precisely the moment support was needed. Self-compassion is not indexed to rank, so it is present in the trough. This is not a quarrel about attitude, it is two different power sources.", "eg": "Overtaken by somebody from your own year, self-esteem says I am finished. Self-compassion says this hurts, that is normal, what is the next move."}, {"n": "It does not lower the standard, it raises the will to correct", "d": "The standing objection is that kindness to yourself makes you lazy. The data run the other way: moving attention from am I a failure to what do I do about this makes people readier to own the error and quicker to start repairing it. Shame makes people hide; self-compassion makes them look again.", "eg": "An evening of self-abuse after a bad result means not opening the paper the next day. Change the sentence and the wrong answers get reviewed that night."}, {"n": "Three parts, and all of them have to be present", "d": "Self-kindness, common humanity, mindfulness. The value of the model is diagnostic rather than motivational: when it hurts, check the three and usually exactly one is missing. Most people are missing common humanity, the sense that others have been here. A smaller number are missing mindfulness, and are either replaying it or insisting they are fine.", "eg": "Clear-eyed about the situation, aware other people go through it, and still refusing to be civil to yourself: the missing part is the first one."}, {"n": "The best test is whether you would say it to a friend", "d": "Take the sentence you are saying to yourself and say it word for word to a friend in the identical position. If it will not come out of your mouth, then it is not the truth, it is an attack. The test needs no theory to run and is hard to cheat.", "eg": "You are too stupid to be attempting this. You would not say it to a friend, so it does not get said to you either."}], "q": ["With self-compassion, we don't have to feel better than others to feel good about ourselves.", "Self-compassion is simply the process of turning compassion inward.", "Would you talk to a friend the way you talk to yourself?"], "apply": "After you make a mess of something, run one calibration first: try saying the sentence in your head, word for word, to a friend in the same position, and replace it if it will not come out. Then check the three parts. Am I willing to be civil to myself? Do I think this only happens to me? Have I weighed how serious it actually is, neither inflated nor denied? Usually only one is missing. Used wrongly: as a permit to stop reviewing what happened, or turning everyone goes through this into so stop complaining.", "l": ["Brené Brown", "Viktor Frankl", "Alfred Adler", "Carol Dweck"], "contrast": [{"n": "Brené Brown", "why": "Both are working on am I a bad person: Brown supplies the distinction, guilt against shame, and Neff supplies the replacement, self-compassion against self-esteem"}, {"n": "Carol Dweck", "why": "Two ways of editing the same sentence about who I am: Dweck moves ability from fixed to growable, Neff moves the attention off am I good enough — one changes the conclusion, the other changes the question"}]}, {"c": "Money and risk", "n": "Bai Gui", "e": "Warring States · 370–300 BC", "w": "Against the crowd", "y": -370, "d": "The earliest contrarian in the written record, twenty-two centuries before Graham. He traded farm goods across seasons and across crops, and the Grand Historian records the verdict of his own age: everyone in the empire who discussed making a living traced the craft back to him. He also set four conditions on who was allowed to learn it.", "story": "He once told Mencius that his own management of the waters was an improvement on Yu the Great's. Mencius refused it. Yu, he said, led the water to the sea, which is what water wants; you lead it into the neighbouring state and make their country your drain. The exchange survives because Bai Gui was a man philosophers argued with as an equal, a merchant in a century that ranked merchants last, claiming his trade was a discipline with principles and then behaving as though it were.", "f": [{"n": "When the world sells, I buy", "d": "The oldest contrarian rule on record. Buy the thing nobody wants; sell into the scramble. The weight sits on the second half. He did not try to sell at the top, because the last stretch of a price is set by feeling, and feeling cannot be forecast.", "eg": "Eight characters that translate straight into modern practice: be greedy when others are fearful, and every pendulum argument written since."}, {"n": "Four qualities, and no waivers", "d": "Wit to read the turn, courage to commit, humanity to give and take without chasing the last coin, strength to hold and to keep to the rules. The first two decide whether you make it; the second two decide whether you keep it, and most people fail on the second two.", "eg": "Seeing it and not acting earns nothing. Acting and never taking profit gives it back. Doing both and being shaken out in the chop ends the same way."}, {"n": "He hedged cycles rather than hoarding", "d": "In a good harvest he bought grain and sold silk and lacquer; when the cocoons came in he bought silk floss and sold grain. Farm cycles do not line up, so one side is always cheap. He was not earning a scarcity premium. He was earning the gap between two clocks.", "eg": "Betting on one commodity and waiting is a gamble. Holding two whose cycles run opposite and taking the spread is a business, and a business repeats."}, {"n": "He moved like a bird of prey", "d": "Sima Qian says that when the moment came he struck like a wild animal or a hawk. That is not in tension with the patience; it is the other half of it. Almost all the time is waiting, and the waiting exists so the strike can be immediate and full size.", "eg": "A year may hold two or three moments worth committing to. The discipline of the other three hundred and sixty days is what leaves you loaded on the day."}], "q": ["When the world sells, I buy. When the world buys, I sell.", "Wit to adapt, courage to decide, humanity to give, strength to hold.", "He seized the moment like a wild beast or a bird of prey.", "All who speak of making a living take him as their founder."], "apply": "Score yourself on his four before your next large commitment: can I actually read this, will I commit at the size my reading implies, can I leave the last stretch to somebody else, and will my behaviour change when it goes sideways? The lowest score is where your losses are coming from.", "l": ["Fan Li", "Benjamin Graham", "Warren Buffett", "Records of the Grand Historian", "Shang Yang"], "contrast": [{"n": "Fan Li", "why": "Two ancient fortunes: Fan Li teaches how to get out intact, Bai Gui teaches a method you can repeat"}, {"n": "Benjamin Graham", "why": "Twenty-two centuries apart, the same claim: price is set by mood, value by supply and demand"}]}, {"c": "Money and risk", "n": "Ray Dalio", "e": "Contemporary · 1949–", "w": "Principles", "y": 1949, "d": "Founder of Bridgewater Associates, for years the largest hedge fund in the world, and author of Principles. Forty years in markets produced one conviction: everything worth doing has principles behind it, principles can be written down, written principles can be systematised, and a system can be handed to other people. The book is that argument applied to himself.", "story": "A colleague once emailed him after a meeting with a prospective client. Ray, you deserve a D-minus for your performance today; you did not prepare, and it was unacceptable. At most firms that message ends a career. Dalio forwarded it to the whole company. That is what radical transparency is for. Not a mood of openness, but a rule that the accurate account of what happened has to survive the seniority of the person it is about.", "f": [{"n": "Pain plus reflection equals progress", "d": "Pain marks a place where an assumption you relied on has failed. The common responses are avoidance or explanation. His is to go at it: name the belief, find where it came from, rewrite the rule. The failure is only free if the second term actually happens.", "eg": "The 1982 collapse nearly ended the firm. He took the forecast apart, found the faulty assumption, and made the post-mortem required reading inside the company."}, {"n": "Radical truth and radical transparency", "d": "Meetings are recorded and anyone can pull them up, which turns criticism into something checkable rather than something whispered. The cost is the discomfort of being corrected in public. What it buys is the ability to know what actually happened.", "eg": "Most organisations choose comfort, and the price of comfort is a filtered picture of the business that nobody can correct because nobody can see it."}, {"n": "Believability-weighted decisions", "d": "Not a head count and not a boss's ruling. Opinions are weighted by each person's record in that specific field, on the plain ground that a surgeon's view on surgery should outweigh a cook's, however good the cook is at everything else.", "eg": "Log predictions, reasoning and outcomes for six months. The list of who was accurate rarely matches the list of who spoke most."}, {"n": "Debt cycles", "d": "The short cycle runs five to eight years: expansion, inflation, tightening, recession, easing, recovery. The long one runs decades, until debt can no longer be handled by cutting rates and has to be deleveraged. Knowing which part you stand in is the largest variable in allocation.", "eg": "1929 and 2008 are both the end of a long cycle. Reading them as isolated disasters loses the pattern that made both of them arrive."}], "q": ["Pain + Reflection = Progress.", "It gave me the humility I needed to balance my aggressiveness.", "An idea meritocracy is a system in which the best ideas win out.", "Failure is not the problem. Failing to learn from it is."], "apply": "After your next serious failure, give yourself forty-eight hours and then run his review: which assumption turned out to be false, where did that assumption come from, and what rule should now produce a different decision next time?", "l": ["Zeng Guofan", "Wang Yangming", "Fan Li", "Charlie Munger", "Nassim Taleb"], "contrast": [{"n": "Zeng Guofan", "why": "The same instrument on two continents: thirty years of diaries and a decade of taped meetings, both aimed at self-deception"}, {"n": "Nassim Taleb", "why": "Both organise around risk: Dalio systematises it with principles, Taleb structures a portfolio to profit from it"}]}, {"c": "Money and risk", "n": "Benjamin Graham", "e": "United States · 1894–1976", "w": "Margin of safety", "y": 1894, "d": "The father of security analysis, author of Security Analysis and The Intelligent Investor. He taught at Columbia, and one of his students was Warren Buffett, who says most of what he does came from Graham. His achievement was to show, in a decade that treated shares as betting slips, that a share is a piece of a business and that price and value are two different quantities.", "story": "Before the crash his accounts had made money every year and he was a Wall Street prodigy. Between 1929 and 1932 his fund lost seventy per cent and came close to the end; the household got through on his wife going back to work and help from his mother-in-law. The disaster is what produced the system. If a good judgement can still be wrong, the protection cannot be better judgement. It has to be built into the purchase price. Security Analysis appeared in 1934, and his fund did not have a losing year afterwards.", "f": [{"n": "Mr. Market", "d": "Imagine a partner who names a price every day and will buy from you or sell to you at it. He is elated one week and despairing the next. You may deal with him or ignore him entirely; he is not offended and he returns tomorrow. The market exists to serve you, not to instruct you.", "eg": "March 2020 and the long slide of 2022 were both his depressive episodes. Whoever read the screen as a quotation rather than a verdict was buying."}, {"n": "Margin of safety", "d": "Three words for the whole of sound investment. Pay fifty cents for a dollar and a thirty per cent error still leaves you whole. The margin does not raise the return on a correct call; it makes an incorrect one survivable. Every blow-up is a zero-margin position.", "eg": "A bridge rated for thirty thousand tonnes is posted for ten. Graham took engineering redundancy and moved it into finance."}, {"n": "Where investment stops and speculation starts", "d": "An investment operation, on thorough analysis, promises safety of principal and an adequate return; anything failing those tests is speculation. Note that the standard is adequate rather than maximal, and that the line is drawn in the operator rather than in the security.", "eg": "Two people can hold the same share on the same day, one investing and one speculating. The difference is the analysis standing behind it."}, {"n": "The weighing machine", "d": "In the short run the market is a voting machine; in the long run it is a weighing machine. Votes are cast by mood, weight is set by earning power. The investor has two jobs: work out the weight, and wait for the weighing. Not reading the votes is survivable; not knowing the weight is not.", "eg": "Sell to the optimists, buy from the pessimists. The return comes from other people's mispriced feeling, not from a better forecast."}], "q": ["One of your partners, named Mr. Market, is very obliging indeed.", "Distill the secret of sound investment into three words: margin of safety.", "In the short run a voting machine, in the long run a weighing machine.", "The investor's chief problem, and even his worst enemy, is likely to be himself."], "apply": "Before any commitment, a share or a job or a company, run his three questions: have I analysed this thoroughly, is the principal or the fallback safe in the worst case, and is the return I want adequate or greedy? Then add one rule: act when the market is in an extreme mood, and ignore the quotes the rest of the time.", "l": ["Bai Gui", "Warren Buffett", "Charlie Munger", "Ray Dalio", "Nassim Taleb"], "contrast": [{"n": "Warren Buffett", "why": "The student past the teacher: Graham bought cheap ordinary companies, Buffett bought great ones at fair prices"}, {"n": "George Soros", "why": "Graham assumes price returns to value; Soros trades the stretch where price drives value away from itself"}]}, {"c": "Money and risk", "n": "Hu Xueyan", "e": "Qing · 1823–1885", "w": "The patron", "y": 1823, "d": "The most famous merchant of the late Qing, self-made, for a time the richest man in China, decorated with an official rank and the yellow riding jacket. He was also the first Chinese businessman to take on the foreign trading houses directly, and he lost completely: two years from the summit to the confiscation of his estate. Note that most quotable Hu Xueyan sayings in circulation come from a twentieth-century novel, not from the record.", "story": "He was a clerk in a Hangzhou money shop when he met Wang Youling, a candidate official with a purchased rank and no money to take up a post. Hu advanced him funds out of the shop's own money and was dismissed for it. Years later Wang was a provincial official and steered government business his way, and everything that followed rests on that one bet on one man. The structure that made him is the structure that killed him.", "f": [{"n": "A patron is leverage and a single point of failure", "d": "His start was backing one broke official; his peak was tied to Zuo Zongtang, whom he supplied with grain, arms, foreign loans and campaign finance in exchange for rank and large official deposits. It is the most efficient structure available and it rests on one man keeping his power.", "eg": "Today it is customer concentration and one signature: sixty per cent of revenue from a single account, or an approval only one person can give."}, {"n": "Obligation is the dearest asset and the frailest liability", "d": "He was superb at it, with free medicine, famine relief and something always left on the table for the other side. It made him nearly unstoppable while things went well. But a network of obligation runs on the expectation that you keep winning, and when the verdict flips it reverses at once.", "eg": "Bank runs, waves of resignations, suppliers all tightening terms in the same week. One mechanism wearing different clothes."}, {"n": "The mismatch is what kills", "d": "The silk losses alone were survivable given time. What removed the time was funding a long silk position with deposits withdrawable on demand. Borrow short and invest long, and one push at the wrong moment finishes you while the balance sheet still looks solvent.", "eg": "Assets are fine, cash is just tight this month is the sentence every dead company said first. Insolvency does not kill; the cash running out does."}, {"n": "Cornering a market whose supply you do not own", "d": "The hoard assumed raw silk supply was fixed and that buying it all would set the price. Italy also grew silk. Any attempt to buy price-setting power has to answer one question first: can the supply come from somewhere else?", "eg": "Unless the thing is genuinely scarce, a squeeze eventually meets new supply. It has replayed in commodities, in crypto and in hiring."}, {"n": "The move that won will be the one that finishes you", "d": "He rose through official connections and was destroyed through official connections; he grew on his bank's liquidity and died in a run on it; he made his first fortune by daring a bet and lost everything on the largest one. He never changed the method, only the leverage on it.", "eg": "The thing you are best at tends to be how you go, because you reach for it without thinking, right up until conditions turn against it."}], "q": ["No trade can afford the word cheat; medicine, which holds lives, least of all.", "Eight teapots and seven lids.", "Never wear arrogance; never be without a backbone."], "apply": "Check your own structure for his three in combination: one patron, meaning a single client or channel or signature; a duration mismatch, meaning money that can leave supporting a position that needs time; and a network held together by other people believing you will win. Any one alone is survivable. All three at once and the timing of your ending belongs to somebody else.", "l": ["Li Ka-shing", "Zeng Guofan", "Fan Li", "Xiang Yu", "Nassim Taleb"], "contrast": [{"n": "Fan Li", "why": "Both worked between officials and trade. Fan Li left at the summit; Hu Xueyan tied the knots tighter every year"}, {"n": "Li Ka-shing", "why": "Same game, opposite rules: never take the last coin and cash is oxygen, and Hu Xueyan broke both"}]}, {"c": "Money and risk", "n": "Jesse Livermore", "e": "United States · 1877–1940", "w": "Sitting tight", "y": 1877, "d": "The most famous speculator in American history and the model for Reminiscences of a Stock Operator. He started in bucket shops at fourteen, went broke four times and came back four times, made about a hundred million dollars short in the crash of 1929, and invented much of what trend following still uses. He went broke again in 1934 and took his own life in 1940, leaving a note that called his life a failure. He is the clearest case there is of a man who wrote the rules and died breaking them.", "story": "In the summer of 1929 the market was euphoric and everyone was talking about a new era. He worked his own system: small probing shorts at his key points, several small losses, no increase in size, and waiting. In October the market broke, his positions came good, and he made roughly a hundred million dollars in a month. Papers called him the great bear of Wall Street and ruined strangers wrote to threaten him. Every rule that made that month work was one he personally broke five years later.", "f": [{"n": "Trade the pivotal point, do not predict it", "d": "Do not guess tops and bottoms. Wait until the price clears a key level and the trend confirms itself. He said he never bought at the low or sold at the high. Give up the first fifth of a move in exchange for the market telling you which way it is going.", "eg": "He did not call the top in the bull market. He waited until the index broke support and the rally failed, and only then went in size."}, {"n": "Cut losses, let profits run", "d": "A losing position is evidence you are wrong: leave, and never average down. A winning one is evidence you are right: stay. The amateur instinct is exactly inverted, holding losers to avoid admitting error and taking gains quickly to bank being right.", "eg": "The workplace version: stop the wrong project early, and be willing to double the resources on the one that is working."}, {"n": "Probe, then pyramid", "d": "Open small, add only after the market has confirmed the view, and make each addition smaller than the last. No single judgement should be able to reach the base of your capital. The opposite is the one big bet, which ties the judgement and the survival together.", "eg": "Put in a tenth first. Add on evidence rather than on conviction, and never in order to rescue an average price."}, {"n": "Being flat is a position", "d": "Money is made by sitting, not by trading. When there is nothing there, doing nothing is optimal. Most of his profit came from a few large opportunities each year, and most of his losses from restlessness in between.", "eg": "Count the trades, or the decisions, you made last quarter out of boredom rather than because something had actually changed."}, {"n": "Nothing new, because nobody is new", "d": "There is nothing new in Wall Street, because speculation is as old as the hills. Greed, fear, hope and regret run the same script in every bubble and every crash with a fresh cast. Whoever can read the cycle in people finds the same trade in any decade.", "eg": "Every mania has the same four acts. The asset changes; the sequence of feelings in the crowd does not."}], "q": ["There is nothing new in Wall Street. Speculation is as old as the hills.", "It never was my thinking that made the big money for me.", "Men who can both be right and sit tight are uncommon.", "Instead of hoping he must fear; instead of fearing he must hope."], "apply": "Set a written stop on every serious commitment, money or career or project, and hand it to someone else to hold you to, because stops are kept by systems rather than by willpower. Then apply the multiplication rule: never take a bet that can take you to zero, however good the odds look.", "l": ["George Soros", "Nassim Taleb", "Warren Buffett", "Fan Li"], "contrast": [{"n": "Warren Buffett", "why": "Speculation against investment: Livermore took the price movement and rose and fell four times, Buffett took the business and compounded"}, {"n": "Fan Li", "why": "Both understood exits. Fan Li left at every summit; Livermore never once got up from the table"}]}, {"c": "Money and risk", "n": "Peter Lynch", "e": "United States · 1944–", "w": "Turning over rocks", "y": 1944, "d": "He ran Fidelity's Magellan fund for thirteen years, from 1977 to 1990, compounding at twenty-nine per cent a year and taking it from twenty million dollars to fourteen billion. Magellan returned twenty-seven times over that stretch against 4.7 times for the index. He retired at forty-six, at the peak, because he did not want to miss his daughters growing up. There is no secret in the method, which is exactly why it is hard to copy.", "story": "He used to gauge the market by what happened to him at parties. Stage one: people learn he runs a mutual fund and drift back to the dentist. Stage two: someone politely asks whether stocks are risky. Stage three: a ring forms and everyone wants to know what he is buying. Stage four: they start telling him which ones he ought to own, and that, he said, is when to leave. The indicator is not the price. It is how much authority strangers think they have.", "f": [{"n": "Invest in what you know, and finish the sentence", "d": "The amateur's advantage is not more information but earlier information, in one corner: your own industry, the product your children use, the shop you walk past. The full version has a second half. The observation is a start, and between a good company and a good share sits a set of accounts.", "eg": "Plenty of people shopped in Walmart every week for years while it went up many times over, and almost nobody connected the shop to the shares."}, {"n": "Six categories, six different rulers", "d": "Slow growers held for the dividend; stalwarts bought on a thirty per cent fall; fast growers judged on whether the store or product repeats; cyclicals bought at high multiples and sold at low ones; turnarounds judged only on how long the cash lasts; asset plays valued on what the books miss.", "eg": "The common way to lose money is measuring a cyclical with a growth ruler. The first question is which kind of company this actually is."}, {"n": "Tenbaggers live in dull places", "d": "He liked companies with unpleasant names and boring businesses that no analyst followed: waste disposal, bottle caps, funeral services, motels. Nobody watching means a higher chance of mispricing. He was equally firm about what to avoid, which is anything described as the next something.", "eg": "La Quinta was a budget motel chain growing profits over thirty per cent for five straight years. What it did right was cut the restaurant and the conference rooms."}, {"n": "Do not forecast the market", "d": "Spend thirteen minutes a year on economic forecasting and ten of them are wasted. Over thirteen years he sat through nine declines of more than ten per cent, dodged none of them, and still compounded at twenty-nine per cent. Avoiding falls costs far more over time than absorbing them.", "eg": "The people in his own fund who traded around the dips ended with a fraction of what the fund returned, and many with less than they started."}, {"n": "Turn over enough rocks", "d": "This is the floor under all of it and the part nobody copies: hundreds of company visits a year, walking the stores, driving the product, looking in other people's trolleys. The edge is not intelligence, it is labour, and labour is the one thing a book cannot transfer.", "eg": "The person who turns over the most rocks wins. It is a boring claim, which is exactly why it stays available."}], "q": ["The key organ for investing is the stomach, not the brain.", "Investing without research is like playing stud poker and never looking at the cards.", "Never invest in any idea you can't illustrate with a crayon.", "The person that turns over the most rocks wins the game."], "apply": "Start a watch list from your own working life: things you use daily, that people around you have started discussing, that the press has not covered yet. Then force three answers before you buy. Which of the six kinds is it, which ruler prices it, and if it halved tomorrow would I add or panic? If the third has no answer, do not buy.", "l": ["Warren Buffett", "Benjamin Graham", "Duan Yongping", "Charlie Munger", "Jim Simons"], "contrast": [{"n": "Jim Simons", "why": "Same market, opposite routes: Lynch visited three hundred companies a year, Simons visited none"}, {"n": "Benjamin Graham", "why": "Both work from fundamentals, but Graham prices the liquidation and Lynch prices the room left to grow"}]}, {"c": "Learning and growth", "n": "Fukuzawa Yukichi", "e": "Japan · 1835–1901", "w": "Relearning", "y": 1872, "d": "Educator of the Meiji period and founder of Keio Gijuku. In his early twenties he learned Dutch in Osaka and learned it extremely well; in 1859 he walked into the newly opened port of Yokohama and could not read a single sign, because they were all in English. He did not go back to his Dutch. The next day he started hunting for English textbooks. He then wrote An Encouragement of Learning, which opens with the line that heaven creates no man above or below another, and sold over three million copies, mostly to young people who did not know what to study.", "story": "In the summer of 1868 the Boshin War reached Tokyo. Fighting broke out at Ueno, close enough that the guns could be heard across the city, and most schools shut. Fukuzawa kept his open. He went on lecturing his students from an American textbook on economics while the battle ran its course a few miles away, and the school later took the date as a point of pride. The gesture was not bravado. It was the same claim his books make in flatter language: what a country and a person are short of is not spirit but usable knowledge, and the day you stop acquiring it is the day the trouble actually starts.", "f": [{"n": "Useless is information, not a verdict", "d": "Something being useless tells you about the direction, not about your capacity. Once the direction is clear, where the effort should go is obvious. Switch the same week, because every day of waiting adds another chip to the track you are leaving. The real waste is not learning something that expired; it is refusing to change.", "eg": "When what you trained for stops matching the work, ask what it tells you about direction before you mourn the years."}, {"n": "Learn what you will use tomorrow first", "d": "His ordering rule has one term in it: frequency of use. Daily first, once a year later. Not because the later ones do not matter, but because a beginner has limited hours. Whether to keep studying is settled the same way, not by the level of the qualification but by whether the reading lands in your hands.", "eg": "When you cannot decide what to practise, write down the three things you will need at work tomorrow morning and practise those."}, {"n": "Move the cause somewhere you can reach", "d": "The worst thing about I was born with less is not that it might be false. It is that it parks the cause where nothing can be done. He moves it to whether you studied. Someone looks steady because they practised something three years before you did; translate stronger into earlier and most of the anxiety goes.", "eg": "An explanation that leaves you with nothing to do is usually the comfortable one rather than the true one."}], "q": ["Heaven does not create one man above or below another man.", "Learn what you need tomorrow first. Once a year can wait.", "The gap was made after birth, so it can be closed."], "apply": "Write down the three things you will actually need at work tomorrow morning, and be honest about which of them you are still slow at. Practise those this week and nothing else. If you are carrying years of training that no longer fits, do not spend the week deciding whether those years were wasted; spend ten minutes a day on the new thing starting today, and separately list what you built while learning the old one, because the method transfers even when the content does not.", "l": ["Anders Ericsson", "Excellent Sheep", "Kazuo Inamori", "Garry Kasparov", "Bruce Lee"], "contrast": [{"n": "Excellent Sheep", "why": "Excellent Sheep diagnoses what happens to someone who lived on scores and then has no scores; Fukuzawa hands a beginner an order of operations instead"}, {"n": "Bruce Lee", "why": "Both say the inherited set of moves stops working, but Fukuzawa is the more literal of the two: change the content the day you see it, keep the method"}]}, {"c": "Learning and growth", "n": "The Last Hot-Metal Edition", "e": "New York · 1978", "w": "A trade erased", "y": 1978, "d": "On 1 July 1978 the New York Times set its last edition in hot metal, and photocomposition took over the same day. The trade took years to learn and the Linotype keyboard has nothing in common with a typewriter, so what came out of those years was a body of skill that worked in exactly one place. The next morning there was no position for it in the building. It is here not as nostalgia but as evidence: the one case in this library where a whole craft was erased on a fixed date, with a film of the night it happened.", "story": "Read down the first two vertical columns of a Linotype keyboard and you get etaoin shrdlu, the letters arranged by how often English uses them. When an operator fluffed a line, the quickest repair was to run a finger down those two columns, fill the line with nonsense, and throw the slug away. Now and then one escaped into the printed paper. Every compositor knew the string on sight and nobody outside the trade had ever heard of it, which is why the film of that last night is called Farewell, Etaoin Shrdlu. A private vocabulary is the surest sign of a real craft, and it goes out with the craft.", "f": [{"n": "Replacement is a switch, not a decline", "d": "Once the equipment is installed and the workflow cuts over, the old roles stop as a block rather than thinning year by year. People counting on a few years of cushion in which to adjust usually do not get one.", "eg": "It is not that orders shrink each year. It is that from one month on, the whole line is run a different way."}, {"n": "The most skilled took the hardest hit", "d": "Lines set per minute was the trade's public scoreboard, and the machine voided the whole board at once. The people near the top lost most, because every chip was on a position that could be lifted away whole. And every year until then, another hour on the main skill had been the best available move.", "eg": "Fastest, most accurate, most practised. Those are precisely the measures a tool catches up with first."}, {"n": "Being able to say why is what travels", "d": "How it is done belongs to the tool; why it is done that way belongs to judgement. The first expires with the equipment, the second travels with the person. What tools match is the half of a craft that can be stated, which is why the unstated half needs stating most urgently of all.", "eg": "That looks wrong has to break down into three specific reasons before anyone can carry it anywhere."}], "q": ["Inside an industry, replacement is rarely gradual.", "A skill welded to one machine retires when the machine does.", "Touch the new tool while the old work still pays."], "apply": "List the five things you are best at in your work, and mark each one with the tool it is attached to. Anything welded to one specific system is on a clock you do not control. Then take the part of the job you do by feel, the part where you can see something is wrong but cannot say why, and force three specific reasons out of it this month. That is the half a tool cannot match yet, and it is also the half you cannot hand to anyone until it is in words.", "l": ["Garry Kasparov", "Norbert Wiener", "Richard Feynman", "Naval Ravikant"], "contrast": [{"n": "Garry Kasparov", "why": "One is a single person overtaken by a machine and free to change the rules he plays by; this is a whole trade erased in a night, with no such room"}, {"n": "The Innovator's Dilemma", "why": "Same upheaval from two sides: the Dilemma stands with the company and explains why its decisions were reasonable, this stands with the workers the morning after"}]}, {"c": "Learning and growth", "n": "Haruki Murakami", "e": "Japan · 1949–", "w": "Writing as physical work", "y": 2007, "d": "He ran a jazz bar into his early thirties, decided at a baseball game in 1978 that he could write a novel, and in 1981 closed the bar to write full time. He began running at the same time for an unglamorous reason: sitting down all day was making him heavier and he smoked too much. Over the next thirty years he finished more than thirty marathons and one hundred-kilometre ultra, and ran his writing on the same method. His book about running is read by large numbers of people who do not run, because underneath it answers a different question: how do you keep at something for decades when nobody asked you to.", "story": "He would like a gravestone, he writes, that carries his name, the dates, and then two lines: Writer, and in brackets, Runner. At Least He Never Walked. It is a joke, and it is also the whole standard he works to. Not the best, not the fastest, not acclaimed. Simply that on the days he was supposed to be moving, he did not stop and walk. Nobody sets that bar for you and nobody can check it. He has spent decades holding himself to a line that only he can see, which is exactly the problem most people run into with anything long.", "f": [{"n": "Stop while it is still flowing", "d": "Ten pages a day when he is writing a novel, filled on a bad day and stopped on a good one. The hard part is not writing but starting again, so he leaves the day at a point where he already knows the next sentence and tomorrow costs almost nothing to begin.", "eg": "Stop in the middle of a sentence. Tomorrow you sit down and simply keep typing."}, {"n": "Set a ceiling, not only a floor", "d": "Most people give themselves a minimum and nothing else. The ceiling is there to stop the good day from borrowing against the next three. The real enemy of output is not laziness but swing, and swing is what an uncapped good day produces.", "eg": "Twenty thousand words over a weekend, then a fortnight of touching nothing. The books balance, or come out worse."}, {"n": "Two things besides talent, and both can be trained", "d": "A novelist needs talent, focus and endurance. How much talent you were given is settled and worrying about it produces no action, while the other two grow under load the way muscle does. So the hours belong to the two that move.", "eg": "I have no talent may even be correct, and it still cannot tell you what to do today."}, {"n": "Nobody asked, so the reason has to be yours", "d": "Work has reviews and school has exams, and both supply the reason from outside. Something you chose has none of that. Make the response your reason, the views and the verdicts, and it can be withdrawn at any time. His replacement is yesterday's version of himself, which is present daily and never runs out.", "eg": "Three posts, nobody reads them, and you stop. The reason for writing was in other people's hands from the start."}], "q": ["The only opponent you have to beat is yourself.", "Set the daily amount where your worst day still finishes it.", "No readers is not a reason to stop; readers are not either."], "apply": "Pick the long thing you keep starting and stopping, and give it a daily amount low enough that your worst day still finishes it. Measure input, not output. Then add the part almost nobody adds: a ceiling, so the good days stop borrowing from the bad ones. Finish each session while you still want to continue, in the middle of a sentence if you can. And the next time you want to quit, say out loud whether it is because the work was bad or because nobody saw it, then decide.", "l": ["Anders Ericsson", "BJ Fogg", "Cal Newport", "Kevin Kelly", "Bruce Lee"], "contrast": [{"n": "Anders Ericsson", "why": "Both are about what to do daily over years: deliberate practice keeps you at the edge of what you cannot do, Murakami lowers the daily difficulty so you never break the chain"}, {"n": "BJ Fogg", "why": "Two ends of one idea: Fogg shrinks the behaviour until the worst day can do it, Murakami caps the daily output so the best day cannot overspend"}, {"n": "Kevin Kelly", "why": "Same question, nobody is looking, two answers: Kelly says you only need a thousand true fans, Murakami says the answer should not be sought outside at all"}]}, {"c": "How the world works", "n": "Finite and Infinite Games", "e": "1986 · James P. Carse", "w": "Win, or keep playing", "y": 1986, "d": "A slim book by a professor of religious history at New York University: 101 short sections, no argument, only statements. The distinction it offers is very simple — a finite game is played to win, an infinite game to continue the play. Once it is in your head it rearranges almost everything you thought about ambition, competition, careers and companies, because you start noticing how many of the games you are in were never required to have a winner at all.", "story": "The book landed with almost no response. It was not a business book and not quite an academic one — a historian of religion writing in aphorisms about games, theatre and death, which pleased neither side. It was properly read only in the internet era, when founders found that it described precisely something they could not name: why some companies win every battle and die, while others never declare victory and are still there. Its best-known reader in China is Wang Xing, and the Meituan value about being patient for the long term stands on this book.", "f": [{"n": "Two kinds of games", "d": "A finite game has a fixed start, end and winner, its rules cannot change, and players play inside the boundaries. An infinite game has no end, its rules must change so that the play can continue, and players play with the boundaries themselves.", "eg": "A funding round, a sale, a quarter are finite. A company, a relationship, a person's craft are infinite. Play an infinite game as a finite one and on the day you win you will not know what to do."}, {"n": "The rules point in opposite directions", "d": "A finite game's rules cannot change or the game is over; an infinite game's rules must change or the game is over. This is the sharpest edge in the book: every 'we have always done it this way' is quietly demoting an infinite game to a finite one.", "eg": "The policy that made the company work at thirty people, left untouched at three hundred, is not tradition. It is a countdown."}, {"n": "Power and strength", "d": "Finite players compete for power, which is respect attached to a title and is handed to you by other people. Infinite players play with strength, which needs nobody's recognition and cannot be taken away.", "eg": "Whatever is still there after the title is swapped out is the strength. Most career anxiety comes from the two having been treated as one thing for years."}, {"n": "Serious against playful", "d": "Finite players are serious, because the outcome touches their title. Infinite players are playful, because they can change the rules at any moment. Playful does not mean careless; it means having kept the freedom to change something.", "eg": "The person who can laugh in the middle of a negotiation usually has another option. Seriousness is often just the absence of one."}, {"n": "Titles need an audience", "d": "A finite game needs spectators to certify the win — a champion nobody saw does not hold. An infinite game has no audience, only players. Any achievement that has to be watched in order to exist is a finite game.", "eg": "If the reason to do it evaporates the moment nobody will know, that was a finite game wearing a long-term costume."}], "q": ["A finite game is played for the purpose of winning.", "An infinite game is played for the purpose of continuing the play.", "Finite players play within boundaries; infinite players play with boundaries.", "The rules of a finite game may not change; the rules of an infinite game must."], "apply": "Next time a situation has you tense, ask one question before any other: is this finite or infinite? If it is finite, define what winning means, play it out, and leave it at the office. If it is infinite, stop chasing an endgame and put your attention on staying able to keep playing. It works especially well on careers — a promotion is a finite game, capability is an infinite one, and only one of them ends.", "l": ["Wang Xing", "Zhuangzi", "Thinking in Systems", "Naval Ravikant", "Nietzsche"], "contrast": [{"n": "Sun Tzu", "why": "Sun Tzu solves competition entirely as a finite game and every technique serves the win; Carse asks why you assumed this round had to end at all"}, {"n": "Peter Thiel", "why": "Thiel's monopoly is a finite game won completely, and Carse would point out that the moment you have won, that game is over"}, {"n": "Zhuangzi", "why": "The use of the useless runs the same way as the infinite game: not winning inside the given rules, but keeping room to change them"}]}, {"c": "How the world works", "n": "Guns, Germs, and Steel", "e": "1997 · Jared Diamond", "w": "Environment, not race", "y": 1997, "d": "Diamond's 1997 book, which took the Pulitzer the following year. It answers a question almost everyone has had and few ask out loud: why did Europeans arrive in the Americas and Oceania with guns, germs and steel rather than the other way round. His answer is environment rather than people — the gaps between continents in domesticable species and in geographical axis, run through food production as the intermediate variable, widened over thirteen thousand years into gaps in technology, writing, organisation and immunity.", "story": "At Cajamarca in 1532, Pizarro took the Inca emperor with a hundred and sixty-eight men. The story is usually told as nerve, horses and steel. Diamond's version starts earlier: smallpox had already crossed the continent ahead of any Spaniard, killed the previous emperor and his heir, and left a civil war behind it. What those hundred and sixty-eight men walked into was a state that had just finished fighting itself. The germs did more of the conquering than the guns, and the germs came from thousands of years of living beside domesticated animals.", "f": [{"n": "Proximate and ultimate causes", "d": "Guns, germs and steel are only proximate causes; they are results. Trace back and the ultimate cause is food production: whoever got farming and herding first got density, surplus and specialisation, and after those came states, writing, metal and armies.", "eg": "Asking why the Spanish had steel swords leads nowhere. Ask why Eurasia could feed a class of blacksmiths who did not have to farm."}, {"n": "Domesticable species are very unevenly spread", "d": "Of the world's wild mammals over forty-five kilograms, only fourteen were ever domesticated, and thirteen of those came from Eurasia. He calls it the Anna Karenina principle: domesticable animals are all alike, and each undomesticable one fails in its own way — temperament, diet, breeding, herd structure.", "eg": "A zebra looks like a horse and has never been domesticated: it bites and will not let go. Africa tried. That route was simply closed."}, {"n": "The direction of the continental axis", "d": "Eurasia runs east to west, so one latitude gives similar climate and crops, livestock and techniques shift sideways for thousands of miles. The Americas and Africa run north to south, and spreading across climate zones is slow or impossible. A line on a map set the speed of diffusion.", "eg": "Wheat needed no re-domestication to reach Europe and India. Maize took thousands of years to get from Mexico to eastern North America, and had to be bred for it."}, {"n": "Germs are a by-product of livestock", "d": "Smallpox, measles and influenza all came out of densely kept animals. Eurasians paid for them over millennia and carried the immunity as a result. When those germs reached the Americas with people, they killed far more than the guns did.", "eg": "In the century after contact, disease is reckoned to have removed the large majority of the population of the Americas, most of whom never saw a European."}, {"n": "Optimal fragmentation", "d": "Europe's broken terrain produced a long-running system of competing states: one king turned Columbus down and there was another to ask. China's unity meant a single bad decision could lock the whole country — Zheng He's fleets were stopped by one court order and there was no second backer.", "eg": "Unity buys efficiency, fragmentation buys options. It holds for countries, and it holds for industries and for companies."}], "q": ["History followed different courses for different peoples because of differences among peoples' environments.", "Domesticable animals are all alike; every undomesticable animal is undomesticable in its own way.", "What conquered the Americas was not mainly the guns, but the germs that arrived with them.", "The largest patterns in history come from the differences between continental environments."], "apply": "What it gives you is a discipline of attribution: when you
