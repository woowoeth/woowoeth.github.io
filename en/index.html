o right answer — should we even build this — is the one he can't start."}, {"n": "Never having failed makes failure unimaginable", "d": "The price of an unbroken record is no experience of failing, so failure gets imagined as catastrophic — and the result is avoiding anything you might not be good at, with a range that narrows year by year.", "eg": "She picked the third language she already half-knew over the one she wanted, because a visible beginner year was unthinkable."}, {"n": "The prescription is time with no scoreboard", "d": "Not a different subject or a different job, but a stretch long enough to get past novelty, doing something nobody is grading. Where a metric exists, attention slides to it, so the question can only surface somewhere without one.", "eg": "Six months of pottery with nobody grading it did more than another certificate, precisely because there was no number to optimise."}], "q": ["Superb at clearing hurdles, and unable to say where they were going.", "Never allowed to fail, you imagine failure as unsurvivable.", "Only when nobody is grading you do you find out what you want."], "apply": "If you can say exactly what counts as doing well and can't say what you want, do one thing that isn't scored, for long enough to get past the novelty. Facing any opportunity, separate two things: is it the content that draws me, or is it simply the next hurdle on the track I'm already on?", "l": ["Pu Songling", "Carol Dweck"], "contrast": [{"n": "Pu Songling", "why": "Two ways of having no scoreboard: they were never given one, he had one and it never once said yes"}]}, {"c": "Body and daily life", "n": "Christina Maslach", "e": "1946– · UC Berkeley", "w": "Burnout is the job", "y": 1981, "d": "Burnout became measurable largely because of her work. Her 1981 inventory split it into three components — emotional exhaustion, depersonalisation, and a fall in personal accomplishment — of which only the first overlaps with being tired. Her most persistent and least popular claim is that burnout is a problem of the work environment, not of individual resilience: nearly every remedy on the market teaches people to relax, which asks the person absorbing the damage to repair its cause.", "story": "There is an earlier thing she is known for. In August 1971 she was a recent Stanford PhD, and her partner Philip Zimbardo was running a prison simulation in the psychology building. Visiting on the sixth night, she saw prisoners being marched to the lavatory with bags over their heads and objected — not as a methodological point but as a moral one. The experiment was shut down the next morning. Her career since has been one long version of the same argument: look at what the situation is doing to people before you look at the people.", "f": [{"n": "Only one of the three is tiredness", "d": "Rest fixes exhaustion. It does not fix detachment or a collapse in accomplishment, and those two usually arrive first. So somebody can look like they're working normally, and still be delivering, months into it.", "eg": "He came back from three weeks off rested and still couldn't care about the release. The sleep debt was gone; the other two weren't."}, {"n": "Fix the job, not the person", "d": "Told the problem is their attitude, a person adds a layer of self-blame and stays in the same environment. Personal remedies aren't useless — they're second. Reverse the order and they stop being support and start being cover.", "eg": "The wellness app arrived the same quarter the team lost two people and kept the same roadmap. Everyone downloaded it. Nothing changed."}, {"n": "Six ways to be mismatched", "d": "Workload, control, reward, community, fairness, values. Most people watch only the first. In her data, having no say and doing work that runs against what you believe are often more lethal than volume.", "eg": "The hours were fine. Being told what to ship and then blamed for shipping it is the one that emptied him out."}], "q": ["Sleep fixes tired. It does not fix detachment.", "Asking the person absorbing the damage to repair its cause is backwards.", "If a month off returns you to the same arrangement, it isn't your mindset."], "apply": "Before deciding you need a holiday, check which of the three you have: drained, nothing left for people, no satisfaction on finishing. Then score the six areas one at a time. 'Work is exhausting' implies no action; the six-line version usually names something specific — decision rights, fairness, or different work.", "l": ["Robert Sapolsky", "Arlie Hochschild"], "contrast": [{"n": "Robert Sapolsky", "why": "Same conclusion from two directions: she measures the job, he measures the hormone, and both land on control"}, {"n": "Arlie Hochschild", "why": "Two kinds of uncounted work: required feeling, and the shift that starts when the paid one ends"}]}, {"c": "Mind and feeling", "n": "John Cacioppo", "e": "1951–2018 · University of Chicago", "w": "Loneliness is a signal", "y": 2008, "d": "A founder of social neuroscience who spent a career on one question: what loneliness actually is in the body and the brain. His first move was to tighten the definition — loneliness is not being alone, it is the gap between the connection you want and the one you have, which is why a crowded room can be lonely. That change moves it out of the category of personality and into the category of hunger and thirst: a signal that something needed is missing.", "story": "He started as a psychophysiologist — someone who attaches electrodes and measures what the body does. That is why the loneliness work landed. He did not arrive arguing that people should be kinder; he arrived with blood pressure, inflammatory markers, sleep architecture and cognitive decline, on a subject everyone else was treating as a mood. Once it had numbers attached it stopped being something you could be told to get over.", "f": [{"n": "A signal, not a character defect", "d": "Read as a flaw, the first instinct is to say nothing, which seals the only exit. As a signal it carries no shame: it doesn't say something is wrong with you, it says something needs doing.", "eg": "Read as 'something is wrong with me', the message stays unsent. Read as hunger, it gets sent."}, {"n": "Vigilance grows it by itself", "d": "Lonely people read neutral faces as unfriendlier. The reading makes them withdraw, withdrawal thins the relationship, and the thin relationship confirms the reading. Nobody has to have rejected them for the loop to keep turning.", "eg": "He read the unanswered message as being dropped, so he stopped writing first, so the messages thinned, and the thinning proved him right."}, {"n": "The effective intervention is the reading, not the opportunity", "d": "In the meta-analysis, more chances to socialise, more support and better skills all did little. What came first was correcting the automatic conclusions — which is why doing more events changes nothing."}], "q": ["Hungry, you go find food. This is the same kind of reminder.", "Loneliness will read an ordinary face as unfriendly.", "For loneliness, changing the reading beats changing the opportunity."], "apply": "If you feel lonely and embarrassed to say so, separate two things first: am I missing people being present, or people knowing me? Crowds help the first and do nothing for the second. If it's the second, don't add events — catch the automatic sentence ('they must find me tiresome'), write it down, ask what it rests on, and find one chance to test it.", "l": ["Harvard Study of Adult Development", "Robert Sapolsky"], "contrast": [{"n": "Mark Granovetter", "why": "Both are about the shape of a network. Granovetter asks what it brings you; Cacioppo asks what its absence does to you"}]}, {"c": "Family and relationships", "n": "Harvard Study of Adult Development", "e": "1938–present · Harvard Medical School", "w": "Relationships predict the end", "y": 1938, "d": "The longest study of adult life ever run. It began in 1938 with 268 Harvard sophomores, later merged with 456 boys from Boston's poorest neighbourhoods, asking how life was going every two years and running medical exams every five — for most of them, for life, and now into their children. Robert Waldinger, its fourth director, compresses eighty years into one line: what makes people healthy and content late in life is neither wealth nor fame but the quality of their relationships.", "story": "That is not what it set out to measure. In 1938 the question was what kind of young man grows into a healthy, successful adult, and the instruments were physical: build, blood pressure, family background. They measured skull dimensions. Decade by decade those predictors lost their explanatory power, and the one that survived was the thing nobody had planned to record. The sample contains men from excellent circumstances who ended isolated, and men from the tenements surrounded by people all their lives, and it is the second group whose health curves run higher.", "f": [{"n": "A predictor, not a consolation", "d": "It reads like a greeting card and lands on hard measures: satisfaction with close relationships at fifty predicted health at eighty better than cholesterol did. The body settles the bill.", "eg": "It sounds like a card in a gift shop until you see it beat cholesterol at fifty for predicting how eighty goes."}, {"n": "Quality counts, headcount doesn't", "d": "And a long, high-conflict relationship does more damage than separating. What protects is what happens inside it, not whether it is still standing — 'staying for the children' does not balance on this ledger.", "eg": "Two hundred contacts and nobody to call at 2am is not a large network. It is a large list."}, {"n": "The window stays open later than people assume", "d": "The clearest improvements came from people who started in their fifties and sixties: reconnecting with estranged family, turning acquaintances into regular company. Fifty is not too late for eighty.", "eg": "He rang the brother he hadn't spoken to in eleven years at fifty-eight. That call is inside the window, not past it."}], "q": ["Your body at eighty is decided by your relationships at fifty.", "A marriage held together for the children bills both bodies.", "Nobody sets out to lose a friend. They get busy and it goes quiet."], "apply": "If relationships feel like something to handle once this busy stretch is over, count one number: in the last month, how many times did you see someone for no practical reason? If you can't count one, it isn't a 'later' problem. The smallest useful move is one message a week to one person, about nothing in particular.", "l": ["Mark Granovetter", "John Cacioppo", "Arlie Hochschild"], "contrast": [{"n": "John Cacioppo", "why": "The same finding from opposite ends: he measures what the absence costs, the study measures what the presence buys"}, {"n": "Excellent Sheep", "why": "Eighty years of data on what actually matters, against a system that scores none of it"}]}, {"c": "How the world works", "n": "Mark Granovetter", "e": "1973 · American Journal of Sociology", "w": "Weak ties", "y": 1973, "d": "A sociologist whose 1973 paper, The Strength of Weak Ties, has been cited tens of thousands of times. He surveyed 282 people about how they found work and found that among those who got there through a contact, 56% saw that person only occasionally and 28% rarely. The reason isn't willingness but information structure: your circle overlaps almost completely with a close friend's, so what they know you mostly know. From that he draws a harder line — no strong tie is a bridge.", "story": "The finding has a consequence people meet without recognising it. Move to a new city or leave an industry and the close friends survive — those few hold. What disappears is the wide band of people you used to see occasionally, and that is precisely the layer that brings opportunities. So the drought after a move is not imagined and not a comment on you. It is structural, and rebuilding that layer takes time, which is why the first year somewhere new is so often silent.", "f": [{"n": "It isn't willingness, it's whether the news is new", "d": "Close friends want to help more and hold almost the same information you do. A weak tie isn't more generous. He is standing somewhere else, holding the part you can't reach from here.", "eg": "Your five closest friends have already told you every opening they know about. The person you met once at a conference knows the one you haven't heard."}, {"n": "Closure is what strong ties produce", "d": "Close to A and close to B means A and B probably know each other. The circle closes, and once closed the three of you know largely the same things. Closure gives support and trust, and it stops new information arriving.", "eg": "Everyone in the group chat forwarded the same article. That is what a closed circle feels like from inside: agreement, and no new information."}, {"n": "Maintain breadth, not depth", "d": "Rather than pouring everything into a few people, keep more weak ties in the 'still knows who you are' state. The cost is an occasional message with no request attached — and the line has to be kept while you don't need it.", "eg": "One message a year with nothing attached — congratulations on the new job — keeps a line open. Reappearing only when you need something closes it."}], "q": ["Of people who found work through a contact, 56% saw them only occasionally.", "No strong tie is a bridge.", "When you move, the layer that breaks first is the one that brought opportunities."], "apply": "If you're looking for something — work, a partner, customers — and circling the same few people, count how many of the people you contacted in six months are ones you see a few times a year. If almost none, a whole source of opportunity is switched off. Just after a move or a career change, expect this and rebuild deliberately.", "l": ["Harvard Study of Adult Development", "John Cacioppo"], "contrast": [{"n": "John Cacioppo", "why": "Both about the shape of a network: Granovetter on what it brings you, Cacioppo on what its absence does to you"}]}, {"c": "Family and relationships", "n": "Arlie Hochschild", "e": "1983 · UC Berkeley", "w": "Work nobody counts", "y": 1983, "d": "A sociologist who twice gave a name to work that had none. The Managed Heart (1983) named emotional labour: jobs that require not only that you do it right but that you display a prescribed feeling — warmth for a flight attendant, hardness for a debt collector. The Second Shift (1989) named the unpaid shift that starts when the paid one ends, and put a number on it: about 15 hours a week, a year of which is an extra month of 24-hour days. Her whole contribution is making uncounted labour countable.", "story": "Doing fieldwork with Delta flight attendants she kept meeting one phrase in the training material: a sincere smile. The airline was not satisfied with courtesy. It required the smile to be real — which means the employee has to manufacture the feeling internally, and that part of the job has no hours, no pay and no name. She put it beside physical labour: lifting boxes tires you, and so does producing cheerfulness, except the second bill arrives late and usually gets recorded as 'she's changed'.", "f": [{"n": "Work off the timesheet is paid for by whoever does it", "d": "Anything unmeasured gets treated as done in passing. It doesn't disappear for going unrecorded; it becomes one person's invisible load, and that person often has no language to complain in, because on paper nothing happened.", "eg": "Nobody schedules remembering the birthdays, noticing who has gone quiet, smoothing the meeting afterwards. It still takes hours, and the same person does it."}, {"n": "Surface acting and deep acting bill differently", "d": "Putting the face on while knowing you are exhausts through tension. Persuading yourself you mean it exhausts because afterwards you can't find yourself. Both have a cost; they arrive at different times.", "eg": "Smiling through the call knowing you don't mean it leaves you tense. Talking yourself into meaning it leaves you unsure which part was you."}, {"n": "Care time is rigid", "d": "You can write a document faster. You cannot feed a child faster or sit with a sick parent faster. So 'efficiency' barely applies — the work can only be taken over by someone else, or not done, and then someone else pays.", "eg": "You can review the document twice as fast this quarter. You cannot get a two-year-old to sleep twice as fast."}], "q": ["That smile is not 'her' smile.", "The first shift is at work, the second at home. Only one pays.", "Labour nobody books gets billed to one person anyway."], "apply": "When the work at home lands on one person and saying so hasn't changed it, don't start with fairness. Log two weeks: every task, who did it, how long. Most negotiations fail because the two people are looking at different lists. At work, if you got little done and can't face speaking, ask how much of the day went on holding a required feeling — and whether any of that was counted.", "l": ["Thomas Gordon", "Christina Maslach"], "contrast": [{"n": "Christina Maslach", "why": "Two kinds of uncounted work: the required feeling, and the six ways a job and a person fail to match"}]}, {"c": "Body and daily life", "n": "Rat Park", "e": "1978 · Simon Fraser University", "w": "Look at the cage", "y": 1978, "d": "A set of experiments from the late 1970s, plus a natural experiment nobody designed, which together unsettled a piece of common sense about addiction. The standard method put a rat alone in an empty cage with morphine-laced water and watched it drink until it died — a conclusion that looks solid. Bruce Alexander asked a different question: what if the cage weren't empty? In a large enclosure with companions, wheels and tunnels, the same two bottles, the rats were far less interested. The point is not that the drug doesn't matter. It is that the situation has been badly underrated.", "story": "The work was not welcomed. Alexander's papers were turned down by the major journals, funding stopped, and for something like thirty years the study sat outside the mainstream — too hard to replicate cleanly, and pointed at a conclusion the field was not organised around. Its rehabilitation came from somewhere else entirely: the follow-up data on American servicemen returning from Vietnam, where the overwhelming majority of men addicted to heroin abroad simply stopped once home. Same people, same drug, different place.", "f": [{"n": "The cage is a variable, not the background", "d": "The original design treated the cage as scenery and the drug as the only thing that varied. Make the cage vary too and the conclusion moves: same rat, same bottle, very different behaviour.", "eg": "Same person, same phone. Alone in a rented room at eleven at night, and in a house with people in it: the two evenings do not look alike."}, {"n": "The empty space is manufacturing the demand", "d": "The park rats weren't restrained; they didn't much want it. Alexander's word was dislocation — pull someone out of the relationships and position they belong in and they will find something to fill the gap.", "eg": "The drinking started the year he moved cities and knew nobody, and thinned out once there was somewhere to be on Thursdays."}, {"n": "It has a boundary, and it has to be said", "d": "Replications were not uniformly successful and the interpretation is still argued over. Situation is the underrated term, not the only one. Explaining everything with it delays people who need medical care.", "eg": "Telling someone in withdrawal that the cage is the whole problem leaves them holding an explanation and no treatment."}], "q": ["Same rat, same bottle. Different cage, different behaviour.", "Same people, same substance. Home again, and they stopped.", "The trigger is often not craving. It's one recurring empty slot."], "apply": "If you're trying to stop something and every attempt ran on holding out, don't fight the thing. Log the last ten times — hour, place, what else was in your hands, who was there — and look for the recurring empty slot. Withdraw the props one at a time and it gets harder by itself. Then fill the slot, because a vacated one refills the same way.", "l": ["Maria Montessori", "Robert Sapolsky"], "contrast": [{"n": "Maria Montessori", "why": "The same instruction in two fields: change the room before you correct the person in it"}, {"n": "John Cacioppo", "why": "Both describe a gap that gets filled by whatever is nearest — one calls it dislocation, one calls it loneliness"}]}, {"c": "Learning and growth", "n": "Lev Vygotsky", "e": "1934 · Soviet psychologist", "w": "One notch higher", "y": 1934, "d": "A Soviet psychologist who died at thirty-seven and left concepts that shaped the whole of education. The most important is the zone of proximal development: ability has two lines, what you can do alone and what you can do with help, and learning happens in the gap between them. Below it is repetition, above it is discouragement. He also argued that thinking is internalised from social interaction — first you do it with someone, then you can do it yourself.", "story": "His work nearly disappeared. He died of tuberculosis in 1934, and within two years his writing was suppressed in the Soviet Union, where it stayed largely unavailable for two decades. Thought and Language was not published in English until 1962, twenty-eight years after his death. So a body of work contemporary with Piaget's arrived in the West a generation late, into a field that had already settled its questions without it — which is part of why it reads as fresh now.", "f": [{"n": "Look at the second line", "d": "Two children stopping at the same point alone can be far apart: give a hint, and one moves a long way and the other doesn't. Identical current level, completely different zone — and the zone decides what they can learn next.", "eg": "Two candidates fail the same task. One takes a single hint and finishes; the other needs the answer. Same score, different hire."}, {"n": "Teaching runs ahead of development", "d": "Against the orthodoxy of his day, he held that you don't wait for readiness. Appropriate guidance pulls development forward. The pitch is: hard enough to need help, not so hard that help doesn't get it done.", "eg": "Handing him the migration with a review at every step taught more than three more months of tickets he could already do."}, {"n": "Scaffolding goes up in order to come down", "d": "Help that stays becomes dependence and leaves the person at the level where they're held. Whether a piece of help worked isn't whether the task got done — it's whether less support is needed next time.", "eg": "If she still needs you on the call the fourth time, the help isn't working, however well each call goes."}], "q": ["Between what you can do alone and with help lies the zone.", "Teaching should run ahead of development.", "Higher thinking happens between people before it happens inside one."], "apply": "Teaching someone, or teaching yourself, find the position where it can't be done alone and can be done with one hint. That gap is what to practise. And plan the withdrawal when you give the help: first time demonstrate a step, second time prompt the opening, third time nothing.", "l": ["Maria Montessori", "Carol Dweck"], "contrast": [{"n": "Maria Montessori", "why": "Both put the adult in the background, and disagree about when to step in: she waits, he leans in one notch"}]}, {"c": "Family and relationships", "n": "Thomas Gordon", "e": "1962 · Parent Effectiveness Training", "w": "The I-message", "y": 1962, "d": "A student of Carl Rogers who turned humanistic psychology into a course ordinary parents could take. His two central tools predate and are more concrete than most of what came after: the I-message, which states what happened and what it did to you instead of what kind of person you are; and problem ownership, which asks whose trouble this actually is, because the answer changes the method completely.", "story": "He observed that most parents know two moves — win (I decide) or lose (fine, have it your way) — and that both carry a long bill: the first produces compliance or opposition, the second produces someone who doesn't consider anyone else. His third method turns the conflict into a shared problem: name what each side actually needs and find something that meets both. Not a vote and not a compromise, because splitting the difference leaves everyone short. In the child-rearing thinking of 1962 this was close to heresy.", "f": [{"n": "Say the effect, not the character", "d": "Three parts: the specific behaviour, its actual effect on me, how I feel. Nothing in it judges the other person, so there is nothing to defend against. The part most often dropped is the middle one, and it is where the persuasion lives.", "eg": "'You're careless' starts a defence. 'When the numbers arrive after five I redo the deck at night, and I'm worn out' does not."}, {"n": "Work out whose problem it is first", "d": "A child upset about a bad grade owns it, and the move is listening. A child wrecking the room you work in — that's yours, and the move is an I-message. Getting it backwards is the common error, and it lays your anxiety on top of theirs.", "eg": "The teenager miserable about a grade needs listening to. The music through the wall while you work is yours to raise."}, {"n": "No effect you can name may mean no problem", "d": "If you can't say what it actually does to you, this may be a preference rather than a problem. The step doubles as a filter: when you can't fill it in, ask why you're insisting.", "eg": "He couldn't say what the messy desk actually cost him. That was the answer: a preference wearing the clothes of a rule."}], "q": ["Say what this does to me, not what kind of person you are.", "Work out whose problem this is before choosing a method.", "Conflict doesn't have to end with somebody winning."], "apply": "Before raising something, split it into behaviour, effect on me, and how I feel, with no line about what kind of person they are. And before you open your mouth, ask whose problem this is. If it's theirs, listen and say back what you heard; advice at that moment moves them from solving their problem to handling your opinion.", "l": ["Maria Montessori", "Arlie Hochschild"], "contrast": [{"n": "Maria Montessori", "why": "Both ask the adult to hold back. She changes the room; he changes the sentence"}]}, {"c": "Body and daily life", "n": "Marie Curie", "e": "1867–1934 · Warsaw and Paris", "w": "She took his course", "y": 1906, "d": "Physicist and chemist, born in Warsaw, in Paris from 1891, and in 1903 a Nobel laureate in physics alongside her husband Pierre. On 19 April 1906 Pierre was killed by a horse-drawn wagon in a Paris street; the Sorbonne gave her his chair, and on 5 November she gave her first lecture, with no eulogy, picking up where his last one had stopped. She is here because the situation — the person who mattered most is suddenly gone and the days continue — has too few people who have actually lived it.", "story": "1911 was the year both things happened. She was refused admission to the Académie des sciences by a narrow vote, in a campaign that made much of her being a woman and a foreigner; and the press ran a scandal about her private life, with crowds outside her house. In the same year she was awarded a second Nobel Prize, this time in chemistry, and was advised not to come and collect it. She went. The composure that produced the November lecture was not a one-off temperament. It was the same thing, repeatedly.", "f": [{"n": "Catch hold of one thing with an hour and a place", "d": "An enormous blank can't be faced directly. What can be faced has a time, a place and a content. It doesn't solve the grief; it gives the day a shape you can put yourself inside.", "eg": "'Sort out my life' is unfaceable. 'Thursday, nine to ten, the second drawer' is not, and the day now has a shape to stand in."}, {"n": "What can't be said aloud gets written to them", "d": "For more than a year she wrote to Pierre in a notebook nobody saw in her lifetime. Said to the living it becomes a request for comfort; said to yourself it becomes analysis. Only addressed to them does the true thing come out.", "eg": "Written to a friend it becomes a request for comfort. Written to the person who died it stays what it actually is."}, {"n": "Put the skill where it's most needed now", "d": "In the war she left the laboratory, raised money, fitted vehicles with X-ray equipment, learned to drive and repair them, and took them to the front. Those years are academically almost blank, and were not wasted.", "eg": "The year he stopped shipping features and rebuilt the on-call rota is missing from his promotion packet, and it is what the team remembers."}], "q": ["It doesn't solve the grief. It gives the day a shape.", "Who the letter is addressed to decides what you can write.", "Nobody at their worst owes anyone a performance of it."], "apply": "When the most important person has gone and life still has to continue, look for one thing in the next few days that has to be done at a set hour in a set place. If there are things you can't say to anyone, ask who they are actually addressed to, and write them to that person. Don't set yourself a date to be better by.", "l": ["C.S. Lewis", "Winston Churchill"], "contrast": [{"n": "C.S. Lewis", "why": "Two records of the same year: he wrote to find out what grief was, she wrote to keep talking to him"}]}, {"c": "Strategy and competition", "n": "John Boyd", "e": "United States · 1927–1997", "w": "Tempo", "y": 1927, "d": "A US Air Force colonel known as Forty-Second Boyd, from a standing bet: any pilot, he starts from the disadvantaged position, and if he isn't on their tail within forty seconds he pays forty dollars. He is said never to have paid. He never made general and never published a book — his work exists as a briefing — and he reshaped American fighter design and the doctrine of manoeuvre warfare.", "story": "The briefing was the medium. Patterns of Conflict ran to several hours and he refused to give the short version: if you would not sit through the whole thing he would not present it, because the argument was cumulative and a summary would be taken as a technique. So the ideas spread by people who had sat in a room with him for a day, which is why they arrived in doctrine before they arrived in print, and why the version that reached business books is mostly the one he refused to give.", "f": [{"n": "Fast means turning, not moving", "d": "Observe, orient, decide, act. The claim isn't that each step should be quick but that you operate inside the opponent's loop, so what he observes is the world your last move made and every reaction fights a version of you that no longer exists."}, {"n": "The bottleneck is orient", "d": "Observe, decide and act can all be sped up with tools. Fitting new information into an existing frame cannot. The more successful the old frame, the less gets in — organisations do see the change and file it under the old map."}, {"n": "To be somebody, or to do something", "d": "The talk he gave every young officer. One road: go along, get promoted, be somebody. The other: do what should be done. He took the second, stopped at colonel, and the aircraft and the doctrine are full of his work."}], "q": ["Observe, orient, decide, act.", "One road: promotion and medals. The other: doing what should be done.", "Machines don't fight and terrain doesn't fight. People do."], "apply": "If you and a competitor are both accelerating and you're buying tools for every step, ask which step the loop is actually stuck on — usually the one where you saw it and didn't change the frame. Inside an organisation, the lever isn't speed, it's friction: every approval layer is delay, and every ounce of suspicion is paid for in confirmations.", "l": ["Garry Kasparov", "Han Feizi"], "contrast": [{"n": "Han Feizi", "why": "Two theories of an organisation that works: rules and consequences, or shared intent and delegated authority"}]}, {"c": "Mind and feeling", "n": "Winston Churchill", "e": "1874–1965 · Britain", "w": "Ten years out, back at 65", "y": 1929, "d": "Politician and writer. He went out with the government in 1929, lost the Exchequer, and held no office for ten years — the wilderness years. He wrote for a living through them, laid brick at home, and painted. Through the thirties he repeated in Parliament that Germany was rearming and British air strength was not keeping pace, was treated as bellicose and out of date, and read aircraft production figures into the record anyway.", "story": "He was a working bricklayer with a union card. In 1928 he joined the Amalgamated Union of Building Trade Workers — an ex-Chancellor applying for membership as a bricklayer, which caused enough of a row that the union later revoked it. He built walls and a cottage at Chartwell with his own hands and wrote to a friend that he was spending his days laying bricks and writing a book. Two hundred bricks and two thousand words a day. It is the most exact description anyone has given of how to survive being shut out.", "f": [{"n": "When nobody calls, make things that leave your hands", "d": "The hard part of being sidelined isn't the idleness, it's not knowing whether you still count. His answer was daily delivery: a chapter, a stretch of wall, a painting. Output means you don't need an invitation to feel present."}, {"n": "Put it in a form that can be checked", "d": "An emotional judgement can't be verified, so it can't be confirmed either; saying it ten times equals saying it once. Numbers and dates can be ignored today and reconciled later. A checkable sentence has a lifespan."}, {"n": "Being prepared means having it ready", "d": "He became prime minister at sixty-five, an age then considered retirement. Nobody had time to develop anyone; he was called because on that subject he alone had a ready judgement, a ready record, and a line he had not altered in ten years."}], "q": ["Someone with output needn't wait for an invitation to feel present.", "A checkable sentence has a lifespan. A lament doesn't.", "Age is only the problem when your hands are empty."], "apply": "If you've been pushed out of the centre and don't know how long it lasts, fix on one thing you can finish daily, and arrange one task that is physically hard — being sidelined traps people in an argument with absent colleagues, and sweat competes with it. Write your important judgements down with dates. That is your only evidence later.", "l": ["Su Shi", "Pu Songling", "Marie Curie"], "contrast": [{"n": "Pu Songling", "why": "Both spent decades unrecognised. His day came; Pu Songling's never did, and the advice has to work either way"}]}, {"c": "Family and relationships", "n": "C.S. Lewis", "e": "1898–1963 · Oxford", "w": "The notebooks after she died", "y": 1961, "d": "A writer and professor at Oxford and Cambridge, author of Narnia and of many books arguing people into belief. He married at fifty-eight; his wife Joy died of cancer four years later. In the months that followed he recorded his own state in four exercise books and published them under a pseudonym. He is here because the situation — someone who mattered has died — needs someone who was actually in it, not someone reasoning about it from outside.", "story": "He published it as N.W. Clerk, and it sold almost nothing. The pseudonym was not modesty: the most famous Christian apologist in the English-speaking world had written a book in which the arguments he had made for thirty years stop working on him, and he was not prepared to sign it. Friends began recommending it to him, not knowing he had written it. It went out under his own name only after his death.", "f": [{"n": "Name it correctly and you know how to treat it", "d": "He assumed grief was sadness and found it closer to fear — the churn in the stomach, the inability to sit still. Sadness is met by thinking it through, fear by letting the body settle. The wrong name gets you the wrong method."}, {"n": "A belief never tested may not be a belief", "d": "Everything he had argued held in good weather and collapsed at the first real event. He didn't rush to rebuild; people who do generally build the same house out of the same cards. What is still standing afterwards is the actual foundation."}, {"n": "Gripping the memory deforms it", "d": "The harder he tried to remember his wife, the more she warped into someone gentler and more agreeable. Worse than forgetting: replacing her with someone he had made. When he stopped trying, she came back as herself."}], "q": ["Not like sadness. Like fear.", "You don't know how much you believe something until it's life or death.", "The harder he tried to remember her, the more she warped."], "apply": "Just after losing someone, ask whether the feeling is more like sadness or more like fear, and treat it accordingly. Write three lines a day about how the day was — not conclusions. And if you're rehearsing the person daily out of fear of forgetting, check whether the one you're holding has become gentler than the real one.", "l": ["Marie Curie", "John Gottman"], "contrast": [{"n": "Marie Curie", "why": "Two records of the same year: he wrote to find out what grief was, she wrote to keep talking to him"}]}, {"c": "Mind and feeling", "n": "Carl Jung", "e": "1875–1961 · Zurich", "w": "The afternoon has its own programme", "y": 1931, "d": "The founder of analytical psychology, Freud's most valued student and his most famous defector. Parts of what he left are hard to test — the collective unconscious, archetypes, synchronicity — and three of his concepts have been in constant use for a century because they bear directly on how a person lives: a life has a morning and an afternoon with different tasks; what you push down comes back out of other people; and the mask you wear outside can grow in.", "story": "The afternoon was not a theory he read about. After the break with Freud in 1913 he resigned his university post, lost his professional standing and spent roughly six years in what he called a confrontation with the unconscious — recording visions and dialogues in the notebooks that became the Red Book, which he kept private and which was not published until 2009. He was thirty-eight when it started. The stages of life essay comes from someone who had already lost the morning's programme and had to find another.", "f": [{"n": "Stalling at forty is the hour, not a fault", "d": "The morning's task points outward and its standards come from outside. People stall in midlife not because capacity declined but because they are still running the afternoon on the morning's programme. What was great in the morning will be little at evening."}, {"n": "What you push down comes back out of other people", "d": "To become acceptable everyone suppresses something — ambition, laziness, temper, wanting to be seen. It reappears as an inability to tolerate the people who show it. Disproportionate dislike is the signal."}, {"n": "The mask is necessary and it has to come off", "d": "Without it you can't deal with the world. The danger is taking it for yourself, and the test comes when it's removed from outside — retirement, redundancy, children leaving. How badly you panic measures how much grew only on the role."}], "q": ["What was great in the morning will be little at evening.", "When the dislike is out of proportion, it isn't only about them.", "The mask is necessary. The trouble is taking it for yourself."], "apply": "If you're doing well and increasingly can't summon anything, ask whether the effort is still answering the morning's question. If that one is largely answered, adding more won't work. And if there is a type of person you can't think about without anger, write down the exact quality — then ask whether you have it and never let it out.", "l": ["Excellent Sheep", "Zhuangzi"], "contrast": [{"n": "Excellent Sheep", "why": "Both describe a life built to someone else's standard. One catches it at twenty-two, the other at forty"}]}, {"c": "Body and daily life", "n": "Robert Sapolsky", "e": "1994 · Stanford", "w": "Stress is a mismatch", "y": 1994, "d": "A neuroendocrinologist who spent thirty years with a troop of wild baboons in East Africa while studying human stress physiology. His book's title is the whole argument: zebras don't get ulcers, because their stress response runs full for the few minutes a lion is charging and shuts off the moment they've escaped. Ours is identical and gets used on mortgages, managers and unanswered email — a mechanism designed for seconds, left running for decades.", "story": "The baboons made the second half of the argument. In a well-fed troop with few predators, most of the day goes on each other, so their stress hormones track social position rather than physical danger. Low-ranking animals ran chronically elevated cortisol and worse health across the board — and the exceptions were the ones with allies and with some ability to predict when they'd be harassed. That is where the real variable turned out to be: not how hard the pressure is, but whether it can be foreseen and whether you have anyone.", "f": [{"n": "Duration, not intensity", "d": "A week-long sprint damages nobody. Two years of being permanently on call does. The question isn't how tired you've been lately but when the system was last actually switched off."}, {"n": "The bill is charged where you can't see it", "d": "What gets paused under stress is immunity, digestion and tissue repair, and those debts don't show the same day — which is why people misjudge how well they're coping until the symptoms arrive."}, {"n": "Predictability and control beat reducing the load", "d": "At the same pressure, knowing when it's coming and having some say over order and pace cuts the damage sharply. Which moves the intervention from 'reduce stress' to 'add certainty' — usually far cheaper."}], "q": ["Zebras don't get ulcers because the response runs for minutes.", "What makes people ill is the response that won't switch off.", "People adapt to a certain bad. They don't adapt to hanging."], "apply": "If you've been tense a long time with nothing specific wrong, ask when this system was last genuinely off. If you're managing people through something hard, give a firm date rather than a better outcome: people adapt to a certain bad and don't adapt to hanging. And swap 'these five, in this order' for 'these five, you choose the order' — same load, different physiology.", "l": ["John Ratey", "Christina Maslach"], "contrast": [{"n": "John Ratey", "why": "Same system, two handles: Sapolsky on what keeps it switched on, Ratey on how to switch it off today"}]}, {"c": "Learning and growth", "n": "Carol Dweck", "e": "2006 · Stanford", "w": "Ability can grow", "y": 2006, "d": "The Stanford psychologist behind the distinction between fixed and growth mindsets: whether you believe ability is a fixed quantity or something that grows with effort and method. The two beliefs produce different behaviour — if ability is fixed, a challenge you might fail is a threat, because failing proves the quantity; if it grows, failing is information. The idea had enormous reach, and was simplified and overused on the way, which has to be handled separately.", "story": "The correction matters as much as the finding. Over the last decade several large replication studies have measured mindset interventions at a fraction of the effect the popular version implies, close to zero in some populations, with the clearer benefits concentrated among disadvantaged students. Dweck herself has spent years arguing against the version of her own idea that spread, in particular against 'false growth mindset' — schools putting the words on a wall, praising effort that produced nothing, and treating the belief as a substitute for teaching.", "f": [{"n": "Praise the move, not the label", "d": "'You're clever' is a label and labels need protecting. 'You went back through every wrong answer' is a move and can be repeated. The test: can they do this praise again next time?"}, {"n": "The moment of failure decides the direction", "d": "In good weather the two mindsets look identical. The watershed is the instant something fails: one reads 'I can't', the other reads 'that approach can't'. The difference is whether anyone goes looking for the cause."}, {"n": "Mild and real, not a master switch", "d": "Knowing the boundary is what makes it usable. It is worth the cost of one sentence — change how you praise, add the word 'yet' — and it is not worth a training programme. Treat it as a master key and you'll ignore resources, teaching and sleep."}], "q": ["Praise for talent makes people avoid challenge. Praise for process doesn't.", "In a growth mindset failure is information. In a fixed one it's a verdict.", "Replications find the effect far smaller than the book conveyed."], "apply": "Giving feedback, check whether you're praising talent or a specific move, and whether they could do it again. And when someone explains a result as a problem of attitude, ask whether the heavier variables have been checked first. Attitude is the laziest available attribution and the least fair to anyone short of resources.", "l": ["Lev Vygotsky", "Excellent Sheep"], "contrast": [{"n": "Lev Vygotsky", "why": "Both about where learning happens. He locates it in the task's difficulty, she locates it in the reading of failure"}]}, {"c": "Family and relationships", "n": "John Gottman", "e": "1994 · University of Washington", "w": "Four fatal signals", "y": 1994, "d": "A psychologist who recorded thousands of couples in a laboratory, coding expression, tone and heart rate frame by frame, then tracked who divorced. His conclusion doesn't rest on theory: from fifteen minutes of one argument he classified couples with reported accuracy above ninety per cent. What predicts a breakup is not how fiercely people fight but whether four specific signals appear while they do.", "story": "The ninety per cent needs a caveat, and it is the honest part of this entry. Those figures come largely from models fitted to the same data they were then measured on, which inflates accuracy; independent prospective tests have come out lower. What survives the criticism is the direction, not the number: contempt, criticism, defensiveness and stonewalling really do predict worse outcomes, and contempt really is the strongest of the four. Treat it as a set of things to watch for in yourself, not as an instrument.", "f": [{"n": "Criticism and complaint are different things", "d": "A complaint targets behaviour and can be solved. Criticism targets character and can only be defended. Many people think they're raising an issue while every sentence defines the other person — which is how one problem runs for ten years."}, {"n": "Contempt is the strongest single signal", "d": "Eye-rolling, mockery, mimicking their tone. It differs from anger: anger is about the event, contempt says the person is unworthy. It destroys the foundation rather than one conversation."}, {"n": "Repair succeeds on the ordinary days", "d": "Happy couples aren't the ones who don't fight; they're the ones who reach for the brake and have it taken. Whether it gets taken depends on the balance built up beforehand — roughly five positive interactions to one negative in stable relationships."}], "q": ["The strongest single predictor of divorce is contempt.", "Criticism targets the person. A complaint targets the act.", "Happy couples aren't the ones who don't fight. They repair."], "apply": "When the same thing gets fought about and every round escalates, check the last sentence you said: was it about the event or about the person? Any sarcasm? Were you explaining or returning the ball? And notice whether they offered a way out that you didn't take — taking it is harder than offering it, and it is where most of this stalls.", "l": ["Esther Perel", "Harvard Study of Adult Development"], "contrast": [{"n": "Esther Perel", "why": "Two different illnesses: he treats the wound, she treats the emptiness, and the moves point opposite ways"}]}, {"c": "Family and relationships", "n": "Esther Perel", "e": "1958– · Belgium and New York", "w": "Flat isn't broken", "y": 2006, "d": "Thirty years of couples therapy, nine languages, and a caseload across many cultures. She doesn't work on how to argue — Gottman covered that in detail — but on something harder to raise: everything is fine and we feel nothing. Her explanation blames neither party. Intimacy wants closeness, familiarity and predictability; desire wants distance, the unknown, the thing not yet fully held. Both are real needs and they point in opposite directions.", "story": "Her framing came from noticing what was missing in the literature. Couples therapy had a great deal to say about conflict, communication and repair, and almost nothing about desire in a long relationship, which was treated either as a medical question or as a symptom of an unfixed conflict. So the people who arrived saying nothing is wrong and nothing is there had no category to be put in, and were routinely treated for a problem they did not have. Naming it was most of the contribution.", "f": [{"n": "Two needs crowding, not love fading", "d": "Read as love fading, the only moves are blaming yourself or blaming them. Read as crowding, the move is clear: not repairing the love, but making room again for the one that got squeezed out."}, {"n": "A wound and an emptiness need opposite moves", "d": "Rupture has a wound — contempt, betrayal, sustained attack — and mending starts with stopping and apologising. Flatness has none and needs adding to. Get it backwards and it worsens: apologising when you should be adding, booking trips when you should be apologising."}, {"n": "Count presence, not hours", "d": "Together is duration, present is attention. The first stacks up easily and the second can be zero for a week. Fifteen minutes a day facing each other with the phones down changes how it feels; a whole weekend in the same room may not."}], "q": ["Intimacy wants closeness. Desire wants distance. Both are real.", "A wound is mended, an emptiness is filled. Opposite directions.", "Same sofa, separate phones: zero minutes present."], "apply": "If you don't fight and aren't close, check for a wound first: in the last three months, any contempt, old grievances, belittling in front of others? If none, this is emptiness, and repeatedly sitting down to discuss the relationship will talk away the last of the ease. Ask instead when you each last did something separately and came back with something to say.", "l": ["John Gottman", "Harvard Study of Adult Development"], "contrast": [{"n": "John Gottman", "why": "He can tell you whether it will last; she can tell you why it stopped feeling like anything while lasting"}]}, {"c": "Body and daily life", "n": "John Ratey", "e": "2008 · Harvard Medical School", "w": "Move, then think", "y": 2008, "d": "A professor of psychiatry at Harvard Medical School who redefined what exercise is for. The primary return, he argues, is not the body but the brain: physical activity prompts the release of proteins that support neuron growth and connection — fertiliser for the brain — with direct effects on learning, mood regulation and tolerance for stress. Filing exercise under the gym means leaving the cheapest cognitive and emotional medicine unused.", "story": "The case he leads with is a school district outside Chicago. Naperville moved PE to first period and stopped grading on performance — no measuring who ran fastest, only whether each student held their own high heart-rate zone. That cohort went on to results far above their peers on international science and maths assessments. The design detail is the point: removing the comparison is what let unathletic children work hard, and working hard is the whole of the mechanism.", "f": [{"n": "Change the motive from your shape to today", "d": "Aimed at the body, the return arrives months later and runs entirely on willpower. Aimed at attention and mood, it arrives within hours. The second is real and easier to sustain, because the feedback is fast."}, {"n": "Intensity beats duration", "d": "Good news for people with no time: you don't need long sessions, you need the heart rate to actually have gone up. Fifteen real minutes beats an hour of strolling, and the hard thing should be scheduled after."}, {"n": "Anxiety is physical, so start there", "d": "The body is already on standby and talking yourself down barely reaches it. Exercise burns the standby hormones and signals that you already ran. Which is why a walk makes the thing less frightening while changing nothing about it."}], "q": ["Exercise doesn't only shape the body. It shapes the brain.", "Anxiety is heavily physical. Talking yourself down barely reaches it.", "The twentieth pass over a thought produces no new information."], "apply": "When your head won't turn over, ask when you last raised your heart rate, and whether twenty minutes of moving is a better trade than another hour of grinding. When a thought has gone round twenty times, that's the signal to interrupt, not to continue — and moving is the most reliable interruption, because it occupies attention and burns the hormones at once.", "l": ["Robert Sapolsky", "Rat Park"], "contrast": [{"n": "Robert Sapolsky", "why": "Same system, two handles: Sapolsky on what keeps it switched on, Ratey on how to switch it off today"}]}, {"c": "Family and relationships", "n": "Maria Montessori", "e": "1907 · Casa dei Bambini, Rome", "w": "The room, not the discipline", "y": 1907, "d": "One of Italy's first women doctors, who began with children with intellectual disabilities and then applied the same methods to ordinary ones, opening the Casa dei Bambini in a poor district of Rome. Her central finding is that children don't need to be shaped, they need a prepared environment — tools at their scale, the choice in their hands, and the adult stepping back from director to observer. Children thought incapable of concentrating began concentrating for long stretches on their own.", "story": "The room came before the theory. She was given a set of apartment buildings full of unsupervised three- to six-year-olds whose parents worked, and a brief that amounted to keeping them from wrecking the stairwells. There was no curriculum to defend and no institution watching, so she could change the furniture and watch what happened. The method came out of a childcare problem in a slum, not out of a laboratory — which is why every part of it is about what the child can physically reach.", "f": [{"n": "Check whether the environment matches", "d": "A cup out of reach or a tool only an adult can work manufactures dependence and frustration. Change it so the child can finish alone and the behaviour problem often disappears. It holds for adults: plenty of self-discipline problems are environment problems."}, {"n": "Concentration grows, it isn't demanded", "d": "Children concentrate for long stretches on self-chosen work and lose focus quickly on assigned tasks. So the route is attractive choices and no interruption — and the most common interruption is an adult's well-meant attention."}, {"n": "Help me to do it myself", "d": "The boundary of help: the goal is that they can finish alone, not that the task finishes sooner. Taking over saves your time and spends their chance to learn. The right move is neither taking over nor leaving them — it's dropping the difficulty one notch."}], "q": ["A child's work isn't taught in. It happens in a prepared room.", "Help me to do it myself.", "Every unnecessary help is an obstacle to development."], "apply": "When a child repeatedly can't do something and saying it again hasn't helped, ask whether it is physically possible at their height with their grip and these tools, and which single thing in the room could change. When you're about to take over, ask whether it's so they learn or so this ends sooner.", "l": ["Thomas Gordon", "Lev Vygotsky", "Rat Park"], "contrast": [{"n": "Rat Park", "why": "The same instruction in two fields: change the cage before you correct the creature in it"}]}, {"c": "Power and organisation", "n": "Xunzi", "e": "Warring States · 313–238 BC", "w": "Shaped, not born", "y": -313, "d": "Mencius said people are naturally good. Xunzi said people are naturally workable. The word usually rendered as artifice means made on purpose: rites, law, teachers and repeated correction, taking a material that comes out disorderly and putting it into a usable shape. Han Feizi studied under him and the Qin system took its force from here. He is the first thinker in China to treat organisational design as the first question rather than the last.", "story": "At Lanling he was asked about war. Lord Chunshen wanted the clever manoeuvres; Xunzi talked instead about two dull things — keep the weapons new, and make reward and punishment reliable. War in his account is not a contest of spirit but a test of whether ordinary people can be trained into usable instruments. He later served as magistrate of Lanling and applied the same argument to running a county. His student Han Feizi pushed the claim that people are workable to its limit and arrived at law, method and position. Xunzi never went there himself. He believed in training, not in fear alone.", "f": [{"n": "Nature transformed by deliberate effort", "d": "Human nature is bad; what is good in people is deliberate effort. What you are born with is a set of preferences, not a set of virtues. Virtue is manufactured — by rules, by ritual, by being pulled back into line often enough. Expecting employees to be self-motivated is declining to do that job.", "eg": "Benjamin Franklin scoring himself against a table of virtues once a day is the modern version. So is Andy Grove drilling managers with weekly one-to-ones and an output review."}, {"n": "Bluer than the indigo it came from", "d": "The material does not set the ceiling; the process does. A student surpasses the teacher not because he was born with more but because he applies the teacher's method more thoroughly than the teacher did.", "eg": "Han Feizi took the workable-person claim and built a colder system out of it. A process has no moral brake fitted as standard."}, {"n": "Compass and square", "d": "There is no straight line without an instrument. Xunzi says even a sage needs compass and square, which puts an ordinary manager some way further down the list. Having a feel for the standard usually means the standard has not been written down.", "eg": "Shang Yang moving the pole to prove the reward was real turned a promise into something observable. Most stated values never get that far, which is why they stay on the wall."}, {"n": "Small steps accumulate into the visible", "d": "Without piling up small steps you never reach a thousand li. Large change is small change stacked. An organisation waiting for a breakthrough tends to come apart during the wait.", "eg": "Zeng Guofan changing one habit a day in his journal, and Kazuo Inamori breaking craft into actions repeatable every shift, are both this sentence in practice."}], "q": ["Human nature is bad; what is good in people is deliberate effort.", "Blue is taken from the indigo and is bluer than the indigo.", "Without piling up small steps, you never reach a thousand li.", "Mugwort growing in a hemp field stands straight untied."], "apply": "After you hire someone, do not open with self-direction. Write down three things first: what counts as done correctly, who checks it, and what happens when the check fails. A team with all three blank does not have a culture problem. It is still standing in the theory that people are naturally good.", "l": ["Mencius", "Han Feizi", "Wang Yangming", "Andy Grove", "Benjamin Franklin"], "contrast": [{"n": "Mencius", "why": "One holds that people can be taught, the other that people can be shaped. Mencius cultivates; Xunzi processes"}, {"n": "Han Feizi", "why": "The student pushed the teacher's training argument into a theory of control. Xunzi kept the rites; Han Feizi kept only the handles"}]}, {"c": "Power and organisation", "n": "Hannah Arendt", "e": "1906–1975 · Germany to America", "w": "Not thinking", "y": 1963, "d": "Political thinker. In 1961 she went to Jerusalem to sit through a trial expecting a monster, and found a mediocre man: all stock phrases, unable to produce a sentence of his own, repeating that he had followed orders. She gave the thing a name, the banality of evil — done not out of wickedness but because he had never thought about it. Her own life is the other line: arrested in Berlin in 1933, in New York by 1941 at thirty-five with no English and no papers, and famous ten years later. What this page keeps to is the mechanism of not thinking, and her own restart.", "story": "The book cost her friendships she had held for thirty years. In 1963 Gershom Scholem wrote to her that she lacked love for the Jewish people. Her reply was flat: she had never in her life loved any people or any collective — she loved her friends. The attacks ran for years, in print and at dinner tables, and she neither withdrew the argument nor softened the phrase. Whatever else that shows, it is the same claim turned on herself: the judgement was hers to make, and she was not going to hand it over to the room.", "f": [{"n": "Doing what the list says is itself a choice", "d": "Not asking why is not neutral. It hands judgement to whoever wrote the list, which is cheap because you then owe nothing to the outcome, and dangerous because you become the executing mechanism for any list at all. Every step compliant, and the sum a disaster.", "eg": "The more times you say I was told to do it this way, the faster your own judgement shrinks."}, {"n": "Stock phrases are the symptom", "d": "She noticed the man had no language of his own. That is what a ready-made formula does: when there is a sentence available to say, nothing has to be thought. Someone speaking entirely in formulas has usually stopped thinking already.", "eg": "Listen to how you describe your own job. If every phrase is off the shelf, that part has been asleep a while."}, {"n": "Everyone does it is not a reason", "d": "The excuse spreads responsibility across everybody so that each person is left holding a small share. But you did the thing, and your share does not get smaller because the crowd is large.", "eg": "Everyone in the industry does it explains the market. It cannot decide for you whether you are going to do it."}, {"n": "What travels is method, not position", "d": "Arriving in New York her degrees, her circle and her standing were gone; what came with her was how she thought. Her first move was two months in a household learning English rather than looking for work, because language is the precondition for using anything else.", "eg": "Before starting over, sort your assets: what disappears the moment you leave the seat, and what walks out with you."}], "q": ["Not done out of wickedness. Done without ever having thought.", "The crowd is large. Your share of it is not smaller.", "Papers can be taken away. What is in your head cannot."], "apply": "Take one thing you do purely because it is on the list, and write two sentences on why it is set that way. If you cannot write them, that is the finding. Do it once a day for a week; the point is not to change the rule but to keep the part of you that can question it from going to sleep.", "l": ["Han Feizi", "Machiavelli", "Garry Kasparov", "The Analects"], "contrast": [{"n": "Han Feizi", "why": "Han Feizi asks how to build a system that works without relying on goodness; Arendt asks where obedience inside such a system ends up. One writes from the designer's chair, one from the operator's"}, {"n": "Garry Kasparov", "why": "Both answer the tool did my thinking for me. Kasparov puts the human back where the machines disagree; Arendt says handing over judgement is a state in itself, whoever takes it"}]}, {"c": "Power and organisation", "n": "Cao Cao", "e": "Late Han · 155–220", "w": "Ability only", "y": 155, "d": "The novel made him the archetypal villain. The historical record shows the earliest systematic meritocrat in China: three orders seeking talent, each one saying that birth, reputation and conduct would not be examined and ability would. He was also the man who fed his own army by farming rather than seizure, and a poet good enough to be read for his verse alone.", "story": "He had issued an order that no soldier was to trample the standing grain, on pain of death. Then his own horse startled and went through a wheat field. He called the officers together and moved to take his own life; when they stopped him he drew his sword, cut off his hair and said the hair would stand in for the head. The credibility of a rule is built at exactly that moment. It applies to everyone, including the man who wrote it.", "f": [{"n": "Ability only", "d": "Three orders, one core sentence: put forward ability alone, and I will use it. Not birth, not reputation, not an old grudge, not conduct. The result was a density of capable people that neither of his rivals matched.", "eg": "A job posting with eight requirements hires people who pass on all eight. The one capability actually wanted gets squeezed out by the other seven."}, {"n": "The hair in place of the head", "d": "Under a rule, the leader punishing himself matters more than the leader not punishing at all. If the man at the top can break it without cost, nobody below him is ever really following it. He chose a penalty that was visible and survivable, and applied it publicly.", "eg": "The exception granted to the founder is the moment the policy stops being a policy and becomes a suggestion."}, {"n": "Take the legitimacy resource first", "d": "In 196 he was first to receive the fugitive Han emperor at Xu, and governed thereafter in the emperor's name. The move costs little and puts every subsequent action inside an accepted frame, while forcing rivals to argue against the frame rather than against him.", "eg": "Whoever defines the category, the benchmark or the standard gets to have their own choices read as the default and everyone else's as the deviation."}, {"n": "Burn the letters", "d": "After Guandu he found the secret correspondence his own officials had sent to Yuan Shao before the battle. He burned it unread, in public, saying that when Shao was strong he had not been sure of surviving either. Some accounts can be settled and must not be.", "eg": "Investigate one incident to the bottom and assign blame to everyone, and nobody reports the second one."}], "q": ["Put forward ability alone, and I will use it.", "If only blameless men could serve, how did Duke Huan rule?", "The old warhorse in the stable still longs for a thousand li."], "apply": "Take the role you are hiring for and cross out every requirement except one — the single capability the seat genuinely cannot do without. Then look at what you crossed out and ask which of those you were about to reject someone over. If you keep the loosened bar, write the behavioural boundaries down the same week.", "l": ["Liu Bang", "Sun Tzu", "Han Feizi", "Sima Yi", "Guan Zhong"], "contrast": [{"n": "Liu Bang", "why": "Two ways of holding people: Liu Bang gave away money and trust, Cao Cao built rules and screened for ability"}, {"n": "Han Feizi", "why": "The theory and its practitioner. Han Feizi wrote the system down; cutting his hair in place of his head is that system demonstrated on the man at the top"}]}, {"c": "Power and organisation", "n": "Guan Zhong", "e": "Spring and Autumn · 723–645 BC", "w": "Granaries first", "y": -723, "d": "The first statesman in China to think systematically about the relation between the economy and government. He took Qi from an ordinary state to the leading power of its age, and Confucius, who disliked much about him, still said that without Guan Zhong we would be wearing our hair loose and folding our coats to the left. His method is consistent: fix the material floor first, then design along what people already want.", "story": "As young men he and Bao Shuya ran a business together, and Guan Zhong took the larger share of the profit. Bao Shuya did not call him greedy; he said the man's family was poor. Later, with Duke Huan newly on the throne and Guan Zhong on the losing side of the succession, Bao Shuya pressed his case: if you only want to govern Qi, I am enough; if you want to lead the realm, it has to be Guan Zhong. Near the end of his life Guan Zhong said his parents gave him life, and Bao Shuya was the one who knew him.", "f": [{"n": "Make the people rich, then the state is strong", "d": "The way to govern must begin with making the people prosperous. Full granaries, and the people know propriety; sufficient food and clothing, and they know honour and shame. Below a certain material floor, moral instruction is not wrong, it simply does not do anything.", "eg": "A team paid below market holds a values workshop and leaves faster. The identical workshop after the pay correction is a different event entirely."}, {"n": "Put the tax inside the price", "d": "He placed the state monopoly on salt and iron, so revenue arrived through the price of goods people were buying anyway. The treasury filled without anyone experiencing a levy. The collection mechanism matters as much as the rate.", "eg": "A platform taking a percentage of each transaction feels different to sellers from an invoice for the same amount, even when the number is identical."}, {"n": "Choose the frame the contest is fought in", "d": "He gave Duke Huan the slogan of honouring the king and repelling the tribes, which converted an ordinary struggle between states into a contest between order and disorder. Once the frame is accepted, every move inside it reads differently.", "eg": "Whoever names the category is choosing which comparisons the audience will make. That is a cheaper advantage than any product feature."}, {"n": "Design along what people already want", "d": "Government flourishes by following the hearts of the people and fails by going against them. He starts every design from what people hate — toil, poverty, danger — and makes sure the measure does not touch it. He does not reform desire; he digs it a channel.", "eg": "A rule that cuts against a widespread preference is never opposed openly. It is quietly worked around, and the workarounds keep improving."}], "q": ["Full granaries, and the people know propriety.", "The way to govern a state must begin with making people rich.", "One year, plant grain. Ten years, trees. A lifetime, people.", "My parents gave me life. Bao Shuya is the one who knew me."], "apply": "Before the next conversation about culture or mission, check the pay. If someone on the team is worrying about rent, a session on values is not just ineffective, it reads as a substitute for the money. Fix the floor first and hold the same session a month later.", "l": ["The Wealth of Nations", "Fan Li", "Sun Tzu", "Han Feizi"], "contrast": [{"n": "Shang Yang", "why": "Two routes to a strong state: Guan Zhong enriches the people and the state follows, Shang Yang installs the law and the wealth follows"}, {"n": "Zhuge Liang", "why": "Two first ministers serving an ambitious lord. Guan Zhong's man became hegemon; Zhuge Liang's cause never arrived"}]}, {"c": "Power and organisation", "n": "Li Shimin", "e": "Tang · 598–649", "w": "Taking counsel", "y": 598, "d": "The emperor most associated with actually listening, and the author of the Zhenguan period. His paradox is unavoidable: he reached the throne by the least defensible route available, killing his brothers at the Xuanwu Gate and forcing his father's abdication, and then governed by the most defensible one — open channels, light taxes, reduced punishments. He is the proof that where power comes from and how it is used can be two entirely separate questions.", "story": "Wei Zheng had served the rival crown prince and had argued for killing him. After the Xuanwu Gate, Li Shimin did not execute Wei Zheng; he gave him a senior post whose actual work was finding fault with the emperor. One day he was handling a fine sparrowhawk on his arm and saw Wei Zheng coming. He pushed the bird into his sleeve. Wei Zheng pretended to notice nothing and made his report slowly. By the time he left, the bird had suffocated. Taking counsel is not only listening. It is being changed by it.", "f": [{"n": "A man as a mirror", "d": "With bronze as a mirror you straighten your dress; with history as a mirror you see the rise and fall of states; with a man as a mirror you see your own gains and losses. When Wei Zheng died he said he had lost a mirror. Real counsel is not a performance of openness; it is treating the critic as an instrument.", "eg": "He was publicly contradicted many times, went back to his quarters furious, and never moved against the man. He knew what losing him would cost."}, {"n": "Use the enemy's advisers", "d": "Wei Zheng and Yuchi Jingde had both been on the other side. His rule was that talent outranks a record of loyalty and ability outranks origin. The core of the Zhenguan administration was assembled out of people who had opposed him.", "eg": "The person who argued hardest against your plan usually understands its weak points better than anyone who agreed."}, {"n": "The debt from the Xuanwu Gate", "d": "Sima Guang's verdict is that the deed succeeded and the killing of kin remained a stain on his virtue. He carried it for life, and it is part of why he had to keep paying in the quality of his government. A person carrying a moral debt often works harder than one who is clean.", "eg": "Something that cannot be undone can still be the reason the next twenty years are done properly."}, {"n": "Reduce, and keep reducing", "d": "Lighter taxes, less forced labour, fewer punishments. He preferred an empty treasury to an exhausted population, and turned inherited quietism into something active: stop disturbing people, and build the institutions at the same time.", "eg": "Households in the empire went from roughly two million to three point eight million during the reign. That is the least arguable scorecard governance has."}], "q": ["With bronze as a mirror you straighten your dress.", "Water carries the boat, and water can capsize it.", "Listening to all sides makes you clear; one source, dark."], "apply": "Ask whether there is anyone near you whose job is to tell you you are wrong and who pays nothing for doing it. If there is not, you are missing the instrument, not the information. Name the role at the next significant decision and say out loud that arguing the other side will not count against them.", "l": ["Zeng Guofan", "Zhuge Liang", "Liu Bang", "The Comprehensive Mirror", "Xunzi"], "contrast": [{"n": "Zhu Yuanzhang", "why": "Two theories of how an emperor handles talent: Li Shimin kept the critics and got a golden age, Zhu Yuanzhang removed the founders and got a secure throne"}, {"n": "Zeng Guofan", "why": "Two ways to hold up a mirror. Li Shimin kept Wei Zheng in the room; Zeng Guofan used a journal nobody else read"}]}, {"c": "Power and organisation", "n": "Liu Bang", "e": "Han · 256–195 BC", "w": "Using people", "y": -256, "d": "The most famous rise from nothing in Chinese history. He began as a minor local officer in charge of a post station and finished as founding emperor of the Han. He was not the cleverest man in his own camp and not the best soldier in it, and said so out loud at his own victory banquet. His single skill was getting people stronger than himself to work for him, and then letting them decide.", "story": "Two years into the dynasty, in 200 BC, he took three hundred and twenty thousand men north against the Xiongnu in person. He went in fast and got ahead of his own army, and Modu Chanyu closed around him at Baideng with four hundred thousand cavalry. Seven days and seven nights surrounded, with nothing coming in. He got out in the end by bribing Modu's wife. Nothing about it was unlucky. He had taken the methods that beat Xiang Yu and applied them unaltered to an opponent who was not Xiang Yu.", "f": [{"n": "Use a man and trust him", "d": "He handed Han Xin an army of a million knowing perfectly well that Han Xin was the better commander of the two. Trust has a price. Withholding it has a higher one, and the bill arrives later and larger.", "eg": "The specialist you hired either gets to make the call in his own area or he is an expensive way of confirming decisions you had already made."}, {"n": "Scatter it and people gather", "d": "Money, authority, titles, credit: he gave them away and kept little. Xiang Yu, it was said, would hold a seal of office in his hand until the corners were worn round rather than pass it to anyone.", "eg": "A leader who cannot let go of the announcement, the customer relationship and the final signature will keep the people who need none of them."}, {"n": "Take the advice in the room", "d": "In the captured capital his instinct was to enjoy the palace. Zhang Liang told him that a man who wants the empire does not loot it first. He stopped that day, withdrew his troops, and issued the covenant of three clauses instead.", "eg": "The measure of an open leader is not that advice is welcome. It is the interval between hearing it and changing the plan."}, {"n": "Rules short enough to repeat", "d": "A killer dies; wounding and robbery answer for themselves. Three lines replaced the whole Qin code, and the population went over to him almost at once. He understood that confidence in the rules is worth more than goods.", "eg": "The policy nobody can recite is not in force, whatever the handbook says. Three lines on a wall outrank fifty pages in a drawer."}], "q": ["In the tent, settling a victory a thousand miles off, Zhang Liang beats me.", "These three are exceptional men, and I could use them.", "Scatter wealth and people gather. Hoard it and they scatter."], "apply": "The next time you hire, write down two answers before the offer goes out: what is this person better at than me, and which decisions will I take from him rather than give to him? The sharper those two sentences are, the higher the ceiling of the team.", "l": ["Han Xin", "Zhang Liang", "Cao Cao"], "contrast": [{"n": "Xiang Yu", "why": "Both came out of the same collapse. Liu Bang gave things away and won the empire; Xiang Yu held on to everything and won the legend"}, {"n": "Cao Cao", "why": "Two masters of using people, working from opposite ends: Liu Bang through generosity, Cao Cao through system"}]}, {"c": "Power and organisation", "n": "Mencius", "e": "Warring States · 372–289 BC", "w": "Winning the people", "y": -372, "d": "The man who turned Confucius into an operating manual for government. Benevolence in his hands is not a slogan about virtue but the condition on which a regime keeps existing: mishandle the taxes, the conscription and the power to punish, and authority goes hollow well before it falls. He travelled from court to court for decades and was never given office. The clarity cost him a career and produced the sentence every later ruler had to answer.", "story": "King Xuan of Qi had once seen an ox being led past the hall to be killed for a ritual, saw it trembling, and ordered a sheep used instead. His people said he was being cheap. Mencius told him the instinct had been right: he had seen the ox and had not seen the sheep. Then the turn. You extended that feeling to an animal that happened to pass you, and not to the people of your own state, whom you never see
