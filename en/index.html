 at circumstance — rule out the circumstance first"}]}, {"c": "Money and risk", "n": "Jim Simons", "e": "United States · 1938–2024", "w": "A small edge, repeated", "y": 1938, "d": "A mathematician first: a doctorate at twenty-three, teaching at MIT and Harvard, code-breaking for the defence establishment, and the Chern–Simons theory, which is his place in the history of mathematics and has nothing to do with money. He went into investing full time at forty-eight and founded Renaissance Technologies. Its Medallion fund has compounded at roughly sixty-six per cent a year before fees since 1988 and about thirty-nine after them, which is the best record anybody has. His method is the opposite of every traditional investor's: he does not study companies, meet management, or forecast the macro.", "story": "Simons tried fundamental trading early on, made money and then lost badly, and the real turn came when he decided to give up judgement altogether. His hiring rule became famous for being strange: no people from Wall Street, only astronomers, cryptographers, linguists and statisticians — because the Wall Street ones arrive carrying a set of beliefs that have already been falsified. Inside Renaissance every researcher shares one model and one compensation formula; nobody keeps a private strategy or a private position. It is a firm that deleted the concept of the individual hero at the level of its constitution, and its results continued after Simons himself retired.", "f": [{"n": "A small edge, repeated enormously often", "d": "Win about half the time plus a fraction, and do it millions of times. This is the far pole from Buffett, who bets heavily on a handful of near-certainties. What they share matters more than the difference: both refuse to bet in the middle ground. Uncertain and heavy is the usual way to die.", "eg": "A casino's edge is one to five per cent and casinos never lose, because they repeat it endlessly and cap the size of any single bet."}, {"n": "Data matters more than the model", "d": "Renaissance spent more time and money collecting, cleaning and aligning historical data than anyone else, and kept things others threw away: bad prints, cancelled orders, weather records, old newspapers. The reasoning is plain — models are public mathematics, data is a private asset.", "eg": "The modern parallel: nearly every AI company's architecture looks alike, and the gap that opens is the data pipeline."}, {"n": "Don't predict, just recognise", "d": "He never asked whether a company was any good, only how often this price pattern had appeared before and what followed. That gives up causation and keeps correlation. The price is never knowing why you made money; the prize is never being fooled by a story you told yourself."}, {"n": "Size is the enemy of return", "d": "Medallion closed to outside money in 1993, took only employees' capital, held itself near ten billion dollars and forced the profits out. Strategy capacity is finite: more money means your own trading moves the price and eats the edge. Refusing a fee that large is one of the hardest decisions in the industry.", "eg": "The firm's other, open funds are far larger and far more ordinary, which is the proof that the constraint was real."}, {"n": "Take your hands off", "d": "Designing a system is easy; not rescuing it while it is losing money is very hard. During the 1998 collapse of Long-Term Capital, Medallion drew down and Simons considered intervening by hand, then decided not to touch it. That is the true entry barrier to every quantitative method, and it is not mathematical."}], "q": ["Be guided by beauty.", "Work with the smartest people you can find, ideally smarter than you.", "Don't give up easily, and hope for some good luck.", "We do not overrule the model. We improve the model."], "apply": "First work out which kind of fight you are in. If your edge is small but repeatable — sales, ad buying, A/B tests, distribution, interviewing — stop agonising over any single outcome, push the number of repetitions up, and hold a hard ceiling on what one attempt can cost. If your edge is large and the chances are rare — changing jobs, starting a company, marrying, a big investment — invert it: bet seldom, bet heavily, and be willing to hold cash for a long time. The worst outcome is confusing the two: heavy on a small edge is gambling, light on a large one is waste. One more counter-intuitive rule worth keeping: once a method starts earning reliably, the first thing to kill it is usually not a competitor but the scale you added yourself.", "l": ["Warren Buffett", "Nassim Taleb", "Charlie Munger", "Howard Marks", "George Soros"], "contrast": [{"n": "Warren Buffett", "why": "The two poles of investing: Buffett bets heavily on a few near-certainties, Simons bets tiny amounts on millions of near coin-flips — and both refuse the middle ground"}, {"n": "Nassim Taleb", "why": "Two mathematicians on opposite ends of one market: Taleb is paid at the moment models break, Simons is paid all the while they hold"}, {"n": "George Soros", "why": "Soros uses reflexivity to understand the market, Simons gave up understanding entirely — and the money comes out of the same place"}]}, {"c": "Money and risk", "n": "George Soros", "e": "1930– · Budapest and New York", "w": "Reflexivity", "y": 1930, "d": "Founder of the Quantum Fund, and the man who forced the Bank of England to give way, making a billion dollars in a day. His larger contribution is not the money but reflexivity, which overturns the assumption that markets are rational. Participants' expectations move the market, and the market moves their expectations back, and the loop never settles into equilibrium. He is a student of Popper, and the whole method rests on one habit: taking seriously, in advance, that he may be wrong.", "story": "16 September 1992, Black Wednesday. Sterling had been forced into the European exchange rate mechanism at a rate that flattered it, and the British economy was paying for the flattery. Soros judged that the position could not hold, that the government would eventually have to leave, and that sterling would fall hard when it did. He borrowed heavily and sold. The Bank of England bought pounds all day and spent billions failing to hold the line. That afternoon Britain announced its withdrawal, sterling collapsed, and his profit for the day passed a billion dollars. He said afterwards that he had not attacked the pound. He had corrected a false equilibrium.", "f": [{"n": "Reflexivity", "d": "Mainstream economics assumes markets tend towards equilibrium. Soros says that is simply wrong. Expectations shape behaviour, behaviour shapes the market, and the market reshapes expectations. It is a loop that never converges, and the market is not a machine seeking balance but a system being made by the beliefs it is also making.", "eg": "Houses rise, buyers expect more rises, more buyers arrive, prices rise again, speculators pile in, the bubble forms. It runs until something outside it breaks the circuit."}, {"n": "Fallibility as a working method", "d": "I am more aware than anyone that I might be wrong, and he means it operationally: every position is built on the assumption that the assumption behind it could be false. When it turns out false he cuts immediately and does not argue for himself.", "eg": "Before shorting sterling he kept asking where his own case could break — what if the Bank defends the rate at any cost? He sized the bet only after judging those branches survivable."}, {"n": "Boom and bust", "d": "Applied to the macro picture: every large boom contains a trend that participants have misread, the misreading drives the boom, the boom reinforces the misreading, and the gap between belief and reality eventually grows too wide to hold. Naming the current misconception is his core analytical move.", "eg": "2008: the misconception was that house prices only go up. It drove the subprime boom, the boom confirmed the misconception, reality punctured it, and the system went down."}, {"n": "Knowing when you're wrong", "d": "He credits his fortune to recognising his mistakes rather than to being right, and pairs it with the rule that what matters is not whether you are right but how much you make when you are and lose when you are not. The two together are one system.", "eg": "Wrong ten times at a small cost each and right once at ten times over is a winning year, and it is only reachable if your pride has been moved off being right."}, {"n": "The open society", "d": "Fallibility is a political philosophy too. No institution or ideology is perfect, so a society has to stay open enough for error to be found and corrected. A closed society is one that claims it cannot be wrong; an open one accepts that it will be and builds the machinery to fix it."}], "q": ["I'm only rich because I know when I'm wrong.", "Market prices always distort the underlying fundamentals.", "There is no shame in being wrong, only in failing to correct our mistakes.", "Markets can influence the events that they anticipate."], "apply": "On the next decision that matters, write down your core assumption first, then interrogate it one line at a time: under what circumstances would this be falsified? If it is falsified, what is the plan? Fix the falsifying condition and the exit before you commit, and give somebody else the job of holding you to it. The point is to build might be wrong into the decision process rather than admitting it afterwards, when the admission costs the most and convinces you least.", "l": ["Ray Dalio", "Warren Buffett", "Nassim Taleb", "Charlie Munger"], "contrast": [{"n": "Warren Buffett", "why": "Two poles of investment philosophy: Buffett trusts that the market gets there in the end, Soros treats it as permanently wrong"}, {"n": "Nassim Taleb", "why": "Two bets on uncertainty: Soros finds the market's error and pushes on it, Taleb builds a structure that pays when the error finally breaks"}]}, {"c": "Money and risk", "n": "Nassim Taleb", "e": "1960– · Lebanon and New York", "w": "Antifragile", "y": 1960, "d": "Lebanese, an options trader before he was a theorist of risk. He watched the Lebanese civil war, the 1987 crash and the 2008 crisis at close range, and built a whole philosophy of uncertainty out of real extreme events. His central claim: most of the systems we build are fragile, and break the moment something unexpected arrives. What we should be building is antifragile — systems that get stronger out of the unexpected.", "story": "In 2008 Lehman failed and the global financial system shook. Taleb's fund made more than a hundred per cent that year. Not because he predicted the crisis, but because he had held, for years, a large book of tail-risk hedges — contracts that are very cheap and almost never pay out. In ordinary years they lose a little; in a Black Swan year they pay enormously. His barbell reaches its best outcome precisely in the worst state of the world, and it does that not because he is cleverer than anyone else, but because he refuses to assume that bad things will not happen.", "f": [{"n": "The three-way structure", "d": "Fragile is harmed by volatility and prefers calm; robust is unaffected by it; antifragile gains from it and prefers disorder. Most modern institutions are fragile — stable on the surface, collapsing under an extreme event. A muscle is antifragile: use strengthens it and disuse wastes it.", "eg": "Ask it of your own career, your organisation and your finances one at a time. Most people find all three sit in the first column."}, {"n": "The barbell", "d": "Ninety per cent extremely safe, ten per cent extremely risky, and nothing in the middle. The logic is that the middle is the most fragile place to stand in a Black Swan: it holds neither enough safe assets to absorb the shock nor enough risky ones to profit from it.", "eg": "A stable main income plus a small, genuinely wild bet beats a portfolio of moderately risky things that all move together."}, {"n": "Skin in the game", "d": "Advice from someone who bears no consequence is noise. Bankers gamble with client money and keep the bonus, analysts recommend what they do not own, politicians decide what will not touch them. Every one of those opinions should be discounted before you weigh the content.", "eg": "Ask instead what would you do, or what would you have done to your own mother — the heuristic Taleb credits to Gerd Gigerenzer."}, {"n": "What a Black Swan actually is", "d": "The defining feature is not rarity but being outside your model's range — not that it seldom happens, but that you never conceived of it. A pandemic was a Black Swan to public health systems and not to epidemiologists. The label is relative to whoever is holding the model."}, {"n": "The survivorship trap", "d": "We see the survivors and not the dead, so almost every lesson drawn from success is drawn from a sample that excludes failure, and the graveyard is silent. Studying where returning aircraft were hit tells you to armour the places with no holes.", "eg": "Startup literature studies companies that lived. The dead ones, which may have done exactly the same things, never got written up. Ask first how many of the failures did this too."}], "q": ["The opposite of fragile is not robust. It is antifragile.", "Wind extinguishes a candle and energizes fire.", "Don't tell me what you think, tell me what you have in your portfolio.", "Those who don't take risks should never be involved in making decisions."], "apply": "Audit the shape of your income the way you would a portfolio: ninety per cent from a stable main occupation, the cushion, and ten per cent aimed at high-risk, high-return exploration, the right end of the barbell. Both ends present is what lets you survive a surprise, and occasionally profit from one. Then run the same audit on advice: before weighing what somebody recommends, find out what they have staked on it.", "l": ["Tao Te Ching", "Naval Ravikant", "Fan Li", "Sun Tzu", "Ray Dalio"], "contrast": [{"n": "George Soros", "why": "Two strategies for uncertainty: Soros hunts the market's error and acts on it, Taleb builds a structure that does not need to know what the error is"}, {"n": "Ray Dalio", "why": "Two ways of handling what cannot be predicted: Dalio writes principles to hold the line against it, Taleb arranges to be paid by it"}]}, {"c": "Money and risk", "n": "Technological Revolutions", "e": "2002 · Carlota Perez", "w": "The bubble pays for the build", "y": 2002, "d": "Carlota Perez uses two hundred years and five technological revolutions to argue something counter-intuitive: the financial bubble is not an accident of a technological revolution, it is its financing mechanism. From the industrial revolution of 1771 to the information revolution that began in 1971, every one runs the same road — technological eruption, financial frenzy, crash, institutional rebuilding, and only then the golden age. The book is quoted constantly as a positioning tool among investors and answers a question almost nothing else on this site answers: what time is it now?", "story": "Britain went mad for railways in the 1840s. Hundreds of railway companies listed, newspapers ran pages of prospectuses, and clergymen and housewives bought railway shares. The bubble burst in 1847, most investors were wiped out and most companies were wound up. But the track was laid — the shareholders went under and Britain's transport skeleton for the next century remained. A hundred and fifty years later the script ran again: telecom companies burned hundreds of billions laying fibre in the late 1990s, the crash came in 2001, Global Crossing and WorldCom went to zero, and by most estimates only a low single-digit percentage of that fibre was ever lit. The fibre did not disappear. It became the physical base of twenty years of internet, cloud and streaming, and the people who inherited it paid almost nothing. Hence her cold conclusion: money spent in a bubble is wasted financially and necessary at the level of a civilisation — a collective tuition fee for building new infrastructure very fast, paid by the first group and enjoyed by the second.", "f": [{"n": "Five waves, one rhythm", "d": "1771 the industrial revolution, 1829 steam and railways, 1875 steel and heavy engineering, 1908 oil, cars and mass production, 1971 information and telecommunications. Fifty to sixty years each, and each split into installation, led by financial capital chasing asset prices, and deployment, led by production capital chasing real output, with a crash in between.", "eg": "Which half you are standing in decides which playbook works. Installation rewards betting and expansion, deployment rewards efficiency and consolidation. Wrong half, and effort is a headwind."}, {"n": "The bubble is how infrastructure gets financed", "d": "Rational capital will not lay track, pull fibre or build data centres before the demand exists. Only irrational enthusiasm raises that money. Afterwards the assets change hands cheaply to people who will actually use them, and the first investors carry the cost. So is this a bubble is a low-value question.", "eg": "What did the burnt money settle into is the high-value one. Fibre and data centres leave reusable assets; pure customer-acquisition subsidy leaves nothing to inherit."}, {"n": "The turning point", "d": "Between the crash and the golden age lies a stretch in which institutions and regulation have to be rewritten, because the technology has outrun the rules. It is the most painful phase and the most decisive one. Technology does not deliver good times automatically; there is an institutional fight in the way."}, {"n": "Financial and production capital, split and rejoined", "d": "During installation money circulates away from the real economy and valuation detaches from output. The crash drags the two back together. In deployment, capital serves production again. Asking who is currently in charge is more useful than asking whether valuations are high: the level is the effect, the leadership is the cause."}, {"n": "The techno-economic paradigm", "d": "What a revolution really delivers is not a few inventions but a new common sense about what is now so cheap you can use it freely and what is now the obvious way to do things. Cheap oil produced not just cars but suburbs, supermarkets, disposable packaging and global supply chains.", "eg": "The cheap-computation paradigm has barely begun. The real change will appear where nobody has ever done it that way because it used to be too expensive."}], "q": ["Every technological revolution has an installation period and a deployment period.", "The frenzy builds infrastructure that rational capital would never have funded.", "Golden ages begin after the crash, on infrastructure the frenzy paid for.", "The crisis is not the end. It is the turning point."], "apply": "Stop asking whether this is a bubble and ask three more useful questions. First, which half are we in — is money chasing assets or chasing output? Second, what reusable thing is this round of burnt money settling into: computation, model capability, density of talent, or nothing but customer-acquisition subsidy? Third, if it all crashed tomorrow, whose assets would I want to pick up? Remember that the winners of installation and the winners of deployment are rarely the same people. The first group proves the thing is possible and mostly dies; the second buys the estate at a tenth of the price.", "l": ["Ray Dalio", "Nassim Taleb", "The Innovator's Dilemma", "Thinking in Systems", "Peter Thiel"], "contrast": [{"n": "The Innovator's Dilemma", "why": "Christensen watches one firm get disrupted, Perez watches a whole society absorb the disruption — the same event under a microscope and a wide lens"}, {"n": "Ray Dalio", "why": "Two clocks: Dalio times the debt cycle on the financial side, Perez the technology cycle on the production side. Overlay them to know the hour"}, {"n": "Sapiens", "why": "Harari explains why people come to believe shared fictions, Perez shows that belief turning into actual rail and fibre"}]}, {"c": "Learning and growth", "n": "Anders Ericsson", "e": "1993 · the violin study", "w": "Method over hours", "y": 1993, "d": "A psychologist who spent a career on how the best in any field actually got there. His best-known research reached the public as the ten-thousand-hour rule, which is the one thing he then spent the rest of his life denying. What decides the level is not the hours but what happens inside them: work at the edge of what you cannot yet do, with a specific goal and feedback fast enough to use. He called it deliberate practice. Repeating what you can already do is rest with better posture.", "story": "Before the violinists there was a college student the papers call SF. Ericsson and William Chase sat him down several times a week and read him digits to repeat back. He started where everybody starts, at about seven. He was a distance runner, and began hearing strings of numbers as running times, so that 3492 became a near-record mile. Two years and a couple of hundred hours later he could hold eighty-two digits. His memory for letters stayed exactly average. Nothing general had improved. He had built one structure, and it fitted one thing.", "f": [{"n": "Practising what you can do is rest", "d": "Fluency is pleasant and it is the feeling of not improving. Progress happens in the region where you keep failing, which looks inefficient from outside and is the only part that changes what you are capable of.", "eg": "An hour of familiar pieces is an hour of enjoying yourself. What needed the hour was the passage you keep getting wrong."}, {"n": "Feedback outranks hours", "d": "Repetition without correction does not teach. It makes the wrong version automatic. Thirty years of driving produces a driver of exactly the same standard, because nobody has ever told him which turn was bad.", "eg": "If nobody will say which paragraph they stopped reading, build the feedback yourself: put it away a week, then read it as a stranger."}, {"n": "Experts hold models, not memories", "d": "What a specialist owns is a mental representation of the field, built by failing against real problems. A chess player sees a position rather than pieces. Watching and memorising do not construct one.", "eg": "Ten games played and gone back through afterwards teach more than a hundred watched."}, {"n": "Ten thousand hours was never the finding", "d": "The number was an average for one group in one field, and half that group had not reached it. He objected to it for the rest of his life, because it converts a demanding result into permission to simply wait.", "eg": "Ten years in the job is not ten years of experience. It is often one year, repeated, under a longer title."}], "q": ["Purposeful practice means working just past what you can do.", "Feedback ranks above hours. Without it, repetition teaches nothing.", "What an expert owns is a model of the field, not a memory."], "apply": "Split your last practice hour in two: the part you could already do, and the part you kept failing at. If the second part is small, that is your answer. Then find out what is going to tell you which attempts were wrong. If nothing is, build that before you add another hour.", "l": ["Bruce Lee", "Carol Dweck", "Lev Vygotsky", "Miyamoto Musashi"], "contrast": [{"n": "Bruce Lee", "why": "Both refuse to count repetitions: Lee practises one kick ten thousand times, Ericsson says those ten thousand only count if something corrects them"}, {"n": "Carol Dweck", "why": "She works on how a failure gets read, he works on whether the task was hard enough to produce one"}]}, {"c": "Learning and growth", "n": "Richard Feynman", "e": "1918–1988 · United States", "w": "Do not fool yourself", "y": 1918, "d": "Nobel physicist, Manhattan Project, and the member of the Challenger commission who insisted his own dissenting appendix be printed with the report. What he left people outside physics is larger than what he left inside it: a set of tests for whether you actually understand something. The standard is close to rude. If you cannot get a first-year student to follow it, you have not got it. He held science itself to the same line: the first principle is not to fool yourself, and you are the easiest person available to fool.", "story": "He taught for a year in Rio and found students who could recite everything and use none of it. In a lecture he read out a definition of triboluminescence, the light emitted when crystals are crushed, and the room recognised it instantly. Then he asked why, when you crush a lump of sugar in the dark, you see a flash. Nobody connected the two. At the end of the year he told the assembled faculty and the education ministry that no science was being taught in Brazil at all.", "f": [{"n": "If you cannot teach it, you have not got it", "d": "A technical term compresses. Forbid it and you have to unpack the idea yourself, and the places you cannot unpack are the places you were storing a label. It is the cheapest accurate self-test there is.", "eg": "Describe your work to a relative. Each time you retreat into the trade word, mark it. That list is your real syllabus."}, {"n": "The easiest person to fool is you", "d": "Fooling yourself takes no bad faith, only a stake in the answer. When you want a conclusion, evidence for it becomes strangely easy to find. So honesty here is a method requirement rather than a moral one.", "eg": "Before the review, write the case against your own proposal first. Written second, that column always comes out shorter."}, {"n": "Reality before public relations", "d": "Challenger was not an engineering shortfall. It was an organisation that preferred a good-looking argument to a cold seal. Wherever people report upward, the same substitution is on offer every week.", "eg": "When the numbers disappoint, notice whether you are changing the judgement or the sentence. The sentence gets you through this meeting only."}, {"n": "Derive it once instead of remembering it ten times", "d": "His way of learning was to throw the result away and rebuild it, going back whenever he got stuck. Slow, and what comes out transfers. A remembered answer serves only the question it came from.", "eg": "Rather than learn the conditions under which a formula holds, reconstruct once where it came from. The conditions then explain themselves."}], "q": ["After you've not fooled yourself, it's easy not to fool other scientists.", "Nature cannot be fooled.", "Knowing the name of a thing is not knowing the thing."], "apply": "Take one thing you believe you understand and explain it aloud to somebody outside your field, using no terms of art. Mark every place you stall; that list is what you have to go back to. And before any judgement where you gain if it goes your way, write the case against it first.", "l": ["Albert Einstein", "Socrates", "Charlie Munger", "Karl Popper"], "contrast": [{"n": "Albert Einstein", "why": "Two physicists' habits: Einstein restated the problem until it turned simple, Feynman rebuilt the answer until it was his"}, {"n": "Socrates", "why": "Both use questions to force ignorance into the open. Socrates aims them at other people, Feynman at himself"}]}, {"c": "Learning and growth", "n": "Karl Popper", "e": "1902–1994 · Vienna and London", "w": "It has to be refutable", "y": 1902, "d": "A philosopher of science whose opening question was ordinary and whose answer changed the subject. Astrology explains events and so does physics, so what separates them? Not explanatory power. A theory that no observation could contradict is not strong, it is empty. The test carries straight over into everyday judgement: a claim that fits every outcome has told you nothing about any of them.", "story": "In 1919, before any of the philosophy, he was volunteering in Vienna's child guidance clinics. He brought Alfred Adler a case that did not look to him like an Adlerian one, and Adler explained it in terms of inferiority feelings without difficulty, and without having seen the child. Popper, uneasy, asked how he could be so certain. Because of my thousandfold experience, Adler said. Popper could not stop himself: and with this new case, I suppose, your experience has become thousand-and-one-fold. What struck him was not that Adler was wrong. It was that nothing could have counted against him.", "f": [{"n": "Explaining everything explains nothing", "d": "If any result at all can be absorbed by a theory, the theory carries no information. The way to check is to ask what observation would make its holder abandon it. No answer means no test, and no test means no reason to lean on it.", "eg": "Sentiment drove the rise. And the fall? Sentiment again. It accounts for every outcome and therefore accounts for none."}, {"n": "Write the refuting condition before the result", "d": "People are remarkably able to read any outcome as support. The only defence is to fix the criterion in advance. Standards set afterwards give you a position that cannot lose, and therefore cannot teach.", "eg": "Before shipping, write down the number that would mean the assumption was wrong, and the date on which you will go and look at it."}, {"n": "Refuted is not the same as discarded", "d": "The usual misreading is that a theory shown wrong is finished. His demand was the opposite: that it be exposed to serious attempts to break it. Good ideas mostly get stronger by surviving those attempts.", "eg": "Once a quarter, go looking for the strongest evidence against your main position. Failing to find it is the only real endorsement."}, {"n": "Collect counter-examples, not confirmations", "d": "The default is to gather cases that agree, and the hundredth one adds close to nothing. A single case that disagrees is decisive. So the productive hour goes on finding the exception, not extending the list.", "eg": "To find out whether people like the product, do not survey the people still using it. Talk to three who left."}], "q": ["We cannot prove a theory true. We can only fail to refute it.", "A claim that fits every outcome has told you nothing.", "One counter-example outweighs a hundred supporting cases."], "apply": "Next time somebody hands you a confident claim, ask what would have to happen for it to be wrong. If nothing would, treat it as a story rather than a finding. And before your own next bet, write down the condition that would make you drop it, with a date attached.", "l": ["Richard Feynman", "Albert Einstein", "Socrates", "Thinking, Fast and Slow"], "contrast": [{"n": "Richard Feynman", "why": "The same rule from two sides: Popper gives the logical criterion, Feynman the psychological warning about who breaks it first"}, {"n": "Thinking, Fast and Slow", "why": "Popper says what a careful mind should do; Kahneman measures how far an ordinary one departs from it"}]}, {"c": "Learning and growth", "n": "Socrates", "e": "Athens · 470–399 BC", "w": "Knowing you do not know", "y": -470, "d": "He wrote nothing. Everything we have comes through other people's dialogues. He charged no fees, which made him the poorest professional philosopher in Athens, and spent his days in the marketplace asking questions. The city executed him for corrupting the young and impiety, which in practice meant that his questions embarrassed people who could not afford to be embarrassed. His pupils arranged an escape and he refused it.", "story": "Crito came to the prison before dawn with everything arranged: guards paid, a ship waiting, a household abroad ready to take him. Socrates would not argue about whether the verdict had been just. He asked instead whether a private citizen may set aside a judgement he dislikes, and what a city would be if everybody did. Crito had to agree that it could not stand. Then leaving, Socrates said, would teach exactly that, and would do Athens more harm than anything he stood accused of. He stayed, and drank the hemlock.", "f": [{"n": "Not knowing, and not pretending to know", "d": "The line on the posters says he knew nothing. What he actually claims is smaller and far more usable: about the things he does not know, he does not suppose that he knows them. That gap is the whole advantage.", "eg": "Say I have not checked that, and people bring you answers. Say I know, and people bring you agreement, which contains no information."}, {"n": "Being good at one thing makes you sure about everything", "d": "He found the craftsmen genuinely skilled and, because of that skill, convinced they understood the largest questions too. A validated record in one domain is the hardest thing to leave at the door of another.", "eg": "The strongest technical judgement in the room decides the pricing as well, at the same volume, on none of the evidence."}, {"n": "He questioned rather than answered", "d": "He compared himself to a midwife: unable to give birth to anything himself, only to help others deliver. A conclusion somebody reaches under questioning gets defended by them. One handed over gets dropped at the first objection.", "eg": "Show him the flaw and one line changes. Ask until he finds it and the same flaw gets fixed everywhere else in the document."}, {"n": "The examined life had a price and he paid it", "d": "Offered silence or exile instead of death, he took death, on the ground that leaving would teach the city that inconvenient judgements may be ignored. Consistency between what he said and what he did cost him everything it could cost.", "eg": "Any rule you announce and then quietly exempt yourself from is not a rule. It is a preference with a press office."}], "q": ["The unexamined life is not worth living.", "Wisdom begins in not pretending to know what you do not.", "An answer handed over gets dropped. One delivered gets defended."], "apply": "Next time you are certain, run the three questions: what is this judgement resting on, under what conditions would it fail, and what have I not looked at? Run them especially when the conclusion suits you. Either the certainty gets firmer or a hole opens, and both are worth ten minutes.", "l": ["Wang Yangming", "Tao Te Ching", "Charlie Munger", "Ray Dalio"], "contrast": [{"n": "Wang Yangming", "why": "Two thousand years apart and the same move: Socrates delivers what is already in you, Wang Yangming says the knowing was there all along and only obscured"}, {"n": "Machiavelli", "why": "The two ends of philosophy: one died for a principle, the other wrote the manual for staying alive inside power"}]}, {"c": "Learning and growth", "n": "Thinking, Fast and Slow", "e": "2011 · Daniel Kahneman", "w": "Fast mind, slow mind", "y": 2011, "d": "Daniel Kahneman's summary of forty years of work with Amos Tversky, and the founding text of behavioural economics. He is the only psychologist to have won the Nobel in economics, in 2002. The frame everybody took from it: a fast, automatic, associative mind and a slow, effortful, reluctant one. The frame he warned about in the same book: they are fictitious characters, not parts of the brain, and naming which one is speaking does not stop it speaking.", "story": "Teaching flight instructors in the Israeli Air Force, he said that praise works better than punishment. A senior instructor objected from experience: praise a cadet for a clean manoeuvre and the next one is worse, shout at a bad one and the next is better. Kahneman saw that the man had been watching regression to the mean and reading it as cause. An unusually good or bad flight is partly luck, and luck does not repeat. He called it the most important insight of his life: the mind will not leave a fluctuation alone without attaching a reason to it.", "f": [{"n": "Two systems, and one of them is lazy", "d": "The fast system answers almost everything and rarely reports difficulty. The slow one is expensive and avoids being started. The failure is not that the fast one errs. It is that the slow one signs off instead of checking.", "eg": "A bat and ball cost a dollar ten, and the bat costs a dollar more than the ball. Almost everybody says ten cents. It is five."}, {"n": "Losses weigh about twice as much", "d": "Losing a hundred hurts roughly as much as winning two hundred pleases. It explains holding losers and selling winners, why you will lose this beats you could gain that, and why any reform meets more anger than gratitude.", "eg": "The people who lose from a change turn up to say so. The people who gain are busy, and mostly do not know yet that they gained."}, {"n": "Anchoring, and where the first number came from", "d": "A number that arrives first shapes everything after it, even when it is plainly irrelevant. Opening offers, list prices before a discount, the tone set at the start of a review: one mechanism, used on purpose.", "eg": "Ask what you would have estimated if you had never heard their figure. The distance between the two answers is the anchor."}, {"n": "The premortem", "d": "Plans get built from the inside, where this project is special, and ignore the base rate of comparable ones. The fix is to gather everybody before starting, assume it has already failed a year from now, and have each person write down why.", "eg": "His own textbook team estimated two years. Comparable projects ran seven to ten, with heavy attrition. It took eight."}], "q": ["We can be blind to the obvious, and we are also blind to our blindness.", "Nothing in life is as important as you think it is, while you are thinking about it.", "The mind will not leave a fluctuation without a cause attached."], "apply": "Put three gates in front of any decision that matters. Sleep on it, so the fast answer loses its heat. Run a premortem: it is a year later and this failed, so write down why. And look up how comparable attempts actually went before you explain why yours is different.", "l": ["Influence", "Charlie Munger", "Nassim Taleb", "George Soros"], "contrast": [{"n": "Influence", "why": "Two sides of one thing: Cialdini shows how the gaps get used on you, Kahneman shows why the gaps are there"}, {"n": "Sun Tzu", "why": "Reckoning in the temple is a forced start-up of the slow system: settle the count before deciding whether to fight at all"}]}, {"c": "How the world works", "n": "Sapiens", "e": "2011 · Yuval Noah Harari", "w": "Fictions", "y": 2011, "d": "An Israeli historian's account of sixty thousand years, with an argument short enough to hold in one hand. Sapiens run the planet not because we are the strongest or the cleverest animal, but because we are the only one that can believe in things that are not there. Money, nations, laws, gods, limited companies: all of them are shared fictions, and shared fictions are what let millions of strangers act as one. The same book then turns the agricultural revolution inside out and argues that the species won while almost everyone in it lost.", "story": "He sets two documents side by side. The Code of Hammurabi, from about 1776 BC, states that people fall into superiors, commoners and slaves, and that the gods arranged it that way. The American Declaration of Independence, from 1776 AD, states that all men are created equal. Both claim to be describing reality. Both claim to hold everywhere and forever. Both are, in his terms, imagined orders held up by belief rather than by anything you could measure. That comparison is the whole book in one page, and it cuts in both directions.", "f": [{"n": "Fiction is the cooperation technology", "d": "Chimpanzees can coordinate a few dozen individuals, because coordination beyond that needs personal acquaintance. A shared story removes the acquaintance requirement. Two strangers who accept the same currency, the same law or the same brand can transact without ever meeting, and that is the only reason a million-person organisation is possible at all.", "eg": "A national border is a line nobody can see, enforced because enough people on both sides agree it is there."}, {"n": "An imagined order is not a lie", "d": "Harari is careful about this. A lie is something the teller knows to be false. An imagined order is believed by everyone inside it, including the people it disadvantages, which is exactly why it holds. Calling it fiction says nothing about whether it is good, only about where it lives.", "eg": "Human rights cannot be found in a body or a rock. They still stop wars, because enough people act as though they were physical facts."}, {"n": "The farmer worked more and ate worse", "d": "The standard story has farming as progress. Harari counts differently: longer hours, a narrower diet, new diseases, and a life more exposed to one bad harvest. What grew was the number of people, not the quality of any one life. He calls it history's biggest fraud.", "eg": "Wheat covers more of the earth than any forager could have imagined. Judged by copies of DNA it is the winner of the story."}, {"n": "Capability rose; contentment did not follow", "d": "The last section of the book asks the awkward question. Modern people have more than any ancestor and are not reliably happier. If every measure of capability is up and subjective wellbeing is flat, then capability was never the thing being measured.", "eg": "Ask what the last decade of improvements actually changed in an ordinary day of yours. Some of them did nothing at all."}], "q": ["Sapiens rule because we are the animal that can believe what is not there.", "An imagined order is not a lie. Everyone inside it believes it.", "The species won. Almost every individual in it lost."], "apply": "Take one rule at work you have never questioned and ask where it actually lives. If it exists only because enough people act as though it does, then it is maintained by belief, and the question stops being is it right and becomes what keeps it believed. That is a question you can act on.", "l": ["The Sovereign Individual", "Tao Te Ching", "Sun Tzu", "The Comprehensive Mirror", "Nassim Taleb"], "contrast": [{"n": "The Sovereign Individual", "why": "Two directions on the same story: Harari on how the system shapes the person, Davidson and Rees-Mogg on how the person gets out from under it"}, {"n": "Influence", "why": "Both explain why people are not rational: Harari from the species and its stories, Cialdini from the levers inside one head"}]}, {"c": "How the world works", "n": "The Sovereign Individual", "e": "1997 · Davidson and Rees-Mogg", "w": "Exit", "y": 1997, "d": "Published in 1997, eleven years before the Bitcoin paper. Two British authors explain the whole of human history with one variable: the cost of using force and the cost of defending against it. Change that cost and every institution built on top of it has to be rebuilt. Running the model forward, they predicted encrypted money, work detached from place, and governments having to compete for the people they tax. Some of it landed early and exactly; the timetable did not.", "story": "In 1997 they described the money of the coming age: it would consist of encrypted sequences of multi-hundred-digit prime numbers; unique, anonymous and verifiable; divisible into the tiniest fraction of value; tradable at a keystroke in a global market beyond exchange controls. There was no such thing. There was barely a web. Eleven years later a nine-page paper produced almost exactly that object, and the description written before it existed still reads as a specification for it.", "f": [{"n": "Megapolitics: force has a price and history follows it", "d": "Their term for the underlying layer is megapolitics. Armour and castles made defence cheap relative to attack, and power fragmented into feudalism. Gunpowder reversed that, and power consolidated into nation-states large enough to fund artillery. Ideology arrives afterwards to explain whatever the cost structure already decided.", "eg": "Feudal loyalty and national patriotism are each the story told about the cheapest available protection of their day."}, {"n": "Position assets versus portable assets", "d": "The most valuable industrial-age assets were positional: land, plant, licences. All of them sit still and can be taxed or taken. The most valuable information-age assets are portable: specific knowledge, reputation, a network. They live in a head and travel with it, which changes who has to negotiate with whom.", "eg": "Ask of anything you own: if somebody seized it, how much of its value would survive the seizure?"}, {"n": "Exit beats voice", "d": "The book's practical core is not rebellion, it is departure. When leaving is cheap you no longer have to win an argument for conditions to improve, because the option itself applies the pressure. That is why the authors spend so much of the book on portability rather than on politics.", "eg": "The colleague with a public body of work never has to raise his voice in a salary review. His alternatives speak for him."}, {"n": "What they got wrong is instructive", "d": "The nation-state did not dissolve on schedule. Identity, welfare, safety and belonging are needs that will not fit in a suitcase, and they anchor most people regardless of what the tax arithmetic says. The model was not wrong about direction; it was wrong about how much of life runs on cost.", "eg": "Remote work arrived on time. The predicted stampede out of high-tax countries mostly did not."}], "q": ["The state keeps its taxpayers in a field to be milked.", "Money made of encrypted primes, tradable at a keystroke. Written in 1997.", "The sharpest divide of the information age is mobile against immobile."], "apply": "Run one honest audit of your own portfolio of assets. Sort what you have into things that stay where they are put and things that travel with you, and write down the rough share of your income that depends on each. If nearly all of it sits in the first pile, you have no exit option, and every negotiation you enter for the next ten years will be conducted from that position.", "l": ["Naval Ravikant", "Peter Thiel", "Nassim Taleb", "Tao Te Ching", "Fan Li"], "contrast": [{"n": "Tao Te Ching", "why": "Two thousand years apart and the same instinct: retire when the work is done, and know what is enough. The oldest sovereign individual is Laozi"}, {"n": "Sapiens", "why": "Harari asks how the system got its grip; this book asks what it would take to slip it"}]}, {"c": "How the world works", "n": "Thinking in Systems", "e": "2008 · Donella Meadows", "w": "Leverage", "y": 2008, "d": "A book about why good people with good intentions produce bad results. Meadows was a lead author of The Limits to Growth and one of the clearest writers systems thinking has had. She drafted this in 1993, died in 2001, and colleagues published it in 2008. Her central claim is that a system's behaviour comes from its structure rather than from anyone's intent: replace every person, leave the structure alone, and the bad result returns on schedule. That is why so much accountability produces so little change.", "story": "She used to open a talk by holding a Slinky. One hand cups it from below, the other holds the top; take the lower hand away and the spring drops, bounces and oscillates. Then she asks what made it bounce. Not the hand: the hand only let go. The behaviour was latent in the spring the whole time, and the hand merely released it. Every diagnosis in the book runs on that distinction, and most organisational post-mortems get it exactly backwards by investigating the hand.", "f": [{"n": "Stocks, flows and delay", "d": "A stock is whatever accumulates: cash, users, trust, inventory. Flows are the rates in and out. Intuition watches the stock while behaviour is set by the flows and by how long the system takes to respond. Delay is what makes you add more, overshoot, then correct too hard.", "eg": "Headcount is a stock; hiring rate is a flow; the three to six months before a new person is productive is the delay. Ignore it and you will overhire."}, {"n": "Two kinds of loop, and only two", "d": "Reinforcing loops widen any deviation: compound interest, word of mouth, arms races. Balancing loops pull the system back to a target: body temperature, restocking, competition. Sustained growth always has a reinforcing loop behind it, and growth that stops always has a balancing loop that has begun to bite.", "eg": "When a growth curve flattens, look for the balancing loop that just engaged rather than for the effort that supposedly stopped."}, {"n": "The system traps have names", "d": "Meadows catalogues the failure structures that keep recurring: policy resistance, the tragedy of the commons, drift to low performance, escalation, shifting the burden to the intervenor, rule beating, seeking the wrong goal. None of them requires a villain. Each is generated by the arrangement itself.", "eg": "Drift to low performance is the quiet one: this quarter missed, so next quarter's target comes down a little. Every single step is reasonable."}, {"n": "Bounded rationality", "d": "Everyone in a system optimises inside the information they can actually see, and the sum of those local optima is often the worst global outcome. So exhortation fails and replacement fails. What works is changing what people can see when they decide.", "eg": "Putting server cost per team into a weekly email beats ten meetings about reducing server cost."}], "q": ["A system's behaviour cannot be read off its parts.", "People find the leverage point, then push it the wrong way.", "We cannot control a system. We can learn to dance with it."], "apply": "Pick one problem you have solved repeatedly and that keeps coming back. Instead of asking whose fault it is, ask three things: what is accumulating here and how long is the delay, which loop is currently in charge, and what feedback is missing that would let the person deciding see the consequence immediately. Most chronic problems do not need more discipline. They need a meter moved into the hallway.", "l": ["The Innovator's Dilemma", "Thinking, Fast and Slow", "Charlie Munger", "Norbert Wiener", "Ray Dalio"], "contrast": [{"n": "The Innovator's Dilemma", "why": "Two accounts of good people producing bad outcomes: Christensen gives one mechanism in detail, Meadows gives the whole catalogue. A case study against a pathology"}, {"n": "Thinking, Fast and Slow", "why": "Kahneman repairs the individual head, Meadows repairs the surrounding structure. The same bad decision, charged to two different accounts"}]}, {"c": "How the world works", "n": "The Wealth of Nations", "e": "1776 · Adam Smith", "w": "The invisible hand", "y": 1776, "d": "Adam Smith was professor of moral philosophy at Glasgow, not an economist, because the subject did not yet exist. The book appeared in March 1776, the same year as the Declaration of Independence, under the title An Inquiry into the Nature and Causes of the Wealth of Nations. He wrote two books in his life: The Theory of Moral Sentiments in 1759, about fellow-feeling, and this one seventeen years later, about self-interest. Reading only the second produces a Smith who never existed.", "story": "English readers know one phrase from this book, and it appears in it exactly once, deep in Book IV, in an argument about where merchants choose to put their capital. Smith observes that a trader prefers to invest at home rather than abroad because he can keep an eye on it, and so, intending only his own security and his own gain, is led by an invisible hand to promote an end which was no part of his intention. It is a narrow claim about home bias, written by a man who used the surrounding chapters to attack monopolists.", "f": [{"n": "Where the phrase actually sits", "d": "Three times in his whole output: once in the moral philosophy, once here, once in an essay on astronomy. It was never his headline. Later readers promoted a passing image into a doctrine and then argued about the doctrine rather than the book.", "eg": "Anyone quoting it as proof that markets are self-correcting is citing a sentence about why merchants prefer domestic investment."}, {"n": "Division of labour is the real thesis", "d": "The argument that opens the book is that wealth comes from how work is arranged rather than from how hard anybody works. He separates the gain into dexterity, time saved not switching tasks, and machinery invented by specialists who repeat one motion. The pin factory is his proof.", "eg": "One person doing product, sales and support looks like two salaries saved. In practice all three stay amateur and the switching eats the day."}, {"n": "He distrusted businessmen", "d": "The book is not a defence of merchants. Smith warns that people of the same trade seldom meet, even for merriment, without the conversation ending in a conspiracy against the public or a contrivance to raise prices. Modern antitrust starts in that sentence.", "eg": "He also held that consumption is the sole end of production, and that producer interests deserve attention only where they serve consumers."}, {"n": "Natural price and market price", "d": "Smith separates the natural price, which just covers rent, wages and profit, from the market price set by supply and demand today. Market price oscillates around natural price: excess profit draws capital in until it is competed away. It is mean reversion, two centuries before the textbooks.", "eg": "Any business earning unusual profit is broadcasting an invitation. A moat is simply whatever stops the market price coming back down."}, {"n": "Moral Sentiments is the foundation, not a contradiction", "d": "He wrote about sympathy first and self-interest second. The earlier book argues that the wish to be thought well of hardens into conscience, and conscience is what the market later stands on. Read apart, the two books look inconsistent; read together, they are one argument in order.", "eg": "Law and morals come first, markets second. Smith never claimed the second works without the first."}], "q": ["It is not from the benevolence of the butcher, the brewer, or the baker.", "The invisible hand appears once in the book, and it is about home bias.", "The division of labour is limited by the extent of the market."], "apply": "Measure a week of your own against the pin factory. How many things are you making end to end by yourself? Take the most important one, cut it into its actual operations, and see which of them can be handed off, automated, or dropped. Then check the other direction: is the market you can reach large enough to keep your one deep skill fed? When a skill pays badly it is often the market that is too small, not the skill.", "l": ["Guan Zhong", "Shang Yang", "Thinking in Systems", "Li Ka-shing", "Naval Ravikant"], "contrast": [{"n": "Guan Zhong", "why": "Two origins for the idea of national wealth: Guan Zhong steers prices and money from the centre, Smith lets price discover itself. The argument has not moved in twenty-five centuries"}, {"n": "Shang Yang", "why": "Both are designing a route to a strong state. Shang Yang binds people to the land and suppresses trade, Smith credits division and exchange. Both routes work, at wildly different prices"}]}, {"c": "How the world works", "n": "Why Nations Fail", "e": "2012 · Acemoglu and Robinson", "w": "Institutions", "y": 2012, "d": "Daron Acemoglu and James Robinson, published in 2012. The argument is blunt: whether a country is rich or poor turns on neither geography nor climate nor culture nor the intelligence of its leaders, but on whether its institutions are inclusive or extractive. In 2024 the two authors shared the Nobel prize in economics with Simon Johnson for this line of research. The lasting value is less the conclusion than the blade, which cuts downwards without losing its edge: country, industry, company, team.", "story": "In 1589 William Lee brought a machine to London. He had built a stocking frame that knitted far faster than hands, and he wanted a patent from Elizabeth I. She refused. His invention, she told him, would ruin her poor subjects by taking away their employment and turning them into beggars. Lee took the machine to France, was refused again, and died in Paris with nothing. The queen understood the device perfectly. That was the problem.", "f": [{"n": "Inclusive against extractive", "d": "Inclusive institutions need three things: property that is secure, law that applies to everyone alike, and public provision that lets most people compete. Extractive ones let a few use power to take what many produced. The test underneath is single: can the person who created the value keep it?", "eg": "The company version is three questions. Do options really pay out, does promotion track results, and is the important information held by a handful of people?"}, {"n": "Creative destruction is the dividing line", "d": "Extractive arrangements resist innovation by construction, because innovation reshuffles position and the current holders lose. Rulers who blocked railways and knitting machines were not confused about the benefits. They were reading the political consequences correctly.", "eg": "Progress is rarely blocked by people who do not understand it. It is blocked by the people who understand it soonest."}, {"n": "Extraction can grow fast, then hits a wall", "d": "Moving resources out of low-productivity agriculture into industry can raise output for decades without any inclusive institution at all. What that model cannot do is make the next transition, because the next one runs on innovation and innovation needs exactly what extraction will not permit. The ceiling is calculable in advance.", "eg": "Growth from a management dividend or a distribution dividend behaves the same way. It lasts a long time and ends needing an entirely different capability."}, {"n": "Critical junctures and institutional drift", "d": "This is not determinism. Small institutional differences accumulate quietly, and then a shock arrives that amplifies them into completely different paths. Plague, Atlantic trade, industrial technology: each one widened gaps that had been almost invisible beforehand.", "eg": "It is their answer to why England and not Spain. Small difference plus large shock equals permanent divergence."}, {"n": "Politics comes before economics", "d": "Good economic policy is not hard to design. The hard part is getting people with power to adopt policies that reduce their power. So the real subject of the book is how political power is distributed, and any reform plan that skips that layer is discussing technique.", "eg": "Poverty usually persists not because nobody knows what would work, but because doing it would cost somebody their position."}], "q": ["Nations fail because extractive institutions kill the incentive to invest and innovate.", "Creative destruction redistributes political power, which is why it is resisted.", "The poor stay poor because the powerful will not, not because nobody knows how."], "apply": "Point the framework at whatever organisation you are in and ask three questions. Does the person who creates value get to keep a share of it? Do the rules apply to everyone, or can some people be excused? When a new way of doing things appears, is it encouraged or quietly suppressed by whoever benefits from the old way? Two noes make it extractive. It may still be growing fast, but that growth is a reallocation dividend and its ceiling can be worked out before you join.", "l": ["The Wealth of Nations", "The Old Regime and the Revolution", "Shang Yang", "Sapiens", "Technological Revolutions"], "contrast": [{"n": "The Wealth of Nations", "why": "Smith says the market runs itself; this book says somebody has to build the institutions that hold the market up. The missing half, supplied two centuries later"}, {"n": "The Old Regime and the Revolution", "why": "Tocqueville recorded one extractive order collapsing in detail; this book supplies the model of why it had to"}, {"n": "Sapiens", "why": "Both explain how humanity arrived here: Harari credits shared fictions and mass cooperation, this book credits the incentives institutions create"}]}, {"c": "Learning and growth", "n": "Bruce Lee", "e": "Contemporary · 1940–1973", "w": "Formless", "y": 1940, "d": "The film star is the outermost label. He was a martial artist, a writer, a film-maker and a philosophy student, and in thirty-three years he left a worked-out position on getting free of your own training. Jeet Kune Do is not a style; it is an argument against style itself — absorb what is useful, discard what is not, add what is uniquely your own.", "story": "At the Long Beach International Karate Championships in 1964 he gave a demonstration: the one-inch punch, which sent a much larger man backwards off a chair, and press-ups on two fingers. It was a demonstration, not a fight, and it was watched by people who could open doors. One of them passed word to a Hollywood producer, which produced a screen test, which produced Kato. A twenty-three-year-old teaching in a small Oakland school got the rest of his life out of a few minutes spent showing what a very short distance can carry.", "f": [{"n": "Absorb, discard, add", "d": "His method compresses to three moves: take what is useful from every source, cut what does not work for you, and put in what is yours alone. It applies to any learning. The point is never to reproduce one master's system intact, but to draw from several and let practice settle the remainder into something of your own.", "eg": "Finishing the course is not the goal and not finishing is not a debt. The question is which parts survived contact with your actual work."}, {"n": "A style that refuses to become a style", "d": "He built a martial art whose founding rule is not to be bound by any martial art, his own included. That is freedom one level up: not only thinking about the problem, but thinking about the way you go at problems. Most systems cannot do this, because a system that can refuse itself is hard to sell.", "eg": "Any framework you cannot imagine abandoning has stopped being a tool and become a membership."}, {"n": "Knowing yourself comes before the technique", "d": "His notes keep returning to it: understand yourself before you learn anything external. What is your body actually built for, where does your attention fail, what do you do when frightened? Without that, absorb what is useful has no criterion, because useful is useful to somebody in particular.", "eg": "Two people copy the same routine. It works for one of them, and the difference was decided before either of them started."}, {"n": "Thinking is a delay", "d": "He read philosophy seriously and was severe about substituting it for action. Knowledge exists to make the action better, not the conversation about the action better. Anything he could not test against a person trying to hit him he treated as unfinished.", "eg": "The strategy that has been in review for six weeks has already lost to a worse strategy that shipped in the second week."}], "q": ["Absorb what is useful, discard what is not, add what is uniquely your own.", "Knowing yourself is the most important knowledge of all.", "Do not think too much. Feel, and hit."], "apply": "Next time you take up a new field, run his three steps: read widely without hurrying to find the right answer; actively delete the parts that do nothing for you, without guilt about not finishing; then add your own judgement in practice until the method is yours. The system belongs to whoever built it. The method has to be yours.", "l": ["Wang Yangming", "Tao Te Ching", "Socrates", "Charlie Munger"], "contrast": [{"n": "Anders Ericsson", "why": "One counts the repetitions, the other refuses the fixed form — and both are describing the same ten thousand"}]}, {"c": "Learning and growth", "n": "Albert Einstein", "e": "Germany · 1879–1955", "w": "Imagination", "y": 1879, "d": "The physicist, and the father of relativity — but the legacy that travels furthest is not a formula, it is a way of working. What would I see if I rode alongside a beam of light? He first asked it at sixteen and carried it for ten years. He showed that an experiment impossible in any laboratory can be run in a head, and moved imagination out of the arts and into the centre of science.", "story": "On 6 November 1919 the Royal Society heard the results of the eclipse expeditions: starlight had bent as general relativity predicted. The next morning he was famous everywhere, which is not a thing that had happened to a physicist before. He was dry about it. If the theory turns out to be right, he wrote, Germany will claim me as a German and France will call me a citizen of the world; if it turns out wrong, France will call me a German and Germany will call me a Jew. The theory had not changed between the two sentences. Only the audience had.", "f": [{"n": "The thought experiment", "d": "His central instrument was not mathematics but the Gedankenexperiment: build an idealised situation in your head and follow its logic until it breaks. Special relativity came from riding the beam of light; general relativity from a man in a falling lift, who cannot feel his own weight — an idea he later called the happiest of his life.", "eg": "Before building the thing, describe the impossible version of it and see which assumption has to give. That assumption is the actual project."}, {"n": "Thirty years of being wrong, in public", "d": "He spent his last three decades trying to unify relativity with quantum mechanics and did not get there. He would not accept the probabilistic reading and said so — God does not play dice. Experiment has sided against him ever since. But the objection forced the field to say precisely what it meant, and a first-rate error did more than most careful agreement.", "eg": "The colleague who will not let a claim past without making it exact is doing work even when their own position is the one that loses."}, {"n": "Curiosity is the whole engine", "d": "No special talent, only passionately curious — he said it too often for it to be modesty. He held the question about the beam of light for ten years because he wanted to know, not because anyone asked. Learning driven by curiosity and learning driven by obligation reach different depths, because only one of them keeps going past the requirement.", "eg": "You can tell which kind you are on by what happens the week after the deadline."}, {"n": "Responsibility does not end at the discovery", "d": "A Jew and a pacifist, driven out after 1933, he signed the 1939 letter urging the United States to take fission seriously — and after Hiroshima spent the rest of his life on disarmament, calling that signature his one great mistake. Pushing the boundary and carrying what comes over it are the same job.", "eg": "Whoever builds the capability is not automatically the person who decides how it is used — but they are never simply a bystander to it either."}], "q": ["Imagination is more important than knowledge.", "I have no special talent. I am only passionately curious.", "God does not play dice."], "apply": "Next time something is declared impossible, run his order of operations: first ask whether physics forbids it; then build the idealised version in your head and follow it through. A great many impossible things turn out to be current tools cannot, which is a different sentence with a different expiry date.", "l": ["Elon Musk", "Bruce Lee", "Charlie Munger", "Socrates", "Peter Thiel"], "contrast": [{"n": "Richard Feynman", "why": "Both refuse to fool themselves; one starts from a picture in the head, the other from what the instrument says"}]}, {"c": "How the world works", "n": "Ivan Illich", "e": "Austria–Mexico · 1926–2002", "w": "A ceiling", "y": 1926, "d": "A priest who spent the 1970s taking apart four systems everybody treated as progress: schooling, transport, medicine, and the idea of a tool itself. One claim runs through all four — every tool crosses two watersheds, and past the second it starts producing what it was built to remove. Medicine makes patients, school makes a feeling of ignorance, transport makes distance. He is not against technology. He wants an upper bound on it.", "story": "The man who wrote that medical treatment produces illness grew a tumour on his face in later life. The proposed treatment was surgery and radiation, with respectable odds, at the risk of his speech and his hearing — and speaking, and listening to people speak, was the entire form of his work. He declined. He lived nearly two decades with the growth, teaching, in pain, managing the worst days with opium he prepared himself, and died in Bremen in 2002. He never wrote it up as a manifesto; asked, he said it was his own arithmetic. He never denied the treatment worked. He questioned whether the word worked had counted everything it costs.", "f": [{"n": "The two watersheds", "d": "Before the first, a tool solves a real problem. Between the two it is steadily useful. Past the second it begins producing the opposite. So does it work is unanswerable — it does. The question is when what you pay to keep it overtook what it gives you.", "eg": "The group chat saved ten emails in week one. At two hundred people it takes an hour a day and anything real still arrives privately."}, {"n": "The signal is the reverse, not the slowdown", "d": "Efficiency usually keeps climbing after the crossing, which is exactly why it is hard to notice. The reliable signal is production of the opposite: care that generates illness, communication tools that generate the fear of being unreachable.", "eg": "The reporting got beautiful and people started splitting tasks to make the board look right. What the tool wants is replacing the work."}, {"n": "A convivial tool lets you leave", "d": "His test for whether a tool is yours is whether you can decline it. The higher the exit cost, the less it is your tool and the more you are its. That is a pr // 反向关联索引。l 与 contrast 都是逐条手写的单向边，于是被指向的一方看不到来源：
// 全库有 291 条 l、119 条 contrast 只存在于一个方向，另有 9 条（武则天、富兰克林、胡雪岩、
// 安迪·格鲁夫、六祖慧能，以及新收录的几条）没有任何条目指向它们，只能From “最新」或搜索进入。
// 这里在渲染期补齐反向边：人工挑选的正向关联仍排在前面，自动补全的反向关联接在后面，去重。
// 好处是数据不必写两遍，此后新增条目自动双向可达。
const RL={},RC={};
D.forEach(d=>{
  (d.l||[]).forEach(x=>{(RL[x]=RL[x]||[]).push(d.n)});
  (d.contrast||[]).forEach(c=>{(RC[c.n]=RC[c.n]||[]).push({n:d.n,why:c.why})});
});
function relOf(d){
  const fwd=d.l||[],seen=new Set(fwd),add=[];
  (RL[d.n]||[]).forEach(x=>{if(x!==d.n&&!seen.has(x)){seen.add(x);add.push(x);}});
  return fwd.concat(add);
}
function contrastOf(d){
  const fwd=d.contrast||[],seen=new Set(fwd.map(c=>c.n)),add=[];
  (RC[d.n]||[]).forEach(c=>{if(c.n!==d.n&&!seen.has(c.n)){seen.add(c.n);add.push(c);}});
  return fwd.concat(add);
}

function dqInterleave(list){
  const g=new Map();

  for(let i=0;i<N;i++){
    const a=out[i],b=out[(i+1)%N];
